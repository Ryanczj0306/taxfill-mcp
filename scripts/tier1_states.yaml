      form: "PA-40 with its Amended Return oval filled, plus Schedule PA-40 X"
      quote: "If you realize you made a mistake on your 2025 PA tax return, you must correct your return by filing a separate 2025 PA-40 return, marking the Amended Return oval on the return and completing and submitting Schedule PA-40 X for the tax year being amended with your amended return."
      url: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2025/2025_pa-40in.pdf
      page: "2025 PA-40 instructions, page 41"
