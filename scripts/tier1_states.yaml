# Tier-1 state triage table (Phase K JK9, 2026-10-24).
#
# The income-tax jurisdictions (41 states + DC) ranked by the number of individual income tax returns in the newest
# IRS SOI state table, cut to the 12 largest. JS7a builds the TY2026 state packs for the tier-1 states only (every
# other state goes through the no-pack fallback, JS7b), and JK8's state-blank watch reads this list. It replaces JS7's
# "re-triage every state".
#
# Why here and not under knowledge/: this is maintainer planning data read by maintainer scripts
# (`scaffold_state_year.py --tier1`, JK8's watch), not tax knowledge served at run time; knowledge/ is staged into the
# wheel and gated as runtime data. It sits beside state_discovery_rows.json, the other year-tranche input.
# packages/core/tests/test_tier1_states.py keeps it honest: it loads, the ranking is sorted and complete, the cut is
# the stated rule, the forms agree with each state's 2025 knowledge, and every amended-indicator claim matches the
# 2025 pack's line keys.
#
# Refresh: when SOI posts a newer Historic Table 2 year, download its state CSV twice, re-rank, update `volume`,
# `ranking` and the cut, and re-check each tier-1 row. JS7a updates a row's TY2026 status as its pack ships.
schema: 1
as_of: "2026-10-24"
target_year: 2026

volume:
  title: "SOI Tax Stats - Historic Table 2: Individual income and tax data, by state and size of adjusted gross income, Tax year 2023 (.csv file)"
  index_url: https://www.irs.gov/statistics/soi-tax-stats-historic-table-2
  url: https://www.irs.gov/pub/irs-soi/23in55cmcsv.csv
  sha256: d1f7c8901fcefb2c46f5dd14f22715b7c8513794ce7b9ea6a6a947f1c548668f   # two fetches 2026-10-24, identical
  table_year: 2023            # the newest year on the index page on 2026-10-24
  column: N1                  # "Number of returns"
  row_filter: "AGI_STUB = 0 (no AGI stub: every AGI class)"
  documentation:
    url: https://www.irs.gov/pub/irs-soi/23incmdocguide.doc
    sha256: 942790690b0027b465019ec5d3f5d8f23124882ab85535f06129f74c12021206   # two fetches 2026-10-24, identical
    variables:                # the guide's file-characteristics table, verbatim
      STATE: "The state associated with the return"
      AGI_STUB: "Size of adjusted gross income; 0 = No AGI Stub"
      N1: "Number of returns [3]"
    quotes:
      - "[3] \"Number,\" here, and elsewhere represents number of returns, unless otherwise specified. The number of returns have been rounded to the nearest 10."
      - "The Statistics of Income (SOI) Division’s state data is tabulated using individual income tax returns (Forms 1040) filed with the Internal Revenue Service (IRS) during the 12-month period, January 1, 2024 to December 31, 2024."
  caveat: >-
    A federal return is counted under "the state associated with the return" (the guide's words; its section C warns
    that the address on a return may differ from the taxpayer's actual residence), so the count approximates
    resident volume. It does not count nonresident state filers, and federal Form 1040-NR filers are not in a
    Form 1040 tabulation at all.

# Rows of the SOI file that are not ranked: the nine states with no broad personal income tax
# (knowledge/states/no_income_tax.yaml) and the US total, other areas (OA) and Puerto Rico.
excluded_no_income_tax: [AK, FL, NH, NV, SD, TN, TX, WA, WY]
excluded_other_rows: [US, OA, PR]

cut:
  size: 12
  rule: "rank <= 12: the twelve income-tax jurisdictions with the most returns (N1), no other weighting"
  why: >-
    The roadmap asked for about 12. The twelve largest cover 62.1% of the returns filed from income-tax jurisdictions
    (76,838,680 of 123,721,710), and they are the eleven states the plans proposed plus AZ (rank 12, 3,391,030). Below
    the cut the counts run close together (IN 3,241,920, MD 3,100,200, CO 3,086,830), so any cut between 11 and 16
    is a judgement call; twelve is the size asked for.
  income_tax_returns_total: 123721710
  tier1_returns_total: 76838680

# Every income-tax jurisdiction, by N1 (AGI_STUB 0), descending.
ranking:
