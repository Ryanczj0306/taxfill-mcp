  - state: MI
    resident_form: "MI-1040"
    nrpy_forms: ["MI-1040", "Schedule NR"]
    nrpy_lineage: []
    amend:
      route: same_form_indicator
      form: "MI-1040 with its Amended Return box checked, plus Schedule AMD"
      quote: "If you need to make a correction to your return, file a new complete MI-1040. Check the Amended Return box at the top of page 1 of the form, and file the Schedule AMD and all applicable schedules and supporting documentation to amend your return."
      url: https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2025/MI-1040-Book.pdf
      page: "2025 MI-1040 instruction book, page 8"
      sha256: 35b38086176f867d1365e20f4f31a40b9b85ef68befb3e44d6021eb4502f66cd
    packs:
