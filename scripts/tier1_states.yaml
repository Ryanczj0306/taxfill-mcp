# One row per tier-1 state, in rank order.
#   resident_form / nrpy_forms: form ids, each found verbatim in knowledge/states/<st>/2025.yaml forms.resident /
#     forms.part_year_or_nonresident (the test checks).
#   nrpy_lineage: the newest shipped pack of each NR/PY-only form (any year): the lineage JS7a ports a tier-1 NR/PY
#     pack from; [] = no NR/PY pack exists (the NR/PY filer uses the resident pack's form, or no pack was ever built).
#   amend: how the 2025 resident return is amended, from the state's 2025 instructions (quote, url, printed page).
#     route same_form_indicator = file a new copy of the same return with its amended box or oval filled (plus the
#     named explanation schedule); separate_x_form = a different return (IT-201-X, IL-1040-X, ...).
#   packs: each 2025 return pack of the state and the amended indicator it maps: {line, field} (the line key and the
#     blank's widget), or null where the blank has no amended indicator. `not_the_indicator` names a mapped line that
#     mentions "amend" but is not the return's indicator. The test reads the pack and fails on any drift.
#   schedules: any other pack of the state (a schedule filed with the return). Every form the state ships a pack for
#     is named in packs, nrpy_lineage or schedules, so a new pack shows up here (the test checks).
tier1:
  - state: CA
    resident_form: "540"
    nrpy_forms: ["540NR"]
    nrpy_lineage: [ca/2025/form540nr, ca/2025/sched_ca_540nr]
    amend:
      route: same_form_indicator
      form: "Form 540 with its AMENDED box checked, plus Schedule X"
      quote: "If you need to amend your California resident income tax return, complete an amended Form 540 and check the box at the top of Form 540 indicating AMENDED return. Attach Schedule X, California Explanation of Amended Return Changes, to the amended Form 540."
      url: https://www.ftb.ca.gov/forms/2025/2025-540-booklet.pdf
      page: "Personal Income Tax Booklet 2025, page 11"
      sha256: b48ee24bd2f9b9e74fe9a5bbc548d15bae0bd1ce53306bef1ff33fc76f8078c1
    nrpy_amend:
      route: same_form_indicator
      form: "Form 540NR with its AMENDED box checked, plus Schedule X"
      quote: "If you need to amend your Form 540NR, complete an amended Form 540NR and check the box at the top of Form 540NR indicating AMENDED return. Attach Schedule X, California Explanation of Amended Return Changes, to the amended Form 540NR."
      url: https://www.ftb.ca.gov/forms/2025/2025-540nr-booklet.pdf
      page: "540NR Tax Booklet 2025, page 11"
      sha256: 47104d74d7bb4783a8c507243fa4c91ffb31104c51c75bd24ad4d77b853e0e60
    packs:
      - {pack: ca/2025/form540, amended_indicator: {line: amended_return, field: "540_form_1001 CB"}}
      - {pack: ca/2025/form540nr, amended_indicator: {line: amended, field: "540NR_form_1001 CB"}}
    schedules: [ca/2025/sched_ca_540]   # a resident schedule pack: no amended indicator of its own

  - state: NY
    resident_form: "IT-201"
    nrpy_forms: ["IT-203"]
    nrpy_lineage: [ny/2025/it203]
    amend:
      route: separate_x_form
      form: "Form IT-201-X"
      quote: "Use Form IT-201-X if your original return was Form IT-201."
      url: https://www.tax.ny.gov/pdf/2025/inc/it201i_2025.pdf
      page: "IT-201-I (2025), page 32 of 41"
      sha256: 29489d6eed7529bc1388e57a5bf0814e6e6d94d02288c5c83a377d21e3773f72
    nrpy_amend:
      route: separate_x_form
      form: "Form IT-203-X"
      quote: "Use Form IT-203-X if your original return was Form IT-203."
      url: https://www.tax.ny.gov/pdf/2025/inc/it203i_2025.pdf
      page: "IT-203-I (2025), page 39 of 47"
      sha256: 1620acdbcc5260521ff259494d5bce314f0d0a9783c3ad797b676f02485a6384
    packs:
      - {pack: ny/2025/it201, amended_indicator: null}
      - {pack: ny/2025/it203, amended_indicator: null}

  - state: PA
    resident_form: "PA-40"
    nrpy_forms: ["PA-40"]          # one return for every residency status (residency oval R / N / P)
    nrpy_lineage: []
    amend:
