      sha256: fe7977419b70d0c3dcc392c328adc5f58f3b99937e0d2f79aecf6ac368872c31
    packs:
      - {pack: nj/2025/nj1040, amended_indicator: null}

  - state: VA
    resident_form: "Form 760"
    nrpy_forms: ["Form 763", "Form 760PY"]
    nrpy_lineage: []
    amend:
      route: same_form_indicator
