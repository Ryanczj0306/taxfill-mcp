# PENDING — not applied. The ranking above is volume only (the user's criterion, 2026-10-09).
recommendation:
  status: pending            # the user accepts or rejects; until then nothing below changes the cut
  proposal: >-
    Weight the ranking toward the states where nonresident-alien students cluster: taxfill's distinctive users file a
    federal 1040-NR, and the SOI count above (Form 1040 returns by filer address) cannot see them. If accepted, the
    second signal would be a cited .gov count of F-1/J-1 students by state (ICE's SEVIS by the Numbers, state table),
    downloaded twice like the volume table; a state above the cut on that signal but below it on volume would join
    tier 1 (the cut grows, no volume state is dropped).
  not_done: >-
    No student-count figures are recorded here: none was fetched and verified for JK9, and the brief keeps the
    ranking volume-only without the user's yes.
