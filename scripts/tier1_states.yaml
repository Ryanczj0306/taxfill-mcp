      url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
      page: "2025 IT-511 Instructions Booklet, page 10"
      sha256: ae43633e68ca423609607b0f93b1ebcd6056bce06ffb91829c448292e48a693f
