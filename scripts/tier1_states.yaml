  - state: OH
    resident_form: "IT 1040"
    nrpy_forms: ["IT 1040", "IT NRC"]
    nrpy_lineage: []
    amend:
      route: same_form_indicator
      form: "IT 1040 with its amended box checked, plus the IT RE"
      quote: "To amend the Ohio IT 1040 or SD 100, you should file a new return, reflecting all proposed changes, and indicate that it is amended by checking the box at the top of page 1. You must include the IT RE with your amended IT 1040"
