# Quote-verbatim checker: the MISMATCHes closed as the checker's false positives (Phase K JK31, 2026-10-25).
#
# scripts/check_quotes.py reads this list (--closed) and reports each entry's span as CLOSED, not MISMATCH. Every
# entry was re-read at its cited source and found printed there exactly as the pack quotes it; what differs is the
# PDF's text layer (a sentence split by a page break and the next page's running head, columns read across, ...).
# Self-clearing: an entry that matches no MISMATCH (the quote was edited, or the source now reads verbatim) is
# reported as stale and fails --strict; test_check_quotes.py fails offline on an entry whose quote is gone.
#
# Each entry: pack, where (the span's path in the pack), span (exactly as quoted), reason (why the text layer
# differs), read (how it was read: the rendered page and the first 16 hex of the PDF's sha256, downloaded twice),
# closest_sha256 (the first 16 hex of the source the checker's closest passage came from, or 'none'): a reissued
# source re-opens the span as a MISMATCH and the entry is reported stale (Phase K JK31 review, 2026-10-25).
- pack: knowledge/states/ga/2023.yaml
  where: amended_return.timing[1]
  span: Whenever a Federal audit or other Federal adjustment results in a change in net income for any year, you are required
    to furnish under separate cover, within 180 days, a schedule reflecting all changes. Please include the schedule when
    you file form 500X. Additionally, if the changes result in a refund, the refund must be claimed within one year of the
    date the changes are submitted.
  reason: 'the sentence runs across a page break: the text layer puts page 10''s running head ''FILING REQUIREMENTS'' between
    ''within one year of the'' and ''date the changes are submitted'''
  read: 2023 IT-511 booklet pp. 9-10, sha256 3ce70e0378602d0f... (downloaded twice); the text layer and the closest passage
    read 2026-10-25
  closest_sha256: 3ce70e0378602d0f
