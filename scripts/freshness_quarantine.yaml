# Freshness quarantine (Phase J JT0c) — the KNOWN reds of the weekly freshness job
# (.github/workflows/freshness.yml), each behind an expiry date and the tranche that fixes it.
#
# The job was red 6 of 6 weeks from 2026-08-17 (last: run 35621846216, 2026-09-21) on three items
# alone, so a NEW red would have been lost in the old one. All three retired 2026-09-28: the DC booklet
# row by Phase J JS1a (DC 2025 re-verified against the re-issued booklet), the two MA Form 1 fetch rows
# by JS1b (the pack's digest-verified Wayback mirror). JS1b's newest-capture probe then found one more
# (MA Form 1 2023's 2026-05-22 re-issue), retired 2026-10-02 by Phase J JS5, which re-mapped the pack
# onto that re-issue and re-pinned it.
#
# The list now holds the ten MA Form 1 (2023 and 2025) network tests, added 2026-10-15 by JK2 (the 2026-10-09 re-plan)
# after run 38294478202 (2026-10-12): mass.gov answers HTTP 403 to every non-browser fetcher, and from a
# GitHub-hosted runner the pack's digest-verified Wayback mirror answers HTTP 429 or refuses the
# connection, so the runner has no path to the blank. From a developer machine the mirror works and the
# blank is cached locally, digest-verified; the tests pass there. JK2 also gave the runner a blank cache
# (actions/cache in freshness.yml's network-tests job) so a run that gets through once serves the next.
# JK27 (2026-10-16) added the same two MA Form 1 cases of one more every-pack sweep, the /FT /Sig binding
# check in test_signature_widget_mapping.py, for the same reason and the same JK2 fix: twelve rows.
# JK28 (2026-10-16) added the six MA Form 1 rows of test_pack_maxlen.py's MEASURED_WITHOUT_MAXLEN network check
# (the two signature dates and the line 43c rate blank, 2023 and 2025) and the two of the ink-signature tooltip
# sweep in test_signature_line_mapping.py, for the same reason: twenty rows.
# DELETE these twenty rows once that cache has served the MA tests green on two consecutive weekly runs;
# packages/core/tests/test_freshness_quarantine.py pins the twenty node ids, so the deletion updates it too.
# JK30 (2026-10-24) added eighteen drift rows, one per view.xhtml URL in the source registries: uscode.house.gov runs in a temporary format and its view.xhtml
# section pages, cited by the source registries, answer HTTP 404 (500 the day before). They expire 2026-12-15:
# delete them when the pages resolve again, or re-point the citations to govinfo.gov (JK30).
# Any other red opens a `freshness red` issue.
#
# Rules (scripts/freshness_quarantine.py; tests in packages/core/tests/test_freshness_quarantine.py):
#   * kind network_test: `id` is a pytest node id. The quarantine masks only a failure to FETCH the
#     blank (taxfill_core.fetch.FetchError); any other failure of the test still fails the job.
#   * kind drift: `url` is a URL scripts/check_drift.py reports as drift; that one item is reported
#     as quarantined instead of failing the job.
#   * `expires` is at most 200 days after `added`. An expired entry FAILS the drift job; renew it
#     only with a reason, or fix the source (the `fixed_by` tranche) and delete the row.
