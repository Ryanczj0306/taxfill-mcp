# Scheduled freshness monitoring — dev plan §7.
#
# The 99+ pinned blank-PDF digests, the source-registry URLs and the shipped
# mailing addresses are snapshots of MOVING official sources. These jobs
# re-fetch them and fail loudly when a form is revised or a page moves.
#
# They live in their OWN workflow (not ci.yml) deliberately:
#   * ci.yml's badge is the README's public health signal — it must track the
#     CODE. A .gov outage or a mid-season form revision should page the
#     maintainer via THIS workflow's failure email, not repaint the project
#     badge red;
#   * ci.yml once carried these jobs behind `workflow_dispatch`-only guards,
#     which meant that in normal operation ZERO of the golden round-trips and
#     zero drift checks ever ran — the digests were rotting silently while the
#     ROADMAP claimed a scheduled cron existed. This file makes the claim true
#     again.
#
# Known reds sit behind scripts/freshness_quarantine.yaml (Phase J JT0c): each row has an expiry
# and the tranche that fixes it, so the job is green unless something NEW breaks (or a row
# expires), and the `report` job opens or updates a `freshness red` issue on any red.
#
# Monday 09:13 UTC: weekly is enough for drift (forms revise on a monthly-ish
# cadence outside January), and the odd minute avoids the top-of-hour
# scheduled-job stampede that gets cron runs delayed or dropped.

name: freshness

on:
  schedule:
    - cron: "13 9 * * 1"
  workflow_dispatch:

jobs:
  drift:
    # Re-fetch every official source URL and form blank; fail on a moved page
    # or a revised form (scripts/check_drift.py — digest + reachability).
    # ubuntu-24.04 on purpose, never the floating image: see the `test` job in ci.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Check source/form drift
        run: uv run python scripts/check_drift.py

  network-tests:
    # The network-marked golden round-trips: live .gov blank downloads through
    # fetch -> fill -> verify. Kept out of the push-blocking `test` job so PR
    # CI stays fast and non-flaky; run here weekly instead of never.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Restore the blank-PDF cache
        # .cache/blanks is where fetch_blank keeps every downloaded blank. A host that refuses the
        # GitHub-hosted runner (mass.gov answers HTTP 403, and the pack's Wayback mirror 429 or
        # "connection refused" — re-plan JK2) is served from a run that got through once. The cache
        # is a performance / robustness aid and NEVER a trust boundary: fetch_blank re-checks every
        # cached file against the pack's pdf_sha256 on every read, so a stale or foreign file is
        # simply re-fetched. Explicit restore + save (not the plain actions/cache post step, which
        # skips on a failed job — and this job fails on any red). The key carries the run id so a
        # later run that fetched MORE can save it (a cache is immutable under its key); restore picks
        # the newest cache for the same pack set first, then any older one.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/blanks
          key: blanks-v1-${{ hashFiles('formpacks/**/pack.yaml') }}-${{ github.run_id }}
          restore-keys: |
            blanks-v1-${{ hashFiles('formpacks/**/pack.yaml') }}-
            blanks-v1-
      - name: Run network golden round-trips
        run: uv run pytest -m network
      - name: Run the ReadOnly sweep on the cache the round-trips just warmed
        # test_verify_readonly_sweep.py carries no network mark and SKIPS every per-pack case on an empty
        # .cache/blanks, so the offline CI job never exercises it; after the step above every pinned blank
        # is cached (Phase J JEa).
        run: uv run pytest packages/core/tests/test_verify_readonly_sweep.py
      - name: Save the blank-PDF cache
        # `always()`: the blanks that DID download are worth keeping even when a test went red.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/blanks
          key: blanks-v1-${{ hashFiles('formpacks/**/pack.yaml') }}-${{ github.run_id }}

  quotes:
    # Phase K JK23: hold every quoted span in the knowledge packs to its source (scripts/check_quotes.py). REPORT mode:
    # the script exits 0, and the step is continue-on-error too, so a quote mismatch or a .gov outage never reds the
    # job or opens a freshness-red issue. The summary goes to the run page; the JSON report is an artifact. Mismatches go
    # to a JS2c-style fix tranche (.github/CONTRIBUTING.md, "A quote is checked against its source"); JK26 adds --strict.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Restore the blank-PDF cache
        # Read-only: a blank the network-tests job cached (a mass.gov PDF that refuses the runner) is read from there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/blanks
          key: blanks-v1-${{ hashFiles('formpacks/**/pack.yaml') }}-${{ github.run_id }}
          restore-keys: |
            blanks-v1-${{ hashFiles('formpacks/**/pack.yaml') }}-
            blanks-v1-
      - name: Check quotes (report mode)
        continue-on-error: true
        run: |
          uv run python scripts/check_quotes.py --json quote-report.json | tee quote-summary.txt
          { echo '```'; cat quote-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the quote report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quote-report
          path: |
            quote-report.json
            quote-summary.txt
          if-no-files-found: ignore

  report:
    # JT0c: any red (a NEW failure, or an expired quarantine row) opens a `freshness red` issue, or
    # comments on the open one, so a red is a tracked item and not only a failure email.
    needs: [drift, network-tests]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update the freshness-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "freshness red" --color B60205 --force \
            --description "The weekly freshness job failed outside its quarantine"
          num=$(gh issue list --label "freshness red" --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Still red: $RUN_URL"
          else
            gh issue create --label "freshness red" --title "freshness red: a new failure outside the quarantine" \
              --body "The freshness job failed: $RUN_URL. Known reds live in scripts/freshness_quarantine.yaml; this one is not there (or a row expired). Fix the source, or quarantine it with an expiry and the tranche that fixes it."
          fi
