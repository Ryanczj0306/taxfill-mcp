# Scheduled freshness monitoring — dev plan §7.
#
# The 99+ pinned blank-PDF digests, the source-registry URLs and the shipped
# mailing addresses are snapshots of MOVING official sources. These jobs
# re-fetch them and fail loudly when a form is revised or a page moves.
#
# They live in their OWN workflow (not ci.yml) deliberately:
#   * ci.yml's badge is the README's public health signal — it must track the
#     CODE. A .gov outage or a mid-season form revision should page the
#     maintainer via THIS workflow's failure email, not repaint the project
#     badge red;
#   * ci.yml once carried these jobs behind `workflow_dispatch`-only guards,
#     which meant that in normal operation ZERO of the golden round-trips and
#     zero drift checks ever ran — the digests were rotting silently while the
#     ROADMAP claimed a scheduled cron existed. This file makes the claim true
#     again.
#
# Known reds sit behind scripts/freshness_quarantine.yaml (Phase J JT0c): each row has an expiry
# and the tranche that fixes it, so the job is green unless something NEW breaks (or a row
# expires), and the `report` job opens or updates a `freshness red` issue on any red.
#
# Monday 09:13 UTC: weekly is enough for drift (forms revise on a monthly-ish
# cadence outside January), and the odd minute avoids the top-of-hour
# scheduled-job stampede that gets cron runs delayed or dropped.

name: freshness

on:
  schedule:
    - cron: "13 9 * * 1"
  workflow_dispatch:

jobs:
  drift:
    # Re-fetch every official source URL and form blank; fail on a moved page
    # or a revised form (scripts/check_drift.py — digest + reachability).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Check source/form drift
        run: uv run python scripts/check_drift.py

  network-tests:
    # The network-marked golden round-trips: live .gov blank downloads through
    # fetch -> fill -> verify. Kept out of the push-blocking `test` job so PR
    # CI stays fast and non-flaky; run here weekly instead of never.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Run network golden round-trips
        run: uv run pytest -m network

  report:
    # JT0c: any red (a NEW failure, or an expired quarantine row) opens a `freshness red` issue, or
    # comments on the open one, so a red is a tracked item and not only a failure email.
    needs: [drift, network-tests]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the freshness-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "freshness red" --color B60205 --force \
            --description "The weekly freshness job failed outside its quarantine"
          num=$(gh issue list --label "freshness red" --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Still red: $RUN_URL"
          else
            gh issue create --label "freshness red" --title "freshness red: a new failure outside the quarantine" \
              --body "The freshness job failed: $RUN_URL. Known reds live in scripts/freshness_quarantine.yaml; this one is not there (or a row expired). Fix the source, or quarantine it with an expiry and the tranche that fixes it."
          fi
