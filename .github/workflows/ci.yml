name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # freshness/drift + live-.gov round-trips run WEEKLY in
                       # freshness.yml (plus on demand from its Actions tab) —
                       # they monitor, don't gate, so they live outside this badge.

jobs:
  test:
    if: github.event_name != 'schedule'
    # ubuntu-24.04, never the floating `latest` image: the runner image is part of the test
    # environment (system libraries under the PDF stack, the tools on PATH the jobs shell out
    # to). GitHub rolls the floating image over to Ubuntu 26.04 between 2026-10-19 and
    # 2026-11-19 (actions/runner-images#14748); bump this pin on purpose, in a PR that reruns
    # the whole suite, not by surprise on a Monday. Every job in every workflow (freshness.yml,
    # finals.yml too) pins the same image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Pinned by commit SHA (Dependabot proposes bumps weekly, .github/dependabot.yml); the
      # trailing tag is for humans. uv itself is pinned too: without `version` setup-uv falls
      # back to whatever uv is newest that morning.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Install tesseract-ocr (a CI tool for the stamp's OCR read, never a runtime dependency)
        # ADR-0002 Open question 5 (Phase K JEe2, 2026-10-25): packages/core/tests/test_stamp_ocr.py renders every
        # page of a pack-less draft and a rehearsal fill and runs the tesseract CLI on it; it FAILS when CI is set and
        # tesseract is missing. Ubuntu's package, no Python dependency: taxfill-core never imports or calls it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Run tests (offline — live-.gov round-trips run in the network-tests job)
        # pytest-xdist (Phase J JD2): the offline suite in parallel; the property tests seed their own
        # random.Random, so a worker split cannot change what they draw.
        run: uv run pytest -m "not network" -n auto

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Ruff lint (config in pyproject.toml [tool.ruff])
        run: uvx ruff check .

  test-count:
    # The headline test count is quoted in the README badge (alt text AND the
    # shields.io URL) and the ROADMAP. Every copy was once
    # maintained by hand and went stale four times — at one point the badge's alt
    # text disagreed with its own URL. The suites are glob-parametrized over the
    # knowledge/formpack YAMLs, so the number moves whenever a pack lands. Derive
    # it, never type it: this fails the build with an exact fix instruction.
    # Uses --collect-only, so it imports test modules but runs no tests (seconds).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Quoted test counts match reality
        run: uv run python scripts/sync_test_count.py --check
      - name: Quoted tool / op / DocSpec / pack counts match reality
        run: uv run python scripts/sync_doc_counts.py --check

  packaging:
    # Guards the v0.1 ship invariant: the published wheel must be self-contained —
    # knowledge/ + formpacks/ data resolves from inside the installed package, with
    # no repo checkout on the path. Build, install into a clean venv OUTSIDE the
    # repo, and exercise the loaders.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11"
      - name: Stage data + build both distributions
        run: |
          python scripts/stage_data.py
          uv build --package taxfill-core
          uv build --package taxfill-mcp
      - name: twine check (PyPI metadata)
        run: uvx twine check dist/*
      - name: Install into a clean venv outside the repo and smoke-test
        # scripts/release_smoke.py derives every expectation from this checkout (Phase J JA1): list_forms() per
        # jurisdiction-year against formpacks/, every staged data file byte for byte, 42 state knowledge packs per
        # year, the tool set test_server_e2e.py pins, and (--dist) that no sdist carries the repo-only bundle/
        # recipe. It replaced a hand-typed federal-2023 form set and tool count, which a pack added later could
        # slip past. docs/dev/PUBLISHING.md runs the same script.
        run: |
          set -e
          TMP="$(mktemp -d)"
          uv venv "$TMP/venv" --python 3.11
          uv pip install --python "$TMP/venv/bin/python" --no-cache --find-links dist/ "$(ls dist/taxfill_mcp-*.whl)"
          cd "$TMP"   # leave the repo so the resolver cannot fall back to repo-root data
          env -u TAXFILL_DATA_DIR "$TMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/release_smoke.py" \
            --repo "$GITHUB_WORKSPACE" --dist "$GITHUB_WORKSPACE/dist"
      - name: The .mcpb bundle validates and packs
        # Phase J JA1.5. The mcpb CLI is pinned to an exact npm version (2.1.2, the latest on 2026-10-15; release.yml
        # uses the same one, and test_release_workflow.py holds the two equal). Node comes with the runner image.
        # Packing re-validates and proves .mcpbignore keeps the recipe out; the bundle itself is built and attached
        # by release.yml, after the PyPI upload its server depends on.
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate packages/mcp-server/bundle/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack packages/mcp-server/bundle "$RUNNER_TEMP/taxfill.mcpb"
          FILES="$(unzip -Z1 "$RUNNER_TEMP/taxfill.mcpb" | sort | tr '\n' ' ')"
          echo "taxfill.mcpb holds: $FILES"
          test "$FILES" = "manifest.json pyproject.toml src/server.py "

# The drift + network-tests jobs moved to freshness.yml (weekly cron +
# workflow_dispatch): scheduled monitoring must not repaint this workflow's
# badge — the README's public health signal for the CODE — when a .gov source
# moves or a form is revised.
