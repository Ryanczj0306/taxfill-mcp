name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # freshness/drift + live-.gov round-trips run WEEKLY in
                       # freshness.yml (plus on demand from its Actions tab) —
                       # they monitor, don't gate, so they live outside this badge.

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Run tests (offline — live-.gov round-trips run in the network-tests job)
        run: uv run pytest -m "not network"

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Ruff lint (config in pyproject.toml [tool.ruff])
        run: uvx ruff check .

  test-count:
    # The headline test count is quoted in the README badge (alt text AND the
    # shields.io URL), the README status paragraph, and the ROADMAP. All four were
    # maintained by hand and went stale four times — at one point the badge's alt
    # text disagreed with its own URL. The suites are glob-parametrized over the
    # knowledge/formpack YAMLs, so the number moves whenever a pack lands. Derive
    # it, never type it: this fails the build with an exact fix instruction.
    # Uses --collect-only, so it imports test modules but runs no tests (seconds).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Sync workspace
        run: uv sync
      - name: Quoted test counts match reality
        run: uv run python scripts/sync_test_count.py --check

  packaging:
    # Guards the v0.1 ship invariant: the published wheel must be self-contained —
    # knowledge/ + formpacks/ data resolves from inside the installed package, with
    # no repo checkout on the path. Build, install into a clean venv OUTSIDE the
    # repo, and exercise the loaders.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Stage data + build both distributions
        run: |
          python scripts/stage_data.py
          uv build --package taxfill-core
          uv build --package taxfill-mcp
      - name: twine check (PyPI metadata)
        run: uvx twine check dist/*
      - name: Install into a clean venv outside the repo and smoke-test
        run: |
          set -e
          TMP="$(mktemp -d)"
          uv venv "$TMP/venv" --python 3.11
          uv pip install --python "$TMP/venv/bin/python" --no-cache --find-links dist/ "$(ls dist/taxfill_mcp-*.whl)"
          cd "$TMP"   # leave the repo so the resolver cannot fall back to repo-root data
          env -u TAXFILL_DATA_DIR "$TMP/venv/bin/python" - <<'PY'
          import asyncio
          from taxfill_core.datadir import data_root
          from taxfill_core import load_knowledge, load_state_knowledge
          from taxfill_core.discovery import list_forms, load_form_pack
          import taxfill_mcp.server as s
          assert "site-packages" in str(data_root()), f"data not packaged: {data_root()}"
          assert load_knowledge("federal", 2023).tax_year == 2023
          # The wheel must carry the NEWER years too — this job once asserted only
          # federal 2023 and would have passed unchanged if every 2024/2025/2026
          # knowledge pack and every state-2025 pack vanished from the wheel.
          assert load_knowledge("federal", 2025).tax.obbba_schedule_1a is not None, "2025 pack stale in wheel"
          assert load_knowledge("federal", 2026).provisional is not None, "2026 planning pack missing from wheel"
          assert load_state_knowledge("ca", 2023).jurisdiction == "states/ca"
          from pathlib import Path as _P
          from taxfill_core.datadir import knowledge_dir
          for _y in (2023, 2024, 2025):
              _n = len(list(_P(knowledge_dir()).glob(f"states/*/{_y}.yaml")))
              assert _n == 42, f"state {_y} knowledge packs in wheel: {_n} != 42"
          assert load_form_pack("f1040", 2023, "federal").fields, "f1040 field map missing"
          # Every federal 2023 form pack must be staged into the wheel -- guards against a
          # missing scripts/stage_data.py re-run after adding packs (a real near-miss).
          fed_2023 = {f.form_key for f in list_forms("federal", 2023)}
          required = {"f1040","f1040nr","f8843","f8863","f2555","f4868","f1040es","f1040x","fw7","f8959","f8960","f8962",
                      "sched_1","sched_2","sched_3","sched_a","sched_b","sched_c","sched_d","sched_e","sched_oi","sched_se"}
          missing = required - fed_2023
          assert not missing, f"federal 2023 packs missing from the installed wheel (re-run stage_data.py): {sorted(missing)}"
          for fk in ("f4868","f1040es","f1040x","fw7"):
              assert load_form_pack(fk, 2023, "federal").fields, f"{fk} field map missing from wheel"
          tools = asyncio.run(s.mcp.list_tools())
          assert len(tools) == 23, f"expected 23 tools, got {len(tools)}"
          print(f"OK — installed wheel is self-contained; {len(tools)} tools register")
          PY

# The drift + network-tests jobs moved to freshness.yml (weekly cron +
# workflow_dispatch): scheduled monitoring must not repaint this workflow's
# badge — the README's public health signal for the CODE — when a .gov source
# moves or a form is revised.
