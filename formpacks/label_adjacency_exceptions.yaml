# Phase K JK10 (2026-10-24): label-adjacency exceptions. The gate (packages/core/tests/test_label_adjacency.py,
# scripts/label_adjacency.py) fails on every widget whose numbered key (after formpacks/column_keys.yaml) is not the
# line the pack-blind anchor reads beside it, unless a row here names exactly that disagreement.
#
# Every row comes from a blind vision adjudication of the row (a crop of the row band with the box outlined and the
# candidate lines sorted, never which side claims which) that read the KEY's line printed on the box's row: the
# anchor misread the row, or (al40) the widget is a second box of the same field. A pack defect is fixed in the pack
# (with a test), never listed here. Format:
#
#   families:
#     - family: <id>            # rows that share one adjudicated reason
#       reason: >-              # what the adjudicator saw and why the key is right
#       adjudication: <who, when>
#       rows:                   # one per disagreeing widget; a row may carry its own `reason`
#         - {pack: <pack id>, field: "<AcroForm field>", widget: <widget index>, line: "<the key's line>",
#            anchor: "<the line the anchor reads>"}
#
# SELF-CLEARING: a row matches only while the anchor still reads `anchor` beside that widget AND the pack still binds
# it to a key of line `line`. A row that matches no live disagreement (the pack re-keyed or re-bound the widget, or
# the anchor now reads the key's line or another line) fails the gate as stale and must be removed; a second row for
# the same widget is refused when the table loads.
