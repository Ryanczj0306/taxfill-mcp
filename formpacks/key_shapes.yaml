    pattern: '^sch_m\.0*(?P<n>\d{1,3})(?:[ab]\.(?=[a-c]$)|(?=[cd]\.[ab]$)|[ab]\.year_of_(?:birth|disability)$)(?P<x>[a-d])?(?:\.[ab])?$'
    means: >-
      an item box of Schedule M line N: the face prints the line's number once ("46. PBGC Modification") and its
      items "(a) ...", "(b) ..." below it, and the anchor reads "46a" beside the (a) boxes, so a key maps to its
      item's designator. Three spellings: column first, then the item ("sch_m.46a.b" = 46(b), Column A (You);
      "sch_m.34b.c" = 34(c), Column B (Spouse)); on the senior citizen / disability line (47 on the 2023 face, 49 on
      2024's) items (c) and (d) item first, then You / Spouse ("sch_m.49c.b" = 49(c), Spouse); and that line's
      year-of-birth (item a) and year-of-disability (item b) boxes, named rather than lettered, which claim the line
      ("sch_m.49a.year_of_birth")
    examples: {sch_m.46a.b: "46b", sch_m.34b.c: "34c", sch_m.49c.b: "49c", sch_m.47d.a: "47d",
