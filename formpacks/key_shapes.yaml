  - id: az140-charitable-worksheet
    packs: [states/az/2023/az140, states/az/2023/az140py, states/az/2024/az140, states/az/2025/az140,
            states/az/2023/az140nr]
    pattern: '^ws3_(?P<n>\d)(?P<x>c)_'
    means: >-
      page 3's Standard Deduction Increase for Charitable Contributions worksheet, lines 1C-7C ("ws3_1c_gifts_cash_or_
      check" = 1C ... "ws3_7c_multiply_by_31pct" = 7C; 140NR runs to 9C); the face prints "1C" ... "7C" beside the
      boxes
    examples: {ws3_1c_gifts_cash_or_check: "1c", ws3_4c_add_1c_3c: "4c", ws3_7c_multiply_by_31pct: "7c"}

  - id: az140-lettered-boxes
    packs: [states/az/2023/az140, states/az/2023/az140py, states/az/2024/az140, states/az/2025/az140,
            states/az/2023/az140nr]
    pattern: '^0*(?P<n>\d{1,3})(?:(?P<x>[EF])|[CS])(?:_[a-z][a-z0-9_]*)?$'
    means: >-
      a box the face labels with its line number and a capital: "40E" (Other Exemptions count) and "82F" (filed
      under extension) are designators of their own (the anchor reads 40e / 82f); "44C" (charitable contributions
      with the standard deduction) and "13S" / "28S" (Form 140-SBI) are check boxes inside line 44 / 13 / 28, whose
      designator is the row's number
    examples: {40E: "40e", 82F_extension: "82f", 44C_charitable_with_standard: "44", 13S_filing_140sbi: "13"}

  - id: md502-filing-status
    packs: [states/md/2023/md502, states/md/2024/md502, states/md/2025/md502]
    pattern: '^filing_status_(?P<n>[1-6])_(?:single|mfj|mfs|hoh|qss|dependent)$'
    means: >-
      filing status box N: the face numbers the six boxes "1." Single ... "6." dependent taxpayer, so a swap between
      two status boxes disagrees with the number printed beside one
    examples: {filing_status_1_single: "1", filing_status_2_mfj: "2", filing_status_6_dependent: "6"}

  - id: mt-form2-2023-worksheet-rows
    packs: [states/mt/2023/form2]
    pattern: '^(?:ltc|status2a)\.0*(?P<n>\d{1,3})(?:\.b)?$'
    means: >-
      line N of a numbered worksheet block: the Long-Term Care Facility Rent Calculation ("ltc.2" = line 2, board
      services) and the filing status 2a net amount block ("status2a.2.b" = line 2, tax overpaid, Column B)
    examples: {ltc.1: "1", ltc.4: "4", status2a.2.b: "2"}

  - id: mt-form2-2023-line-boxes
    packs: [states/mt/2023/form2]
    pattern: '^(?:(?:add|itemized|othertax|ratio|sch\d)\.)?0*(?P<n>\d{1,3})(?P<x>[a-z])?\.(?:description|state|date|not_required|itemize_elect|decimal\.[ab])$'
    means: >-
      a second box of printed line N named by what it holds: a description, state or date box ("add.15.description",
      "itemized.18.description",
      "othertax.2.state", "sch1.2b.date"), a ratio's decimal box ("ratio.18.decimal.a"), or the line 7 / line 15
      election boxes ("7.not_required", "15.itemize_elect")
    examples: {add.15.description: "15", othertax.6.decimal.a: "6", sch1.19c.date: "19c", 7.not_required: "7"}

  - id: mt-form2-2023-recapture-code
    packs: [states/mt/2023/form2]
    pattern: '^liability\.recapture_code_[12]$'
    line: "2"
    means: >-
      a named block: the two "Code" boxes of the Tax liability section's line 2 "Recapture taxes" (the trailing digit
      is the box's position, not a line)
    examples: {liability.recapture_code_1: "2", liability.recapture_code_2: "2"}

  - id: ny-it201-residency-items
    packs: [states/ny/2023/it201, states/ny/2024/it201, states/ny/2025/it201]
    pattern: '^(?:D2|E|F)_(?P<n>[1-3])_[a-z][a-z_]*(?:::(?:yes|no))?$'
    means: >-
      question (N) of item D2 (Yonkers living quarters and months), E (NYC living quarters and days) or F (NYC months
      for you and your spouse): the face prints "(1)", "(2)", "(3)" beside each box, and the item letter is no line
    examples: {D2_2_months_you_in_yonkers: "2", E_2_days_in_nyc: "2", F_1_months_you_in_nyc: "1"}

  - id: sched1a-2026-vehicle-questions-1
    packs: [federal/2026/sched_1a]
    pattern: '^28[ab]\.original_use\.(?:yes|no)$'
    line: "1"
    means: >-
      a named block: question (1) of line 28a / 28b ("Did the original use of this vehicle start with you ...?");
      the face prints "(1)" beside its Yes box, which the anchor reads
    examples: {28a.original_use.yes: "1", 28b.original_use.no: "1"}

  - id: sched1a-2026-vehicle-questions-2
    packs: [federal/2026/sched_1a]
    pattern: '^28[ab]\.us_final_assembly\.(?:yes|no)$'
    line: "2"
    means: >-
      a named block: question (2) of line 28a / 28b ("Did final assembly of this vehicle occur within the United
      States ...?"); the face prints "(2)" beside its Yes box
    examples: {28a.us_final_assembly.yes: "2", 28b.us_final_assembly.no: "2"}

  - id: f8843-year-columns
    packs: [federal/2019/f8843, federal/2020/f8843, federal/2021/f8843, federal/2022/f8843, federal/2023/f8843,
            federal/2024/f8843, federal/2025/f8843, federal/2026/f8843]
    pattern: '^0*(?P<n>\d{1,3})(?P<x>[a-z])?\.(?:19|20)\d{2}$'
    means: >-
      the year column of line N ("4a.2023" = line 4a, the days present in the United States in 2023; "7.2018" = line
      7's 2018 box): the four-digit token is the year the face prints over the box, not a line
    examples: {4a.2023: "4a", 7.2018: "7", 11.2017: "11"}

  - id: f8863-line-22-questions
    packs: [federal/2023/f8863, federal/2024/f8863, federal/2025/f8863]
    pattern: '^22[ab]\.q(?P<n>[1-9])\.(?:yes|no)$'
    means: >-
      question (N) of line 22a / 22b's institution block ("22a.q2.yes" = "(2) Did the student receive Form 1098-T
      from this institution ...?" Yes); the face prints "(2)", "(3)" beside the boxes, which the anchor reads (the
      generic line-boxes shape, broadened in fixer round 5, mapped them to 22a and disagreed with every Yes box).
      The 2026 face is left out: the anchor reads no line beside its boxes (a shape must compare a widget)
    examples: {22a.q2.yes: "2", 22b.q3.no: "3"}

