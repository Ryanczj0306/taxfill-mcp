  # ── Phase K JK10b (2026-10-25): the Alabama Form 40 / 40NR booklets ──
  # The AL packs key every supporting schedule by the blank's own field names ("SCHAATCLN7", "SchNOL85ALN4a-1",
  # "SCHCRWKSHTPTLN3B"), which no shape declared, so 32-37 of their ~900-1,450 line-bearing keys were checked. Each
  # shape below was read on its packs' own faces (work renders of every schedule page, not shipped): in the field
  # names "LN" / "LINE" and the number name the schedule line the face prints; a trailing capital names a column,
  # a copy of the page ("-1" ... "-4": NOL-85A is printed four times, KRCC-I twice) or the second box of a line. A
  # letter that is a sub-line the face prints ("1a" on NOL-85, "10A" on 40NR Schedule A) maps to it; the others map
  # to the row's number. Blanks (first 16 hex of the sha256 each pack pins, matched by the cached file):
  #   states/al/2023/al40    023470e8b831a77a    states/al/2024/al40    4f6c357f74e247bb
  #   states/al/2025/al40    ffea0ca6b0f313ec    states/al/2023/al40nr  a41dd6a3fef84c0a
  - id: al-booklet-schedule-lines
    packs: [states/al/2023/al40, states/al/2024/al40, states/al/2025/al40, states/al/2023/al40nr]
    pattern: '^(?:SCHAATC|SCHAACPRTIII|SCHATPPTII?|SCHHBCPT(?:I|II|III|IV)|SchNOL85A?(?:PTII)?|PG7|4952A)(?:LN|LINE)0*(?P<n>\d{1,3})(?P<x>[a-h])?(?:[AB]|Other|-[1-4])?$'
    means: >-
      line N of a booklet schedule the field name spells out: Schedule AATC ("SCHAATCLN7"), Schedule AAC Part III
      ("SCHAACPRTIIILN3"), Schedule ATP Parts I-II ("SCHATPPTIILINE2"), Schedule HBC Parts I-IV ("SCHHBCPTIIILINE5";
      Part I's "4A" / "4B" and "8A" / "8B" are line 4's and line 8's Primary and Secondary account-holder boxes),
      Form NOL-85 and its Part II ("SchNOL85LN1g", "SchNOL85PTIILN3"; "...Other" is a line's explain box), each of
      the four NOL-85A copies ("SchNOL85ALN4a-2" = line 4(a) of copy 2) and Form 4952A ("PG7LINE3" on Form 40,
      "4952ALINE3" on 40NR); a lower-case letter is the sub-line the face prints ("1(a)" ... "7(g)", "11c"). Schedule
      AAC Parts I and II are table cells numbered across the row (the ledger's al-booklet-tables)
    examples: {SCHAATCLN37: "37", SCHAACPRTIIILN3: "3", SCHATPPTIILINE2: "2", SCHHBCPTILINE4B: "4",
               SchNOL85LN1g: "1g", SchNOL85PTIILN3: "3", SchNOL85ALN4a-2: "4a", SchNOL85ALN11e-4: "11e",
               PG7LINE5: "5", 4952ALINE6: "6"}

  - id: al40-schedule-cr-columns
    packs: [states/al/2023/al40, states/al/2024/al40, states/al/2025/al40]
    pattern: '^SCHCRWKSHTPTLN0*(?P<n>\d{1,2})[A-E]?$'
    header: [Column A, Column B, Column C, Column D, Column E, Column F]
    means: >-
      row N of Schedule CR (Credit for Taxes Paid to Other States; the face numbers rows 1-25 and lines 26-27): the
      capital after N is the row's Column A-E box, and no capital is Column F ("SCHCRWKSHTPTLN3B" = row 3, Column B;
      "SCHCRWKSHTPTLN26" = line 26)
    examples: {SCHCRWKSHTPTLN3B: "3", SCHCRWKSHTPTLN25E: "25", SCHCRWKSHTPTLN27: "27"}

  - id: al-schedule-rs-columns
    packs: [states/al/2023/al40, states/al/2024/al40, states/al/2025/al40, states/al/2023/al40nr]
    pattern: '^SCHRS(?:PT(?:II|III|IV|V))?(?:(?:[A-I]|HS|IS)?LN|[BCF])0*(?P<n>\d{1,2})(?:-1)?$'
    header: [FEIN, Account Number, State ID, Alabama Withheld]
    means: >-
      row N of a Schedule RS part (Part I unprefixed, "PTII" ... "PTV"; the face numbers rows 1-7 and lines 8-11):
      the capital before "LN" is the row's column A-I ("SCHRSPTIIELN3" = Part II row 3, column E Gross
      Distribution; 2025's column H and I boxes are "HSLN" / "ISLN"), "B" / "C" / "F" with no "LN" are the IRA
      check box, distribution code and state code columns, and no capital is the part's numbered line
      ("SCHRSPTIILN9"); 2025 prints the schedule a second time, its boxes suffixed "-1"
    examples: {SCHRSALN1: "1", SCHRSPTIIELN3: "3", SCHRSPTIIILN7: "7", SCHRSPTIIHSLN2: "2", SCHRSB4-1: "4",
               SCHRSPTVLN4-1: "4", SCHRSLN8: "8"}

