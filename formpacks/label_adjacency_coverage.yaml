# Phase K JK10 (2026-10-24): the label-adjacency coverage ledger. The gate (scripts/label_adjacency.py,
# packages/core/tests/test_label_adjacency.py) compares a key with the line printed beside its widget only when a
# rule maps the key to a line (KEY_RULE, a column convention of column_keys.yaml or a declared shape of
# key_shapes.yaml) AND the pack-blind anchor reads a printed line beside one of its widgets. Every other key passes
# unseen, so this ledger records, per shipped pack:
#
#   checked  the line-bearing keys the gate compared on at least one widget
#   lines    the pack's LINE-BEARING keys (below)
#   mapped   the line-bearing keys a rule or shape maps; lines - mapped are UNDECLARED (no rule reads them)
#   unread   (fixer round 5) the line-bearing keys beside none of whose widgets the anchor reads a printed line —
#            blind spot (b) below
#   same_row, cross_section, descriptive
#            (fixer round 6) blind spots (a), (c) and (d) below, counted; like `unread`, every row carries them and
#            the gate fails on a stale count
#   dark     (fixer round 4; only when the fraction is at or above the floor) the DARK key families below
#   declare  (fixer round 5; at any fraction) the families of undeclared keys the anchor reads a line beside
#   reason   (only below the floor) why the rest are unchecked, one of `reasons`
#   note     (only below the floor) which keys, in a sentence
#
# LINE-BEARING (fixer round 3, 2026-10-24; round 2 counted only the keys a rule could already map, a circular
# denominator under which a pack keyed mostly in an undeclared shape reported "OK 26/26"): a key the gate maps, or
# a key that carries a LINE-LIKE TOKEN and belongs to no `not_lines` family below. THE TOKEN RULE
# (label_adjacency.line_like): split the key into its letter-and-digit runs; it is line-like when one run is a line
# number — 1-3 digits with at most two trailing letters ("21", "5a", "13A", "12yb": "1.cents", "13.a", "7.2019",
# "sch_1a.3", "moa_12y", "12-Y") that is not an age threshold (right after over/under/age/ages, or right before
# older/or/younger: "you_65_or_older") — or contains "line"/"ln" directly followed by 1-3 digits ("line21",
# "SCHAACPRTILN5"). A digit run glued to other letters ("d01", "s1", "sched3", "pt2", "w2") is a cell, schedule,
# part or row index, and four or more digits are a form number or a year; neither is a line.
#
# A pack is BELOW THE FLOOR when it has no line-bearing key or checks fewer than `floor` of them; scaffold_state_year
# --triage then calls a base pack UNCHECKED or PARTIAL n/m (never OK), the row BASE-UNCHECKED, and the port needs a
# manual check of the base's line binding. A pack whose line-bearing keys are mostly undeclared is below the floor
# with reason shape-not-declared; no row at or above the floor has more undeclared keys than checked ones (a test
# holds it). DARK FAMILIES (fixer round 4, 2026-10-24; a fraction could not see a whole schedule left unchecked —
# OH Schedule of Business Income, MT 2023's EHRC and UPINT schedules — and a 3-cycle planted inside one passed): a
# key's family is the key with each line token replaced by "#" ("schedITbus_#", "sch_m.#.b"); a family holding 5 or
# more undeclared keys, or 5 or more line-bearing keys none of which the gate checks, is dark and puts the pack
# below the floor whatever its fraction. Its row lists the families (`dark`) with the reason (shape-not-declared
# for an undeclared family, anchor-reads-no-designators for a declared one); a test holds that no row at or above
# the floor holds an undeclared dark family, and the gate that the measured dark families equal the row's.
# FIXER ROUND 5 (2026-10-24): round 4's family kept the descriptive tail, so AZ 140's charitable worksheet
# ("ws3_1c_gifts_cash_or_check" ... "ws3_7c_multiply_by_31pct") made seven one-key families and a 3-cycle among them
# passed with the pack OK. A key's FAMILY is now the key up to and including its first line token, the tail dropped
# ("ws#_#"); the none-checked half also groups round 4's uniform-tail families ("#.no"). THE DECLARE-ME RULE: an
# undeclared key beside one of whose widgets the anchor reads a printed line puts the pack below the floor whatever
# its family's size (MT 2023's four "ltc.N" rows), until a shape or convention declares it or not_lines lists it;
# the row lists those families (`declare`) with a reason, and a network test holds that no row at or above the
# floor holds such a key. The 5-key DARK threshold now governs only the families the anchor reads no line beside.
# WHAT THE GATE CANNOT SEE (fixer round 6, 2026-10-24; the same list as scripts/label_adjacency.py's docstring and
# formpacks/CONVENTIONS.md). A line-number check compares a key with the line printed beside its box; it stops
# chasing instances here and COUNTS, per pack, the keys each blind spot covers:
#   (a) same_row       a SAME-ROW COLUMN SWAP: checked keys whose line another checked key of a different field
#                      claims on the same printed row (federal <-> state amount, Column A <-> Column B, dollars <->
#                      cents, two cells of one comb); the anchor reads that line beside both, so a swap passes
#   (b) unread         a box the anchor reads NO line beside, inside any family, declared or not (Form 8962's
#                      monthly rows, AZ 140's page-4/5 rows): a 3-cycle among those passes
#   (c) cross_section  a swap between SECTIONS THAT PRINT THE SAME LINE NUMBER: checked keys whose line another
#                      checked key of a different field claims on a different printed row (OK 511 / 511-A / 511-B
#                      line 1; OH IT 1040 / Schedule A / Schedule of Business Income; MT Form 2's tax calculation /
#                      Schedule I Part II; WI Schedules 1 / 2; NY IT-201 items D2 / E / F; CA Schedule CA's B7_A /
#                      7_A / II7_A; Schedule 1-A 2026's 1 / 28a / 28b). A section-aware comparison is an open item
#   (d) descriptive    a box the anchor reads a line beside whose key the gate compares NOTHING for: no line
#                      token and no rule maps it (UT TC-40's withholding_*, IA 1040's spouse_net_income, NY IT-203's
#                      D2_months_you_yonkers, VA 760's exemptions_section_a_total_count), or a not_lines family
#                      leaves it out (MT Form 2's dd529 item boxes, AZ 140's *_more_space, RI-1040's Schedule W)
#   Keys on boxes the exceptions table excuses count in (a) and (c) like agreeing ones (the final review)
# Those keys are the vision audit's and the relations' to check.
# The gate fails when a pack's measured coverage differs from its row: fewer checked keys is a
# REGRESSION (restore what the gate relied on, or record the drop with its reason); more checked keys, or a changed
# line-bearing or mapped count, is a STALE row (`scripts/label_adjacency.py --pack <id> --write-ledger` rewrites
# it, keeping a recorded reason while the undeclared count is unchanged). A shipped pack without a row, or a row
# for no shipped pack, fails too.
floor: 0.7
reasons:
  no-text-layer: >-
    the pages carrying the unchecked widgets have no text layer (an image-only page): the anchor has nothing to read
  anchor-reads-no-designators: >-
    the face prints the lines, but the pack-blind anchor reads no printed line beside the unchecked widgets (digit
    cells after a comb's first, boxes far from their row's number, rows numbered only in a caption)
  shape-not-declared: >-
    the keys name what each box holds (name.first, reason.a) or a table cell (short_term.1.row01.a), in no shape the
    gate reads and with no regex in key_shapes.yaml that maps them to the face's printed lines
  no-line-designators: >-
    the boxes the keys bind sit on no numbered line of the face (vouchers, identity blocks), so there is no line to
    compare
# Keys that carry a line-like token but name no printed line, left out of `lines` (a key a rule maps is counted
# whatever family it matches). Each family: a case-insensitive regex searched in the key, the reason, and example
# keys (each must be line-like and match). Keep this list short: a family of main lines does not belong here, it
# belongs in key_shapes.yaml or in a ledger note.
not_lines:
  - id: identity
    pattern: 'ssn|itin|(?<![a-z])f?ein(?![a-z])|(?<![a-z])tin(?![a-z])|phone|zip|routing|(?:^|\.)account(?:_number|_type|\.\d|$)|account_?number|account_type|license|(?<![a-z])pin(?![a-z])|identifying|identity|birth|(?<![a-z])dob(?![a-z])|certificate_number|district_code|direct_deposit'
    reason: >-
      an identity or account value (SSN, EIN, routing and account numbers, PIN, phone, ZIP, birth date, certificate
      or district code): its digits index the value's own cells or slots ("direct_deposit_1.account.3",
      "dependent_2_ssn_d4"), and a line number in such a key ("23.account_number") names the refund or identity
      block, which the identity fields' format checks cover, not a numbered amount line
    examples: [direct_deposit_1.account.3, 23.account_number, dependent_2_ssn_d4, your_wi_identity_protection_pin_1,
               dd529.4.account, accountnumber-3]
    # fixer round 4 (2026-10-24): a bare "account" hid the MT Form 2 lines that NAME an account (line 3's medical
    # savings account distribution, line 8's CGR account box); the pattern now takes only an account value
    not_examples: [sched1.3.medical_savings_account, sched4.6.first_time_homebuyer_account, sched3.8.cgr_account_id]
  - id: household-members
    pattern: '(?<![a-z])dependent_?\d|(?<![a-z])dependents?$|(?<![a-z])dep_?\d|_dep\d|(?<![a-z])oe_\d|sch_dp|deceased_\d|qualifying_person|care_provider|first_name|last_name|relationship'
    reason: >-
      a row of a dependents, household-member, care-provider or qualifying-person table, numbered by its position
      (dependent 1, 2, 3 ...; AZ's 8c, 8d ... rows), not by a printed amount line
    examples: [dependent_3.relationship, oe_2_first_name, deceased_1.name, 8c_first_name, care_provider_2.name,
               dependent_1_no_health_insurance, H_more_than_7_dependents]
    # fixer round 4 (2026-10-24): a bare "dependent" hid NJ-1040's exemption lines 11 and 12 (the amount and count
    # boxes of "11. Other Dependents" and "12. Dependents Attending Colleges"); the pattern now takes a numbered row
    not_examples: [exemption_11_other_dependents_amount, exemption_12_dependents_college_amount,
                   exemption_11_other_dependents_count_d1]
  - id: positional-rows
    pattern: 'row\d|(?<![a-z])r\d+\.|amended\.table\.\d|cont\d|voucher_\d|visit_\d|treaty_\d|(?:interest|dividend)_\d|expense_\d|schedule_w\.\d|schedw_|(?<![a-z])schw\d|transition_ws|_ws\.\d|page\d|address_line|explanation|(?<![a-z])change_\d'
    reason: >-
      a row numbered by its position in a table or a text block — Form 8949 / 2555 table rows, continuation lines
      of a text answer (1.cont2), the rows of MT Form 2's amended-return reason table (amended.table.2.line),
      estimated-tax vouchers, visit and treaty rows, Schedule B payer rows, W-2 / 1099 rows, worksheet rows, page
      numbers, address and explanation lines (fixer round 5: OK Schedule 511-I's "Explain the changes" text lines,
      sch_511i.change_N) — not by a printed amount line
    examples: [short_term.1.row01.a, 18.r2.a, amended.table.3.reason, 1.cont2, voucher_2.amount, interest_3.payer,
               schedule_w.4.code, SCHW2ALN5, mailing_address_line1, amended_explanation.line_3,
               sch_511i.change_2]
  # Fixer round 5 (Phase K JK10, 2026-10-24): the declare-me rule (an undeclared key the anchor reads a line beside
  # puts its pack below the floor) and the round-4 re-verifier's census turned up these keys, whose digits name no
  # printed line; each family was vision-read on its pack's own face (work crops, not shipped).
  - id: check-off-amounts
    pattern: '^volcontrib\.[a-z]\.[a-z]\.\d+$'
    reason: >-
      a dollar check-off box of MT Form 2 2023's voluntary contributions block: the boxes sit on the lettered rows
      1a-1d of line 1 ("1 Voluntary Contributions", rows a-d, one per fund, in Column A and Column B), and the
      key's digits are the printed amount of the box ($5, $10, $20) the filer marks, not a line number. Fixer round
      6 (2026-10-24): the gate has no shape for a check-off box of a lettered row, so the family stays here.
    examples: [volcontrib.a.a.5, volcontrib.b.b.10, volcontrib.d.a.20]
  - id: direct-deposit-529
    pattern: '^dd529\.\d+\.(?:529a?|deposit_amount)$'
    reason: >-
      a box of MT Form 2's 529/529A direct-deposit block, the 529 counterpart of the identity family's
      direct_deposit_N: the face prints N as the direct-deposit item number ("2 Account Type", "3 Account Type" on
      the 2023 form, after item 1's ordinary direct deposit; "4 Account Type" and "5 Account Type" on 2024's,
      after items 1-3), an item of the refund block, not an amount line; "529" / "529a" are the account-type boxes ("529 Qualified Tuition Program", "529A Achieving a
      Better Life Experience" — the Internal Revenue Code section, not a line); its routing and account boxes are
      identity values
    examples: [dd529.2.529, dd529.3.529a, dd529.4.deposit_amount]
  - id: positional-codes
    pattern: '(?<![a-z])code_number_\d|special_condition_code_\d|(?<![a-z])more_space'
    reason: >-
      a box numbered by its position or flagging a continuation, not by a printed line: MD 502's three "CODE NUMBERS
      (3 digits per line)" boxes beside the telephone numbers, NY IT-201 item G's special condition code boxes 1-2,
      and AZ 140's "For more space, check the box" flags under the dependents (box 10a and 10b) and qualifying-parents
      tables
    examples: [code_number_1, G_special_condition_code_2, 10ab_more_space, 11a_more_space]
  - id: filing-status-reference
    pattern: 'if_filing_status_\d'
    reason: >-
      the digit names the filing status a box applies to (VA 760's Exemptions Section A column "Spouse if Filing
      Status 2"), not a line; the anchor read the pre-printed "1" of the "You" box beside it
    examples: [exemptions_section_a_spouse_if_filing_status_2]
  # Fixer round 6 (2026-10-24): the mt-2023-exemption-rows family (MT Form 2 2023's "16a.a" ... "16d.b") is gone —
  # the face prints rows a-d in the line gutter and row d reads "Add lines a through c", so they are lines; the gate
  # cannot express a line that is only a letter, and the pack's row reads PARTIAL with that reason instead.

