#
# PRINTED IDENTITY (this blank's text layer). Page 1: "2025 Form IL-1040",
# "Individual Income Tax Return", "IL-1040 Front (R-12/25)"; page 2: "IL-1040
# Back (R-12/25)", "Refer to the 2025 IL-1040 Instructions for the address to
