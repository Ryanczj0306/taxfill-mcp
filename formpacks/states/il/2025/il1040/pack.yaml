# relations (the printed arithmetic is identical) and the conservative
# omissions of conditional / floored lines.
# ===========================================================================
# Form IL-1040, 2025 — Illinois Individual Income Tax Return.
#
# Authored via the taxfill pipeline: the 2023 vision map -> the 2024 port ->
# this port (every field re-bound by position and printed label against the
# 2025 blank, then confirmed on sentinel renders).
#
# Layout. Flat AcroForm (acroform_root empty; field names are the raw ids the
# form ships with — the 2025 re-authoring gave the header boxes "step1-A-…"
# names, the Step-3 boxes "step3-5/6/7", the option sets lowercase names
# ("filing_status", "residency", "refund", "account_type") and the page-2
# checkboxes their full printed captions, while the money boxes keep their
# 2024 names such as "Federally adjusted income"). IL-1040 is a single-column
# resident return, so each numbered income/tax line is one widget and the
# line key is the printed line number. Header, exemption sub-boxes,
# refund/account, signature and preparer widgets carry descriptive keys.
#
# Coverage. The 2025 blank has 109 widgets under 102 qualified names. 107
# lines are mapped here, one per fillable widget (every option kid of a
# shared field is its own line: 100 names, 107 widgets). Two widgets are
# intentionally OMITTED — form actions, not data fields: "Reset" and "Print"
# (push-buttons, /Ff 65536, at the foot of page 2; their "_States_" are
# appearance-stream dict keys, not values). No ReadOnly field exists on this
# blank (the 2024 "Help" banner is gone). One parent container holds no AP
# of its own: "Child Tax credit from Sch" with the kid "IL-EITC" — the fully
# qualified name (what fill_form resolves and what `field:` carries) is the
# dotted join "Child Tax credit from Sch.IL-EITC", the "." being the DOR's
# own "Sch." abbreviation period.
# Radio / checkbox questions that are ONE /Btn field with several mutually
# exclusive kids (filing_status; residency; refund; account_type) are mapped
# as one checkbox line per option on the shared field with the exact on_state
# read from this blank's widget /AP /N dictionaries (all lowercase in 2025:
# "/married filing jointly", "/part year resident", "/direct deposit",
# "/paper check", …). Single yes/no checkboxes (dependent You/Spouse,
# 65-or-older You/Spouse, legally-blind You/Spouse, 34a-34d, the line-42 IDOR
# box and its Self/Spouse/Dependent(s) trio, self-employed, Department-may-
# discuss) are one /Btn each; the per-person pairs keep the 2024 /you and
# /spouse states (lowercase), the rest are /On.
#
# Money vs text. The dollar boxes (/MaxLen 10; the Step-4 exemption sub-
# amounts /MaxLen 4 and 5) are mapped as `money` — every one prints a ".00"
# cents suffix on the form. Genuine text widgets stay text: names, address,
# city/state/ZIP, county, email, the 2-digit comb fiscal-year month/year
# boxes, SSN boxes, the date-of-birth boxes, bank routing (9) / account (17)
# Courier combs, signature dates, phone area-code (3) / number boxes, PTIN,
# firm FEIN, and the preparer / third-party name fields.
#
# Relations. Only unconditional equalities with every operand mapped are
# declared (4=1+2+3, 8=5+6+7, 9=4-8, 10=10a+10b+10c+10d, 19=14-18,
# 23=19+20+21+22, 24=23, 31=25..30, 36=34+35) — the 2025 face prints the
# same arithmetic as 2024 for the eight inherited rows; line 10 ("Exemption
# allowance. Add Lines 10a through 10d.") is an unconditional sum whose five
# operands are all mapped money boxes, omitted without reason by the
# 2023/2024 packs and added here. Lines
# whose printed instruction is conditional or floored/capped — 11 (resident
# vs Schedule NR source), 14 ("cannot be less than zero"), 18 ("cannot exceed
# … Line 14"), 32/33 (greater-than tests), 37/38/40/41 (refund/owe branches)
# — are OMITTED per the conservative house style.
#
# Cross_form. Line 1's printed label is "Federal adjusted gross income from
# your federal Form 1040 or 1040-SR, Line 11a.", so the single cross_form
# equality 1 == f1040.11a (Form 1040, 2025, line 11a = AGI) is declared.
form: Form IL-1040
jurisdiction: states/il
tax_year: 2025
source_url: https://tax.illinois.gov/content/dam/soi/en/web/tax/forms/incometax/documents/currentyear/individual/il-1040.pdf
pdf_sha256: 7af662f99b31f6aa0d00df5ae93c2a50c4c15e01a0c1dcf5f722fc0bde0799cd
acroform_root: ''
fields:
  # ===================================================== header (page 1, Step 1)
  # (The 2024 "Help" read-only tooltip banner no longer exists on the 2025 blank.)
  - line: fiscal_year_ending_month
    field: Fiscal year ending month
    type: text
    maxlen: 2
    comb: true     # /Ff comb bit, 2 cells
  - line: fiscal_year_ending_year
    field: Fiscal year ending year
    type: text
    maxlen: 2
    comb: true     # /Ff comb bit, 2 cells
  - line: tp_first_name_and_initial
    field: step1-A-firstnamemi
    type: text
  - line: tp_last_name
    field: step1-A-lastname
    type: text
  - line: tp_date_of_birth      # printed "Date of birth" (2024: "Year of birth", key tp_year_of_birth); no widget /MaxLen
    field: Step1-A-dob
    type: text
  - line: tp_ssn
    field: step1-A-ssn
    type: text
    maxlen: 11     # the widget lost its /MaxLen (2024: 11); 11 = 000-00-0000
  - line: spouse_first_name_and_initial
    field: step1-A-spousefirstnamemi
    type: text
  - line: spouse_last_name
    field: step1-A-spouselastname
    type: text
  - line: spouse_date_of_birth  # printed "Spouse's date of birth" (2024: "Spouse's year of birth", key spouse_year_of_birth); no widget /MaxLen
    field: step1-A-spousedob
    type: text
  - line: spouse_ssn
    field: step1-A-spousessn
    type: text
    maxlen: 11     # the widget lost its /MaxLen (2024: 11); 11 = 000-00-0000
  - line: mailing_address
    field: step1-A-mailingaddress
    type: text
  - line: apartment_number
    field: step1-A-aptno
    type: text
  - line: city
    field: step1-A-city
    type: text
  - line: state
    field: step1-A-state
    type: text
  - line: zip_or_postal_code
    field: step1-A-zip
    type: text
    maxlen: 10     # the widget lost its /MaxLen (2024: 10); 10 = ZIP+4 12345-6789
  - line: foreign_nation
    field: step1-A-foreignnation
    type: text
  - line: county_illinois_only
    field: step1-A-county
    type: text
  - line: email_address
    field: step1-A-email
    type: text

  # ---- Filing status (ONE /Btn field; mutually exclusive options).
  # NOTE: the printed face letters this item "B" (item A is the name/SSN
  # block) in 2023, 2024 and 2025 alike; the A_ key prefix is inherited from
  # the 2023 base unchanged — see the port banner.
  - line: A_filing_status::single
    field: filing_status
    type: checkbox
    on_state: /single
    group: filing_status
  - line: A_filing_status::mfj
    field: filing_status
    type: checkbox
    on_state: /married filing jointly
    group: filing_status
  - line: A_filing_status::mfs
    field: filing_status
    type: checkbox
    on_state: /married filing separately
    group: filing_status
  - line: A_filing_status::widowed
    field: filing_status
    type: checkbox
    on_state: /widowed
    group: filing_status
  - line: A_filing_status::hoh
    field: filing_status
    type: checkbox
    on_state: /head of household
    group: filing_status

  # ---- C — Check if someone can claim you as a dependent (You / Spouse boxes; two separate /Btn fields, both may apply)
  - line: C_claimed_as_dependent::you
    field: dependent_you
    type: checkbox
    on_state: /you
  - line: C_claimed_as_dependent::spouse
    field: dependent_status
    type: checkbox
    on_state: /spouse

  # ---- D — Nonresident / part-year resident (ONE /Btn field)
  - line: D_residency::nonresident
    field: residency
    type: checkbox
    on_state: /nonresident
    group: residency
  - line: D_residency::part_year
    field: residency
    type: checkbox
    on_state: /part year resident
    group: residency

  # ===================================================== Step 2 — Income (1-4)
  - line: "1"        # Federal adjusted gross income (federal Form 1040 or 1040-SR, Line 11a)
    field: Federally adjusted income
    type: money
  - line: "2"        # Federally tax-exempt interest and dividend income (1040 Line 2a)
    field: Federally tax-exempt interest
    type: money
  - line: "3"        # Other additions (Schedule M)
    field: Other additions
    type: money
  - line: "4"        # Total income — add Lines 1 through 3
    field: Total income
    type: money

  # ===================================================== Step 3 — Base income (5-9)
  - line: "5"        # Social Security benefits and certain retirement plan income if included in Line 1
    field: step3-5
    type: money
  - line: "6"        # Illinois Income Tax overpayment included in federal Form 1040 or 1040-SR, Schedule 1, Ln. 1
    field: step3-6
    type: money
  - line: "7"        # Other subtractions (Schedule M)
    field: step3-7
    type: money
  - line: "8"        # Total of your subtractions — add Lines 5, 6, and 7
    field: Total of your subtractions
    type: money
  - line: "9"        # Illinois base income — subtract Line 8 from Line 4
    field: Illinois base income
    type: money

  # ===================================================== Step 4 — Exemptions (line 10 a-d)
  - line: 10a        # Exemption amount (basic allowance)
    field: Exemption amount
    type: money
  - line: 10b_65_or_older::you
    field: over_65_you
    type: checkbox
    on_state: /you
  - line: 10b_65_or_older::spouse
    field: over_65_spouse
    type: checkbox
    on_state: /spouse
  - line: 10b        # 65 or older — exemption amount (# of checkboxes x $1,000)
    field: 65 or older exemption amount
    type: money
  - line: 10c_legally_blind::you
    field: blind_you
    type: checkbox
    on_state: /you
  - line: 10c_legally_blind::spouse
    field: blind
    type: checkbox
    on_state: /spouse
  - line: 10c        # Legally blind — exemption amount (# of checkboxes x $1,000)
    field: Legally blind exemption amount
    type: money
  - line: 10d        # If claiming dependents — amount from Schedule IL-E/EITC, Step 2, Line 1
    field: Claiming dependents
    type: money
  - line: "10"       # Exemption allowance — add Lines 10a through 10d
    field: Exemption allowance
    type: money

  # ===================================================== Step 5 — Net income and tax (11-14)
  - line: "11"       # Residents: net income (Line 9 - Line 10); nonres/part-year: from Schedule NR
    field: Illinois net income from Schedule NR
    type: money
  - line: "12"       # Residents: multiply Line 11 by 4.95% (.0495)
    field: Multiply residency rate
    type: money
  - line: "13"       # Recapture of investment tax credits (Schedule 4255)
    field: Recapture of investment tax credits
    type: money
  - line: "14"       # Income tax — add Lines 12 and 13
    field: Income tax
    type: money

  # ============================================= Step 6 — Tax after nonrefundable credits (15-19)
  - line: "15"       # Income tax paid to another state while an Illinois resident (Schedule CR)
    field: Income tax paid to another state
    type: money
  - line: "16"       # Property tax / K-12 education / volunteer emergency worker credit (Schedule ICR)
    field: Schedule ICR
    type: money
  - line: "17"       # Credit amount from Schedule 1299-C
    field: Credit amount from Schedule 1299-C
    type: money
  - line: "18"       # Total of your credits — add Lines 15, 16, and 17
    field: Total of your credits
    type: money
  - line: "19"       # Tax after nonrefundable credits — subtract Line 18 from Line 14
    field: Tax after nonrefundable credits
    type: money

  # ===================================================== Step 7 — Other taxes (20-23)
  - line: "20"       # Household employment tax
    field: Household employment tax
    type: money
  - line: "21"       # Use tax on internet, mail order, or other out-of-state purchases
    field: Use tax
    type: money
  - line: "22"       # Compassionate Use of Medical Cannabis Program Act / gaming-license surcharges
    field: Compassionate Use of Medical Cannabis Program Act
    type: money
  - line: "23"       # Total Tax — add Lines 19, 20, 21, and 22
    field: Total Tax
    type: money

  # ===================================================== Page 2
  - line: "24"       # Total tax from Page 1, Line 23
    field: Total tax from Page 1
    type: money

  # ---- Step 8 — Payments and refundable credit (25-31)
  - line: "25"       # Illinois Income Tax withheld (Schedule IL-WIT)
    field: Illinois Income Tax withheld
    type: money
  - line: "26"       # Estimated payments (Forms IL-1040-ES and IL-505-I)
    field: Estimated payments
    type: money
  - line: "27"       # Pass-through withholding (Schedule K-1-P or K-1-T)
    field: Pass-through withholding
    type: money
  - line: "28"       # Pass-through entity tax credit (Schedule K-1-P or K-1-T)
    field: Pass-through entity tax credit
    type: money
  - line: "29"       # Earned Income Tax credit from Sch. IL-E/EITC, Step 4, Line 9 (the widget name still spells the schedule IL-E/EIC)
    field: Earned Income Tax Credit from Schedule IL-E/EIC
    type: money
  - line: "30"       # Child Tax credit from Sch. IL-E/EITC, Step 5, Line 12 (qualified name — parent "Child Tax credit from Sch" + kid "IL-EITC")
    field: Child Tax credit from Sch.IL-EITC
    type: money
  - line: "31"       # Total payments and refundable credit — add Lines 25 through 30
    field: Total payments and refundable credit
    type: money

  # ---- Step 9 — Total (32-33)
  - line: "32"       # If Line 31 is greater than Line 24, subtract Line 24 from Line 31 (overpayment)
    field: If Line 31 is greater
    type: money
  - line: "33"       # If Line 24 is greater than Line 31, subtract Line 31 from Line 24 (tax due)
    field: If Line 24 is greater
    type: money

  # ---- Step 10 — Underpayment of estimated tax penalty and donations (34-36)
  - line: "34"       # Late-payment penalty for underpayment of estimated tax
    field: Late-payment penalty for underpayment
    type: money
  - line: 34a_farming
    field: Check if at least twothirds of your federal gross income is from farming
    type: checkbox
    on_state: /On
  - line: 34b_nursing_home   # you or your spouse are 65 or older AND permanently living in a nursing home
    field: Check if you or your spouse are 65 or older and permanently living in a nursing home
    type: checkbox
    on_state: /On
  - line: 34c_annualized     # income not received evenly — annualized on Form IL-2210
    field: Check if your income was not received evenly during the year and you annualized your income on Form IL2210
    type: checkbox
    on_state: /On
  - line: 34d_not_required_to_file   # not required to file an IL return in the previous tax year
    field: Check if you were not required to file an Illinois Individual Income Tax return in the previous tax year
    type: checkbox
    on_state: /On
  - line: "35"       # Voluntary charitable donations (Schedule G)
    field: Voluntary charitable donations
    type: money
  - line: "36"       # Total penalty and donations — add Lines 34 and 35
    field: Total penalty and donations
    type: money

  # ---- Step 11 — Refund or amount you owe (37-41)
  - line: "37"       # Overpayment — if Line 32 > Line 36, subtract Line 36 from Line 32
    field: Overpayment amount
    type: money
  - line: "38"       # Amount from Line 37 you want refunded to you
    field: Refunded to you
    type: money
  # ---- line 39 — refund method (ONE /Btn field "refund") + direct-deposit account information
  - line: 39a_refund_method::direct_deposit
    field: refund
    type: checkbox
    on_state: /direct deposit
    group: refund_method
  - line: 39b_refund_method::paper_check
    field: refund
    type: checkbox
    on_state: /paper check
    group: refund_method
  - line: 39_routing_number
    field: Routing number
    type: text
    maxlen: 9
    comb: true     # /Ff comb bit, 9 Courier cells
  - line: 39_account_type::checking
    field: account_type
    type: checkbox
    on_state: /checking
    group: account_type
  - line: 39_account_type::savings
    field: account_type
    type: checkbox
    on_state: /savings
    group: account_type
  - line: 39_account_number
    field: Account number
    type: text
    maxlen: 17
    comb: true     # /Ff comb bit, 17 Courier cells
  - line: "40"       # Amount to be credited forward — subtract Line 38 from Line 37
    field: Amount to be credited forwarded
    type: money
  - line: "41"       # Amount you owe
    field: Amount you owe
    type: money

  # ---- Step 12 — Health insurance checkbox and signature
  - line: 42_idor_share_income   # IDOR may share income and other information from this return with the Department of Insurance (Get Covered Illinois eligibility)
    field: Check this box and include your email address in Step 1 if IDOR may share your income and other information from this return
    type: checkbox
    on_state: /On
  # ---- line 42 (NEW in 2025) — "Tell us who in your household needs health insurance: Self Spouse Dependent(s)";
  # three separate /Btn fields, any combination may apply (adjudicated INDEPENDENT).
  - line: 42_household_needs_insurance::self
    field: Self
    type: checkbox
    on_state: /On
  - line: 42_household_needs_insurance::spouse
    field: Spouse_3
    type: checkbox
    on_state: /On
  - line: 42_household_needs_insurance::dependents
    field: Dependents
    type: checkbox
    on_state: /On

  # ---- Sign here
  - line: your_signature_date
    field: date_1
    type: text
  - line: spouse_signature_date
    field: date_2
    type: text
  - line: daytime_phone_area_code
    field: DaytimeAreaCode_1
    type: text
    maxlen: 3
  - line: daytime_phone_number
    field: phone_number_1
    type: text     # no widget /MaxLen in 2025 (2024: 8)
  # ---- Paid preparer use only
  - line: preparer_name
    field: PrintType paid preparers namePaid Preparer Use Only
    type: text
  - line: preparer_signature     # NEW widget in 2025 under the printed "Paid preparer's signature"
    field: Paid preparers signaturePaid Preparer Use Only
    type: text
  - line: preparer_signature_date
    field: Date mmddyyyyPaid Preparer Use Only
    type: text
  - line: preparer_self_employed
    field: Check if
    type: checkbox
    on_state: /On
  - line: preparer_ptin
    field: Paid Preparers PTINCheck if selfemployed
    type: text     # no widget /MaxLen in 2025 (2024: 12)
  - line: preparer_firm_name
    field: Firms name
    type: text
  - line: preparer_firm_fein
    field: Firms FEIN
    type: text
    maxlen: 10     # the widget lost its /MaxLen (2024: 10); 10 = 12-3456789
  - line: preparer_firm_address
    field: Firms address
    type: text
  - line: preparer_firm_phone_area_code
    field: DaytimeAreaCode_2
    type: text
    maxlen: 3
  - line: preparer_firm_phone_number
    field: phone_number_2
    type: text     # no widget /MaxLen in 2025 (2024: 8)
  # ---- Third party designee
  - line: third_party_designee_name
    field: step12-designeesig
    type: text
  - line: third_party_designee_phone_area_code
    field: area code
    type: text
    maxlen: 3
  - line: third_party_designee_phone_number
    field: phone_number_3
    type: text     # no widget /MaxLen in 2025 (2024: 8)
  - line: third_party_designee_authorize   # Department may discuss this return with the designee
    field: Check if the Department may
    type: checkbox
    on_state: /On

  # OMITTED push-buttons (form actions, not data fields): "Reset", "Print".
relations:
  - "4 == 1 + 2 + 3"              # Line 4 "Total income. Add Lines 1 through 3."
  - "8 == 5 + 6 + 7"              # Line 8 "Add Lines 5, 6, and 7. … total of your subtractions."
  - "9 == 4 - 8"                  # Line 9 "Illinois base income. Subtract Line 8 from Line 4."
  - "10 == 10a + 10b + 10c + 10d" # Line 10 "Exemption allowance. Add Lines 10a through 10d."
  - "19 == 14 - 18"              # Line 19 "Tax after nonrefundable credits. Subtract Line 18 from Line 14."
  - "23 == 19 + 20 + 21 + 22"     # Line 23 "Total Tax. Add Lines 19, 20, 21, and 22."
  - "24 == 23"                    # Line 24 "Total tax from Page 1, Line 23."
  - "31 == 25 + 26 + 27 + 28 + 29 + 30"  # Line 31 "Total payments and refundable credit. Add Lines 25 through 30."
  - "36 == 34 + 35"               # Line 36 "Total penalty and donations. Add Lines 34 and 35."
cross_form:
  - "1 == f1040.11a"              # Line 1 "Federal adjusted gross income from your federal Form 1040 or 1040-SR, Line 11a."
identity_fields:
  - tp_ssn
  - tp_first_name_and_initial
  - tp_last_name
