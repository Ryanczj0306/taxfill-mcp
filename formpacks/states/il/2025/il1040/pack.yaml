#     2025 box actually re-bound once the page-2 (0, 7.0) median shift is
#     removed):
#       Your first name and initial -> step1-A-firstnamemi; Your last name ->
#       step1-A-lastname; Year of birth -> Step1-A-dob (printed "Date of
#       birth"); Your social security number -> step1-A-ssn; Your spouse's
#       first name and initial -> step1-A-spousefirstnamemi; Your spouse's
#       last name -> step1-A-spouselastname; Spouse year of birth ->
#       step1-A-spousedob ("Spouse's date of birth"); Your spouse's social
#       security number -> step1-A-spousessn; Mailing address (See
#       instructions if foreign address) -> step1-A-mailingaddress; Apartment
#       number -> step1-A-aptno; City -> step1-A-city; State -> step1-A-state;
#       ZIP or Postal Code -> step1-A-zip; Foreign Nation, if not the United
#       States -> step1-A-foreignnation; County, (Illinois only) ->
#       step1-A-county; Email Address -> step1-A-email;
#       Filing status (5 kids) -> filing_status (5 kids: /single, /married
