#
# TOPOLOGY CENSUS (a census of the mapped widgets, 2024 pack vs this blank; every widget
# dumped with its /Parent-qualified name, page, /Rect, /FT, /Ff, /MaxLen, /DA
# and /AP /N states). 2024: 106 widgets = 99 names; 2025: 109 widgets = 102
# names. Fates of the 96 mapped 2024 widgets: GONE 53, MOVED 41, SAME 2.
#   * SAME (2): "Fiscal year ending month" / "Fiscal year ending year" (same
#     rect, /Ff 29360128 = comb, /MaxLen 2, /Helv 8 Tf).
#   * MOVED (41): every money box — page-1 lines 1-4, 8-23, 10a-10d and 10
#     drifted by at most 2.9 pt on any edge (page-1 printed words: median
#     shift 0.00, 99% within 0.5 pt); page-2 lines 24-41 moved UP 5.5-10.7 pt
#     with the page-2 print (median word shift (0, 7.0)). Each kept its name,
#     page, /Ff 12582912 and /MaxLen; their /DA changed "/Helv 8 Tf" ->
#     "/Arial 9 Tf" (lines 40 and 41: "/Arial 8 Tf"). Each sits on the same
#     printed line as in 2024 — confirmed on the sentinel renders, not from
