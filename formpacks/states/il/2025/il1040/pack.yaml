#       Refund Method (2 kids) -> refund (/direct deposit, /paper check); Bank
#       routing number -> Routing number; Checking/Savings Account (2 kids) ->
#       account_type (/checking, /savings); Bank account number -> Account
#       number; IDORshareincome information -> "Check this box and include
#       your email address in Step 1 if IDOR may share your income and other
#       information from this return" (/On);
#       YourSignatureDate -> date_1; SpouseSignatureDate -> date_2;
#       DaytimeAreaCode -> DaytimeAreaCode_1; DaytimePhoneNumber ->
#       phone_number_1; PreparerName -> "PrintType paid preparers namePaid
#       Preparer Use Only"; PreparerSignatureDate -> "Date mmddyyyyPaid
#       Preparer Use Only"; CheckBoxSelfEmployed -> "Check if" (/On);
#       PreparerPTIN -> "Paid Preparers PTINCheck if selfemployed";
#       PreparerFirmName -> "Firms name"; PreparerFirmFEIN -> "Firms FEIN";
#       PreparerFirmAddress -> "Firms address"; PreparerFirmAreaCode ->
#       DaytimeAreaCode_2; PreparerFirmPhoneNumber -> phone_number_2;
#       ThirdPartyName -> step12-designeesig; ThirdPartyAreaCode -> "area
#       code"; ThirdPartyPhoneNumber -> phone_number_3; Department may discuss
#       -> "Check if the Department may" (/On).
#   * NEW (64 widgets = 57 names): the 53 replacements above plus 4 names
#     with no 2024 counterpart — "Self", "Spouse_3", "Dependents" (/On boxes
#     under the line-42 caption "Tell us who in your household needs health
#     insurance: Self Spouse Dependent(s)", MAPPED as
#     42_household_needs_insurance::self / ::spouse / ::dependents) and "Paid
#     preparers signaturePaid Preparer Use Only" (a /Tx box under the printed
#     "Paid preparer's signature", MAPPED as preparer_signature).
#   * The base-unmapped "Help" tooltip banner (2024's only ReadOnly field) is
#     gone. "Reset" and "Print" (pushbuttons, /Ff 65536) remain and stay
#     unmapped. NOTHING on the 2025 blank carries the ReadOnly bit (/Ff bit
#     1): mapped ∩ ReadOnly = 0, no P-007 adjudication needed.
#   * /MaxLen: the header and preparer re-authoring DROPPED the limit on ten
#     widgets — both SSNs (2024: 11), both birth boxes (4), ZIP (10), PTIN
#     (12), firm FEIN (10) and the three phone numbers (8). Kept: area codes
#     3, Routing 9, Account 17, fiscal boxes 2, money boxes 10 (10a-10c 4,
#     10d and 10 5). The pack keeps maxlen 11 / 10 / 10 on the SSNs, ZIP
#     and FEIN as the printed formats' own counts (000-00-0000, 12345-6789,
#     12-3456789; each box is 79-127 pt wide at Arial/Helv 9 and holds far
#     more), and drops the 2024 maxlen on the three phone numbers and the
#     PTIN because the widget no longer enforces one (verify's clipping scan
#     still guards the box). The date-of-birth lines carry no maxlen (2024:
#     4 for a year; the 2025 box is a full date, 80 pt wide).
#   * /Ff: text widgets 12582912 (DoNotSpellCheck|DoNotScroll) except date_2
#     and the preparer date (0) and phone_number_3 (4194304); "Routing
#     number" / "Account number" 25165824 (Comb|DoNotScroll, "/Cour 0 Tf")
#     and the fiscal boxes 29360128 (Comb|DoNotScroll|DoNotSpellCheck) carry
#     `comb: true` below; every checkbox /Ff 0.
#   * /DA: every re-authored text box is "/Arial 9 Tf" or "/Helv 9 Tf"
#     (2024: "/Helv 8 Tf" on the money/header boxes, "/Helv 9.5 Tf" on the
#     signature/preparer block, bank combs "/Helv 12 Tf").
#
# FACE DELTAS vs 2024 (the complete printed-text diff of both blanks' text layers). The
# printed line numbers 1-42, the Step headings and the 34a-34d / 39a-39b
# letters are unchanged. What changed: line 1 cites "federal Form 1040 or
# 1040-SR, Line 11a" (2024: Line 11) -> cross_form `1 == f1040.11a`; the
# header boxes read "Date of birth" / "Spouse's date of birth" (2024: "Year of
# birth") -> keys tp_date_of_birth / spouse_date_of_birth (the 2024 keys
# tp_year_of_birth / spouse_year_of_birth are referenced only by the IL packs;
# a year-only value in a date box would be wrong, so the key is renamed, not
# carried); line 5 copy edits ("(Generally … 6b). Attach fed. Form
# 1040/1040-SR."); item D "during 2025"; line 42 recaptioned ("… share your
# income and other information from this return with the Department of
# Insurance … through Get Covered Illinois, the state's Health Insurance
# Marketplace. See instructions. Tell us who in your household needs health
# insurance: Self Spouse Dependent(s)") with the three NEW boxes; revision
# stamps R-12/25 and the barcodes. Printed figures: lines 10b/10c "# of
# checkboxes x $1,000", line 12 "4.95% (.0495)" — both as in 2024 and as
# knowledge/states/il/2025.yaml records ($1,000 per 65-or-older / blind box,
# 4.95% flat rate). The face prints no exemption amount on line 10a ("See
# instructions"); the knowledge pack's $2,850 comes from the instructions.
#
# CHECKBOX TOPOLOGY. Four questions are N options on ONE /Btn field
# (filing_status 5, residency 2, refund 2, account_type 2); each option line
# below now carries a `group:` id (filing_status, residency, refund_method,
# account_type), so the 2025 pack carries no SHARED_FIELD_OPTIONS_WITHOUT_
# GROUP_ID debt (the 2023/2024 rows pin those years at 4). Per-person pairs on
# SEPARATE fields (dependent_you / dependent_status, over_65_you /
# over_65_spouse, blind_you / blind) are INDEPENDENT — one box per person on
# one printed row, both may apply — and keep the year-free
# SEPARATE_OPTION_SETS_ADJUDICATED rows ('states/il/il1040', 'C_claimed_as_
# dependent' / '10b_65_or_older' / '10c_legally_blind'); the new line-42
# household trio is "check who needs insurance" (any combination) and gets
# its own INDEPENDENT row ('states/il/il1040', '42_household_needs_insurance').
#
# SENTINEL AUDIT (2026-10-01). scripts/audit_pack.py filled every mapped
# line with its own sentinel on this blank, rendered both pages at 170 dpi,
# and every page was READ: each money sentinel sits in the box of the printed
# line its key names (page-1 ladder 1-23 with 10a-10d, page-2 ladder 24-41),
# each checked box is the printed option its key names (right person, right
# option), the header strings, dates, phone parts, bank combs and the
# preparer / designee strings sit under their printed captions, and
