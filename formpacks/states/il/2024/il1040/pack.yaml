# ===========================================================================
# TY2024 PORT of formpacks/states/il/2023/il1040/pack.yaml (ported 2026-08-24).
#
# Triage measured NEAR-PORT with two base-mapped field names missing on the
# 2024 blank. The real story is bigger than the name diff: the 2024 revision
# INSERTED a printed line (30, the new Illinois Child Tax credit) on page 2,
# so every printed line from the old 30 through the old 41 RENUMBERED by one
# while all but two of their AcroForm field names stayed the same. A
# name-only port would have shipped 12 keys pointing one printed line off.
# Every page-2 key below was re-derived from the 2024 printed face.
#
# RE-VERIFIED 2026-08-25 (independent second pass; the original porting run
# died mid-session, so every banner claim below was re-measured from the
# blanks rather than trusted): revision identity + sha256 recomputed;
# field-level topology re-diffed in both directions (98 -> 99 qualified
# names, same 2 removed / 3 added); per-widget page//Rect//Ff//MaxLen//AP
# re-diffed for all 96 surviving names (drift ranges below corrected to the
# measured values); ReadOnly re-swept (still only "Help"); the sentinel
# sweep re-filled (96/96 written), re-rendered at 200dpi and both pages
# re-read; verify_form re-run clean; the four shared-field option sets
# re-counted on the 2024 blank.
#
# REVISION IDENTITY. Page 1 of the pinned PDF extracts "2024 Form IL-1040",
# "Individual Income Tax Return", "IL-1040 Front (R-12/24)"; page 2 extracts
# "IL-1040 Back (R-12/24)" and "Refer to the 2024 IL-1040 Instructions".
# Page barcodes: *60012241W* / *60012242W* (2023: *60012231W* / *60012232W*).
# It is the 2024 revision, not a re-issued 2023 file. pdf_sha256 below was
# computed with shasum -a 256 on the exact downloaded artifact.
#
# TOPOLOGY DIFF (both blanks dumped at FIELD level — fully qualified names
# via the /Parent chain, /Ff and /MaxLen read off the terminal field node —
# then diffed in BOTH directions):
#   * 2023: 98 distinct qualified widget names; 2024: 99.
#   * REMOVED (2, both mapped by the base pack):
#       "Earned Income Credit from Schedule IL-E/EIC"  (2023 printed line 29)
#       "If Line 30 is greater"                        (2023 printed line 31)
#   * ADDED (3, all mapped below):
#       "Earned Income Tax Credit from Schedule IL-E/EIC" — the RENAMED line
#         29 EITC widget (same page-2 row band y 636.2-647.7 as the 2023
#         line 29 widget; the printed face renamed the credit "Earned Income
#         Tax credit" and the schedule "IL-E/EIC" -> "IL-E/EITC").
#       "Child Tax credit from Sch.IL-EITC" — the NEW printed line 30 ("Child
#         Tax credit from Sch. IL-E/EITC, Step 5, Line 12"). NOTE the widget
#         is a parent container "Child Tax credit from Sch" holding one kid
#         "IL-EITC"; the fully qualified name (what fill_form resolves, and
#         what `field:` must carry) is the dotted join, and the "." inside it
#         is the DOR's own "Sch." abbreviation period. /Tx, /MaxLen 10, /Ff
#         12582912 — same shape as every other page-2 money box.
#       "If Line 31 is greater" — the RENAMED overpayment widget (2024
#         printed line 32; sits one row band below the 2023 "If Line 30 is
#         greater" rect, matching the inserted row).
#   * PRINTED-LINE DIFF, page 2 (text-extracted from both blanks and read):
#     25-28 keep number and caption; 29 recaptioned (EITC, Sch. IL-E/EITC);
#     NEW 30 Child Tax credit; then old->new: 30->31 (total payments, now
#     "Add Lines 25 through 30"), 31->32, 32->33, 33->34 (+ its a-d
#     checkboxes), 34->35, 35->36, 36->37, 37->38, 38->39 (refund method a/b
#     + routing/account), 39->40, 40->41, 41->42 (IDOR share, Step 12). The
#     keys below are the 2024 printed numbers; each carries a "(2023 line n)"
#     note where it moved. Page 1 (Steps 1-7, lines 1-23, 10a-10d) keeps its
#     entire ladder — only copy edits ("Attach Schedule X" -> "Attach Sch.
#     X" throughout, line 5 reworded to cite fed. Forms 1040/1040-SR Lines
#     4b/5b/6b instead of "Attach Page 1 of federal return", line 11 "Net
#     income." -> "Net income:", 10d now cites Schedule IL-E/EITC, and item
#     D's year string rolled 2023 -> 2024).
#   * SAME-NAME REBIND CHECK: for EVERY surviving mapped name, page, /Rect,
#     /Ff, /MaxLen, /FT and /Btn /AP state names were diffed 2023 vs 2024.
#     No widget changed page. /FT changed on nothing. /Ff changed on NOTHING
#     (no field gained or lost the ReadOnly bit). Rect drift: the page-2
#     block from old line 30 down shifted DOWN 11.5-13.9pt (the inserted
#     row); page-1 Step 3-6 money boxes and several page-2 boxes WIDENED
#     ~3-10pt on the right edge (a few also grew ~5-7pt on the left:
#     Exemption allowance, Late-payment penalty, Voluntary donations);
#     preparer/third-party boxes grew 1-6pt. The
#     sentinel render was read page by page to confirm every box still sits
#     on its printed row (see VISION AUDIT).
#   * /MaxLen: exactly three changes, all None -> 8: "DaytimePhoneNumber",
#     "ThirdPartyPhoneNumber", "PreparerFirmPhoneNumber" — each now carries
#     `maxlen: 8` below (the base pack had no maxlen on these three; the 2024
#     widgets enforce one).
#   * MULTI-KID /Btn fields re-verified PER WIDGET (a sorted-list diff pairs
#     them wrongly once rows shift): "Refund Method" still has its direct-
#     deposit kid ABOVE (y 372.9-380.8) and paper-check kid BELOW (y
#     317.3-326.4), both ~12.8pt lower than 2023, on-states byte-identical
#     including the long "/direct deposit - Complete the information below if
#     you check this box."; "Checking/Savings Account" keeps /Checking left
#     (x 407.8) and /Savings right (x 473.8). "Filing status" (5 kids) and
#     "Resident" (2 kids) have IDENTICAL rects and states both years.
#
# READONLY RE-MEASUREMENT (knowledge/pitfalls.yaml P-007). The 2024 blank has
# exactly ONE field with /Ff bit 1: "Help" (/Ff 4194305, the read-only
# tooltip banner) — the same single ReadOnly field as 2023, and it stays
# OMITTED (class 1: the widget holds the form's own printed help text; it is
# not a data field). mapped ∩ ReadOnly = 0 in both years; no adjudication
# changed in this port.
#
# SHARED-FIELD OPTION SETS (test_pack_invariants.py
# SHARED_FIELD_OPTIONS_WITHOUT_GROUP_ID pins the 2023 base at 4 sets). Re-
# verified on the 2024 blank: still exactly 4 sets, each N options on ONE
# /Btn field — "Filing status" (5), "Resident" (2), "Refund Method" (2),
# "Checking/Savings Account" (2). Per the byte-minimal port convention (NY
# 2024 precedent) NO group ids were added; the integrator pins a
# states/il/2024 debt row with count 4.
#
# VISION AUDIT (2026-08-24). Every mapped line filled with a unique sentinel
# via the repo filler (scripts/audit_pack.py synthetic values), both pages
# rendered at 200dpi and READ. Every money sentinel sits in the box its 2024
# printed line labels — including the renumbered Step 8-11 block (29 EITC,
# 30 Child Tax credit, 31 total, 32/33 branches, 34-36, 37-41) — every
# checked box is the intended option of its printed question, SSN/routing/
# account values show unclipped, and verify_form reported 0 assertion, 0
# clipping and 0 checkbox failures.
#
# WHAT DELIBERATELY DID NOT CHANGE:
#   * The header/signature/preparer key spellings and the option-key house
#     style ("::") are byte-identical to the base so the diff stays
#     reviewable.
#   * A_filing_status::* keeps the base spelling even though BOTH years'
#     printed faces letter the filing-status item "B" (item A is the
#     name/SSN block). The base pack mis-transcribed the letter at
#     authoring; renaming is a cross-year API change over the 2023 pack too,
#     so it is flagged for the integrator instead of forked here.
#   * No group ids (see above), no relations beyond the printed-face sums,
#     and the conservative omissions (conditional/floored lines) carry over
#     with their numbers rolled.
# ===========================================================================
# Form IL-1040, 2024 — Illinois Individual Income Tax Return.
#
# Authored via the taxfill pipeline: `taxfill introspect` (sentinel sweep —
# every widget rendered with its own field name) -> vision-map workflow (both
# pages + zoomed crops read to place each field on its printed line / column)
# -> the 2023 map -> this port (page-2 keys re-derived from the 2024 face).
#
# Layout. Flat AcroForm (acroform_root empty; field names are the raw,
# human-readable sentinel ids the form ships with, e.g. "Federally adjusted
# income", "Filing status", "YourSignatureDate"). IL-1040 is a single-column
# resident return, so each numbered income/tax line is one widget and the line
# key is the printed step line number ("Federally adjusted income" widget ->
# line "1", etc.). Header, exemption sub-boxes, refund/account, signature and
# preparer widgets carry descriptive keys.
#
# Coverage. The 2024 blank PDF has 101 distinct AcroForm field objects (pypdf
# get_fields). 96 fillable widgets are mapped here. Three widgets are
# intentionally OMITTED — none accept taxpayer data:
#   * "Help"  — a read-only (/Tx, Ff bit 1 ReadOnly) tooltip banner at the top
#     of page 1; it cannot be filled.
#   * "Reset" and "Print" — push-buttons (/Btn, Ff bit 17 Pushbutton) at the
#     bottom of page 2; their "_States_" (/BBox, /Filter, /FormType, …) are the
#     button's appearance-stream dict keys, not selectable values. Form actions,
#     not data fields.
# Two bare parent containers hold no fillable AP of their own and are not
# counted as mappable fields; their real kid widgets are mapped below:
#   * "Check if someone can claim you as a dependent" (/Btn FT=None) — kids
#     "… - You" /You and "… - Spouse" /Spouse.
#   * "Child Tax credit from Sch" — kid "IL-EITC" (the new line 30 money box).
# Radio / checkbox questions that are ONE /Btn field with several mutually
# exclusive options (Filing status; Resident; Refund Method; Checking/Savings
# Account) are each mapped as one checkbox line per option on the shared field,
# carrying the exact on_state read from the widget AP /N dictionaries
# (verified against the blank: e.g. "/Married filing jointly", and the long
# "/direct deposit - Complete the information below if you check this box.").
# Single yes/no checkboxes (dependent You/Spouse, 65-or-older You/Spouse,
# legally-blind You/Spouse, Farming/Nursing home/Annualized/Not-required-to-
# file, IDOR share, self-employed, Department-may-discuss) are one /Btn each.
#
# Money vs text. The dollar boxes the skeleton tagged `text maxlen:10` (and the
# Step-4 exemption sub-amounts the skeleton tagged maxlen 4/5) are mapped as
# `money` — every one prints a ".00" cents suffix on the form. Genuine text
# widgets stay text: names, address, city/state/ZIP, county, email, the
# 2-digit comb fiscal-year month/year boxes, SSN boxes (maxlen 11), the 4-digit
# birth-year boxes, the dependent-count box, bank routing (9) / account (17)
# comb boxes, signature dates, phone area-code (3) / number (8) boxes, PTIN
# (12), firm FEIN (10), and the preparer / third-party name fields.
#
# Relations. Only unconditional equalities with every operand mapped are
# declared (4=1+2+3, 8=5+6+7, 9=4-8, 19=14-18, 23=19+20+21+22, 24=23,
# 31=25..30, 36=34+35). Lines whose printed instruction is conditional or
# floored/capped — 11 (resident vs Schedule NR source), 14 ("cannot be less
# than zero"), 18 ("cannot exceed … Line 14"), 32/33 (greater-than tests),
# 37/38/40/41 (refund/owe branches) — are OMITTED per the conservative house
# style.
#
# Cross_form. Line 1's printed label is "Federal adjusted gross income from
# your federal Form 1040 or 1040-SR, Line 11", so the single cross_form
# equality 1 == f1040.11 (Form 1040, 2024, line 11 = AGI) is declared.
form: Form IL-1040
jurisdiction: states/il
tax_year: 2024
source_url: https://taxarchive.illinois.gov/content/dam/soi/en/web/taxarchive/forms/income-tax/2024/individual/il-1040.pdf
pdf_sha256: 22317a5388a444d8429ca1b36ab20d49256bbb0466181127b6f8113cefea2059
acroform_root: ''
fields:
  # ===================================================== header (page 1, Step 1)
  # OMITTED: "Help" (read-only tooltip banner — not fillable).
  - line: fiscal_year_ending_month
    field: Fiscal year ending month
    type: text
    maxlen: 2
  - line: fiscal_year_ending_year
    field: Fiscal year ending year
    type: text
    maxlen: 2
  - line: tp_first_name_and_initial
    field: Your first name and initial
    type: text
  - line: tp_last_name
    field: Your last name
    type: text
  - line: tp_year_of_birth
    field: Year of birth
    type: text
    maxlen: 4
  - line: tp_ssn
    field: Your social security number
    type: text
    maxlen: 11
  - line: spouse_first_name_and_initial
    field: Your spouse's first name and initial
    type: text
  - line: spouse_last_name
    field: Your spouse's last name
    type: text
  - line: spouse_year_of_birth
    field: Spouse year of birth
    type: text
    maxlen: 4
  - line: spouse_ssn
    field: Your spouse's social security number
    type: text
    maxlen: 11
  - line: mailing_address
    field: Mailing address (See instructions if foreign address)
    type: text
  - line: apartment_number
    field: Apartment number
    type: text
  - line: city
    field: City
    type: text
  - line: state
    field: State
    type: text
  - line: zip_or_postal_code
    field: ZIP or Postal Code
    type: text
    maxlen: 10
  - line: foreign_nation
    field: Foreign Nation, if not the United States
    type: text
  - line: county_illinois_only
    field: County, (Illinois only)
    type: text
  - line: email_address
    field: Email Address
    type: text

  # ---- Filing status (ONE /Btn field; mutually exclusive options).
  # NOTE: the printed face letters this item "B" (item A is the name/SSN
  # block) in BOTH 2023 and 2024; the A_ key prefix is inherited from the
  # 2023 base unchanged — see the port banner.
  - line: A_filing_status::single
    field: Filing status
    type: checkbox
    on_state: /Single
  - line: A_filing_status::mfj
    field: Filing status
    type: checkbox
    on_state: /Married filing jointly
  - line: A_filing_status::mfs
    field: Filing status
    type: checkbox
    on_state: /Married filing separately
  - line: A_filing_status::widowed
    field: Filing status
    type: checkbox
    on_state: /Widowed
  - line: A_filing_status::hoh
    field: Filing status
    type: checkbox
    on_state: /Head of Household

  # ---- C — Check if someone can claim you as a dependent (You / Spouse boxes)
  - line: C_claimed_as_dependent::you
    field: Check if someone can claim you as a dependent. See instructions - You
    type: checkbox
    on_state: /You
  - line: C_claimed_as_dependent::spouse
    field: Check if someone can claim you as a dependent. See instructions - Spouse
    type: checkbox
    on_state: /Spouse

  # ---- D — Nonresident / part-year resident (ONE /Btn field)
  - line: D_residency::nonresident
    field: Resident
    type: checkbox
    on_state: /Nonresident
  - line: D_residency::part_year
    field: Resident
    type: checkbox
    on_state: /Part-year resident

  # ===================================================== Step 2 — Income (1-4)
  - line: "1"        # Federal adjusted gross income (federal 1040/1040-SR Line 11)
    field: Federally adjusted income
    type: money
  - line: "2"        # Federally tax-exempt interest and dividend income (1040 Line 2a)
    field: Federally tax-exempt interest
    type: money
  - line: "3"        # Other additions (Schedule M)
    field: Other additions
    type: money
  - line: "4"        # Total income — add Lines 1 through 3
    field: Total income
    type: money

  # ===================================================== Step 3 — Base income (5-9)
  - line: "5"        # Social security benefits / certain retirement plan income
    field: Social security benefits
    type: money
  - line: "6"        # Illinois income tax overpayment included in federal Form 1040
    field: Illinois income tax overpayment
    type: money
  - line: "7"        # Other subtractions (Schedule M)
    field: Other subtractions
    type: money
  - line: "8"        # Total of your subtractions — add Lines 5, 6, and 7
    field: Total of your subtractions
    type: money
  - line: "9"        # Illinois base income — subtract Line 8 from Line 4
    field: Illinois base income
    type: money

  # ===================================================== Step 4 — Exemptions (line 10 a-d)
  - line: 10a        # Exemption amount (basic allowance)
    field: Exemption amount
    type: money
  - line: 10b_65_or_older::you
    field: 65 or older - you
    type: checkbox
    on_state: /You
  - line: 10b_65_or_older::spouse
    field: 65 or older - spouse
    type: checkbox
    on_state: /Spouse
  - line: 10b        # 65 or older — exemption amount (# of checkboxes x $1,000)
    field: 65 or older exemption amount
    type: money
  - line: 10c_legally_blind::you
    field: Legally blind - you
    type: checkbox
    on_state: /You
  - line: 10c_legally_blind::spouse
    field: Legally blind - spouse
    type: checkbox
    on_state: /Spouse
  - line: 10c        # Legally blind — exemption amount (# of checkboxes x $1,000)
    field: Legally blind exemption amount
    type: money
  - line: 10d        # If claiming dependents — amount from Schedule IL-E/EITC, Step 2, Line 1 (2023 face: IL-E/EIC)
    field: Claiming dependents
    type: money
  - line: "10"       # Exemption allowance — add Lines 10a through 10d
    field: Exemption allowance
    type: money

  # ===================================================== Step 5 — Net income and tax (11-14)
  - line: "11"       # Residents: net income (Line 9 - Line 10); nonres/part-year: from Schedule NR
    field: Illinois net income from Schedule NR
    type: money
  - line: "12"       # Residents: multiply Line 11 by 4.95% (.0495)
    field: Multiply residency rate
    type: money
  - line: "13"       # Recapture of investment tax credits (Schedule 4255)
    field: Recapture of investment tax credits
    type: money
  - line: "14"       # Income tax — add Lines 12 and 13
    field: Income tax
    type: money

  # ============================================= Step 6 — Tax after nonrefundable credits (15-19)
  - line: "15"       # Income tax paid to another state while an Illinois resident (Schedule CR)
    field: Income tax paid to another state
    type: money
  - line: "16"       # Property tax / K-12 education / volunteer emergency worker credit (Schedule ICR)
    field: Schedule ICR
    type: money
  - line: "17"       # Credit amount from Schedule 1299-C
    field: Credit amount from Schedule 1299-C
    type: money
  - line: "18"       # Total of your credits — add Lines 15, 16, and 17
    field: Total of your credits
    type: money
  - line: "19"       # Tax after nonrefundable credits — subtract Line 18 from Line 14
    field: Tax after nonrefundable credits
    type: money

  # ===================================================== Step 7 — Other taxes (20-23)
  - line: "20"       # Household employment tax
    field: Household employment tax
    type: money
  - line: "21"       # Use tax on internet, mail order, or other out-of-state purchases
    field: Use tax
    type: money
  - line: "22"       # Compassionate Use of Medical Cannabis Program Act / gaming-license surcharges
    field: Compassionate Use of Medical Cannabis Program Act
    type: money
  - line: "23"       # Total Tax — add Lines 19, 20, 21, and 22
    field: Total Tax
    type: money

  # ===================================================== Page 2
  - line: "24"       # Total tax from Page 1, Line 23
    field: Total tax from Page 1
    type: money

  # ---- Step 8 — Payments and refundable credit (25-31)
  - line: "25"       # Illinois Income Tax withheld (Schedule IL-WIT)
    field: Illinois Income Tax withheld
    type: money
  - line: "26"       # Estimated payments (Forms IL-1040-ES and IL-505-I)
    field: Estimated payments
    type: money
  - line: "27"       # Pass-through withholding (Schedule K-1-P or K-1-T)
    field: Pass-through withholding
    type: money
  - line: "28"       # Pass-through entity tax credit (Schedule K-1-P or K-1-T)
    field: Pass-through entity tax credit
    type: money
  - line: "29"       # Earned Income Tax credit from Schedule IL-E/EITC, Step 4, Line 9 (2024 renamed the widget "Earned Income Credit…" -> "Earned Income Tax Credit…")
    field: Earned Income Tax Credit from Schedule IL-E/EIC
    type: money
  - line: "30"       # Child Tax credit from Schedule IL-E/EITC, Step 5, Line 12 (NEW printed line + widget in 2024; qualified name — parent "Child Tax credit from Sch" + kid "IL-EITC")
    field: Child Tax credit from Sch.IL-EITC
    type: money
  - line: "31"       # Total payments and refundable credit — add Lines 25 through 30 (2023 line 30)
    field: Total payments and refundable credit
    type: money

  # ---- Step 9 — Total (32-33)
  - line: "32"       # If Line 31 is greater than Line 24, subtract Line 24 from Line 31 (overpayment; 2023 line 31 — widget renamed "If Line 30 is greater" -> "If Line 31 is greater")
    field: If Line 31 is greater
    type: money
  - line: "33"       # If Line 24 is greater than Line 31, subtract Line 31 from Line 24 (tax due; 2023 line 32, same widget name)
    field: If Line 24 is greater
    type: money

  # ---- Step 10 — Underpayment of estimated tax penalty and donations (34-36)
  - line: "34"       # Late-payment penalty for underpayment of estimated tax (2023 line 33)
    field: Late-payment penalty for underpayment
    type: money
  - line: 34a_farming
    field: Farming
    type: checkbox
    on_state: /Farming
  - line: 34b_nursing_home   # you or spouse 65+ or permanently living in a nursing home
    field: Nursing home
    type: checkbox
    on_state: /65
  - line: 34c_annualized     # income not received evenly — annualized on Form IL-2210
    field: Annualized
    type: checkbox
    on_state: /Annualized
  - line: 34d_not_required_to_file   # not required to file an IL return in the previous tax year
    field: Not required to file last year
    type: checkbox
    on_state: /Not requred to file last year
  - line: "35"       # Voluntary charitable donations (Schedule G) (2023 line 34)
    field: Voluntary charitable donations
    type: money
  - line: "36"       # Total penalty and donations — add Lines 34 and 35 (2023 line 35)
    field: Total penalty and donations
    type: money

  # ---- Step 11 — Refund or amount you owe (37-41)
  - line: "37"       # Overpayment — if Line 32 > Line 36, subtract Line 36 from Line 32 (2023 line 36)
    field: Overpayment amount
    type: money
  - line: "38"       # Amount from Line 37 you want refunded to you (2023 line 37)
    field: Refunded to you
    type: money
  # ---- line 39 — refund method + direct-deposit account information (2023 line 38)
  - line: 39a_refund_method::direct_deposit
    field: Refund Method
    type: checkbox
    on_state: /direct deposit - Complete the information below if you check this box.
  - line: 39b_refund_method::paper_check
    field: Refund Method
    type: checkbox
    on_state: /Paper Check
  - line: 39_routing_number
    field: Bank routing number
    type: text
    maxlen: 9
  - line: 39_account_type::checking
    field: Checking/Savings Account
    type: checkbox
    on_state: /Checking
  - line: 39_account_type::savings
    field: Checking/Savings Account
    type: checkbox
    on_state: /Savings
  - line: 39_account_number
    field: Bank account number
    type: text
    maxlen: 17
  - line: "40"       # Amount to be credited forward — subtract Line 38 from Line 37 (2023 line 39)
    field: Amount to be credited forwarded
    type: money
  - line: "41"       # Amount you owe (2023 line 40)
    field: Amount you owe
    type: money

  # ---- Step 12 — Health insurance checkbox and signature
  - line: 42_idor_share_income   # IDOR may share income info with IL state agencies (health-insurance eligibility) (2023 line 41)
    field: IDORshareincome information
    type: checkbox
    on_state: /IDOR may share your income information

  # ---- Sign here
  - line: your_signature_date
    field: YourSignatureDate
    type: text
  - line: spouse_signature_date
    field: SpouseSignatureDate
    type: text
  - line: daytime_phone_area_code
    field: DaytimeAreaCode
    type: text
    maxlen: 3
  - line: daytime_phone_number
    field: DaytimePhoneNumber
    type: text
    maxlen: 8      # NEW in 2024: the widget gained /MaxLen 8 (2023: none)
  # ---- Paid preparer use only
  - line: preparer_name
    field: PreparerName
    type: text
  - line: preparer_signature_date
    field: PreparerSignatureDate
    type: text
  - line: preparer_self_employed
    field: CheckBoxSelfEmployed
    type: checkbox
    on_state: /Yes
  - line: preparer_ptin
    field: PreparerPTIN
    type: text
    maxlen: 12
  - line: preparer_firm_name
    field: PreparerFirmName
    type: text
  - line: preparer_firm_fein
    field: PreparerFirmFEIN
    type: text
    maxlen: 10
  - line: preparer_firm_address
    field: PreparerFirmAddress
    type: text
  - line: preparer_firm_phone_area_code
    field: PreparerFirmAreaCode
    type: text
    maxlen: 3
  - line: preparer_firm_phone_number
    field: PreparerFirmPhoneNumber
    type: text
