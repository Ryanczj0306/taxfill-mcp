# YEAR-BEARING LINE KEYS — ADJUDICATED HERE, and the adjudication CHANGED this
# pack (it also changed states/ut/2024/tc40, ported the same day, which had
# taken the OPPOSITE decision on the identical shape).
#   THE RULE: a line key must not embed an absolute year that moves with the tax
#   year. Name the ROLE relative to the pack's own tax_year and let tax_year
#   supply the absolute year. So printed line 69, "Amount from line 68 you want
#   to credit to your 2025 tax", is keyed `line69_credit_to_next_year_tax_dNN`
#   here — renamed from the ported `line69_credit_to_2024_tax_dNN` (10 comb
#   cells, d01-d10; the printed line NUMBER, the widgets and the mapping are
#   untouched).
#   WHY, weighed against "a line key is an API surface and renaming one is a
#   breaking change". Both alternatives are worse. (a) KEEPING "2024" in the
#   TY2024 pack ships an identifier that says the money went to 2024 tax for a
#   box the state applies to 2025 — a caller who maps their own field by key
#   name inverts the DIRECTION of the money (a payment already made vs a
#   carry-forward out). That is not a cosmetic label; it is the one kind of
#   staleness that can produce a wrong return. (b) ROLLING it to "2025" is
#   honest for exactly one year and then must be renamed again on every single
#   port — it manufactures the very cross-year API churn the "don't rename"
#   argument exists to prevent, and guarantees a stale key the first time a
#   porter forgets. A year-free key is honest in every year AND never needs
#   renaming again, so it carries no caveat at all. Cost of this rename,
#   measured before making it: `grep -rn line69_credit_to_2024_tax .` matched
#   ONLY the 2023 and 2024 NJ packs — no calc op, extractor, fixture, test,
#   knowledge file or cross_form rule references the key, so nothing outside
#   these pack files can break.
#   WHAT THE PRECEDENT ACTUALLY SAYS — grepped, not recalled, because an earlier
#   draft of this header overstated it and the overstatement is corrected here.
#   NY it203 2023/2024/2025 all carried `69_amount_applied_to_2024_estimate`
#   (correct on the 2023 face, STALE on the 2024 and 2025 faces, with a
#   documented caveat in those two headers) — a real precedent for "keep it",
#   and exactly the failure mode above, two years deep by the time all three
#   packs took the year-free rename (2026-08-24). NY it201, however,
#   has ZERO year-bearing line keys in 2023, 2024 and 2025: it never "shipped
#   the identical documented caveat" and is no precedent either way. Claiming it
#   was is the false half of the citation this header used to make.
#   FOLLOW-UPS this pack could not make itself (other owners) — ALL TAKEN
#   2026-08-24: states/nj/2023/nj1040 renamed `line69_credit_to_2024_tax_dNN`
#   to this pack's exact spelling, states/ut/2023/tc40 renamed
#   `refund_applied_to_2024`, and NY it203 2023/2024/2025 renamed line 69, so
#   every family now agrees across its shipped years. The rule itself is
#   formpacks/CONVENTIONS.md "Year tokens in line keys" (landed 2026-08-21),
#   enforced repo-wide by test_pack_invariants.py's year-offset gate.
#   THE EXCEPTION, and the contrast is the whole point: the `::2022`/`::2023`
#   rename above KEEPS its years, because there the year identifies WHICH
#   PHYSICAL OVAL takes the X. That is a mapping fact, not a label, so those two
#   keys must be re-derived from the printed face on every port.
#
# P-008 (checkbox groups) — FIXED IN THIS PORT, and it is the one behaviour
# change here beyond the ReadOnly/audit corrections. The base pack gave its 13
# radio questions NO `group` id, so fill_form silently accepted two answers to
# one question (last write wins on the shared field) and verify's checkbox audit
# could not see the question at all. Every one of the 38 option lines on a
# SHARED AcroForm field now carries a group id — mechanically the line stem
# before "::" (filing_status, filing_status_qw_year_of_death,
# line40b_residency_status, line70..77 contributions, gubernatorial_*), which is
# AR1000F's convention for the same shape. No line key, field, on_state or count
# changed: the audit still fills 813 lines with 0 verify FAILs, because
# synthetic_values already deduplicated by shared field. `required` is
# deliberately left off all 38 (a legitimately blank NJ-1040 answers none of
# these), matching P-008's sched_e reasoning; the at-most-one check applies
# regardless of `required`, which is the point. states/nj/2023/nj1040 has the
# identical gap and is NOT fixed here — it is not this pack's file.
#
# Caveat for the next author — a stale LABEL, not a mis-map:
#   * Two AcroForm field NAMES the DOR ships are stale against its own printed
#     face, in 2023 and 2024 alike: "CountyMunicipality Code See Table page 50"
#     (both faces print "See Table page 52") and "Drivers License Number
#     Voluntary Instructions page 44" (both faces print just "(See
#     instructions)"). These are widget names, not content — nothing to fix,
#     and they must NOT be "corrected" or the map stops resolving.
# ===========================================================================
# Form NJ-1040, 2023 - New Jersey Resident Income Tax Return.
#
# Authored via the taxfill pipeline: `taxfill introspect` (sentinel sweep -
# every widget rendered with its own field name) -> vision-map workflow (all
# four pages rendered from the official blank, with per-widget rect overlays
# read against the printed line labels to place every cell) -> this map.
#
# Layout. Flat AcroForm (acroform_root empty). The shipped field names are the
# raw, often-scrambled sentinel ids the form ships with (e.g. "undefined_42",
# "Text146", "Group168", "x  1000") - they do NOT track the printed line
# numbers, so every line key below was assigned from the widget's PAGE +
# POSITION, not from its field name. The blank's get_fields order is identical
# to the page/widget order, which is how each raw field path was tied to its
# spot on the form.
#
# NJ-1040 prints nearly every dollar amount as a row of single-character COMB
# cells (one digit per box, with pre-printed comma/decimal separators that are
# NOT widgets). Each money line is therefore a run of one-character `text`
# widgets (maxlen 1), keyed "<line>_dNN" left-to-right (d01 = leftmost /
# highest-order digit). They are kept as `text` (matching the skeleton) rather
# than `money` because no single widget holds a whole dollar value - the engine
# fills each cell with one character. SSNs, the county/municipality code,
# part-year-resident dates, birth years, the driver's-license number, and the
# preparer / firm federal-id numbers are comb runs too and use the same
# "<name>_dNN" scheme. Genuine single-value text widgets (name, address,
# city, state, ZIP, firm name) keep descriptive keys.
#
# Sections. Page 1: header (taxpayer/spouse SSN, name, address, county code,
# the three header checkboxes), part-year-resident & fiscal-year date combs,
# Filing Status (Group1, one radio /Choice1..5), the MFS spouse-SSN comb, the
# qualifying-widow year-of-death radio, Exemptions 6-13 (each: self/spouse
# oval(s) + a count box + the "x $N,NNN =" result amount), and the four
# Dependent rows (name + SSN comb + birth-year comb + "no health insurance"
# box). Pages 2-4: the numbered income / tax / credit / payment / contribution
# lines, each a comb amount, plus line-level checkboxes (NJ-2210 enclosed,
# health-coverage 53a/53b, the REQUIRED NJ-HCC box, the EIC and Child-and-
# Dependent-Care CU-couple boxes, line-79 e-check), the line-40b residency
# radio (Homeowner/Tenant/Both), the line-70..77 designated-contribution
# radios ($10 / $20 / Other), the Gubernatorial Elections Fund Yes/No radios,
# the signature dates, and the paid-preparer block.
#
# Checkboxes / radios. on_state strings are copied verbatim from the skeleton
# (the widget AP /N keys), preserving the odd values the form uses: filing
# status & several contributions use "/Choice1".."/Choice5"; the contribution
# radios on lines 70/71 and 75-77 use "/0" "/1" "/2"; single yes/no boxes use
# "/Yes"; the line-79 e-check box uses "/On". Radio questions that are ONE
# AcroForm field with several mutually exclusive options share that field and
# carry one line per option (e.g. "filing_status::single", "::mfj", ...)
# [TY2024 port: every such option line also carries a `group` id — the stem
# before "::" — so one question cannot be answered twice; see P-008 in the
# banner. The 2023 base pack has none.]
#
# Relations / cross_form. OMITTED. Every NJ-1040 total (e.g. 27, 38, 54, 66) is
# split across many single-character comb cells; no line key holds a whole
# numeric value, so no intra-form equality can be expressed over mapped money
# fields, and the conservative house style declares none. No printed label
# names a federal source line directly (NJ gross income is built on Schedule
# NJ-BUS / NJ-COJ etc., not a federal 1040 line), so cross_form is empty too.
#
# Coverage. The blank has 840 AcroForm widgets; 838 lines are mapped here. The
# two widgets NOT given their own line are mirror twins: the NJ-1040 reuses the
# AcroForm field name "undefined_118" for two adjacent line-41 comb cells, and
# "undefined_114" for one line-42 cell AND one line-55 cell. Widgets that share
# a field name always display the same value, and the engine writes a field
# once, so each duplicated name is mapped a single time (the twin still renders
# the value) - flagged inline at the kept line. There are no JS pushbuttons or
# readonly tooltips to omit. The pre-printed comma/period separators, the greyed
# ".00" cents, and the "Division use" boxes are static artwork, not widgets.

form: "Form NJ-1040"
jurisdiction: "states/nj"
