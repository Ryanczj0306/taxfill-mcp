#
# URL AND DIGEST. https://www.nj.gov/treasury/taxation/pdf/current/1040.pdf,
# downloaded twice in separate runs on 2026-09-30 (18:57:20Z and 18:57:29Z,
# desktop Chrome user agent): both HTTP 200 application/pdf with no redirect,
# 830,686 bytes, %PDF-1.6, byte-identical, sha256 3d15ad99f3ce...4c7eb6a3 — the
# digest of the discovery run's copies too. Server headers: Last-Modified Wed,
# 03 Dec 2025 14:00:48 GMT; ETag "cacde-69304290". The host served it without
# a 401/403, so the pack carries no mirror_urls.
# URL VOLATILITY — the first pack pinned to a YEAR-AGNOSTIC path. /pdf/current/
# serves whichever year NJ is posting. Its Wayback CDX history, hashed against
# both blanks: every 2025 capture (20250204232626 .. 20251116095446) carries
# the SHA-1 of the 2024 base blank (GFZMLE5I...), and every 2026 capture
# (20260116223511 .. 20260928153101) this file's SHA-1 (PAOMS3L5...). The 2024
# blank now answers at the dated path the 2024 pack pins
# (/pdf/other_forms/tgi-ee/2024/1040.pdf: 200, 714,901 bytes), while the 2025
# dated path (/pdf/other_forms/tgi-ee/2025/1040.pdf) answers 404, both on
# 2026-09-30. So once NJ posts TY2026 here, fetch_blank fails closed on this
# digest (a cached copy keeps working): re-point source_url at the 2025 dated
# path, after confirming it serves this digest.
#
# PRINTED IDENTITY. Page 1 prints "2025 NJ-1040 / New Jersey Resident / Income
# Tax Return", "Part-year residents, provide months/days you were a New Jersey
# resident during 2025", the part-year date combs "M M / D D /2 5", the
# fiscal-year end "M M 2026" and the Digital Assets question "... a digital
# asset in 2025 ...". Each page's barcode caption reads 040HP01250, 040HP02250,
# 040HP03250 and 040HP04250 (the 2024 blank: 040HP01240 .. 040HP04240); the
# captions are vector artwork with no text layer on either blank, so they were
# read on the rendered pages, not extracted. Document
# info: Title "2025 NJ-1040 Resident Income Tax Return", CreationDate
# 2025-10-27, ModDate 2025-11-25. printed_year_verified = 2025.
#
# TOPOLOGY against the 2024 blank (the census, plus a per-widget probe: the
# census compares only the FIRST widget of a field). Still 4 pages, mediabox
# 594 x 783, flat AcroForm, no XFA. 844 widgets on 814 field names, per page
# 150 / 302 / 225 / 167 (2024: 840 on 813; 148 / 303 / 222 / 167). Each of
# the 813 names the 2024 pack maps is still on its own page with the same /FT,
# /Ff, /MaxLen, /DA and /AP states — no flag, font, cell count or export value
# changed — and 734 of them moved their /Rect:
#   * page 1 re-flowed around the new Digital Assets row. The header rows moved
#     at most 2.2 pt; below the new row, the Filing Status block sits 23-30 pt
#     lower, exemption lines 6-13 19-21 pt lower, the dependent rows 16-18 pt;
#   * page 3: lines 42-49 moved under 2.5 pt, lines 50-67 1-3.8 pt lower;
#   * pages 2 and 4: the printed text did not move (every word but the rolled
#     year within 0.5 pt); the widgets were redrawn — about two thirds of the
#     page-2 cells are 1.4-1.8 pt wider — and moved at most 4.7 pt on page 2
#     (field "274", line 37c) and 2.6 pt on page 4.
# The structural changes, each re-read on the renders:
#   1. NEW field "Groupda" (page 1), a two-widget radio with /Ff 49152 like the
#      13 others: /0 sits right of the printed "Yes", /1 right of "No" — the
#      Digital Assets question. MAPPED as digital_assets::yes (/0) and
#      digital_assets::no (/1), group digital_assets. Not `required`, like every
#      other radio here: the face prints no must-answer instruction, only "(See
#      instructions.)".
#   2. Line 60 ("Excess New Jersey Disability Insurance Withheld") dropped the
#      grey pre-printed "0 . 0 0" from its last three comb cells and gained
#      three widgets there — but no new FIELDS: each is a second widget of
#      "Text176" / "Text177" / "Text178", which are line 61's cells d04-d06. A
#      field holds one value, so line 60's three right-hand cells always DISPLAY
#      line 61's last three digits and can never hold line 60's own. A DOR
#      authoring defect this pack cannot fix; see UNRESOLVED.
#   3. "undefined_118" (line 41 d04) lost the duplicate widget the 2024 blank
#      stacked in the same cell. Line 41 is still 7 cells, all mapped.
#   4. "undefined_114" keeps both widgets: line 42's cell 3 and line 55's cell 2
#      (as in 2024; line 55 cannot hold a digit of its own there).
# No base-unmapped widget went away (the 2024 pack mapped every name), and
# Groupda is the only new name.
#
# LINE 6 RE-KEYED — a mis-map carried from the 2023 pack, found by this port's
# render. Line 6 "Regular" prints THREE ovals, each LEFT of its label ("Self",
# "Spouse/CU Partner", "Domestic Partner"), but "Self" is printed SOLID BLACK on
# the blank (every filer takes it; so on the 2024 blank too) and has no widget.
# The row's two widgets are the other two ovals: "Check Box39" (x0 217.6) sits
# before "Spouse/CU Partner" and "Check Box40" (x0 316.1) before "Domestic
# Partner". The 2023 and 2024 packs keyed them exemption_6_regular_self and
# exemption_6_regular_spouse_cu, one oval off: a "self" answer marked the
# Spouse/CU Partner oval and a "spouse" answer the Domestic Partner oval. Here
# Check Box39 is exemption_6_regular_spouse_cu, Check Box40 is the new
# exemption_6_regular_domestic_partner, and exemption_6_regular_self is gone,
# so a caller asking for it gets "unknown line key" instead of a wrong mark
# (the pre-printed Self oval needs no entry; the line 6 count box still counts
# it). No calc op, extractor, fixture, knowledge file or cross_form rule names
# these keys — only the three NJ-1040 packs. The 2023 and 2024 packs were
# re-keyed the same way on 2026-10-02 (pitfall P-030;
# test_nj1040_line6_ovals.py reads the label right of each widget on every
# year's blank).
#
# FACE DELTAS vs 2024 (a diff of the printed text). No line was renumbered,
# split, added or removed: lines 1-80 print in the 2024 order. The complete
# printed change:
#   p1  "2024 NJ-1040" -> "2025 NJ-1040"; part-year "during 2024" -> "during
#       2025"; both part-year date combs "/2 4" -> "/2 5"; fiscal-year end "M M
#       2025" -> "M M 2026"; line 5 year-of-death ovals "2022 or 2023" -> "2023
#       or 2024"; line 7 "Born in 1959 or earlier" -> "in 1960 or earlier"; and
#       the NEW row "Digital Assets / Did you (or your spouse/CU partner)
#       receive (as a reward, award, or payment for property or services); or
#       sell, exchange, or otherwise dispose of a digital asset in 2025 (or a
#       financial interest in a digital asset)? (See instructions.) Yes No".
#   p2  line 40b "residency status during 2024" -> "during 2025".
#   p3  line 57 "Credit from 2023 tax return" -> "from 2024 tax return"; line
#       60's "0 . 0 0" artwork -> a printed "." separator (item 2 above); line
#       65 "younger on 12/31/24" -> "younger on 12/31/25".
#   p4  line 69 "credit to your 2025 tax" -> "credit to your 2026 tax".
# The line 5 roll is the one that changes a mapping. "Group1qualwi5ab" and its
# /0 and /1 states are unchanged, but the printed years moved, so the keys roll
# ::2022/::2023 -> ::2023/::2024: /0 is the LEFT oval (x0 305.86), printed
# "2023"; /1 the RIGHT oval (x0 381.86), printed "2024". Left unrolled, a
# caller marking a 2023 death would have filled the oval printed "2024". Line
# 69 needs nothing: its key has been year-free since the TY2024 port.
# Figures on the face, all unchanged from 2024: the exemption multipliers "x
# $1,000" (lines 6, 7, 8, 12), "x $1,500" (10, 11) and "x $6,000" (9); line
# 40a "18% of Rent"; line 16a "Enclose federal Schedule B if over $1,500"; the
# $1 Gubernatorial Elections Fund designations; the $10 / $20 ovals of lines
# 70-77; and the page-4 addresses "Revenue Processing Center – Payments, PO Box
# 111, Trenton, NJ 08645-0111" (tax due) and "Revenue Processing Center –
# Refunds, PO Box 555, Trenton, NJ 08647-0555" (refund or no tax due). The
# exemption amounts, the 18% of rent and both addresses match
# knowledge/states/nj/2025.yaml: no face/knowledge mismatch. No filing due
# date is printed on the face.
#
# READONLY AND PRESETS (P-007), re-measured on this blank. None of the 862
# field-tree nodes has the ReadOnly bit; the own /Ff values are 12582912 (760
# nodes), 8388608 (8), 49152 (14: the 13 radios of 2024 plus Groupda) and
# 25165824 (3). No /CO, no /XFA, no catalog /Names or /OpenAction, and all 24
# /AA entries hold only /F + /K (format / keystroke) actions: the form computes
# nothing, so P-007 has nothing to classify, this pack maps no ReadOnly widget
# and it needs no STATE_COMPUTED_READONLY row. The one preset value is the 2024
# one: "x  1000" (the line 6 result box, exemption_6_regular_amount) ships /V
# "." — an ordinary writable /Tx, mapped, and overwritten by a fill.
#
# SENTINEL AUDIT (scripts/audit_pack.py, 170 dpi): exit 0, "mapped_lines"
# 814, "written_fields" 814, "verify_fails" [] — one sentinel per AcroForm
# field (the 840 line keys answer each radio once, on its first option). All
# four pages read: every sentinel sits in its own printed box, each radio's
# first option (Digital Assets Yes, Single, 2023, Homeowner, the eight $10
# ovals, both Gubernatorial Yes) is marked on its own label, and line 6's
# result box shows its sentinel alone, the preset "." overwritten.
# That harness writes the same "T" into every one-character cell, so it cannot
# tell cells apart. An IDENTITY FILL did: each comb run spelled its printed
# line label in its first cells and its dNN index digit in the rest ("1 5 3 4
# 5 6 7 8 9 0" on line 15, "1 6 a 4 ..." on 16a, "Y 2 3 ... 9" in your SSN,
# "C 2 3 4" in the county code), the single boxes followed a checked /
# unchecked pattern that tells neighbours apart, and every radio took its LAST
# option; three more fills took the middle options (filing status 2, 3 and 4,
# 40b Tenant, the eight $20 ovals). All pages read at 170 dpi: every row shows
# its own printed line number, every run reads left to right with d01
# leftmost (the county code's fields are named CM4..CM1 and still put d1
# leftmost), and the marked boxes are exactly the pattern's. 840 / 840 line
# keys confirmed on renders: 773 text lines, 27 single boxes, 40 radio
# options. The twins render as measured: line 55's cell 2 repeats line 42's
# cell 3 (the millions digit of both), and line 60's last three cells repeat
# line 61's ones and cents digits. Line 41 shows its 7 digits.
# Three widgets carry the comb flag with /MaxLen 2 where the face prints ONE
# digit cell (the thousands digit of line 63 = d05, line 64 = d01 and line 65
# = d01; boxes 15.6, 16.0 and 14.9 pt wide, in the column of line 62's
# /MaxLen-1 thousands cell): a two-character sentinel rendered as two glyphs
# squeezed into the one printed box. The pack therefore budgets maxlen 1 (the
# 2024 pack carried the widget's 2), adjudicated as a tighter-than-widget
# budget. Re-audited at maxlen 1: each of the three cells shows its one
# sentinel centred in the printed box, like its neighbours.
#
# UNRESOLVED (the DOR would have to fix the blank):
#   * Line 60 / line 61 (item 2). Line 60 prints "X , X X X . X X"; filling line
#     61 also prints its ones digit and both cents digits in line 60's last
#     three cells, so a return with any line 61 amount shows a spurious amount
#     on line 60, and line 60 itself can be filled only down to its tens digit
#     (d01-d03 = thousands, hundreds, tens). A return with a nonzero line 60 or
#     line 61 needs line 60's cells corrected by hand before it is filed.
#   * "undefined_114" (item 4): line 55's cell 2 always shows line 42's cell 3,
#     the millions digit of both lines.
#   * Field NAMES do not describe their boxes, as in 2024 (the renders place
#     each): "SpousesCU Partners SSN if filing jointly" is the Home Address box,
#     "CountyMunicipality Code See Table page 50" the City box (the face prints
#     "See Table page 52" by the county code), and "Drivers License Number
#     Voluntary Instructions page 44" is licence cell 1 (the face prints "(See
#     instructions)"). Names are addresses, not labels: do not "correct" them.
# ===========================================================================
# Form NJ-1040, 2025 - New Jersey Resident Income Tax Return.
#
# Authored for TY2023 via the taxfill pipeline: `taxfill introspect` (sentinel
# sweep - every widget rendered with its own field name) -> vision-map workflow
# (all four pages rendered from the official blank, with per-widget rect
# overlays read against the printed line labels to place every cell) -> this
# map; carried to TY2024 and TY2025 by ports re-verified on each year's renders.
#
# Layout. Flat AcroForm (acroform_root empty). The shipped field names are the
# raw, often-scrambled sentinel ids the form ships with (e.g. "undefined_42",
# "Text146", "Group168", "x  1000") - they do NOT track the printed line
# numbers, so every line key below was assigned from the widget's PAGE +
# POSITION, not from its field name. (The 2023 author tied raw names to spots
# through the blank's get_fields order, which then matched the page/widget
# order. It no longer does: on the 2025 blank the two orders part at field
# index 29, "Text21" vs "Check Box20". Match names by geometry and the
# render, never by order.)
#
# NJ-1040 prints nearly every dollar amount as a row of single-character COMB
# cells (one digit per box, with pre-printed comma/decimal separators that are
# NOT widgets). Each money line is therefore a run of one-character `text`
# widgets (maxlen 1), keyed "<line>_dNN" left-to-right (d01 = leftmost /
# highest-order digit). They are kept as `text` (matching the skeleton) rather
# than `money` because no single widget holds a whole dollar value - the engine
# fills each cell with one character. SSNs, the county/municipality code,
# part-year-resident dates, birth years, the driver's-license number, and the
# preparer / firm federal-id numbers are comb runs too and use the same
# "<name>_dNN" scheme. Genuine single-value text widgets (name, address,
# city, state, ZIP, firm name) keep descriptive keys.
#
# Sections. Page 1: header (taxpayer/spouse SSN, name, address, county code,
# the three header checkboxes), part-year-resident & fiscal-year date combs,
# the Digital Assets Yes/No radio (Groupda, new for TY2025), Filing Status
# (Group1, one radio /Choice1..5), the MFS spouse-SSN comb, the
# qualifying-widow year-of-death radio, Exemptions 6-13 (each: self/spouse
# oval(s) + a count box + the "x $N,NNN =" result amount), and the four
# Dependent rows (name + SSN comb + birth-year comb + "no health insurance"
# box). Pages 2-4: the numbered income / tax / credit / payment / contribution
# lines, each a comb amount, plus line-level checkboxes (NJ-2210 enclosed,
# health-coverage 53a/53b, the NJ-HCC enclosure box (the face prints REQUIRED
# beside line 53c; it is conditional, so not a required: true line), the EIC
# and Child-and-Dependent-Care CU-couple boxes, line-79 e-check), the line-40b
# residency radio (Homeowner/Tenant/Both), the line-70..77 designated-
# contribution radios ($10 / $20 / Other), the Gubernatorial Elections Fund
# Yes/No radios, the signature dates, and the paid-preparer block.
#
# Checkboxes / radios. Every on_state is a real /AP /N key of its own widget,
# re-dumped from the 2025 blank (41 /Btn fields, 67 widgets): "/Yes" on the
# 26 single boxes; "/Choice1".."/Choice5" on Group1 (filing status);
# "/Choice1".."/Choice3" on Group182 (line 40b) and the line 71-75
# contribution radios; "/0".."/2" on Group168 (line 70), Group611 (line 76)
# and Group6112 (line 77); "/Choice1"/"/Choice2" on the Gubernatorial
# Yes/No radios (Group245 you, Group246 spouse/CU partner); "/0"/"/1" on
# Group1qualwi5ab (line 5 year of death) and Groupda (Digital Assets); and
# "/On" on the line-79 e-check box (Line77bdue, whose /AP /N has no /Off).
# Radio questions that are ONE AcroForm field with several mutually exclusive
# options share that field and carry one line per option (e.g.
# "filing_status::single", "::mfj", ...), and every such option line carries
# a `group` id — the stem before "::" — so one question cannot be answered
# twice (P-008; since the TY2024 port).
#
# Relations / cross_form. OMITTED. Every NJ-1040 total (e.g. 27, 38, 54, 66) is
# split across many single-character comb cells; no line key holds a whole
# numeric value, so no intra-form equality can be expressed over mapped money
# fields, and the conservative house style declares none. No printed label
# names a federal source line directly (NJ gross income is built on Schedule
# NJ-BUS / NJ-COJ etc., not a federal 1040 line), so cross_form is empty too.
# Re-read on the 2025 face: its federal references are enclosure notes (16a
# "Enclose federal Schedule B if over $1,500", 18 "federal Schedule C", 21 and
# 22 "federal Schedule K-1") and line 58's "IRS calculate your federal earned
# income credit" box; none cites a federal line, so the 2025 Form 1040's
# line 11a split does not reach this form.
#
# Coverage. The 2025 blank has 844 AcroForm widgets on 814 field names, and all
# 814 names are mapped here, as 840 line keys (the 14 radio fields carry 40
# option lines). The four widgets without a line of their own are mirror
# twins, a second widget under an already-mapped name: "undefined_114" (line
# 42 cell 3 AND line 55 cell 2) and, new for TY2025, "Text176" / "Text177" /
# "Text178" (line 61 cells 4-6 AND line 60 cells 4-6; see the port banner).
# Widgets that share a field name always display the same value, and the
# engine writes a field once, so each duplicated name is mapped a single time
# (the twin still renders the value) - flagged inline at the kept line. There
# are no JS pushbuttons or readonly tooltips to omit. The pre-printed
# comma/period separators and the "Division use" boxes are static artwork,
# not widgets.

