#
# READONLY ADJUDICATION (knowledge/pitfalls.yaml P-007) — the 2024 blank has
# NO ReadOnly widgets at all, so this pack maps none. Measured two independent
# ways, because a reader that misses the flag reports a false clean sweep:
#   (a) walking /AcroForm /Fields to the 114 terminal fields and resolving
#       /Ff up the /Parent chain — 0 with bit 1 set. The /Ff histogram is 65 x
#       29360128 (Comb|DoNotSpellCheck|DoNotScroll — the comb boxes: SSNs,
#       4-letter name, dates, routing/account, phones, PIN), 38 with no /Ff
#       key at all, 8 x 8388608 (DoNotScroll) and 3 x 12582912
#       (DoNotSpellCheck|DoNotScroll). Bit 1 is clear in every one.
#   (b) an annotation-level sweep of all 115 /Widget annots on both pages,
#       resolving /Ff up each annot's own /Parent chain — 0 with bit 1 set.
# The 2023 blank produces the identical histogram, so this is not a 2024
# change. Consequently the four P-007 classes resolve as: no class 1 (no
# widget ships a pre-set value — /V and /DV are empty on all 114, so there is
# no DOR-printed constant a filler could overwrite; the form's printed
# constants — the "X $930" / "X $800" exemption multipliers, the Line 9
# threshold note and the office-use LTD/LAR/DLAR/DTD ovals and "$______" box
# — are page content, not widgets, and were confirmed absent from the field
# tree); no class 2 (no mapped cell is made necessarily blank by its printed
# row); no class 3 (Form 760 prints no "reserved for future use" line); and
# NO CLASS 4, which is the finding worth recording for a state pack. VA 760
# has no JavaScript-owned totals to lose: the AcroForm dictionary carries only
# /DA, /DR and /Fields — there is no /CO calculation-order array — and the 45
# fields that do carry /AA actions carry only /F and /K entries
# (AFSpecial_Format / AFSpecial_Keystroke display formatters, e.g. on "Zip
# Code"), with no /C calculate action anywhere in the file. Every running
# total on this form (lines 3, 8, 9, 14, 15, 26, 34) is a filer entry that
# taxfill computes and writes itself. NOTHING therefore needs allowlisting in
# packages/core/tests/test_readonly_widget_mapping.py: this pack stays absent
# from STATE_COMPUTED_READONLY and is pinned at ZERO, exactly like the 2023
# pack, and the invariant test's mapped-∩-ReadOnly == table assertion holds in
# both directions.
#
