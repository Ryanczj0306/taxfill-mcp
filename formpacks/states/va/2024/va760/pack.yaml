# field. Nothing was re-mapped; nothing was newly left unmapped.
#
# PRINTED-LINE DIFF: ZERO RENUMBERING, stated explicitly because identical
# field names do NOT prove it (a positionally-named widget on a renumbered
# line fills the wrong line silently). Both pages of both blanks were
