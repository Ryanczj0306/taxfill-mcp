# ===========================================================================
# TY2024 PORT of formpacks/states/va/2023/va760/pack.yaml (ported 2026-08-21).
#
# This pack was NOT re-authored from a fresh introspect sweep; it is the TY2023
# map re-pinned to the TY2024 blank. Changed keys: `tax_year`, `source_url`,
# `pdf_sha256`. The field map itself — all 115 entries over 114 distinct
# AcroForm fields, their order, types, maxlens, on_states, `relations`,
# `cross_form` and `identity_fields` — is UNCHANGED, because the 2024 blank's
# AcroForm is the same shape as the 2023 blank's down to the flag bits (see
# TOPOLOGY). Seven comment-only year references were rolled 2023->2024; they
# are itemised under YEAR PROSE ROLLED below so the substantive diff stays
# reviewable.
#
# PROBE. `source_url` was derived from the 2023 pack's URL with this repo's
# own year-token substitution (scripts/scaffold_state_year.py `_candidate_url`,
# base 2023 -> target 2024), which rewrites BOTH year tokens in
# .../individual-income-tax/2023/760-2023.pdf. The derived URL returned
# HTTP 200, Content-Type application/pdf, 854,320 bytes, and the bytes start
# with the magic "%PDF-1.6" — a real PDF, not an HTML error page wearing a
# .pdf name.
#
# IDENTITY (read off the PDF, never off the URL — docs/ROADMAP.md records
# files.tax.utah.gov serving a 2025 revision from a /2023/ path). Page-1 text
# of the pinned file prints "2024 Virginia Form 760 / Resident Income Tax
# Return", "File by May 1, 2025 — USE BLACK INK", form id 2601031, and
# "Rev. 11/24"; the page-1 scanline is *VA0760124888* and the page-2 scanline
# *VA0760224888*, against the 2023 blank's "Rev. 06/23" / *VA0760123888* /
# *VA0760223888*. This is the 2024 revision of Form 760, not a re-issued 2023
# file.
#
# DIGEST PROVENANCE — DOUBLE DOWNLOAD. `source_url` was fetched TWICE,
# independently; both copies are 854,320 bytes and both digest to
# f1a344624e629ef12d5e931e22576646e706f6a33990b7e1ff5a956b3359b4b1, the value
# pinned in `pdf_sha256` below. The pin is therefore provably the artifact the
# DOR is serving, not a stale cache entry. (The 2023 pack's own pin was
# re-verified the same way against the cached 2023 blank: 03663fad…c82452.)
#
# TOPOLOGY: IDENTICAL. The 2023 and 2024 AcroForms are indistinguishable
# structurally. Both blanks expose 148 `get_fields()` keys = 114 TERMINAL
# fields + 34 non-terminal parent nodes ("1".."12", "14".."18", "20".."36" —
# the numbered money lines are two-level, parent /T "1" over kid /T
# " Federal Adjusted Gross Income", so the fully-qualified name the map binds
# is "1. Federal Adjusted Gross Income"; lines 13, 19a and 19b are flat
