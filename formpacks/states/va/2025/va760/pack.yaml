# TY2025 PORT of formpacks/states/va/2024/va760/pack.yaml (ported 2026-10-01,
# Phase J JS5; triaged RE-MAP — 10 of the 114 mapped fields gone by NAME, every
# one of them present at an identical /Rect under a new name).
#
# URL. https://www.tax.virginia.gov/sites/default/files/taxforms/individual-income-tax/2025/760-2025.pdf
# Digest bb271a15f9ad… — two independent curl downloads on 2026-10-01 (2,146,839
# bytes each, HTTP 200, magic "%PDF-1.7") and the JS5 triage copy all agree;
# that value is pinned in `pdf_sha256` below. pdfinfo: "Form: AcroForm", 2
# pages, Title "2025 Virginia Resident Form 760 Individual Income Tax Return",
# Adobe InDesign 21.3, created 2026-04-15.
#
# PRINTED IDENTITY (read off the PDF's own text layer, never off the URL).
# Page 1 prints "WEB 2025 Virginia Form 760 / Resident Income Tax Return",
# "2601031 File by May 1, 2026 — USE BLACK INK" and "Rev. 04/26"; page 2
# prints "WEB Page 2 / 2025 Form 760". printed_year_verified = 2025. The 2024
# blank's scanline strings *VA0760124888* / *VA0760224888* are NOT in the 2025
# text layer (no replacement string either) — the 2025 file prints no
# text-layer scanline, which changes nothing in the map.
#
# AcroForm TOPOLOGY against the 2024 blank (a widget census + a field-level
# flag dump walking /Parent). 115 widgets = 114 names in BOTH years. /Ff
# histogram identical (65 x 29360128 Comb|DoNotSpellCheck|DoNotScroll, 39 x
# none, 8 x 8388608, 3 x 12582912); ZERO ReadOnly widgets, so this pack maps
# none and stays absent from the test_readonly_widget_mapping tables. /DA
# histogram identical (85 x Helv 10, 27 x ZaDb 10, 1 each Helv 12 / Cour 10 /
# Arial 10). /MaxLen unchanged on every surviving name; /V and /DV empty on
# all 114. Mapped-widget fates: 43 SAME, 60 MOVED (all under 3 pt — the
# largest edge move is 2.69 pt on "Filing Status"), 10 GONE by name, 1 PAGE.
# The 10 GONE names and the 10 NEW names pair off at identical /Rects (a
# RENAME, confirmed by position, printed label and the sentinel render):
#   * "Check Box2" -> "Loss 1", "Check Box3" -> "Loss 3", "Check Box4" ->
#     "loss 9", "Check Box5" -> "loss 13", "Check Box6" -> "loss 14",
#     "Check Box7" -> "loss 15" (the six page-1 LOSS ovals), "Check Box8" ->
#     "loss 17" (the page-2 LOSS oval). Mixed case is the DOR's own; /AP /N
#     on all seven is still /Off + /Yes, re-dumped from THIS blank.
#   * "Middle initial_2" -> "Middle initial_spouse" and "First four letters of
#     last name_2" -> "First four letters of last name_spouse" (/MaxLen 1 and
#     4 as before, rects within 2.4 pt).
#   * THE TRAP: "Your SSN" (page 1) is gone and "SSN 1" SURVIVES BY NAME but
#     moved from page 2 to page 1 — it now sits at the old "Your SSN" rect
#     (361.68,683.82,492.93,700.50 vs 361.54,683.38,491.88,700.06), while the
#     page-2 header SSN at the old "SSN 1" rect (418.04,735.27,549.50,752.07)
#     is now NEW widget "SSN 2". A name-only port would have written the
#     page-1 SSN into the page-2 header and left page 1 blank. Re-bound:
#     your_ssn -> "SSN 1", page2_your_ssn -> "SSN 2" (still one mirror, so
#     IDENTITY_MIRROR_COUNTS pins 1 for this pack as for 2023/2024). One
#     flag moved with the rename: the page-1 SSN comb's /Q went 0 -> 2
#     (right-aligned, as the page-2 one already was) — the only /Q change
#     among the 65 comb widgets, and immaterial to a full 9-digit value.
# Nothing is newly left unmapped: all 115 widgets are bound (114 lines +
# the two options of the shared "Account Type" /Btn).
#
# ACTIONS. The AcroForm dictionary GAINED a /CO calculation-order array with
# ONE entry, "Total Exemptions Section A" (the Section-A count box, /MaxLen 2,
# NOT ReadOnly), whose new /AA /C is `AFSimple_Calculate("SUM", new Array ())`
# — an EMPTY summand list, i.e. a calculate hook the DOR wired to nothing.
# taxfill never runs form JavaScript and the widget takes the filer's own
# count, so the line stays mapped exactly as in 2024 (P-007 class 4 shape: the
# form "owns" the value only nominally; an unmapped box would ship blank).
# Caveat recorded for a reviewer: a viewer that DOES run calculate events
# (Acrobat) would evaluate that empty SUM to 0 on the next field edit. The 45
# fields carrying /F + /K display formatters (AFNumber_Format on the 39 money
# lines and the two exemption dollar boxes, AFDate on the two signature dates,
# AFSpecial on Zip Code / Preparer Phone Number) are the same 45 as in 2024.
#
# FACE DELTAS vs 2024 (the complete printed-text diff, both pages). Line numbering 1-36
# with 17a / 19a / 19b is UNCHANGED, and every caption is unchanged except the
# years and one comma: "File by May 1, 2025" -> "May 1, 2026", "Rev. 11/24" ->
# "Rev. 04/26", line 19 "withheld for 2024" -> "2025", line 20 "taxable year
# 2024" -> "2025", line 21 "Amount of 2023 overpayment applied toward 2024"
# -> "2024 … toward 2025", line 8 "Add Lines 4, 5, 6 and 7." -> "Add Lines
# 4, 5, 6, and 7."; the rest is dot-leader spacing and the pre-printed
# thousands commas no longer being text-layer glyphs. Printed figures: line 9
# "If less than $11,950 for Filing Status 1 or 3; or $23,900 for Filing
# Status 2, your tax is $0.00", Exemption Section A "X $930", Section B
# "X $800" — all as in 2024, and all matching knowledge/states/va/2025.yaml
# (filing_due_date 2026-05-01, $930 / $800, $11,950 / $23,900). The TY2025
# standard deduction ($8,750 / $17,500 in the knowledge pack) is NOT printed
# on the face (line 11 still reads "enter standard deduction. See
# instructions"), so there is nothing to cross-check and no mismatch. Line 30
# keeps the 2024 "Commonwealth Savers (formerly Virginia529 and ABLE)" name
# and the page-1 authorization keeps DMAS + VDSS + VHBE.
# Layout diff: median printed-word shift (0.00, 0.00) on both pages,
# 97-98 % of words within 2 pt.
#
# WHAT CHANGED IN THE MAP (port.py, exact-count substitutions on the 2024
# text): `tax_year`, `source_url`, `pdf_sha256`; the 11 re-bound `field`
# names listed above (10 renames + the SSN pair); `cross_form` 1 == f1040.11
# -> f1040.11a (the 2025 Form 1040 prints AGI on line 11a and the 2025 f1040
# pack maps "11a"); `group: account_type` on the two "Account Type" options
# (the house convention — this pack therefore carries NO
# SHARED_FIELD_OPTIONS_WITHOUT_GROUP_ID row); the line-8 comma; and the
# year prose on lines 19a / 20 / 21 and the cross_form comment. Also NEW in
# this port, on seven digit-only comb widgets the 2024 pack mapped as plain
# text: `comb: true` + `format: ssn_digits_only` on the three 9-cell SSNs
# (your_ssn, spouse_ssn and the page2_your_ssn mirror — the mirror rule
# requires source and mirror to agree on comb/format) and `comb: true` on
# the four 8-cell "Birth Date (mm-dd-yyyy)" / "Issue Date" boxes, whose
# separators are printed on the face. Measured against this blank
# (filler.py: only `format: ssn_digits_only` strips separators; a comb line
# otherwise refuses): the three SSNs take "999-88-0003" and write
# /V "999880003"; the four date boxes REFUSE "01-15-1990" ("exceeds comb
# MaxLen 8 — resubmit digits only") and "01-15-90" ("comb fields take digits
# only (one digit per cell) … strip dashes, spaces and letters and
# resubmit") with those prescriptive errors, and take "01151990" as eight
# digits, one per cell — so no dash or slash can reach a digit cell either
# way (P-001). The other combs keep
# their 2024 text mapping: the 4-letter name boxes and the DL Customer IDs
# take letters, which a comb line (digits only) would refuse. Types,
# maxlens (every pack maxlen re-checked <= the widget's /MaxLen), on_states,
# `relations` (the printed arithmetic is unchanged) and `identity_fields` are
# as in 2024. The DOR's own widget names are bound exactly as they ship —
# "21. 2022 Overpayment applied to 2023" is now TWO years stale on the face
# ("Amount of 2024 overpayment applied toward 2025") and remains the key.
#
# AUDIT + VISION. `scripts/audit_pack.py formpacks/states/va/2025/va760/
# pack.yaml` exits 0 against the pinned blank: 114 mapped lines, 114 fields
# written, 2 pages rendered at 170 dpi (1445 x 1870 px), `verify_fails: []`
# (115 entries, 114 lines: `account_type::savings` is the second option of
# the one "Account Type" /Btn, which the synthetic fill leaves off). Both
# renders were READ in halves, every sentinel against its printed row:
#   * Page 1 header — "Tess 0 / T / Tess 2" in the your-name row and "Tess 5
#     / T / Tess 7" in the spouse row (the spouse M.I. sits in the renamed
#     "Middle initial_spouse" box); the YOU Social Security Number comb on
#     PAGE 1 shows the your_ssn sentinel (the renamed "SSN 1"), the Spouse
#     comb its own; both "First 4 letters" boxes show T E S T one letter per
#     cell; address-change oval marked, "110 Synthetic Way", "Faketown 11",
#     state T12, ZIP 99513; You/Spouse birth dates fill all 8 cells across
#     the printed separators; both Deceased ovals marked; Locality T16; the
#     DMAS/VDSS/VHBE oval marked; all eight "Fill in all ovals that apply"
#     ovals marked, Reason Code T1, Amount claimed 101; Customer ID T18/T20
#     and both Issue Dates; Filing Status T, the federal-HOH oval, "Tess 23"
#     on the Spouse's Name rule. Exemption Section A reads 1 + T + T2 = T2,
#     X $930 = 112 and Section B T + T + T + T = T3, X $800 = 123 (dollar
#     boxes after the printed multipliers, not on the count cells).
#   * Page 1 lines — 134/145/156 on printed 1/2/3; line 4 You 167 + Spouse
#     178 = 189 in the right column; 200/211/222/233 on 5-8; 244 on 9 under
#     the "$11,950 / $23,900" note; 255/266/277/288/299/310 on 10-15. Exactly
#     six LOSS ovals are marked — lines 1, 3, 9, 13, 14, 15 — the set the
#     face prints, via the renamed "Loss 1" / "Loss 3" / "loss 9" / "loss
#     13" / "loss 14" / "loss 15" widgets. Negative check: the office-use
#     LAR / DLAR / DTD / LTD ovals, the "$______" rule and the 6-cell box at
#     the foot render EMPTY (page content, not widgets), and the preprinted
#     "1" in the Section-A You cell is untouched.
#   * Page 2 — the header "Social Security Number" comb shows the
#     page2_your_ssn sentinel (the NEW "SSN 2"); 321 on 16; on the line-17
#     row the inline "Enter Spouse's VAGI in box here" box shows 332 (key
#     "17") and the right-hand column 343 (key "17a"), with the "loss 17"
#     oval marked; then 354, 365, 376, 387, 398, 409, 420, 431, 442, 453,
#     464, 475, 486, 497, 508, 519, 530, 541, 552, 563 against printed 18,
#     19a, 19b, 20-36 in order. The three page-2 ovals sit on their own rows
#     (760C/760F on 32, no-sales-tax on 33, credit/debit on 35); "Account
#     Type" marks CHECKING with SAVINGS empty; routing (9), account (17),
