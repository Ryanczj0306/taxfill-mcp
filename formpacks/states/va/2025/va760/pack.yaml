#   * Page 2 also re-confirms the face deltas visually: "withheld for 2025",
#     "taxable year 2025", "Amount of 2024 overpayment applied toward 2025".
# After the comb flags were added the audit was re-run and the SSN / date
# combs re-read: digits only, one per cell, nothing in the printed separator
# gaps.
# WHAT THE AUDIT CAUGHT: nothing in the map. The one finding of this port is
# the renamed-and-moved "SSN 1" (see TOPOLOGY), caught by the census rect
# comparison before the first render and confirmed by it.
