  - { line: "preparer.phone", field: "Preparers phone number", type: text, maxlen: 10 }  # Preparer's phone number
relations:
  # Printed arithmetic of the 2025 face only. Dotted line ids are allowed in
  # relations (the 2023 banner's "cannot appear" predates that).
  - "d == a + b + c"          # Step 3 d "Total. Add lines a, b and c"
  - "4 == 2 + 3"              # 4 "Add lines 2 and 3. Do not include lines 1a through 1f"
  - "7 == 5 + 6"              # 7 "Total tax. Add lines 5 and 6"
  - "8 == d"                  # 8 "Total exemption credit amount from Step 3"
  - "11 == 8 + 9 + 10"        # 11 "Total Credits. Add lines 8, 9, and 10"
  - "12 == 7 - 11"            # 12 "BALANCE. Subtract line 11 from line 7"
  - "14 == 12 - 13"           # 14 "BALANCE. Subtract line 13 from line 12"
  - "16 == 14 - 15"           # 16 "BALANCE. Subtract line 15 from line 14"
  - "18 == 16 - 17"           # 18 "BALANCE. Subtract line 17 from line 16"
  - "20 == 18 + 19"           # 20 "Total state tax and local surtax. Add lines 18 and 19"
  - "21 == 21.fish_wildlife + 21.child_abuse"   # 21 the two contribution boxes, "Enter total here"
  - "22 == 20 + 21"           # 22 "TOTAL STATE TAX, LOCAL TAX, AND CONTRIBUTIONS. Add lines 20 and 21"
  - "30 == 23 + 24 + 25 + 26 + 27 + 28 + 29"   # 30 "Add lines 23 through 29"
  - "36 == 36a + 36b"         # 36 Penalty and Interest, "Enter total here"
  - "37 == 34 + 35 + 36"      # 37 "TOTAL AMOUNT DUE. ADD lines 34, 35, and 36"
  - "3 == s1.21"              # Schedule 1 line 21 "Enter here and IA 1040, line 3"
  # Schedule 1 line 12 "Add lines 1 through 11", per column: column A prints
  # boxes on lines 1, 2, 3, 9, 10, 11; column B on 1-9 and 11.
  - "s1.12a == s1.1a + s1.2a + s1.3a + s1.9a + s1.10a + s1.11a"
  - "s1.12b == s1.1b + s1.2b + s1.3b + s1.4b + s1.5b + s1.6b + s1.7 + s1.8 + s1.9b + s1.11b"
  - "s1.13 == s1.12a - s1.12b"   # 13 "Subtract line 12 column B from A"
  - "s1.20 == -(s1.14 + s1.15 + s1.16 + s1.17 + s1.18 + s1.19)"   # 20 "Add lines 14 through 19. Enter as a (negative) number"
  - "s1.21 == s1.13 + s1.20"     # 21 "Net Iowa modifications. Add lines 13 and 20"
  # Not declared: 31a / 34 (conditional on which of lines 22 and 30 is larger),
  # 32 (the refund may be less than 31a - 31b when part goes to line 33), and
  # 5 ("Multiply line 4 by 3.8% or amount from alternate tax calculation").
cross_form:
  # Step 4 cites the federal lines by number; every target is a line key of the
  # 2025 federal pack (f1040: 9, 10, 11a, 12e, 13a, 15; sched_1a: 37).
  - "1a == f1040.9"           # 1a "Federal total income from federal 1040, line 9"
  - "1b == f1040.10"          # 1b "Federal adjustments to income from federal 1040, line 10"
  - "1c == f1040.11a"         # 1c "Federal adjusted gross income from federal 1040, line 11a"
  - "1d == f1040.12e"         # 1d "Standard deduction or itemized deductions from federal 1040, line 12e"
  - "1e == f1040.13a"         # 1e "Qualified business income deduction from federal 1040, line 13a"
  - "1f == sched_1a.37"       # 1f "Enhanced Deduction for Seniors (personal exemption) from federal Schedule 1-A, line 37"
  - "2 == f1040.15"           # 2 "Federal taxable income from federal 1040, line 15"
identity_fields:
  - identifying_number
  - name.first
  - name.last
signature:
  page: 6
mailing:
  # Printed on page 6: "This return is due April 30, 2026. Sign, include
  # federal return, W-2s, and verify SSNs. MAILING ADDRESS: Iowa Income Tax
  # Document Processing PO BOX 9187, Des Moines IA 50306-9187 Make checks
  # payable to Iowa Department of Revenue" (one address, with or without payment).
  no_payment: "Iowa Income Tax Document Processing, PO Box 9187, Des Moines IA 50306-9187"
  with_payment: "Iowa Income Tax Document Processing, PO Box 9187, Des Moines IA 50306-9187 (make checks payable to Iowa Department of Revenue)"
  verify_url: https://revenue.iowa.gov
