# Iowa IA 1040 (41-001a, 08/16/2023) — 2023 Individual Income Tax Return.
#
# C3 resolution: Iowa's old tax.iowa.gov URLs 404'd, but revenue.iowa.gov
# publishes each year's IA 1040 in TWO variants behind a Form Options gateway
# — a flat print PDF (media/2746) and this FILLABLE AcroForm (media/2747,
# 5 pages, plain human-readable field names, no XFA). Normal pipeline.
#
# Mapping notes (verified against the printed face + sentinel audit):
# - The printed face says "Enter Dollars and Cents": every money line has a
#   separate 2-char cents box, mapped as <line>.cents text entries.
# - DOR field-name vs printed-face mismatch: the line-1 FIELD is named
#   "1 Federal adjusted gross income" but the printed line reads "Federal
#   total income" (federal 1040 line 9 figure); labels follow the FACE.
# - Field names contain literal periods (sentence-style, e.g. "11 Total
#   Credits. Add lines 8, 9, and 10") — the full dotted names are used
#   verbatim; Schedule 1's line 12/20 A and B totals are separate fields
#   (s1.12a/s1.12b, s1.20a/s1.20b). The printed "Subtract ... column B from
#   A" relations (s1.13, s1.21) are not encoded because dotted line ids
#   cannot appear in relation expressions.
# - Recycled checkbox export values are copied verbatim (e.g. the line-35
#   annualized-method box and the deceased boxes use on_state "/Savings",
#   the alternate-tax box uses "/Spouse over 65") — DOR artifacts.
