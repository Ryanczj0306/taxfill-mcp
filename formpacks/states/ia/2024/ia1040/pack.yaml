# Iowa IA 1040 (41-001) — 2024 Individual Income Tax Return.
#
# Mapping notes (verified against the printed face + sentinel audit):
# - Every money line has a separate 2-character cents widget to its right,
#   mapped as <line>.cents text entries.
# - Field names contain literal periods (e.g. "11 Total Credits. Add lines 8,
#   9, and 10") and are used verbatim. Several names are stale captions (see
#   above); labels and keys follow the FACE.
# - Schedule 1 column A = Additions, column B = Subtractions. Lines 7 and 8
#   print only a column-B box (keys s1.7 / s1.8, as in 2023); lines 15-21 print
#   one box each (lines 14 and 18 print RESERVED FOR FUTURE USE and have no
#   widget).
# - Recycled checkbox export values are copied verbatim from this blank's
#   /AP /N: the deceased boxes use /Savings, the alternate-tax box uses
#   "/Spouse over 65", the annualized-income box /2210 — DOR artifacts.
form: "IA 1040"
jurisdiction: states/ia
tax_year: 2024
source_url: https://revenue.iowa.gov/media/4090/download
pdf_sha256: "5d7589750974cb5651ee751a73f9de4cd08dd821610da39726efda9c5d5025e0"
