relations:
  # The printed arithmetic of the 2024 face, plus the two rules the face leaves
  # to the 2024 IA 1040 instructions (revenue.iowa.gov media/4152, sha256
  # 7257943544f063e3, fetched twice 2026-10-23): line 12's
  # zero floor and line 20's sum. Dotted line ids are allowed in relations
  # (the 2023 banner's "cannot appear" predates that).
  - "d == a + b + c"          # Step 3 d "Total. Add lines a, b and c"
  - "4 == 2 + 3"              # 4 "Add lines 2 and 3. Do not include lines 1a through 1e"
  - "7 == 5 + 6"              # 7 "Total tax. Add lines 5 and 6"
  # The Step 5 box "Check if using alternate tax (line 5), tax reduction
  # calculation (line 12), or low-income exemption. See instructions" (page 2,
  # key alt_tax_method) guards two relations (Phase K JK28, 2026-10-16): verify
  # reports each SKIPPED while the box is checked. Quotes are from the 2024 IA
  # 1040 Expanded Instructions (media/4152) and the 2024 Iowa Income Tax
  # Reduction Worksheet (41-146 (05/23/2024), revenue.iowa.gov media/4099).
  # 8 "Total exemption credit amount from Step 3"; Step 3 d (p.8): "Add the dollar
  # amounts and enter on Step 3, line d and on line 8." Guarded: line 25 (p.44),
  # "If you qualify for the low income exemption and are filing an Iowa return
  # only to claim a refund of the Iowa EITC, check the box between Steps 4 and 5.
  # Skip lines 5 through 19, enter zero on lines 20 and 22, and enter the amount
  # of your Iowa EITC on lines 25, 30, 31, and 32." That correct return leaves
  # line 8 blank beside a filled Step 3 d. Its blank lines 9-19 and zeros on 20
  # and 22 still satisfy every other relation over them (22 == 20 + 21 while
  # line 21 holds no check-off; 31a == max(30 - 22, 0) with the EITC on both),
  # so only 8 and 12 carry the guard.
  - "8 == d unless alt_tax_method"
  - "11 == 8 + 9 + 10"        # 11 "Total Credits. Add lines 8, 9, and 10"
  # 12 prints "BALANCE. Subtract line 11 from line 7"; the instructions (line
  # 12, p.18) read "Subtract line 11 from line 7. If less than zero, enter zero."
  # Lines 14, 16 and 18 carry no floor in the instructions either, so they stay
  # plain subtraction. Guarded: the same entry goes on, "Single taxpayers, who
  # are not claimed as a dependent on another person's Iowa tax return, may owe
  # less tax by using the Income Tax Reduction Worksheet (41-146)", and the
  # worksheet's line 5 reads "Compare lines 3 and 4. Enter the smaller number
  # here and on IA 1040, line 12. Check the box on IA 1040, step 5 if the amount
  # on line 3 is used". One box marks all three methods, so line 12 also goes
  # unchecked on an alternate-tax or low-income return, where the floor holds.
  - "12 == max(7 - 11, 0) unless alt_tax_method"
  - "14 == 12 - 13"           # 14 "BALANCE. Subtract line 13 from line 12"
  - "16 == 14 - 15"           # 16 "BALANCE. Subtract line 15 from line 14"
  - "18 == 16 - 17"           # 18 "BALANCE. Subtract line 17 from line 16"
  - "20 == 18 + 19"           # 20 "Total state tax and local surtax" (no arithmetic printed); instructions, line 20: "Add lines 18 and 19."
  - "21 == 21.fish_wildlife + 21.child_abuse"   # 21 the two contribution boxes, "Enter total here"
  - "22 == 20 + 21"           # 22 "TOTAL STATE TAX, LOCAL TAX, AND CONTRIBUTIONS. Add lines 20 and 21"
  - "30 == 23 + 24 + 25 + 26 + 27 + 28 + 29"   # 30 "Add lines 23 through 29"
  - "31a == max(30 - 22, 0)"  # 31a "If line 30 is more than line 22, subtract line 22 from line 30; otherwise, go to line 34"
  - "36 == 36a + 36b"         # 36 Penalty and Interest, "Enter total here"
  - "37 == 34 + 35 + 36"      # 37 "TOTAL AMOUNT DUE. ADD lines 34, 35, and 36"
  - "3 == s1.21"              # Schedule 1 line 21 "Enter here and IA 1040, line 3"
  # Schedule 1 line 12 "Add lines 1 through 11", per column: column A prints
  # boxes on lines 1, 2, 3, 9, 10, 11; column B on 1-9 and 11.
  - "s1.12a == s1.1a + s1.2a + s1.3a + s1.9a + s1.10a + s1.11a"
  - "s1.12b == s1.1b + s1.2b + s1.3b + s1.4b + s1.5b + s1.6b + s1.7 + s1.8 + s1.9b + s1.11b"
  - "s1.13 == s1.12a - s1.12b"   # 13 "Subtract line 12 column B from A"
  - "s1.20 == -(s1.15 + s1.16 + s1.17 + s1.19)"   # 20 "Add lines 14 through 19. Enter as a (negative) number" (14 and 18 are RESERVED, no boxes)
  - "s1.21 == s1.13 + s1.20"     # 21 "Net Iowa modifications. Add lines 13 and 20"
  # Not declared: 34, because on an amended return the instructions (lines 31b,
  # 33 and 34) add the excess of line 31b (plus line 33 after 12/31/2025) over
  # line 31a to the face's "subtract line 30 from line 22", so max(22 - 30, 0)
  # would fail a correct amended return; 32 (the refund may be less than
  # 31a - 31b when part goes to line 33); and 5 ("Iowa tax from tax rate
  # schedule or alternate tax"). The alternate tax replaces line 5's own amount
  # ("If you are using alternate tax calculation on IA 1040 in lieu of the tax
  # rate calculation, check the box in IA 1040, Step 5", p.12), so "7 == 5 + 6"
  # holds either way and is not guarded.
cross_form:
  # Step 4 cites the federal lines by number; every target is a line key of the
  # 2024 federal pack (f1040: 9, 10, 11, 12, 13, 15). Schedule 1 line 5 also
  # prints a federal reference ("Social Security benefits from federal 1040,
  # line 6(b)"; instructions, Schedule 1 line 5: "from federal form 1040, line
  # 6b"), but it is not declared: a cross_form ref splits at its first dot, so
  # the local id s1.5b would read as form key "s1", line "5b", and the engine
  # would skip the rule instead of checking it.
  - "1a == f1040.9"           # 1a "Federal total income from federal 1040, line 9"
  - "1b == f1040.10"          # 1b "Federal adjustments to income from federal 1040, line 10"
  - "1c == f1040.11"          # 1c "Federal adjusted gross income from federal 1040, line 11"
  - "1d == f1040.12"          # 1d "Standard deduction or itemized deductions from federal 1040, line 12"
  - "1e == f1040.13"          # 1e "Qualified business income deduction from federal 1040, line 13"
  - "2 == f1040.15"           # 2 "Federal taxable income from federal 1040, line 15"
identity_fields:
  - identifying_number
  - name.first
  - name.last
# Page-header mirrors (Phase K JK28, 2026-10-23). Pages 2-6 print "Taxpayer's Name" over "Taxpayers Name", ONE field
# with a widget on each of those pages (351.1-351.2 pt at ArialMT 10), apart from the page-1 Last Name / First Name /
# Middle Initial boxes, and no DOR script fills it (read on the 2024 blank rendered at 200 dpi). The caption is
# singular, beside "Taxpayer's SSN", so the header holds the primary filer's name. fill_form builds the mirror when
# the caller leaves it out (FillResult.mirrored) and verify_form checks it on disk (formpacks/CONVENTIONS.md,
# "Page-header mirrors (`mirrors`)").
mirrors:
  header.name: "{name.first} {name.mi} {name.last}"  # "Taxpayer's Name"
signature:
  page: 6
mailing:
  # Printed on page 6: "This return is due April 30, 2025. Sign, include
  # federal return, W-2s, and verify SSNs. MAILING ADDRESS: Iowa Income Tax
  # Document Processing PO BOX 9187, Des Moines IA 50306-9187 Make checks
  # payable to Iowa Department of Revenue" (one address, with or without payment).
  no_payment: "Iowa Income Tax Document Processing, PO Box 9187, Des Moines IA 50306-9187"
  with_payment: "Iowa Income Tax Document Processing, PO Box 9187, Des Moines IA 50306-9187 (make checks payable to Iowa Department of Revenue)"
  verify_url: https://revenue.iowa.gov
