  - { line: "phone", field: "Taxpayers phone number", type: text, maxlen: 10 }  # Taxpayer's phone number
  - { line: "email", field: "Taxpayers email", type: text }  # Taxpayer's email address
  - { line: "drivers_license", field: "Drivers license or ID Number", type: text }  # Your Driver License or State Issued ID number (optional)
  - { line: "spouse_drivers_license", field: "Spouse Drivers license or ID Number", type: text }  # Spouse's Driver License or State Issued ID number (optional)
  - { line: "preparer.date", field: "Preparer Signature date", type: text, maxlen: 8, comb: true }  # Preparer's Signature — Date (M M D D Y Y Y Y comb)
  - { line: "preparer.ptin", field: "Preparer's ID", type: text, maxlen: 9 }  # Preparer's PTIN, STIN, or SSN
  - { line: "preparer.fein", field: "Firms Federal Employer Identification Number (FEIN)", type: text, maxlen: 9 }  # Firm's FEIN
