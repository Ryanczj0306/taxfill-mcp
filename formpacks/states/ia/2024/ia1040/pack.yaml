# 33 NEW widgets (32 names), a RE-MAP. Every row was re-placed by position and
# printed label and then confirmed on a sentinel render of this blank.
#
# URL. https://revenue.iowa.gov/media/4090/download — the fillable "2024 IA
# 1040" (the DOR's flat print variant of the same return is media/4091, six
# pages and no fields). Two separate downloads on 2026-10-02 agree: sha256
# 5d7589750974…, 765,539 bytes, %PDF-1.7, AcroForm, no XFA, not encrypted.
# HTTP Last-Modified 08 Aug 2025; Content-Disposition "2024IA1040(41001).pdf"
# (the 2023 file is "2023IA1040(41001).pdf"); PDF ModDate 2024-10-24. The host
# serves the file to a scripted fetch, so no mirror_urls.
#
# PRINTED IDENTITY. Page 1 prints "2024 IA 1040 / Iowa Individual Income Tax
# Return"; pages 2-6 print "2024 IA 1040, Page N". Footer stamps: 41-001a
# (07/29/2024), 41-001b (07/29/2024), 41-001c (10/22/2024), 41-001d
# (07/29/2024), 41-001e (07/29/2024), 41-001f (07/29/2024).
# printed_year_verified = 2024.
#
# AcroForm topology. 6 pages / 247 widgets / 230 field names (2023: 5 / 231 /
# 217; 2025: 6 / 253 / 236). A field-level comparison with the 2025 blank finds
# no change of /FT, /Ff, /MaxLen, /DA, widget flags or /AP states on any of the
# 230 shared names, and no widget is ReadOnly. Every one of the 230 names is
# mapped. The only size change against 2025 is line 21: the Fish/Wildlife and
# Child Abuse Prevention boxes are 27.4 pt wide (2025: 15.8 / 15.1 pt; 2023:
# the same 27.4 pt), right-aligned Calibri 10, /MaxLen 4. A four-digit amount
# renders whole in both boxes on a render of this blank, so the pack maxlen
# stays 4 (the widget's own) and no TIGHTER_THAN_WIDGET row is needed. The pages:
#   page 1  Step 1-3, with two date-of-birth boxes and a HOH/QSS child-name row;
#   page 2  dependents (4 rows) + Step 4 lines 1a-4 + Step 5 lines 5-15;
#   page 3  lines 16-33;
#   page 4  lines 34-37;
#   page 5  IA 1040 Schedule 1;
#   page 6  Step 9 designee + Step 10 signatures.
# "Taxpayers Name" (header.name) is one field with a widget on each of pages
# 2-6; "Social Security Number (SSN)" is one field with the page-1 box and a
# "Taxpayer's SSN" header widget on each of pages 2-6. One write fills every
# widget of each; the SSN needs no mirror key, while header.name, a field of its
# own, is a declared mirror of the page-1 name since Phase K JK28 (2026-10-23). Blank geometry, measured on
# the sentinel render: on page 4 only, the DOR placed both header widgets
# about 10 pt right of their printed boxes (SSN widget 439.3-560.0 pt over a
# printed 9-cell comb at about 431-549 pt; name widget from 63.0 pt over a box
# starting about 52 pt), so the page-4 SSN digits straddle the cell dividers
# and the ninth prints just past the last cell. Pages 2 and 3 (widgets from
# 428.1 / 428.7 pt) and pages 5 and 6 (printed boxes moved right with their
# widgets) line up. The field is shared, so no pack key can move it.
#
# GONE against the 2023 pack (19 fields) and what took their place:
#   * widget "1 Federal adjusted gross income" (+cents), printed "1. Federal
#     total income" on the 2023 face — Step 4 line 1 is now five lines, 1a-1e,
#     each a NEW widget pair (federal 1040 lines 9, 10, 11, 12, 13).
#   * "21 Contributions - State Fair" and "- Firefighters/veterans" (+cents) —
#     line 21 now prints two boxes only, Fish/Wildlife and Child Abuse
#     Prevention. Their four lines are dropped.
#   * "31 If line 30 is more than line 22 ..." (+cents) — now 31a (NEW widget,
#     key 31a) plus the NEW amended-only 31b "Previous refunds".
#   * "35 check if annualized income method used" (2023 key 35a, one box) —
#     now ONE field with two kid widgets, on_states /2210 (beside "annualized
#     income (IA 2210AI)") and /2210F (beside "farmer/fisher (IA 2210F)"),
#     mapped as 35.annualized_income / 35.farmer_fisher, group 35_method.
#   * Schedule 1 "14 Federal income tax refund ...", "18 Federal tax paid for
#     prior years", "19A Other Adjustments", "20A Total modifications to
#     federal taxable income" and "22 Net Iowa Modifications" (each +cents) —
#     Schedule 1 was renumbered (below); lines 14 and 18 now print RESERVED
#     FOR FUTURE USE and carry no widget, so their keys s1.14 / s1.18 are not
#     carried forward.
# Against the 2025 pack the 6 GONE fields are 1f (Enhanced Deduction for
# Seniors, Schedule 1-A) and Schedule 1 lines 14 (529 plans) and 18 (farm
# tenancy), each +cents: this blank prints none of them.
# NEW widgets vs 2023, all mapped: Date of Birth / Spouse Date of Birth
# (8-cell combs); the HOH/QSS child Last Name / First Name ("Step 2: ...");
# the "If more than four dependents, check the box" box (/yes); a fourth
# dependent row; 1a-1e (+cents); 31a, 31b (+cents); the two line-35 method
# boxes; Schedule 1 3A/3B and 4B (+cents) and the two "Code:" boxes on lines
# 11 and 19.
#
# KEYS. Kept wherever the printed line kept its meaning. Changed vs 2023:
#   1 -> 1a..1e;  31 -> 31a (+ new 31b);  35a -> 35.annualized_income /
#   35.farmer_fisher;  spouse_net_income -> spouse_iowa_taxable_income (the
#   status-3 caption now reads "Spouse's Iowa taxable income"; 2023 "Spouse's
#   net income");  s1.19b -> s1.19 and s1.20a / s1.20b -> s1.20 (lines 19 and
#   20 now print ONE box each);  s1.14, s1.18 and s1.22 dropped.  s1.21 keeps
#   its key with a NEW meaning (2023: net modifications to federal taxable
#   income; now "Net Iowa modifications", the 2023 line 22). These keys are
#   the same ones the 2025 pack uses.
# 32a / 32b were typed money in 2023; they are text here, because a money line
# renders as an integer and would drop a routing number's leading zero. The
# 8-cell date boxes (fiscal year, birth, signature, death, preparer date) are
# comb: true and the six SSN rows (filer, spouse, dependents 1-4) comb: true +
# format ssn_digits_only, as the widgets' own comb flag and /MaxLen 8 / 9 are.
# The blank's other comb-flagged widgets (state, ZIP, county, school district,
# 32a / 32b, the three phones, preparer ID, FEIN) stay comb: false, as in the
# 2023 pack and every other pack's ZIP / phone / routing rows; their maxlen
# still holds each to its cell count, and the widget draws its own cells.
# Format scripts (a DOR artifact, display only): the School District Number
# widget carries /F + /K AFNumber_Format / AFNumber_Keystroke(0, 1, 0, 0, "",
# true), a number format, as do the three phone fields (harmless there). The
# filler writes the value as text and its own appearance shows it as written,
# but it also sets NeedAppearances, so a viewer that runs the format script
# while regenerating appearances (Acrobat) can show a district number with
# leading zeros (e.g. 0009) as 9 in the first cell. The field value itself
# keeps the zeros.
#
