  - name.first
  - name.last
  - identifying_number
  - mailing_address.street
  - mailing_address.city
  - mailing_address.state
  - mailing_address.zip
# Page-header mirrors (Phase K JK28, 2026-10-23). Pages 2-5 print "Name(s) shown on Form RI-1040 or RI-1040NR" and
# "Your social security number" over three fields each, PrimFirstName / PrimLastName / PrimTaxpayerSSN under their own
# PageN[0], which the XFA layer binds globally to the page-1 fields (read on the 2025 blank rendered at 200 dpi).
# taxfill writes the AcroForm layer only, so each copies its page-1 field. fill_form builds each mirror the caller
# leaves out from its page-1 source (FillResult.mirrored) and verify_form checks it on disk (formpacks/CONVENTIONS.md,
# "Page-header mirrors (`mirrors`)").
# The 2023 blank's own text layer holds the same caption text as the 2025 blank's around each mirror widget
# (compared per widget with pdfium, Phase K JK28, 2026-10-23).
mirrors:
  page2_name_first: "{name.first}"  # "Name(s) shown on Form RI-1040 or RI-1040NR" (page 2), its first-name field
  page2_name_last: "{name.last}"  # its last-name field
  page2_identifying_number: "{identifying_number}"  # "Your social security number"
  page3_name_first: "{name.first}"  # "Name(s) shown on Form RI-1040 or RI-1040NR" (page 3), its first-name field
  page3_name_last: "{name.last}"  # its last-name field
  page3_identifying_number: "{identifying_number}"  # "Your social security number"
  page4_name_first: "{name.first}"  # "Name(s) shown on Form RI-1040 or RI-1040NR" (page 4), its first-name field
  page4_name_last: "{name.last}"  # its last-name field
  page4_identifying_number: "{identifying_number}"  # "Your social security number"
  page5_name_first: "{name.first}"  # "Name(s) shown on Form RI-1040 or RI-1040NR" (page 5), its first-name field
  page5_name_last: "{name.last}"  # its last-name field
  page5_identifying_number: "{identifying_number}"  # "Your social security number"
signature: {page: 2}
mailing: null
