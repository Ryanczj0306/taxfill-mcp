relations:
  - "3 == 1 + 2"                         # "Modified Federal AGI. Combine lines 1 and 2"
  - "9d == 9a + 9b + 9c"                 # "Total RI credits. Add lines 9a, 9b and 9c"
  - "13a == 10a + 10b + 11 + 12a + 12b"  # "TOTAL RI TAX ... Add lines 10a, 10b, 11, 12a and 12b"
  - "14g == 14a + 14b + 14c + 14d + 14e + 14f"  # "TOTAL PAYMENTS AND CREDITS. Add ..."
  - "14i == 14g - 14h"                   # "NET PAYMENTS. Subtract line 14h from line 14g"
  - "15c == 15a + 15b"                   # "TOTAL AMOUNT DUE. Add lines 15a and 15b"
  - "21 == 20 * 0.25"                    # "Tentative allowable federal credit. Multiply line 20 by 25% (0.2500)"
  - "22 == min(19, 21)"                  # "MAXIMUM CREDIT. Line 19 or 21, whichever is SMALLER"
  - "29 == min(23, 27, 28)"              # "MAXIMUM TAX CREDIT. Line 23, 27 or 28, whichever is the SMALLEST"
  - "38 == 30 + 31 + 32 + 33 + 34 + 35 + 36 + 37"  # "TOTAL CONTRIBUTIONS. Add lines 30 through 37"
  # Schedule W line 16 "Total RI Income Tax Withheld. Add lines 1 through 15, Col. E"
  - "schedule_w.16 == schedule_w.1.ri_withheld + schedule_w.2.ri_withheld + schedule_w.3.ri_withheld + schedule_w.4.ri_withheld + schedule_w.5.ri_withheld + schedule_w.6.ri_withheld + schedule_w.7.ri_withheld + schedule_w.8.ri_withheld + schedule_w.9.ri_withheld + schedule_w.10.ri_withheld + schedule_w.11.ri_withheld + schedule_w.12.ri_withheld + schedule_w.13.ri_withheld + schedule_w.14.ri_withheld + schedule_w.15.ri_withheld"
