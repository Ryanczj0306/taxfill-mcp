# ===========================================================================
# TY2025 PORT (2026-10-02, Phase J JS5) of formpacks/states/ri/2024/ri1040/pack.yaml.
# Triaged PORTABLE: every widget the 2024 pack maps survives at the same name,
# page and /Rect; 22 of them changed flags (below), none moved, none is gone,
# and the blank adds no widget.
#
# URL AND DIGEST. source_url is the file the Division of Taxation's Personal
# Income Tax Forms page links as "RI-1040 Resident Income Tax Return (2025)"
# (read in the Wayback capture of 2026-03-17, because the live page answers
# scripted fetches with a bot check), and the URL knowledge/states/ri/2025.yaml
# cites. The 2024 file sat under /files/2024-12/, the 2025 one under
# /files/2026-01/.
# Two separate downloads on 2026-10-02 each returned HTTP 200
# application/pdf, 9,567,972 bytes, Last-Modified Fri, 02 Jan 2026 13:34:18
# GMT, magic "%PDF-1.6", and the same sha256 (pinned below) — the digest two
# earlier discovery downloads (2026-09-30) also produced. pdfinfo: 5 pages,
# "Form: XFA", title "RI-1040 with RI Schedules W and E", ModDate 2026-01-02.
#
# PRINTED IDENTITY (read from this blank's own text layer before pinning):
# page 1 "State of Rhode Island Division of Taxation / 2025 Form RI-1040 /
# Resident Individual Income Tax Return"; pages 2-3 "2025 Form RI-1040"; page 4
# "2025 RI Schedule W"; page 5 "2025 RI Schedule E"; scanline barcodes
# 25100199990101 (p1), 25100199990102 (p2), 25100199990103 (p3),
# 25101099990101 (Schedule W), 25105999990101 (Schedule E) — each "25" where
# the 2024 blank reads "24"; page-2 footer "Revised 07/2025" (2024: "Revised
# 09/2024"). printed_year_verified = 2025.
#
# TOPOLOGY (a widget census against the 2024 pack, then a field-level dump of
# every widget in both blanks, walking /Parent). 329 named fields = 323
# terminal (307 /Tx + 16 /Btn) + 6 parents; 323 widget annotations, per page
# 66 / 52 / 47 / 96 / 62 — all identical to 2024. Of the 252 mapped widgets,
# 230 are unchanged in every attribute and 22 CHANGED; zero GONE, zero MOVED,
# zero NEW. No /DA, /Rect, /Q, /F or /AP changed anywhere. The 22 changes are
# one and the same edit: each widget LOST its /MaxLen and GAINED /Ff 8388608
# (DoNotScroll). In the XFA template the field's `<value><text maxChars="N"/>`
# became `<textEdit hScrollPolicy="off">` (maxChars count 228 -> 206,
# hScrollPolicy="off" 82 -> 104), i.e. the DOR now limits these boxes to their
# visible area instead of a character count — the scheme the page-1 name
# widgets already used in 2024. The 22, all Courier New 12 (/CourierNewPSMT
# 12 Tf, 7.2 pt per glyph):
#   * Page2 PrimTaxpayerLicenseNumber / SecTaxpayeLicenseNumber (was /MaxLen
#     9; box 108.0 pt);
#   * Page4 and Page5 PrimLastName, the Schedule W / E name-banner mirrors (was
#     26; box 194.4 pt);
#   * Page5 Relationship-1 .. Relationship-13, Schedule E column (D) (was 9;
#     box 79.2 pt);
#   * Page5 SummaryLine3 / 4a / 4b / 4c / 5, the Schedule E counts (was 10;
#     box 72.0 pt, right-aligned /Q 2).
# ADJUDICATION: with no /MaxLen left, test_pack_maxlen has no widget count to
# hold these lines to, and verify's Courier width check (0.6 em x 12 pt = 7.2
# pt per glyph against the box) passes a value whose glyphs exactly fill the
# box. A fill rendered at scale 4 and 8 shows that is one glyph too many: the
# widget's inner padding cuts the last glyph — a 27-letter banner last name
# ending in W (194.4 pt), a 15-character licence number ending in W (108.0 pt)
# and an 11-letter relationship (79.2 pt) each lose the right half of their
# final letter, while 26 / 14 / 10 characters ending in W render whole. So the
# pack keeps a maxlen at the count the render shows fits: page4_name_last /
# page5_name_last 26 (the 2024 /MaxLen), signature.taxpayer / signature.spouse
# license_number 14 (2024: 9, which would refuse an out-of-state licence
# number the box now takes) and the 13 schedule_e.dependent_N.relationship 10
# (2024: 9). The five Schedule E counts carry none, as in 2024. None of the 22
# is ReadOnly, so verify's width check scans every one of them as well.
#
# READONLY (pitfall P-007). Exactly six widgets carry /Ff bit 1, the same six
# as 2024: Page2[0] and Page3[0] PrimFirstName / PrimLastName (/Ff 8388609)
# and PrimTaxpayerSSN (/Ff 1). The template still gives the page-2/3 instances
# access="protected" (the page-4/5 ones none) and every mirror a
# <bind match="global"/>, so they remain the class-4 identity banner mirrors
# (taxfill never runs the XFA binding, so an unmapped mirror files blank) and
# stay mapped: mapped ∩ ReadOnly = 6.
#
# CHECKBOXES. All 16 /Btn on-states re-dumped from this blank's /AP /N: "/X"
# for the 13 page-1 boxes and Page2 ContactPreparer, "/1" for the two
# Schedule E boxes — unchanged.
#
# FACE DELTAS (a diff of the printed text of all five pages against the 2024
# blank; the printed words did not move — median shift 0.0 pt on every page).
# NO printed line was renumbered, added or removed on any page, and every
# line caption the map quotes is unchanged except:
#   * page 1 line 1 "Federal AGI from Federal Form 1040 or 1040-SR, line 11a"
#     (2024: "line 11") — so the cross_form leg is now f1040.11a, the line the
#     2025 Form 1040 prints AGI on;
#   * page 1 standard-deduction chart Single $10,900 / Married filing jointly
#     or Qualifying widow(er) $21,800 / Married filing separately $10,900 /
#     Head of household $16,350 (2024: $10,550 / $21,150 / $10,575 / $15,850);
#     line 4 and line 6 thresholds "over $254,250" (2024: $246,450); line 6
#     "multiply by $5,100" (2024: $4,950);
#   * page 2 line 14a "RI 2025 income tax withheld ... attach Sch. W", line
#     14b "2025 estimated tax payments and amount applied from 2024 return",
#     line 18 "applied to 2026 estimated tax";
#   * page 3 line 39 "Federal earned income credit from Federal Form 1040 or
#     1040-SR, line 27a" (2024: "line 27"); line 40 still prints "16%";
#   * page 4 Schedule W Reference Chart re-ordered with a NEW row "1099-DA /
#     A / 16", so the Column B letter-code set grows from 13 to 14 codes.
# Every figure above was checked against knowledge/states/ri/2025.yaml, which
# records the same $10,900 / $21,800 / $10,900 / $16,350, $5,100, $254,250
# and 16% — no mismatch.
#
# VISION AUDIT: scripts/audit_pack.py against the pinned blank — 248 of the
# 252 mapped lines filled with distinct sentinels (the 4 unfilled are the
# non-selected options of the 5-box filing_status group), 252 fields written,
# 5 pages rendered at 170 dpi, verify returned ZERO FAILs, and all five
# pages were READ: 248/248 sentinels sit in the box of the printed line their
# key names (44 on page 1, 36 on page 2, 26 on page 3, 80 on page 4, 62 on
# page 5). That covers all four identity banners (pages 2-5, each with a
# nine-digit unclipped SSN), the page-3 ladder 30-38 and Schedule EIC 39 / 41
# (printed line 40 shows the DOR's "16%" and no sentinel), the 15 Schedule W
# rows across Columns A-E, the 13 Schedule E dependent rows and the five
# Schedule E counts. The four unselected filing-status boxes were placed from
# their /Rect against the printed labels (each box sits right of its own
# label: Single, Married filing jointly, Married filing separately, Head of
# household, Qualifying widow(er)).
#
# SPECIFIC PARTY. specific_party.name (Page1 SpecificParty, no /MaxLen in
# either year, 75.5 pt, Courier 12) carried the 2024 pack's maxlen 12. The
# render cuts an 11th glyph (and verify FAILs it); 10 W render whole. Its
# maxlen is 10 here. The 2023 and 2024 packs still say 12.
#
# DEPENDENT DATE OF BIRTH. The face prints only "(C) Date of Birth"; the XFA
# template gives DOB-1 .. DOB-13 the picture date{MMDDYYYY}, so the pack
# carries maxlen 8 (digits, no slashes — a slashed date overflows the 57.6 pt
# box). Eight Courier-12 glyphs fill the box exactly, and the render cuts the
# right edge of the eighth digit: UNRESOLVED, since no 8-digit date fits whole
# and the face names no shorter format.
# ===========================================================================
# Form RI-1040, 2025 -- Rhode Island Resident Individual Income Tax Return.
#
# Provenance: blank downloaded from the official source_url below
# (tax.ri.gov 2025_1040WE_w.pdf); see URL AND DIGEST and PRINTED IDENTITY in the
# port banner above. printed_year_verified = 2025 BEFORE pinning pdf_sha256.
#
# Layout. XFA-style nested AcroForm: acroform_root is "topmostSubform[0]" and
# every field's fully-qualified name is "topmostSubform[0].PageN[0].<leafname>"
# (verified via pypdf get_fields() -- 329 named fields; all carry a /Parent chain
# under the PageN[0] subform of the page they sit on). The introspect sweep PNGs
# show only the LEAF /T (e.g. "TotalRITax[0]"); the page-subform prefix is the
# real disambiguator. Three leaf names recur on two pages each and are GENUINELY
# DISTINCT fields thanks to the page prefix: TotalRITax (Page1 line 13a vs Page2
# line 13b), RIIncomeTax (Page1 line 8 vs Page3 line 19), ModifiedFedAGI (Page1
# line 3 vs Page3 line 25) -- each mapped twice with its correct PageN[0]. prefix.
# The header name/SSN widgets (PrimFirstName, PrimLastName, PrimTaxpayerSSN) are
# REPEATED on pages 2-5 as the "Name(s) shown" carry-over banner; each repeat is a
# DISTINCT field under its own PageN[0] with its own /V, so all TWELVE are mapped
# on top of the page-1 identity fields, under the house `page<N>_*` mirror keys
# (NJ page2_ssn / VA page2_your_ssn / WI page2_your_last_name are the precedent,
# and WI's is the mirror P-007 itself cites). Exactly three per page — a sweep of
# every widget in the banner band of pages 2-5 (bottom edge above y=665) finds
# PrimFirstName / PrimLastName / PrimTaxpayerSSN and nothing else on the 2025
# blank, so there is no spouse mirror and the mapped banner is complete. Six of the twelve (pages 2 and 3) carry the
# AcroForm ReadOnly bit and six (pages 4 and 5) do not, on the identical printed
# banner row; the READONLY ADJUDICATION in the port banner above proves that
# split is a LiveCycle access="protected" artifact (the 2024 port proved it; the
# 2025 template keeps the same attributes) and maps all twelve uniformly as P-007
# class 4.
#
# This 5-page PDF is the FILED RETURN plus its directly-attached schedules:
#   page 1 -- RI-1040 front: header (names, two SSNs, address, city of legal
#             residence), flags (primary/spouse deceased, new address, amended),
#             electoral contribution Yes, specific-party checkbox + party name,
#             filing status (5 boxes), lines 1-13a (AGI, modifications, RI std
#             deduction, exemptions, taxable income, RI tax, credits 9a-9d, tax
#             after credits 10a-10b, checkoff contributions 11, use/sales tax 12a
#             + use-tax-accurate certify box, individual mandate penalty 12b +
#             full-year-coverage certify box, total RI tax 13a).
#   page 2 -- RI-1040 back: 13b carry, payments 14a-14f, total payments 14g,
#             previously issued overpayments 14h, net payments 14i, amount due
#             15a-15c, overpaid 16, refund 17, applied-to-2026 18, signature
#             block (driver license numbers/states/dates/phones, paid preparer
#             block, contact-preparer YES box).
#   page 3 -- attached schedules: RI Schedule I (allowable federal credit, lines
#             19-22), RI Schedule II (credit for tax paid to another state, lines
#             23-29), RI Checkoff Contributions Schedule (lines 30-38, the 2024
#             revision inserting line 37 "Behavioral health education, training,
#             and coordination fund RIGL 44-30-2.12" and moving the total to 38),
#             RI Schedule EIC (lines 39-41).
#   page 4 -- RI Schedule W (withholding): 15 rows of Col A spouse flag / Col B
#             letter code / Col C payer name / Col D fed ID / Col E RI withheld,
#             line 16 total, line 17 count of W-2s/1099s.
#   page 5 -- RI Schedule E (exemption schedule): 1a/1b yourself/spouse boxes,
#             13 dependent rows (name/SSN/DOB/relationship), summary lines 3-5.
#
# Money vs text. Each numbered dollar line on pages 1-3 ships as a PAIR of
# widgets: the dollars field (rect x 454-533, maxlen 10) and a separate 2-digit
# cents box (the "-00" / "-00[0]" suffixed widget, rect x 533-554, maxlen 2). The
# dollars field is mapped `money`; the cents companion widgets are EXCLUDED (they
# are the printed ".00" cents portion, not an independent data line -- mapping
# both would double-fill one printed amount). The 2024 revision's two NEW page-3
# widgets follow the same pattern, so BehavioralHealth[0] is mapped `money` as
# line 37 and BehavioralHealth-00[0] is EXCLUDED as its cents companion. The
# same pattern holds for the
# 9a/9b/9c sub-credit fields (dollars at x 331-410, cents "-00" at x 410-432).
# Schedule W Col E withholding rows are likewise dollars + 2-digit cents pairs.
# SSN fields are mapped `text` comb format ssn_digits_only (single 9-digit comb
# box, maxlen 9). State codes / letter codes / counts stay `text`.
#
# Checkboxes. Filing status (5 separate single-state /Btn, on_state "/X"),
# deceased/new-address/amended flags, electoral Yes, specific-party, use-tax
# certify, individual-mandate full-coverage certify, contact-preparer YES are
# each their OWN independent single-state /Btn ("/X" on pg 1-2). Schedule E
# yourself/spouse boxes are single-state /Btn on_state "/1". No /Btn field is
# shared across two printed controls, so no shared groups are forced; filing
# status options nonetheless share group filing_status per house style (distinct
# fields, distinct on_state, one group) -- harness only FORCES a shared group when
# widgets share a /T, which these do not, so they are mapped as independent
# checkboxes each carrying group filing_status.
#
# Relations. Only single-box on-face arithmetic with every operand mapped:
#   3  == 1 + 2     ("Combine lines 1 and 2")
#   9d == 9a+9b+9c  ("Add lines 9a, 9b and 9c")
#   14g == 14a+14b+14c+14d+14e+14f ("Add lines 14a, 14b, 14c, 14d, 14e and 14f")
#   14i == 14g - 14h ("Subtract line 14h from line 14g")
#   13a == 10a+10b+11+12a+12b ("Add lines 10a, 10b, 11, 12a and 12b")
#   15c == 15a + 15b ("TOTAL AMOUNT DUE. Add lines 15a and 15b")
#   21 == 20 * 0.25 ("Multiply line 20 by 25% (0.2500)")
#   22 == min(19, 21) ("Line 19 or 21, whichever is SMALLER")
#   29 == min(23, 27, 28) ("Line 23, 27 or 28, whichever is the SMALLEST")
#   38 == 30+31+32+33+34+35+36+37 ("Add lines 30 through 37")
#   schedule_w.16 == the 15 rows' Column E ("Add lines 1 through 15, Col. E")
#   41 == 39 * 40 -- OMITTED (40 is the printed constant 16%, not a mapped line).
#   27 == 23 * 26 -- OMITTED (26 is a text ratio line, not money).
#   Schedule E 5 == 3 + 4a + 4b + 4c -- OMITTED (counts are text lines; relations
#   are arithmetic over money lines).
# Lines that floor at zero ("if zero or less, enter 0": 5, 7, 10a) or branch on a
# larger-than comparison (15a, 16) are OMITTED per house style.
#
# Cross_form. Page 1 line 1 prints "Federal AGI from Federal Form 1040 or
# 1040-SR, line 11a" -- federal AGI = f1040.11a (the 2025 Form 1040 prints AGI
# on line 11a; the 2024 face read "line 11").
form: "RI-1040"
jurisdiction: states/ri
tax_year: 2025
source_url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2026-01/2025_1040WE_w.pdf
pdf_sha256: "ac024a0d865fd08ca8cc6a907ae78b0aa74a3f3bd3b6c35d845f4294ba4d9f52"
acroform_root: "topmostSubform[0]"
fields:
  # ============================================ page 1 -- header (name / address)
  - line: name.first                     # "Your first name"
    field: Page1[0].PrimFirstName[0]
    type: text
  - line: name.middle_initial            # "MI"
    field: Page1[0].PrimMidInitial[0]
    type: text
    maxlen: 1
  - line: name.last                      # "Last name"
    field: Page1[0].PrimLastName[0]
    type: text
  - line: name.suffix                    # "Suffix"
    field: Page1[0].Suffix[0]
    type: text
    maxlen: 3
  - line: spouse.name.first              # "Spouse's name"
    field: Page1[0].SecFirstName[0]
    type: text
  - line: spouse.name.middle_initial     # "MI"
    field: Page1[0].SecMidInitial[0]
    type: text
    maxlen: 1
  - line: spouse.name.last               # "Last name"
    field: Page1[0].SecLastName[0]
    type: text
  - line: spouse.name.suffix             # "Suffix"
    field: Page1[0].Suffix[1]
    type: text
    maxlen: 3
  - line: identifying_number             # "Your social security number" (9-digit comb)
    field: Page1[0].PrimTaxpayerSSN[0]
    type: text
    comb: true
    format: ssn_digits_only
    maxlen: 9
  - line: spouse.identifying_number      # "Spouse's social security number" (9-digit comb)
    field: Page1[0].SecTaxpayerSSN[0]
    type: text
    comb: true
    format: ssn_digits_only
    maxlen: 9
  - line: mailing_address.street         # "Address"
    field: Page1[0].AddressLine1[0]
    type: text
  - line: mailing_address.city           # "City, town or post office"
    field: Page1[0].City[0]
    type: text
  - line: mailing_address.state          # "State"
    field: Page1[0].State[0]
    type: text
    maxlen: 2
  - line: mailing_address.zip            # "ZIP code"
    field: Page1[0].ZipCode[0]
    type: text
    maxlen: 5
  - line: city_town_legal_residence      # "City or town of legal residence"
    field: Page1[0].CityTownLegalResidence[0]
    type: text

  # ---- header flags
  - line: primary_deceased.yes           # "Primary deceased?"
    field: Page1[0].PrimaryDeceased[0]
    type: checkbox
    on_state: /X
  - line: spouse_deceased.yes            # "Spouse deceased?"
    field: Page1[0].SpouseDeceased[0]
    type: checkbox
    on_state: /X
  - line: new_address.yes                # "New address?"
    field: Page1[0].NewAddress[0]
    type: checkbox
    on_state: /X
  - line: amended_return.yes             # "Amended Return?"
    field: Page1[0].AmendedReturn[0]
    type: checkbox
    on_state: /X
  - line: electoral_contribution.yes     # "ELECTORAL CONTRIBUTION ... check here ... Yes"
    field: Page1[0].ElectoralContribution[0]
    type: checkbox
    on_state: /X
  - line: specific_party.yes             # "...be paid to a specific party, check the box"
    field: Page1[0].SpecificPartyChkBx[0]
    type: checkbox
    on_state: /X
  - line: specific_party.name            # "...fill in the name of the political party" (no /MaxLen; 75.5 pt box, 10 glyphs render whole)
    field: Page1[0].SpecificParty[0]
    type: text
    maxlen: 10

  # ---- filing status (5 separate single-state /Btn, each its own option)
  - line: filing_status.single          # "Single"
    field: Page1[0].StateFilingStatus_S[0]
    type: checkbox
    on_state: /X
    group: filing_status
  - line: filing_status.married_filing_jointly   # "Married filing jointly"
    field: Page1[0].StateFilingStatus_J[0]
    type: checkbox
    on_state: /X
    group: filing_status
  - line: filing_status.married_filing_separately # "Married filing separately"
    field: Page1[0].StateFilingStatus_M[0]
    type: checkbox
    on_state: /X
    group: filing_status
  - line: filing_status.head_of_household        # "Head of household"
    field: Page1[0].StateFilingStatus_H[0]
    type: checkbox
    on_state: /X
    group: filing_status
  - line: filing_status.qualifying_widow         # "Qualifying widow(er)"
    field: Page1[0].StateFilingStatus_W[0]
    type: checkbox
    on_state: /X
    group: filing_status

  # ---- page 1 income/tax/credit lines (dollars field mapped; "-00" cents box excluded)
  - line: "1"                            # "Federal AGI from Federal Form 1040 or 1040-SR, line 11a"
    field: Page1[0].AGI[0]
    type: money
  - line: "2"                            # "Net modifications to Federal AGI from RI Sch M, line 3"
    field: Page1[0].NetMods[0]
    type: money
  - line: "3"                            # "Modified Federal AGI. Combine lines 1 and 2"
    field: Page1[0].ModifiedFedAGI[0]
    type: money
  - line: "4"                            # "RI Standard Deduction from left. If line 3 is over $ 254,250 see Standard Deduction Worksheet"
    field: Page1[0].RIStandardDeduction[0]
    type: money
  - line: "5"                            # "Subtract line 4 from line 3. If zero or less, enter 0"
    field: Page1[0].FedAGIAfterDed[0]
    type: money
  - line: "6.count"                      # "# of exemptions from RI Sch E, line 5"
    field: Page1[0].NumFedExemptions[0]
    type: text
    maxlen: 2
  - line: "6"                            # "... multiply by $5,100 and enter result on line 6" (2024 form: $4,950)
    field: Page1[0].RIExemptionAmount[0]
    type: money
  - line: "7"                            # "RI TAXABLE INCOME. Subtract line 6 from line 5"
    field: Page1[0].RITaxableIncome[0]
    type: money
  - line: "8"                            # "RI income tax from Rhode Island Tax Table or Tax Computation Worksheet"
    field: Page1[0].RIIncomeTax[0]
    type: money
  - line: 9a                             # "RI percentage of allowable Federal credit from page 3, RI Sch I, line 22"
    field: Page1[0].RIFederalCredit[0]
    type: money
  - line: 9b                             # "RI Credit for income taxes paid to other states from page 3, RI Sch II, line 29"
    field: Page1[0].RICreditPaidToOtherStates[0]
    type: money
  - line: 9c                             # "Other Rhode Island Credits from RI Schedule CR, line 9"
    field: Page1[0].OtherRICredits[0]
    type: money
  - line: 9d                             # "Total RI credits. Add lines 9a, 9b and 9c"
    field: Page1[0].TotalRICredits[0]
    type: money
  - line: 10a                            # "Rhode Island income tax after credits. Subtract line 9d from line 8"
    field: Page1[0].RIIncomeTaxAfterCredit[0]
    type: money
  - line: 10b                            # "Recapture of Prior Year Other Rhode Island Credits from RI Schedule CR, line 12"
    field: Page1[0].RecaptureofPriorYear[0]
    type: money
  - line: "11"                           # "RI checkoff contributions from page 3, RI Checkoff Schedule, line 38"
    field: Page1[0].RIContributions[0]
    type: money
  - line: 12a                            # "USE/SALES tax due from RI Schedule U, line 4 or line 8"
    field: Page1[0].UseSalesTaxDue[0]
    type: money
  - line: 12a.certify                    # "Check to certify use tax amount on line 12a is accurate"
    field: Page1[0].UseTax[0]
    type: checkbox
    on_state: /X
  - line: 12b                            # "Individual Mandate Penalty"
    field: Page1[0].MandatePenalty[0]
    type: money
  - line: 12b.certify                    # "Check to certify full year coverage"
    field: Page1[0].IndMandate[0]
    type: checkbox
    on_state: /X
  - line: 13a                            # "TOTAL RI TAX AND CHECKOFF CONTRIBUTIONS. Add lines 10a, 10b, 11, 12a and 12b"
    field: Page1[0].TotalRITax[0]
    type: money

  # ============================================ page 2 -- payments / refund / due
  # ---- page 2 identity banner mirror (P-007 class 4). Printed above the widgets:
  # "Name(s) shown on Form RI-1040 or RI-1040NR" | "Your social security number".
  # XFA <bind match="global"/> propagates these from the page-1 data node in a
  # viewer; taxfill writes the AcroForm layer only, so unmapped means BLANK on the
  # filed page. These three are the /Ff 8388609 / 1 ReadOnly ones (access=
  # "protected" in the template) -- mapped deliberately; see the port banner.
  - line: page2_name_first
    field: Page2[0].PrimFirstName[0]
    type: text
  - line: page2_name_last
    field: Page2[0].PrimLastName[0]
    type: text
  - line: page2_identifying_number
    field: Page2[0].PrimTaxpayerSSN[0]
    type: text
    comb: true
    format: ssn_digits_only
    maxlen: 9

  - line: 13b                            # "TOTAL RI TAX AND CHECKOFF CONTRIBUTIONS from line 13a"
    field: Page2[0].TotalRITax[0]
    type: money
  - line: 14a                            # "RI 2025 income tax withheld from RI Schedule W, line 16"
    field: Page2[0].RIWithholding[0]
    type: money
  - line: 14b                            # "2025 estimated tax payments and amount applied from 2024 return"
    field: Page2[0].EstimatedTaxPayments[0]
    type: money
  - line: 14c                            # "Property tax relief credit from RI-1040H, line 13"
    field: Page2[0].PropertyTaxReliefCredit[0]
    type: money
  - line: 14d                            # "RI earned income credit from page 3, RI Schedule EIC, line 41"
