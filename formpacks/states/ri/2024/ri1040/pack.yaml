# THE PROPAGATION MECHANISM, re-established from this blank rather than
# assumed (the earlier revision of this pack guessed "form JavaScript" and
# then argued itself out of the class-4 action; both halves were wrong):
#   * The blank is a LiveCycle XFA form. Its /AcroForm carries /XFA with the
#     usual packet array (xdp:xdp, config, template 109,960 bytes, datasets,
#     localeSet, PDFSecurity, xmpmeta, xfdf, form).
#   * Parsing the template packet as XML: the page-1 originals AND all twelve
#     page-2..5 mirrors — fifteen <field> elements named PrimFirstName /
#     PrimLastName / PrimTaxpayerSSN across subforms Page1[0]..Page5[0] —
#     each carry exactly one child <bind match="global"/>, and NOT ONE of the
#     fifteen contains a <script> element. So the propagation is DECLARATIVE
#     XFA global data binding, not literal JavaScript: match="global" resolves
#     a field to a same-named data node anywhere in the data DOM, so all five
#     PrimFirstName fields bind to ONE PrimFirstName node and the viewer
#     paints the banner on every page from it.
#   * The flag asymmetry has the same origin. The six template fields under
#     Page2[0] and Page3[0] additionally carry access="protected"; the six
#     under Page4[0]/Page5[0] carry no access attribute at all (XFA default
#     "open"). LiveCycle emits access="protected" as the AcroForm ReadOnly
#     bit — which is EXACTLY the observed split (/Ff 8388609 and 1 on pages
#     2-3; /Ff 8388608 and 0 on pages 4-5). RI's inconsistency across its own
#     five pages is therefore an authoring consequence of a per-page access
#     attribute, and says nothing about whether the row is return data. All
#     four pages print the identical caption pair, each above its own three
#     widgets, and each page carries its own scanline barcode.
#   * taxfill writes the AcroForm layer and never runs the XFA binding
#     engine, so nothing propagates. PROVEN, not reasoned: an audit fill of
#     this pack BEFORE the twelve were mapped — page-1 identity sentinels
#     written and the whole form rendered at 170 dpi — showed the "Name(s)
