  - { line: amended_return, field: AMMEND, type: checkbox, on_state: /Yes }
  - { line: nol_carryback, field: NOL, type: checkbox, on_state: /Yes }
  # ---- name / suffix (the 2025 widgets carry no /MaxLen; each maxlen <= rect width / 7.2 pt at the "/CoBo 12 Tf" Courier metric)
  - { line: name.first, field: PRMFN, type: text, maxlen: 20 }           # 148.1 pt holds 20 (page-9 echo kid 105.4 pt = 14, see banner)
  - { line: name.middle_initial, field: PRMMN, type: text, maxlen: 1 }
  - { line: name.last, field: PRMLN, type: text, maxlen: 16 }            # 119.1 pt / 7.2 = 16 (2024's /MaxLen 19 is gone; 19 rendered cut)
  - { line: name.suffix, field: PRMSFX, type: text, maxlen: 3 }          # 26.2 pt holds 3
  - { line: spouse.name.first, field: SPOFN, type: text, maxlen: 20 }    # 148.1 pt holds 20
  - { line: spouse.name.middle_initial, field: SPOMN, type: text, maxlen: 1 }
  - { line: spouse.name.last, field: SPOLN, type: text, maxlen: 16 }     # 119.1 pt / 7.2 = 16
  - { line: spouse.name.suffix, field: SPOSFX, type: text, maxlen: 3 }   # 26.2 pt holds 3
  # ---- address
  - { line: mailing_address.street, field: STADDR, type: text, maxlen: 30 }   # 227.5 pt holds 31
  - { line: mailing_address.unit_type, field: UT, type: text, maxlen: 5 }     # 40.3 pt / 7.2 = 5.6 -> 5 (2024's /MaxLen 6 is gone; 6 rendered cut both ends, the box is centre-quadded)
  - { line: mailing_address.unit_number, field: UN, type: text, maxlen: 5 }   # 40.3 pt holds 5
  - { line: mailing_address.city, field: CITY, type: text, maxlen: 25 }       # 225.9 pt holds 31
  - { line: mailing_address.state, field: STATE, type: text, maxlen: 2 }
  - { line: mailing_address.zip, field: ZIPCD, type: text, maxlen: 5 }  # Courier Bold 12 in a 54.5 pt box — ZIP only, no ZIP+4
  - { line: mailing_address.foreign_nation, field: FOREIGNNATION, type: text, maxlen: 25 }
  # ---- SSN combs + ITIN flags / phone / DOB / date of death
  - { line: identifying_number, field: PRMSSN, type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: identifying_number.is_itin, field: PRMSSN ITIN, type: checkbox, on_state: /Yes }  # printed "ITIN" box beside "Your SSN" (new 2025)
  - { line: spouse.identifying_number, field: SPOSSN, type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: spouse.identifying_number.is_itin, field: SPOSSN ITIN, type: checkbox, on_state: /Yes }  # printed "ITIN" box beside "Spouse's SSN" (new 2025)
  - { line: daytime_phone, field: PHNNUM, type: text, maxlen: 10 }
  - { line: date_of_birth, field: YDOB, type: text, maxlen: 8, comb: true }  # 8 cells printed MM D D Y Y Y Y: digits only
  - { line: spouse.date_of_birth, field: SDOB, type: text, maxlen: 8, comb: true }
  - { line: date_of_death, field: DDOD, type: text, maxlen: 8, comb: true }  # "Decedent's Date of Death"
  - { line: spouse.date_of_death, field: SDOD, type: text, maxlen: 8, comb: true }  # "Spouse's Date of Death"
  # ---- filing status (enter 1-5 in one box), 6A age designation, 6B dependents
  - { line: filing_status, field: FILSTA, type: text, maxlen: 1 }
  - { line: 6a.65_older, field: EXM65A, type: checkbox, on_state: /Yes }  # 6A AGE DESIGNATION "Taxpayer 65 or Older" (box left of that caption)
  - { line: 6a.spouse_65_older, field: EXMBA, type: checkbox, on_state: /Yes }  # 6A "Spouse 65 or Older" — 2024's blind box, re-keyed by position + label
  - { line: 4_qualifying_person_name, field: ND, type: text }           # status 4 "If the qualifying person is not your dependent, enter name here."
  - { line: 5_qualifying_person_name, field: ND(2), type: text }        # status 5, same instruction
  - { line: 6b, field: EXMT6B, type: text, maxlen: 2 }                  # 6B "number of dependents claimed on Federal Form 1040 or 1040-SR" (2-cell comb)
  # ---- 6B dependent-detail grid (rows 0..7; columns First/Last/SSN/Relationship/Birth Date (mm/dd/yyyy))
  - { line: dependent_1.first_name, field: FN(6C).0, type: text }
  - { line: dependent_1.last_name, field: LN(6C).0, type: text }
  - { line: dependent_1.ssn, field: SSN(6C).0, type: text }
  - { line: dependent_1.relationship, field: Relationship(6C).0, type: text }
  - { line: dependent_1.birth_date, field: BD(6C).0, type: text }
  - { line: dependent_2.first_name, field: FN(6C).1, type: text }
  - { line: dependent_2.last_name, field: LN(6C).1, type: text }
  - { line: dependent_2.ssn, field: SSN(6C).1, type: text }
  - { line: dependent_2.relationship, field: Relationship(6C).1, type: text }
  - { line: dependent_2.birth_date, field: BD(6C).1, type: text }
  - { line: dependent_3.first_name, field: FN(6C).2, type: text }
  - { line: dependent_3.last_name, field: LN(6C).2, type: text }
  - { line: dependent_3.ssn, field: SSN(6C).2, type: text }
  - { line: dependent_3.relationship, field: Relationship(6C).2, type: text }
  - { line: dependent_3.birth_date, field: BD(6C).2, type: text }
  - { line: dependent_4.first_name, field: FN(6C).3, type: text }
  - { line: dependent_4.last_name, field: LN(6C).3, type: text }
  - { line: dependent_4.ssn, field: SSN(6C).3, type: text }
  - { line: dependent_4.relationship, field: Relationship(6C).3, type: text }
  - { line: dependent_4.birth_date, field: BD(6C).3, type: text }
  - { line: dependent_5.first_name, field: FN(6C).4, type: text }
  - { line: dependent_5.last_name, field: LN(6C).4, type: text }
  - { line: dependent_5.ssn, field: SSN(6C).4, type: text }
  - { line: dependent_5.relationship, field: Relationship(6C).4, type: text }
  - { line: dependent_5.birth_date, field: BD(6C).4, type: text }
  - { line: dependent_6.first_name, field: FN(6C).5, type: text }
  - { line: dependent_6.last_name, field: LN(6C).5, type: text }
  - { line: dependent_6.ssn, field: SSN(6C).5, type: text }
