relations:
  - "9d == 9b - 9c"                              # Line 9D "EXCESS FEDERAL ITEMIZED DEDUCTIONS – Subtract Line 9C from Line 9B."
  - "18 == 14 + 15 + 16 + 17"                    # Line 18 "TOTAL REFUNDABLE PRIORITY 2 CREDITS – Add Lines 14 and 15 through 17."
  - "22 == 19 - 21"                              # Line 22 "ADJUSTED LOUISIANA INCOME TAX – Subtract Line 21 from Line 19."
  - "24 == 22 + 23a + 23b"                       # Line 24 "Add Lines 22, 23A, and 23B."
  - "31 == 25 + 26 + 27 + 28 + 29 + 30"          # Line 31 "TOTAL REFUNDABLE TAX CREDITS AND PAYMENTS – Add Lines 25 through 30."
  - "36 == 34 - 35"                              # Line 36 "SUBTOTAL – Subtract Line 35 from Line 34. This amount of overpayment is available for credit or refund."
  - "38 == 36 - 37"                              # Line 38 "AMOUNT TO BE REFUNDED – Subtract Line 37 from Line 36."
  - "47 == 39 + 40 + 41 + 42 + 43 + 44 + 45 + 46" # Line 47 "BALANCE DUE LOUISIANA – Add Lines 39 through 46."
cross_form:
  - "7 == f1040.11a"       # Line 7 "FEDERAL ADJUSTED GROSS INCOME" = Form 1040 (2025) line 11a (AGI).
identity_fields:
  - identifying_number
  - name.first
  - name.last
signature: { page: 5 }
mailing: null
