# Form IT-540 (IT-540-WEB-BC), 2025 — Louisiana Resident Income Tax Return.
#
# Authored via the taxfill pipeline: the 2024 vision-mapped base ->
# field table (position + printed label) -> scripts/audit_pack.py sentinel
# audit, every return page read at zoom -> this map.
#
# Revision: see PRINTED IDENTITY in the port banner above. Page 5 carries the
# perjury declaration + "Your Signature" block + the email row + the
# paid-preparer block + the where-to-file addresses, and the IMPORTANT note
# "All four (4) pages of this return MUST be mailed in together along with
# your W-2s and completed schedules."
#
# PAGES MAPPED vs EXCLUDED.
#   MAPPED — PDF pages 2,3,4,5 = the filed four-page IT-540 return
#     (return Page 1 of 4 .. 4 of 4): identity/age designation/dependents,
#     Lines 7-47, the direct-deposit block, the signature/preparer block.
#   EXCLUDED — everything else in the 17-page booklet:
#     - PDF page 1: the "Louisiana File Online" cover page (no widgets).
#     - PDF pages 6-17: the ATTACH-IF-COMPLETED schedules and worksheets that
#       are SEPARATE filed forms, not the IT-540 core return — Schedule C
#       (Nonrefundable Priority 1, p.6), Schedule D (Donations, p.7),
#       Schedule E (Adjustments, p.8), the School Expense Deduction Worksheet
#       (p.9), Schedule F (Refundable Priority 2, p.10), Schedule G/H/I/J
#       (pp.11-13), and the refundable/nonrefundable child-care & school-
#       readiness credit worksheets (pp.14-17). Each is its own attachment
#       with its own line numbering and would be a distinct pack.
#
# Layout. Flat AcroForm (acroform_root empty; field names are the raw ids the
# form ships, e.g. "PRMFN", "FEDAGI", "TAXWTH"). The dependent-detail grid uses
# dotted row ids ("FN(6C).0".."BD(6C).7"); the direct-deposit "forwarded
# outside US?" radio uses kids "OUTSIDEUS.Y"/"OUTSIDEUS.N".
#
# SSN combs. PRMSSN / SPOSSN are 9-cell comb boxes (the printed instruction
# "You must enter your SSN below in the same order as shown on your federal
# return"); they are comb:true, format:ssn_digits_only, maxlen:9 (dashes would
# overflow the cells). PRMSSN is ONE field with 16 kid widgets — one on EVERY
# PDF page 2-17: the header echo of the mapped return pages 3-5 ("Enter your
# Social Security Number.") and of every excluded schedule and worksheet page
# 6-17 — so it is mapped once and one write fills them all. PRMFN and PRMLN
# likewise carry header-echo kids on the excluded PDF pages 9, 16 and 17
# (the school-expense and child-care worksheets). Those echo boxes are
# narrower than the return-page box: PRMLN's are 119.2 / 115.6 / 115.6 pt
# (16 glyphs, matching maxlen 16), but PRMFN's page-9 kid is only 105.4 pt
# (14 glyphs at 7.2 pt) against 148.1 pt (20) on the return page and 147.1 pt
# on pages 16-17. name.first keeps maxlen 20 — the box this pack maps holds
# 20 and the filler refuses, never truncates, an over-maxlen value — so a
# 15-20 glyph first name fills the return cleanly but is clipped in the
# page-9 worksheet header, and verify's whole-document clipping scan reports
# that kid as a P-001 FAIL. The integrator may tighten name.first to 14 to
# make every fill verify-clean at the cost of the return page's capacity.
# The date boxes (both birth dates and both dates of death) are
# 8-cell combs (/Ff comb bit, /MaxLen 8, printed "MM D D Y Y Y Y"): comb:true,
# maxlen 8, so a date goes in as MMDDYYYY digits.
#
# Money vs text. Every numbered dollar line prints a ".00" cents suffix and is
# mapped `money` (Lines 7-47 and their sub-lines 9A-9D, 14A/14B, 23A/23B).
# Boxes that hold a COUNT or a single code digit are `text` (the schema has no
# int type): the 6B dependents count, the filing-status box FILSTA (enter 1-5),
# the school-readiness star digits (line 15), the refund-method digit
# REFUNDOPT (line 38, enter 2 or 3). Names, address, dates, phone, bank
# routing/account, preparer block are `text`.
#
# Checkboxes / radio groups.
#   - The six "Mark Box" header flags (Name Change .. NOL Carryback), the two
#     ITIN flags, the two 6A age boxes, and the lone FEDNRQ / SDE / FARMER
#     (L33) / FARMER2 (L46) / PPSELFEMP flags are each an independent single
#     /Yes checkbox (the 6A pair is adjudicated INDEPENDENT in
#     SEPARATE_OPTION_SETS_ADJUDICATED: one box per person, both may apply).
#   - Line 23A "CONSUMER USE TAX – You must mark one of these boxes." is two
#     separate widgets (No use tax due = /no ; Amount from the Consumer Use Tax
#     Worksheet = /Yes) answering ONE question -> shared group use_tax_23a.
#     Line 23B likewise (No usage fee due / Amount from Form R-19000A, group
#     road_usage_23b).
#   - Direct-deposit account Type is two widgets (Checking = /1 ; Savings =
#     /yes) answering one question -> group deposit_account_type. The
#     "forwarded to a financial institution located outside the United
#     States?" Yes/No is ONE field OUTSIDEUS with kids .Y/.N (on_state /yes
#     each) -> they share group deposit_forwarded_us.
#   on_state values were re-dumped from this blank's /AP /N, never guessed.
#
# Relations. Only equalities printed on the 2025 face with every operand mapped
# to a single line: 9D "Subtract Line 9C from Line 9B", 18 "Add Lines 14 and 15
# through 17", 22 "Subtract Line 21 from Line 19", 24 "Add Lines 22, 23A, and
# 23B", 31 "Add Lines 25 through 30", 36 "Subtract Line 35 from Line 34", 38
# "Subtract Line 37 from Line 36", 47 "Add Lines 39 through 46" (the three
# subtractions are unconditional on the face and hold on every filing path
# with a blank operand read as zero). Lines that floor at zero (L10, L13),
# round (L11 "Multiply Line 10 by .03. Round to the nearest dollar"), or
# branch on a comparison (L20, L32, L34, L39) are OMITTED.
#
# Cross_form. Line 7's printed label is "FEDERAL ADJUSTED GROSS INCOME"; the
# 2025 Form 1040 prints AGI on line 11a, so the single cross_form equality is
# 7 == f1040.11a.
#
# Coverage. 4 filed pages; 155 field entries mapped below (2024: 151 — 10
# dropped, 14 added: 8, 6b, 6a.spouse_65_older (re-keyed EXMBA), the two
# ITIN flags, and ten dependent-7/8 cells).
form: IT-540
jurisdiction: states/la
tax_year: 2025
source_url: https://dam.ldr.la.gov/taxforms/IT540WEB-BC-2025-F.pdf
pdf_sha256: e6b029c3a113b55f308c4b58fc1d67b5f4eb26079b2247290483fa9673a0cd09
acroform_root: ''
fields:
  # ===================================================== return Page 1 of 4
  # ---- "Mark Box" header flags (each an independent single checkbox)
  - { line: name_change, field: NAMCHG, type: checkbox, on_state: /Yes }
  - { line: decedent_filing, field: DCDANT, type: checkbox, on_state: /Yes }
  - { line: spouse_decedent, field: DCDSPO, type: checkbox, on_state: /Yes }
