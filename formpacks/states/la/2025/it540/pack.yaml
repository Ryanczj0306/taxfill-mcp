  # ===================================================== return Page 2 of 4
  # (PRMSSN / LSTNAM are single AcroForm fields whose widgets repeat the SSN /
  # last-name echo on every return page — mapped once on Page 1 / once below.)
  - { line: federal_wages_if_not_required, field: FEDWAG, type: money }  # "If you are not required to file a federal return, indicate wages here."
  - { line: not_required_federal, field: FEDNRQ, type: checkbox, on_state: /Yes }  # "Mark this box and enter zero "0" on Line 13."
  - { line: schedule_e_attached, field: SDE, type: checkbox, on_state: /Yes }  # Line 7 "From Louisiana Schedule E, attached"
  - { line: "7", field: FEDAGI, type: money }                           # FEDERAL ADJUSTED GROSS INCOME
  - { line: "8", field: LASTDED, type: money }                          # LOUISIANA STANDARD DEDUCTION — $12,500 if filing status 1 or 3; $25,000 if 2, 4, or 5 (new 2025)
  - { line: 9a, field: FEDITM, type: money }                            # FEDERAL ITEMIZED DEDUCTIONS (2024 line 8A)
  - { line: 9b, field: STDDED, type: money }                            # FEDERAL ITEMIZED DEDUCTION FOR MEDICAL AND DENTAL EXPENSES
  - { line: 9c, field: EXCESS, type: money }                            # FEDERAL STANDARD DEDUCTION
  - { line: 9d, field: FEDTAX, type: money }                            # EXCESS FEDERAL ITEMIZED DEDUCTIONS — Subtract Line 9C from Line 9B
  - { line: "10", field: LATXBL, type: money }                          # YOUR LOUISIANA TAXABLE INCOME — Subtract Lines 8 and 9D from Line 7
  - { line: "11", field: LATAX, type: money }                           # YOUR LOUISIANA INCOME TAX — Multiply Line 10 by .03
  - { line: "12", field: ONRP1CRS, type: money }                        # NONREFUNDABLE PRIORITY 1 CREDITS — From Schedule C, Line 6
  - { line: "13", field: TLNRP1CRS, type: money }                       # TAX LIABILITY AFTER NONREFUNDABLE PRIORITY 1 CREDITS — Subtract Line 12 from Line 11
  - { line: "14", field: RFCCC, type: money }                           # 2025 LOUISIANA REFUNDABLE CHILD CARE CREDIT (federal AGI $25,000 or less)
  - { line: 14a, field: QRFCCC, type: money }                           # qualified expense amount, Refundable Child Care Credit Worksheet, Line 3
  - { line: 14b, field: RFCCCW6, type: money }                          # Refundable Child Care Credit Worksheet, Line 6
  - { line: "15", field: RFSRCR, type: money }                          # 2025 LOUISIANA REFUNDABLE SCHOOL READINESS CREDIT
  - { line: 15_code_5, field: REF5ST, type: text, maxlen: 1 }           # school-readiness "5 Star" box
  - { line: 15_code_4, field: REF4ST, type: text, maxlen: 1 }           # "4 Star"
