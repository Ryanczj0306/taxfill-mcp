  - { line: 15_code_2, field: REF2ST, type: text, maxlen: 1 }           # "2 Star"
  - { line: "16", field: LAEIC, type: money }                           # EARNED INCOME CREDIT — LA EIC Worksheet, Line 3
  - { line: "17", field: INSCRDREDUCED, type: money }                   # OTHER REFUNDABLE PRIORITY 2 CREDITS — From Schedule F, Line 9
  - { line: "18", field: ORP2CRS, type: money }                         # TOTAL REFUNDABLE PRIORITY 2 CREDITS — Add Lines 14 and 15 through 17
