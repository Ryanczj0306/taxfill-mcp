  - { line: 23a.no_use_tax_due, field: 22A_USE_NO, type: checkbox, on_state: /no, group: use_tax_23a }  # 23A "No use tax due"
  - { line: 23a.amount_from_worksheet, field: 22A_USE_YS, type: checkbox, on_state: /Yes, group: use_tax_23a }  # 23A "Amount from the Consumer Use Tax Worksheet"
  - { line: 23a, field: USETAX, type: money }                           # CONSUMER USE TAX (2024 line 22A)
  - { line: 23b.no_usage_fee_due, field: 22B_USE_NO, type: checkbox, on_state: /no, group: road_usage_23b }  # 23B "No usage fee due"
  - { line: 23b.amount_from_r19000a, field: 22B_USE_YS, type: checkbox, on_state: /Yes, group: road_usage_23b }  # 23B "Amount from Form R-19000A"
  - { line: 23b, field: E&HVRUFEE, type: money }                        # ELECTRIC AND HYBRID VEHICLE ROAD USAGE FEE
  - { line: "24", field: INUSTX, type: money }                          # TOTAL INCOME TAX, CONSUMER USE TAX, AND ... ROAD USAGE FEE — Add Lines 22, 23A, and 23B
  - { line: "25", field: OPORP2C, type: money }                         # OVERPAYMENT OF REFUNDABLE PRIORITY 2 CREDITS — amount from Line 20
  - { line: "26", field: RFP4CRS, type: money }                         # REFUNDABLE PRIORITY 4 CREDITS — From Schedule I, Line 6
  - { line: "27", field: TAXWTH, type: money }                          # AMOUNT OF LOUISIANA TAX WITHHELD FOR 2025
  - { line: "28", field: AMTFWD, type: money }                          # AMOUNT OF CREDIT CARRIED FORWARD FROM 2024
  - { line: "29", field: ESTPAY, type: money }                          # AMOUNT OF ESTIMATED PAYMENTS MADE FOR 2025
  - { line: "30", field: EXTPAY, type: money }                          # AMOUNT OF EXTENSION PAYMENT
  - { line: "31", field: TTLCR&PAY, type: money }                       # TOTAL REFUNDABLE TAX CREDITS AND PAYMENTS — Add Lines 25 through 30
  - { line: "32", field: OPYMNT, type: money }                          # OVERPAYMENT — If Line 31 is greater than Line 24, subtract Line 24 from Line 31
  - { line: 33_farmer, field: FARMER, type: checkbox, on_state: /Yes }  # L33 "If you are a farmer, check the box."
  - { line: "33", field: UNPYMT, type: money }                          # UNDERPAYMENT PENALTY (Form R-210R)
  - { line: "34", field: ADJOPT, type: money }                          # ADJUSTED OVERPAYMENT
  - { line: "35", field: TOTALDONATIONS, type: money }                  # TOTAL DONATIONS — From Schedule D, Line 14
  - { line: "36", field: SUBTOT, type: money }                          # SUBTOTAL — Subtract Line 35 from Line 34
  - { line: "37", field: CRDFWD, type: money }                          # AMOUNT OF LINE 36 TO BE CREDITED TO 2026 INCOME TAX
  - { line: "38", field: REFUND, type: money }                          # AMOUNT TO BE REFUNDED — Subtract Line 37 from Line 36
  - { line: 38_refund_method, field: REFUNDOPT, type: text, maxlen: 1 }  # enter 2 (paper check) or 3 (direct deposit)
