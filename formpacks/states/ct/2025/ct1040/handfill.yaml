# Connecticut Form CT-1040 (Rev. 12/25) — Resident Income Tax Return, 2025.
#
# PRINT-ONLY (C3): the official CT-1040 PDF served by portal.ct.gov is a flat
# scannable form — NO AcroForm widgets and NO XFA (pypdf finds no /AcroForm and
# 0 fields), so it cannot be filled programmatically. HAND-FILL pack
# (render_mode: hand_fill): the engine computes every derivable line and emits
# a line->value worksheet; fill_form STAMPS the worksheet onto the blank at
# source_url (blue or black ink only, per the form; whole dollars).
#
# ===========================================================================
# TY2025 PORT of formpacks/states/ct/2023/ct1040/handfill.yaml (ported 2026-10-01,
# Phase J JS5), measured on the 2025 blank itself.
#
# BLANK. https://portal.ct.gov/-/media/drs/forms/2025/income/ct-1040_1225.pdf —
# two separate downloads (HTTP 200, 424,566 bytes, PDF 1.4, 4 pages of
# 589.68 x 774 pt) and the scaffold's triage copy all digest to
# fadbe2acfd62…538b9b (pinned below). The 2023 blank's hidden "DRAFT" text-layer
# stamp is gone from this file.
#
# PRINTED IDENTITY. Page 1 prints "Form CT-1040 / Connecticut Resident Income
# Tax Return 2025 / (Rev. 12/25)" with scanline "1040 1225W 01 9999"; pages 2-4
# print "Form CT-1040 Page N of 4 (Rev. 12/25)" and "1040 1225W 0N 9999"; the
# page-1 foot prints "Due date: April 15, 2026".
#
# LAYOUT CENSUS (layoutdiff of the two blanks' text layers, then movebox over
# the 184 base boxes, then every box measured on this blank — 187 boxes now):
#   * page 1 RE-FLOWED (4% of printed words within 2 pt of 2023): every page-1
#     box was re-measured from this blank's own geometry. The whole header block
#     (fiscal-year cells, both SSNs, both deceased boxes, names, address,
#     residence, the five filing-status squares and the MFS spouse-name box) sits
#     exactly 16 pt higher than in 2023 at the same x; the six attachment
#     squares 19 pt higher; Lines 1-15 sit 4 pt lower (Line 1: 5 pt) and Line 16
#     2 pt lower, in the same 135.04 pt rectangles at x 404.57.
#   * page 2 RE-FLOWED (18% within 2 pt): every page-2 box was re-measured. The
#     SSN header did not move (its box is the 2023 box). Rows 17 and 18a-18d
#     re-measure to the 2023 numbers; 18e moved 0.7 pt; 18f-20c 1-2 pt up; the
#     new Line 20d takes the rectangle at y 461.90-474.78 and pushes 21-25 down
#     by 11.8-14.8 pt, 25a-25d by 12 pt and 26-30 by 15.3-19.1 pt; the signature
#     dates and phones moved 10.6-12.4 pt down, the paid-preparer rows 7-8.3 pt
#     up and the designee row 9 pt up. An unlabelled white rectangle at
#     y 322.9-335.8 (the "If you do not elect direct deposit" row) prints
#     nothing and carries no entry; the five labelled boxes below it are 26-30.
#   * page 3 (84% within 0.5 pt): the 37 boxes of Lines 31-48 and Schedule 2
#     are the 2023 boxes verbatim (movebox: SAME, confirmed on the render).
#     Lines 48a-48c moved 15.2-16.6 pt UP to make room for the new Line 48d
#     (rectangle y 306.83-319.72); Line 49 moved 1 pt and Line 50's rectangle
#     re-measures to its 2023 box. The "Enter CHET account number" entry is
#     gone (48.account dropped). The "specify" boxes beside Lines 37 and 49,
#     which the 2023 manifest never listed, are entries now (37.specify,
#     49.specify).
#   * page 4 (98% within 0.5 pt): all 35 boxes are the 2023 boxes verbatim.
#   In all, 84 boxes are numerically identical to 2023 (74 carried over + 10
#   whose re-measurement reproduced the 2023 numbers: 17, the 18a-18d federal
#   ID combs and wages boxes, and 50), 98 moved or changed, 2 were dropped and
#   5 added (health_coverage.interest, 20d, 37.specify, 48d, 49.specify).
#
# HOW EACH BOX WAS MEASURED (the 2023 pilot's rules, re-derived from the 2023
# blank, where they reproduce every 2023 box; a script applies them):
#   entry rectangle (a flat 5-segment path): x = left + 2, w = width - 4,
#     baseline y = bottom + (height - 6.5) / 2 (a 9 pt digit sits centred);
#   per-character cells (SSNs 3-2-4, MM-DD-YYYY dates, phones, country code,
#     FEIN, PIN, routing and account numbers): x/w = the rectangle, cells = the
#     grey underline strokes' left edges, cell_w = their width. 25b and 25c
#     were combs in 2023; their strokes are UNEVEN (25b's last cell 0.5 pt
#     wide of the pitch, 25c's 14th), so they are cells now. The preparer FEIN's
#     first stroke starts 0.25 pt left of its rectangle: the declared box is
#     widened to it. The fiscal-year "beginning" box ends before the four
#     cells that print the year 2025;
#   comb (18a-18e federal ID: nine strokes at an even 17.22 pt pitch):
#     x = first stroke - (pitch - stroke width) / 2, w = 9 x pitch;
#   checkbox: a printed square (the filing-status squares are five figures of
#     ONE path object; the attachment, self-employed and health-coverage
#     squares are single paths) or a white square (deceased, 25a, 25d):
#     x/w = the square, baseline as above; the 9 pt X is centred.
#
# FACE DELTAS vs 2023 (the complete printed-text diff, facediff --layout):
#   * page 1: Line 1 cites federal Form 1040 / 1040-SR "Line 11a" (2023: Line
#     11); Line 13 cites Schedule CT-IT Credit, Part 1, "Line 10" (2023: Line
#     11); a NEW paragraph "Do you need health coverage? ... check the following
#     box" with a 7 x 7 pt square (Access Health CT; the 2025 Instructions page
#     2 explain the authorization) — the line health_coverage.interest;
#     "Due date: April 15, 2026"; the myconneCT sentence moved to the foot.
#   * page 2: NEW "20d. Historic Home Rehabilitation Credit" (Instructions,
#     Line 20d: the amount on the DECD voucher, copy attached); Line 21 adds
#     20d; Line 19 "All 2025 estimated tax payments"; Line 23 "applied to your
#     2026 estimated tax"; the Line 18 caption ends "and 18f, enter here.";
#     the "Your email address" box is GONE (signature.email dropped).
#   * page 3: Line 48 "CHET contributions made in 2025"; the CHET account
#     number entry is gone; NEW "48d. Achieving Better Life Experience (ABLE)"
#     (Instructions, Line 48d: contributions to an ABLE account, capped like
#     CHET); Line 50 still reads "Add Lines 39 through 49" and now sums 48d.
#   * page 4: "70g. Connecticut Baby Bond Trust" (2023: CHET Baby Scholars);
#     the payment box says "2025 Form CT-1040". Line 64's pre-printed $300,
#     the 1% / 6.35% / 7.75% / 2.99% use-tax rates and both PO boxes are
#     unchanged.
# NOTES RE-READ in the 2025 Instructions (Rev. 12/25, 28 pages, sha256
# 0e2cabf0…b24386): Line 6 is still a mandated lookup (Tax Calculation
# Schedule pages 19-23: Table B initial tax, Table C "2% Tax Rate Phase-Out
# Add-Back", Table D Tax Recapture, Table E personal credit — the 2023 note's
# "3%/5% brackets" is a 2023 fact and is gone); Line 54 "Round to four decimal
# places"; Line 64 "$300"; Line 66's Property Tax Credit Table is on page 27
# with the full-credit ceilings $49,500 / $70,500 / $35,250 / $54,500; Line 27
# 10%; Line 28 1% per month. Figures agree with knowledge/states/ct/2025.yaml.
#
# READ. Three returns were stamped with stamp_overlay on this blank: a demo
# MFJ return, a full return (every re-measured checkbox marked, 18d/18e and
# 48a-48d filled) and a return with ink in every one of the 187 boxes (the 36
# entries the full return leaves blank — the four other filing-status squares,
# the MFS spouse name, 18f, 27-29, 32-36a, 40-47, 49, 56b, 61's second date,
# 69a/69c/69d, 70b-70h — filled too). Each verified by verify_overlay on all
# 187 placements with no warning, was rendered at scale 2 and read in halves
# (the 36 extra rows in tight crops): every value sits inside its printed cell
# on its row, every X inside its square, the SSN and date dashes and the
# pre-printed ".00", "300" and decimal points untouched
# (test_ct1040_2025_overlay.py GOLDEN / FULL / EVERY).
# ===========================================================================
# Your SSN is stamped four times, on page 1 and in the page 2-4 headers.
# Line 52's name and two-letter code are separate boxes (52a / 52a.code), and
# each property row has two date boxes (date_1 / date_2). CT-mandated table
# lookups (tax tables / Tax Calculation Schedule, Property Tax Credit Table)
# stay manual notes. The signatures themselves stay hand-written.
