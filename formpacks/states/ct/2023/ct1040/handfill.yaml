# Connecticut Form CT-1040 (Rev. 12/23) — Resident Income Tax Return, 2023.
#
# PRINT-ONLY (C3): the official CT-1040 PDF served by portal.ct.gov is a flat
# scannable form — NO AcroForm widgets and NO XFA (introspect finds 0 fillable
# fields), so it cannot be filled programmatically. HAND-FILL pack
# (render_mode: hand_fill): the engine computes every derivable line and emits
# a line->value worksheet; the filer PRINTS the blank at source_url and
# hand-writes the values (blue or black ink only, per the form; whole dollars).
#
# Provenance: blank downloaded from source_url (450,476 bytes, 4 pages);
# page-1 text verified "Form CT-1040 / Connecticut Resident Income Tax Return
# 2023 / (Rev. 12/23)" with scanline "1040 1223W 01 9999" before pinning
# pdf_sha256. Note: the file's hidden TEXT LAYER carries a leftover invisible
# "DRAFT 12-12-2023" stamp that never renders — this IS the final Rev. 12/23
# artifact portal.ct.gov serves. SCOPE: complete — all four pages (main
# computation lines 1-30, Schedule 1 modifications 31-50, Schedule 2
# other-state credit 51-59, Schedule 3 property-tax credit 60-68, Schedule 4
# use tax 69, Schedule 5 charity 70). CT-mandated table lookups (tax tables /
# Tax Calculation Schedule, Property Tax Credit Table) stay manual notes.
#
# OVERLAY COORDINATES (Phase J JS4c, 2026-09-28): every line carries an `overlay` block, so
# fill_form STAMPS the worksheet onto this blank. Each box was measured from the blank's own
# vector rectangles (and, for per-character cells, its underline strokes), never estimated, then
# stamped with sentinel values, verified, rendered and read page by page. Money is right-aligned
# and ends before the pre-printed ".00". The SSN (3-2-4 around printed dashes), the MM-DD-YYYY
# property-tax dates and the Line 54 decimals use `cells` (the cells are uneven). Your SSN is
# stamped four times, on page 1 and in the page 2-4 headers. Line 52's name and two-letter code
# are separate boxes (52a / 52a.code), and each property row has two date boxes (date_1 / date_2).
# The read also found 25 printed entries the manifest had never listed: the fiscal-year dates,
# both "Check if deceased" boxes, both suffixes, the country code, the residence town and ZIP,
# the Married-filing-separately spouse name, and on page 2 the signature dates, phones, email,
# the paid-preparer block and the third-party designee. They are all lines now. The signatures
# themselves stay hand-written.
form: "CT-1040"
jurisdiction: states/ct
tax_year: 2023
render_mode: hand_fill
source_url: https://portal.ct.gov/-/media/drs/forms/2023/income/ct-1040_1223.pdf
