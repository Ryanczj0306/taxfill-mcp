    field: taxpayerID
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: spouse.identifying_number         # "Spouse Taxpayer ID" (9-cell comb, /MaxLen 9)
    field: spouseTaxpayerID
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: name.first                        # "Your First Name"
    field: taxpayerFirstName
    type: text
  - line: name.middle_initial               # "M.I."
    field: taxpayerMI
    type: text
    maxlen: 1
  - line: name.last                         # "Last Name"
    field: taxpayerLastName
    type: text
  - line: name.suffix                       # "Suffix"
    field: taxpayerSuffix
    type: text
    maxlen: 4
  - line: spouse.name.first                 # "Spouse First Name"
    field: spouseFirstName
    type: text
  - line: spouse.name.middle_initial        # spouse "M.I."
    field: spouseMI
    type: text
    maxlen: 1
  - line: spouse.name.last                  # spouse "Last Name"
    field: spouseLastName
    type: text
  - line: spouse.name.suffix                # spouse "Suffix"
    field: spouseSuffix
    type: text
    maxlen: 4
  - line: mailing_address.street            # "Present Home Address (Number and Street)" + "Apartment #" (one box)
    field: taxpayerAddress
    type: text
  - line: mailing_address.city              # "City"
    field: taxpayerCity
    type: text
  - line: mailing_address.state             # "State" (/MaxLen 2)
    field: taxpayerState
    type: text
    maxlen: 2
  - line: mailing_address.zip               # "Zip Code" (/MaxLen 5)
    field: taxpayerZipCode
    type: text
    maxlen: 5
  - line: fiscal_year.begin                 # "For Fiscal Year beginning" (mm-dd-yyyy)
    field: fiscalStart
    type: text
  - line: fiscal_year.end                   # "and ending" (mm-dd-yyyy)
    field: fiscalEnd
    type: text
  - line: amended.yes                       # "Amended Return / Must include page 3"
    field: amendedChkBox
    type: checkbox
    on_state: /Yes
  - line: pit_und_attached.yes              # "Form PIT-UND Attached"
    field: pitund
    type: checkbox
    on_state: /X
  - line: claimed_as_dependent.yes          # "Claimed as Dependant on someone else's return"
    field: claimedDependent
    type: checkbox
    on_state: /X
  - line: full_year_nonresident.yes         # "Check if FULL-YEAR Non-Resident in 2023"
    field: fullYearNonResident
    type: checkbox
    on_state: /X
  - line: part_year.start                   # "If you were a part-year resident in 2023, give the dates you resided in Delaware" (first mm-dd-yyyy)
    field: partYearStart
    type: text
  - line: part_year.end                     # part-year residency end date (second mm-dd-yyyy)
    field: partYearEnd
    type: text

  # ---- Filing Status (ONE /Btn "filingStatus"; the face prints 1, 2, 3, 5 -- no status 4)
  - line: filing_status.single              # 1. Single, Divorced, Widow(er)
    field: filingStatus
    type: checkbox
    on_state: /fs1
    group: filing_status
  - line: filing_status.joint               # 2. Joint
    field: filingStatus
    type: checkbox
    on_state: /fs2
    group: filing_status
  - line: filing_status.married_filing_separate # 3. Married & Filing Separate Forms
    field: filingStatus
    type: checkbox
    on_state: /fs3
    group: filing_status
  - line: filing_status.head_of_household   # 5. Head of Household
    field: filingStatus
    type: checkbox
    on_state: /fs5
    group: filing_status

  # ============================================ SECTION A -- INCOME AND ADJUSTMENTS FROM FEDERAL RETURN (1-17)
