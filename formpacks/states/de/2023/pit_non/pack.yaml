    field: ln01ColA
    type: money
  - line: 1b                                # 1 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln01ColB
    type: money
  - line: 2a                                # 2 INTEREST (Col A, FEDERAL)
    field: ln02ColA
