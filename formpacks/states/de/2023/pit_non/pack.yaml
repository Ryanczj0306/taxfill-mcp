# Relations (on-face arithmetic, unconditional, every operand a mapped money line;
# both columns of the two-column table). The ALLOCATION lines are declared as
# printed: 30a / 30b (Column B / Column A "Subtract Line 29 from Line 28"), 37
# ("Enter amount from Line 30b here") and the two proration boxes of line 42
# ("A. Line 30a" / "B. Line 30b"), so a changed Delaware-source or federal input
# fails verify. NOT declared:
#   * 42 (= proration decimal x schedule amount) and 43a / 43b (= amount x
#     "( x ___ )" decimal). The decimal is text (a 4-place ratio a whole-dollar
#     money line cannot hold), so verify cannot read it from disk; and the
#     2023 PIT-NON instructions (Line 42) round it ("Carry out the computation to four decimal places,
#     rounding off the fourth position"; "may not exceed 1.0000 or be less than
#     zero"), so a relation over the exact quotient 42.box_a / 42.box_b would FAIL
#     a correctly rounded return whenever the two products straddle a half dollar.
#   * conditional / branch lines: 38 (standard amount or line 36 by election), 47
#     (floored at 0), 54 / 55 and 67 / 68 (balance-due vs overpayment), 59 / 60
#     and 71 / 72 (net lines whose operands depend on that branch), and 61 ("From
#     Line 53"), which is blank on every original return while 53 is not.
#   * 43a / 43b "x $110 =" (the count is a text cell).
# The face, not the form's script, is transcribed: ln66ColB's calculate script
# computes 63 - (64 - 65) while the face prints "Subtract Line 64 and Line 65
# from Line 63"; the relation follows the face.
relations:
  - "15a == 1a + 2a + 3a + 4a + 5a + 6a + 7a.a + 7b.a + 8a + 9a + 10a + 11a + 12a + 13a + 14a"  # 15 "TOTAL INCOME - Add Line 1 through Line 14" (Col A)
  - "15b == 1b + 2b + 3b + 4b + 5b + 6b + 7a.b + 7b.b + 8b + 9b + 10b + 11b + 12b + 13b + 14b"  # 15 (Col B)
  - "17a == 15a - 16a"                                                                          # 17 "Subtract Line 16 from Line 15" (Col A)
  - "17b == 15b - 16b"                                                                          # 17 (Col B)
  - "20a == 18a + 19a"                                                                          # 20 "TOTAL - Add Line 18 to Line 19" (Col A)
  - "20b == 18b + 19b"                                                                          # 20 (Col B)
  - "21a == 17a + 20a"                                                                          # 21 "Add Line 17 to Line 20" (Col A)
  - "21b == 17b + 20b"                                                                          # 21 (Col B)
  - "27a == 22a + 23a + 24a + 25a + 26a.a + 26b.a"                                              # 27 "TOTAL Add Line 22 through Line 26b" (Col A)
  - "27b == 22b + 23b + 24b + 25b + 26a.b + 26b.b"                                              # 27 (Col B)
  - "28a == 21a - 27a"                                                                          # 28 "Subtract Line 27 from Line 21" (Col A)
  - "28b == 21b - 27b"                                                                          # 28 (Col B)
  - "30a == 28b - 29b"                                                                          # 30a "COLUMN B- Subtract Line 29 from Line 28" -- modified Delaware Source Income
  - "30b == 28a - 29a"                                                                          # 30b "COLUMN A - Subtract Line 29 from Line 28" -- Delaware Adjusted Gross Income
  - "34 == 31 + 32 + 33"                                                                        # 34 "TOTAL - Add Line 31 through Line 33"
  - "36 == 34 - 35"                                                                             # 36 "Subtract Line 35 from Line 34"
  - "37 == 30b"                                                                                 # 37 "Enter amount from Line 30b here"
  - "40 == 38 + 39"                                                                             # 40 "TOTAL DEDUCTIONS - Add Line 38 to Line 39"
  - "41 == 37 - 40"                                                                             # 41 "TAXABLE INCOME - Subtract Line 40 from Line 37"
  - "42.box_a == 30a"                                                                           # 42 "A. Line 30a" (30a "Enter on Page 2, Line 42, Box A") -- the proration numerator
  - "42.box_b == 30b"                                                                           # 42 "B. Line 30b" (30b "Enter on Page 2, Line 37 and Line 42, Box B") -- the proration denominator
  - "46 == 43a + 43b + 44 + 45"                                                                 # 46 "TOTAL NON-REFUNDABLE CREDITS - Add Line 43a through Line 45"
  - "53 == 48 + 49 + 50 + 51 + 52"                                                              # 53 "TOTAL REFUNDABLE CREDITS - Add Line 48 through Line 52"
  - "63 == 61 + 62"                                                                             # 63 "SUBTOTAL - Add Lines 61 and 62" (amended only; blank reads 0 == 0)
  - "66 == 63 - 64 - 65"                                                                        # 66 "Subtract Line 64 and Line 65 from Line 63" (amended only)
# Cross_form. None: the face cites no federal line number (Column A is headed
# only "FEDERAL", and line 17 reads "FEDERAL ADJUSTED GROSS INCOME FOR DELAWARE
# PURPOSES"), and the 2023 PIT-NON instructions have military income
# subtracted "in Column A, Line 16", so 17a is not always federal AGI. No leg is
# declared.
cross_form: []
identity_fields:
  - name.first
  - name.last
  - identifying_number
  - mailing_address.street
  - mailing_address.city
  - mailing_address.state
  - mailing_address.zip
signature: {page: 2}
mailing:
  # Printed at the foot of page 1: "BALANCE DUE WITH PAYMENT ENCLOSED (LINE 59)
  # MAIL COMPLETED FORM TO: Delaware Division of Revenue PO Box 508, Wilmington,
  # DE 19899-0508 Make check payable to: Delaware Division of Revenue"; "REFUND
  # (LINE 60) ... PO Box 8710 Wilmington, DE 19899-8710"; "ALL OTHER RETURNS ...
  # PO Box 8711 Wilmington, DE 19899-8711". Page 3 (FOR AMENDED RETURNS ONLY,
  # lines 61-75) prints its own footer: "NET BALANCE DUE WITH PAYMENT ENCLOSED
  # (LINE 71) ... PO Box 508, Wilmington, DE 19899-0508"; "NET REFUND (LINE 72)
  # ... PO Box 8710 Wilmington, DE 19899-8710"; "ALL OTHER RETURNS ... PO Box
  # 8711 Wilmington, DE 19899-8711". So an amended return routes on lines 71 /
  # 72, not 59 / 60: one whose line 60 shows a refund but whose line 72 is
  # empty (the original refund already received) goes to PO Box 8711. The schema
  # holds two addresses, so no_payment carries the original and amended
  # no-payment branches as printed, and with_payment names both payment lines.
  # verify_url is the Division's 2023 PIT-NON instructions, which print the same
  # three boxes for the original return and, under "Amended Returns / Where to
  # File", P.O. Box 8711 with Line 71 to Box 508 and Line 72 to Box 8710.
  no_payment: "Original return: refund (line 60) -- Delaware Division of Revenue, PO Box 8710, Wilmington, DE 19899-8710; all other returns -- Delaware Division of Revenue, PO Box 8711, Wilmington, DE 19899-8711. AMENDED return (page 3): net refund (line 72) -- PO Box 8710, Wilmington, DE 19899-8710; all other amended returns -- PO Box 8711, Wilmington, DE 19899-8711"
  with_payment: "Delaware Division of Revenue, PO Box 508, Wilmington, DE 19899-0508 (make check payable to Delaware Division of Revenue) -- balance due on line 59, or on an amended return the net balance due on line 71"
  verify_url: https://revenuefiles.delaware.gov/2023/PIT-NON_TY23_2023-01_Instructions.pdf
