  - line: 20a                               # 20 TOTAL - Add Line 18 to Line 19 (Col A, FEDERAL)
    field: ln20ColA
    type: money
  - line: 20b                               # 20 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln20ColB
    type: money
  - line: 21a                               # 21 Add Line 17 to Line 20 (Col A, FEDERAL)
    field: ln21ColA
    type: money
  - line: 21b                               # 21 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln21ColB
    type: money

