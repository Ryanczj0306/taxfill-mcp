  - line: 14a                               # 14 OTHER INCOME (State nature and source) (Col A, FEDERAL)
    field: ln14ColA
    type: money
  - line: 14b                               # 14 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln14ColB
    type: money
  - line: 15a                               # 15 TOTAL INCOME - Add Line 1 through Line 14 (Col A, FEDERAL)
    field: ln15ColA
    type: money
  - line: 15b                               # 15 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln15ColB
    type: money
  - line: 16a                               # 16 TOTAL FEDERAL ADJUSTMENTS (Col A, FEDERAL)
    field: ln16ColA
    type: money
  - line: 16b                               # 16 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln16ColB
    type: money
  - line: 17a                               # 17 FEDERAL ADJUSTED GROSS INCOME FOR DELAWARE PURPOSES Subtract Line 16 from Line 15 (Col A, FEDERAL)
    field: ln17ColA
    type: money
  - line: 17b                               # 17 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln17ColB
    type: money

  # ============================================ SECTION B -- ADDITIONS (18-21)
  - line: 18a                               # 18 INTEREST RECEIVED ON OBLIGATIONS OF ANY STATE OTHER THAN DELAWARE (Col A, FEDERAL)
    field: ln18ColA
    type: money
  - line: 18b                               # 18 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln18ColB
    type: money
  - line: 19a                               # 19 FIDUCIARY ADJUSTMENT, OIL DEPLETION (Col A, FEDERAL)
    field: ln19ColA
    type: money
  - line: 19b                               # 19 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln19ColB
