  - line: 12a                               # 12 UNEMPLOYMENT COMPENSATION (INSURANCE) (Col A, FEDERAL)
    field: ln12ColA
    type: money
  - line: 12b                               # 12 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln12ColB
