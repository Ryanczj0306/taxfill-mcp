  - line: 6a                                # 6 BUSINESS INCOME OR (LOSS) (Col A, FEDERAL)
    field: ln06ColA
    type: money
  - line: 6b                                # 6 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln06ColB
    type: money
  - line: 7a.a                              # 7a CAPITAL GAIN OR (LOSS) (Col A, FEDERAL)
    field: ln07aColA
    type: money
  - line: 7a.b                              # 7a (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln07aColB
    type: money
  - line: 7b.a                              # 7b OTHER GAINS OR (LOSSES) (Col A, FEDERAL)
    field: ln07bColA
    type: money
  - line: 7b.b                              # 7b (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln07bColB
    type: money
  - line: 8a                                # 8 IRA DISTRIBUTIONS (Col A, FEDERAL)
    field: ln08ColA
    type: money
  - line: 8b                                # 8 (Col B, DELAWARE SOURCE INCOME/LOSS)
