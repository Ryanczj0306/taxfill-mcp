  - line: 2b                                # 2 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln02ColB
    type: money
  - line: 3a                                # 3 DIVIDENDS (Col A, FEDERAL)
    field: ln03ColA
    type: money
  - line: 3b                                # 3 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln03ColB
    type: money
  - line: 4a                                # 4 STATE REFUNDS, CREDITS OR OFFSETS OF STATE & LOCAL INCOME TAXES (Col A, FEDERAL)
    field: ln04ColA
    type: money
  - line: 4b                                # 4 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln04ColB
