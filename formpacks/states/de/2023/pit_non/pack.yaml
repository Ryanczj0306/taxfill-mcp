# Form PIT-NON, 2023 -- Delaware Individual NON-RESIDENT Income Tax Return.
# Non-resident / part-year return (authored new, Phase J JS6; no earlier PIT-NON
# pack exists). The 2023 PIT-RES pack is the convention reference for identity,
# mailing-block, checkbox and column-key style; no binding was copied from it.
#
# Provenance / freshness. Blank downloaded twice from the official source_url
# below; both copies hash to the pdf_sha256 pinned here (535,354 bytes, %PDF-1.7,
# AcroForm, 3 pages, Adobe InDesign 19.0, created 2023-11-13). The text layer of
# every page prints "DELAWARE / DIVISION OF REVENUE", the spaced "2 0 2 3", "PIT-NON",
# the spaced "F O R M" and the title "DELAWARE INDIVIDUAL NON-RESIDENT INCOME TAX
# RETURN"; the
# footers print "DFPITNON2023019999V1 / Revision 20231113 / Page 1",
# "DFPITNON2023029999V1 ... Page 2" and "DFPITNON2023039999V1 ... Page 3".
# printed_year_verified = 2023.
#
# Layout / what is FILED. All three pages are the filed return (no instruction
# pages in this file).
#   page 1 -- header (two 9-cell comb Taxpayer IDs; first / M.I. / last / suffix
#             for you and spouse; home address + apartment in ONE street box;
#             city / state / zip; fiscal-year begin / end; Amended flag; Form
#             PIT-UND attached; Claimed-as-dependent; "Check if FULL-YEAR
#             Non-Resident in 2023"; the part-year "dates you resided in
#             Delaware" pair), FILING STATUS 1, 2, 3, 5 (the face prints no
#             status 4), and the TWO-COLUMN income table lines 1-29:
#             COLUMN A = "FEDERAL", COLUMN B = "DELAWARE SOURCE INCOME/LOSS".
#             Sections A (1-17), B additions (18-21), C subtractions (22-29;
#             line 23 spouse / you military-pension flags, line 26b Tuition /
#             ABLE flags). Then the two single-cell allocation lines -- 30a
#             (Column B cell only, "modified Delaware Source Income. Enter on
#             Page 2, Line 42, Box A") and 30b (Column A cell only, "Delaware
#             Adjusted Gross Income. Enter on Page 2, Line 37 and Line 42, Box B").
#   page 2 -- ONE column, lines 31-60. Section D deductions 31-36; Section E
#             calculations 37-60 with the PRORATION block on line 42 ("A. Line
#             30a", "B. Line 30b", "= PRORATION DECIMAL", "X Tax Liability from
#             Tax Rate Table/ Schedule Amount", then the line-42 amount) and the
#             two prorated credit rows 43a / 43b (count, "x $110 =", the "( x ___ )"
#             proration-decimal copy, the line amount); line 38 standard /
#             itemized election (ONE /Btn); line 39 spouse / you 65-or-over and
#             blind flags; Section F direct deposit; signature block; paid
#             preparer block.
#   page 3 -- FOR AMENDED RETURNS ONLY, lines 61-72 in one column under a printed
#             "COLUMN B" header, then 73 / 74 / 75 Yes-No questions and the two
#             free-text explanation boxes. Every page-3 widget carries the
#             annotation Hidden flag (/F 134 or 6) for the form's script to show;
#             fill_form clears it on every widget it writes (CONVENTIONS P-027).
#
# Keys. Two-column lines 1-29 take a single-letter column suffix, <line>a
# (Column A, FEDERAL) and <line>b (Column B, DELAWARE SOURCE), as the PIT-RES
# pack does; printed lines that already carry a letter take dotted column ids
# (7a.a / 7a.b, 7b.a / 7b.b, 26a.a / 26a.b, 26b.a / 26b.b). 30a and 30b are
# single cells and keep their printed label. Pages 2 and 3 have one column, so
# their keys are the printed line numbers ("31" ... "72"). Line-42 / 43a / 43b
# sub-boxes are dotted members of their line (42.box_a, 42.proration_decimal,
# 43a.exemptions_amount, ...).
#
# AcroForm. FLAT form: acroform_root = '' . 186 widget annotations on 177
# fields; every field /T a raw flat id (taxpayerID, ln01ColA,
# ln42ProrationWhole, ...); no /Parent name chain beyond the 16 radio kid
# widgets (7 groups, below), which carry no /T of their own. EXCLUDED:
# 'printForm' and 'resetForm' (PRINT / RESET pushbuttons, page 1 top) and
# 'machPrintID' (a ReadOnly, Hidden 7.2 x 12 pt machine-print id
# beside the page-1 header that the Taxpayer ID validate script un-hides -- not a
# taxpayer line). Every other widget is mapped.
#
# ReadOnly (P-007). 40 mapped widgets carry /Ff bit 1, every one class 4 -- each
# has its own /AA /C calculate script and a seat in the AcroForm /CO list (41
# entries -- these 40 plus ln37ColA, which copies line 30b but is NOT ReadOnly): lines 15,
# 17, 20, 21, 27, 28 in both columns; 30a; 30b; 34, 36, 40, 41; 42 Box A / Box B
# and the line-42 amount; 43a's "x $110 =" amount, proration copy and line
# amount; 43b's boxes-checked count, "x $110 =" amount, proration copy and line
# amount; 46, 47, 53, 54, 55, 59, 60; and amended 61, 63, 66, 67, 68. taxfill
# never runs the script, so each stays mapped and the engine writes it. No
# widget on the blank carries a /V default.
#
# Shared /Btn radios (ONE AcroForm field, several kid widgets; one line per
# kid with its own on_state re-dumped from this blank's /AP /N, one group):
#   * "filingStatus" -- 1 Single, Divorced, Widow(er) (/fs1), 2 Joint (/fs2),
#     3 Married & Filing Separate Forms (/fs3), 5 Head of Household (/fs5).
#   * "ln38RadioDeduction" -- 38 a. STANDARD (/standard) / b. DELAWARE ITEMIZED
#     (/itemized).
#   * "directDepositAcctType" -- CHECKING (/checking) / SAVINGS (/savings).
#   * "foreignAccount" -- refund to an account outside the United States YES
#     (/YES) / NO (/NO).
#   * "ln73Radio" (Yes /Yes, No /No), "ln74Radio" and "ln75Radio" (/YES, /NO).
# Every other checkbox is its own single-state /Btn: Amended (/Yes), PIT-UND
# attached, Claimed as dependant, FULL-YEAR Non-Resident, line 23 spouse / you
# military pension, line 26b Tuition / ABLE (all /X); line 39 spouse / you 65 or
# over and blind, line 43b spouse / self 60 or over (all /Yes). Each option was
# bound to the label printed beside it by its /Rect against the text layer (the
# filing-status, direct-deposit, outside-US and page-3 boxes sit 3.6-7.2 pt LEFT
# of their label; the line 23, 26b, 38, 39 and 43b boxes sit 1.5-17 pt RIGHT of
# theirs), never by widget order, and every one was confirmed on the render.
#
# Money vs text. Every "$ ... .00" cell is `money` (whole dollars), including
# 42 Box A / Box B, the line-42 schedule amount and the two "x $110 =" amounts.
# The proration decimal and its two "( x ___ )" copies are `text` (the
# instructions carry it to four decimal places, e.g. 0.4167, which a whole-dollar
# money cell would round away). The exemption count and boxes-checked count,
# the line-44 state, names, address, dates (the part-year boxes print
# "mm-dd-yyyy" beneath them and every date widget formats with
# AFDate_FormatEx("mm-dd-yyyy"); they are plain boxes, not combs), routing / account
# numbers, phones, emails, preparer fields and the 73 / 75 explanations are `text`.
# A text maxlen equals the widget /MaxLen where one exists (IDs 9, state 2, zip 5,
# routing 9, account 17, phones 10, line-44 state 2). Of the 112 money cells, the
# 107 line-amount cells (Column A / Column B of lines 1-29, the 30a / 30b cells
# and the right-hand line cells of 31-72) carry /MaxLen 9, which verify's MaxLen
# check guards; the five line-42 / 43 sub-cells (42 Box A, 42 Box B, the 42
# schedule amount and the two "x $110 =" cells of 43a / 43b) have no /MaxLen;
# at their Helvetica 10 a digit advances 5.56 pt, so the 72 pt line-42 cells
# hold 12 digits and the 36 pt "x $110 =" cells 6 (99 exemptions x $110 is
# $10,890, five digits). The M.I. (1), suffix (4),
# preparer ID (9), counts (2 / 1) and proration boxes (6) carry pack budgets on
# widgets that have no /MaxLen.
#
form: "PIT-NON"
jurisdiction: states/de
tax_year: 2023
source_url: https://revenuefiles.delaware.gov/2023/PIT-NON_2023-01_PaperInteractive.pdf
pdf_sha256: "0646ee65db626f71685e211f194725677ada60ba65fba01f5dfe1c85ced76a7f"
acroform_root: ''
fields:

  # ============================================ page 1 -- header
