  - line: 13a                               # 13 TAXABLE SOCIAL SECURITY BENEFITS (Col A, FEDERAL)
    field: ln13ColA
    type: money
  - line: 13b                               # 13 (Col B, DELAWARE SOURCE INCOME/LOSS)
    field: ln13ColB
