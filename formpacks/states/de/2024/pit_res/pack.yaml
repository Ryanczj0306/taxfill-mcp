relations:
  # Column-split lines use a single-letter suffix (Column A = <line>a, Column B =
  # <line>b) so they parse as digit+letter line ids; the lines whose printed
  # label already carries a letter use dotted column ids (8a.b, 27a.b). Relations
  # are declared for Column B (used by every filing status).
  - "4b == 1b + 2b + 3b"                 # 4 "TOTAL - Add Lines 1 through 3"
  - "9b == 5b + 6b + 7b + 8a.b + 8b.b"   # 9 "Add Lines 5 through 8b"
  - "10b == 4b - 9b"                     # 10 "Subtract Line 9 from Line 4"
  - "12b == 10b - 11b"                   # 12 "DELAWARE ADJUSTED GROSS INCOME. Subtract Line 11 from Line 10."
  - "17b == 13b + 14b + 15b + 16b"       # 17 "SUBTOTAL - Add Line 13 through Line 16"
  - "19b == 17b - 18b"                   # 19 "NET ITEMIZED DEDUCTIONS - Subtract Line 18 from Line 17."
  - "22b == 20b + 21b"                   # 22 "TOTAL DEDUCTIONS - Add Line 20 and Line 21"
  - "23b == 12b - 22b"                   # 23 "TAXABLE INCOME - Subtract Line 22 from Line 12, and compute tax on this amount"
  - "26b == 24b + 25b"                   # 26 "TOTAL TAX - Add Line 24 and Line 25"
  - "32b == 27a.b + 27b.b + 28b + 29b + 30b + 31b"  # 32 "TOTAL NON-REFUNDABLE CREDITS - Add Line 27a through Line 31"
  - "50b == 48b + 49b"                   # 50 "SUBTOTAL. Add Lines 48 and 49."
  - "53b == 50b - 51b - 52b"             # 53 "Subtract Line 51 and Line 52 from Line 50."
cross_form:
  # SECTION A line 1 "FEDERAL AGI AMOUNT FROM FEDERAL FORM 1040" == federal AGI, 2024 Form 1040 line 11.
  - "1b == f1040.11"
