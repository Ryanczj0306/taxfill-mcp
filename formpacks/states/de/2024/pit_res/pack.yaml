# Form PIT-RES, 2024 -- Delaware Individual RESIDENT Income Tax Return.
# Resident return.
#
# Provenance / freshness. Blank downloaded from the official source_url below;
# see PRINTED IDENTITY in the port banner above. printed_year_verified = 2024.
# pdf_sha256 pinned to the exact downloaded file (golden test verifies it).
#
# Layout / what is FILED. Single 4-page PDF; ALL FOUR PAGES ARE THE FILED RETURN
# (no instruction/worksheet pages in this file). Every dollar line has TWO printed
# columns: COLUMN A (spouse, Filing Status 4 -- Married & Filing Combined Separate
# -- only) and COLUMN B (all other filing statuses). Each split dollar line is
# mapped with a single-letter column suffix: <line>a (Column A) and <line>b
# (Column B), so the ids stay digit+letter (referenceable in relations). The four
# printed lines that ALREADY carry a letter (8a, 8b, 27a, 27b) take their columns
# as the dotted ids 8a.a/8a.b, 8b.a/8b.b, 27a.a/27a.b, 27b.a/27b.b.
#   page 1 -- header (two 9-box comb Taxpayer IDs you/spouse; first/MI/last/suffix
#             for you + spouse; home address + apartment merged into one street
#             box; city/state/zip; fiscal-year begin/end; Amended flag; Form
#             PIT-UND attached flag; Claimed-as-dependent flag; part-year residency
#             start/end dates), FILING STATUS lines 1-5 (ONE /Btn radio
#             "filingStatusRadio", 5 distinct on_states), SECTION A additions
#             lines 1-4, SECTION B subtractions 5-12 (line 6 military-pension
#             spouse/self flags; line 8b 529/ABLE spouse/self flags), SECTION C
#             deductions 13-19.
#   page 2 -- "NAME / TAXPAYER ID" header row; SECTION C continued: line 20
#             standard/itemized election (ONE /Btn "ln20DeductionType") + amount,
#             line 21 age65/blind flags spouse/self + amount, 22 total deductions;
#             SECTION D calculations 23-40 (27a exemption count + per-column
#             counts; 27b 60-or-over flags spouse/self + boxes-checked count; 29
#             volunteer-firefighter company # spouse/self; line 34 EITC refundable
#             /non-refundable ONE /Btn "eitcRefundable").
#   page 3 -- header row; lines 41-42 (Column A + B) and 43-47 (COLUMN B only);
#             SECTION E direct deposit (account type checking/savings ONE /Btn;
#             routing; account; outside-US Yes/No ONE /Btn "foreignAccount"); DMV
#             State ID; signature block (you/spouse sign dates, home/business
#             phone, email); Paid Preparer block; mailing boxes.
#   page 4 -- header row; FOR AMENDED RETURNS ONLY: lines 48-55 (Column A + B)
#             and 56-59 (Column B only); line 60 amended-federal Yes/No + detail;
#             line 61 audit-advised Yes/No; line 62 protective-claim Yes/No +
#             detail; mailing boxes. Every page-4 widget except the two header
#             kids is /F Hidden in the blank until the DOR's own script
#             un-hides it (see Hidden widgets above).
#
# AcroForm. FLAT form: acroform_root = '' . Every widget /T is the raw flat id the
# form ships with (descriptive: fiscalStart, ln01ColA, filingStatusRadio, ...). No
# /Parent name chain beyond the radio kids, the three-kid tpName / tpID header
# fields, and the single-kid parents ln08bColB / ln27bColB (a /Parent walk over
# every page's /Annots). 198 widget entries on 183 fields.
# EXCLUDED: 'printForm' + 'resetForm' (JavaScript pushbuttons, page 1, their
# "on_states" are just XObject dict keys /BBox /Filter /Matrix /Resources
# /Subtype, not real states) and 'machPrintID' (a ReadOnly 7pt machine-print scan
# id in the page-1 margin, not a fillable taxpayer field). All other widgets are
# mapped: 191 line entries below over 180 fields / 195 widgets.
#
# Shared /Btn radios (ONE AcroForm field, many physical kid widgets; mapped once
# per physical box with distinct on_state, sharing one group per CONVENTIONS;
# every on_state dumped from this blank's /AP /N and placed by rect + render):
#   * "filingStatusRadio" -- FILING STATUS lines 1-5: 1 Single/Divorced/Widow(er)
#     (/4), 2 Joint (/0), 3 Married & Filing Separate Forms (/1), 4 Married &
#     Filing Combined Separate on this form (/2), 5 Head of Household (/3).
#   * "ln20DeductionType" -- line 20 election: 20a Standard (/0) / 20b Itemized
#     (/1). (Two widget kids share this one field.)
#   * "eitcRefundable" -- line 34 EITC: Refundable (/0) / Non-refundable (/1).
#   * "directDepositType" -- Section E account type: Checking (/0) / Savings (/1).
#   * "foreignAccount" -- Section E "account located outside the US?" Yes (/0) /
#     No (/1).
#   * "amendedFederal" (line 60) / "auditAdvised" (line 61) / "protectiveClaim"
#     (line 62) -- each ONE /Btn with Yes (/YES) / No (/NO).
# Every OTHER checkbox is its own independent single-state /Btn: Amended flag
# (/Yes), PIT-UND attached (/X), Claimed-as-dependent (/X), line 6 military
# pension spouse/self (/X), line 8b 529/ABLE spouse/self (/X), line 21 age65/blind
# spouse/self (/Yes), line 27b 60-or-over spouse/self (/Yes). The line 6, 8b, 21
# and 27b sets are adjudicated INDEPENDENT in SEPARATE_OPTION_SETS_ADJUDICATED
# (one box per person / per condition; any combination may apply).
#
# ReadOnly (P-007 class 4). The 22 cells of lines 4, 9, 10, 17, 19, 22, 23, 26,
# 33, 41, 42 (Columns A and B) carry /Ff 8388609 and a DOR calculate script;
# taxfill never runs it, so they stay mapped and are written like any other
# line (STATE_COMPUTED_READONLY, test_readonly_widget_mapping.py).
#
# Money vs text. Every numbered dollar line prints a "$ ... .00" whole-dollar cell
# and is mapped `money` (lines 1-59, split a/b where both columns exist). The two
# Taxpayer IDs are 9-cell comb SSN boxes -> text, comb, maxlen 9, format
# ssn_digits_only; the routing (9) and account (17) boxes are combs too (the DMV
# State ID box is plain text in this revision). Counts (27a number-of-exemptions + per-column, 27b boxes checked),
# the line-29 volunteer-firefighter company #s, names, address, city/state/zip,
# fiscal & part-year dates, phones, email, signature dates, preparer address/city/
# state/zip/EIN/phone/email, the pages-2-4 header NAME / TAXPAYER ID, and the line
# 60/62 free-text explanations stay `text`.
#
# Header mirrors. tpName ("NAME") and tpID ("TAXPAYER ID") are each ONE AcroForm
# field whose three widget kids sit at the top of pages 2, 3 and 4, so each is
# mapped exactly once (header.name / header.taxpayer_id) and one write fills all
# three pages. No DOR script copies the page-1 identity into them; a caller fills
# header.name from name.first/last and header.taxpayer_id from identifying_number
# (the schema cannot assert that equality; see CONVENTIONS "Identity page
# mirrors"). The keys are deliberately not page-numbered: the field spans three
# pages.
#
# Relations (on-face arithmetic, unconditional, every operand mapped; declared for
# Column B which every filing status uses; dotted column ids are accepted since
# Phase J JP5c). OMITTED: floor-at-zero / branch / "see instructions" lines (33
# balance "enter 0", 41/42 balance-due vs overpayment, 46/47 and 58/59 "For
# Filing Status 4, see instructions", 48 "Add Line 40 and any EITC on Line 34",
# conditional on the refundable-EITC election, 54/55 amended branch). Line 23 prints an
# unconditional subtraction and is declared (the 2023 base left its line 22
# out; nothing on this face conditions it, and the DOR's own calculate script on
# the ReadOnly ln23 cells subtracts line 22 from line 12).
#   4  "TOTAL - Add Lines 1 through 3"                 -> 4b == 1b + 2b + 3b
#   9  "Add Lines 5 through 8b"                        -> 9b == 5b + 6b + 7b + 8a.b + 8b.b
#   10 "Subtract Line 9 from Line 4"                   -> 10b == 4b - 9b
#   12 "Subtract Line 11 from Line 10"                 -> 12b == 10b - 11b
#   17 "SUBTOTAL - Add Line 13 through Line 16"        -> 17b == 13b + 14b + 15b + 16b
#   19 "Subtract Line 18 from Line 17"                 -> 19b == 17b - 18b
#   22 "TOTAL DEDUCTIONS - Add Line 20 and Line 21"    -> 22b == 20b + 21b
#   23 "TAXABLE INCOME - Subtract Line 22 from Line 12" -> 23b == 12b - 22b
#   26 "TOTAL TAX - Add Line 24 and Line 25"           -> 26b == 24b + 25b
#   32 "Add Line 27a through Line 31"                  -> 32b == 27a.b + 27b.b + 28b + 29b + 30b + 31b
#   50 "SUBTOTAL. Add Lines 48 and 49."                -> 50b == 48b + 49b
#   53 "Subtract Line 51 and Line 52 from Line 50."    -> 53b == 50b - 51b - 52b
#
# Cross_form. SECTION A line 1 "FEDERAL AGI AMOUNT FROM FEDERAL FORM 1040" ==
# federal AGI, which the 2024 Form 1040 prints on line 11 (Column B, used by all
# non-status-4 filers).
form: "PIT-RES"
jurisdiction: states/de
tax_year: 2024
source_url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT-RES_2024-01_PaperInteractive.pdf
pdf_sha256: "8c98cff70f22addb1599696a67999e0c8bfb12d03cb5fa4c77f8bd41fdb1825a"
acroform_root: ''
fields:

  # ============================================ page 1 -- header
  - line: identifying_number             # "Your Taxpayer ID" (9-cell comb)
    field: taxPayerID
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: spouse.identifying_number      # "Spouse Taxpayer ID" (9-cell comb)
    field: spouseTaxpayerID
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: name.first                     # "Your First Name"
    field: firstName
    type: text
  - line: name.middle_initial            # "M.I."
    field: middleInitial
    type: text
    maxlen: 1
  - line: name.last                      # "Last Name"
    field: lastName
    type: text
  - line: name.suffix                    # "Suffix"
    field: suffix
    type: text
    maxlen: 4
  - line: spouse.name.first              # "Spouse First Name"
    field: spouseFirstName
    type: text
  - line: spouse.name.middle_initial     # spouse "M.I."
    field: spouseMiddleInitial
    type: text
    maxlen: 1
  - line: spouse.name.last               # spouse "Last Name"
    field: spouseLastName
    type: text
  - line: spouse.name.suffix             # spouse "Suffix"
    field: spouseSuffix
    type: text
    maxlen: 4
  - line: mailing_address.street         # "Present Home Address (Number and Street)" + Apartment #
    field: homeAddress
    type: text
  - line: mailing_address.city           # "City"
    field: city
    type: text
  - line: mailing_address.state          # "State"
    field: state
    type: text
    maxlen: 2
  - line: mailing_address.zip            # "Zip Code"
    field: zip
    type: text
    maxlen: 5
  - line: fiscal_year.begin              # "For Fiscal Year beginning"
    field: fiscalStart
    type: text
  - line: fiscal_year.end                # "and ending"
    field: fiscalEnd
    type: text
  - line: amended.yes                    # "Amended Return — Must include page 4" flag (top right)
    field: amendedChk
    type: checkbox
    on_state: /Yes
  - line: pit_und_attached.yes           # "Form PIT-UND Attached"
    field: pitund
    type: checkbox
    on_state: /X
  - line: claimed_as_dependent.yes       # "Claimed as Dependant on someone else's return"
    field: PITRES_ClaimDependent
    type: checkbox
    on_state: /X
  - line: part_year.start                # "If you were a part-year resident in 2024, give the dates..." (start, mm-dd-yyyy)
    field: partYearStart
    type: text
  - line: part_year.end                  # part-year residency end date (mm-dd-yyyy)
    field: partYearEnd
    type: text

  # ============================================ Filing Status lines 1-5 (ONE /Btn "filingStatusRadio", physical position; states re-dumped from this blank)
  - line: filing_status.single           # 1 Single, Divorced, Widow(er) (row 1, x=349)
    field: filingStatusRadio
    type: checkbox
    on_state: /4
    group: filing_status
  - line: filing_status.joint            # 2 Joint (row 1, x=436)
    field: filingStatusRadio
    type: checkbox
    on_state: /0
    group: filing_status
  - line: filing_status.married_filing_separate  # 3 Married & Filing Separate Forms (row 1, x=486)
    field: filingStatusRadio
    type: checkbox
    on_state: /1
    group: filing_status
  - line: filing_status.married_filing_combined_separate  # 4 Married & Filing Combined Separate on this form (row 2, x=349)
    field: filingStatusRadio
    type: checkbox
    on_state: /2
    group: filing_status
  - line: filing_status.head_of_household  # 5 Head of Household (row 2, x=486)
    field: filingStatusRadio
    type: checkbox
    on_state: /3
    group: filing_status

  # ============================================ SECTION A -- ADDITIONS (lines 1-4)
  - line: 1a                             # 1 FEDERAL AGI AMOUNT FROM FEDERAL FORM 1040 (Col A)
    field: ln01ColA
    type: money
