# South Carolina SC1040 (Rev. 4/21/25) — 2025 Individual Income Tax Return.
#
# PRINT-ONLY (C3): the official SC1040 PDF is a flat scannable form — NO
# AcroForm widgets and NO XFA (pypdf: no /AcroForm, get_fields() None), so it
# cannot be filled programmatically. HAND-FILL pack (render_mode: hand_fill):
# the engine computes every derivable line and emits a line->value worksheet,
# and every line carries an `overlay` box so fill_form STAMPS the worksheet
# onto the printed blank.
#
# ===========================================================================
# TY2025 PORT of formpacks/states/sc/2023/sc1040/handfill.yaml (ported
# 2026-10-01, Phase J JS5).
#
# BLANK. https://dor.sc.gov/sites/dor/files/forms/SC1040_2025.pdf — two
# separate curl downloads and the scaffold's triage copy all digest to
# f1cc1b2e…770a (109,623 bytes, pinned below). 3 pages, 612 x 792.
#
# PRINTED IDENTITY. Page 1 prints "STATE OF SOUTH CAROLINA / DEPARTMENT OF
# REVENUE / 2025 INDIVIDUAL INCOME TAX RETURN / SC1040 / (Rev. 4/21/25) /
# 3075" (the 2023 blank: Rev. 4/18/23); the page serials are 30751259 /
# 30752257 / 30753255 (2023: 30751234 / 30752232 / 30753230); pages 2-3
# print "Page N of 3", "Your SSN _____________ 2025".
#
# LAYOUT CENSUS (layoutdiff, facediff, movebox and a pypdfium2 path census
# of both blanks):
#   * printed words: page 1 547/559 matched, 75% within 0.5 pt — the 25%
#     that moved are the five return-type caption rows (y 270-365), which
#     the 2025 face re-words and re-flows: four captions gain bold prefixes
#     ("Part-Year/Nonresident:", "Composite:", "Extension:", "Military:")
#     and the "Amended Return:" caption, already prefixed in 2023, changes
#     "Check if this is" to "Check this box if this is"; no other page-1
#     word moved (the header, fiscal-year line,
#     name / address block, filing status and dependents table only swap
#     year tokens). Pages 2 and 3: 99% within 0.5 pt, the rest year tokens.
#   * path objects (2023 133 / 299 / 250 per page; 2025 134 / 299 / 250):
#     every ruled cell, checkbox square, SSN tick and underline is within
#     0.01 pt of its 2023 bounds, except the header logo strokes (x 154-161,
#     y 731-757, every page — not an entry area) and ONE NEW RULE on page 1
#     at (161.85, 267.83)-(345.52, 269.63) under "Name of the combat zone:",
#     where the 2023 blank printed an underscore string (170.82-354.52,
#     y 269.07-269.71).
#   * movebox on the 164 boxes: 142 SAME, 0 MOVED, 22 RE-MEASURE (anchors
#     that are dot leaders, the re-flowed captions or the serial). Every box
#     was then framed on THIS blank: 82 sit in their own ruled
#     cell, 30 in a path that draws several cells at once (the
#     checkbox columns, the dependents table), 27 on a ruling
#     line, 13 on a printed underscore, and 12
#     (filing_status.single, filing_status.mfj, filing_status.mfs, filing_status.hoh, filing_status.qss, p.spouse.dob, p.surviving_spouse.dob, p.military_spouse.dob, p.military_surviving_spouse.dob, q.spouse.dob, 32.penalties, preparer.firm) have no frame in either year's path or text
#     layer and rest on the whole-page path diff. Per page (boxes, same
#     frame as 2023): p1 56/55, p2
#     55/55, p3 53/53.
#   * CARRIED box for box: 163 of 164 (pages 2-3 entirely; page 1 all but
#     one), each read on a render of THIS blank. RE-MEASURED: combat_zone_name
#     x 172.82 -> 163.85 (the new rule's left end 161.85 + 2 pt; w 179.7
#     kept, ending at 343.55 inside the rule's 345.52; baseline 271.1 kept,
#     1.5 pt above the rule's top 269.63 exactly as it sat above the 2023
#     underscore top 269.71); the caption "Name of the combat zone:" now ends
#     at x 159.4 (2023: 167.3).
#
# FACE DELTAS vs 2023 (the complete printed-text diff, facediff --layout):
#   * header "(Rev. 4/21/25)", "2025 INDIVIDUAL INCOME TAX RETURN"; fiscal
#     year "beginning __________, 2025 and ending __________, 2026";
#   * the five return-type captions re-worded (four gain prefixes, above) and
#     the combat-zone name blank drawn as a rule (above); checkboxes unmoved;
#   * "Number of dependents claimed on your 2025 federal return", "... under
#     the age of 6 years as of December 31, 2025", "... age 65 or older as of
#     December 31, 2025";
#   * page 2: line s "Subsistence allowance (multiply ______ days by $16)"
#     (2023: $8); line 5's caption drops a comma; "Your SSN ... 2025";
#   * page 3: line 17 "2025 Estimated Tax payments", line 27 "credited to
#     your 2026 Estimated Tax", MAIL TO "REFUNDS OR ZERO TAX DUE" (2023:
#     "REFUNDS OR ZERO TAX"); the addresses are unchanged.
# No line was added, dropped or renumbered: lines 1-37, additions a-e,
# subtractions f-w with the p-1..p-6 / q-1..q-2 sub-lines, 22a-22e (22e
# still "Reserved for future use", never filled) all print as in 2023.
#
# INSTRUCTIONS AND FIGURES (re-read 2026-10-01): the 2025 SC1040
# Instructions are at https://dor.sc.gov/sites/dor/files/forms/SC1040Instr_2025.pdf
# (August 2025, sha256 e75216d4…b931; the 2023 file pattern
# SC1040inst_2025.pdf returns the DOR error page). Line s: "$16 per regular
# workday"; line t and line w worksheets: "$4,930" per dependent; line 6:
# SC1040TT under $100,000, else the SC1040TT rate schedule ("Multiply the
# amount on line 5 by 6%; Subtract $642", SC1040TT_2025.pdf, Rev. 6/17/25,
# sha256 bf27744d…26b5). knowledge/states/sc/2025.yaml agrees ($4,930; 0% /
# 3% / 6% with $3,560 / $17,830 bounds and the $107 / $642 constants); it
# records no subsistence figure. SC1040TT lookups stay manual notes.
#
# SCOPE (unchanged from 2023): header / status / dependents, income and
# adjustments (line 1, additions a-e, subtractions f-w, lines 2-10),
# nonrefundable credits 11-15, payments and refundable credits 16-23,
# overpayment / due 24-34, refund / payment options 35-37, signature date,
# preparer block. Lines 4 and 32 add their dotted sub-lines (compute
# grammar since JP5c). The signatures themselves stay hand-written.
#
# OVERLAY COORDINATES (measured 2026-09-28 on the 2023 blank, Phase J JS4d;
# carried to this blank as censused above): SC's entry areas are ruled
# table cells; each baseline sits about 3 pt above its cell's bottom rule,
# below the caption. The SSNs use `cells` (3-2-4 around the printed ticks at
# x 92.29 / 127.95 on page 1), and Your SSN is also stamped in the page 2-3
# "Your SSN" headers. The demo and full returns (test_sc1040_2025_overlay.py)
# were stamped on THIS blank, verified on every placement, rendered at 144
# dpi in page halves and read: every value inside its cell, on its row, in
# its column, every X inside its square, nothing over a printed caption.
# ===========================================================================
form: "SC1040"
jurisdiction: states/sc
tax_year: 2025
render_mode: hand_fill
source_url: https://dor.sc.gov/sites/dor/files/forms/SC1040_2025.pdf
pdf_sha256: "f1cc1b2edf2143fabe5f4e5a1b19226fa2b6029c61e9a833309a92c3d963770a"
