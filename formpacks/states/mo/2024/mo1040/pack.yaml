    field: "moa_pt5_3y"
    type: money
  - line: "moa_pt5_3s"  # 3S Amount from Line(s) 1S or 2S — JS-computed, ReadOnly
    field: "moa_pt5_3s"
    type: money
  - line: "moa_pt5_4"  # 4 Total social security/social security disability. Add Lines 3Y and 3S — JS-computed, ReadOnly
    field: "moa_pt5_4"
    type: money
