#     cites "Form MO-1040, Line 1Y and Line 1S" (was "Form 1040"), line 5 now
#     carries to "Form MO-CR, Line 10" (was MO-1040 Line 31Y/31S), and the
#     state-abbreviation row asks for "the state" (singular). Same five
#     printed lines, same widgets, zero rect drift — mapping unchanged.
#   * MO-CRP pages: "will result in denial" -> "may result in denial".
#     MO-TC instructions list new credit codes (EIJ, RAC). No widget effect.
#
# VERIFIED BY SENTINEL SWEEP + VISION AUDIT (2026-08-25): all 890 mapped
# lines filled through fill_form with unique sentinels (886 values — one per
# option group), all 32 pages rendered at 200 dpi and READ page by page. The
# restructured page 9 (Sections A/B/C/D) and the new page 10 (MO-WFTC) were
