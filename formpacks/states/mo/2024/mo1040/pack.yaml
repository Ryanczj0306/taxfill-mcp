    field: "moa_pt5_TE"
    type: money
  - line: "printlid.10"
    field: "printlid.10"
    type: text
  # Form MO-WFTC - 2024 Missouri Working Family Tax Credit (Revised 12-2024),
  # NEW to the 2024 bundle on document page 10. Its header name/SSN cells are
  # extra widgets of the page-1 identity fields (SSN-1/SSN-2, firstname/min/
  # lastname-1/-2) and are not re-mapped. The three qualification questions are
  # each TWO independent single-widget /Btn fields (P-008 shape): the blank's
  # own MultiCB JavaScript makes them exclusive in a viewer, taxfill never runs
  # it, so each pair carries a group id. `required` is left off — MO-WFTC is an
  # optional credit form. NOTE: the DOR named question 2's fields "MFJ_*" but
  # its printed text asks about married-filing-SEPARATELY / claimed-as-a-
  # dependent status; the mapping follows the printed face, not the name.
  - line: "EIC_YES"  # Q1 Did you qualify for the Federal EIC on Federal Form 1040 or 1040SR? Yes - Continue
    field: "EIC_YES"
    type: checkbox
    on_state: "/X"
    group: "wftc_q1_eic"
  - line: "EIC_NO"  # Q1 No - STOP. You do not qualify
    field: "EIC_NO"
    type: checkbox
    on_state: "/X"
    group: "wftc_q1_eic"
  - line: "MFJ_YES"  # Q2 Filing status married filing separately or claimed as a dependent? Yes - STOP
    field: "MFJ_YES"
    type: checkbox
    on_state: "/X"
    group: "wftc_q2_mfs_or_dependent"
  - line: "MFJ_NO"  # Q2 No - Continue
    field: "MFJ_NO"
    type: checkbox
    on_state: "/X"
    group: "wftc_q2_mfs_or_dependent"
  - line: "INV_YES"  # Q3 Investment income equal to or greater than $4,300? Yes - STOP
    field: "INV_YES"
    type: checkbox
    on_state: "/X"
    group: "wftc_q3_investment_income"
  - line: "INV_NO"  # Q3 No - Continue
    field: "INV_NO"
    type: checkbox
    on_state: "/X"
    group: "wftc_q3_investment_income"
