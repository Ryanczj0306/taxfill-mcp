  # MO-A Part 3 Section A (Public Pension Calculation) was re-authored for
  # 2024: the old AGI phase-out steps (2023 printed lines 1-5, fields
  # moa_pt3_1..moa_pt3_5) are gone from the printed face, and the ladder is
  # now printed lines 1-5 on new Y/S-split fields. Captions below are the 2024
  # printed rows, read off the sentinel render of document page 9.
  - line: "moa_pt3_1y"  # 1Y Taxable pension from public sources (fed 1040/1040-SR line 5b), Yourself
    field: "moa_pt3_1y"
    type: money
  - line: "moa_pt3_1s"  # 1S same, Spouse
    field: "moa_pt3_1s"
    type: money
  - line: "moa_pt3_2y"  # 2Y Amount from Line 1 or $46,381 (max social security benefit), whichever is less — JS-computed, ReadOnly
    field: "moa_pt3_2y"
    type: money
  - line: "moa_pt3_2s"  # 2S same, Spouse — JS-computed, ReadOnly
    field: "moa_pt3_2s"
    type: money
  - line: "moa_pt3_3y"  # 3Y amount carried from Section C Line 3Y — JS-computed, ReadOnly
    field: "moa_pt3_3y"
    type: money
  - line: "moa_pt3_3s"  # 3S amount carried from Section C Line 3S — JS-computed, ReadOnly
    field: "moa_pt3_3s"
    type: money
  - line: "moa_pt3_4y"  # 4Y Subtract Line 3 from Line 2 (enter $0 if Line 3 > Line 2) — JS-computed, ReadOnly
    field: "moa_pt3_4y"
    type: money
  - line: "moa_pt3_4s"  # 4S same, Spouse — JS-computed, ReadOnly
    field: "moa_pt3_4s"
    type: money
  - line: "moa_pt3_5"  # 5 Total public pension. Add amounts on Lines 4Y and 4S — JS-computed, ReadOnly.
    field: "moa_pt3_5"  # SAME field name as 2023 but a NEW printed meaning (2023 line 5 was the phase-out subtraction step)
    type: money
