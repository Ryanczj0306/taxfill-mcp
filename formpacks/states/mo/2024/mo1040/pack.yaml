#     "MO-A Part 5 Line 5" were dropped; "MO-A Part 3 Line 3", "MO-A Part 5
#     Line 1", "MO-A Part 5 Line 2" and btnGotoMOWFTC were added. Net 140->139.
#
# REVISION IDENTITY. Page 1 of the pinned PDF extracts "2024 Individual
# Income Tax Return - Long Form", "Form MO-1040", "For Calendar Year January
# 1 - December 31, 2024", and the 24-prefixed scanline barcode 24322010006
# (2023: 23322010006). Page 10 extracts "Form MO-WFTC 2024 Missouri Working
# Family Tax Credit ... Form MO-WFTC (Revised 12-2024)". 32 pages, same
# bundle page count as 2023. It is the 2024 revision, not a re-issued 2023.
#
# READONLY RE-ADJUDICATION (knowledge/pitfalls.yaml P-007). mapped∩ReadOnly
# measured against BOTH sha-pinned blanks at field level: 2023 = 262 (the
# STATE_COMPUTED_READONLY pin), 2024 = 260. The delta, every field of it:
#   * -20: the 25 re-authored Part 3 names above took 20 ReadOnly bindings
#     with them (the JS-computed steps of the old Section A/C ladders).
#   * +16: of the 36 new fields, 16 are ReadOnly and ALL are mapped, each
#     verified against the 2024 blank's document JavaScript by quoted name:
#     - class 4 JS-COMPUTED (14): moa_pt3_2y/2s (min of Line 1 and $46,381),
#       moa_pt3_3y/3s (carried from Section C Lines 3Y/3S), moa_pt3_4y/4s
#       (Line 2 minus Line 3, floored at 0), moa_pt5_3y/3s (Line 1 or Line 2
#       pick), moa_pt5_4 (add 3Y+3S), wftc_line6 (20% of wftc_line5),
#       wftc_line7 (= line36), wftc_line8 (= line42+line43), wftc_line9
#       (line7-line8 floored at 0), wftc_line10 (min(line6,line9), carried to
#       MO-1040 line 44). taxfill never runs the JS, so unmapped they ship
#       BLANK on the filed return.
#     - class 4 JS-GATED UI DEFAULT (2): moa_pt5_1y/1s ("Taxable social
#       security benefits for each spouse") — the document script UNLOCKS the
#       cell (readonly=false, transparent fill) when the filer's age box 62-Y/
#       65-Y (resp. 62-S/65-S) is checked and re-locks it otherwise, the exact
#       OH IT-1040 L17/L19 shape. The printed row is filer data for anyone the
#       age boxes qualify; unmapping it would file a blank Section C for every
#       SS-exemption claimant.
#   * +2: two SURVIVING fields gained the ReadOnly bit (/Ff 12582912 ->
#     12582913), the only /Ff changes on any surviving field, both KEPT
#     mapped:
#     - line20 — printed line 20 changed from "Bring jobs home deduction" to
#       "20. Reserved", its per-line calculate pushbutton was dropped, its
#       Ultraforms barcode line was removed from the 2024 JS (the "UF_Text +=
#       GF(\"line20\")" row is gone; only the line-25 sum list still names it,
#       summing blank as 0), and — caught by the vision audit, since a filled
#       sentinel did not print — its annotation gained the /F Hidden flag
#       (4 -> 6; the base's only other hidden-mapped widgets are the nine
#       2023-inherited JS helpers 33_YS/33_SP/adjLine14/bankaccttype/fdata/
#       line51txt/txt01/txt02/txtItemError). P-007 class 3 (a printed,
#       numbered line reading "Reserved"): KEPT mapped with a leave-blank
#       comment, the f1040-line-30 precedent, so the revision that un-reserves
#       it is a widget swap instead of an API change.
#     - line44 — printed caption UNCHANGED ("Missouri Working Family Tax
#       Credit (Attach Form MO-WFTC and federal return)"), but the newly
#       bundled MO-WFTC's JS now computes it: getField("line44").value =
#       getField("wftc_line10").value. P-007 class 4, the OH 2024
#       joint-filing-credit precedent: unmapping it would file a BLANK credit,
#       so it stays mapped and the pin count carries it.
#   * No surviving field LOST the ReadOnly bit.
#   The integrator must pin states/mo/2024/mo1040/pack.yaml at 260 in
#   STATE_COMPUTED_READONLY (test_readonly_widget_mapping.py).
#
# P-008 (separate-widget Yes/No pairs). The three new MO-WFTC qualification
# questions are TWO independent single-widget /Btn fields each (EIC_YES +
# EIC_NO, MFJ_YES + MFJ_NO, INV_YES + INV_NO; /Ff 49152, one /X state each,
# no shared parent). The blank's own JS makes them exclusive in a viewer
# (CBA = ["EIC_YES","EIC_NO"] toggle handlers) but taxfill never runs it, so
# per P-008 this shape gets NO exemption: each pair carries a group id below
# (wftc_q1_eic / wftc_q2_mfs_or_dependent / wftc_q3_investment_income).
# `required` is left off: MO-WFTC is an optional credit form, and marking one
# would fail verification on every return that does not claim it. NOTE the
# DOR named question 2's fields "MFJ_*" while its printed text asks about
# married-filing-SEPARATE/dependent status — the mapping was made from the
# widget's position on the printed face, not from the name.
#
# CalcOption (the SHARED_FIELD_OPTIONS_WITHOUT_GROUP_ID debt row, count 1):
# unchanged on 2024 — still ONE /Btn, two page-1 widgets, /AP states /X and
# /N. The two option lines below still share the field without a group id;
# the integrator carries the debt row over for this pack (count 1).
#
# PRINTED-FACE DIFF beyond pages 9-10 (all 32 pages text-diffed; no other
# line was inserted, split, removed or renumbered):
#   * MO-1040: line 14's standard deductions rolled ($13,850/$20,800/$27,700
