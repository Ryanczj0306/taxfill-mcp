# TOPOLOGY VERDICT: NEAR-PORT — but a real one, not a three-line swap. The
# 2024 bundle RESTRUCTURED Form MO-A Part 3 (Sections A and C shrank), moved
# MO-A page 3's Section C/D onto document page 9, and ADDED a whole new form
# to the bundle: Form MO-WFTC (Missouri Working Family Tax Credit) on document
# page 10. Read the notes below before touching anything.
#
# MEASURED TOPOLOGY (field level, /Ff//MaxLen//FT resolved up /Parent —
# CONVENTIONS.md warns annotation-level diffs report phantom changes):
#   * 2023 blank: 1,018 distinct AcroForm fields (878 fillable + 140
#     pushbuttons), 1,172 widget annotations. 2024 blank: 1,028 distinct
#     fields (889 fillable + 139 pushbuttons), 1,191 widget annotations.
#   * 25 base-mapped names DO NOT EXIST on the 2024 blank — all of them the
#     MO-A Part 3 Section A and Section C ladders the DOR re-authored:
#       Section A (2023 printed lines 1-11): moa_pt3_1, moa_pt3_2, moa_pt3_3,
#         moa_pt3_4, moa_pt3_6y, moa_pt3_6s, moa_pt3_7y, moa_pt3_7s,
#         moa_pt3_8y, moa_pt3_8s, moa_pt3_9y, moa_pt3_9s, moa_pt3_10,
#         moa_pt3_11 (14 names; moa_pt3_5 SURVIVES, see below)
#       Section C (2023 printed lines 1-8): moa_pt5_1, moa_pt5_2, moa_pt5_3,
#         moa_pt5_4y, moa_pt5_4s, moa_pt5_5y, moa_pt5_5s, moa_pt5_6y,
#         moa_pt5_6s, moa_pt5_7, moa_pt5_8 (11 names)
#   * 36 NEW fillable fields are mapped in their place, every one read off the
#     2024 printed face: the new Section A ladder moa_pt3_1y/1s..4y/4s (2024
#     Section A is printed lines 1-5: enter public pension, cap at $46,381,
#     subtract the Section C carry, floor at $0, total), the new Section C
#     ladder moa_pt5_1y/1s..3y/3s + moa_pt5_4 (2024 Section C is printed
#     lines 1-4: SS benefits, SS disability benefits, the 1-or-2 pick, total),
#     and the 21 Form MO-WFTC fields (three Yes/No qualification questions
#     EIC_YES/NO, MFJ_YES/NO, INV_YES/NO; the three-row qualifying-child table
#     QCName/QCSSN/QCDOB-1..3; the credit ladder wftc_line5..wftc_line10).
#   * SURVIVING-NAME REBINDS, checked for EVERY mapped field by diffing page +
#     /Rect + /Ff + /MaxLen + /AP states at field level across both blanks:
#     - moa_pt3_5 keeps its name, page and column but its PRINTED ROW CHANGED:
#       2023 line 5 read "Subtract Line 4 from Line 3..." (mid-ladder step);
#       2024 line 5 reads "Total public pension. Add amounts on Lines 4Y and
#       4S" (the section total — 2023's line 11). Same key, new meaning; the
#       inline comment carries the 2024 caption.
#     - moa_pt5_TE (Part 3 Section D total exemption) moved from document page
#       10 to document page 9 (the WFTC took page 10). Same printed caption.
#     - moa_pt4_1..moa_pt4_9 (Part 3 Section B, printed lines 1-9, unchanged
#       captions) slid UP 185pt on page 9 because Section A shrank. Verified
#       against the printed face on the sentinel render, not assumed.
#     - line20 and line44 gained /Ff ReadOnly — adjudicated below.
#     - identity fields SSN-1/SSN-2/firstname-1/-2/min-1/-2/lastname-1/-2 each
#       grew ONE widget occurrence (the MO-WFTC page-10 header block). Same
#       field, one value fills all occurrences — no new line keys.
#     - Cosmetic /Rect drift <= 4.5pt on the Form 5632 block (page 31:
#       accountnumber-1..4, amount-1..4, totaldeposit), title-1/title-2, and
#       printlid.1/5/6/9/22/31; moa_pt3_5 slid 10pt within its own (new) total
#       row. No /MaxLen changed on any surviving field; no checkbox /AP state
#       set changed; no /FT changed.
#   * Pushbutton churn (all remain UNMAPPED like the base's 140): the CRP2023
#     banner button is now CRP2024 (still a pushbutton, /Ff 65537, one widget
#     on each MO-CRP copy, pages 24-28 — still correctly NOT mapped); per-line
#     calculate buttons "Line 20",
