  # Calculation) was likewise re-authored: the old AGI phase-out steps (2023
  # printed lines 1-3, fields moa_pt5_1..moa_pt5_3) are gone, and the ladder
  # is now printed lines 1-4. Sections C and D moved from document page 10 to
  # page 9 (Form MO-WFTC took page 10).
  - line: "moa_pt5_1y"  # 1Y Taxable social security benefits (fed 1040/1040-SR line 6b), Yourself —
    field: "moa_pt5_1y"  # JS-gated: the form's script unlocks this cell only while age box 62-Y or 65-Y is checked (ReadOnly is the locked default)
    type: money
  - line: "moa_pt5_1s"  # 1S same, Spouse — unlocked by 62-S or 65-S
    field: "moa_pt5_1s"
    type: money
  - line: "moa_pt5_2y"  # 2Y Taxable social security disability benefits (fed 1040/1040-SR line 6b), Yourself
    field: "moa_pt5_2y"
