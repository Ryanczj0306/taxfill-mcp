# The narrative below re-states the base pack's description for the 2025
# blank; every count in it was re-measured here.
# ===========================================================================
# Form MO-1040, 2025 - Missouri Individual Income Tax Return (Long Form),
# together with every schedule and worksheet bundled in the official
# "MO-1040 Fillable Calculating" PDF (2025 page order): the 5-page MO-1040
# return (pages 1-5); Form MO-A (Individual Income Tax Adjustments, Parts 1-3
# with the Part 2 net-state-income-taxes worksheet, pages 6-8); Form MO-PTS
# (Property Tax Credit Schedule, pages 9-10); Form MO-CRP (Certification of
# Rent Paid - five copies, pages 11-15); Form MO-TC (Miscellaneous Income Tax
# Credits, pages 16-17); Form MO-CR (resident credit for tax paid to other
# states) and MO-CR Schedule 1, two copies each (pages 18-21) with their
# instructions (pages 22-23); Form MO-NRI (Missouri Income Percentage, pages
# 24-26); Form 5695 (Qualified Health Insurance Premiums Worksheet, page 27);
# Form MO-WFTC (Missouri Working Family Tax Credit, page 28); the 2025 Tax
# Chart and Tax Calculation Worksheet (page 29); the Line 1 Adjusted Gross
# Income Worksheet for a combined return (page 30); Form 5632 (MOST 529
# direct deposit, page 31); and the Long-Term Care Insurance Deduction
# worksheet (page 32).
#
# Layout. Hierarchical AcroForm (acroform_root empty; field paths are the
# fully-qualified names the PDF ships with - flat ids like "line1-Y", dotted
# parent/child ids like "c.single" or "d.zipcode", and the column-split
# "<line>-Y" / "<line>-S" pairs the form uses wherever a married couple files
# a combined return with a Yourself and a Spouse column). Line keys are the
# field names, except CalcOption's two options and the six re-keyed AGI
# worksheet rows above.
#
# Coverage (2025 counts). The blank has 843 distinct fillable AcroForm fields
# (981 counting the 138 pushbuttons; 1,148 widgets counting every repeated
# occurrence). 803 pack lines map 802 of the 843 fields, the shared
# CalcOption radio being mapped once per option. A field that prints on
# several pages (SSN-1, firstname-1, mocr_name-1, nri_city, ...) is ONE
# AcroForm object and is mapped on ONE line (a field holds one value). The 41
# fillable fields left unmapped are the 39 names the 2024 pack leaves
# unmapped — all ReadOnly, each DOR text baked into the blank or (Text1) a
# checkbox frame — plus the two WRITABLE caption cells 1040_32Text2 and
# 1040_32Text3 (MO-NRI page 25, beside UseNRI01 / UseNRI02), which the 2024
# pack mapped as text lines: on this blank each holds a DOR caption as its
# /V (" CHECK to fill Line 32Y" / " CHECK to fill Line 32S", /DA "/HeBo 6
# Tf 1 0 0 rg", /Ff 12582912 = DoNotSpellCheck|DoNotScroll, not ReadOnly),
# so a fill replaced the printed caption with the caller's text (seen on
# the sentinel render). They are dropped here so fill_form raises on the
# two keys (P-007 class 1 — the widget already holds the DOR's own text).
# Never a line:
#   * UNMAPPED LABEL BANNERS AND FRAME: Texto7 "Carry amount to 1040 Line 14"
#     (page 7), MOAText "Use data from worksheet" (page 7), lblNRI "Use
#     worksheet values in NRI, Part C, Line 1" (page 25), Texto8 "Carry
#     amounts to MO-1040, Line 1Y and 1S." (page 30) and Texto9 "Check if you
#     owned and occupied your home for the entire year" (page 10) — the same
#     /V strings as 2024, none with a /TU — plus Text1 (page 10), an empty
#     ReadOnly /Tx that only draws the border of the c.ownfullyear checkbox
#     beside Texto9. Mapped, a caption lets the filler overwrite DOR text and
#     FAILs verify's P-001 scan on a real fill (P-007 class 1).
#   * the 28 printlid.* lids ("PLEASE, USE THE PRINT BUTTON ON THE FORM TO
#     PRINT THIS DOCUMENT. THANK YOU."), ProtectBarcode ("THIS IS A 2-D
#     BARCODE. DO NOT ERASE IT OR WRITE ON IT."), vendorid ("006"),
#     amendedTXT ("These fields are locked. To unlock them, Click on the
#     "amended" check box ..."), line51txt ("TRUST FUNDS") and 1040_30Text ("
#     Check boxes to carry amount to MO-1040 with values below") — the same
#     /V strings as 2024.
#
# Intentionally OMITTED - 138 distinct pushbuttons (/Btn with /Ff bit 17
# Pushbutton), none a data input: the per-line calculate buttons ("Line 1"
# .. "Line 56", "MO-A Line 1" .. "MO-A Line 19", "MO-CR Line 1" .. ,
# "MO-NRI Line 1" .., "MO-PTS Line 2" .., "MO-CRP Lines 1-5" .., "UF_L1" ..),
# the navigation / action buttons (btnGoto*, btnP1, btnCalculate, btnPrint,
# btnreset, btnRstWSNRI, RstWorksheetMOA, finish, the image buttons), the
# repeated "Privacy Notice" link and the CRP2025 banner.
#
# Money vs text. Dollar boxes (every numbered income/tax/credit line and
# computed total, the MO-A/MO-CR/MO-PTS/MO-CRP/MO-TC amount columns, the 529
# amounts, and the percentage cells the form computes) are `money`. Genuine
# text widgets stay text: names / initials / suffixes, SSN boxes (maxlen 11
# for the page-1 comb SSN_1/SSN_2, 9 for the schedule SSN-1/SSN-2 and the
# MO-WFTC QCSSN-1..3), addresses / city / state / ZIP / county, the 2- and
# 4-digit fiscal-year and birth-date cells, bank routing (9) / account (17),
# preparer ids, the "Other (description)" and explanation text boxes, the
# 2-digit trust-fund codes (line51m_tfcd / line51n_tfcd), the MO-WFTC
# qualifying-child table (QCDOB-1..3 MM/DD/YYYY), the MO-CR Schedule 1
# percentage cells (mocrsch1_3y/3s, mocrsch1-2_3y/3s) and the JS helper
# strings (txt01/02, fdata). Every pack maxlen equals its widget's /MaxLen
# on this blank or sits on a widget with no /MaxLen.
#
# Combs. 76 mapped text widgets carry the AcroForm comb flag (/Ff bit 25,
# e.g. /Ff 29360128). `comb: true` in this repo means DIGITS ONLY (the
# filler refuses letters and dashes, verify reads the cells digit-stripped),
# so it is set only where the printed cells take digits: the 9-cell
# schedule SSNs SSN-1 / SSN-2 and the MO-WFTC QCSSN-1..3 (printed as 3-2-4
# boxes with the dashes pre-printed between them; `format:
# ssn_digits_only` strips a dashed value), every 2-cell MM / DD / YY date
# cell (FYBegDate* / FYEndDate*, date1* / date2* / prepdate*, the MO-CRP
# d.crp_5fr_* / d.crp_5to_* rental-period cells — each captioned "(MM/DD/YY)"
# on its page), the ZIP cells (d.zipcode 5 / d.zipext 4, t.crp_zip1* and
# t.crp_llzip1* 5), the bank routing (9) and account (17) cells (as the
# federal f1040 35b / 35d combs), the Form 5632 accountnumber-1..4 ("Enter
# the 11-digit MOST 529 account number") and the MO-TC t.tc_bn1 ("The number
# is the last six (6) digits of the number ... enter 123456"; its rows 2-10
# are plain /Tx widgets without the flag). Comb widgets that stay plain
# text, each with a row comment: the page-1 SSN_1 / SSN_2 (11 cells whose
# cells 4 and 7 sit on the two printed dashes of the 3-2-4 boxes, so the
# value is written WITH its dashes, "123-45-6789"; digits only would land
# digits on the dashes), FEIN ("Preparer's FEIN, SSN, or PTIN" — a PTIN
# starts with a letter), the two-letter state cells t.crp_state1* /
# t.crp_llstate1*, the trust-fund code cells line51m_tfcd / line51n_tfcd
# (the face only says "See instructions for additional trust fund codes"),
# and the MO-TC d.tc_charterno / d.tc_mitsno (no character set printed).
#
# Checkboxes. Every real checkbox is its own /Btn with export state /X
# (verified against this blank). The one multi-option /Btn is CalcOption (a
# radio with /X and /N appearance states), mapped as two lines on the shared
# field carrying each on_state. Separate-field alternatives carry group ids:
# the twenty added in this port (above), dd_account_type (dd_checking /
# dd_savings), the per-person MO-NRI line-3 home-of-record pairs
# (nri_line3.yourself / nri_line3.spouse) and the three MO-WFTC Yes/No
# questions (EIC_*, MFJ_*, INV_*: two independent single-widget /Btn fields
# each, /Ff 49152, one /X state each; the blank's MultiCB_13-15 scripts make
# each pair exclusive in a viewer).
#
# Relations / cross_form. OMITTED. MO-1040 splits nearly every income/tax
# line into Yourself ("<n>-Y") and Spouse ("<n>-S") columns whose keys carry
# a hyphen, and the verifier's relation tokenizer reads "-" as the minus
# operator, so these column lines cannot be relation operands. Per the
# conservative house style every relation is omitted rather than a partial
# set. The federal-AGI link (line 1Y + line 1S, and the AGI worksheet's line
# 11, which cites federal line 11a) is a two-column sum that the one-ref-per-
# side cross_form grammar cannot express, so cross_form stays empty too.
