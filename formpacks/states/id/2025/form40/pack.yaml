# No mismatch found.
# Form 40, 2025 -- Idaho Individual Income Tax Return (residents).
#
# Provenance. Blank downloaded from the official source_url below; see PRINTED
# IDENTITY in the port banner above.
#
# Layout / what is mapped. The downloaded PDF is an 11-page bundle.
#   pages 1-3  -- Form 40 itself, the FILED RETURN. The footers read "Page 1
#                 of 3" .. "Page 3 of 3". MAPPED in full here (one duplicate
#                 widget excepted, see the banner).
#   page 4     -- the first "Form 40 -- Instructions" page (booklet "Page 7
#                 of 52"); no fillable widgets.
#   pages 5-11 -- the "Form 40 -- Instructions" pages (booklet pages 8-14 of
#                 52): the Standard Deduction Worksheet (p5-6), the Line 20
#                 Tax Worksheet (p6), the Idaho Child Tax Credit Worksheet
#                 (line 24; p7) and the Food Tax Credit Worksheet (line 43;
#                 p9). These are INSTRUCTION-PAGE worksheets with their OWN
#                 local line numbers (widget names "Frm40Sheet...",
#                 "Frm40TaxWorksheetL8", ...), NOT part of the filed return.
#                 EXCLUDED -- they are scratch math the filer transcribes onto
#                 Form 40 lines 16/20/24/43, and nothing on the filed return
#                 reads them. Pages 8, 10 and 11 carry no fillable widgets.
#
# Layout (AcroForm). FLAT AcroForm: acroform_root is empty -- every widget's
# field name is the raw flat id the form ships with (e.g. "IncomeL7",
# "FilingStatusSingle", "DirectDepositL57Route 2"). Verified: none of the 187
# top-level widgets has a dotted /Parent name chain.
#
# Coverage. Pages 1-3 expose 155 fillable widgets (51 on p1 + 34 on p2 + 70
# on p3); 154 are mapped here. The one left out is "CheckBox180Days 2", a
# second text widget on the same 10.8 pt box as the bound "CheckBox180Days 3".
# The 32 widgets on the instruction pages are excluded as described above.
#
# Money vs text. Every right-hand column dollar entry (lines 7-11, 13-30, 32,
# 41-55 and 58-61; line 31's is the preprinted "10 00" with no widget) prints
# a preprinted "00" whole-dollar cents cell in the text layer; the donation
# boxes 33-40, the inline Food Tax Credit box (43.computed), the line-52
# Penalty / Interest boxes and the line-56 Refund / Apply boxes are
# whole-dollar boxes WITHOUT a "00" cell. All of them are mapped `money`.
# Header strings (names, middle
# initials, suffixes, two SSNs, mailing address, country, year-begin/end,
# dependents table), the line-45/48/49 descriptive sub-entries (Special Fuels
# / Gasoline labels, Paid/Withheld/ABE, Incentive/Claim), the preparer block,
# the 180-days box and the signature date stay `text`. The two SSN header
# boxes and dependent SSN boxes are single free-text widgets on this form (no
# comb cell structure) -- kept `text`, no comb/format. The Direct Deposit
# routing and account numbers are one widget per digit (9 + 17 cells), each
# mapped maxlen 1; an account shorter than 17 digits fills from cell 1 and
# leaves the rest blank.
#
# Checkboxes. Every checkbox widget on this form is an independent single-state
# /Btn with on_state "/Yes" (re-dumped from this blank's /AP /N: every one of
# the 19 offers /Off and /Yes). The Filing Status row (lines 1-5) is five
# SEPARATE /Yes widgets sharing `group: filing_status`; Checking / Savings
# share `group: 57.account_type`. Line 12a/12b each offer a Yourself + a
# Spouse box (independent flags, adjudicated INDEPENDENT in
# test_pack_invariants.py's SEPARATE_OPTION_SETS_ADJUDICATED) and 12c a
# single box. The raw widget names are positional, not semantic:
# "SpouseDeceased" (rect x=431, filing-status row) is Filing Status option 5
# (Qualifying surviving spouse), while "SpouseDeceased 2" (rect x=520,
# spouse-SSN row) is the spouse "Deceased in 2025" flag, and "Deceased" is the
# taxpayer "Deceased in 2025" flag. Mapped by printed position, not by name.
#
# Relations. Only unconditional on-face sums whose every operand is itself a
# mapped single money box are declared: line 9 ("Total. Add lines 7 and 8"),
# line 25 ("Total Credits. Add lines 21 through 24"), line 41 ("Total Tax
# Plus Donations. Add lines 32 through 40"), line 50 ("Total Payments and
# Other Credits. Add lines 42 through 49" -- the operands are the eight
# right-hand column boxes keyed "42".."49"; the line-43/45/48/49 sub-entries
# have their own dotted keys and are not operands, and the donate path writes
# zero on line 43 so the sum still holds) and line 61 ("Amended tax due or
# refund. Add lines 58 and 59 then subtract line 60"; 0 == 0 on a
# non-amended return). Lines that print "if less than zero, enter zero" / "if
# line X is more than line Y" branch conditions (11, 15, 17, 19, 26, 51, 54,
# 55) are OMITTED per the conservative house style. Line 32 ("Add lines 26
# through 31") reads the preprinted $10 of line 31, which has no money
# widget, and stays omitted.
#
# Cross_form. Line 7's printed label is "Enter your federal adjusted gross
# income from federal Form 1040 or 1040-SR, line 11". The TY2025 Form 1040
# split that line: 11a "Subtract line 10 from line 9. This is your adjusted
# gross income" is the defining line (formpacks/federal/2025/f1040 keys it
# "11a"; there is no "11"), so per CONVENTIONS the leg is `7 == f1040.11a`
# even though Idaho's face still prints "line 11".
#
# YEAR-BEARING LINE KEY. Printed line 56 splits into two money boxes:
# "56. Refund ..... [RefundedL56-1]   Apply to 2026 ..... [AppliedL56-2]".
# The second box is keyed by its ROLE, `56.apply_to_next_year` (renamed from
# `56.apply_to_2024` in the 2023 pack on 2026-08-24 under CONVENTIONS rule 2);
# the printed year lives in the inline comment only.
form: "40"
jurisdiction: states/id
tax_year: 2025
source_url: https://tax.idaho.gov/wp-content/uploads/forms/EFO00089/EFO00089_03-02-2026.pdf
pdf_sha256: "1390489138a7df67095155aaf34e6e8f39a4fd36041594f95b766f5e33bb8a13"
acroform_root: ''
fields:
  # ============================================ page 1 -- amended / period
  - line: amended_return.yes            # "Amended Return? Check the box."
    field: AmendedRtn
    type: checkbox
    on_state: /Yes
  - line: amended_return.reason         # "...enter the number that applies."
    field: AmendReason
    type: text
    maxlen: 2
  - line: fiscal_year_beginning         # "fiscal year beginning"
    field: YearBeginning
    type: text
  - line: fiscal_year_ending            # ", ending"
    field: YearEnding
    type: text

  # ---- header (name / SSN / address). NEW in 2025: the name row is four boxes
  # (first / middle initial / last / suffix) for you and again for your spouse.
  - line: name.first                    # "Your first name"
    field: FirstName1
    type: text
  - line: name.middle_initial           # "Middle initial" (45.7 pt box)
    field: Initial1
    type: text
    maxlen: 1
  - line: name.last                     # "Your last name"
    field: LastName1
    type: text
  - line: name.suffix                   # "Suffix" (45.7 pt box)
    field: Suffix1
    type: text
  - line: identifying_number            # "Your Social Security number (SSN)"
    field: SSN
    type: text
  - line: deceased.yes                  # taxpayer "Deceased in 2025" (rect x=520, your-SSN row)
    field: Deceased
    type: checkbox
    on_state: /Yes
  - line: spouse.name.first             # "Spouse's first name"
    field: FirstName2
    type: text
  - line: spouse.name.middle_initial    # "Middle initial" (spouse row)
    field: MiddleInitial2
    type: text
    maxlen: 1
  - line: spouse.name.last              # "Spouse's last name"
    field: LastName2
    type: text
  - line: spouse.name.suffix            # "Suffix" (spouse row)
    field: Suffix2
    type: text
  - line: spouse.identifying_number     # "Spouse's Social Security number (SSN)"
    field: SpouseSSN
    type: text
  - line: spouse.deceased.yes           # spouse "Deceased in 2025" (rect x=520, spouse-SSN row)
    field: SpouseDeceased 2
    type: checkbox
    on_state: /Yes
  - line: mailing_address.street        # "Current mailing address"
    field: CurrentMailing
    type: text
  - line: mailing_address.city          # "City"
    field: City
    type: text
  - line: mailing_address.state         # "State"
    field: StateAbbrv
    type: text
    maxlen: 2
  - line: mailing_address.zip           # "ZIP Code"
    field: ZIPcode
    type: text
    maxlen: 10
  - line: foreign_country               # "Foreign country (if not U.S.)"
    field: Country
    type: text

  # ---- Filing Status (check only one)
  - line: filing_status.single          # "1. Single"
    field: FilingStatusSingle
    type: checkbox
    group: filing_status
    on_state: /Yes
  - line: filing_status.married_filing_jointly # "2. Married filing jointly"
    field: FilingStatusMarriedJoint
    type: checkbox
    group: filing_status
    on_state: /Yes
  - line: filing_status.married_filing_separately # "3. Married filing separately"
    field: FilingStatusMarriedSeparate
    type: checkbox
    group: filing_status
    on_state: /Yes
  - line: filing_status.head_of_household # "4. Head of household"
    field: FilingStatusHead
    type: checkbox
    group: filing_status
    on_state: /Yes
  - line: filing_status.qualifying_surviving_spouse # "5. Qualifying surviving spouse with qualifying dependents" (rect x=431, filing-status row)
    field: SpouseDeceased
    type: checkbox
    group: filing_status
    on_state: /Yes

  # ---- Household (lines 6a-6d) and dependents table
  - line: 6a                            # "6a. Yourself"
    field: 6aYourself
    type: text
    maxlen: 2
  - line: 6b                            # "6b. Spouse"
    field: 6bSpouse
    type: text
    maxlen: 2
  - line: 6c                            # "6c. Dependents"
    field: 6cDependents
    type: text
    maxlen: 2
  - line: 6d                            # "6d. Total household"
    field: 6dTotalHousehold
    type: text
    maxlen: 2
  - line: dependent_1.name.first        # row 1 "Dependent's first name"
    field: 6cDependent1First
    type: text
  - line: dependent_1.name.last         # row 1 "Dependent's last name"
    field: 6cDependent1Last
    type: text
  - line: dependent_1.ssn               # row 1 "Dependent's SSN"
    field: 6cDependent1SSN
    type: text
  - line: dependent_1.birthdate         # row 1 "Dependent's birthdate (mm/dd/yyyy)"
    field: 6cDependent1Birthdate
    type: text
  - line: dependent_2.name.first        # row 2 "Dependent's first name"
    field: 6cDependent2First
    type: text
  - line: dependent_2.name.last         # row 2 "Dependent's last name"
    field: 6cDependent2Last
    type: text
  - line: dependent_2.ssn               # row 2 "Dependent's SSN"
    field: 6cDependent2SSN
    type: text
  - line: dependent_2.birthdate         # row 2 "Dependent's birthdate (mm/dd/yyyy)"
    field: 6cDependent2Birthdate
    type: text
  - line: dependent_3.name.first        # row 3 "Dependent's first name"
    field: 6cDependent3First
    type: text
  - line: dependent_3.name.last         # row 3 "Dependent's last name"
    field: 6cDependent3Last
    type: text
  - line: dependent_3.ssn               # row 3 "Dependent's SSN"
    field: 6cDependent3SSN
    type: text
  - line: dependent_3.birthdate         # row 3 "Dependent's birthdate (mm/dd/yyyy)"
    field: 6cDependent3Birthdate
    type: text
  - line: dependent_4.name.first        # row 4 "Dependent's first name"
    field: 6cDependent4First
    type: text
  - line: dependent_4.name.last         # row 4 "Dependent's last name"
    field: 6cDependent4Last
    type: text
  - line: dependent_4.ssn               # row 4 "Dependent's SSN"
    field: 6cDependent4SSN
    type: text
  - line: dependent_4.birthdate         # row 4 "Dependent's birthdate (mm/dd/yyyy)"
    field: 6cDependent4Birthdate
    type: text

  # ---- Income (lines 7-11)
  - line: "7"                           # "7. Enter your federal adjusted gross income from federal Form 1040 or 1040-SR, line 11."
    field: IncomeL7
    type: money
  - line: "8"                           # "8. Additions from Form 39R, Part A, line 7. Include Form 39R"
    field: IncomeL8
    type: money
  - line: "9"                           # "9. Total. Add lines 7 and 8"
    field: IncomeL9
    type: money
  - line: "10"                          # "10. Subtractions from Form 39R, Part B, line 24. Include Form 39R"
    field: IncomeL10
    type: money
  - line: "11"                          # "11. Total Adjusted Income. Subtract line 10 from line 9"
    field: IncomeL11
    type: money

  # ============================================ page 2 -- Tax Calculation (lines 12-20)
  - line: 12a.yourself                  # "12. Check a. If age 65 or older ... Yourself"
    field: "L12aYourself "
    type: checkbox
    on_state: /Yes
  - line: 12a.spouse                    # "12a. ... Spouse"
    field: L12aSpouse
    type: checkbox
    on_state: /Yes
  - line: 12b.yourself                  # "12b. If blind ... Yourself"
    field: L12bYourself
    type: checkbox
    on_state: /Yes
  - line: 12b.spouse                    # "12b. ... Spouse"
    field: L12bSpouse
    type: checkbox
    on_state: /Yes
  - line: 12c                           # "12c. If your parent or someone else can claim you as a dependent, check here and enter zero on line 43"
    field: L12cDependent
    type: checkbox
    on_state: /Yes
  - line: "13"                          # "13. Itemized deductions. Include federal Schedule A. Federal limits apply"
    field: TxCompL13
    type: money
  - line: "14"                          # "14. State and local income or general sales taxes included on federal Schedule A"
    field: TxCompL14
    type: money
  - line: "15"                          # "15. Subtract line 14 from line 13. If you don't use federal Schedule A, enter zero"
    field: TxCompL15
    type: money
  - line: "16"                          # "16. Standard deduction. See instructions, page 8, to determine amount if not standard"
    field: TxCompL16
    type: money
  - line: "17"                          # "17. Subtract the larger of line 15 or 16 from line 11. If less than zero, enter zero"
    field: TxCompL17
    type: money
  - line: "18"                          # "18. Qualified business income deduction. If less than zero, enter zero" (2024 widget: IncomeL18)
    field: TxCompL18
    type: money
  - line: "19"                          # "19. Idaho taxable income. Subtract line 18 from line 17. If less than zero, enter zero" (2024 widget: TxCompL19)
    field: IncomeL19
    type: money
  - line: "20"                          # "20. Tax from worksheet. See instructions, page 9"
    field: TxCompL20
    type: money

  # ---- Credits (lines 21-26; 2024's line 21 "Tax amount from line 20" is gone, so each credit line is one lower)
  - line: "21"                          # "21. Income tax paid to other states. Include Form 39R and a copy of other states' returns"
    field: CreditsL21
    type: money
  - line: "22"                          # "22. Total credits from Form 39R, Part D, line 4. Include Form 39R"
    field: CreditsL22
    type: money
  - line: "23"                          # "23. Total business income tax credits from Form 44, Part I, line 10. Include Form 44"
    field: CreditsL23
    type: money
  - line: "24"                          # "24. Idaho Child Tax Credit. Calculated amount from worksheet on page 10"
    field: CreditsL24
    type: money
  - line: "25"                          # "25. Total Credits. Add lines 21 through 24"
    field: CreditsL25
    type: money
  - line: "26"                          # "26. Subtract line 25 from line 20. If line 25 is more than line 20, enter zero"
    field: CreditsL26
    type: money

  # ---- Other Taxes (lines 27-32)
  - line: "27"                          # "27. Fuels use tax due. Include Form 75"
    field: OtherTaxesL27
    type: money
  - line: "28"                          # "28. Sales/use tax due on untaxed purchases (online, mail order, and other)"
    field: OtherTaxesL28
    type: money
  - line: "29"                          # "29. Total tax from recapture of income tax credits from Form 44, Part II, line 6. Include Form 44"
    field: OtherTaxesL29
    type: money
  - line: "30"                          # "30. Tax from recapture of qualified investment exemption (QIE). Include Form 49ER"
    field: OtherTaxesL30
    type: money
  - line: 31.public_assistance          # "31. Permanent building fund tax. Check the box if you received Idaho public assistance payments for 2025" (the $10 is preprinted; no money widget)
    field: OtherTaxesL31Check
    type: checkbox
    on_state: /Yes
  - line: "32"                          # "32. Total Tax. Add lines 26 through 31"
    field: OtherTaxesL32
    type: money

  # ---- Donations (lines 33-41; two columns, 33/35/37/39 left, 34/36/38/40 right)
  - line: "33"                          # "33. Idaho Nongame Wildlife Fund"
    field: DonationsL33
    type: money
  - line: "34"                          # "34. Idaho Children's Trust Fund"
    field: DonationsL34
    type: money
  - line: "35"                          # "35. Special Olympics Idaho"
    field: DonationsL35
    type: money
  - line: "36"                          # "36. Idaho Guard & Reserve Family"
    field: DonationsL36
    type: money
  - line: "37"                          # "37. American Red Cross of Idaho"
    field: DonationsL37
    type: money
  - line: "38"                          # "38. Veterans Support Fund"
    field: DonationsL38
    type: money
  - line: "39"                          # "39. Idaho Food Bank Fund"
    field: DonationsL39
    type: money
  - line: "40"                          # "40. Opportunity Scholarship Program"
    field: DonationsL40
    type: money
  - line: "41"                          # "41. Total Tax Plus Donations. Add lines 32 through 40"
    field: DonationsL41
    type: money

  # ============================================ page 3 -- Payments and Other Credits (lines 42-50)
  - line: "42"                          # "42. Parental Choice Tax Credit. See instructions" (NEW line; the widget NAME says FoodCredit, its position is the line-42 box)
    field: FoodCreditL42 Amount 2
    type: money
  - line: 43.computed                   # "43. Food Tax Credit. Enter amount from pg.12" (the inline computed-amount box)
    field: FoodCreditL43-1 Amount 1
    type: money
  - line: "43"                          # "43. ...To receive your Food Tax Credit, enter the calculated amount on line 43" (the line-43 column entry)
    field: PymntOtherCredit Donate L43-4 Amount 4
    type: money
  - line: 43.donate                     # "43. To donate your Food Tax Credit to the Cooperative Welfare Fund, check the box, enter zero on line 43"
    field: FoodCreditL43-3 DonateCheckbox
    type: checkbox
    on_state: /Yes
  - line: "44"                          # "44. Maintaining a home for family member age 65 or older or developmentally disabled. Include Form 39R"
    field: PymntOtherCreditL44
    type: money
  - line: 45.special_fuels              # "45. Special fuels tax refund" (label sub-entry)
    field: PymntOtherCreditL45-1 SpecialFuels 3
    type: text
  - line: 45.gasoline                   # "45. Gasoline tax refund" (label sub-entry)
    field: PymntOtherCreditL45-2 Gasoline 3
    type: text
  - line: "45"                          # "45. ...Include Form 75" (the line-45 column entry)
    field: PymntOtherCreditL45-3 Amount 3
    type: money
  - line: "46"                          # "46. Idaho income tax withheld. Include Form W-2s and any 1099s that show Idaho withholding"
    field: PymntOtherCreditL46
    type: money
  - line: "47"                          # "47. 2025 Form 51 estimated payments and amount applied from 2024 return"
    field: PymntOtherCreditL47
    type: money
  - line: 48.paid_by_entity             # "48. Paid by entity" (sub-entry)
    field: PymntOtherCreditL48-1 Paid 3
    type: text
  - line: 48.withheld                   # "48. Withheld" (sub-entry)
    field: PymntOtherCreditL48-2 Withheld 3
    type: text
  - line: 48.abe                        # "48. ABE" (sub-entry)
    field: PymntOtherCreditL48-3 ABE 3
    type: text
  - line: "48"                          # "48. ...See instructions" (the line-48 column entry)
    field: PymntOtherCreditL48-4 Amount 3
    type: money
  - line: 49.incentive                  # "49. Tax Reimbursement Incentive credit" (sub-entry)
    field: PymntOtherCreditL49-1 Incentive 3
    type: text
  - line: 49.claim_of_right             # "49. Claim of Right credit" (sub-entry)
    field: PymntOtherCreditL49-2 Claim 3
    type: text
  - line: "49"                          # "49. ...See instructions" (the line-49 column entry)
    field: PymntOtherCreditL49-3 Amount 3
    type: money
  - line: "50"                          # "50. Total Payments and Other Credits. Add lines 42 through 49"
    field: PymntOtherCreditL50 Total 3
    type: money

  # ---- Tax Due or Refund (lines 51-57)
  - line: "51"                          # "51. Tax Due. If line 41 is more than line 50, subtract line 50 from line 41"
    field: TxDueRefundL51
    type: money
  - line: 52.penalty                    # "52. Penalty"
    field: TxDueRefundL52-1 Penalty 3
    type: money
  - line: 52.interest                   # "52. Interest from the due date"
    field: TxDueRefundL52-2 Interest 3
    type: money
  - line: "52"                          # "52. ...Enter total" (the line-52 column entry)
    field: TxDueRefundL52-3 Total 3
    type: money
  - line: 52.msa_withdrawal             # "Check box if penalty is due to an unqualified withdrawal from an Idaho medical savings account"
    field: TxDueRefundCheckL52-4
    type: checkbox
    on_state: /Yes
  - line: "53"                          # "53. Nonrefundable credit from a prior year return. See Form 44 instructions"
    field: L53
    type: money
  - line: "54"                          # "54. Total Due. Add lines 51 and 52, then subtract line 53"
    field: TxDueRefundL54
    type: money
  - line: "55"                          # "55. Overpaid. If line 41 is less than line 50, subtract lines 41 and 52 from line 50"
    field: TxDueRefundL55
    type: money
  - line: "56"                          # "56. Refund"
    field: RefundedL56-1
    type: money
  - line: 56.apply_to_next_year         # "56. ... Apply to 2026" (2026 = tax_year + 1; the printed year lives here, never in the key)
    field: AppliedL56-2
    type: money

  # ---- Direct Deposit (line 57). The per-digit cells are NAMED 2..10 and 2..18
  # on this blank (no "Route 1" / "Acct1"); they are mapped by x-order, cell 1 = leftmost.
  - line: 57.outside_us                 # "57. Direct Deposit. See instructions, pg.13. ... Check if final deposit destination is outside U.S."
    field: DirectDepositCheckL57-1
    type: checkbox
    on_state: /Yes
  - line: 57.routing_number.1           # "Routing No." cell 1 of 9
    field: DirectDepositL57Route 2
    type: text
    maxlen: 1
  - line: 57.routing_number.2           # "Routing No." cell 2 of 9
    field: DirectDepositL57Route 3
    type: text
    maxlen: 1
