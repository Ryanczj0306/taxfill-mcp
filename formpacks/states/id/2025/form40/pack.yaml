  - line: 57.account_number.17          # "Account No." cell 17 of 17
    field: DirectDepositL57Acct18
    type: text
    maxlen: 1
  - line: 57.account_type.checking      # "Type of Account: Checking" (upper box, y=339-350)
    field: DirectDepositCheckingL57-2 2
    type: checkbox
    group: 57.account_type
    on_state: /Yes
  - line: 57.account_type.savings       # "Type of Account: Savings" (lower box, y=326-337; the name has TWO spaces)
    field: "DirectDepositSavingsL57-3  2"
    type: checkbox
