#     "FoodCreditL42 Amount 2" (named after its neighbour, sitting in the
#     line-42 column box at y=682). The grocery credit is renamed "Food Tax
#     Credit": "PymntOtherCreditsL43" -> "FoodCreditL43-1 Amount 1",
#     "PymntOtherCreditL43Amount" -> "PymntOtherCredit Donate L43-4 Amount 4",
#     "PymntsOtherCreditsCheck" -> "FoodCreditL43-3 DonateCheckbox".
#   * Page-3 renames with the same meaning and row: L45 SpecialFuels/
#     Gasoline/Amount -> "PymntOtherCreditL45-1 SpecialFuels 3" / "-2 Gasoline
#     3" / "-3 Amount 3"; L48 Paid/Withheld/ABE/Amount -> "L48-1 Paid 3" /
#     "-2 Withheld 3" / "-3 ABE 3" / "-4 Amount 3"; L49 Incentive/Claim/Amount
#     -> "L49-1 Incentive 3" / "-2 Claim 3" / "-3 Amount 3"; "PymntOtherCredit-
#     L50Total" -> "PymntOtherCreditL50 Total 3"; L52 Penalty/Interest/Total/
#     Check -> "TxDueRefundL52-1 Penalty 3" / "-2 Interest 3" / "-3 Total 3" /
