  # ---- Page-header mirrors (Phase K re-map 2026-11-05, JK28 mechanism). The 2026-11-02 revision gives page 1's
  # last-name and SSN boxes their own fields ("Your Last Name", "Your SSN"); the "Your Name (as shown on page 1)" /
  # "Your Social Security Number" header boxes on pages 2-6 keep the old names "1b" / "1c" (five widgets each).
  # fill_form builds them from the page-1 values; the name header now carries the FULL name as page 1 shows it (the
  # shared field could only ever print the last name there), shortened to an initial when the box is too narrow.
  - line: "tp_name_page_header"
    field: "1b"
    type: text
    maxlen: 28
  - line: "tp_ssn_page_header"
    field: "1c"
    type: text
    maxlen: 11
relations:
  - "14 == 12 - 13"  # Line 14 'Modified federal adjusted gross income. Subtract line 13 from line 12.'
  # Line 16 is UNFILLABLE on the 2026-11-02 revision (P-036, unfillable_lines below), and the relation still states
  # the printed sum: verify resolves 16 as a line — zero when nothing is declared, else the hand-written amount the
  # caller gives in `expected` — so a filer with a line 16 amount gets a line 19 that includes it.
  - "19 == 14 + 15 + 16 + 17 + 18"  # Line 19 'Subtotal: Add lines 14 through 18.'
  - "34c == 34a + 34b"  # Line 34c 'add 34a and 34b'
  - "48 == 46 + 47"  # Line 48 'Subtotal of tax: Add lines 46 and 47.'
  - "54c == 54a + 54b"  # Line 54c 'Add 54a and 54b.'
  - "63 == 61 - 62"  # Line 63 'Balance of overpayment: Subtract line 62 from line 61.'
  - "78 == 64 + 65 + 66 + 67 + 68 + 69 + 70 + 71 + 72 + 73 + 74 + 76"  # Line 78 'Add lines 64 through 74 and 76; enter the total.'
cross_form:
  - "12 == f1040.11a"  # Line 12 'Federal adjusted gross income (from your federal return)' = AGI
identity_fields:
  - tp_ssn
  - tp_first_name_and_initial
  - tp_last_name
mirrors:
  tp_name_page_header: "{tp_first_name_and_initial} {tp_last_name}"  # "Your Name (as shown on page 1)", pages 2-6
  tp_ssn_page_header: "{tp_ssn}"  # "Your Social Security Number", pages 2-6
mirror_abbreviations:
  tp_name_page_header: [tp_first_name_and_initial]
# P-036 (Phase K re-map 2026-11-05): the 2026-11-02 revision names these pairs of printed rows with ONE field each,
# so a value for either row would print on both — fill_form refuses them; the filer hand-writes the row. Each
# entry names the shared field: no line may map it, and verify fails a PDF that carries a value in it. The old
# revision (pinned 2026-09-28, digest 91722910a79a8ec5…) kept them apart; no archived copy of it exists.
unfillable_lines:
  "16":
    field: "Partnership Income adjustment"
    why: "the 2026-11-02 revision of the blank names line 16 (partnership income adjustment, an addition) and line 27 (the subtraction) with ONE field, 'Partnership Income adjustment', so a value for either row would print on both; hand-write line 16 on the printed return; line 19 (add lines 14 through 18) must still include it"
  "27":
    field: "Partnership Income adjustment"
    why: "shares the field 'Partnership Income adjustment' with line 16 on the 2026-11-02 revision (a value for either row would print on both); hand-write line 27 on the printed return"
