# ===========================================================================
# Arizona Form 140PY, 2023 — Part-Year Resident Personal Income Tax Return. A
# NEW pack (Phase J JS5, 2026-10-04): no earlier year of this form shipped.
# formpacks/states/az/2023/az140 (the same state's TY2023 resident return) set
# the key conventions here — the printed-number keys, the tp_/spouse_ identity
# keys, the home_address / city / state / zip_code block, the dependent-row,
# parent-row and Other Exemptions keys — but no binding was carried over from
# it: every row below was bound by the widget's position against the label
# printed beside it (the blank's text layer) and then confirmed on a sentinel
# render of all six pages.
#
# URL. The DOR's own file (source_url below). Digest 082ee7ac0e2b9a50… — two
# independent downloads agree with each other and with the discovery run.
#
# PRINTED IDENTITY. Page 1 prints "Arizona Form 140PY", "Part-Year Resident
# Personal Income Tax Return", "FOR CALENDAR YEAR 2023"; the footers print
# "ADOR 10149 (23)" (pages 1-4) / "ADOR 10413 (23)" (pages 5-6) and "AZ Form
# 140PY (2023) Page N of 6". The PDF's own Title is "Arizona Form 140PY".
# printed_year_verified = 2023.
#
# Layout. FLAT AcroForm (acroform_root empty; the widgets carry short names —
# "1a", "15Fed", "15State", "Res Status", "3_1c", "5Ga", "6Xa"). Six pages;
# pages 1-2 are always filed and pages 3-6 are included when they apply (page
# 3 to increase the standard deduction for charitable contributions, page 4
# "if:" extra dependents, parents or Other Exemptions are listed, pages 5-6
# "only if you are making any adjustments"):
#   page 1 — header, filing status 4-7, exemption counts 8-11a, residency
#            status 12-13, dependents 10c-10d, qualifying parents and
#            grandparents 11b-11c, 14 dates of Arizona residency and other
#            states, the two-column Arizona Income block 15-24 (2023 FEDERAL
#            "Amount from Federal Return" | 2023 ARIZONA "Amount Only"), lines
#            25-39;
#   page 2 — lines 40-89, voluntary gifts, political party, penalty boxes,
#            direct deposit, the signature and paid-preparer block and the
#            two mailing addresses;
#   page 3 — Standard Deduction Increase for Charitable Contributions, 1C-7C;
#   page 4 — Dependent and Other Exemption Information: Part 1 dependents
#            10e-10o, Part 2 qualifying parents and grandparents 11d-11i, Part
#            3 Other Exemptions rows 1-10 (192 widgets; the part-year income
#            allocation is the page-1 column block, not this page);
#   page 5 — Other Additions to Arizona Gross Income (rows A-R, line 31);
#   page 6 — Other Subtractions from Arizona Gross Income (rows A-Z, line 44).
#
# The Arizona allocation. Lines 15-24 carry a FEDERAL and an ARIZONA box each,
# keyed <line>.federal / <line>.arizona. Line 25 (federal AGI) has only the
# FEDERAL box and line 26 (Arizona gross income) only the ARIZONA box, so both
# keep their bare numbers. Line 27, "Arizona income ratio: Divide line 26 by
# line 25 and enter the result (not over 1.000)", is five printed cells on a
# comb-flagged widget (/MaxLen 5), so it is `text` — money would round it to
# 0 or 1. It is keyed comb: false: the filler's comb rule takes digits only
# and refused "0.375" on a comb: true trial fill, while the widget's own comb
# flag still sets one character per cell (a comb: false fill of "0.375"
# rendered "0 . 3 7 5" in the five cells; the decimal point takes a cell).
# The ratio is used once, on line 51 ("Multiply line 50 by the Arizona income
# ratio on line 27"). Page 3 prints no ratio line: "Enter the amount shown on
# line 7C on page 2, line 54."
#
# Coverage. The blank holds 436 widget entries on 418 field names: "1b" and
# "1c" (name and SSN) each have six widgets, page 1 plus the "Your Name (as
# shown on page 1)" / SSN header of pages 2-6, so one key fills all six (no
# page-mirror key is needed). The header box is the same field as page 1's
# "Last Name" box, so pages 2-6 show the last name only (tp_last_name), not the
# first name. NOT mapped:
#   * "Filing Status" (lines 4-7) — ONE radio field with four kid widgets, and
#     "Res Status" (lines 12-13) — ONE radio field with two kid widgets. No kid
#     of either carries an /AP dictionary (no appearance and no on-state
#     name). fill_form cannot tell which kid shows which state and refuses
#     such a field, so a key here could not mark one box. Filing status and
#     residency status must be ticked by hand: a fill and a verify both report
#     success with these two required page-1 choices still blank, because the
#     pack has no key for them. These fields make pypdf's
#     get_fields() raise KeyError('/AP') on this blank; fill_form and verify
#     fall back to a walk of the field tree for exactly that error.
#   * "cmdPrintForm" — the "Print Form" pushbutton at the foot of page 2.
#   * "PAID PREPARER'S STREET ADDRESS" has no widget on this blank (its caption
#     is printed with nothing above it), so there is no key for it.
# No widget is ReadOnly. Nine more page-1 boxes carry no /AP either: "Check
# Box82F", "4a", "10a_10b check box" (the dependents' more-space box) and
# the six dependent-row boxes of 10c / 10d ((e) Box 10a / Box 10b and (f)).
# Each is a single /Btn widget, so the filler writes /V and /AS /Yes to it
# and they are mapped. With no appearance stream, the cross is drawn by the
# viewer from the NeedAppearances flag the filler sets: a forms-aware pdfium
# render and a poppler render each drew it in every one of the nine boxes,
# while a pdfium render without its forms layer leaves the box empty.
#
# Money vs text. Every numbered dollar box prints a "00" cents cell and is
# `money`, as is every lettered amount on pages 3, 5 and 6. The page-1 count
# boxes 8, 9, 10a, 10b and 11a ("Enter the number claimed. Do not put a check
# mark."), page 2's 48E ("Other Exemptions. See instructions.....48E"; page 4:
# "Enter the total number of individuals listed in Part 3 in box 48E") and the
# ratio box 27 are `text`. comb: true (comb flag set, /MaxLen, digits only): the
# fiscal-year boxes (FY_Beg 4 cells printed "M M D D"; FY_End 8 cells printed
# "M M D D Y Y Y Y"), the two line-14 residency dates (8 cells each, printed
# "M M D D Y Y Y Y"), routing (9) and account (17) numbers; 27 carries the
# flag too but is comb: false (above). maxlen equals each widget's /MaxLen
# where it has one. Elsewhere a name or text box takes its width at the /DA's
# Helvetica size (width / 5 pt at 10 pt; the eight parent-row relationship
# boxes name no /DA and take the form default, auto-sized Helvetica, so the
# 10 pt budget applies), and a box that holds digits takes the number of
# digits a stress fill rendered whole (a Helvetica digit is 0.556 em, wider
# than that 0.5 em budget): the count boxes 8, 9, 10a, 10b and 11a (15.6-16.0
# pt) hold 2 ("100" clipped); every "no. of months" box (28.9-31.0 pt) holds 5
# (six clipped); 48E (24.2 pt) holds 4; the daytime phone 2c (112.5 pt)
# holds 20; the preparer phone 97 (106.5 pt, /DA 12 pt) holds 15. The two ZIP
# boxes take the 5-digit ZIP: "ZIP Code" (46.9 pt, centred) renders 8 digits
# whole, and a 9-digit ZIP+4 loses a digit (the filler's written appearance
# cuts both end digits; a poppler render cuts the ninth), and the preparer's
# 96 (45.3 pt, 12 pt) holds 6. SSN boxes take 11 (an SSN with its two dashes
# fits each).
#
# Checkboxes. Each option is bound to the label printed beside it (P-030), and
# every on_state was read from this blank's /AP /N, except the nine /AP-less
# single boxes named under Coverage (82F, 4a, the 10a/10b more-space box and the
# 10c / 10d (e) and (f) boxes): the blank defines no state for them, and their
# /Yes is the filler's convention for a single widget without /AP:
#   * "Itemized/Standard" (/Choice1 53I ITEMIZED, /Choice2 53S STANDARD),
#     "Political Party" (/Choice1 841 Democratic, /Choice2 842 Libertarian,
#     /Choice3 843 Republican) and "Refund" (/Choice5 Checking on the upper
#     row, /Choice1 Savings on the lower) are radio fields, one `group` each;
#   * each dependent row's "Dependent Age included in: (Box 10a) / (Box 10b)"
#     pair is two fields answering one question: one group per row (rows
#     10c / 10d: /Yes by the filler's convention, above);
#   * 82F, 4a, the 10a/10b more-space box and the 10c / 10d educational-credit
#     boxes are single fields with /Yes by that convention;
#   * every other box is its own field with the single state /Yes read from
#     its /AP: the 11a more-space box, the page-4 educational-credit boxes
#     10e-10o, the parent rows' "IF AGE 65 OR OVER" / "IF DIED IN 2023"
#     boxes, 28S, 54C, the 67 credit-form boxes (671 308-I, 672 334, 673 349 —
#     several may apply), the 86 penalty boxes (861 Annualized/Other, 862
#     Farmer or Fisherman, 863 Form 221 included), 88A, and Part 3's C1 / C2 /
#     stillborn boxes.
#
# Page 5 L ("... Child Care Facility Before 1990") and page 6 T ("Exploration
# Expenses Deferred before January 1, 1990") keep the statutory year out of
# their keys: oa_l_childcare_facility_amortization,
# os_t_exploration_expenses_deferred.
#
# Relations follow the face's printed arithmetic, per column for 23. Omitted,
# with the reason:
#   51 (line 50 x the line-27 ratio) — the ratio is a `text` box and verify
#     reads only MONEY lines from the filled PDF, so "51 == 50 * 27" would see
#     27 as blank (0) on an ordinary fill and FAIL a correct return; rewritten
#     as 50 * 26 / 25 it divides by zero when line 25 is blank and skips the
#     three-place rounding of the ratio;
#   46, 47, 48, 49 (count x $2,100 / $1,500 / $2,300 / $10,000) — the counts
#     are `text`;
#   89 "AMOUNT OWED: Add lines 69 and 87" — when line 88 goes negative the
#     amount owed is line 87 less line 72 (line 88's own text), so the printed
#     sum does not hold on every path.
# Floored lines carry the face's floor as max(0, ...). Line 33 "Total Arizona
# net capital gain or (loss). Enter amount from line 20, Arizona column" is
# declared as 33 == 20.arizona.
#
# Face figures against knowledge/states/az/2023.yaml: $2,100 (line 46), $1,500
# (47), $2,300 (48), $10,000 (49), 2.5% (56), 31% (7C) and both mailing
# addresses match. The page-6 A pension exclusion cap printed "(up to $2,500
# per taxpayer)" is not in the knowledge pack.
# ===========================================================================
form: "140PY"
jurisdiction: states/az
