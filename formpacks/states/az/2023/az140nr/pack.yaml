# ===========================================================================
# Arizona Form 140NR, 2023 — Nonresident Personal Income Tax Return. A NEW
# pack (Phase J JS5, 2026-10-02): no earlier year of this form shipped.
# formpacks/states/az/2023/az140 (the same state's TY2023 resident return) set
# the conventions followed here — the printed-number keys, the tp_/spouse_
# identity keys, the home_address / city / state / zip_code block, the
# dependent-row and Other Exemptions keys, maxlen handling — but no binding
# was carried over from it: every row below was bound by the widget's position
# against the label printed beside it (the blank's text layer) and then
# confirmed on a sentinel render of all six pages.
#
# URL. The DOR's own file (source_url below). Digest c7b67205786808aa… — two
# independent downloads on 2026-10-02 agree with each other and with the
# discovery run.
#
# PRINTED IDENTITY. Page 1 prints "Arizona Form 140NR", "Nonresident Personal
# Income Tax Return", "FOR CALENDAR YEAR 2023"; every page's footer prints
# "ADOR 10177 (23)" and "AZ Form 140NR (2023) Page N of 6". The PDF's own
# Title is "Arizona Form 140NR". printed_year_verified = 2023.
#
# Layout. FLAT AcroForm (acroform_root empty; the widgets carry short names —
# "1a", "15Fed", "15State", "Res Status", "3_1c", "5Fa", "6Q"). Six pages, all
# filed with the return:
#   page 1 — header, filing status 4-7, exemption counts 8-10b, residency
#            status 11-13, dependents 10c-10f, the two-column Arizona Income
#            block 15-24 (2023 FEDERAL "Amount from Federal Return" | 2023
#            ARIZONA "Source Amount Only"), lines 25-42;
#   page 2 — lines 43-87, voluntary gifts, political party, penalty boxes,
#            direct deposit, the signature and paid-preparer block and the
#            two mailing addresses;
#   page 3 — Standard Deduction Increase for Charitable Contributions, 1C-9C;
#   page 4 — Dependent and Other Exemption Information: Part 1 dependents
#            10g-10q, Part 2 Other Exemptions rows 1-10;
#   page 5 — Other Additions to Arizona Gross Income (rows A-P, line 32);
#   page 6 — Other Subtractions From Arizona Gross Income (rows A-Q, line 45).
#
# The Arizona allocation. Lines 15-24 carry a FEDERAL and an ARIZONA box each,
# keyed <line>.federal / <line>.arizona. Line 25 (federal AGI) has only the
# FEDERAL box and line 26 (Arizona gross income) only the ARIZONA box, so both
# keep their bare numbers. Line 27, "Arizona income ratio: Divide line 26 by
# line 25, and enter the result (not over 1.000)", is five printed cells on a
# comb-flagged widget (/MaxLen 5); the 2023 booklet says "You must round your
# answer to three decimal places. Do not enter more than 1.000", so it is
# `text` — money would round it to 0 or 1. The booklet's worked examples print
# the decimal point in a cell of its own (". 5 4 7", "1 . 0 0 0"), so the pack
# keys line 27 and its page-3 copy 8C comb: false: the filler's comb rule takes
# digits only and would refuse "0.547", while the widget's own comb flag still
# sets one character per cell: fills of "0.364" and "1.000" rendered one
# character in each of the five cells of both boxes, and a fill of ".547"
# rendered in the last four cells, as the booklet prints it. The ratio is used
# on line 51 ("Multiply line 50 by the Arizona ratio on line 27") and on page
# 3's 9C. Line 27's widget cells (12.1 pt) match its printed cells (12.0 pt,
# dividers 501.6 to 561.6). 8C prints four cells of 13.0-13.3 pt and a narrow
# fifth of about 8.7 pt (dividers at 490.8, 504.1, 517.4, 530.7, 543.7 and
# 552.5) against 12.2 pt widget cells, so on a render the third, fourth and
# fifth characters touch or cross the printed dividers (fills of "1.000" and
# ".547" both show it). That is the DOR's geometry, and a pack key cannot
# respace a comb; every character stays inside the 8C box and legible.
#
# Coverage. The blank holds 379 widget entries on 360 field names: "1b"
# (the LAST NAME box) and "1c" (SSN) each have six widgets, page 1 plus the
# "Your Name (as shown on page 1)" / SSN header of pages 2-6, so one key fills
# all six (no page-mirror key is needed). Because the DOR tied that header to
# 1b, the "Your Name" header on pages 2-6 shows the last name only (a fill of
# tp_last_name "SAMPLE" printed just "SAMPLE" there). NOT mapped:
#   * "Filing Status" (lines 4-7) — ONE radio field with four kid widgets
#     (boxes 4, 5, 6 and 7 top to bottom), none of which carries an /AP
#     dictionary (no appearance and no on-state name; each holds only /AS /Off).
#     One box CAN be marked at the PDF level: with the field's /V set to /Yes
#     and only the box-7 kid's /AS set to /Yes, pdfium drew a cross in Single
#     and left 4, 5 and 6 empty. But a pack checkbox names a FIELD and one
#     on_state, which all four kids would share, so the filler cannot address
#     one kid, and fill_form refuses a radio none of whose kids carries /AP /N.
#     Filing status is therefore ticked by hand on every filled return.
#     The same field makes pypdf's get_fields() raise KeyError('/AP') on this
#     blank, so fill_form and verify need their fallback walk of the field tree
#     for exactly that error; without it every fill and verify of this blank
#     fails, whatever lines are filled.
#   * "cmdPrintForm" — the "Print Form" pushbutton at the foot of page 2.
# No widget is ReadOnly. "Check Box82F" and "4a" are single /Btn widgets with
# no /AP either; the filler writes /Yes to a single widget, and a fill rendered
# a cross in each box, so they are mapped.
#
# Money vs text. Every numbered dollar box prints a "00" cents cell and is
# `money`, as is every lettered amount on pages 3, 5 and 6. The count boxes 8,
# 9, 10a and 10b (page 1, "Enter the number claimed. Do not put a check
# mark."), 49E (page 2, "49 Other Exemptions: See instructions", the box
# Part 2 says to enter "the total number of individuals listed in Part 2" in)
# and the two ratio boxes (27, 8C) are `text`. comb: true (comb flag set, /MaxLen, digits only): the
# fiscal-year MMDD boxes (4 cells each, printed "M M D D"), the "Y Y" year box
# (2), routing (9) and account (17) numbers; 27 and 8C carry the flag too but
# are comb: false (above). maxlen equals each widget's /MaxLen where it has
# one (also ZIP Code 5 and the preparer ZIP 5); elsewhere it is the box width
# at the /DA's Helvetica 10 (width / 5 pt), and 11 for every SSN box. The
# count boxes 8, 9 and 10a (15.6-15.7 pt wide) and 10b (17.0 pt) take maxlen 2,
# not width / 5 = 3: a Helvetica 10 digit is 5.6 pt, so three digits (16.7 pt)
# overrun the box, while "88", "12", "99" and "10" each rendered inside theirs
# (the widgets carry no /MaxLen, so nothing is tighter than the widget).
#
# Checkboxes. Each option is bound to the label printed beside it (P-030), and
# every on_state was read from this blank's /AP /N, except 82F and 4a, which
# carry no /AP: their /Yes is the pack's choice, which the filler writes to a
# single widget (a fill rendered a cross in each box):
#   * "Res Status" (/Choice1 11 Nonresident, /Choice2 12 Nonresident Active
#     Military, /Choice3 13 Composite Return), "Itemized/Standard" (/Choice1
#     53I ITEMIZED, /Choice2 53S STANDARD), "Political Party" (/Choice1
#     Democratic, /Choice2 Libertarian, /Choice3 Republican) and "Refund"
#     (/Choice5 Checking on the upper row, /Choice1 Savings on the lower) are
#     radio fields, one `group` each;
#   * each dependent row's "Dependent Age included in: (Box 10a) / (Box 10b)"
#     pair is two fields answering one question: one group per row;
#   * every other box is its own field with the single state /Yes: 82F, 4a,
#     the more-space box, the educational-credit boxes, 14, 28S, 54C, the
#     65 credit-form boxes (651 308-I, 652 334, 653 349 — several may apply),
#     the 84 penalty boxes (841 Annualized/Other, 842 Farmer or Fisherman, 843
#     Form 221 included), 86A, and Part 2's C1 / C2 / stillborn boxes.
#
# Page 5 J ("... Childcare Facility Before 1990") and page 6 J ("Exploration
# Expenses Deferred Before January 1, 1990") keep the statutory year out of
# their keys: oa_j_childcare_facility_amortization, os_j_exploration_expenses_deferred.
#
# Relations follow the face's printed arithmetic, per column for 23. Omitted,
# with the reason:
#   27, 51 and 8C / 9C — the ratio is a `text` box and verify reads only MONEY
#     lines from the filled PDF, so "51 == 50 * 27" would see 27 as blank (0)
#     on an ordinary fill and FAIL a correct return; rewritten as 50 * 26 / 25
#     it divides by zero when line 25 is blank and skips the printed
#     three-place rounding;
#   47, 48, 49 (count x $2,100 / $1,500 / $2,300) — the counts are `text`.
# Line 87's printed "AMOUNT OWED: Add lines 67 and 85" does not hold on the
# overpayment path, where line 86 ("If less than zero, enter amount owed on
# line 87") sends 85 less 70 to 87. It is declared in the form that holds on
# both paths, 87 == max(0, 67 + 85 - 70): on the tax-due path 67 says "Skip
# lines 68, 69 and 70" (so 70 is 0), and on the overpayment path 67 is 0.
# Floored lines carry the face's floor as max(0, ...). Line 56 "Multiply line
# 55 by 2.5% (.025)" is declared: the 2023 booklet says "The Optional Tax
# Table and the X and Y Tax Table are now obsolete."
#
# OPEN POINTS. (1) Filing Status (lines 4-7) is not filled by the pack (Coverage, above); the engine cannot
# address one kid of a radio whose kids carry no /AP, and FormPack has no notes field that warns a caller at
# run time, so the four boxes stay blank until ticked by hand. (2) The name and relationship boxes of the
# dependent rows (pages 1 and 4) take width / 5 characters, the repo-wide convention shared with AZ Form 140
# 2023; that figure is an average, so an all-capitals value of the full maxlen can be wider than the box and
# clip on the render.
#
# Face figures against knowledge/states/az/2023.yaml: $2,100 (line 47), $1,500
# (48), $2,300 (49), 2.5% (56), 31% (7C) and both mailing addresses match.
form: "140NR"
jurisdiction: states/az
tax_year: 2023
source_url: https://azdor.gov/sites/default/files/2023-12/FORMS_INDIVIDUAL_2023_140NR_f.pdf
pdf_sha256: "c7b67205786808aa03ef037f66f0c5f690da6d5db99064e600d8b165e05478c4"
