# ===========================================================================
# Form 40NR, 2023 - Alabama Individual Income Tax Return, NONRESIDENTS ONLY (full bundle).
#
# NEW pack (Phase J JS6, 2026-10-04). No earlier Form 40NR pack exists; the TY2023 resident pack
# (states/al/2023/al40) was read for house conventions only (raw-name keys, identity fields, maxlen,
# money typing) and no binding was copied from it: every row below was placed from THIS blank's widget
# rects against its own printed labels and confirmed on a sentinel render.
#
# URL. https://www.revenue.alabama.gov/wp-content/uploads/2024/03/23f40nr.pdf. Digest a41dd6a3fef8… —
# two downloads on 2026-10-02, the discovery copy and the recorded discovery digest all agree. 35 pages
# (29 portrait letter; 5 landscape letter, pages 15 and 30-33; page 35 a 608 x 258 pt worksheet strip),
# AcroForm with document JavaScript, RC4-encrypted (print allowed), produced by UltraForms SDK 3.0.5,
# ModDate 2024-05-30.
#
# PRINTED IDENTITY. Page 1 prints "FORM 40NR Alabama 2023 Individual Income Tax Return NONRESIDENTS
# ONLY" with the scan line *2311014N*; page 2 prints "Form 40NR (2023) Page 2" with *2300024N*; both
# carry the footer "ADOR". printed_year_verified = 2023. Page 1's footer reads "MAIL FORM 40NR TO: SEE
# INSTRUCTIONS", so no address is printed on the face (mailing: null).
#
# Layout. Like the resident Form 40, the PDF carries the whole booklet of fill-in schedules behind the
# two-page return:
#   pages 1-2   Form 40NR (page 1: header, filing status / exemptions, lines 5-33, signature block;
#               page 2: Parts I-VI and the driver's-license block)
#   pages 3-4   Schedules A, B, D and E (Form 40NR)
#   pages 5-6   Schedules DS (dependents) and HOF (head of family)
#   pages 7-13  Schedule OC (other available credits)
#   page 14     Schedule AATC; page 15 Schedule AAC; pages 16-17 Schedule KRCC-I, two copies
#   pages 18-19 Form NOL-85; pages 20-29 Form NOL-85A, five copies of its two pages
#   page 30     Schedule W-2; page 31 Schedule CP; pages 32-33 Schedule RS
#   page 34     Form 4952A; page 35 Federal Income Tax Deduction Worksheet
# FLAT AcroForm: acroform_root is empty and every field name is the raw id the form ships with.
#
# Coverage (measured on this blank). 1987 widget annotations. 164 of them (162 names) are JavaScript
# PUSHBUTTONS (Ff bit 17: the print / reset / GoTo navigation buttons, UF_Start / UF_Reset, the 50 UF_L*
# UltraForms 2-D barcode slots - large printable rectangles at the top of pages 1, 7, 10, 14, 15, 16,
# 18, 20, 30 and 32 - the yellow "PLEASE USE A DIFFERENT PDF VIEWER" VERCTRL guard and the printlid.1-35
# white NoView + Print page covers) - no taxpayer data, omitted. fill_form hides the viewer guards:
# P-027 hides VERCTRL and the lids on pages 1-19, which cover at least 85% of the visible page; the lids
# on pages 20-29 (the NOL-85A copies) cover only 72.6-83.1% of it and are hidden by P-027b, which treats
# a NoView + Print pushbutton over at least half the visible page as a print lid. Without P-027b those
# ten pages would print blank, the lid painted over the face and every value. The other 1823 widgets
# carry 1809 field names; 1786 are mapped here, one line each: 1537 text, 89 money, 160 checkboxes. The
# 23 names (24 widgets) deliberately NOT mapped are not taxpayer lines:
#   * the DOR instruction panels Instructions, Instructions1-3, 5-8 and 11 (Instructions3 has two
#     widgets, pages 14 and 15) - each holds the baked-in text "-This form has been enhanced to
#     complete all calculations and to compute the amount of tax due. ..." (class 1);
#   * four white Helvetica-7 captions holding their own text: ITCTB "If true, Check the box" (page 2,
#     Part IV), NonDriver / NonDriverSP "If no driver's license, check this box." / "... -spouse,
#     check this box." and ITEMIZEDTP "Check the box If you want to enter different Itemized
#     Deduction." (page 3) - class 1;
#   * the ten UF_InfoA-K stamps: small ReadOnly Helvetica-6 boxes along the page edges (UF_InfoA at the
#     foot of page 1, the rest on the top edge) with no label, no /TU and no value - form-software
#     slots, not lines.
# Three fields have more than one widget and one key fills all of them: LINE19 (key 19; its second
# widget is Schedule OC line E1 on page 13, /TU "Tax Due from Page 1, Line 19"), SCHOCNAME and SCHOCSSN
# (the Schedule OC page headers, seven widgets each).
#
# ReadOnly. 522 mapped fields carry the ReadOnly bit: the form's own running totals (page-1 lines 5-21,
# 23, 25, 26, 28, 29, 31, 33; the page-2 part totals and the Part I / IV / V lines the schedules and the
# worksheet carry in; the schedule totals and carried amounts) and the schedule-page name / SSN mirrors.
# The blank's JavaScript fills them in Adobe Reader; taxfill runs no JavaScript, so they stay mapped for
# the caller to write (P-007 class 4). Six of them hold a nonzero default: LINE10 and the five NOL-85A
# Part III line 19 cells (SchNOL85ALN19, -1 ... -4) each hold "000.00", the formatted zero percentage
# the form recomputes (adjudicated in NONZERO_READONLY_DEFAULTS).
#
# Viewer flags. 84 mapped widgets ship Hidden + Print (/F 6: every page-1 data widget except CKNRA, and
# LINE19's page-13 widget) and 16 ship without Print (/F 0: the page-2 driver's-license block, NDL /
# SPNDL and CHKPG2PT4; page 3's SCHACK24A/B and CHKAITEMZED). fill_form clears Hidden and sets Print on
# every widget it writes (P-027).
#
# PRE-CHECKED BOXES. The blank ships two checkboxes ON (/V and /AS both /X): MFS (filing status 3,
# hidden by /F 6) and CKNRA (the "NRA" box beside it, /F 4 - visible and printable). MFS is in the
# filing_status group, so choosing any other status clears it (P-028). CKNRA is a separate fact with no
# group, and the filler never invents a value for a line it was not given: a caller whose spouse is NOT
# a nonresident alien must write CKNRA = false, or the printed return keeps the blank's tick (a fill
# naming only S, the SSN and the name prints box 1 Single AND "NRA" checked).
#
# Maxlen. Every maxlen is the widget's /MaxLen except (a) the boxes held TIGHTER than it and (b) 33
# boxes with no /MaxLen whose maxlen is measured. (a) 64 Courier boxes are too narrow to print the
# widget's count (verify's 0.6-em Courier budget, width / (0.6 x font size)): the page-1 first / last
# names (FIRSTNAME and SPOUSEFIRSTNAME 98.6 pt at 12 pt fit 13, LASTNAME and SPOUSELASTNAME 135.6 pt fit
# 18), Schedule OC SCHOCLINE1PC and SCHOCLINE2CPL, Schedule AATC SCHAATCLN6, the 46 text cells of the
# Schedule AAC Part I / II grids, the KRCC-I Part IV 3b / 3c cells (two per copy) and Schedule RS Part I
# "Reason Exempt" SCHRSILN1-7. Where a printed bullet sits on a box's left edge the budget is held lower
# so the text clears it: SCHRSILN1-7 (right-aligned, 111.9 pt at Courier 8 fits 23) take 22, because the
# bullet at x 658.5-664.7 overlaps the box at x 662.4; the centred AAC cells take one glyph less than
# verify's budget (two in column C, Social Security Number of Child, which keeps 13), so the text clears
# each column's bullet: columns A / C / D / E / F hold 20 / 13 / 20 / 26 / 32; and four more KRCC-I
# cells, Part IV line 3a and Part III line 5 in each copy (right-aligned, 60.4 / 61.5 pt at Courier 10,
# /MaxLen 10), take 9, because at 10 the first glyph reaches the bullet. Each is a TIGHTER_THAN_WIDGET
# row except the eight KRCC-I cells, which are ReadOnly form-computed values that the maxlen gate does
# not read; verify's clipping scan still covers them once written. A fill of all 68 at their budgets
# renders inside each box, clear of the printed marks. (b) The measured boxes: Schedule W-2 column E
# State Code SCHW2E1-15 take 2 (22.4 pt at Courier 12, a 2-letter code); the KRCC-I ending-year suffix
# SCHKRCCIEYEAR / -2 takes 2 (the 2 digits after the printed "20", 16.3 / 16.8 pt at Courier 10, as
# BEGYEAR's own /MaxLen 2); and 16 SSN boxes take 9 - the page-header SSNs of Schedules DS, HOF, W-2, CP
# and RS and Forms NOL-85 / NOL-85A (all five copies), and Schedule HOF's qualifying-dependent SSN (9
# digits without dashes, as page 1's SSSN /MaxLen 9; each box is 91 pt or wider at Courier 10). The
# maxlen gate reads only widgets that carry a /MaxLen, so these 33 are adjudicated here and in their row
# comments.
#
# Bullet-edge overlaps (native to the blank, cosmetic). Several left-aligned widgets (no /Q) start on
# the bullet the face prints at the box's left edge, so the first glyph of a value touches or overlaps
# it while the value stays in its box and legible: the page-1 deceased dates DDate / DDateSP; the
# Schedule AAC row-5 Effective Date of Adoption cells SCHAACPRTILN26 / SCHAACPRTIILN26 (the column's
# rows 1-4 are centred and clear it); the NOL-85A "For Year Ending" date SchNOL85ADate, -1 ... -4 (x
# 209.6, all five copies); the Schedule W-2 table cells SCHW2ALN* / SCHW2BLN* / SCHW2FLN*; and the
# Schedule RS Part I / II table cells in columns A, C, D, F and G (SCHRSALN* / SCHRSC* / SCHRSDLN* /
# SCHRSF* / SCHRSGLN* and their SCHRSPTII* twins). A shorter maxlen cannot move a left-aligned value off
# the bullet, so these are left as the blank draws them.
#
# Keys. The 37 numbered amount boxes of the page-1 return are keyed by their printed line: 5.a / 5.b /
# 5.c (columns A Alabama Tax Withheld, B All Sources, C Alabama Income), 6.b-9.c, 10, 11.b-12.c and
# 13-33. Every other line keeps its raw field name, as in the resident pack.
#
# Money vs text. money = the page-1 amounts (not line 10), the page-2 dollar boxes of Parts I-V and Part
# VI line 6, and the nine FIT worksheet lines (each prints a whole-dollar "00" cents cell). Kept text:
# every PERCENTAGE - page-1 line 10, Part III line 5, Part IV lines 3 and 6, Part V line 3 - because
# money rounds to whole dollars; Part V line 1 (a count); and every other schedule box, as in the
# resident pack (many are ratios, dates or comb-like cells).
#
# Checkbox groups. On-states re-dumped from this blank's /AP /N: 156 use /X, 4 use /Yes (the NOL-85A
# Part I box in copies 1, 2, 4 and 5; copy 3's SchNOL85APICKbox-2 uses /X). The one-answer sets are on
# SEPARATE fields, so each set shares a group id, every option bound by the word printed beside it
# (P-030): filing status 1-4 (S, MFJ, MFS, HOF); line 13 a / b ("Box a or b MUST be checked"); Part VI
# questions 2, 3, 3 (spouse filing a separate Alabama return) and 4 (A = Yes, B = No); Schedule A 24a
# ("either A line 15, or B line 16"); Schedule E Part II line 6 rows a-c ("Check One": Partnership /
# Estate or Trust / S Corporation); HOF Rent / Own and its three Yes / No questions; Schedule OC C4, C5,
# F and H Yes / No; Schedule OC J purchase vs construction ("You cannot select both" - the pro-rata box
# "can be selected in addition to either" and stays ungrouped); NOL-85A 1b and 1c Yes / No in each of
# the five copies; Schedule RS age-65 Yes / No (primary, spouse); Form 4952A Individual / Estate /
# Trust.
#
# Relations. Only printed arithmetic whose every operand is a MONEY line is declared, because verify
# reads relation operands from the filled PDF for money lines alone - a text line resolves to zero
# unless the caller supplies it. So the allocation lines stay relation-free: line 10 "Divide line 9,
# col. C, by line 9, col. B (not over 100%)" and Part IV line 3 "Divide line 2 by line 1" (a zero
# denominator on any blank return; the booklet's line-10 note gives 100% when C exceeds B and 0% when C
# is a loss, and no precision), and the products of a dollar line and a percentage - line 15, Part III
# line 6, Part IV lines 5 and 7, Part V line 4 - each would FAIL every correct return verified from
# disk. Line 18 "Subtract line 17 from line 12, column C" is declared without a floor: the face prints
# none and the form's own calculation script writes LINE12C - LINE17 as is (a loss year's taxable
# income is negative; Form NOL-85 starts from "the loss year return ... completed through the taxable
# income line"). Also omitted: 20 ("Check box if computing tax using Schedule OC, otherwise enter amount
# from line 19"), 29 ("If line 20 is larger than line 28 ...") and 33 ("If line 31 is greater than
# zero ..."), which branch on a box or another line, and the schedules (raw-name text, as in the
# resident pack).
#
# cross_form is empty. Neither page of the return cites a federal line number (Part IV line 2 and Part
# VI line 6 ask for federal adjusted gross income without one). The FIT worksheet does cite 2023 Form
# 1040 lines 22, 27, 28 and 29, Form 8960 line 17 and Schedule 3 line 13a, but it is a computation sheet
# the filer may leave blank (Part IV line 4 takes "the Federal Income Tax Liability from worksheet"),
# and a leg against a blank worksheet would FAIL.
# ===========================================================================
