  # QUALIFIEDMORTGAGEINS is NOT mapped (dropped 2026-10-02; the P-007 reasoning written out
  # 2026-10-14). Schedule A line 11 prints "Reserved for future use" over a shaded box on a plain
  # widget (/Ff 12582912, not ReadOnly) whose 2023 name invites mortgage-insurance premiums. This is
  # P-007 class 3 (a numbered line of the ladder printed reserved; line 14 "Add the amounts on lines
  # 10a through 13" takes line 11 in its range, so the face does name it), and class 3 PREFERS keeping
  # the key mapped with `reserved: true` so it survives the revision that un-reserves the line. That
  # flag is federal-only: the readonly-table tests reject a state pack in RESERVED_LINE_KEEPS, so a
  # state pack could keep the line only as an ordinary key, on which fill_form would place a value
  # silently. Between a silent value on a reserved line and a refused key, this pack takes the
  # refusal: the key does not exist, fill_form raises on it, and line 14 reads the blank line 11 as
  # zero. Re-add the key when a revision un-reserves line 11 (the TY2025 face did, as vehicle loan
  # interest, on a renamed widget).
  - line: NON1098POINTS
