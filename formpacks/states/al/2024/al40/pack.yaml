# (HTTP Last-Modified Wed, 12 Mar 2025 16:59:36 GMT; 2,199,984 bytes; PDF 1.6,
# UltraForms, encrypted with an empty user password and the same /P -1052 as
# the 2023 blank).
# Digest 4f6c357f74e2… — two separate downloads on 2026-10-02 and the triage
# copy all agree.
#
# PRINTED IDENTITY. Page 1 prints "FORM 40", "Alabama", "2024", the stamp
# "*24110140*", "Individual Income Tax Return", "RESIDENTS & PART-YEAR
# RESIDENTS" and "For the year Jan. 1 - Dec. 31, 2024, or other tax year";
# page 2 prints "Form 40 (2024)" / "*24000240*"; the schedules print 2024
# (Schedule OC "*241112OC*", "ALABAMA SCHEDULE RS – 2024") and Forms NOL-85 /
# NOL-85A print "Rev. 2/24". printed_year_verified = 2024.
#
# PAGES. 41 (2023: 40). Schedule OC gained a page: the 2024 Schedule OC runs
# pages 10-17 (2023: 10-16) — page 13 now ends with Part T (2017 Historic
# Rehabilitation, 2023's page 14), page 14 carries Parts U-AA, and Section C
# (the landscape Current Credit Summary) is split over pages 15 (Parts A-M)
# and 16 (Parts N-AA). Every later 2023 page follows one page on: 2023 pages
# 16-40 are 2024 pages 17-41.
#
# AcroForm topology against the 2023 blank (a widget census of every mapped
# widget, then a diff of the printed text page by page). The 2024 blank has
# 2,493 field names on 2,513 widget annotations: 2,124 text, 190 checkboxes,
# 179 pushbuttons (2023: 2,453 = 2,084 / 190 / 179). Of the base pack's 2,260
# mappings, 2,257 widget names survive: 382 on the same rectangle, 414 moved
# on the same page (page 1's header boxes sideways by up to 26 pt — DDate /
# DDateSP 26, SPSSN 19; Schedule DC rows f-p by up to 12 pt; Schedule OC
# pages 13-15 by 12-184 pt with the re-cut), 1,461 on another page (the page
# insertion above; from page 17 on, every rectangle is within 3 pt of
# 2023's). Every surviving mapped widget keeps its /FT, /Ff, /MaxLen, /DA and
# on-state, except SCHOCPRTYLINE1, which lost its ReadOnly bit (below).
# Annotation flags (/F) of the mapped widgets, read on this blank: 2,215 ship
# Print (/F 4); 72 ship Hidden|Print (/F 6: 68 of page 1's 71 data widgets,
# one on page 3, two on page 7, one on page 17); 16 ship /F 0, no Print (page
# 2's DOB / driver's-licence / NDL boxes, Schedule A's 19a A / B boxes, the two
# "more than one Schedule D / E" boxes). All stay mapped (P-027): fill_form
# clears Hidden and sets Print on every widget it writes and hides the
# VERCTRL / printlid.N viewer guards, and verify's P-027 check reads the flags
# back (PASS on this pack's demo fill).
#   * GONE (3), dropped: CHECKOFF18 / CHECKOFF19 (2023 Schedule DC rows q and
#     r; the 2024 list ends at p) and SCHOCLINE9PR (2023 Part R's "Maximum
#     Credit Carryforward Available" sum; the 2024 sum row is the new
#     SCHOCLINE8PR, under the added row R7e).
#   * NEW (43 names, one widget each): every one is a text data widget, and
#     all 43 are mapped —
#     Part R row R7e (SCHOCYEARPR5, SCHOCCARRYFORWARD5PR, SCHOCLIMITATION5PR,
#     SCHOCPRMAXIMUM5, SCHOCUNUSED5PR) and the R7f sum SCHOCLINE8PR (6); Part
#     X (Innovate Alabama) line X6 SCHOCLINE6PX, the X7a-X7e carry-forward
#     table (25) and the X7f sum SCHOCLINE8PX (27); Part Z line Z1
#     SCHOCPRTZLINE1 and Part AA line AA1 SCHOCPRTAALINE1 (2); Section C rows
#     C26 (Part Z) and C27 (Part AA), columns 3-6 (8).
#   * /Ff: SCHOCPRTYLINE1 went from 4194305 to 4194304 (ReadOnly cleared) — it
#     is now Part Y's filer-entry Volunteer First Responder Mileage credit.
#     No /MaxLen or /DA change on any surviving widget.
#
# FACE DELTAS vs 2023 (read on this blank's text layer and renders):
#   * Page 1: the numbering is unchanged; line 23 "2024 estimated tax
#     payments", line 33 "applied to your 2025 estimated tax"; line 25 still
#     cites "Schedule OC, Section F, line F4".
#   * Schedule DC prints 16 funds, 1a-1p (2023: 18, 1a-1r). Rows f-p changed
#     — f Alabama State Veterans Cemetery at Spanish Fort Foundation (2023 g),
#     g Foster Care, h Mental Health, i Breast & Cervical Cancer, j Military
#     Support, k Spay-Neuter, l Cancer Research, m Children First, and three
#     new funds: n State Parks Division of the Department of Conservation and
#     Natural Resources, o "Department of Mental Health – 2023" (the year as
#     printed) and p Alabama Medicaid Agency. 2023's f Historic Preservation,
#     j Firefighters Annuity, l Victims of Violence, p Rescue Squads and q USS
#     Alabama Battleship are no longer printed. Line 2 "Add lines 1a, b, c, d,
#     e, f, g, h, i, j, k, l, m, n, o, and p." See the CHECKOFF comments.
#   * Schedule HBC Part III line 5 now goes to "Form 40, Page 2, Part I, line
#     7, Other Income" (2023: line 8).
#   * Schedule OC: Part Y is now the Volunteer First Responder Mileage Income
#     Tax Credit (2023: Income Tax Capital Credit); new Part Z Preceptor Tax
#     Incentive Credit; the Income Tax Capital Credit moved to Part AA. Part R's
#     table gained row R7e; Part X gained line X6 and the X7 table. Section C
#     line 1 "Total Section C, Column 5, Part A through AA" (2023: "A through
#     Y"); Schedule KRCC-I line 5 now goes to "Schedule OC, Section B, Part AA,
#     line AA1" (2023: Part Y, line Y1). Section D's note now names the
#     Innovate Alabama carryforward limit ("Section B, Part X, Line X7"). Part
#     F line F1 counts employees "on 12-31-2023", F2 "on 12-31-2022".
#   * Schedule AATC lines 7 / 16 / 25 / 34 print "5,008" (2023: "4,795") as
#     80% of the average annual cost of attendance (printed, no widget).
#   * Schedule W-2 line 17 now reads "from Schedule RS, Part V, line 4, all
#     Form 1099s and Form W-2Gs received"; Schedule RS Part II line 8 now
#     reads "ALABAMA TAX WITHHELD from Primary's Fully or Partially Taxable
#     Retirement Distributions" and Part III line 8 "... from Spouse's Fully or
#     Partially Taxable Retirement Distributions" (2023 printed the Part I
#     "Exempt from Alabama Income" caption on both).
#   * Forms NOL-85 / NOL-85A: "Rev. 2/24"; NOL-85A line 3 and line 14 no longer
#     mention Form 40X; the name captions read "Name(s) as shown on Tax
#     Return".
#   * Federal Income Tax Deduction Worksheet: years only (2024 forms); line 4d
#     is still "Credits from Forms 2439".
#
# PAGE-1 KEYS RE-KEYED (a defect inherited from the 2023 pack, fixed here as
# the TY2025 port fixed it). The 2023 pack keyed page 1 lines 20a-34 one
# number HIGHER than printed — "22" bound TOTTAXLIB, which the 2023 and 2024
# faces print as line 21, ... "33" bound OVERPAID (printed 32),
# "34_total_donations" bound PG1LINE33 (printed 33, the amount applied to next
# year's estimated tax) and "34_first_checkoff" bound CHECKOFF1 (printed 34)
# — and spelled 5a / 5b / 20a / 20b as "5_al_tax_withheld", "5", "20_amount",
# "21_amount". This blank prints the same numbering (each widget's printed
# label measured on the text layer, then confirmed on the sentinel render), so
# this pack keys them by the printed number: 5a, 5b, 20a, 20b, 21-34 (35
# unchanged). The 2023 pack as this port found it carried the old keys (it
# was re-keyed the same way separately, pitfall P-031).
#
# GROUPS. The 2023 pack declared no checkbox groups. Each set of separate
# checkbox widgets the 2024 face prints as alternatives now shares a `group`
# (filing status 1-4; deduction box a / b; each party fund's $1 / $2 / none;
# residency "Check only one box"; every Yes / No pair; HOF Rent / Own; Schedule
# A 19a's A / B; direct-deposit Checking / Savings; Schedule OC Part J's
# purchase-or-conversion vs construction boxes, "You cannot select both" —
# "the pro-rata share of credit checkbox can be selected in addition to
# either", so it stays ungrouped; Schedule E Part II's
# per-row "Check One" entity type; Form 4952A's type of return), each
# confirmed by filling every member on the render. Independent boxes (the
# W-2 / RS / CP per-row boxes, the two spouses' deceased and no-licence boxes)
# carry none.
#
# BOX BUDGETS. 63 text lines carry a pack maxlen below the widget's /MaxLen,
# because the printed box cannot show the widget's count at its fixed
# Courier /DA (0.6 em a glyph): the first-name boxes (98.6 pt at 12 pt, 13
# glyphs, the widget says 20), Schedule HBC lines 2 / 5 / 6, Schedule OC C1
# and the Part L line-2 cell, Schedule AATC line 6, the 46 Schedule AAC
# Part I / II text cells, Schedule KRCC-I Part IV lines 3b / 3c, and
# Schedule RS Part I's seven "Reason Exempt" cells (111.9 pt at 8 pt, 23
# glyphs, the widget says 30). Each budget is the box width over the glyph
# advance, every one confirmed by a fill at that length on the render; the
# 2023 pack carried the widget counts. Four more lines whose widget has NO
# /MaxLen carry a budget from the box alone: PRESEMPNAMEADR2 (10) and the
# second Schedule KRCC-I copy's Part IV lines 3a / 3b / 3c (10 / 9 / 9, the
# page-20 copy's counts on the same boxes).
#
# NOT RESOLVED / FOR THE READER. (1) Schedule DC row o prints "Department of
# Mental Health – 2023" on the 2024 face, as written. (2) Schedule A line 11
# is "Reserved for future use" on a plain (not ReadOnly) widget; this pack
# drops the key the 2023 pack mapped — see the comment where it was.
# Three DOR rectangles overprint printed text, measured 2026-10-14 on the text
# layer and the renders; the pack schema has no rect, inset or alignment
# override, so the values land where the DOR put the widgets. (3) Page 1
# COUNTRY (x 382.4-577.6) starts about 10 pt left of the printed Foreign
# Country box's rule (x 393.0) and 2 pt after the "is outside U.S." caption
# ends (x 380.4): at Courier 12 the first glyph prints beside that caption and
# the second straddles the rule, so "Canada" reads "C|anada". (4) Page 2 Part
# IV line 4 FEDTXINC is right-quadded (/Q 2) to x 513.1, and the caption "as
# reported on your" starts at x 509.9 inside the rect, so every value's last
# digit touches the "a". (5) Schedule KRCC-I's ending-year box (SCHKRCCIEYEAR
# on page 20, SCHKRCCIEYEAR-2 on page 21) starts at x 379.4, on the printed
# "0" of "20" (ink x 379.7-383.3), so the first digit of the two-digit year
# prints over that "0". All three rectangles are unchanged from the 2023
# blank.
# ===========================================================================
# Form 40, 2024 - Alabama Individual Income Tax Return (full booklet).
#
# Provenance: blank downloaded from the official source_url below; see PRINTED
# IDENTITY in the port banner above.
#
# Layout. Alabama's Form 40 PDF carries the whole booklet in one flat AcroForm:
# the two-page Form 40 return plus every supporting schedule (A/B/DC itemized +
# interest/dividends + donation check-offs, DS & HOF dependents / head-of-family,
# ATP additional taxes & penalties, HBC first/second chance home-buyer savings,
# CR credit-for-taxes-paid worksheet, OC other available credits incl. Sections
# A-F and the AATC/AAC/KRCC-I sub-schedules, NOL-85 and NOL-85A x5 copies,
# Schedule W-2, Schedule RS retirement, Schedule CP composite payments, Schedule
# D & E, Form 4952A investment-interest, and the Federal Income Tax Deduction
# Worksheet). acroform_root is empty and the field names are the raw,
# human-readable ids the form ships with (e.g. "WAGESINC", "SCHOCPG5SECC3C1").
# Except page 1, every line key is its widget's name.
#
# Coverage. The blank has 2,493 distinct AcroForm fields. 179 are JavaScript
# PUSHBUTTONS (Ff bit 17: every "GoTo*" / "Reset*" / "btn*" / "printlid.*" /
# "UF_L*" / "VERCTRL" navigation, reset, print and viewer-guard control) and
# carry no taxpayer data — intentionally OMITTED. Of the remaining 2,314 data
# widgets (2,124 text, 190 checkboxes), 2,288 are mapped. AL marks many running
# totals ReadOnly, and they stay mapped so a filer can carry the computed value
# (P-007 class 4).
#
# The 26 deliberately UNMAPPED data widgets are not taxpayer lines. ELEVEN are
# the UltraForms barcode helpers UF_InfoA-UF_InfoK (on pages 1, 10, 14, 18,
# 19, 34, 20, 22, 24, 9 and 35 respectively): the blank's document script
# UF_SetStream() writes into them the barcode stream's length, the viewer
# version and the viewer-type length, and resetBarcode() clears them. Each is
# ReadOnly (/Ff 12582913), has no /TU and no Print flag, and has no printed
# box of its own (P-007 class 2: there is no correct taxpayer entry); the 2023
# pack as this port found it mapped them. The other 14 are ReadOnly DOR banners and captions whose
# value is baked into the blank: the per-schedule instruction panels
# Instructions, Instructions1-5 and Instructions7-11 (multiline, no /TU, every
# one opening "-This form has been enhanced to complete all calculations and
# to compute the amount of tax due."; the blank has no Instructions6), the
# NonDriver caption beside the NDL boxes, and the two white captions
# txtMultiScheduleD/E ("Check here if you have more than one Schedule D/E").
# Mapped, they would let the filler overwrite DOR text (CONVENTIONS banner
# rule).
# The 26th is Schedule A line 11 (QUALIFIEDMORTGAGEINS), printed "Reserved
# for future use" — see the comment where it was.
#
# Checkboxes. Every real checkbox in this form uses exactly one export value,
# read verbatim from this blank's /AP /N dictionary: /X or /Yes (the NOL-85
# Part III box and the five NOL-85A "check here" boxes).
#
# Money vs text. The page-1 numbered dollar lines (5a-35, the party-fund
# amounts 20a / 20b among them) are typed `money` so the verifier can enforce
# the page-1 arithmetic. All schedule/worksheet amount boxes stay `text`: many
# are percentage / ratio cells (e.g. NOL-85A Part III line 19, "but not over
# 100%") or free-text cells, and `text` is never whole-dollar rounded. This
# blank has no comb widget (0 of its 2,513 widgets carry the Comb bit, /Ff bit
# 25); the 2023 header's "comb cells" clause was wrong for it (dropped
# 2026-10-14).
#
# cross_form is empty: Alabama builds its own income from line items, and the
# Federal Income Tax Deduction Worksheet's federal figures (line 1 "the tax as
# shown on line 22 on 2024 Form 1040/Form 1040-SR/Form 1040NR", 4a-4d) are
# optional worksheet entries, not unconditional copies.
form: Form 40
jurisdiction: states/al
tax_year: 2024
source_url: https://www.revenue.alabama.gov/wp-content/uploads/2025/01/24f40.pdf
pdf_sha256: 4f6c357f74e247bb871e5261c4e70275db8236b0209ae6e7c89e16e573a9d123
