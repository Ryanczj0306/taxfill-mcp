relations:
  # Each is the printed instruction of the 2024 page 1, on lines that are unconditional on every path
  # (a blank line reads as zero): 8 "Add amounts in the income column for line 5b through line 7";
  # 10 "Subtract line 9 from line 8"; 15 "Add lines 11, 12, 13, and 14"; 16 "Subtract line 15 from
  # line 10" (it may go negative, so 16 is not floored: Form NOL-85 line 1 on page 23 takes "the
  # Taxable Income from Form 40 or Form 40NR (must be a negative amount)"); 21 "Add lines 18, 19,
  # 20a, and 20b"; 22 "Alabama income tax withheld (from column A, line 5a)"; 27 "Add lines 22, 23,
  # 24, 25, and 26"; 29 "Subtract line 28 from line 27". Lines 17, 18 and 30-35 are table-driven or
  # branch (owe vs overpaid) and are not declared. The unconditional carries printed on 7 "(from page
  # 2, Part I, line 8)" = TOTOTHERINCPG2, 9 "(from page 2, Part II, line 16)" = TOTADJINCPG2, 14
  # "(from page 2, Part III, line 2)" = TOTDEPAMT and 34 "from Schedule DC, line 2" = TOTCHECKOFFS are
  # deliberately NOT declared either: each source is a `text` line, and verify's relation math reads
  # only money lines off the filled PDF (a text operand is blank-as-zero), so "7 == TOTOTHERINCPG2"
  # would FAIL every non-zero fill.
  - "8 == 5b + 6 + 7"
  - "10 == 8 - 9"
  - "15 == 11 + 12 + 13 + 14"
  - "16 == 10 - 15"
  - "21 == 18 + 19 + 20a + 20b"
  - "22 == 5a"
  - "27 == 22 + 23 + 24 + 25 + 26"
  - "29 == 27 - 28"
cross_form: []
identity_fields:
  - SSSN
  - FIRSTNAME
  - LASTNAME
