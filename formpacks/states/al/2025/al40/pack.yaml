# Phase J JS5; triaged NEAR-PORT by names, really a partial re-map — 34 mapped
# widgets of the base gone, 406 new field names, five pages added).
#
# URL. https://www.revenue.alabama.gov/wp-content/uploads/2026/01/25f40.pdf
# (HTTP Last-Modified Thu, 26 Feb 2026 17:09:56 GMT; 2,280,968 bytes; PDF 1.6,
# UltraForms, RC4-encrypted with printing allowed, as the 2023 blank was).
# Digest ffea0ca6b0f3… — two separate downloads on 2026-10-02 and the triage
# copy all agree.
#
# PRINTED IDENTITY. Page 1 prints "FORM 40", "Alabama", "2025", the stamp
# "*25110140*", "Individual Income Tax Return", "RESIDENTS & PART-YEAR
# RESIDENTS" and "For the year Jan. 1 - Dec. 31, 2025, or other tax year";
# page 2 prints "Form 40 (2025)" / "*25000240*"; every schedule prints 2025
# (Schedule OC "*251112OC*", Schedule RS "ALABAMA SCHEDULE RS – 2025") and
# Forms NOL-85 / NOL-85A print "Rev. 5/25". printed_year_verified = 2025.
#
# PAGES. 45 (2023: 40). The 2025 booklet adds: a fourth Schedule OC page (page
# 13 — Part R's table, Parts S-X), so Schedule OC runs pages 10-17 (2023:
# 10-16); a second, identical Schedule RS (pages 37-38); the Vehicle Loan
# Interest Spreadsheet (page 43); and the Qualified Vehicle Loan Interest
# Worksheet (page 44, whose /CropBox [16.3 346.9 611.7 536.1] shows only that
# worksheet — the text layer under it repeats the Federal Income Tax Deduction
# Worksheet, which page 45 shows; page 45 in turn carries a /CropBox [1.77
# 531.2 611.1 771.6] that shows only that worksheet and hides a repeat of the
# vehicle worksheet's text beneath it). Every other 2023 page follows in order:
# 2023 pages 15-35 are 2025 pages 16-36, 36-39 are 39-42, 40 is 45.
#
# AcroForm topology against the 2023 blank (a widget census of every mapped
# widget, then a diff of the printed text page by page). The 2025 blank has
# 2,825 field names on 2,846 widget annotations: 2,413 text, 216 checkboxes,
# 196 pushbuttons (2023: 2,453 = 2,084 / 190 / 179). Of the base pack's 2,260
# mappings, 2,226 widget names survive: 325 on the same rectangle, 460 moved on
# the same page (around the new Schedule A line 11, lines 1-10b moved 22-35 pt
# up and lines 12-27 14-39 pt down; on page 1 the header boxes moved sideways,
# by up to 26 pt — DDate / DDateSP 26, SPSSN 19), 1,440 on another page (the
# page insertions above). Widget names follow the PRINTED LINE LABEL, including on
# Schedule OC's re-lettered parts (below), so every surviving name was
# re-checked against the label printed beside it on this blank.
#   * GONE (34), dropped: Schedule A MTGINTPDDESCR3 (10b had three description
#     rows, now two), OTHMISCDEDEXP3/4 (line 25 four rows, now two),
#     QUALIFIEDMORTGAGEINS (2023 line 11 "Reserved for future use", now the
#     vehicle loan interest line); Schedule DC CHECKOFF17-19 (rows p-r; the
#     2025 list ends at o); Schedule OC: the Apprenticeship credit (2023 Part S:
#     SCHOCCNAMEPS, SCHOCFEINPS, SCHOCFEINPS2, SCHOCLINE1PS, SCHOCLINE2PS), 2023
#     Part T's project rows and T2 (SCHOCPNumber/PDate/Amount1-3PT,
#     SCHOCLINE3PT), 2023 Part X Innovate Alabama (SCHOCCNAMEPX, SCHOCFEINPX,
#     SCHOCLINE1PX-5PX), SCHOCPRTWLINE1 (2023 W1), SCHOCCNAMEPQ (renamed
#     SCHOCNAMEPQ), SCHOCLINE9PR (now SCHOCLINE8PR) and Section C row C24's
#     columns 2 / 7 (SCHOCPG5SECC2C24, SCHOCPG5SECC7C24).
#   * NEW (406 names): 17 pushbuttons (navigation, reset, print guards) are
#     omitted like every other pushbutton; of the 389 data widgets 386 are
#     mapped and three are deliberately NOT: UF_InfoL (the second Schedule RS's
#     barcode helper — see Coverage), Instructions12, the second Schedule
#     RS's DOR banner (ReadOnly, 652 characters opening "-This form has been
#     enhanced to complete all calculations and to compute the amount of tax
#     due."), and VEHICLE, a white 7 pt ReadOnly caption on Schedule A line 11
#     whose baked-in value is "check the box" (class 1; the box beside it,
#     VEHICLECKBox, is mapped). The 386: Schedule A line 11a-11c (8), Schedule
#     OC Part Q's renamed Company Name (1), Part R's row R7e and R7f sum (6),
#     Part S's S1a-S1c rows (9), T1, the Part W Innovate Alabama block with its
#     W7 carry-forward / limitation table (34), X1, Parts Z, AA, AB, AC and AD
#     (19), Section C row C23 columns 2 / 7 and rows C26-C30 (23), Section F
#     F5 / F6 (2), the second Schedule RS (212), the Vehicle Loan Interest
#     Spreadsheet (61), the Qualified Vehicle Loan Interest Worksheet (8) and
#     the Federal Income Tax Deduction Worksheet line 4e (1).
#   * /MaxLen grew on two surviving widgets, and the pack follows them:
#     SCHOCLINE2APL 30 -> 50 (a 309 pt Courier 10 box, 51 glyphs) and
#     SCHOCLINE2BPL 15 -> 30 (280 pt). /Ff: SCHOCPRTYLINE1 lost its ReadOnly
#     bit (it is now Part Y's filer-entry Preceptor credit). /DA: the ten
#     Schedule AAC "Address of Adoption Agency" cells went from Courier 9 to
#     auto-size (Courier 0).
#
# FACE DELTAS vs 2023 (read on this blank's text layer and renders):
#   * Page 1 line 25 "Enter the amount from Schedule OC, Section F, line F6"
#     (2023: F4); line 33 "applied to your 2026 estimated tax"; line 23 "2025
#     estimated tax payments". The line numbering itself is unchanged.
#   * Schedule A line 11 "Vehicle loan interest (see instructions). If more than
#     2 VINs, see instructions." with 11a / 11b (date new vehicle purchased,
#     Vehicle VIN, amount) and 11c "Qualified vehicle loan interest. Enter the
#     amount from line 8 of the Qualified loan interest worksheet"; line 14 now
#     "Add the amounts on lines 10a, 10b, 11c, 12 and 13".
#   * Schedule DC prints 15 funds, 1a-1o (2023: 18, 1a-1r): rows f-o changed —
#     see the CHECKOFF comments; row n prints "Department of Mental Health –
#     2023" as written. Line 2 "Add lines 1a, b, c, ... n, and o."
#   * Schedule HBC Part III line 5 now goes to "Form 40, Page 2, Part I, line
#     7, Other Income" (2023: line 8).
#   * Schedule OC is re-lettered: 2023's Part S (Apprenticeship) is gone; 2023 T
#     (2017 Historic Rehabilitation) is now S, U (Railroad Modernization) T, V
#     (Storm Shelter) U, W (Volunteer Emergency Responders) V, X (Innovate
#     Alabama) W, Y (Income Tax Capital Credit) AD; new parts X (Volunteer First
#     Responder Mileage), Y (Preceptor), Z (Workforce Housing), AA (Employer Tax
#     Credit), AB (Childcare Facility) and AC (Employer Provider). Section F
#     adds F5 and moves its total to F6; F3 is now the 2017 Historic credit and
#     F4 the Childcare Facility credit. Schedule KRCC-I line 5 now goes to
#     "Schedule OC, Section B, Part AD, line AD1".
#   * Schedule AATC lines 7 / 16 / 25 / 34 print "5,198" (2023: "4,795") as
#     80% of the average annual cost of attendance (printed, no widget).
#   * Federal Income Tax Deduction Worksheet: the NEW line is 4d "Refundable
#     Adoption Credit. Enter the amount from line 30 of 2025 Form 1040/Form
#     1040-SR/1040-NR", printed on the surviving widget FITDW4d — which in
#     2023 was line 4d "Credits from Forms 2439". The Form 2439 line moved to
#     4e (the new widget FITDW4e, "Schedule 3, Part II, line 13a of 2025 Form
#     1040"); line 4a now cites "line 27a"; line 5 "Add lines 4a, b, c, d and
#     e"; every federal citation names the 2025 forms. A caller still using
#     the 2023 meaning of FITDW4d would put Form 2439 credits on the adoption
#     credit line.
#
# PAGE-1 KEYS RE-KEYED (a defect inherited from the 2023 pack, fixed here).
# The 2023 pack keyed page 1 lines 20a-34 one number HIGHER than printed —
# "22" bound TOTTAXLIB, which both faces print as line 21, ... "33" bound
# OVERPAID (printed 32), "34_total_donations" bound PG1LINE33 (printed 33, the
# amount applied to next year's estimated tax) and "34_first_checkoff" bound
# CHECKOFF1 (printed 34) — and spelled 5a / 5b / 20a / 20b as
# "5_al_tax_withheld", "5", "20_amount", "21_amount". The 2023 pack was
# re-keyed the same way on 2026-10-02 (pitfall P-031;
# test_al40_line_designators.py reads the printed number beside every numbered
# page-1 widget on both blanks). The 2023 and 2025 faces print the same numbering
# (measured on both blanks and confirmed on this blank's sentinel render), so
# this pack keys them by the printed number: 5a, 5b, 20a, 20b, 21-34 (35
# unchanged). No code, fixture or test outside the AL packs names the old
# keys.
#
# GROUPS. The 2023 pack declared no checkbox groups. Each set of separate
# checkbox widgets the 2025 face prints as alternatives now shares a `group`
# (filing status 1-4; deduction box a / b; each party fund's $1 / $2 / none;
# residency "Check only one box"; every Yes / No pair; HOF Rent / Own; Schedule
# A 19a's A / B; direct-deposit Checking / Savings; Schedule OC Part J's
# purchase-or-conversion vs construction boxes ("You cannot select both" — the
# pro-rata box "can be selected in addition", so it stays ungrouped); Schedule
# E Part II's per-row "Check One" entity type; Form 4952A's type of return),
# each confirmed by filling every member on the render. Independent boxes (the
# W-2 / RS / CP per-row boxes, the two spouses' deceased and no-licence boxes)
# carry none.
#
# NOT RESOLVED / FOR THE READER. (1) The Qualified Vehicle Loan Interest
# Worksheet line 6 says "increase the result to the next higher whole number",
# while the blank's own script computes it with Math.round; taxfill writes what
# the caller supplies, so compute line 6 as printed. (2) Schedule OC Section
# D's note still cites "Section B, Part X, Line X7" for the Innovate Alabama
# carryforward; that credit is Part W / W7 on this face. (3) Pages 44-45 (the
# Qualified Vehicle Loan Interest and Federal Income Tax Deduction worksheets)
# crop a short window out of a Letter MediaBox, and a white print-only lid
# (printlid.46 / printlid.43) covers all of it; fill_form hides both since
# P-027 measures a viewer guard against the CropBox (2026-10-02) — before
# that, both worksheets printed blank.
# ===========================================================================
# Form 40, 2025 - Alabama Individual Income Tax Return (full booklet).
#
# Provenance: blank downloaded from the official source_url below; see PRINTED
# IDENTITY in the port banner above.
#
# Layout. Alabama's Form 40 PDF carries the whole booklet in one flat AcroForm:
# the two-page Form 40 return plus every supporting schedule (A/B/DC itemized +
# interest/dividends + donation check-offs, DS & HOF dependents / head-of-family,
# ATP additional taxes & penalties, HBC first/second chance home-buyer savings,
# CR credit-for-taxes-paid worksheet, OC other available credits incl. Sections
# A-F and the AATC/AAC/KRCC-I sub-schedules, NOL-85 and NOL-85A x5 copies,
# Schedule W-2, Schedule RS x2 copies, Schedule CP composite payments, Schedule
# D & E, Form 4952A investment-interest, the Vehicle Loan Interest Spreadsheet,
# the Qualified Vehicle Loan Interest Worksheet and the Federal Income Tax
# Deduction Worksheet). acroform_root is empty and the field names are the raw,
# human-readable ids the form ships with (e.g. "WAGESINC", "SCHOCPG5SECC3C1").
# Except page 1, every line key is its widget's name.
#
# Coverage. The blank has 2,825 distinct AcroForm fields. 196 are JavaScript
# PUSHBUTTONS (Ff bit 17: every "GoTo*" / "Reset*" / "btn*" / "printlid.*" /
# "UF_L*" / "VERCTRL" navigation, reset, print and viewer-guard control) and
# carry no taxpayer data — intentionally OMITTED. Of the remaining 2,629 data
# widgets (2,413 text, 216 checkboxes), 2,601 are mapped. AL marks many running
# totals ReadOnly, and they stay mapped so a filer can carry the computed value
# (P-007 class 4; 625 such bindings).
#
# The 28 deliberately UNMAPPED data widgets are not taxpayer lines. TWELVE are
# the UltraForms barcode helpers UF_InfoA-UF_InfoL (on pages 1, 10, 14, 18,
# 19, 34, 20, 22, 24, 9, 35 and 37 respectively): the blank's document script
# UF_SetStream() writes into them the barcode stream's length, the viewer
# version and the viewer-type length, and resetBarcode() clears them. Each is
# ReadOnly (/Ff 12582913), has no /TU and no Print flag, and has no printed
# box of its own (P-007 class 2: there is no correct taxpayer entry). The
# other 16 are ReadOnly DOR banners and captions whose value is baked into the
# blank: the per-schedule instruction panels Instructions, Instructions1-5 and
# Instructions7-12 (multiline, no /TU, 652-753 characters each, every one
# opening "-This form has been enhanced to complete all calculations and to
# compute the amount of tax due."; the blank has no Instructions6), the
# NonDriver caption "If no driver's license, check the box. ... Spouse's"
# (white 7 pt beside the NDL boxes), the two white captions
# txtMultiScheduleD/E ("Check here if you have more than one Schedule D/E")
# and VEHICLE ("check the box", white 7 pt on Schedule A line 11). Mapped,
# they would let the filler overwrite DOR text (CONVENTIONS banner rule).
#
# Checkboxes. Every real checkbox in this form uses exactly one export value,
# read verbatim from this blank's /AP /N dictionary: /X (210 of them) or /Yes
# (6, on the NOL-85 Part III box and the five NOL-85A "check here" boxes).
#
# Money vs text. The page-1 numbered dollar lines (5a-35, the party-fund
# amounts 20a / 20b among them) are typed `money` so the verifier can enforce the
# page-1 arithmetic. All schedule/worksheet amount boxes stay `text`: many are
# percentage / ratio cells (e.g. NOL-85A Part III line 19, "but not over 100%")
# or comb cells whose value must never be whole-dollar rounded.
#
# cross_form is empty: Alabama builds its own income from line items, and the
# Federal Income Tax Deduction Worksheet's federal figures (line 1 "the tax as
# shown on line 22 on 2025 Form 1040/Form 1040-SR/Form 1040NR", 4a-4e) are
# optional worksheet entries, not unconditional copies.
form: Form 40
jurisdiction: states/al
tax_year: 2025
source_url: https://www.revenue.alabama.gov/wp-content/uploads/2026/01/25f40.pdf
