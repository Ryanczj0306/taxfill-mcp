relations:
  # Core Form IT-140 on-face arithmetic (every operand mapped to a bare line of the return;
  # unconditional sums only), re-derived from the 2024 face's renumbered page 2.
  - "4 == 1 + 2 - 3"                       # 4 "line 1 plus line 2 minus line 3"
  - "14 == 10 + 11 + 12 + 13"              # 14 "Add lines 10 through 13"
  - "21 == 21a + 21b + 21c"                # 21 "claim each separately below. Enter sum on line 21"
  - "23 == 15 + 16 + 17 + 18 + 19 + 20 + 21 + 22"  # 23 "add lines 15 through 22"
  - "26 == 26a + 26b + 26c"                # 26 "Enter donation amounts below and enter the sum on Line 26"
  # NOTE: line 6 = box (e) count x $2,000 ($500 when box e is zero), line 7 = line 4 - (5+6) floored
  # at zero, line 8 = a tax-table / rate-schedule lookup, line 10 floors at zero, and lines 24/25
  # branch on balance due vs overpayment; none is declared as unconditional arithmetic. Line 28
  # ("line 25 minus line 26 and line 27") is not declared: a balance-due filer's donation
  # increases the payment instead (instructions, line 26), leaving 25 and 28 blank with 26 > 0.
  # The schedule totals (Schedule M 52/61, RECAP 27, UT 11, HEPTC 9, FTC 8, E 10) stay comments
  # beside their fields, as in the 2023 pack.
cross_form:
  # Form IT-140 line 1 "Federal Adjusted Gross Income" == federal AGI, which the 2024 Form 1040
  # prints on line 11.
  - "1 == f1040.11"
identity_fields:
  - name.first
  - name.last
  - identifying_number
  - mailing_address.street
  - mailing_address.city
  - mailing_address.state
  - mailing_address.zip
signature: {page: 2}
mailing: null
