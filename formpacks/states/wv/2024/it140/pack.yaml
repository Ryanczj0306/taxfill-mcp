# ===========================================================================
# TY2024 PORT of formpacks/states/wv/2023/it140/pack.yaml (ported 2026-10-04,
# Phase J JS5; triaged RE-MAP: 39 of the 2023 pack's 377 mapped widgets are
# gone from the 2024 blank). The TY2025 return exists only as a print booklet
# (formpacks/states/wv/2025/it140/handfill.yaml); TY2024 still ships this
# fillable-forms edition, so this is an ordinary AcroForm port.
#
# URL. https://tax.wv.gov/Documents/PIT/2024/it140.2024.pdf. Digest
# 1b9a3c71c637… (2,524,481 bytes): two separate downloads and the triage
# copy all hash the same. %PDF-1.7, AcroForm with document JavaScript, 45
# pages, AES-256 encrypted with an empty user password (print allowed).
# Metadata: Creator Adobe InDesign 19.5, Producer Adobe PDF Library 17.0,
# created 2024-08-13, modified 2025-01-10.
#
# PRINTED IDENTITY. PDF page 1 prints "IT-140 F", "WEST VIRGINIA / PERSONAL
# INCOME TAX RETURN" and "2024"; its scan line reads *P40202401F* (2023:
# *P40202301F*). The 2023 face also printed a revision stamp "REV 06-22";
# the 2024 face prints NO revision stamp. Every mapped schedule page prints
# "2024" in its header (Schedule M, RECAP, HEPTC-1, FTC-1, H, E, F, UT, DP);
# page 2 and the page-18 amended/penalty-waiver page carry no year header.
# printed_year_verified = 2024. Same 45 PDF pages, same page order as 2023:
# the pack maps the same 14 PDF pages (1-6, 9, 10, 12, 13, 14, 16, 18, 19).
#
# AcroForm topology against the 2023 blank (a widget census of the 2023
# pack against this blank, then every page read on a sentinel render).
# 643 widgets / 556 distinct widget names (2023: 640 widgets). Of the 377
# widgets the 2023 pack mapped: 222 kept name and /Rect, 116 kept the name
# but moved, 39 are gone. A surviving NAME proves nothing here: page 2 and
# Schedule M were renumbered (below) and the DOR re-cut its widget names to
# the NEW printed numbers, so e.g. "M29A" was 2023 line 29 (WV police /
# firemen retirement) and is now 2024 line 29 (interest on US / WV
# obligations). Every key below was re-bound by /Rect against the printed
# 2024 row and confirmed on the render; where the form's own calculate
# scripts name the cells (M33A = min(2000, M33A_a + M33B_a); M34C_a =
# M34A_1 - M34B_1; M46A = M46A_a - M46A_b) they agree with that binding.
# The 39 gone widgets and what replaced them:
#   * it140_24A/24B/24C (2023 donations) -> it140_26A/26B/26C (line 26 A/B/C).
#   * Schedule M: M27A/B, M28A/B, M31A_a/_b, M31B_a/_b, M33A_1/_2,
#     M33B_1/_2, M44A_a/_b, M44B_a/_b, M46A_1, M46B_1, M47C1/C2, M47D1/D2,
#     M47_1/_2, M48A/B, M49A/B, M50, M51 and the four
#     scheduleM.comboBox.47.* age/disability combos -> the same cells two
#     lines down (M29A/B .. M61, the M33*/M34*/M46* sub-cells and
#     scheduleM.comboBox.49.*), each mapped under its 2024 line number.
#   * "Check Box3" (2023 "Preparer: Check HERE if client is requesting NOT
#     to efile"): the 2024 face no longer prints the box or its caption, and
#     no widget replaces it -> preparer.not_efile is DROPPED.
#   * "homestead08_checkbox" (HEPTC-1 line 8 Yes/No): the 2024 face still
#     prints "Yes. Continue to line 9 below / No. Stop" with two empty
#     squares, but no widget sits on them -> heptc.8.yes / heptc.8.no are
#     DROPPED (a hand-marked answer on paper only).
#   * Not a widget change but a key dropped all the same: "Preparer’s
#     Signature" (kept, same /FT /Sig) was mapped as text in 2023; the
#     2024 pack leaves it unmapped -> preparer.signature is DROPPED (see
#     "Money vs text" below).
# 46 NEW widgets: 44 MAPPED (it140_21A/B/C, it140_26A/B/C, it140_27,
# it140_28, the Schedule M cells listed above plus the new 34(c) pair
# M34C_a / M34C_b) and 2 NOT mapped: scheduleM52_button1 and
# scheduleM61_button1, "Click here to go to Form IT-140" pushbuttons that
# fire JavaScript and store no value.
# /MaxLen: no mapped widget gained or lost one. /DA: the new line-21 A/B/C
# cells are /Arial 8 (about 60 pt wide); the line-26 A/B/C cells changed
# from /Arial 8 to /CoBo 10, the line-26 total from /CourierNew,Bold 10 to
# /Helv 9, and line 27 to /CoBo 10. /Ff (ReadOnly bit, compared line for
# line by meaning): newly ReadOnly in 2024 are Schedule M 34 (both
# columns) and 52, and RECAP 2; newly writable are IT-140 line 19 (HEPTC)
# and Schedule M 51 column B; the new line-12 penalty box, the 21A/B/C
# cells and the 34(c) pair are writable and the new line-21 total is
# ReadOnly. 54 mapped widgets are ReadOnly in all. Every mapped
# ReadOnly widget carries its own calculate script (a running total, a
# carried subtotal or a mirror such as RECAP 2 = FTC-1 line 8), i.e. P-007
# class 4: kept mapped, or it ships blank.
#
# FACE DELTAS vs 2023 (a diff of the printed text, then the renders).
#   * PAGE 2 RENUMBERED. The 2023 unnumbered "Penalty Due" row (waiver box
#     only) is now line 12 "Penalty Due from Form IT-210 ... If you owe
#     penalty, enter here" with an entry box; a NEW line 21 "WV Property Tax
#     Adjustment Tax Credits (claim each separately below. Enter sum on line
#     21)" with cells A. MOTOR VEHICLE PROPERTY TAX, B. DISABLED VETERAN REAL
#     PROPERTY TAX, C. SMALL BUSINESS PROPERTY TAX. 2023 lines 12-19 print as
#     13-20 and 2023 lines 20-26 as 22-28: 14 "Add lines 10 through 13", 23
#     "add lines 15 through 22", 24 "line 14 minus line 23", 25 "Line 23
#     minus line 14", 26 donations A/B/C, 27 "credited to your 2025
#     estimated tax", 28 "Refund due to you (line 25 minus line 26 and line
#     27)". Line 17 now reads "MUST include Schedule WV NFA-1", 18 "MUST
#     include Schedule SCTC-A". The 2023 "Payment Options" block and the
#     preparer not-to-efile box are gone; the preparer row now reads
#     "Signature of preparer other than above / Preparer's EIN / Date /
#     Telephone Number".
#   * PAGE 1: line 2 now cites "line 61 of Schedule M" (2023: 59), line 3
#     "line 52 of Schedule M" (2023: 50); the "MUST INCLUDE WITHHOLDING" /
#     "TAX DEPT USE ONLY" side panel is gone. Line 6 still prints "x $2,000"
#     and box (e) "If box e is zero, enter $500 on line 6 below".
#   * SCHEDULE M RENUMBERED +2: 2023 lines 27-59 print as 29-61 (TOTAL
#     SUBTRACTIONS 52 -> IT-140 line 3; TOTAL ADDITIONS 61 -> IT-140 line 2).
#     Line 34 (2023: 32) Social Security Benefits gained a 34(c) entry row
#     and now prints "Multiply 34(c) by 0.35 if your Federal AGI exceeds $
#     50,000 for SINGLE or MARRIED SEPARATE filers $100,000 for MARRIED
#     JOINT filers"; line 33 still prints the $2,000 cap; 45 "(not to
#     exceed $25,000)"; 49(c) "(NOT TO EXCEED $8000)".
#   * RECAP: line 18 is now "Child and Development Care Credit
#     (§11-21-26)" -- the section number is printed on the rendered face
#     (page 5, 200 dpi) but the PDF text layer drops the digits and yields
#     only "(§....." -- with "Must include a copy of federal form 2441" in
#     the schedule column
#     (2023: Small Arms And Ammunition Manufacturers Credit, SAAM-1); line 9
#     RBIC-A cites §11-21-8g (2023: §11-24-23a); line 26 reads "Elective
#     Income Credit for tax paid by a Pass-through Entity"; line 27 now
#     prints its line number.
#   * HEPTC-1: new caption "If you are claiming the Disabled Veterans
#     Property Credit, you are not eligible to also claim this credit."; the
#     income limits are $45,180 / $61,320 / $77,460 / $93,600, add $16,140
#     per additional person (2023: $43,740 .. $90,000, +$15,420); 4a cites
#     "line 61 of Schedule M"; line 9 ends "and enter on line 19 of IT-140".
#   * Schedule UT line 11 now says "line 13 of Form IT-140" (2023: 12);
#     line 2 still prints the .06 rate. Schedule E's year-of-move combo
#     lists "2024" (and defaults to it). Schedule H prints 2024 throughout.
#     The skipped WV4868 page now says "no later than October 15".
#   knowledge/states/wv/2024.yaml agrees on $2,000 / $500, the HEPTC limits
#   and $1,000 cap, the 35% social-security rule and its $50,000 /
#   $100,000 thresholds, SCTC on line 18 and HEPTC on line 19.
#
# SCHEDULE H. The 2023 pack left the disabled taxpayer's SSN and the
# physician's state / ZIP widgets unmapped; this port maps them
# (sch_h.disabled_taxpayer_ssn, sch_h.physician_state, sch_h.physician_zip),
# each confirmed on the render. The physician's "Date MM DD YYYY" combos
# beside "Physicians Signature" stay UNMAPPED: the face tells the physician
# to "Sign and date the certification", so that date belongs to the
# physician's own signature, not to the return being prepared.
# ===========================================================================
# Form IT-140, 2024 -- West Virginia Personal Income Tax Return (RESIDENT).
#
# Layout / what is FILED vs SKIPPED. The packet is mostly an INSTRUCTION
# BOOKLET (tax tables, worksheets, where-to-file). Fillable AcroForm widgets
# cluster on PDF pages 1-10, 12-14, 16-19; PDF pages 20-45 are
# instruction/tax-table pages whose only widget is the shared page-footer
# "Return to the first page" navigation button (plus a few JS calc-helper /
# worksheet fields). The packet numbers its physical PDF pages differently
# from the printed "-N-" footer; the map below is by 1-indexed PDF page, with
# the printed footer in parentheses.
#
# MAPPED pages (1-indexed PDF page):
#   page 1  (printed -1-)  = Form IT-140 Page 1 -- header (2 SSNs + deceased
#            flags, names/suffix/MI, mailing address, phone, email, extended-
#            due-date), 4 top checkboxes (amended, nonresident special,
#            nonresident/part-year, WV-8379 injured spouse), Filing Status (ONE
#            /Btn radio, 5 on_states), Exemptions boxes (a)-(e), Dependents
#            table (4 rows) + surviving-spouse decedent SSN / year-died, lines
#            1-8 (line 8 has a ONE /Btn method radio: Tax Table / Rate Schedule
#            / Nonresident-PY).
#   page 2  (printed -2-)  = Form IT-140 Page 2 -- lines 9-28 (12 penalty-
#            waiver flag; 13 no-use-tax flag; 15 NRSR-withholding flag; 21
#            property-tax credits 21A/21B/21C + total; 26 donations
#            26A/26B/26C + total), Direct Deposit (checking/savings radio +
#            routing/account), discuss-with-preparer Yes/No, preparer
#            EIN/phone (the preparer-signature widget is a /Sig field and
#            stays UNMAPPED; see "Money vs text" below).
#   pages 3-4 (printed -3-,-4-) = Schedule M "Modifications to Adjusted Gross
#            Income" -- decreasing mods lines 29-50 (col A You / col B Spouse;
#            33 and 46 have (a)/(b) sub-cells, 34 has (a)/(b)/(c)), line 49
#            age/disability grid, line 50 surviving-spouse deduction, 51 sums,
#            line 52 TOTAL SUBTRACTIONS (-> IT-140 line 3), increasing mods
#            lines 53-60, line 61 TOTAL ADDITIONS (-> IT-140 line 2).
#            Namespaced sch_m.*.
#   pages 5-6 (printed -5-,-6-) = Tax Credit RECAP Schedule -- credit lines
#            1-26 (line 1 has 5 "For what states?" combo boxes) + line 27 TOTAL
#            NON REFUNDABLE CREDITS (-> IT-140 line 9). Namespaced recap.*.
#   page 9  (printed -9-)  = Schedule HEPTC-1 "Homestead Excess Property Tax
#            Credit" -- Part I AMT flag + required-to-file Yes/No, Part II lines
#            1-9 (line 4 has a-e sub-lines; line 8's Yes/No has no widget);
#            line 9 -> IT-140 line 19. Namespaced heptc.*.
#   page 10 (printed -11-) = Schedule FTC-1 "Family Tax Credit" -- lines 1-8;
#            line 8 -> RECAP line 2. Namespaced ftc.*.
#   page 12 (printed -13-) = Schedule H "Certification for Permanent and Total
#            Disability" -- disabled-taxpayer name/SSN, physician name/FEIN/
#            street address/city/state/ZIP. Supports the Schedule M disability modification.
#            Namespaced sch_h.*.
#   page 13 (printed -14-) = Schedule E "Credit for Income Tax Paid to Another
#            State" -- residency-status radio (E_rg1), part-year sub-radio
#            (E_rg2), date-of-move, state-abbrev combo, lines 1-10; line 10 ->
#            RECAP line 1. Namespaced sch_e.*.
#   page 14 (printed -41-) = Schedule F "Statement of Claimant to Refund Due
#            Deceased Taxpayer" -- decedent/claimant identity, filing-as radio
#            (Group1: A/B/C), and box-C Yes/No question pairs (lines 1, 2a, 2b,
#            3). Namespaced sch_f.*.
#   page 16 (printed -44-) = Schedule UT "West Virginia Purchaser's Use Tax
#            Schedule" -- Part I state use tax (line 1 purchases, line 3 tax),
#            Part II municipal rows 4-7 (a City / b purchases / c rate /
#            d tax) + line 8 total, Part III lines 9-11; line 11 -> IT-140
#            line 13. Namespaced sch_ut.*.
#   page 18 (printed -47-) = Amended Return Information free-text box + written
#            request for waiver of estimated penalty free-text box. Namespaced
#            amended.* / penalty_waiver.*.
#   page 19 (printed -49-) = Schedule DP "Schedule of Additional Dependents" --
#            continuation rows for dependents 1-21 (first/last/SSN/DOB).
#            Namespaced sch_dp.*.
#
# SKIPPED pages and why:
#   pages 7-8 (Schedule A -- Nonresidents/Part-Year Residents Schedule of
#            Income): filed ONLY by nonresidents / part-year residents; this is
#            the RESIDENT return -> SKIPPED.
#   page 17 (WV4868 -- Application for Extension of Time to File): a STANDALONE
#            form filed BEFORE the return's due date -> SKIPPED (its header
#            widgets share the same /T as the IT-140 page-1 header, so they
#            are already covered by the page-1 identity fields).
#   page 11 (Family Tax Credit Tables), page 15 (Schedule UT instructions),
#            pages 20-45 (instructions, tax tables, rate schedules,
#            worksheets): not filed forms -> SKIPPED. Their only widgets are
#            the shared "returnToFirstPage" nav button and JS calc / worksheet
#            helper fields.
#
# AcroForm. FLAT form: acroform_root = ''. Every widget's /T is the raw flat id
# the form ships with (descriptive names like "it140_1", "M52", "recap01",
# "homestead09", "E10", "SchF_DOD", "totaluse", "fname_1"). NAV / JS-helper
# widgets are NOT mapped: the per-page "returnToFirstPage" footer button (45
# copies), the page-1 header nav buttons (headerNavigation*,
# calcOrderStartingPoint, "Test"), the Schedule M validation helpers
# (validate, validate1, YouDisvalid1, SpouseDisvalid) and every "*_button*" /
# "Clear" widget (these fire JavaScript rather than store a value).
#
# Shared /T across pages (map ONCE). The page-1 header identity fields are
# echoed as header repeaters that SHARE the same /T: EVERY page-1 header
# field (both SSNs, names, suffixes and MIs, the two address lines, city,
# state, ZIP, telephone, email and the extended-due-date MM/DD/YYYY) recurs
# on the PDF page-17 WV4868; the primary SSN and last name also recur on
# pages 2 and 18, and both SSNs on page 8 (the Schedule A header). Each is
# mapped ONCE (page 1). The Schedule M
# line-49 age/disability boxes are FOUR distinct fields
# scheduleM.comboBox.49.{you,spouse}.{yearOfBirthIf65OrOlder,yearOfDisability},
# mapped separately. On page 16, Schedule UT "total3" (line 3 = line 9) and
# "totalmuni" (line 8 = line 10) each appear twice sharing one /T; mapped ONCE.
#
# Money vs text. Every numbered dollar box prints a ".00" whole-dollar suffix
# and is `money`. SSNs are text with format ssn_digits_only. Exemption count
# boxes (ex1..ex6, maxlen 1/2), the RECAP "For what states?" combo boxes, the
# Schedule E state-abbrev combo, dates of death/birth/move, names, addresses,
# phones, email, EIN, and the two Amended/penalty free-text boxes stay `text`.
# "Preparer's Signature" (/Rect on the "Signature of preparer other than
# above" rule) is an /FT /Sig digital-signature widget, not /Tx. The 2023 pack
# mapped it as text; fill_form does NOT skip a /Sig field -- it writes the
# string as the field's /V, which no viewer renders (pypdf logs "Signature
# forms not implemented yet") and which leaves a non-signature /V in a /Sig
# field. So 2024 drops the preparer.signature key: the preparer signs that
# line by hand, like the taxpayer and spouse signature lines (which carry no
# widget at all).
#
# Worksheet calc defaults. The worksheet pages are skipped, and no JavaScript
# runs at fill time, so their calculated cells keep the blank's own stored
# values in the filled PDF: the page-34 Low-Income Earned Income Exclusion
# Worksheet shows A=0, C=10000, D=0 and the page-39 Senior Citizens Tax
# Credit income worksheet shows G=0, I=0 (identical /V in the blank and a
# filled copy). Those figures do not track the return's line 1 / line 5;
# the worksheets are the filer's own scratch pages and are not filed.
#
# Checkboxes / radio groups. Filing Status is ONE /Btn "it140_filingStatus_
# radioGroup" with five distinct on_states -> shared group filing_status.
# The line-8 tax-method selector is ONE /Btn "it140_8_radioGroup" with three
# on_states -> group tax_method. Direct-deposit checking/savings is ONE /Btn
# with two on_states -> group refund.account_type. Schedule E residency
# ("E_rg1", 3 states) and part-year sub-status ("E_rg2", 3 states) are each
# ONE /Btn -> groups sch_e.residency / sch_e.part_year. Schedule F filing-as
# ("Group1", A/B/C) -> group sch_f.filing_as; its box-C Yes/No questions are
# DISTINCT single-state /Btn fields (Check BoxA..H) each mapped as its own
# line with a shared group per question. Two more Yes/No questions have that
# same separate-field topology and likewise carry a shared group: the
# signature discuss-with-preparer pair (Check Box1 /Yes + Check Box2 /No ->
# group signature.discuss_with_preparer) and the HEPTC-1 Part I
# required-federal-return pair (homesteadY_checkbox + homesteadN_checkbox, BOTH
# on /Yes -> group heptc.required_federal_return). All other boxes are
# independent single-state flags where the printed face shows no exclusivity
# (deceased primary/spouse on /Primary; amended; nonresident special;
# nonresident/PY; injured spouse; penalty-waiver-attached; no-use-tax; NRSR;
# HEPTC AMT flag on /FAMT). Every on_state was re-read from this blank's
# /AP /N.
#
# Relations. Only on-face arithmetic where every operand is mapped to a bare
# line of THIS core return (IT-140 lines 1-28) is declared; schedule internal
# sums (Schedule M 52/61, RECAP 27, UT 11, etc.) live only as comments. Lines
# that floor at zero (7; 10 "If line 9 is greater than line 8, enter 0") or
# branch on a comparison (24/25 balance due vs overpayment) are NOT declared.
# Line 28 prints plain subtraction ("line 25 minus line 26 and line 27") but
# is not declared either: the instructions say a line-26 donation means "Your
# overpayment will be reduced, or your payment increased by this amount", so
# a balance-due filer who donates has 25 blank, 26 > 0 and 28 blank, and
# "28 == 25 - 26 - 27" would fail on that path.
#
# Cross_form. Form IT-140 line 1 prints "Federal Adjusted Gross Income or
# income to claim senior citizen tax credit from Schedule SCTC-A" -- for a
# normal resident return this is federal AGI, which the 2024 Form 1040 prints
# on line 11 (f1040.11).
form: "IT-140"
jurisdiction: states/wv
tax_year: 2024
source_url: https://tax.wv.gov/Documents/PIT/2024/it140.2024.pdf
pdf_sha256: "1b9a3c71c63726302b3f986618fe73c7e2b0d8203989b450f2893f0dd2fd1261"
acroform_root: ''
fields:
  # ============================================ page 1 -- Form IT-140 Page 1 header
  - line: identifying_number              # "SOCIAL SECURITY NUMBER" (primary)
    field: "primaryTaxpayerSSN"
    type: text
    maxlen: 11
    format: ssn_digits_only
  - line: deceased.taxpayer               # "Deceased / Date of Death*" primary flag
    field: "it140_checkbox_deceasedPrimary"
    type: checkbox
    on_state: /Primary
  - line: deceased.taxpayer.date_of_death # "Date of Death*" (primary)
    field: "DOD_1"
    type: text
  - line: spouse.identifying_number       # "**SPOUSE'S SOCIAL SECURITY NUMBER"
    field: "primaryTaxpayerSpouseSSN"
    type: text
    maxlen: 11
    format: ssn_digits_only
  - line: spouse.deceased                 # "Deceased" spouse flag
    field: "it140_checkbox_deceasedSpouse"
    type: checkbox
    on_state: /Primary
  - line: spouse.deceased.date_of_death   # "Date of Death*" (spouse)
    field: "DOD_2"
    type: text
  - line: name.last                       # "LAST NAME"
    field: "primaryTaxpayerLastName"
    type: text
  - line: name.suffix                     # "SUFFIX" (primary); narrow widget (~25pt) -> cap at 3
    field: "it140_suffixPrimaryTaxpayer"
    type: text
    maxlen: 3
  - line: name.first                      # "YOUR FIRST NAME"
    field: "it140_PrimaryTaxpayerFirstName"
    type: text
  - line: name.middle_initial             # "MI" (primary)
    field: "it140_middleInitialPrimaryTaxpayer"
    type: text
    maxlen: 1
  - line: spouse.name.last                # "SPOUSE'S LAST NAME"
    field: "it140_SpouseLastName"
    type: text
  - line: spouse.name.suffix              # "SUFFIX" (spouse)
    field: "it140_suffixSpouse"
    type: text
    maxlen: 3
  - line: spouse.name.first               # "SPOUSE'S FIRST NAME"
    field: "it140_SpouseFirstName"
    type: text
  - line: spouse.name.middle_initial      # "MI" (spouse)
    field: "it140_middleInitialSpouse"
    type: text
    maxlen: 1
  - line: mailing_address.street          # "FIRST LINE OF ADDRESS"
    field: "it140_PrimaryTaxPayerAddress1"
    type: text
  - line: mailing_address.street2         # "SECOND LINE OF ADDRESS"
    field: "it140_PrimaryTaxPayerAddress2"
    type: text
  - line: mailing_address.city            # "CITY"
    field: "it140_PrimaryTaxPayerCityOrPostOffice"
    type: text
  - line: mailing_address.state           # "STATE" (combo)
    field: "it140_combobox_taxpayerState"
    type: text
    maxlen: 2
  - line: mailing_address.zip             # "ZIP CODE"
    field: "it140_PrimaryTaxPayerZipCode"
    type: text
  - line: telephone_number                # "TELEPHONE NUMBER"
    field: "it140_PrimaryTaxpayerDaytimeTelephoneNumber"
    type: text
  - line: email                           # "EMAIL"
    field: "email3"
    type: text
    maxlen: 30
  - line: extended_due_date.month         # "EXTENDED DUE DATE MM/DD/YYYY" MM
    field: "it140_extendedDueDateMM"
    type: text
    maxlen: 2                             # the widgets carry no /MaxLen; each part is a narrow option-list combo
  - line: extended_due_date.day           # DD
    field: "it140_extendedDueDateDD"
    type: text
    maxlen: 2
  - line: extended_due_date.year          # YYYY (option list blank or "2025")
    # The combo is only ~30 pt wide; on screen (pdfium) its dropdown arrow covers the last digit of a
    # 4-digit year. The /V is the full value and lands in the YYYY slot; a viewer that hides the
    # arrow on print shows all four digits.
    field: "it140_extendedDueDateCCYY"
    type: text
    maxlen: 4

  # ---- top-row single checkboxes
  - line: amended_return.yes              # "AMENDED RETURN"
    field: "it140.isAmendedReturn.checkBox"
    type: checkbox
    on_state: /Yes
  - line: nonresident_special.yes         # "NONRESIDENT SPECIAL"
    field: "it140_checkbox_filingAsNonResidentSpecial"
    type: checkbox
    on_state: /Yes
  - line: nonresident_part_year.yes       # "NONRESIDENT/PART YEAR RESIDENT"
    field: "it140_checkbox_filingAsNonOrPartYearResident"
    type: checkbox
    on_state: /Yes
  - line: injured_spouse.yes              # "FORM WV-8379 FILED AS AN INJURED SPOUSE"
    field: "it140_isFormWV8379FiledAsAnInjuredSpouse"
    type: checkbox
    on_state: /Yes

  # ---- Filing Status (ONE /Btn radio, group filing_status)
  - line: filing_status.single            # "1 SINGLE"
    field: "it140_filingStatus_radioGroup"
    type: checkbox
    on_state: /Single
    group: filing_status
  - line: filing_status.head_of_household # "2 HEAD OF HOUSEHOLD"
    field: "it140_filingStatus_radioGroup"
    type: checkbox
    on_state: /Head of Household
    group: filing_status
  - line: filing_status.married_filing_joint  # "3 MARRIED, FILING JOINT"
    field: "it140_filingStatus_radioGroup"
    type: checkbox
    on_state: /Married Filing Joint
    group: filing_status
  - line: filing_status.married_filing_separate  # "4 MARRIED, FILING SEPARATE"
    field: "it140_filingStatus_radioGroup"
    type: checkbox
    on_state: /Married filing Separate
    group: filing_status
