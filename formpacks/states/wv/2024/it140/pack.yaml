  # ============================================ page 9 -- Schedule HEPTC-1 (Homestead Excess Property Tax Credit)
  - line: heptc.amt_required                # Part I: "Check here if required to pay Federal AMT"
    field: "FAMT_1"
    type: checkbox
    on_state: /FAMT
  # Part I "Are you required to file a federal return?" — ONE question on TWO
  # independent terminal /Btn fields, BOTH with on_state /Yes, so only the
  # group id makes them exclusive (same shape as the sch_f.* pairs below;
  # ungrouped until 2026-08-24 fill_form wrote Yes AND No with zero warnings).
  # `required` is deliberately left off: HEPTC-1 is a schedule most IT-140
  # filers do not attach, so a required group would FAIL verification on every
  # legitimately HEPTC-less return (the P-008 sched_e reasoning).
  - line: heptc.required_federal_return.yes # "Are you required to file a federal return? YES"
    field: "homesteadY_checkbox"
    type: checkbox
    on_state: /Yes
    group: heptc.required_federal_return
  - line: heptc.required_federal_return.no  # "... NO"
    field: "homesteadN_checkbox"
    type: checkbox
    on_state: /Yes
    group: heptc.required_federal_return
  - line: heptc.1                           # 1 Total WV property tax paid on OWNER-OCCUPIED home during 2024
    field: "homestead01"
    type: money
  - line: heptc.2                           # 2 Allowable Senior Citizen Tax Credit from line 2 of Form SCTC-A
    field: "homestead02"
    type: money
  - line: heptc.3                           # 3 Subtract line 2 from line 1
    field: "homestead03"
    type: money
  - line: heptc.4                           # 4 Federal Adjusted Gross Income
    field: "homestead04"
    type: money
  - line: heptc.4a                          # 4a Increasing income modifications reported on line 61 of Schedule M
    field: "homestead04a"
    type: money
  - line: heptc.4b                          # 4b Federal tax-exempt interest income
    field: "homestead04b"
    type: money
  - line: heptc.4c                          # 4c Amount received in 2024 as earnings replacement insurance (Workers' Comp)
    field: "homestead04c"
    type: money
  - line: heptc.4d                          # 4d Social Security benefits (SSI/SSDI) not in Federal AGI
    field: "homestead04d"
    type: money
  - line: heptc.4e                          # 4e Income of household members filing a separate return
    field: "homestead04e"
    type: money
  - line: heptc.5                           # 5 Add lines 4a, 4b, 4c, 4d, and 4e
    field: "homestead05"
    type: money
  - line: heptc.6                           # 6 Total Gross Income (line 4 plus line 5)
    field: "homestead06"
    type: money
  - line: heptc.7                           # 7 Multiply line 6 by 4% (0.04)
    field: "homestead07"
    type: money
  # 8 "Is the amount on line 3 greater than the amount on line 7? Yes. Continue to line 9 below / No. Stop"
  # -- the 2024 blank has NO widget for either answer (2023: homestead08_checkbox), so heptc.8.* is gone.
  - line: heptc.9                           # 9 Line 3 minus line 7 or $1,000, whichever is lower -> "line 19 of IT-140"
    field: "homestead09"
    type: money

