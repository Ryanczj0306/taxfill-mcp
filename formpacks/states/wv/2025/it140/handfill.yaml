# West Virginia Form IT-140 W (2025) — Personal Income Tax Return, pages 1-2 of the 2025 booklet.
#
# PRINT-ONLY (Phase J JS5, built 2026-10-01). For TY2025 the WV Tax Division published NO fillable IT-140: its
# SharePoint library /Documents/PIT/2025 holds 21 files, every one a flat, AES-encrypted PDF with the empty user
# password and 0 widgets (crawled 2026-09-30), and the Wayback Machine never captured a fillable 2025 edition. The
# return lives inside the 56-page "2025 Personal Income Tax Forms and Instructions" booklet: PDF pages 3-4 print
# "IT-140 W / WEST VIRGINIA / PERSONAL INCOME TAX RETURN / 2025", footers -1- and -2-, scanlines *P40202501W* and
# *P40202502W*, and no REV code. source_pages: [3, 4] — fill_form stamps and writes ONLY those two pages, so the
# manifest's page 1 / page 2 are booklet pages 3 / 4. The booklet is encrypted (print yes, change no): pypdf opens it
# with the empty password (the engine's _form_pages decrypts; pypdf's extract_text also reads it without one).
#
# PROVENANCE. source_url downloaded twice on 2026-10-01 (HTTP 200, Last-Modified Mon, 22 Dec 2025 15:00:05 GMT,
# ETag {C54FC9C2-BFBB-4156-A36F-3F06C37AF328},2); both and the 2026-09-30 discovery copies digest to the pdf_sha256
# below (1,175,763 bytes, 56 pages, PDF 1.7, letter). pdfinfo: Form none; pypdf: no /AcroForm, no annotations on
# pages 3-4.
#
# NEW HAND-FILL MANIFEST, not a port of one: the model is formpacks/states/wv/2023/it140/pack.yaml (the 2023
# fillable "Forms" edition, 377 mapped widgets) — its line ids, labels and relations for the return pages are kept
# where the 2025 face still prints them. Every box here was MEASURED on this blank (never carried over, never
# estimated): the entry boxes are the white cells between the page's own ruling lines (pypdfium2 path objects: 0.5/
# 0.25/0.75 pt strokes, bounds corrected by half the stroke width) and the gray caption cells (the even-odd fill
# path's sub-rectangles), captions from the text layer. No per-character cells, combs, ovals or minus boxes exist on
# this face: every entry is a plain box and every check box a 7.2 x 12 pt rectangle marked with an X (8 pt). Text
# is left-aligned 2 pt inside the left rule; money is right-aligned, ends 2 pt before the pre-printed gray
# ".00" cell and sits on that ".00"'s own baseline (3.5 pt above the row's bottom rule, read from the text
# layer); the exemption counts start 6 pt inside their 28 pt boxes. Computes follow the face's arithmetic
# where the face's arithmetic is unconditional (4, 7, 10, 14, 21, 23, 26 — 21 and 26 stay blank when nothing
# feeds them, per the tips); lines 24 / 25 / 28 branch on balance-due vs
# overpayment and are entered. The demo and full returns were stamped with stamp_overlay, verified (every
# placement PASS, no warnings) and read on 144 dpi renders of both pages (test_it140_2025_overlay.py).
#
# LAYOUT CENSUS vs the 2023 Forms edition (layoutdiff on pages 1-2: 0% of words within 2 pt): REBUILT — page 1
# keeps the 2023 structure (same rows, the money column 439.2..547.2 as in 2023's widgets at x 441..537) but was
# re-measured box by box; page 2 is RENUMBERED: carried 0 / moved 0 / re-measured 2 pages, 114 boxes in 112 lines.
#
# FACE DELTAS vs the 2023 return pages (the complete printed-text diff, work/facediff.txt):
#   page 1: form id "IT-140 W" (2023: "IT-140 REV 06-22 F"); line 2 "line 61 of Schedule M" (2023: 59) and line 3
#     "line 52 of Schedule M" (2023: 50) — NOTE the booklet's own 2025 Schedule M (pages 5-6) still prints its totals
#     as line 50 (Total Subtractions) and line 59 (TOTAL ADDITIONS), so the face's cross-references do not match the
#     schedule it names; the Extended Due Date is ONE box (2023: MM / DD / YYYY widgets); the "TAX DEPT USE ONLY" /
#     "MUST INCLUDE WITHHOLDING FORMS" block is gone; the deceased-taxpayer footnote's typos are fixed.
#   page 2: NEW line 12 "Penalty Due from Form IT-210" with four boxes (REQUEST WAIVER / QUALIFIED FARMER / REQUEST
#     ANNUALIZED / REQUEST SHORT METHOD; 2023 had one "requesting waiver/annualized" box on line 11); 2023 lines 12-19
#     are now 13-20 (use tax, total due, withheld + NRSR, estimated, NFA-1 "MUST include", SCTC-A "MUST include",
#     HEPTC-1, Build WV); NEW line 21 "WV Property Tax Adjustment Tax Credits" with boxes A Motor Vehicle / B Disabled
#     Veteran Real Property / C Small Business Property Tax and a sum box; 2023 lines 20-26 are now 22-28 (23 adds
#     15-22; 24 balance due = 14 - 23; 25 overpayment; 26 donations A/B/C — 2023's 24A/24B/24C; 27 "next year's
#     estimated tax" — 2023 printed "2024"; 28 refund = 25 - 26 - 27); the "Preparer: check here if client is
#     requesting NOT to efile" box and the Payment Options paragraph are gone; the preparer row now prints Signature /
#     EIN / Date / Telephone and a third row Preparer's Printed Name / Preparer's Firm; mailing addresses unchanged
#     (refund P.O. Box 1071, Charleston WV 25324-1071; balance due P.O. Box 3694, Charleston WV 25336-3694).
#
# FIGURES cross-checked with knowledge/states/wv/2025.yaml: $2,000 per exemption and the $500 zero-exemption entry on
# line 6, line 8's Tax Table / Rate Schedule I / Rate Schedule II (MFS) rule, SCTC on line 18, HEPTC on line 19 and
# both mailing addresses agree. The line 1-8 Instructions are printed page 24 (PDF 26), lines 9-28 printed page 25
# (PDF 27); the notes cite those pages. WV's "TIPS ON FILING A PAPER RETURN" (printed page 16, PDF 18) shape the
# output (JS4h, P-029): the tips say NEVER USE COMMAS in dollar amounts, so `money_style: plain` prints "98500" and
# "-8300" in these plain boxes (no box here is digit cells, and a plain box takes a loss's minus sign); the tips say
# lines with no entry are left blank, "Do not fill in with zeros", so `blank_zero_computes: true` leaves a computed
# sum whose operands are all blank (line 21 with no credit, line 26 with no donation) BLANK instead of stamping "0".
# Both are quoted verbatim under printing_guidance below. A loss prints as -8300 with a regular-weight Helvetica
# minus inside the box (the tip's "dark, bold negative sign" addresses handwriting; the stamped sign is legible on
# the render — go over it in black ink if a printer renders it light). verify_overlay's independent recompute
# treats a compute left blank by the rule as 0, so a recompute of 0 agrees instead of asking for the 0 to be stamped.
#
# Lines without coordinates: none. The three signatures (yours, spouse's, preparer's) are not lines; they are signed
# by hand on the printed return.
form: "IT-140"
jurisdiction: states/wv
tax_year: 2025
render_mode: hand_fill
source_url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
pdf_sha256: "6383bf9748fde18c0469b0eb1b836f4ff6999a2c541bf4e909502a8b3132e0b0"
source_pages: [3, 4]
money_style: plain        # the booklet's tips: "NEVER USE COMMAS when filling in dollar amounts" (JS4h, P-029)
blank_zero_computes: true # "Lines where no entry is required should be left blank. Do not fill in with zeros."
# PRINTING RULES (read 2026-10-01): the booklet's "TIPS ON FILING A PAPER RETURN" (printed page 16, PDF page 18) is the
# only place the Tax Division states them; no minimum type size is published. The quotes stop before each bullet's
# full stop because the booklet's text layer encodes those periods as a control character (pypdf reads them as
# \x08), so a quote carrying the period could not be re-found verbatim.
printing_guidance:
  - quote: "Paper returns are electronically scanned"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Use BLACK INK"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Always put entries on the lines, not to the side, above or below the line"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Write your name and address clearly using BLOCK CAPITAL LETTERS as in the following example"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "NEVER USE COMMAS when filling in dollar amounts"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Lines where no entry is required should be left blank"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Do not fill in with zeros"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Round off amounts to WHOLE DOLLARS – NO CENTS"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Use a dark, bold negative sign: -8300 rather than (8300)"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  - quote: "Do not add cents in front of the preprinted zeros on entry lines"
    source: "2025 Personal Income Tax Forms and Instructions, Tips on Filing a Paper Return (printed page 16, PDF page 18)"
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
signature_note: "Sign and date the printed return on page 2 in black ink (both spouses on a joint return); a paid preparer signs the preparer row. Enclose the original W-2s, 1099s and K-1s and every schedule claimed; do not use staples. Mail a refund return to WV Tax Division, P.O. Box 1071, Charleston, WV 25324-1071 and a balance-due return to P.O. Box 3694, Charleston, WV 25336-3694 (printed on page 2)."
