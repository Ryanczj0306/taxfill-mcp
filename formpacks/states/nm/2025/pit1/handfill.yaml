# ===========================================================================
# New Mexico 2025 PIT-1 — Personal Income Tax Return.
#
# PRINT-ONLY (C3): every published PIT-1 revision (2023/2024/2025 checked) is a
# flat scannable form — NO AcroForm widgets and NO XFA (introspect finds 0
# fillable fields); this is NM TRD's deliberate posture (they steer filers to
# TAP e-file). HAND-FILL pack (render_mode: hand_fill): the engine computes
# every derivable line and emits a line->value worksheet; the filer PRINTS
# pages 57-58 of the packet at source_url and hand-writes the values.
#
# Provenance: packet downloaded from source_url (136 pages; the PIT-1 is pages
# 57-58, scanline barcodes *250180100* / *250190100*); page-57 text verified
# "2025 PIT-1 / NEW MEXICO PERSONAL INCOME TAX RETURN" before pinning
# pdf_sha256. HOST NOTE: NM TRD serves its document library from an AWS API
# Gateway host (klvg4oyd4j.execute-api.us-west-2.amazonaws.com) — the SAME
# knowingly-accepted, self-disclosed exception host documented for NM in
# knowledge/states/nm/2025.yaml and allow-listed in test_state_knowledge.py;
# realfile.tax.newmexico.gov (the .gov alias) serves only the CURRENT year.
# The library rotates the UUID path segments over time — pdf_sha256 is the
# durable identity; re-locate via tax.newmexico.gov Forms & Publications if
# the URL goes stale. SCOPE: complete — both pages (header/status/dependents,
# income lines 9-22 with 16 reserved, payments/credits 23-32, due/refund
# 33-42, Refund Express, HCA box). The Tax Rate Table lookup (line 18) stays a
# manual note.
#
# OVERLAY COORDINATES (Phase J JS4d, 2026-09-28; re-measured for 2025 by JS5 as the census above says): every line
# carries an `overlay` block, so fill_form STAMPS the worksheet onto this blank. PIT-1's boxes are drawn with
# ruling lines: each was measured from those lines and its printed line-number label (money ends 2 pt before the
# right rule; a loss keeps its minus sign left of the number, per the instructions), stamped with sentinels,
# verified, rendered and read. Your SSN is also stamped in the page-2 header. The fiscal-year dates, the separate
