# New Mexico 2023 PIT-1 — Personal Income Tax Return.
#
# PRINT-ONLY (C3): every published PIT-1 revision (2023/2024/2025 checked) is a
# flat scannable form — NO AcroForm widgets and NO XFA (introspect finds 0
# fillable fields); this is NM TRD's deliberate posture (they steer filers to
# TAP e-file). HAND-FILL pack (render_mode: hand_fill): the engine computes
# every derivable line and emits a line->value worksheet; the filer PRINTS the
# blank at source_url and hand-writes the values.
#
# Provenance: blank downloaded from source_url (2 pages, scanline barcodes
# *230180200* / *230190200*); page-1 text verified "2023 PIT-1 / NEW MEXICO
# PERSONAL INCOME TAX RETURN" before pinning pdf_sha256. HOST NOTE: NM TRD
# serves its document library from an AWS API Gateway host
# (klvg4oyd4j.execute-api.us-west-2.amazonaws.com) — the SAME knowingly-
# accepted, self-disclosed exception host documented for NM in
# knowledge/states/nm/2023.yaml and allow-listed in test_state_knowledge.py;
# realfile.tax.newmexico.gov (the .gov alias) serves only the CURRENT year.
# The library rotates the UUID path segments over time — pdf_sha256 is the
# durable identity; re-locate via tax.newmexico.gov Forms & Publications if
# the URL goes stale. SCOPE: complete — both pages (header/status/dependents,
# income lines 9-22, payments/credits 23-32, due/refund 33-42, Refund
# Express, HSD box). The Tax Rate Table lookup (line 18) stays a manual note.
#
# OVERLAY COORDINATES (Phase J JS4d, 2026-09-28): every line carries an `overlay` block, so
# fill_form STAMPS the worksheet onto this blank. PIT-1's boxes are drawn with ruling lines: each
# was measured from those lines and its printed line-number label (money ends 2 pt before the
# right rule; a loss keeps its minus sign left of the number, per the instructions), stamped
# with sentinels, verified, rendered and read. Your SSN is also stamped in the page-2 header.
# The read found 20 printed entries the manifest never listed — the fiscal-year dates, the
# separate State / ZIP and foreign-province cells (3c / 3d are now City / Country only), the
# signature dates, both driver's-license / state-ID number, state and expiration blocks, and
# the paid-preparer block. They are all lines now; signatures stay hand-written.
# fetch_blank accepts this host only against the pdf_sha256 pin (fetch.PINNED_ONLY_BLANK_HOSTS:
# tax.newmexico.gov/forms-publications/ loads its forms table from it).
