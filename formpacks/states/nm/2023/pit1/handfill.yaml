    url: https://klvg4oyd4j.execute-api.us-west-2.amazonaws.com/prod/PublicFiles/34821a9573ca43e7b06dfad20f5183fd/f1146c5b-ac60-4015-bea4-11b1ea86449d/2023pit-1-ins.pdf
  - quote: "Do not use dollar signs ($), decimal points (.), or any punctuation marks or symbols other than a comma (,)."
