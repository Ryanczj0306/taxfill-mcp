# PRINTING RULES (Phase J JS4b, read 2026-09-28): the 2023 PIT-1 instructions. A computer-generated form must meet
# "the printing and legibility requirements of the software company" — for an overlay stamp that is this
# engine's own legibility bar (render and read every stamped page). The only punctuation allowed in an entry is
# a comma, which is how money stamps render. No minimum type size is published.
