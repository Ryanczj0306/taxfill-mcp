# Schedule CA (540), 2025 — California Adjustments — Residents.
#
# Authored via the taxfill pipeline on the 2023 base: `taxfill introspect`
# (sentinel sweep — every widget rendered with its own field name) →
# vision-map workflow (every page + zoomed crops read to place each field on
# its printed line/column) → this map; the 2025 bindings were re-derived by
# position and printed label and confirmed on sentinel renders (port banner).
#
# Layout. The form is a flat AcroForm (acroform_root empty; the 2025 field
# names are "540ca_form - NNNN", the 2023 sentinel id behind a fixed prefix,
# with a few suffixed/renumbered rows listed in the port banner). Part I
# (Sections A/B income, Section C adjustments) is a three-column grid:
#   A = Federal Amounts (taxable amounts from your federal tax return)
#   B = Subtractions (See instructions)
#   C = Additions (See instructions)
# Each income/adjustment line therefore has up to three money boxes; many lines
# grey out one or two columns (no widget exists for a greyed cell — those line
# keys are simply absent). Column-bearing keys carry an _A / _B / _C suffix.
# Single-column computation lines (Part I "primary amount" boxes like 2a/3a and
# the entire Part II lower block lines 18-30) have no suffix.
#
# 253 of the blank's 255 widgets are mapped. The two left out are the ReadOnly
# boxes the FTB placed on the two printed "Reserved for future use" rows
# (Section C line 22, Part II line 8d) — see the port banner. There are NO
# pre-printed statutory constants inside any widget (every mapped box is
# taxpayer-entered). The 240 dollar boxes carrying /MaxLen 12 are mapped as
# `money`; the 12 other text widgets are genuine text (name, two SSN/ITIN
# boxes, last name, two divorce-date boxes, and six "list type and amount /
# specify / enter type" description lines); 1 checkbox (Part II "did NOT
# itemize for federal but will for CA").
#
# Relations: Schedule CA's column math is conditional/cross-column (e.g. col A
# less col B plus col C, with multiple greyed operands) and several addends are
# unmapped greyed cells, so per the conservative house style NO relations are
# declared. cross_form is likewise omitted: the printed totals feed Form 540
# lines 14/16/18 but those are Form 540's input lines, not equalities asserted
# on this schedule (Part II lines 2 and 23 cite "federal Form 1040 or 1040-SR,
# line 11b" — the 2025 Form 1040's restatement of AGI, 11a being the defining
# line; neither is declared, as in 2023).
