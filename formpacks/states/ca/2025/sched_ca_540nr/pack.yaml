  - line: name
    field: '540NR CA - 1000'
    type: text
  - line: identifying_number
    field: '540NR CA - 1001'
    type: text
    maxlen: 11

  # ============================ Part I — Residency Information (Side 1)
  # Line 1 — My California (CA) Residency (Check one): two RADIO fields on the
  # 2025 blank ("1002 RB" = a Myself, "1003 RB" = b Spouse; three kids each,
  # /Ff 49152 = NoToggleToOff|Radio), replacing the six separate checkboxes
  # of 2023. Each kid's on_state is dumped from THIS blank's /AP /N.
  - line: 1a_myself_nonresident_cb      # 1a Myself — Nonresident
    field: '540NR CA - 1002 RB'
    type: checkbox
    on_state: '/During 2025: My California (CA) Residency (Check one). Myself. Nonresident'
    group: 'residency_myself'
  - line: 1a_myself_partyear_cb         # 1a Myself — Part-Year Resident
    field: '540NR CA - 1002 RB'
