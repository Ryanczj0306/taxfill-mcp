# URL. https://www.ftb.ca.gov/forms/2025/2025-540nr-ca.pdf. Digest
# b9a0db9f466b80907a9082bc2cae6fde78f60ba065f1d2a782889fa1198b1bad — two
# separate curl downloads on 2026-10-01 and the triage cache copy all agree
# (218,902 bytes, %PDF-1.7, AcroForm, 5 pages, Producer "Adobe PDF Library
# 17.0", ModDate 2026-02-11).
#
# PRINTED IDENTITY. Side 1 prints "TAXABLE YEAR 2025", "California Adjustments
# — Nonresidents or Part-Year Residents", "SCHEDULE CA (540NR)" and the stamp
# "7741253 Schedule CA (540NR) 2025 Side 1"; Sides 2-5 print 7742253 … 7745253
# with "Schedule CA (540NR) 2025 Side N". Part I reads "for taxable year 2025"
# and line 8 "Before 2025:". printed_year_verified = 2025.
#
# ACROFORM TOPOLOGY against the 2023 blank (411 widgets, flat ids 1000-5030).
# The 2025 blank has 421 widgets = 414 /Tx + 7 /Btn, every name prefixed
# "540NR CA - " (e.g. "540NR CA - 1026"), so all 411 base names are GONE by
# name. The ids were also RENUMBERED, not just prefixed: the six residency
# checkboxes "1002 CB".."1007 CB" became TWO radio fields "1002 RB" (a Myself:
# three kids, on_states "/During 2025: My California (CA) Residency (Check
# one). Myself. Nonresident", "/My California Residency. Myself. Part-Year
# Resident.", "/My California Residency. Myself. Resident.") and "1003 RB" (b
# Spouse: the three Spouse states), /Ff 49152, so every later Side-1 id is the
# base id minus 4 (base 1008 res2a_you_state -> 1004; base 1030 line 1a col A
# -> 1026; base 1109 line 7 col E -> 1105, now line 7a col E...). Sides 2-5
# were renumbered around the new rows (base 2001 = line 1 col A -> 2001 is now
# line 3 col A). Every binding below was therefore placed by widget POSITION
# plus the printed row label on this blank's own text layer, and then
# confirmed on the sentinel renders (scripts/audit_pack.py) of all five
# pages — never by name.
#   * Ten widgets are NEW. Eight are mapped: 1060B (1h "Enter type & amount"
#     description, A1h_desc), 1112b (Section B 2b "Date of original divorce
#     or separation agreement", B2b_date), 3049B (Section C 19c "Date of
#     original divorce or separation agreement", C19c_date) and 2088-2092
#     (Section B line 8v "Digital assets received as ordinary income not
#     reported elsewhere", columns A-E, B8v_A..E).
#     The two date boxes are PLAIN text boxes on a printed underline — no
#     cells, no Comb bit (/Ff 12582912), /MaxLen 7, 70.2 pt (1112b) and
#     88.2 pt (3049B) wide — and each widget's own tooltip reads "Enter date
#     as 2 digit month and 4 digit year", i.e. MM/YYYY (7 characters). The
#     filler REFUSES a longer value, so a Part I style MM/DD/YYYY is rejected
#     rather than truncated.
#   * Two are deliberately UNMAPPED, the only ReadOnly widgets on the blank
#     (/Ff 12582913 = ReadOnly|DoNotSpellCheck|DoNotScroll): 3059 sits on
#     Section C "22 Reserved for future use" (column A only; the printed
#     line-26 sum is the RANGE "Add line 11 through line 23 and line 25",
#     which encloses line 22, but the ReadOnly box stays blank and so adds
#     nothing, and no relation reads it) and 4056 on Part III "8d Reserved
#     for future use" (column A only; printed 8e is "Add line 8a through
#     line 8c", which does not name 8d). The 2023 blank had NO widget on
#     either line, so no key existed and none is added — P-007 class 3, the
#     excluding treatment; fill_form raises on "C22_A" / "III8d_A".
#   * /MaxLen: every grid money box now carries /MaxLen 11 (2023: 12 — one
#     fewer character, the pack declares no money maxlen so verify's hard
#     MaxLen check follows the widget); the five primary boxes 2a/3a/4a/5a/6a
#     (1074/1080/1086/1092/1098) grew 10 -> 12 and Part III lines 1-3
#     (4030-4032) stay 12; the Part I date
#     boxes grew from /MaxLen 8 to 10 (1009/1011/1013/1015 and 1022-1025),
#     because the printed template is now "_ _/_ _/_ _ _ _" with the two
#     slashes INSIDE the 10-cell comb, so a value keeps its slashes (maxlen 10,
#     no `comb` flag — the filler's comb mode is digits-only and would land the
#     digits one cell off the template); the SSN box 1001 gained /MaxLen 11
#     (was none; the pack already budgeted 11). /Ff: the Part I entry cells,
#     the 19b SSN segments and the Part IV percentage cells carry the Comb bit
#     (29360128) as in 2023; every other text widget is 12582912. /DA: the
#     Section B parenthesised cells 2023/2024 (8a), 2079-2081 (8s) and 2035
#     (8d col C) are /Helv 7, 2034 (8d col A) /Helv 6.5, and 4056 /Helv 10;
#     all other grid cells /Helv 8 (2023: the grid cells were /Helv 0,
#     auto-size — 344 of the 411 base widgets).
#   * NOT ENTIRELY FLAT. 62 Side-2 money fields (2001-2057 and 2068-2072) are
#     one-kid PARENT fields: the name, /MaxLen 11 and /Ff sit on the parent,
#     the widget is its only kid. For 2001-2057 the parent says /Q 0 and
#     /DA "/Helv 10" while the kid widget says /Q 2 (right) and its own /DA
#     (/Helv 8 x53, /Helv 7 x3, /Helv 6.5 x1); 2068-2072 keep /DA /Helv 8
#     and /Q 2 on the parent only. A dump must read the WIDGET-level /DA and
#     /Q (the figures above). The 2023 blank had no kid text widgets. The
#     bindings are unaffected (the filler resolves the parent name and the
#     sentinel audit wrote all 62), but a viewer that follows the parent's
#     /Q 0 and /Helv 10 (poppler does) draws the value left-aligned at 10 pt,
#     so an 11-digit amount clips in those boxes; the pdfium render
#     right-aligns them at the kid's size.
#
# FACE DELTAS vs 2023 (a diff of the printed text of all five sides; read
# on this blank).
#   * Section A line 7 is now printed "7 a Capital gain or (loss) ... 7a", so
#     the keys are A7a_A..E (2023: A7_A..E; grep shows no other referrer).
#   * Section B lines 1 ("Taxable refunds, credits, or offsets ...") and 2a
#     ("Alimony received") moved from the top of Side 2 to the foot of Side 1
#     (widgets 1106/1107 and 1108/1110/1111/1112), with the new 2b date box.
#   * Section B 8v (digital assets) and Section C 19c (date) are new rows;
#     line 10 now reads "Add Section A, line 1z through line 7a, ...".
#   * 1f cites "federal Form 8839, line 31" (2023: line 29); 1h reads "Other
#     earned income. See instr. Enter type & amount." with its own text box.
#   * Part III line 2 and line 23 cite "federal Form 1040 or 1040-SR, line
#     11b" (2023: line 11 — the 2025 Form 1040 restates AGI on 11b).
#   * Part III 5e: "the smaller of line 5d or $40,000 ($20,000 if married
#     filing separately)" (2023: $10,000 / $5,000).
#   * Part III line 29 thresholds: $252,203 single/MFS, $378,310 HoH,
#     $504,411 MFJ/QSS (2023: $237,035 / $355,558 / $474,075); line 30
#     standard deduction $5,706 / $11,412 (2023: $5,363 / $10,726). All five
#     figures agree with knowledge/states/ca/2025.yaml.
#   * Years: "taxable year 2025", "During 2025:", "Before 2025:".
#   * Printed-word shift: Side 1 median 0; Side 2 (-1.9, +6.9) pt and Side 3
#     (0, -3.8) pt from the moved/added rows; Sides 4-5 unchanged.
#
# UNRESOLVED. None. relations and cross_form stay empty for the reasons the
# 2023 pack states (conditional cross-column math with greyed operands; Part
# III lines 2/23 restate federal AGI but the schedule asserts no equality).
# ===========================================================================
# Schedule CA (540NR), 2025 — California Adjustments — Nonresidents or
# Part-Year Residents.
#
# Layout. acroform_root empty; field names are the prefixed ids
# "540NR CA - 1000" .. "540NR CA - 5030" (all top-level fields; the 62
# Side-2 one-kid parents above are addressed by the parent name), plus
# the "B" suffixed boxes 1060B/1112b/3049B and the "RB"/"CB" button
# fields). Side 1 carries the
# name/SSN header and Part I Residency Information (two-letter state codes,
# mm/dd/yyyy move dates, day counts, Y/N, period ranges — for Yourself and
# Spouse/RDP), then Part II Section A (Income) and the first two lines of
# Section B. Part II Income Adjustment Schedule (Sections A/B income, Section
# C adjustments) is a FIVE-column grid:
#   A = Federal Amounts (taxable amounts from your federal tax return)
#   B = Subtractions (difference between CA & federal law)
#   C = Additions (difference between CA & federal law)
#   D = Total Amounts Using CA Law As If You Were a CA Resident
#       (subtract col. B from col. A; add col. C to the result)
#   E = CA Amounts (income earned or received as a CA resident and income
#       earned or received from CA sources as a nonresident)
# Each income/adjustment line therefore has up to five money boxes; many lines
# grey out one or more columns (no widget exists for a greyed cell — those
# column keys are simply absent). Column-bearing keys carry an _A/_B/_C/_D/_E
# suffix. Lines 2a/3a/4a/5a/6a carry a single "primary" federal-amount box to
# the left of the grid (suffix _a). Part III (Adjustments to Federal Itemized
# Deductions) reverts to a THREE-column grid (A/B/C only); its single-box
# computation lines (1-3, 18-30) have no suffix, while 5b-5d carry only a
# column-A box and keep the _A suffix (III5b_A..III5d_A). Part IV (California
# Taxable Income) is single-box computation lines 1-5.
#
# 419 of the 421 widgets are mapped (412 text/money widgets + the 7 button
# widgets as 7 checkbox lines); the two unmapped ones are the reserved lines
# above. Every mapped box is taxpayer-entered: there are NO pre-printed
# statutory constants with a widget on this form (the Side 5 line 29/30
# amounts and the 7.5% / 2% factors are printed text, not fillable). The 22
# residency text boxes (1004-1025) and the SSN/last-name/date boxes
# (3046-3049, 3049B) on line 19b/19c are genuine text; the Side-1 residency
# status is two radio groups (residency_myself / residency_spouse) and the
# Side-4 "did NOT itemize for federal" box (4029 CB) a checkbox (on_state
# /Yes); six description lines (1060B, 2093, 4008, 4043, 5013, 5020) are text.
# All remaining dollar boxes are mapped as money. The line 19b recipient SSN
# is split into three boxes (3046 = 3 digits, 3047 = 2, 3048 = 4); the Part IV
# line 3 deduction percentage is split into an integer box (5027, 1 digit) and
# a four-place decimal box (5028).
#
# Relations: Schedule CA's column math is conditional/cross-column (col D =
# col A less col B plus col C, with multiple greyed operands, and col E depends
# on residency apportionment), and several addends are unmapped greyed cells, so
# per the conservative house style NO relations are declared. cross_form is
# likewise omitted: the Side-5 Part IV line 5 total feeds Form 540NR line 35,
# but that is Form 540NR's input line, not an equality asserted on this schedule.
form: "Schedule CA (540NR)"
jurisdiction: states/ca
tax_year: 2025
source_url: https://www.ftb.ca.gov/forms/2025/2025-540nr-ca.pdf
pdf_sha256: b9a0db9f466b80907a9082bc2cae6fde78f60ba065f1d2a782889fa1198b1bad
acroform_root: ''
