# CROSS-FORM. The face cites "line 11b" of the 2025 Form 1040; that pack maps
# 11b as "Amount from line 11a (adjusted gross income)" with "11b == 11a", and
# CONVENTIONS.md requires the DEFINING line, so the leg is `13 == f1040.11a`.
