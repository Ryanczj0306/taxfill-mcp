# Phase J JS5; triaged RE-MAP — every one of the 167 field names the 2023 pack
# binds is gone from the 2025 blank, so this pack was rebuilt by POSITION and
# printed label, and every binding confirmed on sentinel renders.
#
# URL. https://www.ftb.ca.gov/forms/2025/2025-540.pdf (the FTB's own host). Digest
# 3be81dcc5d2b… — two separate curl downloads on 2026-10-01 (04:49:15Z and
# 04:49:23Z, 235,436 bytes each) and the triage cache copy all agree. %PDF-1.7,
# an AcroForm with no XFA; pdfinfo Title "2025 Form 540 California Resident
# Income Tax Return", CreationDate 2025-12-10, ModDate 2026-01-06.
#
# PRINTED IDENTITY. Side 1 prints "TAXABLE YEAR 2025 / California Resident
# Income Tax Return / FORM 540"; the footers read "333 3101253 Form 540 2025
# Side 1" through "Side 6 Form 540 2025 333 3106253" (2023: 3101233..3106233).
# The fiscal-year line prints "year 2026." printed_year_verified = 2025. Six
# sides, as in 2023.
#
# AcroForm topology against the 2023 blank (a widget census). 184 widgets on
# 169 top-level fields (2023: 180 widgets); per side 50 / 43 / 28 / 24 / 24 / 15.
# No widget is ReadOnly or comb; /DA is Helv 10 on every text widget except
# 540_form_1033 (the principal-residence "State" box, Helv 8 — the 2023 blank
# had no Helv 8 widget) and ZaDb 8 on the buttons. The FTB prefixed every name with
# "540_form_" AND renumbered after each insertion or removal, so a name is not
# a binding: old "1047" (the line 8 count box) sits where "540_form_1043" now
# is, while "540_form_1047" does not exist.
# The 163 lines carried over from 2023 were each placed on the 2025 widget
# occupying the 2023 widget's position. Measured as the largest displacement
# of any of the four rect edges: 133 of the 163 lie within
# 3 pt, 16 between 3 and 5 pt (the 2025 checkbox squares grew from 12.8 to
# 16.6 pt around the same centre, every centre within 2 pt, and a few text
# boxes shifted 3 pt), and 14 moved more than 5 pt because the face changed —
# 445 (4024 -> 4020, 72.2 pt);
# third_party_designee.allow_no (6008 RB -> 6008 RB, 39.1 pt);
# paid_preparer.firm_name (6004 -> 6004, 37.1 pt); paid_preparer.ptin (6005
# -> 6005, 37.1 pt); paid_preparer.firm_address (6006 -> 6006, 37.1 pt);
# paid_preparer.firm_fein (6007 -> 6007, 37.1 pt); third_party_designee.name
# (6009 -> 6009, 36.6 pt); third_party_designee.phone (6010 -> 6010, 36.4
# pt); 438 (4020 -> 4018, 24.1 pt); 439 (4021 -> 4019, 24.1 pt); 413 (4014
# -> 4013, 24.0 pt); 422 (4015 -> 4014, 24.0 pt); 423 (4016 -> 4015, 24.0
# pt); 424 (4017 -> 4016, 24.0 pt); 0 changed side.
# What the FTB re-authored:
#   * FILING STATUS is now ONE radio field "540_form_1036 RB" with five kids
#     whose /AP /N names are the printed captions ("/1 . Single.", "/2 . Married/
#     R D P filing jointly (...)", "/3 . Married or R D P filing separately.",
#     "/4 . Head of household (...)", "/5 . Qualifying surviving spouse or R D P .")
#     — 2023 had five separate checkboxes 1036-1041 CB. The five lines keep
#     group filing_status; the "different from federal" box stays its own
#     field (540_form_1035 CB). The three line-3/line-5 text boxes renumbered
#     (1039 -> 540_form_1037, 1042 -> 540_form_1038, 1043 -> 540_form_1039), the
#     line 6 box 1044 CB -> 540_form_1040 CB, and the six exemption boxes
#     1045-1050 -> 540_form_1041-1046.
#   * DIRECT DEPOSIT account type: the 2023 radios 5010 RB / 5014 RB are now two
#     separate checkboxes per account, 540_form_5009A/5009B CB and
#     540_form_5013A/5013B CB ("Checking" upper, "Savings" lower — pdftotext
#     puts "Checking" at y 469-481 and "Savings" at y 445-457 beside 5009A/B).
#     The 2023 key 116.account_type (= the Savings kid /1) is replaced by
#     116.account_type.checking / .savings sharing group 116.account_type
#     (same for 117); nothing outside the CA packs referenced the old key.
#   * LINE 113's two boxes are renamed 540_form_5004A/5004B CB (2023 5004/5005
#     CB), and the Side 5 money lines shifted one id (113 -> 5005 .. 115 -> 5007,
#     116 -> 5011, 117 -> 5015); line 111 is 540_form_5002 (2023 4027).
#   * CONTRIBUTIONS (Side 4): codes 410 (Sea Otter), 425 (Keep Arts in Schools),
#     440 (Rape Kit Backlog) and 444 (Suicide Prevention) are GONE from the face;
#     431 (Prevention of Animal Homelessness and Cruelty), 447 (ALS Research
#     Network), 448 (Pediatric Cancer Research) and 449 (Parkinson's Disease
#     Research) are NEW, all four MAPPED. Line 110 now reads "code 400 through
#     code 449" and its relation sums the 18 printed codes. The widget ids
#     after 408 all shifted (2023 4014..4026 -> 540_form_4013..4024).
#   * NEW Side 5 "Organ Donor Election" boxes 540_form_5018 CB (on_state
#     "/Primary taxpayer") and 540_form_5019 CB (on_state "/ Spouse/R D P (if
#     joint tax return)" — the leading space is in the blank) — MAPPED as
#     organ_donor.primary_taxpayer / organ_donor.spouse (independent: one box
#     per person; adjudicated in SEPARATE_OPTION_SETS_ADJUDICATED).
#   * NEW Side 6 row "Print paid preparer's name" / "Paid preparer's phone
#     number" (540_form_6003B / 6003C, /MaxLen 10 on the phone) — MAPPED as
#     paid_preparer.name / paid_preparer.phone. The firm rows moved down 36 pt.
#   * The voter box is 540_form_5016 CB (2023 5017 CB); the health-coverage
#     radio 540_form_5017 RB (2023 5018 RB); the designee radio keeps 6008 RB.
#     This port binds BOTH kids of each Yes/No radio and of the use-tax radio
#     (health_care_coverage.yes/.no, third_party_designee.allow_yes/.allow_no,
#     91.no_use_tax_owed / 91.paid_directly_cdtfa): on every one the box sits
#     LEFT of its caption and /0 is the left (Yes / "No use tax is owed") kid.
#   * /MaxLen: the SSN boxes (1007, 1012, 2002, 2005/2009/2013) now carry 11
#     (2023: none on 1007/1012/2002, 10 on the three dependent boxes); the
#     account numbers 17 -> 19; every money box 12; the three "Apt. no/ste. no."
#     and "PMB" boxes (1016, 1017, 1031) LOST their /MaxLen (5 / 6 / 5), so
#     each carries a measured budget of 12: on the render (a probe fill,
#     scale 3) 12 digits fit all three boxes (72.5 / 73.0 / 70.7 pt at Helv 10;
#     Helvetica digits advance 0.556 em, 66.7 pt), 13 fill 1016/1017 edge to
#     edge and clip in 1031, 14 clip in all three — and neither the filler nor
#     verify's clipping scan warns, since verify budgets 0.5 em per glyph.
# All 184 widgets are bound (176 lines; name.full and
# identifying_number.page6 are one field each with a widget on Sides 2-6).
# NEW lines vs 2023: 91.no_use_tax_owed, 431, 447, 448, 449, 116.account_type.checking, 117.account_type.checking, health_care_coverage.yes, organ_donor.primary_taxpayer, organ_donor.spouse, paid_preparer.name, paid_preparer.phone, third_party_designee.allow_yes.
# DROPPED lines vs 2023: 410, 425, 440, 444 (their rows are gone from the face).
#
# FACE DELTAS vs 2023 (the complete printed-text diff). The exemption credits "7/8/9 X $153"
# (2023 $144) and "10 X $475" ($446); the standard deduction "$5,706" /
# "$11,412" ($5,363 / $10,726); line 32's AGI threshold "$252,203" ($237,035);
# line 13 now reads "federal adjusted gross income (AGI) from federal Form 1040
# or 1040-SR, line 11b" (2023: line 11); line 62 "Behavioral Health Services
# Tax" (2023: Mental Health Services Tax); line 74 is "Refundable Program 4.0
# California Motion Picture and Television Production Credit" (2023: Excess SDI
# (or VPDI) withheld — the same line number now carries a different amount);
# the years (line 72 "2025 California estimated tax", line 98 "applied to your
# 2026 estimated tax"); the Side 4 contribution rows and the Side 5 Organ Donor
# block and Side 6 preparer row described above. Line numbering 1-117 and the
# page layout are otherwise unchanged (layoutdiff: median shift 0 on Sides 1-5).
# knowledge/states/ca/2025.yaml carries the same $153 / $475, $5,706 / $11,412
# and $252,203 — no mismatch.
