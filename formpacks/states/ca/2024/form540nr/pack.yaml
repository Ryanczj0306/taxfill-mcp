relations:
  - "11 == 7 + 8 + 9 + 10"  # 11 "Exemption amount: Add line 7 through line 10"
  - "15 == 13 - 14"  # 15 "Subtract line 14 from line 13. If less than zero, enter the result in parentheses."
  - "17 == 15 + 16"  # 17 "Adjusted gross income from all sources. Combine line 15 and line 16"
  - "19 == max(0, 17 - 18)"  # 19 "Subtract line 18 from line 17. This is your total taxable income. If less than zero, enter -0-"
  - "40 == max(0, 37 - 39)"  # 40 "CA Regular Tax Before Credits. Subtract line 39 from line 37. If less than zero, enter -0-"
  - "42 == 40 + 41"  # 42 "Add line 40 and line 41"
  - "62 == 50 + 55 + 58 + 59 + 60 + 61"  # 62 "Add line 50 and line 55 through line 61. These are your total credits" — 55, 58, 59, 60, 61 are the printed lines in that range
  - "63 == max(0, 42 - 62)"  # 63 "Subtract line 62 from line 42. If less than zero, enter -0-"
  - "74 == 63 + 71 + 72 + 73"  # 74 "Add line 63, line 71, line 72, and line 73. This is your total tax"
  - "88 == 81 + 82 + 83 + 85 + 86 + 87"  # 88 "Add line 81 through line 87. These are your total payments" — 84 prints "Reserved for future use" and is not mapped
  - "92 == max(0, 88 - 91)"  # 92 "If line 88 is more than line 91, subtract line 91 from line 88"
  - "93 == max(0, 91 - 88)"  # 93 "If line 91 is more than line 88, subtract line 88 from line 91"
  - "101 == max(0, 92 - 74)"  # 101 "Overpaid tax. If line 92 is more than line 74, subtract line 74 from line 92"
  - "103 == 101 - 102"  # 103 "Overpaid tax available this year. Subtract line 102 from line 101"
  - "104 == max(0, 74 - 92)"  # 104 "Tax due. If line 92 is less than line 74, subtract line 92 from line 74"
  - "120 == 400 + 401 + 403 + 405 + 406 + 407 + 408 + 410 + 413 + 422 + 423 + 424 + 425 + 431 + 438 + 439 + 445 + 447"  # 120 "Add amounts in code 400 through code 447. This is your total contribution" — the 18 printed codes
  - "121 == 93 + 104 + 120"  # 121 "AMOUNT YOU OWE. Add line 93, line 104, and line 120"
  - "125 == 103 - 120"  # 125 "REFUND OR NO AMOUNT DUE. Subtract line 120 from line 103"
cross_form:
  - "13 == f1040.11"  # 13 "Enter federal AGI from federal Form 1040, 1040-SR, or 1040-NR, line 11" — the 2024 f1040 prints AGI on line 11
  - "13 == f1040nr.11"  # the same line for a nonresident-alien filer's 1040-NR — the 2024 f1040nr prints AGI on line 11
identity_fields:
  - name.first
  - name.last
  - identifying_number
signature:
  page: 6  # Side 6 "Your signature / Date / Spouse's/RDP's signature" block
mailing: null  # CA where-to-file lives in knowledge/states/ca (the face prints both PO boxes on Side 5)
