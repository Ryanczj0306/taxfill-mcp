#
# URL. https://www.ftb.ca.gov/forms/2024/2024-540nr-ca.pdf. Digest
# 42d85891e6ee6159e6daa93383a05b00ed814f03c66f3bb0e101b2954de88d7a — two
# separate curl downloads on 2026-10-02 and a third copy all agree
# (212,179 bytes, %PDF-1.7, AcroForm, 5 pages, Producer "Adobe PDF Library
# 15.0", CreationDate 2025-01-08, ModDate 2025-01-27).
#
# PRINTED IDENTITY. Side 1 prints "TAXABLE YEAR 2024", "California Adjustments
# — Nonresidents or Part-Year Residents", "SCHEDULE CA (540NR)" and the stamp
# "7741243 Schedule CA (540NR) 2024 Side 1"; Sides 2-5 print 7742243 … 7745243
# with "Schedule CA (540NR) 2024 Side N". Part I reads "for taxable year 2024",
# "During 2024:" and line 8 "Before 2024:". printed_year_verified = 2024.
#
# ACROFORM TOPOLOGY against the 2023 blank (411 widgets = 404 /Tx + 7 /Btn,
# flat ids 1000-5030). The 2024 blank has 418 widgets = 411 /Tx + 7 /Btn in
# 414 fields, every name prefixed "540NR CA - " (e.g. "540NR CA - 1026"), so
# all 411 base names are GONE by name. The ids were also RENUMBERED, not just
# prefixed: the six residency checkboxes "1002 CB".."1007 CB" became TWO radio
# fields "1002 RB" (a Myself) and "1003 RB" (b Spouse), three kids each, /Ff
# 49152, on_states /0 /1 /2 left to right (Nonresident, Part-Year Resident,
# Resident), so every later Side-1 id is the base id minus 4 (base 1008
# res2a_you_state -> 1004; base 1030 line 1a col A -> 1026; base 1105 line 7
# col A -> 1101). Sides 2-5 were renumbered around the moved and added rows
# (base 2001 = Section B line 1 col A -> 1106 on Side 1, while 2001 is now
# line 3 col A; the bare id 4029 was Part III line 1 in 2023 and is now the
# "4029 CB" checkbox, line 1 being 4030). Every binding below was therefore
# placed by widget POSITION plus the printed row label on this blank's own
# text layer and the column x of each grid cell, and then confirmed on the
# sentinel renders of all five pages — never by name.
#   * Every one of the 411 base line keys has a 2024 widget; none is retired.
#   * Seven widgets are NEW. Five are mapped: 2088-2092 (Section B line 8v
#     "Digital assets received as ordinary income not reported elsewhere",
#     columns A-E, B8v_A..E — a row the 2023 face did not print).
#   * Two are deliberately UNMAPPED, the only ReadOnly widgets on the blank
#     (/Ff 12582913 = ReadOnly|DoNotSpellCheck|DoNotScroll): 3059 sits on
#     Section C "22 Reserved for future use" (column A; the row prints grey;
#     the printed line-26 sum is the RANGE "Add line 11 through line 23 and
#     line 25", which encloses 22, but the ReadOnly box stays blank and no
#     relation reads it) and 4056 on Part III "8d Reserved for future use"
#     (column A; printed 8e is "Add line 8a through line 8c", which does not
#     name 8d). The 2023 blank had NO widget on either line (none of its 411
#     widgets carries the ReadOnly bit), so no key existed and none is added
#     — P-007 class 3, the excluding treatment; fill_form raises on "C22_A" /
#     "III8d_A". P-007 accepts either treatment for a class-3 line; exclusion
#     is chosen for 22 although line 26's RANGE spans it because a range sum
#     tolerates the gap (the unmapped cell reads as zero), the precedent the
#     repo pins for Schedule 3 line 6e ("Add lines 6a through 6z"), whereas
#     the keep treatment is for a line a printed sum ENUMERATES by number
#     (Schedule 2 2025 line 10). It also keeps the three Schedule CA (540NR)
#     years on one answer: the 2023 pack has no key here and the 2025 pack
#     excludes the same two lines.
#   * Section B line 2a (Alimony received) has four boxes, column B greyed:
#     1108 = A, 1109 = C, 1110 = D, 1111 = E.
#   * /MaxLen: every grid money box now carries /MaxLen 11 (2023: 12 — one
#     fewer character; the pack declares no money maxlen, so verify's hard
#     MaxLen check follows the widget), as do Part III lines 1-3 (4030-4032,
#     2023: 12); the five primary boxes 2a/3a/4a/5a/6a (1074/1080/1086/1092/
#     1098) stay 10; the SSN box 1001 gained /MaxLen 11 (was none; the pack
#     already budgeted 11); the Part I date boxes stay /MaxLen 8.
#   * /Ff: the Part I entry cells (1004-1025), the 19b SSN segments
#     (3046-3048) and the Part IV percentage cells (5027/5028) carry the Comb
#     bit (29360128), as their 2023 counterparts did; the 4029 CB checkbox is
#     /Ff 0; every other text widget is 12582912. The 2023 pack declared
#     NONE of these as comb; this port flags `comb: true` on the Part I date
#     cells below AND on res6_you_days / res6_spouse_days (1018/1019),
#     C19b_ssn1-3 (3046-3048) and IV3_int / IV3_dec (5027/5028), so fill_form
#     now refuses anything but digits on those seven keys (maxlen = /MaxLen,
#     unchanged). The remaining Comb-bit cells (two-letter state codes, Y/N)
#     stay plain text so a letter value is accepted.
#   * Part I move dates and period ranges (1009/1011/1013/1015, 1022-1025):
#     each is an 8-cell comb with the two slashes PRINTED between the cells
#     ("_ _/_ _/_ _ _ _"), so they are now `comb: true` with maxlen 8 — the
#     value is the eight digits MMDDYYYY. (The 2023 pack bound the same 8-cell
#     combs as plain text with maxlen 8, so a slashed date never fit them.)
#     fill_form now refuses "03/15/2024" on these lines with a prescriptive
#     digits-only message. The widget splits its 70.8 pt into eight EQUAL
#     8.85 pt cells, but the printed template leaves room for the slashes,
#     so the second printed slash falls inside cell 5 (1009: "/" x 426.8-
#     429.3 in cell 425.9-434.7; 1022: x 403.4-406.0 in cell 403.1-411.9):
#     the first year digit touches or overprints that slash by about 1 pt.
#     Every digit still sits over its own printed underscore and the value
#     reads 03/15/2024 on the render. Blank geometry; a pack cannot move it.
#   * /DA: every text widget is /Helv 8 except the name and SSN boxes
#     (1000/1001, /Helv 10); the buttons are /ZaDb 8 (2023: 344 of the 411
#     widgets were /Helv 0, auto-size).
#   * Flat: no text field has kid widgets; acroform_root stays empty.
#
# FACE DELTAS vs 2023 (a diff of the printed text of all five sides; read
# on this blank).
#   * Section B lines 1 ("Taxable refunds, credits, or offsets of state and
#     local income taxes") and 2a ("Alimony received") moved from the top of
#     Side 2 to the foot of Side 1 (widgets 1106/1107 and 1108-1111); Side 2
#     now opens with line 3 under "Section B — Additional Income Continued".
#   * Section B 8v (digital assets) is a new row between 8u and 8z.
#   * Line 10 reads "Total. Add Section A, line 1z through line 7, and Section
#     B, line 1 through line 7, line 9a and line 9b1 through line 9b3 (as
#     applicable) in each column." (2023: "Combine ..." — same lines).
#   * The primary-box captions re-flowed ("3 Ordinary dividends. See inst.
#     ... a", "6 Social security benefits ... a"); line 7 still prints "7"
#     (keys A7_A..E), 1f still cites "federal Form 8839, line 29", and Part
#     III lines 2 and 23 still cite "federal Form 1040 or 1040-SR, line 11".
#   * Part III 5e still reads "the smaller of line 5d or $10,000 ($5,000 if
#     married filing separately)".
#   * Part III line 29 thresholds: $244,857 single/MFS, $367,291 HoH,
#     $489,719 MFJ/QSS (2023: $237,035 / $355,558 / $474,075); line 30
#     standard deduction $5,540 / $11,080 (2023: $5,363 / $10,726). All five
#     agree with knowledge/states/ca/2024.yaml (the AGI-limitation thresholds
#     and standard_deduction); that pack carries no Schedule CA 5e figure.
#   * Years: "taxable year 2024", "During 2024:", "Before 2024:".
#   * Word positions: Side 1 median shift 0 (61% of words within 0.5 pt);
#     Side 2 median (0, +6.9) pt from the moved
#     and added rows; Sides 3-5 unchanged (94-100% within 0.5 pt).
#
# RELATIONS (new against 2023, whose list was empty). Declared only where the
# face prints unconditional arithmetic over single, fully mapped boxes, so
# each one holds with a blank part read as zero: Part II line 27 in each
# column ("Total. Subtract line 26 from line 10 in each column, A through
# E"); Part III lines 4 (column A), 5d (column A, its only cell), 7, 8e
# (column A), 10, 14 and 17 (columns A-C), 3, 18, 22, 24, 25, 26 and 28; and
# Part IV lines 1, 2, 5 (each quoted at its relation below). Left undeclared,
# each for a stated reason:
#   * Part II 9a adds the parenthesised rows 8a / 8d / 8s, entered as
#     positive amounts that the printed parentheses subtract, so a plain sum
#     would be sign-wrong.
#   * Part II 10, 25 and 26 add rows whose D and E cells are greyed with no
#     widget (Section A 6b and Section B 1 and 7 for line 10; Section C 11,
#     13, 24c, 24i and 24j for 25 / 26): blank-as-zero holds in columns D/E
#     only when column B removes the whole column-A amount, which the
#     per-line instructions direct ("Enter the amount from line 11, column A
#     on line 11, column B") but the face does not print. Line 10 also adds
#     9b1-9b3 "(as applicable)", which the instructions put in column B as
#     positive amounts and in column D "as a negative number". These stay
#     undeclared, as in the 2023 and 2025 packs. (Part III 17 IS declared:
#     its one greyed operand, line 4 column B, carries no amount.)
#   * Part III 4 column C, 5e and 8e columns B / C: 4C carries the medical
#     difference the instructions compute off the form, 5e is "the smaller
#     of line 5d or $10,000 ($5,000 if married filing separately)" (a
#     filing-status input this form does not carry), and 8e column B has no
#     operand on 8a-8c while the instructions put the mortgage-interest
#     adjustment on "line 8, column C" without naming a sub-line.
#
# CROSS_FORM stays empty although Part III lines 2 and 23 each print "Enter
# amount from federal Form 1040 or 1040-SR, line 11": both sit inside
# optional blocks (Medical and Dental Expenses lines 1-4; Job Expenses lines
# 19-25) that a filer with no such expenses leaves blank, and verify reads a
# blank cross_form ref as 0, so "III2 == f1040.11" would FAIL on that
# legitimate path.
#
# UNRESOLVED. None.
# ===========================================================================
# Schedule CA (540NR), 2024 — California Adjustments — Nonresidents or
# Part-Year Residents.
#
# Layout. Flat AcroForm (acroform_root empty; field names are the prefixed
# ids "540NR CA - 1000" .. "540NR CA - 5030", plus the "RB"/"CB" button
# fields). Side 1 carries the name/SSN header and Part I Residency
# Information (two-letter state codes, MMDDYYYY move dates, day counts, Y/N,
# period ranges — for Yourself and Spouse/RDP), then Part II Section A
# (Income) and the first two lines of Section B. Part II Income Adjustment
# Schedule (Sections A/B income, Section C adjustments) is a FIVE-column grid:
#   A = Federal Amounts (taxable amounts from your federal tax return)
#   B = Subtractions (difference between CA & federal law)
#   C = Additions (difference between CA & federal law)
#   D = Total Amounts Using CA Law As If You Were a CA Resident
#       (subtract col. B from col. A; add col. C to the result)
#   E = CA Amounts (income earned or received as a CA resident and income
#       earned or received from CA sources as a nonresident)
# Each income/adjustment line therefore has up to five money boxes; many lines
# grey out one or more columns (no widget exists for a greyed cell — those
# column keys are simply absent). Column-bearing keys carry an _A/_B/_C/_D/_E
# suffix. Lines 2-6 each print a single left-hand "a" box ahead of the grid
# (keys A2a..A6a): the face prints "2 Taxable interest . a [box] 2b". The
# column-A grid cell takes the federal (b) amount (instructions: "Column A –
# Copy the amounts from your federal tax return. Use the (b) amounts on
# line 2, line 3, line 4, line 5, and line 6"; line 6: "taxable U.S. social
# security benefits ... shown on line 6b, column A"), so the "a" box is the
# federal Form 1040 line 2a/3a/4a/5a/6a figure — tax-exempt interest,
# qualified dividends, IRA distributions, pensions and annuities, social
# security benefits — NOT the taxable amount. Part III (Adjustments to Federal Itemized
# Deductions) reverts to a THREE-column grid (A/B/C only); its single-box
# computation lines (1-3, 18-30) have no suffix, while 5b-5d carry only a
# column-A box and keep _A. Part IV (California Taxable Income) is single-box
# computation lines 1-5.
#
# 416 of the 418 widgets are mapped (409 text/money widgets + the 7 button
# widgets as 7 checkbox lines); the two unmapped ones are the reserved lines
# above. Every mapped box is taxpayer-entered: there are NO pre-printed
# statutory constants with a widget on this form (the Side 5 line 29/30
# amounts and the 7.5% / 2% factors are printed text, not fillable). The 22
# residency text boxes (1004-1025) and the SSN/last-name boxes (3046-3049) on
# line 19b are genuine text; the Side-1 residency status is two radio groups
# (residency_myself / residency_spouse) and the Side-4 "did NOT itemize for
# federal" box (4029 CB) a checkbox (on_state /Yes); five description lines
# (2093, 4008, 4043, 5013, 5020) are text. All remaining dollar boxes are
# mapped as money. The line 19b recipient SSN is split into three boxes (3046
# = 3 digits, 3047 = 2, 3048 = 4); the Part IV line 3 deduction percentage is
# split into an integer box (5027, 1 digit) and a four-place decimal box
# (5028).
#
# Relations: see RELATIONS / CROSS_FORM in the banner above. Column D (col A
# less col B plus col C) and column E (residency apportionment) are not
# declared per row: many rows grey one or more of those operands.
