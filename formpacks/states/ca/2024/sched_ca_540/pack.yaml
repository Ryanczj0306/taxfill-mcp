relations:
  # Part II, Side 5 — every operand a mapped widget; a greyed cell has no widget and reads as 0.
  - "II4_A == max(0, II1 - II3)"  # 4 "Subtract line 3 from line 1. If line 3 is more than line 1, enter 0" (column A; B greyed)
  - "II5d_A == II5a_A + II5b_A + II5c_A"  # 5d "Add line 5a through line 5c" (column A only)
  - "II7_A == II5e_A + II6_A"  # 7 "Add line 5e and line 6"
  - "II7_B == II5e_B + II6_B"
  - "II7_C == II5e_C + II6_C"
  - "II10_A == II8e_A + II9_A"  # 10 "Add line 8e and line 9"
  - "II10_B == II8e_B + II9_B"
  - "II10_C == II8e_C + II9_C"
  # Part II, Side 6
  - "II14_A == II11_A + II12_A + II13_A"  # 14 "Add line 11 through line 13"
  - "II14_B == II11_B + II12_B + II13_B"
  - "II14_C == II11_C + II12_C + II13_C"
  - "II17_A == II4_A + II7_A + II10_A + II14_A + II15_A + II16_A"  # 17 "Add lines 4, 7, 10, 14, 15, and 16 in columns A, B, and C"
  - "II17_B == II7_B + II10_B + II14_B + II15_B + II16_B"  # line 4 column B is greyed (no widget)
  - "II17_C == II4_C + II7_C + II10_C + II14_C + II15_C + II16_C"
  - "II18 == II17_A - II17_B + II17_C"  # 18 "Total. Combine line 17 column A less column B plus column C"
  - "II22 == II19 + II20 + II21"  # 22 "Add line 19 through line 21"
  - "II25 == max(0, II22 - II24)"  # 25 "Subtract line 24 from line 22. If line 24 is more than line 22, enter 0"
  - "II26 == II18 + II25"  # 26 "Total Itemized Deductions. Add line 18 and line 25"
  - "II28 == II26 + II27"  # 28 "Combine line 26 and line 27"
