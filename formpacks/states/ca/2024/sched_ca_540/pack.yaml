# bindings were rebuilt by POSITION and printed row label — a widget census of
# the 2024 blank against both the 2023 pack and the shipped 2025 pack, then the
# text layer's label beside each 2024 widget rect — and confirmed on sentinel
# renders of all six sides. The 2024 blank is the 2023 layout under the 2025
# naming scheme, so the field body was carried from the 2025 pack and every
# 2025-only widget, key and caption was taken back out.
#
# URL. https://www.ftb.ca.gov/forms/2024/2024-540-ca.pdf (the FTB's own host).
# Digest e6efd18c0b45… — two separate curl downloads (165,808 bytes each) and
# the triage cache copy all agree. %PDF-1.7, AcroForm, 6 pages; pdfinfo Title
# "2024 Schedule CA (540) California Adjustments - Residents", CreationDate
# 2024-12-18, ModDate 2024-12-26.
#
# PRINTED IDENTITY. Side 1 prints "TAXABLE YEAR 2024 / SCHEDULE CA (540) /
# California Adjustments — Residents" and "Important: Attach this schedule
# behind Form 540, Side 6 as a supporting California schedule."; the footers
# read "7731243 Schedule CA (540) 2024 Side 1" through "Side 6 Schedule CA
# (540) 2024 7736243" (2023: 7731233..7736233). printed_year_verified = 2024.
# Six sides, as in 2023.
#
# AcroForm topology against the 2023 blank (census + rect matching).
# 250 widgets = 249 /Tx + 1 /Btn (2023: 247 = 246 + 1). Every 2023 id survives
# behind the prefix "540ca_form - " ("1000" -> "540ca_form - 1000"), and 243 of
# the 247 sit at the IDENTICAL rect (0.0 pt) on the same printed row. The one
# structural change is on Side 2:
#   * NEW line "8v Digital assets received as ordinary income not reported
#     elsewhere" with three NEW boxes "540ca_form - 2034/2035/2036" (A/B/C,
#     /MaxLen 12), MAPPED B8v_A/_B/_C.
#   * The 8z row moved down 24.0 pt (desc) / 24.1 pt (amounts) under it and was
#     RENUMBERED: its description box is now 2037 (2023: 2034) and its A/B/C
#     boxes 2038/2039/2040 (2023: 2035/2036/2037). The surviving names 2034-2037
#     therefore mean different lines than in 2023 — bound by position, not name.
# /Ff: every text widget is 12582912 as in 2023 (the /Btn 0); no widget is comb
# or ReadOnly. /DA: unchanged (Helv 10 blue on every text box, "/ZaDb 8 Tf" on
# the checkbox). /MaxLen: the two SSN boxes "1001" (header) and "3027" (line 19b
# recipient) now carry 12 (2023: none), so both pack maxlens are 12 (2023 pack:
# 11) — the box is 105.9 pt / 99.5 pt at Helv 10, wide enough for 12; every
# dollar box carries 12 as before. The checkbox's /AP /N on-state is "/Yes"
# (re-dumped from this blank). No GONE field without a replacement; no NEW
# widget left unmapped.
#
# Against the shipped 2025 pack (same naming scheme): 2024 has none of the 2025
# insertions — no 1h type box (2025's "1023"; 1h_A is "1023" here, 2025's
# "1023b"), no Section B 2b divorce-date box (1055B), no line 19c divorce-date
# box (3028A), no ReadOnly boxes on the two "Reserved for future use" rows
# (3033B, 5026B) — and lines 9b1-9b3 are "3004/3005/3006" (2025: suffixed B).
# Section B lines 2a-7 and Section C lines 20-23 sit at their 2023 positions.
#
# FACE DELTAS vs 2023 (per-page diff of the two text layers). Side 1 "TAXABLE
# YEAR 2024" and the footers; Side 2 gains line 8v (above); Side 3 line 9a is
# reworded "Total other income. Add line 8a through line 8z" (2023: "Add lines
# 8a through 8z") and line 10 "Total. Add Section A, line 1z through line 7,"
# (2023: "Combine Section A"); Side 6 line 29 thresholds $244,857 / $367,291 /
# $489,719 (2023: $237,035 / $355,558 / $474,075) and line 30 standard
# deduction $5,540 / $11,080 (2023: $5,363 / $10,726). Unchanged and re-read on
# this face: line 1f "federal Form 8839, line 29", line 7 "Capital gain or
# (loss)" (2025 renamed it 7a; the keys here stay 7_A/7_B/7_C as in 2023), line
# 9b3 "FTB 3805Z, 3807, or 3809", Part II lines 2 and 23 "federal Form 1040 or
# 1040-SR, line 11" (the 2024 Form 1040's AGI line), Part II 5e "$10,000
# ($5,000 if married filing separately)", Section C line 22 and Part II line 8d
# "Reserved for future use" (no widget on either). Every other line NUMBER and
# column letter is unchanged. The standard deduction and the line 29 thresholds
# agree with knowledge/states/ca/2024.yaml (the thresholds as its exemption-
# credit AGI limitation); that pack does not record the Part II 5e cap.
#
# Shared-test rows for this pack: packages/core/tests/fixtures/
# filer_address_lines.json gains "states/ca/2024/sched_ca_540/pack.yaml": []
# (the schedule has no address line, as in 2023 and 2025). No ReadOnly widget,
# so no STATE_COMPUTED_READONLY row; no pack maxlen is below its widget's
# /MaxLen, so no TIGHTER_THAN_WIDGET row.
# Schedule CA (540), 2024 — California Adjustments — Residents.
#
# Authored via the taxfill pipeline on the 2023 base: `taxfill introspect`
# (sentinel sweep — every widget rendered with its own field name) →
# vision-map workflow (every page + zoomed crops read to place each field on
# its printed line/column) → this map; the 2024 bindings were re-derived by
# position and printed label and confirmed on sentinel renders (port banner).
#
# Layout. The form is a flat AcroForm (acroform_root empty; the 2024 field
# names are "540ca_form - NNNN", the 2023 sentinel id behind a fixed prefix,
# with the Side 2 8v insertion and 8z renumbering listed in the port banner).
# Part I (Sections A/B income, Section C adjustments) is a three-column grid:
#   A = Federal Amounts (taxable amounts from your federal tax return)
#   B = Subtractions (See instructions)
#   C = Additions (See instructions)
# Each income/adjustment line therefore has up to three money boxes; many lines
# grey out one or two columns (no widget exists for a greyed cell — those line
# keys are simply absent). Column-bearing keys carry an _A / _B / _C suffix.
# Single-column computation lines (Part I "primary amount" boxes like 2a/3a and
# the entire Part II lower block lines 18-30) have no suffix.
#
# All 250 widgets are mapped. There are NO pre-printed statutory constants
# inside any widget (every box is taxpayer-entered). The 240 dollar boxes
# carrying /MaxLen 12 are mapped as `money`; the 9 other text widgets are
# genuine text (name, two SSN/ITIN boxes, last name, and five "list type and
# amount / list type / specify" description lines); 1 checkbox (Part II "did
# NOT itemize for federal but will for CA").
#
# Relations. Part II's printed add/subtract lines are declared (relations
# block below): every operand of those lines is a mapped widget on this blank,
# and a greyed cell has no widget, so it reads as zero — 4A, 5d, 7/10/14/17
# per column, 18, 22, 25, 26, 28; lines 4 and 25 carry the printed "enter 0"
# floor. A Part II the filer leaves blank reads as all zeros, so every relation
# holds on a standard-deduction return too. NOT declared: Part I (Sections
# A-C) — its totals (1z, 9a, 10, 25, 26) were not re-derived operand by operand
# in this port, so it keeps the 2023/2025 packs' none; Part II line 3 (7.5%) and line 24 (2%) —
# percentage lines a filer rounds; line 5e — column A's cap is $10,000 or
# $5,000 by filing status, which the grammar cannot condition; line 8e — its
# column B is an open box with no 8a-8c column-B operands; line 29 (worksheet)
# and line 30 (larger-of with the standard deduction). The shipped 2023 and
# 2025 packs declare none; this port adds them because the face prints them.
# cross_form is omitted: the printed totals feed Form 540 lines 14/16/18 but
# those are Form 540's input lines, not equalities asserted on this schedule
# (Part II lines 2 and 23 cite "federal Form 1040 or 1040-SR, line 11" — the
# 2024 Form 1040's AGI line; neither is declared, as in 2023).
