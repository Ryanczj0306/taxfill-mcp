relations:
  - "11 == 7 + 8 + 9 + 10"  # 11 "Add line 7 through line 10"
  - "15 == 13 - 14"  # 15 "Subtract line 14 from line 13" (may be negative)
  - "17 == 15 + 16"  # 17 "Combine line 15 and line 16"
  - "19 == max(0, 17 - 18)"  # 19 "Subtract line 18 from line 17 ... If less than zero, enter -0-"
  - "33 == max(0, 31 - 32)"  # 33 "Subtract line 32 from line 31. If less than zero, enter -0-"
  - "35 == 33 + 34"  # 35 "Add line 33 and line 34"
  - "47 == 40 + 43 + 44 + 45 + 46"  # 47 "Add line 40 through line 46" — the only printed lines in that range
  - "48 == max(0, 35 - 47)"  # 48 "Subtract line 47 from line 35. If less than zero, enter -0-"
  - "64 == 48 + 61 + 62 + 63"  # 64 "Add line 48, line 61, line 62, and line 63"
  - "78 == 71 + 72 + 73 + 75 + 76 + 77"  # 78 "Add line 71 through line 77" — line 74 prints "Reserved for future use" and is not mapped
  - "93 == max(0, 78 - 91)"  # 93 "If line 78 is more than line 91, subtract line 91 from line 78"
  - "94 == max(0, 91 - 78)"  # 94 "If line 91 is more than line 78, subtract line 78 from line 91"
  - "95 == max(0, 93 - 92)"  # 95 "If line 93 is more than line 92, subtract line 92 from line 93"
  - "96 == max(0, 92 - 93)"  # 96 "If line 92 is more than line 93, subtract line 93 from line 92"
  - "97 == max(0, 95 - 64)"  # 97 "If line 95 is more than line 64, subtract line 64 from line 95"
  - "99 == 97 - 98"  # 99 "Subtract line 98 from line 97"
  - "100 == max(0, 64 - 95)"  # 100 "If line 95 is less than line 64, subtract line 95 from line 64"
  - "110 == 400 + 401 + 403 + 405 + 406 + 407 + 408 + 410 + 413 + 422 + 423 + 424 + 425 + 431 + 438 + 439 + 445 + 447"  # 110 "Add amounts in code 400 through code 447" — the 18 printed codes
  - "115 == 99 - 110 - 112 - 113"  # 115 "REFUND OR NO AMOUNT DUE. Subtract the sum of line 110, line 112, and line 113 from line 99." (111 stays out: it applies only when line 99 is empty)
cross_form:
  - "13 == f1040.11"  # 13 "federal adjusted gross income from federal Form 1040 or 1040-SR, line 11" — the 2024 f1040 defines AGI on line 11
identity_fields:
  - name.first
  - name.last
  - identifying_number
# Page-header mirrors (Phase K JK28, 2026-10-16). Sides 2-6 print "Your name:" and "Your SSN or ITIN:" across the top,
# each one AcroForm field with a widget on every side. The 2024 Form 540 booklet ("Filling in Your Tax Return", page 11)
# says "Enter your social security number(s) or individual taxpayer identification number(s) at the top of Form 540,
# Side 1 through Side 6." For the name ("Name(s) and Address", the same page) it says "Print your first name, middle
# initial, last name, and street address in the spaces provided at the top of the form." fill_form builds each mirror
# from the Side 1 lines when the caller leaves it out (FillResult.mirrored), and verify checks both on disk. Widgets on
# the pinned blank: Side 1 SSN 540-1007 /MaxLen 9, the mirror 540-2002 /MaxLen 11: Side 1 takes 9 characters (pack
# maxlen 9, so an SSN goes in as its 9 digits), which the mirror's /MaxLen 11 holds. The name box is 540-2001 (no
# /MaxLen; 125.9-127.0 pt at Helv 10). fill_form measures every mirror it builds against the narrowest widget less 2 pt
# (taxfill_core.textfit, with Helvetica's AFM widths), so this box holds 123.9 pt: about 18 of the "CAPITAL LETTERS" the
# booklet asks for, where verify's P-001 estimate before Phase K JEe (0.5 em a character) flagged a name only past 25. A name too wide for it
# is abbreviated as mirror_abbreviations below allows, with an informational warning: "A Q WASHINGTON" for "ALEXANDRA Q
# WASHINGTON" (142.8 pt), else "A WASHINGTON". A name too wide even then is left blank, with a warning to hand-write it
# after printing. verify expects the same value, and FAILs a header that is cut off or abbreviated although the full
# name fits. The booklet has no rule for a name too wide for this box (page 11 speaks of abbreviating only country
# names: "Do not abbreviate the country name."), so the rule is this pack's own: name.first and name.middle_initial may
# shorten to an initial or be left out; name.last stays whole, and so does name.suffix, since a generational suffix
# ("JR", "III") has no initial.
mirrors:
  name.full: "{name.first} {name.middle_initial} {name.last} {name.suffix}"  # "Your name:" — from Side 1 "Your first name", "Initial", "Last name", "Suffix"
  identifying_number.page6: "{identifying_number}"  # "Your SSN or ITIN:" — the Side 1 "Your SSN or ITIN" as written there (no format: dashes stay if given; verify compares the digits)
mirror_abbreviations:
  name.full: [name.first, name.middle_initial]  # e.g. "A Q WASHINGTON" for "ALEXANDRA Q WASHINGTON"; name.last and name.suffix stay whole
signature:
  page: 6  # Side 6 "Your signature / Date / Spouse's/RDP's signature" block
mailing: null  # CA where-to-file lives in knowledge/states/ca (the face prints both PO boxes on Side 5)
