# ===========================================================================
# TY2024 PORT of formpacks/states/ca/2023/form540/pack.yaml (ported 2026-10-04,
# Phase J JS5; triaged RE-MAP — every one of the 167 field names the 2023 pack
# binds is gone from the 2024 blank, so this pack was rebuilt by POSITION and
# printed label, and every binding confirmed on sentinel renders).
#
# URL. https://www.ftb.ca.gov/forms/2024/2024-540.pdf (the FTB's own host). Digest
# 7729c31d62b4… — two separate curl downloads on 2026-10-02 (231,837 bytes
# each) and the triage cache copy all agree. %PDF-1.7, an AcroForm with no XFA;
# pdfinfo Title "2024 Form 540 California Resident Income Tax Return",
# CreationDate 2024-11-12, ModDate 2025-02-13.
#
# PRINTED IDENTITY. Side 1 prints "TAXABLE YEAR 2024 / California Resident
# Income Tax Return / FORM 540"; the footers read "333 3101243 Form 540 2024
# Side 1" through "Side 6 Form 540 2024 333 3106243" (2023: 3101233..3106233).
# The fiscal-year line prints "year 2025." printed_year_verified = 2024. Six
# sides, as in 2023.
#
# PORT SOURCE. The page layout is the 2023 one (a diff of the printed words:
# every unchanged word on Sides 1-3 and 5 within 1 pt of its 2023 position —
# all but the Side 2 footer "333" (1.0 pt) and the Side 5 "Yes" / "No"
# captions (0.53 pt) within 0.5 pt — Side 4 89% (695 of 783 words), the
# contribution rows re-cut, and Side 6 shifted 2.15 pt left), but the
# field NAMES already follow the 2025 scheme ("540-1043" here, "540_form_1043"
# in 2025). Matching each mapped field to the 2024 widget of the same field
# type on the same side whose rect is nearest (smallest largest-edge
# displacement), and counting a match only when that widget's FULL name is the
# old name with the prefix swapped (so "1036 CB" -> "540-1036 RB" does not
# count), gives 149 of the 2025 pack's 169 mapped fields against 135 of the
# 2023 pack's 167. So Sides 1-3
# carry the 2025 pack's entries with the "540_form_" prefix replaced by "540-",
# and Sides 4-6 were rebuilt from this blank's own widget dump (rect, /TU
# tooltip, printed caption).
#
# AcroForm topology against the 2023 blank (a widget census). 180 widgets on
# 162 top-level fields (2023: 180 on 167); per side 50 / 43 / 28 / 24 / 22 / 13,
# the same as 2023. No widget is comb. /DA is Helv 10 on every text widget
# except 540-1033 (the principal-residence "State" box, Helv 8; 2023 Helv 10)
# and ZaDb 8 on the buttons. The FTB prefixed every name with "540-" AND
# renumbered the ids after each merged field or re-cut row, so a name is not a
# binding: old "1047" (the line 8 count box) sits where "540-1043" now is,
# while "540-1047" does not exist. Every 2023 widget has a 2024 widget at its
# place (largest rect-edge displacement 5.0 pt, the designee "Yes" kid; most
# 2023 buttons were 12.8-13.4 pt squares, every 2024 one is 16.3-16.9 pt wide,
# around the same centres), but on Side 4 the five rects that held codes 438,
# 439, 440, 444 and 445 in 2023 (fields 4020-4024) now hold 431, 438, 439, 445
# and 447 (540-4019-4023; line 110 kept its rect), so those were bound by
# caption and tooltip, never by position.
# What the FTB re-authored:
#   * FILING STATUS is now ONE radio field "540-1036 RB" with five kids whose
#     /AP /N names spell the captions out ("/Box 1 . Single.", "/Box 2 .
#     Married/Registered Domestic Partner filing jointly (...)", "/Box 3 ...",
#     "/Box 4 . Head of household (...)", "/Box 5 . Qualifying surviving spouse
#     or Registered Domestic Partner.") — 2023 had five separate checkboxes
#     1036 / 1037 / 1038 / 1040 / 1041 CB (its 1039 was the line-3 name text
#     box). The five lines keep group filing_status; the "different from
#     federal" box stays its own field (540-1035 CB). The three line-3/line-5
#     text boxes renumbered (1039 -> 540-1037, 1042 -> 540-1038, 1043 ->
#     540-1039), the line 6 box 1044 CB -> 540-1040 CB, and the six exemption
#     boxes 1045-1050 -> 540-1041-1046.
#   * LINE 113's two boxes are now ONE radio "540-5004 RB" (kids "/FTB 5805 is
#     attached." and "/FTB 5805F is attached."; 2023 5004 / 5005 CB), so the
#     Side 5 money lines shifted one id (113 -> 5005 .. 115 -> 5007); line 111
#     is 540-5002 (2023 4027). Direct deposit: amounts 116 -> 5008 and 117 ->
#     5012 (2023 5012 / 5016), routing 5009 / 5013, account 5011 / 5015; the
#     account-type radios keep their names (540-5010 RB, 540-5014 RB) but their
#     kids are now "/Checking" (upper) and "/Savings" (lower), 2023 "/0" / "/1".
#     The 2023 key 116.account_type (= the Savings kid) is replaced by
#     116.account_type.checking / .savings sharing group 116.account_type (same
#     for 117), as in the 2025 pack.
#   * The Yes/No radios name their kids "/Yes" / "/No" (2023 "/0" / "/1"):
#     health coverage 540-5017 RB (2023 5018 RB) and the designee 540-6008 RB;
#     the use-tax radio 540-3020 RB names its kids after the two printed
#     options (2023 "/0" / "/1" as well). This port binds BOTH kids of each (health_care_coverage.yes/.no,
#     third_party_designee.allow_yes/.allow_no, 91.no_use_tax_owed /
#     91.paid_directly_cdtfa); on every one the box sits LEFT of its caption.
#     The voter box is 540-5016 CB (2023 5017 CB).
#   * CONTRIBUTIONS (Side 4): codes 440 (Rape Kit Backlog) and 444 (Suicide
#     Prevention) are GONE from the face; 431 (Prevention of Animal Homelessness
#     and Cruelty) and 447 (California ALS Research Network) are NEW, both
#     MAPPED. 410 (Sea Otter) and 425 (Keep Arts in Schools) still print. Line
#     110 now reads "code 400 through code 447" and its relation sums the 18
#     printed codes. The ids from 431 down follow the new row order (431 ->
#     540-4019, 438 -> 4020, 439 -> 4021, 445 -> 4022, 447 -> 4023, 110 ->
#     4024); 408 is 540-4012 (2023 4012a).
#   * LINE 74 now prints "Reserved for future use" (2023: "Excess SDI (or VPDI)
#     withheld"), the face shades its amount box grey, and its widget 540-3014
#     is the blank's ONLY ReadOnly widget (/Ff 12582913; every other text
#     widget 12582912 or 8388608). It is NOT mapped: no printed instruction
#     asks for an entry there, the key's 2023 meaning (excess SDI) and 2025
#     meaning (a production credit) are different amounts, and an
#     unknown-line-key error is the right answer for a caller still sending
#     one. The printed line-78 sum "Add line 71 through line 77" is a range, so
#     its relation simply omits 74.
#   * /MaxLen: the two SSN boxes 540-1007 / 540-1012 now carry 9 (2023 none);
#     the Sides 2-6 SSN mirror 540-2002 and the three dependent SSN boxes carry
#     11 (2023 none / 10); the account numbers keep 17; every money box 12. The
#     three "Apt. no/ste. no." and "PMB" boxes (1016, 1017, 1031) LOST their
#     2023 /MaxLen (5 / 6 / 5), so each carries a budget of 12 (as the 2025
#     pack does), measured in DIGITS: on a probe fill of this blank rendered at
#     3x, 12 digits fit all three boxes (72.5 / 73.0 / 70.7 pt at Helv 10;
#     Helvetica digits advance 0.556 em, 66.7 pt), and the 13th digit clips
#     at the right border in all three (so a 14th never shows). Capitals are
#     wider, so the budget is not a guarantee for them: on a second probe
#     "UNIT 1200-BC" and "SUITE 1200" render whole in all three boxes, "STE
#     1234ABCD" loses part of its last glyph in all three, nine M's clip in
#     all three and twelve W's show about seven and a half. verify's clipping
#     scan, which estimates 0.5 em a glyph, flags none of those fills, so a
#     caller with a long all-capitals unit string should read the render.
# 179 of the 180 widgets are bound (171 lines; name.full and
# identifying_number.page6 are one field each with a widget on Sides 2-6); the
# one unbound widget is line 74's 540-3014.
# NEW lines vs 2023: 91.no_use_tax_owed, 431, 447, 116.account_type.checking,
# 116.account_type.savings, 117.account_type.checking, 117.account_type.savings,
# health_care_coverage.yes, third_party_designee.allow_yes.
# DROPPED lines vs 2023: 74 (reserved, above), 440, 444 (their rows are gone
# from the face), 116.account_type, 117.account_type (split, above).
# Against the 2025 pack this one lacks 448 / 449, the Organ Donor boxes and the
# paid-preparer name / phone row (none print on the 2024 face) and line 74, and
# adds 410 / 425.
#
# FACE DELTAS vs 2023 (the complete printed-text diff). The exemption credits
# "7/8/9 X $149" (2023 $144) and "10 X $461" ($446); the standard deduction
# "$5,540" / "$11,080" ($5,363 / $10,726); line 32's AGI threshold "$244,857"
# ($237,035); line 74 "Reserved for future use" (above); the years (line 72
# "2024 California estimated tax", line 98 "applied to your 2025 estimated
# tax", the fiscal-year "year 2025."); the Side 4 contribution rows and line
# 110's "code 447". Nothing else changed: line 13 still cites "Form 1040 or
# 1040-SR, line 11", line 62 is still "Mental Health Services Tax", and the
# line numbering 1-117 is unchanged. knowledge/states/ca/2024.yaml carries the
# same $149 / $461, $5,540 / $11,080 and $244,857 — no mismatch.
#
# CROSS-FORM. The face cites "line 11" of the 2024 Form 1040, the line that
# defines AGI there, so the leg is `13 == f1040.11`.
