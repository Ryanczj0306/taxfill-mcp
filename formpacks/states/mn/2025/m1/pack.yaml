#
# FACE DELTAS vs 2023 (read from this blank's text layer). Line 14 is now
# "14a Other taxes ... (check appropriate boxes) (a) Schedule M1HOME (b)
# Schedule M1529 (c) Schedule M1LS (d) Schedule NIIT"; new "14b Repayment of
# advance child tax credit"; line 15 "Tax before credits. Add lines 13, 14a,
# and 14b"; line 7 "Subtractions from line 40 of Schedule M1M and line 22 of
# Schedule M1MB" (2023: lines 35 / 21); line 16 "Amount from line 19 of
# Schedule M1C" (2023: line 21); line 22 "Amount from line 14 of Schedule
# M1REF" (2023: line 11); line 21 "payments made for 2025"; line 30 "applied
