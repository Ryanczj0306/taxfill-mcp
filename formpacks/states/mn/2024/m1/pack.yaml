# too: 4 of its 81 widgets are gone here ("SS benefits", "taxabke SS
# benefits", "m1line14a", "m1line14b") and "m1line14" is back, so the 2024
# blank sits next to 2023 and the 2023 pack is the port base. The four new
# 2024 widgets are the ones the 2025 pack already maps under the same names;
# their entries follow its keys, re-placed on this blank.
#
# URL. https://www.revenue.state.mn.us/sites/default/files/2026-01/m1-24.pdf
# (MN files forms under an upload-month folder, so the path can move when the
# DOR re-posts; the digest is the identity). Digest ada796d7a0cf1dae… — two
# separate curl downloads on 2026-10-02 and the discovery copy all agree;
# HTTP 200, 312,758 bytes, Last-Modified Mon, 19 May 2025 15:51:00 GMT,
# %PDF-1.7, flat AcroForm, 2 pages. Document title "2024 Form M1, Individual
# Income Tax Return".
#
# PRINTED IDENTITY. Page 1 prints "*241111*" and "2024 Form M1, Individual
# Income Tax"; page 2 prints "2024 M1, page 2" and "*241121*"; both pages end
# in the "9995" scan-line (2023: *231111* / *231121*). No "Rev." stamp is
# printed on either page. printed_year_verified = 2024.
#
# AcroForm topology against the 2023 blank. 78 widgets = 78 names (2023: 74).
# Census of the 74 mapped 2023 widgets: 64 SAME, 10 MOVED, 0 GONE; 4 NEW.
#   * NEW, all mapped: "county" (page-1 address row, no /MaxLen -> `county`);
#     "checkforniit" (the new "(d) Schedule NIIT" box on line 14 ->
#     line14_schedule_niit::yes); "checkforfilingniit" ("I am filing this
