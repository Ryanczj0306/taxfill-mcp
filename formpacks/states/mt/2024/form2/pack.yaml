# ===========================================================================
# TY2024 RE-MAP of formpacks/states/mt/2023/form2/pack.yaml (built 2026-10-02,
# Phase J JS5; triaged RE-MAP — 712 of the base's 754 mapped fields are gone).
# TY2024 is the first year of Montana's income-tax simplification: the return
# now starts from federal AGI and federal taxable income, uses the federal
# filing statuses and one money column, and the 2023 schedules (additions,
# subtractions, ratio, itemized, pension, benefits, liability, credits,
# payments) are replaced by Schedules I-V, 2EC and a Transition Schedule.
# Nothing here is carried over from 2023 by name: every binding was built from
# the widget's position and the label printed on its row, then confirmed on
# a sentinel render of this blank (one distinct value per mapped line, every
# page read) and, for checkbox options, combs and ratio boxes, on real-value
# renders.
#
# URL. https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2024_Montana_Individual_Income_Tax_Return_Form_2.pdf
# Two separate downloads on 2026-10-02 (HTTP 200) and the triage copy agree:
# sha256 126be01d436a0b6e8c6fed36fdace36dbd5788df12431ae276d5cac01cfbdee6,
# 536,013 bytes, %PDF-1.7, an AcroForm (AES-256 encrypted with print allowed;
# field-level JavaScript only — format/keystroke actions, no calculate actions,
# no document-level script, and a /ResetForm action on the Clear Form button;
# creator Adobe InDesign 14.0 (Windows), producer Adobe PDF Library 15.0,
# modified 2024-11-26).
#
# PRINTED IDENTITY. Page 1 prints "2024 Montana Individual Income Tax Return",
# "Form 2", the stamps "2024v5" and "11/2024", "For the year Jan 1 – Dec 31,
# 2024, or the tax year beginning M M D D 2 0 2 4 and ending M M D D 2 0 Y Y"
# and the scan code *24CE0101*. Pages 2-12 print the footer "Form 2 – Page N
# – 2024" (N = 2..12); page 1 prints no footer. printed_year_verified =
# 2024. This is the TY2024 Form 2 for residents, part-year residents and
# nonresidents alike.
#
# PAGES (all 12 are the filed return):
#   p1  main return — tax-year dates, amended flag, identity, federal filing
#       status, residency status + ND Reciprocity, lines 1-26;
#   p2  "Montana Individual Income Tax" worksheet (tax_calc.1-13), direct
#       deposit 1-3, 529/529A deposits 4-5, signatures, preparer, designee;
#   p3  Schedule I – Adjustments: Part I (additions 1-9, subtractions 10-27),
#       Part II Montana Medical Savings Account (MSA) Adjustment 1-9;
#   p4-5 Schedule II – Tax on Montana Source Income (part-year information,
#       spouses with different states of residency, lines 1-26);
#   p6-7 Schedule III – Tax Credits: Part I (1-17), Part II Credit For Income
#       Taxes Paid To Another State Or Country (1-21);
#   p8  Schedule IV – Contributions, Penalties, Interest, and Other Taxes 1-8;
#   p9  Schedule V – Amended Return Information;
#   p10 Schedule 2EC – Elderly Homeowner/Renter Credit 1-30;
#   p11 Transition Schedule: Part I Passive Loss, Capital Loss, and Basis
#       Adjustment 1-14, Part II Recovery of Federal Income Tax Deducted in
#       2023 1-16;
#   p12 Transition Schedule (Continued): Loss Carryover Transition Adjustment
#       Worksheet (type of adjustment + 40 rows of columns A-E).
#
# TOPOLOGY against the 2023 blank (11 pages, 791 widgets, 755 fields): 12
# pages, 587 widgets, 545 fields (530 text widgets + 57 button widgets), NO
# ReadOnly widget. Of the 2023 pack's 754 mapped fields, 42 names survive —
# all on pages 1-2 (identity, tax-year dates, amended flag, filing and
# residency status, ND reciprocity, direct deposit and 529 rows, signature
# dates and phones, preparer phone/PTIN, designee) plus "Date of Residency
# Change" (2023 page 8 -> 2024 page 4) and "CGR Account ID" (page 9 -> page 6);
# every one moved (no widget sits where it was; the printed words of every page
# moved too — at most 6% of a page's words within 2 pt of their 2023 spot).
# The other 712 are GONE with their whole sections: the two-column (A/B) income
# lines 1-27 and exemptions/dependents block of page 1, the 2a payment and
# refund schedules, Schedule 1, the additions, subtractions, recovery, pension,
# benefits, standard-deduction, itemized, ratio, liability, nonrefundable-credit,
# other-state, elderly, long-term-care, payments, voluntary-contribution,
# penalty and underpayment-interest schedules, the farming NOL carryback
# waiver and the old amended table. The
# filing-status radio drops 2023's six options (/1, /3, /4, /2a-/2c) for five
# federal statuses (on-states /Single /2a /Married Filing Separately
# /Qualifying Surviving Spouse /Head of Household — "Married Filing Jointly"
# really carries /2a); residency keeps three options, but the on-states change
# from /1 /2 /3 (2023: /1 = Resident) to /Resident /Part-year Resident /1 (/1
# is now the Nonresident kid), and 2023's separate Military Spouse checkbox is
# gone. 517 widgets are NEW. Every field of the blank is mapped except
# the "Clear Form" pushbutton (a form-reset button, not a line): 568 lines over
# 544 fields (56 checkbox lines). Both the Last Name and the SSN fields carry
# one widget on page 1 plus one in the "Name / Social Security Number" header
# of pages 2, 3, 5-9, 11 and 12 (10 widgets, one field each), so each is mapped
# once. Every surviving name's /MaxLen equals the 2023 pack's maxlen; every
# text widget's /DA is "/Cour 10 Tf 0 g", as in 2023. Of the 56 checkbox
# widgets, 7 carry "/ZaDb 0 Tf 0 g" (Deceased 1/2, the two Schedule I Part I
# taxable-distribution kids, Schedule I Part II line 3, the two Schedule II
# boxes) and the other 49 inherit the AcroForm default "/Helv 0 Tf 0 g" (2023:
# no checkbox carried a /DA); every checkbox's on-appearance is a vector cross
# that uses no font. A survivor-by-survivor
# /Ff read found only "Primary Taxpayer's Last Name" and the two 529 deposit
# amounts gaining the do-not-spell-check bit.
# A widget census of the TY2025 Form 2 blank's line-mapped widgets against
# this blank (186 at the same name and spot, 106 moved, 1 on another page, 20
# gone; against the 2023 blank none kept its spot) shows the 2025 form is the
# closer relative, so line keys follow the 2025 form's rows where the printed
# row is the same; 2024-only rows get their own keys (sched1.1-27,
# sched1_part2.1-9, sched2.spouses_different_residency + resident_spouse /
# nonresident_spouse, sched2.16-26, transition.*, transition_part2.*,
# transition_ws.*).
#
# ON-STATE ODDITIES (each re-dumped from this blank's /AP /N, never guessed;
# every one confirmed on a render): "Foreign bank account" (dd.outside_us) is
# /Savings; the MSA balance box (sched1_part2.3), the spouses-with-different-
# residency box and the suspended-losses box (sched2.10) are each /Montana
# medical savings account. On page 12 the "Type of Adjustment" kid printed
# beside "Passive Activity" carries /Capital and the kid printed beside
# "Capital" carries /Passive Activity (/Basis matches its label); keys follow
# the printed label (P-030), and a real-value render puts each tick by its
# label.
#
# COMBS. `comb: true` makes fill_form accept digits only, so it is set on the
# digit combs (SSNs, dates, ZIP+4, phones, routing/account numbers). The
# widgets that carry the comb bit but take letters or a printed separator —
# the 2-cell state abbreviations, the DOR 2-cell codes (Schedule I lines 6/23,
# Schedule IV line 7), the 10-cell credit confirmation codes and CGR Account
# ID, the 24-cell UCRN boxes (printed dashes in cells 3, 8, 11, 15, 20), the
# 16-cell JGI certificate number (dashes in cells 5, 10), the 4-cell tax credit
# code, the PTIN, and the ratio boxes (Schedule II 18/23 and Schedule III Part
# II 6/8/16/18: 8 cells; 2EC 21: 5 cells; 2EC 29: 4 cells; each prints its "."
# in cell 2) — keep `comb` off with maxlen = the cell count; the widget's own
# comb bit still spaces one character per cell (real-value render: a "." or
# "-" lands on its printed separator cell).
#
# FACE / LAW DELTAS vs 2023. Line 1 "Federal adjusted gross income from Form
# 1040, line 11" (cross_form `1 == f1040.11`; the 2024 Form 1040 prints AGI on
# line 11); line 2 federal standard or adjusted itemized deduction; line 6
# "$5,500 subtraction for taxpayers 65 and older ($11,000 if married filing
# jointly and both are 65 and older)"; page 2 line 5 "$20,500 if single or
# married filing separately / $41,000 if married filing jointly or qualifying
# surviving spouse / $30,750 if head of household", line 8 "3% (0.03)", line 10
# "4.1% (0.041)"; line 15 "Multiply Federal EIC by 10% (0.10)"; Schedule I
# Part II line 2 "up to $4,500 per taxpayer"; Schedule II line 15 is printed
# "Reserved" with no box; 2EC line 19 prints "1 2 6 0 0 00" with no widget,
# "less than $45,000 for 2024", line 28 "the lesser of line 27 or $1,150";
# Transition Schedule Part II line 13 (the 2023 standard deduction, 20% of
# line 12) "not less than $2,460 or more than $5,540" / "not less than $4,920
# or more than $11,080" (the 2023 figures knowledge/states/mt/2023.yaml
# records). Lines 3 and 7 print no "if zero or less" floor on this face (the
# 2025 face adds one), but the 2024 instructions do ("If zero or less, enter
# zero" for both), so the pack floors both relations at zero, as the
# instructions say. Line 10 ("Subtract line 9 from line 8. This is your tax
# after nonrefundable tax credits.") prints no floor either, but the Schedule
# III instructions do ("Nonrefundable credits reduce the amount of tax you owe
# but cannot reduce your tax liability below zero"), so line 10 is floored at
# zero too and line 9 stays the full Schedule III line 14.
# knowledge/states/mt/2024.yaml records $5,500/$11,000,
# $20,500/$41,000/$30,750, 3%/4.1%, the 10% EITC, $45,000 and $1,150 — all
# agree with the face.
#
# RELATIONS follow this face's printed arithmetic. Not declared, on purpose:
# page 2 line 4 ("Subtract line 3 from line 1") — page 2 line 1 tells a filer
# with no net long-term capital gain to "skip lines 2 through 10 and enter 0
# (zero) on line 11", so a blank line 4 (read as zero) would fail every such
# filer; page 2 line 13 and "page 1 line 8 == Schedule II line 26" (residents
# fill line 13, nonresidents Schedule II; a blank side reads as zero and would
# fail the other filer), the page 2 -> Schedule II copies (lines 19/24) for the
# same reason, Schedule III line 1 ("Total credit ... from Part II, line 21" —
# the 2024 instructions say "complete a new page for each state or country"),
# Schedule I line 3 (two possible sources), and the ratio products (Schedule
# II 20/25, Part II 7/9/17/19, 2EC 22/30), whose ratios are text boxes.
#
# INSTRUCTIONS. The 2024 Form 2 instructions were read for the relations:
# https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2024_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
# (downloaded 2026-10-04, HTTP 200, 1,257,219 bytes, sha256
# a31a761150b7b092a688a00ebad3a1bb18a80a05143c097e8388d2f0d42440d4, modified
# 2024-12-17). They repeat the page 2 skip rule and the $20,500 / $41,000 /
# $30,750 thresholds, and the Transition Schedule instructions send a positive
# line 14 to Schedule I, Part I, line 7 and a negative one, as a positive
# number, to line 26 — as the face does. The Schedule I instructions caption
# the subtraction-side transition adjustment "Line 27"; the face prints it on
# line 26 (line 27 is the subtraction total), and the pack follows the face.
#
# UNRESOLVED. None for the bindings. The instructions say a bank account
# number "can be up to 17 characters, including numbers and letters"; the
# account combs (direct deposit line 2, 529 rows 4-5) keep `comb: true`
# (digits only), as the 2023 pack does, so an account number with a letter is
# refused rather than filled.
# ===========================================================================
form: "2"
jurisdiction: states/mt
tax_year: 2024
source_url: https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2024_Montana_Individual_Income_Tax_Return_Form_2.pdf
pdf_sha256: "126be01d436a0b6e8c6fed36fdace36dbd5788df12431ae276d5cac01cfbdee6"
acroform_root: ''
fields:
  # ============================================ page 1 -- Form 2 main return: tax-year dates, amended flag, identity, filing and residency status, lines 1-26 (one money column)
  - line: tax_year.begin  # "or the tax year beginning M M D D 2 0 2 4" (comb, 8 cells)
    field: Tax Year Beginning
    type: text
    maxlen: 8
    comb: true
  - line: tax_year.end  # "and ending M M D D 2 0 Y Y" (comb, 8 cells)
    field: Tax Year ending
    type: text
    maxlen: 8
    comb: true
  - line: amended.yes  # "Mark if this is an amended return"
    field: Amended Return Designation
    type: checkbox
    on_state: "/Yes"
  - line: name.first  # "First Name"
    field: "Primary Taxpayer's First Name"
    type: text
  - line: name.middle_initial  # "Initial"
    field: "Primary Taxpayer's Middle Initial"
    type: text
    maxlen: 1
  - line: name.last  # "Last Name" -- the SAME field prints in the "Name" header of pages 2, 3, 5-9, 11 and 12 (10 widgets, one field)
    field: "Primary Taxpayer's Last Name"
    type: text
  - line: identifying_number  # "Social Security Number" -- one comb field, its widget repeats in the same nine page headers
    field: "Primary Taxpayer's SSN"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: deceased.taxpayer  # "Deceased?" on the taxpayer row
    field: Deceased 1
    type: checkbox
    on_state: "/Yes"
  - line: spouse.name.first  # "Spouse's First Name"
    field: "Spouse's First Name"
    type: text
  - line: spouse.name.middle_initial  # "Initial"
    field: "Spouse's Middle Initial"
    type: text
    maxlen: 1
  - line: spouse.name.last  # "Spouse's Last Name"
    field: "Spouse's Last Name"
    type: text
  - line: spouse.identifying_number  # "Social Security Number" on the spouse row
    field: "Spouse's SSN"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: deceased.spouse  # "Deceased?" on the spouse row
    field: Deceased 2
    type: checkbox
    on_state: "/Yes"
  - line: mailing_address.street  # "Current mailing address"
    field: Mailing Address
    type: text
  - line: mailing_address.city  # "City"
    field: City
    type: text
  - line: mailing_address.state  # "State"
    field: State
    type: text
    maxlen: 2
  - line: mailing_address.zip  # "ZIP Code + 4" (comb, 9 cells)
    field: Zip+4 Code
    type: text
    maxlen: 9
    comb: true
  - line: filing_status.single  # "Federal Filing Status  Single"
    field: Filing Status
    type: checkbox
    on_state: "/Single"
    group: filing_status
  - line: filing_status.married_filing_jointly  # "Married Filing Jointly" -- the kid's on-state really is /2a (dumped from /AP /N)
    field: Filing Status
    type: checkbox
    on_state: "/2a"
    group: filing_status
  - line: filing_status.married_filing_separately  # "Married Filing Separately"
    field: Filing Status
    type: checkbox
    on_state: "/Married Filing Separately"
    group: filing_status
  - line: filing_status.qualifying_surviving_spouse  # "Qualifying Surviving Spouse"
    field: Filing Status
    type: checkbox
    on_state: "/Qualifying Surviving Spouse"
    group: filing_status
  - line: filing_status.head_of_household  # "Head of Household"
    field: Filing Status
    type: checkbox
    on_state: "/Head of Household"
    group: filing_status
  - line: residency.resident_full_year  # "Residency Status  Resident"
    field: Residency Status
    type: checkbox
    on_state: "/Resident"
    group: residency_status
  - line: residency.resident_part_year  # "Part-year Resident (See Instructions)"
    field: Residency Status
    type: checkbox
    on_state: "/Part-year Resident"
    group: residency_status
  - line: residency.nonresident_full_year  # "Nonresident" -- this kid's on-state is /1 (dumped from /AP /N)
    field: Residency Status
    type: checkbox
    on_state: "/1"
    group: residency_status
  - line: residency.nd_reciprocity  # "ND Reciprocity" -- its own field, not a fourth residency option
    field: North Dakota reciprocity
    type: checkbox
    on_state: "/Yes"
  - line: "1"  # "Federal adjusted gross income from Form 1040, line 11"
    field: Page 1 Line 1
    type: money
  - line: "2"  # "Federal standard deduction or adjusted federal itemized deductions (See instructions)"
    field: Page 1 Line 2
    type: money
  - line: "3"  # "Subtract line 2 from line 1. This is your federal taxable income for Montana."
    field: Page 1 Line 3
    type: money
  - line: "4"  # "Montana additions to federal taxable income from Schedule I, Part I, line 9"
    field: Page 1 Line 4
    type: money
  - line: "5"  # "Montana subtractions from federal taxable income from Schedule I, Part I, line 27"
    field: Page 1 Line 5
    type: money
  - line: "6"  # "$5,500 subtraction for taxpayers 65 and older ($11,000 if married filing jointly and both are 65 and older)"
    field: Page 1 Line 6
    type: money
  - line: "7"  # "Add lines 3 and 4. Then subtract lines 5 and 6. This is your Montana taxable income."
    field: Page 1 Line 7
    type: money
  - line: "8"  # "Tax liability before tax credits (See instructions)"
    field: Page 1 Line 8
    type: money
  - line: "9"  # "Nonrefundable tax credits from Schedule III, Part I, line 14"
    field: Page 1 Line 9
    type: money
  - line: "10"  # "Subtract line 9 from line 8. This is your tax after nonrefundable tax credits."
    field: Page 1 Line 10
    type: money
  - line: 11a  # "Montana income tax withheld from: 11a Form(s) W-2" (inner column)
    field: Page 1 Line 11a
    type: money
  - line: 11b  # "11b Form(s) 1099" (inner column)
    field: Page 1 Line 11b
    type: money
  - line: 11c  # "11c Total pass-through entity tax credit from Montana Schedule(s) K-1" (inner column)
    field: Page 1 Line 11c
    type: money
  - line: 11d  # "11d Total withholding from Montana Schedule(s) K-1" (inner column)
    field: Page 1 Line 11d
    type: money
  - line: 11e  # "11e Loan-out withholding from Form LOWCERT" (inner column)
    field: Page 1 Line 11e
    type: money
  - line: "11"  # "Add lines 11a through 11e"
    field: Page 1 Line 11
    type: money
  - line: "12"  # "2024 estimated tax payments"
    field: Page 1 Line 12
    type: money
  - line: "13"  # "Overpayment applied from 2023 return"
    field: Page 1 Line 13
    type: money
  - line: "14"  # "Extension payment"
    field: Page 1 Line 14
    type: money
  - line: 15.federal_eic  # "15 Earned Income Credit. Federal EIC" -- the mid-row entry box
    field: Page 1 Line 15 EIC
    type: money
  - line: "15"  # "Multiply Federal EIC by 10% (0.10)" -- the line-15 credit box
    field: Page 1 Line 15
    type: money
  - line: "16"  # "Elderly Homeowner/Renter Credit from Schedule 2EC, Line 30"
    field: Page 1 Line 16
    type: money
  - line: "17"  # "Refundable tax credits from Schedule III, Part I, line 17"
    field: Page 1 Line 17
    type: money
  - line: "18"  # "If filing an amended return: payments made with original return"
    field: Page 1 Line 18
    type: money
  - line: "19"  # "Contributions, penalties, interest, and other taxes from Schedule IV, line 8"
    field: Page 1 Line 19
    type: money
  - line: "20"  # "If filing an amended return: previous overpayment"
    field: Page 1 Line 20
    type: money
  - line: "21"  # "Add lines 11 through 18, then subtract line 19 and 20. This is your total payments."
    field: Page 1 Line 21
    type: money
  - line: "22"  # "If line 21 is less than line 10, subtract line 21 from line 10. This is your tax due."
    field: Page 1 Line 22
    type: money
  - line: "23"  # "If line 21 is more than line 10, subtract line 10 from line 21. This is your tax overpaid."
    field: Page 1 Line 23
    type: money
  - line: "24"  # "Enter the amount from line 23 you would like applied to your 2025 estimated taxes"
    field: Page 1 Line 24
    type: money
  - line: "25"  # "Enter the amount you want deposited into a 529 or 529A account"
    field: Page 1 Line 25
    type: money
  - line: "26"  # "Add lines 24 and 25, then subtract from line 23. This is your refund."
    field: Page 1 Line 26
    type: money

  # ============================================ page 2 -- "Montana Individual Income Tax" worksheet (tax_calc.1-13), direct deposit 1-3, 529/529A deposits 4-5, signatures, preparer, third-party designee
  - line: tax_calc.1  # "Enter your total Montana taxable income from page 1, line 7. If zero or less, enter 0 (zero)."
    field: Page 2 Line 1
    type: money
  - line: tax_calc.2  # "Enter your net long-term capital gains from federal Schedule D, line 15 (See instructions)"
    field: Page 2 Line 2
    type: money
  - line: tax_calc.3  # "Enter the lesser of line 1 or line 2"
