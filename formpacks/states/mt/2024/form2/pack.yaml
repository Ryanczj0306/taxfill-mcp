    group: dd529_5_type
  - line: dd529.5.529a  # "529A Achieving a Better Life Experience" (row 5)
    field: Line 3 - 529 or 529A
    type: checkbox
    on_state: "/529A"
    group: dd529_5_type
  - line: dd529.5.routing  # "RTN#" (row 5, comb 9; the widget /Rect is stored top-first)
    field: Line 3 - 529/529A Routing Number
    type: text
    maxlen: 9
    comb: true
  - line: dd529.5.account  # "ACCT#" (row 5, comb 17)
    field: Line 3 - 529/529A Bank Account Number
    type: text
