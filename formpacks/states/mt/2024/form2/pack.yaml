    type: money
  - line: tax_calc.4  # "Subtract line 3 from line 1"
    field: Page 2 Line 4
    type: money
  - line: tax_calc.5  # "Enter the amount for your federal filing status: $20,500 if single or married filing separately / $41,000 if married filing jointly or qualifying surviving spouse / $30,750 if head of household"
    field: Page 2 Line 5
