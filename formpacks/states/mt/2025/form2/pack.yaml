    type: checkbox
    on_state: "/Yes"
  - line: spouse.name.first  # "Spouse's First Name"
    field: "Spouse's First Name"
    type: text
  - line: spouse.name.middle_initial  # "Initial"
    field: "Spouse's Middle Initial"
    type: text
    maxlen: 1
  - line: spouse.name.last  # "Spouse's Last Name"
    field: "Spouse's Last Name"
    type: text
  - line: spouse.identifying_number  # "Social Security Number" on the spouse row
