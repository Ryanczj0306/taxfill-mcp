    on_state: "/Yes"
  - line: mailing_address.street  # "Current mailing address"
    field: Mailing Address
    type: text
  - line: mailing_address.city  # "City"
    field: City
    type: text
  - line: mailing_address.state  # "State" -- a comb widget, but a state abbreviation is letters, so the line is not comb: true (comb lines take digits only)
    field: State
    type: text
    maxlen: 2
  - line: mailing_address.zip  # "ZIP Code + 4" (comb, 9 cells)
    field: Zip+4 Code
    type: text
    maxlen: 9
    comb: true
  - line: filing_status.single  # "Federal Filing Status  Single"
    field: Filing Status
    type: checkbox
    on_state: "/Single"
    group: filing_status
  - line: filing_status.married_filing_jointly  # "Married Filing Jointly" -- the kid's on-state really is /2a (dumped from /AP /N)
    field: Filing Status
    type: checkbox
    on_state: "/2a"
    group: filing_status
  - line: filing_status.married_filing_separately  # "Married Filing Separately"
    field: Filing Status
    type: checkbox
    on_state: "/Married Filing Separately"
    group: filing_status
  - line: filing_status.qualifying_surviving_spouse  # "Qualifying Surviving Spouse"
    field: Filing Status
    type: checkbox
    on_state: "/Qualifying Surviving Spouse"
    group: filing_status
  - line: filing_status.head_of_household  # "Head of Household"
    field: Filing Status
    type: checkbox
    on_state: "/Head of Household"
    group: filing_status
  - line: residency.resident_full_year  # "Residency Status  Resident"
    field: Residency Status
    type: checkbox
    on_state: "/Resident"
    group: residency_status
  - line: residency.resident_part_year  # "Part-year Resident"
    field: Residency Status
    type: checkbox
    on_state: "/Part-year Resident"
    group: residency_status
  - line: residency.mixed_residency  # "Mixed Residency" (new for 2025)
    field: Residency Status
    type: checkbox
    on_state: "/Mixed Residency"
    group: residency_status
  - line: residency.nonresident_full_year  # "Nonresident"
    field: Residency Status
    type: checkbox
    on_state: "/Nonresident"
