    maxlen: 1
  - line: name.last  # "Last Name" -- the SAME field prints in the "Name" header of pages 2, 3 and 5-9 (8 widgets with page 1, one field; page 4 has no header)
    field: "Primary Taxpayer's Last Name"
    type: text
  - line: identifying_number  # "Social Security Number" -- one comb field, its widget repeats in the headers of pages 2, 3 and 5-9 (8 widgets with page 1; page 4 has no header)
