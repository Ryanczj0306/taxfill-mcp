# ===========================================================================
# TY2025 RE-MAP of formpacks/states/mt/2023/form2/pack.yaml (Phase J JS5,
# 2026-10-04; triaged RE-MAP — 713 of the base pack's mapped fields are gone).
# Form 2 was rebuilt between the two blanks. The 2025 face reaches federal
# taxable income first (line 1 "Federal adjusted gross income from Form 1040,
# line 11b", line 2 "Add Form 1040, lines 12e and 13b", line 3 subtracts them;
# lines 4 and 5 adjust "federal taxable income"), prints one money column where
# the 2023 face printed Column A and Column B, and carries its own Schedules
# I-V and 2EC. (knowledge/states/mt/2025.yaml attributes this structure to
# SB 399, in force from 2024; the face itself does not name the law.) This
# pack is therefore a NEW map, built by
# widget position and the printed label beside each widget, then proven on a
# sentinel render of every page. Most 2023 line keys have no counterpart.
#
# URL. source_url below, on the DOR's own revenue.mt.gov host. Three separate
# downloads (two on 2026-10-02, one on 2026-10-04) and the triage copy all hash
# to 4671aef6…6ba2b37 (425,811 bytes, %PDF-1.7, an AcroForm; the DOR ships it
# encrypted with an empty user password). 10 pages.
#
# PRINTED IDENTITY. Page 1 prints "2025 Montana Individual Income Tax Return",
# "Form 2", the stamp "2025v3 12/2025", "For the year Jan 1 – Dec 31, 2025"
# and the scan code *25CE0101*. Pages 2-10 print the footer "Form 2 – Page N –
# 2025" (page 10's footer included) and the scan codes *25CE0201* ... *25CE1001*.
# The schedules are titled "2025 Montana Form 2 Schedule I – Adjustments",
# "Schedule II – Tax on Montana Source Income", "Schedule III – Tax Credits",
# "Schedule IV – Contributions, Penalties, Interest, and Other Taxes",
# "Schedule V – Amended Return Information" and "Schedule 2EC – Elderly
# Homeowner/Renter Credit", each first page stamped 2025v3 12/2025.
# printed_year_verified = 2025.
#
# PAGES (all 10 are the filed return; the DOR's instructions are a separate PDF):
#   p1  identity, amended flag, federal filing status (5 options), residency
#       status (4 options) plus the separate ND Reciprocity and Nonresident
#       Military Spouse boxes, lines 1-26 (11a-11e in an inner column; 15 has
#       a mid-row "Federal EIC" entry box, keyed 15.federal_eic).
#   p2  the "Montana Individual Income Tax" worksheet (keys tax_calc.1-13),
#       direct deposit 1-3 (dd.*), 529/529A deposits printed as rows 4 and 5
#       (dd529.4.* / dd529.5.*; the DOR's field names still say "Line 2" /
#       "Line 3"), signatures, preparer, third-party designee.
#   p3  Schedule I Part I (sched1.1-24) and Part II, the Montana Medical
#       Savings Account adjustment (sched1_part2.1-10).
#   p4-5 Schedule II (sched2.*): the Alternative Method Filer / 30 Day
#       Nonresident Exclusion boxes, residency-change date and states, the
#       Mixed Residency spouse rows, lines 1-25 (6a/6b, 10a/10b, 11a/11b,
#       16a-16c). The lower half of page 5 has no widgets.
#   p6  Schedule III Part I (sched3.1-17) with its confirmation-code, CGR,
#       UCRN, certificate and credit-code boxes.
#   p7  Schedule III Part II, credit for taxes paid to another state or
#       country (sched3_part2.1-21, 3a/3b).
#   p8  Schedule IV (sched4.1a-1d voluntary contributions, 1-8).
#   p9  Schedule V (amended.adjustment_type.* and six form / line / reason rows).
#   p10 Schedule 2EC (sched2ec.*): claimant identity, physical address, five
#       eligibility attestations, household size, lines 1-30.
#
# TOPOLOGY CENSUS against the 2023 blank (11 pages, 791 widgets / 755 fields).
# The 2025 blank: 10 pages, 351 widgets / 314 fields, no ReadOnly widget.
#   * 42 field names survive. 41 mapped ones (identity, address, the filing and
#     residency status fields, the dd / 529 / signature / preparer / designee
#     fields) moved /Rect with the new layout ("Date of Residency Change" moved
#     from page 8 to page 4, "CGR Account ID" from page 9 to page 6); the
#     42nd is the unmapped "Clear Form" pushbutton. Every one was re-read on
#     the render, not carried by name. "Filing Status" changed its on_states
#     from /1 /2a /2b /2c /3 /4 to /Single /2a /Married Filing Separately
#     /Qualifying Surviving Spouse /Head of Household (the "Married Filing
#     Jointly" kid really is /2a); "Residency Status" from /1 /2 /3 to
#     /Resident /Part-year Resident /Mixed Residency /Nonresident.
#   * 713 mapped fields (729 base lines) are GONE with the forms they sat on:
#     the two-column lines 1-27 (Column A / Column B), dependents, exemptions,
#     the 2a payment and refund schedules, the old Schedule 1, the additions,
#     subtractions and tax-benefit recapture schedules, the pension / Social Security
#     benefit / standard-deduction / itemized-deduction worksheets, the ratio
#     and tax-liability schedules, the old nonrefundable-credit, other-state
#     credit, elderly homeowner, long-term-care, payments, contribution,
#     penalty and underpayment-interest sections. Their 2025 successors are
#     the new pages listed above; no 2023 key is reused for a different line.
#   * 285 NEW widgets (272 fields), all mapped. The only unbound field is the
#     surviving "Clear Form" pushbutton (not a return entry): 313 of 314
#     fields bound, 336 lines (56 checkbox lines).
#   * /MaxLen. 62 fields carry one; every pack maxlen equals its widget's
#     /MaxLen (none tighter). 56 of them are comb widgets (/Ff comb bit).
#   * /Ff. 2023's plain text widgets carried 8388608 (DoNotScroll; 629
#     widgets) or 0 (14); 2025's carry 12582912 (DoNotScroll + DoNotSpellCheck;
#     109) or 8388608 (104). Combs keep the flag word 29360128 (63 widgets)
#     and multiline cells 8392704 (the 18 Schedule V cells). /DA stays
#     "/Cour 10 Tf 0 g" on every text widget.
#
# COMBS. Digit combs (SSNs, dates printed M M D D Y Y Y Y, phones, routing and
# account numbers, ZIP+4, the CGR Account ID) are comb: true. Comb widgets
# whose value is not digits only are NOT comb: true, because a comb line takes
# digits only in the filler: the four state-abbreviation boxes, the PTIN, the
# two-letter code boxes (Schedule I lines 6 and 21, Schedule IV line 7), the
# Schedule III confirmation codes, UCRNs, certificate number and credit code
# (the DOR's own keystroke masks take letters there), and the eight ratio
# boxes (Schedule II 17 / 22, Schedule III Part II 6 / 8 / 16 / 18, 2EC 21 /
# 29) whose second cell carries a printed decimal point. A ratio is entered
# with its point and a UCRN with its dashes. A fill of 0.250000, 1.000000,
# 0.123456, 0.654321, 0.500000 and 0.333333 in the six 8-cell boxes, 0.006 in
# 2EC 21 (a Household Income Reduction Table rate) and 0.40 in 2EC 29 (a Credit
# Multiplier Table rate), and two dashed UCRNs, was rendered: every character
# sat in its own cell, the "." and "-" over the printed ones.
#
# FACE DELTAS vs 2023 (re-read on this face). Line 1 "Federal adjusted gross
# income from Form 1040, line 11b"; line 2 "Add Form 1040, lines 12e and 13b";
# line 3 subtracts them; line 6 "$5,660 subtraction for taxpayers 65 and older
# ($11,320 if married filing jointly and both are 65 and older)"; line 8 "Tax
# liability before tax credits", computed on the page-2 worksheet whose line 5
# prints "$21,100 ... $42,200 ... $31,700" and whose lines 8 / 10 print "3%
# (0.03)" and "4.1% (0.041)"; line 15 "Multiply Federal EIC by 10% (0.10)";
# the years on lines 12 ("2025 estimated tax payments"), 13 ("Overpayment
# applied from 2024 return") and 24 ("your 2026 estimated taxes"). Schedule I
# Part II line 2 prints "up to $4,600 per taxpayer"; 2EC line 19 prints the
# standard exclusion 12,600 with no widget, line 25 "15% (0.15)", line 28 "the
# lesser of line 27 or $1,150", the attestation "less than $45,000". These
# agree with knowledge/states/mt/2025.yaml wherever it records them.
#
# RELATIONS follow the printed arithmetic. Line 10 ("Subtract line 9 from line 8.") prints no floor,
# but the 2025 instructions' Schedule III Part I text does ("Nonrefundable credits reduce the amount of
# tax you owe but cannot reduce your tax liability below zero"), so line 10 is floored at zero and line 9
# stays the full Schedule III line 14 (added 2026-10-15; found by the TY2024 port's semantic verify, which
# showed a correct return with credits above the tax failing the unfloored relation). Left out on
# purpose: page 1 line 8
# (residents copy worksheet line 13; other filers use Schedule II), line 15
# (Worksheet A can reduce the credit), worksheet line 1 (page 2 line 1 copies
# page 1 line 7, but the instructions' refund-only paths for North Dakota
# Reciprocity, Nonresident Military Spouse and the 30 Day Nonresident
# Exclusion "Complete page 1, lines 1 through 3 and 7" and skip the
# worksheet), worksheet line 4 (skipped with lines 2-10 when there is no net
# long-term capital gain) and line 13 (nonresidents leave it blank), Schedule
# II's copy lines 18 / 20 / 23, the Schedule II, Schedule III and Schedule 2EC
# ratio products (2EC lines 22 and 30), Schedule IV line 1 (checkbox amounts
# plus other amounts), Schedule III Part II line 3 and Part I line 1
# (the total of every Part II page), and Schedule I Part I line 3 against
# Part II line 8 (line 3 also carries the first-time homebuyer's account
# distribution its second box names, so it equals Part II line 8 only when the
# MSA box alone is marked). Schedule I Part I line 14 == Part II line 4 IS
# declared: Part II line 4 prints "Enter the total on Part I, line 14", and the
# instructions say "When reporting your MSA information, combine the amounts
# for each spouse", so one Part II feeds line 14.
# CROSS_FORM. Line 1 prints "Form 1040, line 11b"; the 2025 Form 1040 defines
# AGI on line 11a and restates it on 11b, so the leg is 1 == f1040.11a.
#
# UNRESOLVED. None on this face. The on_state of the outside-US direct-deposit
# box is /Savings and the Married Filing Jointly status is /2a: both dumped
# from this blank's /AP /N, not guessed.
# ===========================================================================
form: "2"
jurisdiction: states/mt
tax_year: 2025
source_url: https://revenue.mt.gov/files/Forms/Montana-Individual-Income-Tax-Return-Form-2/2025_Montana_Individual_Income_Tax_Return_Form_2.pdf
pdf_sha256: "4671aef667749732670c07fd51cbeed6bc824dc6466cfe19597787b3d6ba2b37"
acroform_root: ''
fields:
