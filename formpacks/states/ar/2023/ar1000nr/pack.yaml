relations:
  # The face's own arithmetic, per column where the line prints columns. Line
  # 23's "Add lines 8 through 22" sums the boxes that exist in each column: 9
  # and 17 are shaded in all three, 18A is shaded in column B.
  - "7c == 7a + 7b"  # 7C "Add lines 7A and 7B"
  - "23.a == 8.a + 10.a + 11.a + 12.a + 13.a + 14.a + 15.a + 16.a + 18a.a + 18b.a + 19.a + 20.a + 21.a + 22.a"  # 23 "TOTAL INCOME: (Add lines 8 through 22)" -- col A
  - "23.b == 8.b + 10.b + 11.b + 12.b + 13.b + 14.b + 15.b + 16.b + 18b.b + 19.b + 20.b + 21.b + 22.b"  # -- col B (18A shades its col-B box)
  - "23.c == 8.c + 10.c + 11.c + 12.c + 13.c + 14.c + 15.c + 16.c + 18a.c + 18b.c + 19.c + 20.c + 21.c + 22.c"  # -- col C
  - "25.a == 23.a - 24.a"  # 25 "Subtract line 24 from line 23" -- col A
  - "25.b == 23.b - 24.b"  # -- col B
  - "25.c == 23.c - 24.c"  # -- col C
  - "30 == 29.a + 29.b"  # 30 "Add amounts from line 29, columns A and B"
  - "33 == 30 + 31 + 32"  # 33 "TOTAL TAX: (Add lines 30 through 32)"
  - "34 == 7c"  # 34 "Enter total from line 7C"
  - "37 == 34 + 35 + 36"  # 37 "TOTAL CREDITS: (Add lines 34 through 36)"
  - "38 == max(0, 33 - 37)"  # 38 "Subtract line 37 from line 33. If line 37 is greater than line 33, enter 0"
  - "38a == 25.c"  # 38A "Enter the amount from line 25, Column C"
  - "38b == 25.a + 25.b"  # 38B "Enter the total amount from line 25, Columns A and B"
  - "44 == 39 + 40 + 41 + 42 + 43"  # 44 "TOTAL PAYMENTS: (Add lines 39 through 43)"
  - "46 == 44 - 45"  # 46 "Subtract line 45 from line 44"
  - "47 == max(0, 46 - 38d)"  # 47 "If line 46 is greater than line 38D, enter difference"
  - "50 == 47 - 48 - 49"  # 50 "Subtract lines 48 and 49 from line 47"
  - "51 == max(0, 38d - 46)"  # 51 "If line 46 is less than line 38D, enter difference"
  - "52c == 51 + 52b"  # 52C "Add lines 51 and 52B"
