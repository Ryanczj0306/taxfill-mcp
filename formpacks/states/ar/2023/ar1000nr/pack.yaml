# ===========================================================================
# Form AR1000NR, 2023 -- Arkansas Individual Income Tax Return, NONRESIDENT AND
# PART YEAR RESIDENT. A NEW pack (Phase J JS5, 2026-10-02): no earlier year of
# this form shipped. formpacks/states/ar/2023/ar1000f (the same state's TY2023
# resident return) set the conventions followed here -- key spelling, identity
# fields, the mailing-address split, maxlen handling -- but no binding was
# carried over from it: the only field names the two blanks share are
# Signature1-3.
#
# URL. The DFA's own file (source_url below). Digest be12df06b15a… -- two
# independent downloads on 2026-10-02 agree.
#
# PRINTED IDENTITY. Page 1 prints "2023 AR1000NR / ARKANSAS INDIVIDUAL INCOME
# TAX RETURN / Nonresident and Part Year Resident" and "Software ID DFA WEB";
# the footers read "AR1000NR, Page 1 (R 7/3/2023)", "AR1000NR, Page 2 (R
# 6/13/2023)" and "AR1000NR, Page 3 (R 7/5/2023)"; the barcodes read ITNR231,
# ITNR232 and ITNR233. printed_year_verified = 2023.
#
# Layout. FLAT AcroForm: acroform_root is empty and the widgets carry generic
# names ("ARNR-1-5", "ARNR-2-31", "ARNR-DD-12" ...) with no line label, so every
# row below was bound by the widget's position against the printed label (the
# blank's text layer) and then confirmed on a sentinel render of every page.
# All three pages are the filed return:
#   page 1 -- header (fiscal-year dates, amended flag, primary / spouse name, MI,
#             SSN and deceased flags, mailing address, foreign-address flag,
#             emails), the remote-worker / military-spouse boxes, the
#             NONRESIDENT / PART YEAR RESIDENT choice with the state of
#             residence and the part-year "From:" / "To:" dates, the 1099-G /
#             booklet / extension boxes, DL# / state ID rows, FILING STATUS 1-6,
#             line 7A personal-credit boxes, the six-row dependents table, 7B, 7C;
#   page 2 -- "Primary SSN" header, INCOME lines 8-25 in THREE columns, TAX
#             COMPUTATION 26-38, APPORTIONMENT 38A-38D;
#   page 3 -- "Primary SSN" header, PAYMENTS 39-46, REFUND OR TAX DUE 47-52C,
#             DIRECT DEPOSIT, the signature block and the paid preparer block.
#
# Columns. Page 2 heads its money columns "(A) Primary/Joint Income", "(B)
# Spouse's Income Status 4 Only" and "(C) Arkansas Income Only". A line's box
# in each is keyed <line>.a / .b / .c (the resident pack's .a / .b spelling plus
# .c for the Arkansas column). The render shows which boxes are shaded, and a
# shaded box has no widget: lines 9 and 17 print only inline "Primary" /
# "Spouse" boxes (keyed .primary / .spouse) with all three columns shaded; 18A
# shades column B (18a.a, 18a.c); 18A and 18B carry inline "Gross" / "Taxable"
# boxes (.gross / .taxable); lines 26-29 shade column C (27-29 are .a / .b);
# lines 30-38D are one right-hand box each (bare keys).
#
# Coverage. The blank holds 261 widget entries on 248 field names. Mapped: 254
# lines on 243 fields. NOT mapped (5 fields): "Print Button" and "Clear Button"
# (the yellow PRINT FORM / CLEAR FORM pushbuttons above the title), and
# Signature1 / Signature2 / Signature3, the primary, spouse and paid-preparer
# signature boxes: they are /Sig (digital-signature) fields, and a sentinel
# written to each did not render at all, so a key there would accept a value
# that never prints. The boxes are signed by hand; the Date / Telephone / PTIN
# boxes beside them are ordinary text fields and are mapped. No widget is
# ReadOnly and none sets the comb flag.
#
# Money vs text. Every numbered dollar box prints a "00" cents cell and is
# `money`. Line 38C "Divide line 38A by 38B" is a ratio: the 2023 instructions
# booklet says "Enter as a decimal rounded to six places. Do not exceed 100%",
# so ARNR-2-78 stays `text` (money would round 0.166667 to 0). The 7A / 7B
# "X $29 =" count boxes hold a count (`text`): ARNR-49 carries /MaxLen 2, which
# the pack repeats; ARNR-1-69 is the same 13.3 pt box but carries /MaxLen 10
# and an auto-size font, so the pack sets maxlen 2 (tighter than the widget,
# adjudicated in the maxlen test) rather than let a long value shrink. Name,
# address, email, date, phone, PTIN, the line-43 certification number and the
# 52A exception code are `text`; the routing / account cells are one-character
# text boxes (/MaxLen 1 each). The dates print "(mm/dd/yyyy)" captions over
# plain boxes, so they are not combs.
#
# SSN. ARNR-1-9 is ONE field whose widgets are page 1's "Primary's social
# security number" and the "Primary SSN" headers of pages 2 and 3, so the one
# key `identifying_number` fills all three (no page mirror key is needed).
# The SSN boxes are plain text widgets, mapped with format: ssn_digits_only.
#
# Checkboxes. Each option is bound to the label printed beside it, read by
# position (P-030), and every on_state was read from this blank's /AP /N:
#   * ARNR-21 (/Non "NONRESIDENT:", /Part "PART YEAR RESIDENT:"), ARNR-34
#     filing status (/1 ... /6), ARNR-2-59 (/Choice1 "Low income table ($0)",
#     /Choice2 "Standard deduction", /Choice3 "Itemized deductions"), ARNR-DD-2
#     and ARNR-DD-30 (/Checking, /Savings) and ARNR-1-102 preparer discuss (/Yes,
#     /No) are radio fields; each carries one `group` id. A fill of every
#     non-first option was rendered and each X sat beside its own label;
#   * every other box is its own /Btn field with the single state /Yes (or, for
#     the remote-worker / military-spouse boxes, /Yes beside /Off): amended,
#     deceased x2, outside-U.S., the four "Primary - / Spouse - Remote Worker /
#     Military Spouse" boxes (each sits RIGHT of its label), the 1099-G /
#     booklet / extension requests, the eleven 7A boxes, and the
#     foreign-account direct-deposit box.
#
# Relations follow the face's printed arithmetic (dotted keys since Phase J
# JP5c); the apportionment block is covered by 38A and 38B. Omitted, with the
# reason:
#   38C and 38D -- 38C is a `text` ratio and verify reads only MONEY lines from
#     the filled PDF, so "38d == 38 * 38c" would see 38C as blank (0) on an
#     ordinary fill and FAIL a correct return. Rewritten as 38 * 38A / 38B it
#     divides by zero when 38B is blank and skips the printed six-place
#     rounding, so a product near a .50 boundary could round the other way;
#   28 "Subtract line 27 from line 25" -- the face prints no floor, and the
#     booklet sends itemizers to "the larger of your itemized deductions (from
#     Form AR3) or your Standard Deduction" with no cap at line 25;
#   7A / 7B (count X $29) -- the count is a `text` box;
#   18A / 18B -- the result depends on the $6,000 exclusion and on Gross vs
#     Taxable, which the face does not reduce to one expression.
#
# Cross_form: none. The face cites no federal line: it prints "ATTACH PAGE 1
# AND 2 OF YOUR FEDERAL RETURN" and "Attach federal Sch. C / D / E / F", and
# builds income line by line from its own lines 8-22.
#
# Mailing is printed on page 3 ("Mail Return & Payment to:"): "Refund:
# Arkansas State Income Tax, P.O. Box 1000, Little Rock, AR 72203-1000" and
# "Tax Due/No Tax: Arkansas State Income Tax, P.O. Box 2144, Little Rock, AR
# 72203-2144". A return that neither pays nor claims a refund goes to the Tax
# Due/No Tax box, so no_payment names both cases.
#
# Face figures against knowledge/states/ar/2023.yaml: the $29 per 7A box and
# per dependent (7A / 7B "X $29 =") and the "Less $6,000" on 18A / 18B match
# the knowledge pack's $29 personal tax credit and $6,000 retirement exemption.
# The face prints the year words "widowed before 2023 or divorced at end of
# 2023", "credit brought forward from 2022" (line 40) and "applied to 2024
# estimated tax" (line 48).
form: "AR1000NR"
jurisdiction: states/ar
tax_year: 2023
source_url: https://www.dfa.arkansas.gov/wp-content/uploads/2023_AR1000NR_PartYear_or_Non-ResidentIndividualIncomeTaxReturn.pdf
pdf_sha256: "be12df06b15ac06d62121a57a9f65972f04b98933d6643c7d9b355c9daba1862"
acroform_root: ''
fields:
  # ============================================ page 1 -- header
  - { line: "tax_year_end_date", field: "ARNR-1-1", type: text }  # "Jan. 1 - Dec. 31, 2023 or fiscal year ending ____"
  - { line: "tax_year_end_year", field: "ARNR-1-2", type: text, maxlen: 2 }  # ", 20 __" (2-digit year; /MaxLen 2)
  - { line: "amended_return.yes", field: "ARNR-1-3", type: checkbox, on_state: "/Yes" }  # "CHECK BOX IF AMENDED RETURN"
  # ---- primary name + deceased + SSN
  - { line: "name", field: "ARNR-1-5", type: text }  # "Primary's legal first name" (identity name)
  - { line: "name.primary_mi", field: "ARNR-1-6", type: text, maxlen: 1 }  # MI (/MaxLen 1)
  - { line: "name.primary_last", field: "ARNR-1-7", type: text }  # Last name
  - { line: "deceased.primary", field: "ARNR-1-8", type: checkbox, on_state: "/Yes" }  # "Check if Deceased" (primary row; label right of the box)
  - { line: "identifying_number", field: "ARNR-1-9", type: text, format: "ssn_digits_only" }  # "Primary's social security number" -- one field, also the page-2 and page-3 "Primary SSN" header
  # ---- spouse name + deceased + SSN
  - { line: "spouse.name", field: "ARNR-1-10", type: text }  # "Spouse's legal first name"
  - { line: "spouse.name_mi", field: "ARNR-1-11", type: text, maxlen: 1 }  # MI (/MaxLen 1)
  - { line: "spouse.name_last", field: "ARNR-1-12", type: text }  # Last name
  - { line: "deceased.spouse", field: "ARNR-1-13", type: checkbox, on_state: "/Yes" }  # "Check if Deceased" (spouse row)
  - { line: "spouse.identifying_number", field: "ARNR-1-14", type: text, format: "ssn_digits_only" }  # "Spouse's social security number"
  # ---- address
  - { line: "mailing_address.street", field: "ARNR-1-15", type: text }  # "Mailing address (number and street, P.O. box or rural route)"
  - { line: "mailing_address.outside_us", field: "ARNR-1-19", type: checkbox, on_state: "/Yes" }  # "Check if address is outside U.S."
  - { line: "mailing_address.city", field: "ARNR-1-16", type: text }  # City
  - { line: "mailing_address.state", field: "ARNR-1-17", type: text }  # State or province
  - { line: "mailing_address.zip", field: "ARNR-1-18", type: text }  # ZIP
  - { line: "mailing_address.foreign_country", field: "ARNR-1-20", type: text }  # "Foreign country name"
  - { line: "primary_email", field: "ARNR-1-20A", type: text }  # "Primary email"
  - { line: "secondary_email", field: "ARNR-1-20B", type: text }  # "Secondary email"
  # ---- remote worker / military spouse (one box per person; each box sits RIGHT of its label)
  - { line: "remote_worker.primary", field: "ARNR-1-20C", type: checkbox, on_state: "/Yes" }  # "Primary - Remote Worker"
  - { line: "remote_worker.spouse", field: "ARNR-1-20C-2", type: checkbox, on_state: "/Yes" }  # "Spouse - Remote Worker"
  - { line: "military_spouse.primary", field: "ARNR-1-20D", type: checkbox, on_state: "/Yes" }  # "Primary - Military Spouse"
  - { line: "military_spouse.spouse", field: "ARNR-1-20D-2", type: checkbox, on_state: "/Yes" }  # "Spouse - Military Spouse"
  # ---- residency (one radio field ARNR-21; each oval sits LEFT of its label)
  - { line: "residency_status.nonresident", field: "ARNR-21", type: checkbox, on_state: "/Non", group: "residency_status" }  # "NONRESIDENT:"
  - { line: "residency_status.part_year_resident", field: "ARNR-21", type: checkbox, on_state: "/Part", group: "residency_status" }  # "PART YEAR RESIDENT: Dates lived in AR:"
  - { line: "nonresident.state_of_residence", field: "ARNR-1-22", type: text }  # "List state of residence:" (/MaxLen 10); the box is 43.4 pt wide at a fixed Arial Bold 9 -- enter the two-letter postal code (a long state name may clip)
  - { line: "part_year.date_from", field: "ARNR-1-24", type: text }  # part-year "From:" (/MaxLen 10)
  - { line: "part_year.date_to", field: "ARNR-1-25", type: text }  # part-year "To:" (/MaxLen 10)
  # ---- request checkboxes
  - { line: "request_1099g.yes", field: "ARNR-25A", type: checkbox, on_state: "/Yes" }  # "Check the box if you still want us to mail you a paper Form 1099-G next year."
  - { line: "request_tax_booklet.yes", field: "ARNR-25B", type: checkbox, on_state: "/Yes" }  # "Check here if you want a tax booklet mailed to you next year."
  - { line: "filed_extension.yes", field: "ARNR-25C", type: checkbox, on_state: "/Yes" }  # "Check this box if you have filed a state extension or an automatic federal extension"
  # ---- driver license / state ID rows (primary then spouse)
  - { line: "drivers_license.primary_number", field: "ARNR-1-26", type: text }  # "DL# / State ID" (primary)
  - { line: "drivers_license.primary_state", field: "ARNR-1-27", type: text, maxlen: 2 }  # "Your state" (/MaxLen 2)
  - { line: "drivers_license.primary_issue_date", field: "ARNR-1-28", type: text }  # "Issue date (mm/dd/yyyy)"
  - { line: "drivers_license.primary_expiration_date", field: "ARNR-1-29", type: text }  # "Expiration date (mm/dd/yyyy)"
  - { line: "drivers_license.spouse_number", field: "ARNR-1-30", type: text }  # "DL# / State ID" (spouse)
  - { line: "drivers_license.spouse_state", field: "ARNR-1-31", type: text, maxlen: 2 }  # "Spouse state" (/MaxLen 2)
  - { line: "drivers_license.spouse_issue_date", field: "ARNR-1-32", type: text }  # "Issue date (mm/dd/yyyy)"
  - { line: "drivers_license.spouse_expiration_date", field: "ARNR-1-33", type: text }  # "Expiration date (mm/dd/yyyy)"
  # ---- FILING STATUS (one radio field ARNR-34, six kids; options 1-3 left column, 4-6 right)
  - { line: "filing_status.single", field: "ARNR-34", type: checkbox, on_state: "/1", group: "filing_status" }  # 1 Single (Or widowed before 2023 or divorced at end of 2023)
  - { line: "filing_status.married_filing_joint", field: "ARNR-34", type: checkbox, on_state: "/2", group: "filing_status" }  # 2 Married filing joint (Even if only one had income)
  - { line: "filing_status.head_of_household", field: "ARNR-34", type: checkbox, on_state: "/3", group: "filing_status" }  # 3 Head of household
  - { line: "filing_status.married_filing_separately_same_return", field: "ARNR-34", type: checkbox, on_state: "/4", group: "filing_status" }  # 4 Married filing separately on the same return
  - { line: "filing_status.married_filing_separately_different_returns", field: "ARNR-34", type: checkbox, on_state: "/5", group: "filing_status" }  # 5 Married filing separately on different returns
  - { line: "filing_status.surviving_spouse", field: "ARNR-34", type: checkbox, on_state: "/6", group: "filing_status" }  # 6 Surviving spouse with dependent child
  - { line: "filing_status.head_of_household_child_name", field: "ARNR-1-35", type: text }  # status 3: "enter child's name here"
  - { line: "filing_status.separate_spouse_name", field: "ARNR-1-36", type: text }  # status 5: "Enter spouse's name here and SSN above"
  - { line: "filing_status.surviving_spouse_year_died", field: "ARNR-1-37", type: text, maxlen: 4 }  # status 6: "Year spouse died" (/MaxLen 4)
  # ---- line 7A personal-tax-credit checkboxes (top row = Yourself, bottom row = Spouse; each box LEFT of its label)
  - { line: "7a.yourself", field: "ARNR-38", type: checkbox, on_state: "/Yes" }  # 7A Yourself
  - { line: "7a.yourself_65_or_over", field: "ARNR-40", type: checkbox, on_state: "/Yes" }  # Yourself 65 or over
  - { line: "7a.yourself_65_special", field: "ARNR-42", type: checkbox, on_state: "/Yes" }  # Yourself 65 Special
  - { line: "7a.yourself_blind", field: "ARNR-44", type: checkbox, on_state: "/Yes" }  # Yourself Blind
  - { line: "7a.yourself_deaf", field: "ARNR-46", type: checkbox, on_state: "/Yes" }  # Yourself Deaf
  - { line: "7a.head_of_household_surviving_spouse", field: "ARNR-48", type: checkbox, on_state: "/Yes" }  # Head of household/surviving spouse (Filing status 3 only) (Filing status 6 only)
  - { line: "7a.spouse", field: "ARNR-39", type: checkbox, on_state: "/Yes" }  # 7A Spouse
  - { line: "7a.spouse_65_or_over", field: "ARNR-41", type: checkbox, on_state: "/Yes" }  # Spouse 65 or over
  - { line: "7a.spouse_65_special", field: "ARNR-43", type: checkbox, on_state: "/Yes" }  # Spouse 65 Special
  - { line: "7a.spouse_blind", field: "ARNR-45", type: checkbox, on_state: "/Yes" }  # Spouse Blind
  - { line: "7a.spouse_deaf", field: "ARNR-47", type: checkbox, on_state: "/Yes" }  # Spouse Deaf
  - { line: "7a.count", field: "ARNR-49", type: text, maxlen: 2 }  # 7A "Multiply number of boxes checked" count (/MaxLen 2)
  - { line: "7a", field: "ARNR-50", type: money }  # 7A amount (count X $29 =)
  # ---- Dependents table (6 printed rows: first name/last name, SSN, relationship)
  - { line: "dependent_1.first_name", field: "ARNR-1-51", type: text }  # row 1. ONE cell spans both printed heads "First name" and "Last name" -- it takes the full name (key spelled as the resident pack's)
  - { line: "dependent_1.ssn", field: "ARNR-1-52", type: text, format: "ssn_digits_only" }  # "Dependent's social security number"
  - { line: "dependent_1.relationship", field: "ARNR-1-53", type: text }  # "Dependent's relationship to you"
  - { line: "dependent_2.first_name", field: "ARNR-1-54", type: text }  # row 2.
  - { line: "dependent_2.ssn", field: "ARNR-1-55", type: text, format: "ssn_digits_only" }
  - { line: "dependent_2.relationship", field: "ARNR-1-56", type: text }
  - { line: "dependent_3.first_name", field: "ARNR-1-57", type: text }  # row 3.
  - { line: "dependent_3.ssn", field: "ARNR-1-58", type: text, format: "ssn_digits_only" }
  - { line: "dependent_3.relationship", field: "ARNR-1-59", type: text }
  - { line: "dependent_4.first_name", field: "ARNR-1-60", type: text }  # row 4.
  - { line: "dependent_4.ssn", field: "ARNR-1-61", type: text, format: "ssn_digits_only" }
  - { line: "dependent_4.relationship", field: "ARNR-1-62", type: text }
  - { line: "dependent_5.first_name", field: "ARNR-1-63", type: text }  # row 5.
  - { line: "dependent_5.ssn", field: "ARNR-1-64", type: text, format: "ssn_digits_only" }
  - { line: "dependent_5.relationship", field: "ARNR-1-65", type: text }
  - { line: "dependent_6.first_name", field: "ARNR-1-66", type: text }  # row 6.
  - { line: "dependent_6.ssn", field: "ARNR-1-67", type: text, format: "ssn_digits_only" }
  - { line: "dependent_6.relationship", field: "ARNR-1-68", type: text }
  - { line: "7b.count", field: "ARNR-1-69", type: text, maxlen: 2 }  # 7B "Multiply number of DEPENDENTS from above" count (13.3 pt box, auto-size font; /MaxLen 10, pack maxlen 2 like 7A's)
  - { line: "7b", field: "ARNR-1-70", type: money }  # 7B amount (count X $29 =)
  - { line: "7c", field: "ARNR-1-71", type: money }  # 7C TOTAL PERSONAL TAX CREDITS (Add lines 7A and 7B. Enter total here and on line 34)
  # ============================================ page 2 -- income / tax computation / apportionment
  # column (A) Primary/Joint Income = .a; (B) Spouse's Income, Status 4 Only = .b; (C) Arkansas Income Only = .c
  - { line: "8.a", field: "ARNR-2-1", type: money }  # 8 Wages, salaries, tips, etc. (Attach W-2s) -- col A
  - { line: "8.b", field: "ARNR-2-2", type: money }  # -- col B
  - { line: "8.c", field: "ARNR-2-3", type: money }  # -- col C (Arkansas)
  - { line: "9.primary", field: "ARNR-2-4", type: money }  # 9 Military pay: Primary (inline box; the row's A/B/C boxes are shaded)
  - { line: "9.spouse", field: "ARNR-2-5", type: money }  # 9 Military pay: Spouse (inline box)
  - { line: "10.a", field: "ARNR-2-6", type: money }  # 10 Interest income (If over $1,500, attach AR4) -- col A
  - { line: "10.b", field: "ARNR-2-7", type: money }  # -- col B
  - { line: "10.c", field: "ARNR-2-8", type: money }  # -- col C (Arkansas)
  - { line: "11.a", field: "ARNR-2-9", type: money }  # 11 Dividend income (If over $1,500, attach AR4) -- col A
  - { line: "11.b", field: "ARNR-2-10", type: money }  # -- col B
  - { line: "11.c", field: "ARNR-2-11", type: money }  # -- col C (Arkansas)
  - { line: "12.a", field: "ARNR-2-12", type: money }  # 12 Alimony and separate maintenance received -- col A
  - { line: "12.b", field: "ARNR-2-13", type: money }  # -- col B
  - { line: "12.c", field: "ARNR-2-14", type: money }  # -- col C (Arkansas)
  - { line: "13.a", field: "ARNR-2-15", type: money }  # 13 Business or professional income (Attach federal Sch. C) -- col A
  - { line: "13.b", field: "ARNR-2-16", type: money }  # -- col B
  - { line: "13.c", field: "ARNR-2-17", type: money }  # -- col C (Arkansas)
