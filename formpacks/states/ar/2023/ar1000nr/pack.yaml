  - { line: "16.c", field: "ARNR-2-26", type: money }  # -- col C (Arkansas)
  - { line: "17.primary", field: "ARNR-2-27", type: money }  # 17 Military retirement: Primary (inline box; the row's A/B/C boxes are shaded)
  - { line: "17.spouse", field: "ARNR-2-28", type: money }  # 17 Military retirement: Spouse (inline box)
  - { line: "18a.gross", field: "ARNR-2-29", type: money }  # 18A Primary employer pension plan(s)/qualified IRA(s): Gross
  - { line: "18a.taxable", field: "ARNR-2-30", type: money }  # 18A Taxable (Less $6,000)
  - { line: "18a.a", field: "ARNR-2-31", type: money }  # 18A result -- col A (col B is shaded)
  - { line: "18a.c", field: "ARNR-2-32", type: money }  # 18A result -- col C (Arkansas)
  - { line: "18b.gross", field: "ARNR-2-33", type: money }  # 18B Spouse employer pension plan(s)/qualified IRA(s): Gross
  - { line: "18b.taxable", field: "ARNR-2-34", type: money }  # 18B Taxable (Less $6,000)
  - { line: "18b.a", field: "ARNR-2-35", type: money }  # 18B result -- col A
