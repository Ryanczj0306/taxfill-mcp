# ===========================================================================
# Form 500, 2025 — Georgia Individual Income Tax Return (with Schedules 1, 2,
# 2B, 3, the IND-CR individual credit forms 201-214, the IND-CR Summary
# Worksheet, Schedule 4 Net Operating Loss Application, and the 525-TV
# Individual/Fiduciary Payment Voucher) — the full 28-page fillable web PDF.
#
# Authored via the taxfill pipeline: `taxfill introspect` (sentinel sweep —
# every widget rendered with its own field name) -> vision-map workflow (all
# 28 pages + zoomed crops read to place each field on its printed line /
# column) -> this map -> golden round-trip + adversarial audit. Ported to
# 2025 by the JS5 census + a sentinel render of every page (see above).
#
# Layout. Flat AcroForm (acroform_root empty; field names are the raw opaque
# sentinel ids the form ships with, e.g. "TP_FIRSTNAME", "L8", "S1L7A",
# "CRP12L1A", "S4P3L4B"). The main return (pages 1-5) has THREE amount
# columns only on Schedule 3 (part-year/nonresident: A/B/C) and on the
# Schedule 1 retirement worksheets (TAXPAYER / SPOUSE); everywhere else each
# printed line is a single widget and the line key is the printed line number
# ("L8" widget -> line "8", "S1L1" -> "s1.1", etc.). Navigation/print/reset
# widgets and the duplicate page-10 field names are intentionally NOT mapped
# (see Coverage).
#
# Coverage. The blank PDF exposes 606 AcroForm field objects (pypdf
# get_fields), 559 distinct widget names. Mapped here: every fillable DATA
# widget — taxpayer/spouse identity and the page-header SSN mirror, the
# numbered income/tax/credit/payment lines and their sub-boxes, the six
# income-statement (W-2/1099/G2) blocks, every Schedule 1/2/2B/3 line, all
# eleven IND-CR credit forms (201-204, 206-209, 212-214; the 2023 banner said
# twelve) and the IND-CR Summary Worksheet, all four Schedule 4 NOL pages,
# and the 525-TV payment voucher. Each radio/choice
# question (the six CB_WH_TYPE_* withholding types, the six CB_ID_TYPE_*
# FEIN/SSN selectors, CB_DD_TYPE checking/savings, CB_DEDUCTION_TYPE
# itemized/standard/Georgia, CB_CARRIED_FORWARD yes/no) is ONE /Btn field;
# every option is mapped as its own checkbox line on that shared field with
# the exact on_state read from the widget /AP /N dicts, and the filler
# enforces single-selection within the shared `group`.
#
# Intentionally NOT mapped (none accept taxpayer data):
#   * JavaScript PUSHBUTTONS (Ff bit-17 set): the per-page "printlid.<n>"
#     print lids, "RESET PAGE", "BTPRINT", "VERCTRL", and the "GoTo Page
#     1/2/3/3a" navigation links. Their only "on_state" is the
#     appearance-stream dictionary key "/BBox". (The 2023 blank's on-screen
#     calculator keypad is gone from this one.)
#   * "Name Change" — Ff 65536 (bit-17 pushbutton) with NO /AP /N states; it
#     is a UI toggle, not a fillable checkbox (/TU "Goto IT-511 Tax Booklet
#     Name Change Sect...").
#   * The "UF_*" user-form controls: "UF_Start"/"UF_Reset" (/BBox
#     pushbuttons), "UF_L1A".."UF_L4B" (Ff 65537 pushbuttons), and the
#     "UF_InfoA"/"UF_InfoB" hidden control text fields.
#   * The /Btn "link" widgets "Form 500 Schedule 1" and "Additonal Schedule
#     2" (their states are appearance-dict keys only — they jump to a page).
#   * "SCANLINE" (Ff 8388609, ReadOnly) — the machine-generated voucher scan
#     line, computed by the form, never typed.
#   * The duplicate "P10.Page3.*" names pypdf reports for the page-10
#     Schedule-2 widgets (31 of them, e.g. "P10.Page3.S2L2", beside the
#     "P10.Page3" parent and "P10.Page3.Additonal Schedule 2"): the same logical
#     widgets are mapped once under their bare names (S2L1_CREDITCODE, S2L9,
#     S2L12, ...).
#   * Schedule 4 Part I line 5 (S4P1L5): printed "Reserved", Hidden, and
#     outside line 6's "Total of Lines 1 - 4" (see the port banner).
# No pre-printed statutory constants are mapped: the per-rotation factors
# "X 500", "X 1000", "X 375", "X 750" (IND-CR 212), the 50%/10%/33.33% rate lines (IND-CR 202/
# 204/209) and the 150/500 maximum-credit lines (IND-CR 204/206) print as
# fixed text with NO widget, and the hatched Schedule-4 cells (pages 3 and 4,
# Part III line 3 column (a) and lines 12-13 column (b)) carry no field. (The
# IND-CR Summary line 5 prints "Reserved" over a hatched box but still ships a
# widget, SUML5 — Hidden and ReadOnly in both 2023 and 2025 — and line 13
# totals "Lines 1 through 12", so it stays mapped as a leave-blank line. So
# does IND-CR 213 line 2, "Enter $2,000 per qualified foster child (for years
# after first five taxable years of adoption)", whose box is hatched and whose
# widget CRP13L2 is Hidden in both years.)
#
# Money vs text. Every dollar box is mapped `money` (each prints to a wide
# right-justified amount cell), EXCEPT a few small capped-credit cells whose
# AcroForm /MaxLen is only 3-4 characters and so physically cannot hold a
# four-digit dollar amount — Form 500 line 17 (Low Income Credit, /MaxLen 3),
# the four IND-CR 201 boxes (CRP1L1..L4, /MaxLen 3, credit capped at $500), and
# the seven IND-CR 212 per-rotation amounts (CRP12L1A..L1C, /MaxLen 4, capped
# at $8,500). Those are mapped `text` with the widget's own maxlen so the
# clipping scan enforces the form's real cell limit. Genuine text widgets stay
# `text`: names,
# address/city/state/ZIP, SSN/FEIN boxes (maxlen 9-11), driver's-license
# id, dates (birth/disability/signature/death), the residency-status number,
# the filing-status letter, the single-letter credit/deduction codes, the
# 1- and 2-digit count boxes (dependent counts, the two "number from Line 7c"
# cells, the IND-CR 212 rotation-count boxes), the company/relationship/
# county/practice text, the preparer block, the bank routing (9) / account
# (17) numbers, the voucher name/address block, and the phone numbers. The
# voucher/header dropdowns (TAXTYPE, YY tax-year, STATELIST, the *_REL_LST
# relationship pickers, and the S2/S2B credit-code pickers) are AcroForm /Ch
# choice widgets; the filler writes their /V as text, so they are mapped
# `text`.
#
# Relations. Only printed arithmetic that holds on EVERY filing path is
# declared — a part-year/nonresident filer omits lines 9-14 and uses
# Schedule 3, and a schedule the filer does not use reads as zeros. Declared:
# 28 = 24 + 25 + 26 + 27 ("Add Lines 24, 25, 26 and 27"), and, since dotted
# line ids evaluate (Phase J JP5c), the schedule sub-totals the face prints —
# Schedule 1 lines 6 ("sum of Lines 1-5"), 13 ("sum of Lines 7-12", i.e.
# 7a-7f and 8-12) and 14 ("Line 6 less Line 13"); Schedule 2 and 2B line 9
# ("sum of Lines 2 through 8"); Schedule 3 line 5 in each column ("TOTAL
# LINES 1 THRU 4"), its header rule "Column A must equal Column B plus
# Column C." on the income lines 1-5 (added by the fixer pass), 12 ("Add
# Lines 10 and 11") and 14 ("Subtract Line 13
# from Line 8, Column C"); the IND-CR Summary line 13 ("Total of Lines 1
# through 12") and its carry to line 20 (the summary prints "Enter here and on
# Form 500/500X, Page 3 Line 20"; line 20 is "Credits used from IND-CR Summary
# Worksheet"); and Schedule 4 Part II lines 10 ("Add Lines 1 - 9") and 17
# ("Add Lines 11-16"). The form's own JavaScript computes each of these the
# same way (L20 and SUML12 take the same running sum). The line-20 carry
# is the one relation that spans the return and a worksheet: the summary
# page also prints "Keep IND-CR Summary Worksheet for your records", so a
# fill that enters line 20 and a credit form but leaves the worksheet
# blank reports "20 == indcr_summary.13 FAIL ... blank-as-zero:
# indcr_summary.13" (measured: {20: 500, indcr201.3: 500} -> report.ok
# False; with indcr_summary.1 and .13 = 500 every relation passes). The
# worksheet lives on the same filed PDF and the DOR JavaScript always fills
# both, so the carry stays declared; dropping it for symmetry with lines 9
# and 21 (no sibling relation, see below) is the integrator's call. OMITTED per the
# conservative house style: arithmetic that holds only on the full-year path
# (10, 13, 14 and 15a's "Line 13 less Line 14", and line 9, so Schedule 1
# line 14 "Enter Net Total here and on Line 9" is not a relation either;
# "Omit Lines 9 thru 14 ... if you are a part-year or nonresident filer"),
# floors and caps (22 "cannot exceed Line 16", 23
# "if zero or less", the "lesser of" credit lines, Schedule 4 Part II line
# 18), the owe-vs-refund branches (29, 30, 45, 46), the "if applicable"
# Schedule 2/2B carryovers, Schedule 3 line 8's "PLUS OR MINUS" (and the
# column rule on its adjustment lines 6-8, which that row feeds), and the
# percentage lines (Schedule 3 lines 9 and 13, IND-CR 202/204/209). Not
# declared either, as in 2023: the arithmetic inside the individual IND-CR
