  - { line: "25", field: Form Question 25, type: money }  # Other Prepayments (amount)
  - { line: "26", field: Form Question 26, type: money }  # Gross Conservation Easement Credit from the DR 1305G line 33
  - { line: "27", field: Form Question 27, type: money }  # Innovative Motor Vehicle and Innovative Truck Credit for a vehicle you purchased or leased from form DR 0617
  - { line: "28", field: Form Question 28, type: money }  # Refundable Credits from the DR 0104CR line 23
  - { line: "29", field: Form Question 29, type: money }  # Additional credit from form DR 0619, line 3 and 10
  - { line: "30", field: Form Question 30, type: money }  # Subtotal, sum of lines 21 through 29
  - { line: "31", field: Form Question 31, type: money }  # Federal Adjusted Gross Income from your federal income tax form — 1040, 1040 SR, or 1040 SP line 11
  - { line: "32", field: Form Question 32, type: money }  # Nontaxable Social Security Income
  - { line: "33", field: Form Question 33, type: money }  # Nontaxable interest income from state and local bonds
  - { line: "34", field: Form Question 34, type: money }  # Sum of lines 31 through 33 — Modified AGI for TABOR amount (the widget tooltip says "30 through 33": a DOR copy error; the printed caption and the relation 34 == 31 + 32 + 33 govern)

  # ============================================ page 6 — TABOR lines 35-39 and Direct Deposit (RB1/RB2/RB3 are SEPARATE fields; the blank's /Bl
  #  scripts make them exclusive: group direct_deposit_type)
  - { line: "35", field: Form Question 35, type: money }  # TABOR State Sales Tax Refund (amount from the Modified A G I Tiers table)
  - { line: "36", field: Form Question 36, type: money }  # Sum of lines 30 and 35
  - { line: "37", field: Form Question 37, type: money }  # Overpayment, if line 36 is greater than line 20 then subtract line 20 from line 36
  - { line: "38", field: Form Question 38, type: money }  # Estimated Tax Credit Carryforward to 2025 first quarter, if any
  - { line: "39", field: Form Question 39, type: money }  # Refund, subtract line 38 from line 37
  - { line: direct_deposit_routing_number, field: Routing Number 4, type: text, maxlen: 9, comb: true }  # "Routing Number" (comb, /MaxLen 9)
  - { line: direct_deposit_account_number, field: Acount Number 4, type: text, maxlen: 17, comb: true }  # "Account Number" (comb, /MaxLen 17; "Acount" is the DOR's spelling)
  - { line: "direct_deposit_type::checking", field: RB1, type: checkbox, on_state: /1, group: direct_deposit_type }  # "Type: Checking"
  - { line: "direct_deposit_type::savings", field: RB2, type: checkbox, on_state: /2, group: direct_deposit_type }  # "Type: Savings"
  - { line: "direct_deposit_type::collegeinvest", field: RB3, type: checkbox, on_state: /3, group: direct_deposit_type }  # "Type: CollegeInvest 529"

  # ============================================ page 7 — lines 40-44
  - { line: "40", field: Form Question 40, type: money }  # Net Tax Due, subtract line 36 from line 20
  - { line: "41", field: Form Question 41, type: money }  # Delinquent Payment Penalty (see instructions)
  - { line: "42", field: Form Question 42, type: money }  # Delinquent Payment Interest (see instructions)
  - { line: "43", field: Form Question 43, type: money }  # Estimated Tax Penalty, you must submit the DR 0204 (the widget tooltip repeats line 42's "Delinquent Payment Interest": a DOR copy error; the printed caption governs)
  - { line: "44", field: Form Question 44, type: money }  # Amount You Owe, sum of lines 40 through 43 (no printed cents box)

  # ============================================ page 7 — Third Party Designee (RB4 / RB5 are SEPARATE fields; each one's /Bl
  #  script turns the other Off: group third_party_designee)
  - { line: "third_party_designee::no", field: RB4, type: checkbox, on_state: /1, group: third_party_designee }  # "No"
  - { line: "third_party_designee::yes", field: RB5, type: checkbox, on_state: /2, group: third_party_designee }  # "Yes. Complete the following:"
  - { line: designee_name, field: "Designee’s Name 2", type: text }  # "Designee's Name"
  - { line: designee_phone_number, field: Phone Number of designee 2, type: text }  # designee "Phone Number"

  # ============================================ page 8 — Sign Below (the signatures themselves are not widgets)
  - { line: your_signature_date, field: Date of Your Signature 2, type: text }  # "Your Signature … Date (MM/DD/YY)" — the face and the tooltip ask for a two-digit year; the box also holds a four-digit one
  - { line: spouse_signature_date, field: Date of Signature for Spouse 2, type: text }  # "Spouse's Signature … Date (MM/DD/YY)" — two-digit year on the face, as above

  # ============================================ page 8 — paid preparer
  - { line: preparer_name, field: "Paid Preparer’s Name 2", type: text }  # "Paid Preparer's Name"
  - { line: preparer_phone, field: "Paid Preparer’s Phone Number 2", type: text }  # "Paid Preparer's Phone"
  - { line: preparer_address, field: "Paid Preparer’s Address: Street 2", type: text }  # "Paid Preparer's Address"
  - { line: preparer_city, field: City 6, type: text }  # preparer "City"
  - { line: preparer_state, field: State 4, type: text, maxlen: 2 }  # preparer "State"
  - { line: preparer_zip_code, field: ZIP Code 5, type: text }  # preparer "ZIP Code"

relations:
  - "9 == 1 + 2 + 3 + 4 + 5 + 6 + 7 + 8"  # line 9 "Subtotal, sum of lines 1 through 8"
  - "11 == 9 - 10"  # line 11 "Colorado Taxable Income, subtract line 10 from line 9"
  - "15 == 12 + 13 + 14"  # line 15 "Subtotal, sum of lines 12 through 14"
  - "20 == 15 - 16 - 17 - 18 - 19"  # line 20 "Net Income Tax, sum of lines 16, 17, 18, and 19. Subtract that sum from line 15"
  - "30 == 21 + 22 + 23 + 24 + 25 + 26 + 27 + 28 + 29"  # line 30 "Subtotal, sum of lines 21 through 29"
  - "34 == 31 + 32 + 33"  # line 34 "Sum of lines 31 through 33: Modified AGI for TABOR amount" (printed; the widget tooltip's "30 through 33" is a DOR copy error — do not add line 30)
  - "36 == 30 + 35"  # line 36 "Sum of lines 30 and 35"
  - "37 == max(0, 36 - 20)"  # line 37 "Overpayment, if line 36 is greater than line 20 then subtract line 20 from line 36" (blank otherwise)
  - "39 == 37 - 38"  # line 39 "Refund, subtract line 38 from line 37"
  - "40 == max(0, 20 - 36)"  # line 40 "Net Tax Due, subtract line 36 from line 20" (blank when line 36 is greater)
  - "44 == 40 + 41 + 42 + 43"  # line 44 "Amount You Owe, sum of lines 40 through 43"
cross_form:
  - "1 == f1040.15"  # line 1 "… 1040, 1040 SR, or 1040 SP line 15" (the 2024 Form 1040 line 15 is taxable income)
  - "31 == f1040.11"  # line 31 "Federal Adjusted Gross Income from your federal income tax form: 1040, 1040 SR, or 1040 SP line 11" (2024 Form 1040 AGI is line 11)
identity_fields:
  - ssn_or_itin
  - your_first_name
  - your_last_name
