  - { line: dependent_3_ssn_or_itin, field: Social Security Number Dependent 3, type: text }  # dependent 3 "S S N or I T I N"
  - { line: dependent_3_year_of_birth, field: Year of Birth Dependent 3, type: text, maxlen: 4 }  # dependent 3 "Year of Birth"
  - { line: "dependent_4_child_tax_credit::yes", field: C6 - Qualifying Child 4, type: checkbox, on_state: /Yes }  # "Dependent 4: Child Tax Credit: Yes"
  - { line: "dependent_4_deceased::yes", field: C7 - Deceased Dependent 4, type: checkbox, on_state: /Yes }  # "Dependent 4: … Deceased: Yes"
  - { line: dependent_4_last_name, field: Last Name Dependent 4, type: text }  # dependent 4 "Last Name"
  - { line: dependent_4_first_name, field: First Name Dependent 4, type: text }  # dependent 4 "First Name"
