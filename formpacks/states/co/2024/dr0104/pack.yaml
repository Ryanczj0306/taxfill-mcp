  - { line: "dependent_1_child_tax_credit::yes", field: C6 - Qualifying Child 1, type: checkbox, on_state: /Yes }  # "Dependent 1: Child Tax Credit: Yes"
  - { line: "dependent_1_deceased::yes", field: C7 - Deceased Dependent 1, type: checkbox, on_state: /Yes }  # "Dependent 1: … Deceased: Yes"
  - { line: dependent_1_last_name, field: Last Name Dependent 1, type: text }  # dependent 1 "Last Name"
  - { line: dependent_1_first_name, field: First Name Dependent 1, type: text }  # dependent 1 "First Name"
  - { line: dependent_1_ssn_or_itin, field: Social Security Number Dependent 1, type: text }  # dependent 1 "S S N or I T I N"
