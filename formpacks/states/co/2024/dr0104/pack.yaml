  - { line: dependent_2_first_name, field: First Name Dependent 2, type: text }  # dependent 2 "First Name"
  - { line: dependent_2_ssn_or_itin, field: Social Security Number Dependent 2, type: text }  # dependent 2 "S S N or I T I N"
  - { line: dependent_2_year_of_birth, field: Year of Birth Dependent 2, type: text, maxlen: 4 }  # dependent 2 "Year of Birth"
  - { line: "dependent_3_child_tax_credit::yes", field: C6 - Qualifying Child 3, type: checkbox, on_state: /Yes }  # "Dependent 3: Child Tax Credit: Yes"
