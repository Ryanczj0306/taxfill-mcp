  - { line: "45", field: Form Question 45, type: money }  # Delinquent Payment Interest (see instructions)
  - { line: "46", field: Form Question 46, type: money }  # Estimated Tax Penalty, you must submit the DR 0204
  - { line: "47", field: Form Question 47, type: money }  # Amount You Owe, sum of lines 43 through 46 (no printed cents box)

  # ============================================ page 7 — Direct Deposit (RB6/RB7/RB8 are SEPARATE fields; the blank's /Bl
  #   scripts make them exclusive: group direct_deposit_type)
  - { line: direct_deposit_routing_number, field: Routing Number 4, type: text, maxlen: 9, comb: true }  # "Routing Number" (comb, /MaxLen 9)
  - { line: direct_deposit_account_number, field: Acount Number 4, type: text, maxlen: 17, comb: true }  # "Account Number" (comb, /MaxLen 17)
  - { line: "direct_deposit_type::checking", field: RB6, type: checkbox, on_state: /1, group: direct_deposit_type }  # "Type: Checking"
  - { line: "direct_deposit_type::savings", field: RB7, type: checkbox, on_state: /2, group: direct_deposit_type }  # "Type: Savings"
  - { line: "direct_deposit_type::collegeinvest", field: RB8, type: checkbox, on_state: /3, group: direct_deposit_type }  # "Type: CollegeInvest 529"

  # ============================================ page 7 — Third Party Designee (RB9 / RB10 are SEPARATE fields; each one's /Bl
  #   script turns the other Off: group third_party_designee)
  - { line: "third_party_designee::no", field: RB9, type: checkbox, on_state: /1, group: third_party_designee }  # "No"
  - { line: "third_party_designee::yes", field: RB10, type: checkbox, on_state: /2, group: third_party_designee }  # "Yes. Complete the following:"
  - { line: designee_name, field: "Designee’s Name 2", type: text }  # "Designee's Name"
  - { line: designee_phone_number, field: Phone Number of designee 2, type: text }  # designee "Phone Number"

  # ============================================ page 8 — Sign Below (the signatures themselves are not widgets)
  - { line: your_signature_date, field: Date of Your Signature 2, type: text }  # "Your Signature … Date (MM/DD/YY)"
  - { line: spouse_signature_date, field: Date of Signature for Spouse 2, type: text }  # "Spouse's Signature … Date (MM/DD/YY)"

  # ============================================ page 8 — paid preparer
  - { line: preparer_name, field: "Paid Preparer’s Name 2", type: text }  # "Paid Preparer's Name"
  - { line: preparer_phone, field: "Paid Preparer’s Phone Number 2", type: text }  # "Paid Preparer's Phone"
  - { line: preparer_address, field: "Paid Preparer’s Address: Street 2", type: text }  # "Paid Preparer's Address"
  - { line: preparer_city, field: City 6, type: text }  # preparer "City"
  - { line: preparer_state, field: State 4, type: text, maxlen: 2 }  # preparer "State"
  - { line: preparer_zip_code, field: ZIP Code 5, type: text }  # preparer "ZIP Code"

relations:
  - "10 == 1 + 2 + 3 + 4 + 5 + 6 + 7 + 9"  # line 10 "Subtotal, sum of lines 1 through 7 and line 9"
  - "12 == 10 - 11"  # line 12 "Colorado Taxable Income, subtract line 11 from line 10"
  - "16 == 13 + 14 + 15"  # line 16 "Subtotal, sum of lines 13 through 15"
  - "21 == 16 - 17 - 18 - 19 - 20"  # line 21 "Net Income Tax, subtract the sum of lines 17, 18, 19, and 20 from line 16"
  - "23 == 21 + 22"  # line 23 "Net Tax and Required Repayment, sum of lines 21 and 22"
  - "33 == 24 + 25 + 26 + 27 + 28 + 29 + 30 + 31 + 32"  # line 33 "Subtotal, sum of lines 24 through 32"
  - "37 == 34 + 35 + 36"  # line 37 "Sum of lines 34 through 36"
  - "39 == 33 + 38"  # line 39 "Sum of lines 33 and 38"
  - "40 == max(0, 39 - 23)"  # line 40 "Overpayment, if line 39 is greater than line 23 then subtract line 23 from line 39" (blank otherwise)
  - "42 == 40 - 41"  # line 42 "Refund, subtract line 41 from line 40"
  - "43 == max(0, 23 - 39)"  # line 43 "Net Tax Due, subtract line 39 from line 23" (blank when line 39 is greater)
  - "47 == 43 + 44 + 45 + 46"  # line 47 "Amount You Owe, sum of lines 43 through 46"
cross_form:
  - "1 == f1040.15"  # line 1 "… 1040, 1040 SR, or 1040 SP line 15" (the 2025 Form 1040 line 15 is taxable income)
  - "34 == f1040.11a"  # line 34 "Federal Adjusted Gross Income from your federal income tax form: 1040, 1040 SR, or 1040 SP line 11a" (2025 Form 1040 AGI is line 11a)
identity_fields:
  - ssn_or_itin
  - your_first_name
  - your_last_name
