  - { line: spouse_id_card_last_4, field: Spouse ID Number, type: text, maxlen: 4 }  # spouse ID card: "Last 4 characters of ID number"
  - { line: spouse_id_card_date_of_issuance, field: Spouse Date of Issuance, type: text }  # spouse ID card: "Date of Issuance (MM/DD/YYYY)"

