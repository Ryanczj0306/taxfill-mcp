# mapped is gone). A full re-map by widget position and printed label; every
# row below was confirmed on a sentinel render of this blank.
#
# URL. https://tax.colorado.gov/sites/tax/files/documents/DR0104_2025.pdf
# (tax.colorado.gov answers 403 to a non-browser User-Agent; fetched with a
# desktop browser agent). Digest 6deb6c181848… — two separate downloads on
# 2026-10-02 and the discovery row agree; 1,072,705 bytes, %PDF-1.7, AcroForm.
#
# PRINTED IDENTITY. Page 1 prints "DR 0104 (10/03/25)", "COLORADO DEPARTMENT
# OF REVENUE", "Page 1 of 8", "(0013)", the barcode stamp 250104 19999 and the
# title "2025 Colorado Individual Income Tax Return". Pages 2-8 print "DR 0104
# (10/03/25)", "Page N of 8" and barcode stamps 250104 29999 … 89999; every
# page prints "This page is required." printed_year_verified = 2025.
#
# TOPOLOGY CENSUS against the 2023 blank (DR 0104 (11/28/23), 4 pages, 98
# widgets / 90 fields). This blank is 8 pages, 152 widgets / 124 fields, and
# none of its field names occurs on the 2023 blank:
#   * the opaque "TextNN" ids are replaced by descriptive names ("Last Name",
#     "Form Question 1" … "Form Question 47", "Physical Street Address 2", …);
#     each 2023 line was re-bound to the widget under its printed label here;
#   * the 2023 single-state checkboxes Full-Year / Part-Year / "Mark if Abroad
#     on due date–see instructions" are now three radio widgets on SEPARATE
#     fields RB1 / RB2 / RB3 (states /1, /2, /3). Full-Year and Part-Year are
#     the two residency statuses and a return marks one of them (the 2025
#     Book 104, Book104_2025.pdf, sends a joint return with one full-year
#     and one part-year spouse to "the Part-Year Resident/Nonresident box"),
#     so they share group residency_status. "Abroad on due date" is a
#     separate fact, not a third status: the same Book prints "Mark the
#     appropriate box for your residency status" and then, under "Persons
#     Traveling or Residing Abroad", "When filing your return, mark the
#     “Abroad on Due Date” box on Revenue Online or the paper return", so an
#     abroad filer marks a status box AND this one. RB3 is therefore an
#     independent flag (2023's three boxes were independent too), even
#     though the blank's /Bl scripts (which run only in a viewer, on blur)
#     turn the other two Off whenever any one of the three is chosen;
#   * the 2023 shared /Btn "Direct Deposit" (/Checking /Savings /CollegeInvest)
#     is now RB6 / RB7 / RB8 (/1 /2 /3) and "Third Party Designee" (/No /Yes) is
#     now RB9 (/1, No) / RB10 (/2, Yes) — separate fields with the same
#     turn-the-others-Off scripts, so each set shares one group;
#   * the name / SSN header: 2023 had a separate "Name" header field (Text31,
#     line header_name) on pages 2-4. Here "Last Name", "First Name", "Middle
#     Initial" and "Social Security Number" are each ONE field whose widgets
#     sit on page 1 AND in the "(match page 1)" header of pages 2-8, so one
#     write fills all eight pages; header_name is dropped (no widget left);
#   * line 8 "Reserved for future use" prints a grey box with NO widget, so
#     there is no line "8";
#   * NEW widgets, all mapped: the page-2 Dependents block (five rows of Child
#     Tax Credit / Deceased checkboxes, Last Name, First Name, SSN or ITIN,
#     Year of Birth — 30 fields) and the money lines that did not exist in 2023
#     (5, 19, 22, 32; see FACE DELTAS). The 2023 line-25 "DR 0108" prepayment
#     box has no successor: line 28 prints only "DR 0104BEP" and "DR 1079".
#   * Coverage: 124 of 124 fields mapped (124 line keys); nothing omitted.
#   * /MaxLen: 2023's /MaxLen 1 (both Middle Initials) and 2 (both State boxes)
#     are gone — no text widget here carries a /MaxLen except Routing Number 4
#     (9) and "Acount Number 4" (17, the DOR's spelling). Those two set the
#     comb bit and the face prints 9 and 17 cells, so both are comb: true. The
#     pack keeps maxlen 1 / 2 on the initials and state codes and adds maxlen 4
#     on the "Last 4 characters of ID number" boxes, as that caption prints,
#     and on the "Year of Birth" boxes for a four-digit year (the caption
#     prints no digit count; no widget /MaxLen to exceed in either case).
#   * /Ff: most text fields now set DoNotSpellCheck + DoNotScroll (12582912;
#     2023 mostly DoNotScroll only); "Explain Other Additions" stays multiline.
#     No widget is ReadOnly. /DA stays Helv 10 for text (the two combs now
#     specify CMYK black); the C* checkboxes and RB radios are ZaDb 0 Tf and
#     the two line-28 boxes carry no /DA. Money widgets are
#     right-aligned (/Q 2) beside a printed "00" cents box; line 47 has no
#     cents box and its widget runs to the right margin.
#
# FACE DELTAS vs 2023 (2025 numbering; read on this blank's text layer).
#   * page order: Taxpayer + Spouse on page 1; Contact Information moves to
#     page 2 with the new Dependents block ("If you have more than 5
#     dependents, you must file electronically."); the health-coverage box and
#     lines 1-10 on page 3; 11-23 on page 4; 24-33 on page 5; 34-42 on page 6;
#     43-47, Direct Deposit and Third Party Designee on page 7; Sign Below,
#     Paid Preparer and File and Pay on page 8.
#   * line 1 now cites "1040, 1040 SR, or 1040 SP line 15" (2023 named no
#     line); line 34 (2023 line 30) cites "line 11a".
#   * additions: 2 "State Income Tax Addback" (2023 2 "State and Local Income
#     taxes or general sales taxes…"), 3 QBI addback, 4 "Standard or Itemized
#     Federal Deduction Addback" (2023 4 "Federal Deduction addback"), NEW 5
#     "Business meals deducted pursuant to section 274(k) of the Internal
#     Revenue Code", 6 CollegeInvest (2023 5), 7 ABLE (2023 6), 8 "Reserved
#     for future use", 9 Other Additions (2023 7), 10 "Subtotal, sum of lines 1
#     through 7 and line 9" (2023 8 "sum of lines 1 through 7").
#   * 11 subtractions "DR 0104AD Schedule, line 22" (2023 9, "line 23"); 12
#     Colorado Taxable Income (2023 10); 13 tax (2023 11); 14 AMT (2023 12);
#     15 recapture (2023 13); 16 subtotal (2023 14); 17 "DR 0104CR line 65"
#     (2023 15, "line 54"); 18 Enterprise Zone "DR 1366 line 26" (2023 16);
#     NEW 19 "Nonrefundable CHIPS Zone Credit from DR 1370, line 22"; 20
#     Strategic Capital (2023 17); 21 Net Income Tax "subtract the sum of
#     lines 17, 18, 19, and 20 from line 16" (2023 18).
#   * 2023 line 19 "Use Tax reported on the DR 0104US" has no 2025 line, and
#     2023 line 20 "Net Colorado Tax, sum of lines 18 and 19" gives way to NEW
#     22 "Repayment of credit from form DR 0619, lines 4 and 11" and NEW 23
#     "Net Tax and Required Repayment, sum of lines 21 and 22".
#   * 24-27 withholding / carryforward / estimates / extension (2023 21-24;
#     27 now reads "DR 0158", 2023 "DR 0158-I"); 28 Other Prepayments (2023
#     25); 29-31 (2023 26-28; 31 "DR 0104CR line 26"); NEW 32 "Additional
#     credit from form DR 0619, line 3 and 10"; 33 "sum of lines 24 through
#     32" (2023 29 "21 through 28").
#   * TABOR: 34-37 Modified AGI (2023 30-33); 38 "TABOR State Sales Tax
#     Refund … born before 2007 … Use the amount on line 37 and reference the
#     table above" — the printed tier table reads $52,000 or less / $52,001 –
#     $105,000 / $105,001 – $168,000 / $168,001 – $233,000 / $233,001 –
#     $299,000 / $299,001 or more; Single Filers $19 / $25 / $29 / $35 / $37 /
#     $59, Joint Filers $38 / $50 / $58 / $70 / $74 / $118 (2023 line 34 "born
#     before 2005 … Enter $800 … or $1,600"). knowledge/states/co/2025.yaml
#     records the same tiers, amounts and birth year.
#   * 39 "Sum of lines 33 and 38"; 40 Overpayment "if line 39 is greater than
#     line 23"; 41 "Estimated Tax Credit Carryforward to the next tax year"
#     (2023 37 "to 2024 first quarter"); 42 Refund; 43 "Net Tax Due, subtract
#     line 39 from line 23"; 44-46 penalty / interest / estimated-tax penalty;
#     47 "Amount You Owe, sum of lines 43 through 46" (2023 39-43).
#   * the residency caption now reads "Abroad on due date" (2023 "Mark if
#     Abroad on due date – see instructions"); the line keys keep the 2023
#     spelling so callers see one key across years.
#
# Line keys. Printed lines are keyed by THIS face's number, so "4" meant the
# federal deduction addback in 2023 and still does here, but "5" (2023
# CollegeInvest) is now business meals — never carry a line number between
# years. Identity and header keys keep the 2023 spelling; the 2023 keys
# line7_explain, line25_dr0104bep / _dr0108 / _dr1079 and header_name become
# line9_explain, line28_dr0104bep / line28_dr1079, and nothing.
#
# Relations. The printed arithmetic of lines 10, 12, 16, 21, 23, 33, 37, 39,
# 40, 42, 43 and 47. Lines 40 and 43 are the two branches of one comparison:
# 40 "Overpayment, if line 39 is greater than line 23 then subtract line 23
# from line 39" and 43 "Net Tax Due, subtract line 39 from line 23" (the
# 2025 Book 104 — "Compare lines 23 and 39. If line 23 is greater, skip to
# line 43. If line 39 is greater, continue to line 40."). The branch not
# taken is left blank, which reads as 0, so each is written with a floor —
# 40 == max(0, 39 - 23) and 43 == max(0, 23 - 39) — and holds on a refund
# return and on a balance-due return alike (2023 declared the net-tax-due
# leg as "39 == 20 - 35").
#
# Cross_form. Line 1 prints "Federal Taxable Income from your federal income
# tax form: 1040, 1040 SR, or 1040 SP line 15", and the 2025 Form 1040 line 15
# is "This is your taxable income", so 1 == f1040.15. Line 34 prints
# "Federal Adjusted Gross Income from your federal income tax form: 1040,
# 1040 SR, or 1040 SP line 11a", and the 2025 Form 1040 prints AGI on line
# 11a, so 34 == f1040.11a (2023 declared no leg). Trade-off: the face says
# "Lines 34 through 37 are only used to calculate your TABOR amount and do
# not affect your Colorado tax liability", and a blank side reads as 0, so a
# return that leaves the TABOR block empty fails this leg; the 2025 Book 104
# prints no such exception ("Enter your adjusted gross income from your
# federal income tax form1040, 1040 SR, or 1040 SP line 11a"), so the leg
# flags that omission rather than hiding a mis-keyed AGI.
#
# Layout. Flat AcroForm (acroform_root empty); `field` is the raw field name.
# Checkboxes that are single /Btn fields with one /Yes state (the deceased
# boxes, the health-coverage box, the dependents' boxes, the two line-28
# boxes) are independent flags, and so is the RB3 "Abroad on due date"
# radio (see TOPOLOGY CENSUS). Money lines are whole dollars beside the
# printed "00" cents box.
form: Form DR 0104
jurisdiction: states/co
tax_year: 2025
source_url: https://tax.colorado.gov/sites/tax/files/documents/DR0104_2025.pdf
pdf_sha256: 6deb6c181848797505c80ffc351ee973778cbb834ba18ea7007f78fa26ecb49c
acroform_root: ''
fields:
