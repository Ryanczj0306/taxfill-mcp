  #   filer to mark it besides the status box), so RB3 carries no group even
  #   though the blank's viewer-only /Bl scripts clear the other two.
  - { line: "full_year::yes", field: RB1, type: checkbox, on_state: /1, group: residency_status }  # "Full-Year"
  - { line: "part_year_or_nonresident::yes", field: RB2, type: checkbox, on_state: /2, group: residency_status }  # "Part-Year or Nonresident (or combination of …). You must submit form DR 0104PN"
  - { line: "mark_if_abroad_on_due_date::yes", field: RB3, type: checkbox, on_state: /3 }  # "Abroad on due date" (2023 printed "Mark if Abroad on due date")

  # ============================================ page 1 — Taxpayer Information. "Last Name" / "First Name" / "Middle Initial" /
  #   "Social Security Number" are each ONE field whose widgets also fill the
  #   "(match page 1)" header on pages 2-8, so each is mapped once
  - { line: your_last_name, field: Last Name, type: text }  # "Your Last Name" (+ the pages 2-8 header)
  - { line: your_first_name, field: First Name, type: text }  # "Your First Name" (+ the pages 2-8 header)
  - { line: your_middle_initial, field: Middle Initial, type: text, maxlen: 1 }  # "Your Middle Initial" (+ the pages 2-8 header)
