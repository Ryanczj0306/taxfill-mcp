# downloads and the scaffold's triage copy all digest to 4c564b3c011b…d414d5
# (pinned below). It is still a flat scannable form with no AcroForm.
#
# PRINTED IDENTITY. Page 1 prints "FORM N-11 (Rev. 2024)" and "Calendar Year
# 2024"; the page footers read "N11_I 2024A 01..04 VID01" and pages 2-4 print
# "Form N-11 (Rev. 2024) Page N of 4".
#
# LAYOUT: UNCHANGED, so every overlay box carries over. Every printed word on
# all four pages sits within 0.5 pt of its 2023 position, and a pixel diff of
# the two blanks rendered at 144 dpi differs only where printed text changed:
# the header year and QR code, the footer scan line, and the face deltas
# below. No ruling line, digit cell, oval or minus box moved. The demo and
# full returns were re-stamped on THIS blank, verified on all 177 placements
# and read page by page (test_n11_2024_overlay.py).
#
# FACE DELTAS vs 2023 (the complete printed-text diff):
#   * line 15 "First $8,082 of military reserve or Hawaii national guard duty
#     pay" (2023: $7,683);
#   * line 23 standard deduction "1 or 3 enter $4,400; 2 or 5 enter $8,800;
#     4 enter $6,424" (2023: $2,200 / $4,400 / $3,212 — Act 45 SLH 2024, as
#     knowledge/states/hi/2024.yaml already records);
#   * line 27's forms list adds N-325;
#   * line 38 "2024 estimated tax payments", line 39 "applied from 2023
#     return", line 46 "your 2025 ESTIMATED TAX".
# Line 25's $1,144 exemption and every page reference the face prints are
# unchanged. The notes that cite the Instructions were re-read in the 2024
# N-11 Instructions (n11ins.pdf, sha256 5bcce0f5…6b2f): line 22's itemized
# limitation is still on page 19 and line 42's negative-line-36 worksheet is
# still on page 22.
# ===========================================================================
# Hawaii Form N-11 (Rev. 2024) — Individual Income Tax Return, RESIDENT.
#
# PRINT-ONLY (C3): the official N-11 PDF is a flat scannable form — NO AcroForm
# widgets and NO XFA (introspect finds 0 fillable fields), so it cannot be filled
# programmatically. This is therefore a HAND-FILL pack (render_mode: hand_fill): a
# line manifest, not a field map. The engine (taxfill_core.handfill) computes every
# derivable line from confirmed inputs and emits a line->value worksheet; the filer
# PRINTS the blank at source_url and hand-writes the values onto it (black ink,
# one char per box, per the form's own instructions).
#
# Provenance: blank downloaded from source_url; pages 1-2 rendered and READ to
# confirm "Form N-11 (Rev. 2024) ... Calendar Year 2024" and the line labels before
# pinning pdf_sha256. SCOPE (Phase J JS4d, 2026-09-28, carried to 2024 by JS5): all four printed pages, every
# entry on the face — the header and fiscal-year boxes, identity, filing status,
# exemptions and dependents, lines 7-55, the designee, election fund, signature and
# paid-preparer blocks — each with overlay coordinates read from the blank's own
# geometry and checked on renders. The itemized worksheets A-1..A-6 live in the
# Instructions, not on the face; their totals enter here as 21a-21f.
#
# OVERLAY COORDINATES (Phase J JS4d, 2026-09-28): every line carries an `overlay` block, so
# fill_form STAMPS the worksheet onto this blank. Oval boxes are the printed outline's OUTER
# edge (pdfium's bounds for a stroked path include the whole 0.75pt stroke on each side; half
# of it is taken back off), and each minus box is the printed white minus glyph inside its pink
# square, which a loss darkens exactly as the page-2 Example does. The name line and both SSNs
# repeat in the page 2-4 headers, so those lines carry one box per page.
form: "N-11"
jurisdiction: states/hi
tax_year: 2024
render_mode: hand_fill
source_url: https://files.hawaii.gov/tax/forms/2024/n11_i.pdf
pdf_sha256: "4c564b3c011bd2a7d47f4be4012f9b5af4f3bc548d6fc46589aa75470d8414d5"
# PRINTING RULES (Phase J JS4b, read 2026-09-28; the 2024 face and Instructions re-read 2026-09-30): N-11 is a machine-read (scanned) form. The face asks for ONE
# character per box and the instructions forbid printing outside the boxes, so every digit box is stamped
# one character per printed cell (overlay.cells; money fills from the right, the ones digit in the last cell),
# names and addresses go inside their open boxes, every oval is PAINTED (overlay.mark: fill) and a loss is
# shown by shading the printed minus (overlay.minus), as the page-2 Example shows. No minimum type size is
# published.
printing_guidance:
  - quote: "Please Write Using a Black Ink Pen. Enter One Letter Or Number In Each Box. Fill In Ovals Completely. Do NOT Submit a Photocopy!!"
    source: "Form N-11 (2024), page 1"
    url: https://files.hawaii.gov/tax/forms/2024/n11_i.pdf
  - quote: "Use only a black or dark blue ink pen. Do not use red ink, pencils, felt tip pens, or erasable pens."
    source: "Form N-11 Instructions (2024), General Instructions, Guidelines for Filling in Scannable Forms (page 4)"
    url: https://files.hawaii.gov/tax/forms/2024/n11ins.pdf
  - quote: "Because this form is read by a machine, print your numbers inside the boxes like this:"
    source: "Form N-11 Instructions (2024), Guidelines for Filling in Scannable Forms (page 4)"
    url: https://files.hawaii.gov/tax/forms/2024/n11ins.pdf
  - quote: "Do NOT print outside the boxes."
    source: "Form N-11 Instructions (2024), Guidelines for Filling in Scannable Forms (page 4)"
    url: https://files.hawaii.gov/tax/forms/2024/n11ins.pdf
signature_note: "Sign and date the printed N-11 in black ink before mailing (both spouses on a joint return)."
