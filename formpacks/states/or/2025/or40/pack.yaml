  - { line: deceased.yes, field: or-40-p1-18, type: checkbox, on_state: /Yes }        # "Deceased"
  # ---- spouse identity
  - { line: spouse_name.first, field: or-40-p1-19, type: text, maxlen: 16 }  # "Spouse first name"
  - { line: spouse_name.initial, field: or-40-p1-20, type: text, maxlen: 1 } # "Initial"
  - { line: spouse_date_of_birth, field: or-40-p1-21, type: text, maxlen: 10 }  # "Spouse date of birth (MM/DD/YYYY)"
  - { line: spouse_name.last, field: or-40-p1-22, type: text, maxlen: 32 }   # "Spouse last name" (2025 /MaxLen 32, was 21)
  - { line: spouse_ssn, field: or-40-p1-23, type: text, maxlen: 11, comb: true, format: ssn_digits_only }  # "Spouse SSN"
  - { line: spouse_ssn_first_time.yes, field: or-40-p1-24, type: checkbox, on_state: /Yes }  # "First time using this SSN"
  - { line: spouse_applied_for_itin.yes, field: or-40-p1-25, type: checkbox, on_state: /Yes }  # "Applied for ITIN"
  - { line: spouse_deceased.yes, field: or-40-p1-26, type: checkbox, on_state: /Yes }  # "Deceased"
