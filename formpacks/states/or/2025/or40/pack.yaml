# ===========================================================================
# Form OR-40, 2025 — Oregon Individual Income Tax Return for Full-year Residents.
#
# Layout. FLAT AcroForm (acroform_root empty; field names are the raw sentinel
# ids the form ships with, e.g. "or-40-p1-11", "or-40-p2-5", "or-40-p3-1").
# This is a single 8-page return — every page is the FILED OR-40 itself; there
# are NO worksheet / tax-table / instruction pages embedded in this PDF (those
# live in the separate OR-40 instructions booklet). Page roles:
#   page 1 — header: fiscal-year/amended/election checkboxes, six "filed with"
#            checkboxes (Extension filed, Form OR-24, Form OR-243, Federal Form
#            8379, Federal Form 8886, Disaster relief), taxpayer & spouse
#            name/DOB/SSN, mailing address, phone, Filing Status (1-5);
#   page 2 — header (last name + SSN repeat), Exemptions 6a/6b with their
#            "check boxes that apply" sub-boxes, Dependents 1-3, lines 6c-6e;
#   page 3 — header repeat, lines 7-19 (income, subtractions, deductions),
#            standard-deduction age/blind checkboxes 17a-17d;
#   page 4 — header repeat, lines 20-31 (Oregon tax, alt-method boxes 20a-20c,
#            standard & carryforward credits);
#   page 5 — header repeat, lines 32-44 (kicker, payments & refundable credits,
#            tax to pay or refund), line 44a exception number + 44b annualized
#            box;
#   page 6 — header repeat, lines 45-55 (refund/owe, estimated-tax application,
#            charitable & party checkoffs 50a/50b, higher-education savings
#            plan, net refund, direct deposit 54, kicker donation 55a/55b);
#   page 7 — header repeat, Sign Here block (taxpayer/spouse/preparer dates,
#            preparer phone/license/name/address/city/state/zip);
#   page 8 — header repeat, Amended statement free-text box.
#
# Field-name repeats. The header "Last name" (or-40-p1-14) and "SSN"
# (or-40-p1-15) widgets carry the SAME flat field name on EVERY page (pages
# 1-8). One field => the filler writes all eight header copies from a single
# value. They are mapped ONCE here, as the identity name/identifying_number.
#
# Coverage. The blank PDF has 165 AcroForm widget entries; introspect counts
# 123 text + 42 checkbox. The header name/SSN pair (or-40-p1-14, or-40-p1-15)
# appears 8 times each but is one field, so distinct mappable fields = 165 -
# 7*2 (the seven duplicate header copies on pages 2-8) - 1 ("Button - Clear
# form" JS pushbutton) = 150. All 150 are mapped below. Two counts follow from
# that and neither is a coverage gap: the 165 widgets resolve to 146 distinct
# terminal FIELDS (the two 8-widget header fields and the two multi-widget radio
# fields absorb the other 19 widgets), of which 145 are fillable — exactly the
# 145 that audit_pack.py reports as mapped_lines / written_fields, i.e. the 150
# line keys minus the 4 extra Filing Status keys and the 1 extra account-type
# key that share one /Btn field each. Nothing fillable is left unmapped: the
# only blank field with no line key is the pushbutton. The "Button - Clear
# form" widget is intentionally OMITTED: it is a JavaScript pushbutton (/Ff
# 65536, and its only "on_states" are appearance-dict keys /BBox /Filter
# /Matrix ... not a fillable export value) — the blue "Clear form" button,
# not a data field.
#
# Money vs text. Every numbered dollar line prints a ".00" cents suffix in its
# own two-cell box and is mapped `money`. Genuine text widgets stay text:
# names, mailing address/city/country, the comb date boxes (MM/DD/YYYY), the
# SSN comb cells, state (2 char), ZIP halves, phone, party codes, exemption
# COUNT boxes 6a/6b/6c/6d/6e (counts, not dollars), dependent codes, the
# Form OR-10 exception number 44a, routing/account numbers, preparer fields,
# and the amended-statement box. Comb fields carry maxlen to avoid clipping.
#
# Relations. Only on-face unconditional equalities with every operand mapped
# to a single line are declared (Add lines …). Lines whose printed instruction
# floors at zero ("If line X is more than line Y, enter 0": lines 19, 29) or
# branch on a comparison (41 overpayment vs 42 net tax) are OMITTED.
#
# Cross_form. Line 7's printed label is "Federal adjusted gross income from
# federal Form 1040, 1040-SR, or 1040-NR, line 11a; or 1040-X, line 1C (see
# instructions)", so the single cross_form equality is 7 == f1040.11a.
#   THIS BANNER PREVIOUSLY GOT IT WRONG. It declared "7 == f1040.11" and
#   asserted that "the 2025 face's new '1040-NR, line 11a' citation does not
#   touch it". Both halves were wrong, and the next porter will meet the same
#   two-line label, so the reasoning is written out:
#   (1) THE LABEL WAS MISPARSED. It wraps mid-list, printed as
#         "7. Federal adjusted gross income from federal Form 1040, 1040-SR, or
#             1040-NR, line 11a; or 1040-X, line 1C (see instructions)"
#       so the wrap falls between "or" and "1040-NR" and "line 11a" LOOKS
#       scoped to 1040-NR alone. It is not. ONE line citation governs the whole
#       three-form list "Form 1040, 1040-SR, or 1040-NR" — exactly as the 2023
#       face's single "line 11" governed the same three names — and it is
#       correct for all three because the 2025 revisions of Form 1040, 1040-SR
#       and 1040-NR ALL moved AGI to line 11a (formpacks/federal/2025/f1040 and
#       .../f1040nr both key "11a" + "11b" and neither keys "11"; the 2023
#       f1040nr keys "11"). Page 7 of this very blank shows the DOR handling
#       the list as one unit: "Important: Include a copy of your federal Form
#       1040, 1040-SR, 1040-X, or 1040-NR."
#   (2) f1040.11 WAS A DANGLING REFERENCE for TY2025.
#       formpacks/federal/2025/f1040/pack.yaml keys "11a" ("Subtract line 10
#       from line 9. This is your adjusted gross income", closing page 1) and
#       "11b" ("Amount from line 11a (adjusted gross income)", opening page 2)
#       and has NO "11" — its own header records 'Line 11 -> 11a (AGI, page 1)'.
#       11a is the AGI-DEFINING line, so it is the target; 11b is only the
#       page-2 restatement (the federal pack declares "11b == 11a"). Nothing in
#       the repo caught the dangling ref because
#       test_pack_cross_form_targets_resolve_to_an_existing_pack_line globs
#       formpacks/federal/*/*/pack.yaml only, so STATE cross_form targets are
#       unvalidated — a repo-wide sweep at the time of this fix found the same
#       stale f1040.11 in ny/2025/it201 and ny/2025/it203 and nowhere else.
#   NOT declared: a second leg "7 == f1040nr.11a". The printed face does name
#   1040-NR and ca/2023/form540nr is the precedent for carrying both legs, but
#   the 2023 OR-40 base declared only the f1040 leg; ADDING a leg is a rule-set
#   change rather than a dangling-target fix, so it is left to a reviewed
#   change.
#
# Signature. Sign Here block is on page 7.
form: OR-40
jurisdiction: states/or
tax_year: 2025
source_url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40_101-040_2025.pdf
pdf_sha256: "eaa5ca450083c7717e46846ce69d1b71ea64bcc58ae48d7f9c25ed9c8e9a56e6"
acroform_root: ''
fields:
  # ============================================ page 1 — header / elections
  - { line: fiscal_year_ending_date, field: or-40-p1-1, type: text, maxlen: 10 }   # "Fiscal filers only: Year-end date (MM/DD/YYYY)"
  - { line: amended_return.yes, field: or-40-p1-2, type: checkbox, on_state: /Yes }  # "Amended return."
