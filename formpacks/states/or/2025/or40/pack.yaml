# ===========================================================================
# TY2025 PORT (2026-08-21) — ported from formpacks/states/or/2023/or40.
#
# URL derivation. The candidate URL was derived with this repo's own logic
# (scripts/scaffold_state_year.py `_candidate_url`, base 2023 -> target 2025:
# the single 4-digit year token in the basename), then fetched ONCE.
#
# IDENTITY (verified on the PDF, not the URL — docs/ROADMAP.md records a DOR
# serving a 2025 revision from a /2023/ path, so a year in the URL proves
# nothing). Page-1 text of the downloaded blank prints "2025 Form OR-40 /
# Oregon Individual Income Tax Return for Full-year Residents", the form
# number 150-101-040 (Rev. 09-18-25, ver. 01), and the page-1 scanline
# 00462501010000 (the 2023 blank prints 00462301010000). All eight page
# footers print "2025 Form OR-40"; page 8 prints "amending your 2025 return".
# printed_year_verified = 2025.
#
# DIGEST PROVENANCE. Downloaded TWICE, independently (two separate requests),
# 194,550 bytes each; both copies digest to
# eaa5ca450083c7717e46846ce69d1b71ea64bcc58ae48d7f9c25ed9c8e9a56e6
# (shasum -a 256), which is the pinned pdf_sha256. double_download_match =
# true. Magic bytes are %PDF-1.6 (not an HTML error page with a .pdf name).
#
# TOPOLOGY: field-NAME set IDENTICAL, six /MaxLen values moved.
#   * 165 AcroForm widget entries in both years, 146 distinct field names in
#     both, 123 /Tx + 42 /Btn in both, identical per-page widget counts
#     (p1 40, p2 34, p3 19, p4 17, p5 17, p6 20, p7 15, p8 3). Zero adds,
#     zero drops, zero renames. Every /AP /N on-state key set is unchanged:
#     /Yes for all 34 single checkboxes, /Choice1../Choice5 for the Filing
#     Status radio or-40_p1_33, /Choice1 (Checking) + /Choice2 (Savings) for
#     the line-54 account-type radio or-40-p6-12. Export values were DUMPED
#     from /AP, never guessed.
#   * /MaxLen changes (the pack's maxlen follows the new blank, because
#     maxlen is the filler's pre-write guard — a pack maxlen larger than the
#     widget's /MaxLen is silent clipping, P-001):
#       or-40-p1-14 (Last name, the 8-page header repeat) 21 -> 32
#       or-40-p1-22 (Spouse last name)                    21 -> 32
#       or-40-p1-28 (City)                                21 -> 22
#       or-40-p7-10 (Preparer city)                       21 -> 22
#       or-40-p2-1  (6a count, comb)                       2 -> 1
#       or-40-p2-5  (6b count, comb)                       2 -> 1
#     6a/6b can only ever hold a single digit (regular + severe disability
#     = at most 2), so the narrower comb clips nothing real.
#   * FULL REMAINING DELTA INVENTORY. An earlier revision of this banner said
#     "the only other AcroForm delta is cosmetic: the 2025 blank stores its /AP
#     appearance streams uncompressed ... no effect on names, flags, states or
#     geometry". That was INCOMPLETE (and wrong about geometry). Both blanks
#     were re-dumped field-by-field and widget-by-widget; the complete list is:
#       - /AP streams are indeed stored uncompressed in 2025 (no /Filter
#         /FlateDecode) — cosmetic. Additionally three fields whose 2023 widget
#         had NO /AP /N at all gained an (empty) appearance stream:
#         or-40-p1-12, or-40-p1-20, or-40-p7-7 (the three "Initial" boxes).
#         No /AP /N on-state KEY SET changed anywhere.
#       - FIELD/WIDGET TOPOLOGY moved on 17 fields. 16 that were single merged
#         field+widget dicts in 2023 are now a parent field + ONE kid widget
#         (or-40-p3-1..p3-9, p3-12..p3-17, p5-6); or-40-p5-12 went the other
#         way (parent+kid -> merged). On the split ones /AA, /DA, /FT, /Ff,
#         /MaxLen, /Q and /TU sit on the PARENT and the kid carries only
#         /Rect, /F, /MK and an empty /AA.
#         READ THIS BEFORE BELIEVING ANY /AA OR /MaxLen DIFF ON THIS FORM: an
#         annotation-level reader that does not walk /Parent sees these as
#         widgets that "LOST" their /F,/K,/V handlers, their /DA and their
#         /MaxLen 11 (annotation-level /F count 83 -> 70, /K 74 -> 61, and 12
#         apparent /MaxLen drops). Resolved through the /Parent chain the
#         action sets are UNCHANGED — field-level /V holds at 49 — and the only
#         genuine change is the next item. The same trap runs the other way for
#         /MaxLen: or-40-p1-14 is a parent + 8 kid widgets in BOTH years, so
#         its 21 -> 32 change is invisible to an annotation-only diff and shows
#         up only at field level.
#       - THE ONLY GENUINE /AA CHANGE: or-40-p6-14 (Routing number) and
#         or-40-p6-15 (Account number) dropped their /F + /K handlers, so
#         FIELD-level /F goes 88 -> 86 and /K 79 -> 77 (/V unchanged at 49).
#         No mapping impact: there is no /C (calculate) action on any widget
#         and no AcroForm /CO in EITHER year, so nothing on this form is
#         DOR-JavaScript-computed and the P-007 class-4 verdict recorded in the
#         READONLY ADJUDICATION section below stands on its own.
#       - /TU tooltips: 0 -> 144 of the 146 fields (a pure accessibility pass;
#         e.g. or-40-p3-1 "Dollar amount in whole dollars: ", or-40-p6-14
#         "Routing number "). The only two still without one are or-40-p4-1
#         (line 20 Tax) and or-40-p6-16 (55a kicker-donation box). No
#         behavioural effect either way.
#       - GEOMETRY DID MOVE: 61 of the 165 widget /Rects differ. 39 are <=2pt
#         nudges (max |dx| 1.33, max |dy| 2.0). The substantive ones: all 13
#         page-7 "Sign here" widgets shifted UP 11-12pt as one block;
#         or-40-p5-2/-4/-5/-6 shifted DOWN 10.5-12pt with the kicker insertion
#         (page-5 renumbering, below); or-40-p2-1 and or-40-p2-5 lost 13.42pt
#         of WIDTH, which is the 2-cell -> 1-cell comb narrowing above; and
#         or-40-p3-2 / or-40-p3-3 carried DENORMALIZED rects in 2023 (y1 > y3)
#         that 2025 normalizes — same box, same size. Alignment after the
#         shifts was re-PROVED, not assumed: in the 170-dpi render (VISION
#         AUDIT below) every page-3, page-5 and page-7 sentinel sits inside the
#         printed cell of its own line number.
#       - Unchanged and re-verified at FIELD level (146 terminal fields): the
#         field-name set, and the /Ff multiset — 29360128 x80, 0 x34,
#         12582912 x28, 49152 x2, 65536 x1, 12587008 x1 — identical in both
#         years. (The READONLY section below reports the same flags per WIDGET,
#         hence its larger counts.)
#
# PRINTED-LINE DIFF: NOT zero — page 5 RENUMBERED. Every page of both blanks
# was text-extracted and diffed. Pages 1-4 and 6-8 carry ZERO renumbering
# (7-19 + 17a-17d, 20-31 + 20a-20c, 45-55 + 50a/50b/54/55a/55b all
# unchanged). Page 5 rotated its first seven money lines: for 2025 the
# kicker is line 32 at the TOP of the block and everything else shifts down
# one —
#       printed line   2023 meaning                       2025 meaning
#       32             Oregon income tax withheld         Kicker (Oregon surplus)
#       33             prior-year refund applied          Oregon income tax withheld
#       34             estimated tax payments             prior-year refund applied
#       35             pass-through entity payments       estimated tax payments
#       36             earned income credit               PTE payments (Sch OR-K-1 line 20)
#       37             Oregon Kids Credit                 earned income credit
#       38             Kicker (Oregon surplus credit)     Oregon Kids Credit
#       39/40          unchanged                          unchanged
#   WHY THE BINDINGS SURVIVE, and why that is verified rather than assumed:
#   this pack keys fields by PRINTED LINE NUMBER, and the page-5 widgets are
#   positionally named (or-40-p5-1 .. or-40-p5-13). Widget rectangles were
#   read out of both blanks and matched against the printed row text on the
#   same baseline: in BOTH years or-40-p5-N sits on printed line 31+N, so the
#   widget order still follows the printed order and every numeric line key
#   32..44 still binds the box the DOR prints that number against. What
#   changed is the MEANING of lines 32-38, so every inline comment on page 5
#   below was rewritten from the 2025 face. A consumer that keys on meaning
#   must move with it: knowledge/states/or/2025.yaml already does (kicker
#   claimed_on "Form OR-40, line 32", EIC line 37, Kids Credit line 38), so
#   face and knowledge agree — no mismatch found.
#   Had the DOR inserted the kicker WITHOUT shifting the numbers, or had the
#   widget order not followed the print, this "identical field names" port
#   would have filed seven wrong lines silently. That is the P-001 /
#   CONTRIBUTING "PORTABLE is not done" trap, and it was checked, not
#   assumed.
#
# READONLY ADJUDICATION (knowledge/pitfalls.yaml P-007). Every one of the
# 165 widgets had its /Ff resolved by walking the /Parent chain. RESULT: the
# 2025 blank has NO ReadOnly widget — bit 1 is clear on all 165 (and on all
# 165 of the 2023 blank). The /Ff multiset is identical across both years:
#   29360128 (x87) = Comb|DoNotSpellCheck|DoNotScroll — the comb cells
#   12582912 (x35) = DoNotSpellCheck|DoNotScroll      — plain text boxes
#          0 (x34) = the single /Yes checkboxes
#      49152  (x7) = Radio|NoToggleToOff — the two radio fields' widgets
#   12587008  (x1) = +Multiline — the page-8 amended-statement box
#      65536  (x1) = Pushbutton — "Button - Clear form" (NOT mapped, below)
# So the per-widget verdict for every mapped field is the same: NOT ReadOnly,
# nothing to adjudicate. There is no class-4 (DOR-JavaScript-computed) cell
# to keep mapped, no printed-necessarily-blank cell to exclude, and no
# widget pre-loaded with a DOR constant (/V is empty on all 165). The flag
# reader is not silently returning "nothing": it decodes the non-ReadOnly
# bits above off the same dicts, so a false negative from a broken reader is
# ruled out. CONSEQUENCE: this pack needs NO row in
# packages/core/tests/test_readonly_widget_mapping.py STATE_COMPUTED_READONLY
# — mapped-∩-ReadOnly is the empty set, which is what that table's absence
# asserts.
#
