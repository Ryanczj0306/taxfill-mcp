#
# READONLY ADJUDICATION (knowledge/pitfalls.yaml P-007). Every one of the
# 162 widgets had its /Ff resolved by walking the /Parent chain. RESULT: the
# 2024 blank has NO ReadOnly widget — bit 1 is clear on all 162 (and on all
# 165 of the 2023 blank), so no field WAS writable and became ReadOnly, and
