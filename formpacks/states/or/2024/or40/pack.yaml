# VISION AUDIT (scripts/audit_pack.py, exit 0, 0 verify FAILs; 147 mapped
# lines -> 142 written fields, the difference being the 4 extra Filing
# Status keys and 1 extra account-type key that share one /Btn field each).
# All eight rendered pages (170 dpi, re-read at 200 dpi in the 2026-08-25
# re-verification) were READ page by page: every sentinel
# sits on its own printed line number, the SSN/date/ZIP/phone combs show all
