# silently returning "nothing": it decodes the non-ReadOnly bit classes in
# the /Ff multiset above off the same dicts, so a false negative from a
# broken reader is ruled out. CONSEQUENCE: this pack needs NO row in
# packages/core/tests/test_readonly_widget_mapping.py
# STATE_COMPUTED_READONLY — same verdict as the 2023 base and the 2025 port.
