# ===========================================================================
# Form OR-40, 2024 — Oregon Individual Income Tax Return for Full-year Residents.
#
# Layout. FLAT AcroForm (acroform_root empty; field names are the raw sentinel
# ids the form ships with, e.g. "or-40-p1-11", "or-40-p2-5", "or-40-p3-1").
# This is a single 8-page return — every page is the FILED OR-40 itself; there
# are NO worksheet / tax-table / instruction pages embedded in this PDF (those
# live in the separate OR-40 instructions booklet). Page roles:
#   page 1 — header: fiscal-year/amended/election checkboxes, six "filed with"
#            checkboxes (Extension filed, Form OR-24, Form OR-243, Federal Form
#            8379, Federal Form 8886, Disaster relief), taxpayer & spouse
#            name/DOB/SSN, mailing address, phone, Filing Status (1-5);
#   page 2 — header (last name + SSN repeat), Exemptions 6a/6b with their
#            "check boxes that apply" sub-boxes, Dependents 1-3, lines 6c-6e;
#   page 3 — header repeat, lines 7-19 (income, subtractions, deductions),
#            standard-deduction age/blind checkboxes 17a-17d;
#   page 4 — header repeat, lines 20-31 (Oregon tax, alt-method boxes 20a-20c,
#            standard & carryforward credits);
#   page 5 — header repeat, lines 32-37 and 39-44 (payments & refundable
#            credits, tax to pay or refund; printed line 38 is a grey
#            unnumbered "Reserved" band in 2024 — no kicker this year), line
#            44a exception number + 44b annualized box;
#   page 6 — header repeat, lines 45-54 (refund/owe, estimated-tax
#            application, charitable & party checkoffs 50a/50b, higher
#            education savings plan, net refund, direct deposit 54; the 2023
#            kicker-donation block 55/55a/55b is a grey unnumbered "Reserved"
#            band in 2024);
#   page 7 — header repeat, Sign Here block (taxpayer/spouse/preparer dates,
#            preparer phone/license/name/address/city/state/zip);
#   page 8 — header repeat, Amended statement free-text box.
#
# Field-name repeats. The header "Last name" (or-40-p1-14) and "SSN"
# (or-40-p1-15) widgets carry the SAME flat field name on EVERY page (pages
# 1-8). One field => the filler writes all eight header copies from a single
# value. They are mapped ONCE here, as the identity name/identifying_number.
#
# Coverage. The blank PDF has 162 AcroForm widget entries; introspect counts
# 121 text + 41 checkbox. The header name/SSN pair (or-40-p1-14, or-40-p1-15)
# appears 8 times each but is one field, so distinct mappable fields = 162 -
# 7*2 (the seven duplicate header copies on pages 2-8) - 1 ("Button - Clear
# form" JS pushbutton) = 147. All 147 are mapped below (147 line keys = 142
# distinct fillable fields + the 4 extra Filing Status keys and 1 extra
# account-type key that share one /Btn field each). Nothing fillable is left
# unmapped: the only blank field with no line key is the pushbutton. The
# "Button - Clear form" widget is intentionally OMITTED: it is a JavaScript
# pushbutton (/Ff 65536, and its only "on_states" are appearance-dict keys
# /BBox /Filter /Matrix ... not a fillable export value) — the blue "Clear
# form" button, not a data field.
#
# Money vs text. Every numbered dollar line prints a ".00" cents suffix in its
# own two-cell box and is mapped `money`. Genuine text widgets stay text:
# names, mailing address/city/country, the comb date boxes (MM/DD/YYYY), the
# SSN comb cells, state (2 char), ZIP halves, phone, party codes, exemption
# COUNT boxes 6a/6b/6c/6d/6e (counts, not dollars), dependent codes, the
# Form OR-10 exception number 44a, routing/account numbers, preparer fields,
# and the amended-statement box. Comb fields carry maxlen to avoid clipping.
#
# Relations. Only on-face unconditional equalities with every operand mapped
# to a single line are declared (Add lines …). Lines whose printed instruction
# floors at zero ("If line X is more than line Y, enter 0": lines 19, 29) or
# branch on a comparison (41 overpayment vs 42 net tax) are OMITTED.
#
# Cross_form. Line 7's printed label is "Federal adjusted gross income from
# federal Form 1040, 1040-SR, or 1040-NR, line 11; or 1040-X, line 1C (see
# instructions)" — the wrapped list's single "line 11" citation governs all
# three form names — so the single cross_form equality 7 == f1040.11 (Form
# 1040, 2024, line 11 = federal AGI) is declared.
#
# Signature. Sign Here block is on page 7.
form: OR-40
jurisdiction: states/or
tax_year: 2024
source_url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40_101-040_2024.pdf
pdf_sha256: "28210d1a2aa30f436071d941b16bd0eb338380e4916e96c23fc82c605983ff75"
acroform_root: ''
fields:
  # ============================================ page 1 — header / elections
  - { line: fiscal_year_ending_date, field: or-40-p1-1, type: text, maxlen: 10 }   # "Fiscal year ending date (MM/DD/YYYY)"
  - { line: amended_return.yes, field: or-40-p1-2, type: checkbox, on_state: /Yes }  # "Amended return."
  - { line: amended_nol_tax_year, field: or-40-p1-3, type: text, maxlen: 4 }        # "NOL tax year (YYYY)"
  - { line: calculated_as_if_federal.yes, field: or-40-p1-4, type: checkbox, on_state: /Yes }  # 'Calculated with "as if" federal return'
  - { line: short_year_tax_election.yes, field: or-40-p1-5, type: checkbox, on_state: /Yes }   # "Short-year tax election"
  # ---- right column "filed with return" checkboxes (each its own question)
  - { line: extension_filed.yes, field: or-40-p1-6, type: checkbox, on_state: /Yes }     # "Extension filed"
  - { line: form_or_24.yes, field: or-40-p1-7, type: checkbox, on_state: /Yes }          # "Form OR-24"
  - { line: form_or_243.yes, field: or-40-p1-8, type: checkbox, on_state: /Yes }         # "Form OR-243"
  - { line: federal_form_8379.yes, field: or-40-p1-9, type: checkbox, on_state: /Yes }   # "Federal Form 8379"
  - { line: federal_form_8886.yes, field: or-40-p1-10a, type: checkbox, on_state: /Yes } # "Federal Form 8886"
  - { line: disaster_relief.yes, field: or-40-p1-10b, type: checkbox, on_state: /Yes }   # "Disaster relief"
  # ---- taxpayer identity
  - { line: name.first, field: or-40-p1-11, type: text, maxlen: 16 }   # "First name"
  - { line: name.initial, field: or-40-p1-12, type: text, maxlen: 1 }  # "Initial"
  - { line: date_of_birth, field: or-40-p1-13, type: text, maxlen: 10 }  # "Date of birth (MM/DD/YYYY)"
  - { line: name, field: or-40-p1-14, type: text, maxlen: 32 }         # "Last name" (header repeats pages 2-8 via same field; 2024 /MaxLen 32, was 21)
  - { line: identifying_number, field: or-40-p1-15, type: text, maxlen: 11, comb: true, format: ssn_digits_only }  # "Social Security number (SSN)"
  - { line: ssn_first_time.yes, field: or-40-p1-16, type: checkbox, on_state: /Yes }  # "First time using this SSN (see instructions)"
  - { line: applied_for_itin.yes, field: or-40-p1-17, type: checkbox, on_state: /Yes }  # "Applied for ITIN"
  - { line: deceased.yes, field: or-40-p1-18, type: checkbox, on_state: /Yes }        # "Deceased"
  # ---- spouse identity
  - { line: spouse_name.first, field: or-40-p1-19, type: text, maxlen: 16 }  # "Spouse first name"
  - { line: spouse_name.initial, field: or-40-p1-20, type: text, maxlen: 1 } # "Initial"
  - { line: spouse_date_of_birth, field: or-40-p1-21, type: text, maxlen: 10 }  # "Spouse date of birth (MM/DD/YYYY)"
  - { line: spouse_name.last, field: or-40-p1-22, type: text, maxlen: 32 }   # "Spouse last name" (2024 /MaxLen 32, was 21)
  - { line: spouse_ssn, field: or-40-p1-23, type: text, maxlen: 11, comb: true, format: ssn_digits_only }  # "Spouse SSN"
  - { line: spouse_ssn_first_time.yes, field: or-40-p1-24, type: checkbox, on_state: /Yes }  # "First time using this SSN"
  - { line: spouse_applied_for_itin.yes, field: or-40-p1-25, type: checkbox, on_state: /Yes }  # "Applied for ITIN"
  - { line: spouse_deceased.yes, field: or-40-p1-26, type: checkbox, on_state: /Yes }  # "Deceased"
  # ---- mailing address
  - { line: mailing_address.street, field: or-40-p1-27, type: text, maxlen: 35 }  # "Current mailing address"
  - { line: mailing_address.city, field: or-40-p1-28, type: text, maxlen: 22 }    # "City" (2024 /MaxLen 22, was 21)
  - { line: mailing_address.state, field: or-40-p1-29, type: text, maxlen: 2 }    # "State"
  - { line: mailing_address.zip, field: or-40-p1-30a, type: text, maxlen: 5 }     # "ZIP code" (first 5)
  - { line: mailing_address.zip_plus4, field: or-40-p1-30b, type: text, maxlen: 4 }  # "ZIP code" (+4)
  - { line: mailing_address.country, field: or-40-p1-31, type: text, maxlen: 21 } # "Country"
  - { line: phone, field: or-40-p1-32, type: text, maxlen: 12 }                   # "Phone"
  # ---- Filing Status (one /Btn field, five mutually exclusive choices)
  - { line: filing_status.single, field: or-40_p1_33, type: checkbox, on_state: /Choice1, group: filing_status }                # 1. Single
  - { line: filing_status.married_filing_jointly, field: or-40_p1_33, type: checkbox, on_state: /Choice2, group: filing_status } # 2. Married filing jointly
  - { line: filing_status.married_filing_separately, field: or-40_p1_33, type: checkbox, on_state: /Choice3, group: filing_status } # 3. Married filing separately (enter spouse information above)
  - { line: filing_status.head_of_household, field: or-40_p1_33, type: checkbox, on_state: /Choice4, group: filing_status }      # 4. Head of household (with qualifying dependent)
  - { line: filing_status.qualifying_surviving_spouse, field: or-40_p1_33, type: checkbox, on_state: /Choice5, group: filing_status }  # 5. Qualifying surviving spouse

  # ============================================ page 2 — exemptions / dependents
  - { line: 6a, field: or-40-p2-1, type: text, maxlen: 1 }   # "6a. Credits for yourself" (count; 2024 /MaxLen 1, was 2)
  - { line: 6a.regular, field: or-40-p2-2, type: checkbox, on_state: /Yes }            # 6a "Regular"
  - { line: 6a.severely_disabled, field: or-40-p2-3, type: checkbox, on_state: /Yes }  # 6a "Severe disability" (2023 wording: "Severely disabled")
  - { line: 6a.someone_else_can_claim, field: or-40-p2-4, type: checkbox, on_state: /Yes }  # 6a "Someone else can claim you as a dependent"
  - { line: 6b, field: or-40-p2-5, type: text, maxlen: 1 }   # "6b. Credits for your spouse" (count; 2024 /MaxLen 1, was 2)
  - { line: 6b.regular, field: or-40-p2-6, type: checkbox, on_state: /Yes }            # 6b "Regular"
  - { line: 6b.severely_disabled, field: or-40-p2-7, type: checkbox, on_state: /Yes }  # 6b "Severe disability"
  - { line: 6b.someone_else_can_claim, field: or-40-p2-8, type: checkbox, on_state: /Yes }  # 6b "Someone else can claim your spouse as a dependent"
  # ---- Dependent 1
