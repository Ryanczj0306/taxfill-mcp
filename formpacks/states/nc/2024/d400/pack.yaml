#       - y_d400wf_ppsigdate (preparer's Date, line "preparer_signature_date")
#         is 51.0pt wide with a FIXED /Cour 9 Tf. A 10-character MM/DD/YYYY
#         value needs 54pt and renders with its leading digit shaved off; an
