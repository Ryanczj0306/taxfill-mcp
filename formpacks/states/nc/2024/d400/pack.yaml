#   * ADVERSARIAL SECOND PASS (the yes/no naming asymmetry is the one thing a
#     full-fill audit cannot test, because it marks every circle). A second
#     fill wrote exactly ONE option per group, deliberately the non-default
#     one, and the render was read: "Were you a resident of N.C. for the
