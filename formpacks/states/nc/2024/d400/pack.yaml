# CORRECTION, 2026-08-21 — this banner previously reported the checkbox
# section as "length ZERO ... a property of this form, not a silent skip: NC
# gives every circle its own single-widget /Btn field, so there is no shared
# radio field for the group check to examine". That rationale was FACTUALLY
# WRONG and it made a real defect read as benign. verify.checkbox_audit keys
# off `PackField.group` (and `required`) alone — it never asks whether the
# widgets share a /T — so a single-widget /Btn topology is no obstacle to
# grouping. The sibling pack states/ri/2024/ri1040 proves it directly: RI's
# five filing-status circles are five SEPARATE AcroForm fields
# (Page1[0].StateFilingStatus_S/_J/_M/_H/_W[0], one widget each, exactly NC's
# shape) and they DO carry `group: filing_status`. The empty section was this
# pack's own omission — zero `group:` keys — not a property of the blank.
#
# CHECKBOX GROUPS (added 2026-08-21; pitfalls P-003 + P-008). Before this,
# the pack declared ZERO groups, so verify's mutually-exclusive-group guard
# and fill_form's write-time refusal were both INERT for this form. Proved,
# not theorised: fill_form(pack, {'filing_status::single': True,
# 'filing_status::hoh': True, '11_nc_standard_deduction': True,
# '11_nc_itemized_deductions': True, 'residency_taxpayer::yes': True,
# 'residency_taxpayer::no': True}) wrote all 6 widgets with no warning and
# verify_form returned 6/6 assertions PASS with ZERO checkbox checks and ZERO
# non-relation FAILs — while the contradiction PRINTS on the filed return,
# against the form's own "Fill in one circle only" on both the Filing Status
# block and line 11. Because NC's circles are 22 INDEPENDENT single-widget
# /Btn fields with no shared parent, the pre-existing same-field guards
# (filler's shared-AcroForm-field check, the pack gate
# test_pack_radio_options_share_one_group_and_distinct_states) can never fire
# here: `group` is the ONLY mechanism that makes these sets exclusive.
#   * SEVEN groups, 17 members, read off the printed face (not from key
#     names) and identical in the 2023 and 2024 blanks — the two faces are
#     textually identical apart from the year strings, the line-15 rate and
#     the revision stamp, and the 22 /Btn widget /Rects are byte-identical:
#     filing_status (5), line11 (2), residency_taxpayer (2),
#     residency_spouse (2), veteran_taxpayer (2), veteran_spouse (2),
#     federal_extension (2). Each member's group is justified at its binding.
#   * `required: true` on filing_status ONLY. Reasoning is per group and is
#     recorded at each binding; the rule applied is that a group a legitimate
#     filer may leave ENTIRELY blank must not be required, or verification
#     FAILs on honest returns (the P-008 lesson). Only the filing-status
#     block fails that test — no D-400 exists without a filing status. The
#     at-most-one check applies to every group regardless of `required`,
#     which is what closes the reproduced hole.
#   * FIVE checkboxes stay deliberately UNGROUPED, and that is an
#     adjudication rather than an omission: amended_return, out_of_country,
#     deceased_signed_by_representative, 18_no_consumer_use_tax_due and
#     authorize_preparer_discussion are each a LONE "Fill in circle if ..." /
