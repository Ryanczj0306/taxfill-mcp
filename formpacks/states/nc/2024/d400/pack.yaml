#     (veteran_taxpayer::no -> y_d400wf_v2no, not v1no; veteran_spouse::no ->
#     y_d400wf_sv1no) DO hit the circles their line ids claim. No swap.
#   * TWO CLIPPING OBSERVATIONS the render caught and verify's clipping scan
#     did NOT (it passed 68/68). Both are inherited — the widget /Rect and
