  - line: spouse_signature_date
    field: y_d400wf_sigdate2
    type: text
  - line: contact_phone_number
    field: y_d400wf_dayphone
    type: text
  # UNGROUPED single: "Check here if you authorize the North Carolina
  # Department of Revenue to discuss this return and attachments with the
  # paid preparer below." One circle, no partner. Not `required`.
  - line: authorize_preparer_discussion
    field: y_d400wf_check
    type: checkbox
    on_state: /Yes
  # maxlen 8 is MECHANICAL, not cosmetic (was prose-only until 2026-08-21).
  # y_d400wf_ppsigdate is 50.99pt wide with a FIXED "/Cour 9 Tf" — Courier is
  # monospace at 0.6em, so 5.4pt per character: 8 chars = 43.2pt (fits), 10
  # chars = 54.0pt (overflows by 3pt). PROVED by a 400-dpi render read at 3x:
  # "12/31/2024" printed with its leading "1" shaved to a bare stem AND its
  # trailing "4" cut mid-glyph (the widget is /Q 1 centered, so it clips at
  # BOTH ends), while "12-31-24" printed fully with clear margins — MM-DD-YY
  # being the date format this form prints beside every other date box.
  # verify's width heuristic cannot catch it: the widget carries no /MaxLen,
  # and the scan models Helvetica at 0.5em (10 x 0.5 x 9 = 45.0pt < 50.99pt
  # -> PASS), which UNDERSTATES monospace Courier. So the cap has to come
  # from the pack; with it, fill_form raises at write time instead.
  # Deliberately NOT applied to the two sibling signature dates: the same
  # render shows y_d400wf_sigdate2 (54.31pt) printing all 10 characters of
  # "12/31/2024" cleanly, and y_d400wf_sigdate is wider still at 65.05pt, so
  # capping either would reject values that demonstrably render correctly.
  - line: preparer_signature_date
    field: y_d400wf_ppsigdate
    type: text
    maxlen: 8
  - line: preparer_fein_ssn_ptin
    field: y_d400wf_ppssn
    type: text
    maxlen: 9
  - line: preparer_contact_phone_number
    field: y_d400wf_ppphoneno
    type: text
