#
# KNOWLEDGE CROSS-CHECK (knowledge/states/nc/2025.yaml, not edited): the
# face's 4.25% / 0.0425 rate, the "April 15, 2026" out-of-country date
# (filing_due_date '2026-04-15') and the two mailing addresses printed on
# form page 2 ("If REFUND ... P.O. BOX R, RALEIGH, NC 27634-0001"; "If you
# ARE NOT due a refund ... P.O. BOX 25000, RALEIGH, NC 27640-0640") all
# agree with the knowledge pack. The blank prints no statutory dollar figure
# (the Education Endowment sentence leaves "$ ____" blank). No mismatch.
#
# CROSS_FORM. The 2025 Form 1040 prints AGI on line 11a (federal/2025/f1040
# maps "11a"; 2024 printed it on line 11), so the single leg is re-pointed
