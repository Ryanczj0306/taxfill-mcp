# for every widget — including y_d400wf_Ex_good, whose 2024 5-pt shift is
# unchanged. The only content diff: y_d400wf_dead3's /Opt list rolled
# [' ', '2022', '2023 '] -> [' ', '2023 ', '2024'] (the DOR's trailing space
