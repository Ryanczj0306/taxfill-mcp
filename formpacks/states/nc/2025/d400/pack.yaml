#
# READONLY ADJUDICATION (knowledge/pitfalls.yaml P-007), re-dumped from the
# 2025 blank: exactly ONE ReadOnly field, "PRINT" (/Tx, /Ff 1, two widgets
# at /Rect [0, 0.9, 33.6, 792] and [577.4, 0.9, 611.0, 792] — the full-height
# left and right margin bars of form page 1), whose /V and /DV read "OTHER
