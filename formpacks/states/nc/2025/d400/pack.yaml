# filing_status (5, "(Fill in one circle only)", the one `required` group),
# line11 (2, "(Fill in one circle only. See Form D-400 Schedule A.)"),
# residency_taxpayer (2), residency_spouse (2), veteran_taxpayer (2),
# veteran_spouse (2), federal_extension (2). FIVE lone widgets — four "Fill
# in circle if ..." circles and the one "Check here if ..." square box — stay
