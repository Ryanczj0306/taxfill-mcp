  - line: f538s.spouse.identifying_number   # Spouse's Social Security Number
    field: "538-S sSSN1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: f538s.spouse.date_of_death        # spouse "If deceased in 2025 or 2026, enter date of death"
    field: "538-S sSSN1-1"
    type: text
  - line: f538s.name.first                  # Taxpayer's First Name
    field: "538-S Taxpayer First Name"
    type: text
  - line: f538s.name.middle_initial         # Middle Initial
    field: "538-S Taxpayer Middle Initial"
    type: text
    maxlen: 3
  - line: f538s.name.last                   # Last Name
    field: "538-S Taxpayer Last Name"
    type: text
  - line: f538s.spouse.name.first           # Spouse's First Name
    field: "538-S Spouse First Name"
    type: text
  - line: f538s.spouse.name.middle_initial  # Middle Initial
    field: "538-S Spouse Middle Initial"
    type: text
    maxlen: 3
  - line: f538s.spouse.name.last            # Last Name
    field: "538-S Spouse Last Name"
    type: text
  - line: f538s.mailing_address.street      # Mailing Address (Number and street ...)
    field: "538-S Mailing Address"
    type: text
  - line: f538s.mailing_address.city        # City
    field: "538-S City"
    type: text
  - line: f538s.mailing_address.state       # State
    field: "538-S State"
    type: text
    maxlen: 3
  - line: f538s.mailing_address.zip         # ZIP
    field: "538-S ZIP"
    type: text
    maxlen: 10                                # the 2025 box is 65.6 pt wide (2023: 71.9 pt), Cour 10, no widget /MaxLen; a probe fill rendered 10 characters (a ZIP+4 like 73126-0800) whole and clipped the 11th
  - line: f538s.physical_address            # Part 1: Physical Address in 2025
    field: "538-S Physical Address"
    type: text
  - line: f538s.physical_disability         # "X if you or your spouse have a physical disability ..."
    field: "538-S Physical Disability"
    type: checkbox
    on_state: /Yes
  - line: f538s.age_65                       # "X if you or your spouse are 65 years of age or over"
    field: "538-S 65 or Over"
    type: checkbox
    on_state: /Yes
  - line: f538s.oklahoma_resident.yes        # "Oklahoma resident for the entire year? yes"
    field: "538-S Oklahoma Resident"
    type: checkbox
    on_state: /Yes
    group: f538s.oklahoma_resident
  - line: f538s.oklahoma_resident.no         # "... no"
    field: "538-S Oklahoma Resident"
    type: checkbox
    on_state: /No
    group: f538s.oklahoma_resident
  # ---- Part 2: Dependents (4 rows: name / age / SSN / relationship / yearly income)
  - line: f538s.dependent_1.name
    field: "538-S Part 2 1a"
    type: text
  - line: f538s.dependent_1.age
    field: "538-S Part 2 2a"
    type: text
    maxlen: 3
  - line: f538s.dependent_1.ssn
    field: "538-S Part 2 3a-1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: f538s.dependent_1.relationship
    field: "538-S Part 2 4a"
    type: text
  - line: f538s.dependent_1.yearly_income
    field: "538-S Part 2 5a"
    type: money
  - line: f538s.dependent_2.name
    field: "538-S Part 2 1b"
    type: text
  - line: f538s.dependent_2.age
    field: "538-S Part 2 2b"
    type: text
    maxlen: 3
  - line: f538s.dependent_2.ssn
    field: "538-S Part 2 3b-1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: f538s.dependent_2.relationship
    field: "538-S Part 2 4b"
    type: text
  - line: f538s.dependent_2.yearly_income
    field: "538-S Part 2 5b"
    type: money
  - line: f538s.dependent_3.name
    field: "538-S Part 2 1c"
    type: text
  - line: f538s.dependent_3.age
    field: "538-S Part 2 2c"
    type: text
    maxlen: 3
  - line: f538s.dependent_3.ssn
    field: "538-S Part 2 3c-1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: f538s.dependent_3.relationship
    field: "538-S Part 2 4c"
    type: text
  - line: f538s.dependent_3.yearly_income
    field: "538-S Part 2 5c"
    type: money
  - line: f538s.dependent_4.name
    field: "538-S Part 2 1d"
    type: text
  - line: f538s.dependent_4.age
    field: "538-S Part 2 2d"
    type: text
    maxlen: 3
  - line: f538s.dependent_4.ssn
    field: "538-S Part 2 3d-1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: f538s.dependent_4.relationship
    field: "538-S Part 2 4d"
    type: text
  - line: f538s.dependent_4.yearly_income
    field: "538-S Part 2 5d"
    type: money
  # ---- Exemption Information (A Yourself, B Spouse, C dependents, D total)
  - line: f538s.exemptions.yourself          # A. Yourself
    field: "538-S Exemptions A"
    type: text
    maxlen: 1
  - line: f538s.exemptions.spouse            # B. Spouse
    field: "538-S Exemptions B"
    type: text
    maxlen: 1
  - line: f538s.exemptions.dependents        # C. Number of dependents
    field: "538-S Exemptions C1"
    type: text
    maxlen: 2
  - line: f538s.exemptions.total             # D. Total exemptions claimed (add A-C)
    field: "538-S Exemptions D1"
    type: text
    maxlen: 2
  # ---- Part 3: Gross Income (lines 1-14; 1-8 on page 50, 9-14 on page 51)
  - line: f538s.1                            # 1 Total wages, salaries, fees, commissions, bonuses, and tips
    field: "538-S Part 3 1"
    type: money
  - line: f538s.2                            # 2 Total interest and dividend income received
    field: "538-S Part 3 2"
