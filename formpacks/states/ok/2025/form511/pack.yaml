    field: "538-S Part 3 7"
    type: money
  - line: f538s.8                            # 8 Unemployment benefits
    field: "538-S Part 3 8"
    type: money
  - line: f538s.identifying_number_page2    # page-51 header "Your Social Security Number:" -- its own field
    field: "538-S Your Social Security Number"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: f538s.9                            # 9 Earned Income Credit (EIC) received in 2025
    field: "538-S Part 3 9"
