# Homeschool Expenses (provide Form 591-D) / Total number of eligible students
# claimed"; 2023's line 29 is now 30. Page 3: line 31 "add lines 21-30 from page
# 2", 33 "line 31 minus 32", 34 overpayment, 35 "applied to 2026 estimated tax",
# 36 donations, 37 "add lines 35 and 36", 38 "line 34 minus line 37", 39 tax
# due, 40 underpayment interest, 41 (a) "penalty of 5%" / (b) "interest of 1.25%
# per month", 42 "add lines 39 through 41b". Schedule 511-A: NEW 15 "Oklahoma
# Bonus Depreciation Deduction", NEW 16 "Oklahoma Deduction for Qualified Equity
