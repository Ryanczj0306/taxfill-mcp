  - line: f538s.identifying_number          # Taxpayer's Social Security Number
    field: "538-S SSN1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: f538s.date_of_death               # "If deceased in 2025 or 2026, enter date of death"
    field: "538-S SSN1-1"
