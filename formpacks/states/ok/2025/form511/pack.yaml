# 22 explanation rows (2023: 20). 538-S: "If deceased in 2025 or 2026",
# "Physical Address in 2025", "EIC received in 2025", "x $40", "carry the credit
# to Form 511, line 25". 2025 drops the printed "00" cents suffix that 2023
# put after every amount box: the amount lines are plain underlines under
# "ROUND TO NEAREST WHOLE DOLLAR.", so `money` (whole dollars) is unchanged.
# Face erratum, carried from 2023 unchanged: line 18 still prints "DO NOT PAY
# THIS AMOUNT. PAYMENT IS FIGURED ON LINE 41." although the total due is now
# line 42 (41 is the penalty/interest split); no binding depends on it.
# knowledge/states/ok/2025.yaml agrees with every figure it
# carries ($6,350 / $12,700 / $9,350, $1,000, $40, 5%, 20%, $100,000, 511-B lines
# 1-9 totalled on 10).
#
# Form 511, 2025 -- Oklahoma Resident Individual Income Tax Return.
#
# Provenance / freshness: see URL + DIGEST and PRINTED IDENTITY above.
#
# Layout / what is FILED vs SKIPPED. The 511 Packet is mostly an INSTRUCTION
# BOOKLET. The fillable AcroForm widgets live only on PDF pages 42-51; pages
# 1-41 (cover, instructions, tax tables, worksheets) and page 52 carry NO
# widgets and are NOT filed -- they are SKIPPED, same discipline as the LA
# IT-540 booklet. Mapped pages (1-indexed PDF page = printed "Page N"):
#   page 42 = Form 511 Page 1  -- header (2 SSNs + deceased flags, names,
#             mailing address, county, foreign country, Amended flag), Filing
#             Status (ONE /Btn radio with 5 on_states), Exemptions grid
#             (Regular/Special/Blind x Yourself/Spouse, dependents count,
#             total), Age-65 flags, Dependents table (4 rows), Part One lines
#             1-7, Part Two lines 8-9.
#   page 43 = Form 511 Page 2  -- header SSN, Part Two lines 10-18 (14 split
#             into 14a/14b/14 method-code + 14 total; 17 has a 511-CR line-#
#             box) and Part Three lines 19-30 (19 + no-use-tax box; 22
#             qualified-farmer box; 29 + eligible-students count box).
#   page 44 = Form 511 Page 3  -- Part Three 31-33, Part Four refund 34-38 +
#             direct-deposit block, Part Five amount-you-owe 39-42 (40 + the
#             annualized-installment box; 41 split 41a/41b), signature block
#             (discuss box, occupations, phones, preparer). Mailing address
#             printed here: PO Box 26800, Oklahoma City, OK 73126-0800.
#   page 45 = Schedule 511-A (Subtractions 1-18) + Schedule 511-B lines 1-6
#   page 46 = Schedule 511-B lines 7-10 + Schedule 511-C (Adjustments 1-7) +
#             Schedule 511-D (Itemized 1-11)
#   page 47 = Schedule 511-E (Deductions/Exemptions 1-5) + Schedule 511-F
#             (Child Care/Child Tax Credit 1-7)
#   page 48 = Schedule 511-G (Earned Income Credit 1-4) + Schedule 511-H
#             (Donations from Refund 1-3)
#   page 49 = Schedule 511-I (Amended Return Information: Yes/No + 22 change lines)
#   pages 50-51 = Form 538-S (Claim for Credit/Refund of Sales Tax) -- a distinct
#             OTC form filed WITH the 511 to claim the line-25 Sales Tax Relief
#             Credit; mapped here under the f538s.* namespace.
#
# Line-id scheme. The CORE Form 511 numbered lines keep their bare printed labels
# (1..42, with .a/.b column splits e.g. 4a/4b, 14a/14b, 41a/41b). The attached
# 511 schedules are namespaced sch_511a.* .. sch_511i.* and Form 538-S as f538s.*
# so their own line numbers do not collide with the core return's lines. Keys
# follow THIS year's printed numbers, so a key whose number survived from 2023
# may name a different printed line (see NEIGHBOUR THEFT above).
#
# AcroForm. FLAT form: acroform_root = '' . Every widget's /T is the raw flat id
# the form ships with (e.g. "511 Part 1 1", "511A 18", "538-S Part 4 15-3"); the
# one field whose kid carries its own /T (so the filler joins the names) is the
# foreign-country box above. 318 widget entries exist
# across pages 42-51. The continuation-page header SSN ("511a SSN1", one field
# repeated on pages 43-49) and the 538-S page-2 header SSN are mapped as
# identity mirrors.
#
# Money vs text. Every numbered dollar line is `money` (whole dollars; "ROUND TO
# NEAREST WHOLE DOLLAR."). Percentage lines (511E line 4, 511F line 6, 511G
# line 3) and the ratio numerator/denominator boxes (xx 6a/6b, 3a/3b) stay
# `text`. Method/Type code boxes (14-1, 511-CR line #, schedule "Other"
# type-code boxes, donation line-# box) and counts (exemptions grid, eligible
# students, 538-S exemptions A-D) stay `text`. Routing/account numbers, names,
# SSNs, occupations, phones, descriptions, and retirement claim numbers stay
# `text`.
#
# Checkboxes / radio groups. Filing Status is ONE /Btn field named "Filing Status"
# with five distinct on_states (/Single /Married Joint /Married Separate /HoH
# /Widower); per CONVENTIONS each option is its own line sharing that field +
# group "filing_status". Likewise the 538-S "Send my refund as a:" / account /
# outside-US groups, and the 511-H per-row "$2/$5/Other" amount selectors, are one
# /Btn each with distinct on_states -> shared group. All other boxes are
# independent single-state /Yes (or /No) flags (deceased, amended, age-65, dep>4,
# no-use-tax, qualified-farmer, line-40, discuss, 511D-7 yes/no, 511I yes/no).
#
# Relations. Single-box on-face arithmetic where every operand is mapped to a
# line. Lines that floor at zero ("do not enter less than zero": 18) or branch on
# a comparison (34/39, 38) are not declared. Schedule totals that are plain
# "add lines a-b" sums are declared with dotted line ids.
#
# Cross_form. Form 511 Part One line 1 prints "Federal adjusted gross income (from
# Federal 1040 or 1040-SR)" -- federal AGI, which the 2025 Form 1040 prints on
# line 11a = f1040.11a.
form: "511"
jurisdiction: states/ok
tax_year: 2025
source_url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/current/511-Pkt.pdf
pdf_sha256: "c90cf30381cca6262ec94050acde8db1ee58885360f0af4ec21e045d1cc5a572"
acroform_root: ''
fields:
  # ============================================ page 42 -- Form 511 Page 1 header
  - line: identifying_number              # "Your Social Security Number"
    field: "511 SSN1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: deceased.taxpayer               # "X if this taxpayer is deceased"
    field: "Deceased 1"
    type: checkbox
    on_state: /Yes
  - line: spouse.identifying_number       # "Spouse's Social Security Number (joint return only)"
    field: "511 sSSN1"
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: spouse.deceased                 # "X if this taxpayer is deceased" (spouse)
    field: "Deceased 2"
    type: checkbox
    on_state: /Yes
  - line: amended_return.yes              # "X if this is an amended 511. See Schedule 511-I."
    field: "Amended"
    type: checkbox
    on_state: /Yes
  - line: name.first                      # "Your First Name"
    field: "511 Your First Name"
    type: text
  - line: name.middle_initial             # "Middle Initial"
    field: "511 Your Middle Initial"
    type: text
    maxlen: 3
  - line: name.last                       # "Last Name"
    field: "511 Your Last Name"
    type: text
  - line: spouse.name.first               # "If a Joint Return, Spouse's First Name"
    field: "511 sFirst Name"
    type: text
  - line: spouse.name.middle_initial      # "Middle Initial"
    field: "511 sMiddle Initial"
    type: text
    maxlen: 3
  - line: spouse.name.last                # "Last Name"
    field: "511 sLast Name"
    type: text
  - line: mailing_address.street          # "Mailing Address (Number and street ...)"
    field: "511 Address"
    type: text
  - line: mailing_address.city            # "City"
    field: "511 City"
    type: text
  - line: mailing_address.state           # "State"
    field: "511 State"
    type: text
    maxlen: 2                             # the 2025 box is 19.2 pt wide (2023: 25.0 pt), Cour 10, no widget /MaxLen; a probe fill rendered 2 letters whole and clipped the 3rd
  - line: mailing_address.zip             # "ZIP or Postal Code"
    field: "511 ZIP"
    type: text
    maxlen: 10
  - line: county                          # NEW 2025 -- "County in Which Located" (the box where 2023 printed "Country")
    field: "511 County"
    type: text
  - line: mailing_address.country         # "Foreign Country (if not U.S.):" -- 2025 moved it to its own row below
    field: "511 Foreign Country if not U.S"
    type: text
    maxlen: 23

  # ---- Filing Status (ONE /Btn radio, group filing_status)
  - line: filing_status.single            # "1 Single"
    field: "Filing Status"
    type: checkbox
    on_state: /Single
    group: filing_status
  - line: filing_status.married_filing_joint  # "2 Married filing joint return"
    field: "Filing Status"
    type: checkbox
    on_state: /Married Joint
    group: filing_status
  - line: filing_status.married_filing_separate  # "3 Married filing separate"
    field: "Filing Status"
    type: checkbox
    on_state: /Married Separate
    group: filing_status
  - line: filing_status.head_of_household  # "4 Head of household with qualifying person"
    field: "Filing Status"
    type: checkbox
    on_state: /HoH
    group: filing_status
  - line: filing_status.qualifying_widow   # "5 Qualifying surviving spouse with dependent child"
    field: "Filing Status"
    type: checkbox
    on_state: /Widower
    group: filing_status
  - line: filing_status.separate_spouse_name  # "3 (If spouse is also filing, list name and SSN below) Name"
    field: "Status 3a"
    type: text
  - line: filing_status.separate_spouse_ssn   # "3 ... Social Security Number"
    field: "Status 3b"
    type: text
    maxlen: 9
  - line: filing_status.widow_year         # "5 List year of spouse death here"
    field: "Status 5a"
    type: text
    maxlen: 4

  # ---- Exemptions grid (Regular/Special/Blind by Yourself/Spouse; dependents; total)
  - line: exemptions.yourself.regular      # "Yourself - Regular"
    field: "Exemptions 1"
    type: text
    maxlen: 1
  - line: exemptions.yourself.special      # "Yourself - Special"
    field: "Exemptions 2"
    type: text
    maxlen: 1
  - line: exemptions.yourself.blind        # "Yourself - Blind"
    field: "Exemptions 3"
    type: text
    maxlen: 1
  - line: exemptions.yourself.total        # "(a)" total for yourself row
    field: "Exemptions 4"
    type: text
    maxlen: 1
  - line: exemptions.spouse.regular        # "Spouse - Regular"
    field: "Exemptions 5"
    type: text
    maxlen: 1
  - line: exemptions.spouse.special        # "Spouse - Special"
    field: "Exemptions 6"
    type: text
    maxlen: 1
  - line: exemptions.spouse.blind          # "Spouse - Blind"
    field: "Exemptions 7"
    type: text
    maxlen: 1
  - line: exemptions.spouse.total          # "(b)" total for spouse row
    field: "Exemptions 8"
    type: text
    maxlen: 1
  - line: exemptions.dependents            # "(c) Number of dependents"
    field: "Exemptions 9"
    type: text
    maxlen: 2
  - line: exemptions.total                 # "Add the Totals from lines (a), (b), and (c). Enter the TOTAL here"
    field: "Exemptions 10"
    type: text
    maxlen: 2

  # ---- Age 65 or Older?
  - line: age_65.yourself                  # "Age 65 or Older? Yourself"
    field: "511 65 Yourself?"
    type: checkbox
    on_state: /Yes
  - line: age_65.spouse                    # "Age 65 or Older? Spouse"
    field: "511 65 Spouse?"
    type: checkbox
    on_state: /Yes

  # ---- Dependents (more-than-four flag + 4-row table)
  - line: dependents.more_than_four        # "If more than four dependents ... place an 'X' here"
    field: "Dependents, if more than four, check here"
    type: checkbox
    on_state: /Yes
  - line: dependent_1.name.first
    field: "511 Dependents First Name 1"
    type: text
  - line: dependent_1.name.last
    field: "511 Dependents Last Name 1"
    type: text
  - line: dependent_1.ssn
    field: "511 Dependents SSN 1"
    type: text
  - line: dependent_1.date_of_birth
    field: "511 Dependents Date of Birth 1"
    type: text
  - line: dependent_1.relationship
    field: "511 Dependents Relationship 1"
    type: text
  - line: dependent_2.name.first
    field: "511 Dependents First Name 2"
    type: text
  - line: dependent_2.name.last
    field: "511 Dependents Last Name 2"
    type: text
  - line: dependent_2.ssn
    field: "511 Dependents SSN 2"
    type: text
  - line: dependent_2.date_of_birth
    field: "511 Dependents Date of Birth 2"
    type: text
  - line: dependent_2.relationship
    field: "511 Dependents Relationship 2"
    type: text
  - line: dependent_3.name.first
    field: "511 Dependents First Name 3"
    type: text
  - line: dependent_3.name.last
    field: "511 Dependents Last Name 3"
    type: text
  - line: dependent_3.ssn
    field: "511 Dependents SSN 3"
    type: text
  - line: dependent_3.date_of_birth
    field: "511 Dependents Date of Birth 3"
    type: text
  - line: dependent_3.relationship
    field: "511 Dependents Relationship 3"
    type: text
  - line: dependent_4.name.first
    field: "511 Dependents First Name 4"
    type: text
  - line: dependent_4.name.last
    field: "511 Dependents Last Name 4"
    type: text
  - line: dependent_4.ssn
    field: "511 Dependents SSN 4"
    type: text
  - line: dependent_4.date_of_birth
    field: "511 Dependents Date of Birth 4"
    type: text
  - line: dependent_4.relationship
    field: "511 Dependents Relationship 4"
    type: text

  # ---- PART ONE: Oklahoma Adjusted Gross Income (lines 1-7)
  - line: "1"                              # 1 Federal adjusted gross income (from Federal 1040 or 1040-SR)
    field: "511 Part 1 1"
    type: money
  - line: "2"                              # 2 Oklahoma Subtractions (provide Schedule 511-A)
    field: "511 Part 1 2"
    type: money
  - line: "3"                              # 3 Line 1 minus line 2
    field: "511 Part 1 3"
    type: money
  - line: 4a                               # 4 Out-of-state income, except wages. Describe:
    field: "511 Part 1 4a"
    type: text
  - line: 4b                               # 4 (amount column)
    field: "511 Part 1 4b"
    type: money
  - line: "5"                              # 5 Line 3 minus line 4
    field: "511 Part 1 5"
    type: money
  - line: "6"                              # 6 Oklahoma Additions (provide Schedule 511-B)
    field: "511 Part 1 6"
    type: money
  - line: "7"                              # 7 Oklahoma adjusted gross income (line 5 plus line 6)
    field: "511 Part 1 7"
