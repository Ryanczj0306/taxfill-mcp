# ===========================================================================
# TY2024 RE-MAP of formpacks/states/mi/2023/mi1040/pack.yaml (ported 2026-10-04,
# Phase J JS5; triaged RE-MAP — 29 of the 85 mapped field names gone).
#
# URL. Michigan Treasury's "2024 Individual Income Tax Forms" page
# (https://www.michigan.gov/taxes/iit-forms/2024-individual-income-tax-forms)
# links the MI-1040 as the source_url below, query string included (the ?rev=
# &hash= pair is a CMS cache key, and it differs from the 2023 link's). Two
# separate downloads of that link, a download of the same path without the query
# string, and the JS5 triage copy all hash to 5ba97732fad0... (502,185 bytes,
# %PDF-1.7, AcroForm, 3 pages, Adobe PDF Library 9.9, ModDate 2025-01-27;
# encrypted with an empty user password and printing allowed, as the 2023 blank
# was).
#
# PRINTED IDENTITY. Page 1 prints "Michigan Department of Treasury (Rev. 04-24),
# Page 1 of 3", "2024 MICHIGAN Individual Income Tax Return MI-1040" and "Return
# is due April 15, 2025"; pages 2-3 print "2024 MI-1040, Page 2 of 3" / "Page 3
# of 3". Scan lines "+ 0000 2024 05 01 27 0", "... 05 02 27 8", "... 05 03 27 6".
# printed_year_verified = 2024. (The base is the 2023 pack; the 2025 pack is a
# re-map of the same 2023 base, not a source for this year.)
#
# AcroForm topology against the 2023 blank (a widget census of the 2023 pack plus
# a /Rect pairing of every widget on all three pages). 95 -> 95 widgets, and every
# one but two (the 32a / 32b boxes, below) sits at the identical /Rect on the same
# page; a layout diff of the printed text finds 99-100 percent of the printed
# words within 0.5 pt of their 2023 positions (page medians 0.00 / 0.00).
# Still flat, still no ReadOnly widget, no /CO calculation order and no XFA; the
# only JavaScript is the Reset button's confirm-and-reset action, AFNumber /
# AFSpecial format+keystroke, and an upper-casing validate on the name, address
# and preparer boxes, so nothing on this form computes. The census counts 56
# mapped names SAME and 29 GONE; 28 are pure renames at the identical position
# and the 29th, 'Filing status', split into three single-widget fields:
#   * Check Box5 -> "5b Checkbox Spouse"; "*" -> "Line 7 Spouse Full Name";
#     Check Box11 / Check Box12 and the 8a "Residency status" ->
#     "8b Checkbox Nonresident" / "8c Checkbox Part-Year Resident" / "8a Checkbox
#     Resident"; "9a".."9d" -> "9a Number of Exemptions" / "9b Number of Qualified
#     Special Exemptions" / "9c Number of Qualified Disabled Veterans" / "9d Number
#     of Certificates of Stillbirth"; "line 9a".."line 9f" -> "Line 9a Total" /
#     "Line 9b total" (sic, lower-case t) / "Line 9c Total" / "Line 9d Total" /
#     "Line 9e Total" / "Line 9f Total"; Check Box13 -> "9e Claimed as Dependent
#     Checkbox"; "line 10" -> "Line 10" (capital L; lines 11-17 keep their names).
#   * Page 2: "31a" / "Line 31b" (the 32a / 32b boxes) -> "32a Checkbox" (/Yes) /
#     "32b checkbox" (/No). The two boxes keep their left and bottom edges and are about
#     1.3 pt and 2.0 pt taller than the 2023 ones.
#   * Page 3: "Text1".."Text6" -> "Filer Month" / "Filer Day" / "Filer Year" /
#     "Spouse Month" / "Spouse Day" / "Spouse Year"; "preparer's PTIN" ->
#     "preparer's PTIN, FEIN, or SSN"; "preparer's business" -> "Perparer's Name"
#     (sic, the blank's own spelling; /TU reads "Preparer's Name"); "preparer's
#     business address" -> "Preparer's Business Name, Address, Telephone".
#   * SPLIT INTO SEPARATE FIELDS: the 2023 filing status was ONE /Btn ("Filing
#     status", three kids /single /married filing jointly /married filing
#     separately). 2024 ships three single-widget fields ("7a Filing status
#     Checkbox Single", "7b Filing Status Checkbox Married filing jointly", "7c
#     Filing Status Checkbox Married filing separately") with the same three
#     on_states, so the options now carry a group id (7_filing_status).
#   * UNCHANGED: every other name (Amended return box, the name / initial / SSN /
#     address boxes, School District Code, Check Box4 / Check Box6, lines 11-17,
#     18a-33 "line NN" names including "Line 19b", "line 32 c", "Line 34
#     Interest", "Line 34 Penalty", "Line 37", routing, account number, the two
#     "type checking" widgets, authorize box). The type-of-account question is
#     still ONE /Btn ("type checking", /Yes = Checking, /No = Savings).
#   * NEW widgets: none beyond the renamed ones above. Nothing is left unmapped
#     except the "Reset" push-button (Ff bit 17, form action) and the FSSN1-3
#     repeats atop pages 2 and 3 (extra widgets of the same fields, mapped once).
#   * /MaxLen, /Ff, /DA and the checkbox on-state names are identical to the 2023
#     widgets at every paired /Rect (SSN cells 3/2/4, State 2, School District
#     Code 5, exemption counts 2, date-of-death 2/2/4; the date-of-death boxes
#     are separate MM / DD / YYYY widgets with DoNotScroll + DoNotSpellCheck, not
#     combs). Text /DA is Helv 10 except "F Last Name", "Sp First Name" and
#     "Sp Last Name" (Helv 0, auto-size) and the line-34 Interest / Penalty boxes
#     (Helv 12, as in 2023). The 95 widgets are 88 distinct fields (six SSN
#     repeats on pages 2-3, and the two "type checking" widgets are one field);
#     less Reset that is 87 data fields, all mapped here as 88 lines (the account
#     type is two lines on one field).
#
# FACE DELTAS vs 2023 (a diff of the printed text; the layout is identical, so no
# line renumbered). Rev. 10-23 -> Rev. 04-24; every "2023" -> "2024" (filing and
# residency status headings, line 32 amended returns, the date-of-death example
# 04-15-2024), due date April 15, 2024 -> April 15, 2025; "Filer and/or Spouse
# died after December 31, 2023" (was 2022); line 9 exemptions "x $5,600" (9a),
# "x $3,300" (9b), "x $500" (9c), "x $5,600" (9d) (2023: $5,400 / $3,100 / $400 /
# $5,400), the line-9 NOTE "enter $1,500 on line 9e" unchanged; line 17 "Multiply
# line 16 by 4.25% (0.0425)" (2023: 4.05% (0.0405)); line 31 "... and 2023 credit
# forward"; line 36 "credited to your 2025 estimated tax for your 2025 tax
# return". Unchanged: lines 10-16 and 18-35 wording and numbering, line 27 EITC
# "Multiply line 27a by 30% (0.30)", line 33 "Add lines 25, 26, 27b, 28, 29, 30,
# 31 and 32c", "Pay amount on line 34". knowledge/states/mi/2024.yaml records the
# same 4.25%, $5,600 / $3,300 / $500 / $5,600 / $1,500 and the 30% EITC, and its
# claimed_on lines (property tax credit line 25, pay amount on line 34) match this
# face.
#
# LINE KEYS. Numbered lines are keyed by the printed number of THIS face; the 2024
# numbering is the 2023 numbering, so every key of the 2023 pack is kept
# (32a_amended_refund, 32b_amended_tax, 34_interest, 34_penalty included). The
# line-key grammar needs no change.
#
# GROUPS (new this year). 7_filing_status (three separate fields), account_type
# (two options on the one "type checking" field; the 2023 pack carries it as a
# listed ungrouped set, this pack groups it) and 32_amended_adjustment (the 32a /
# 32b boxes set the sign of the one 32c amount, so they are alternatives).
# Residency stays ungrouped: the face says "Check all that apply".
#
# RENDER CHECK. Every mapped line was confirmed on sentinel renders of this blank,
# pages 1-3 (one distinct sentinel per line; the alternates of each checkbox
# group and the short text boxes, namely initials, SSN cells, State, school code,
# exemption counts and date-of-death cells, were filled separately with distinct
# short sentinels), not from field names.
#
# Unresolved: the line 9f sum ('Add lines 9a, 9b, 9c, 9d and 9e') is not declared
# as a relation; see Relations.
# ===========================================================================
#
# Form MI-1040, 2024 — Michigan Individual Income Tax Return.
#
# Layout. Flat AcroForm (acroform_root empty). Field names are the raw ids the
# 2024 blank ships, kept EXACTLY, misspellings included ("Perparer's Name",
# "Line 9b total", the on_state "/State campaing fund spouse"). The numbered
# income/tax lines use widgets named "Line 10", "line 11" .. "line 33" (the
# blank's inconsistent casing is kept: "Line 10", "Line 19b", "Line 37", the
# spaced "line 32 c"). The SSN comb (FSSN1/FSSN2/FSSN3, three cells of 3/2/4
# digits) prints atop all three pages but is ONE AcroForm field per cell with
# several widget annotations (pypdf exposes it once), so it is mapped a single
# time in the page-1
# header. The red "Reset Form" push-button accepts no data and is not mapped.
#
# Radio / checkbox questions. Single yes/no boxes are one /Btn each, carrying the
# exact on_state read from the widget AP /N dictionaries (preserved verbatim,
# including the misspelled "/State campaing fund spouse"). Filing status is three
# separate /Btn fields, one group. Residency status is three separate /Btn fields
# ("Check all that apply", ungrouped). The Type-of-Account question is ONE /Btn
# ("type checking") with /Yes = Checking and /No = Savings.
#
# Money vs text. Every numbered dollar box prints a ".00" cents suffix and is
# mapped `money` (lines 9a-9f amounts, 10-37, 18a/18b, 19a/19b, 27a/27b, 32c, and
# the Interest/Penalty boxes on line 34). Genuine text widgets stay text: names,
# address/city/state/ZIP, school-district code, the spouse full-name box, SSN
# cells (3/2/4), the small 2-digit exemption COUNT boxes (9a-9d), bank routing and
# account numbers, the deceased date-of-death MM / DD / YYYY boxes (2/2/4), and
# the preparer name / firm / address fields.
#
# Relations. Only unconditional equalities with every operand mapped are declared
# (12 = 10 + 11, 24 = 20 + 21 + 22 + 23, 27b = 27a x 0.30, 33 = 25 + 26 + 27b +
# 28 + 29 + 30 + 31 + 32c, 37 = 35 - 36, each as the face prints it; 32c is
# legitimately negative on the 32a path and the sum still holds; 27b compares in
# whole dollars after IRS rounding, which is how the ".00" box is filled). Lines
# whose printed instruction is conditional or floored ("enter 0" tests on
# 14/16/20, the greater-than tests on 34/35) are OMITTED per the conservative
# house style, and so is line 9f ("Add lines 9a, 9b, 9c, 9d and 9e"): a plain
# sum, not a multiply, but its operands are keyed 9a_amount .. 9e_amount, which
# the relation grammar does not tokenize (a digit-led key stops at its letter).
#
# Cross_form. Line 10's printed label is "Adjusted Gross Income from your U.S. Form
# 1040", so the single cross_form equality 10 == f1040.11 (Form 1040, 2024, line 11
# = AGI) is declared.
form: Form MI-1040
jurisdiction: states/mi
tax_year: 2024
source_url: https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2024/MI-1040.pdf?rev=894814c4a75b45b89bbcc65562ed512b&hash=DFB9C7AFCE4E2E5BAB7914CE7EC0BC9D
pdf_sha256: 5ba97732fad0ed55ecf4dee799ff8d5f894b6823f59e2b90d9298a6e13db345c
acroform_root: ''
fields:
  # ===================================================== header (page 1)
  # OMITTED: "Reset" (red "Reset Form" push-button — form action, not fillable).
  - line: amended_return     # "Amended Return (Include Schedule AMD)" top-right
    field: Amended return box
    type: checkbox
    on_state: /Yes

  # ---- 1 — Filer name and SSN
  - line: filer_first_name
    field: F First Name
    type: text
  - line: filer_middle_initial   # "M.I." — single-character initial box
    field: F initial
    type: text
    maxlen: 1
  - line: filer_last_name
    field: F Last Name
    type: text
  - line: filer_ssn_1
    field: FSSN1
    type: text
    maxlen: 3
  - line: filer_ssn_2
    field: FSSN2
    type: text
    maxlen: 2
  - line: filer_ssn_3
    field: FSSN3
    type: text
    maxlen: 4

  # ---- spouse name and SSN
  - line: spouse_first_name
    field: Sp First Name
    type: text
  - line: spouse_middle_initial  # "M.I." — single-character initial box
    field: Sp initial
    type: text
    maxlen: 1
  - line: spouse_last_name
    field: Sp Last Name
    type: text
  - line: spouse_ssn_1
    field: SpSSN1
    type: text
    maxlen: 3
  - line: spouse_ssn_2
    field: SpSSN2
    type: text
    maxlen: 2
  - line: spouse_ssn_3
    field: SpSSN3
    type: text
    maxlen: 4

  # ---- address
  - line: home_address
    field: Home address
    type: text
  - line: city_or_town
    field: City or town
    type: text
  - line: state
    field: State
    type: text
    maxlen: 2
  - line: zip_code
    field: Zip Code
    type: text
  - line: school_district_code     # box 4 — School District Code (5 digits)
    field: School District Code
    type: text
    maxlen: 5

  # ---- box 5 — STATE CAMPAIGN FUND (a. Filer / b. Spouse)
  - line: 5a_campaign_fund_filer
    field: Check Box4
    type: checkbox
    on_state: /State campaign fund filer
  - line: 5b_campaign_fund_spouse
    field: 5b Checkbox Spouse
    type: checkbox
    on_state: /State campaing fund spouse

  # ---- box 6 — FARMERS, FISHERMEN, OR SEAFARERS (2/3 of income from farming)
  - line: 6_farmers_fishermen
    field: Check Box6
    type: checkbox
    on_state: /Yes

  # ---- box 7 — 2024 FILING STATUS. Check one. (three SEPARATE /Btn fields, one group)
  - line: 7_filing_status::single
    field: 7a Filing status Checkbox Single
    type: checkbox
    on_state: /single
    group: 7_filing_status
  - line: 7_filing_status::mfj
    field: 7b Filing Status Checkbox Married filing jointly
    type: checkbox
    on_state: /married filing jointly
    group: 7_filing_status
  - line: 7_filing_status::mfs
    field: 7c Filing Status Checkbox Married filing separately
    type: checkbox
    on_state: /married filing separately
    group: 7_filing_status
  - line: 7c_spouse_full_name     # "* If you check box c, ... enter spouse's full name below:"
    field: Line 7 Spouse Full Name
    type: text

  # ---- box 8 — 2024 RESIDENCY STATUS. Check all that apply. (separate fields, NOT grouped)
  - line: 8a_residency::resident
    field: 8a Checkbox Resident
    type: checkbox
    on_state: /Resident
  - line: 8b_residency::nonresident
    field: 8b Checkbox Nonresident
    type: checkbox
    on_state: /Nonresident
  - line: 8c_residency::part_year
    field: 8c Checkbox Part-Year Resident
    type: checkbox
    on_state: /Part year resident

  # ===================================================== line 9 — EXEMPTIONS
  - line: 9a_count          # Number of exemptions (count box, x $5,600)
    field: 9a Number of Exemptions
    type: text
    maxlen: 2
  - line: 9a_amount
    field: Line 9a Total
    type: money
  - line: 9b_count          # Number of special exemptions (count box, x $3,300)
    field: 9b Number of Qualified Special Exemptions
    type: text
    maxlen: 2
  - line: 9b_amount
    field: Line 9b total
    type: money
  - line: 9c_count          # Number of qualified disabled veterans (count box, x $500)
    field: 9c Number of Qualified Disabled Veterans
    type: text
    maxlen: 2
  - line: 9c_amount
    field: Line 9c Total
    type: money
  - line: 9d_count          # Number of Certificates of Stillbirth from MDHHS (count box, x $5,600)
    field: 9d Number of Certificates of Stillbirth
    type: text
    maxlen: 2
  - line: 9d_amount
    field: Line 9d Total
    type: money
  - line: 9e_claimed_as_dependent     # "Claimed as dependent, see line 9 NOTE above"
    field: 9e Claimed as Dependent Checkbox
    type: checkbox
    on_state: /Yes
  - line: 9e_amount
    field: Line 9e Total
    type: money
  - line: 9f_amount         # "Add lines 9a, 9b, 9c, 9d and 9e. Enter here and on line 15."
    field: Line 9f Total
    type: money

  # ===================================================== income / tax (10-17)
  - line: "10"        # Adjusted Gross Income from your U.S. Form 1040
    field: Line 10
    type: money
  - line: "11"        # Additions from Schedule 1, line 9. Include Schedule 1
    field: line 11
    type: money
  - line: "12"        # Total. Add lines 10 and 11
    field: line 12
    type: money
  - line: "13"        # Subtractions from Schedule 1, line 31. Include Schedule 1
    field: line 13
    type: money
  - line: "14"        # Income subject to tax. Subtract line 13 from line 12
    field: line 14
    type: money
  - line: "15"        # Exemption allowance. Enter amount from line 9f or Schedule NR
    field: line 15
    type: money
  - line: "16"        # Taxable income. Subtract line 15 from line 14
    field: line 16
    type: money
  - line: "17"        # Tax. Multiply line 16 by 4.25% (0.0425)
    field: line 17
    type: money

  # ---- NON-REFUNDABLE CREDITS (18-24)
  # NOTE: "Filer's Full Social Security Number" atop pages 2 and 3 is the SAME
  # AcroForm field (FSSN1/FSSN2/FSSN3) as the page-1 header comb — pypdf exposes
  # it as one field with several widget annotations, so it is mapped once above
  # and its page-2/page-3 occurrences are NOT remapped (one field = one value).
  - line: 18a        # Income Tax Imposed by government units outside Michigan — AMOUNT
    field: line 18a
    type: money
  - line: 18b        # ... — CREDIT
    field: line 18b
    type: money
  - line: 19a        # Michigan Historic Preservation Tax Credit — AMOUNT
    field: line 19a
    type: money
  - line: 19b        # ... — CREDIT
    field: Line 19b
    type: money
  - line: "20"       # Income Tax. Subtract sum of lines 18b and 19b from line 17
    field: line 20
    type: money
  - line: "21"       # Voluntary Contributions from Form 4642, line 6. Include Form 4642
    field: line 21
    type: money
  - line: "22"       # Penalty for nonqualified withdrawal from Form 5792 (MI First-Time Home Buyer Savings)
    field: line 22
    type: money
  - line: "23"       # USE TAX due on Internet, mail order or other out-of-state purchases
    field: line 23
    type: money
  - line: "24"       # Total Tax Liability. Add lines 20 through 23
    field: line 24
    type: money

  # ---- REFUNDABLE CREDITS AND PAYMENTS (25-33)
  - line: "25"       # Property Tax Credit. Include MI-1040CR or MI-1040CR-2
    field: line 25
    type: money
  - line: "26"       # Farmland Preservation Tax Credit. Include MI-1040CR-5
    field: line 26
    type: money
  - line: 27a        # Earned Income Tax Credit — FEDERAL (federal credit)
    field: line 27a
    type: money
  - line: 27b        # ... — MICHIGAN (multiply 27a by 30%)
    field: line 27b
    type: money
  - line: "28"       # Michigan Historic Preservation Tax Credit (refundable). Include Form 3581
    field: line 28
    type: money
  - line: "29"       # Credit for allocated share of tax paid by an electing flow-through entity
    field: line 29
    type: money
  - line: "30"       # Michigan tax withheld from Schedule W, line 6. Include Schedule W
    field: line 30
    type: money
  - line: "31"       # Estimated tax, extension payments and 2023 credit forward
    field: line 31
    type: money

  # ---- line 32 — 2024 AMENDED RETURNS ONLY (32a / 32b set the sign of the one 32c amount)
  - line: 32a_amended_refund     # "check box 32a and enter this amount as a negative number on line 32c"
    field: 32a Checkbox
    type: checkbox
    on_state: /Yes
    group: 32_amended_adjustment
  - line: 32b_amended_tax        # "check box 32b ... as a positive number on line 32c"
    field: 32b checkbox
    type: checkbox
    on_state: /No
    group: 32_amended_adjustment
  - line: 32c        # amended adjustment amount
    field: line 32 c
    type: money
  - line: "33"       # Total refundable credits and payments. Add lines 25, 26, 27b, 28, 29, 30, 31 and 32c
    field: line 33
    type: money

  # ---- REFUND OR TAX DUE (34-37)
  # (Filer SSN comb atop page 3 is the same field mapped once in the header.)
  - line: 34_interest        # "Include interest [____]" on line 34 YOU OWE
    field: Line 34 Interest
    type: money
  - line: 34_penalty         # "... and penalty [____]"
    field: Line 34 Penalty
    type: money
  - line: "34"       # YOU OWE. If line 33 is less than line 24, subtract line 33 from line 24
    field: line 34
    type: money
  - line: "35"       # Overpayment. If line 33 is greater than line 24, subtract line 24 from line 33
    field: line 35
    type: money
  - line: "36"       # Credit Forward. Amount of line 35 to be credited to your 2025 estimated tax
    field: line 36
    type: money
  - line: "37"       # REFUND. Subtract line 36 from line 35
    field: Line 37
    type: money

  # ---- DIRECT DEPOSIT
  - line: routing_transit_number     # a. Routing Transit Number
    field: routing
    type: text
  - line: account_number             # b. Account Number
    field: account number
    type: text
  - line: account_type::checking     # c. Type of Account — 1. Checking
    field: type checking
    type: checkbox
    on_state: /Yes
    group: account_type
  - line: account_type::savings      # c. Type of Account — 2. Savings
    field: type checking
    type: checkbox
    on_state: /No
    group: account_type

  # ---- Deceased Taxpayer — ENTER DATE OF DEATH ONLY (MM-DD-YYYY), separate boxes
  - line: filer_dod_month            # Filer date of death — MM
    field: Filer Month
    type: text
    maxlen: 2
  - line: filer_dod_day              # Filer date of death — DD
    field: Filer Day
    type: text
    maxlen: 2
  - line: filer_dod_year             # Filer date of death — YYYY
    field: Filer Year
    type: text
    maxlen: 4
  - line: spouse_dod_month           # Spouse date of death — MM
    field: Spouse Month
    type: text
    maxlen: 2
  - line: spouse_dod_day             # Spouse date of death — DD
    field: Spouse Day
    type: text
    maxlen: 2
  - line: spouse_dod_year            # Spouse date of death — YYYY
    field: Spouse Year
    type: text
    maxlen: 4

  # ---- Preparer Certification
  - line: preparer_ptin              # Preparer's PTIN, FEIN or SSN
    field: "preparer's PTIN, FEIN, or SSN"
    type: text
  - line: preparer_name             # Preparer's Name (print or type)
    field: "Perparer's Name"
    type: text
  - line: preparer_business_address  # Preparer's Business Name, Address and Telephone Number
    field: "Preparer's Business Name, Address, Telephone"
    type: text

  # ---- Authorize Treasury to discuss return with preparer
  - line: authorize_discuss
    field: authorize box
    type: checkbox
    on_state: /Yes
relations:
  - "12 == 10 + 11"               # Line 12 "Total. Add lines 10 and 11."
  - "24 == 20 + 21 + 22 + 23"     # Line 24 "Total Tax Liability. Add lines 20 through 23."
  - "27b == 27a * 0.30"           # Line 27 "Earned Income Tax Credit. Multiply line 27a by 30% (0.30) and enter result on line 27b."
  - "33 == 25 + 26 + 27b + 28 + 29 + 30 + 31 + 32c"  # Line 33 "Total refundable credits and payments. Add lines 25, 26, 27b, 28, 29, 30, 31 and 32c"
  - "37 == 35 - 36"               # Line 37 "REFUND. Subtract line 36 from line 35"
cross_form:
  - "10 == f1040.11"              # Line 10 "Adjusted Gross Income from your U.S. Form 1040" (2024 AGI = line 11)
identity_fields:
  - filer_ssn_1
  - filer_first_name
  - filer_last_name
