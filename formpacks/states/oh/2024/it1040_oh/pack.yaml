# READONLY ADJUDICATION (knowledge/pitfalls.yaml P-007), per widget.
# RE-ADJUDICATED 2026-08-21 from the blank's own DOCUMENT-LEVEL JAVASCRIPT, not
# from the flag. Method, because the mechanism claims below all depend on it:
# the catalog /Names /JavaScript name tree was walked (17 entries, 108,471
# chars), then EVERY other JavaScript string in the file — each field's and each
# widget's /AA, each page's /AA, each annotation's /A, and the catalog
# /OpenAction (18,428 chars of Ultraforms barcode builder, which mentions
# "readonly" zero times and none of the fields below) — for 1,209 scripts in
# all; /XFA is absent. The AcroForm /CO was listed, and each claim was then
# grepped for by QUOTED field name across both years' blobs. Three of this
# section's previous mechanism claims did not survive that read and are
# corrected below.
# The 2024 blank has 523 field names, of which 90 are ReadOnly (/Ff bit 1,
# resolved by walking the /Parent chain). 24 of the 90 are the UF_L1A..UF_L4H
# "include schedule" uploader PUSHBUTTONS (the blank has 28 pushbuttons; the
# other four — Print Form, Reset Form, Print Blank Form, RESET — are NOT
# ReadOnly), leaving 66 ReadOnly non-pushbutton fields. The mapped-intersect-
# ReadOnly set is EXACTLY THIRTEEN: three widgets were NEWLY MAPPED 2026-08-21
# (TP_SSN1, L17, L19 — fixing the two class-4 defects this port inherited from
# the 2023 base pack), and seven OUPC coupon cells were NEWLY MAPPED 2026-08-24
# (see OUPC PAGE-13 ADJUDICATION at the end of this section). In the JS
# transcriptions below, `..` and `...` mark an
# elided run of literal getField lines; everything in quotes is verbatim.
#   * CHK_AMD — /Btn, /Ff = 1, page 1, /AP /N states {/Off, /Yes}. Printed row:
#     "AMENDED RETURN - Check here and include Ohio IT RE." The printed face
#     TELLS the filer to check this box, and its sibling CHK_NOL ("NOL
#     CARRYBACK - Check here") carries no /Ff at all. P-007 class 4 (a DOR
#     authoring slip, not an instruction): MUST STAY MAPPED, or the box can
#     never be checked. Carried over from 2023 unchanged. It is also the LOCK
#     KEY for L17/L19 and L25/L26A-G — see those entries.
#   * TP_SSN1 — /Tx, /Ff = 1, /MaxLen 9, one field with 12 widget kids: 11 on
#     document pages 2-12 and a 12th parented to a /Type /Template object
#     outside the page tree. NEWLY MAPPED (line key `tp_ssn_page_header`).
#     CORRECTION to this header's previous text, which said "TP_SSN1 and its 10
#     page-repeat widget copies ... which the filer enters once via TP_SSN":
#     that was factually wrong about the file. TP_SSN1 is a SEPARATE AcroForm
#     field and TP_SSN is a distinct page-1-only field (/Ff = 12582914 =
#     Required|DoNotSpellCheck|DoNotScroll, one widget), so writing tp_ssn
#     cannot populate TP_SSN1. TP_SSN1's own /AA /C is
#       var ssNumber = this.getField("TP_SSN").valueAsString;
#       event.value = util.printx("XXX XX XXXX",ssNumber)
#     — precisely the "page-2/3/4 name and SSN header mirror" P-007 names as
#     class 4 and that STATE_COMPUTED_READONLY pins wi/form1 at 15 for, with
#     the note "Unmapped they would file blank". Every one of pages 2-12 prints
#     an SSN caption over the box ("SSN:" on 2/4/6/8/10/12, "Primary
#     taxpayer's SSN" on 3/5/7/9/11), and it printed BLANK on 11 of 13 pages —
#     read off the audit renders, not inferred. Mapping it is not a class-1
#     overwrite: its /V is only two spaces, and the /C output
#     "XXX XX XXXX" is 11 characters into a /MaxLen 9 box, so the DOR's own
#     script would over-run the cell that taxfill's 9 plain digits fit.
#     Ohio prints an SSN box on every schedule page precisely so detached
#     schedules stay identifiable.
#   * L17 and L19 — /Tx, /Ff = 1, /MaxLen 9, page 2. NEWLY MAPPED (line keys
#     "17" and "19"). The previous header flagged these "NOT SETTLED" and
#     deferred; the document-level JavaScript settles it, and it says the
#     ReadOnly bit is a UI DEFAULT rather than an instruction:
#       case "CHK_AMD": if (event.source.value == "Yes") {
#           getField("L17").readonly = false; getField("L19").readonly = false;
#           getField("L25").readonly = true; getField("L26A".."L26G").readonly = true;
#           resetForm(["L17","L19","L25","L26A"..."L26G"]) }
#       else { L17/L19 readonly = true; L25/L26A-G readonly = false; resetForm([...]) }
#     They are FILER-ENTRY cells the form unlocks the moment the amended box is
#     ticked, and this pack MAPS that box (`amended_return` -> CHK_AMD). The
#     printed face agrees exactly: 17/19 read "Amended return only" and 25/26
#     read "Original return only", so the JS branch and the captions describe
#     one mutually exclusive pair of entry sets. Their /AA is byte-identical to
#     their UNFLAGGED neighbours L18/L20 (/F+/K AFNumber_Format(0,1,0,0,"",true),
#     /V AFRange_Validate(true, 0, true, 999999999), /C dsRound()), and their /V
#     is absent, so nothing computes them and nothing is overwritten. Unmapped,
#     an amended Ohio return filed through taxfill printed blanks on two lines
#     its own printed sums enumerate — confirmed on the page-2 render before the
#     fix (17 and 19 empty while 18 showed 321 and 20 showed 332).
#   * SchedC_L12 — /Tx, /Ff = 1 (2023: no /Ff), page 7, /MaxLen 3, and
#   * SchedC_L12_JFC — /Tx, /Ff = 1 (2023: no /Ff), page 7, /MaxLen 2. NEW to
#     the ReadOnly set in 2024. Printed row 12: "Joint filing credit (see
#     instructions for table).  ___% times line 11, up to $650". BOTH STAY
#     MAPPED — but for a DIFFERENT REASON than this header previously gave, and
#     the old reason would have misled the next porter.
#     WITHDRAWN: "the form's own JavaScript owns them (it reads the
#     instructions' rate table off Ohio AGI and multiplies line 11)". The file
#     does not support it. SchedC_L12_JFC carries NO /C action at all (only /F
#     and /K) and is absent from /CO. SchedC_L12's /C is `dsRound()`, whose
#     document-level definition is only "Rounds a value to nearest integer"
#     acting on event.value — the identical call the ordinary, NON-ReadOnly L18
#     carries. No script computes either cell. /CO membership proves nothing
#     here either: this form's /CO holds 325 entries and includes L1, L18 and
#     essentially every money line on all 13 pages, because almost every one
#     carries a dsRound() /C.
#     THE ACTUAL MECHANISM is conditional unlocking, and 2024 BROKE it. In the
#     2023 blank the CHK_FILING_STATUS branch toggled both cells —
#     `getField("SchedC_L12").readonly = false` / `SchedC_L12_JFC.readonly =
#     false` on value "2" (married filing jointly), re-locked on "1" (single)
#     and "3" (married filing separately), and unlocked again in the
#     no-selection `else` branch — six references per name — while the static
#     /Ff was 0. For 2024 that branch was REWRITTEN around the new
#     hideAndClear()/showEditable() helpers and every SchedC_L12 line was
#     DELETED from it: ZERO occurrences of either name anywhere in the 2024
#     blank's JavaScript, doc-level and /AA alike, while the static /Ff went
#     0 -> 1. So in a viewer the 2024 cells can never be unlocked at all — a DOR
#     authoring regression, not a computation.
#     Keeping both mapped remains correct: printed
#     line 12 is a numbered line a joint filer must complete, and SchedC_L12's
#     /AA /V `AFRange_Validate(true, 0, true, 650)` corroborates a FILER ENTRY
#     capped at the printed $650. Unmapped, either would ship a BLANK
#     joint-filing credit on a filed return.
#   * CHK_SP_NON_RES_STMT LEFT the ReadOnly set: /Ff = 1 in 2023, /Ff = 0 in
#     2024. Ohio cleared the flag; the mapping is unaffected.
#   No mapped widget falls in P-007 class 1 (a widget already holding a
#   DOR-printed constant) or class 2 (a cell the printed text makes
#   necessarily blank). The DOR-printed constants on this bundle — $250,000 /
#   $125,000 (IT BUS line 12), 3% (IT BUS line 16), $650 (Credits line 12) —
#   are printed in the CAPTION, not inside a widget, so nothing here can
#   overwrite the form's own figure.
#   Deliberately NOT mapped: the 28 pushbuttons, 24 of which also carry the
#   ReadOnly bit (the UF_L1A..UF_L4H "include schedule" uploaders — form
#   actions, not data), and 53 of the 60 page-13 OUPC ReadOnly non-pushbutton
#   fields, per the adjudication below.
#   OUPC PAGE-13 ADJUDICATION (settled 2026-08-24, cell by cell). The
#   detachable coupon — the payment slip the printed face tells a filer to
#   mail WITH the check — carries 60 ReadOnly non-pushbutton fields, and the
#   2024 page-13 widget set is IDENTICAL to the 2023 base in every name, /FT,
