# unclipped inside the /MaxLen 9 box on both, and all four amended lines print.
# RE-RUN 2026-08-24 after the seven OUPC class-4 mappings, before/after page-13
# renders compared. BEFORE, at 435 mapped lines with every line filled: the
# mailed coupon showed ONLY "Test 218" in Amount of Payment — the name/address
# block was empty except UPC_CityStateZip's orphan comma, and the
# first-3-letters and "Taxpayer's SSN" boxes were blank under their printed
# captions. AFTER, at 442: each sentinel lands in its own cell (name row
# "Test Taxpayer 2 / T / Test Taxpayer", "322 Synthetic Way", "Faketown 223"
# replacing the comma, "Tes" under the first-3-letters arrow, "Test 225" under
# "Taxpayer's SSN", "Test 218" unchanged), every DOR constant is intact
# ("Tax Year 2024", 440, 01, 54, 89, "05 08 26", "0000 0"), and the scan-line
# strip took no value. Nothing else on any page moved; verify returns
# 0 assertion / 0 clipping / 0 checkbox FAILs. Because the clipping scan skips
# ReadOnly widgets, a realistic fill was also read directly: JONATHAN / Q /
# WOLFENSTEIN / 1234 EAST BROAD STREET APT 12 / COLUMBUS, OH 43215-1234 / WOL /
# 123456789 all render unclipped in their /MaxLen 15/1/14/34/34/3/9 boxes.
#
# UNVERIFIED / OPEN (nothing here is asserted by this pack).
#   * The base header justified the narrow `text` typing of the small credit
#     boxes by naming a "$50 senior-citizen credit" and a "$200 retirement
#     credit". NEITHER FIGURE IS PRINTED ANYWHERE ON THE 2024 BLANK (line 4
#     reads only "Senior citizen credit (must be 65 or older to claim this
#     credit)"; line 2 only "Retirement income credit (include 1099-R
#     forms)"), so both were DROPPED from this header rather than carried
#     forward unverified. The typing rationale below is stated structurally
#     instead — from the PDF's own /MaxLen. Both figures do appear in
#     knowledge/states/oh/2024.yaml, which this port did not touch.
#   * The filing due date (April 15, 2025) is not printed on any page of this
#     blank; it is carried in knowledge/states/oh/2024.yaml, cited there to
#     the instruction booklet. This pack asserts no due date.
#   * SETTLED, no longer open: L17 / L19 were re-adjudicated on 2026-08-21 from
#     the document-level JavaScript and are now MAPPED (see the READONLY
#     ADJUDICATION above). So was TP_SSN1. Neither is an open question here.
#   * SETTLED 2026-08-24, no longer open: the page-13 OUPC was adjudicated
#     cell by cell (OUPC PAGE-13 ADJUDICATION above). Its seven filer-data
#     cells are now mapped (upc_*); the 53 scan-line/hidden/DOR-owned cells
#     are excluded with per-cell mechanisms. No open P-007 question remains on
#     this pack.
#   * The base pack's comment on 2023 schedA line 20 ("Income from a transfer
#     agreement or enterprise zone...") did not match that line's printed
#     2023 caption; it is not carried forward. The 2024 captions below were
#     transcribed from the 2024 face, not inherited.
# ===========================================================================
# Form IT 1040, 2024 — Ohio Individual Income Tax Return (the full 1040
# bundle: IT 1040 + Schedule of Adjustments + Schedule IT BUS + Schedule of
# Credits + Schedule of Dependents + Schedule of Withholding + the Ohio
# Universal Payment Coupon (OUPC)). 13 pages.
#
# Layout. Flat AcroForm (acroform_root empty; field names are the raw opaque
# sentinel ids the form ships with, e.g. "TP_FN", "L1", "SchedA_L11",
# "SchedW_B_L1_WAGE"). Ohio's IT 1040 is a single-column return, so income /
# credit lines carry no _A/_B/_C column suffix. Because the SAME line number
# repeats across the bundled schedules, main-form line keys are bare numbers
# ("1".."27") while each schedule's lines are prefixed (schedA_, schedITbus_,
# schedC_, schedJ_, schedW_) to keep every key unique. Schedule keys are the
# schedule's own 2024 PRINTED line numbers.
#
# Coverage. Every taxpayer-fillable widget on pages 1-12 is mapped, and so is
# every ReadOnly non-pushbutton field on pages 1-12 — there are exactly six and
# all six are P-007 class 4: CHK_AMD, TP_SSN1, L17, L19, SchedC_L12 and
# SchedC_L12_JFC. On page 13, UPC_Payment plus the seven class-4 coupon cells
# (upc_*) are mapped. What is intentionally left unmapped is exactly two
# things, both enumerated in the READONLY ADJUDICATION block above: the 28
# pushbuttons, and the 53 adjudicated-unmappable OUPC widgets (37 scan-line/
# check-digit cells, 12 hidden data carriers, UPC_TaxYear, VendorID, today,
# UPC_SDHide).
#
# Money vs text. Dollar boxes are typed `money`; the narrow "-" sign boxes
# that precede some negative-capable lines (L1_NEG, L3_NEG, L20_NEG and the
# IT BUS _NEG boxes) stay `text maxlen: 1`. Genuine text widgets — names,
# addresses, SSN/EIN/TIN boxes, dates, school-district / county codes,
# two-character state codes, ownership-percentage boxes, distribution codes,
# the P/S source flag, the exemption count box and the joint-filing-credit
# percentage box — stay `text` with the blank's own /MaxLen.
#   The split between the tiny fixed-credit boxes typed `text` (schedC_2,
#   schedC_4, schedC_8, schedC_9, schedC_12, schedC_14, schedA_38; PDF
#   /MaxLen 2-3) and the `money` lines is SEMANTIC, not a "/MaxLen < N"
#   threshold: several `money` lines also carry a small /MaxLen on the 2024
#   blank (L4 = 5; donations L26A-F = 4; schedA_4/13/36/37 = 6, schedA_39 = 5,
#   schedA_40 = 4, schedA_45 = 5; schedC_3 = 6, schedC_5/6/7 = 4,
#   schedC_13/15/16 = 4, schedC_17..34 = 7, schedC_40..45 = 8;
#   schedITbus_12/13 = 6). Those stay `money` — they are whole-dollar amount
#   lines that need IRS rounding and feed the sum relations, and any overlong
#   value is caught post-fill by verify's P-001 clipping_scan, which reads the
#   PDF /MaxLen directly.
#
# Relations / cross_form. IT 1040 line 1 is explicitly "Federal adjusted
# gross income (federal 1040 or 1040-SR, line 11)", so cross_form
# 1 == f1040.11 is declared. Only unconditional sums whose operands are ALL
# mapped money lines and carry no sign-box ambiguity are declared; see the
# `relations` block for what was omitted and why.
form: Form IT 1040
jurisdiction: states/oh
tax_year: 2024
source_url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2024/1040-bundle-original-fi.pdf
pdf_sha256: "123ef74533bb449f6ffdd050ebbbd0ec86ddc52940e69cc911f1f6f819f371af"
acroform_root: ''
fields:
  # =========================================================== IT 1040 page 1
  # ---- Top checkboxes
  - line: amended_return            # "AMENDED RETURN - Check here and include Ohio IT RE."
    field: CHK_AMD
    type: checkbox
    on_state: /Yes
  - line: nol_carryback             # "NOL CARRYBACK - Check here and include Schedule IT NOL."
    field: CHK_NOL
    type: checkbox
    on_state: /1
  # ---- Taxpayer / spouse identity
  - line: tp_ssn                    # Primary taxpayer's SSN (required)
    field: TP_SSN
    type: text
    maxlen: 9
  - line: tp_deceased               # primary taxpayer "If deceased"
    field: CHK_PRIM_DEC
    type: checkbox
    on_state: /Yes
  - line: spouse_ssn                # Spouse's SSN (if filing jointly)
    field: SP_SSN
    type: text
    maxlen: 9
  - line: spouse_deceased           # spouse "If deceased"
    field: CHK_SP_DEC
    type: checkbox
    on_state: /Yes
  - line: school_district_number    # School district #
    field: SD_NUM
    type: text
    maxlen: 4
  - line: tp_first_name
    field: TP_FN
    type: text
    maxlen: 15
  - line: tp_mi
    field: TP_MI
    type: text
    maxlen: 1
  - line: tp_last_name
    field: TP_LN
    type: text
    maxlen: 22
  - line: spouse_first_name
    field: SP_FN
    type: text
    maxlen: 15
  - line: spouse_mi
    field: SP_MI
    type: text
    maxlen: 1
  - line: spouse_last_name
    field: SP_LN
    type: text
    maxlen: 22
  - line: address_line_1            # Address line 1 (number and street) or P.O. Box
    field: ADDRESS1
    type: text
    maxlen: 35
  - line: address_line_2            # Address line 2 (apartment number, suite number, etc.)
    field: ADDRESS2
    type: text
    maxlen: 35
  - line: city
    field: CITY
    type: text
    maxlen: 20
  - line: state
    field: STATE
    type: text
    maxlen: 2
  - line: zip_code
    field: ZIP
    type: text
    maxlen: 5
  - line: ohio_county              # Ohio county (first four letters)
    field: COUNTY
    type: text
    maxlen: 4
  - line: foreign_country          # Foreign country (if the mailing address is outside the U.S.)
    field: FRGN_COUNTRY
    type: text
    maxlen: 20
  - line: foreign_postal_code
    field: FRGN_ZIP
    type: text
    maxlen: 7
  # ---- Residency Status — primary (check one) + indicate state
  - line: residency_primary::resident
    field: CHK_PRIM_RES
    type: checkbox
    on_state: /1
  - line: residency_primary::part_year
    field: CHK_PRIM_RES
    type: checkbox
    on_state: /2
  - line: residency_primary::nonresident
    field: CHK_PRIM_RES
    type: checkbox
    on_state: /3
  - line: residency_primary_indicate_state   # *Indicate state (primary nonresident/part-year)
    field: PRIM_NON_RES_STATE
    type: text
    maxlen: 2
  # ---- Residency Status — spouse (check one if filing jointly) + indicate state
  - line: residency_spouse::resident
    field: CHK_SP_RES
    type: checkbox
    on_state: /1
  - line: residency_spouse::part_year
    field: CHK_SP_RES
    type: checkbox
    on_state: /2
  - line: residency_spouse::nonresident
    field: CHK_SP_RES
    type: checkbox
    on_state: /3
  - line: residency_spouse_indicate_state    # *Indicate state (spouse)
    field: SP_NON_RES_STATE
    type: text
    maxlen: 2
  # ---- Filing Status (check one, as reported on federal return)
  - line: filing_status::single_hoh_qss   # Single, head of household or qualifying surviving spouse
    field: CHK_FILING_STATUS
    type: checkbox
    on_state: /1
  - line: filing_status::mfj              # Married filing jointly
    field: CHK_FILING_STATUS
    type: checkbox
    on_state: /2
  - line: filing_status::mfs              # Married filing separately
    field: CHK_FILING_STATUS
    type: checkbox
    on_state: /3
  - line: filing_status_mfs_spouse_ssn    # Spouse's SSN (married filing separately)
    field: SP_SSN_SEP
    type: text
    maxlen: 9
  # ---- Ohio Nonresident Statement (irrebuttable-presumption criteria)
  - line: nonresident_statement_primary   # Primary meets the five criteria for irrebuttable presumption as nonresident
    field: CHK_PRIM_NON_RES_STMT
    type: checkbox
    on_state: /1
  - line: nonresident_statement_spouse    # Spouse meets the five criteria for irrebuttable presumption as nonresident
    field: CHK_SP_NON_RES_STMT
    type: checkbox
    on_state: /1
  # ---- Federal extension / dependent-of-another
  - line: federal_extension_filer         # Federal extension filers - check here
    field: CHK_FED_EXT_FILTER
    type: checkbox
    on_state: /1
  - line: can_be_claimed_dependent        # "If someone can claim you (or your spouse if filing jointly) as a dependent, check here."
    field: CHK_CLAIM_DEP
    type: checkbox
    on_state: /1

  # ---- Lines 1-7
  - line: 1_neg                  # line 1 "-" sign box (place a "-" if negative)
    field: L1_NEG
    type: text
    maxlen: 1
  - line: "1"                    # Federal adjusted gross income (federal 1040 or 1040-SR, line 11)
    field: L1
    type: money
  - line: 2a                     # Additions — Ohio Schedule of Adjustments, line 12 (2023: line 11)
    field: L2A
    type: money
  - line: 2b                     # Deductions — Ohio Schedule of Adjustments, line 46 (2023: line 44)
    field: L2B
    type: money
  - line: 3_neg                  # line 3 "-" sign box
    field: L3_NEG
    type: text
    maxlen: 1
  - line: "3"                    # Ohio adjusted gross income (line 1 plus line 2a minus line 2b)
    field: L3
    type: money
  - line: 4_number_of_exemptions # "Number of exemptions including you and your spouse/dependents, if applicable"
    field: L4_EXEMPT
    type: text
    maxlen: 2
  - line: "4"                    # Exemption amount (include Schedule of Dependents if applicable)
    field: L4
    type: money
  - line: "5"                    # Ohio income tax base (line 3 minus line 4; if negative, enter zero)
    field: L5
    type: money
  - line: "6"                    # Taxable business income — Ohio Schedule of Business Income, line 15
    field: L6
    type: money
  - line: "7"                    # Taxable nonbusiness income (line 5 minus line 6; if negative, enter zero)
    field: L7
    type: money

  # =========================================================== IT 1040 page 2
  # TP_SSN1 is the per-page identity header. It is a SEPARATE AcroForm field
  # from TP_SSN (page 1), not a widget copy of it: one field, 12 widget kids —
  # 11 on document pages 2-12, the 12th parented to a /Type /Template object
  # that is not in the page tree. Every one of pages 2-12 prints an SSN caption
  # over it ("SSN:" on 2/4/6/8/10/12, "Primary taxpayer's SSN" on 3/5/7/9/11).
  # Its own /AA /C is `var ssNumber = this.getField("TP_SSN").valueAsString;
  # event.value = util.printx("XXX XX XXXX",ssNumber)` — the exact page-header
  # SSN mirror P-007 names as class 4. taxfill never executes that JavaScript,
  # so writing tp_ssn CANNOT populate it and it must be written directly, with
  # the SAME nine digits as tp_ssn (see the READONLY ADJUDICATION header note).
  - line: tp_ssn_page_header     # pages 2-12 header SSN mirror — write the same 9 digits as tp_ssn
    field: TP_SSN1
    type: text
    maxlen: 9
  - line: 7a                     # Amount from line 7 on page 1
    field: L7a
    type: money
  - line: 8a                     # Nonbusiness income tax liability on line 7a (2024 caption points at tax.ohio.gov/taxcalculator)
    field: L8A
    type: money
  - line: 8b                     # Business income tax liability — Ohio Schedule of Business Income, line 16
    field: L8B
    type: money
  - line: 8c                     # Income tax liability before credits (line 8a plus line 8b)
    field: L8C
    type: money
  - line: "9"                    # Ohio nonrefundable credits — Ohio Schedule of Credits, line 39 (2023: line 38)
    field: L9
    type: money
  - line: "10"                   # Tax liability after nonrefundable credits (line 8c minus line 9; if negative, enter zero)
    field: L10
    type: money
  - line: "11"                   # Interest penalty on underpayment of estimated tax (include Ohio IT/SD 2210)
    field: L11
    type: money
  - line: "12"                   # Unpaid use tax
    field: L12
    type: money
  - line: "13"                   # Total Ohio tax liability before withholding or estimated payments (add lines 10, 11 and 12)
    field: L13
    type: money
  - line: "14"                   # Ohio income tax withheld — Schedule of Ohio Withholding, part A, line 1
    field: L14
    type: money
  - line: "15"                   # Estimated and extension payments, and credit carryforward from last year's return
    field: L15
    type: money
  - line: "16"                   # Refundable credits — Ohio Schedule of Credits, line 46 (2023: line 44)
    field: L16
    type: money
  # Lines 17 and 19 are the two "Amended return only" cells. They carry
  # /Ff = 1 (ReadOnly) on both blanks, but that bit is the form's UI DEFAULT for
  # an ORIGINAL return, not an instruction: the document-level JS unlocks them
  # the moment the amended box this pack maps is ticked —
  #   case "CHK_AMD": if (event.source.value == "Yes") {
  #       getField("L17").readonly = false; getField("L19").readonly = false;
  #       getField("L25").readonly = true;  getField("L26A"..."L26G").readonly = true;
  #       resetForm([...]) }
  #   else { L17/L19 readonly = true; L25/L26A-G readonly = false; resetForm([...]) }
  # — and the printed face agrees, because 17/19 read "Amended return only"
  # while 25/26 read "Original return only". So they are FILER-ENTRY cells (a
  # JS-gated lock, not a computed value), P-007 class 4 by the same route as
  # CHK_AMD, and MAPPED. Unmapped they shipped BLANK on every amended return
  # while the printed sums that enumerate them printed a number: line 18 is
  # "Total Ohio tax payments (add lines 14, 15, 16 and 17)" and line 20 is
  # "Line 18 minus line 19". Neither cell holds a DOR constant (/V absent on
  # both) and both carry the ordinary money actions of their unflagged
  # neighbours L18/L20 (/F+/K AFNumber_Format(0,1,0,0,"",true), /V
  # AFRange_Validate(true, 0, true, 999999999), /C dsRound()).
  # CALLER NOTE, the mirror of the same JS branch: 17/19 and 25/26a-g are
  # mutually exclusive by construction. Fill 17/19 only with amended_return
  # checked, and 25/26a-g only without it.
  - line: "17"                   # Amended return only — amount previously paid with original and/or amended return
    field: L17
    type: money
  - line: "18"                   # Total Ohio tax payments (add lines 14, 15, 16 and 17)
    field: L18
    type: money
  - line: "19"                   # Amended return only — overpayment previously requested on original and/or amended return
    field: L19
    type: money
  - line: 20_neg                 # line 20 "-" sign box (place a "-" if negative)
    field: L20_NEG
    type: text
    maxlen: 1
  - line: "20"                   # Line 18 minus line 19
    field: L20
    type: money
  - line: "21"                   # Tax due (line 13 minus line 20)
    field: L21
    type: money
  - line: "22"                   # Interest due on late payment of tax
    field: L22
    type: money
  - line: "23"                   # TOTAL AMOUNT DUE (line 21 plus line 22) — pay at tax.ohio.gov/pay or include the OUPC
    field: L23
    type: money
  - line: "24"                   # Overpayment (line 20 minus line 13)
    field: L24
    type: money
  - line: "25"                   # Original return only — portion of line 24 carried forward to next year's tax liability
    field: L25
    type: money
  # ---- line 26 — Original return only — donations (a-f) and total (g)
  - line: 26a                    # a. Breast/Cervical Cancer  (2024 REORDERED the funds; 2023 a. was Wishes for Sick Children)
    field: L26A
    type: money
  - line: 26b                    # b. Wishes for Sick Children  (2023 b. was Wildlife Species)
    field: L26B
    type: money
  - line: 26c                    # c. Wildlife Species  (2023 c. was Military Injury Relief)
    field: L26C
    type: money
  - line: 26d                    # d. Military Injury Relief  (2023 d. was Ohio History Fund)
    field: L26D
    type: money
  - line: 26e                    # e. Ohio History Fund  (2023 e. was Nature Preserves/Scenic Rivers)
    field: L26E
    type: money
  - line: 26f                    # f. Nature Preserves/Scenic Rivers  (2023 f. was Breast/Cervical Cancer)
    field: L26F
    type: money
  - line: 26g                    # Total (26a through 26f)
    field: L26G
    type: money
  - line: "27"                   # REFUND (line 24 minus lines 25 and 26g)
    field: L27
    type: money
  # ---- Sign Here / preparer block (page 2)
  - line: primary_signature_phone   # Primary signature — Phone number
    field: PHONE_NUM
    type: text
    maxlen: 10
  - line: signature_date            # Date (spouse signature line)
    field: SIGN_DATE
    type: text
    maxlen: 8
  - line: preparer_printed_name     # Preparer's printed name
    field: PREPARER_PRINTED_NAME
    type: text
    maxlen: 25
  - line: preparer_phone            # Preparer — Phone number
    field: PREPARER_PHONE_NUM
    type: text
    maxlen: 10
  - line: preparer_ptin             # Preparer PTIN
    field: PREPARER_TIN
    type: text
    maxlen: 8
  - line: authorize_preparer_discuss   # "Authorize your preparer to discuss this return"
    field: SpeakPrep
    type: checkbox
    on_state: /1
  - line: non_paid_preparer            # "Non-paid preparer"
    field: NonPaidPrep
    type: checkbox
    on_state: /1

  # =============================== Ohio Schedule of Adjustments (pages 3-4)
  # 2024 RENUMBERED THIS SCHEDULE. Additions are printed lines 1-11 (2023: 1-10)
  # and total on line 12 (2023: 11); deductions are printed lines 13-45 (2023:
  # 12-43) and total on line 46 (2023: 44). Two printed lines are NEW: line 8
  # (ineligible Ohio Homebuyer Plus withdrawals, an addition) and line 24
  # (Homebuyer Plus contributions/interest, a deduction). The AcroForm names are
  # POSITIONAL - SchedA_L<n> sits on printed line <n> in both years (verified by
  # widget /Rect vs the printed line-number baselines) - so every key below is
  # the 2024 printed line number and the '(2023 line n)' notes record the shift.
  # Additions (lines 1-11) - add only if not already included on IT 1040 line 1.
  - line: schedA_1            # Non-Ohio state or local government interest and dividends
    field: SchedA_L1
    type: money
  - line: schedA_2            # Ohio pass-through entity taxes excluded from federal adjusted gross income
    field: SchedA_L2
    type: money
  - line: schedA_3            # Taxes paid to another state or the District of Columbia related to IRS notice 2020-75
    field: SchedA_L3
    type: money
  - line: schedA_4            # 529 plan funds used for non-qualified expenses
    field: SchedA_L4
    type: money
  - line: schedA_5            # Losses from sale or disposition of Ohio public obligations
    field: SchedA_L5
    type: money
  - line: schedA_6            # Nonmedical withdrawals from a medical savings account
    field: SchedA_L6
    type: money
  - line: schedA_7            # Reimbursement of expenses previously deducted on an Ohio income tax return
    field: SchedA_L7
    type: money
  - line: schedA_8            # NEW for 2024: Ineligible withdrawals from an Ohio Homebuyer Plus account
    field: SchedA_L8
    type: money
  - line: schedA_9            # Internal Revenue Code 168(k) and 179 depreciation expense add-back (2023 line 8)
    field: SchedA_L9
    type: money
  - line: schedA_10           # Exempt federal interest and dividends subject to state taxation (2023 line 9)
    field: SchedA_L10
    type: money
  - line: schedA_11           # Federal conformity additions (2023 line 10)
    field: SchedA_L11
    type: money
  - line: schedA_12           # Total additions (add lines 1 through 11 ONLY) - Ohio IT 1040, line 2a (2023 line 11)
    field: SchedA_L12
    type: money
  # Deductions (lines 13-45) - deduct only if included on IT 1040 line 1.
  - line: schedA_13           # Business income deduction - Ohio Schedule of Business Income, line 13 (2023 line 12)
    field: SchedA_L13
    type: money
  - line: schedA_14           # Employee compensation earned in Ohio by residents of neighboring states (2023 line 13)
    field: SchedA_L14
    type: money
  - line: schedA_15           # Taxable refunds, credits, or offsets of state and local income taxes (federal 1040,
                              # Schedule 1, line 1)
    field: SchedA_L15
    type: money
  - line: schedA_16           # Taxable Social Security benefits (federal 1040 and 1040-SR, line 6b)
    field: SchedA_L16
    type: money
  - line: schedA_17           # Certain railroad benefits
    field: SchedA_L17
    type: money
  - line: schedA_18           # Interest income from Ohio public obligations and purchase obligations; gains from the
                              # disposition of Ohio public obligations; or income from a transfer agreement
    field: SchedA_L18
    type: money
  - line: schedA_19           # Amounts contributed to an Ohio county's individual development account program
    field: SchedA_L19
    type: money
  - line: schedA_20           # Amounts contributed to a STABLE account: Ohio's ABLE plan
    field: SchedA_L20
    type: money
  - line: schedA_21           # Income earned in Ohio by a qualifying out-of-state business or employee for disaster
                              # work conducted during a disaster response period
