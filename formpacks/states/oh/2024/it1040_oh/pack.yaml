#     letters, print the first three letters of the taxpayer's last name.");
#     and UPC_Identifier (9; printed caption "Taxpayer's SSN", /C copies
#     TP_SSN). taxfill never runs that JavaScript, so before this change a
#     fully-filled return mailed a coupon whose name, address and SSN printed
