# VISION AUDIT. scripts/audit_pack.py was run against this pack: it filled
# every mapped line of the sha-pinned blank with a distinct sentinel, verified
# (0 assertion / 0 clipping / 0 checkbox FAILs), rendered all 13 pages at 170
# dpi, and every page was READ. What was checked page by page: each sentinel
# sits on its own printed line number (with special attention to the two
# renumbered schedules and to the rotated 26a-26f donation row); the SSN /
# EIN / TIN / date boxes (plain text widgets on this form, not combs) show
# every character unclipped; exactly one box is marked in each of the three
# radio groups; nothing overflows its cell or lands off-page. What the audit
# CAUGHT: no failure — verify returned zero FAILs and no page showed a
# misplaced or clipped value. What it PROVED, which is why it was worth
# running: the two renumbered schedules land on their 2024 printed lines
# (schedA_8 on "Ineligible withdrawals from an Ohio Homebuyer Plus account",
# schedA_12 on "Total additions (add lines 1 through 11 ONLY)", schedC_22 on
# "Credit for commercial vehicle operator training expenses", schedC_44 on
# "Film and theater capital improvements credit", schedC_46 on "Total
# refundable credits (add lines 40 through 45)"); the six donation boxes land
# under the ROTATED 2024 fund labels; both ReadOnly joint-filing-credit cells
# accept a value and render on printed line 12; the ReadOnly CHK_AMD box
# really does check; and page 13 shows the DOR's own pre-printed "Tax Year
# 2024" / 440 / 01 / 54 constants intact beside the single mapped
# Amount-of-Payment box, confirming the class-1 exclusions hold.
# RE-RUN 2026-08-21 after the three class-4 fixes, with the BEFORE and AFTER
# renders compared page by page. BEFORE, with all 432 then-mapped lines filled:
