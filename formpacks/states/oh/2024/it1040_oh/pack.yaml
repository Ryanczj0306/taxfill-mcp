  # =============================== Ohio Universal Payment Coupon (page 13)
  # The filer-data cells of the detachable payment slip. UPC_Payment is the
  # coupon's one free-entry widget; the six upc_* identity cells are ReadOnly
  # P-007 class-4 mirrors adjudicated 2026-08-24 (OUPC PAGE-13 ADJUDICATION in
  # the header): in a viewer each is fed by its own /AA /C from the page-1
  # return fields, taxfill never runs that JavaScript, and unmapped they
  # mailed a coupon whose name, address and SSN printed BLANK under their
  # captions. The coupon's scan-line/check-digit cells, hidden data carriers
  # and DOR-owned cells stay deliberately unmapped — every one is named, with
  # its mechanism, in the header block.
  - line: upc_payment           # Amount of Payment
    field: UPC_Payment
    type: text
    maxlen: 9
  - line: upc_first_name        # payer name block; /C copies TP_FN — supply tp_first_name's value
    field: UPC_FName
    type: text
    maxlen: 15
  - line: upc_mi                # /C copies TP_MI — supply tp_mi's value
    field: 40P_MI
    type: text
    maxlen: 1
  - line: upc_last_name         # /C copies TP_LN — supply tp_last_name's value
    field: UPC_LName
    type: text
    maxlen: 14
  - line: upc_address_line_1    # /C copies ADDRESS1 — supply address_line_1's value
    field: UPC_address1
    type: text
    maxlen: 34
  - line: upc_city_state_zip    # /C composes CITY + ", " + STATE + " " + ZIP — supply "City, ST 12345"; unmapped it printed its junk factory /V ",  " (an orphan comma)
    field: UPC_CityStateZip
    type: text
    maxlen: 34
  - line: upc_last_name_first3  # "Using UPPERCASE letters, print the first three letters of the taxpayer's last name."
    field: UPC_1st3LName
    type: text
    maxlen: 3
  - line: upc_ssn               # "Taxpayer's SSN" — /C copies TP_SSN; supply tp_ssn's value
    field: UPC_Identifier
    type: text
    maxlen: 9
relations:
  # Only sums whose operands are ALL `money` lines are declared, and every one
  # below was re-read off the 2024 printed face (the 2024 renumbering changed
  # three of the four operand lists that the 2023 pack declared).
  #   * schedA_46 ("add lines 13 through 45 ONLY") is OMITTED: operand schedA_38
  #     (Ohio educator expenses, PDF /MaxLen 3) is typed `text`, not money.
  #   * schedC_35 ("add lines 12 through 34") is OMITTED: operands schedC_12 and
  #     schedC_14 are narrow `text` boxes.
  # Sign-boxed lines (1, 3, 20, IT BUS 10) and "if negative, enter zero" /
  # "if line X is more than..." conditional lines stay OMITTED per house style —
  # which is why printed line 20 ("Line 18 minus line 19") is NOT declared even
  # though 18 and 19 are both mapped money lines: L20_NEG carries its sign.
  # NEW in this revision: line 18's sum became declarable when lines 17 and 19
  # were mapped (see the L17/L19 note in fields[]). It is unconditional on the
  # printed face and all four operands are `money`; on an original return, where
  # the form locks 17, the missing operand counts as zero (IRS blank-means-zero),
  # so the relation holds for original and amended returns alike.
  - "13 == 10 + 11 + 12"                                                               # IT 1040: "Total Ohio tax liability ... (add lines 10, 11 and 12)"
  - "18 == 14 + 15 + 16 + 17"                                                          # IT 1040: "Total Ohio tax payments (add lines 14, 15, 16 and 17)"
  - "schedA_12 == schedA_1 + schedA_2 + schedA_3 + schedA_4 + schedA_5 + schedA_6 + schedA_7 + schedA_8 + schedA_9 + schedA_10 + schedA_11"  # "Total additions (add lines 1 through 11 ONLY)"
  - "schedC_39 == schedC_10 + schedC_35 + schedC_37 + schedC_38"                        # "Total nonrefundable credits (add lines 10, 35, 37 and 38)"
  - "schedC_46 == schedC_40 + schedC_41 + schedC_42 + schedC_43 + schedC_44 + schedC_45"  # "Total refundable credits (add lines 40 through 45)"
cross_form:
  - "1 == f1040.11"            # IT 1040 line 1 "Federal adjusted gross income (federal 1040 or 1040-SR, line 11)" = Form 1040 (2024) line 11 (AGI)
identity_fields:
  - tp_ssn
  - tp_first_name
  - tp_last_name
