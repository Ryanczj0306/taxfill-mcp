  # Lines 17 and 19 are the two "Amended return only" cells. They carry
  # /Ff = 1 (ReadOnly), but that bit is the form's UI DEFAULT for an ORIGINAL
  # return, not an instruction: the document-level JS unlocks them the moment
  # the amended box this pack maps is ticked —
  #   case "CHK_AMD": if (event.source.value == "Yes") {
  #       getField("L17").readonly = false; getField("L19").readonly = false;
  #       getField("L25").readonly = true;  getField("L26A"..."L26G").readonly = true;
  #       resetForm([...]) }
  #   else { L17/L19 readonly = true; L25/L26A-G readonly = false; resetForm([...]) }
  # — and the printed face agrees, because 17/19 read "Amended return only"
  # while 25/26 read "Original return only". So they are FILER-ENTRY cells (a
  # JS-gated lock, not a computed value), P-007 class 4 by the same route as
  # CHK_AMD, and MAPPED. Unmapped they shipped BLANK on every amended return
  # while the printed sums that enumerate them printed a number: line 18 is
  # "Total Ohio tax payments (add lines 14, 15, 16 and 17)" and line 20 is
  # "Line 18 minus line 19". Neither cell holds a DOR constant (/V absent on
  # both) and both carry the ordinary money actions of their unflagged
  # neighbours L18/L20 (/F+/K AFNumber_Format(0,1,0,0,"",true), /V
  # AFRange_Validate(true, 0, true, 999999999), /C dsRound()).
  # CALLER NOTE, the mirror of the same JS branch: 17/19 and 25/26a-g are
  # mutually exclusive by construction. Fill 17/19 only with amended_return
  # checked, and 25/26a-g only without it.
  - line: "17"                   # Amended return only — amount previously paid with original and/or amended return
