# field and widget /AA and annotation /A — and every string of all 20,475
# objects in the file (decompressed streams and string objects) was scanned
# as well, so a claim that a name "occurs nowhere" below means nowhere in the
# file.
# On the 13 pages, 88 fields carry ReadOnly (/Ff bit 1, resolved up /Parent),
# 24 of them the UF_L1A..UF_L4H "include schedule" pushbuttons, leaving 64
# non-pushbutton ReadOnly fields: 60 on the page-13 coupon (next block) and
# FOUR on pages 1-12 — CHK_AMD, TP_SSN1, L18 and Date_Gen. The mapped-
# intersect-ReadOnly set is exactly TEN: CHK_AMD, TP_SSN1, L18 and the seven
# coupon filer-data cells.
#   * CHK_AMD — /Btn, /Ff = 1, page 1, /AP /N {/Off, /Yes}. Printed "AMENDED
#     RETURN - Check here and include Ohio IT RE." The face tells the filer to
#     check it, and its sibling CHK_NOL carries no /Ff. Class 4: MAPPED, as in
#     2023 and 2024. (Its /A calls checkamended(), which nothing in the file
#     defines.)
#   * TP_SSN1 — /Tx, /Ff = 1, /MaxLen 9, ONE field with 12 widget kids (11 on
#     pages 2-12, the 12th in no page), /V two spaces; its /C is
#     `var ssNumber = this.getField("TP_SSN").valueAsString; event.value =
#     util.printx("XXX XX XXXX",ssNumber)`. Each of pages 2-12 prints an SSN
#     caption over it. The page-header SSN mirror, class 4: MAPPED
#     (tp_ssn_page_header), unchanged from 2024.
#   * L18 — /Tx, /Ff = 1 (2024: 0), /MaxLen 9, page 2, printed line 18
#     "Amended return only – overpayment previously requested on original
#     and/or amended 2025 return": a line the face tells an amended filer to
#     complete. MAPPED, class 4. No script can clear the bit: every readonly
#     assignment in the file's JavaScript was resolved to its target (literal
#     getField() names, the SchedITBUS_L<i> spouse-percentage loops, and the
#     helper and variable forms, which reach only spouse and residency fields)
#     and none is L18; the one script that touches L18 at all is DS_Print's
#     barcode gather (GVS("L"+i) for i = 9..18), which reads it. The
#     `case "CHK_AMD"` branch of
#     DS_SetRequired() (run by TP_SSN's /C) is byte-identical to 2024 (1,862
#     characters from `case "CHK_AMD"` through its `break`): on "Yes" it sets
#     L17/L19 readonly = false and L25/L26A..L26G readonly = true, otherwise
#     the reverse, and both paths resetForm() all ten names. On this face L17
#     and L19 are total payments and "Line 17 minus line 18" (both /Ff 0) and
#     L25/L26A-L26G do not exist, so in a viewer toggling the amended box
#     empties lines 17 and 19 (and locks them on an original return) while
#     line 18 can never be unlocked — the 2024 SchedC_L12 shape, a ReadOnly bit
#     on a filer-entry cell that nothing clears. L18's /AA is identical to
#     unflagged L17/L19 (/C dsRound(), /F + /K AFNumber_Format/Keystroke(0, 1,
#     0, 0, "", true), /V AFRange_Validate(true, 0, true, 999999999)) and its
#     /V is absent: nothing computes it and nothing is overwritten.
#   * L17 and L19 LEFT the ReadOnly set (/Ff 1 -> 0), and so did SchedC_L12
#     and SchedC_L12_JFC (/Ff 1 -> 0: Ohio cleared the bit it set for 2024;
#     no script writes either cell or its readonly property — the only
#     script that reaches either is DS_Print's GVS('SchedC_L'+i) barcode
#     gather, which reads SchedC_L12). All four stay mapped as ordinary
#     filer-entry lines.
#   * Date_Gen — NEW; /Tx, /Ff = 12582913 (ReadOnly|DoNotSpellCheck|
#     DoNotScroll), /MaxLen 9, page 1 /Rect [35.15 718.57 96.84 732.25],
#     annotation /F = 36 (Print|NoView: never shown on screen, printed); no /V,
#     no /AA, no printed caption (the text layer holds no word in or beside the
