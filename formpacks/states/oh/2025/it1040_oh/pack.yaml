#   * Checkbox export values, re-dumped from /AP /N: /Yes for CHK_AMD,
#     CHK_PRIM_DEC, CHK_SP_DEC and SchedW_C_L1-L4_CHK; /1 for CHK_NOL,
#     CHK_CLAIM_DEP, CHK_FED_EXT_FILTER, CHK_PRIM_NON_RES_STMT,
#     CHK_SP_NON_RES_STMT, SpeakPrep and NonPaidPrep; /1 /2 /3 on the three kids
#     of each of CHK_PRIM_RES, CHK_SP_RES and CHK_FILING_STATUS (/Ff 2,
#     Required). Identical to 2024. CHK_SP_DEC, CHK_SP_NON_RES_STMT and
#     CHK_SP_RES's kids still ship no explicit /Off appearance; only the "on"
#     states this pack writes matter, and all are present.
#   * GROUPS: the three shared-field option sets now carry one group id each —
#     residency_primary, residency_spouse and filing_status, the stem before
#     "::" — where the 2023/2024 packs carried them as
#     SHARED_FIELD_OPTIONS_WITHOUT_GROUP_ID debt. The two Ohio Nonresident
#     Statement boxes (one per person) stay ungrouped under the family's
#     INDEPENDENT row in SEPARATE_OPTION_SETS_ADJUDICATED.
#
# VISION AUDIT. scripts/audit_pack.py filled the sha-pinned blank with one
# distinct sentinel per mapped line (435 lines: every key except the six
# alternate options of the three radio groups); verify returned 0 assertion /
# 0 clipping / 0 checkbox FAILs; all 13 pages were rendered at 170 dpi and
# READ in half-page crops. Every sentinel sits in the box of the printed line
# its key names: the renumbered page-2 ladder (17 = 321 on "Total Ohio tax
# payments", 18 = 332 on the amended overpayment, 19 = 343 with its "-" box,
# 22 = 376 on AMOUNT DUE, 24 = 398 on the carryforward, 26 = 486 on YOUR
# REFUND); the six donation boxes under the rotated labels (25a = 409 Nature
# Preserves/Scenic Rivers ... 25f = 464 Ohio History Fund; 25g = 475);
# schedA_25 = 761 on the new pregnancy-resource-center line, schedA_39 = T30
# on educator expenses, schedA_47 = 992 on "Total deductions"; schedC_24 =
# 1366 on the new transformational mixed-use line, schedC_40 = 1542 and
# schedC_47 = 1619 on the two totals; the two W-2G rows, the single 1099-NEC
# row in its moved position and the new 1099-G row under their own box
# captions; the SSN header T23 on each of pages 2-12; and the coupon cells,
# with the DOR's Tax Year 2025 / 440 / 01 / 54 / 89 / "0000 0" intact, no date
# in `today` and no orphan comma. The six alternate radio options were then
# filled separately (primary part-year and nonresident, spouse nonresident
# and part-year, married filing jointly, married filing separately) and each
# ticks its own box. ONE sentinel does not print: filing_status_mfs_spouse_ssn
# (SP_SSN_SEP) — verify passes and its value and appearance are written, but
# the blank's own annotation flag hides the widget (see OPEN); a diagnostic
# render of the filled file with only that Hidden bit cleared puts the
# sentinel under "Spouse’s SSN" beside "Married filing separately", so the
# binding itself is right. 441/441 line keys proven: 440 on the production
# renders, 1 on the diagnostic render.
#
# UNVERIFIED / OPEN (nothing here is asserted by this pack).
#   * SP_SSN_SEP (filing_status_mfs_spouse_ssn) ships with annotation /F = 6
#     (Hidden|Print) — on the 2024 blank too, recorded by neither earlier pack.
#     Only the form's JavaScript reveals it: the CHK_FILING_STATUS "3" (married
#     filing separately) branch of DS_SetRequired calls
#     showEditable("SP_SSN_SEP", true), i.e. display = visible. taxfill runs no
#     JavaScript and the pack schema cannot clear an annotation flag, so a
#     married-filing-separately return filled through taxfill prints NO
#     spouse's SSN in that box, and verify_form reports the line ok because
#     it reads /V, not the annotation flag. The binding is kept — the key,
#     the widget and the written /V are right, and an engine-side unhide
#     would make it print — but until then an MFS filer must hand-write the
#     spouse's SSN there. Engine follow-up (not a pack change): clear the
#     Hidden bit when the filler writes a non-empty value to a Hidden widget,
#     and have verify FAIL a mapped, non-empty widget whose /F keeps Hidden
#     or NoView set. Two adversarial verifiers reproduced the blank box
#     independently (their /F 6 -> 4 copies print the SSN in the right place).
#     RESOLVED at integration (2026-10-01, Phase J JEd, P-027): that engine
#     follow-up shipped — fill_form clears Hidden and NoView and sets Print on
#     every widget it writes, and verify's P-027 check FAILs a written widget
#     whose flags still hide it — so an MFS fill through taxfill now prints
#     the spouse's SSN in this box.
#   * No filing due date is printed on the blank; knowledge/states/oh/2025.yaml
#     carries April 15, 2026 from the booklet. This pack asserts none.
#   * Whether Ohio will repair the CHK_AMD branch (so a viewer can unlock line
#     18 and stops emptying lines 17 and 19) cannot be known from the file. If
#     a re-issued 2025 blank clears L18's ReadOnly bit, the binding does not
#     change, only the ReadOnly count.
#   * Date_Gen prints blank on every return taxfill fills; nothing on the face
#     names or requires that cell.
# ===========================================================================
# Form IT 1040, 2025 — Ohio Individual Income Tax Return (the full 1040
# bundle: IT 1040 + Schedule of Adjustments + Schedule of Business Income
# (IT BUS) + Schedule of Credits + Schedule of Dependents + Schedule of
# Withholding + the Ohio Universal Payment Coupon (OUPC)). 13 pages.
#
# Layout. Flat AcroForm (acroform_root empty; field names are the raw opaque
# sentinel ids the form ships with, e.g. "TP_FN", "L1", "SchedA_L12",
# "SchedW_B_L1_WAGE"). Ohio's IT 1040 is a single-column return, so income /
# credit lines carry no _A/_B/_C column suffix. Because the SAME line number
# repeats across the bundled schedules, main-form line keys are bare numbers
# ("1".."26") while each schedule's lines are prefixed (schedA_, schedITbus_,
# schedC_, schedJ_, schedW_) to keep every key unique. Schedule keys are the
# schedule's own 2025 PRINTED line numbers.
#
# Coverage. Every taxpayer-fillable widget on pages 1-12 is mapped (SP_SSN_SEP
# included, though the blank hides it — see OPEN), and so are three of the
# four ReadOnly non-pushbutton fields there (CHK_AMD, TP_SSN1 and L18, all
# P-007 class 4); the fourth, Date_Gen, is the DOR's data-entry date stamp. On
# page 13, UPC_Payment plus the seven class-4 coupon cells (upc_*) are mapped.
# What is intentionally left unmapped is exactly: the 28 pushbuttons,
# Date_Gen, and the 53 adjudicated-unmappable OUPC widgets (37 scan-line/
# check-digit cells, 12 hidden data carriers, UPC_TaxYear, VendorID, today,
# UPC_SDHide). 441 lines on 435 fields.
#
# Money vs text. Dollar boxes are typed `money`; the narrow "-" sign boxes
# that precede some negative-capable lines (L1_NEG, L3_NEG, L19_NEG and the
# IT BUS _NEG boxes) stay `text maxlen: 1`. Genuine text widgets — names,
# addresses, SSN/EIN/TIN boxes, dates, school-district / county codes,
# two-character state codes, ownership-percentage boxes, distribution codes,
# the P/S source flag, the exemption count box and the joint-filing-credit
# percentage box — stay `text` with the blank's own /MaxLen.
#   Six page-1 address widgets — ADDRESS2, STATE, ZIP, COUNTY, FRGN_COUNTRY
#   and FRGN_ZIP (/MaxLen 35/2/5/4/20/7) — carry the DOR's Comb bit (/Ff
#   29360128 = Comb|DoNotScroll|DoNotSpellCheck; the same on the 2024 blank)
#   although the printed face draws no character cells there. The pack leaves
#   `comb` unset, so taxfill's own appearance streams print them as plain
#   text (what the audit renders show); a viewer that regenerates appearances
#   (the filled file carries NeedAppearances true; the blank does not) may
#   space the glyphs across the box instead. Informational, not a binding.
#   The split between the tiny fixed-credit boxes typed `text` (schedC_2,
#   schedC_4, schedC_8, schedC_9, schedC_12, schedC_14, schedA_39; PDF
#   /MaxLen 2-4) and the `money` lines is SEMANTIC, not a "/MaxLen < N"
#   threshold: several `money` lines also carry a small /MaxLen on the 2025
#   blank (L4 = 5, L8B = 7; donations L25A-F = 4; schedA_25 = 4,
#   schedA_4/13/37/38 = 6, schedA_40 = 5, schedA_41 = 4, schedA_46 = 5;
#   schedC_3 = 6, schedC_5/6/7/13/15/16 = 4, schedC_26 = 7; schedITbus_12/13 = 6,
#   schedITbus_16 = 7; the withholding schedule's withheld-tax cells = 8, the
#   four 1099-R Box 4 cells = 9). Those stay `money` — they are whole-dollar
#   amount lines that need IRS rounding and feed the sum relations, and any
#   overlong value is caught post-fill by verify's P-001 clipping_scan, which
#   reads the PDF /MaxLen directly.
#
# Relations / cross_form. IT 1040 line 1 is explicitly "Federal adjusted
# gross income (federal 1040 or 1040-SR, line 11a)", and the 2025 Form 1040
# prints AGI on line 11a, so cross_form 1 == f1040.11a is declared. Only
# unconditional sums whose operands are ALL mapped money lines and carry no
# sign-box ambiguity are declared; see the `relations` block for what was
# omitted and why.
form: Form IT 1040
jurisdiction: states/oh
tax_year: 2025
source_url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/1040-bundle-original-fi.pdf
pdf_sha256: "4e6432e23df3bf181a8e9d7ee5d5bb7e2e96a6a21dd65fa39c625fb8a7e2f57c"
acroform_root: ''
fields:
  # =========================================================== IT 1040 page 1
  # ---- Top checkboxes
  - line: amended_return            # "AMENDED RETURN - Check here and include Ohio IT RE."
    field: CHK_AMD
    type: checkbox
    on_state: /Yes
  - line: nol_carryback             # "NOL CARRYBACK - Check here and include Schedule IT NOL."
    field: CHK_NOL
    type: checkbox
    on_state: /1
  # ---- Taxpayer / spouse identity
  - line: tp_ssn                    # Primary taxpayer's SSN (required)
    field: TP_SSN
    type: text
    maxlen: 9
  - line: tp_deceased               # primary taxpayer "Check if deceased" (2024 printed "If deceased")
    field: CHK_PRIM_DEC
    type: checkbox
    on_state: /Yes
  - line: spouse_ssn                # Spouse's SSN (if filing jointly)
    field: SP_SSN
    type: text
    maxlen: 9
  - line: spouse_deceased           # spouse "Check if deceased"
    field: CHK_SP_DEC
    type: checkbox
    on_state: /Yes
  - line: school_district_number    # School district #
    field: SD_NUM
    type: text
    maxlen: 4
  - line: tp_first_name
    field: TP_FN
    type: text
    maxlen: 15
  - line: tp_mi
    field: TP_MI
    type: text
    maxlen: 1
  - line: tp_last_name
    field: TP_LN
    type: text
    maxlen: 22
  - line: spouse_first_name
    field: SP_FN
    type: text
    maxlen: 15
  - line: spouse_mi
    field: SP_MI
    type: text
    maxlen: 1
  - line: spouse_last_name
    field: SP_LN
    type: text
    maxlen: 22
  - line: address_line_1            # Address line 1 (number and street) or P.O. Box
    field: ADDRESS1
    type: text
    maxlen: 35
  - line: address_line_2            # Address line 2 (apartment number, suite number, etc.)
    field: ADDRESS2
    type: text
    maxlen: 35
  - line: city
    field: CITY
    type: text
    maxlen: 20
  - line: state
    field: STATE
    type: text
    maxlen: 2
  - line: zip_code
    field: ZIP
    type: text
    maxlen: 5
  - line: ohio_county              # Ohio county (first four letters)
    field: COUNTY
    type: text
    maxlen: 4
  - line: foreign_country          # Foreign country (if the mailing address is outside the U.S.)
    field: FRGN_COUNTRY
    type: text
    maxlen: 20
  - line: foreign_postal_code
    field: FRGN_ZIP
    type: text
    maxlen: 7
  # ---- Residency Status — primary (check one) + indicate state
  - line: residency_primary::resident
    field: CHK_PRIM_RES
    type: checkbox
    on_state: /1
    group: residency_primary
  - line: residency_primary::part_year
    field: CHK_PRIM_RES
    type: checkbox
    on_state: /2
    group: residency_primary
  - line: residency_primary::nonresident
    field: CHK_PRIM_RES
    type: checkbox
    on_state: /3
    group: residency_primary
  - line: residency_primary_indicate_state   # *Indicate state (primary nonresident/part-year)
    field: PRIM_NON_RES_STATE
    type: text
    maxlen: 2
  # ---- Residency Status — spouse (check one if filing jointly) + indicate state
  - line: residency_spouse::resident
    field: CHK_SP_RES
    type: checkbox
    on_state: /1
    group: residency_spouse
  - line: residency_spouse::part_year
    field: CHK_SP_RES
    type: checkbox
    on_state: /2
    group: residency_spouse
  - line: residency_spouse::nonresident
    field: CHK_SP_RES
    type: checkbox
    on_state: /3
    group: residency_spouse
  - line: residency_spouse_indicate_state    # *Indicate state (spouse)
    field: SP_NON_RES_STATE
    type: text
    maxlen: 2
  # ---- Filing Status (check one, as reported on federal return)
  - line: filing_status::single_hoh_qss   # Single, head of household or qualifying surviving spouse
    field: CHK_FILING_STATUS
    type: checkbox
    on_state: /1
    group: filing_status
  - line: filing_status::mfj              # Married filing jointly
    field: CHK_FILING_STATUS
    type: checkbox
    on_state: /2
    group: filing_status
  - line: filing_status::mfs              # Married filing separately
    field: CHK_FILING_STATUS
    type: checkbox
    on_state: /3
    group: filing_status
  - line: filing_status_mfs_spouse_ssn    # Spouse's SSN (married filing separately). The blank HIDES this
                                          # widget (annotation /F 6) and only its own JavaScript shows it on
                                          # MFS; taxfill runs none, so the value is written but does not
                                          # print — see UNVERIFIED / OPEN in the header.
    field: SP_SSN_SEP
    type: text
    maxlen: 9
  # ---- Ohio Nonresident Statement (irrebuttable-presumption criteria)
  - line: nonresident_statement_primary   # Primary meets the five criteria for irrebuttable presumption as nonresident
    field: CHK_PRIM_NON_RES_STMT
    type: checkbox
    on_state: /1
  - line: nonresident_statement_spouse    # Spouse meets the five criteria for irrebuttable presumption as nonresident
    field: CHK_SP_NON_RES_STMT
    type: checkbox
    on_state: /1
  # ---- Federal extension / dependent-of-another
  - line: federal_extension_filer         # Federal extension filers - check here
    field: CHK_FED_EXT_FILTER
    type: checkbox
    on_state: /1
  - line: can_be_claimed_dependent        # "If someone can claim you (or your spouse if filing jointly) as a dependent, check here."
    field: CHK_CLAIM_DEP
    type: checkbox
    on_state: /1

  # ---- Lines 1-7
  - line: 1_neg                  # line 1 "-" sign box (place a "-" if negative)
    field: L1_NEG
    type: text
    maxlen: 1
  - line: "1"                    # Federal adjusted gross income (federal 1040 or 1040-SR, line 11a; 2024 printed line 11)
    field: L1
    type: money
  - line: 2a                     # Additions — Ohio Schedule of Adjustments, line 12
    field: L2A
    type: money
  - line: 2b                     # Deductions — Ohio Schedule of Adjustments, line 47 (2024: line 46)
    field: L2B
    type: money
  - line: 3_neg                  # line 3 "-" sign box
    field: L3_NEG
    type: text
    maxlen: 1
  - line: "3"                    # Ohio adjusted gross income (line 1 plus line 2a minus line 2b)
    field: L3
    type: money
  - line: 4_number_of_exemptions # "Number of exemptions including you and your spouse/dependents, if applicable"
    field: L4_EXEMPT
    type: text
    maxlen: 2
  - line: "4"                    # Exemption amount (include Schedule of Dependents if applicable)
    field: L4
    type: money
  - line: "5"                    # Ohio income tax base (line 3 minus line 4; if negative, enter zero)
    field: L5
    type: money
  - line: "6"                    # Taxable business income — Ohio Schedule of Business Income, line 15
    field: L6
    type: money
  - line: "7"                    # Taxable nonbusiness income (line 5 minus line 6; if negative, enter zero)
    field: L7
    type: money

  # =========================================================== IT 1040 page 2
  # TP_SSN1 is the per-page identity header. It is a SEPARATE AcroForm field
  # from TP_SSN (page 1), not a widget copy of it: one field, 12 widget kids —
  # 11 on document pages 2-12, the 12th parented to a /Type /Template object
  # that is not in the page tree. Every one of pages 2-12 prints an SSN caption
  # over it ("SSN:" on 2/4/6/8/10/12, "Primary taxpayer's SSN" on 3/5/7/9/11).
  # Its own /AA /C is `var ssNumber = this.getField("TP_SSN").valueAsString;
  # event.value = util.printx("XXX XX XXXX",ssNumber)` — the exact page-header
  # SSN mirror P-007 names as class 4. taxfill never executes that JavaScript,
  # so writing tp_ssn CANNOT populate it and it must be written directly, with
  # the SAME nine digits as tp_ssn (see the READONLY ADJUDICATION header note).
  - line: tp_ssn_page_header     # pages 2-12 header SSN mirror — write the same 9 digits as tp_ssn
    field: TP_SSN1
    type: text
    maxlen: 9
  - line: 7a                     # Amount from line 7 on page 1
    field: L7a
    type: money
  - line: 8a                     # Nonbusiness income tax liability on line 7a (see tax.ohio.gov/taxcalculator or see the instructions for the tax brackets)
    field: L8A
    type: money
  - line: 8b                     # Business income tax liability — Ohio Schedule of Business Income, line 16
    field: L8B
    type: money
  - line: 8c                     # Income tax liability before credits (line 8a plus line 8b)
    field: L8C
    type: money
  - line: "9"                    # Ohio nonrefundable credits — Ohio Schedule of Credits, line 40 (2024: line 39)
    field: L9
    type: money
  - line: "10"                   # Tax liability after nonrefundable credits (line 8c minus line 9; if negative, enter zero)
    field: L10
    type: money
  - line: "11"                   # Interest penalty on underpayment of estimated tax (include Ohio IT/SD 2210)
    field: L11
    type: money
  - line: "12"                   # Unpaid use tax
    field: L12
    type: money
  - line: "13"                   # Total Ohio tax liability before withholding or estimated payments (add lines 10, 11, and 12)
    field: L13
    type: money
  - line: "14"                   # Ohio income tax withheld — Schedule of Ohio Withholding, part A, line 1
    field: L14
    type: money
  - line: "15"                   # Estimated and extension payments, credit carryforward from the 2024 return, and amounts
                                 # previously paid with an original and/or amended 2025 return (2025 folded the
                                 # 2024 line 17 "amount previously paid" into this line)
    field: L15
    type: money
  - line: "16"                   # Refundable credits — Ohio Schedule of Credits, line 47 (2024: line 46)
    field: L16
    type: money
  - line: "17"                   # Total Ohio tax payments (add lines 14, 15, and 16) (2024 line 18)
    field: L17
    type: money
  # Line 18 is the ONE "Amended return only" cell left on the 2025 face. Its
  # widget L18 carries /Ff = 1 (ReadOnly) on the 2025 blank (2024: 0, when L18
  # was total payments), and NOTHING in the file ever clears it: no readonly
  # assignment in the file's JavaScript targets L18 (every one was resolved to
  # its field), and the only script that touches L18 at all is DS_Print's
  # barcode gather, which reads it. The document script's `case "CHK_AMD"`
  # branch is byte-identical to 2024's and still toggles L17/L19 and
  # L25/L26A-L26G — but on this face L17 and L19 are the ordinary
  # total-payments and "Line 17 minus line 18" lines (both /Ff 0), and
  # L25/L26A-L26G no longer exist. So the bit sits on a line the face tells an
  # amended filer to complete, and no script can clear it — the 2024
  # SchedC_L12 shape: P-007 class 4, MAPPED. L18's /AA is identical to its
  # unflagged neighbours L17/L19 (/F + /K AFNumber_Format/Keystroke(0,1,0,0,
  # "",true), /V AFRange_Validate(true, 0, true, 999999999), /C dsRound())
  # and its /V is absent, so nothing computes it and nothing is overwritten.
  # Unmapped, an amended return filed through taxfill would print a blank
  # line 18 while line 19 ("Line 17 minus line 18") printed a difference.
  # CALLER NOTE: 18 is filled only with amended_return checked; 24 and 25a-g
  # read "Original return only", so fill them only without it.
  - line: "18"                   # Amended return only — overpayment previously requested on original and/or amended 2025 return (2024 line 19)
    field: L18
    type: money
  - line: 19_neg                 # line 19 "-" sign box (place a "-" if negative); 2024: L20_NEG on line 20
    field: L19_NEG
    type: text
    maxlen: 1
  - line: "19"                   # Line 17 minus line 18 (2024 line 20)
    field: L19
    type: money
  - line: "20"                   # Tax due (line 13 minus line 19) (2024 line 21)
    field: L20
    type: money
  - line: "21"                   # Interest due on late payment of tax (2024 line 22)
    field: L21
    type: money
  - line: "22"                   # TOTAL AMOUNT DUE (line 20 plus line 21) — pay at tax.ohio.gov/pay or include the OUPC with your check (2024 line 23)
    field: L22
    type: money
  - line: "23"                   # Overpayment (line 19 minus line 13) (2024 line 24)
    field: L23
    type: money
  - line: "24"                   # Original return only — portion of line 23 carried forward to next year’s tax liability (2024 line 25, widget L25)
    field: L24
    type: money
  # ---- line 25 — Original return only — portion of line 23 you wish to donate (a-f) and total (g).
  # 2025 ROTATED THE FUND LABELS AGAIN by one position, over NEW widget names
  # L25A..L25G (2024: L26A..L26G on line 26). The DOR's own /TU tooltips on
  # L25A..L25F still read the 2023 order (L25A "Wishes for Sick Children"), so
  # each letter below was read off the printed label above its box.
  - line: 25a                    # a. Nature Preserves/Scenic Rivers  (2024 a. was Breast/Cervical Cancer)
    field: L25A
    type: money
  - line: 25b                    # b. Breast/Cervical Cancer  (2024 b. was Wishes for Sick Children)
    field: L25B
    type: money
  - line: 25c                    # c. Wishes for Sick Children  (2024 c. was Wildlife Species)
    field: L25C
    type: money
  - line: 25d                    # d. Wildlife Species  (2024 d. was Military Injury Relief)
    field: L25D
    type: money
  - line: 25e                    # e. Military Injury Relief  (2024 e. was Ohio History Fund)
    field: L25E
    type: money
  - line: 25f                    # f. Ohio History Fund  (2024 f. was Nature Preserves/Scenic Rivers)
    field: L25F
    type: money
  - line: 25g                    # Total (25a through 25f)
    field: L25G
    type: money
  - line: "26"                   # REFUND (line 23 minus lines 24 and 25g) (2024 line 27, widget L27)
    field: L26
    type: money
  # ---- Sign Here / preparer block (page 2)
  - line: primary_signature_phone   # Primary signature — Phone number
    field: PHONE_NUM
    type: text
    maxlen: 10
  - line: signature_date            # Date (spouse signature line)
    field: SIGN_DATE
    type: text
    maxlen: 8
  - line: preparer_printed_name     # Preparer's printed name — the widget has no /MaxLen; its box is
                                    # 153.6 pt wide (/Rect x 113.25-266.85) at CourierNew,Bold 12 =
                                    # 7.2 pt per glyph, so 21 glyphs fit (the 2024 pack's 25 let
                                    # 22-25 characters through to a verify P-001 width FAIL)
    field: PREPARER_PRINTED_NAME
    type: text
    maxlen: 21
  - line: preparer_phone            # Preparer — Phone number
    field: PREPARER_PHONE_NUM
    type: text
    maxlen: 10
  - line: preparer_ptin             # Preparer PTIN — the 2025 face prints "PTIN: P" with the P left of this
                                    # box (new for 2025); enter the eight characters after the P
    field: PREPARER_TIN
    type: text
    maxlen: 8
  - line: authorize_preparer_discuss   # "Authorize your preparer to discuss this return"
    field: SpeakPrep
    type: checkbox
    on_state: /1
  - line: non_paid_preparer            # "Non-paid preparer"
    field: NonPaidPrep
    type: checkbox
    on_state: /1

  # =============================== Ohio Schedule of Adjustments (pages 3-4)
  # 2025 RENUMBERED THIS SCHEDULE AGAIN. Additions are still printed lines 1-11
  # totalling on line 12; deductions are now printed lines 13-46 (2024: 13-45)
  # and total on line 47 (2024: 46). One printed line is NEW: line 25
  # "Deduction for contributions to a pregnancy resource center", so every
  # 2024 line from 25 on moved down one number. The AcroForm names are
