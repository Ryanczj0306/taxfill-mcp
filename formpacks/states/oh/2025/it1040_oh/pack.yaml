  # Payer's Ohio ID number, Box 12 Ohio income tax withheld. Six NEW widgets
  # SchedW_F_L1_*, typed like their Part E counterparts (/MaxLen 1 / 9 / 9 / 8 / 8 / 8).
  # Their /TU tooltips are copies of Part E's 1099-NEC captions ("Box 1 -
  # Non-employee Compensation", "Box 6 - Payer's Ohio number", "Box 5 - Ohio
  # tax withheld"), so each cell was placed from the printed 1099-G captions
