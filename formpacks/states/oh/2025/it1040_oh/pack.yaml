  # Part E — 1099-NEC (1 row; 2024 "1099-NECs", 2 rows — the second row and its
  # seven SchedW_E_L2_* widgets are gone): P/S flag, Payer's TIN, Box 1
  # nonemployee compensation, Box 4 federal income tax withheld, Box 6 payer's
  # Ohio number, Box 7 Ohio income, Box 5 Ohio tax withheld. The row moved up
  # 72 pt into the space the third W-2G row left; the DOR's /TU tooltips on
  # SchedW_E_L1_COMP/OHINC/TIN now read W-2G captions ("Box 1 - Reportable
