relations:
  - "3 == 1 + 2"                       # Line 3 "Add lines 1 and 2."
  - "5 == 3 + 4"                       # Line 5 "Add lines 3 and 4."
  - "7 == 5 - 6"                       # Line 7 "Subtract line 6 from line 5."
  - "10c == 10a + 10b"                 # Line 10c "Add lines 10a and 10b."
  - "15 == line15_qualifying_expenses * 0.5"   # Line 15 "Qualifying expenses .00 x 50% = 15" (the instructions cap the input at $3,000 per qualifying person, so the result is always 50% of 15a).
  - "25 == line25_penalty_base * 0.33"         # Line 25 "Penalties on IRAs, retirement plans, MSAs, etc. ... .00 x .33 = 25"
  - "27 == 22 + 23 + 24 + 25 + 26"     # Line 27 "Add lines 22 through 26."
  - "37 == 28 + 29 + 30 + 31a + 31b + 32 + 33 + 34 + 35 + 36"   # Line 37 "Add lines 28 through 36." (30 = the earned income credit result; 31a/31b are the two farmland boxes)
  - "39 == 37 - 38"                    # Line 39 "Subtract line 38 from line 37."
  - "45 == 43 + 44"                    # Line 45 "Add lines 43 and 44."
  - "sch1_5 == sch1_1 + sch1_2 + sch1_3 + sch1_4"   # Schedule 1 line 5 "Add lines 1 through 4."
  - "sch1_9 == sch1_7 * 0.05"          # Schedule 1 line 8 "Rate of credit is .05 (5%)", line 9 "Multiply line 7 by line 8."
  - "sch2_3_yourself == sch2_1_yourself + sch2_2_yourself"  # Schedule 2 line 3 (col A) "Combine lines 1 and 2."
  - "sch2_3_spouse == sch2_1_spouse + sch2_2_spouse"        # Schedule 2 line 3 (col B) "Combine lines 1 and 2."
  - "sch3_2 == sch3_1a + sch3_1b + sch3_1c + sch3_1d + sch3_1e + sch3_1f + sch3_1g + sch3_1h"  # Schedule 3 line 2 "Total Donations (add lines 1a through 1h)."
  - "24 == sch3_2"                     # Schedule 3 line 2 "Fill in here and on line 24 on page 2 of Form 1."
cross_form:
  - "1 == f1040.11a"                   # Line 1 "Federal adjusted gross income from Form 1040, line 11" — the TY2025 Form 1040 defines AGI on line 11a.
