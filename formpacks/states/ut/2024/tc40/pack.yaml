#
# ONE LINE KEY RENAMED: `refund_applied_to_2024` -> `refund_applied_to_next_year`,
# because the key names the DESTINATION year and the 2024 form's Part 6 line 2
# prints "applied to your 2025 taxes". The widget ("40 pg 3 pt 6 line 2") and
# the printed row are unchanged; the Part 6 total relation was updated with it.
# Grepped first: the old key was referenced NOWHERE outside the 2023 pack, so
# this touches no calc, extractor, fixture or test.
# WHY YEAR-FREE AND NOT `refund_applied_to_2025` — this is the settled repo rule
# and it was DISPUTED: the first draft of this port rolled the year to 2025 while
# states/nj/2024/nj1040, ported the same day, kept a stale 2024 in
# `line69_credit_to_2024_tax_dNN` and cited a "port convention" for keeping it.
# Two packs shipped the same day disagreeing on one shape is the defect; both are
# now year-FREE. Keeping a stale year is the worse of the two originals — an
# identifier that says "applied to 2024" for a box the state applies to 2025
# inverts the direction of the money for any caller who maps by key name — but
# rolling the year is honest for exactly one year and then must be renamed on
# every single port, which manufactures the cross-year API churn that the "a line
# key is an API surface" argument exists to prevent. A key that names the ROLE
# relative to the pack's own tax_year is honest in EVERY year and never needs
# renaming again: `refund_applied_to_next_year` + `tax_year: 2024` says 2025 with
# no ambiguity, and the form's own page-2 attach note uses the same idiom ("want
# to apply all/part of your refund to next year's taxes"). Precedent, grepped
# rather than recalled: NY it203 2023/2024/2025 all carried
# `69_amount_applied_to_2024_estimate` — correct in 2023, STALE in 2024 and 2025
# — which is what "keep it" costs (all three took the year-free rename on
# 2026-08-24); NY it201 has ZERO year-bearing keys in all
# three years, so it is no precedent either way (the NJ header's claim that
# it201 "shipped the identical documented caveat" was false and has been
# corrected there). Contrast the year keys that must STAY: NJ's
# `filing_status_qw_year_of_death::2022`/`::2023` name which physical OVAL takes
# the X, so their years are a mapping fact and must be re-derived every port.
# FOLLOW-UP for another owner — TAKEN 2026-08-24: states/ut/2023/tc40 renamed
# `refund_applied_to_2024` to this same year-free key, so the family agrees
# across both shipped years. The rule is formpacks/CONVENTIONS.md "Year tokens
# in line keys" (landed 2026-08-21).
#
# READONLY ADJUDICATION (P-007) — the mandatory pass. Every widget's /Ff was
# resolved by walking the /Parent chain, using the same reader the gate test
# uses (test_formpacks_federal._read_only_widget_names), and cross-checked with
# an independent walk. RESULT: the 2024 blank has ZERO ReadOnly widgets. The
# observed /Ff population is 12582912 x98 (DoNotScroll|DoNotSpellCheck),
# 12587008 x1 (the same two bits + Multiline — the preparer firm-name box),
# 4194304 x4 (DoNotSpellCheck: phone + the three yy date cells), 65536 x1
# (Pushbutton — "Clear form") and NO /Ff key at all on 7 (an absent /Ff is
# flags = 0). Those 7 are exactly the seven /Btn checkboxes — "40 Line 21 Check
# box", "40 Line 45 Checking", "40 Line 45 Savings", "40 Line 45 Foreign",
# "40 pg3 part 1 TC-131", "40 Form 8886", "40 pg3 part 7 exempt prop" — and no
# text widget: a CORRECTION to this header, which previously wrote "0 x7 (the
# six checkboxes and one text cell)" and undercounted the checkboxes by one
# (the direct-deposit Type question is THREE boxes, not one). 98+1+4+1+7 = 111.
# Bit 1 is set on none of them, in either the 2023 packet or the 2024 file.
# Per-widget verdict, by P-007 class:
#   * NOTHING TO CLASSIFY, because the four P-007 classes discriminate among
#     ReadOnly/greyed widgets and this blank has none. Every widget below is an
#     ordinary writable one, so each must be mapped or its box files BLANK.
#   * class 4 (a value the form's own JavaScript owns) is EMPTY — and this is a
#     CORRECTION of the most substantive error this header carried. It used to
#     assert that "the form does embed JavaScript (pdfinfo 'JavaScript: yes')
#     and it computes the running totals ... and the page-2/3 SSN + last-name
#     mirrors". It does not, and the flag was the only evidence for it. MEASURED
#     instead: every object reachable from the catalog was swept, and the 2024
#     file holds 119 /JS actions, ALL of them in Format (/F x62), Keystroke
#     (/K x52) and Validate (/V x5) slots — ZERO /AA /C calculate actions, no
#     AcroForm /CO calculate order, no catalog /Names JavaScript tree, no
#     /OpenAction. pdfinfo's "JavaScript: yes" is satisfied by AFNumber_Format-
#     style formatting scripts and does NOT mean the form computes anything;
#     P-007 exists to forbid exactly that flag-only inference, so the slot
#     census is what this header now records.
#     The same sweep of the 2023 PACKET shows where the false premise came from
#     and why it never applied to this pack: the 9-page packet does carry 12 /C
#     calculate actions and an AcroForm /CO of 12 entries, but every one of them
#     sits on a SCHEDULE page (4-9) and is out of this pack's scope, and none
#     computes a total — all 12 are the same two-line copy, `var f =
#     this.getField("40 Your SSN"); event.value = f.value;` (and the last-name
#     twin), mirroring the core-page identity into the TC-40A/B/S/W headers
#     (40A/40B/40S/40W SSN + last name). The 2024 file, being the core return
#     only, has none of them. Core pages 1-3 have carried ZERO calculate
#     scripts in BOTH years.
#     Consequence for the two things the old claim named. (a) The running totals
#     — 6, 13, 15, 18, 25, 27, 32, 38, 41, 42 and the Part 4/5/6 totals — are
#     ordinary writable /Tx widgets that NOTHING computes: taxfill must fill
#     them because no viewer will, and they are all mapped below. Same outcome
#     as before, sound premise this time. (b) The page-2/3 SSN + last-name
#     header mirrors are not JavaScript at all: "40 Your SSN" and "40 Your last
#     name" are ONE AcroForm field each with three widgets, so writing the field
#     once populates all three pages mechanically (the Layout note below says
#     this correctly, and the audit render confirms it).
#   * "necessarily blank" cells to EXCLUDE: none. No printed row on this form
#     says "leave this line blank"; no cell is shaded closed.
#   * widgets holding a DOR-printed constant: none, and swept rather than
#     eyeballed — the whole field tree carries NOT ONE /V or /DV. The statutory
#     figures ($2,046, $17,652/$26,478/$35,304, the 4.55%/6%/1.3% rates, the two
#     mailing ZIPs) are printed as PAGE TEXT outside any widget, so the filler
#     cannot overwrite them.
# CONSEQUENCE FOR THE GATES: mapped-∩-ReadOnly is the EMPTY SET, so this pack
# needs NO row in packages/core/tests/test_readonly_widget_mapping.py's
# STATE_COMPUTED_READONLY table — absence from that table pins it at zero,
# which is exactly the truth. (Same posture as states/ut/2023/tc40, which is
# also absent from the table.) If a future UT revision sets the bit on the
# computed totals, that row becomes mandatory and this note is the place to
# start.
#
# VISION AUDIT PERFORMED. `uv run python scripts/audit_pack.py
# formpacks/states/ut/2024/tc40/pack.yaml`: exit 0, "mapped_lines": 104,
# "written_fields": 104, "verify_fails": [] (0 assertion / 0 clipping / 0
# checkbox FAILs), 3 pages rendered at 170 dpi; every PNG was then READ page by
# page. 104 AND NOT 106: the pack has 106 field ENTRIES, but the three
# direct-deposit Type options (44_account_type.checking/.savings/.foreign) are
# one question on one `group`, and the audit's synthetic_values answers each
# group once — 106 - 2 = 104 lines filled. A CORRECTION to this header, which
# previously claimed the audit "filled all 106 mapped lines"; a re-run must show
# 104/104. (Relations are excluded from the audit's verify pass by design, so the
# six max() floors added below do not change these numbers; they were confirmed
# to parse and to leave the audit at exit 0 with 0 FAILs.)
# What was checked and confirmed: each sentinel sits on its own printed
# line number (page 1 lines 4-22, page 2 lines 23-44, page 3 Parts 1-7); the
# 9-digit SSN and 9-digit routing combs show every digit unclipped; the
# direct-deposit checkbox group marks the intended single box; the SSN and last
# name propagate to the page-2 and page-3 headers from their single mapping;
