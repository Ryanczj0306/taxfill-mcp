#   UNCHANGED on the face: line 16's 6% (.06) initial-credit rate, line 19's
#   1.3% (.013) phase-out rate, and both mailing addresses.
#   knowledge/states/ut/2024.yaml was checked against every one of these and
#   already models them all (4.55%, $2,046, $17,652/$26,478/$35,304, 6%, 1.3%,
#   the line-14 Schedule A line 5a caption, the SB 223 Nonprofit Capacity Fund
