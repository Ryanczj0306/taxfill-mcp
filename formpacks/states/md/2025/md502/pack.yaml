    field: Enter social security number
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: spouse_ssn                    # Spouse's Social Security Number (/MaxLen 9)
    field: Enter spouse's social security number
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: tp_first_name
    field: Enter your first name
    type: text
  - line: tp_middle_initial             # MI — 14.4 pt box, no /MaxLen
    field: Enter your middle initial
    type: text
    maxlen: 1
  - line: tp_last_name                  # the SAME field repeats on pages 2-4
    field: Enter your last name
    type: text
  - line: spouse_first_name
    field: Enter Spouse's First Name
    type: text
  - line: spouse_middle_initial         # MI — the widget now says /MaxLen 10 but the 14.3 pt box holds 2 at Courier 10 (TIGHTER_THAN_WIDGET)
    field: Enter Spouse's middle initial
