relations:
  - "6 == 2 + 3 + 4 + 5"                 # line 6 "Total additions (Add Lines 2 through 5. See instructions.)"
  - "7 == 1 + 6"                         # line 7 "(Add Lines 1 and 6.)"
  - "16 == 7 - 15"                       # line 16 "Maryland adjusted gross income (Subtract Line 15 from Line 7.)"
  - "18 == 16 - 17"                      # line 18 "Net income (Subtract Line 17 from Line 16.)"
  - "20 == 18 - 19"                      # line 20 "Taxable net income (Subtract Line 19 from Line 18.)"
  - "21b == 20a * 0.02"                  # line 21b "Additional tax on net capital gain income. Multiply Line 20a by .02"
  - "32 == 29 + 30 + 31"                 # line 32 "Total credits (Add Lines 29 through 31.)"
  - "34 == 27 + 33"                      # line 34 "Total Maryland and local tax (Add Lines 27 and 33.)"
  - "40 == 34 + 35 + 36 + 37 + 38 + 39"  # line 40 "(Add Lines 34 through 39.)" — 39 is the NEW Veterans Trust Fund line
  - "46 == 41 + 42 + 43 + 44 + 45"       # line 46 "Total payments and credits (Add Lines 41 through 45.)" — 42 is the NEW MW506NRS line
  - "52 == 47 + 51 + 51a"                # line 52 "TOTAL AMOUNT DUE (Add Lines 47, 51, and 51a.)"
cross_form:
  - "1 == f1040.11a"                     # line 1 "Adjusted gross income from your federal return" = 2025 Form 1040 line 11a (AGI)
identity_fields:
  - tp_ssn
  - tp_first_name
  - tp_last_name
