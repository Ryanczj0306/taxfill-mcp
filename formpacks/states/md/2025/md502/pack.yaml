  - line: md_physical_county            # Maryland County (renamed from 'Enter zip code + 5')
    field: Physical Maryland County
    type: text
  # ---- Filing status (CHECK ONE BOX) — ONE six-kid /Btn field in 2025; on_states re-dumped from this blank's /AP /N
  - line: filing_status_1_single        # 1. Single
    field: Check Box - 1
    type: checkbox
    group: filing_status
    on_state: /Single
  - line: filing_status_2_mfj           # 2. Married filing joint return or spouse had no income
    field: Check Box - 1
    type: checkbox
    group: filing_status
    on_state: /Married filing joint return or spouse had no income
  - line: filing_status_3_mfs           # 3. Married filing separately, Spouse SSN
    field: Check Box - 1
    type: checkbox
    group: filing_status
    on_state: /Married filing separately
  - line: filing_status_3_spouse_ssn    # Spouse SSN on the MFS line (renamed; /MaxLen 9)
    field: Enter spouse's social security number if filing married separately
    type: text
    maxlen: 9
    format: ssn_digits_only
  - line: filing_status_4_hoh           # 4. Head of household
    field: Check Box - 1
    type: checkbox
    group: filing_status
    on_state: /Head of household
  - line: filing_status_5_qss           # 5. Qualifying surviving spouse with dependent child
    field: Check Box - 1
    type: checkbox
    group: filing_status
    on_state: /Surviving Spouse with dependent child
  - line: filing_status_6_dependent     # 6. Dependent taxpayer (Enter 0 in Exemption Box (A) See Instruction 7.)
    field: Check Box - 1
    type: checkbox
    group: filing_status
    on_state: /Dependent taxpayer
  # ---- Part-year resident
  - line: md_residence_from             # Dates of Maryland Residence (MM DD YYYY) FROM — the box after the printed FROM (x 346)
    field: Enter dates of Maryland Residence from MM/DD/YYYY
    type: text
    maxlen: 10
  - line: md_residence_to               # TO — the box after the printed TO (x 439); the widget NAME says 'beginning', the face says TO
    field: Enter dates of Maryland Residence  beginning MM/DD/YYYY
    type: text
    maxlen: 10
  - line: other_state_of_residence      # Other state of residence (/MaxLen 2)
    field: Text Field 14
    type: text
    maxlen: 2
  - line: legal_residence_pm_flag       # place a P (began/ended legal residence in 2025) or an M (MILITARY) in the box; the widget NAME still says 2023, the face says 2025; /MaxLen 2 (2023: 1)
    field: If you began or ended legal residence in Maryland in 2023 place a P in the box
    type: text
    maxlen: 2
  - line: military_income_amount        # Enter Military Income amount here: (dollars)
    field: Enter Military Income amount here
    type: money
  - line: military_income_amount_cents  # NEW 2025: the 16.6 pt cents box right of the amount (widget /MaxLen 10; holds 2 at Courier 10 — TIGHTER_THAN_WIDGET)
    field: Enter Military Income amount here 2
