# ===========================================================================
# Form 502, 2025 — Maryland Resident Income Tax Return.
#
# Layout. Mostly-flat AcroForm (acroform_root empty). MOST field names are the
# raw, human-readable sentinel ids the form ships with ("Enter your first
# name", "Enter 1", "Text Box 30", "Check Box 15"). A handful of fields are
# HIERARCHICAL (parent /T = a short tag, child /T = the rest) and pypdf
# exposes them by their fully-qualified "<parent>.<child>" name — these are
# kept verbatim ("B. Check this box if you are blind", "B. Enter number
# exemptions checked B", "D. Enter Dollar Amount Total Exemptions (Add A, B
# and C.) ", the four "Enter ... Address Line ..." fields). The FT=None parent
# containers have no appearance of their own and are NOT mapped — only their
# full-name child widgets are.
#
# Coverage. 185 widget annotations over 172 distinct /FT fields; all 172 are
# mapped (179 lines: 172 fields + the five extra filing-status kids, the
# second deduction-method kid and the second account-type kid). The page-2/3/4
# repeats of "Enter your last name" and "Enter social security number" are
# kids of the page-1 fields and fill together, so they are mapped ONCE.
#
# Line 25 ("Business tax credits — You must file this form electronically to
# claim business tax credits on Form 500CR.") has NO money widget on the paper
# form (it is e-file only).
#
# Radio / checkbox groups. Filing status (1-6) is ONE six-kid /Btn field
# (group filing_status); deduction method ONE two-kid field (group
# deduction_method); 53a account type ONE two-kid field (group
# 53a_account_type). Every other checkbox is its own single-widget field with
# the on_state read from this blank's /AP /N (the two direct-deposit boxes use
# /Direct Deposit, everything else /Yes). The you/spouse pairs (exemption A,
# B 65-or-over, B blind, 10a, 10b) are independent boxes on one printed row
# and sit in SEPARATE_OPTION_SETS_ADJUDICATED (year-free keys).
#
# Money vs text. Every dollar box prints a ".00" cents marker or a separate
# cents cell and is mapped `money`. On page 3 from line 41 on (and on the
# page-1 military-income row) the dollars and cents are SEPARATE widgets: the
# dollar box is `money` and its 2-digit companion is a `text maxlen 2` line
# keyed "<line>_cents". Genuine text widgets stay text: names, addresses,
# city/state/ZIP, foreign fields, the political-subdivision code/name, the SSN
# boxes (maxlen 9, digits only), residence dates, "other state of residence"
# (2), the P/M legal-residence flag (2), the email box, the additions/
# subtractions 2-letter code boxes (Text Field 5-12), the exemption count
# boxes, the local-tax-rate box, bank routing/account, telephones, PTIN,
# preparer name/address, and the 3-digit code-number boxes.
#
# Relations. Only unconditional sums/subtractions/products whose every operand
# is a mapped money line and whose arithmetic the face prints are declared
# (6, 7, 16, 18, 20, 21b, 32, 34, 40, 46, 52). Lines whose printed instruction
# is conditional/floored ("If less than 0, enter 0" — 27, 33; greater-than
# branches — 47, 48, 50), or whose sum includes the unmapped e-file-only line
# 25 (line 26) or the a/b/c-split exemption/pension/deduction sub-lines (15,
# 17, exemption D), are OMITTED per the conservative house style.
#
# Cross_form. Line 1's printed label is "Adjusted gross income from your
# federal return", i.e. federal AGI; the 2025 Form 1040 prints AGI on line
# 11a, so the single cross_form equality is 1 == f1040.11a.
form: Form 502
jurisdiction: states/md
tax_year: 2025
source_url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/forms/2025/502.pdf
pdf_sha256: 4f4d604f27cf6995cbab58b7650fd812c0e4ccc9f8d899f04261ded5a04a24cf
acroform_root: ''
fields:
  # ============================================ PAGE 1 — header (fiscal year)
  - line: fiscal_year_beginning         # OR FISCAL YEAR BEGINNING ____ 2025 (widget renamed; /MaxLen 10)
    field: Enter day, month and year of Fiscal Year beginning DD
    type: text
    maxlen: 10
  - line: fiscal_year_ending            # ENDING ____ (/MaxLen 10)
    field: Enter day and month of Fiscal Year Ending
    type: text
    maxlen: 10
