relations:
  - "6 == 2 + 3 + 4 + 5"                 # line 6 "Total additions (Add lines 2 through 5. See instructions.)"
  - "7 == 1 + 6"                         # line 7 "(Add lines 1 and 6.)"
  - "15 == 8 + 9 + 10a + 10b + 11 + 12 + 13 + 14"  # line 15 "Total subtractions (Add lines 8 through 14. See instructions.)"
  - "16 == 7 - 15"                       # line 16 "Maryland adjusted gross income (Subtract line 15 from line 7.)"
  - "18 == 16 - 17"                      # line 18 "Net income (Subtract line 17 from line 16.)"
  - "20 == 18 - 19"                      # line 20 "Taxable net income (Subtract line 19 from line 18.)"
  - "32 == 29 + 30 + 31"                 # line 32 "Total credits (Add lines 29 through 31.)"
  - "34 == 27 + 33"                      # line 34 "Total Maryland and local tax (Add lines 27 and 33.)"
  - "39 == 34 + 35 + 36 + 37 + 38"       # line 39 "(Add lines 34 through 38.)"
  - "44 == 40 + 41 + 42 + 43"            # line 44 "Total payments and credits (Add lines 40 through 43.)"
  - "48 == 46 - 47"                      # line 48 "Amount of overpayment TO BE REFUNDED TO YOU (Subtract line 47 from line 46.) See line 51."
  - "50 == 45 + 49"                      # line 50 "TOTAL AMOUNT DUE (Add lines 45 and 49.)"
  - "exemption_D_amount == exemption_A_amount + exemption_B_amount + exemption_C_amount"  # exemption D "Enter Total Exemptions (Add A, B and C.) ... Total Amount D. $"
cross_form:
  - "1 == f1040.11"                      # line 1 "Adjusted gross income from your federal return" = 2024 Form 1040 line 11 (AGI)
identity_fields:
  - tp_ssn
  - tp_first_name
  - tp_last_name
