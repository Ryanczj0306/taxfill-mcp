  - line: "2"                           # Tax-exempt interest on state and local obligations (bonds) other than Maryland
    field: Enter 2
    type: money
  - line: "3"                           # State retirement pickup
    field: Enter 3
    type: money
  - line: "4"                           # Lump sum distributions (from worksheet in Instruction 12.)
    field: Enter 4
    type: money
