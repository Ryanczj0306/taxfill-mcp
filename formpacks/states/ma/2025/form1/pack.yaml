# ===========================================================================
# TY2025 PORT of formpacks/states/ma/2023/form1/pack.yaml as re-mapped onto
# DOR's 2026-05-22 re-issue of the 2023 Form 1 (ported 2026-10-02, Phase J
# JS5; triaged RE-MAP). That re-issue shares this blank's caption-named
# AcroForm, so it is the port source: a widget census of this blank against
# the pack on the 2024-01-17 blank finds 148 of its 152 mapped widgets gone by
# name (every name changed), against the re-issue pack 143 of 160 fields keep
# their names.
#
# URL. source_url below, fetched with a desktop-browser request (mass.gov sits
# behind Akamai and answers 403 to a plain fetcher) in two separate runs on
# 2026-10-02: both 200 application/pdf, 558,273 bytes, Last-Modified Mon, 27
# Jul 2026 18:10:33 GMT, sha256 0bb62498…cb04a07 — the same digest as the
# discovery copy. The Wayback request web/2026id_/<source_url> redirects to
# capture 20260911192930 (`mirror_urls`), which answers 200 with the same
# bytes, so fetch_blank's 403 fallback lands on the pin and caches it only if
# the digest matches (a mismatch fails closed).
#
# PRINTED IDENTITY. Page 1 prints "Massachusetts Department of Revenue",
# "2025" and "Form 1 Massachusetts Resident Income Tax Return"; pages 2-4
# print "2025 FORM 1, PAGE 2/3/4". No revision stamp is printed. /Title "2025
# Massachusetts Form 1 Personal Income Tax Return", /CreationDate 2025-11-25,
# /ModDate 2026-07-14. Pages are 594 x 783 pt.
#
# HISTORY. Two earlier cuts of this URL are on the Wayback Machine: capture
# 20260121215233 (sha256 25aa53e0…, /ModDate 2026-01-15) and 20260420000228
# (e25f0567…, /ModDate 2026-01-23). The second prints the same text on every
# page and carries the same widgets (names, /Rect, flags, appearance states)
# as the pinned file; only the bytes differ.
#
# TOPOLOGY against the re-issue pack (a widget census by position and printed
# label; every row then confirmed on a sentinel render). 179 widgets = 163
# terminal fields under 162 top-level /Fields entries (the re-issue: 176 =
# 160). Field names are captions, and Acrobat reads each "." in one as a
# hierarchy, so pypdf's get_fields lists 361 names; `field:` below is always
# the full terminal name. No widget is ReadOnly. The 143 fields present
# under the same name on both blanks (159 widgets on each, 155 name/page
# pairs) carry the same /FT, /Ff, /MaxLen, /DA and appearance states.
#   * 143 fields keep their names. 23 sit where they sat; 120 moved with
#     their rows: page 1's name rows 8.0 pt up, lines a/b 12.4 pt up, line 1
#     7.6 pt up, lines 2a-2g about 3 pt up; page 2's lines 5-23 20-21 pt up
#     (the 5a/5b row is gone); page 3's lines 25-38 2.6-12.8 pt up or down
#     (38a-38c also 13.4 pt right); page 4's direct-deposit, interest/penalty and preparer
#     rows about 20 pt down. The page-1 battery was re-laid: the custodial-
#     parent oval moved 285.8 pt right onto its own row, the Schedule TDS /
#     FCI and digital-assets ovals moved left onto one "Fill in if the
#     following applies" row, the deceased ovals moved left to make room for
#     date combs, and the NRA oval moved 45.9 pt right.
#   * 10 fields were renamed at their own row, meaning unchanged: "zip code"
#     -> "zip"; line b "... line 11" -> "... line 11a"; the four 2c fields
#     ("... before 2025" -> "... before 2026", "number of people" -> "number
#     of"); 14a, 39 and 40 (the years in their names); "Print Paid Preparer’s
#     Name" -> "Print Paid Preparer’S Name".
#   * 5 fields were renumbered with the face: the re-issue's line 50 (total),
#     51 (overpayment), 52 (applied to next year), 53 (refund) and 54 (tax
#     due) are this blank's lines 51-55, so the keys "51"-"55" moved with
#     them, the direct-deposit keys are 54_* (were 53_*) and the interest /
#     penalty / M-2210 boxes under the tax-due line are 55a-55c (were
#     54a-54c).
#   * GONE: lines 5a and 5b (the face prints one line 5, "Massachusetts bank
#     interest"); their keys are dropped.
#   * NEW, all mapped: line 50 "Nonresident withholding on sales of
#     Massachusetts real estate (from Schedule 62-WH)" (comb, /MaxLen 8); a
#     date-of-death comb (/MaxLen 8, printed M M D D Y Y Y Y) beside each
#     deceased oval -> deceased_taxpayer_date / deceased_spouse_date
#     (comb: true); and two line-1 ovals, "Fill in if not using same filing
#     status on the federal return" -> 1_not_same_federal_filing_status and
#     "Fill in if joint filing exemption for spouses with Massachusetts gross
#     income under $8,000" -> 1_joint_filing_exemption.
#   * Key rename: the custodial-parent oval is keyed custodial_parent (was
#     1_custodial_parent); it is now its own battery row, not part of line 1.
#
# FACE DELTAS vs the re-issued 2023 return (a diff of the printed text): the
# years (header "2025"; 2c "Age 65 or over before 2026"; 14a "rent paid in
# 2025"; 39 "2024 overpayment applied to your 2025 estimated tax (from 2024
# Form 1, line 52 or Form 1-NR/PY, line 56.)"; 40 "2025 Massachusetts
# estimated tax payments"; 53 "APPLIED to your 2026 ESTIMATED TAX"); line b
# "(from U.S. Form 1040, line 11a)" (was line 11); line 1 "Fill in only one
# filing status (See instructions)" with the two new ovals and without the old
# "(both must sign return)" / "(enter spouse's name ...)" captions; line 2a
# reflowed onto one row "Single/Married filing separately ($4,400), Head of
# household ($6,800), Married filing jointly ($8,800)"; the deceased row now
# "Fill in oval(s) if taxpayer(s) is deceased. Taxpayer (date of death) ...
# Spouse (date of death)"; the digital-asset question shortened to "Reporting
# digital assets (see instructions)"; line 5 one box; line 38 "Massachusetts
# income tax withheld from: a. Form(s) W-2 / b. Form(s) 1099. Enclose Schedule
# 62-WH / c. Other forms. Enclose Schedule 62-WH"; page 4 lines 50-55 as in
# TOPOLOGY ("51 TOTAL. Add lines 38 through 42 and lines 48 through 50", "52
# ... go to line 55 ... enter 0 in line 54", "54 THIS IS YOUR REFUND.
# Subtract line 53 from line 52", "55 TAX DUE. Subtract line 51 from line
# 37"); the page-1 enclosure list adds "62-WH"; "M.I." captions now "MI". The
# text layer drops the "fi" ligature ("fle", "fling"); quotes here use the
# visible spelling.
# Printed figures re-read on this face: line 2a $4,400 / $6,800 / $8,800, 2b
# x $1,000, 2d x $2,200, 11a/11b "Not more than $2,000", line 22 "If line 21
# is more than $24,000, multiply by .05" and the optional 5.85% oval, 23a x
# .085, 23b x .12, 28b "4% Surtax", the joint-filing-exemption oval's
# "$8,000". knowledge/states/ma/2025.yaml records every one of these except
# the 11a/11b "Not more than $2,000" cap, which it does not carry (reported
# for the knowledge layer). Lines 43 and
# 46 print blank multipliers ("43b x ____ = 43", "x ______(See
# instructions)"), no figure.
# Line 2c is the exception, as on the 2023 blanks. Its text layer reads "x
# $1,700 = 2c", but the "1," is a separate text object in render mode 3
# (invisible) filled WHITE at x 428.1-432.8 pt, so the visible face reads "x $
# 700 = 2c" (a scan of the file for white or invisible text finds no other
# object carrying a character; the rest are empty or a lone space), and the
# field's own name says "multiplied by $700". The 2c_total comment below keeps "x $700", the figure a filer sees.
#
# knowledge/states/ma/2025.yaml carried $1,700 for line 2c (the text-layer
# reading) until 2026-10-02; it now records the visible $700.
# ===========================================================================
# Form 1, 2025 — Massachusetts Resident Income Tax Return (4 pages).
#
# Provenance. source_url is the exact official mass.gov document URL, behind
# Akamai (403 to plain fetchers); `mirror_urls` is the exact Wayback id_
# capture of that SAME URL whose bytes hash to pdf_sha256. `taxfill
# seed-blank <saved.pdf> --pack <this file>` is the by-hand route.
#
# Layout. Flat AcroForm (acroform_root empty) with caption-named fields (see
# TOPOLOGY above). The header identity strip (first name / MI / last name /
# SSN) repeats on every page but is ONE field per name with 4 widgets —
# mapped once; filling it populates all four pages. The page-2 to page-4
# strips are narrower than page 1's (the MI box sits at x 179.5 instead of
# 185.8) but belong to the same fields.
#
# Coverage. 163 terminal fillable fields in the blank; all 163 mapped, as 167
# logical lines ("filing status" is ONE /Btn radio field carrying 4 option
# lines; "direct deposit" is one field carrying 2).
#
# Money vs text. Every dollar box prints a ".00"/"0 0" cents suffix ->
# money (whole dollars). Counts (2b/2c/2d totals, 43a, 46a), the campaign-fund
# total, the EIC multiplier blank, dates, ids and phone/email stay text.
# maxlen tightened where DOR's is wrong for the drawn box: 43a (widget
# /MaxLen 10, the box is 12.5 pt — clamped 2) and the 43c multiplier (no
# /MaxLen, an 18 pt blank — 3).
#
# Relations. Only unconditional printed-face math is declared. OMITTED per
# the conservative house style: 17 = 10 - 16, 19 = 17 - 18 and 32 = 28 -
# (29..31) (all floored "not less than 0"); 10 = add 3..9 (lines 6a/6b/7/10
# hold unsigned amounts whose sign comes from the loss X-boxes); 14 = 14a / 2
# (capped by instructions); 2b/2c/2d ("Total x $1,000 = 2b", "x $700 = 2c",
# "x $2,200 = 2d" — the multiplicand is a count box typed text, and relation
# math runs over money lines; 2c's figure also differs between the visible
# print and the text layer, see the banner); 22/23a/23b/24 (tax table / rate
# products); 43 and
# 46 (multiplier comes from the instructions, not the face); 52 and 55
# (refund-vs-tax-due branches).
form: MA Form 1
jurisdiction: states/ma
tax_year: 2025
source_url: https://www.mass.gov/doc/2025-form-1-massachusetts-resident-income-tax-return/download
mirror_urls:
  - https://web.archive.org/web/20260911192930id_/https://www.mass.gov/doc/2025-form-1-massachusetts-resident-income-tax-return/download
pdf_sha256: 0bb62498fda14b515084b83fb4467f379f17d08a712f6390b1cd2fceecb04a07
acroform_root: ''
fields:
  # ================================================= header (page 1; shared fields repeat on pages 2-4)
  - line: tp_first_name
    field: "taxpayer's first name"
    type: text
  - line: tp_mi
    field: "taxpayer's middle initial"
    type: text
    maxlen: 1
  - line: tp_last_name
    field: "taxpayer's last name"
    type: text
  - line: tp_ssn
    field: "taxpayer's social security number"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: spouse_first_name
    field: "Spouse's first name"
    type: text
  - line: spouse_mi
    field: "Spouse's middle initial"
    type: text
    maxlen: 1
  - line: spouse_last_name
    field: "spouse's last name"
    type: text
  - line: spouse_ssn
    field: "spouse's social security number"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: mailing_address.street
    field: "Mailing address (no. & street; apt./suite/postal box). If you have a foreign address, also complete line below"
    type: text
  - line: mailing_address.city
    field: "city or town"
    type: text
  - line: mailing_address.state
    field: "state"
    type: text
    maxlen: 2
  - line: mailing_address.zip
    field: "zip"
    type: text
    maxlen: 7
  - line: foreign_province_state_county
    field: "Foreign province, state, or county"
    type: text
  - line: foreign_country
    field: "Foreign contry (or country code)"
    type: text
  - line: foreign_postal_code
    field: "Foreign postal code"
    type: text
    maxlen: 7

  # ---- "Fill in if (see instructions):" battery (page 1). Every oval is its own named /Btn
  # ---- field (on_state /Yes, re-dumped from this blank), so each fills alone.
  - line: amended_return                   # "Amended return"
    field: "Amended return"
    type: checkbox
    on_state: /Yes
  - line: other_jurisdiction_change        # "Other jurisdiction change (enter date of change)"
    field: "Other jurisdiction change"
    type: checkbox
    on_state: /Yes
  - line: other_jurisdiction_change_date   # printed M M D D Y Y Y Y cells (comb, /MaxLen 8)
    field: "date of other jurisdiction change"
    type: text
    maxlen: 8
    comb: true
  - line: federal_amendment                # "Federal amendment"
    field: "federal amendment"
    type: checkbox
    on_state: /Yes
  - line: amended_return_bba               # "Amended return due to IRS BBA Partnership Audit"
    field: "Amended return due to IRS BBA Partnership Audit"
    type: checkbox
    on_state: /Yes
  # State Election Campaign Fund ($1 Taxpayer / $1 Spouse ovals + "Total $" box)
  - line: campaign_fund_taxpayer
    field: "1$ Taxpayer"
    type: checkbox
    on_state: /Yes
  - line: campaign_fund_spouse
    field: "1$ Spouse"
    type: checkbox
    on_state: /Yes
  - line: campaign_fund_total              # Total $ (1 or 2)
    field: "state election campaign fund contributuion total"
    type: text
    maxlen: 1
  # "Fill in if veteran of U.S. armed services who served in Operation Enduring Freedom,
  # Iraqi Freedom, Noble Eagle or Sinai Peninsula" — Taxpayer / Spouse ovals
  - line: veteran_taxpayer
    field: "taxpayer"
    type: checkbox
    on_state: /Yes
  - line: veteran_spouse
    field: "spouse"
    type: checkbox
    on_state: /Yes
  # "Fill in oval(s) if taxpayer(s) is deceased. Taxpayer (date of death) ... Spouse (date of
  # death)" — an oval and a printed M M D D Y Y Y Y date comb (/MaxLen 8) for each person
  - line: deceased_taxpayer
    field: "taxpayer deceased"
    type: checkbox
    on_state: /Yes
  - line: deceased_taxpayer_date           # taxpayer's date of death, MMDDYYYY in the comb cells
    field: "deceased taxpayer date of death"
    type: text
    maxlen: 8
    comb: true
  - line: deceased_spouse
    field: "spouse deceased"
    type: checkbox
    on_state: /Yes
  - line: deceased_spouse_date             # spouse's date of death, MMDDYYYY in the comb cells
    field: "deceased spouse date of death"
    type: text
    maxlen: 8
    comb: true
  # "Fill in if under age 18" — Taxpayer / Spouse ovals
  - line: under_18_taxpayer
    field: "taxpayer under age 18"
    type: checkbox
    on_state: /Yes
  - line: under_18_spouse
    field: "spouse under age 18"
    type: checkbox
    on_state: /Yes
  # "Fill in if name has changed" — Taxpayer / Spouse ovals
  - line: name_changed_taxpayer
    field: "taxpayer name change"
    type: checkbox
    on_state: /Yes
  - line: name_changed_spouse
    field: "spouse name change"
    type: checkbox
    on_state: /Yes
  - line: noncustodial_parent              # "Fill in if noncustodial parent"
    field: "noncustodial parent"
    type: checkbox
    on_state: /Yes
  # "Fill in if you are a custodial parent who has released claim to exemption for child(ren)"
  # — its own battery row on this face (it sat in the line 1 block on the 2023 return)
  - line: custodial_parent
    field: "custodial parent has released claim to exemption for children"
    type: checkbox
    on_state: /Yes
  # "Fill in if the following applies: Filing Schedule TDS / Filing Schedule FCI / Reporting
  # digital assets (see instructions)" — three independent ovals on one row
  - line: schedule_tds
    field: "filing Schedule TDS"
    type: checkbox
    on_state: /Yes
  - line: schedule_fci
    field: "filing Schedule FCI"
    type: checkbox
    on_state: /Yes
  - line: digital_assets                   # "Reporting digital assets (see instructions)"
    field: "reporting digital assets (see instructions)"
    type: checkbox
    on_state: /Yes

  # ---- pre-line-1 federal reference boxes
  - line: a_loss                           # "IF A LOSS, MARK AN X IN BOX" for line a
    field: "fill in box if line a is a loss"
    type: checkbox
    on_state: /On
  - line: a                                # Total federal income (U.S. Form 1040, line 9)
    field: "a Total federal income from U.S. Form 1040, line 9"
    type: money
    maxlen: 8
  - line: b_loss                           # "IF A LOSS, MARK AN X IN BOX" for line b
    field: "fill in box if line b is a loss"
    type: checkbox
    on_state: /On
  - line: b                                # Total federal adjusted gross income (U.S. Form 1040, line 11a)
    field: "b Total federal income from U.S. Form 1040, line 11a"
    type: money
    maxlen: 8

  # ---- 1 FILING STATUS (ONE /Btn radio field; "Fill in only one filing status (See instructions)")
  - line: 1_filing_status::single
    field: "line 1 filing status"
    type: checkbox
    on_state: /Single
    group: 1_filing_status
    required: true
  - line: 1_filing_status::mfj
    field: "line 1 filing status"
    type: checkbox
    on_state: /Married filing jointly
    group: 1_filing_status
  - line: 1_filing_status::mfs
    field: "line 1 filing status"
    type: checkbox
    on_state: /Married filing separately
    group: 1_filing_status
  - line: 1_filing_status::hoh
    field: "line 1 filing status"
    type: checkbox
    on_state: /Head of household
    group: 1_filing_status
  - line: 1_not_same_federal_filing_status # "Fill in if not using same filing status on the federal return"
    field: "Fill in if not using same filing status on the federal return"
    type: checkbox
    on_state: /Yes
  - line: 1_joint_filing_exemption         # "Fill in if joint filing exemption for spouses with Massachusetts gross income under $8,000"
    field: "Fill in if joint filing exemption for spouses with Massachusetts gross income under $8,000"
    type: checkbox
    on_state: /Yes
  - line: 1_nra                            # "NRA", printed beside Married filing separately
    field: "nonresident alien"
    type: checkbox
    on_state: /Yes

  # ---- 2 EXEMPTIONS
  - line: 2a                               # personal exemptions ($4,400 / $6,800 / $8,800)
    field: "line 2a Personal exemptions. Single/Married filing separately ($4,400), Head of household ($6,800), Married filing jointly ($8,800)"
    type: money
    maxlen: 4
  - line: 2b_total_dependents              # "Total" count box, x $1,000 = 2b
    field: "line 2b. Number of dependents (do not include yourself or your spouse). Enclose Schedule DI"
    type: text
    maxlen: 2
  - line: "2b"
    field: "line 2b Total. Number of dependents multiplied by $1000"
    type: money
    maxlen: 5
  - line: 2c_you                           # Age 65 or over before 2026 — You
    field: "line 2c taxpayer age 65 or over before 2026"
    type: checkbox
    on_state: /Yes
  - line: 2c_spouse                        # Age 65 or over before 2026 — Spouse
    field: "line 2c taxpayer's spouse age 65 or over before 2026"
    type: checkbox
    on_state: /Yes
  - line: 2c_total                         # "Total" count box, x $700 = 2c (visible print; see banner)
    field: "total number of over age 65 or over before 2026"
    type: text
    maxlen: 1
  - line: 2c
    field: "line 2c Total. Number of age 65 or over before 2026 multiplied by $700"
    type: money
    maxlen: 4
  - line: 2d_you                           # Blindness — You
    field: "line 2d taxpayer blindness exemption"
    type: checkbox
    on_state: /Yes
  - line: 2d_spouse                        # Blindness — Spouse
    field: "line 2d taxpayer's spouse blindness exemption"
    type: checkbox
    on_state: /Yes
  - line: 2d_total                         # "Total" count box, x $2,200 = 2d
    field: "total number taking blindness exemption"
    type: text
    maxlen: 1
  - line: 2d
    field: "line 2d Total. Number of blindness exemption multiplied by $2,200"
    type: money
    maxlen: 4
  - line: 2e                               # Medical/dental (U.S. Schedule A, line 4)
    field: "line 2e Medical or dental exemption amount from U.S. Schedule A, line 4"
    type: money
    maxlen: 6
  - line: 2f                               # Adoption
    field: "line 2f Adoption exemption. see instructions"
    type: money
    maxlen: 6
  - line: 2g                               # TOTAL EXEMPTIONS. Add lines 2a through 2f
    field: "line 2g. Total exemptions. Add lines 2a through 2f. Enter here and on line 18"
    type: money
    maxlen: 6

  # ---- SIGN HERE strip (page 1). The signature boxes are printed only (no widget): sign by hand.
  # The date boxes (53.6 pt, Helv 12, no /MaxLen) print their own "/ /" (taxpayer x 258.0-261.6 and
  # 274.6-278.2; spouse x 529.0-532.6 and 545.6-549.2): an MM/DD/YY value (8 chars) lines up with them on
  # the render, while 8 bare MMDDYYYY digits at 12 pt would print over the slashes.
  - line: tp_signature_date                # MM/DD/YY, 8 chars max
    field: "date of signature"
    type: text
    maxlen: 8
  - line: spouse_signature_date            # MM/DD/YY, 8 chars max
    field: "date of spouse's signature"
    type: text
    maxlen: 8
  - line: tp_email
    field: "taxpayer email address"
    type: text
  - line: tp_phone
    field: "taxpayer phone number"
    type: text
    maxlen: 10

  # ===================================================== page 2 — INCOME
  - line: "3"                              # wages, salaries, tips (Forms W-2)
    field: "line 3. Wages, salaries, tips and other employee compensation (from all Forms W-2)"
    type: money
    maxlen: 8
  - line: "4"                              # taxable pensions and annuities
    field: "line 4. Taxable pensions and annuities. Attach any Form(s) 1099-R with Massachusetts withholding. See instructions"
    type: money
    maxlen: 8
  - line: "5"                              # "5 Massachusetts bank interest" (one box; no 5a/5b on this face)
    field: "line 5. Massachusetts bank interest"
    type: money
    maxlen: 8
  - line: 6a_loss                          # IF A LOSS X box for 6a
    field: "fill in box if line 6a is a loss"
    type: checkbox
    on_state: /On
  - line: 6a                               # business/profession income or loss (Schedule C)
    field: "line 6a. Business/profession income or loss. Enclose Schedule C"
    type: money
    maxlen: 8
  - line: 6b_loss
    field: "fill in box if line 6b is a loss"
    type: checkbox
    on_state: /On
  - line: 6b                               # farming income or loss (U.S. Schedule F)
    field: "line 6b. Farming income or loss. Enclose U.S. Schedule F"
    type: money
    maxlen: 8
  - line: 7_loss
    field: "fill in box if line 7 is a loss"
    type: checkbox
    on_state: /On
  - line: "7"                              # rental/royalty/REMIC/partnership/S corp/trust
    field: "line 7. If you are reporting rental, royalty, REMIC, partnership, S corporation, or trust income or loss, see instructions"
    type: money
    maxlen: 8
  - line: 8a                               # unemployment compensation
    field: "line 8a. Unemployment compensation. See instructions"
    type: money
    maxlen: 8
  - line: 8b                               # Massachusetts state lottery winnings
    field: "line 8b. Massachusetts state lottery winnings"
    type: money
    maxlen: 8
  - line: "9"                              # other income from Schedule X, line 7
    field: "line 9. Other income from Schedule X, line 7. Enclose Schedule X; not less than 0"
    type: money
    maxlen: 8
  - line: 10_loss                          # DOR's /On appearance draws a filled square (ZapfDingbats n), not the X of 6a/6b/7
    field: "fill in box if line 10 is a loss"
    type: checkbox
    on_state: /On
  - line: "10"                             # TOTAL 5.0% INCOME (add 3-9, losses subtracted)
    field: "line 10. Total 5.0% income. Add lines 3 through 9. Be sure to subtract any losses in lines 6 or 7"
    type: money
    maxlen: 8

  # ---- DEDUCTIONS (lines 12/13 are "Reserved for future use": printed static zeros, no widget)
  - line: 11a                              # amount you paid to SS/Medicare/RR/US/MA retirement (max $2,000)
    field: "line 11a. Amount you paid to Social Security, Medicare, Railroad, U.S. or Massachusetts retirement. Not more than $2,000"
    type: money
    maxlen: 4
  - line: 11b                              # amount spouse paid (max $2,000)
    field: "line 11b. Amount spouse paid to Social Security, Medicare, Railroad, U.S. or Massachusetts retirement. Not more than $2,000"
    type: money
    maxlen: 4
  - line: 14a                              # total qualified rent paid in 2025
    field: "line 14a. Enter the total qualified rent paid in 2025 in the box"
    type: money
    maxlen: 5
  - line: "14"                             # rental deduction (14a / 2, capped per instructions)
    field: "line 14 rental deduction. line 14a divided by 2"
    type: money
    maxlen: 4
  - line: "15"                             # other deductions from Schedule Y, line 19
    field: "line 15. Other deductions from Schedule Y, line 19. Enclose Schedule Y"
    type: money
    maxlen: 8
