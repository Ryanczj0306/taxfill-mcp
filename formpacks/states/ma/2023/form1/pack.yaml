# ===========================================================================
# RE-MAP onto DOR's 2026-05-22 RE-ISSUE of the 2023 Form 1 (re-mapped
# 2026-10-02, Phase J JS5). The pack keeps its tax year and every line key
# whose printed box has a widget; it drops the three signature keys and adds
# eleven (see TOPOLOGY).
#
# URL. source_url below, fetched with a desktop-browser request (mass.gov sits
# behind Akamai and answers 403 to a plain fetcher) in two separate runs on
# 2026-10-02: both 200 application/pdf, 184,504 bytes, Last-Modified Tue, 26
# May 2026 16:57:11 GMT, sha256 5cbb5655…3573492 — the same digest as the
# discovery copy. The exact Wayback capture 20260920033523 (`mirror_urls`)
# answers 200 with the same bytes, so fetch_blank's 403 fallback lands on the
# pin and caches it only if the digest matches (a mismatch fails closed).
#
# PRINTED IDENTITY. Page 1 prints "Massachusetts Department of Revenue",
# "2023" and "Form 1 Massachusetts Resident Income Tax Return"; pages 2-4
# print "2023 FORM 1, PAGE 2/3/4". No revision stamp is printed. /Title
# "Massachusetts Department of Revenue 2023 Form 1 Massachusetts Resident
# Income Tax Return", /CreationDate 2023-11-16, /ModDate 2026-05-22.
#
# HISTORY. Until this re-map the pack pinned DOR's 2024-01-17 revision
# (/ModDate), sha256 86233c2d…802c4, reachable only through its Wayback
# capture https://web.archive.org/web/20241214140401id_/<source_url>. That
# revision is a valid 2023 Form 1 too (the same printed face, line 39's
# cross-reference aside). The other captures of this URL: 20240114213231
# (d5bc73d6…, 2024-01-12, the same 179 widgets = 163 terminal fields, an
# earlier cut of the page-2 text layer) and 20250901090115 (613a1a0d…,
# re-issued 2025-04-14, the same 179 = 163, line 39's cross-reference
# corrected).
#
# TOPOLOGY against the 2024-01-17 blank (a widget census by position and
# printed label, every row then confirmed on a sentinel render). 176 widgets
# = 160 terminal fields (was 179 = 163). Every field name changed: the
# re-issue names each field after its caption ("line 3. Wages, salaries, tips
# and other employee compensation (from all Forms W-2)"). Acrobat reads a "."
# in a field name as a hierarchy, so those 160 terminal fields hang under 159
# top-level /Fields entries as dotted /T chains and pypdf's get_fields lists
# 360 names (every dotted prefix is a node); `field:` below is always the
# full terminal name. The names are NOT evidence of meaning: several carry
# another year's words ("line 2c taxpayer age 65 or over before 2025", "line
# 14a. Enter the total qualified rent paid in 2024 in the box") while the
# face prints "before 2024" and "rent paid in 2023". Position and the printed
# label decided every row.
#   * 144 base fields have a re-issue widget of the same type within 2 pt of
#     their old centre, under the same printed label — re-bound one for one.
#   * The taxpayer phone box moved 24 pt right and now sits under its
#     "TAXPAYER'S PHONE" caption. The paid-preparer strip was re-laid: name
#     (now 220 pt wide), SSN or PTIN, date and EIN boxes each moved to sit
#     under their printed captions; the phone box stayed.
#   * GONE: the three signature fields (Signature, Spsignature, signature).
#     YOUR SIGNATURE, SPOUSE'S SIGNATURE and PAID PREPARER'S SIGNATURE are
#     printed boxes only, signed by hand; their lines are dropped.
#   * NEW, all mapped: the old pack's eleven UNMAPPABLE page-1 ovals (nested
#     '0'/'1' kids under "Checkcash"/"Checktp1" that ticked together) are now
#     eleven standalone /Btn fields, each with its own name and a /Yes
#     appearance, so each fills alone: amended_return, federal_amendment,
#     other_jurisdiction_change, amended_return_bba, veteran_taxpayer /
#     _spouse, deceased_taxpayer / _spouse, under_18_taxpayer / _spouse and
#     noncustodial_parent. Nothing on this blank needs hand-ticking.
#   * Flags. No widget is ReadOnly. Lines 5a and 5b lost their comb and
#     /MaxLen (now plain Helv 10 text boxes); the pack keeps its maxlen 8 and
#     3 (the boxes are 99.5 and 40.1 pt wide). The 43c multiplier box has no
#     /MaxLen and no /DA of its own (the AcroForm default applies); maxlen 3
#     stays. Lines 2b, 2c and 2d now carry /DA Helv 12. Filing status is still
#     ONE radio field, but two of its states were renamed: /Married filing
#     jointly and /Married filing separately (were "... joint return" /
#     "... separate return"); every on_state below is re-dumped from this
#     blank. The other-jurisdiction date (printed M M D D Y Y Y Y) and both
#     SSNs are comb widgets (/MaxLen 8 and 9) and now say so (comb: true; the
#     SSNs also format: ssn_digits_only).
#
# FACE DELTAS vs the 2024-01-17 revision (a diff of the printed text): line
# 39 now reads "from 2022 Form 1, line 52 or Form 1-NR/PY, line 56" (was "line
# 51 ... line 55"); everything else is leader-dot spacing and soft hyphens.
# The words moved by a median 0.0 pt (page 3: 0.63 pt left); 98-99% sit within
# 2 pt. Printed figures re-read on this face: line 2a $4,400 / $6,800 /
# $8,800, 2b x $1,000, 2d x $2,200, 5b $200 / $100, 11a/11b "Not more than
# $2,000", line 22 "If line 21 is more than $24,000, multiply by .05" and the
# optional 5.85% oval, 23a x .085, 23b x .12, 28b "4% Surtax" — all as
# knowledge/states/ma/2023.yaml records them.
# Line 2c is the exception. Its text layer reads "x $1,700 = 2c", but the
# "1," is a separate text object filled WHITE (RGB 255,255,255) at x
# 429.1-433.8 pt, so the printed, visible face reads "x $ 700 = 2c" — on this
# re-issue and on the 2024-01-17 revision alike (a scan of both files for
# white or invisible text finds that one object and nothing else), and the
# re-issue's own field name says "multiplied by $700". The 2c_total comment
# below keeps "x $700", the figure a filer sees.
#
# Unresolved: knowledge/states/ma/2023.yaml carries $1,700 for line 2c (the
# text-layer reading); the visible face says $700. Reported for the
# knowledge layer, not changed here.
# ===========================================================================
# Form 1, 2023 — Massachusetts Resident Income Tax Return (4 pages).
#
# Provenance. source_url is the exact official mass.gov document URL, behind
# Akamai (403 to plain fetchers); `mirror_urls` is the exact Wayback id_
# capture of that SAME URL whose bytes hash to pdf_sha256. `taxfill
# seed-blank <saved.pdf> --pack <this file>` is the by-hand route.
#
# Layout. Flat AcroForm (acroform_root empty) with caption-named fields (see
# TOPOLOGY above). The header identity strip (first name / M.I. / last name /
# SSN) repeats on every page but is ONE field per name with 4 widgets —
# mapped once; filling it populates all four pages. The page-2 to page-4
# strips are narrower than page 1's (the M.I. box sits at x 179.5 instead of
# 185.8) but belong to the same fields.
#
# Coverage. 160 terminal fillable fields in the blank; all 160 mapped, as 164
# logical lines ("filing status" is ONE /Btn radio field carrying 4 option
# lines; "direct deposit" is one field carrying 2).
#
# Money vs text. Every dollar box prints a ".00"/"0 0" cents suffix ->
# money (whole dollars). Counts (2b/2c/2d totals, 43a, 46a), the campaign-fund
# total, the EIC multiplier blank, dates, ids and phone/email stay text.
# maxlen tightened where DOR's is wrong for the drawn box: 43a (widget
# /MaxLen 10, the box is 12.5 pt — clamped 2) and the 43c multiplier (no
# /MaxLen, an 18 pt blank — 3).
#
# Relations. Only unconditional printed-face math is declared. OMITTED per
# the conservative house style: 5 = 5a - 5b, 17 = 10 - 16, 19 = 17 - 18 and
# 32 = 28 - (29..31) (all floored "not less than 0"); 10 = add 3..9 (lines
# 6a/6b/7/10 hold unsigned amounts whose sign comes from the loss X-boxes);
# 14 = 14a / 2 (capped by instructions); 22/23a/23b/24 (tax table / rate
# products); 43 and 46 (multiplier comes from the instructions, not the
# face); 51 and 54 (refund-vs-tax-due branches).
form: MA Form 1
jurisdiction: states/ma
tax_year: 2023
source_url: https://www.mass.gov/doc/2023-form-1-massachusetts-resident-income-tax-return/download
mirror_urls:
  - https://web.archive.org/web/20260920033523id_/https://www.mass.gov/doc/2023-form-1-massachusetts-resident-income-tax-return/download
pdf_sha256: 5cbb565548962c69ab4fdfb9ee8f13fde7708090dc27fdf87c6d36bd3b573492
acroform_root: ''
fields:
  # ================================================= header (page 1; shared fields repeat on pages 2-4)
  - line: tp_first_name
    field: "taxpayer's first name"
    type: text
  - line: tp_mi
    field: "taxpayer's middle initial"
    type: text
    maxlen: 1
  - line: tp_last_name
    field: "taxpayer's last name"
    type: text
  - line: tp_ssn
    field: "taxpayer's social security number"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: spouse_first_name
    field: "Spouse's first name"
    type: text
  - line: spouse_mi
    field: "Spouse's middle initial"
    type: text
    maxlen: 1
  - line: spouse_last_name
    field: "spouse's last name"
    type: text
  - line: spouse_ssn
    field: "spouse's social security number"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: mailing_address.street
    field: "Mailing address (no. & street; apt./suite/postal box). If you have a foreign address, also complete line below"
    type: text
  - line: mailing_address.city
    field: "city or town"
    type: text
  - line: mailing_address.state
    field: "state"
    type: text
    maxlen: 2
  - line: mailing_address.zip
    field: "zip code"
    type: text
    maxlen: 7
  - line: foreign_province_state_county
    field: "Foreign province, state, or county"
    type: text
  - line: foreign_country
    field: "Foreign contry (or country code)"
    type: text
  - line: foreign_postal_code
    field: "Foreign postal code"
    type: text
    maxlen: 7

  # ---- "Fill in if (see instructions)" battery (page 1). In the 2026-05-22 re-issue every
  # ---- oval is its own named /Btn field (on_state /Yes), so all of them are mapped; on the
  # ---- 2024-01-17 revision eleven of them were unfillable shared '0'/'1' kids.
  - line: amended_return                   # "Amended return"
    field: "Amended return"
    type: checkbox
    on_state: /Yes
  - line: other_jurisdiction_change        # "Other jurisdiction change (enter date of change)"
    field: "Other jurisdiction change"
    type: checkbox
    on_state: /Yes
  - line: other_jurisdiction_change_date   # printed M M D D Y Y Y Y cells (comb, /MaxLen 8)
    field: "date of other jurisdiction change"
    type: text
    maxlen: 8
    comb: true
  - line: federal_amendment                # "Federal amendment"
    field: "federal amendment"
    type: checkbox
    on_state: /Yes
  - line: amended_return_bba               # "Amended return due to IRS BBA Partnership Audit"
    field: "Amended return due to IRS BBA Partnership Audit"
    type: checkbox
    on_state: /Yes
  # State Election Campaign Fund ($1 Taxpayer / $1 Spouse ovals + "Total $" box)
  - line: campaign_fund_taxpayer
    field: "1$ Taxpayer"
    type: checkbox
    on_state: /Yes
  - line: campaign_fund_spouse
    field: "1$ Spouse"
    type: checkbox
    on_state: /Yes
  - line: campaign_fund_total              # Total $ (1 or 2)
    field: "state election campaign fund contributuion total"
    type: text
    maxlen: 1
  # "Fill in if veteran of U.S. armed services who served in Operation Enduring Freedom,
  # Iraqi Freedom, Noble Eagle or Sinai Peninsula" — Taxpayer / Spouse ovals
  - line: veteran_taxpayer
    field: "taxpayer"
    type: checkbox
    on_state: /Yes
  - line: veteran_spouse
    field: "spouse"
    type: checkbox
    on_state: /Yes
  # "Fill in appropriate oval(s) if taxpayer(s) is deceased" — Taxpayer / Spouse ovals
  - line: deceased_taxpayer
    field: "taxpayer deceased"
    type: checkbox
    on_state: /Yes
  - line: deceased_spouse
    field: "spouse deceased"
    type: checkbox
    on_state: /Yes
  # "Fill in if under age 18" — Taxpayer / Spouse ovals
  - line: under_18_taxpayer
    field: "taxpayer under age 18"
    type: checkbox
    on_state: /Yes
  - line: under_18_spouse
    field: "spouse under age 18"
    type: checkbox
    on_state: /Yes
  # "Fill in if name has changed" — Taxpayer / Spouse ovals
  - line: name_changed_taxpayer
    field: "taxpayer name change"
    type: checkbox
    on_state: /Yes
  - line: name_changed_spouse
    field: "spouse name change"
    type: checkbox
    on_state: /Yes
  - line: noncustodial_parent              # "Fill in if noncustodial parent"
    field: "noncustodial parent"
    type: checkbox
    on_state: /Yes
  # "Fill in if filing the following schedule(s)"
  - line: schedule_tds
    field: "filing Schedule TDS"
    type: checkbox
    on_state: /Yes
  - line: schedule_fci
    field: "filing Schedule FCI"
    type: checkbox
    on_state: /Yes
  # "Fill in if at any time during 2023 you received ... or otherwise disposed of a digital asset"
  - line: digital_assets
    field: "reporting digital assets (see instructions)"
    type: checkbox
    on_state: /Yes

  # ---- pre-line-1 federal reference boxes
  - line: a_loss                           # "IF A LOSS, MARK AN X IN BOX" for line a
    field: "fill in box if line a is a loss"
    type: checkbox
    on_state: /On
  - line: a                                # Total federal income (U.S. Form 1040, line 9)
    field: "a Total federal income from U.S. Form 1040, line 9"
    type: money
    maxlen: 8
  - line: b_loss                           # "IF A LOSS, MARK AN X IN BOX" for line b
    field: "fill in box if line b is a loss"
    type: checkbox
    on_state: /On
  - line: b                                # Total federal adjusted gross income (U.S. Form 1040, line 11)
    field: "b Total federal income from U.S. Form 1040, line 11"
    type: money
    maxlen: 8

  # ---- 1 FILING STATUS (ONE /Btn radio field; "Fill in one only")
  - line: 1_filing_status::single
    field: "line 1 filing status"
    type: checkbox
    on_state: /Single
    group: 1_filing_status
    required: true
  - line: 1_filing_status::mfj
    field: "line 1 filing status"
    type: checkbox
    on_state: /Married filing jointly
    group: 1_filing_status
  - line: 1_filing_status::mfs
    field: "line 1 filing status"
    type: checkbox
    on_state: /Married filing separately
    group: 1_filing_status
  - line: 1_filing_status::hoh
    field: "line 1 filing status"
    type: checkbox
    on_state: /Head of household
    group: 1_filing_status
  - line: 1_custodial_parent               # custodial parent who released claim to exemption for child(ren)
    field: "custodial parent has released claim to exemption for children"
    type: checkbox
    on_state: /Yes
  - line: 1_nra                            # NRA (see instructions)
    field: "nonresident alien"
    type: checkbox
    on_state: /Yes

  # ---- 2 EXEMPTIONS
  - line: 2a                               # personal exemptions ($4,400 / $6,800 / $8,800)
    field: "line 2a Personal exemptions. Single/Married filing separately ($4,400), Head of household ($6,800), Married filing jointly ($8,800)"
    type: money
    maxlen: 4
  - line: 2b_total_dependents              # "Total" count box, x $1,000 = 2b
    field: "line 2b. Number of dependents (do not include yourself or your spouse). Enclose Schedule DI"
    type: text
    maxlen: 2
  - line: "2b"
    field: "line 2b Total. Number of dependents multiplied by $1000"
    type: money
    maxlen: 5
  - line: 2c_you                           # Age 65 or over before 2024 — You
    field: "line 2c taxpayer age 65 or over before 2025"
    type: checkbox
    on_state: /Yes
  - line: 2c_spouse                        # Age 65 or over before 2024 — Spouse
    field: "line 2c taxpayer's spouse age 65 or over before 2025"
    type: checkbox
    on_state: /Yes
  - line: 2c_total                         # "Total" count box, x $700 = 2c (visible print; see banner)
    field: "total number of people over age 65 or over before 2025"
    type: text
    maxlen: 1
  - line: 2c
    field: "line 2c Total. Number of people age 65 or over before 2025 multiplied by $700"
    type: money
    maxlen: 4
  - line: 2d_you                           # Blindness — You
    field: "line 2d taxpayer blindness exemption"
    type: checkbox
    on_state: /Yes
  - line: 2d_spouse                        # Blindness — Spouse
    field: "line 2d taxpayer's spouse blindness exemption"
    type: checkbox
    on_state: /Yes
  - line: 2d_total                         # "Total" count box, x $2,200 = 2d
    field: "total number taking blindness exemption"
    type: text
    maxlen: 1
  - line: 2d
    field: "line 2d Total. Number of blindness exemption multiplied by $2,200"
    type: money
    maxlen: 4
  - line: 2e                               # Medical/dental (U.S. Schedule A, line 4)
    field: "line 2e Medical or dental exemption amount from U.S. Schedule A, line 4"
    type: money
    maxlen: 6
  - line: 2f                               # Adoption
    field: "line 2f Adoption exemption. see instructions"
    type: money
    maxlen: 6
  - line: 2g                               # TOTAL EXEMPTIONS. Add lines 2a through 2f
    field: "line 2g. Total exemptions. Add lines 2a through 2f. Enter here and on line 18"
    type: money
    maxlen: 6

  # ---- SIGN HERE strip (page 1). The signature boxes are printed only (no widget): sign by hand.
  - line: tp_signature_date                # 53.6 pt box, Helv 12, printed / / — 8 chars max (MMDDYYYY)
    field: "date of signature"
    type: text
    maxlen: 8
  - line: spouse_signature_date            # 53.6 pt box, Helv 12, printed / / — 8 chars max (MMDDYYYY)
    field: "date of spouse's signature"
    type: text
    maxlen: 8
  - line: tp_email
    field: "taxpayer email address"
    type: text
  - line: tp_phone
    field: "taxpayer phone number"
    type: text
    maxlen: 10

  # ===================================================== page 2 — INCOME
  - line: "3"                              # wages, salaries, tips (Forms W-2)
    field: "line 3. Wages, salaries, tips and other employee compensation (from all Forms W-2)"
    type: money
    maxlen: 8
  - line: "4"                              # taxable pensions and annuities
    field: "line 4. Taxable pensions and annuities. Attach any Form(s) 1099-R with Massachusetts withholding. See instructions"
    type: money
    maxlen: 8
  # 5a and 5b: plain Helv 10 text boxes on the re-issue (no comb, no /MaxLen), so
  # the digits print as one right-aligned run and do not line up with the
  # printed digit cells; the value still sits inside the box.
  - line: 5a                               # Massachusetts bank interest (no widget /MaxLen since the re-issue)
    field: "line 5a. Massachusetts bank interest"
    type: money
    maxlen: 8
  - line: 5b                               # exemption amount ($200 MFJ / $100 otherwise; no widget /MaxLen)
    field: "line 5b. Exemption amount. If married filing jointly, enter $200; otherwise enter $100"
    type: money
    maxlen: 3
  - line: "5"                              # a - b (not less than 0)
    field: "line 5. Massachusetts bank interest"
    type: money
    maxlen: 8
  - line: 6a_loss                          # IF A LOSS X box for 6a
    field: "fill in box if line 6a is a loss"
    type: checkbox
    on_state: /On
  - line: 6a                               # business/profession income or loss (Schedule C)
    field: "line 6a. Business/profession income or loss. Enclose Schedule C"
    type: money
    maxlen: 8
  - line: 6b_loss
    field: "fill in box if line 6b is a loss"
    type: checkbox
    on_state: /On
  - line: 6b                               # farming income or loss (U.S. Schedule F)
    field: "line 6b. Farming income or loss. Enclose U.S. Schedule F"
    type: money
    maxlen: 8
  - line: 7_loss
    field: "fill in box if line 7 is a loss"
    type: checkbox
    on_state: /On
  - line: "7"                              # rental/royalty/REMIC/partnership/S corp/trust
    field: "line 7. If you are reporting rental, royalty, REMIC, partnership, S corporation, or trust income or loss, see instructions"
    type: money
    maxlen: 8
  - line: 8a                               # unemployment compensation
    field: "line 8a. Unemployment compensation. See instructions"
    type: money
    maxlen: 8
  - line: 8b                               # Massachusetts state lottery winnings
    field: "line 8b. Massachusetts state lottery winnings"
    type: money
    maxlen: 8
  - line: "9"                              # other income from Schedule X, line 7
    field: "line 9. Other income from Schedule X, line 7. Enclose Schedule X; not less than 0"
    type: money
    maxlen: 8
  - line: 10_loss                          # DOR's /On appearance draws a filled square (ZapfDingbats n), not the X of 6a/6b/7
    field: "fill in box if line 10 is a loss"
    type: checkbox
    on_state: /On
  - line: "10"                             # TOTAL 5.0% INCOME (add 3-9, losses subtracted)
    field: "line 10. Total 5.0% income. Add lines 3 through 9. Be sure to subtract any losses in lines 6 or 7"
    type: money
    maxlen: 8

  # ---- DEDUCTIONS (lines 12/13 are "Reserved for future use": printed static zeros, no widget)
  - line: 11a                              # amount you paid to SS/Medicare/RR/US/MA retirement (max $2,000)
    field: "line 11a. Amount you paid to Social Security, Medicare, Railroad, U.S. or Massachusetts retirement. Not more than $2,000"
    type: money
    maxlen: 4
  - line: 11b                              # amount spouse paid (max $2,000)
    field: "line 11b. Amount spouse paid to Social Security, Medicare, Railroad, U.S. or Massachusetts retirement. Not more than $2,000"
    type: money
    maxlen: 4
  - line: 14a                              # total qualified rent paid in 2023
    field: "line 14a. Enter the total qualified rent paid in 2024 in the box"
    type: money
    maxlen: 5
  - line: "14"                             # rental deduction (14a / 2, capped per instructions)
    field: "line 14 rental deduction. line 14a divided by 2"
    type: money
    maxlen: 4
  - line: "15"                             # other deductions from Schedule Y, line 19
    field: "line 15. Other deductions from Schedule Y, line 19. Enclose Schedule Y"
    type: money
    maxlen: 8
  - line: "16"                             # TOTAL DEDUCTIONS. Add lines 11 through 15
    field: "line 16. Total deductions. Add lines 11 through 15"
    type: money
    maxlen: 8
  - line: "17"                             # 5.0% income after deductions (10 - 16, not < 0)
    field: "line 17. 5.0% Income after deductions. Subtract line 16 from line 10. Not less than 0"
    type: money
    maxlen: 8
  - line: "18"                             # total exemption amount (from line 2g)
    field: "line 18. Total exemption amount (from line 2g)"
    type: money
    maxlen: 6
  - line: "19"                             # 5.0% income after exemptions (17 - 18, not < 0)
    field: "line 19. 5.0% Income After Exemptions. Subtract line 18 from line 17. Not less than 0. If line 17 is less than line 18, see instructions"
    type: money
    maxlen: 8
  - line: "20"                             # interest and dividend income (Schedule B, line 38)
    field: "line 20. Interest And Dividend Income (from Schedule B, line 38). Not less than 0. Enclose Schedule B"
    type: money
    maxlen: 8
  - line: "21"                             # TOTAL TAXABLE 5.0% INCOME. Add lines 19 and 20
    field: "line 21. Total Taxable 5.0% Income. Add lines 19 and 20"
    type: money
    maxlen: 8
  - line: 22_optional_rate                 # "If choosing the optional 5.85% tax rate, fill in oval"
    field: "line 22 oval. Note: If choosing the optional 5.85% tax rate, fill in oval and see instructions"
    type: checkbox
    on_state: /Yes
  - line: "22"                             # TAX ON 5.0% INCOME (tax table / x .05)
    field: "line 22. Tax On 5.0% Income (from tax table). If line 21 is more than $24,000, multiply by .05"
    type: money
    maxlen: 8
  - line: 23a_income                       # 8.5% income (Schedule B)
    field: "line 23a.  8.5% Income From Schedule B (see instructions). Not less than 0. Enclose Schedule B"
    type: money
    maxlen: 8
  - line: 23a                              # 23a_income x .085
    field: "line 23a multiplied by .085"
    type: money
    maxlen: 8
  - line: 23b_income                       # 12% income (Schedule B)
    field: "line 23b.  12% Income From Schedule B (see instructions). Not less than 0. Enclose Schedule B"
    type: money
    maxlen: 8
  - line: 23b                              # 23b_income x .12
    field: "line 23b multiplied by .12"
    type: money
    maxlen: 8
  - line: "23"                             # TOTAL TAX ON INCOME FROM SCHEDULE B. Add lines 23a and 23b
