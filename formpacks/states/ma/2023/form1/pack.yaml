relations:
  - "2g == sum(2a..2f)"                    # 2g "TOTAL EXEMPTIONS. Add lines 2a through 2f."
  - "16 == 11a + 11b + 14 + 15"            # 16 "TOTAL DEDUCTIONS. Add lines 11 through 15" (12/13 reserved)
  - "18 == 2g"                             # 18 "Total exemption amount (from line 2g)"
  - "21 == 19 + 20"                        # 21 "TOTAL TAXABLE 5.0% INCOME. Add lines 19 and 20."
  - "23 == 23a + 23b"                      # 23 "TOTAL TAX ON INCOME FROM SCHEDULE B. Add lines 23a and 23b."
  - "28a == 22 + 23 + 24 + 25 + 26"        # 28a "Income tax. Add lines 22 through 26."
  - "28 == 28a + 28b"                      # 28 "Total tax. Add lines 28a and 28b."
  - "33 == sum(33a..33f)"                  # 33 "Total. Add lines 33a through 33f."
  - "35 == 35a + 35b"                      # 35 "Total ... a + b = 35"
  - "37 == 32 + 33 + 34 + 35 + 36"         # 37 "Add lines 32 through 36."
  - "38 == sum(38a..38c)"                  # 38 "Total. Add lines 38a through 38c."
  - "48 == 43 + 44 + 46 + 47"              # 48 "TOTAL REFUNDABLE CREDITS. Add lines 43 through 47" (45 reserved)
  - "50 == 38 + 39 + 40 + 41 + 42 + 48 + 49"  # 50 "TOTAL. Add lines 38 through 42 and lines 48 and 49"
  - "53 == 51 - 52"                        # 53 "THIS IS YOUR REFUND. Subtract line 52 from line 51."
cross_form:
  - "a == f1040.9"                         # line a "Total federal income (from U.S. Form 1040, line 9)"
  - "b == f1040.11"                        # line b "Total federal adjusted gross income (from U.S. Form 1040, line 11)"
identity_fields:
  - tp_ssn
  - tp_first_name
  - tp_last_name
signature:
  page: 1                                  # SIGN HERE strip at the bottom of page 1
mailing: null                              # knowledge layer owns where-to-file (refund: PO Box 7000; payment: PO Box 7003, Boston MA)
