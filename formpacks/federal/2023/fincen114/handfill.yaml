    type: text
  # ---- Part III — one account owned JOINTLY (items 15-24, plus the principal joint owner 25-33) 
  - line: joint_15
    label: 'Joint account: Maximum value of the account during the calendar year (U.S. dollars)'
    type: money
    note: 'Round UP to the next whole dollar: $15,265.25 is recorded as $15,266. Value each
