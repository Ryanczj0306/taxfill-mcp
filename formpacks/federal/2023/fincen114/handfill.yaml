  - line: account3_20
    label: 'Account 3: Institution city'
    type: text
  - line: account3_21
    label: 'Account 3: Institution state, if known'
    type: text
  - line: account3_22
    label: 'Account 3: Institution foreign postal code, if known'
    type: text
  - line: account3_23
