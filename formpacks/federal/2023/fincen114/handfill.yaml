  # ---- THE THRESHOLD TEST — total this once every account maximum above is filled in 
  - line: aggregate_maximum_value
    label: Aggregate maximum value of ALL foreign financial accounts during the calendar year
      (sum of every account's own highest value, from every Part above)
    type: money
    compute: account1_15 + account2_15 + account3_15 + joint_15 + sigauth_15
    note: 'Computed from the item-15 maxima above. AN FBAR IS REQUIRED WHEN THIS EXCEEDS $10,000
      — more than, not at least (31 CFR 1010.306(c)). Three things about the test: it is an
      AGGREGATE across every foreign financial account, not per account; it is a MAXIMUM-value
      test at any time in the CALENDAR year, never a year-end balance; and your income tax filing
      status does not move it, so there is no doubling for a joint return. The aggregate spans
      accounts you have a FINANCIAL INTEREST in AND accounts you only have SIGNATURE OR OTHER
      AUTHORITY over — 31 CFR 1010.350(a) covers both, which is why joint_15 and sigauth_15
      are in this sum. If you have more than three separately-owned accounts, or more than one
      joint or signature-authority account, add their maxima in by hand: this compute reaches
      only the slots this worksheet carries. Run calc op foreign_asset_reporting for the cited
      verdict — it also answers the SEPARATE Form 8938 question, which this worksheet does not.'
