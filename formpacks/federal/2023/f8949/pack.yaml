    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"              # "Social security number or taxpayer identification number" — plain box, NOT a comb
    field: "Page1[0].f1_2[0]"
    type: text
    maxlen: 11                              # the widget's own /MaxLen (fits a dashed SSN/ITIN)
    format: ssn_digits_only                 # digits only keeps cross-form identity values consistent and can never overflow (P-001)

  # ---- Part I box set: "You must check Box A, B, or C below. Check only one
  # ---- box." THREE separate terminal /Btn fields, so the shared `group` is the
  # ---- only thing making them exclusive (P-008). Not `required`: a
  # ---- long-term-only filer files page 2 alone (see the header).
