# Form 8949 (2023 revision) — Sales and Other Dispositions of Capital Assets.
# TWO pages; ATTACHMENT-ONLY: the masthead prints "File with your Schedule D to
# list your transactions for lines 1b, 2, 3, 8b, 9, and 10 of Schedule D."
# Schedule D is the SUMMARY; this is the DETAIL form that carries every
# transaction, and until it shipped a filer with stock sales could not assemble
# a complete return from this repo at all — sched_d's 1b/2/3 and 8b/9/10 rows
# had nothing to be totals OF.
#
# NEW PACK, authored from scratch 2026-08-26 (no prior-year f8949 pack existed;
# nothing was ported and every binding was derived from this blank). House-style
# precedent followed throughout: the Phase I1/I2 packs
# formpacks/federal/2023/f8606/pack.yaml (4d51a07) and
# formpacks/federal/2023/f8889/pack.yaml (ad2d32f), plus this form's parent
# formpacks/federal/2023/sched_d/pack.yaml, whose banner sets the relation and
# P-007 discipline this pack matches.
#
