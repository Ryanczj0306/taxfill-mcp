# ---------------------------------------------------------------------------
# WHAT THE VISION AUDIT ACTUALLY CAUGHT
# ---------------------------------------------------------------------------
# (docs/CONTRIBUTING-PACKS.md step 6: "an audit that caught nothing is
# suspicious — say so explicitly if it truly caught nothing". It caught one
# real reading trap and corrected NO binding; both halves are stated.)
# On a repeating-row form the failure to hunt is an off-by-one row shift, so
# the audit fill was purpose-built for it: every money cell was written with
# the 4-digit sentinel <part><row2><colindex> (part 1 row 07 column (d) = 1074,
# part 2 row 14 column (h) = 2148) and every text cell with "P<part>R<row2><col>"
# ("P1R01a", "P2R14f"), so a shifted row is unmissable in the render rather
# than plausible. Both pages were then read at 200 dpi.
#   1. THE ONE REAL TRAP: the column-(a) sentinel of row N renders one text
#      line ABOVE the (b)-(h) sentinels of the same row, so a careless reader
#      sees "P1R01a" apparently sitting in its own row and concludes the
#      description column is shifted up by one. It is NOT. The cause is the
#      multiline widget's geometry: row N's (a) /Rect is the FULL 24pt band
#      while its (b)-(h) rects are the lower 12pt of that same band (row 1:
#      (a) y 420-444, (b)-(h) y 420-432). Measured rather than eyeballed — the
#      full-width printed rules of the page-1 table were detected off the
#      200-dpi render at PDF y = 444.2, 420.1, 396.2, ... 132.1, 108.2, i.e.
#      exactly the 14 widget bands, so (a) and (b)-(h) of any row lie between
#      the same pair of rules. First, middle and last row of BOTH parts were
#      checked one by one (rows 1, 7 and 14): row 1 shows P1R01a/b/c + 1014,
#      1015, P1R01f, 1017, 1018; row 7 shows 1074/1075/1077/1078; row 14 shows
#      1144/1145/1147/1148 in the last band above the Totals row; page 2 the
#      same with the 2xxx sentinels. No shift anywhere.
#   2. CONFIRMED WRITABLE, WHICH IS WHY IT IS UNMAPPED: the introspect sweep
#      printed "f1_117[0]" and "f2_117[0]" INSIDE the grey Totals column-(f)
#      cells — the sched_d P-007 artifact reproducible on this form had the
#      cell been mapped. The pack's own audit render leaves both grey cells
#      empty, and fill_form now refuses the key outright.
#   3. CONFIRMED NOT TRANSPOSED, in three passes rather than one: the sweep
#      ticks all three boxes of each set at once (which proves only that the
#      three widgets ARE the three printed boxes), so each on-state was then
#      rendered alone — /1 alone ticks (A) on page 1 and (D) on page 2, /2
#      alone ticks (B) and (E), /3 alone ticks (C) and (F), siblings empty in
#      every pass even though /AP /N carries no "/Off" entry (it lives in
#      /AP /D, the f8606/f8889 shape).
#   4. NOTHING CLIPPED: verify's clipping scan ran 236 checks (242 mapped
#      lines minus the 6 checkboxes) with zero FAIL, and fill_form returned no
#      warnings, on the full-form sentinel fill.
# What the audit did NOT change: not one binding. The 244-widget topology is
# perfectly regular (row N = f<page>_(8N-5)..f<page>_(8N+2)), and the render
# confirmed the arithmetic rather than correcting it — which is worth saying
# out loud precisely because a clean audit is the suspicious outcome.
#
# ---------------------------------------------------------------------------
# READONLY ADJUDICATION (pitfall P-007) — measured, not assumed
# ---------------------------------------------------------------------------
# EXACTLY 2 of the 244 widgets carry the AcroForm ReadOnly bit, and neither is
# mapped, so mapped n ReadOnly = 0 over 242 mapped fields. Flags were read at
# FIELD level, walking /Parent (the shape P-007 requires):
#   * the /Ff histogram over all 244 widgets is exactly
#     {8388608: 206, 8392704: 28, absent: 8, 8388609: 2};
#   * 8388608 = DoNotScroll, the plain text-cell value;
#   * 8392704 = DoNotScroll|Multiline (bit 13), on exactly the 28 column-(a)
#     description cells (14 per page) — the form gives the description box two
#     printed text lines' worth of height (/Rect 24pt tall vs 12pt for every
#     other cell in the same row);
#   * absent (no /Ff at all) on 8 widgets: the two SSN boxes f1_2/f2_2 and the
#     six /Btn boxes;
#   * 8388609 = DoNotScroll|ReadOnly on exactly TWO: Page1[0].f1_117[0] and
#     Page2[0].f2_117[0]. Run through the harness's OWN reader
#     (test_formpacks_federal._read_only_widget_names, which walks /Parent),
#     the ReadOnly set is exactly those two names.
# Both are the Totals-row column-(f) cell, and both are P-007 CLASS 2 — the
# printed text makes a correct entry IMPOSSIBLE, so the line key must not
# exist and fill_form has to raise:
#   * printed line 2's own text enumerates the columns it totals and column
#     (f) is NOT among them: "2 Totals. Add the amounts in columns (d), (e),
#     (g), and (h) (subtract negative amounts)." Column (f) holds letter CODES
#     ("BOQ"), which cannot be added, so there is no correct entry to make.
#   * the blank agrees in pixels: at 200 dpi both cells render SOLID GREY while
#     the (d)/(e)/(g)/(h) cells of the very same Totals row, and the (f) cells
#     of all 28 transaction rows, are white.
#   * This is the sched_d 1a.g / 8a.g shape exactly: the IRS locked precisely
#     the cells its own printed text makes impossible, and it is the only
#     place it set the flag on this form. `short_term.2.f` and `long_term.2.f`
#     therefore DO NOT EXIST as keys; fill_form({"short_term.2.f": "B"})
#     raises "unknown line key(s)" (reproduced, see the report).
# The other three classes were each checked against the printed face, so the
# zero is an adjudication and not a flag reading:
#   * class 1 (the widget already HOLDS an IRS-printed constant, sched_se's
#     wage base): none. The form prints no dollar figures, rates or dates at
#     all — its only pre-printed tokens are the column captions and the
#     "(Example: 100 sh. XYZ Co.)" hint, and every one sits in printed TABLE
#     TEXT, outside any widget.
#   * class 3 ("Reserved for future use"): the string does not appear anywhere
#     on either page (checked against `pdftotext -layout` of the pinned blank,
#     not from memory). Printed lines are just 1 and 2 on each page — a
#     gap-free two-line ladder.
#   * class 4 (form-owned / JS-propagated value): structurally impossible here
#     — the document JavaScript is three Adobe version-check scripts, no widget
#     has an /AA, and the AcroForm has no /CO (see PROVENANCE). That verdict
#     cuts BOTH ways on this form: it is also why the page-2 identity mirrors
#     below must be mapped, because nothing propagates them.
#
# ---------------------------------------------------------------------------
# CHECKBOX / GROUP ADJUDICATION (pitfalls P-003, P-008)
# ---------------------------------------------------------------------------
# Six /Btn widgets, two sets of three, one set per Part:
#   Page1[0].c1_1[0]/[1]/[2] -> printed boxes (A) (B) (C), on-states /1 /2 /3
#   Page2[0].c2_1[0]/[1]/[2] -> printed boxes (D) (E) (F), on-states /1 /2 /3
# Each set is ONE question printed "You must check Box A, B, or C below.
# Check only one box." (and D/E/F on page 2).
#
# TOPOLOGY, dumped not guessed: this is the P-008 SEPARATE-WIDGET shape, the
# one that gets no exemption. Each of the six widgets is its own TERMINAL
# field — it carries its own /T ("c1_1[0]", "c1_1[1]", "c1_1[2]"), has NO
# /Kids, has no /Ff at all (so no radio bit), and its only ancestor with a /T
# is the page subform Page1[0]/Page2[0], which has NO /FT. So the three boxes
# of a set are three independent fields and NOT the kids of one radio field,
# and nothing in the PDF makes them exclusive. Proved on the render, not
# argued: the introspect sentinel sweep turned every /Btn on and printed a
# page 1 with (A), (B) AND (C) all ticked, and a page 2 with (D), (E) and (F)
# all ticked — three mutually exclusive answers on one form, which is what
# ships if the `group` id is missing.
# So all three members of each set carry a `group`: `short_term.box` and
# `long_term.box`. GROUP SPELLING: the group id is the LINE STEM, sched_d's
# convention (`qof`, `line17`) applied to a lettered rather than numbered
# question; a numeric `line<N>` id is unavailable here because the question
# has no printed line number of its own, and `short_term.box` cannot collide
# with `long_term.box` the way a shared `box` would. OPTION KEY SPELLING:
# `short_term.box.a` rather than `short_term.a` — the extra `box` segment
# keeps the printed BOX letters (a,b,c / d,e,f) from reading like the printed
# COLUMN letters (a..h) that fill the rest of this pack; `long_term.box.d` and
# `long_term.2.d` would otherwise be one segment apart and mean entirely
# different things.
# BOTH halves of the guard were REPRODUCED against this pack and its pinned
# blank, not asserted:
#   * fill_form(pack, {"short_term.box.a": True, "short_term.box.b": True})
#     raises ValueError "lines 'short_term.box.a' and 'short_term.box.b' all
#     turn on members of checkbox group 'short_term.box' — these are the
#     mutually exclusive options of ONE question and exactly one may be
#     selected", while a single answer still writes its one field;
#   * a PDF whose c1_1[0] and c1_1[1] widgets were patched on DIRECTLY (the
#     P-008 reproduction shape, bypassing the filler) makes verify's
#     at-most-one checkbox audit report FAIL: "checkbox group
#     'short_term.box' has 2 boxes checked (short_term.box.a,
#     short_term.box.b) — exactly one is allowed". That check fires for every
#     group whether or not it is `required`, which is what keeps the read side
#     covered despite the `required: false` adjudication below.
#
# NEITHER `group` IS `required: true`, and this one is settled by the
# instructions rather than by the emphatic printed "You must": a correct Form
# 8949 may consist of ONE Part. "You don't need to complete and file an entire
# copy of Form 8949 (Parts I and II) if you can check a single box to describe
# all your transactions. In that case, complete and file either Part I or II
# and check the box that describes the transactions." (Instructions for Form
# 8949 (2023), Part I / Part II, p.4.) A long-term-only filer therefore files
# page 2 with a blank page 1 — `required: true` on `short_term.box` would FAIL
# verification on that correct return, and vice versa. What the printed "must"
# really states is a CONDITIONAL requirement — required if that Part carries
# any transaction — and the pack schema has no way to express a conditional
# `required`, so the honest choice is the sched_d line-17/20/22 one: leave it
# off rather than ship a check that false-FAILs a legal filing (reported as an
# open issue, since the unconditional half is genuinely worth catching).
#
# THE GATE BLIND SPOT, MEASURED ON THIS PACK — neither shipped P-008 gate can
# see these two sets, so their `group` ids are house discipline rather than a
# gate result. `test_every_yes_no_pair_shares_one_group_id` keys off the LINE
# SHAPE `<stem>.yes` + `<stem>.no` and these options are lettered, not yes/no;
# `test_pack_radio_options_share_one_group_and_distinct_states` only fires when
# two checkbox lines SHARE one AcroForm field, and these six lines bind six
# different fields. That is exactly the THIRD topology blind spot recorded in
# docs/ROADMAP.md Phase E (measured 2026-08-26: 285 such option sets across 81
# packs, 193 of them ungrouped) — this pack adds two more sets to that sweep's
# population, and unlike most of the 193 these two are genuinely EXCLUSIVE
# ("Check only one box"), so they belong on the grouped side of the
# adjudication table that item calls for. Verified by execution rather than
# claimed: with the group ids deleted, both gates still pass.
#
# ---------------------------------------------------------------------------
# IDENTITY PAGE MIRRORS — 2, and they are load-bearing
# ---------------------------------------------------------------------------
# Page 2 prints its own header pair, "Name(s) shown on return. Name and SSN or
# taxpayer identification no. not required if shown on other side" and "Social
# security number or taxpayer identification number", bound to DIFFERENT
# AcroForm fields from page 1 (Page2[0].f2_1[0] / f2_2[0] vs Page1[0].f1_1[0] /
# f1_2[0]). They are mapped as `page2_name` and `page2_identifying_number`, the
# house `page<N>_<what>` shape (formpacks/CONVENTIONS.md, "Identity page
# mirrors"; sched_e uses the other house shape, `identifying_number_page2`).
# Why they are mapped even though the caption says "not required": the escape
# clause is "IF SHOWN ON OTHER SIDE", and the instructions quoted above make a
# Part-II-only filing correct — that filing has no other side, so its page-2
# header is the only place the filer's name and SSN appear. Nothing propagates
# the value either (no JS, no /AA, no /CO), so an unmapped mirror ships a blank
# header on a filed return, which is the ri1040/it1040_oh defect exactly. The
# one thing the schema cannot express is that the mirror's VALUE equals its
# source's: a caller that fills `page2_name` differently from `name` files an
# internally inconsistent return and no gate catches it (CONVENTIONS says so;
# repeated here because this is where a reader of THIS pack looks).
#
# ---------------------------------------------------------------------------
# YEAR TOKENS IN LINE KEYS (formpacks/CONVENTIONS.md) — none, by rule 3
# ---------------------------------------------------------------------------
# NO line key in this pack embeds a year, so the year-offset gate has nothing
# to pin and a port cannot go stale the sched_oi way. "2023" appears on the
# face only in the masthead year box and the two "Form 8949 (2023)" footers —
# never inside printed LINE text, and never as a box LABEL, so nothing here is
# the f8843-line-4a shape where a year picks WHICH BOX. The `row01`..`row14`
# tokens are row indices, not years, and do not match the gate's
# `(?:19|20)\d{2}` year pattern.
#
# ---------------------------------------------------------------------------
# RELATIONS — deliberately EMPTY, and the reason is the relation GRAMMAR
# ---------------------------------------------------------------------------
# Form 8949 prints exactly two pieces of on-face arithmetic, and NEITHER can be
# expressed in this repo's relation grammar, because every money line on this
# form is a DOTTED column key:
#   * the per-row column identity, printed in the column (h) head: "Gain or
#     (loss). Subtract column (e) from column (d) and combine the result with
#     column (g)." The instructions restate it with worked examples ("Column
#     (d) is $6,000, column (e) is $2,000, and column (g) is ($1,000). Enter
#     $3,000 in column (h)." — Instructions, Column (h), p.10). As a rule that
#     is `short_term.1.row01.h == short_term.1.row01.d - short_term.1.row01.e
#     + short_term.1.row01.g`, x28 rows.
#   * the Totals row: "2 Totals. Add the amounts in columns (d), (e), (g), and
#     (h) (subtract negative amounts)", i.e. `short_term.2.d == ` the sum of
#     the 14 `short_term.1.rowNN.d` cells, x8 (4 columns x 2 Parts).
# verify's tokenizer (_TOKEN_RE in packages/core/src/taxfill_core/verify.py)
# admits whitespace, floats, `\d+[a-z]?` line ids, `[A-Za-z_][A-Za-z0-9_]*`
# names, and the operators `== .. + - * / ( ) ,` — a single `.` is not an
# operator and not part of any token, so a dotted key cannot appear in a
# relation at all. REPRODUCED against this pack, not inferred — and note WHERE
# it fails, because the first guess was wrong: `load_pack` accepts the string
# without complaint (the schema does not parse relations), and it is
# verify.relations() — the call the harness's
# test_pack_relations_parse_in_verifys_evaluator makes — that raises. With
# "short_term.1.row01.h == short_term.1.row01.d - short_term.1.row01.e +
# short_term.1.row01.g" declared, verify.relations(pack, ...) raises
# "could not parse relation '...': unexpected character '.' at position 10".
# Its `sum()` form fails at the same character, for a second and independent
# reason on top of that: `sum(a..b)` ranges over a shared numeric prefix with
# single-letter suffixes (sum(1a..1h)) — a COLUMN range across one printed
# line, not a range down 14 rows.
# This is the same wall sched_d's banner records ("the verify relation grammar
# resolves a line id as a single token and cannot reference dotted column
# keys"), and the same disposition: these checks are left to the recompute
# engine plus human review. Nothing is being hidden — the arithmetic is
# printed in the COLUMN LEGEND above and in each Part's row comments — and a
# false or unparseable relation would be worse than none (the f8606 header's
# rule). Reported as an open issue: this form is the strongest case yet for a
# dotted-key relation grammar, because 36 unexpressible on-face equalities is
# more than any other pack in the repo.
#
# ---------------------------------------------------------------------------
# CROSS-FORM — deliberately EMPTY, on two independent grounds
# ---------------------------------------------------------------------------
# The Totals row cites Schedule D by name on both pages: "Enter each total here
# and include on your Schedule D, line 1b (if Box A above is checked), line 2
# (if Box B above is checked), or line 3 (if Box C above is checked)" (page 1)
# and "... line 8b (if Box D ...), line 9 (if Box E ...), or line 10 (if Box F
# ...)" (page 2). Not one of the six is an unconditional equality:
#   1. Each is CONDITIONAL on which box is checked — one Totals row lands on
#      one of three different Schedule D lines depending on an answer
#      elsewhere on the form. The grammar has no conditional.
#   2. Each is ADDITIVE across FORMS, not one-to-one. The printed face says so
#      itself: "If you have more short-term transactions than will fit on this
#      page for one or more of the boxes, complete as many forms with the same
#      box checked as you need", and the instructions repeat it — "Complete as
#      many copies of Part I as you need to report all transactions of each
#      type (A, B, or C)" and "Include on your Schedule D the totals from ALL
#      your Parts I and II" (Instructions for Form 8949 (2023), p.3-4). A filer
#      with 20 box-A short-term sales files two Forms 8949 whose line 2 column
#      (d) totals SUM to Schedule D line 1b column (d); neither alone equals
#      it. This is the f8889 per-spouse shape, one step worse.
# There is also a hard mechanical bar: a `cross_form` ref is split at the FIRST
# dot, so `short_term.2.d == sched_d.1b.d` would be read as form_key
# "short_term" (not a pack) referring to line "2.d". Only undotted lines of
# THIS pack can appear on the left, and this pack has none. So even a
# conditional-free, one-to-one carry could not be written; both facts are
# recorded so a porter does not try. sched_d 2023 DOES map `1b.d`, `2.d`, `3.d`,
# `8b.d`, `9.d`, `10.d` etc., so the targets exist and this is a deliberate
# omission, not a missing pack — no CROSS_FORM_TARGET_ALLOWLIST row is needed.
#
# ---------------------------------------------------------------------------
# IDENTITY FIELDS / SIGNATURE / MAILING
# ---------------------------------------------------------------------------
# identity_fields: [name, identifying_number] — the house shape for an
# attachment (sched_d, sched_b, sched_c, f8606, f8889 all ship exactly this).
# `name` is printed "Name(s) shown on return", i.e. the parent return's names
# by construction. NO `identity_per_person` entry — the two packs that ship one
# were checked before deciding, so this is a considered call rather than an
# omission. Both of them are per-PERSON on their own printed face: Form 8889's
# box is captioned "Social security number of HSA beneficiary. If both spouses
# have HSAs, see instructions", and Form 8606's header prints "If married, file
# a separate form for each spouse required to file" — so on a joint return
# either can legitimately carry the SPOUSE's SSN while the 1040 carries the
# primary filer's, which is why they declare `identity_per_person:
# [identifying_number]`. Form 8949 prints neither qualification: its box is the
# unqualified "Social security number or taxpayer identification number", it is
# filed per RETURN (it feeds one Schedule D, which carries the return's own
# SSN), and nothing in its instructions contemplates a per-spouse copy. So a
# difference from the 1040 here is an error, and verify should keep FAILing it.
# `maxlen: 11` tracks the widget's OWN /MaxLen (dumped: /MaxLen 11 on f1_2 and
# f2_2, absent on every other widget), which is what formpacks/CONVENTIONS.md
# requires and what sched_b / sched_c / sched_8812 / f2555 / f8889 do; f8606 and
# f8960 pin 9 on the identical 11-wide widget, an inconsistency this pack
# reports rather than copies (ROADMAP Phase E has the open item). Neither box
# is a comb (no comb bit on either), so `format: ssn_digits_only` is here for
# cross-form identity consistency and overflow-proofing, not because dashes
# would clip (P-001).
# signature: null, mailing: null — the attachment-only shape (sched_d, f8889,
# f8960). Confirmed on the dump AND the render: 244 widgets, none in a
# signature area, and no signature or preparer block is printed on either page.
# The form is filed inside the parent return's envelope, so it has no
# where-to-file of its own.
