    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
    group: short_term.box
  - line: "short_term.box.b"                # "(B) Short-term transactions reported on Form(s) 1099-B showing basis wasn't reported to the IRS"
