# Form 8938 — Statement of Specified Foreign Financial Assets. The IRC 6038D
# disclosure a specified person attaches to the annual return when the aggregate
# value of specified foreign financial assets crosses the reporting threshold.
#
# WHY THIS PACK EXISTS. Nothing in this repo could file a foreign-asset
# disclosure before it, and the population the repo serves (F-1 -> OPT -> H-1B)
# routinely keeps home-country accounts. The exposure is the steepest in the
# repo: IRC 6038D(d) is a flat $10,000 failure-to-file penalty with a further
# $10,000 per 30-day period after 90 days from IRS notice, capped at $50,000
# additional ($60,000 total per year); IRC 6662(j)(3) substitutes "40 percent"
# for "20 percent" on any underpayment attributable to an undisclosed foreign
# financial asset; and IRC 6501(c)(8) can hold the whole year's statute of
# limitations open. The pack ships with the CITED THRESHOLDS in
# knowledge/federal/<year>.yaml (top-level block `foreign_account_reporting`)
# and the calc op `foreign_asset_reporting`, which answers "must I file?" from
# the reg rather than from memory. Form 8938 is NOT the FBAR: see the FBAR
# section near the end of this banner.
#
# ---------------------------------------------------------------------------
