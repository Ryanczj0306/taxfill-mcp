# ---------------------------------------------------------------------------
# WHY THIS DIRECTORY (revision-pinned, not year-pinned)
# ---------------------------------------------------------------------------
# Form 8938 carries NO printed tax year: the filer WRITES the year into the
# "For calendar year 20__" header, which is why that box is a mapped line
# (`calendar_year`) rather than a printed constant. It is revision-dated like
# Form 843 (Rev. 12-2024), Form 8316 (Rev. 1-2006), Form W-7 (Rev. 12-2024)
# and Form 8833 (Rev. 12-2022 — landing alongside this pack in the same Phase
# I4 tranche) — the repo's other revision-pinned federal packs, which all ship
# one pack per FILING YEAR under
# formpacks/federal/<year>/ with a single shared revision pin. This pack
# follows them exactly: `tax_year` is the year this pack SERVES, not a year
# printed on the form face, and all three shipped years pin the same
# Rev. 11-2021 artifact. One pack per year is what makes the
# (tax_year, form_key) key resolve for a TY2024 or TY2025 filing; a single
# 2023-only pack would leave a TY2025 filer with no Form 8938 at all.
#
# ---------------------------------------------------------------------------
# WHAT THE PARTS ACTUALLY ARE — read off the printed face, because the
# intuitive reading is backwards
# ---------------------------------------------------------------------------
# The natural assumption is "Parts I/II are the asset detail and III-VI are
# summaries". The printed Part headings say the OPPOSITE, verbatim:
#   Part I    "Foreign Deposit and Custodial Accounts Summary"        (5-9)
#   Part II   "Other Foreign Assets Summary"                          (10-12)
#   Part III  "Summary of Tax Items Attributable to Specified Foreign
#              Financial Assets"                                      (13-14)
#   Part IV   "Excepted Specified Foreign Financial Assets"            (15-19)
#   Part V    "Detailed Information for Each Foreign Deposit and Custodial
#              Account Included in the Part I Summary"                (20-28)
#   Part VI   "Detailed Information for Each 'Other Foreign Asset' Included
#              in the Part II Summary"                                (29-36)
# So Parts I-IV are ALL summaries (counts, maxima, a tax-item grid and a
# count of excepted-asset forms), and the DETAIL lives in Parts V and VI —
# and each of those describes exactly ONE account / ONE asset. Both print
# their own overflow rule: "If you have more than one account to report in
# Part V, attach a separate statement for each additional account" (and the
# same sentence for Part VI), which the header checkbox
# `additional_statements.attached` plus `additional_statements.count` is how
# the form records. Getting this backwards would have produced 14 phantom
# repeating detail rows and left the real Part III grid unmapped.
#
# ---------------------------------------------------------------------------
# THE ROW-KEY CONVENTION (Part III's 14 x 3 grid, and the option blocks)
# ---------------------------------------------------------------------------
# Checked against LINE_ID_RE in test_formpacks_federal.py first
# (^(?:[0-9]+[a-z]?|[a-z][a-z0-9_]*)(?:\.(?:[0-9]+[a-z]?|[a-z][a-z0-9_]*))*$):
# every key below is a printed label segment or a lowercase word, dotted.
#
# 1. PART III GRID -> `<printed row>.<printed column letter>`, e.g. `13a.c`,
#    `14g.e`. This is NOT a new convention: sched_d already keys `1b.d`/`2.g`
#    and sched_e keys `3.a` the same way, and it beats f8949's
#    `<part>.<line>.<row>.<column>` here because Form 8938 PRINTS a distinct
#    label on every row — 13a..13g under "Foreign deposit and custodial
#    accounts" and 14a..14g under "Other foreign assets" — so no invented
#    `rowNN` segment and no part namespace are needed to make the key unique.
#    Column legend, transcribed from the printed table head:
#      (a) Asset category   -- PRINTED TEXT, no widget (see below)
#      (b) Tax item         -- PRINTED TEXT, no widget (see below)
#      (c) Amount reported on form or schedule      money  (printed "$")
#      (d) Form and line     ] under the spanning head "Where reported"  text
#      (e) Schedule and line ]                                          text
#    COLUMNS (a) AND (b) HAVE NO LINE KEYS ON PURPOSE, and this is a P-007
#    class-2 call, not an omission: the form PRINTS the category ("Foreign
#    deposit and custodial accounts" / "Other foreign assets") and the tax
#    item ("Interest", "Dividends", "Royalties", "Other income",
#    "Gains (losses)", "Deductions", "Credits") as fixed labels. There is no
#    widget behind either, so no value could be written there at all. The row
#    key carries that information instead: `13*` = the deposit/custodial
#    category, `14*` = other foreign assets, and the letter selects the tax
#    item, spelled out in each line's inline comment.
# 2. PRINTED SUB-COLUMNS THAT ARE PARENTHESISED, NOT LETTERED ROWS ->
#    `<line>.<letter>` with a DOT, e.g. `25.a`, `25.b`, `25.c` and `34.a`,
#    `34.b`, `34.c`. Lines 25 and 34 print "(a)/(b)/(c)" as COLUMN heads of a
#    three-cell table under one numbered line, exactly like Part III's
#    columns — so they take the dotted spelling. Contrast lines 3, 20, 22, 26,
#    31, 32, 35 and 36, whose a/b/c/d are printed as LETTERED SUB-LINES
#    ("a Specified individual", "26a Name of financial institution") and
#    therefore key as ONE printed segment: `3a`, `20b`, `22d`, `26a`, `31c`,
#    `32e`, `35d`, `36e`. The discriminator is the printed face, not taste:
#    a lettered sub-line prints its letter flush with the line number in the
#    stub column; a column letter prints in parentheses inside a table head.
# 3. NAMED OPTIONS INSIDE A LETTERED SUB-LINE -> `<line letter>.<word>`, e.g.
#    `35c.partnership`, `36b.individual`, `36c.us_person`. The printed face
#    numbers these "(1) Partnership (2) Corporation (3) Trust (4) Estate", and
#    a numeric key (`35c.1`) would read as a printed LINE label the form does
#    not have, so the option's own printed WORD is the segment. The PDF's
#    on_state still carries the printed number (/1../5) and is dumped from the
#    blank, never guessed.
# 4. YES/NO -> `<line>.yes` / `<line>.no` (lines 9, 12, 24, 33), the
#    documented federal spelling (formpacks/CONVENTIONS.md).
# 5. THE HEADER PERIOD BOXES are not numbered lines, so they take word keys:
#    `calendar_year` (the "For calendar year 20__" 2-digit suffix),
#    `tax_year_begin.month_day` / `tax_year_begin.year` and
#    `tax_year_end.month_day` / `tax_year_end.year`. The two-digit suffix
#    boxes carry /MaxLen 2 and the form prints the "20" — so the value to
#    write is "25", not "2025". EXECUTED, not assumed: fill_form("2025")
#    RAISES ("value '2025' is 4 characters but the field allows at most 2 —
#    shorten it to 2 characters or fewer") because filler._enforce_length
#    guards /MaxLen before writing, so this one fails LOUDLY rather than
#    silently truncating. The banner said otherwise in draft; the render
#    corrected it.
# 6. THE GIIN IS FOUR BOXES, keyed POSITIONALLY: `26b.part1..part4` and
#    `35b.part1..part4`, /MaxLen 6 / 5 / 2 / 3, printed as four boxes
#    separated by three dots. Neither the printed face nor the Instructions
#    for Form 8938 (Rev. 11-2021) lines 26b/35b names what the four segments
#    MEAN — the instructions only say where to look one up (the FATCA FFI
#    List Search and Download tool) and that "You will not be subject to
#    penalties if you enter the wrong GIIN or leave this field blank". So the
#    keys are positional by design rather than semantic; naming them after a
#    remembered GIIN grammar would be exactly the invention this repo
#    forbids.
# 7. `36a` KEYS THE PRINTED NAME LINE and its un-lettered checkbox row keys
#    `36a.information_for.issuer` / `.counterparty`. Printed 36a is "Name of
#    issuer or counterparty" followed by an unnumbered "Check if information
#    is for [ ] Issuer [ ] Counterparty" — one printed sub-line with no label
#    of its own, so it namespaces under the line it belongs to.
#
