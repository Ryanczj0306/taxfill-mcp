# ---------------------------------------------------------------------------
# CHECKBOX TOPOLOGY — the DANGEROUS one, so every option set carries a group
# ---------------------------------------------------------------------------
# Dumped from the AcroForm tree, not inferred from the key spelling
# (formpacks/CONVENTIONS.md, "The two topologies are not equally dangerous").
# Every one of the 38 checkboxes is its OWN TERMINAL /Btn FIELD with its own
# /T, its own /V (all "/Off" in the blank) and no /Kids — i.e. the SEPARATE
# SINGLE-WIDGET topology, the one where nothing in the PDF and nothing in the
# engine can make an option set exclusive. LiveCycle still numbers the
# appearance states as if they were a radio group (c1_2[0..3] carry /1../4),
# but the four are four independent fields: `fill_form` can and will write
# BOTH "Yes" and "No" on line 9 unless a `group` says otherwise. So this pack
# takes NO exemption. Groups, and the printed text that decides each:
#   REQUIRED, EXACTLY ONE (group required per P-003):
#     group `line3`  = 3a/3b/3c/3d  -- printed "Type of filer"; line 4's own text
#                  ("If you checked box 3a, skip this line 4. If you checked
#                  box 3b or 3c ... If you checked box 3d ...") only makes
#                  sense for a single answer, and every filer is one of the
#                  four.
#     group `line20` = 20a/20b      -- printed "Type of account" with a Deposit
#                  and b Custodial; Part I counts the two separately
#                  (lines 5/6 deposit, 7/8 custodial), so one account is one
#                  or the other.
#   GROUPED, NOT REQUIRED (the question may not apply to this filer's asset):
#     groups `line9`, `line12`, `line24`, `line33` -- the four printed Yes/No
#                  pairs.
#     group `line32` = 32a/32b/32c/32d -- printed "Maximum value of asset during
#                  tax year (check box that applies)": four disjoint bands,
#                  and 32e ("If more than $200,000, list value") is the
#                  fifth, MUTUALLY EXCLUSIVE branch that is a MONEY line
#                  rather than a checkbox — so the group is exactly the four
#                  boxes and is deliberately NOT required (an asset over
#                  $200,000 answers on 32e and checks none of them).
#     group `35c` = the four "Type of foreign entity" options.
#     group `36b` = the five "Type of issuer or counterparty" options.
#     group `36c` = U.S. person / Foreign person.
#     group `36a.information_for` = Issuer / Counterparty.
#     group `additional_statements` = the single header checkbox. A one-member
#                  group looks odd and is deliberate: the P-008 gate builds
#                  its groups from `group`/`required`, and a lone ungrouped
#                  checkbox is invisible to it.
#   NO GROUP, ON PURPOSE (multiple boxes are LEGAL, so an at-most-one audit
#   would false-FAIL a correct return — the f843 line-4/5 pattern):
#     22a/22b/22c/22d -- printed "Check all that apply". An account can be
#                  opened AND closed AND jointly owned inside one tax year.
#     31c/31d      -- printed "Check if asset jointly owned with spouse" and
#                  "Check if no tax item reported in Part III with respect to
#                  this asset": two unrelated booleans that print on one row,
#                  not two options of one question.
#
# relations: [] -- the form face carries NO arithmetic. Lines 5/7/10 are
# counts the filer takes from Parts V/VI, 6/8/11 are maxima, Part III has no
# total row and Part IV lines 15-19 are five independent counts. There is no
# printed "add lines" anywhere on either page, so nothing belongs in
# relations (instruction-only or worksheet math never does).
#
# cross_form: [] -- Part III columns (d) "Form and line" and (e) "Schedule
# and line" look like cross-form references and are NOT: they are free TEXT
# in which the filer NAMES where the item was already reported ("Schedule B,
# Part I, line 1"), not an equality the verifier could recompute. The
# cross_form grammar is `<ref> == <ref>` over money lines; there is no
# arithmetic identity between any Form 8938 line and any other form's line.
#
# identity_fields: [name, identifying_number] -- the f8949/f8960 shape.
# Line 1 is printed "Name(s) shown on return" and line 2 "Taxpayer
# identification number (TIN)", both unqualified, so they are the RETURN's
# name and TIN and must match every other form in the filing.
# identity_per_person is NOT declared, and that is a decision: Form 8938
# prints no per-spouse qualifier anywhere (contrast Form 8889's "Social
# security number of HSA beneficiary" and Form 8606's "If married, file a
# separate form for each spouse required to file"), and Treas. Reg.
# 1.6038D-2(a)(2) says married specified individuals filing jointly "must
# attach a SINGLE Form 8938 to their joint annual return" — one form for the
# couple, carrying the return's own identity. Lines 4a/4b are a DIFFERENT
# person's name and TIN (the specified individual behind a partnership,
# corporation or trust filer) and are correctly NOT identity fields.
#
# signature: null / mailing: null -- "Attach to your tax return."
# (Attachment Sequence No. 938). No signature block of its own and no
# where-to-file of its own; it travels inside the parent return's envelope,
# the same as every sched_* pack and f8949/f8960.
#
# ---------------------------------------------------------------------------
# THE THRESHOLD IS NOT ON THE FORM — and it is not the FBAR's
# ---------------------------------------------------------------------------
# Nothing on either printed page states who has to file. The thresholds live
# in Treas. Reg. 1.6038D-2(a)(1)-(4) and the Instructions for Form 8938
# (Rev. 11-2021), "Types of Reporting Thresholds", and BOTH were read for
# this pack. Two independent sources, agreeing:
#   in the US   unmarried or MFS   > $50,000 last day  or > $75,000 any time
#               MFJ                > $100,000 last day or > $150,000 any time
#   abroad      unmarried or MFS   > $200,000 last day or > $300,000 any time
#               MFJ                > $400,000 last day or > $600,000 any time
#   specified domestic entity      > $50,000 last day  or > $75,000 any time
# "abroad" is not a feeling: the reg keys paragraphs (a)(3)/(a)(4) to being a
# "qualified individual under section 911(d)(1)" — the bona fide residence
# test or 330 full days in 12 consecutive months — and the instructions
# restate it as a foreign tax home PLUS the presence-abroad test. The
# thresholds are STATUTORY and NOT inflation-indexed, which is why all three
# shipped years carry the same figures; they live as cited data in
# knowledge/federal/<year>.yaml under `foreign_account_reporting`, and the
# calc op `foreign_asset_reporting` applies them (and refuses to guess when
# an input is missing).
#
# THE FBAR IS A DIFFERENT FILING AND THIS PACK IS NOT IT. FinCEN Form 114 is
# filed with FinCEN, not the IRS, is not part of the tax return, uses a flat
# $10,000 AGGREGATE MAXIMUM-VALUE threshold that filing status does not move,
# and is E-FILE ONLY through the BSA E-Filing System — irs.gov states outright
# that "IRS will not accept paper filings on TD F 90-22.1 (obsolete) or a
# printed FinCEN Form 114 (for e-filing only)". It therefore cannot be a
# fillable pack at all and ships as
# formpacks/federal/<year>/fincen114/handfill.yaml instead. Filing one does
# not satisfy the other: "The Form 8938 filing requirement does not replace
# or otherwise affect a taxpayer's obligation to file FinCEN Form 114"
# (IRS, Comparison of Form 8938 and FBAR requirements). The scope differs in
# both directions — an account you only have SIGNATURE AUTHORITY over is
# FBAR-reportable and generally not 8938-reportable; foreign stock held
# outside an account, a foreign partnership interest and a foreign hedge fund
# are 8938-reportable and not FBAR-reportable.
#
# ---------------------------------------------------------------------------
# VISION AUDIT — what it caught, and what it could not have caught
# ---------------------------------------------------------------------------
# SENTINEL SWEEP: every one of the 131 mapped lines filled with a distinctive
# per-line sentinel (the widget's own leaf name for text lines, a distinct
# 7-digit amount for money lines) and rendered at 200 dpi; both pages read
# whole, then the Part III grid and both GIIN rows re-cropped and re-read at
# 300 dpi. Checkbox coverage needed more than one pass because 11 of the 12
# groups are mutually exclusive (the twelfth, `additional_statements`, is a lone
# header checkbox), so FIVE filled renders were built, rotating
# each group through its options (the widest group, 36b, has five) — every one
# of the 38 checkboxes is checked in at least one render and was READ on the
# page. All five renders: verify ok=True, zero FAIL/WARN, zero fill warnings.
# audit_pack.py on the 2025 pack: 111 mapped lines written (131 minus the 20
# unchecked group siblings its one-option-per-group generator leaves off),
# verify_fails [].
#
# THE MAP AUDIT CAUGHT NO DEFECTS, which docs/CONTRIBUTING-PACKS.md rightly
# calls suspicious, so here is exactly what the renders established that a
# field dump could NOT have:
#   * the GIIN segment ORDER. f2_07..f2_10 and f2_22..f2_25 render
#     left-to-right into the four printed boxes with the printed dots between
#     them, so `26b.part1` really is the leftmost 6-char box. A dump gives
#     names and MaxLens, not printed order.
#   * that lines 22a-22d and 31c/31d really do render CHECKED SIMULTANEOUSLY.
#     That is the whole basis for leaving them ungrouped, and it is now
#     observed rather than argued.
#   * that `36a`'s widget sits INLINE on the printed "Name of issuer or
#     counterparty" row (starting at x=191.8, immediately after the label)
#     rather than on a continuation rule below it — so `36a` is the name box
#     and the un-lettered Issuer/Counterparty pair below it needed its own
#     namespace.
#   * that the Part III column-(c) money cells right-align FLUSH to the
#     column-(d) border and still show all 7 digits at 8 pt.
#
# TWO REAL CLIPPING FINDINGS, both from a second pass filled with REALISTIC
# values instead of sentinels:
#   1. `tax_year_end.month_day` (43.0 pt) CANNOT HOLD "December 31". The
#      clipping scan FAILs it (11 x 0.5 x 8 = 44.0 pt > 43.0 pt) and the
#      300 dpi render agrees: the leading "D" renders as a half-glyph and the
#      trailing "1" is gone — "and ending )ecember 3". So the guard works
#      here, but every fiscal-year filer hits it; "Dec. 31" or "12/31" is
#      what fits. Same box on the "beginning" side (43.4 pt) has the same
#      budget.
#   2. `name` CLIPS SILENTLY ON ALL-CAPS TEXT, and this one the scan does NOT
#      catch. Filled with "PRIYA RAMASWAMY-VENKATARAGHAVAN AND ARJUN
#      RAMASWAMY-VENKATARAGHAVAN" (67 chars — an ordinary joint-return name
#      pair for this repo's user base), verify came back CLEAN while the
#      render lost the last four characters. Measured with a rendered
#      character ruler at 60/62/64/66/70/84 uppercase characters: the 337.6 pt
#      widget holds 62 characters of ALL-CAPS Helvetica at 8 pt, the 63rd
#      renders as a half-glyph, and 64 or more silently drops everything past
#      it. verify.clipping_scan predicts 84 (337.6 / (0.5 x 8)), because
#      _AVG_CHAR_WIDTH_RATIO = 0.5 is calibrated for MIXED-CASE Helvetica
#      while the measured all-caps ratio on this render is 337.6/62 = 5.45 pt
#      per character = 0.68 em. So there is a 63-to-84-character SILENT
#      WINDOW on this widget, and the same arithmetic applies to every
#      wide text box in every pack in the repo.
#      This is a PRE-EXISTING ENGINE limitation, not a defect in this map, and
#      it is a false NEGATIVE — worse than f8833's multiline false POSITIVES,
#      because a truncated name ships on a filed return with a green verify.
#      Deliberately NOT worked around here: raising the ratio moves the
#      clipping verdict of every one of the repo's packs, so it belongs in its
#      own reviewed change to clipping_scan (ideally real Helvetica AFM
#      widths, or a case-aware ratio), not in a pack banner. Recorded in the
#      tranche report's open issues. What a CALLER should do today: pass
#      mixed-case names, and treat any value over ~60 characters on a wide box
#      as needing its own render.

