# Federal Schedule 2 (Form 1040), TAX YEAR 2025 (OBBBA-era revision).
#
# Template-reconciled from the 2024 pack against the 2025 blank's real field
# tree (pypdf full names; the introspect dump's short names hid the shifts).
# 2024->2025 diffs, all verified row-by-row on y-coordinates + the printed face:
# - Line 4 (SE tax) gained an exemption row: "Check if any exemption from:
#   1 [] 4361  2 [] 4029  3 [] ____" -> three independent /1 checkboxes
#   (c1_3/c1_4/c1_5) + a write-in (Line4_ReadOrder f1_14). The old bare f1_14
#   money widget was CONSUMED by this container, shifting every later page-1
#   money field's f-number by +1 (f1_15..f1_27 now = lines 4..16) — the
#   unchanged-looking names f1_16..f1_26 all REBIND one line earlier than 2024.
# - Line 8's not-required checkbox renamed c1_3 -> c1_6.
# - Page 2: the two 17z description rows merged into ONE 2-row multiline
#   widget (f2_19; maxlen capped at 79 for the clipping heuristic, same
#   convention as sched_1 2025's 8z/24z merges); the tail shifted -1:
#   f2_20=17z amount, f2_21=18, f2_22=19 (new face text: recapture of net EPE
#   from Form 4255), f2_23=20 (965 installment), f2_24=21 total.
# - Relations unchanged: the 2025 face prints the same math incl.
#   "Add lines 4, 7 through 16, 18, and 19" on line 21.
# - Line 10 prints "Reserved for future use" but its widget exists and stays
#   mapped (sched_1 2025's reserved line 22 precedent; the printed line-21 sum
#   nominally spans 7-16). Fillers should never supply it.
