    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
    group: line9_more_than_line6
  - line: "line9_more_than_line6.yes"
    # "Yes. You may owe a penalty, but don't file Form 2210 unless one or more boxes in Part II below applies."
    field: "Page1[0].c1_1[1]"
    type: checkbox
    on_state: "/2"
    group: line9_more_than_line6
  # ---- Part II: Reasons for Filing. "Check applicable boxes." — independent boxes (several may apply), so no group ----
