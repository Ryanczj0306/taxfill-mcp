    field: "Page1[0].c1_4[0]"
    type: checkbox
    on_state: "/1"
  - line: "part_ii.d"
    # box D: "Your penalty is lower when figured by treating the federal income tax withheld from your income as paid on the dates it was actually withheld, instead of in equal amounts on the payment due dates."
    field: "Page1[0].c1_5[0]"
    type: checkbox
