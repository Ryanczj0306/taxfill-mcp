    field: "Page1[0].f1_3[0]"
    type: money
  - line: "2"
    # "Other taxes, including self-employment tax and, if applicable, Additional Medicare Tax and/or Net Investment Income Tax (see instructions)" — the instructions' list of Schedule 2 lines, so no relation
    field: "Page1[0].f1_4[0]"
    type: money
  - line: "3"
    # "Other payments and refundable credits (see instructions)" — printed inside "(   )": entered as a positive amount and SUBTRACTED on line 4
    field: "Page1[0].f1_5[0]"
    type: money
  - line: "4"
    # "Current year tax. Combine lines 1, 2, and 3. If less than $1,000, stop; you don't owe a penalty. Don't file Form 2210"
    field: "Page1[0].f1_6[0]"
    type: money
  - line: "5"
    # "Multiply line 4 by 90% (0.90)" — INSET box (x 382-467)
    field: "Page1[0].f1_7[0]"
    type: money
  - line: "6"
    # "Withholding taxes. Don't include estimated tax payments. See instructions"
    field: "Page1[0].f1_8[0]"
    type: money
  - line: "7"
    # "Subtract line 6 from line 4. If less than $1,000, stop; you don't owe a penalty. Don't file Form 2210." No floor printed
    field: "Page1[0].f1_9[0]"
    type: money
  - line: "8"
    # "Maximum required annual payment based on prior year's tax (see instructions)" — the 100% / 110% prior-year safe harbor (calc op estimated_tax_safe_harbor)
    field: "Page1[0].f1_10[0]"
    type: money
  - line: "9"
    # "Required annual payment. Enter the smaller of line 5 or line 8"
    field: "Page1[0].f1_11[0]"
    type: money
  - line: "line9_more_than_line6.no"
