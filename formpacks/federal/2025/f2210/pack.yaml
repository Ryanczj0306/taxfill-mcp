# Form 2210 (2025 revision) — Underpayment of Estimated Tax by Individuals,
# Estates, and Trusts. THREE pages. Phase J JP5c: a NEW form key (f2210),
# authored from scratch against f2210--2025.pdf.
#
# ATTACHMENT-ONLY, ONE PER RETURN: "Attach to Form 1040, 1040-SR, 1040-NR, or
# 1041." There is no address block and no signature. The "Identifying number"
# is the return's, so identity_per_person is empty (the f8960 shape). The
# page-1 flowchart decides whether the form is filed at all. When box A or E
# applies (but not B, C or D), the filer files ONLY page 1, and "If you want to
# figure your penalty, you may use Part III as a worksheet and enter your penalty
# on your tax return, but file only page 1 of Form 2210".
#
# ---------------------------------------------------------------------------
# PROVENANCE — revision identity read off the RENDER, not the URL
# ---------------------------------------------------------------------------
# .cache/blanks/8be9c29f75cc_f2210--2025.pdf, 163,566 bytes, 3 pages. Printed:
# "Form 2210" "Underpayment of Estimated Tax by Individuals, Estates, and
# Trusts" "Attach to Form 1040, 1040-SR, 1040-NR, or 1041." "2025"
# "Attachment Sequence No. 06"; footer "Cat. No. 11744P" "Form 2210 (2025)
# Created 10/21/25". The instructions (i2210--2025.pdf) were read for every
# rule quoted below.
#
# ---------------------------------------------------------------------------
# TOPOLOGY — 199 widgets, 32 ReadOnly, root topmostSubform[0]; 167 mapped
# ---------------------------------------------------------------------------
#   Page1[0]: f1_1 name, f1_2 identifying number (/MaxLen 11), f1_3..f1_11
#     lines 1-9 (line 5 is an INSET box), c1_1 — ONE /Btn with two kids, the
#     "Next: Is line 9 more than line 6?" No (/1) / Yes (/2) — and c1_2..c1_6
#     for the Part II boxes A-E (independent checkboxes, each /1).
#   Page2[0].SectionATable[0].Line10..Line18: four columns each (a 4/15/25,
#     b 6/15/25, c 9/15/25, d 1/15/26). The six shaded cells are ReadOnly and
#     unmapped: 12(a), 13(a), 14(a), 16(a), 16(d), 18(d). Page2[0].f2_37 is line 19.
#   Page3[0].Part1Table[0].Line1..Line27 and PartIITable[0].Line28..Line36:
#     Schedule AI, four columns each. The PRINTED rows — line 2 and 5 (4, 2.4,
#     1.5, 1), 20 (22.5% ... 90%), 29 ($44,025 ... $176,100), 32 and 34 (the SE
#     factors) — each carry four 1-point ReadOnly widgets, unmapped, and 22(a)
#     and 25(a) are shaded ReadOnly cells.
#   Every text widget is 8-point Helvetica Bold.
#
# KEYS: Part I is the bare printed line ("1" ... "9"). The Part III table is
# "<line>.<column>" ("10.a" ... "18.c"), with line 19 bare. Schedule AI reuses
# the numbers 1-36, so it is namespaced "ai.<line>.<column>" ("ai.27.d").
# The relations below reference those dotted keys, which verify's relation
# grammar could not tokenize before this tranche: the f8949 / Schedule D /
# FinCEN 114 banners record that wall. Phase J JP5c let a LINE carry
# dot-separated segments (floats still match first, and "1a..1h" still splits).
#
# ---------------------------------------------------------------------------
# THE INDEPENDENT RECOMPUTE — from JP5a/b
# ---------------------------------------------------------------------------
# taxfill_core.penalty.form2210_lines(underpayment_penalty(...)) returns lines
# 10-19 and, with Schedule AI, every ai.* face line of JP5b's columns. Pass it
# as verify_form(..., independent=...). It works Section A the way the face
# prints it — line 11 per window ("Column (a)—payments made through April 15,
# 2025. Column (b)—payments made after April 15, 2025, through June 15, 2025"
# ...), withholding on the due dates unless box D — and raises if any line 17
# disagrees with the 6654(b)(3) FIFO ledger's underpayment. Line 19 is
# calc op underpayment_penalty's penalty in whole dollars.
#
# ---------------------------------------------------------------------------
# RELATIONS — the printed arithmetic, and what is NOT declared
# ---------------------------------------------------------------------------
# Declared:
#   - Part I 4 / 5 / 7 / 9;
#   - every Section A row (12 = previous 18, 13 = 11 + 12, 14 = previous 16 +
#     17, 15, 16, 17, 18);
#   - Schedule AI 3, 6, 8, 10, 11, 13, 15, 17, 19, 21, 22, 23, 25, 26, 27, 33,
#     35, 36, with the PRINTED factors as float literals ("* 4.0", "* 2.4"),
#     so a bare "4" is never read as line 4.
# Line 16 is declared as max(0, 14 - 13): the face's "If line 15 is zero,
# subtract line 13 from line 14. Otherwise, enter -0-" equals it whenever line
# 15 is right.
# NOT declared, each for a stated reason:
#   - 10: "If box C in Part II applies, enter the amounts from Schedule AI, line
#     27. Otherwise, enter 25% (0.25) of line 9" — conditional on a checkbox;
#   - 2, 3, 6, 8, ai.14, ai.16, ai.18: worksheet or instruction amounts;
#   - ai.24 and ai.31: true only when Schedule AI is used. On the regular
#     method the whole schedule is correctly BLANK while line 9 and the printed
#     line-29 limits are not, and blank-as-zero would FAIL every normal filing;
#   - ai.12 ("Form 1040, 1040-SR, or 1040-NR filers, enter -0-") — an input.
# SCOPE: the Schedule AI relations are the INDIVIDUAL face. An estate or trust
# uses other annualization amounts ("Estates and trusts, see instructions")
# and skips line 10, and this repo does not fill Form 1041.
#
# ---------------------------------------------------------------------------
# CROSS-FORM
# ---------------------------------------------------------------------------
#   1 == f1040nr.22 — the Line 1 instructions: "Enter the amount from your
#     2025 Form 1040, 1040-SR, or 1040-NR, line 22", and the section 965
#     CAUTION names only "Form 1040, 1040-SR, or 1041 filers: You may exclude
#     the amount of your net tax liability under section 965". So the 1040-NR
#     leg is unconditional, and the Form 1040 leg is false on the 965 path, so
#     it is not declared.
#   19 -> Form 1040 / 1040-NR line 38 is NOT declared: on the box A / E path
#     the filer files only page 1, and line 19 is blank while line 38 carries
#     the self-figured penalty.
#
# VISION AUDIT (2026-09-28): every money line filled with a sentinel (Part I:
# line x 100; Section A: line x 10 + column; Schedule AI: 1000 + line x 10 +
# column), both checkbox kinds set, all three pages rendered and READ. Every
# value is on its printed row and column, the parenthesised line-3 box and the
# line-5 inset hold their values, and the shaded cells and printed rows stay
# empty. The radio's Yes kid is ticked with No clear, and boxes A-E are each
# on their own row.

form: "2210"
jurisdiction: federal
tax_year: 2025
source_url: https://www.irs.gov/pub/irs-prior/f2210--2025.pdf
