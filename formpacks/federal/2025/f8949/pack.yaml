# Form 8949 (2025 revision) — Sales and Other Dispositions of Capital Assets.
# TWO pages; ATTACHMENT-ONLY: the masthead prints "File with your Schedule D to
# list your transactions for lines 1b, 2, 3, 8b, 9, and 10 of Schedule D."
# Schedule D is the SUMMARY; this is the DETAIL form that carries every
# transaction, and without it sched_d's 1b/2/3 and 8b/9/10 rows have nothing to
# be totals OF.
#
# PORTED 2026-08-26 from formpacks/federal/2023/f8949/pack.yaml (that pack's own
# banner says it was authored from scratch against f8949--2023.pdf). House-style
# precedent for the port discipline: formpacks/federal/2025/f8606/pack.yaml
# (Phase I1, 4d51a07) and formpacks/federal/2025/f8889/pack.yaml (Phase I2,
# ad2d32f); for the form's own conventions, this pack's parent
# formpacks/federal/2025/sched_d/pack.yaml.
#
# ###########################################################################
# THE PORT IS A FULL RE-MAP, NOT A URL SWAP — AND THE FORM ITSELF CHANGED.
# Read this block before you touch a binding.
# ###########################################################################
# THREE independent changes, each of which alone would break a name-preserving
# port, and all three landing in the 2025 revision at once:
#   1. SIX BOXES PER PART, not three. The 1099-DA digital-asset boxes arrived:
#      Part I now prints (A) (B) (C) (G) (H) (I) and Part II (D) (E) (F) (J)
#      (K) (L). Twelve /Btn widgets, not six; on-states run /1../6 per part.
#   2. ELEVEN TRANSACTION ROWS PER PART, not fourteen. The table gave up three
#      24pt bands to the text that grew around it: three extra printed box
#      rows (+36pt), the Part Note gaining a line, and the printed line-2
#      Totals text gaining a line. Measured on page 1: 14 bands spanning PDF y
#      444-108 became 11 spanning y 396-132. `<part>.1.row12/13/14.<col>` DO
#      NOT EXIST in this pack — 42 widgets fewer than 2023 (244 -> 202).
#   3. EVERY TRANSACTION CELL WAS RENAMED. The table subform split by part
#      (`Table_Line1[0]` -> `Table_Line1_Part1[0]` on page 1 and
#      `Table_Line1_Part2[0]` on page 2) and every single-digit leaf was
#      zero-padded (f1_1 -> f1_01, f1_3 -> f1_03, ... f2_9 -> f2_09).
# Consequence, stated because it is the failure a porter would actually ship:
# of the 244 fully-qualified 2023 names, SIX survive into 2025 (the six
# original checkboxes) and 238 do not. Every binding below was re-derived by
# READING THE PRINTED FACE off a sentinel render (see the VISION AUDIT block).
#
