# Form 5329 (2025 revision) — Additional Taxes on Qualified Plans (Including
# IRAs) and Other Tax-Favored Accounts. THREE pages. Phase J JR4a: a NEW form
# key (f5329), authored from scratch against f5329--2025.pdf — there is no
# earlier pack to port from. The form prices nine additional taxes, one per
# printed Part: the IRC 72(t) 10% on early distributions (Part I), the 10% on
# education / ABLE distributions (Part II), the IRC 4973 6% excise on excess
# contributions to traditional IRAs, Roth IRAs, Coverdell ESAs, Archer MSAs,
# HSAs and ABLE accounts (Parts III-VIII), and the IRC 4974 excise on an excess
# accumulation (a missed RMD — Part IX, 25%, or 10% inside the correction
# window).
#
# ATTACHED OR BY ITSELF. Printed under the title: "Attach to Form 1040,
# 1040-SR, 1040-NR, or 1041." The Instructions for Form 5329 (2025), "When and
# Where To File": "File Form 5329 with your 2025 Form 1040, 1040-SR,1040-NR, or
# 1041 by the due date, including extensions, of your tax return. If you don't
# have to file a 2025 income tax return, complete and file Form 5329 by itself
# at the time and place you would be required to file Form 1040, 1040-SR, or
# 1040-NR. If you file Form 5329 by itself, then it can't be filed
# electronically. Be sure to include your address on page 1 of the form and
# your signature and the date on page 3 of the form."
#
# ONE PERSON PER FORM. The name box reads "Name of individual subject to
# additional tax. If married filing jointly, see instructions.", and the
# instructions (Specific Instructions, "Joint returns"): "If both you and your
# spouse are required to file Form 5329, complete a separate form for each of
# you. Include the combined tax on Schedule 2 (Form 1040), line 8." That one
# sentence is why this pack declares NO cross_form rule (below).
#
# WHEN THE FORM IS NOT NEEDED AT ALL — printed above Part I: "If you only owe
# the additional 10% tax on the full amount of the early distributions, you may
# be able to report this tax directly on Schedule 2 (Form 1040), line 8, without
# filing Form 5329. See instructions." ("Who Must File": "if distribution code 1
# is correctly shown in box 7 of all your Forms 1099-R and you owe the
# additional tax on the full amount shown on each Form 1099-R, you don't have to
# file Form 5329.")
#
# ---------------------------------------------------------------------------
# PROVENANCE — revision identity read off the RENDER, not the URL
# ---------------------------------------------------------------------------
# Blank fetched with taxfill_core.fetch.fetch_blank(source_url) into the shared
# cache (.cache/blanks/0f73fcadca3a_f5329--2025.pdf, 111,659 bytes, 3 pages).
# Printed verbatim, top of page 1:
#   "Form 5329"  /  "Additional Taxes on Qualified Plans"  /  "(Including IRAs)
#   and Other Tax-Favored Accounts"
#   "Attach to Form 1040, 1040-SR, 1040-NR, or 1041."
#   "Go to www.irs.gov/Form5329 for instructions and the latest information."
#   "OMB No. 1545-0074"   "2025"   "Attachment Sequence No. 29"
# Footer, page 1: "Cat. No. 13329Q"  "Form 5329 (2025) Created 6/12/25".
# The companion instructions (i5329--2025.pdf) were read for every rule quoted
# below.
#
# ---------------------------------------------------------------------------
# TOPOLOGY — 75 widgets, 0 ReadOnly, root topmostSubform[0]
# ---------------------------------------------------------------------------
#   Page1[0]: f1_1..f1_34 (text) + c1_1 (the amended-return box, on-state /1)
#   Page2[0]: f2_1..f2_26 (text) — lines 26-51 in printed order
#   Page3[0]: f3_1..f3_13 (text) + c3_1 (preparer self-employed, on-state /1)
# All 75 are mapped. The text widgets are numbered in printed reading order,
# EXCEPT that each Part's "inset" rows (the maximum-allowable / distributions
# pair — lines 10-12, 19-20, 27-28, 35-36, 43-44) sit in a column at x 410-482,
# one to the left of the amount column at x 504-576. Every binding below was
# checked by its y-coordinate against the printed row AND on a sentinel render
# (VISION AUDIT). Widget /MaxLen exists only on f1_2 (11, the SSN), f3_9 (11,
# the PTIN) and f3_11 (10, the firm EIN); every other text widget has none.
# Every widget is 8-point Helvetica Bold.
#
# The line-2 exception-number box (f1_10, x 317-353) is a SEPARATE widget in
# the middle of the line-2 row, keyed "2.exception_number" and typed text: the
# Line 2 instructions say "In the space provided, enter the applicable exception
# number (01–23). If more than one exception applies, enter 99." Its line-2
# amount (f1_11) is the ordinary money box in the amount column.
#
# ---------------------------------------------------------------------------
# EXCEPTION 21 — the corrective distribution this pack's acceptance exercises
# ---------------------------------------------------------------------------
# Exception 21 (Line 2 table): "Corrective distributions of the income on
# excess contributions distributed before the due date of the tax return
# (including extensions). Any related IRA earnings withdrawn with excess IRA
# contributions are taxable. The 10% additional tax on early distributions does
# not apply to an IRA distribution made pursuant to the rules of section
# 408(d)(4), which consists of a contribution for that year and any earnings
# allocable to the contribution, as long as the distribution is made on or
# before the due date (including extensions) of the income tax return." And the
# Line 15 / Line 23 instructions route it: "if you hadn't reached age 59½ at the
# time of the withdrawal, include the earnings as an early distribution on line
# 1 of Form 5329 for the year in which you report the earnings. Report this
# amount on line 2 and enter exception number 21." So a withdrawn excess
# contribution's earnings appear on BOTH line 1 and line 2 — they cancel on line
# 3 — which is exactly what JR3c's estimator prices as zero (Form 1099-R box 7
# code 8 with J or 1; IRC 72(t)(2)(A)(ix)).
#
# ---------------------------------------------------------------------------
# THE INDEPENDENT RECOMPUTE — from JR3c's rules
# ---------------------------------------------------------------------------
# taxfill_core.estimate.form5329_lines(snapshot, year) returns lines 1-4 and
# 16-17 / 24-25 for ONE person, from the same code the estimator prices
# (_early_distribution_tax, _capped_excess): 10% for codes 1/J, 25% for code S
# (IRC 72(t)(1), (t)(6)), corrective earnings on lines 1 and 2, and the 6%
# excise on the smaller of the excess or the December 31 value (IRC 4973(a)).
# Pass it as verify_form(..., independent=...) and verify diffs every filled
# line against it. That is how the lines the face CANNOT tie by arithmetic
# (4, 17, 25 — a code-S caution and an off-form year-end value) are still
# recomputed rather than trusted.
#
# ---------------------------------------------------------------------------
# RELATIONS — what the face states, and what it does NOT
# ---------------------------------------------------------------------------
# Declared: every printed "Subtract / Add" row, the Part II 10%, and line 55.
# NOT declared, each for a stated reason on its row:
#   4    the printed Caution: a SIMPLE IRA amount "you may have to include 25%
#        of that amount on line 4 instead of 10%" — "4 == 3 * 0.10" is false on
#        a code-S path (the independent recompute covers it).
#   17, 25, 33, 41, 49, 51   6% of "the smaller of line N or the value of your
#        ... on December 31, 2025" — the value is not on the form.
#   54a, 54b   the reasonable-cause waiver: "Enter 'RC' and the amount of the
#        shortfall you want waived in parentheses on the dotted line next to
#        line(s) 54a and/or 54b, as applicable. Subtract this amount from the
#        total shortfall you figured without regard to the waiver, and enter the
#        result on line(s) 54a and/or 54b" — so "54a == max(0, 52a - 53a) *
#        0.10" is false whenever a waiver is requested.
# Blank-as-zero keeps the "If zero, go to line 15/23/31/39/47" skips true:
# lines 10-14 blank give 13 == 0 and 14 == 0.
#
# ---------------------------------------------------------------------------
# CROSS-FORM — none, deliberately
# ---------------------------------------------------------------------------
# Every tax line lands on "Schedule 2 (Form 1040), line 8" (55 also "or Form
# 1041, Schedule G, line 8"), and Schedule 2 line 8 is a SUM: the combined tax of
# a separate Form 5329 per spouse ("Include the combined tax on Schedule 2 (Form
# 1040), line 8") and, without any Form 5329, the code-1 shortcut's 10% entered
# directly. No single line of this form equals it. Line 44 ("from Form 8889,
# line 16") is per HSA beneficiary — a joint filing can carry two Forms 8889 —
# and line 36's Form 8853 is not shipped, so neither gets a leg.
#
# ---------------------------------------------------------------------------
# IDENTITY / SIGNATURE / MAILING
# ---------------------------------------------------------------------------
# identity_fields: [name, identifying_number]; identity_per_person:
# [identifying_number] — the form belongs to ONE spouse, so its SSN must equal
# THAT person's SSN, not the primary filer's (the f8606/f8889 shape). The
# page-1 address block is mapped but kept OUT of identity_fields: its caption
# is "Fill in Your Address Only if You Are Filing This Form by Itself and Not
# With Your Tax Return", so on the ordinary attached path every address box is
# correctly blank (verify's _identity_checks skips a blank in a pack that maps
# but does not declare the name — the f8606 precedent).
# signature: page 3, standalone_only: true — printed "Sign Here Only if You Are
# Filing This Form by Itself and Not With Your Tax Return". The "Your
# signature", "Date", "Preparer's signature" and preparer "Date" boxes have no
# widget.
# mailing: null — filed by itself it goes "at the time and place you would be
# required to file Form 1040, 1040-SR, or 1040-NR": the where-to-file table
# belongs to the return (formpacks/CONVENTIONS.md), not to this form.
#
# ---------------------------------------------------------------------------
# VISION AUDIT — a sentinel render, every page READ (2026-09-28)
# ---------------------------------------------------------------------------
# Every money line was filled with its own line number x 100 (52a -> 5201,
# 54b -> 5402), every text box with its key in capitals, both checkboxes on,
# and all three pages were rendered and read. Page 1: NAME and the SSN in their
# boxes; the address block's street, Apt. no. and city/state/ZIP rows and the
# three foreign boxes in printed order; the amended box ticked at the top right;
# "21" on the line-2 exception rule mid-row with 200 in the line-2 amount box;
# 100-900 and 1300-1800, 2100-2500 in the amount column against rows 1-9,
# 13-18, 21-25; 1000/1100/1200 and 1900/2000 in the inset column against rows
# 10-12 and 19-20, the column to their right shaded. Page 2: 2600-5100 against
# rows 26-51, the inset pairs 27-28, 35-36, 43-44 in the inset column. Page 3:
# 5201/5202/5301/5302/5401/5402/5500 against 52a-55; the preparer's name,
# PTIN, self-employed tick, firm name, firm EIN, firm address and phone each in
# its own printed box. No value landed on a neighbour's row, and no box
# clipped except the sentinel KEY strings in the three narrow foreign-address
# boxes (a key is far longer than any real entry).
