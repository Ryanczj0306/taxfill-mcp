  - { line: "3c.line_3a", field: "Page1[0].c1_33[0]", type: checkbox, on_state: "/1" }
  - { line: "3c.line_3b", field: "Page1[0].c1_34[0]", type: checkbox, on_state: "/1" }
  - { line: "4a", field: "Page1[0].f1_62[0]", type: money }
  - { line: "4b", field: "Page1[0].f1_63[0]", type: money }
  # NEW 2025 line 4c: "Check if (see instructions) 1 [ ] Rollover
  # 2 [ ] QCD  3 [ ] ___" — box 3's label IS the write-in
  - { line: "4c.rollover", field: "Page1[0].c1_35[0]", type: checkbox, on_state: "/1" }
  - { line: "4c.qcd", field: "Page1[0].c1_36[0]", type: checkbox, on_state: "/1" }
  - { line: "4c.other", field: "Page1[0].c1_37[0]", type: checkbox, on_state: "/1" }
  - { line: "4c.other_text", field: "Page1[0].f1_64[0]", type: text }
  - { line: "5a", field: "Page1[0].f1_65[0]", type: money }
  - { line: "5b", field: "Page1[0].f1_66[0]", type: money }
  # NEW 2025 line 5c: "Check if (see instructions) 1 [ ] Rollover
  # 2 [ ] PSO  3 [ ] ___"
  - { line: "5c.rollover", field: "Page1[0].c1_38[0]", type: checkbox, on_state: "/1" }
  - { line: "5c.pso", field: "Page1[0].c1_39[0]", type: checkbox, on_state: "/1" }
  - { line: "5c.other", field: "Page1[0].c1_40[0]", type: checkbox, on_state: "/1" }
  - { line: "5c.other_text", field: "Page1[0].f1_67[0]", type: text }
  - { line: "6a", field: "Page1[0].f1_68[0]", type: money }
  - { line: "6b", field: "Page1[0].f1_69[0]", type: money }
  - { line: "6c", field: "Page1[0].c1_41[0]", type: checkbox, on_state: "/1" }
  # NEW 2025 line 6d: "If you are married filing separately and lived
  # apart from your spouse the entire year (see inst.), check here"
  - { line: "6d", field: "Page1[0].c1_42[0]", type: checkbox, on_state: "/1" }
  # 2024 line 7 is 2025 line 7a; the "Schedule D not required" box moved
  # into the new 7b pair
  - { line: "7a", field: "Page1[0].f1_70[0]", type: money }
  - { line: "7b.schedule_d_not_required", field: "Page1[0].c1_43[0]", type: checkbox, on_state: "/1" }
