  - { line: "29", field: "Page2[0].f2_25[0]", type: money }
  - { line: "30", field: "Page2[0].f2_26[0]", type: money } # NEW: refundable adoption credit, Form 8839 line 13 (was "Reserved" in 2024)
  - { line: "31", field: "Page2[0].f2_27[0]", type: money }
  - { line: "32", field: "Page2[0].f2_28[0]", type: money }
  - { line: "33", field: "Page2[0].f2_29[0]", type: money }
  # --- refund / amount you owe ---
