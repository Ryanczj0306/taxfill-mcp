  - { line: "mfs_hoh_lived_apart", field: "Page1[0].c1_32[0]", type: checkbox, on_state: "/1" }
  # --- income (page 1; no Line4a-11_ReadOrder wrapper in 2025) ---
  - { line: "1a", field: "Page1[0].f1_47[0]", type: money }
  - { line: "1b", field: "Page1[0].f1_48[0]", type: money }
  - { line: "1c", field: "Page1[0].f1_49[0]", type: money }
  - { line: "1d", field: "Page1[0].f1_50[0]", type: money }
  - { line: "1e", field: "Page1[0].f1_51[0]", type: money }
  - { line: "1f", field: "Page1[0].f1_52[0]", type: money }
  - { line: "1g", field: "Page1[0].f1_53[0]", type: money }
  # 1h prints "Other earned income (see instructions). Enter type and
  # amount:" — the type write-in is NEW 2025
  - { line: "1h.type", field: "Page1[0].f1_54[0]", type: text }
  - { line: "1h", field: "Page1[0].f1_55[0]", type: money }
  - { line: "1i", field: "Page1[0].f1_56[0]", type: money }
  - { line: "1z", field: "Page1[0].f1_57[0]", type: money }
  - { line: "2a", field: "Page1[0].f1_58[0]", type: money }
  - { line: "2b", field: "Page1[0].f1_59[0]", type: money }
  - { line: "3a", field: "Page1[0].f1_60[0]", type: money }
  - { line: "3b", field: "Page1[0].f1_61[0]", type: money }
  # NEW 2025 line 3c: "Check if your child's dividends are included in
