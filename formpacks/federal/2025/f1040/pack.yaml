  - { line: "12b", field: "Page2[0].c2_3[0]", type: checkbox, on_state: "/1" } # spouse itemizes on a separate return
  - { line: "12c", field: "Page2[0].c2_4[0]", type: checkbox, on_state: "/1" } # you were a dual-status alien
  - { line: "12d.you_born_before_jan_2_1961", field: "Page2[0].c2_5[0]", type: checkbox, on_state: "/1" }
  - { line: "12d.you_blind", field: "Page2[0].c2_6[0]", type: checkbox, on_state: "/1" }
  - { line: "12d.spouse_born_before_jan_2_1961", field: "Page2[0].c2_7[0]", type: checkbox, on_state: "/1" }
  - { line: "12d.spouse_blind", field: "Page2[0].c2_8[0]", type: checkbox, on_state: "/1" }
  - { line: "12e", field: "Page2[0].f2_02[0]", type: money } # standard deduction OR itemized deductions
  - { line: "13a", field: "Page2[0].f2_03[0]", type: money } # QBI deduction (was line 13)
  - { line: "13b", field: "Page2[0].f2_04[0]", type: money } # NEW: additional deductions, Schedule 1-A line 38 (OBBBA)
  - { line: "14", field: "Page2[0].f2_05[0]", type: money }
  - { line: "15", field: "Page2[0].f2_06[0]", type: money }
  # Line 16 "Check if any from Form(s)": three independent boxes + form no.
  - { line: "16.form_8814", field: "Page2[0].c2_9[0]", type: checkbox, on_state: "/1" }
  - { line: "16.form_4972", field: "Page2[0].c2_10[0]", type: checkbox, on_state: "/1" }
  - { line: "16.form_other", field: "Page2[0].c2_11[0]", type: checkbox, on_state: "/1" }
  - { line: "16.form_other_number", field: "Page2[0].f2_07[0]", type: text, maxlen: 8 }
  - { line: "16", field: "Page2[0].f2_08[0]", type: money }
  - { line: "17", field: "Page2[0].f2_09[0]", type: money }
  - { line: "18", field: "Page2[0].f2_10[0]", type: money }
  - { line: "19", field: "Page2[0].f2_11[0]", type: money }
  - { line: "20", field: "Page2[0].f2_12[0]", type: money }
  - { line: "21", field: "Page2[0].f2_13[0]", type: money }
  - { line: "22", field: "Page2[0].f2_14[0]", type: money }
  - { line: "23", field: "Page2[0].f2_15[0]", type: money }
  - { line: "24", field: "Page2[0].f2_16[0]", type: money }
  # --- payments and refundable credits ---
  - { line: "25a", field: "Page2[0].f2_17[0]", type: money }
  - { line: "25b", field: "Page2[0].f2_18[0]", type: money }
  - { line: "25c", field: "Page2[0].f2_19[0]", type: money }
  - { line: "25d", field: "Page2[0].f2_20[0]", type: money }
  - { line: "26", field: "Page2[0].f2_21[0]", type: money }
  # NEW 2025: "If you made estimated tax payments with your former spouse
  # in 2025, enter their SSN"
  - { line: "26.former_spouse_ssn", field: "Page2[0].SSN_ReadOrder[0].f2_22[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  # 2024 line 27 is 2025 line 27a; 27b/27c are NEW checkboxes
  - { line: "27a", field: "Page2[0].f2_23[0]", type: money }
  - { line: "27b", field: "Page2[0].c2_12[0]", type: checkbox, on_state: "/1" } # clergy filing Schedule SE
  - { line: "27c", field: "Page2[0].c2_13[0]", type: checkbox, on_state: "/1" } # do not want to claim the EIC
  # Line 28 ACTC: NEW decline checkbox + amount
  - { line: "28.do_not_claim_actc", field: "Page2[0].Line28_ReadOrder[0].c2_14[0]", type: checkbox, on_state: "/1" }
