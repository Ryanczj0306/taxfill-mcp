# Schedule A (Form 1040-NR) — Itemized Deductions — tax year 2025 revision.
# Revision verified by rendering page 1 of the downloaded blank and reading
# the printed title "SCHEDULE A (Form 1040-NR) Itemized Deductions", the
# printed year 2025, Attachment Sequence No. 7A, and the footer
# "Schedule A (Form 1040-NR) 2025" before pinning pdf_sha256.
#
# Field map: introspected from this exact revision. The form is ONE page with
# 12 fillable widgets (all /Tx, none read-only, no checkboxes) — every one is
# mapped below: 2 header + 9 money lines + 1 merged line-7 write-in.
#
# 2023 -> 2025 changes (RENUMBERING TRAP — bare leaf names f1_10/f1_11
# exist in both years but mean different things; re-verified on the
# sentinel sweep):
# - The nine single-row line-7 write-ins (2023 f1_10..f1_18) merged into
#   ONE multiline widget, Line7Entry[0].f1_10[0], spanning all nine dotted
#   rows (maxlen 79 per the sched_1/sched_2/sched_a 2025 merged-write-in
#   convention). 2025 f1_11 is the line-7 MONEY amount (2023 f1_19) and
#   2025 f1_12 is the line-8 total (2023 f1_20).
# - Line 1b prints the OBBBA SALT cap: smaller of 1a or $40,000 ($20,000
#   MFS), with a new phase-down clause "If Form 1040-NR, line 11b is more
#   than $500,000 ($250,000 if married filing separately), see
#   instructions" (was $10,000/$5,000 flat in 2023).
# - Line 6 wording now excludes NET QUALIFIED DISASTER LOSSES (they go on
#   line 7 per the header Caution); still Form 4684 line 18.
# - Header/identity widgets unchanged (f1_1, f1_2 incl. /MaxLen 11).
#
# Nonresident itemized deductions: state/local income taxes (1a/1b), gifts to
# U.S. charities (2-5), casualty and theft losses (6), other itemized
# deductions (7), total (8). Unlike Schedule A (Form 1040) there is no
# medical, mortgage-interest, or sales-tax section.
form: "Schedule A (Form 1040-NR)"
jurisdiction: federal
tax_year: 2025
source_url: https://www.irs.gov/pub/irs-prior/f1040nra--2025.pdf
pdf_sha256: "fe68349199209c1d1b440bae03e0f2f29e836a77c0612f046723284db1878462"
acroform_root: "form1040-NR[0]"
fields:
  # ----- header -----
  - line: "name"                       # Name shown on Form 1040-NR
    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"         # Your identifying number (plain text box, widget /MaxLen 11 — NOT a comb)
    field: "Page1[0].f1_2[0]"
    type: text
    maxlen: 11
    format: ssn_digits_only            # digits-only keeps cross-form identity values consistent with f1040nr
  # ----- Taxes You Paid -----
  - line: "1a"                         # State and local income taxes
    field: "Page1[0].Line1a_ReadOrder[0].f1_3[0]"
    type: money
  - line: "1b"                         # Smaller of line 1a or $40,000 ($20,000 MFS); phase-down if 1040-NR 11b > $500,000
    field: "Page1[0].f1_4[0]"
    type: money
  # ----- Gifts to U.S. Charities -----
  - line: "2"                          # Gifts by cash or check (see instructions if any gift of $250 or more)
    field: "Page1[0].Line2_ReadOrder[0].f1_5[0]"
    type: money
  - line: "3"                          # Other than by cash or check (Form 8283 if over $500)
    field: "Page1[0].f1_6[0]"
    type: money
  - line: "4"                          # Carryover from prior year
    field: "Page1[0].f1_7[0]"
    type: money
  - line: "5"                          # Add lines 2 through 4
    field: "Page1[0].f1_8[0]"
    type: money
  # ----- Casualty and Theft Losses -----
  - line: "6"                          # Casualty/theft loss(es) from a federally declared disaster (other than net
    field: "Page1[0].f1_9[0]"          # qualified disaster losses), Form 4684 line 18
    type: money
  # ----- Other Itemized Deductions -----
  - line: "7.type"                     # "Other—from list in instructions. List type and amount:" — ONE multiline
    field: "Page1[0].Line7Entry[0].f1_10[0]"  # widget spanning all nine dotted rows (2023's nine write-ins merged)
    type: text
    maxlen: 79                         # merged-write-in budget (sched_1/sched_2/sched_a 2025 convention)
  - line: "7"                          # Other itemized deductions amount (right column)
    field: "Page1[0].f1_11[0]"
    type: money
  # ----- Total Itemized Deductions -----
  - line: "8"                          # Add the amounts in the far right column for lines 1b through 7 -> Form 1040-NR, line 12
    field: "Page1[0].f1_12[0]"
    type: money
relations:
  # Form-face arithmetic only. The SALT cap on line 1b IS printed on the form
  # face ("Enter the smaller of line 1a or $40,000"). CAVEATS: the printed cap
  # is $20,000 for married filing separately, and the cap phases down when
  # Form 1040-NR line 11b exceeds $500,000 ($250,000 MFS) — relations cannot
  # branch on filing status or read other forms, so the unconditional
  # $40,000 form-face text is encoded (same caveat and treatment as
  # Schedule A (Form 1040) 2025 line 5e).
  - "1b == min(1a, 40000)"
  - "5 == 2 + 3 + 4"                   # "Add lines 2 through 4"
  - "8 == 1b + 5 + 6 + 7"              # "Add the amounts in the far right column for lines 1b through 7"
cross_form:
  - "8 == f1040nr.12"                  # "Also, enter this amount on Form 1040-NR, line 12"
identity_fields: [name, identifying_number]
signature: null                        # attachment-only schedule: no signature block of its own
mailing: null                          # mailed inside the parent Form 1040-NR envelope
