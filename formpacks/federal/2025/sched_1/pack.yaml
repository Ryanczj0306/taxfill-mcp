    type: money
  - line: "12"
    field: "Page2[0].f2_02[0]"
    type: money
  - line: "13"
    field: "Page2[0].f2_03[0]"
    type: money
  - line: 14.storage_fees_only # "If claiming only storage fees (see instructions), check here"
    field: "Page2[0].c2_1[0]"
    type: checkbox
    on_state: "/1"
  - line: "14"
    field: "Page2[0].f2_04[0]"
    type: money
  - line: "15"
    field: "Page2[0].f2_05[0]"
    type: money
  - line: "16"
