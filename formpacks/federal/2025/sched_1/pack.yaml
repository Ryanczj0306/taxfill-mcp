  - line: "24k"
    field: "Page2[0].f2_26[0]"
    type: money
  - line: "24z.type" # "Other adjustments. List type and amount:" — ONE two-row multiline widget (2024's .type/.type_2 merged)
    field: "Page2[0].Line24z_ReadOrder[0].f2_27[0]"
    type: text
    maxlen: 79 # verify width-heuristic budget at fixed 8pt bold; wraps within the 2 rows
  - line: "24z"
    field: "Page2[0].f2_28[0]"
    type: money
  - line: "25"
    field: "Page2[0].f2_29[0]"
    type: money
  - line: "26"
