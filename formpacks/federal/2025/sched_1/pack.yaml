    type: money
  - line: "17"
    field: "Page2[0].f2_07[0]"
    type: money
  - line: "18"
    field: "Page2[0].f2_08[0]"
    type: money
  - line: "19a"
    field: "Page2[0].f2_09[0]"
    type: money
  - line: "19b" # alimony recipient's SSN — 9-cell comb
    field: "Page2[0].Line19b_CombField[0].f2_10[0]"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: "19c" # date of original divorce or separation agreement (MM/DD/YYYY)
