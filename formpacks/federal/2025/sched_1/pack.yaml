    type: money
  - line: 7.repaid # "If you repaid a 2025 overpayment (see instructions), check here"
    field: "Page1[0].Line7_ReadOrder[0].c1_3[0]"
    type: checkbox
    on_state: "/1"
  - line: 7.repaid_amount # "and enter amount repaid:" — informational, not in the line-10 combine
    field: "Page1[0].Line7_ReadOrder[0].f1_11[0]"
    type: money
  - line: "7"
    field: "Page1[0].f1_12[0]"
    type: money
  - line: "8a" # net operating loss — printed in parentheses, enter as negative
    field: "Page1[0].Line8a_ReadOrder[0].f1_13[0]"
    type: money
  - line: "8b"
