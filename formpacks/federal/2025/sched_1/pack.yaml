# Schedule 1 (Form 1040) 2025 — Additional Income and Adjustments to Income
#
# Attachment to Form 1040 / 1040-SR / 1040-NR (Sequence No. 01). Two parts:
# Part I Additional Income (page 1, lines 1-10), Part II Adjustments to
# Income (page 2, lines 11-26). Line 10 feeds 1040/1040-NR line 8 and line 26
# feeds 1040 line 10 — those cross_form rules live on the PARENT packs; this
# pack carries only its own form-face sum relations.
#
# Verified against the downloaded blank: page 1 prints "2025" and the title
# "Additional Income and Adjustments to Income" (read from the rendered PNG;
# footer "Created 7/25/25").
#
# 2025 revision changes vs 2024 (field names re-introspected from scratch):
# - The form is NO LONGER checkbox-free: five /Btn checkboxes were added
#   (all with on_state "/1", each its own field — no shared-field radios):
#     line 4  "Check if any from Form(s): [ ] 4797  [ ] 4684" — two
#             independent check-all-that-apply boxes (c1_1, c1_2);
#     line 7  "If you repaid a 2025 overpayment (see instructions), check
#             here [ ] and enter amount repaid:" — checkbox c1_3 plus a NEW
#             amount-repaid entry box (f1_11, informational: NOT part of the
#             line-10 combine math printed on the face);
#     line 14 "If claiming only storage fees (see instructions), check
#             here [ ]" (c2_1);
#     line 20 "If you are married filing separately and lived apart from
#             your spouse for the entire year (see instructions), check
#             here [ ]" (c2_2).
# - acroform_root CHANGED: "topmostSubform[0]" (2024 was "form1[0]").
# - Page-1 f-names from line 7 onward shifted +1 (the line-7 amount-repaid
#   insertion): 7 is now f1_12, 8a is Line8a_ReadOrder[0].f1_13, ... 8v is
#   f1_34. Name-reuse hazards: 2025's f1_12 (line 7) and f1_34 (line 8v)
#   both existed in 2024 bound to DIFFERENT lines.
# - 8z / 24z: the two description rows of 2024 (<line>.type / <line>.type_2)
#   were MERGED into one taller two-row MULTILINE widget each
#   (Line8z_ReadOrder[0].f1_35, Line24z_ReadOrder[0].f2_27) — mapped as a
#   single <line>.type. Page-2 names from the 24z amount onward shifted -1:
#   24z=f2_28, 25=f2_29, 26=f2_30.
# - OBBBA note: the One Big Beautiful Bill Act's new deductions (tips,
#   overtime, car-loan interest, enhanced senior deduction) live on the NEW
#   Schedule 1-A, attached directly to Form 1040 — nothing on Schedule 1's
#   face references Schedule 1-A, and Schedule 1's printed line numbering is
#   unchanged from 2024 (line 22 is still "Reserved for future use").
#
# Field map notes (introspected from the blank with pypdf):
# - Every fillable widget is mapped — excluded blocks: NONE (Schedule 1 has
#   no paid-preparer, signature, or other agent-excluded block).
# - 73 widgets: 68 /Tx text + 5 /Btn checkboxes (on-state "/1").
# - Lines 8a, 8d, and 8s print parentheses around the entry box: amounts are
#   entered as losses/exclusions (negative in the line-9 combine math).
#   The relations below assume values carry their sign.
# - Line 22 is printed "Reserved for future use" but its widget (f2_14) is
#   fillable; it is mapped for completeness. Agents should leave it blank —
#   the printed line-26 instruction ("add lines 11 through 23") still
#   includes it, blank counting as zero.
# - 8z / 24z description widgets are MULTILINE (Ff bit 13), two visible rows,
#   fixed 8pt Helvetica-Bold /DA (no auto-size); the filler wraps text across
#   both rows (verified by rendering a 115-char value). maxlen 79 is the
#   verify clipping-scan budget (rect 317pt / (0.5 x 8pt) = 79 chars), which
#   wraps into ~1.3 of the 2 rows — comfortably inside the pixel budget.
# - Header SSN box (f1_02) is a plain text field with MaxLen 11 (not comb);
#   format ssn_digits_only still applies so dashed input never overflows.
#   Line 19b (alimony recipient's SSN) IS a 9-cell comb field.

form: "1040 Schedule 1"
jurisdiction: federal
tax_year: 2025
source_url: https://www.irs.gov/pub/irs-prior/f1040s1--2025.pdf
pdf_sha256: "8dafec719f6a4716c259a2bdaca546d9bb9e262d1eabef885fe116a7327458fa"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header (page 1) ----
  - line: name
    field: "Page1[0].f1_01[0]"
    type: text
  - line: identifying_number
    field: "Page1[0].f1_02[0]"
    type: text
    maxlen: 11
    format: ssn_digits_only

  # ---- pre-Part I 1099-K block (page 1, unnumbered) ----
  - line: form_1099k.error_or_personal_loss
    field: "Page1[0].f1_03[0]"
    type: money

  # ---- Part I — Additional Income (page 1) ----
  - line: "1"
    field: "Page1[0].f1_04[0]"
    type: money
  - line: "2a"
    field: "Page1[0].f1_05[0]"
    type: money
  - line: "2b" # date of original divorce or separation agreement (MM/DD/YYYY)
    field: "Page1[0].f1_06[0]"
    type: text
  - line: "3"
    field: "Page1[0].f1_07[0]"
    type: money
  - line: 4.form_4797 # "Check if any from Form(s): 4797" — check-all-that-apply, NOT a radio group
    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
  - line: 4.form_4684 # "... 4684" — independent of 4.form_4797, both may be checked
    field: "Page1[0].c1_2[0]"
    type: checkbox
    on_state: "/1"
  - line: "4"
    field: "Page1[0].f1_08[0]"
    type: money
  - line: "5"
    field: "Page1[0].f1_09[0]"
    type: money
  - line: "6"
