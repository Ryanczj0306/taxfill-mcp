# PORTED 2023 -> 2025 (2026-08-16): the 2025 blank's AcroForm topology is IDENTICAL to
# 2023 — all 185 terminal fields (164 text + 21 buttons) carry the same fully-qualified
# names AND the same /Ff flags, verified programmatically against this pack's map: the
# 176 bound widgets match one-for-one, and the 9 shaded cells the map deliberately
# omits (P-007, enumerated below) carry the ReadOnly bit in this year's blank too —
# nothing else missing, nothing added.
# The digest below is the 2025 blank's, from two independent downloads of the
# irs-prior URL that hashed identically. Printed identity confirmed on the PDF text
# itself: header "SCHEDULE E (Form 1040) ... Supplemental Income and Loss ... 2025",
# question A reads "Did you make any payments in 2025 ...", and both page footers
# print "Schedule E (Form 1040) 2025". Printed line-number tokens text-diffed
# against the 2023 blank page by page: IDENTICAL on both pages (44 + 26 tokens,
# zero renumbering). Line 41's carry target ("Enter the result here and on
# Schedule 1 (Form 1040), line 5") and all four relation lines (26 "Combine
# lines 24 and 25"; 32 "Combine lines 30 and 31"; 37 "Combine lines 35 and 36";
# 41 "Combine lines 26, 32, 37, 39, and 40") re-read from the 2025 blank's own
# printed text — unchanged. This pack embeds no mailing addresses, due dates, or
# dollar thresholds, so there was nothing else to re-verify. The filled render was
# vision-audited page by page (scripts/audit_pack.py sentinel fill) before shipping.
#
# Schedule E (Form 1040), 2025 — Supplemental Income and Loss.
# (Rental real estate, royalties, partnerships, S corporations, estates, trusts, REMICs.)
#
# Base map authored via the taxfill pipeline: `taxfill introspect` (sentinel sweep) →
# vision-map workflow (every mapped widget located by reading its own field
# name printed at its position on the rendered form) → this map.
#
# Line-id convention (formpacks/CONVENTIONS.md): dot-separated, lowercase. The
# 3 repeated rental columns are suffixed .a/.b/.c; Part II/III row+column grids
# use <line>.<row>.<col> (e.g. 28.a.name, 28.a.g, 33.a.d).
#
# Structure:
#   Part I  (page 1) — Rental real estate & royalties. Header questions A & B
#                      (Yes/No), 3 repeated property columns a/b/c for lines
#                      1a/1b/2 and the income/expense grid (lines 3–22), then
#                      whole-form summary totals 23a–26.
#   Part II (page 2) — Partnerships & S corporations. Line 28 has two sub-tables:
#                      cols (a)–(f) [name/type/foreign/EIN/basis/at-risk] over
#                      rows a–d, and cols (g)–(k) [passive/nonpassive income &
#                      loss] over rows a–d, then totals 29a/29b and 30/31/32.
#   Part III(page 2) — Estates & trusts. Line 33 cols (a)/(b) name+EIN rows a/b,
#                      cols (c)–(f) rows a/b, totals 34a/34b, lines 35/36/37.
#   Part IV (page 2) — REMICs. Line 38 cols (a)–(e) single row, line 39.
#   Part V  (page 2) — Summary lines 40–43.
#
# Widget coverage: the blank defines 185 terminal widgets (164 /Tx + 21 /Btn).
# 176 are mapped — every one of the 21 buttons and 155 of the 164 text boxes.
# The remaining 9 text widgets are the shaded Part II / Part III total cells
# listed below and are deliberately EXCLUDED from the map. There are NO
# pre-printed constants on this form, so nothing else is left unmapped.
#
# Shaded ReadOnly cells — EXCLUDED from the field map (pitfall P-007). These
# are NOT "fillable widgets a taxpayer normally leaves blank": the blank sets
# the AcroForm ReadOnly bit on exactly 9 of its 185 widgets (/Ff = 8388609 =
# DoNotScroll|ReadOnly; the other 155 text widgets are 8388608 and all 21
# buttons are 0), and the printed text leaves no correct entry in any of them.
# The same 9 widgets carry the same flag in the 2023, 2024 and 2025 blanks:
#
#   29a col (g) f2_35   29a col (i) f2_37   29a col (j) f2_38
#   29b col (h) f2_41   29b col (k) f2_44
#   34a col (c) f2_60   34a col (e) f2_62
#   34b col (d) f2_65   34b col (f) f2_67
#
# Printed-text proof (all strings re-read from this year's own blank): rows
# 29a and 29b print nothing but "Totals", and what each one totals is fixed by
# the two lines directly underneath — "30  Add columns (h) and (k) of line 29a"
# and "31  Add columns (g), (i), and (j) of line 29b". Line 29a therefore
# exists only for the two INCOME columns and line 29b only for the three
# LOSS/deduction columns: the (g)/(i)/(j) totals live on 29b and the (h)/(k)
# totals on 29a, and no printed instruction anywhere on the form names
# 29a(g), 29a(i), 29a(j), 29b(h) or 29b(k). Part III has the identical shape —
# "35  Add columns (d) and (f) of line 34a" and "36  Add columns (c) and (e)
# of line 34b" — so 34a(c), 34a(e), 34b(d) and 34b(f) have no correct entry
# either. A 260-dpi render of page 2 shows all 9 printed solid grey while
# every row-mate cell is white.
#
# Which P-007 class: this is the sched_d 1a.g/8a.g class (a shaded cell the
# printed text makes NECESSARILY blank), not the sched_1-line-22 class (a
# printed, numbered line that merely stays blank). There is no numbered LINE
# behind these 9 cells that has to stay addressable, and no sum instruction
# names them, so they cannot count blank-as-zero for anything. Rows 29a, 29b,
# 34a and 34b all stay fully addressable through their unshaded, ordinary
# white money boxes: 29a.h/29a.k, 29b.g/29b.i/29b.j, 34a.d/34a.f, 34b.c/34b.e.
#
# Reproduced before removal, not theorised: fill_form(pack, {"29a.g": 11111,
# "29a.i": 22222, "29a.j": 33333, "29b.h": 44444, "29b.k": 55555,
# "34a.c": 66666, "34a.e": 77777, "34b.d": 88888, "34b.f": 99999}) wrote all
# 9 values with zero warnings, they survived a re-read of /V, a 240-dpi render
# of page 2 showed every digit sitting inside its grey cell, and verify_form
# returned 9 PASSing assertion checks with an EMPTY clipping section — the
# clipping scan skips ReadOnly widgets on the premise that the filler never
# writes them, which the mapping made false. Every gate passed the bad
# artifact. With the bindings dropped, fill_form raises its prescriptive
# "unknown line key" ValueError on all 9 keys instead.
#
# Relations: the verify-module relation evaluator only tokenizes plain digit
# line ids (e.g. 30, 31), not dotted column ids, so the declarable set is the
# whole-line combine equalities whose operands are ALL plain mapped lines.
# There are exactly FOUR of those and all four are now declared: 26 = 24+25,
# 32 = 30+31, 37 = 35+36, 41 = 26+32+37+39+40. (Through 2026-08-20 this note
# claimed 32 and 37 were the only two qualifying equalities. They were not:
# 26's and 41's operands are plain mapped lines too, and each printed line
# states its equality unconditionally — "26 ... Combine lines 24 and 25.
# Enter the result here" and "41 Total income or (loss). Combine lines 26, 32,
# 37, 39, and 40", both re-read from this year's blank. The conditional text
# on line 26 governs only WHERE the result is carried, not the arithmetic.)
#
# Sign convention — load-bearing, so stated explicitly. Which boxes the form
# pre-prints "( )" around was settled exhaustively, not by eyeballing: a scan
# of both pages for pre-printed empty-paren runs returns exactly FOUR hits,
# byte-identical in the 2023, 2024 and 2025 blanks — page 1 y=165.0 x=317.6
# (the one 104-char run that supplies all three of line 22's columns), page 1
# y=81.0 x=490.4 (line 25), page 2 y=435.0 x=490.4 (line 31) and page 2
# y=267.0 x=490.4 (line 36). Nothing else on the form is parenthesized. The
# widget geometry agrees independently of text-extraction order: those six
# widgets are inset (x0 320.8 / 407.2 / 493.6) against the 316.8 / 403.2 /
# 489.6 of every unparenthesized money box on the same page. So on PAPER
# "combine" means "subtract the magnitude" for 22/25/31/36.
#
# This engine stores SIGNED values instead: filler._render_money emits a plain
# signed integer and never accountant parens, and verify.parse_money reads both
# "-123" and "(123)" as -123. So a loss on 22/25/31/36 is submitted NEGATIVE
# and every declared "combine" is a plain sum. 32 = 30+31 and 37 = 35+36 ride
# on that via 31 and 36; 26 = 24+25 rides on the identical convention via 25.
# Line 41's five operands (26, 32, 37, 39, 40) are all unparenthesized net
# boxes, so 41 holds under any convention. The chain terminates correctly:
# the cross_form rule carries 41 to Schedule 1 line 5, itself an
# unparenthesized net "income or (loss)" box, so 41 must be signed — which is
# only true if 26/32/37 are, which is only true if 25/31/36 are.
#
# Where the caller applies the sign BY HAND — the one flip in this pack, and
# the reason it is spelled out: the deduction/loss COLUMN cells are not
# parenthesized. Line 28 cols (g)/(i)/(j) and line 33 cols (c)/(e), plus their
# 29b/34b column totals, are headed "Passive loss allowed (attach Form 8582 if
# required)", "Nonpassive loss allowed (see Schedule K-1)", "Section 179
# expense deduction from Form 4562", "Passive deduction or loss allowed" and
# "Deduction or loss from Schedule K-1" — deduction magnitudes, entered
# POSITIVE exactly as the Schedule K-1 / Form 8582 / Form 4562 they are copied
# from state them. The pre-printed "( )" on line 31 and line 36 is what turns
# that positive sum negative on paper; lines 30 and 35, which "Add" the income
# columns, carry no parens, and the parens on 31/36 exist precisely BECAUSE
# their operands are positive. So under this pack's signed convention
# 31 == -(29b.g + 29b.i + 29b.j) and 36 == -(34b.c + 34b.e). Page 1 has the
# same flip at the Form 8582 boundary: line 22 takes the allowed rental real
# estate loss NEGATIVE, while line 21 is unparenthesized but already signed by
# its own printed text ("If result is a (loss), see instructions"), so line 25
# ("Add royalty losses from line 21 and rental real estate losses from line
# 22") is a plain sum of negatives. No declared relation crosses the 29b→31 or
# 34b→36 flip — the evaluator cannot tokenize dotted column ids anyway — so
# the flip is a caller contract this pack states, not arithmetic it checks.
#
# Still NOT declared, and why: the per-column totals (line 20, 29a/29b,
# 34a/34b) use dotted column ids the evaluator cannot tokenize, and the
# conditional passive-activity limitation lines (21, 22) are not equalities.
# Both are left to the recompute engine + human review.
#
# Checkbox groups (P-008): the Yes/No pair of questions A, B and line 27 are
# each TWO independent terminal /Btn fields (c1_1[0]+c1_1[1], c1_2[0]+c1_2[1],
# c2_1[0]+c2_1[1]) — no shared parent, no /Ff radio bit, each with its own /V
# and a single on-state (/1 for Yes, /2 for No). Nothing in the PDF makes them
# exclusive, so each pair needs a `group` id (formpacks/CONVENTIONS.md) to get
# the filler's group guard and verify's at-most-one checkbox audit. `required`
# is deliberately NOT set on any of them: A and B belong to Part I (rental real
# estate and royalties) and 27 to Part II, so a filer using only the other
# parts leaves them blank — and B is answered only when A is "Yes". The
# at-most-one check applies to every group regardless of `required`.
