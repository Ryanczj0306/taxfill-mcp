  # the f8316 convention for a LETTERED question (question_a / question_b),
  # since sched_8812's numeric "line<N>" form has no lettered case and bare
  # "a"/"b" would read as this pack's .a/.b/.c property-column suffixes.
  - line: a.yes                      # Line A "Did you make any payments...1099?" — Yes
    field: Page1[0].c1_1[0]
    type: checkbox
    on_state: /1
    group: question_a
  - line: a.no                       # Line A — No
