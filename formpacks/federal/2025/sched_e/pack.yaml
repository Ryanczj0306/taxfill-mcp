relations:
  # All four whole-line combine equalities whose operands are plain mapped
  # lines. Losses are submitted SIGNED (see the sign-convention note above);
  # 25, 31 and 36 sit in pre-printed "( )" boxes on paper but are stored
  # negative here, so every "combine" below is a plain sum.
  - "26 == 24 + 25"                  # "Total rental real estate and royalty income or (loss). Combine lines 24 and 25"
  - "32 == 30 + 31"                  # "Total partnership and S corp income or (loss). Combine lines 30 and 31"
  - "37 == 35 + 36"                  # "Total estate and trust income or (loss). Combine lines 35 and 36"
  - "41 == 26 + 32 + 37 + 39 + 40"   # "Total income or (loss). Combine lines 26, 32, 37, 39, and 40" (the line the cross_form rule below carries)
cross_form:
  - "41 == sched_1.5"                # Total supplemental income/(loss) → Schedule 1 (Form 1040), line 5
identity_fields:
  - name
  - identifying_number
