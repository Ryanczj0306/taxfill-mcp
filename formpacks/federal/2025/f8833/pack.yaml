fields:
  # ---- Header block (printed above line 1; no printed line numbers) ----------
  # "Name" — ONE box on this form.
  - { line: "name", field: "Page1[0].f1_1[0]", type: text }
  # "U.S. taxpayer identifying number" — widget /MaxLen 11 (fits a dashed
  # SSN/ITIN), Q=1 centred, NOT a comb. Instructions p. 4: an individual's is
  # the SSN or ITIN; everyone else's is the EIN.
  - { line: "identifying_number", field: "Page1[0].f1_2[0]", type: text, maxlen: 11 }
  # "Reference ID number, if any (see instructions)" — foreign corporations
  # only (a number a U.S. person assigned for Form 5471/5472 reporting).
  - { line: "reference_id_number", field: "Page1[0].f1_3[0]", type: text }
  # "Address in country of residence" — MULTILINE widget. Instructions p. 4:
  # enter city, province or state, and country, in that order, and do NOT
  # abbreviate the country name.
  - { line: "home_country_address", field: "Page1[0].f1_4[0]", type: text }
  # "Address in the United States" — MULTILINE widget; the filer's U.S.
  # mailing address (P-002), hence the mailing_address identity id.
  - { line: "mailing_address", field: "Page1[0].f1_5[0]", type: text }
  # ---- "Check one or both of the following boxes as applicable." -------------
  # THREE independent checkboxes: deliberately NO shared group and NO required
  # flag on the first two (see the grouping-decision paragraph in the banner —
  # a group would FAIL the legitimate both-boxes dual-resident filing).
  - { line: "disclosure.section_6114", field: "Page1[0].BulletedList1[0].Bullet1[0].c1_1[0]", type: checkbox, on_state: "/1" }   # disclosing as required by section 6114
  - { line: "disclosure.dual_resident", field: "Page1[0].BulletedList1[0].Bullet2[0].c1_2[0]", type: checkbox, on_state: "/1" }  # dual-resident taxpayer, Regs. section 301.7701(b)-7
