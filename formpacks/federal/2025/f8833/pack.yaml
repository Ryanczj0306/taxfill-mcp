# Form 8833 — Treaty-Based Return Position Disclosure Under Section 6114 or
# 7701(b). The disclosure statement a treaty-based return position requires.
#
# WHY THIS PACK EXISTS. calc.treaty_benefit has shipped since Phase G1 and
# computes treaty exemptions for china/india/korea/canada/mexico, but until now
# no pack existed for the form that DISCLOSES a treaty position, so the engine
# could compute a position it could not help a filer report. The two halves now
# point at each other: treaty_benefit's work string names this form, the section
# 6114 requirement, the section 6712 penalty AND the Treas. Reg. 301.6114-1(c)
# waivers that decide whether the form is needed at all (see the LAW block near
# the bottom of this banner).
#
