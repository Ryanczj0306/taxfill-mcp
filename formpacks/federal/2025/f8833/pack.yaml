#
# WHAT NOW PINS THE TWO DECISIONS THIS AUDIT TURNED ON. The grouping calls above
# were prose-only until 2026-08-27 and are now enforced, because a later
# "tidy-up" that grouped the two bullets would look like an improvement and would
