# counting ink in the 300 dpi render:
#   - a 127-character row of bold lowercase 'x' renders as 115 glyph clusters
#     ending flush at the 576.0 pt box edge — i.e. ~12 characters are silently
#     LOST while clipping_scan PASSES the row (127 x 0.5 x 8 = 508 <= 511.2). The
