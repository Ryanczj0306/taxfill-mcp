# ---------------------------------------------------------------------------
# THE LAW THIS FORM IS (primary sources, each opened)
# ---------------------------------------------------------------------------
# IRC 6114(a): a taxpayer who "takes the position that a treaty of the United
# States overrules (or otherwise modifies) an internal revenue law" shall
# disclose that position on the return of tax (or a statement attached to it),
# or, "if no return of tax is required to be filed, in such form as the
# Secretary may prescribe". 6114(b) gives the Secretary waiver authority.
# Treas. Reg. 301.6114-1(d)(1) is what makes THIS form the vehicle: the taxpayer
# "must furnish ... as an attachment to the return, a fully completed Form 8833".
# 301.6114-1(a)(1)(ii): if no return would otherwise be due, one must be filed
# anyway for the disclosure, and it "need include only the taxpayer's name,
# address, taxpayer identifying number, and be signed under penalties of
# perjury (as well as the subject disclosure)".
# IRC 6712(a): failure to meet 6114 is a $1,000 penalty ($10,000 for a C
# corporation) "on each such failure" — the figure printed on this form's own
# face. 6712(b) allows waiver only on reasonable cause AND good faith;
# 6712(c) makes it additive to any other penalty.
#
# WHO ACTUALLY NEEDS THE FORM — the (b) list and the (c) waivers. This is the
# half a filer gets wrong, so it is here rather than in a comment on one line.
# 301.6114-1(b) lists eight positions for which reporting is SPECIFICALLY
# required (nondiscrimination overriding a Code provision; USRPI gain/loss;
# branch profits / excess interest; certain 861(a)(2)(B) / 884(f)(1)(A) and FDAP
# positions; no-permanent-establishment; treaty-altered SOURCE; a treaty credit
# the Code would not allow; and (b)(8) "that residency of an individual is
# determined under a treaty and apart from the Internal Revenue Code"), and it
# says outright that the list is not exhaustive.
# 301.6114-1(c) then WAIVES reporting, and two waivers decide almost every case
# in this repo's lane:
#   (c)(1)(iv) — waived for a position "that a treaty reduces or modifies the
#     taxation of income derived from dependent personal services, pensions,
#     annuities, social security and other public pensions, or income derived by
#     artistes, athletes, students, trainees or teachers". That is EVERY class
#     calc.treaty_benefit computes for a student or teacher: student_wages,
#     scholarship, payments_from_abroad, teacher_wages. The same bullet is
#     printed in this revision's own instructions, page 3, under "Exceptions
#     from reporting".
#   (c)(2) — waived for an individual whose otherwise-reportable payments or
#     income items do not exceed $10,000 in the aggregate for the taxable year
#     ($100,000 where the item is reportable only by reason of (b)(8)).
# So the live-session case that motivated this pack — a US-China Article 20(c)
# $5,000 student-wage exemption — is waived TWICE OVER: by (c)(1)(iv) as income
# derived by a student, and independently by (c)(2) at $5,000 < $10,000. Filing
# Form 8833 for it is permitted and often asked for by a payroll department, but
# it is NOT what section 6114 requires, and telling a filer otherwise is wrong
# law. Other waivers worth knowing: (c)(3) closing-agreement items, (c)(4) a
# position already disclosed by a partnership/trust/estate on its own return,
# (c)(5) withholding agents, and (c)(6)-(c)(8) the Form 1042-S waivers — each of
# which is expressly turned OFF for amounts the Form 8833 instructions
# specifically require (see (c)(6)(ii), (c)(7)(iv), (c)(8)(ii), and the
# instructions' "Reporting specifically required by Form 8833 instructions",
# page 4).
#
# THE 7701(b) HALF HAS NO WAIVER. IRC 7701(b)(1)(A) makes an alien a US resident
# by green card, substantial presence, or first-year election. Treas. Reg.
# 301.7701(b)-7(a)(1) defines a "dual resident taxpayer" (resident of the US
# under US law and of a treaty country under its law), (b) requires that filer
# to "make a return on Form 1040NR" with a statement attached, and (c)(1)(i)
# says that statement "must be in the form of a fully completed Form 8833". No
# 301.6114-1(c) waiver reaches it. Together with (b)(8) — a residency position
# determined under the treaty — these are the cases in this repo's population
# that genuinely require the form. Note the "Note:" printed on page 1 and the
# instructions' "Termination of U.S. Residency" (page 4): a dual-resident who is
# also a long-term resident and elects foreign residence is deemed to have
# expatriated under section 877A and must file Form 8854. residency.py already
# surfaces that tie-breaker path; this pack is the form it points at.
#
# ---------------------------------------------------------------------------
# relations / cross_form / signature / mailing
# ---------------------------------------------------------------------------
# relations: [] — the form face carries NO arithmetic. There is nothing to
# invent: every entry is a fact or free prose (a country, an article, Code
# sections, a payor block, an LOB provision, one Yes/No, and the explanation),
# there is not a single "add", "subtract" or "enter the amount from" anywhere on
# page 1, and the only dollar figure printed on the form is the $1,000 /
# $10,000 section 6712 penalty, which is not a filer entry at all. This is a
# legitimate empty, stated rather than fabricated.
# cross_form: [] — the form prints "Attach to your tax return" and the
# instructions name the parent (page 4: "Attach Form 8833 to your tax return
# (Form 1040-NR, Form 1120-F, etc.)"), but attachment is not a printed EQUALITY
# between two lines, and no line of this form restates a numbered line of the
# 1040/1040-NR. In particular the treaty-exempt amount that lands on Form
# 1040-NR line 1k / Schedule OI item L is not printed anywhere on Form 8833 as
# its own line — line 6 asks for it inside free prose ("the nature and amount
# (or a reasonable estimate) ... for which the treaty benefit is claimed"), and
# a relation over prose is not checkable.
# signature: null — page 1 has no signature block: no "Sign Here" area, no
# signature or date rule, and (confirmed on the render) no widget anywhere near
# the footer. The form is a statement attached to a return that carries the
# signature. When no return would otherwise be due, 301.6114-1(a)(1)(ii) makes
# the RETURN the thing signed under penalties of perjury, not this form.
# mailing: null — there is no fixed 8833 address. The instructions (page 4,
# "When and Where To File") route it to the parent return, and for a filer with
# no other return "at the IRS Service Center where you would normally file a
# return", which is state- and form-dependent. Deliberately NOT taken from
# Treas. Reg. 301.7701(b)-7(b), which still prints "Internal Revenue Service
# Center, Philadelphia, PA 19255" — stale regulation text that the form's own
# current instructions supersede; pinning it here would be a P-002-shaped
# wrong-address hazard.
#
# identity_fields: name, identifying_number, mailing_address. The header prints
# "Name" as ONE box (not first/last, unlike Form 8843), "U.S. taxpayer
# identifying number", and "Address in the United States" — the filer's US
# mailing address, so it carries the mailing_address id and participates in the
# P-002 confirmed-address check, exactly as f8843's does. "Address in country of
# residence" is home_country_address, which verify's _FILER_ADDR_EXCLUDE
# correctly keeps OUT of that check. "Reference ID number" is not identity: the
# instructions (page 4) say it is a number a US person assigned to a FOREIGN
# CORPORATION for Form 5471/5472 reporting, so it is blank on every individual
# filing and must never be compared across forms.
#
# VISION AUDIT. All five pages of the blank were rendered at 200 dpi and read;
# then the full sentinel sweep (every text widget filled with its own field
# name, every checkbox checked) was rendered at 200 dpi and read page by page.
# What it caught, and what it confirmed:
#   - CAUGHT: line 6 is 25 widgets, not the one multiline box a field-name dump
#     ("f1_12 ... f1_36") makes it look like, and f1_12 is a SHORT 252 pt tail
#     of an instruction row rather than a full-width row like the other 24. A
#     map that treated the block as one field, or that gave f1_12 a full-width
#     capacity, would have clipped a real explanation.
#   - CAUGHT: f1_8 (line 2) and f1_9 (line 3) sit at the SAME vertical band in
#     two different columns; ordering by field number alone would have swapped
#     them. The render puts f1_8's sentinel under the left-column line-2 prose
#     and f1_9's at the top of the right-column line-3 box.
#   - CAUGHT (grouping): the both-boxes case above.
#   - CAUGHT (engine, not pack): clipping_scan is wrong in BOTH directions on
#     this form — it false-FAILs the three multiline boxes on realistic address
#     values that the render shows wrapping cleanly, and it PASSED a
#     127-character wide-glyph line-6 row that the render shows clipped. Both
#     measured (see the two paragraphs above); both left as engine issues rather
#     than papered over in this pack.
#   - CONFIRMED: with BOTH bullet boxes checked at once — the dual-resident filer
#     who is also disclosing under section 6114 — verify_form reports zero FAILs,
#     which is the no-group decision proved by execution rather than argued.
#   - CONFIRMED: line 5 answered NO alone satisfies the required `line5` group
#     while the Yes box stays empty, and the two boxes render in printed order
#     (Yes at x=513.2, No at x=549.2).
#   - CONFIRMED: all five checkbox sentinels landed inside their printed boxes,
#     1a/1b did not swap, and the three multiline boxes render top-aligned inside
#     their rules.
#
# SECOND, INDEPENDENT AUDIT (2026-08-27, different reader, fresh download). The
# map above was re-derived from scratch rather than re-read: source_url was
# fetched again (94,455 bytes, sha256 e678fe7c... — identical to the pin and to
# the warm-cache copy), all five pages were re-rendered at 200 dpi and read, and
# every widget was re-introspected (47 get_fields nodes = 41 terminals + 6
