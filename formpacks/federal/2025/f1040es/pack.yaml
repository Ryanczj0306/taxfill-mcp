#   and the amount box f11_1 is NOT — its top edge grew 0.32pt
#   ([482.4,684.008,574,696.01] in 2023 -> [482.4,684.008,574,696.33] here),
#   same x extents, same bottom edge, same printed line, so the hairline taller
#   box changes nothing about the binding. (The identical 0.32pt top-edge growth
