#   2025) shifts wholesale to f11_30..f11_43 (2023: f11_31..f11_45; f11_44/45
#   no longer exist). NOTE THE COLLISION: 2023's voucher_1.amount name f11_31
#   is voucher 1's FIRST-NAME box in 2025 — filling with 2023 names would put
#   values in wrong boxes, which is why every binding here is position-derived.
# - NEW widgets, deliberately NOT mapped: four push-buttons
#   Page10[0].LinkActivator[0] and Page11[0].LinkActivator1..3[0] (one per
