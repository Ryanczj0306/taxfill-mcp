# Printed-line diff (all 12 pages, 2023 vs 2025): ZERO renumbering on the mapped
# voucher pages — which are pdf pages 10 (voucher 4) and 11 (vouchers 1-3) only;
# page 9 carries no mapped widget (it is the private ledger). Pages 10/11 carry
# no numbered lines, and their label text is identical to 2023 except the rolled
# year/dates, "Tear off here" -> "Separate here.", and the notice footer now
# reading "For Disclosure, Privacy Act, and Paperwork Reduction Act Notice".
# Per-page accounting of the REST of the diff, so no page is silently skipped:
#   - pages 2-7 (instructions/tables): the usual year + figure churn.
#   - page 8 (Estimated Tax Worksheet) carries TWO real non-year prose deltas:
