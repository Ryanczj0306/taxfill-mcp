# ---------------------------------------------------------------------------
# THE KEY CONVENTION (carried from 2023 on purpose — re-justified, not assumed)
# ---------------------------------------------------------------------------
# Form 1116 is filed PER INCOME CATEGORY and Part I is a THREE-COUNTRY COLUMN
# GRID (A/B/C) plus a Total column, while Part II is the same three countries
# turned sideways into three LINES (A/B/C) crossed with lettered columns
# (j)..(u). The house column spelling is line-first-column-second (sched_d
# `1a.d`, sched_e `3.a`), and applied literally here it gives `1a.b` / `4a.b` /
# `3a.c` — which read exactly like the printed lines `1b`, `4b`, `3c`. All three
# lookalike pairs still print on the 2025 face, so `col_a`/`col_b`/`col_c` still
# wins, and test_f1116_column_grid_keys_are_unambiguous_and_complete pins it.
#
#   Part I   <printed line>.col_a | .col_b | .col_c | .total     e.g. 3g.col_b
#   Part II  line_a | line_b | line_c  .  <printed column letter> e.g. line_a.q
#   Part III/IV  <printed line>                                   e.g. 24
#   category checkboxes   category.<category name>
#
# * `.total` is the printed "Total (Add cols. A, B, and C.)" column. Only THREE
#   rows have a widget in it — 1a (box labelled "1a"), 6 (box labelled "6") and
#   7 — re-confirmed on the 2025 sentinel render, where the Total column is
#   solid grey with no sentinel beside lines i, 1b, 2, 3a-3g, 4a, 4b and 5.
#   Nothing was dropped: those widgets do not exist.
#
# * Part II rows are keyed `line_a`/`line_b`/`line_c` because THE FORM CALLS
#   THEM LINES ("8 Add lines A through C, column (u)").
#
# * THE CROSS-PART IDENTITY, which no schema field can express: Part I column A
#   and Part II line A are THE SAME COUNTRY. Printed Note (2025 wording): "If
#   you paid taxes to only one foreign country or U.S. territory, use column A
#   in Part I and line A in Part II. If you paid taxes to more than one foreign
#   country or U.S. territory, use a separate column and line for each country
#   or territory." So `i.col_a` names the country whose taxes go on `line_a.*`.
#   `relations` is arithmetic over money lines and `identity_fields` drives a
#   cross-FORM check, so this has no home in the schema and no gate will catch a
#   caller that crosses them.
#
# * Category option names are DESCRIPTIVE, not the printed letters a..g
#   (f8949's reason: a one-character difference buried in a key is a silent
#   wrong return, and here the wrong box computes the limitation against the
#   wrong basket). Printed letter in each row's comment; Part IV is 1:1 in
#   printed order:
#     a Section 951A category income          -> category.section_951a        -> 25
#     b Foreign branch category income        -> category.foreign_branch      -> 26
#     c Passive category income               -> category.passive             -> 27
#     d General category income               -> category.general             -> 28
#     e Section 901(j) income                 -> category.section_901j        -> 29
#     f Certain income re-sourced by treaty   -> category.resourced_by_treaty -> 30
#     g Lump-sum distributions                -> category.lump_sum            -> 31
#   `c` (passive) is the box the 1099-DIV box 7 filer checks.
#
# ---------------------------------------------------------------------------
# THE TWO ONE-OF-N CHECKBOX SETS — P-008's DANGEROUS topology, still
# ---------------------------------------------------------------------------
# Both option sets are the shape formpacks/CONVENTIONS.md says "gets no
# exemption": options on SEPARATE single-widget /Btn fields. Dumped on THIS
# blank, not inherited — each of the seven category boxes is its own terminal
# field with its own /T, its own /V and exactly ONE /AP /N state, and so is each
# of the Paid/Accrued pair; there is no shared parent, no /Ff radio bit and no
# single /V. Reproduced on this blank: the sentinel sweep that turned on every
# /Btn produced, at 200-300 dpi, a page 1 with ALL SEVEN category boxes ticked
# under "Check only one box on each Form 1116" AND both "(j) Paid" and
# "(k) Accrued" ticked under "(you must check one)". With `group: category` /
# `group: credit_claimed` in place, fill_form's group guard rejects a second
# option before it opens the blank and verify's at-most-one checkbox audit FAILs
# an already-both-ticked PDF. `required: true` sits on the FIRST member of each
# group (f1040's filing_status/digital_assets spelling; a required flag on any
# member makes the whole group required). Both are unconditional on the printed
# face ("Check only one box on each Form 1116"; "(you must check one)").
# The other two /Btn widgets are INDEPENDENT single boxes, not options, so they
# carry no group: line 1b (the $250,000 alternative-basis attestation) and the
# line 10 "don't need to attach Schedule B" box.
#
# ---------------------------------------------------------------------------
# P-007 ADJUDICATION — re-measured, and every difference accounted for
# ---------------------------------------------------------------------------
# ReadOnly widgets on the 2025 blank: ZERO (as on the 2023 blank). So no P-007
# class-1 ("the widget already holds a printed constant"), class-3 ("Reserved
# for future use") or class-4 ("the FORM owns the value") question arises, and
# no row belongs in RESERVED_LINE_KEEPS or RESERVED_LINES_UNMAPPED. The /Ff
# differences that DO exist are the four Multiline bits above, adjudicated as
# geometry: bit 13 is Multiline, not ReadOnly, the flag reader walks /Parent so
# the reading is at FIELD level, and the affected boxes take an ordinary typed
# value (proved by the golden round-trip, which writes all four and re-reads
# them).
# Class 2 ("the printed text makes a correct entry impossible") was worked again
# on this face, and the answer is again that the IRS shipped NO WIDGET in any
# grey cell. Enumerated from the 2025 sentinel render + the /Rect dump: the
# Total column is grey for line i, line 1b and lines 2 through 5; the A/B/C
# cells are grey for the whole upper part of the tall line-1a row, for all of
# line 1b, and for the "Deductions and losses", "3" and "4" caption rows; and
# page 2's outer column is grey beside lines 9-13 and 25-31 while its inner
# column is grey beside lines 14, 19-24 and 32-35, plus the line-10 951A
# parenthetical row and both Caution rows. Not one of those regions holds a
# widget, so there is nothing to unmap and fill_form already raises its
# unknown-line-key ValueError for e.g. "2.total" or "1b.col_a".
# Two widget-level judgments a port could get wrong, both re-derived here:
#   * line 1a's f1_07 sits in the LABEL column on the printed dashed rules, not
#     in any country column — it is the description of the income type ("enter
#     'Dividends' on the dotted line"), which is why it is keyed
#     1a.income_type and typed text. Reading the /Rect alone would plausibly
#     have keyed it as a country cell, and this year its box is TALLER than the
#     country cells, which makes that misreading more inviting than in 2023.
#   * line 12's widget f2_04[0] is 78.4 pt wide where every sibling money box on
#     page 2's inner column is 85.65 pt, because the form prints "(" and ")"
#     around it. That geometry is the sign convention (see relations). The 2023
#     numbers were 92.8 vs 100.05 — the whole page-2 column narrowed, the
#     RELATIONSHIP did not change.
#
# ---------------------------------------------------------------------------
# TYPES — the two places this form is NOT dollars
# ---------------------------------------------------------------------------
# The masthead prints "Report all amounts in U.S. dollars except where specified
# in Part II below", and both exceptions are honoured with `type: text` rather
# than money, so verify's dollar-denominated relation math and recompute pass
# never see a non-dollar figure (f8962's precedent).
#   * Part II columns (m)(n)(o)(p) are headed "In foreign currency". Column (l)
#     is headed "Date paid or accrued" but is not a date field either — the
#     instructions put words in it: "Enter '909 taxes' in column (l) instead of
#     the date paid or accrued" (Instructions for Form 1116 (2025), p.18) and,
#     for the case this pack exists for, "Enter '1099 taxes' in column (l) of
#     Part II, and complete columns (q) through (u) for each foreign country
#     indicated in Part I" (same, p.19). Columns (q)..(u) ARE dollars and are
#     typed money.
#   * Lines 3f and 19 are RATIOS. "Divide line 3d by line 3e and round off the
#     result to at least four decimal places (for example, if your result is
#     0.8756782, round off to 0.8757, not to 0.876 or 0.88). Enter the result,
#     but don't enter more than '1.'" (Instructions, Line 3f, p.18 — verbatim
#     the same sentence as 2023.) Line 19 is printed "Divide line 17 by line 18.
#     If line 17 is more than line 18, enter '1'". verify compares relation
#     sides in WHOLE DOLLARS after IRS rounding, so a 0.8757 line would round to
#     0 and any relation touching it would be nonsense — which is also why lines
#     3g, 19 and 21 get no relation.
#
# ---------------------------------------------------------------------------
# VISION AUDIT (200/300 dpi, both pages, own eyes) — what it checked and caught
# ---------------------------------------------------------------------------
# A sentinel sweep wrote each widget's own short name into it and ticked every
# /Btn; both pages were rendered and READ, plus 300-dpi crops of the masthead,
# the category block, the Part II header and the page-1 footer. With a
# three-column grid a column shift leaves every field name intact, so the FIRST
# and LAST column of several rows were checked explicitly:
#   Part I, first column (A) vs last column (C): line i f1_04 / f1_06; line 1a
#   f1_10 / f1_12; line 3a f1_17 / f1_19; line 3g f1_35 / f1_37; line 5 f1_44 /
#   f1_46; line 6 f1_47 / f1_49 — every one inside its own printed column rule,
#   with f1_13 / f1_50 / f1_51 alone in the Total column beside the printed
#   "1a" / "6" / "7" tabs.
#   Part II, first column (l) vs last column (u), all three rows: f1_52 / f1_61,
#   f1_62 / f1_71, f1_72 / f1_81 — and the eight middle columns confirmed cell
#   by cell against the printed heads, including the (p)|(q) boundary where the
#   "In foreign currency" half hands over to "In U.S. dollars" (f1_56 is the
#   last cell under "In foreign currency", f1_57 the first under "In U.S.
#   dollars"). Each printed column rule was also computed back from the /Rect
#   dump and matched to the pixel where the render draws it, so the re-widthed
#   Part II columns are checked twice.
#   Page 2, every row: each sentinel prints immediately right of its own printed
#   line-number tab, 9 -> f2_01 through 35 -> f2_27, with f2_04 inside the
#   printed "( )" on line 12.
# CAUGHT — five things a name-only dump would have got wrong, all of them
# changing what the pack says:
#   1. Page1[0].c1_1[0] is now box g (Lump-sum distributions), not box a. The
#      name is unchanged; the /Rect and the /AP state are not. This is the whole
#      reason the port is a re-map (see TOPOLOGY DIFF (2)).
#   2. Line 1a's three description widgets became ONE Multiline box, so
#      1a.income_type_2 and _3 must not exist. The render shows a single
#      sentinel at the top of the three dashed rules and nothing on rules 2/3.
#   3. Line 1b's checkbox exports "/1" now, not "/Yes"; the Paid/Accrued pair
#      exports "/1"/"/2", not "/Paid"/"/Accrued". Carrying the 2023 states
#      forward writes nothing and warns about nothing.
#   4. Line 18 and line 20 now cite DIFFERENT lines of other forms (1040 line
#      11b minus line 14 plus Schedule 1-A line 37; Schedule 2 line 1z) — read
#      off the printed face, not from the field names, which did not move.
#   5. Line 24 lost the "skip lines 25 through 32" bypass, which is what makes
#      "33 == min(20, 32)" honest math this year and dishonest math in 2023.
# Nothing was clipped, nothing landed off-page.
#
# ---------------------------------------------------------------------------
# THE §904(j) ELECTION — this form is often NOT the answer
# ---------------------------------------------------------------------------
# IRC 904(j) lets an individual take the credit with NO Form 1116 at all, and
# for the 1099-DIV box 7 population that is usually the right branch. The engine
# answers it deterministically: calc op `foreign_tax_credit_election`
# (packages/core/src/taxfill_core/calc.py). Run it BEFORE authoring this form.
# Re-read on the 2025 instructions (p.1, "Election To Claim the Foreign Tax
# Credit Without Filing Form 1116") rather than carried over: all of the
# conditions still hold — every dollar of foreign source gross income is passive
# category income; all the income and any foreign taxes paid on it were reported
# on a qualified payee statement; total creditable foreign taxes not more than
# $300 ($600 if married filing a joint return); "This election isn't available
# to estates or trusts" (904(j)(3)(D)) — and so does what it COSTS: "You can't
# carry over unused foreign taxes paid or accrued in a year to which the
# election doesn't apply to or from any year for which you made the election",
# and the entry is still capped at "the smaller of (a) your total foreign tax,
# or (b) your regular tax". Form 1116's own line 10 and the 1-back/10-forward
# carryover it feeds are exactly what the election gives up.
#
# ---------------------------------------------------------------------------
# WHAT THIS PACK DELIBERATELY DOES NOT DO
# ---------------------------------------------------------------------------
# * Schedule B (Form 1116) (the carryover reconciliation feeding line 10) and
#   Schedule C (Form 1116) (foreign tax redeterminations) are SEPARATE forms with
#   their own OMB numbers; neither is mapped here.
# * Lines 18 and 20's printed formulas each span two other forms and subtract an
#   instruction-only item ("less any tax included on line 16 from Form 4972").
#   cross_form has no arithmetic — each side resolves as ONE ref — so a rule like
#   "20 == f1040.16 + sched_2.1z" would be SILENTLY skipped, not failed. Omitted.
# * The Worksheet for Line 18, the Worksheets A/B for foreign qualified dividends
#   and capital gains, the Worksheet for Lump-Sum Distributions and the Worksheet
#   for Home Mortgage Interest are instruction-only math and belong to calc, not
#   to `relations` (formpacks/CONVENTIONS.md).
# * P.L. 119-21's new section 960(d)(4) (10% credit disallowance on section
#   951A-related foreign taxes, for taxes paid or accrued after June 28, 2025 —
#   Instructions p.1) reaches this form only through the line 12 reduction, which
#   is an instruction-only computation. Recorded, not encoded.
#
# The 2024 revision SHIPPED CONCURRENTLY as formpacks/federal/2024/f1116 (a
# sibling agent, same day). The two packs were cross-read after the fact and
# agree where they must: both measure ZERO ReadOnly widgets, both keep the
# col_a/col_b/col_c convention, both bind box g to the bare Page1[0].c1_1[0] at
# "/7", both omit "33 == min(20, 32)" or include it exactly as their own printed
# line 24 allows (2024's face still carries the bypass sentence, so 2024 omits
# it; 2025's does not, so 2025 has it), and both keep the number of line-1a
# description keys their own blank actually has (three for 2024, one for 2025).
# The per-year pin tables in packages/core/tests/test_formpacks_federal.py hold
# all three years' rows, so no year can pass on another year's measurements.

form: "1116"
jurisdiction: federal
tax_year: 2025
source_url: "https://www.irs.gov/pub/irs-prior/f1116--2025.pdf"
pdf_sha256: "2575162f86c37297265c28d3d23ff1d99e06b2b1aeeadf396f5d6e798a8cffc5"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header ---------------------------------------------------------------
  - { line: "name", field: "Page1[0].f1_01[0]", type: text }                      # "Name"  (f1_1 in 2023 -> f1_01)
  # "Identifying number as shown on page 1 of your tax return" — plain box, NOT a
  # comb; the ONLY widget on the form with a /MaxLen (11, which fits a dashed
  # SSN "000-00-0000") and the only text widget with no /Ff at all. No
  # ssn_digits_only: the form is "(Individual, Estate, or Trust)", so this box
  # legitimately carries an estate/trust EIN too.
  - { line: "identifying_number", field: "Page1[0].f1_02[0]", type: text, maxlen: 11 }

  # ---- category of income (one-of-7; see the banner) -------------------------
  # "Use a separate Form 1116 for each category of income listed below. See
  # Categories of Income in the instructions. Check only one box on each Form
  # 1116." Printed letter in each comment; on_states READ off /AP /N on the 2025
  # blank and the a..g order re-derived from a 300-dpi crop of the printed block.
  # THE PARENT SUBFORMS ARE NEW THIS YEAR and only box g stayed on Page1[0] —
  # porting these by name checks the wrong basket (banner, TOPOLOGY DIFF (2)).
  - { line: "category.section_951a", field: "Page1[0].LineA-B_ReadOrder[0].c1_1[0]", type: checkbox, on_state: "/1", group: category, required: true }  # a Section 951A category income
  - { line: "category.foreign_branch", field: "Page1[0].LineA-B_ReadOrder[0].c1_1[1]", type: checkbox, on_state: "/2", group: category }                # b Foreign branch category income
  - { line: "category.passive", field: "Page1[0].LineC-D_ReadOrder[0].c1_1[0]", type: checkbox, on_state: "/3", group: category }                       # c Passive category income  <- the 1099-DIV box 7 box
  - { line: "category.general", field: "Page1[0].LineC-D_ReadOrder[0].c1_1[1]", type: checkbox, on_state: "/4", group: category }                       # d General category income
  - { line: "category.section_901j", field: "Page1[0].LineE-F_ReadOrder[0].c1_1[0]", type: checkbox, on_state: "/5", group: category }                  # e Section 901(j) income
  - { line: "category.resourced_by_treaty", field: "Page1[0].LineE-F_ReadOrder[0].c1_1[1]", type: checkbox, on_state: "/6", group: category }           # f Certain income re-sourced by treaty
  - { line: "category.lump_sum", field: "Page1[0].c1_1[0]", type: checkbox, on_state: "/7", group: category }                                           # g Lump-sum distributions  <- the name 2023 gave to box a
  - { line: "h", field: "Page1[0].f1_03[0]", type: text }                         # "h Resident of (name of country)"

  # ---- Part I — Taxable Income or Loss From Sources Outside the United States -
  # Three country columns A/B/C (col_a/col_b/col_c) plus the printed
  # "Total (Add cols. A, B, and C.)" column (total), which has a widget on only
  # three rows: 1a, 6 and 7. Column head reads "Foreign Country or U.S.
  # Territory" this year ("Possession" in 2023).
  # "i Enter the name of the foreign country or U.S. territory" — no Total cell;
  # the three cells are Multiline (/Ff 8392704) and two printed rows tall.
  - { line: "i.col_a", field: "Page1[0].Table_Part1_LinesI-1a[0].Rowi[0].f1_04[0]", type: text }
  - { line: "i.col_b", field: "Page1[0].Table_Part1_LinesI-1a[0].Rowi[0].f1_05[0]", type: text }
  - { line: "i.col_c", field: "Page1[0].Table_Part1_LinesI-1a[0].Rowi[0].f1_06[0]", type: text }
  # "1a Gross income from sources within country shown above and of the type
  # checked above (see instructions):" — the LABEL column prints three dashed
  # rules and, from 2025, ONE Multiline widget spans all three (2023 had three
  # separate widgets keyed 1a.income_type_1/_2/_3). It carries the description of
  # the income type ("enter 'Dividends' on the dotted line"). SINGULAR key.
  - { line: "1a.income_type", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].Line1a_Text[0].f1_07[0]", type: text }
  - { line: "1a.col_a", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].ColA[0].f1_10[0]", type: money }
  - { line: "1a.col_b", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].ColB[0].f1_11[0]", type: money }
  - { line: "1a.col_c", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].ColC[0].f1_12[0]", type: money }
  - { line: "1a.total", field: "Page1[0].f1_13[0]", type: money }                 # the box printed "1a" (left Part1Table this year)
  # "b Check if line 1a is compensation for personal services as an employee,
  # your total compensation from all sources is $250,000 or more, and you used an
  # alternative basis to determine its source. See instructions" — ONE box, in
  # the label column. /AP /N state is "/1" this year ("/Yes" in 2023). All three
  # conditions must hold and a statement must be attached (Instructions for Form
  # 1116 (2025), Line 1b, p.17).
  - { line: "1b", field: "Page1[0].Line1b_ReadOrder[0].c1_2[0]", type: checkbox, on_state: "/1" }
  # "Deductions and losses (Caution: See instructions.):"
  - { line: "2.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line2[0].f1_14[0]", type: money }   # 2 Expenses definitely related to the income on line 1a (attach statement)
  - { line: "2.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line2[0].f1_15[0]", type: money }
  - { line: "2.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line2[0].f1_16[0]", type: money }
  # "3 Pro rata share of other deductions not definitely related:"
  - { line: "3a.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3a[0].f1_17[0]", type: money }  # a Certain itemized deductions or standard deduction
  - { line: "3a.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3a[0].f1_18[0]", type: money }
  - { line: "3a.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3a[0].f1_19[0]", type: money }
  - { line: "3b.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3b[0].f1_20[0]", type: money }  # b Other deductions (attach statement)
  - { line: "3b.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3b[0].f1_21[0]", type: money }
  - { line: "3b.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3b[0].f1_22[0]", type: money }
  - { line: "3c.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3c[0].f1_23[0]", type: money }  # c Add lines 3a and 3b
  - { line: "3c.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3c[0].f1_24[0]", type: money }
  - { line: "3c.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3c[0].f1_25[0]", type: money }
  - { line: "3d.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3d[0].f1_26[0]", type: money }  # d Gross foreign source income
  - { line: "3d.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3d[0].f1_27[0]", type: money }
  - { line: "3d.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3d[0].f1_28[0]", type: money }
  - { line: "3e.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3e[0].f1_29[0]", type: money }  # e Gross income from all sources (a CONSTANT across every column and every Form 1116)
  - { line: "3e.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3e[0].f1_30[0]", type: money }
  - { line: "3e.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3e[0].f1_31[0]", type: money }
  # f "Divide line 3d by line 3e" — a DECIMAL to at least four places, max "1";
  # text, not money (see the banner's TYPES section).
  - { line: "3f.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3f[0].f1_32[0]", type: text }
  - { line: "3f.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3f[0].f1_33[0]", type: text }
  - { line: "3f.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3f[0].f1_34[0]", type: text }
  - { line: "3g.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3g[0].f1_35[0]", type: money }  # g Multiply line 3c by line 3f
  - { line: "3g.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3g[0].f1_36[0]", type: money }
  - { line: "3g.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3g[0].f1_37[0]", type: money }
  # "4 Pro rata share of interest expense (see instructions):"
  - { line: "4a.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line4a[0].f1_38[0]", type: money }  # a Home mortgage interest (use the Worksheet for Home Mortgage Interest in the instructions)
  - { line: "4a.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line4a[0].f1_39[0]", type: money }
  - { line: "4a.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line4a[0].f1_40[0]", type: money }
  - { line: "4b.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line4b[0].f1_41[0]", type: money }  # b Other interest expense
  - { line: "4b.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line4b[0].f1_42[0]", type: money }
  - { line: "4b.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line4b[0].f1_43[0]", type: money }
  - { line: "5.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line5[0].f1_44[0]", type: money }    # 5 Losses from foreign sources
  - { line: "5.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line5[0].f1_45[0]", type: money }
  - { line: "5.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line5[0].f1_46[0]", type: money }
  - { line: "6.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line6[0].f1_47[0]", type: money }    # 6 Add lines 2, 3g, 4a, 4b, and 5
  - { line: "6.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line6[0].f1_48[0]", type: money }
  - { line: "6.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line6[0].f1_49[0]", type: money }
  - { line: "6.total", field: "Page1[0].f1_50[0]", type: money }                  # the box printed "6" (left Part1Table this year)
  - { line: "7", field: "Page1[0].f1_51[0]", type: money }                        # 7 Subtract line 6 from line 1a. Enter the result here and on line 15, page 2

  # ---- Part II — Foreign Taxes Paid or Accrued ------------------------------
  # "Credit is claimed for taxes (you must check one)": (j) Paid / (k) Accrued.
  # The accounting-method election for the whole form — "If you report on the
  # cash basis, you can choose to take the credit for accrued taxes by checking
  # the 'Accrued' box in Part II on a timely filed original return. You can't
  # make this choice on an amended return. Once you choose to do this, you must
  # credit foreign taxes in the year they accrue on all future returns."
  # (Instructions for Form 1116 (2025), Part II, p.18.) Two SEPARATE /Btn fields
  # — and NOTE the states: "/1"/"/2" this year, "/Paid"/"/Accrued" in 2023.
  - { line: "credit_claimed.paid", field: "Page1[0].Part2[0].ActiveHeaderElements[0].c1_3[0]", type: checkbox, on_state: "/1", group: credit_claimed, required: true }
  - { line: "credit_claimed.accrued", field: "Page1[0].Part2[0].ActiveHeaderElements[0].c1_3[1]", type: checkbox, on_state: "/2", group: credit_claimed }
  # Rows A/B/C = the same three countries as Part I columns A/B/C (printed Note).
  # (l) Date paid or accrued — TEXT: takes a date, or "1099 taxes", or "909 taxes".
  # (m)(n)(o)(p) "In foreign currency" — TEXT, not dollars.
