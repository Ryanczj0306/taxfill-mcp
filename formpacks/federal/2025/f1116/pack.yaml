# Only math PRINTED ON THE FORM FACE, and only where every operand is a mapped
# BARE line of THIS form (formpacks/CONVENTIONS.md).
#
# WHY THERE IS NO PER-COLUMN MATH HERE, and it is not an oversight. verify's
# relation tokenizer accepts exactly two operand shapes — a printed line label
# `\d+[a-z]?` and a bare identifier `[A-Za-z_][A-Za-z0-9_]*` — and NEITHER
# admits a dot, so a DOTTED line key cannot be a relation operand at all.
# Re-reproduced against the shipped engine on THIS pack before these were
# dropped:
#   relations(pack, {}) with "3c.col_a == 3a.col_a + 3b.col_a" raises
#   ValueError: could not parse relation '3c.col_a == 3a.col_a + 3b.col_a':
#   unexpected character '.' at position 2
# That is a pack-authoring error (it raises, it does not FAIL a check), so the
# rule cannot ship silently switched off. The choice of `col_a` over sched_d's
# `.a` spelling costs nothing here: `1a.a` does not parse either, and neither
# does `line_a.u`. This is the same wall sched_d, sched_e and f8949 hit. So the
# following printed formulas are, for now, UNCHECKED by verify, and each is
# named here so the gap is visible rather than absent:
#   "c Add lines 3a and 3b"                      3c.col_* == 3a.col_* + 3b.col_*
#   "6 Add lines 2, 3g, 4a, 4b, and 5"           6.col_*  == 2 + 3g + 4a + 4b + 5
#   "Total (Add cols. A, B, and C.)"             1a.total, 6.total
#   "7 Subtract line 6 from line 1a"             7 == 1a.total - 6.total
#   "(u) ... (add cols. (q) through (t))"        line_*.u == q + r + s + t
#   "8 Add lines A through C, column (u)"        8 == line_a.u + line_b.u + line_c.u
# Widening the tokenizer's lineid/name patterns to allow dotted segments is an
# engine change to a parser every pack shares, so it stays an open issue rather
# than being smuggled in with a year port.
relations:
  - "9 == 8"                    # "9 Enter the amount from line 8." (line 8 also prints "Enter the total here and on line 9, page 2")
  - "11 == 9 + 10"              # "11 Add lines 9 and 10"
  - "14 == 11 - 12 + 13"        # "14 Combine lines 11, 12, and 13" — line 12's box is printed inside "( )" and takes the POSITIVE reduction, so it subtracts (f2441 line 14 precedent)
  - "15 == 7"                   # "15 Enter the amount from line 7" (line 7: "Enter the result here and on line 15, page 2")
  - "17 == 15 + 16"             # "17 Combine the amounts on lines 15 and 16" — line 16 is signed
  - "23 == 21 + 22"             # "23 Add lines 21 and 22"
  - "24 == min(14, 23)"         # "24 Enter the smaller of line 14 or line 23"
  - "32 == 25 + 26 + 27 + 28 + 29 + 30 + 31"   # "32 Add lines 25 through 31"
  # NEW IN THE 2025 PACK, and the reason is a PRINTED-TEXT change, not a change
  # of mind. Printed line 33 reads "Enter the smaller of line 20 or line 32" in
  # both years, and the 2023 pack deliberately omitted this rule because its own
  # printed line 24 carried the other route onto the same box ("If this is the
  # only Form 1116 you are filing, skip lines 25 through 32 and enter this
  # amount on line 33") — on a single-Form-1116 2023 return line 32 is blank,
  # blank means zero, and min(20, 0) would FAIL against a correct line 33.
  # The 2025 face DELETED that sentence, and the instructions say so in terms:
  # "Form 1116, Part IV. Lines 25 through 32 in Part IV must now be completed
  # even when filing only one Form 1116. We revised the text on Form 1116,
  # line 24, to reflect this change." (Instructions for Form 1116 (2025),
  # What's New, p.1.) So line 32 is never the blank-bypass branch on a 2025
  # form, and the printed equality is exact. Checked against the two printed
  # branches that leave an operand blank, both of which still satisfy it:
  # a category-e form (Instructions p.25: "Don't complete line 20 for separate
  # category e") has 20 and 33 both blank, so 0 == min(0, 32) only if 32 is also
  # blank — and on such a form Part IV is not the summary; a NON-summary form in
  # a multi-form filing has line 20 filled and Part IV blank, so min(20, 0) = 0
  # equals its blank line 33.
  - "33 == min(20, 32)"         # "33 Enter the smaller of line 20 or line 32"
  - "35 == 33 - 34"             # "35 Subtract line 34 from line 33. This is your foreign tax credit"
  # Bare-line printed formulas deliberately NOT relations, each for a stated
  # comparator or printed-text reason rather than an oversight:
  #   19 / 21 — line 19 is a DECIMAL RATIO ("Divide line 17 by line 18. If line
  #     17 is more than line 18, enter '1'"), and verify compares relation sides
  #     in WHOLE DOLLARS after IRS rounding, so 0.8757 becomes 0 and
  #     "21 == 20 * 19" would multiply by a rounded-away operand. (Line 3f is a
  #     ratio for the same reason, which also drops "3g == 3c * 3f".)
  #   18 / 20 — both are sums across OTHER forms; see cross_form and the banner.

# Printed carry-overs to other forms in the filing. A cross_form side resolves
# as ONE ref (no arithmetic), and a rule is SKIPPED — not failed — when the other
# form is absent from the filing.
cross_form:
  # "35 ... This is your foreign tax credit. Enter here and on Schedule 3 (Form
  # 1040), line 1; Form 1041, Schedule G, line 2a; or Form 990-T, Part III,
  # line 1a" — and Schedule 3 (2025) line 1 prints "Foreign tax credit
  # (Form 1116)", so the two lines are each other's definition. RE-DERIVED for
  # 2025 from both faces, because the Schedule 3 destination line is exactly the
  # kind of thing that moves in a renumbering year.
  # CAVEAT, recorded rather than dodged: when a filer files MORE THAN ONE Form
  # 1116, only the summarizing one has the Part IV that produces line 35, and
  # verify_filing keys items by form_key, so a multi-category filing cannot
  # currently present its second and third Form 1116 to the verifier at all.
  # Reported as an open issue; for the single-category filing this pack is aimed
  # at, the rule is exact.
  - "35 == sched_3.1"

# "Name" and "Identifying number as shown on page 1 of your tax return" — the
# parent return's, by construction, so no identity_per_person relaxation is
# needed here (unlike f8606/f8889, whose boxes are per-SPOUSE by their own
# printed headers). A separate Form 1116 per CATEGORY still belongs to the same
# filer, so every copy carries the same two values.
identity_fields: [name, identifying_number]

# Attachment-only: the form has no signature block of its own ("Attach to Form
# 1040, 1040-SR, 1040-NR, 1041, or 990-T") and is mailed inside the parent
# return's envelope — the schedules row of formpacks/CONVENTIONS.md.
signature: null
mailing: null
