# PORTED 2023 -> 2025 (2026-08-19): NEAR-port. Form 1040-X is continuous-use, and
# the **Rev. December 2025** revision is MANDATORY for a TY2025 amendment — it is
# the only revision whose lines can express TY2025 (OBBBA) taxable income, all
# re-read from this blank's own printed text: line 4a "Qualified business income
# deduction", line 4b "Deductions for tips, overtime, car loan interest, and
# seniors from Schedule 1-A (Form 1040). Attach your Schedule 1-A", line 5
# "Taxable income. Subtract the total of lines 4a and 4b from line 3" (Rev.
# 2-2024's 4a is "Reserved for future use" and it has no Schedule 1-A line, so it
# cannot carry a TY2025 amendment). New page-1 mandate printed on this revision:
# "You must: • Attach a completed Form 1040, 1040-SR, or 1040-NR, with your
# changes, for the return year entered below" — the amended 1040 is a required
# attachment, not optional.
#
# Digest provenance: blank downloaded TWICE (independent requests, 2026-08-19)
# from the source_url below; both copies digest to the pdf_sha256 below. Printed
# title "Form 1040-X (Rev. December 2025) Amended U.S. Individual Income Tax
# Return" and footer "Form 1040-X (Rev. 12-2025)" confirmed from the PDF text.
# An identical copy also sits at irs-pdf/f1040x.pdf; the year-stable irs-prior
# URL is pinned instead.
#
# Topology verdict: NEAR (vs the 2023/2024 pack's Rev. 2-2024 blank). Counts,
# each labeled with what it actually counts: AcroForm FIELD-TREE NODES (terminal
# fields PLUS container subforms) 185 -> 221; WIDGET annotations, i.e. terminal
# fields, 145 -> 166 (page 1 unchanged at 92, page 2 53 -> 74).
# Printed-line diff: the printed line-number token sequence is
# IDENTICAL (1-23 on page 1, 24-30 on page 2 — ZERO renumbering); lines 4a/4b
# were RELABELED in place (4a Reserved -> QBI; 4b QBI -> Schedule 1-A) and the
# line-5 formula changed accordingly (relation updated to 5 == 3 - 4a - 4b,
# floored at 0). All 89 Page1 mapped names are unchanged (checkbox export values
# re-verified identical: c1_1 /1, c1_2 /2, c1_3 /1../5, line-15 boxes /1).
# Page 2 was RESTRUCTURED and every affected mapping below was re-introspected
# from this blank (widget rects) and re-verified on the rendered face:
#   - Line-30 dependents table is TRANSPOSED (columns = Dependent 1..4, mirroring
#     the 2025 Form 1040): first/last name split into separate boxes
#     (Row1 f2_19..22 / Row2 f2_23..26), SSNs are 9-cell combs (Row3 f2_27..30),
#     relationship is Row4 f2_31..34, and three NEW per-dependent checkbox rows
#     exist: "(5) Check if lived with you more than half of return year"
#     (a) Yes / (b) And in the U.S. (Row5, independent boxes), "(6) Check if"
#     Full-time student / Permanently and totally disabled (Row6, independent
#     boxes), and "(7) Credits" CTC/ODC as ONE /Btn radio per dependent
#     (Row7 c2_18..c2_21, kid /1 = CTC, /2 = ODC) — line ids follow the
#     2025 f1040 pack's convention for the same table.
#   - NEW below-table checkbox c2_22: "Check if your filing status is MFS or HOH
#     and you lived apart from your spouse for the last 6 months of return year
#     ... or you are legally separated ..." -> mfs_hoh_lived_apart (same new
#     line as the 2025 Form 1040).
#   - Downstream page-2 fields renumbered: explanation f2_31 -> f2_35,
#     occupation f2_32 -> f2_36, IP PIN f2_33 -> f2_37, spouse occupation
#     f2_34 -> f2_38, spouse IP PIN f2_35 -> f2_39, phone f2_36 -> f2_40,
#     email f2_37 -> f2_41, preparer name/PTIN f2_38/39 -> f2_42/43,
#     self-employed c2_6 -> c2_23, firm name/phone/address/EIN
#     f2_40..43 -> f2_44..47.
# Lines 25 and 27 kept their field names (f2_04..06 / f2_10..12); line 25 now
# prints "Your dependent children who lived with you more than half of the
# year". The sentinel-filled render was vision-audited page by page before
# shipping (audit harness, .cache/audit).
#
# COLUMN MODEL (the defining feature of 1040-X): lines 1-15 and 24-29 have three
# columns -- A (original/as-previously-adjusted), B (net change), C (correct
# amount). The CORRECT amount (column C) is the operative value that flows to the
# IRS, so it carries the bare printed line id ("1", "4b", "11"); column A is
# "<line>.original" and column B is "<line>.net_change". The on-face math that the
# verifier checks runs on column C (e.g. "11 == 8 + 10"); the C = A + B per-line
# identity is the user's own reconciliation and is not re-derived here.
#
# Lines 16-23 are single-column (correct amount only).
# Signature/date rows are ink-only (no widgets); the form IS signed on page 2.
#
# RESERVED LINES (P-007 adjudication, 2026-08-20). FIVE printed lines on Rev.
# 12-2025 read "Reserved for future use" -- 9 on page 1, and 24, 26, 28, 29 on
# page 2 -- and none of their 15 widgets is mapped: 9 f1_46/f1_47/f1_48,
# 24 f2_01/02/03, 26 f2_07/08/09, 28 f2_13/14/15, 29 f2_16/17/18. All 15 carry
# /Ff = 8388609 (DoNotScroll|ReadOnly) and are the ONLY 15 ReadOnly widgets of
# this blank's 166; no printed sum on the form names any of them.
# DO NOT port line 4a's treatment across revisions in either direction. On this
# revision 4a is a REAL line ("Qualified business income deduction"), its three
# widgets f1_27/f1_28/f1_29 are NOT ReadOnly (/Ff = 8388608, the ordinary money
# flag) and the printed line-5 formula NAMES it -- so 4a IS mapped below. On the
# predecessor Rev. 2-2024 blank that the 2023/2024 packs pin, 4a prints
# "Reserved for future use", those same three widgets carry 8388609, and nothing
# names 4a -- so those packs correctly leave it unmapped. The ReadOnly bit moved
# exactly when the printed label did; re-read both for any future revision
# before copying this map.
