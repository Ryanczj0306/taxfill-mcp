# Form 1040-NR (2025) — U.S. Nonresident Alien Income Tax Return
#
# Mapped from the official 2025 revision (printed title "1040-NR U.S.
# Nonresident Alien Income Tax Return 2025" verified by rendering page 1 of
# the downloaded blank). The blank carries 171 AcroForm widgets — 167
# fillable plus FOUR that are flagged ReadOnly (lines 1i, 1j, 6 and 27; see
# the P-007 adjudication below) — and 164 of the 171 are mapped; the 7
# unmapped widgets are the "Paid Preparer Use Only" block, which is
# preparer-only and never filled by the taxpayer or the agent:
#   Page2[0].f2_51[0]  preparer's name
#   Page2[0].f2_52[0]  preparer's PTIN
#   Page2[0].c2_8[0]   "Check if: Self-employed" checkbox
#   Page2[0].f2_53[0]  firm's name
#   Page2[0].f2_54[0]  firm's phone no.
#   Page2[0].f2_55[0]  firm's address
#   Page2[0].f2_56[0]  firm's EIN
# The taxpayer's signature and date remain printed sign-by-hand areas with
# NO AcroForm widgets (occupation/IP-PIN boxes are mapped).
#
# 2023 -> 2025 is a WHOLESALE redesign (the OBBBA revision, mirroring the
# 2025 Form 1040; 134 -> 171 widgets; text names went zero-padded
# f1_01/f2_01 and every positional f/c name was re-introspected and
# re-verified on the printed face — NO 2023 binding survived unchanged):
# - New special-processing header row: "Filed pursuant to section
#   301.9100-2" / "Combat zone" (+ write-in) / "Deceased" MM-DD-YYYY +
#   spouse MM-DD-YYYY dates / "Other" (+ three write-in segments).
# - Filing status keeps the 5 NR statuses (Single, MFS, QSS, Estate, Trust)
#   as one c1_5 radio, on-states /1../5 in printed order.
# - Dependents table is TRANSPOSED (columns = Dependent 1..4): first/last
#   name split into separate boxes, SSNs now 9-cell combs, new per-dependent
#   "(5) Check if lived with you more than half of 2025" Yes box, and the
#   "(6) Credits" CTC/ODC pair is now a shared-field radio per dependent.
#   (No "(5)(b) and in the U.S." / student / disabled rows — 1040-only.)
# - Line 1 wage rows now match the 1040's 1a-1z ladder with NR wrinkles:
#   1h adds a type write-in; 1i and 1j are "Reserved for future use"
#   (ReadOnly widgets exist, stay mapped, leave blank — see the P-007
#   adjudication below); 1k is the treaty-exempt total from Schedule OI
#   item L line 1(e) (was also 1k in 2023).
# - New 3c (child's dividends in 3a/3b), 4c (Rollover/QCD/other + write-in)
#   and 5c (Rollover/PSO/other + write-in) checkbox rows.
# - Line 6 is still "Reserved for future use" (no NR social security line;
#   SSA benefits are NEC income) — ReadOnly widget exists, stays mapped,
#   leave blank (see the P-007 adjudication below).
# - Line 7 -> 7a; new 7b "Check if: Schedule D not required / Includes
#   child's capital gain or (loss)" + unlabeled amount write-in.
# - Line 11 -> 11a (AGI closes page 1); new 11b "Amount from line 11a"
#   re-opens page 2 (AGI re-entered across the page break).
# - The 13a/13b/13c block gains NEW 13c "Additional deductions from
#   Schedule 1-A, line 38" — the OBBBA Schedule 1-A hookup (on the 1040
#   that line is 13b; the NR keeps 13b for estate/trust exemptions).
#   14 = 12 + 13a + 13b + 13c ("Add lines 12 through 13c").
# - Line 27 ("Reserved for future use", was line 27 EIC-reserved in 2023
#   too) keeps a ReadOnly widget — mapped, leave blank (sched_1 2025 line 22
#   precedent; see the P-007 adjudication below). Line 28 ACTC adds a
#   decline-ACTC checkbox.
# - Line 30 ("Reserved for future use" in 2023) is now "Refundable adoption
#   credit from Form 8839, line 13"; 32 sums 28+29+30+31. Its widget
#   (f2_32[0]) carries NO ReadOnly bit — /Ff 8388608 — which is exactly why
#   line 30's key had to survive the reserved years.
#
# P-007 adjudication — the four "Reserved for future use" lines 1i, 1j, 6
# and 27: ALL FOUR KEPT MAPPED. These are the ONLY four ReadOnly widgets on
# this blank, so calling the map "164 of 171 fillable widgets" (the earlier
# wording) was false. Evidence taken from this year's own cached blank
# (sha256 aa1c0523…) — printed text extracted per-row from the widget's own
# rect band, /Ff read off the same blank:
#   1i  Page1[0].f1_51[0]  p1 rect y=288..300  /Ff 8388609
#         "Reserved for future use . . . . . . . . . . . . . . . 1i"
#   1j  Page1[0].f1_52[0]  p1 rect y=276..288  /Ff 8388609
#         "Reserved for future use . . . . . . . . . . . . . . . . . . . . . . . 1j"
#   6   Page1[0].f1_65[0]  p1 rect y=144..156  /Ff 8388609
#         "Reserved for future use . . . . . . . . . . . . . . . . . . . . . . . 6"
#   27  Page2[0].f2_29[0]  p2 rect y=378..390  /Ff 8388609
#         "Reserved for future use . . . . . . . . . . . . . . . 27"
# 8388609 = DoNotScroll (1<<23) | ReadOnly (1<<0). These four are the ONLY
# widgets on this blank with the ReadOnly bit set — the other 167 carry /Ff
# 0, 8388608, 8392704 or 25165824, none with bit 1. A 170-dpi render shows
# all four entry boxes shaded grey.
# Verdict by the P-007 discriminator: every one of the four is a printed,
# NUMBERED line of the form's own line ladder whose text is "Reserved for
# future use" — the reserved-LINE class, not the "necessarily blank cell"
# class (sched_d 1a.g/8a.g, sched_nec's grid cells, sched_3 line 6e). They
# stay mapped with leave-blank comments so the printed line numbers stay
# addressable; precedents sched_1 line 22 (f2_14[0], also
# ReadOnly|DoNotScroll and mapped), sched_2 2025 line 10, sched_8812 2025
# line 15. None of the four is named by any relation or cross_form rule
# here, and no calc op or extractor anywhere in this repo produces or
# consumes f1040nr "1i"/"1j"/"6"/"27" (grepped repo-wide): 1z is "Add lines
# 1a through 1h", 9 sums the named income lines, and 32 is 28+29+30+31.
# Agents leave all four blank; blank counts as zero wherever a future
# revision starts summing them.
# KNOWN CROSS-YEAR INCONSISTENCY (not this pack's to fix): the 2023 and 2024
# f1040nr packs EXCLUDE these same lines — their headers list f1_36[0] (1i),
# f1_37[0] (1j), f1_48[0] (6), f2_22[0] (27) and f2_25[0] (line 30) under
# "Excluded fillable widgets". Those blanks print the identical "Reserved for
# future use" rows with the identical /Ff 8388609, so by the discriminator
# the 2023/2024 packs are the deviants and should map all five with
# leave-blank comments (and their "Excluded fillable widgets" heading is
# doubly wrong: the widgets are ReadOnly, not fillable).
#
# Cross-form references NOT encoded (following the 2023 template's scoping):
#   line 19 (CTC/ODC) and line 28 (ACTC) reference Schedule 8812;
#   line 30 references Form 8839, line 13 (f8839 is not a form key);
#   line 12 prints "Itemized deductions (from Schedule A (Form 1040-NR)) or,
#   for certain residents of India, standard deduction" — an either/or, so
#   the unconditional rule lives on the sched_a_nr pack ("8 == f1040nr.12"),
#   not here; line 23a's Schedule NEC carry is likewise carried by the
#   sched_nec pack ("15 == f1040nr.23a").
form: 1040-NR
jurisdiction: federal
tax_year: 2025
source_url: https://www.irs.gov/pub/irs-prior/f1040nr--2025.pdf
pdf_sha256: "aa1c0523595ad630e097e41d42a35cbc7fa04685633a842d9ff4a7aa7b478c7a"
acroform_root: "topmostSubform[0]"
fields:
  # --- header: "or other tax year beginning ..., 2025, ending ..., 20.." ---
  - { line: "other_tax_year.beginning", field: "Page1[0].f1_01[0]", type: text }
  - { line: "other_tax_year.ending", field: "Page1[0].f1_02[0]", type: text }
  - { line: "other_tax_year.ending_year", field: "Page1[0].f1_03[0]", type: text, maxlen: 2 }
  # --- special-processing row (NEW 2025): late-election/combat-zone/deceased
  # designations that were handwritten across the top in prior years ---
  - { line: "special_processing.section_301_9100_2", field: "Page1[0].c1_1[0]", type: checkbox, on_state: "/1" }
  - { line: "special_processing.combat_zone", field: "Page1[0].c1_2[0]", type: checkbox, on_state: "/1" }
  # write-in after "Combat zone" (zone/deployment designation per instructions)
  - { line: "special_processing.combat_zone_entry", field: "Page1[0].f1_04[0]", type: text }
  - { line: "special_processing.deceased", field: "Page1[0].c1_3[0]", type: checkbox, on_state: "/1" }
  # deceased dates print as MM / DD / YYYY (taxpayer, then spouse; the PDF
  # sets MaxLen 2/2/4 on the parts — plain boxes, not combs)
  - { line: "special_processing.deceased_month", field: "Page1[0].f1_05[0]", type: text, maxlen: 2 }
  - { line: "special_processing.deceased_day", field: "Page1[0].f1_06[0]", type: text, maxlen: 2 }
  - { line: "special_processing.deceased_year", field: "Page1[0].f1_07[0]", type: text, maxlen: 4 }
  - { line: "special_processing.spouse_deceased_month", field: "Page1[0].f1_08[0]", type: text, maxlen: 2 }
  - { line: "special_processing.spouse_deceased_day", field: "Page1[0].f1_09[0]", type: text, maxlen: 2 }
  - { line: "special_processing.spouse_deceased_year", field: "Page1[0].f1_10[0]", type: text, maxlen: 4 }
  - { line: "special_processing.other", field: "Page1[0].c1_4[0]", type: checkbox, on_state: "/1" }
  # "Other" write-in plus two unlabeled continuation segments (dotted
  # dividers on the printed face) for additional designations
  - { line: "special_processing.other_text", field: "Page1[0].f1_11[0]", type: text }
  - { line: "special_processing.other_text_2", field: "Page1[0].f1_12[0]", type: text }
  - { line: "special_processing.other_text_3", field: "Page1[0].f1_13[0]", type: text }
  # --- identity ---
  - { line: "name.first", field: "Page1[0].f1_14[0]", type: text }
  - { line: "name.last", field: "Page1[0].f1_15[0]", type: text }
  - { line: "identifying_number", field: "Page1[0].f1_16[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  # CURRENT mailing address — where mail is received TODAY (pitfall P-002).
  # maxlen on apt/state protects the 8pt fixed-font boxes from visual
  # clipping (pitfall P-001); zip's MaxLen 10 is set by the PDF itself.
  - { line: "mailing_address.street", field: "Page1[0].f1_17[0]", type: text }
  - { line: "mailing_address.apt", field: "Page1[0].f1_18[0]", type: text, maxlen: 10 }
  - { line: "mailing_address.city", field: "Page1[0].f1_19[0]", type: text }
  - { line: "mailing_address.state", field: "Page1[0].f1_20[0]", type: text, maxlen: 15 }
  - { line: "mailing_address.zip", field: "Page1[0].f1_21[0]", type: text, maxlen: 10 }
  - { line: "mailing_address.foreign_country", field: "Page1[0].f1_22[0]", type: text }
  - { line: "mailing_address.foreign_province", field: "Page1[0].f1_23[0]", type: text }
  - { line: "mailing_address.foreign_postal_code", field: "Page1[0].f1_24[0]", type: text }
  # --- filing status: five option boxes, "Check only one box" (required).
  # ONE c1_5 radio, kid on-states in printed order (verified from the
  # blank's /AP states + widget positions, re-confirmed on the audit
  # render): /1=Single, /2=MFS, /3=QSS, /4=Estate, /5=Trust.
  - { line: "filing_status.single", field: "Page1[0].c1_5[0]", type: checkbox, on_state: "/1", group: filing_status, required: true }
  - { line: "filing_status.married_filing_separately", field: "Page1[0].c1_5[1]", type: checkbox, on_state: "/2", group: filing_status }
  - { line: "filing_status.qualifying_surviving_spouse", field: "Page1[0].c1_5[2]", type: checkbox, on_state: "/3", group: filing_status }
  - { line: "filing_status.estate", field: "Page1[0].c1_5[3]", type: checkbox, on_state: "/4", group: filing_status }
  - { line: "filing_status.trust", field: "Page1[0].c1_5[4]", type: checkbox, on_state: "/5", group: filing_status }
  # "If you checked the QSS box, enter the child's name if the qualifying
  # person is a child but not your dependent"
  - { line: "filing_status.qss_child_name", field: "Page1[0].f1_25[0]", type: text }
  # --- digital assets yes/no — the form REQUIRES an answer (pitfall P-003) ---
  - { line: "digital_assets.yes", field: "Page1[0].c1_6[0]", type: checkbox, on_state: "/1", group: digital_assets, required: true }
  - { line: "digital_assets.no", field: "Page1[0].c1_6[1]", type: checkbox, on_state: "/2", group: digital_assets }
  # --- dependents table (TRANSPOSED in 2025: columns = Dependent 1..4,
  # rows = (1) first name, (2) last name, (3) identifying number,
  # (4) relationship, (5) lived-with-you check, (6) credits) ---
  - { line: "dependents.more_than_four", field: "Page1[0].Dependents_ReadOrder[0].c1_7[0]", type: checkbox, on_state: "/1" }
  - { line: "dependent_1.first_name", field: "Page1[0].Table_Dependents[0].Row1[0].f1_26[0]", type: text }
  - { line: "dependent_2.first_name", field: "Page1[0].Table_Dependents[0].Row1[0].f1_27[0]", type: text }
  - { line: "dependent_3.first_name", field: "Page1[0].Table_Dependents[0].Row1[0].f1_28[0]", type: text }
  - { line: "dependent_4.first_name", field: "Page1[0].Table_Dependents[0].Row1[0].f1_29[0]", type: text }
  - { line: "dependent_1.last_name", field: "Page1[0].Table_Dependents[0].Row2[0].f1_30[0]", type: text }
  - { line: "dependent_2.last_name", field: "Page1[0].Table_Dependents[0].Row2[0].f1_31[0]", type: text }
  - { line: "dependent_3.last_name", field: "Page1[0].Table_Dependents[0].Row2[0].f1_32[0]", type: text }
  - { line: "dependent_4.last_name", field: "Page1[0].Table_Dependents[0].Row2[0].f1_33[0]", type: text }
  - { line: "dependent_1.ssn", field: "Page1[0].Table_Dependents[0].Row3[0].f1_34[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: "dependent_2.ssn", field: "Page1[0].Table_Dependents[0].Row3[0].f1_35[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: "dependent_3.ssn", field: "Page1[0].Table_Dependents[0].Row3[0].f1_36[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: "dependent_4.ssn", field: "Page1[0].Table_Dependents[0].Row3[0].f1_37[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: "dependent_1.relationship", field: "Page1[0].Table_Dependents[0].Row4[0].f1_38[0]", type: text }
  - { line: "dependent_2.relationship", field: "Page1[0].Table_Dependents[0].Row4[0].f1_39[0]", type: text }
  - { line: "dependent_3.relationship", field: "Page1[0].Table_Dependents[0].Row4[0].f1_40[0]", type: text }
  - { line: "dependent_4.relationship", field: "Page1[0].Table_Dependents[0].Row4[0].f1_41[0]", type: text }
  # (5) "Check if lived with you more than half of 2025" — one Yes box per
  # dependent (NEW 2025; the NR table has no "(b) and in the U.S." row)
  - { line: "dependent_1.lived_with_you", field: "Page1[0].Table_Dependents[0].Row5[0].c1_8[0]", type: checkbox, on_state: "/1" }
  - { line: "dependent_2.lived_with_you", field: "Page1[0].Table_Dependents[0].Row5[0].c1_9[0]", type: checkbox, on_state: "/1" }
  - { line: "dependent_3.lived_with_you", field: "Page1[0].Table_Dependents[0].Row5[0].c1_10[0]", type: checkbox, on_state: "/1" }
  - { line: "dependent_4.lived_with_you", field: "Page1[0].Table_Dependents[0].Row5[0].c1_11[0]", type: checkbox, on_state: "/1" }
  # (6) Credits: CTC/ODC is ONE /Btn field per dependent in 2025
  # (kid widgets /1 = child tax credit, /2 = credit for other dependents)
  - { line: "dependent_1.child_tax_credit", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent1[0].c1_12[0]", type: checkbox, on_state: "/1", group: dependent_1_credit }
  - { line: "dependent_1.credit_for_other_dependents", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent1[0].c1_12[1]", type: checkbox, on_state: "/2", group: dependent_1_credit }
  - { line: "dependent_2.child_tax_credit", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent2[0].c1_13[0]", type: checkbox, on_state: "/1", group: dependent_2_credit }
  - { line: "dependent_2.credit_for_other_dependents", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent2[0].c1_13[1]", type: checkbox, on_state: "/2", group: dependent_2_credit }
  - { line: "dependent_3.child_tax_credit", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent3[0].c1_14[0]", type: checkbox, on_state: "/1", group: dependent_3_credit }
  - { line: "dependent_3.credit_for_other_dependents", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent3[0].c1_14[1]", type: checkbox, on_state: "/2", group: dependent_3_credit }
  - { line: "dependent_4.child_tax_credit", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent4[0].c1_15[0]", type: checkbox, on_state: "/1", group: dependent_4_credit }
  - { line: "dependent_4.credit_for_other_dependents", field: "Page1[0].Table_Dependents[0].Row6[0].Dependent4[0].c1_15[1]", type: checkbox, on_state: "/2", group: dependent_4_credit }
  # --- income effectively connected with U.S. trade or business ---
  - { line: "1a", field: "Page1[0].f1_42[0]", type: money } # Total amount from Form(s) W-2, box 1
  - { line: "1b", field: "Page1[0].f1_43[0]", type: money } # Household employee wages
  - { line: "1c", field: "Page1[0].f1_44[0]", type: money } # Tip income
  - { line: "1d", field: "Page1[0].f1_45[0]", type: money } # Medicaid waiver payments
  - { line: "1e", field: "Page1[0].f1_46[0]", type: money } # Taxable dependent care benefits (Form 2441, line 26)
  - { line: "1f", field: "Page1[0].f1_47[0]", type: money } # Employer-provided adoption benefits (Form 8839, line 31)
  - { line: "1g", field: "Page1[0].f1_48[0]", type: money } # Wages from Form 8919, line 6
  # 1h prints "Other earned income (see instructions). Enter type and
  # amount:" — the type write-in is NEW 2025
  - { line: "1h.type", field: "Page1[0].f1_49[0]", type: text }
  - { line: "1h", field: "Page1[0].f1_50[0]", type: money }
  # 1i and 1j print "Reserved for future use" and their widgets are ReadOnly
  # (/Ff 8388609) + shaded — MUST BE LEFT BLANK. Kept mapped on purpose so
  # the printed line numbers stay addressable (P-007 reserved-line class,
  # sched_1 2025 line 22 precedent; adjudication in the header). Do not
  # write values here.
  - { line: "1i", field: "Page1[0].f1_51[0]", type: money } # RESERVED — leave blank
  - { line: "1j", field: "Page1[0].f1_52[0]", type: money } # RESERVED — leave blank
  # 1k Total income exempt by a treaty (Schedule OI, item L, line 1(e))
  - { line: "1k", field: "Page1[0].Line1k_ReadOrder[0].f1_53[0]", type: money }
  - { line: "1z", field: "Page1[0].f1_54[0]", type: money } # Add lines 1a through 1h
  - { line: "2a", field: "Page1[0].f1_55[0]", type: money } # Tax-exempt interest
  - { line: "2b", field: "Page1[0].f1_56[0]", type: money } # Taxable interest
  - { line: "3a", field: "Page1[0].f1_57[0]", type: money } # Qualified dividends
  - { line: "3b", field: "Page1[0].f1_58[0]", type: money } # Ordinary dividends
  # NEW 2025 line 3c: "Check if your child's dividends are included in
  # 1 [ ] Line 3a  2 [ ] Line 3b" — independent boxes
  - { line: "3c.line_3a", field: "Page1[0].c1_16[0]", type: checkbox, on_state: "/1" }
  - { line: "3c.line_3b", field: "Page1[0].c1_17[0]", type: checkbox, on_state: "/1" }
  - { line: "4a", field: "Page1[0].f1_59[0]", type: money } # IRA distributions
  - { line: "4b", field: "Page1[0].f1_60[0]", type: money } # Taxable amount
  # NEW 2025 line 4c: "Check if (see instructions) 1 [ ] Rollover
  # 2 [ ] QCD  3 [ ] ___" — box 3's label IS the write-in (36pt at 8pt font)
  - { line: "4c.rollover", field: "Page1[0].c1_18[0]", type: checkbox, on_state: "/1" }
  - { line: "4c.qcd", field: "Page1[0].c1_19[0]", type: checkbox, on_state: "/1" }
  - { line: "4c.other", field: "Page1[0].c1_20[0]", type: checkbox, on_state: "/1" }
  - { line: "4c.other_text", field: "Page1[0].f1_61[0]", type: text, maxlen: 8 }
  - { line: "5a", field: "Page1[0].f1_62[0]", type: money } # Pensions and annuities
  - { line: "5b", field: "Page1[0].f1_63[0]", type: money } # Taxable amount
  # NEW 2025 line 5c: "Check if (see instructions) 1 [ ] Rollover
  # 2 [ ] PSO  3 [ ] ___"
  - { line: "5c.rollover", field: "Page1[0].c1_21[0]", type: checkbox, on_state: "/1" }
  - { line: "5c.pso", field: "Page1[0].c1_22[0]", type: checkbox, on_state: "/1" }
  - { line: "5c.other", field: "Page1[0].c1_23[0]", type: checkbox, on_state: "/1" }
  - { line: "5c.other_text", field: "Page1[0].f1_64[0]", type: text, maxlen: 8 }
  # line 6 "Reserved for future use": ReadOnly (/Ff 8388609) + shaded — MUST
  # BE LEFT BLANK. Kept mapped so the printed line number stays addressable
  # (P-007 reserved-line class; adjudication in the header). No NR social
  # security line — SSA benefits are Schedule NEC income.
  - { line: "6", field: "Page1[0].f1_65[0]", type: money } # RESERVED — leave blank
  # 2023 line 7 is 2025 line 7a; the "Schedule D not required" box moved
  # into the new 7b pair
  - { line: "7a", field: "Page1[0].f1_66[0]", type: money } # Capital gain or (loss)
  - { line: "7b.schedule_d_not_required", field: "Page1[0].c1_24[0]", type: checkbox, on_state: "/1" }
  - { line: "7b.includes_childs_capital_gain", field: "Page1[0].c1_25[0]", type: checkbox, on_state: "/1" }
  # unlabeled write-in after "Includes child's capital gain or (loss)" —
  # the included child amount per the instructions
  - { line: "7b.childs_capital_gain_amount", field: "Page1[0].f1_67[0]", type: money }
  - { line: "8", field: "Page1[0].f1_68[0]", type: money } # Additional income from Schedule 1 (Form 1040), line 10
  - { line: "9", field: "Page1[0].f1_69[0]", type: money } # Total effectively connected income
  - { line: "10", field: "Page1[0].f1_70[0]", type: money } # Adjustments to income from Schedule 1 (Form 1040), line 26
  # 2023 line 11 is 2025 line 11a (AGI closes page 1)
  - { line: "11a", field: "Page1[0].f1_71[0]", type: money }
  # --- page 2: tax and credits ---
  # NEW 2025: page 2 re-opens with 11b "Amount from line 11a (AGI)"
  - { line: "11b", field: "Page2[0].f2_01[0]", type: money }
  - { line: "12", field: "Page2[0].f2_02[0]", type: money } # Itemized deductions (Schedule A (Form 1040-NR)) or India standard deduction
  - { line: "13a", field: "Page2[0].f2_03[0]", type: money } # QBI deduction (Form 8995/8995-A)
  - { line: "13b", field: "Page2[0].f2_04[0]", type: money } # Exemptions for estates and trusts only
  - { line: "13c", field: "Page2[0].f2_05[0]", type: money } # NEW: additional deductions, Schedule 1-A line 38 (OBBBA)
  - { line: "14", field: "Page2[0].f2_06[0]", type: money } # Add lines 12 through 13c
  - { line: "15", field: "Page2[0].f2_07[0]", type: money } # Taxable income
  # Line 16 "Check if any from Form(s)": three independent boxes + form no.
  - { line: "16.form_8814", field: "Page2[0].c2_1[0]", type: checkbox, on_state: "/1" }
  - { line: "16.form_4972", field: "Page2[0].c2_2[0]", type: checkbox, on_state: "/1" }
  - { line: "16.form_other", field: "Page2[0].c2_3[0]", type: checkbox, on_state: "/1" }
  - { line: "16.form_other_number", field: "Page2[0].f2_08[0]", type: text, maxlen: 8 }
  - { line: "16", field: "Page2[0].f2_09[0]", type: money } # Tax
  - { line: "17", field: "Page2[0].f2_10[0]", type: money } # Amount from Schedule 2 (Form 1040), line 3
  - { line: "18", field: "Page2[0].f2_11[0]", type: money } # Add lines 16 and 17
  - { line: "19", field: "Page2[0].f2_12[0]", type: money } # Child tax credit or credit for other dependents (Schedule 8812)
  - { line: "20", field: "Page2[0].f2_13[0]", type: money } # Amount from Schedule 3 (Form 1040), line 8
  - { line: "21", field: "Page2[0].f2_14[0]", type: money } # Add lines 19 and 20
  - { line: "22", field: "Page2[0].f2_15[0]", type: money } # Subtract line 21 from line 18
  - { line: "23a", field: "Page2[0].Line23a_ReadOrder[0].f2_16[0]", type: money } # Tax on income not effectively connected (Schedule NEC, line 15)
  - { line: "23b", field: "Page2[0].f2_17[0]", type: money } # Other taxes from Schedule 2 (Form 1040), line 21
  - { line: "23c", field: "Page2[0].f2_18[0]", type: money } # Transportation tax
  - { line: "23d", field: "Page2[0].f2_19[0]", type: money } # Add lines 23a through 23c
  - { line: "24", field: "Page2[0].f2_20[0]", type: money } # Total tax (add lines 22 and 23d)
  # --- payments and refundable credits ---
  - { line: "25a", field: "Page2[0].Line25_ReadOrder[0].f2_21[0]", type: money } # Federal income tax withheld: Form(s) W-2
  - { line: "25b", field: "Page2[0].f2_22[0]", type: money } # Form(s) 1099
  - { line: "25c", field: "Page2[0].f2_23[0]", type: money } # Other forms
  - { line: "25d", field: "Page2[0].f2_24[0]", type: money } # Add lines 25a through 25c
  - { line: "25e", field: "Page2[0].f2_25[0]", type: money } # Form(s) 8805
  - { line: "25f", field: "Page2[0].f2_26[0]", type: money } # Form(s) 8288-A
  - { line: "25g", field: "Page2[0].f2_27[0]", type: money } # Form(s) 1042-S
  - { line: "26", field: "Page2[0].f2_28[0]", type: money } # 2025 estimated tax payments and amount applied from 2024 return
  # line 27 "Reserved for future use": ReadOnly (/Ff 8388609) + shaded — MUST
  # BE LEFT BLANK (nonresidents cannot claim the EIC). Kept mapped so the
  # printed line number stays addressable (P-007 reserved-line class;
  # adjudication in the header). Line 32 is 28+29+30+31 — it never names 27.
  - { line: "27", field: "Page2[0].f2_29[0]", type: money } # RESERVED — leave blank
  # Line 28 ACTC: NEW decline checkbox + amount
  - { line: "28.do_not_claim_actc", field: "Page2[0].Line28_ReadOrder[0].c2_4[0]", type: checkbox, on_state: "/1" }
  - { line: "28", field: "Page2[0].f2_30[0]", type: money } # Additional child tax credit (Schedule 8812)
  - { line: "29", field: "Page2[0].f2_31[0]", type: money } # Credit for amount paid with Form 1040-C
  - { line: "30", field: "Page2[0].f2_32[0]", type: money } # NEW: refundable adoption credit, Form 8839 line 13 (was "Reserved" in 2023)
  - { line: "31", field: "Page2[0].f2_33[0]", type: money } # Amount from Schedule 3 (Form 1040), line 15
  - { line: "32", field: "Page2[0].f2_34[0]", type: money } # Total other payments and refundable credits
  - { line: "33", field: "Page2[0].f2_35[0]", type: money } # Total payments
  # --- refund ---
  - { line: "34", field: "Page2[0].f2_36[0]", type: money } # Amount you overpaid
  - { line: "35a.form_8888", field: "Page2[0].c2_5[0]", type: checkbox, on_state: "/1" }
  - { line: "35a", field: "Page2[0].f2_37[0]", type: money } # Amount of line 34 you want refunded to you
  - { line: "35b", field: "Page2[0].RoutingNo[0].f2_38[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: "35c.checking", field: "Page2[0].c2_6[0]", type: checkbox, on_state: "/1", group: "35c" }
  - { line: "35c.savings", field: "Page2[0].c2_6[1]", type: checkbox, on_state: "/2", group: "35c" }
  - { line: "35d", field: "Page2[0].AccountNo[0].f2_39[0]", type: text, maxlen: 17, comb: true, format: ssn_digits_only }
  - { line: "35e", field: "Page2[0].f2_40[0]", type: text } # Refund check mailed to an address outside the United States
  - { line: "36", field: "Page2[0].f2_41[0]", type: money } # Amount of line 34 applied to your 2026 estimated tax
  # --- amount you owe ---
  - { line: "37", field: "Page2[0].f2_42[0]", type: money } # Amount you owe (subtract line 33 from line 24)
  - { line: "38", field: "Page2[0].f2_43[0]", type: money } # Estimated tax penalty
  # --- third party designee (optional block) ---
  - { line: "third_party_designee.yes", field: "Page2[0].c2_7[0]", type: checkbox, on_state: "/1", group: third_party_designee }
  - { line: "third_party_designee.no", field: "Page2[0].c2_7[1]", type: checkbox, on_state: "/2", group: third_party_designee }
  - { line: "third_party_designee.name", field: "Page2[0].f2_44[0]", type: text }
  - { line: "third_party_designee.phone", field: "Page2[0].f2_45[0]", type: text }
  - { line: "third_party_designee.pin", field: "Page2[0].f2_46[0]", type: text, maxlen: 5, comb: true, format: ssn_digits_only }
  # --- sign here block (signature and date are handwritten; no PDF fields) ---
  - { line: "occupation", field: "Page2[0].f2_47[0]", type: text }
  - { line: "identity_protection_pin", field: "Page2[0].f2_48[0]", type: text, maxlen: 6, comb: true, format: ssn_digits_only }
  - { line: "phone", field: "Page2[0].f2_49[0]", type: text }
  - { line: "email", field: "Page2[0].f2_50[0]", type: text }
relations:
  # Math printed on the 2025 form face only (worksheets/tax tables live in calc).
  - "1z == sum(1a..1h)"                 # "Add lines 1a through 1h"
  - "9 == 1z + 2b + 3b + 4b + 5b + 7a + 8"   # "Add lines 1z, 2b, 3b, 4b, 5b, 7a, and 8"
  - "11a == 9 - 10"                     # "Subtract line 10 from line 9" (adjusted gross income)
  - "11b == 11a"                        # "Amount from line 11a (adjusted gross income)"
  - "14 == 12 + 13a + 13b + 13c"        # "Add lines 12 through 13c"
  - "15 == max(0, 11b - 14)"            # "Subtract line 14 from line 11b. If zero or less, enter -0-"
  - "18 == 16 + 17"                     # "Add lines 16 and 17"
  - "21 == 19 + 20"                     # "Add lines 19 and 20"
  - "22 == max(0, 18 - 21)"             # "Subtract line 21 from line 18. If zero or less, enter -0-"
  - "23d == sum(23a..23c)"              # "Add lines 23a through 23c"
  - "24 == 22 + 23d"                    # "Add lines 22 and 23d. This is your total tax"
  - "25d == sum(25a..25c)"              # "Add lines 25a through 25c"
  - "32 == 28 + 29 + 30 + 31"           # "Add lines 28, 29, 30, and 31"
  - "33 == 25d + 25e + 25f + 25g + 26 + 32"  # "Add lines 25d, 25e, 25f, 25g, 26, and 32"
  - "34 == max(0, 33 - 24)"             # "If line 33 is more than line 24, subtract line 24 from line 33"
  - "37 == max(0, 24 - 33)"             # "Subtract line 33 from line 24. This is the amount you owe"
cross_form:
  - "1k == sched_oi.1e"                 # "Total income exempt by a treaty from Schedule OI ... item L, line 1(e)"
  - "8 == sched_1.10"                   # "Additional income from Schedule 1 (Form 1040), line 10"
  - "10 == sched_1.26"                  # "Adjustments to income from Schedule 1 (Form 1040), line 26"
  - "13c == sched_1a.38"                # "Additional deductions from Schedule 1-A, line 38" (NEW, OBBBA)
  - "17 == sched_2.3"                   # "Amount from Schedule 2 (Form 1040), line 3"
  - "20 == sched_3.8"                   # "Amount from Schedule 3 (Form 1040), line 8"
  - "23b == sched_2.21"                 # "Other taxes ... from Schedule 2 (Form 1040), line 21"
  - "31 == sched_3.15"                  # "Amount from Schedule 3 (Form 1040), line 15"
# The form splits name and address; identity checks compare the split parts.
# state/zip stay out: they are legitimately blank for foreign-address filers.
identity_fields:
  - name.first
  - name.last
  - identifying_number
  - mailing_address.street
  - mailing_address.city
signature:
  page: 2
  standalone_only: false
mailing:
  # Verified 2026-06-11 against the official IRS international where-to-file
  # page for Form 1040-NR (verify_url below); unchanged for the 2025 revision.
  no_payment: "Department of the Treasury, Internal Revenue Service, Austin, TX 73301-0215, USA"
  with_payment: "Internal Revenue Service, P.O. Box 1303, Charlotte, NC 28201-1303, USA"
  verify_url: "https://www.irs.gov/filing/international-where-to-file-forms-1040-nr-1040-pr-and-1040-ss-addresses-for-taxpayers-and-tax-professionals"
