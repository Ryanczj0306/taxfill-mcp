# 1040-NR, line 4b." That is an ADDITIVE instruction, not an equality, and the
# repo has no grammar for it:
#   * f1040 2025 line 4b is "IRA distributions ... b Taxable amount" and
#     aggregates all three of these lines plus any other taxable IRA
#     distribution, so no single "== f1040.4b" rule can be true;
#   * the instructions make the conditionality explicit — "Line 18: If your
#     entry on line 18 is zero or less, don't include the result on 2025 Form
#     1040, 1040-SR, or 1040-NR, line 4b" (Instructions for Form 8606 (2025)) —
#     so even the sum is not unconditional.
# A rule like "15c == f1040.4b" would therefore be a FALSE check, which is
# worse than none. Lines 15b and 25b likewise print "Also, enter this amount on
# 2025 Form(s) 8915-F, line 18 [line 19], as applicable" — no f8915f pack
# exists, and adding a CROSS_FORM_TARGET_ALLOWLIST row for a rule that is
# "as applicable" (i.e. conditional) would be the same false check.
#
# ---------------------------------------------------------------------------
# CALC INTEGRATION (ROADMAP I1) — the seam, re-measured on THIS pack
# ---------------------------------------------------------------------------
# calc.ira_pro_rata's IraProRataResult.form_8606_lines emits 19 keys. 18 of them
# are EXACT line keys of this pack (1-9, 11, 12, 13, 14, 15a, 15c, 16, 17, 18).
# The 19th is "10", and it structurally cannot have a pack key: the printed
# ratio row is two widgets straddling the form's own decimal point (see
# 10.whole / 10.dec below). Reproduced against THIS pack, not inherited:
# fill_form(pack, result.form_8606_lines) raises "unknown line key(s) ['10']";
# splitting the ratio into 10.whole / 10.dec — and coercing the display strings
# ("$7,000") to numbers, since form_8606_lines is documented as a transcription
# dict, not a fill payload — fills 20 fields with zero warnings and verify_form
# returns ok=True with all 9 declared relations PASSing on the op's own numbers.
# Measured with ira_pro_rata(dec31_total_value=30000, amount_converted=7000,
# nondeductible_contributions_this_year=7000, year=2025), which emits line 10 =
# "0.189"; the render of that fill prints "x 0 . 189", exactly as a filer writes
# it, and the clipping scan reports no non-PASS check.
# calc.py's _F8606_VERIFIED_REVISIONS covers 2019-2025 and its comment states
# that Part I lines 1-14 and Part II lines 16-18 are IDENTICAL across those
# revisions. This port CONFIRMS that claim for the line NUMBERS (2025 Part I
# still runs 1-15c and Part II still 16-18) — and shows why it is not a licence
# to port field NAMES: the numbering held while 21 of 45 widget names were
# renamed, three printed lines changed page, and 9 surviving names changed
# meaning.
#
# ---------------------------------------------------------------------------
# IDENTITY FIELDS — [name, identifying_number], and the per-spouse caveat
# ---------------------------------------------------------------------------
# House practice for a per-spouse attachment (sched_se, sched_c, f2555, f8960
# all ship exactly [name, identifying_number]) is followed here. The printed
# face and the instructions both make the per-spouse scope explicit:
#   * printed on the face: "Name. If married, file a separate form for each
#     spouse required to file 2025 Form 8606. See instructions."
#   * Instructions for Form 8606 (2025), "Who Must File" / Specific
#     Instructions: a separate Form 8606 is filed for each spouse required to
#     file one, and only that spouse's name and SSN go on it.
# The page-1 ADDRESS block is mapped but deliberately kept OUT of
# identity_fields: the printed side caption is "Fill in Your Address Only if
# You Are Filing This Form by Itself and Not With Your Tax Return", so on the
# ordinary attached path every address box is CORRECTLY blank, and a blank
# identity field FAILs verification. The instructions confirm the same split —
# Instructions for Form 8606 (2025), "When and Where To File": "If you aren't
# required to file an income tax return but are required to file 2025 Form
# 8606, sign 2025 Form 8606 and send it to the IRS at the same time and place
# you would otherwise file 2025 Form 1040, 1040-SR, or 1040-NR. Be sure to
# include your address on page 1 of the form and your signature and the date on
# page 2 of the form."
# ENGINE INTERACTION the integrator should see — the SAME gap the 2023 pack
# reported, and it travels to this year unchanged: verify's _identity_checks
# takes the UNION of every pack's identity_fields and then evaluates each name
# against every pack that MAPS it, even a pack that did not declare it.
# f1040nr (all shipped years) declares mailing_address.street, so
# verify_filing([f1040nr, f8606]) with the 8606 ATTACHED — its address block
# correctly blank per the printed caption — returns ok=False and "FAIL
# mailing_address.street: identity field ... differs across the filing".
# (mailing_address.city does NOT collide, because this form's combined box is
# keyed .city_state_zip.) The off-convention spelling `home_address` was
# considered and rejected in 2023 for colliding with nj1040; the collision is
# structural in _identity_checks, so this pack keeps the house-standard keys
# and the gap is reported rather than dodged.
#
# ---------------------------------------------------------------------------
# SIGNATURE / MAILING
# ---------------------------------------------------------------------------
# signature: page 2, standalone_only: true — the f8843 shape, and here the
# printed caption states it verbatim: "Sign Here Only if You Are Filing This
# Form by Itself and Not With Your Tax Return". Attached to a 1040/1040-SR/
# 1040-NR the form is NOT separately signed.
# mailing: null — the standalone address is "the same time and place you would
# otherwise file 2025 Form 1040, 1040-SR, or 1040-NR" (Instructions for Form
# 8606 (2025), "When and Where To File"), i.e. the STATE-dependent Form 1040
# where-to-file table. Per formpacks/CONVENTIONS.md that address belongs to the
# knowledge layer, which is why the f1040 pack itself ships mailing: null; a
# fixed pair of addresses here would be invented.
form: "8606"
jurisdiction: federal
tax_year: 2025
source_url: https://www.irs.gov/pub/irs-prior/f8606--2025.pdf
pdf_sha256: "748a2bf2ef45918eac8d48fab8b1958c8c0c24102b7d2103c78f6f92a69486ae"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header (page 1) ------------------------------------------------------
  # Every name below is zero-padded in this revision (2023: f1_1[0]).
  - line: "name"                            # "Name. If married, file a separate form for each spouse required to file 2025 Form 8606. See instructions."
    field: "Page1[0].f1_01[0]"
    type: text
  - line: "identifying_number"              # "Your social security number" — plain box, NOT a comb; widget /MaxLen 11 (fits a dashed SSN)
    field: "Page1[0].f1_02[0]"
    type: text
    maxlen: 9
    format: ssn_digits_only                 # digits only keeps cross-form identity values consistent (f8960/sched_oi house style)

  # ---- address block: printed "Fill in Your Address Only if You Are Filing
  # ---- This Form by Itself and Not With Your Tax Return" (blank when attached)
  - line: "mailing_address.street"          # "Home address (number and street, or P.O. box if mail is not delivered to your home)"
    field: "Page1[0].f1_03[0]"
    type: text
  - line: "mailing_address.apt"             # "Apt. no."
    field: "Page1[0].f1_04[0]"
    type: text
  - line: "mailing_address.city_state_zip"  # ONE printed box: "City, town or post office, state, and ZIP code. If you have a foreign address, also complete the spaces below. See instructions." (ky/2023/form740 precedent for a combined box)
    field: "Page1[0].f1_05[0]"
    type: text
  - line: "mailing_address.foreign_country" # "Foreign country name"
    field: "Page1[0].f1_06[0]"
    type: text
  - line: "mailing_address.foreign_province"        # "Foreign province/state/county"
    field: "Page1[0].f1_07[0]"
    type: text
  - line: "mailing_address.foreign_postal_code"     # "Foreign postal code"
    field: "Page1[0].f1_08[0]"
    type: text

  # ---- Part I: Nondeductible Contributions to Traditional IRAs and
  # ---- Distributions From Traditional IRAs (page 1, printed lines 1-14;
  # ---- 15a-15c continue on PAGE 2 in this revision). The heading dropped
  # ---- "Traditional, Traditional SEP, and Traditional SIMPLE" because of the
  # ---- new umbrella Note above Part I (see the header block).
  - line: "1"                               # "Enter your nondeductible contributions to traditional IRAs for 2025, including those made for 2025 from January 1, 2026, through April 15, 2026. See instructions"
    field: "Page1[0].f1_09[0]"
    type: money
  - line: "2"                               # "Enter your total basis in traditional IRAs. See instructions." (Total Basis Chart—Line 2 lookup — worksheet, no relation)
    field: "Page1[0].f1_10[0]"
    type: money
  - line: "3"                               # "Add lines 1 and 2"
    field: "Page1[0].f1_11[0]"
    type: money
  # Printed routing box sits here (between lines 3 and 4): "In 2025, did you
  # take a distribution from a traditional IRA, or make a Roth IRA conversion?"
  # No -> line 3 goes on line 14 and the rest of Part I is left blank;
  # Yes -> go to line 4.  It has NO AcroForm widget, so it has no line key.
  - line: "4"                               # "Enter those contributions included on line 1 that were made from January 1, 2026, through April 15, 2026"
    field: "Page1[0].f1_12[0]"
    type: money
  - line: "5"                               # "Subtract line 4 from line 3" — relation NOT declared: blank on the printed No branch (see header)
    field: "Page1[0].f1_13[0]"
    type: money
  - line: "6"                               # "Enter the value of all your traditional IRAs as of December 31, 2025, plus any outstanding rollovers. Subtract certain 2025 retirement plan distribution repayments treated as rollovers, if any. See instructions" (the repayment sentence is NEW vs 2023)
    field: "Page1[0].f1_14[0]"
    type: money
  - line: "7"                               # "Enter your distributions from traditional IRAs in 2025. Do not include rollovers (but do include certain 2025 retirement plan distribution repayments treated as rollovers (see instructions)). Also, do not include qualified charitable distributions; a one-time distribution to fund an HSA; conversions to a Roth IRA; certain returned contributions; or recharacterizations of traditional IRA contributions. See instructions"
    field: "Page1[0].f1_15[0]"
    type: money
  - line: "8"                               # "Enter the net amount you converted from traditional IRAs to Roth IRAs in 2025. Also, enter this amount on line 16"
    field: "Page1[0].f1_16[0]"
    type: money
  - line: "9"                               # "Add lines 6, 7, and 8" — inset column box
    field: "Page1[0].f1_17[0]"
    type: money
  # Line 10 is a DECIMAL RATIO printed as "x __ . ___": two widgets straddling
  # the form's own decimal point. f1_18 is the single cell BEFORE it (widget
  # /MaxLen 1 — the "1" of the printed "If the result is 1.000 or more, enter
  # '1.000'" cap) and f1_19 the places AFTER it. Typed text, not money, and no
  # relation: same shape and the same key convention as f2555 35.whole/35.dec.
  - line: "10.whole"                        # 10 "Divide line 5 by line 9. Enter the result as a decimal rounded to at least 3 places. If the result is 1.000 or more, enter '1.000'" — integer part
    field: "Page1[0].f1_18[0]"
    type: text
    maxlen: 1                               # the widget's own /MaxLen
  - line: "10.dec"                          # ... the decimal places after the printed "." (widget declares NO /MaxLen, so none is pinned here; "at least 3 places" is not a hard cap)
    field: "Page1[0].f1_19[0]"
    type: text
  - line: "11"                              # "Multiply line 8 by line 10. This is the nontaxable portion of the amount you converted to Roth IRAs. Also, enter this amount on line 17" — inset column box
    field: "Page1[0].f1_20[0]"
    type: money
  - line: "12"                              # "Multiply line 7 by line 10. This is the nontaxable portion of your distributions that you did not convert to a Roth IRA" — inset column box
    field: "Page1[0].f1_21[0]"
    type: money
  - line: "13"                              # "Add lines 11 and 12. This is the nontaxable portion of all your distributions"
    field: "Page1[0].f1_22[0]"
    type: money
  - line: "14"                              # "Subtract line 13 from line 3. This is your total basis in traditional IRAs for 2025 and earlier years" — the line the NEXT year's line 2 comes from
    field: "Page1[0].f1_23[0]"
    type: money

  # ---- Part I (continued), PAGE 2 in this revision -------------------------
  # NEW IN 2025: printed lines 15a/15b/15c left page 1 for a "Part I ...
  # (continued)" banner at the top of page 2. In 2023 these three were
  # Page1[0].f1_24/f1_25/f1_26.
  - line: "15a"                             # "Subtract line 12 from line 7"
    field: "Page2[0].f2_01[0]"
    type: money
  - line: "15b"                             # "Enter the amount on line 15a attributable to qualified disaster distributions, if any, from 2025 Form(s) 8915-F. See instructions. Also, enter this amount on 2025 Form(s) 8915-F, line 18, as applicable. See instructions"
    field: "Page2[0].f2_02[0]"
    type: money
  - line: "15c"                             # "Taxable amount. Subtract line 15b from line 15a. Reduce that amount by certain 2025 retirement plan distribution repayments (other than those reported on Form 8915-F) that are treated as rollovers. See instructions. If more than zero, also include this amount on 2025 Form 1040, 1040-SR, or 1040-NR, line 4b" — the reduction sentence is NEW vs 2023, which is why no relation is declared
    field: "Page2[0].f2_03[0]"
    type: money
  # The grey block beside the printed "Note: You may be subject to an
  # additional 10% tax on the amount on line 15c if you were under age 59 1/2
  # at the time of the distribution. See instructions." holds no widget.

  # ---- Part II: 2025 Conversions From Traditional IRAs to Roth IRAs
  # ---- (page 2, printed lines 16-18)
  - line: "16"                              # "If you completed Part I, enter the amount from line 8. Otherwise, enter the net amount you converted from traditional IRAs to Roth IRAs in 2025" (conditional copy — no relation)
    field: "Page2[0].f2_04[0]"
    type: money
  - line: "17"                              # "If you completed Part I, enter the amount from line 11. Otherwise, enter your basis in the amount on line 16. See instructions" (conditional copy — no relation)
    field: "Page2[0].f2_05[0]"
    type: money
  - line: "18"                              # "Taxable amount. Subtract line 17 from line 16. If more than zero, also include this amount on 2025 Form 1040, 1040-SR, or 1040-NR, line 4b" — NO reduction sentence, so the relation survives the port
    field: "Page2[0].f2_06[0]"
    type: money

  # ---- Part III: Distributions From Roth IRAs (page 2, printed lines 19-25c)
  # ---- Heading shortened from 2023's "Distributions From Roth, Roth SEP, or
  # ---- Roth SIMPLE IRAs" by the new umbrella Note.
  - line: "19"                              # "Enter your total nonqualified distributions from Roth IRAs in 2025, including any qualified first-time homebuyer distributions, and any 2025 retirement plan distributions whose repayments are treated as rollovers. See instructions"
    field: "Page2[0].f2_07[0]"
    type: money
  - line: "20"                              # "Qualified first-time homebuyer expenses (see instructions). Do not enter more than $10,000 reduced by the total of all your prior qualified first-time homebuyer distributions" (the $10,000 is printed in the ROW TEXT, not inside the widget)
    field: "Page2[0].f2_08[0]"
    type: money
  - line: "21"                              # "Subtract line 20 from line 19. If zero or less, enter -0-"
    field: "Page2[0].f2_09[0]"
    type: money
  - line: "22"                              # "Enter your basis in Roth IRA contributions. See instructions. If line 21 is zero, stop here" (instructions worksheet — no relation)
    field: "Page2[0].f2_10[0]"
    type: money
  - line: "23"                              # "Subtract line 22 from line 21. If zero or less, enter -0- and skip lines 24 and 25. If more than zero, you may be subject to an additional tax. See instructions"
    field: "Page2[0].f2_11[0]"
    type: money
  - line: "24"                              # "Enter your basis in conversions from traditional IRAs and rollovers from qualified retirement plans to a Roth IRA. See instructions" (instructions worksheet — no relation)
    field: "Page2[0].f2_12[0]"
    type: money
  - line: "25a"                             # "Subtract line 24 from line 23. If zero or less, enter -0- and skip lines 25b and 25c"
    field: "Page2[0].f2_13[0]"
    type: money
  - line: "25b"                             # "Enter the amount on line 25a attributable to qualified disaster distributions, if any, from 2025 Form(s) 8915-F. See instructions. Also, enter this amount on 2025 Form(s) 8915-F, line 19, as applicable. See instructions"
    field: "Page2[0].f2_14[0]"
    type: money
  - line: "25c"                             # "Taxable amount. Subtract line 25b from line 25a. Reduce that amount by certain 2025 retirement plan distribution repayments (other than those reported on Form 8915-F) that are treated as rollovers. See instructions. If more than zero, also include this amount on 2025 Form 1040, 1040-SR, or 1040-NR, line 4b" — reduction sentence NEW vs 2023, so no relation
    field: "Page2[0].f2_15[0]"
    type: money

  # ---- Paid Preparer Use Only (page 2) --------------------------------------
  # Same block and the same key spellings as f843 and f1040x. "Your signature",
  # its "Date", "Preparer's signature" and the preparer's "Date" are printed
  # rules with no widgets, so they have no keys.
  # WIDGET ORDER CHANGED: 2025 numbers this block in reading order
  # (f2_18 firm name, f2_19 firm EIN, f2_20 firm address, f2_21 phone),
  # reversing 2023's out-of-order f2_16 address / f2_17 EIN pair.
  - line: "preparer.name"                   # "Print/Type preparer's name"
    field: "Page2[0].f2_16[0]"
    type: text
  - line: "preparer.self_employed"          # "Check [ ] if self-employed" — the form's ONLY /Btn; /AP /N holds one state, "/1"
    field: "Page2[0].c2_1[0]"
    type: checkbox
    on_state: "/1"
  - line: "preparer.ptin"                   # "PTIN"
    field: "Page2[0].f2_17[0]"
    type: text
    maxlen: 11                              # the widget's own /MaxLen (2023 carried this /MaxLen on f2_14)
  - line: "preparer.firm_name"              # "Firm's name"
    field: "Page2[0].f2_18[0]"
    type: text
  - line: "preparer.firm_ein"               # "Firm's EIN"
    field: "Page2[0].f2_19[0]"
    type: text
    maxlen: 10                              # the widget's own /MaxLen (XX-XXXXXXX)
  - line: "preparer.firm_address"           # "Firm's address"
    field: "Page2[0].f2_20[0]"
    type: text
  - line: "preparer.firm_phone"             # "Phone no."
    field: "Page2[0].f2_21[0]"
    type: text

relations:
  # Part I
  - "3 == 1 + 2"                    # "3 Add lines 1 and 2"
  - "9 == 6 + 7 + 8"                # "9 Add lines 6, 7, and 8"
  - "13 == 11 + 12"                 # "13 Add lines 11 and 12. This is the nontaxable portion of all your distributions"
  # NO "14 == 3 - 13": DROPPED 2026-08-26 by integrator decision, the same call the
  # missing "15c == 15a - 15b" rule above/below makes. The printed row does read
  # "14 Subtract line 13 from line 3", but Instructions for Form 8606 (2025), Line
  # 14, adds a path on which that is FALSE: "If you are completing Part I of 2025
  # Form 8606 (and the last time you filed a Form 8606 with a completed Part I
  # before 2025, you completed a Line 15c Worksheet on which the amount on line 6
  # was greater than zero), enter on line 14 ... the amount on 2025 Form 8606, line
  # 3, reduced by the amount on line 13" PLUS that carried worksheet amount. The
  # adjustment comes from a PRIOR year's worksheet, so nothing on this year's face
  # can derive it, and a filer who repaid a qualified birth-or-adoption, emergency
  # personal expense, domestic-abuse or terminal-illness distribution would get a
  # FALSE verification FAIL on a correct return. House rule applies (see sched_d:
  # "the conditional/worksheet-driven subtotals ... are likewise left to recompute
  # + review"): a relation that FAILs a legitimate filing path is worse than no
  # relation, because it teaches the operator to ignore FAILs. Line 14 is left to
  # verify's independent recompute + human review. The 2023 pack KEEPS this rule:
  # the Line 15c Worksheet is new in 2024 and the 2023 instructions never mention
  # it, so there the identity is unconditional (checked, not assumed).
  - "15a == 7 - 12"                 # "15a Subtract line 12 from line 7"
  # NO "15c == 15a - 15b": the 2025 row adds "Reduce that amount by certain 2025
  # retirement plan distribution repayments ... that are treated as rollovers"
  # (see the header; the 2023 pack declares this rule and its face had no such
  # sentence).
  # Part II
  - "18 == 16 - 17"                 # "18 Taxable amount. Subtract line 17 from line 16." No floor and no reduction printed
  # Part III
  - "21 == max(0, 19 - 20)"         # "21 Subtract line 20 from line 19. If zero or less, enter -0-"
  - "23 == max(0, 21 - 22)"         # "23 Subtract line 22 from line 21. If zero or less, enter -0- and skip lines 24 and 25"
  - "25a == max(0, 23 - 24)"        # "25a Subtract line 24 from line 23. If zero or less, enter -0- and skip lines 25b and 25c"
  # NO "25c == 25a - 25b": same new reduction sentence as 15c.

# Deliberately empty — 15c/18/25c each "also include this amount on 2025 Form
# 1040, 1040-SR, or 1040-NR, line 4b", which is additive and conditional, not
# an equality (see the header).
cross_form: []

identity_fields: [name, identifying_number]
# identifying_number is PER PERSON on this form, not per filing: Form 8606's header is "If married, file a separate form for each spouse required to file",
# so on a joint return it legitimately carries the SPOUSE's SSN while the 1040
# carries the primary filer's. Declared 2026-08-26 after verify_filing was
# reproduced FAILing that correct arrangement; verify now reports a difference
# as SKIPPED with both values printed instead of rejecting the return.
identity_per_person: [identifying_number]

# "Sign Here Only if You Are Filing This Form by Itself and Not With Your Tax
# Return" (printed, page 2) — the f8843 standalone_only shape.
signature:
  page: 2
  standalone_only: true

# Filed by itself, it goes to "the same time and place you would otherwise file
# 2025 Form 1040, 1040-SR, or 1040-NR" (Instructions, "When and Where To File")
# — the state-dependent 1040 table, which the knowledge layer owns (the f1040
# pack ships mailing: null for the same reason).
mailing: null
