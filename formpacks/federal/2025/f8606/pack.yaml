# Form 8606 (2025 revision) — Nondeductible IRAs. Two pages; attaches to Form
# 1040, 1040-SR or 1040-NR, and is FILED BY ITSELF (signed, page 2) by a filer
# who is not required to file an income tax return but is required to file
# Form 8606. This is the form that carries IRA basis across years — the
# instructions' Total Basis Chart routes "the amount from line 14 of that Form
# 8606" into the NEXT year's line 2 — so it is the landing surface for the
# ROADMAP I1 calc ops (ira_pro_rata / roth_conversion).
#
# PORTED 2026-08-26 from formpacks/federal/2023/f8606/pack.yaml (that pack's own
# banner says it was authored from scratch against f8606--2023.pdf).
#
