# NAMES are byte-identical strings. Both facts are traps:
#   * every single-digit name was ZERO-PADDED (f1_1[0] -> f1_01[0],
#     f2_1[0] -> f2_01[0]), so 21 names vanished and 21 appeared;
#   * printed lines 15a/15b/15c MOVED FROM PAGE 1 TO PAGE 2 under a new
#     "Part I ... (continued)" banner, which slid every page-2 widget by three
