# Form 8889 (2025 revision) — Health Savings Accounts (HSAs). ONE page;
# ATTACHMENT-ONLY ("Attach to Form 1040, 1040-SR, or 1040-NR." printed under the
# title) — there is no standalone path, and the instructions make that explicit:
# "If you (or your spouse, if filing jointly) received HSA distributions in
# 2025, you must file Form 8889 with Form 1040, Form 1040-SR, or Form 1040-NR,
# even if you have no taxable income or any other reason for filing Form 1040,
# Form 1040-SR, or Form 1040-NR." (Instructions for Form 8889 (2025), "Who Must
# File"). The form does three jobs, one per printed Part: figure the HSA
# DEDUCTION (Part I, lines 1-13 -> Schedule 1 line 13), the TAXABLE part of
# distributions plus the additional 20% tax (Part II, 14a-17b), and the
# testing-period RECAPTURE with its 10% additional tax when the last-month rule
# or a qualified HSA funding distribution is blown (Part III, 18-21).
#
# PORTED 2026-08-26 from formpacks/federal/2023/f8889/pack.yaml (that pack's own
# banner says it was authored from scratch against f8889--2023.pdf, in this same
# run). House-style precedent for the PORT discipline: the Phase I1 pack
# formpacks/federal/2025/f8606/pack.yaml (commit 4d51a07).
#
# ###########################################################################
# THE PORT IS NOT A URL SWAP: TWO PRINTED FIGURES AND ONE PRINTED RELATION
# CHANGED. Read this block before you trust a 2023 comment.
# ###########################################################################
# The AcroForm topology is byte-identical between the two revisions — 27
# widgets, the same 27 names, and (see the MECHANICAL TOPOLOGY DIFF) the same
# /Ff, /MaxLen and /AP states. That is exactly the trap this repo keeps
# re-learning: identical field NAMES never prove the face kept its meaning.
# What actually changed on the printed page:
#   1. LINE 3's two dollar figures. 2023 printed "enter $3,850 ($7,750 for
#      family coverage)"; 2025 prints "enter $4,300 ($8,550 for family
#      coverage)". These are the § 223(b)(2) annual limitations and they MOVE
#      EVERY YEAR — verified against the year's own Rev. Proc. below, not
#      recalled. (2024, checked as the intervening revision: $4,150 / $8,300.)
#   2. LINE 13 LOST ITS PRINTED ARITHMETIC. 2023 printed "13 HSA deduction.
#      Enter the smaller of line 2 or line 12 here and on Schedule 1 (Form
#      1040), Part II, line 13"; 2025 prints only "13 HSA deduction (see
#      instructions)". So the 2023 pack's relation "13 == min(2, 12)" has no
#      printed-face basis in this revision and is NOT declared here. It is not
#      a formatting trim either — the instruction that replaced it is
#      CONDITIONAL and the equality is provably false on a real filing path
#      (see RELATIONS; reproduced against this pack).
#   3. THE "Caution" ROW UNDER LINE 13 IS GONE. 2023 printed a full row
#      "Caution: If line 2 is more than line 13, you may have to pay an
#      additional tax. See instructions." with two shaded cells and no widget.
#      2025 has no such row; the caution now lives in the Line 13 instruction.
#      Deleting that 12-point row is what moved 11 widgets (see below).
# Everything else on the face is the 2023 text with the year rolled. Every
# binding was nonetheless re-derived by READING THE PRINTED FACE off a sentinel
# render (see the VISION AUDIT block), not carried on the strength of the name.
#
