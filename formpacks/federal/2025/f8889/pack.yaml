# RELATIONS — 8 rules, ONE FEWER than the 2023 pack, and the face is why
# ---------------------------------------------------------------------------
# DROPPED IN THIS PORT (declared in federal/2023/f8889):
#   * "13 == min(2, 12)". The 2023 row printed the arithmetic — "13 HSA
#     deduction. Enter the smaller of line 2 or line 12 here and on Schedule 1
#     (Form 1040), Part II, line 13" — and formpacks/CONVENTIONS.md admits a
#     relation only for "math that is printed on the form face". The 2025 row
#     prints "13 HSA deduction (see instructions)" and nothing else, so the
#     printed-face basis is gone. This is a REVISION CHANGE, checked and not
#     re-read: the sentence is present on f8889--2023.pdf and absent from BOTH
#     f8889--2024.pdf and f8889--2025.pdf.
#     And the equality is not merely unprinted, it is FALSE on a real path.
#     The instruction that replaced it is qualified: "Generally, enter the
#     smaller of line 2 or line 12 on line 13 and on Schedule 1 (Form 1040),
#     Part II, line 13." (Instructions for Form 8889 (2025), Line 13.) The
#     "Generally" is cashed out two ways in the primary sources:
#       - Instructions for Form 8889 (2025), Line 13, Note + "Prior Year Excess
#         Contributions": "If your current year contributions from line 2 are
#         less than your current year maximum HSA contribution limit shown on
#         line 12 and you have prior year excess contributions, see the
#         Instructions for Form 5329, Part VII, line 43, for more information."
#       - Instructions for Form 5329 (2025), Part VII, Line 43, verbatim: "If
#         contributions to your HSAs for 2025 (line 2 of Form 8889 ...) were
#         less than your contribution limit for HSAs, enter the difference on
#         line 43. Your contribution limit for HSAs is the amount on line 12 of
#         Form 8889.  Also include on your 2025 Form 8889, line 13, the smaller
#         of: • Form 5329, line 43; or • The excess, if any, of Form 5329,
#         line 42, over Form 5329, line 44."
#     So a filer who under-contributed this year while carrying prior-year
#     excess HSA contributions puts MORE than min(line 2, line 12) on line 13.
#     REPRODUCED against THIS pack, not argued: adding the rule back and
#     evaluating example (D) below — 2 = 3000, 12 = 4300, 13 = 4300 (the 3,000
#     of current-year contributions plus a 1,300 prior-year excess absorbed
#     under Form 5329 line 43) — returns FAIL "left side = 4300, right side =
#     3000 (difference +1300)", while all 8 shipped rules PASS on that same
#     data. A relation that FAILs a legitimate filing path is worse than no
#     relation (the sched_d / f8606-line-14 house rule), so line 13 is left to
#     verify's independent recompute + human review.
#     The 2023 pack KEEPS this rule and should: its face prints the
#     subtraction, and the printed-face rule is what admits a relation. That
#     the 2023 INSTRUCTIONS already carried the same escape hatch under a
#     different heading ("Deducting an Excess Contribution in a Later Year",
#     Instructions for Form 8889 (2023)) is a cross-year policy question for
#     the integrator, not a port edit — reported as an open issue.
#     INDEPENDENT SECOND READER, not a copy: formpacks/federal/2024/f8889
#     (authored from the 2024 face in this same 2026-08-26 run, by a different
#     author, while this pack was being written) reached the same verdict on
#     its own revision and cites the same Form 5329 line-43 mechanism from that
#     year's instructions. Two revisions, two readers, one conclusion.
# KEPT — all 8 re-read on the 2025 printed row, each with every operand mapped
# to a bare printed-label money line of THIS form. All 8 were evaluated against
# FOUR worked examples and PASS on every one, so none of them is the f8606
# line-5 blank-as-zero trap:
#   (A) a full Part I/II/III filer — self-only, age 60, unmarried, testing
#       period blown: 2=5300, 3=5300 (4,300 + the $1,000 additional
#       contribution amount, which rides on line 3 and not line 7 for an
#       UNMARRIED filer per the instructions' Line 3 rule (6) and the Line 3
#       Note), 4=0, 5=5300, 6=5300, 7=0, 8=5300, 9=1000, 10=0, 11=1000,
#       12=4300, 13=4300, 14a=2000, 14b=500, 14c=1500, 15=900, 16=600, 17b=80
#       (20% of only $400 — the rest met an exception, so 17a is checked),
#       18=1200, 19=300, 20=1500, 21=150.
#   (B) a DISTRIBUTIONS-ONLY filer whose Part I and Part III are legitimately
#       blank: 14a=2000, 14b=0, 14c=2000, 15=2000, 16=0. Every Part I/III rule
#       reads blank-as-zero on BOTH sides and still PASSes.
#   (C) the instructions' spousal-allocation leg of line 6: 3=8550, 5=8550,
#       6=4275 (half share), 8=4275, 12=4275, 13=4275, 2=4275.
#   (D) the prior-year-excess filer described above: 2=3000, 3=4300, 4=0,
#       5=4300, 6=4300, 7=0, 8=4300, 9=0, 10=0, 11=0, 12=4300, 13=4300.
# DELIBERATELY NOT DECLARED — each rejection RE-REPRODUCED against this pack on
# 2025 data, never argued from the caption alone:
#   * "6 == 5" ("Enter the amount from line 5"). FAILs example (C) — "left side
#     = 4275, right side = 8550 (difference -4275)". The printed row does NOT
#     stop there: "But if you and your spouse each have separate HSAs and had
#     family coverage under an HDHP at any time during 2025, see the
#     instructions for the amount to enter." That is a conditional copy with an
#     "Otherwise" leg — the f8960 line-18a / f8606 line-16-17 precedent — and
#     the instructions spell out the other leg as a spousal ALLOCATION
#     ("divide the amount on line 5 equally between you and your spouse, unless
#     you both agree on a different allocation (such as allocating nothing to
#     one spouse)", plus a 4-step refiguring for partial-year family coverage,
#     Instructions for Form 8889 (2025), Line 6). No unconditional equality.
#   * "17b == 16 * 0.20". FAILs example (A) — "left side = 80, right side = 120
#     (difference -40)". Refused on the primary source, and this is the one a
#     naive read of the printed "Enter 20% (0.20) of the distributions included
#     on line 16" would get wrong. The row's own tail scopes it — "of the
#     distributions included on line 16 THAT ARE SUBJECT TO the additional 20%
#     tax" — and the instructions make the subset explicit: "If any of the
#     exceptions apply to any of the distributions included on line 16, check
#     the box on line 17a. Enter on line 17b only 20% (0.20) of any amount
#     included on line 16 that does not meet any of the exceptions."
#     (Instructions for Form 8889 (2025), Lines 17a and 17b.) Line 17a's
#     checkbox is the flag for exactly that case. So 17b is a fraction of an
#     unmapped subset of line 16, not of line 16. (The 2023 pack cited that
#     year's worked "Example 2" for the same point; the 2025 instructions carry
#     NO numbered worked example anywhere — "example" occurs four times and all
#     four are inline "for example" clauses — so the sentence above, quoted from
#     the Lines 17a and 17b instruction, is the citation for this year.)
#   * "19 == 10". FAILs example (A) — "left side = 300, right side = 0
#     (difference +300)". Both rows are captioned "Qualified HSA funding
#     distribution(s)" and the line-19 instruction is a bare "Enter the total
#     of any qualified HSA funding distribution (see line 10)" — which reads
#     like a copy and is NOT one, because the two lines belong to different TAX
#     YEARS. The testing period for a funding distribution "begins with the
#     month in which the traditional IRA or Roth IRA distribution is
#     contributed to the HSA and lasts through the last day of the 12th month
#     following that month. For example, if the distribution is contributed on
#     June 17, 2025, the testing period lasts through June 30, 2026. If you
#     fail to remain an eligible individual during this period ... you will
#     have to include the qualified HSA funding distribution in income in the
#     year in which you fail to be an eligible individual." (Instructions for
#     Form 8889 (2025), Line 10 / Part III.) So a 2025 line 19 routinely
#     reports a 2024 distribution while this year's line 10 is blank, and the
#     equality would FAIL a correct return.
#   * Line 18 ("Last-month rule"). Worksheet-driven, not on-face math: "You can
#     use the Line 3 Limitation Chart and Worksheet (in these instructions) for
#     the year the contribution was made to determine the contribution you
#     could have made if the last-month rule did not apply. Enter on line 18
#     the excess of the amount contributed over the redetermined amount."
#     (Instructions for Form 8889 (2025), Line 18.) Prior-year worksheet
#     arithmetic over unmapped quantities.
#   * Lines 2, 3, 4, 7, 9, 10, 13, 14a, 14b, 15: source lines, no on-face math.
#     Line 3 is an instruction-WORKSHEET lookup for everyone except the
#     full-year same-coverage filer; line 7 has its own Additional Contribution
#     Amount Worksheet; line 9 has the Employer Contribution Worksheet; line 13
#     lost its printed arithmetic in the 2024 revision (above).
#
# ---------------------------------------------------------------------------
# CROSS-FORM — deliberately EMPTY, and this is the load-bearing part
# ---------------------------------------------------------------------------
# FOUR printed lines still cite a parent-return line, and not one of them is an
# EQUALITY, so all four are omitted rather than shipped as false checks. (2023
# had five: line 13's Schedule 1 citation left the FACE in the 2024 revision,
# but the routing itself survives in the instructions, so the reasoning below
# still has to be stated for it.)
#   * 13 -> "Schedule 1 (Form 1040), Part II, line 13" (now instructions-only).
#     Killed VERBATIM by the instructions: "Complete a separate Form 8889 for
#     each spouse. COMBINE THE AMOUNTS ON LINE 13 OF BOTH FORMS 8889 and enter
#     this amount on Schedule 1 (Form 1040), line 13. Be sure to attach both
#     Forms 8889 to your paper tax return." (Instructions for Form 8889 (2025),
#     "How To Complete Part I".) "13 == sched_1.13" would FAIL every correct
#     joint return on which both spouses have an HSA.
#   * 16 -> "Schedule 1 (Form 1040), Part I, line 8f" AND 20 -> the same
#     "Schedule 1 (Form 1040), Part I, line 8f". TWO lines of this one form
#     land on one Schedule 1 line, so 8f is 16 + 20 even for a single filer
#     with a single HSA and neither line alone can equal it. Both printed rows
#     say "include this amount in the total on" / "Include this amount on" —
#     additive language, and the repo has no grammar for an additive carry.
#   * 17b -> "Schedule 2 (Form 1040), Part II, line 17c" and 21 -> "Schedule 2
#     (Form 1040), Part II, line 17d". One-to-one for a single-HSA filer, but
#     the FORM ITSELF prints the per-spouse rule on both Parts — "If you are
#     filing jointly and both you and your spouse each have separate HSAs,
#     complete a separate Part II [Part III] for each spouse" — so two Forms
#     8889 feed one Schedule 2 and the equality breaks on exactly the returns
#     the caption contemplates.
# The targets all EXIST for THIS year (sched_1 2025 maps "13" and "8f"; sched_2
# 2025 maps "17c" and "17d" — resolved against the 2025 packs, not remembered
# from 2023), so this is a deliberate omission, not a missing pack, and it
# needs no CROSS_FORM_TARGET_ALLOWLIST row.
# COUNTER-PRECEDENT considered and distinguished: f8960 declares
# "17 == sched_2.12", f8959 "18 == sched_2.11" and f2441 "11 == sched_3.2".
# Those forms are filed ONE PER RETURN, so their carries really are
# one-to-one. Form 8889 is per-SPOUSE by printed caption and by instruction,
# which is the whole difference. A rule that is true for most filings and false
# for the joint-HSA case is a false check, and a false check is worse than none
# (the f8606 header's rule, and the sched_e P-007 lesson that verify will
# happily CERTIFY a wrong artifact).
#
# ---------------------------------------------------------------------------
# IDENTITY FIELDS — [name, identifying_number], and the per-spouse caveat
# ---------------------------------------------------------------------------
# House practice for a per-spouse attachment (sched_se, sched_c, f2555, f8960,
# f8606 all ship exactly [name, identifying_number]) is followed here.
#   * `name` is printed "Name(s) shown on Form 1040, 1040-SR, or 1040-NR" — by
#     construction the parent return's names, so it agrees with every other
#     schedule that maps `name`.
#   * `identifying_number` is printed "Social security number of HSA
#     beneficiary. If both spouses have HSAs, see instructions.", and the
#     instructions confirm the scope: "Enter your name(s) as shown on your tax
#     return and the SSN of the HSA account beneficiary. If married filing
#     jointly and both you and your spouse have HSAs, complete a separate Form
#     8889 for each of you." (Instructions for Form 8889 (2025), Specific
#     Instructions.)
# CAVEAT the integrator should see, recorded because it is the one way this
# line can legitimately DIFFER from the parent 1040 on a joint return: when the
# HSA belongs to the SPOUSE, this box holds the spouse's SSN while f1040's
# `identifying_number` holds the primary filer's, and verify's _identity_checks
# compares every DECLARED identity name across the filing — so
# verify_filing([f1040, f8889-for-the-spouse]) would report an
# `identifying_number` mismatch on a correct return. This is the same
# structural gap f8606 recorded (its box is per-spouse too, and sched_se's
# "Social security number of person with self-employment income" has it as
# well): _identity_checks has no way to express "per-spouse attachment, compare
# against EITHER filer". Reported as an open issue rather than dodged by
# dropping the declaration, which would also switch off the check for the
# single-filer case it protects correctly.
# `maxlen: 11` tracks the widget's OWN /MaxLen (formpacks/CONVENTIONS.md,
# "Identity page mirrors": maxlen tracks each widget's own /MaxLen) — 11 in
# this revision exactly as in 2023 — matching sched_b / sched_c / sched_8812 /
# f2555; f8606 and f8960 pin 9 on the identical 11-wide widget, an
# inconsistency reported rather than copied.
# `format: ssn_digits_only` keeps cross-form identity values consistent and can
# never overflow (P-001).
#
# ---------------------------------------------------------------------------
# SIGNATURE / MAILING
# ---------------------------------------------------------------------------
# signature: null, mailing: null — the attachment-only shape (f8960, f8959,
# f2441, sched_8812). The form carries NO signature block and NO preparer block
# of its own (confirmed three ways on this revision: 27 widgets of which none
# is in a signature area on the sweep render; zero /FT /Sig fields in the
# /Fields tree; and the printed face ends at line 21 and the Paperwork
# Reduction Act footer), it is never filed by itself, and it is mailed inside
# the parent return's envelope, so there is no separate where-to-file
# (formpacks/CONVENTIONS.md).
form: "8889"
jurisdiction: federal
tax_year: 2025
source_url: https://www.irs.gov/pub/irs-prior/f8889--2025.pdf
pdf_sha256: "15ed4587f75bec57b0b343dfd001b4016f09698af970afee633ca1a364d5f49f"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header ---------------------------------------------------------------
  - line: "name"                    # "Name(s) shown on Form 1040, 1040-SR, or 1040-NR"
    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"      # "Social security number of HSA beneficiary. If both spouses have HSAs, see instructions." — plain box, NOT a comb
    field: "Page1[0].f1_2[0]"
    type: text
    maxlen: 11                      # the widget's own /MaxLen (fits a dashed SSN); unchanged from 2023
    format: ssn_digits_only         # digits only keeps cross-form identity values consistent and can never overflow (P-001)

  # ---- Part I: HSA Contributions and Deduction (printed lines 1-13) ---------
  # "See the instructions before completing this part. If you are filing jointly
  #  and both you and your spouse each have separate HSAs, complete a separate
  #  Part I for each spouse."
  #
  # Line 1: "Check the box to indicate your coverage under a high-deductible
  # health plan (HDHP) during 2025. See instructions." — ONE question, TWO
  # mutually exclusive options on SEPARATE /Btn fields (P-008): the shared
  # `group: line1` is the only thing that stops a Self-only + Family return.
  - line: "1.self_only"             # printed "Self-only" box (left)
    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
    group: line1
  - line: "1.family"                # printed "Family" box (right)
    field: "Page1[0].c1_1[1]"
    type: checkbox
    on_state: "/2"
    group: line1
  - line: "2"                       # "HSA contributions you made for 2025 (or those made on your behalf), including those made by the unextended due date of your tax return that were for 2025. Do not include employer contributions, contributions through a cafeteria plan, or rollovers. See instructions"
    field: "Page1[0].f1_3[0]"
    type: money
  - line: "3"                       # "If you were under age 55 at the end of 2025 and, on the first day of every month during 2025, you were, or were considered, an eligible individual with the same coverage, enter $4,300 ($8,550 for family coverage). All others, see the instructions for the amount to enter" — the two figures ROLLED from 2023's $3,850/$7,750 and are the § 223(b)(2) 2025 limitations: "the annual limitation on deductions under § 223(b)(2)(A) for an individual with self-only coverage ... is $4,300 ... under § 223(b)(2)(B) for an individual with family coverage ... is $8,550" (Rev. Proc. 2024-25, § 2.01(1)). They are printed in the ROW TEXT, not in the widget (P-007 class 1 checked: f1_4[0] carries no /V), so this line stays mapped and writable — the filer enters the Line 3 Limitation Chart and Worksheet result
    field: "Page1[0].f1_4[0]"
    type: money
  - line: "4"                       # "Enter the amount you and your employer contributed to your Archer MSAs for 2025 from Form 8853, lines 1 and 2. If you or your spouse had family coverage under an HDHP at any time during 2025, also include any amount contributed to your spouse's Archer MSAs"
    field: "Page1[0].f1_5[0]"
    type: money
  - line: "5"                       # "Subtract line 4 from line 3. If zero or less, enter -0-"
    field: "Page1[0].f1_6[0]"
    type: money
  - line: "6"                       # "Enter the amount from line 5. But if you and your spouse each have separate HSAs and had family coverage under an HDHP at any time during 2025, see the instructions for the amount to enter" — conditional copy with a spousal-allocation leg, so no relation
    field: "Page1[0].f1_7[0]"
    type: money
  - line: "7"                       # "If you were age 55 or older at the end of 2025, married, and you or your spouse had family coverage under an HDHP at any time during 2025, enter your additional contribution amount. See instructions" (the instructions' Additional Contribution Amount Worksheet, $1,000 x months eligible / 12 — no relation)
    field: "Page1[0].f1_8[0]"
    type: money
  - line: "8"                       # "Add lines 6 and 7"
    field: "Page1[0].f1_9[0]"
    type: money
  - line: "9"                       # "Employer contributions made to your HSAs for 2025" — INSET box (x 410-482), not the main amount column; the far-right cell on this row is shaded and holds no widget. (Instructions' Employer Contribution Worksheet — no relation.)
    field: "Page1[0].f1_10[0]"
    type: money
  - line: "10"                      # "Qualified HSA funding distributions" — INSET box, same as line 9. A trustee-to-trustee IRA-to-HSA transfer; NOT the same year's line 19 (see the header)
    field: "Page1[0].f1_11[0]"
    type: money
  - line: "11"                      # "Add lines 9 and 10"
    field: "Page1[0].f1_12[0]"
    type: money
  - line: "12"                      # "Subtract line 11 from line 8. If zero or less, enter -0-"
    field: "Page1[0].f1_13[0]"
    type: money
  - line: "13"                      # "HSA deduction (see instructions)" — the WHOLE printed row in this revision. The 2023 face read "Enter the smaller of line 2 or line 12 here and on Schedule 1 (Form 1040), Part II, line 13" and the 2023 pack declares "13 == min(2, 12)"; that arithmetic left the face in the 2024 revision and the replacement instruction is conditional ("Generally, ...", plus the Form 5329 line-43 prior-year-excess add-back), so NO relation is declared here. The Schedule 1 leg is also ADDITIVE across spouses' Forms 8889, so no cross_form rule either (see the header). The 2023 "Caution: If line 2 is more than line 13 ..." row no longer exists on the face.
    field: "Page1[0].f1_14[0]"
    type: money

  # ---- Part II: HSA Distributions (printed lines 14a-17b) ------------------
  # "If you are filing jointly and both you and your spouse each have separate
  #  HSAs, complete a separate Part II for each spouse."
  # Every widget from here down moved +12 points in y vs 2023 — the deleted
  # "Caution" row, NOT a renumbering. Re-confirmed line by line on the render.
  - line: "14a"                     # "Total distributions you received in 2025 from all HSAs (see instructions)" — Form 1099-SA box 1
    field: "Page1[0].f1_15[0]"
    type: money
  - line: "14b"                     # "b Distributions included on line 14a that you rolled over to another HSA. Also include any excess contributions (and the earnings on those excess contributions) included on line 14a that were withdrawn by the due date of your return. See instructions"
    field: "Page1[0].f1_16[0]"
    type: money
  - line: "14c"                     # "c Subtract line 14b from line 14a"
    field: "Page1[0].f1_17[0]"
    type: money
  - line: "15"                      # "Qualified medical expenses paid using HSA distributions (see instructions)"
    field: "Page1[0].f1_18[0]"
    type: money
  - line: "16"                      # "Taxable HSA distributions. Subtract line 15 from line 14c. If zero or less, enter -0-. Also, include this amount in the total on Schedule 1 (Form 1040), Part I, line 8f"
    field: "Page1[0].f1_19[0]"
    type: money
  - line: "17a"                     # "If any of the distributions included on line 16 meet any of the Exceptions to the Additional 20% Tax (see instructions), check here" — printed line 17a IS the checkbox; the cell to its right is shaded and holds no widget. Lone flag, so no `group`.
    field: "Page1[0].c1_2[0]"
    type: checkbox
    on_state: "/1"
  - line: "17b"                     # "b Additional 20% tax (see instructions). Enter 20% (0.20) of the distributions included on line 16 that are subject to the additional 20% tax. Also, include this amount in the total on Schedule 2 (Form 1040), Part II, line 17c" — the base is a SUBSET of line 16, so no relation (see the header)
    field: "Page1[0].f1_20[0]"
    type: money

  # ---- Part III: Income and Additional Tax for Failure To Maintain HDHP
  # ---- Coverage (printed lines 18-21) — the testing-period recapture
  # "If you are filing jointly and both you and your spouse each have separate
  #  HSAs, complete a separate Part III for each spouse."
  - line: "18"                      # "Last-month rule" — the contributions allowed only BY the last-month rule, recaptured because the testing period was blown (prior-year worksheet, no relation)
    field: "Page1[0].f1_21[0]"
    type: money
  - line: "19"                      # "Qualified HSA funding distribution" — the recaptured line-10 distribution, reported in the year eligibility FAILED, which is often a LATER year than the distribution: not equal to this year's line 10 (see the header)
    field: "Page1[0].f1_22[0]"
    type: money
  - line: "20"                      # "Total income. Add lines 18 and 19. Include this amount on Schedule 1 (Form 1040), Part I, line 8f" — line 16 lands on 8f too, so the Schedule 1 leg is additive: no cross_form rule
    field: "Page1[0].f1_23[0]"
    type: money
  - line: "21"                      # "Additional tax. Multiply line 20 by 10% (0.10). Include this amount in the total on Schedule 2 (Form 1040), Part II, line 17d"
    field: "Page1[0].f1_24[0]"
    type: money

relations:
  # Part I
  - "5 == max(0, 3 - 4)"      # "5 Subtract line 4 from line 3. If zero or less, enter -0-"
  - "8 == 6 + 7"              # "8 Add lines 6 and 7"
  - "11 == 9 + 10"            # "11 Add lines 9 and 10"
  - "12 == max(0, 8 - 11)"    # "12 Subtract line 11 from line 8. If zero or less, enter -0-"
  # NO "13 == min(2, 12)" — the 2023 pack declares it because the 2023 row
  # printed "Enter the smaller of line 2 or line 12"; the 2025 row prints only
  # "13 HSA deduction (see instructions)". Beyond the missing printed math, the
  # replacement instruction is conditional ("Generally, enter the smaller of
  # line 2 or line 12 ...", Instructions for Form 8889 (2025), Line 13) and the
  # Form 5329 Part VII line-43 prior-year-excess add-back makes the equality
  # FALSE for a real filer: reproduced at FAIL "left side = 4300, right side =
  # 3000 (difference +1300)" on worked example (D) in the header.
  # Part II
  - "14c == 14a - 14b"        # "c Subtract line 14b from line 14a." No floor is printed
  - "16 == max(0, 14c - 15)"  # "16 Taxable HSA distributions. Subtract line 15 from line 14c. If zero or less, enter -0-"
  # Part III
  - "20 == 18 + 19"           # "20 Total income. Add lines 18 and 19"
  - "21 == 20 * 0.10"         # "21 Additional tax. Multiply line 20 by 10% (0.10)"

# Deliberately empty. All four surviving printed parent-return citations (16 and
# 20 -> Schedule 1 line 8f; 17b -> Schedule 2 line 17c; 21 -> Schedule 2 line
# 17d), plus line 13's now instructions-only Schedule 1 leg, are ADDITIVE, not
# equalities — two lines of this form share Schedule 1 line 8f, and the
# instructions say verbatim to "Combine the amounts on line 13 of both Forms
# 8889" on a joint return. See the header.
cross_form: []

identity_fields: [name, identifying_number]
# identifying_number is PER PERSON on this form, not per filing: Form 8889's box is printed "Social security number of HSA beneficiary",
# so on a joint return it legitimately carries the SPOUSE's SSN while the 1040
# carries the primary filer's. Declared 2026-08-26 after verify_filing was
# reproduced FAILing that correct arrangement; verify now reports a difference
# as SKIPPED with both values printed instead of rejecting the return.
identity_per_person: [identifying_number]

# Attachment-only form (Attachment Sequence No. 52): no signature block of its
# own; mailed inside the parent return's envelope (formpacks/CONVENTIONS.md).
signature: null
mailing: null
