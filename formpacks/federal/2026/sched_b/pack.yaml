# Schedule B (Form 1040) — Interest and Ordinary Dividends — 2026 DRAFT.
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040sb--dft.pdf,
# footer "Created 4/7/26"). Its cover sheet: "there are never any changes to
# the last posted draft of the form and the final revision of the form". PDF page
# 1 is that cover sheet; the form is PDF pages 2 (one page). When the final posts at
# irs-prior/f1040sb--2026.pdf, re-pin source_url, pdf_sha256, source_status final,
# drop draft_created, and re-read the face. TY2026 is planning-only, so this pack
# fills only in REHEARSAL mode. Phase J JT3d.
#
# PORTED 2026-09-27 from formpacks/federal/2025/sched_b/pack.yaml — read that pack's
# header for the field-map notes; the comments below are its own and describe
# the 2025 revision's history. MECHANICAL TOPOLOGY DIFF, 2025 final -> 2026
# draft: every widget keeps its name, rect, /MaxLen and /AP states. Printed-face
# diff: the year in the title block and in lines 7a and 8 ("At any time during 2026", "During 2026"), and 7b's "foreign country(ies)" (2025: "country(-ies)"). No line was renumbered, so relations and cross_form carry
# over unchanged.

form: "Schedule B (Form 1040)"
jurisdiction: federal
tax_year: 2026
source_url: https://www.irs.gov/pub/irs-dft/f1040sb--dft.pdf
pdf_sha256: "aa6272f6b3b8a8c6a2aa6ef9d1069f1edb88fb9df4df60278d198da89cdfd93f"
source_status: draft
draft_created: "4/7/26"
acroform_root: "topmostSubform[0]"

fields:
  # --- header ---
  - line: name
    field: "Page1[0].f1_01[0]"
    type: text
  - line: identifying_number
    field: "Page1[0].f1_02[0]"
    type: text
    maxlen: 11

  # --- Part I, line 1: interest payer list (14 rows: name of payer, amount) ---
  - line: interest_1.payer
    field: "Page1[0].Line1_ReadOrder[0].f1_03[0]"
    type: text
  - line: interest_1.amount
    field: "Page1[0].f1_04[0]"
    type: money
  - line: interest_2.payer
    field: "Page1[0].f1_05[0]"
    type: text
  - line: interest_2.amount
    field: "Page1[0].f1_06[0]"
    type: money
  - line: interest_3.payer
    field: "Page1[0].f1_07[0]"
    type: text
  - line: interest_3.amount
    field: "Page1[0].f1_08[0]"
    type: money
  - line: interest_4.payer
    field: "Page1[0].f1_09[0]"
    type: text
  - line: interest_4.amount
    field: "Page1[0].f1_10[0]"
    type: money
  - line: interest_5.payer
    field: "Page1[0].f1_11[0]"
    type: text
  - line: interest_5.amount
