# Form 1040 (2026) — U.S. Individual Income Tax Return — DRAFTS-FIRST
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040--dft.pdf,
# page-1 footer "Form 1040 (2026) Created 8/19/26"). Its cover sheet: "there
# are never any changes to the last posted draft of the form and the final
# revision of the form". PDF page 1 is that cover sheet, so the form's pages 1
# and 2 are PDF pages 2 and 3 (the signature block is on PDF page 3). When the
# final posts at irs-prior/f1040--2026.pdf (scripts/check_finals.py opens the
# "ty2026-finals: re-pin now" issue), re-pin: source_url, pdf_sha256,
# source_status final, drop draft_created, signature page 2, and re-read the
# face. TY2026 is planning-only, so this pack fills only in REHEARSAL mode
# (core fill_form(..., rehearsal=True)); MCP fill_form refuses the year.
#
# 200 of 207 widgets are mapped. The 7 unmapped widgets are the "Paid Preparer
# Use Only" block, which only a preparer fills:
#   Page2[0].f2_51[0]  preparer's name
#   Page2[0].f2_52[0]  preparer's PTIN
#   Page2[0].c2_17[0]  "Check if: Self-employed" checkbox
#   Page2[0].f2_53[0]  firm's name
#   Page2[0].f2_54[0]  firm's phone no.
#   Page2[0].f2_55[0]  firm's address
#   Page2[0].f2_56[0]  firm's EIN
#
# 2025 -> 2026 changes, read off the draft face and widget tree (every binding
# re-read; the positional f/c names shift after each new widget):
# - NEW question under digital assets: "At the time you file your return, are
#   you, and your spouse if filing jointly, a U.S. citizen, U.S. national, or
#   an alien lawfully authorized to work in the U.S.? (see instructions)
#   You: Yes No Spouse: Yes No" — two yes/no radio fields (c1_11, c1_12). Not
#   marked required: the 2026 instructions that would say so are not final.
#   Every later page-1 checkbox shifts by 2 (the dependents "more than four"
#   box is c1_13, the lived-apart box c1_34, 3c-7b c1_35-c1_46).
# - Filing status: Single/MFJ/MFS are kids /1 /2 /3 of Page1[0].c1_8 and
#   HOH/QSS are /4 /5 of Page1[0].HOH-QSS_ReadOrder[0].c1_8. The MFS name
#   box is now f1_28 (spouse's name) and f1_29 is the HOH/QSS child's name.
#   The nonresident-spouse election box moved under Nonresident_ReadOrder.
# - 12d: "Were born before January 2, 1962" (2025: 1961).
# - NEW line 12f "Charitable contribution deduction for non-itemizers (see
#   instructions)".
# - TRAP — 13a and 13b SWAP MEANING. 2025: 13a QBI, 13b Schedule 1-A line 38.
#   2026: "13a Additional deductions from Schedule 1-A, line 44" and "13b
#   Qualified business income deduction from Form 8995 or Form 8995-A".
#   "14 Add lines 12e, 12f, 13a, and 13b".
# - Line 24 splits: "24a Add lines 22 and 23. This is your total tax", "24b
#   Enter amount from Form 1062, line 15", "24c Add lines 24a and 24b"; lines
#   34 and 37 now compare line 33 with 24c.
# - Line 28 loses its 2025 decline-ACTC checkbox (the draft prints none).
# - Line 32 splits: "32a Add lines 27a, 28, 29, 30, and 31", "32b Amount from
#   Schedule 3-A", "32c Subtract line 32b from line 32a"; "33 Add lines 25d,
#   26, and 32c".
# - Line 36 applies the refund to "your 2027 estimated tax".
#
# Cross-form references NOT encoded (the 2025 template's scoping): 19 and 28
# (Schedule 8812), 29 (Form 8863), 30 (Form 8839) and 24b (Form 1062) have no form
# key here (the 8812 and 8863 packs carry their own legs). 32b's Schedule 3-A carry
# is CONDITIONAL — line 6 when the filer declines the benefit, else line 8 — so the
# 2026 sched_3a pack (JT5f) encodes only its unconditional carries IN (1a/1b/3 from
# this form). The Schedule 1, 2 and 3 legs below resolve against their 2026 packs
# (JT3b/JT3c).
