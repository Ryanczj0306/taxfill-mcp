# Only arithmetic printed on the form face.
relations:
  - "1z == sum(1a..1h)"                              # "Add lines 1a through 1h"
  - "9 == 1z + 2b + 3b + 4b + 5b + 6b + 7a + 8"      # "Add lines 1z, 2b, 3b, 4b, 5b, 6b, 7a, and 8"
  - "11a == 9 - 10"                                  # "Subtract line 10 from line 9"
  - "11b == 11a"                                     # "Amount from line 11a (adjusted gross income)"
  - "14 == 12e + 12f + 13a + 13b"                    # "Add lines 12e, 12f, 13a, and 13b"
  - "15 == max(0, 11b - 14)"                         # "Subtract line 14 from line 11b. If zero or less, enter -0-"
  - "18 == 16 + 17"                                  # "Add lines 16 and 17"
  - "21 == 19 + 20"                                  # "Add lines 19 and 20"
  - "22 == max(0, 18 - 21)"                          # "Subtract line 21 from line 18. If zero or less, enter -0-"
  - "24a == 22 + 23"                                 # "Add lines 22 and 23. This is your total tax"
  - "24c == 24a + 24b"                               # "Add lines 24a and 24b"
  - "25d == sum(25a..25c)"                           # "Add lines 25a through 25c"
  - "32a == 27a + 28 + 29 + 30 + 31"                 # "Add lines 27a, 28, 29, 30, and 31"
  - "32c == 32a - 32b"                               # "Subtract line 32b from line 32a"
  - "33 == 25d + 26 + 32c"                           # "Add lines 25d, 26, and 32c. These are your total payments"
  - "34 == max(0, 33 - 24c)"                         # "If line 33 is more than line 24c, subtract line 24c from line 33"
  - "37 == max(0, 24c - 33)"                         # "Subtract line 33 from line 24c. This is the amount you owe"
# sched_1a resolves against the shipped 2026 draft pack; the sched_1/2/3 legs
# are allowlisted in test_pack_invariants until their 2026 packs ship.
cross_form:
  - "8 == sched_1.10"    # "Additional income from Schedule 1, line 10"
  - "10 == sched_1.26"   # "Adjustments to income from Schedule 1, line 26"
  - "13a == sched_1a.44" # "Additional deductions from Schedule 1-A, line 44"
  - "17 == sched_2.3"    # "Amount from Schedule 2, line 3"
  - "20 == sched_3.8"    # "Amount from Schedule 3, line 8"
  - "23 == sched_2.21"   # "Additional taxes, including self-employment tax, from Schedule 2, line 21"
  - "31 == sched_3.15"   # "Amount from Schedule 3, line 15"
identity_fields: [identifying_number]
# PDF page 3 of the draft (page 1 is the IRS cover sheet); page 2 on the final.
signature: { page: 3 }
