# Federal Schedule C (Form 1040), TAX YEAR 2026 — DRAFTS-FIRST (Phase J JT5d, read 2026-09-27).
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040sc--dft.pdf, footer "Schedule C (Form
# 1040) 2026 Created 5/15/26"). PDF page 1 is the IRS cover sheet, so the form's pages 1 and 2 are PDF pages
# 2 and 3. When the final posts at irs-prior/f1040sc--2026.pdf, re-pin source_url, pdf_sha256 and
# source_status final, drop draft_created, and re-read the face. TY2026 is planning-only (rehearsal only).
#
# 109 widgets (2025: 105), all mapped (the numbering skips f1_30). 2025 -> 2026, read off the draft face
# and widget tree (every binding re-read — the page-1 f-numbers shift after the new address boxes):
# - Box E splits: "Business address. Number and street" + "Apt. no." on one row, then "City, town, or post
#   office" / "State" / "ZIP code" (2025: a street box and ONE city/state/ZIP box). Keys
#   business_address.street/.apt/.city/.state/.zip (the filer-address selector skips business_address).
# - TRAP — line 16 grows: "16 Interest (see instructions): 16a Mortgage (paid to banks, etc.), 16b Vehicle
#   loan, 16c Other" (2025: 16a Mortgage, 16b Other). The 2025 "16b" (other interest) is 2026 "16c"; 16b is
#   the NEW vehicle-loan line. "28 Total expenses ... Add lines 8 through 27b".
# - 27a/27b keep the 2025 order (27a energy efficient commercial buildings, Form 7205; 27b other expenses
#   from line 48 — "Enter here and on line 27b").
# - Checkbox kids renamed /Yes /No -> /1 /2 on G, I and J (c1_2, c1_4, c1_5). The B and D combs lose their
#   BComb/DComb wrappers (D is now BoxD[0].f1_6). The Part V rows lose their PartVTable/ItemN wrappers:
#   row k is f2_(13+2k) description / f2_(14+2k) amount.
# - The draft's text is 9pt (2025: 8pt).
