  # ---- Check only one box." SIX separate terminal /Btn fields in this revision
  # ---- (three in 2023 — G/H/I and J/K/L are new), so the shared `group` is the
  # ---- only thing making them exclusive (P-008). Not `required`: a
  # ---- long-term-only filer files page 2 alone (see the header).
  - line: "short_term.box.a"              # (A) Short-term transactions reported on Form(s) 1099-B showing basis was reported to the IRS (see Note above)
    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
    group: short_term.box
  - line: "short_term.box.b"              # (B) Short-term transactions reported on Form(s) 1099-B showing basis was not reported to the IRS
    field: "Page1[0].c1_1[1]"
    type: checkbox
    on_state: "/2"
    group: short_term.box
  - line: "short_term.box.c"              # (C) Short-term transactions, other than digital asset transactions, not reported to you on Form 1099-B or Form 1099-DA
    field: "Page1[0].c1_1[2]"
    type: checkbox
    on_state: "/3"
    group: short_term.box
  - line: "short_term.box.g"              # (G) Short-term transactions reported on Form(s) 1099-DA showing basis was reported to the IRS (see Note above)
