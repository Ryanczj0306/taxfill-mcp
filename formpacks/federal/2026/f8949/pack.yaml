jurisdiction: federal
tax_year: 2026
source_url: https://www.irs.gov/pub/irs-dft/f8949--dft.pdf
pdf_sha256: "891d869c87ffe9c6d7f79079d19ebf4ac0afa7257f6374cd95936e44a7079ffe"
source_status: draft
draft_created: "4/1/26"
acroform_root: "topmostSubform[0]"

