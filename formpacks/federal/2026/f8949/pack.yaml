  - line: "name"                            # "Name(s) shown on return"
    field: "Page1[0].f1_01[0]"
    type: text
  - line: "identifying_number"              # "Social security number or taxpayer identification number" — plain box, NOT a comb
    field: "Page1[0].f1_02[0]"
    type: text
    maxlen: 11                              # the widget's own /MaxLen (fits a dashed SSN/ITIN)
    format: ssn_digits_only                 # digits only keeps cross-form identity values consistent and can never overflow (P-001)

