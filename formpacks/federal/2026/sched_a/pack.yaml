# Federal Schedule A (Form 1040), TAX YEAR 2026 — DRAFTS-FIRST (Phase J JT5d, read 2026-09-27).
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040sa--dft.pdf, footer "Schedule A
# (Form 1040) 2026 Created 5/12/26"). PDF page 1 is the IRS cover sheet, so the form's pages 1 and 2 are
# PDF pages 2 and 3. When the final posts at irs-prior/f1040sa--2026.pdf (scripts/check_finals.py),
# re-pin source_url, pdf_sha256 and source_status final, drop draft_created, and re-read the face. TY2026
# is planning-only, so this pack fills only in REHEARSAL mode.
#
# All 47 of the draft's 47 AcroForm widgets are mapped (2025: 33). None is ReadOnly. There is no
# signature block (attachment-only schedule).
#
# 2025 -> 2026 changes, read off the draft face and widget tree (every binding re-read — the text leaves
# are zero-padded now, f1_1 -> f1_01, and the page-2 lines are new widgets):
# - Line 5e prints the 2026 SALT cap: "the smaller of line 5d or $40,400 ($20,200 if married filing
#   separately)", with the "$505,000 ($252,500 if married filing separately)" look-through.
# - Line 8d is a real line again: "Mortgage insurance premiums (see instructions)" (2025: "Reserved for
#   future use", ReadOnly). "8e Add lines 8a through 8d". The 8b payee write-in now FOLLOWS the 8b amount
#   in widget order (f1_16 amount, f1_17 payee; 2025 the reverse).
# - Gifts to Charity renumber: 11 cash, 12 other than cash, NEW "13 Enter the amount from line 6 of the
#   Charitable Contribution Limitation Worksheet", 14 carryover from prior year, "15 Add lines 13 and
#   14" (2025: 13 carryover, 14 = 11 + 12 + 13). Lines 11 and 12 no longer feed the total directly — the
#   worksheet (in the unposted 2026 instructions) sits between them and line 13.
# - TRAP — every later line moves: 16 casualty and theft (2025: 15); 17 "Other itemized deductions" is
#   now an itemized ladder 17a-17k + 17z (2025: one 16.type write-in + 16 amount), with 17a "Deductible
#   gambling losses" carrying a NEW "If you have gambling winnings that you reported on Schedule C or
#   Schedule E, check here" box; 18 is the total (2025: 17); 19 is the elect-to-itemize box (2025: 18).
# - NEW line 18 question (IRC 68 as amended for 2026): "Is the amount on Form 1040 or 1040-SR, line 11b,
#   minus the amounts on lines 13a and 13b of that form, more than $384,350?" — "No. Your deductions are
#   not limited. Add the amounts in far-right column for lines 4 through 17z. Also enter this amount on
#   Form 1040 or 1040-SR, line 12e." / "Yes. Your deductions may be limited. See the Itemized Deductions
#   Worksheet in the instructions to figure the amount to enter." One radio (c2_1: /1 No, /2 Yes — the
#   No box prints first).
#
# Relations: the form-face sums only. Line 18 is NOT encoded: it is the far-right sum only on the "No"
# answer; on "Yes" it comes from the (unposted) Itemized Deductions Worksheet (the sched_a_nr 2026
# precedent). Line 3 (7.5% of line 2) and the 5e cap (MFS figure, AGI look-through) cannot branch here.
# Cross-form: line 2 prints "Enter amount from Form 1040 or 1040-SR, line 11b"; line 18 is the amount
# entered on Form 1040 line 12e on either answer (the 2023/2024 packs' "17 == f1040.12" shape; the 2025
# pack carried none).
form: Schedule A (Form 1040)
jurisdiction: federal
tax_year: 2026
source_url: https://www.irs.gov/pub/irs-dft/f1040sa--dft.pdf
pdf_sha256: d49acff9afc2faa178b7bf1f70d826d03c2c6def43700880f8ae5bb8bb5a0ffa
source_status: draft
draft_created: "5/12/26"
acroform_root: form1[0]
fields:
  - { line: "name", field: "Page1[0].f1_01[0]", type: text }
  # plain box, widget /MaxLen 11; digits-only keeps the cross-form identity values consistent with f1040
  - { line: "identifying_number", field: "Page1[0].f1_02[0]", type: text, maxlen: 9, format: ssn_digits_only }
  # ----- Medical and Dental Expenses -----
  - { line: "1", field: "Page1[0].f1_03[0]", type: money }   # Medical and dental expenses
  - { line: "2", field: "Page1[0].f1_04[0]", type: money }   # Enter amount from Form 1040 or 1040-SR, line 11b
  - { line: "3", field: "Page1[0].f1_05[0]", type: money }   # Multiply line 2 by 7.5% (0.075)
  - { line: "4", field: "Page1[0].f1_06[0]", type: money }   # Subtract line 3 from line 1 (not below zero)
  # ----- Taxes You Paid -----
  - { line: "5a.general_sales_tax", field: "Page1[0].c1_1[0]", type: checkbox, on_state: "/1" }
  - { line: "5a", field: "Page1[0].f1_07[0]", type: money }  # State and local income taxes or general sales taxes
  - { line: "5b", field: "Page1[0].f1_08[0]", type: money }  # State and local real estate taxes
  - { line: "5c", field: "Page1[0].f1_09[0]", type: money }  # State and local personal property taxes
  - { line: "5d", field: "Page1[0].f1_10[0]", type: money }  # Add lines 5a through 5c
  - { line: "5e", field: "Page1[0].f1_11[0]", type: money }  # smaller of 5d or $40,400 ($20,200 MFS)
  - { line: "6.type", field: "Page1[0].f1_12[0]", type: text, maxlen: 79 }  # "Other taxes. List type and amount"
  - { line: "6", field: "Page1[0].f1_13[0]", type: money }
  - { line: "7", field: "Page1[0].f1_14[0]", type: money }   # Add lines 5e and 6
  # ----- Interest You Paid -----
  # "If you didn't use all of your home mortgage loan(s) to buy, build, or improve your home, see
  # instructions and check this box"
  - { line: "8.mortgage_not_for_home", field: "Page1[0].Line8_ReadOrder[0].c1_2[0]", type: checkbox, on_state: "/1" }
  - { line: "8a", field: "Page1[0].f1_15[0]", type: money }  # Home mortgage interest and points reported on Form 1098
  - { line: "8b", field: "Page1[0].f1_16[0]", type: money }  # Home mortgage interest not reported on Form 1098
  # 8b's seller write-in ("show that person's name, identifying number, and address"), the ruled row
  # under the 8b caption
  - { line: "8b.payee", field: "Page1[0].f1_17[0]", type: text, maxlen: 79 }
  - { line: "8c", field: "Page1[0].f1_18[0]", type: money }  # Points not reported on Form 1098
  - { line: "8d", field: "Page1[0].f1_19[0]", type: money }  # NEW 2026: Mortgage insurance premiums
  - { line: "8e", field: "Page1[0].f1_20[0]", type: money }  # Add lines 8a through 8d
  - { line: "9", field: "Page1[0].f1_21[0]", type: money }   # Investment interest (Form 4952)
  - { line: "10", field: "Page1[0].f1_22[0]", type: money }  # Add lines 8e and 9
  # ----- Gifts to Charity (page 2) -----
  - { line: "11", field: "Page2[0].Line11_ReadOrder[0].f2_01[0]", type: money }  # Gifts by cash or check
  - { line: "12", field: "Page2[0].f2_02[0]", type: money }  # Other than by cash or check
  - { line: "13", field: "Page2[0].f2_03[0]", type: money }  # NEW: line 6 of the Charitable Contribution Limitation Worksheet
  - { line: "14", field: "Page2[0].f2_04[0]", type: money }  # Carryover from prior year
  - { line: "15", field: "Page2[0].f2_05[0]", type: money }  # Add lines 13 and 14
  # ----- Casualty and Theft Losses -----
  - { line: "16", field: "Page2[0].f2_06[0]", type: money }  # disaster casualty and theft loss(es), Form 4684 line 18
  # ----- Other Itemized Deductions: NEW 17a-17k ladder -----
  - { line: "17a", field: "Page2[0].Line17_ReadOrder[0].f2_07[0]", type: money }  # Deductible gambling losses
  - { line: "17a.winnings_on_sched_c_or_e", field: "Page2[0].IfYou_ReadOrder[0].c1_2[0]", type: checkbox, on_state: "/1" }
  - { line: "17b", field: "Page2[0].f2_08[0]", type: money }  # Net qualified disaster loss
  - { line: "17c", field: "Page2[0].f2_09[0]", type: money }  # Standard deduction claimed with qualified disaster loss
  - { line: "17d", field: "Page2[0].f2_10[0]", type: money }  # Casualty and theft losses of income-producing property
  - { line: "17e", field: "Page2[0].f2_11[0]", type: money }  # Federal estate tax on income in respect of a decedent
  - { line: "17f", field: "Page2[0].f2_12[0]", type: money }  # Deduction for amortizable bond premium
  - { line: "17g", field: "Page2[0].f2_13[0]", type: money }  # Ordinary loss, contingent payment / inflation-indexed debt instrument
  - { line: "17h", field: "Page2[0].f2_14[0]", type: money }  # Repayment under a claim of right if over $3,000
  - { line: "17i", field: "Page2[0].f2_15[0]", type: money }  # Certain unrecovered investment in a pension
  - { line: "17j", field: "Page2[0].f2_16[0]", type: money }  # Impairment-related work expenses of a disabled person
  - { line: "17k", field: "Page2[0].f2_17[0]", type: money }  # Deductible educator expenses not reported on Schedule 1
  - { line: "17z", field: "Page2[0].f2_18[0]", type: money }  # Add lines 17a through 17k
  # ----- Total Itemized Deductions -----
  - { line: "18.not_limited", field: "Page2[0].c2_1[0]", type: checkbox, on_state: "/1", group: line18_limited }
  - { line: "18.may_be_limited", field: "Page2[0].c2_1[1]", type: checkbox, on_state: "/2", group: line18_limited }
  - { line: "18", field: "Page2[0].f2_19[0]", type: money }  # total -> Form 1040 line 12e
  # "If you elect to itemize deductions even though they are less than your standard deduction, check
  # this box"
  - { line: "19", field: "Page2[0].Line19_ReadOrder[0].c2_2[0]", type: checkbox, on_state: "/1" }
relations:
  - "4 == max(0, 1 - 3)"             # "Subtract line 3 from line 1. If line 3 is more than line 1, enter -0-"
  - "5d == 5a + 5b + 5c"             # "Add lines 5a through 5c"
  - "7 == 5e + 6"                    # "Add lines 5e and 6"
  - "8e == 8a + 8b + 8c + 8d"        # "Add lines 8a through 8d"
  - "10 == 8e + 9"                   # "Add lines 8e and 9"
  - "15 == 13 + 14"                  # "Add lines 13 and 14"
  - "17z == sum(17a..17k)"           # "Add lines 17a through 17k"
cross_form:
  - "2 == f1040.11b"                 # "Enter amount from Form 1040 or 1040-SR, line 11b"
  - "18 == f1040.12e"                # "Also enter this amount on Form 1040 or 1040-SR, line 12e" (the worksheet amount on "Yes")
identity_fields:
  - name
  - identifying_number
