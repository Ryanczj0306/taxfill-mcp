# Form 1040-ES (2026) -- Estimated Tax for Individuals -- the FINAL revision.
#
# Mapped from irs.gov/pub/irs-prior/f1040es--2026.pdf (/Title "2026 Form 1040-ES",
# page 1 "2026 / Form 1040-ES", footer stamp "Created 2/12/26"; 16 pages, 118
# widgets). Phase J JT3d. This is the ONE 2026 pack whose own final revision is its
# authority (filing_grade_basis: own_final_revision, allowlisted by
# OWN_FINAL_REVISION_FORMS): the vouchers fall due during 2026 (the Q4 voucher on
# Jan. 15, 2027) while the TY2026 knowledge pack stays planning-only, so it fills
# and verifies WITHOUT rehearsal. The due dates printed on the vouchers are the
# form's own (April 15, June 15 and Sept. 15, 2026; Jan. 15, 2027).
#
# WHAT THIS PACK FILLS: the four detachable payment vouchers -- the only part of
# Form 1040-ES that is filed. Each carries the same 14 fields as in 2025. Every
# binding was RE-INTROSPECTED by rect (pypdf widget dump: name + rect + MaxLen);
# ALL 56 mapped names changed from 2025, because the booklet grew from 12 to 16
# pages:
#   - vouchers 1-3 moved from 2025 pdf page 11 (Page11[0].f11_*) to pdf page 15
#     (Page15[0].f15_*), printed top-to-bottom as 3, 2, 1: voucher 3 = f15_1..14,
#     voucher 2 = f15_15..28, voucher 1 = f15_29..42 (2025's names had a gap at
#     f11_2; 2026 runs without gaps);
#   - voucher 4 moved from pdf page 10 (Page10[0].f10_*) to pdf page 14
#     (Page14[0].f14_1..14).
# Per block: amount, your first/last name, SSN (/MaxLen 11), spouse first/last
# name, spouse SSN (/MaxLen 11), address, city, state (/MaxLen 2), ZIP (/MaxLen
# 10), foreign country / province / postal code.
#
# NOT MAPPED (62 of 118), the same classes as 2025: the page-12 Estimated Tax
# Worksheet (f12_1..f12_23 + the c12_1/c12_2 Yes/No kid pairs = 27), the page-13
# Record of Estimated Tax Payments (f13_1..f13_27 + four 1-pt Date1..4 structural
# fields = 31) — the taxpayer's private computation and ledger, never mailed; the
# engine's calc owns that math — and the four LinkActivator push-buttons over the
# "Pay online" panels (1 on page 14, 3 on page 15). The vouchers carry no
# signature block.
