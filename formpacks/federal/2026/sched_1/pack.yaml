# Schedule 1 (Form 1040) 2026 — Additional Income and Adjustments to Income — DRAFT.
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040s1--dft.pdf,
# footer "Schedule 1 (Form 1040) 2026 Created 4/24/26"). Its cover sheet: "there
# are never any changes to the last posted draft of the form and the final
# revision of the form". PDF page 1 is that cover sheet; the form's two pages
# are PDF pages 2-3. When the final posts at irs-prior/f1040s1--2026.pdf,
# re-pin source_url, pdf_sha256, source_status final, drop draft_created, and
# re-read the face. TY2026 is planning-only, so this pack fills only in
# REHEARSAL mode. Attachment Sequence No. 01; no signature block; mailed in
# the parent return's envelope. Line 10 feeds Form 1040 line 8 and line 26 its
# line 10 — those cross_form rules live on the parent pack. Phase J JT3c.
#
# PORTED 2026-09-27 from formpacks/federal/2025/sched_1/pack.yaml (read that
# pack's header for the field-map notes). MECHANICAL TOPOLOGY DIFF, 2025 final
# -> 2026 draft: the same 73 widgets; 71 in place, and two changes:
#   - line 14's storage-fees checkbox c2_1 moved 117pt right: the row now reads
#     "Moving expenses for members of the Armed Forces and the intelligence
#     community. Attach Form 3903. If claiming only storage fees (see
#     instructions), check here";
#   - line 24a's widget f2_16 sits under Line24_ReadOrder (2025:
#     Line24a_ReadOrder), the same box.
# Printed-face diff otherwise: the year, and every sub-line now prints its
# full designator ("2b", "8a".."8z", "19b", "19c", "24a".."24z"; 2025 printed
# the bare letters). No line was renumbered, so the relations carry over.
# The widgets' /DA is 9pt (2025: 8pt), so the 8z/24z two-row write-ins take
# maxlen 70 (2025: 79) — the verify clipping budget, 317pt / (0.5 x 9pt).

form: "1040 Schedule 1"
jurisdiction: federal
tax_year: 2026
source_url: https://www.irs.gov/pub/irs-dft/f1040s1--dft.pdf
pdf_sha256: "a017a1b717d1c70ff8d831ef8b73c730e5b24f147c394c37f792035a9df22fad"
source_status: draft
draft_created: "4/24/26"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header (page 1) ----
  - line: name
    field: "Page1[0].f1_01[0]"
    type: text
  - line: identifying_number
    field: "Page1[0].f1_02[0]"
    type: text
    maxlen: 11
    format: ssn_digits_only

  # ---- pre-Part I 1099-K block (page 1, unnumbered) ----
  - line: form_1099k.error_or_personal_loss
    field: "Page1[0].f1_03[0]"
    type: money

  # ---- Part I — Additional Income (page 1) ----
  - line: "1"
    field: "Page1[0].f1_04[0]"
    type: money
  - line: "2a"
    field: "Page1[0].f1_05[0]"
    type: money
  - line: "2b" # date of original divorce or separation agreement (MM/DD/YYYY)
    field: "Page1[0].f1_06[0]"
    type: text
  - line: "3"
    field: "Page1[0].f1_07[0]"
    type: money
  - line: 4.form_4797 # "Check if any from Form(s): 4797" — check-all-that-apply, NOT a radio group
    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
  - line: 4.form_4684 # "... 4684" — independent of 4.form_4797, both may be checked
    field: "Page1[0].c1_2[0]"
    type: checkbox
    on_state: "/1"
  - line: "4"
    field: "Page1[0].f1_08[0]"
    type: money
  - line: "5"
    field: "Page1[0].f1_09[0]"
    type: money
  - line: "6"
    field: "Page1[0].f1_10[0]"
    type: money
  - line: 7.repaid # "If you repaid a 2026 overpayment (see instructions), check here"
    field: "Page1[0].Line7_ReadOrder[0].c1_3[0]"
    type: checkbox
    on_state: "/1"
  - line: 7.repaid_amount # "and enter amount repaid:" — informational, not in the line-10 combine
    field: "Page1[0].Line7_ReadOrder[0].f1_11[0]"
    type: money
  - line: "7"
    field: "Page1[0].f1_12[0]"
    type: money
  - line: "8a" # net operating loss — printed in parentheses, enter as negative
    field: "Page1[0].Line8a_ReadOrder[0].f1_13[0]"
    type: money
  - line: "8b"
    field: "Page1[0].f1_14[0]"
    type: money
  - line: "8c"
    field: "Page1[0].f1_15[0]"
    type: money
  - line: "8d" # foreign earned income exclusion (Form 2555) — parenthesized, negative
    field: "Page1[0].f1_16[0]"
    type: money
  - line: "8e"
    field: "Page1[0].f1_17[0]"
    type: money
  - line: "8f"
    field: "Page1[0].f1_18[0]"
    type: money
  - line: "8g"
    field: "Page1[0].f1_19[0]"
    type: money
  - line: "8h"
    field: "Page1[0].f1_20[0]"
    type: money
  - line: "8i"
    field: "Page1[0].f1_21[0]"
    type: money
  - line: "8j"
    field: "Page1[0].f1_22[0]"
    type: money
  - line: "8k"
    field: "Page1[0].f1_23[0]"
    type: money
  - line: "8l"
    field: "Page1[0].f1_24[0]"
    type: money
  - line: "8m"
    field: "Page1[0].f1_25[0]"
    type: money
  - line: "8n"
    field: "Page1[0].f1_26[0]"
    type: money
  - line: "8o"
    field: "Page1[0].f1_27[0]"
    type: money
  - line: "8p"
    field: "Page1[0].f1_28[0]"
    type: money
  - line: "8q"
    field: "Page1[0].f1_29[0]"
    type: money
  - line: "8r"
    field: "Page1[0].f1_30[0]"
    type: money
  - line: "8s" # nontaxable Medicaid waiver payments — parenthesized, negative
    field: "Page1[0].f1_31[0]"
    type: money
  - line: "8t"
    field: "Page1[0].f1_32[0]"
    type: money
  - line: "8u"
    field: "Page1[0].f1_33[0]"
    type: money
  - line: "8v" # digital assets received as ordinary income not reported elsewhere
    field: "Page1[0].f1_34[0]"
    type: money
  - line: "8z.type" # "Other income. List type and amount:" — ONE two-row multiline widget (2024's .type/.type_2 merged)
    field: "Page1[0].Line8z_ReadOrder[0].f1_35[0]"
    type: text
    maxlen: 70 # verify width-heuristic budget at the draft's fixed 9pt bold (317pt / 4.5pt); wraps within the 2 rows
  - line: "8z"
    field: "Page1[0].f1_36[0]"
    type: money
  - line: "9"
    field: "Page1[0].f1_37[0]"
    type: money
  - line: "10"
    field: "Page1[0].f1_38[0]"
    type: money

  # ---- Part II — Adjustments to Income (page 2) ----
  - line: "11"
    field: "Page2[0].f2_01[0]"
    type: money
  - line: "12"
    field: "Page2[0].f2_02[0]"
    type: money
  - line: "13"
    field: "Page2[0].f2_03[0]"
    type: money
  - line: 14.storage_fees_only # "If claiming only storage fees (see instructions), check here" (the 2026 row now reads "Moving expenses for members of the Armed Forces and the intelligence community", so the box sits 117pt further right)
    field: "Page2[0].c2_1[0]"
    type: checkbox
    on_state: "/1"
  - line: "14"
    field: "Page2[0].f2_04[0]"
    type: money
  - line: "15"
    field: "Page2[0].f2_05[0]"
    type: money
  - line: "16"
    field: "Page2[0].f2_06[0]"
    type: money
  - line: "17"
    field: "Page2[0].f2_07[0]"
    type: money
  - line: "18"
    field: "Page2[0].f2_08[0]"
    type: money
  - line: "19a"
    field: "Page2[0].f2_09[0]"
    type: money
  - line: "19b" # alimony recipient's SSN — 9-cell comb
    field: "Page2[0].Line19b_CombField[0].f2_10[0]"
    type: text
    maxlen: 9
    comb: true
    format: ssn_digits_only
  - line: "19c" # date of original divorce or separation agreement (MM/DD/YYYY)
    field: "Page2[0].f2_11[0]"
    type: text
  - line: 20.mfs_lived_apart # "married filing separately and lived apart ... entire year, check here"
    field: "Page2[0].c2_2[0]"
    type: checkbox
    on_state: "/1"
  - line: "20"
    field: "Page2[0].f2_12[0]"
    type: money
  - line: "21"
    field: "Page2[0].f2_13[0]"
    type: money
  - line: "22" # printed "Reserved for future use" — leave blank. ReadOnly (/Ff 8388609) on the draft as in 2025; kept mapped because the printed line-26 sum names it (RESERVED_LINE_KEEPS)
    field: "Page2[0].f2_14[0]"
    type: money
    reserved: true                          # printed "Reserved for future use" (RESERVED_LINE_KEEPS; JEa)
  - line: "23"
    field: "Page2[0].f2_15[0]"
    type: money
  - line: "24a"
    field: "Page2[0].Line24_ReadOrder[0].f2_16[0]"
    type: money
  - line: "24b"
    field: "Page2[0].f2_17[0]"
    type: money
  - line: "24c"
    field: "Page2[0].f2_18[0]"
    type: money
  - line: "24d"
    field: "Page2[0].f2_19[0]"
    type: money
  - line: "24e"
    field: "Page2[0].f2_20[0]"
    type: money
  - line: "24f"
    field: "Page2[0].f2_21[0]"
    type: money
  - line: "24g"
    field: "Page2[0].f2_22[0]"
    type: money
  - line: "24h"
    field: "Page2[0].f2_23[0]"
    type: money
  - line: "24i"
    field: "Page2[0].f2_24[0]"
    type: money
  - line: "24j"
    field: "Page2[0].f2_25[0]"
    type: money
  - line: "24k"
    field: "Page2[0].f2_26[0]"
    type: money
  - line: "24z.type" # "Other adjustments. List type and amount:" — ONE two-row multiline widget (2024's .type/.type_2 merged)
    field: "Page2[0].Line24z_ReadOrder[0].f2_27[0]"
    type: text
    maxlen: 70 # verify width-heuristic budget at the draft's fixed 9pt bold (317pt / 4.5pt); wraps within the 2 rows
  - line: "24z"
    field: "Page2[0].f2_28[0]"
    type: money
  - line: "25"
    field: "Page2[0].f2_29[0]"
    type: money
  - line: "26"
    field: "Page2[0].f2_30[0]"
    type: money

# Form-face math only (printed combine/add instructions). sum() ranges
# expand a..z; letters with no mapped line (8w-8y, 24l-24y) count as blank=0.
# 7.repaid_amount is deliberately NOT in the line-10 combine — the face sums
# line 7 itself.
relations:
  - "9 == sum(8a..8z)"                                        # "Add lines 8a through 8z"
  - "10 == 1 + 2a + 3 + 4 + 5 + 6 + 7 + 9"                    # "Combine lines 1 through 7 and 9"
  - "25 == sum(24a..24z)"                                     # "Add lines 24a through 24z"
  - "26 == 11 + 12 + 13 + 14 + 15 + 16 + 17 + 18 + 19a + 20 + 21 + 22 + 23 + 25" # "Add lines 11 through 23 and 25"

# Line 10 -> f1040/f1040nr line 8 and line 26 -> f1040 line 10 live on the
# parent packs per the form notes and CONVENTIONS.md. Nothing on this form's
# face references Schedule 1-A (and sched_1a is not a valid cross-form key).
cross_form: []

identity_fields: [name, identifying_number]

# Schedules carry no signature block of their own and are mailed inside the
# parent return's envelope (CONVENTIONS.md).
signature: null
mailing: null
