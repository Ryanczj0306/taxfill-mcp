# Form 1116 (2026) — Foreign Tax Credit (Individual, Estate, or Trust) — DRAFTS-FIRST (Phase J JT5e,
# read 2026-09-28).
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1116--dft.pdf, footer "Form 1116 (2026)
# Created 7/1/26"). PDF page 1 is the IRS cover sheet, so the form's pages 1 and 2 are PDF pages 2 and 3.
# When the final posts at irs-prior/f1116--2026.pdf, re-pin source_url, pdf_sha256 and source_status final,
# drop draft_created, and re-read the face. TY2026 is planning-only (rehearsal mode only). No signature block.
#
# 130 widgets (2025: 118), all mapped; every binding re-read off the draft's own containers.
# 2025 -> 2026, read off the draft face:
# - Part I keeps its lines (i, 1a, 1b, 2-7); the text leaves renumber down by 2-3 because 1a's three column
#   boxes are f1_08-f1_10 now. "7 Subtract line 6 from line 1a. Enter the result here and on page 2, line 15".
# - Part II MOVES to page 2 and GROWS two PTEP columns in each half. Foreign currency: (l) date paid or
#   accrued, (m) dividends, (n) rents and royalties, (o) interest, NEW "(p)(1) Distributions of previously
#   taxed earnings and profits (PTEP)", NEW "(p)(2) PTEP group (see instructions)", (q) other foreign taxes
#   paid or accrued. U.S. dollars: (r) dividends, (s) rents and royalties, (t) interest, NEW (u)(1)
#   distributions of PTEP, NEW (u)(2) PTEP group, (v) other, "(w) Total foreign taxes paid or accrued (add
#   cols. (r) through (v))". TRAP — the letters SHIFT: the 2025 keys line_<row>.q-.u (the U.S.-dollar
#   columns) are 2026 .r-.w, and 2026 .q is the foreign-currency "other" column (2025 .p). Keys follow the
#   2026 print: line_<row>.l/.m/.n/.o/.p1/.p2/.q/.r/.s/.t/.u1/.u2/.v/.w. The two "PTEP group" columns are
#   typed text (a group designation until the unposted instructions say otherwise); every other
#   foreign-currency cell stays text, as in 2025. "8 Add lines A through C, column (w). Enter the total here
#   and on Part III, line 9".
# - Part III/IV keep lines 9-35. Line 18 now reads "Subtract Form 1040, 1040-SR, or 1040-NR, line 14, from
#   ... line 11b. Increase the result by the amount from Schedule 1-A (Form 1040), line 43" (2025: line 37).
#   The line-10 "don't need to attach Schedule B" box's on-state is /1 (2025: /Accrued).
#
# Relations: the 2025 set, each re-read (9 == 8; 11 "Add lines 9 and 10"; 14 "Combine lines 11, 12, and 13"
# with 12 printed in parentheses; 15 == 7; 17; 23; 24 "the smaller of line 14 or line 23"; 32; 33; 35).
# Column (w) is not encoded (a total of per-row columns the relation grammar cannot name). Cross-form:
# "35 ... on Schedule 3 (Form 1040), line 1".
