# Form 8962 (2026) — Premium Tax Credit (PTC) — DRAFTS-FIRST (Phase J JT5e, read 2026-09-28).
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f8962--dft.pdf, footer "Form 8962 (2026)
# Created 4/21/26"). PDF page 1 is the IRS cover sheet, so the form's pages 1 and 2 are PDF pages 2 and 3.
# When the final posts at irs-prior/f8962--2026.pdf, re-pin source_url, pdf_sha256 and source_status final,
# drop draft_created, and re-read the face. TY2026 is planning-only, so this pack fills only in REHEARSAL
# mode. Attachment-only (no signature block).
#
# 143 widgets (2025: 141); 141 mapped. The two unmapped widgets are the ReadOnly reserved lines 28/29.
# 2025 -> 2026, read off the draft face and widget tree (every binding re-read; the text leaves renumber
# after the new line-6 radio and the table containers are renamed Part2_Table1/Part2_Table2):
# - NEW line 6 radio — the 400% cliff is back (OBBBA; JT1a): "Did you enter 401% on line 5?" No/Yes
#   (c1_3; /1 No prints first). In 2021-2025 line 6 was "Reserved for future use" with no widget.
# - Line 4's three poverty-table boxes move under Line4_ReadOrder (same c1_2 kids /1 /2 /3).
# - TRAP — Part III shrinks: "27 Excess advance payment of PTC. If line 25 is greater than line 24,
#   subtract line 24 from line 25. Enter the difference here and on Schedule 2 (Form 1040), line 1a"; lines
#   28 and 29 print "Reserved for future use" (2025: 28 the Table 5 repayment limitation, 29 the smaller of
#   27 or 28 -> Schedule 2 line 1a). The Schedule 2 leg moves from line 29 to line 27.
# - Parts IV-V keep their layout; the 30e-33f boxes gain Line<N>e/Line<N>f wrappers.
#
# Relations: the 2025 set, unchanged — the form-face math of lines 3, 8b, the 11-23 (d)/(e) columns, 24,
# 25, 26 and 27 prints identically. "8a == 3 * 7" stays undeclared (line 7 is a decimal text line; the 2025
# pack's reasoning), as do the method-conditional column (c) copies.
# Cross-form: "26 ... on Schedule 3 (Form 1040), line 9" and "27 ... on Schedule 2 (Form 1040), line 1a"
# (the 2026 sched_2 pack's line 1a is the excess APTC repayment). SKIPPED when the other schedule is absent.
