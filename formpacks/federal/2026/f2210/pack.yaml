# Form 2210 (2026) — Underpayment of Estimated Tax by Individuals, Estates,
# and Trusts — DRAFTS-FIRST. Phase J JP5c.
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f2210--dft.pdf,
# footer "Form 2210 (2026) Created 4/16/26"). PDF page 1 is the IRS cover
# sheet, so the form's three pages are PDF pages 2-4. When the final posts at
# irs-prior/f2210--2026.pdf, re-pin source_url, pdf_sha256 and source_status
# final, drop draft_created, and re-read the face (JT6). TY2026 is
# planning-only, so this pack fills only in REHEARSAL mode.
#
# PORTED 2026-09-28 from formpacks/federal/2025/f2210/pack.yaml — read that
# header for the form's logic: the keys, the independent recompute
# (penalty.form2210_lines), the relations the face does NOT support, and the
# cross-form choices. Quotes from the instructions are the 2025 ones; the 2026
# instructions are not posted.
#
# PROVENANCE: .cache/blanks/c9f9325bf16c_f2210--dft.pdf, 260,669 bytes, 4 PDF
# pages, 203 widgets, 32 ReadOnly, root topmostSubform[0], every text widget
# 9-point (2025: 8).
#
# MECHANICAL TOPOLOGY DIFF, 2025 final -> 2026 draft (199 -> 203 widgets):
#   - pages 1 and 2 keep every name; the rects move by a point;
#   - Schedule AI's Line9 group is renamed Line9a, and a NEW Line9b group
#     (f3_37..f3_40) follows it, so every Schedule AI widget from line 10 on
#     is renumbered +4 (line 10 = f3_41 ... line 36 = f3_145..f3_148).
# WHAT THE DRAFT FACE CHANGES:
#   - line 3 now reads "Refundable credits and other adjustments (see
#     instructions)" (2025: "Other payments and refundable credits");
#   - Schedule AI "9a Deduction for qualified business income" and a NEW "9b
#     Additional deductions (see instructions)", with "10 Add lines 8, 9a, and
#     9b". This is where the Schedule 1-A deductions enter (knowledge
#     estimated_tax_penalty.schedule_ai.additional_deductions: line_9b); the
#     2025 instructions put them in the line-14 tax figure instead;
#   - line 29's prorated social security limits move to "$46,125 $76,875
#     $123,000 $184,500" (the 2026 wage base, $184,500);
#   - the dates roll (4/15/26 ... 1/15/27).
# Everything else — every line number, every relation, the shaded cells — is
# the 2025 face.
#
# VISION AUDIT (2026-09-28): the same sentinel fill as the 2025 pack, in
# rehearsal mode, all four PDF pages rendered and READ. The cover sheet is
# untouched and every value is on its printed row and column, with 9a and 9b in
# their own rows and the new line-29 amounts printed, not filled.

form: "2210"
jurisdiction: federal
tax_year: 2026
source_url: https://www.irs.gov/pub/irs-dft/f2210--dft.pdf
pdf_sha256: "d195d1eb96f53224cf37cd19c542d85365cf9d76be9e6479b404cbb66445aad2"
source_status: draft
draft_created: "4/16/26"
acroform_root: "topmostSubform[0]"
fields:
  # ---- header (page 1) ----
  - line: "name"
    # "Name(s) shown on tax return"
    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"
