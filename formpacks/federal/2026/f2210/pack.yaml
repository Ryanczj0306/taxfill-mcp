    field: "Page1[0].f1_3[0]"
    type: money
  - line: "2"
    # "Other taxes, including self-employment tax and, if applicable, Additional Medicare Tax and/or Net Investment Income Tax (see instructions)" — the instructions' list of Schedule 2 lines, so no relation
    field: "Page1[0].f1_4[0]"
    type: money
  - line: "3"
    # "Refundable credits and other adjustments (see instructions)" (2025: "Other payments and refundable credits") — printed inside "(   )": entered as a positive amount and SUBTRACTED on line 4
    field: "Page1[0].f1_5[0]"
    type: money
  - line: "4"
    # "Current year tax. Combine lines 1, 2, and 3. If less than $1,000, stop; you don't owe a penalty. Don't file Form 2210"
    field: "Page1[0].f1_6[0]"
    type: money
  - line: "5"
    # "Multiply line 4 by 90% (0.90)" — INSET box (x 382-467)
    field: "Page1[0].f1_7[0]"
    type: money
  - line: "6"
    # "Withholding taxes. Don't include estimated tax payments. See instructions"
    field: "Page1[0].f1_8[0]"
    type: money
  - line: "7"
    # "Subtract line 6 from line 4. If less than $1,000, stop; you don't owe a penalty. Don't file Form 2210." No floor printed
    field: "Page1[0].f1_9[0]"
    type: money
  - line: "8"
    # "Maximum required annual payment based on prior year's tax (see instructions)" — the 100% / 110% prior-year safe harbor (calc op estimated_tax_safe_harbor)
    field: "Page1[0].f1_10[0]"
    type: money
  - line: "9"
    # "Required annual payment. Enter the smaller of line 5 or line 8"
    field: "Page1[0].f1_11[0]"
    type: money
  - line: "line9_more_than_line6.no"
    # "Next: Is line 9 more than line 6?" "No. You don't owe a penalty. Don't file Form 2210 unless box E below applies." — one /Btn with two kids
    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
    group: line9_more_than_line6
  - line: "line9_more_than_line6.yes"
    # "Yes. You may owe a penalty, but don't file Form 2210 unless one or more boxes in Part II below applies."
    field: "Page1[0].c1_1[1]"
    type: checkbox
    on_state: "/2"
    group: line9_more_than_line6
  # ---- Part II: Reasons for Filing. "Check applicable boxes." — independent boxes (several may apply), so no group ----
  - line: "part_ii.a"
    # box A: "You request a waiver (see instructions) of your entire penalty."
    field: "Page1[0].c1_2[0]"
    type: checkbox
    on_state: "/1"
  - line: "part_ii.b"
    # box B: "You request a waiver (see instructions) of part of your penalty."
    field: "Page1[0].c1_3[0]"
    type: checkbox
    on_state: "/1"
  - line: "part_ii.c"
    # box C: "Your income varied during the year and your penalty is reduced or eliminated when figured using the annualized income installment method. You must figure the penalty using Schedule AI and file Form 2210."
    field: "Page1[0].c1_4[0]"
    type: checkbox
    on_state: "/1"
  - line: "part_ii.d"
    # box D: "Your penalty is lower when figured by treating the federal income tax withheld from your income as paid on the dates it was actually withheld, instead of in equal amounts on the payment due dates."
    field: "Page1[0].c1_5[0]"
    type: checkbox
    on_state: "/1"
  - line: "part_ii.e"
    # box E: "You filed or are filing a joint return for either 2025 or 2026, but not for both years, and line 8 above is smaller than line 5 above."
    field: "Page1[0].c1_6[0]"
    type: checkbox
    on_state: "/1"
  # ---- Part III, Section A — Figure Your Underpayment (page 2): columns (a) 4/15/26, (b) 6/15/26, (c) 9/15/26, (d) 1/15/27 ----
