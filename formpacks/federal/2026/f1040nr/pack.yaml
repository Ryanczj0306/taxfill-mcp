  # instructions)  Yes  No" — one radio (the 1040 asks it per spouse; the
  # 1040-NR has one filer). Not marked required: the 2026 Form 1040-NR
  # instructions that would say so are not posted.
  - { line: "citizen_or_work_authorized.yes", field: "Page1[0].c1_7[0]", type: checkbox, on_state: "/1", group: citizen_or_work_authorized }
  - { line: "citizen_or_work_authorized.no", field: "Page1[0].c1_7[1]", type: checkbox, on_state: "/2", group: citizen_or_work_authorized }
