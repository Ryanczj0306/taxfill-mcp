  - { line: "16.form_other_number", field: "Page2[0].f2_09[0]", type: text, maxlen: 8 }
  - { line: "16", field: "Page2[0].f2_10[0]", type: money } # Tax
  - { line: "17", field: "Page2[0].f2_11[0]", type: money } # Amount from Schedule 2 (Form 1040), line 3
  - { line: "18", field: "Page2[0].f2_12[0]", type: money } # Add lines 16 and 17
  - { line: "19", field: "Page2[0].f2_13[0]", type: money } # Child tax credit or credit for other dependents (Schedule 8812)
  - { line: "20", field: "Page2[0].f2_14[0]", type: money } # Amount from Schedule 3 (Form 1040), line 8
  - { line: "21", field: "Page2[0].f2_15[0]", type: money } # Add lines 19 and 20
  - { line: "22", field: "Page2[0].f2_16[0]", type: money } # Subtract line 21 from line 18
  - { line: "23a", field: "Page2[0].Line23a_ReadOrder[0].f2_17[0]", type: money } # Tax on income not effectively connected (Schedule NEC, line 15)
  - { line: "23b", field: "Page2[0].f2_18[0]", type: money } # Additional taxes, including self-employment tax, from Schedule 2 (Form 1040), line 21
  - { line: "23c", field: "Page2[0].f2_19[0]", type: money } # Transportation tax
  - { line: "23d", field: "Page2[0].f2_20[0]", type: money } # Add lines 23a through 23c
  # 2025 line 24 splits in three (as on the 2026 Form 1040)
  - { line: "24a", field: "Page2[0].f2_21[0]", type: money } # Add lines 22 and 23d. This is your total tax
  - { line: "24b", field: "Page2[0].f2_22[0]", type: money } # NEW: amount from Form 1062, line 15
  - { line: "24c", field: "Page2[0].f2_23[0]", type: money } # NEW: add lines 24a and 24b
  # --- payments and refundable credits ---
  - { line: "25a", field: "Page2[0].Line25_ReadOrder[0].f2_24[0]", type: money } # Federal income tax withheld: Form(s) W-2
  - { line: "25b", field: "Page2[0].f2_25[0]", type: money } # Form(s) 1099
  - { line: "25c", field: "Page2[0].f2_26[0]", type: money } # Other forms
  - { line: "25d", field: "Page2[0].f2_27[0]", type: money } # Add lines 25a through 25c
  - { line: "25e", field: "Page2[0].f2_28[0]", type: money } # Form(s) 8805
  - { line: "25f", field: "Page2[0].f2_29[0]", type: money } # Form(s) 8288-A
  - { line: "25g", field: "Page2[0].f2_30[0]", type: money } # Form(s) 1042-S
  - { line: "26", field: "Page2[0].f2_31[0]", type: money } # 2026 estimated tax payments and amount applied from 2025 return
  # line 27 "Reserved for future use": ReadOnly (/Ff 8388609, re-read on the
  # 2026 draft) + shaded — MUST BE LEFT BLANK (nonresidents cannot claim the
  # EIC). Kept mapped so the printed line number stays addressable (P-007
  # reserved-line class). Line 32a is 28+29+30+31 — it never names 27.
  - { line: "27", field: "Page2[0].f2_32[0]", type: money } # RESERVED — leave blank
  # Line 28 ACTC: the 2025 decline-ACTC checkbox is GONE (the draft prints none)
  - { line: "28", field: "Page2[0].f2_33[0]", type: money } # Additional child tax credit (Schedule 8812)
  - { line: "29", field: "Page2[0].f2_34[0]", type: money } # Credit for amount paid with Form 1040-C
  - { line: "30", field: "Page2[0].f2_35[0]", type: money } # Refundable adoption credit from Form 8839, line 13
  - { line: "31", field: "Page2[0].Line31-3a_RedOrder[0].f2_36[0]", type: money } # Amount from Schedule 3 (Form 1040), line 15
  # 2025 line 32 splits in three; the margin prints "If you entered an amount
  # on line 28 or 30, attach Sch. 3-A."
  - { line: "32a", field: "Page2[0].Line31-3a_RedOrder[0].f2_37[0]", type: money } # Add lines 28, 29, 30, and 31
  - { line: "32b", field: "Page2[0].f2_38[0]", type: money } # NEW: amount from Schedule 3-A
  - { line: "32c", field: "Page2[0].f2_39[0]", type: money } # NEW: subtract line 32b from line 32a
  - { line: "33", field: "Page2[0].f2_40[0]", type: money } # Total payments
  # --- refund ---
  - { line: "34", field: "Page2[0].f2_41[0]", type: money } # Amount you overpaid
  - { line: "35a.form_8888", field: "Page2[0].c2_5[0]", type: checkbox, on_state: "/1" }
  - { line: "35a", field: "Page2[0].f2_42[0]", type: money } # Amount of line 34 you want refunded to you
  - { line: "35b", field: "Page2[0].RoutingNo[0].f2_43[0]", type: text, maxlen: 9, comb: true, format: ssn_digits_only }
  - { line: "35c.checking", field: "Page2[0].c2_6[0]", type: checkbox, on_state: "/1", group: "35c" }
  - { line: "35c.savings", field: "Page2[0].c2_6[1]", type: checkbox, on_state: "/2", group: "35c" }
  - { line: "35d", field: "Page2[0].AccountNo[0].f2_44[0]", type: text, maxlen: 17, comb: true, format: ssn_digits_only }
  - { line: "35e", field: "Page2[0].f2_45[0]", type: text } # Refund check mailed to an address outside the United States
  - { line: "36", field: "Page2[0].f2_46[0]", type: money } # Amount of line 34 applied to your 2027 estimated tax
  # --- amount you owe ---
  - { line: "37", field: "Page2[0].f2_47[0]", type: money } # Amount you owe (subtract line 33 from line 24c)
  - { line: "38", field: "Page2[0].f2_48[0]", type: money } # Estimated tax penalty
  # --- third party designee (optional block) ---
  - { line: "third_party_designee.yes", field: "Page2[0].c2_7[0]", type: checkbox, on_state: "/1", group: third_party_designee }
  - { line: "third_party_designee.no", field: "Page2[0].c2_7[1]", type: checkbox, on_state: "/2", group: third_party_designee }
  - { line: "third_party_designee.name", field: "Page2[0].f2_49[0]", type: text }
  - { line: "third_party_designee.phone", field: "Page2[0].f2_50[0]", type: text }
  - { line: "third_party_designee.pin", field: "Page2[0].f2_51[0]", type: text, maxlen: 5, comb: true, format: ssn_digits_only }
  # --- sign here block (signature and date are handwritten; no PDF fields) ---
  - { line: "occupation", field: "Page2[0].f2_52[0]", type: text }
  - { line: "identity_protection_pin", field: "Page2[0].f2_53[0]", type: text, maxlen: 6, comb: true, format: ssn_digits_only }
  - { line: "phone", field: "Page2[0].f2_54[0]", type: text }
  - { line: "email", field: "Page2[0].f2_55[0]", type: text }
relations:
  # Math printed on the 2026 draft face only (worksheets/tax tables live in calc).
  - "1z == sum(1a..1h)"                 # "Add lines 1a through 1h"
  - "9 == 1z + 2b + 3b + 4b + 5b + 7a + 8"   # "Add lines 1z, 2b, 3b, 4b, 5b, 7a, and 8"
  - "11a == 9 - 10"                     # "Subtract line 10 from line 9. This is your adjusted gross income"
  - "11b == 11a"                        # "Amount from line 11a (adjusted gross income)"
  - "14 == 12a + 12b + 13a + 13b + 13c" # "Add lines 12a through 13c"
  - "15 == max(0, 11b - 14)"            # "Subtract line 14 from line 11b. If zero or less, enter -0-"
  - "18 == 16 + 17"                     # "Add lines 16 and 17"
  - "21 == 19 + 20"                     # "Add lines 19 and 20"
  - "22 == max(0, 18 - 21)"             # "Subtract line 21 from line 18. If zero or less, enter -0-"
  - "23d == sum(23a..23c)"              # "Add lines 23a through 23c"
  - "24a == 22 + 23d"                   # "Add lines 22 and 23d. This is your total tax"
  - "24c == 24a + 24b"                  # "Add lines 24a and 24b"
  - "25d == sum(25a..25c)"              # "Add lines 25a through 25c"
  - "32a == 28 + 29 + 30 + 31"          # "Add lines 28, 29, 30, and 31"
  - "32c == 32a - 32b"                  # "Subtract line 32b from line 32a"
  - "33 == 25d + 25e + 25f + 25g + 26 + 32c"  # "Add lines 25d, 25e, 25f, 25g, 26, and 32c. These are your total payments"
  - "34 == max(0, 33 - 24c)"            # "If line 33 is more than line 24c, subtract line 24c from line 33"
  - "37 == max(0, 24c - 33)"            # "Subtract line 33 from line 24c. This is the amount you owe"
cross_form:
  - "1k == sched_oi.1e"                 # "Total income exempt by a treaty from Schedule OI (Form 1040-NR), item L, line 1(e)"
  - "8 == sched_1.10"                   # "Additional income from Schedule 1 (Form 1040), line 10"
  - "10 == sched_1.26"                  # "Adjustments to income from Schedule 1 (Form 1040), line 26"
  - "13a == sched_1a.44"                # "Additional deductions from Schedule 1-A, line 44"
  - "17 == sched_2.3"                   # "Amount from Schedule 2 (Form 1040), line 3"
  - "20 == sched_3.8"                   # "Amount from Schedule 3 (Form 1040), line 8"
  - "23b == sched_2.21"                 # "Additional taxes, including self-employment tax, from Schedule 2 (Form 1040), line 21"
  - "31 == sched_3.15"                  # "Amount from Schedule 3 (Form 1040), line 15"
# The form splits name and address; identity checks compare the split parts.
# state/zip stay out: they are legitimately blank for foreign-address filers.
identity_fields:
  - name.first
  - name.last
  - identifying_number
  - mailing_address.street
  - mailing_address.city
# PDF page 3 of the draft (page 1 is the IRS cover sheet); page 2 on the final.
signature:
  page: 3
  standalone_only: false
# The 2026 Form 1040-NR instructions (where the addresses print) are not
# posted, so no address is stated — never carried from 2025 (JT2b; the
# knowledge pack's f1040nr pair is None for the same reason).
mailing: null
