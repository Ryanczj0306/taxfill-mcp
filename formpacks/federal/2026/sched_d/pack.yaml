# Schedule D (Form 1040) — Capital Gains and Losses — 2026 DRAFT.
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040sd--dft.pdf,
# footer "Created 4/1/26"). Its cover sheet: "there are never any changes to
# the last posted draft of the form and the final revision of the form". PDF page
# 1 is that cover sheet; the form is PDF pages 2-3. When the final posts at
# irs-prior/f1040sd--2026.pdf, re-pin source_url, pdf_sha256, source_status final,
# drop draft_created, and re-read the face. TY2026 is planning-only, so this pack
# fills only in REHEARSAL mode. Phase J JT3d.
#
# PORTED 2026-09-27 from formpacks/federal/2025/sched_d/pack.yaml — read that pack's
# header for the field-map notes; the comments below are its own and describe
# the 2025 revision's history. MECHANICAL TOPOLOGY DIFF, 2025 final -> 2026
# draft: every widget keeps its name, rect, /MaxLen and /AP states. Printed-face
# diff: the year in the title block and the page headers/footers only. No line was renumbered, so relations and cross_form carry
# over unchanged.

form: "Schedule D (Form 1040)"
jurisdiction: federal
tax_year: 2026
source_url: https://www.irs.gov/pub/irs-dft/f1040sd--dft.pdf
pdf_sha256: "0df9af0711964b3198ea04bb0037b29d6afa85578a671553daed46251630b5f1"
source_status: draft
draft_created: "4/1/26"
acroform_root: "topmostSubform[0]"
fields:
  # --- Header ---
  - line: name                       # Name(s) shown on return
    field: Page1[0].f1_1[0]          # 2025 rename: was f1_01 in 2023
    type: text
  - line: identifying_number         # Your social security number
    field: Page1[0].f1_2[0]          # 2025 rename: was f1_02 in 2023
    type: text
    maxlen: 11
  # Separate-widget Yes/No pair: the `group` id is what makes it mutually
  # exclusive, and required — the header question is printed for every filer
  # (see the checkbox-groups note in the header; P-008/P-003).
  - line: qof.yes                    # "Did you dispose of any investment(s) in a QOF...?" — Yes
    field: Page1[0].c1_1[0]
    type: checkbox
    on_state: "/1"
    group: qof
    required: true
  - line: qof.no                     # ...QOF question — No
    field: Page1[0].c1_1[1]
    type: checkbox
    on_state: "/2"
    group: qof

  # --- Part I: Short-Term Capital Gains and Losses (assets held 1 year or less) ---
  - line: 1a.d                       # Line 1a — 1099-B/1099-DA basis reported to IRS, no adjustments; (d) Proceeds
    field: Page1[0].Table_PartI[0].Row1a[0].f1_3[0]   # 2025 rename: was f1_03
    type: money
  - line: 1a.e                       # 1a (e) Cost or other basis
    field: Page1[0].Table_PartI[0].Row1a[0].f1_4[0]   # 2025 rename: was f1_04
    type: money
  # 1a column (g) is NOT mapped: the row is the "no adjustments" row, so the
  # cell is shaded solid grey and its widget (2025 name f1_5, was f1_05_RO)
  # still carries the ReadOnly bit — there is no correct entry. See the header
  # note + pitfall P-007.
  - line: 1a.h                       # 1a (h) Gain or (loss) — for row 1a this is just (d) − (e)
    field: Page1[0].Table_PartI[0].Row1a[0].f1_6[0]   # 2025 rename: was f1_06
    type: money
  - line: 1b.d                       # Line 1b — totals for Form 8949 Box A or Box G checked; (d) Proceeds
    field: Page1[0].Table_PartI[0].Row1b[0].f1_7[0]   # 2025 rename: was f1_07
    type: money
  - line: 1b.e                       # 1b (e) Cost or other basis
    field: Page1[0].Table_PartI[0].Row1b[0].f1_8[0]   # 2025 rename: was f1_08
    type: money
  - line: 1b.g                       # 1b (g) Adjustments
    field: Page1[0].Table_PartI[0].Row1b[0].f1_9[0]   # 2025 rename: was f1_09
    type: money
  - line: 1b.h                       # 1b (h) Gain or (loss)
    field: Page1[0].Table_PartI[0].Row1b[0].f1_10[0]
    type: money
  - line: 2.d                        # Line 2 — totals for Form 8949 Box B or Box H checked; (d) Proceeds
    field: Page1[0].Table_PartI[0].Row2[0].f1_11[0]
    type: money
  - line: 2.e                        # 2 (e) Cost or other basis
    field: Page1[0].Table_PartI[0].Row2[0].f1_12[0]
    type: money
  - line: 2.g                        # 2 (g) Adjustments
    field: Page1[0].Table_PartI[0].Row2[0].f1_13[0]
    type: money
  - line: 2.h                        # 2 (h) Gain or (loss)
    field: Page1[0].Table_PartI[0].Row2[0].f1_14[0]
    type: money
  - line: 3.d                        # Line 3 — totals for Form 8949 Box C or Box I checked; (d) Proceeds
    field: Page1[0].Table_PartI[0].Row3[0].f1_15[0]
    type: money
  - line: 3.e                        # 3 (e) Cost or other basis
    field: Page1[0].Table_PartI[0].Row3[0].f1_16[0]
    type: money
  - line: 3.g                        # 3 (g) Adjustments
    field: Page1[0].Table_PartI[0].Row3[0].f1_17[0]
    type: money
  - line: 3.h                        # 3 (h) Gain or (loss)
    field: Page1[0].Table_PartI[0].Row3[0].f1_18[0]
    type: money
  - line: "4"                        # Short-term gain from Form 6252; ST gain/(loss) from Forms 4684, 6781, 8824
    field: Page1[0].f1_19[0]
    type: money
  - line: "5"                        # Net ST gain/(loss) from partnerships, S corps, estates, trusts (Sch K-1)
    field: Page1[0].f1_20[0]
    type: money
  - line: "6"                        # Short-term capital loss carryover (Capital Loss Carryover Worksheet, line 8)
    field: Page1[0].f1_21[0]
    type: money
  - line: "7"                        # Net short-term capital gain or (loss). Combine lines 1a–6 in column (h)
    field: Page1[0].f1_22[0]
    type: money

  # --- Part II: Long-Term Capital Gains and Losses (assets held more than 1 year) ---
  - line: 8a.d                       # Line 8a — 1099-B/1099-DA basis reported to IRS, no adjustments; (d) Proceeds
    field: Page1[0].Table_PartII[0].Row8a[0].f1_23[0]
    type: money
  - line: 8a.e                       # 8a (e) Cost or other basis
    field: Page1[0].Table_PartII[0].Row8a[0].f1_24[0]
    type: money
  # 8a column (g) is NOT mapped: the row is the "no adjustments" row, so the
  # cell is shaded solid grey and its widget (2025 name f1_25, was f1_25_RO)
  # still carries the ReadOnly bit — there is no correct entry. See the header
  # note + pitfall P-007.
  - line: 8a.h                       # 8a (h) Gain or (loss) — for row 8a this is just (d) − (e)
    field: Page1[0].Table_PartII[0].Row8a[0].f1_26[0]
    type: money
  - line: 8b.d                       # Line 8b — totals for Form 8949 Box D or Box J checked; (d) Proceeds
    field: Page1[0].Table_PartII[0].Row8b[0].f1_27[0]
    type: money
  - line: 8b.e                       # 8b (e) Cost or other basis
    field: Page1[0].Table_PartII[0].Row8b[0].f1_28[0]
    type: money
  - line: 8b.g                       # 8b (g) Adjustments
    field: Page1[0].Table_PartII[0].Row8b[0].f1_29[0]
    type: money
  - line: 8b.h                       # 8b (h) Gain or (loss)
    field: Page1[0].Table_PartII[0].Row8b[0].f1_30[0]
    type: money
  - line: 9.d                        # Line 9 — totals for Form 8949 Box E or Box K checked; (d) Proceeds
    field: Page1[0].Table_PartII[0].Row9[0].f1_31[0]
    type: money
  - line: 9.e                        # 9 (e) Cost or other basis
    field: Page1[0].Table_PartII[0].Row9[0].f1_32[0]
    type: money
  - line: 9.g                        # 9 (g) Adjustments
    field: Page1[0].Table_PartII[0].Row9[0].f1_33[0]
    type: money
  - line: 9.h                        # 9 (h) Gain or (loss)
    field: Page1[0].Table_PartII[0].Row9[0].f1_34[0]
    type: money
  - line: 10.d                       # Line 10 — totals for Form 8949 Box F or Box L checked; (d) Proceeds
    field: Page1[0].Table_PartII[0].Row10[0].f1_35[0]
    type: money
  - line: 10.e                       # 10 (e) Cost or other basis
    field: Page1[0].Table_PartII[0].Row10[0].f1_36[0]
    type: money
  - line: 10.g                       # 10 (g) Adjustments
    field: Page1[0].Table_PartII[0].Row10[0].f1_37[0]
    type: money
  - line: 10.h                       # 10 (h) Gain or (loss)
    field: Page1[0].Table_PartII[0].Row10[0].f1_38[0]
    type: money
  - line: "11"                       # Gain from Form 4797 Part I; LT gain from Forms 2439, 6252; Forms 4684, 6781, 8824
    field: Page1[0].f1_39[0]
    type: money
  - line: "12"                       # Net LT gain/(loss) from partnerships, S corps, estates, trusts (Sch K-1)
    field: Page1[0].f1_40[0]
    type: money
  - line: "13"                       # Capital gain distributions
    field: Page1[0].f1_41[0]
    type: money
  - line: "14"                       # Long-term capital loss carryover (Capital Loss Carryover Worksheet, line 13)
    field: Page1[0].f1_42[0]
    type: money
  - line: "15"                       # Net long-term capital gain or (loss). Combine lines 8a–14 in column (h)
    field: Page1[0].f1_43[0]
    type: money

  # --- Part III: Summary (page 2) ---
  - line: "16"                       # Combine lines 7 and 15 and enter the result → Form 1040, line 7a
    field: Page2[0].f2_1[0]          # 2025 rename: was f2_01
    type: money
  # Numeric printed label, so the group id takes sched_8812's "line<N>" form.
  # NOT required: line 16's printed bullets skip line 17 on a loss/zero result
  # (see the checkbox-groups note in the header).
  - line: 17.yes                     # Line 17 "Are lines 15 and 16 both gains?" — Yes
    field: Page2[0].c2_1[0]
    type: checkbox
    on_state: "/1"
    group: line17
  - line: 17.no                      # Line 17 — No
    field: Page2[0].c2_1[1]
    type: checkbox
    on_state: "/2"
    group: line17
  - line: "18"                       # 28% Rate Gain Worksheet amount
    field: Page2[0].f2_2[0]          # 2025 rename: was f2_02
    type: money
  - line: "19"                       # Unrecaptured Section 1250 Gain Worksheet amount
    field: Page2[0].f2_3[0]          # 2025 rename: was f2_03
    type: money
  # NOT required: line 20 is reached only through a 17-Yes answer.
  - line: 20.yes                     # Line 20 "Are lines 18 and 19 both zero or blank...?" — Yes
    field: Page2[0].c2_2[0]
    type: checkbox
    on_state: "/1"
    group: line20
  - line: 20.no                      # Line 20 — No
    field: Page2[0].c2_2[1]
    type: checkbox
    on_state: "/2"
    group: line20
  - line: "21"                       # If line 16 is a loss, smaller of loss on 16 or ($3,000)/($1,500) → Form 1040 line 7a
    field: Page2[0].f2_4[0]          # 2025 rename: was TagCorrectingSubform[0].f2_04[0]
    type: money
  # NOT required: both line-20 answer branches print "Don't complete lines 21
  # and 22 below", so a 17-Yes filer legitimately leaves 22 blank.
  - line: 22.yes                     # Line 22 "Do you have qualified dividends on Form 1040 line 3a?" — Yes
    field: Page2[0].c2_3[0]
    type: checkbox
    on_state: "/1"
    group: line22
  - line: 22.no                      # Line 22 — No
    field: Page2[0].c2_3[1]
    type: checkbox
    on_state: "/2"
    group: line22
relations:
  - "16 == 7 + 15"                   # "Combine lines 7 and 15 and enter the result"
cross_form:
  - "16 == f1040.7a"                 # Net capital gain/(loss) → 2025 Form 1040, line 7a (2025 f1040 pack key "7a")
identity_fields:
  - name
  - identifying_number
