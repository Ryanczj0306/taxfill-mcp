# Schedule 2 (Form 1040) — Additional Taxes — 2026 DRAFT.
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040s2--dft.pdf,
# footer "Schedule 2 (Form 1040) 2026 Created 4/27/26"). Its cover sheet: "there
# are never any changes to the last posted draft of the form and the final
# revision of the form". PDF page 1 is that cover sheet; the form's two pages
# are PDF pages 2-3. When the final posts at irs-prior/f1040s2--2026.pdf,
# re-pin source_url, pdf_sha256, source_status final, drop draft_created, and
# re-read the face. TY2026 is planning-only, so this pack fills only in
# REHEARSAL mode. Attachment Sequence No. 02; no signature block; mailed in the
# parent return's envelope. Phase J JT3b.
#
# 2025 -> 2026: Part II ("Additional Taxes") is REDESIGNED into three sections
# and every line after 4 is renumbered (63 -> 68 widgets; 19 of the 2025 field
# names are gone and the rest rebind). Mapped from scratch against the draft's
# field tree and face, every money widget keyed by the designator printed at its
# left. Where each 2025 line went (TRAP: the same number now means something
# else — 2026 line 5 is the IRA additional tax, 2025 line 5 the 4137 tips tax):
#   Section A — Additional Income Taxes
#     4  SE tax (+ the 4361/4029/other exemption row)        2025 line 4
#     5  additional tax on IRAs (Form 5329; not-required box) 2025 line 8
#     6  net investment income tax (Form 8960)               2025 line 12
#     7  interest, installment residential lots/timeshares   2025 line 14
#     8  interest, deferred tax on installment sales > $150k 2025 line 15
#     9  recapture of low-income housing credit (Form 8611)  2025 line 16
#     10 recapture of net EPE (Form 4255 line 1d col (l))    2025 line 19
#     11 Additional Medicare Tax on SELF-EMPLOYMENT income   part of 2025 line 11
#     12 section 965 installment (Form 965-A), INSET column  2025 line 20
#     13a-13o, 13z other additional income taxes             2025 lines 17a-17o, 17z
#     14 total of 13a-13z                                    (2025 line 18 also held 17p/17q)
#     15 "Add lines 4 through 11 and line 14"
#   Section B — Additional Employment and Other Taxes
#     16a/16b/16c SS and Medicare on tips (4137) / wages (8919) / total  2025 lines 5/6/7
#     17a household employment taxes (Schedule H)            2025 line 9
#     17b Additional Medicare Tax on Medicare wages and RRTA part of 2025 line 11
#     17c uncollected SS/Medicare/RRTA on tips or GTL        2025 line 13
#     17d total of 17a-17c
#     18  additional tax on EXCESS contributions or accumulations in IRAs or
#         other tax-favored accounts (Form 5329) — NEW; 2025 folded it into line 8
#     19a/19b/19c Form 8621 interest                          2025 lines 17p/17q
#     20  "Add lines 16c, 17d, 18, and 19c"
#   Section C — 21 total additional taxes -> Form 1040/1040-SR line 23,
#     Form 1040-NR line 23b                                   2025 line 21
# (2025 line 10 "Reserved for future use" has no 2026 counterpart.)
#
# Write-ins: 1y.type (other additions), 4.exempt_other_type, 13a.type (single
# row) and 13z.type (a TWO-row multiline widget; maxlen 70 = 317pt at the
# clipping scan's 4.5pt per character — the draft's DA is 9pt, 2025's was 8pt,
# which is why 2025's 17z.type took 79). The SSN box keeps the 2025 pack's
# digits-only convention (widget /MaxLen 11).
form: Schedule 2 (Form 1040)
jurisdiction: federal
tax_year: 2026
source_url: https://www.irs.gov/pub/irs-dft/f1040s2--dft.pdf
pdf_sha256: 0e3d4faa4b96f692bc31119d2c86189c3d8b9263e8f3aaaf7c3da371887ebc56
source_status: draft
draft_created: "4/27/26"
acroform_root: form1[0]
fields:
