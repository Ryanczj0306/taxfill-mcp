  - { line: "7", field: "Page1[0].f1_18[0]", type: money } # interest on tax due on installment income (residential lots and timeshares)
  - { line: "8", field: "Page1[0].f1_19[0]", type: money } # interest on the deferred tax, installment sales over $150,000
