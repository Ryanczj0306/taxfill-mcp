# 1040) 2026 Created 5/6/26"). PDF page 1 is the IRS cover sheet; the form now runs THREE pages (PDF pages
# 2-4). When the final posts at irs-prior/f1040se--2026.pdf, re-pin source_url, pdf_sha256 and
# source_status final, drop draft_created, and re-read the face. TY2026 is planning-only (rehearsal only).
#
# 205 widgets (2025: 185), 193 mapped. Every binding is derived from the draft's own table containers
# (Line1aTable RowA-C, Table_Expenses LineN, Table_Line28a-f / 28g-k / 33a-b / 33c-f / 38) with columns in
# x order — the positional f-numbers shift by 12 after the new address boxes. The 12 unmapped widgets are
# all ReadOnly and shaded: the nine "Totals" cells the 2025 pack also omits (29a g/i/j = f2_38/f2_40/f2_41,
# 29b h/k = f2_44/f2_47, 34a c/e = f2_63/f2_65, 34b d/f = f2_68/f2_70 — read only by lines 30/31/35/36,
