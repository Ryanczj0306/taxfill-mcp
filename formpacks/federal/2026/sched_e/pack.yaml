#
# 2025 -> 2026, read off the draft face:
# - Line 1a "Physical address of each property" splits into "Number and street", "Apt. no.", "City or
#   town", "State", "ZIP code" per property (2025: one box per property, keys 1a.a/1a.b/1a.c). Keys
#   1a.<col>.street/.apt/.city/.state/.zip.
# - TRAP — line 13 splits: "13 Interest (see instructions) 13a Vehicle loan 13b Other" (2025: "13 Other
#   interest"). The 2025 key 13.<col> is 2026 13b.<col>; 13a.<col> is the NEW vehicle-loan line.
#   Line 20 still reads "Total expenses. Add lines 5 through 19".
# - Lines 24-26 move to page 2 and Part V (lines 40-43) to a NEW page 3, which repeats the name/SSN
#   header (name_page3 / identifying_number_page3). Line 26 now says "line 41 on page 3".
# - Question A asks about "payments in 2026". Parts II-V are otherwise unchanged.
#
# Relations: the four whole-line combines, re-read on the draft (26 "Combine lines 24 and 25"; 32 "Combine
# lines 30 and 31"; 37 "Combine lines 35 and 36"; 41 "Combine lines 26, 32, 37, 39, and 40"). Line 41:
# "Enter the result here and on Schedule 1 (Form 1040), line 5".
