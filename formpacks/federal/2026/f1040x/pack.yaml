# Form 1040-X (Rev. December 2026) — Amended U.S. Individual Income Tax Return — DRAFTS-FIRST (Phase J
# JT5f, read 2026-09-28). The pack for amending a TAX YEAR 2026 return.
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040x--dft.pdf, footer "Form 1040-X (Rev.
# 12-2026) Created 8/19/26"). PDF page 1 is the IRS cover sheet, so the form's pages 1 and 2 are PDF pages 2
# and 3 (the signature block is on PDF page 3). When the final posts, re-pin source_url, pdf_sha256 and
# source_status final, drop draft_created, signature page 2, and re-read the face. TY2026 is planning-only
# (rehearsal mode only).
#
# 194 widgets (Rev. 12-2025: 166), 191 mapped. The three unmapped widgets are line 9's A/B/C cells (f1_63-
# f1_65), which print "Reserved for future use" on ReadOnly widgets and are named by no printed sum — the
# every-year RESERVED_LINES_UNMAPPED verdict for this form's reserved lines.
#
# Rev. 12-2025 -> Rev. 12-2026, read off the draft face and widget tree (a wholesale redesign that tracks
# the 2026 Form 1040: every positional name moved, so every binding was re-derived from the containers):
# - NEW special-processing row ("Filed pursuant to section 301.9100-2", "Combat zone" + write-in,
#   "Deceased MM / DD / YYYY Spouse MM / DD / YYYY", "Other" + three write-ins) — the 2026 Form 1040 keys.
# - NEW "Check here if your main home, and your spouse's if filing a joint return, was in the U.S. for more
#   than half of the return year" (main_home_in_us). The Presidential Election Campaign boxes are now two
#   separate fields (c1_6 / c1_7, each /1; Rev. 12-2025: one field /1 /2).
# - NEW "Other Information": the nonresident-spouse election box + name, the digital-asset question and
#   the citizen / U.S. national / work-authorized question (You and Spouse radios).
# - Income and Deductions: "2a Itemized deductions or standard deduction", NEW "2b Charitable contribution
#   deduction for non-itemizers", NEW "2c Add lines 2a and 2b", "3 Subtract line 2c from line 1", 4a the
#   Schedule 1-A deductions, 4b QBI, 5 taxable income.
# - TRAP — line 11 splits like the 1040's 24: "11a Add lines 8 and 10. This is your total tax", "11b Enter
#   amount from Form 1062, line 15", "11c Add lines 11a and 11b"; lines 20/21 compare line 19 with 11c.
# - TRAP — line 17 splits: "17a Add lines 12 through 15, column C, and line 16", "17b Amount from Schedule
#   3-A", "17c Subtract line 17b from line 17a. These are your total payments"; 19 subtracts 18 from 17c.
# - Line 15's refundable-credit boxes drop Form 8885 (Schedule 8812, 2439, 4136, 8863, 8962, other).
# - Line 22 gains DIRECT DEPOSIT: 22a amount refunded, 22b routing number, 22c checking/savings, 22d
#   account number; 23 applies to "(enter year): estimated tax".
# - TRAP — Part I renumbers: "24 Your dependent children who lived with you more than half of the year"
#   and "25 Other dependents" (Rev. 12-2025: 25 and 27, with 24/26/28/29 reserved). The dependents grid
#   (rows (1)-(7)) keeps the 2025 keys.
#
# Relations: column C only, as in Rev. 12-2025, each re-read on the draft face. Cross-form: none — the
# amended figures are compared with the attached corrected return by the filer, and 17b ("Amount from
# Schedule 3-A") prints no line to tie to.
