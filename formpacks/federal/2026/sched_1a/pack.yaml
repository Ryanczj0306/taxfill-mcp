# Schedule 1-A (Form 1040) — Additional Deductions — 2026 DRAFT.
#
# Mapped from the IRS early-release DRAFT (irs.gov/pub/irs-dft/f1040s1a--dft.pdf,
# page-1 footer "Schedule 1-A (Form 1040) 2026 Created 6/16/26"). Its cover
# sheet: "there are never any changes to the last posted draft of the form and
# the final revision of the form". PDF page 1 is that cover sheet; the form's
# three pages are PDF pages 2-4. When the final posts at
# irs-prior/f1040s1a--2026.pdf, re-pin: source_url, pdf_sha256, source_status
# final, drop draft_created, and re-read the face. TY2026 is planning-only, so
# this pack fills only in REHEARSAL mode. Attachment sequence 1A; no signature
# block; mailed in the parent return's envelope.
#
# 2025 -> 2026 is a REDESIGN (54 -> 185 widgets, all 185 mapped; 44 of the 54
# 2025 field names are gone and every line from 4 on is renumbered):
#   Part I   (1-3)    MAGI — unchanged
#   Part II  (4-15)   No Tax on Tips: 4 is a per-employer table (rows a-e,
#                     columns (i)-(v)); 6 is a per-business table printed as
#                     TWO tables sharing rows a-e (columns (i)-(v), then the
#                     1099 payer TINs and amounts (vi)-(xiii)); 15 = deduction
#   Part III (16-27)  No Tax on Overtime: 16 (W-2 box 12 code "TT") and 18
#                     (Form 1099-NEC box 1d / 1099-MISC box 14) are tables;
#                     27 = deduction
#   Part IV  (28-36)  No Tax on Car Loan Interest: 28a/28b each add two Yes/No
#                     questions (original use; final assembly in the U.S.);
#                     36 = deduction
#   Part V   (37-43)  Enhanced Deduction for Seniors; "born before January 2,
#                     1962"; 43 = deduction
#   Part VI  (44)     Total -> Form 1040, 1040-SR, or 1040-NR, line 13a
#
# AcroForm: root "form1[0]" (as in 2025). The EIN columns carry /MaxLen 10 and
# the payer-TIN columns /MaxLen 11 (plain boxes, not combs); the two VIN boxes
# are 17-cell combs.
#
# Relations policy (formpacks/CONVENTIONS.md — face math only, the 2025 pack's
# policy carried over): only the plain printed additions are encoded. Not
# encoded: the phase-out worksheet lines (the smaller-of caps 9/21/30, the
# conditional subtractions 12/24/33/39, the divide-by-$1,000 counts 13/25/34 —
# Part IV rounds UP — the multiplies 14/26/35/40, the clamped subtractions
# 15/27/36/41, the SSN/birth-date-gated copies 42a/42b); the "Enter the amount
# from line 3" copies (10/22/31/37 — a Part legitimately left blank would fail
# under blank-as-zero); the column totals 5/7/17/19/29 and the in-row column
# rules of tables 4 and 6 (the relation grammar has no dotted refs like 4a.v).
#
# Cross-form: line 1 prints "Enter the amount from Form 1040, 1040-SR, or
# 1040-NR, line 11b"; line 44 "Enter here and on Form 1040, 1040-SR, or
# 1040-NR, line 13a" (13a — the 2025 targets were 1040 13b and 1040-NR 13c).
# The draft Form 1040-NR (2026) prints the same pair: "11b Amount from line
# 11a (adjusted gross income)" and "13a Additional deductions from Schedule
# 1-A, line 44" (JT5c).
