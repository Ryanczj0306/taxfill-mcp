#
# Form 1040-ES (2024) -- Estimated Tax for Individuals.
#
# WHAT THIS PACK FILLS: the four detachable **payment vouchers** -- the only part
# of Form 1040-ES that is actually filed (mailed with each quarterly check). Each
# voucher carries the same 14 fields (amount + your name/SSN + spouse name/SSN +
# address split). The 12-page PDF also contains the **2024 Estimated Tax Worksheet**
# (page 8) and the **Record of Estimated Tax Payments** (page 9, marked "Keep for
# Your Records") -- those are the taxpayer's PRIVATE computation/ledger, never
# mailed, so their 57 widgets are intentionally NOT mapped (the engine's calc /
# estimate_refund own that math). Exact accounting, counted off THIS blank rather
# than estimated: 113 terminal widgets total = 56 MAPPED + 57 UNMAPPED.
#   - MAPPED 56: 42 on Page11[0] (vouchers 1-3) + 14 on Page10[0] (voucher 4).
#   - UNMAPPED 57: 26 on the page-8 Estimated Tax Worksheet (f8_1..f8_22 plus the
#     c8_1[0]/c8_1[1] and c8_2[0]/c8_2[1] Yes/No kid pairs on lines 14a/14b) and
#     31 on the page-9 Record of Estimated Tax Payments (f9_1..f9_24 row cells +
#     f9_25..f9_27 totals + four 1-pt-wide Date1..4 structural fields).
# The vouchers carry no signature block.
#
# Field map: introspected from this exact revision (root topmostSubform[0]).
# Vouchers 1-3 are on page 11 (printed top-to-bottom as 3, 2, 1); voucher 4 is
# on page 10 below the e-pay promo panel. State boxes are MaxLen-2, ZIP MaxLen-10,
# SSN boxes MaxLen-11 (fit a dashed 000-00-0000).
