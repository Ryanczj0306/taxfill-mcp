# PORTED 2023 -> 2024 (2026-08-19): zero-churn port. Form 1040-X is continuous-use
# (one revision serves several years; the filer enters the amended year in the
# header — there are no year checkboxes), and the **Rev. February 2024** revision
# is also the right one for a TY2024 amendment: its line set exactly matches
# TY2024 law — line 4a "Reserved for future use", line 4b "Qualified business
# income deduction", line 5 "Taxable income. Subtract line 4b from line 3" — all
# re-read from this blank's own printed text (QBI is TY2024's only line-4
# deduction; the OBBBA Schedule 1-A deductions start in TY2025). This was THE
# current revision throughout 2025, when TY2024 amendments began.
#
# Digest provenance: blank downloaded TWICE (independent requests, 2026-08-19)
# from the source_url below; both copies digest to the pdf_sha256 below, which is
# BYTE-IDENTICAL to the 2023 pack's pinned blank (same sha256, same URL). Printed
# title "Form 1040-X (Rev. February 2024) Amended U.S. Individual Income Tax
# Return" and footer "Form 1040-X (Rev. 2-2024)" confirmed from the PDF text.
# Topology verdict: IDENTICAL — every mapped field name verified present in the
# blank's AcroForm; the printed-line diff vs the 2023 base is zero by
# construction (same bytes). Counts, each labeled with what it actually counts:
# WIDGET annotations, i.e. terminal fields, 145 (92 on page 1 + 53 on page 2,
# counted directly off /Annots) = 127 mapped + 18 unmapped reserved (see
# RESERVED LINES below). The blank's other 40 AcroForm nodes are non-terminal
# container subforms, not widgets — 145 + 40 = 185 FIELD-TREE NODES, which is
# exactly what pypdf.get_fields() returns. 185 is NOT a widget count; an earlier
# revision of this banner said "185 total widgets", which was wrong.
# The sentinel-filled render was vision-audited page by page before shipping
# (audit harness, .cache/audit).
#
# ALTERNATIVE REVISION: the successor Rev. December 2025 revision (the current
# irs-pdf/f1040x.pdf) prints line 4a as "Qualified business income deduction"
# and its footer as "Created 2/19/26" (both verified on that blank's own text) --
# so the Feb-2024 revision was indeed the current one for all of 2025. Whether
# the 12-2025 revision is ALSO acceptable for a TY2024 amendment is an
# instructions-level question this pack does not decide; it pins the archived
# Feb-2024 revision via its year-stable irs-prior URL, whose lines match TY2024
# law exactly.
#
# COLUMN MODEL (the defining feature of 1040-X): lines 1-15 and 24-29 have three
# columns -- A (original/as-previously-adjusted), B (net change), C (correct
# amount). The CORRECT amount (column C) is the operative value that flows to the
# IRS, so it carries the bare printed line id ("1", "4b", "11"); column A is
# "<line>.original" and column B is "<line>.net_change". The on-face math that the
# verifier checks runs on column C (e.g. "11 == 8 + 10"); the C = A + B per-line
# identity is the user's own reconciliation and is not re-derived here.
#
# Lines 16-23 are single-column (correct amount only).
# Signature/date rows are ink-only (no widgets); the form IS signed on page 2.
#
# RESERVED LINES (P-007 adjudication, 2026-08-20). SIX printed lines on Rev.
# 2-2024 read exactly "Reserved for future use" -- 4a and 9 on page 1, 24, 26,
# 28 and 29 on page 2 -- and NONE of their 18 widgets (6 lines x 3 columns) is
# mapped:
#     4a f1_27/f1_28/f1_29    9 f1_46/f1_47/f1_48
#     24 f2_01/f2_02/f2_03   26 f2_07/f2_08/f2_09
#     28 f2_13/f2_14/f2_15   29 f2_16/f2_17/f2_18
# Proof, from this pack's own pinned blank (sha256 a4bed38a...):
#   (a) PRINTED TEXT, verbatim from the page-1 text layer:
#       "4a Reserved for future use . . . . . . . . . . . . . . . . 4a"
#       -- the same sentence the other five reserved lines print. The row is
#       solid grey across all three columns on the rendered face.
#   (b) /Ff FLAGS: all 18 carry /Ff = 8388609 (DoNotScroll|ReadOnly), and they
#       are the ONLY 18 ReadOnly widgets among the blank's 145. On this form the
#       IRS uses the ReadOnly bit exclusively to mark reserved rows; every other
#       text widget is 8388608.
#   (c) NOTHING NAMES 4a. Line 5 prints "Taxable income. Subtract line 4b from
#       line 3", so no printed sum, no relation below, and no calc op,
#       cross_form rule or extractor anywhere in this repo produces or consumes
#       "4a"/"4a.original"/"4a.net_change" for Form 1040-X. (Oregon's knowledge
#       files cite "Form 1040-X, line 1C" -- line 1 column C, key "1" -- only.)
# This is a printed-text verdict, not a flag-only one, and the IRS's own next
# revision proves the distinction: Rev. 12-2025 RELABELS 4a "Qualified business
# income deduction", CLEARS the ReadOnly bit on those very same widgets
# (f1_27/28/29 go 8388609 -> 8388608) and names 4a in its line-5 formula. So the
# 2025 pack DOES map 4a and this one must not; the flag tracks the relabeling
# exactly. Contrast with P-007's stays-mapped class (sched_1 line 22, sched_2
# 2025 line 10, sched_8812 2025 line 15): those reserved lines are ReadOnly too,
# but an enumerated printed sum NAMES them ("26 == ... + 22 + 23 + 25",
# "21 == 4 + 7 + ... + 10 + ..."), so they must stay addressable to count
# blank-as-zero. Nothing on Form 1040-X names 4a, so it is excluded outright.
# HISTORY: 4a was mapped as 4a.original / 4a.net_change / 4a through 2026-08-20.
# Reproduced before removal, not theorised: fill_form(pack, {"4a.original": 200,
# "4a.net_change": 211, "4a": 222}) wrote all three with no warning, the values
# survived a re-read of /V, and a 170-dpi render showed 200/211/222 printed
# inside the greyed, locked row. fill_form now raises its prescriptive
# "unknown line key" ValueError for all three keys.
