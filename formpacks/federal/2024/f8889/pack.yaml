# Form 8889 (2024 revision) — Health Savings Accounts (HSAs). ONE page;
# ATTACHMENT-ONLY ("Attach to Form 1040, 1040-SR, or 1040-NR." printed under the
# title) — there is no standalone path, and the instructions make that explicit:
# "If you (or your spouse, if filing jointly) received HSA distributions in
# 2024, you must file Form 8889 with Form 1040, Form 1040-SR, or Form 1040-NR,
# even if you have no taxable income or any other reason for filing Form 1040,
# Form 1040-SR, or Form 1040-NR." (Instructions for Form 8889 (2024), "Who Must
# File".) The form does three jobs, one per printed Part: figure the HSA
# DEDUCTION (Part I, lines 1-13 -> Schedule 1 line 13), the TAXABLE part of
# distributions plus the additional 20% tax (Part II, 14a-17b), and the
# testing-period RECAPTURE with its 10% additional tax when the last-month rule
# or a qualified HSA funding distribution is blown (Part III, 18-21).
#
# PORTED 2026-08-26 from formpacks/federal/2023/f8889/pack.yaml (authored the
# same day). The AcroForm topology is unchanged — same 27 names, same /FT, /Ff,
# /MaxLen and /AP states; only 11 /Rect values moved (full diff below) — so
# every binding carried over, re-derived from the render rather than assumed.
# But the PRINTED FACE changed in NINE rows, and ONE of the 2023 pack's nine
# relations had to be DROPPED because the IRS deleted the printed formula it
# transcribed. House-style precedent followed throughout: the Phase I1 port
# formpacks/federal/2024/f8606/pack.yaml (commit 4d51a07), whose own header
# calls it "the port where 'identical field names' and 'same map' came apart"
# — this one is the same shape, for a different reason.
#
