#   line 2  "contributions you made for 2024" + "that were for 2024"
#   line 3  "under age 55 at the end of 2024" + "every month during 2024"
#   line 4  "to your Archer MSAs for 2024" + "at any time during 2024"
#   line 6  "at any time during 2024"
#   line 7  "age 55 or older at the end of 2024" + "at any time during 2024"
#   line 9  "made to your HSAs for 2024"
#   line 14a "received in 2024 from all HSAs"
# Rule 3 applies throughout: key by the printed LINE NUMBER and keep the year
# in the inline comment. Nothing here is the f8843-line-4a shape where a year
# LABELS its own box. The count is the same 14 as 2023 because the line-13
# rewrite removed no year token (neither the old line 13 nor its Caution row
# printed one).
#
# ---------------------------------------------------------------------------
# RELATIONS — 8 rules; the 2023 pack's ninth was DROPPED, and that is the
# headline of this port
# ---------------------------------------------------------------------------
# DROPPED: "13 == min(2, 12)". The 2023 pack declared it because the 2023 face
# printed the formula verbatim on the row: "13 HSA deduction. Enter the smaller
# of line 2 or line 12 here and on Schedule 1 (Form 1040), Part II, line 13".
# THE 2024 FACE PRINTS NO MATH ON LINE 13 AT ALL — the whole row is "13 HSA
# deduction (see instructions)." (read at 300 dpi, and the `pdftotext -layout`
# diff of the two blanks shows the formula and the Caution row leaving
# together). formpacks/CONVENTIONS.md is binding here: "Only math that is
# printed on the form face ... belongs in relations. Tax-table lookups,
# worksheets, and instruction-only math belong to calc and the knowledge
# packs, never here." So the rule has no home in the 2024 pack.
# AND IT IS NOT MERELY UNPRINTED — IT IS FALSE ON A CORRECT 2024 RETURN. (The
# IRS states no reason for the rewrite; what follows is the sourced arithmetic,
# not an attributed motive.) Two primary sources, both opened:
#   * Instructions for Form 8889 (2024), Line 13 now carries the formula that
#     left the face, HEDGED: "GENERALLY, enter the smaller of line 2 or line 12
#     on line 13 and on Schedule 1 (Form 1040), Part II, line 13." (The
#     capitalisation of "Generally" is this comment's; the word itself is on
#     the page, and the whole sentence is new — the 2023 instructions' Line 13
#     section, checked in i8889--2023.pdf, opens "If you or someone on your
#     behalf (or your employer) contributed more to your HSA than is
#     allowable..." and states no formula anywhere.) It then adds a "Note. If
#     the amount on line 2 is less than the
#     amount on line 12 and you have prior year excess contributions, see Prior
#     Year Excess Contributions, later", and that section routes to Form 5329.
#   * Instructions for Form 5329 (2024), Line 43 closes the loop and names the
#     other addend explicitly: "If contributions to your HSAs for 2024 (line 2
#     of Form 8889 ...) were less than your contribution limit for HSAs, enter
#     the difference on line 43. Your contribution limit for HSAs is the amount
#     on line 12 of Form 8889. ALSO INCLUDE ON YOUR 2024 FORM 8889, LINE 13,
#     the smaller of: • Form 5329, line 43; or • The excess, if any, of Form
#     5329, line 42, over Form 5329, line 44."
#   So for a filer absorbing a prior-year excess contribution, line 13 EXCEEDS
#   min(line 2, line 12) by the amount that instruction adds. Reproduced
#   against this pack rather than argued: loading it with the candidate rule
#   restored and evaluating worked example (D) below reports
#   "FAIL 13 == min(2, 12) — left side = 3800, right side = 3000
#   (difference +800)". A rule that fails a correct return is a false check,
#   and a false check is worse than none.
#   HONEST NOTE, because this cuts both ways: Instructions for Form 5329
#   (2023), Line 43 carried the identical sentence for the 2023 form, so the
#   2023 pack's relation was already false for that filer even though it was
#   printed on the 2023 face. That pack's rule is defensible under the
#   face-printed convention and is not touched here; it is reported as an open
#   issue for its owner.
#
# DECLARED: 8 rules, each transcribed from the printed 2024 row, each with
# every operand mapped to a bare printed-label money line of THIS form. All 8
# were evaluated against FOUR worked examples and PASS on every one, so none of
# them is the f8606 line-5 blank-as-zero trap. The examples were rebuilt on the
# 2024 limits ($4,150 / $8,300), not carried over from 2023:
#   (A) a full Part I/II/III filer — self-only, age 60, UNMARRIED, testing
#       period blown: 2=5150, 3=5150 (4,150 + the $1,000 additional
#       contribution amount, which rides on line 3 and not line 7 for an
#       UNMARRIED filer — Instructions for Form 8889 (2024), Line 3 rule (6):
#       "If, at the end of 2024, you were age 55 or older and unmarried or
#       married with self-only HDHP coverage for the entire year, you can
#       increase the amount determined in (3) or (4) by $1,000", with the Note
#       "If you are married and had family coverage at any time during the
#       year, the additional contribution amount is figured on line 7 and is
#       not included on line 3"), 4=0, 5=5150, 6=5150, 7=0, 8=5150, 9=1000,
#       10=0, 11=1000, 12=4150, 13=4150, 14a=2000, 14b=500, 14c=1500, 15=900,
#       16=600, 17b=80 (20% of only $400 — the rest met an exception, so 17a is
#       checked), 18=1200, 19=300, 20=1500, 21=150.
#   (B) a DISTRIBUTIONS-ONLY filer whose Part I and Part III are legitimately
#       blank: 14a=2000, 14b=0, 14c=2000, 15=2000, 16=0. Every Part I/III rule
#       reads blank-as-zero on BOTH sides and still PASSes.
#   (C) the instructions' spousal-allocation leg of line 6: 3=8300, 5=8300,
#       6=4150 (half share), 8=4150, 12=4150, 13=4150, 2=4150.
#   (D) NEW for 2024 — the prior-year-excess filer that kills "13 == min(2,12)":
#       self-only, under 55, eligible all year, so 3=4150, 4=0, 5=4150, 6=4150,
#       7=0, 8=4150, 9=0, 10=0, 11=0, 12=4150; current-year contributions
#       2=3000, so Form 5329 line 43 = 12 - 2 = 1150; with a prior-year excess
#       of 800 carried on Form 5329 line 42 and line 44 = 0, the smaller of
#       (1150) and (800 - 0) is 800, so printed line 13 = 3000 + 800 = 3800.
#       All 8 DECLARED rules PASS on (D); only the dropped candidate fails.
# DELIBERATELY NOT DECLARED — each rejection REPRODUCED against this pack, by
# loading it with the candidate rule added and evaluating that rule on the data
# above, never argued from the caption alone:
#   * "6 == 5" ("Enter the amount from line 5"). FAILs example (C) — "left side
#     = 4150, right side = 8300 (difference -4150)". The printed row does NOT
#     stop there: "But if you and your spouse each have separate HSAs and had
#     family coverage under an HDHP at any time during 2024, see the
#     instructions for the amount to enter." That is a conditional copy with an
#     "Otherwise" leg — the f8960 line-18a / f8606 line-16-17 precedent — and
#     the instructions spell out the other leg as a spousal ALLOCATION ("divide
#     the amount on line 5 equally between you and your spouse, unless you both
#     agree on a different allocation (such as allocating nothing to one
#     spouse)", plus a 4-step refiguring for partial-year family coverage,
#     Instructions for Form 8889 (2024), Line 6). No unconditional equality
#     exists.
#   * "17b == 16 * 0.20". FAILs example (A) — "left side = 80, right side = 120
#     (difference -40)". Refused on the primary source, and this is the one a
#     naive read of the printed "Enter 20% (0.20) of the distributions included
#     on line 16" would get wrong. The row's own tail scopes it — "of the
#     distributions included on line 16 THAT ARE SUBJECT TO the additional 20%
#     tax" — and the instructions make the subset explicit: "Enter on line 17b
#     only 20% (0.20) of any amount included on line 16 that does not meet any
#     of the exceptions", with a worked Example 2 (age 65 mid-year) where 17b
#     is 20% of PART of line 16. Line 17a's checkbox is the flag for exactly
#     that case. So 17b is a fraction of an unmapped subset of line 16, not of
#     line 16.
#   * "19 == 10". FAILs example (A) — "left side = 300, right side = 0
#     (difference +300)". Both rows are captioned "Qualified HSA funding
#     distribution(s)" and the line-19 instruction is a bare "Enter the total
#     of any qualified HSA funding distribution (see line 10)" — which reads
#     like a copy and is NOT one, because the two lines belong to different TAX
#     YEARS. The testing period for a funding distribution "begins with the
#     month in which the traditional IRA or Roth IRA distribution is
#     contributed to the HSA and ends on the last day of the 12th month
#     following that month. For example, if the distribution is contributed on
#     June 17, 2024, the testing period ends on June 30, 2025. If you fail to
#     remain an eligible individual during this period ... you will have to
#     include the qualified HSA funding distribution in income IN THE YEAR IN
#     WHICH YOU FAIL to be an eligible individual" (Instructions for Form 8889
#     (2024), Line 10 / Part III — the example dates rolled a year with the
#     revision, which is itself the tell that the two lines are not synchronous).
#     So a 2024 line 19 routinely reports a 2023 distribution while this year's
#     line 10 is blank, and the equality would FAIL a correct return.
#   * Line 18 ("Last-month rule"). Worksheet-driven, not on-face math: "You can
#     use the Line 3 Limitation Chart and Worksheet ... for the year the
#     contribution was made to determine the contribution you could have made
#     if the last-month rule did not apply. Enter on line 18 the excess of the
#     amount contributed over the redetermined amount." (Instructions, Line 18.)
#     Prior-year worksheet arithmetic over unmapped quantities.
#   * Lines 2, 3, 4, 7, 9, 10, 13, 14a, 14b, 15: source lines, no on-face math.
#     Line 3 is an instruction-WORKSHEET lookup for everyone except the
#     full-year same-coverage filer; line 7 has its own Additional Contribution
#     Amount Worksheet; line 9 has the Employer Contribution Worksheet; and
#     line 13 joined this list in 2024, as set out above.
#
# ---------------------------------------------------------------------------
# CROSS-FORM — deliberately EMPTY, and this is the load-bearing part
# ---------------------------------------------------------------------------
# FOUR printed lines still cite a parent-return line — 16, 17b, 20 and 21. The
# 2023 face had FIVE: line 13's citation left with the rest of its row. Not one
# of the five is an EQUALITY, so all are omitted rather than shipped as false
# checks (the fifth is kept in this list because a porter who only reads the
# 2023 pack will come looking for it).
#   * 16 -> "Schedule 1 (Form 1040), Part I, line 8f" AND 20 -> the same
#     "Schedule 1 (Form 1040), Part I, line 8f". TWO lines of this one form
#     land on one Schedule 1 line, so 8f is 16 + 20 even for a single filer
#     with a single HSA and neither line alone can equal it. Both printed rows
#     say "include this amount in the total on" / "Include this amount on" —
#     additive language, and the repo has no grammar for an additive carry.
#   * 17b -> "Schedule 2 (Form 1040), Part II, line 17c" and 21 -> "Schedule 2
#     (Form 1040), Part II, line 17d". One-to-one for a single-HSA filer, but
#     the FORM ITSELF prints the per-spouse rule on both Parts — "If you are
#     filing jointly and both you and your spouse each have separate HSAs,
#     complete a separate Part II [Part III] for each spouse" — so two Forms
#     8889 feed one Schedule 2 and the equality breaks on exactly the returns
#     the caption contemplates.
#   * 13 -> Schedule 1 line 13. The 2024 FACE no longer prints this citation at
#     all; the instructions carry it ("...on line 13 and on Schedule 1 (Form
#     1040), Part II, line 13"). It would still be wrong as an equality, killed
#     verbatim by the same instructions: "Complete a separate Form 8889 for
#     each spouse. COMBINE THE AMOUNTS ON LINE 13 OF BOTH FORMS 8889 and enter
#     this amount on Schedule 1 (Form 1040), line 13. Be sure to attach both
#     Forms 8889 to your paper tax return." (Instructions for Form 8889 (2024),
#     "How To Complete Part I".) "13 == sched_1.13" would FAIL every correct
#     joint return on which both spouses have an HSA — and, after the line-13
#     rewrite, would also be a check on a quantity the face no longer defines.
# The targets all EXIST for THIS pack's year (federal/2024/sched_1 maps "13"
# and "8f"; federal/2024/sched_2 maps "17c" and "17d" — both re-checked against
# the 2024 packs, not the 2023 ones, per formpacks/CONVENTIONS.md "A target is
# a (form_key, LINE KEY OF THAT YEAR'S PACK) pair"), so this is a deliberate
# omission, not a missing pack, and it needs no CROSS_FORM_TARGET_ALLOWLIST row.
# COUNTER-PRECEDENT considered and distinguished: f8960 declares
# "17 == sched_2.12", f8959 "18 == sched_2.11" and f2441 "11 == sched_3.2".
# Those forms are filed ONE PER RETURN, so their carries really are
# one-to-one. Form 8889 is per-SPOUSE by printed caption and by instruction,
# which is the whole difference. A rule that is true for most filings and false
# for the joint-HSA case is a false check, and a false check is worse than none
# (the f8606 header's rule, and the sched_e P-007 lesson that verify will
# happily CERTIFY a wrong artifact).
#
# ---------------------------------------------------------------------------
# IDENTITY FIELDS — [name, identifying_number], and the per-spouse caveat
# ---------------------------------------------------------------------------
# House practice for a per-spouse attachment (sched_se, sched_c, f2555, f8960,
# f8606 all ship exactly [name, identifying_number]) is followed here.
#   * `name` is printed "Name(s) shown on Form 1040, 1040-SR, or 1040-NR" — by
#     construction the parent return's names, so it agrees with every other
#     schedule that maps `name`.
#   * `identifying_number` is printed "Social security number of HSA
#     beneficiary. If both spouses have HSAs, see instructions.", and the
#     instructions confirm the scope: "Enter your name(s) as shown on your tax
#     return and the SSN of the HSA account beneficiary. If married filing
#     jointly and both you and your spouse have HSAs, complete a separate Form
#     8889 for each of you." (Specific Instructions.)
# CAVEAT the integrator should see, unchanged from 2023 and recorded because it
# is the one way this line can legitimately DIFFER from the parent 1040 on a
# joint return: when the HSA belongs to the SPOUSE, this box holds the spouse's
# SSN while f1040's `identifying_number` holds the primary filer's, and
# verify's _identity_checks compares every DECLARED identity name across the
# filing — so verify_filing([f1040, f8889-for-the-spouse]) would report an
# `identifying_number` mismatch on a correct return. Same structural gap f8606
# and sched_se record: _identity_checks has no way to express "per-spouse
# attachment, compare against EITHER filer". Carried forward as an open issue
# rather than dodged by dropping the declaration, which would also switch off
# the check for the single-filer case it protects correctly.
# `maxlen: 11` tracks the widget's OWN /MaxLen, re-read on the 2024 blank
# (f1_2 = 11, unchanged) — formpacks/CONVENTIONS.md, "Identity page mirrors":
# maxlen tracks each widget's own /MaxLen. Matches sched_b / sched_c /
# sched_8812 / f2555; f8606 and f8960 pin 9 on the identical 11-wide widget, an
# inconsistency reported rather than copied.
# `format: ssn_digits_only` keeps cross-form identity values consistent and can
# never overflow (P-001).
#
# ---------------------------------------------------------------------------
# SIGNATURE / MAILING
# ---------------------------------------------------------------------------
# signature: null, mailing: null — the attachment-only shape (f8960, f8959,
# f2441, sched_8812). The form carries NO signature block and NO preparer block
# of its own (confirmed on both the 2024 field dump and the sweep render: 27
# widgets, none of them in a signature area, and no /Sig field type anywhere
# despite the new /SigFlags 2 — see PROVENANCE), it is never filed by itself,
# and it is mailed inside the parent return's envelope, so there is no separate
# where-to-file (formpacks/CONVENTIONS.md).
form: "8889"
jurisdiction: federal
tax_year: 2024
source_url: https://www.irs.gov/pub/irs-prior/f8889--2024.pdf
pdf_sha256: "a93c1f651b267df7d2935adab13341b1d7e1eade9bcb14acee0b32dd93464e14"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header ---------------------------------------------------------------
  - line: "name"                    # "Name(s) shown on Form 1040, 1040-SR, or 1040-NR"
    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"      # "Social security number of HSA beneficiary. If both spouses have HSAs, see instructions." — plain box, NOT a comb
    field: "Page1[0].f1_2[0]"
    type: text
    maxlen: 11                      # the widget's own /MaxLen, re-read on the 2024 blank (fits a dashed SSN)
    format: ssn_digits_only         # digits only keeps cross-form identity values consistent and can never overflow (P-001)

  # ---- Part I: HSA Contributions and Deduction (printed lines 1-13) ---------
  # "See the instructions before completing this part. If you are filing jointly
  #  and both you and your spouse each have separate HSAs, complete a separate
  #  Part I for each spouse."
  #
  # Line 1: "Check the box to indicate your coverage under a high-deductible
  # health plan (HDHP) during 2024. See instructions." — ONE question, TWO
  # mutually exclusive options on SEPARATE /Btn fields (P-008): the shared
  # `group: line1` is the only thing that stops a Self-only + Family return.
  - line: "1.self_only"             # printed "Self-only" box (left)
    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
    group: line1
  - line: "1.family"                # printed "Family" box (right)
    field: "Page1[0].c1_1[1]"
    type: checkbox
    on_state: "/2"
    group: line1
  - line: "2"                       # "HSA contributions you made for 2024 (or those made on your behalf), including those made by the unextended due date of your tax return that were for 2024. Do not include employer contributions, contributions through a cafeteria plan, or rollovers. See instructions"
    field: "Page1[0].f1_3[0]"
    type: money
  - line: "3"                       # "If you were under age 55 at the end of 2024 and, on the first day of every month during 2024, you were, or were considered, an eligible individual with the same coverage, enter $4,150 ($8,300 for family coverage). All others, see the instructions for the amount to enter" — 2024 figures per Rev. Proc. 2023-23 §2.01(1) (§223(b)(2)(A)/(B)); the instructions' Line 3 Limitation Chart and Worksheet covers "all others". Both dollar figures are printed in the ROW TEXT at x < 410, OUTSIDE this widget (x 504-576), so this is not P-007 class 1.
    field: "Page1[0].f1_4[0]"
    type: money
  - line: "4"                       # "Enter the amount you and your employer contributed to your Archer MSAs for 2024 from Form 8853, lines 1 and 2. If you or your spouse had family coverage under an HDHP at any time during 2024, also include any amount contributed to your spouse's Archer MSAs"
    field: "Page1[0].f1_5[0]"
    type: money
  - line: "5"                       # "Subtract line 4 from line 3. If zero or less, enter -0-"
    field: "Page1[0].f1_6[0]"
    type: money
  - line: "6"                       # "Enter the amount from line 5. But if you and your spouse each have separate HSAs and had family coverage under an HDHP at any time during 2024, see the instructions for the amount to enter" — conditional copy with a spousal-allocation leg, so no relation
    field: "Page1[0].f1_7[0]"
    type: money
  - line: "7"                       # "If you were age 55 or older at the end of 2024, married, and you or your spouse had family coverage under an HDHP at any time during 2024, enter your additional contribution amount. See instructions" — no figure is printed on this row in any year; the $1,000 lives in the instructions' Additional Contribution Amount Worksheet ($1,000 x months eligible / 12), so no relation
    field: "Page1[0].f1_8[0]"
    type: money
  - line: "8"                       # "Add lines 6 and 7"
    field: "Page1[0].f1_9[0]"
    type: money
  - line: "9"                       # "Employer contributions made to your HSAs for 2024" — INSET box (x 410.4-481.65), not the main amount column; the cell to the right, shared with line 10, is shaded and holds no widget. (Instructions' Employer Contribution Worksheet — no relation.)
    field: "Page1[0].f1_10[0]"
    type: money
  - line: "10"                      # "Qualified HSA funding distributions" — INSET box, same as line 9. A trustee-to-trustee IRA-to-HSA transfer; NOT the same year's line 19 (see the header)
    field: "Page1[0].f1_11[0]"
    type: money
  - line: "11"                      # "Add lines 9 and 10"
    field: "Page1[0].f1_12[0]"
    type: money
  - line: "12"                      # "Subtract line 11 from line 8. If zero or less, enter -0-"
    field: "Page1[0].f1_13[0]"
    type: money
  - line: "13"                      # "HSA deduction (see instructions)." — THE WHOLE 2024 ROW. The 2023 face printed "Enter the smaller of line 2 or line 12 here and on Schedule 1 (Form 1040), Part II, line 13" plus a Caution row; the 2024 revision deleted both, which is why this pack declares NO relation for line 13 and why every widget below rode up 12 pt. The instructions hedge the old formula ("Generally...") and Instructions for Form 5329 (2024), Line 43 adds a prior-year-excess amount ON TOP of it. See the header.
    field: "Page1[0].f1_14[0]"
    type: money

  # ---- Part II: HSA Distributions (printed lines 14a-17b) ------------------
  # "If you are filing jointly and both you and your spouse each have separate
  #  HSAs, complete a separate Part II for each spouse."
  - line: "14a"                     # "Total distributions you received in 2024 from all HSAs (see instructions)" — Form 1099-SA box 1
    field: "Page1[0].f1_15[0]"
    type: money
  - line: "14b"                     # "b Distributions included on line 14a that you rolled over to another HSA. Also include any excess contributions (and the earnings on those excess contributions) included on line 14a that were withdrawn by the due date of your return. See instructions"
    field: "Page1[0].f1_16[0]"
    type: money
  - line: "14c"                     # "c Subtract line 14b from line 14a"
    field: "Page1[0].f1_17[0]"
    type: money
  - line: "15"                      # "Qualified medical expenses paid using HSA distributions (see instructions)"
    field: "Page1[0].f1_18[0]"
    type: money
  - line: "16"                      # "Taxable HSA distributions. Subtract line 15 from line 14c. If zero or less, enter -0-. Also, include this amount in the total on Schedule 1 (Form 1040), Part I, line 8f"
    field: "Page1[0].f1_19[0]"
    type: money
  - line: "17a"                     # "If any of the distributions included on line 16 meet any of the Exceptions to the Additional 20% Tax (see instructions), check here" — printed line 17a IS the checkbox (x 467.2, mid-row); the cell to its right is shaded and holds no widget. Lone flag, so no `group`.
    field: "Page1[0].c1_2[0]"
    type: checkbox
    on_state: "/1"
  - line: "17b"                     # "b Additional 20% tax (see instructions). Enter 20% (0.20) of the distributions included on line 16 that are subject to the additional 20% tax. Also, include this amount in the total on Schedule 2 (Form 1040), Part II, line 17c" — the base is a SUBSET of line 16, so no relation (see the header)
    field: "Page1[0].f1_20[0]"
    type: money

  # ---- Part III: Income and Additional Tax for Failure To Maintain HDHP
  # ---- Coverage (printed lines 18-21) — the testing-period recapture
  # "If you are filing jointly and both you and your spouse each have separate
  #  HSAs, complete a separate Part III for each spouse."
  - line: "18"                      # "Last-month rule" — the contributions allowed only BY the last-month rule, recaptured because the testing period was blown (prior-year worksheet, no relation)
    field: "Page1[0].f1_21[0]"
    type: money
  - line: "19"                      # "Qualified HSA funding distribution" — the recaptured line-10 distribution, reported in the year eligibility FAILED, which is often a LATER year than the distribution: not equal to this year's line 10 (see the header)
    field: "Page1[0].f1_22[0]"
    type: money
  - line: "20"                      # "Total income. Add lines 18 and 19. Include this amount on Schedule 1 (Form 1040), Part I, line 8f" — line 16 lands on 8f too, so the Schedule 1 leg is additive: no cross_form rule
    field: "Page1[0].f1_23[0]"
    type: money
  - line: "21"                      # "Additional tax. Multiply line 20 by 10% (0.10). Include this amount in the total on Schedule 2 (Form 1040), Part II, line 17d"
    field: "Page1[0].f1_24[0]"
    type: money

relations:
  # Part I. NOTE the 2023 pack's "13 == min(2, 12)" is deliberately ABSENT: the
  # 2024 face prints no math on line 13 ("HSA deduction (see instructions)."),
  # and Instructions for Form 5329 (2024), Line 43 adds a prior-year-excess
  # amount on top of the smaller-of, so the equality would FAIL a correct
  # return. See the header's RELATIONS section.
  - "5 == max(0, 3 - 4)"      # "5 Subtract line 4 from line 3. If zero or less, enter -0-"
  - "8 == 6 + 7"              # "8 Add lines 6 and 7"
  - "11 == 9 + 10"            # "11 Add lines 9 and 10"
  - "12 == max(0, 8 - 11)"    # "12 Subtract line 11 from line 8. If zero or less, enter -0-"
  # Part II
  - "14c == 14a - 14b"        # "c Subtract line 14b from line 14a." No floor is printed
  - "16 == max(0, 14c - 15)"  # "16 Taxable HSA distributions. Subtract line 15 from line 14c. If zero or less, enter -0-"
  # Part III
  - "20 == 18 + 19"           # "20 Total income. Add lines 18 and 19"
  - "21 == 20 * 0.10"         # "21 Additional tax. Multiply line 20 by 10% (0.10)"

# Deliberately empty. The four surviving printed parent-return citations (16 and
# 20 -> Schedule 1 line 8f; 17b -> Schedule 2 line 17c; 21 -> Schedule 2 line
# 17d) are ADDITIVE, not equalities — two lines of this form share Schedule 1
# line 8f, and the instructions say verbatim to "Combine the amounts on line 13
# of both Forms 8889" on a joint return. The 2023 face's fifth citation (line 13
# -> Schedule 1 line 13) is not even printed on the 2024 face. See the header.
cross_form: []

identity_fields: [name, identifying_number]
# identifying_number is PER PERSON on this form, not per filing: Form 8889's box is printed "Social security number of HSA beneficiary",
# so on a joint return it legitimately carries the SPOUSE's SSN while the 1040
# carries the primary filer's. Declared 2026-08-26 after verify_filing was
# reproduced FAILing that correct arrangement; verify now reports a difference
# as SKIPPED with both values printed instead of rejecting the return.
identity_per_person: [identifying_number]

# Attachment-only form (Attachment Sequence No. 52): no signature block of its
# own; mailed inside the parent return's envelope (formpacks/CONVENTIONS.md).
signature: null
mailing: null
