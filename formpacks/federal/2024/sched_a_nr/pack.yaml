# PORTED 2023 -> 2024 (2026-08-16): topology CHANGED — the printed page kept every
# line (printed-line diff vs the 2023 blank: ZERO renumbering; the only text deltas
# are the header/footer year and the PRA footer boilerplate, which 2024 rewords to
# "For Disclosure, Privacy Act, and Paperwork Reduction Act Notice..."), but the
# AcroForm was restructured 20 -> 12 widgets, so the 2023 field map was NOT ported;
# every field below was re-introspected from the 2024 blank itself:
# - The nine single-row line-7 write-ins (2023 f1_10..f1_18) merged into ONE
#   MULTILINE widget, Page1[0].Line7Entry[0].f1_10[0] (rect x122-475, y390-498),
#   spanning all nine dotted rows.
# - NAME-COLLISION TRAP: bare leaf names f1_10/f1_11/f1_12 exist in both revisions
#   with different meanings. 2023 f1_11/f1_12 were line-7 write-in continuation
#   rows; 2024 f1_11 is the line-7 AMOUNT box (rect x504, y390) and f1_12 is the
#   line-8 TOTAL box (rect x504, y348) — in 2023 those were f1_19/f1_20. Porting
#   the 2023 map verbatim would write line-7 description text into the amount and
#   total boxes.
# - Header/identity widgets unchanged (f1_1; f1_2 incl. /MaxLen 11); money-line
#   widgets f1_3..f1_9 (lines 1a-6) unchanged in name, position, and meaning.
# - Same 12-widget structure as the 2025 revision (see the 2025 sched_a_nr pack);
#   unlike 2025, the 2024 face keeps the 2023 SALT cap text ($10,000/$5,000 MFS,
#   re-read from this blank's own line 1b).
# Digest provenance: the 2024 blank was downloaded twice in independent requests;
# both copies hashed to the pdf_sha256 below. Revision verified by reading the
# extracted page text and rendering page 1 of the downloaded blank: printed title
# "SCHEDULE A (Form 1040-NR) Itemized Deductions", printed year 2024, Attachment
# Sequence No. 7A, footer "Schedule A (Form 1040-NR) 2024". The filled render was
# vision-audited (sentinel fill, page read with eyes) before shipping.
#
# Field map: introspected from this exact revision. The form is ONE page with
# 12 fillable widgets (all /Tx, none read-only, no checkboxes) — every one is
# mapped below: 2 header + 9 money lines + 1 merged line-7 write-in.
#
# Nonresident itemized deductions: state/local income taxes (1a/1b), gifts to
# U.S. charities (2-5), casualty and theft losses (6), other itemized
# deductions (7), total (8). Unlike Schedule A (Form 1040) there is no
# medical, mortgage-interest, or sales-tax section.
form: "Schedule A (Form 1040-NR)"
jurisdiction: federal
tax_year: 2024
source_url: https://www.irs.gov/pub/irs-prior/f1040nra--2024.pdf
pdf_sha256: "76e972a7bbf43f49dfeba50dd91ba5503fca2870879378e54108d9c8a5ad49cc"
acroform_root: "form1040-NR[0]"
fields:
  # ----- header -----
  - line: "name"                       # Name shown on Form 1040-NR
    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"         # Your identifying number (plain text box, widget /MaxLen 11 — NOT a comb)
    field: "Page1[0].f1_2[0]"
    type: text
    maxlen: 11
    format: ssn_digits_only            # digits-only keeps cross-form identity values consistent with f1040nr
  # ----- Taxes You Paid -----
  - line: "1a"                         # State and local income taxes
    field: "Page1[0].Line1a_ReadOrder[0].f1_3[0]"
    type: money
  - line: "1b"                         # Enter the smaller of line 1a or $10,000 ($5,000 if married filing separately)
    field: "Page1[0].f1_4[0]"
    type: money
  # ----- Gifts to U.S. Charities -----
  - line: "2"                          # Gifts by cash or check (see instructions if any gift of $250 or more)
    field: "Page1[0].Line2_ReadOrder[0].f1_5[0]"
    type: money
  - line: "3"                          # Other than by cash or check (Form 8283 if over $500)
    field: "Page1[0].f1_6[0]"
    type: money
  - line: "4"                          # Carryover from prior year
    field: "Page1[0].f1_7[0]"
    type: money
  - line: "5"                          # Add lines 2 through 4
    field: "Page1[0].f1_8[0]"
    type: money
  # ----- Casualty and Theft Losses -----
  - line: "6"                          # Casualty/theft loss(es) from a federally declared disaster (other than net
    field: "Page1[0].f1_9[0]"          # qualified disaster losses), Form 4684 line 18
    type: money
  # ----- Other Itemized Deductions -----
  - line: "7.type"                     # "Other—from list in instructions. List type and amount:" — ONE multiline
    field: "Page1[0].Line7Entry[0].f1_10[0]"  # widget spanning all nine dotted rows (2023's nine write-ins merged)
    type: text
    maxlen: 79                         # merged-write-in budget (2025 sched_a_nr / sched_1 / sched_2 / sched_a convention)
  - line: "7"                          # Other itemized deductions amount (right column)
    field: "Page1[0].f1_11[0]"
    type: money
  # ----- Total Itemized Deductions -----
  - line: "8"                          # Add the amounts in the far right column for lines 1b through 7 -> Form 1040-NR, line 12
    field: "Page1[0].f1_12[0]"
    type: money
relations:
  # Form-face arithmetic only. The SALT cap on line 1b IS printed on the form
  # face ("Enter the smaller of line 1a or $10,000" — re-read from the 2024
  # blank's own text). CAVEAT: the printed cap is $5,000 for married filing
  # separately — relations cannot branch on filing status, so the $10,000
  # form-face text is encoded (same caveat and treatment as Schedule A
  # (Form 1040) line 5e).
  - "1b == min(1a, 10000)"
  - "5 == 2 + 3 + 4"                   # "Add lines 2 through 4"
  - "8 == 1b + 5 + 6 + 7"              # "Add the amounts in the far right column for lines 1b through 7"
cross_form:
  - "8 == f1040nr.12"                  # "Also, enter this amount on Form 1040-NR, line 12" (printed on the 2024 face)
identity_fields: [name, identifying_number]
signature: null                        # attachment-only schedule: no signature block of its own
mailing: null                          # mailed inside the parent Form 1040-NR envelope
