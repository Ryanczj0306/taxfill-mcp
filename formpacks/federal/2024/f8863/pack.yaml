# PORTED 2023 -> 2024 (2026-08-16): the 2024 blank's AcroForm topology is IDENTICAL
# to 2023 — all 77 mapped field names are present in the 2024 PDF, the 2024 blank
# carries exactly 77 fillable widgets, and the base-only/new-only name diffs are both
# empty (verified programmatically with pypdf against the sha-pinned 2023 base blank).
# Printed identity confirmed from the PDF text itself: "Form 8863 — Education Credits
# (American Opportunity and Lifetime Learning Credits)", header year "2024", footer
# "Form 8863 (2024)" on both pages. The digest below is the 2024 blank's, from TWO
# independent downloads of source_url that hashed identically (double-download match).
# Printed-line diff 2023 vs 2024: the 32 printed line-number tokens across both pages
# are identical in value, order, and page — ZERO renumbering.
# Year-specific figures re-verified against the 2024 blank's own printed text:
# $180,000/$90,000 (lines 2 and 13), $20,000/$10,000 (lines 5 and 16), $10,000 cap
# (line 11), 20% (line 12), 40% (line 8), $4,000 cap (line 27), $2,000 (lines 28/30),
# 25% (line 29); destinations unchanged (line 8 -> Form 1040/1040-SR line 29, line 19
# -> Schedule 3 (Form 1040) line 3), so cross_form ports unchanged. Relations do
# NOT simply port: the two ported rules ("4 == 2 - 3", "15 == 13 - 14") are
# unchanged, but on 2026-08-20 every printed arithmetic sentence on this blank was
# re-read and adjudicated line by line and SIX more unconditional rules were
# declared (lines 9, 11, 12, 28, 29, 30) — see the RELATIONS block below for the
# per-line reasoning and for every rule deliberately left out. The 2023 f8863
# pack, whose printed math on those six lines is word-for-word identical, still
# carries only the ported pair — a known gap left to that pack's owner. The
# Part III 1098-T questions roll one year — 22a(2)/22b(2) ask about 2024,
# 22a(3)/22b(3) ask about 2023 with box 7 checked — and lines 24/25/26 reference 2024
# (comments rolled below). Vision audit: the filled sentinel render was read page by
# page (audit_pack.py PNGs, 170dpi) before shipping; every sentinel landed on its
# printed line, the SSN (3) and EIN (18) per-box combs were unclipped, the line 7 box
# and the Yes half of all 8 Yes/No groups hit their printed boxes, and the 22a/22b
# columns did not cross. The audit caught NOTHING to fix — expected for an
# identical-topology, zero-renumbering port, and stated explicitly per the gate.
#
# Form 8863, 2024 — Education Credits (American Opportunity and Lifetime Learning Credits).
#
# Authored via the taxfill pipeline: `taxfill introspect` (sentinel sweep) →
# vision-map workflow (each fillable widget filled with its own field name, then
# the printed line label nearest each name was read off the rendered PDF) → this map.
#
# Flow: Part I line 8 (refundable American opportunity credit) → Form 1040/1040-SR
# line 29; Part II line 19 (nonrefundable education credits) → Schedule 3 line 3.
#
# Page layout notes:
#   - Line 6 and line 17 are decimal RATIOS entered across two boxes: an
#     integer/units box and a fractional box ("1 . 000"). Mapped as two text
#     fields each (6_units/6_decimal, 17_units/17_decimal); typed text because the
#     value is a rounded decimal (e.g. "1.000" or "0.652"), not a money amount.
#   - Line 7 has a printed "check this box" widget (under-24 / can't-take-refundable
#     -credit indicator), mapped as checkbox 7_box.
#   - Part III (page 2) is a per-student worksheet. Lines 22a / 22b capture the
#     first / second educational institution; each has a name box, an address box,
#     two Yes/No 1098-T questions, and a 9-digit EIN entered one character per box
#     (22a_ein_1..22a_ein_9 / 22b_ein_1..22b_ein_9).
#   - Lines 23–26 are Yes/No eligibility questions (c2_5..c2_8).
#
# ALL 77 fillable widgets in the skeleton are mapped. No widgets are intentionally
# unmapped — Form 8863 contains no pre-printed statutory-constant boxes (unlike
# Schedule SE's $160,200 / $6,560 boxes). The statutory thresholds on lines 2, 5,
# 13, 16 are taxpayer-entered (the filer picks the MFJ vs other amount), so they
# are real fillable fields, not constants.
#
# RELATIONS — every arithmetic sentence printed on this year's own face was read
# line by line and adjudicated; the eight declared below are the ones that hold
# UNCONDITIONALLY under the verifier's blank-means-zero rule. Each was checked
# against the form's own STOP/skip paths, not just the happy path:
#   - "4 == 2 - 3"   line 4: "Subtract line 3 from line 2. If zero or less, stop;
#     you can't take any education credit."
#   - "9 == 7 - 8"   line 9: "Subtract line 8 from line 7." Also safe on the
#     under-24 path, where line 7's caution says "skip line 8, enter the amount
#     from line 7 on line 9": a skipped line 8 reads as 0, so 9 == 7 - 0 == 7.
#   - "11 == min(10, 10000)"   line 11: "Enter the smaller of line 10 or
#     $10,000." Safe on line 10's own skip path ("If zero, skip lines 11 through
#     17, enter -0- on line 18"): min(0, 10000) == 0 == the blank line 11.
#   - "12 == 11 * 0.20"   line 12: "Multiply line 11 by 20% (0.20)." Reduces to
#     0 == 0 on that same skip path. Line 11 is a whole-dollar money line, so the
#     product always ends .0/.2/.4/.6/.8 — it can never land on a .5 rounding
#     boundary, so the check is deterministic.
#   - "15 == 13 - 14"   line 15: "Subtract line 14 from line 13."
#   - "28 == max(0, 27 - 2000)"   line 28: "Subtract $2,000 from line 27. If zero
#     or less, enter -0-" — the max() IS the printed "-0-" floor. Safe for a
#     student whom lines 23-26 route to line 31 ("Yes — Stop! Go to line 31 for
#     this student"): 27 and 28 are then both blank and max(0, 0 - 2000) == 0.
#   - "29 == 28 * 0.25"   line 29: "Multiply line 28 by 25% (0.25)." Reduces to
#     0 == 0 on the same stop paths.
#   - "30 == min(27, 2000) + 29"   line 30 prints an if/else — "If line 28 is
#     zero, enter the amount from line 27. Otherwise, add $2,000 to the amount on
#     line 29 and enter the result" — and the grammar has no conditional, but the
#     two branches COLLAPSE into one total expression, so this one is declared
#     rather than skipped. Proof (money lines are whole dollars, line 27 >= 0,
#     and line 28 == max(0, 27 - 2000) per the line above): if 27 <= 2000 then
#     28 == 0 and 29 == 0 while min(27, 2000) == 27, giving 30 == 27 — exactly
#     the "if" branch; if 27 > 2000 then min(27, 2000) == 2000, giving
#     30 == 2000 + 29 — exactly the "otherwise" branch. Both stop paths leave
#     every operand blank: 0 == min(0, 2000) + 0. (It is the $2,000 100% tier
#     plus the 25% tier, i.e. the $2,500 AOTC maximum at line 27 == $4,000.)
#
# Relations deliberately NOT encoded (lookup / conditional / grammar limits):
#   - lines 2, 5, 13, 16: "Enter: $180,000 if married filing jointly; $90,000 if
#     single, head of household, or qualifying surviving spouse" — a
#     filing-status LOOKUP the filer performs; not arithmetic over other lines.
#   - lines 3 and 14: "Enter the amount from Form 1040 or 1040-SR, line 11. But
#     if you're filing Form 2555 or 4563, or you're excluding income from Puerto
#     Rico, see Pub. 970 for the amount to enter instead" — an amount imported
#     from another form AND conditional, so not even a safe cross_form rule.
#   - lines 6 and 17: the ratio is entered across TWO boxes (mapped 6.units /
#     6.decimal and 17.units / 17.decimal, typed text), so no numeric line "6" or
#     "17" exists for the grammar to read. Worse, a bare `6` would still PARSE:
#     the disambiguation rule turns an integer token that is not a line key into
#     a LITERAL, so "7 == 1 * 6" would silently mean "line 1 times six" (verified
#     — it FAILs on real data). Deliberately encoded nowhere.
#   - line 7: "Multiply line 1 by line 6" — blocked by the line 6 ratio above.
#   - line 8: "Multiply line 7 by 40% (0.40)" is CONDITIONAL. Line 7's printed
#     caution sends an under-24 filer to "skip line 8, enter the amount from line
#     7 on line 9, and check this box" (that box is mapped as 7.box), so line 8 is
#     legitimately blank while line 7 is nonzero — "8 == 7 * 0.40" would
#     false-FAIL every one of those filings (verified against both populations).
#   - line 18: "Multiply line 12 by line 17" — blocked by the line 17 ratio.
#   - line 19: "Enter the amount from line 7 of the Credit Limit Worksheet" — an
#     INSTRUCTIONS worksheet amount; nothing on the printed face computes it.
#   - lines 1 and 10: "enter the total of all amounts from all Parts III, line 30
#     [line 31]" — an aggregate ACROSS page-2 copies (Part III is per student,
#     "use additional copies of page 2 as needed"). One pack maps one Part III,
#     so no in-pack relation can sum the others.
#   - lines 27 and 31: "Adjusted qualified education expenses (see instructions)"
#     — instructions-driven inputs (line 27 additionally capped by the filer at
#     "Don't enter more than $4,000"); no on-face arithmetic to encode.
form: Form 8863
jurisdiction: federal
tax_year: 2024
source_url: https://www.irs.gov/pub/irs-prior/f8863--2024.pdf
pdf_sha256: "71644cc3a12e89dec7f52d6fe89093cb1b4f77cb83c5c692241d3183ed3a4998"
acroform_root: topmostSubform[0]
fields:
  # ---- Page 1 header ----
  - line: name
    field: Page1[0].f1_1[0]
    type: text
  - line: ssn_area
    field: Page1[0].SocialSecurity[0].f1_2[0]
    type: text
    maxlen: 3
  - line: ssn_group
    field: Page1[0].SocialSecurity[0].f1_3[0]
    type: text
    maxlen: 2
  - line: ssn_serial
    field: Page1[0].SocialSecurity[0].f1_4[0]
    type: text
    maxlen: 4

  # ---- Part I: Refundable American Opportunity Credit ----
  - line: "1"                         # Total of all amounts from all Parts III, line 30
    field: Page1[0].f1_5[0]
    type: money
  - line: "2"                         # $180,000 MFJ / $90,000 single, HOH, QSS
    field: Page1[0].f1_6[0]
    type: money
  - line: "3"                         # Amount from Form 1040/1040-SR, line 11 (MAGI)
    field: Page1[0].f1_7[0]
    type: money
  - line: "4"                         # Subtract line 3 from line 2
    field: Page1[0].f1_8[0]
    type: money
  - line: "5"                         # $20,000 MFJ / $10,000 single, HOH, QSS
    field: Page1[0].f1_9[0]
    type: money
  - line: 6.units                     # Line 6 ratio — integer/units part ("1" or "0")
    field: Page1[0].f1_10[0]
    type: text
  - line: 6.decimal                   # Line 6 ratio — decimal places ("000".."999")
    field: Page1[0].f1_11[0]
    type: text
  - line: 7.box                       # Under-24 box: can't take refundable AOTC, check here
    field: Page1[0].c1_1[0]
    type: checkbox
    on_state: "/1"
  - line: "7"                         # Multiply line 1 by line 6
    field: Page1[0].f1_12[0]
    type: money
  - line: "8"                         # Refundable AOTC: line 7 × 40% → Form 1040 line 29
    field: Page1[0].f1_13[0]
    type: money

  # ---- Part II: Nonrefundable Education Credits ----
  - line: "9"                         # Subtract line 8 from line 7
    field: Page1[0].f1_14[0]
    type: money
  - line: "10"                        # Total of all amounts from all Parts III, line 31
    field: Page1[0].f1_15[0]
    type: money
  - line: "11"                        # Smaller of line 10 or $10,000
    field: Page1[0].f1_16[0]
    type: money
  - line: "12"                        # Multiply line 11 by 20%
    field: Page1[0].f1_17[0]
    type: money
  - line: "13"                        # $180,000 MFJ / $90,000 single, HOH, QSS
    field: Page1[0].f1_18[0]
    type: money
  - line: "14"                        # Amount from Form 1040/1040-SR, line 11 (MAGI)
    field: Page1[0].f1_19[0]
    type: money
  - line: "15"                        # Subtract line 14 from line 13
    field: Page1[0].f1_20[0]
    type: money
  - line: "16"                        # $20,000 MFJ / $10,000 single, HOH, QSS
    field: Page1[0].f1_21[0]
    type: money
  - line: 17.units                    # Line 17 ratio — integer/units part
    field: Page1[0].f1_22[0]
    type: text
  - line: 17.decimal                  # Line 17 ratio — decimal places
    field: Page1[0].f1_23[0]
    type: text
  - line: "18"                        # Multiply line 12 by line 17
    field: Page1[0].f1_24[0]
    type: money
  - line: "19"                        # Nonrefundable education credits → Schedule 3 line 3
    field: Page1[0].f1_25[0]
    type: money

  # ---- Page 2 header (Part III per-student) ----
  - line: name_p2
    field: Page2[0].NameShown[0]
    type: text
  - line: ssn_p2_area
    field: Page2[0].SSN[0].f2_1[0]
    type: text
    maxlen: 3
  - line: ssn_p2_group
    field: Page2[0].SSN[0].f2_2[0]
    type: text
    maxlen: 2
  - line: ssn_p2_serial
    field: Page2[0].SSN[0].f2_3[0]
    type: text
    maxlen: 4

  # ---- Part III: Student and Educational Institution Information ----
  - line: "20"                        # Student name (as shown on page 1 of return)
    field: Page2[0].StudentName[0]
    type: text
  - line: 21.ssn_area                 # Student SSN
    field: Page2[0].StudentSSN[0].f2_4[0]
    type: text
    maxlen: 3
  - line: 21.ssn_group
    field: Page2[0].StudentSSN[0].f2_5[0]
    type: text
    maxlen: 2
  - line: 21.ssn_serial
    field: Page2[0].StudentSSN[0].f2_6[0]
    type: text
    maxlen: 4

  # Line 22a — first educational institution
  - line: 22a.name                    # a. Name of first educational institution
    field: Page2[0].Line22a[0].f2_7[0]
    type: text
  - line: 22a.address                 # 22a(1) Address
    field: Page2[0].Line22a[0].f2_8[0]
    type: text
    maxlen: 255
  - line: 22a.q2.yes                  # 22a(2) Received 1098-T from this institution for 2024? Yes
    field: Page2[0].Line22a[0].c2_1[0]
    type: checkbox
    on_state: "/Yes"
    group: 22a.q2
  - line: 22a.q2.no                   # 22a(2) No
    field: Page2[0].Line22a[0].c2_1[1]
    type: checkbox
    on_state: "/No"
    group: 22a.q2
  - line: 22a.q3.yes                  # 22a(3) Received 1098-T for 2023 with box 7 checked? Yes
    field: Page2[0].Line22a[0].c2_2[0]
    type: checkbox
    on_state: "/Yes"
    group: 22a.q3
  - line: 22a.q3.no                   # 22a(3) No
    field: Page2[0].Line22a[0].c2_2[1]
    type: checkbox
    on_state: "/No"
    group: 22a.q3
  - line: 22a.ein.1                   # 22a(4) Institution EIN — one char per box
    field: Page2[0].Line22a[0].f2_9[0]
    type: text
    maxlen: 1
  - line: 22a.ein.2
    field: Page2[0].Line22a[0].f2_10[0]
    type: text
    maxlen: 1
  - line: 22a.ein.3
    field: Page2[0].Line22a[0].f2_11[0]
    type: text
    maxlen: 1
  - line: 22a.ein.4
    field: Page2[0].Line22a[0].f2_12[0]
    type: text
    maxlen: 1
  - line: 22a.ein.5
    field: Page2[0].Line22a[0].f2_13[0]
    type: text
    maxlen: 1
  - line: 22a.ein.6
    field: Page2[0].Line22a[0].f2_14[0]
    type: text
    maxlen: 1
  - line: 22a.ein.7
    field: Page2[0].Line22a[0].f2_15[0]
    type: text
    maxlen: 1
  - line: 22a.ein.8
    field: Page2[0].Line22a[0].f2_16[0]
    type: text
    maxlen: 1
  - line: 22a.ein.9
    field: Page2[0].Line22a[0].f2_17[0]
    type: text
    maxlen: 1

  # Line 22b — second educational institution (if any)
  - line: 22b.name                    # b. Name of second educational institution
    field: Page2[0].Line22b[0].f2_18[0]
    type: text
  - line: 22b.address                 # 22b(1) Address
    field: Page2[0].Line22b[0].f2_19[0]
    type: text
    maxlen: 257
  - line: 22b.q2.yes                  # 22b(2) Received 1098-T from this institution for 2024? Yes
    field: Page2[0].Line22b[0].c2_3[0]
    type: checkbox
    on_state: "/Yes"
    group: 22b.q2
  - line: 22b.q2.no                   # 22b(2) No
    field: Page2[0].Line22b[0].c2_3[1]
    type: checkbox
    on_state: "/No"
    group: 22b.q2
  - line: 22b.q3.yes                  # 22b(3) Received 1098-T for 2023 with box 7 checked? Yes
    field: Page2[0].Line22b[0].c2_4[0]
    type: checkbox
    on_state: "/Yes"
    group: 22b.q3
  - line: 22b.q3.no                   # 22b(3) No
    field: Page2[0].Line22b[0].c2_4[1]
    type: checkbox
    on_state: "/No"
    group: 22b.q3
  - line: 22b.ein.1                   # 22b(4) Institution EIN — one char per box
    field: Page2[0].Line22b[0].f2_20[0]
    type: text
    maxlen: 1
  - line: 22b.ein.2
    field: Page2[0].Line22b[0].f2_21[0]
    type: text
    maxlen: 1
  - line: 22b.ein.3
    field: Page2[0].Line22b[0].f2_22[0]
    type: text
    maxlen: 1
  - line: 22b.ein.4
    field: Page2[0].Line22b[0].f2_23[0]
    type: text
    maxlen: 1
  - line: 22b.ein.5
    field: Page2[0].Line22b[0].f2_24[0]
    type: text
    maxlen: 1
  - line: 22b.ein.6
    field: Page2[0].Line22b[0].f2_25[0]
    type: text
    maxlen: 1
  - line: 22b.ein.7
    field: Page2[0].Line22b[0].f2_26[0]
    type: text
    maxlen: 1
  - line: 22b.ein.8
    field: Page2[0].Line22b[0].f2_27[0]
    type: text
    maxlen: 1
  - line: 22b.ein.9
    field: Page2[0].Line22b[0].f2_28[0]
    type: text
    maxlen: 1

  # Lines 23–26 — eligibility Yes/No questions
  - line: 23.yes                      # Line 23 AOTC claimed for any 4 prior years? Yes — Stop
    field: Page2[0].c2_5[0]
    type: checkbox
    on_state: "/Yes"
    group: "23"
  - line: 23.no                       # Line 23 No — go to line 24
    field: Page2[0].c2_5[1]
    type: checkbox
    on_state: "/No"
    group: "23"
  - line: 24.yes                      # Line 24 Enrolled at least half-time in 2024? Yes — go to line 25
    field: Page2[0].c2_6[0]
    type: checkbox
    on_state: "/Yes"
    group: "24"
  - line: 24.no                       # Line 24 No — Stop
    field: Page2[0].c2_6[1]
    type: checkbox
    on_state: "/No"
    group: "24"
  - line: 25.yes                      # Line 25 Completed first 4 years before 2024? Yes — Stop
    field: Page2[0].c2_7[0]
    type: checkbox
    on_state: "/Yes"
    group: "25"
  - line: 25.no                       # Line 25 No — go to line 26
    field: Page2[0].c2_7[1]
    type: checkbox
    on_state: "/No"
    group: "25"
  - line: 26.yes                      # Line 26 Convicted of felony drug offense? Yes — Stop
    field: Page2[0].c2_8[0]
    type: checkbox
    on_state: "/Yes"
    group: "26"
  - line: 26.no                       # Line 26 No — complete lines 27–30
    field: Page2[0].c2_8[1]
    type: checkbox
    on_state: "/No"
    group: "26"

  # American Opportunity Credit (lines 27–30)
  - line: "27"                        # Adjusted qualified education expenses (max $4,000)
    field: Page2[0].f2_29[0]
    type: money
  - line: "28"                        # Subtract $2,000 from line 27
    field: Page2[0].f2_30[0]
    type: money
  - line: "29"                        # Multiply line 28 by 25%
    field: Page2[0].f2_31[0]
    type: money
  - line: "30"                        # AOTC for this student → Part I, line 1
    field: Page2[0].f2_32[0]
    type: money

  # Lifetime Learning Credit (line 31)
  - line: "31"                        # Adjusted qualified education expenses → Part II, line 10
    field: Page2[0].f2_33[0]
    type: money

relations:
  # Only unconditional printed-face math; see the RELATIONS block in the banner
  # for the per-line adjudication (and for every rule deliberately NOT encoded).
  - "4 == 2 - 3"                      # "Subtract line 3 from line 2"
  - "9 == 7 - 8"                      # "Subtract line 8 from line 7" (under-24 skip reads line 8 as 0)
  - "11 == min(10, 10000)"            # "Enter the smaller of line 10 or $10,000"
  - "12 == 11 * 0.20"                 # "Multiply line 11 by 20% (0.20)"
  - "15 == 13 - 14"                   # "Subtract line 14 from line 13"
  - "28 == max(0, 27 - 2000)"         # "Subtract $2,000 from line 27. If zero or less, enter -0-"
  - "29 == 28 * 0.25"                 # "Multiply line 28 by 25% (0.25)"
  - "30 == min(27, 2000) + 29"        # line 30's printed if/else on line 28, branch-collapsed
cross_form:
  - "8 == f1040.29"                   # Refundable AOTC → Form 1040/1040-SR, line 29
  - "19 == sched_3.3"                 # Nonrefundable education credits → Schedule 3, line 3
identity_fields:
  - name
  - ssn_area
  - ssn_group
  - ssn_serial
