# RELATIONS — 9 rules, DOWN FROM 11: the printed face broke two of them
# ---------------------------------------------------------------------------
# THE PORT'S HEADLINE FINDING. The 2023 pack declared "15c == 15a - 15b" and
# "25c == 25a - 25b" from the printed rows
#   2023 15c: "Taxable amount. Subtract line 15b from line 15a. If more than
#             zero, also include this amount on 2023 Form 1040, ... line 4b"
#   2023 25c: "Taxable amount. Subtract line 25b from line 25a. If more than
#             zero, also include this amount on 2023 Form 1040, ... line 4b"
# The 2024 rows print a THIRD term, verbatim:
#   2024 15c: "Taxable amount. Subtract line 15b from line 15a. Reduce that
#             amount by certain 2024 retirement plan distribution repayments
#             (other than those reported on Form 8915-F) that are treated as
#             rollovers (see instructions). If more than zero, also include
#             this amount on 2024 Form 1040, 1040-SR, or 1040-NR, line 4b"
#   2024 25c: "Taxable amount. Subtract line 25b from line 25a. Reduce that
#             amount by certain 2024 retirement plan distribution repayments
#             (other than those reported on Form 8915-F) that are treated as
#             rollovers (see instructions). If more than zero, also include
#             this amount on 2024 Form 1040, 1040-SR, or 1040-NR, line 4b"
# So on the 2024 face the arithmetic of 15c is "15a - 15b - (repayments)", not
# "15a - 15b", and the repayment is not a line of this form. Keeping the 2023
# rule would be a MIS-TRANSCRIPTION of the printed row, and it FAILs a correct
# return. Confirmed against the primary source, which supplies the exact
# subtrahend — Instructions for Form 8606 (2024), "2024 Line 15c Worksheet":
#   "Did you repay within the 3-year repayment period, qualified birth or
#    adoption distributions, emergency personal expense distributions, domestic
#    abuse distributions, or terminal illness distributions that you reported
#    on 2024 Form 8606, line 7?  [ ] Yes. Complete this worksheet.  [ ] No.
#    Don't complete this worksheet. Enter on 2024 Form 8606, line 15c, the
#    amount on 2024 Form 8606, line 15a, reduced by the amount on 2024 Form
#    8606, line 15b."
#   worksheet line 4: "Enter the amount on 2024 Form 8606, line 15a, reduced by
#    the amount on 2024 Form 8606, line 15b."
#   worksheet line 5: "Line 15c: Taxable amount. Enter line 4 reduced by line
#    3e, on line 5 here; on 2024 Form 8606, line 15c; ..."
# — i.e. 15c == (15a - 15b) - worksheet-3e, and 3e is "the smaller of the
# amount on line 3c and the amount on line 3d", a quantity computed from
# repayments that appear NOWHERE on Form 8606. The 2024 Line 25c Worksheet is
# the same shape (line 2 = 25a - 25b, line 3 = the repayments, line 4 =
# "Subtract line 3 from line 2. If zero or less, enter -0-. Enter this amount
# on 2024 Form 8606, line 25c"). Both worksheets are NEW in 2024: the same
# instructions' "What's New" announces "2024 Line 15c Worksheet. We have added
# to the discussion under Line 15c a new worksheet ..." and "New Line 25c
# section.", and the 2023 instructions contain neither (checked: no "Line 14"
# section and no worksheet under "Line 15c" in i8606--2023.pdf). So 2024 is the
# revision where the clause APPEARS, and it PERSISTS: the 2025 blank
# (.cache/blanks/2aae6a65a6aa_f8606--2025.pdf, the digest
# formpacks/federal/2025/f8606 pins) prints "Reduce that amount by certain 2025
# retirement plan distribution repayments (other than those reported on Form
# 8915-F) that are treated as rollovers." on both 15c and 25c — read here off
# that blank's own text, and the concurrently authored 2025 pack reached the
# same two drops independently.
# REPRODUCED, not theorised — both directions, on ONE internally consistent
# 2024 return that used BOTH new worksheets, through
# taxfill_core.verify.relations:
#     {1:0, 2:7000, 3:7000, 4:0, 5:7000, 6:0, 7:38500, 8:0, 9:38500,
#      11:0, 12:7000, 13:7000, 14:0, 15a:31500, 15b:0, 15c:25500,
#      16:0, 17:0, 18:0, 19:33000, 20:0, 21:33000, 22:3000, 23:30000,
#      24:0, 25a:30000, 25b:0, 25c:25000}
#   (15c = 31500 - 0 - 6000, the worksheet-3e slice; 25c = 30000 - 0 - 5000,
#    the worksheet line-3 repayments.)
#   * with the two 2023 rules re-added: 9 PASS, 2 FAIL —
#     "relation '15c == 15a - 15b' failed: left side = 25500, right side =
#     31500 (difference -6000)" and "relation '25c == 25a - 25b' failed: left
#     side = 25000, right side = 30000 (difference -5000)".
#   * with them dropped, as shipped: 9 PASS, 0 FAIL on that same return, and
#     also 9 PASS on a full Yes-branch worked example (7,000 backdoor
#     conversion against a 30,000 pretax pool) and on the printed No-branch
#     data {1:5000, 2:0, 3:5000, 14:5000}.
#
# DELIBERATELY NOT DECLARED, with the printed reason (the 2023 list, re-read
# against the 2024 face, plus the two new drops):
#   * "15c == 15a - 15b" and "25c == 25a - 25b" — dropped for 2024, above.
#   * "5 == 3 - 4" ("Subtract line 4 from line 3"). REPRODUCED false FAIL, not
#     theorised: the Part I routing box prints "No -> Enter the amount from
#     line 3 on line 14. Do not complete the rest of Part I.", so on that
#     legitimate path (the MAJORITY path for a filer who only made a
#     nondeductible contribution) lines 4 AND 5 are blank while line 3 is
#     nonzero. verify's relations count a blank as zero, so the rule evaluates
#     0 == 3 - 0 and FAILs a correct return. Reproduced against this pack:
#     relations(pack_with_that_rule, {"1": 5000, "2": 0, "3": 5000, "14": 5000})
#     returns FAIL "left side = 0, right side = 5000 ... blank-as-zero: 5, 4".
#     Same class as f8960's undeclared "18a == 12" copy rule.
#     Note "14 == 3 - 13" is SAFE on that very path — the printed No branch
#     routes line 3 to line 14, so 14 == 3 - 0 holds — but it is NOT declared
#     for a different reason: see the prior-year-worksheet caveat below, which
#     the integrator ACTED on (2026-08-26) rather than merely recording.
#   * "10 == min(1.000, 5 / 9)". Line 10 is not a single mapped money line —
#     the printed box is "x __ . ___", two widgets straddling a printed decimal
#     point (see the 10.whole / 10.dec fields), typed text because the value is
#     a rounded ratio. On top of that, line 9 is legitimately zero (division by
#     zero) and "rounded to at least 3 places" is not exact arithmetic.
#   * "11 == 8 * 10" and "12 == 7 * 10" ("Multiply line 8 [7] by line 10"):
#     operand 10 is not a bare money line (above), and both products are
#     rounded amounts.
#   * Lines 16 and 17. Their printed text is a CONDITIONAL copy with an
#     "Otherwise" leg — "If you completed Part I, enter the amount from line 8
#     [line 11]. Otherwise, enter the net amount you converted ... [enter your
#     basis in the amount on line 16 (see instructions)]" — so no unconditional
#     equality exists (the f8960 line-18a precedent). Line 8's own printed
#     tail, "Also, enter this amount on line 16", is the same conditional in
