#
# ONE RULE WAS DROPPED OVER AN INSTRUCTION-ONLY CAVEAT (integrator decision,
# 2026-08-26 — this banner originally RECORDED the caveat and kept the rule, on
# the ground that formpacks/CONVENTIONS.md's discriminator is the PRINTED FACE;
# the call was reversed because the caveat's path yields a FALSE verification
# FAIL on a correct return, and the house rule for worksheet-driven subtotals is
# to leave them to recompute + review — see the relations block for the full
# reasoning). "14 == 3 - 13" is NOT declared, although the 2024 face prints exactly "Subtract
# line 13 from line 3. This is your total basis in traditional IRAs for 2024
# and earlier years", word-for-word the 2023 row with the year rolled, and no
# third term. But the 2024 instructions add a CAUTION that did not exist for
# 2023 — Instructions for Form 8606 (2024), "Line 14": "Enter the amount on
# line 3 reduced by the amount on line 13." then "[CAUTION] If you completed
# the 2024 Line 15c Worksheet, include on line 14, the amount, if any, from
# line 6 of the worksheet." (worksheet line 6: "Basis adjustment. If line 3d is
# more than line 3e, enter line 3d reduced by line 3e on line 6 here and also
# include this amount on 2024 Form 8606, line 14"). The 2024 Total Basis Chart
# (same instructions, p. 9) carries the matching NEW first row: "IF the last
# Form 8606 you filed was for ... 2024 / THEN enter on line 2 the amount from
# line 14 of that Form 8606 as adjusted to include the amount, if any, from
# line 6 of your 2024 Line 15c Worksheet. See Line 14, later." So on that
# narrow path (a SECURE 2.0 distribution reported on line 7, repaid within 3
# years, with repayments exceeding the taxable slice) a CORRECT line 14 exceeds
# 3 - 13 and this rule FAILs. REPRODUCED so the caveat is measured, not
# guessed: relations(pack, {..., 3:7000, 13:7000, 14:4000, ...}) — a 10,000
# repayment against a 6,000 taxable slice, so a 4,000 adjustment — returns
# "relation '14 == 3 - 13' failed: left side = 4000, right side = 0
# (difference +4000)". It is KEPT anyway because (a) the printed row says only
# "3 - 13", which is what relations transcribes, and (b) unlike the dropped
# 15c/25c rules the extra term is nowhere on the printed face — the
# formpacks/CONVENTIONS.md discriminator. Reported to the integrator as an open
# item; a `relations` grammar for "instruction-conditional" rules, or a calc-op
# home for the two new worksheets, is engine work, not a pack edit.
# NOTE for the 25c worksheet's own carryforward: its line 5 adjustment is
# "Include this amount as an adjustment on Form 8606, line 22, for the NEXT
# year after 2024" — so it does not disturb THIS pack's line 22.
#
# ---------------------------------------------------------------------------
# CROSS-FORM — deliberately EMPTY, and this is the load-bearing part
# ---------------------------------------------------------------------------
# THREE separate lines — 15c, 18 and 25c — each print "... also include this
# amount on 2024 Form 1040, 1040-SR, or 1040-NR, line 4b." That is an ADDITIVE
# instruction, not an equality, and the repo has no grammar for it:
#   * f1040 2024 line 4b (mapped in formpacks/federal/2024/f1040/pack.yaml, and
#     printed on that blank's page 1 as "4a IRA distributions ... 4a / b
#     Taxable amount ... 4b") aggregates all three of these lines plus any
#     other taxable IRA distribution, so no single "== f1040.4b" rule can be
#     true;
#   * the instructions make the conditionality explicit — Instructions for Form
#     8606 (2024), "Line 18": "If your entry on line 18 is zero or less, don't
#     include the result on 2024 Form 1040, 1040-SR, or 1040-NR, line 4b.
#     Include the full amount of the distribution on 2024 Form 1040, 1040-SR,
#     or 1040-NR, line 4a." — so even the sum is not unconditional.
# A rule like "15c == f1040.4b" would therefore be a FALSE check, which is
# worse than none. Lines 15b and 25b likewise print "Also, enter this amount on
# 2024 Form(s) 8915-F, line 18 [line 19], as applicable" — no f8915f pack
# exists in any year, and adding a CROSS_FORM_TARGET_ALLOWLIST row for a rule
# that is "as applicable" (i.e. conditional) would be the same false check.
#
# ---------------------------------------------------------------------------
# CALC INTEGRATION (ROADMAP I1) — the seam, re-measured on THIS pack
# ---------------------------------------------------------------------------
# calc.ira_pro_rata's IraProRataResult.form_8606_lines emits 19 keys. 18 of them
# are EXACT line keys of this pack (1-9, 11, 12, 13, 14, 15a, 15c, 16, 17, 18).
# The 19th is "10", and it structurally cannot have a pack key: the printed
# ratio row is two widgets straddling the form's own decimal point (see
# 10.whole / 10.dec below). Reproduced against the 2024 pack:
# fill_form(pack, result.form_8606_lines) raises "unknown line key(s) ['10']";
# splitting "0.189" into 10.whole="0" and 10.dec="189" — and coercing the
# display strings ("$7,000") to numbers, since form_8606_lines is documented as
# a transcription dict, not a fill payload — fills 20 fields with zero warnings
# and verify_form returns ok=True with all 9 declared relations PASSing on the
# op's own numbers. That render was read: line 10 prints "x 0 . 189", exactly
# as a filer writes it. calc's _F8606_VERIFIED_REVISIONS = range(2019, 2026)
# already includes 2024, and its per-year citation states Part I lines 1-14 and
# Part II lines 16-18 with this exact numbering — a second reader agreeing with
# this map. That agreement is about the printed LINE NUMBERS only: the field
# NAMES were still introspected and vision-audited afresh here (the sched_d
# lesson under P-007 is that the IRS renames widgets while keeping the face),
# and the printed ROW TEXT was diffed line by line, which is what caught the
# 15c/25c relation change that a numbering-only check would have missed.
#
# ---------------------------------------------------------------------------
# IDENTITY FIELDS — [name, identifying_number], and the per-spouse caveat
# ---------------------------------------------------------------------------
# House practice for a per-spouse attachment (sched_se, sched_c, f2555, f8960
# all ship exactly [name, identifying_number]) is followed here. The printed
# face and the instructions both make the per-spouse scope explicit, and it is
# worth recording because it is the one way these two lines can legitimately
# DIFFER from the parent 1040 on a joint return:
#   * printed on the face: "Name. If married, file a separate form for each
#     spouse required to file 2024 Form 8606. See instructions."
#   * Instructions for Form 8606 (2024), Specific Instructions: "Name and
#     social security number (SSN). If you file a joint return, enter only the
#     name and SSN of the spouse whose information is being reported on Form
#     8606." and "More than one Form 8606 required. If both you and your spouse
#     are required to file 2024 Form 8606, file a separate 2024 Form 8606 for
#     each of you."
# The page-1 ADDRESS block is mapped but deliberately kept OUT of
# identity_fields: the printed side caption is "Fill in Your Address Only if
# You Are Filing This Form by Itself and Not With Your Tax Return", so on the
# ordinary attached path every address box is CORRECTLY blank, and a blank
# identity field FAILs verification. Instructions confirm the same split:
# "If you aren't required to file an income tax return but are required to file
# 2024 Form 8606, sign 2024 Form 8606 and send it to the IRS at the same time
# and place you would otherwise file 2024 Form 1040, 1040-SR, or 1040-NR. Be
# sure to include your address on page 1 of the form and your signature and the
# date on page 2 of the form." (Instructions for Form 8606 (2024), "When and
# Where To File").
# ENGINE INTERACTION the integrator should see, and it REPRODUCES on the 2024
# packs exactly as on the 2023 ones: verify's _identity_checks takes the UNION
# of every pack's identity_fields and then evaluates each name against every
# pack that MAPS it, even a pack that did not declare it. federal/2024/f1040nr
# declares mailing_address.street, so verify_filing over that pack plus this
# one, with the 8606 ATTACHED — its address block correctly blank per the
# printed caption — returns ok=False and, verbatim from the run:
# "FAIL identity field 'mailing_address.street' differs across the filing:
# f1040nr='106 Synthetic Way', f8606='' — every form must carry the same
# value; refill the mismatched form(s)." (mailing_address.city does NOT
# collide, because this form's combined box is keyed .city_state_zip; the
# street value shown is whatever synthetic_values assigned that run.)
# An off-convention key spelling was CONSIDERED AND REJECTED as a fix: the only
# other spelling for this box that still matches verify's _FILER_ADDR_INCLUDE —
# so that the P-002 address check still participates on the STANDALONE path,
# where this address is the only one the IRS has — is bare `home_address`, and
# nj1040 2023/2024 already declare `home_address` in THEIR identity_fields. The
# collision is therefore structural in _identity_checks (a printed-conditional
# address block has no way to opt out of the union), not a naming problem, so
# this pack keeps the house-standard keys and the gap is reported instead of
# being dodged with a name that moves the same failure one pack over.
#
# ---------------------------------------------------------------------------
# SIGNATURE / MAILING
# ---------------------------------------------------------------------------
# signature: page 2, standalone_only: true — the f8843 shape, and here the
# printed caption states it verbatim: "Sign Here Only if You Are Filing This
# Form by Itself and Not With Your Tax Return". Attached to a 1040/1040-SR/
# 1040-NR the form is NOT separately signed.
# mailing: null — the standalone address is "the same time and place you would
# otherwise file 2024 Form 1040, 1040-SR, or 1040-NR" (Instructions for Form
# 8606 (2024), "When and Where To File"), i.e. the STATE-dependent Form 1040
# where-to-file table. Per
# formpacks/CONVENTIONS.md that address belongs to the knowledge layer, which
# is why the f1040 pack itself ships mailing: null; a fixed pair of addresses
# here would be invented.
form: "8606"
jurisdiction: federal
tax_year: 2024
source_url: https://www.irs.gov/pub/irs-prior/f8606--2024.pdf
pdf_sha256: "d83534e145f9240b7d24b21a0aa05e0c988a788840127403cabe95304addd117"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header (page 1) ------------------------------------------------------
  - line: "name"                            # "Name. If married, file a separate form for each spouse required to file 2024 Form 8606. See instructions."
    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"              # "Your social security number" — plain box, NOT a comb; widget /MaxLen 11 (fits a dashed SSN)
    field: "Page1[0].f1_2[0]"
    type: text
    maxlen: 9
    format: ssn_digits_only                 # digits only keeps cross-form identity values consistent (f8960/sched_oi house style)

  # ---- address block: printed "Fill in Your Address Only if You Are Filing
  # ---- This Form by Itself and Not With Your Tax Return" (blank when attached)
  - line: "mailing_address.street"          # "Home address (number and street, or P.O. box if mail is not delivered to your home)"
    field: "Page1[0].f1_3[0]"
    type: text
  - line: "mailing_address.apt"             # "Apt. no."
    field: "Page1[0].f1_4[0]"
    type: text
  - line: "mailing_address.city_state_zip"  # ONE printed box: "City, town or post office, state, and ZIP code. If you have a foreign address, also complete the spaces below (see instructions)." (ky/2023/form740 precedent for a combined box)
    field: "Page1[0].f1_5[0]"
    type: text
  - line: "mailing_address.foreign_country" # "Foreign country name"
    field: "Page1[0].f1_6[0]"
    type: text
  - line: "mailing_address.foreign_province"        # "Foreign province/state/county"
    field: "Page1[0].f1_7[0]"
    type: text
  - line: "mailing_address.foreign_postal_code"     # "Foreign postal code"
    field: "Page1[0].f1_8[0]"
    type: text

  # ---- Part I: Nondeductible Contributions to Traditional IRAs and
  # ---- Distributions From Traditional, Traditional SEP, and Traditional
  # ---- SIMPLE IRAs (page 1, printed lines 1-15c)
  - line: "1"                               # "Enter your nondeductible contributions to traditional IRAs for 2024, including those made for 2024 from January 1, 2025, through April 15, 2025. See instructions"
    field: "Page1[0].f1_9[0]"
    type: money
  - line: "2"                               # "Enter your total basis in traditional IRAs. See instructions" (Total Basis Chart: prior Form 8606 line 14 — worksheet, no relation)
    field: "Page1[0].f1_10[0]"
    type: money
  - line: "3"                               # "Add lines 1 and 2"
    field: "Page1[0].f1_11[0]"
    type: money
  # Printed routing box sits here (between lines 3 and 4): "In 2024, did you
  # take a distribution from traditional, traditional SEP, or traditional
  # SIMPLE IRAs, or make a Roth, Roth SEP, or Roth SIMPLE IRA conversion?"
  # No -> line 3 goes on line 14 and the rest of Part I is left blank;
  # Yes -> go to line 4.  It has NO AcroForm widget (the document's only /Btn is
  # the page-2 preparer box), so it has no line key — see the header.
  - line: "4"                               # "Enter those contributions included on line 1 that were made from January 1, 2025, through April 15, 2025"
    field: "Page1[0].f1_12[0]"
    type: money
  - line: "5"                               # "Subtract line 4 from line 3" — relation NOT declared: blank on the printed No branch (see header)
    field: "Page1[0].f1_13[0]"
    type: money
  - line: "6"                               # "Enter the value of all your traditional, traditional SEP, and traditional SIMPLE IRAs as of December 31, 2024, plus any outstanding rollovers. Subtract certain 2024 retirement plan distribution repayments treated as rollovers, if any (see instructions)" — the 8915-F-only wording of 2023 was replaced (see header)
    field: "Page1[0].f1_14[0]"
    type: money
  - line: "7"                               # "Enter your distributions from traditional, traditional SEP, and traditional SIMPLE IRAs in 2024. Do not include rollovers (but do include certain 2024 retirement plan distribution repayments treated as rollovers (see instructions)). Also, do not include qualified charitable distributions; a one-time distribution to fund an HSA; conversions to a Roth, Roth SEP, or Roth SIMPLE IRA; certain returned contributions; or recharacterizations of traditional IRA contributions (see instructions)"
    field: "Page1[0].f1_15[0]"
    type: money
  - line: "8"                               # "Enter the net amount you converted from traditional, traditional SEP, and traditional SIMPLE IRAs to Roth, Roth SEP, or Roth SIMPLE IRAs in 2024. Also, enter this amount on line 16"
    field: "Page1[0].f1_16[0]"
    type: money
  - line: "9"                               # "Add lines 6, 7, and 8" — inset column box
    field: "Page1[0].f1_17[0]"
    type: money
  # Line 10 is a DECIMAL RATIO printed as "x __ . ___": two widgets straddling
  # the form's own decimal point. f1_18 is the single cell BEFORE it (widget
  # /MaxLen 1 — the "1" of the printed "If the result is 1.000 or more, enter
  # '1.000'" cap) and f1_19 the places AFTER it. Typed text, not money, and no
  # relation: same shape and the same key convention as f2555 35.whole/35.dec.
  # Re-read off the 2024 sentinel render ("x 9 . f1_19"), not inherited.
  - line: "10.whole"                        # 10 "Divide line 5 by line 9. Enter the result as a decimal rounded to at least 3 places. If the result is 1.000 or more, enter '1.000'" — integer part
    field: "Page1[0].f1_18[0]"
    type: text
    maxlen: 1                               # the widget's own /MaxLen
  - line: "10.dec"                           # ... the decimal places after the printed "." (widget declares NO /MaxLen, so none is pinned here; "at least 3 places" is not a hard cap)
    field: "Page1[0].f1_19[0]"
    type: text
  - line: "11"                              # "Multiply line 8 by line 10. This is the nontaxable portion of the amount you converted to Roth, Roth SEP, or Roth SIMPLE IRAs. Also, enter this amount on line 17" — inset column box; wording identical to 2023 but re-wrapped 3 printed text lines -> 2, which is why this widget's /Rect rose 12 pt (same printed line, same binding — re-read off the sentinel render)
    field: "Page1[0].f1_20[0]"
    type: money
  - line: "12"                              # "Multiply line 7 by line 10. This is the nontaxable portion of your distributions that you did not convert to a Roth, Roth SEP, or Roth SIMPLE IRA" — inset column box
    field: "Page1[0].f1_21[0]"
    type: money
  - line: "13"                              # "Add lines 11 and 12. This is the nontaxable portion of all your distributions"
    field: "Page1[0].f1_22[0]"
    type: money
  - line: "14"                              # "Subtract line 13 from line 3. This is your total basis in traditional IRAs for 2024 and earlier years" — the line the NEXT year's line 2 comes from. Face prints only "3 - 13"; the 2024 instructions add an instruction-only CAUTION to also include the 2024 Line 15c Worksheet line 6 basis adjustment (see header)
    field: "Page1[0].f1_23[0]"
    type: money
  - line: "15a"                             # "Subtract line 12 from line 7"
    field: "Page1[0].f1_24[0]"
    type: money
  - line: "15b"                             # "Enter the amount on line 15a attributable to qualified disaster distributions, if any, from 2024 Form(s) 8915-F (see instructions). Also, enter this amount on 2024 Form(s) 8915-F, line 18, as applicable (see instructions)"
    field: "Page1[0].f1_25[0]"
    type: money
  - line: "15c"                             # "Taxable amount. Subtract line 15b from line 15a. Reduce that amount by certain 2024 retirement plan distribution repayments (other than those reported on Form 8915-F) that are treated as rollovers (see instructions). If more than zero, also include this amount on 2024 Form 1040, 1040-SR, or 1040-NR, line 4b" — the "Reduce that amount by" clause is NEW in 2024 and is why "15c == 15a - 15b" is no longer declared (see header)
    field: "Page1[0].f1_26[0]"
    type: money

  # ---- Part II: 2024 Conversions From Traditional, Traditional SEP, or
  # ---- Traditional SIMPLE IRAs to Roth, Roth SEP, or Roth SIMPLE IRAs
  # ---- (page 2, printed lines 16-18)
  - line: "16"                              # "If you completed Part I, enter the amount from line 8. Otherwise, enter the net amount you converted from traditional, traditional SEP, and traditional SIMPLE IRAs to Roth, Roth SEP, or Roth SIMPLE IRAs in 2024" (conditional copy — no relation)
    field: "Page2[0].f2_1[0]"
    type: money
  - line: "17"                              # "If you completed Part I, enter the amount from line 11. Otherwise, enter your basis in the amount on line 16 (see instructions)" (conditional copy — no relation)
    field: "Page2[0].f2_2[0]"
    type: money
  - line: "18"                              # "Taxable amount. Subtract line 17 from line 16. If more than zero, also include this amount on 2024 Form 1040, 1040-SR, or 1040-NR, line 4b" — unchanged from 2023 apart from the year: no "Reduce that amount by" clause here
    field: "Page2[0].f2_3[0]"
    type: money

  # ---- Part III: Distributions From Roth, Roth SEP, or Roth SIMPLE IRAs
  # ---- (page 2, printed lines 19-25c)
  - line: "19"                              # "Enter your total nonqualified distributions from Roth, Roth SEP, and Roth SIMPLE IRAs in 2024, including any qualified first-time homebuyer distributions, and any 2024 retirement plan distributions whose repayments are treated as rollovers (see instructions)" — the 8915-F-only wording of 2023 was replaced (see header)
    field: "Page2[0].f2_4[0]"
    type: money
  - line: "20"                              # "Qualified first-time homebuyer expenses (see instructions). Do not enter more than $10,000 reduced by the total of all your prior qualified first-time homebuyer distributions" (the $10,000 is printed in the ROW TEXT, not inside the widget)
    field: "Page2[0].f2_5[0]"
    type: money
  - line: "21"                              # "Subtract line 20 from line 19. If zero or less, enter -0-"
    field: "Page2[0].f2_6[0]"
    type: money
  - line: "22"                              # "Enter your basis in Roth, Roth SEP, and Roth SIMPLE IRA contributions (see instructions). If line 21 is zero, stop here" (instructions worksheet — no relation)
    field: "Page2[0].f2_7[0]"
    type: money
  - line: "23"                              # "Subtract line 22 from line 21. If zero or less, enter -0- and skip lines 24 and 25. If more than zero, you may be subject to an additional tax (see instructions)"
    field: "Page2[0].f2_8[0]"
    type: money
  - line: "24"                              # "Enter your basis in conversions from traditional, traditional SEP, and traditional SIMPLE IRAs and rollovers from qualified retirement plans to a Roth, Roth SEP, or Roth SIMPLE IRA. See instructions" (instructions worksheet — no relation)
    field: "Page2[0].f2_9[0]"
    type: money
  - line: "25a"                             # "Subtract line 24 from line 23. If zero or less, enter -0- and skip lines 25b and 25c"
    field: "Page2[0].f2_10[0]"
    type: money
  - line: "25b"                             # "Enter the amount on line 25a attributable to qualified disaster distributions, if any, from 2024 Form(s) 8915-F (see instructions). Also, enter this amount on 2024 Form(s) 8915-F, line 19, as applicable (see instructions)"
    field: "Page2[0].f2_11[0]"
    type: money
  - line: "25c"                             # "Taxable amount. Subtract line 25b from line 25a. Reduce that amount by certain 2024 retirement plan distribution repayments (other than those reported on Form 8915-F) that are treated as rollovers (see instructions). If more than zero, also include this amount on 2024 Form 1040, 1040-SR, or 1040-NR, line 4b" — the "Reduce that amount by" clause is NEW in 2024 and is why "25c == 25a - 25b" is no longer declared (see header)
    field: "Page2[0].f2_12[0]"
    type: money

  # ---- Paid Preparer Use Only (page 2) --------------------------------------
  # Same block, same key spellings, as f843 and f1040x. "Your signature",
  # its "Date", "Preparer's signature" and the preparer's "Date" are printed
  # rules with no widgets, so they have no keys. The whole block sits 24 pt
  # lower than in 2023 because printed line 25c grew two text lines; the
  # bindings were re-read off the 2024 sentinel render, not carried over.
  - line: "preparer.name"                   # "Print/Type preparer's name"
    field: "Page2[0].f2_13[0]"
    type: text
  - line: "preparer.self_employed"          # "Check [ ] if self-employed" — the form's ONLY /Btn; /AP /N holds one state, "/1"
    field: "Page2[0].c2_1[0]"
    type: checkbox
    on_state: "/1"
  - line: "preparer.ptin"                   # "PTIN"
    field: "Page2[0].f2_14[0]"
    type: text
    maxlen: 11                              # the widget's own /MaxLen
  - line: "preparer.firm_name"              # "Firm's name"
    field: "Page2[0].f2_15[0]"
    type: text
  # NOT in reading order, re-confirmed on the 2024 render: f2_17 is the EIN box
  # on the firm-NAME row (upper right) and f2_16 is the address box on the row
  # BELOW. Mapping these two in numeric order swaps EIN and address.
  - line: "preparer.firm_ein"               # "Firm's EIN"
    field: "Page2[0].f2_17[0]"
    type: text
    maxlen: 10                              # the widget's own /MaxLen (XX-XXXXXXX)
  - line: "preparer.firm_address"           # "Firm's address"
    field: "Page2[0].f2_16[0]"
    type: text
  - line: "preparer.firm_phone"             # "Phone no."
    field: "Page2[0].f2_18[0]"
    type: text

relations:
  # Part I
  - "3 == 1 + 2"                    # "3 Add lines 1 and 2"
  - "9 == 6 + 7 + 8"                # "9 Add lines 6, 7, and 8"
  - "13 == 11 + 12"                 # "13 Add lines 11 and 12. This is the nontaxable portion of all your distributions"
  # NO "14 == 3 - 13": DROPPED 2026-08-26 by integrator decision, the same call the
  # missing "15c == 15a - 15b" rule above/below makes. The printed row does read
  # "14 Subtract line 13 from line 3", but Instructions for Form 8606 (2024), Line
  # 14, adds a path on which that is FALSE: "If you are completing Part I of 2024
  # Form 8606 (and the last time you filed a Form 8606 with a completed Part I
  # before 2024, you completed a Line 15c Worksheet on which the amount on line 6
  # was greater than zero), enter on line 14 ... the amount on 2024 Form 8606, line
  # 3, reduced by the amount on line 13" PLUS that carried worksheet amount. The
  # adjustment comes from a PRIOR year's worksheet, so nothing on this year's face
  # can derive it, and a filer who repaid a qualified birth-or-adoption, emergency
  # personal expense, domestic-abuse or terminal-illness distribution would get a
  # FALSE verification FAIL on a correct return. House rule applies (see sched_d:
  # "the conditional/worksheet-driven subtotals ... are likewise left to recompute
  # + review"): a relation that FAILs a legitimate filing path is worse than no
  # relation, because it teaches the operator to ignore FAILs. Line 14 is left to
  # verify's independent recompute + human review. The 2023 pack KEEPS this rule:
  # the Line 15c Worksheet is new in 2024 and the 2023 instructions never mention
  # it, so there the identity is unconditional (checked, not assumed).
  - "15a == 7 - 12"                 # "15a Subtract line 12 from line 7"
  # NOT "15c == 15a - 15b": the 2024 row prints a third term ("Reduce that
  # amount by certain 2024 retirement plan distribution repayments ...") that is
  # not a line of this form. Declared in the 2023 pack; dropped here — header.
  # Part II
  - "18 == 16 - 17"                 # "18 Taxable amount. Subtract line 17 from line 16." No floor is printed, and no reduction clause was added in 2024
  # Part III
  - "21 == max(0, 19 - 20)"         # "21 Subtract line 20 from line 19. If zero or less, enter -0-"
  - "23 == max(0, 21 - 22)"         # "23 Subtract line 22 from line 21. If zero or less, enter -0- and skip lines 24 and 25"
  - "25a == max(0, 23 - 24)"        # "25a Subtract line 24 from line 23. If zero or less, enter -0- and skip lines 25b and 25c"
  # NOT "25c == 25a - 25b": same new printed reduction clause as 15c — header.

# Deliberately empty — 15c/18/25c each "also include this amount on 2024 Form
# 1040, 1040-SR, or 1040-NR, line 4b", which is additive and conditional, not
# an equality (see the header).
cross_form: []

identity_fields: [name, identifying_number]

# "Sign Here Only if You Are Filing This Form by Itself and Not With Your Tax
# Return" (printed, page 2) — the f8843 standalone_only shape.
signature:
