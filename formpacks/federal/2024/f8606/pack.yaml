# Form 8606 (2024 revision) — Nondeductible IRAs. Two pages; attaches to Form
# 1040, 1040-SR or 1040-NR, and is FILED BY ITSELF (signed, page 2) by a filer
# who is not required to file an income tax return but is required to file
# Form 8606. This is the form that carries IRA basis across years — the
# instructions' Total Basis Chart routes "the amount from line 14 of that Form
# 8606" into the NEXT year's line 2 — so it is the landing surface for the
# ROADMAP I1 calc ops (ira_pro_rata / roth_conversion).
#
# PORTED 2026-08-26 from formpacks/federal/2023/f8606/pack.yaml (authored the
# same day). The AcroForm topology is unchanged — same 45 names, same /FT,
# /Ff, /MaxLen and /AP states, only 14 /Rect values moved (full diff below) —
# so every binding carried over, re-derived from the render rather than
# assumed. But the PRINTED FACE changed in SEVEN rows, and two of the 2023
# pack's eleven relations had to be DROPPED because the printed row text
# itself gained a third term. This is the port where "identical field names"
# and "same map" came apart.
#
