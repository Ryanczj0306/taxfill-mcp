#   * Lines 1, 2, 6, 7, 8, 19, 20, 22, 24: source lines, no on-face math. Line
#     2 in particular is an instruction-WORKSHEET lookup, not form arithmetic:
#     the Total Basis Chart (Instructions for Form 8606 (2024), p. 9) says "IF
#     the last Form 8606 you filed was for a year after 2000 and before 2024 /
#     THEN enter on line 2 the amount from line 14 of that Form 8606." That
#     prior-year chain belongs to calc + the knowledge packs, never to
