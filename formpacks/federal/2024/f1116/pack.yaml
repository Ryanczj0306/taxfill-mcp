# ---------------------------------------------------------------------------
# THE HEADLINE CATCH — the surviving name that binds a different box
# ---------------------------------------------------------------------------
# 2023 mapped the seven category boxes to Page1[0].c1_1[0] .. c1_1[6], in
# printed order a..g, with on-states /1../7. For 2024 the IRS moved six of them
# into three per-column wrappers and LEFT THE SEVENTH at the bare 2023 name:
#
#   printed box            2023 field            2024 field                              on_state
#   a Section 951A         Page1[0].c1_1[0]      Page1[0].LineA-B_ReadOrder[0].c1_1[0]   /1
#   b Foreign branch       Page1[0].c1_1[1]      Page1[0].LineA-B_ReadOrder[0].c1_1[1]   /2
#   c Passive              Page1[0].c1_1[2]      Page1[0].LineC-D_ReadOrder[0].c1_1[0]   /3
#   d General              Page1[0].c1_1[3]      Page1[0].LineC-D_ReadOrder[0].c1_1[1]   /4
#   e Section 901(j)       Page1[0].c1_1[4]      Page1[0].LineE-F_ReadOrder[0].c1_1[0]   /5
#   f Re-sourced by treaty Page1[0].c1_1[5]      Page1[0].LineE-F_ReadOrder[0].c1_1[1]   /6
#   g Lump-sum             Page1[0].c1_1[6]      Page1[0].c1_1[0]                        /7
#
# So Page1[0].c1_1[0] exists in both years, is a /Btn in both years, and is the
# ONLY surviving checkbox name — and it is box a in 2023 and box g in 2024. Its
# /Rect moved 432.0 pt to the right (43.20 -> 475.20, i.e. all the way across
# the page) and its on-state moved /1 -> /7. A port that carried the 2023 map by
# name would have shipped `category.section_951a` writing box g: the filer's
# Form 1116 would declare LUMP-SUM DISTRIBUTIONS, the whole form would compute a
# limitation against the wrong basket, and Part IV would route the credit to
# printed line 31 instead of line 25. `fill_form` would emit no warning (the
# widget exists and the state is real), and `verify`'s checkbox audit would pass
# (exactly one member of the group is set). Nothing but the render catches it.
# It was caught here by TWO DISCRIMINATING 200-dpi RENDERS, not by the sweep:
# the sweep ticks every box, so it cannot tell the seven apart. Render A ticked
# only the widgets this pack claims are a, d, e (plus (j) Paid) and the printed
# face showed exactly a, d, e ticked with b, c, f, g clear. Render B ticked the
# claimed b, c, f, g (plus (k) Accrued, plus line 1b, plus the page-2 line-10
# box) and showed exactly b, c, f, g. The two renders are complements, so all
# seven bindings are pinned independently.
#
# ---------------------------------------------------------------------------
# THE KEY CONVENTION — unchanged from 2023, and why the obvious spelling is a
# trap on THIS form
# ---------------------------------------------------------------------------
# Form 1116 is filed PER INCOME CATEGORY ("Use a separate Form 1116 for each
# category of income listed below ... Check only one box on each Form 1116"), and
# Part I is a THREE-COUNTRY COLUMN GRID (A / B / C) plus a Total column, while
# Part II is the same three countries turned sideways into three LINES (A / B /
# C) crossed with lettered columns (j)..(u). Three axes, all lettered.
#
# The house column spelling is line-first-column-second: sched_d keys `1a.d`,
# sched_e keys `3.a`. Applied literally here it would give `1a.a` / `1a.b` /
# `1a.c` — and that is REJECTED, deliberately, because on this form the column
# letters COLLIDE BY EYE with the printed sub-line letters. The form prints
# lines 1a AND 1b; 3a..3g; 4a AND 4b. So `1a.b` (line 1a, country column B)
# reads exactly like printed line `1b`; `4a.b` reads like `4b`; `3a.c` reads
# like `3c`. Three lookalike pairs, and the failure they produce is not a crash
# but a silently wrong return — a wrong-column entry keeps every field name
# intact. `col_a`/`col_b`/`col_c` cannot be misread by eye or by a fuzzy caller.
# (LINE_ID_RE was re-checked by executing the real regex from
# test_formpacks_federal.py over every key in THIS file.)
#
#   Part I   <printed line>.col_a | .col_b | .col_c | .total     e.g. 3g.col_b
#   Part II  line_a | line_b | line_c  .  <printed column letter> e.g. line_a.q
#   Part III/IV  <printed line>                                   e.g. 24
#   category checkboxes   category.<category name>
#
# * `.total` is the Part I column printed "Total (Add cols. A, B, and C.)".
#   Only THREE rows have a widget in it — 1a (box labelled "1a"), 6 (box
#   labelled "6") and 7. Every other Total cell is solid grey with no widget at
#   all, which is why there is no `2.total`, no `3a.total` and so on. Re-checked
#   on the 2024 render and dump: unchanged, nothing was dropped (120 widgets,
#   120 keys).
#
# * Part II rows are keyed `line_a`/`line_b`/`line_c` because THE FORM CALLS
#   THEM LINES: printed line 8 reads "Add lines A through C, column (u)". A bare
#   `a.q` was rejected for the same lookalike reason as above (`a` is also a
#   printed CATEGORY box letter) and because `line_a` matches sched_8812's
#   `line<N>` group spelling already in the repo.
#
# * THE CROSS-PART IDENTITY, which no schema field can express and which a
#   caller must not get wrong: Part I column A and Part II line A are THE SAME
#   COUNTRY. Printed Note, between the category boxes and Part I: "If you paid
#   taxes to only one foreign country or U.S. territory, use column A in Part I
#   and line A in Part II. If you paid taxes to more than one foreign country or
#   U.S. territory, use a separate column and line for each country or
#   territory." So `i.col_a` names the country whose taxes go on `line_a.*`.
#   `relations` is arithmetic over money lines and `identity_fields` drives a
#   cross-FORM check, so "col_a and line_a describe one country" has no home in
#   the schema and no gate will catch a caller that crosses them.
#
# * Category option names are DESCRIPTIVE, not the printed letters a..g, for
#   f8949's reason: a one-character difference buried in a key is a silent wrong
#   return, and here the wrong category box means the whole form computes a
#   limitation against the wrong basket and Part IV routes the credit to the
#   wrong summary line. That reason is no longer hypothetical — see THE HEADLINE
#   CATCH. The printed letter is kept in each row's comment, and the Part IV
#   mapping is 1:1 in printed order:
#     a Section 951A category income          -> category.section_951a        -> line 25
#     b Foreign branch category income        -> category.foreign_branch      -> line 26
#     c Passive category income               -> category.passive             -> line 27
#     d General category income               -> category.general             -> line 28
#     e Section 901(j) income                 -> category.section_901j        -> line 29
#     f Certain income re-sourced by treaty   -> category.resourced_by_treaty -> line 30
#     g Lump-sum distributions                -> category.lump_sum            -> line 31
#   `c` (passive) is the box the 1099-DIV box 7 filer checks.
#
# ---------------------------------------------------------------------------
# THE TWO ONE-OF-N CHECKBOX SETS — P-008's DANGEROUS topology, reproduced again
# ---------------------------------------------------------------------------
# Both option sets on this form are still the shape formpacks/CONVENTIONS.md
# calls the one that "gets no exemption": options on SEPARATE single-widget /Btn
# fields. Dumped on THIS blank, not inherited — each of the seven category boxes
# is its own terminal field with its own /T, its own /V and exactly ONE /AP /N
# state (the table above), and the Part II pair is
# ActiveHeaderElements[0].c1_3[0] /1 and c1_3[1] /2. The three new
# Line?-?_ReadOrder wrappers are NOT radio parents: they carry no /FT and no /V,
# so there is still no shared parent, no /Ff radio bit and no single /V, and
# NOTHING in the PDF makes the options exclusive. (That distinction matters: if
# a future revision re-authors the set as radio KIDS of one field, the `group`
# id starts meaning something different and CONVENTIONS.md's two topologies must
# be re-read. The shipped test asserts each of the nine is still a terminal
# field for exactly this reason.) Reproduced on this blank before the `group`
# ids were trusted: the sentinel sweep that turned on every /Btn produced, at
# 200 dpi, a page 1 with ALL SEVEN category boxes ticked under "Check only one
# box on each Form 1116" AND both "(j) Paid" and "(k) Accrued" ticked under
# "(you must check one)". With `group: category` / `group: credit_claimed` in
# place, fill_form's group guard rejects a second option before it opens the
# blank and verify's at-most-one checkbox audit FAILs an already-both-ticked
# PDF. `required: true` sits on the FIRST member of each group (f1040's
# filing_status/digital_assets spelling; a required flag on any member makes the
# whole group required). Both are genuinely unconditional here: the printed face
# says "Check only one box on each Form 1116" of the category set and "(you must
# check one)" of the Paid/Accrued set, and there is no Part of this form a filer
# can use while leaving either blank.
# The other two /Btn widgets are INDEPENDENT single boxes, not options, so they
# carry no group: line 1b (the $250,000 alternative-basis attestation) and the
# line 10 "don't need to attach Schedule B" box.
#
