#      using elsewhere. The pack keeps `i.col_a/b/c` (the key names never
#      contained the word).
#   2. PRINTED LINE 20's CROSS-REFERENCE MOVED, and this is the one that would
#      have shipped a wrong number if it had been copied:
#        2023: "Individuals: Enter the total of Form 1040, 1040-SR, or 1040-NR,
#               line 16, and Schedule 2 (Form 1040), line 2. Estates and trusts:
#               Enter the amount from Form 1041, Schedule G, line 1a; or the
#               total of Form 990-T, Part II, lines 2, 3, 4, and 6. Foreign
#               estates and trusts should enter the amount from Form 1040-NR,
#               line 16. See instructions"
#        2024: "Individuals: Enter the total of Form 1040, 1040-SR, or 1040-NR,
#               line 16, and Schedule 2 (Form 1040), line 1z. Estates and
#               trusts: See instructions"
#      The instructions moved with the form: "Individuals. Enter the total of
#      Form 1040, 1040-SR, or 1040-NR, line 16, and Schedule 2 (Form 1040),
#      Part I, line 1z, less any tax included on line 16 from Form 4972"
#      (Instructions for Form 1116 (2024), Line 20, p.25; the 2023 instructions
#      say "Part I, line 2" in the same sentence on their own p.25).
#      WHY, read off the Schedule 2 blanks themselves rather than recalled:
#      Schedule 2 (2023) Part I is  1 = "Alternative minimum tax. Attach Form
#      6251", 2 = "Excess advance premium tax credit repayment. Attach Form
#      8962", 3 = "Add lines 1 and 2"; Schedule 2 (2024) Part I is
#      1 = "Additions to tax:" with sub-lines 1a..1y (1a is the excess APTC
#      repayment, 1b/1c the clean-vehicle credit repayments, 1d the net-EPE
#      recapture, 1e/1f the Form 4255 excessive payments, 1y a write-in),
#      1z = "Add lines 1a through 1y", 2 = "Alternative minimum tax. Attach Form
#      6251". So the reference had to move twice over: the single item Form 1116
#      wanted is now one of a family whose SUBTOTAL is 1z, and the old label
#      "line 2" now names the ALTERNATIVE MINIMUM TAX — which is precisely what
#      line 20 must not include: "Enter on line 20 your total U.S. income tax
#      against which the credit is allowed (regular tax liability, as defined in
#      section 26(b)(1)). Don't include any taxes listed in section 26(b)(2)."
#      (Instructions for Form 1116 (2024), Line 20, p.25.) A pack that had kept
#      the 2023 wording in its line-20 comment would have been telling callers
#      to add the AMT into the credit's own ceiling. (Verified against this
#      repo: formpacks/federal/2024/sched_2 ships `1z` "Add lines 1a through 1y"
#      and `2` "Alternative minimum tax", and formpacks/federal/2023/sched_2
#      ships `1` AMT and `2` excess APTC — both packs agree with their blanks.)
#      There is still NO cross_form rule for line 20; see the relations note.
#   3. PRINTED LINE 10 was re-laid-out: the section 951A carve-out moved out of
#      the row and into a parenthetical BELOW it — 2024 reads "Enter the sum of
#      any carryover of foreign taxes (from Schedule B, line 3, column (xiv))
#      plus any carrybacks to the current tax year. If you enter an amount on
#      line 10 and you don't need to attach Schedule B, check here (see
#      instructions)" then, on its own rules, "(If your income was section 951A
#      category income (box a above Part I), leave line 10 blank.)". Same
#      obligations, same single checkbox, no new widget. Line 34 likewise reads
#      "Reduction of credit for international boycott operations. See
#      instructions for line 12" in both years.
#   4. THE NON-CHANGE THAT WAS CHECKED ANYWAY — printed line 35's DESTINATION.
#      A Schedule 3 destination line is exactly what moves between years (the
#      TY2025 Form 1040 renumbering is the live example elsewhere in this repo),
#      so it was READ off the 2024 printed face at 200 dpi rather than carried:
#      "Subtract line 34 from line 33. This is your foreign tax credit. Enter
#      here and on Schedule 3 (Form 1040), line 1; Form 1041, Schedule G,
#      line 2a; or Form 990-T, Part III, line 1a." Byte-identical to 2023, and
#      formpacks/federal/2024/sched_3 line 1 prints "Foreign tax credit (Form
#      1116)", so `35 == sched_3.1` is exact for THIS year too.
# Everything else on both pages is word-for-word identical, including the
# masthead, every Part heading, all of Part I, the whole Part II column head
# block, and printed lines 9 and 11 through 33. The masthead paragraph re-BROKE
# ("...Check only one box on each Form / 1116." -> "...Check only one box on /
# each Form 1116.") with identical wording; that is a wrap, not a text change,
# and it is one cause of the page-1 /Rect drift above. The 2024 instructions
# have NO "What's New" section at all (the 2023 ones did: "New checkbox on
# line 10"), which is consistent with a year whose only substantive form change
# is a cross-reference and a word.
#
# ---------------------------------------------------------------------------
# SENTINEL SWEEP + VISION AUDIT (200 dpi, both pages, own eyes)
# ---------------------------------------------------------------------------
# Every widget was written with its OWN short field name ("f1_04", "f2_17", ...;
# no name needed truncating — the form's single /MaxLen is 11 and the longest
# short name is 5 characters), every /Btn
# set to its only on-state, NeedAppearances set, both pages rendered at 200 dpi
# and READ. This sweep is independent of the pack: it proves the widget ->
# printed-line binding without assuming the 2023 map. With a three-column grid a
# column shift leaves every field name intact, so the FIRST and LAST column of
# several rows were checked explicitly rather than spot-checked:
#   Part I, first column (A) vs last column (C): line i f1_04 / f1_06; line 1a
#   f1_10 / f1_12; line 3a f1_17 / f1_19; line 3g f1_35 / f1_37; line 5 f1_44 /
#   f1_46; line 6 f1_47 / f1_49 — every one inside its own printed column rule
#   under the printed "A" and "C" heads, with f1_13 / f1_50 / f1_51 alone in the
#   Total column beside the printed "1a" / "6" / "7" tabs.
#   Part II, first column (l) vs last column (u), all three rows: f1_52 / f1_61,
#   f1_62 / f1_71, f1_72 / f1_81 — and the eight middle columns confirmed cell by
#   cell against the printed heads, including the (p)|(q) boundary where the
#   "In foreign currency" half hands over to "In U.S. dollars" (f1_56 under
#   "(p) Other foreign taxes paid or accrued", f1_57 under "(q) Dividends").
#   PAGE 2, where the drift is up to ten rows, every one of the 27 text widgets
#   was read against its printed line label: f2_01=9, f2_02=10, f2_03=11,
#   f2_04=12 (sitting INSIDE the printed "( )"), f2_05=13, f2_06=14 (outer
#   column), f2_07=15, f2_08=16, f2_09=17, f2_10=18, f2_11=19, f2_12=20,
#   f2_13=21, f2_14=22, f2_15=23, f2_16=24, f2_17=25 ... f2_23=31, f2_24=32,
#   f2_25=33, f2_26=34, f2_27=35. The first and last of the Part IV block
#   (f2_17 on line 25, f2_23 on line 31) were checked against the printed
#   category names, since Part IV is the block a wrong category box mis-routes
#   into.
# WHAT THE AUDIT CAUGHT — three things the name diff could not have told us,
# every one of them changing what this pack says:
#   1. THE CATEGORY BOX RE-ASSIGNMENT (see THE HEADLINE CATCH). Caught by the
#      two discriminating renders, not by the sweep and not by the name diff.
#   2. The line-1b box's on-state is "/1" in 2024, not 2023's "/Yes". Porting
#      "/Yes" writes nothing and warns about nothing.
#   3. The Part II Paid/Accrued pair exports "/1"/"/2" in 2024, not
#      "/Paid"/"/Accrued" — and the page-2 line-10 box STILL exports "/Accrued"
#      even though it moved field. Two boxes whose on-states used to be the
#      readable words now aren't, and one whose misleading word survived.
# Re-confirmed from 2023 and still true here: the tall line-1a row's country
# cells are the BOTTOM strip (f1_10..f1_12), not the grey upper block, and
# f1_07..f1_09 sit in the LABEL column on the three printed dashed rules; and
# line 1b is ONE checkbox in the label column, not three, one per country, which
# is what the row's three grey A/B/C cells invite.
# Nothing was clipped, nothing landed off-page, and no widget sits in a greyed
# cell.
#
# ---------------------------------------------------------------------------
# READONLY RE-MEASUREMENT (pitfall P-007) — on the 2024 blank, not inherited
# ---------------------------------------------------------------------------
# ZERO of the 120 widgets carry the AcroForm ReadOnly bit, and the measurement
# was REPEATED on this blank: /Ff read at FIELD level walking /Parent, plus a
# second pass through the harness's OWN reader
# (test_formpacks_federal._read_only_widget_names).
#   * the /Ff histogram over all 120 widgets is exactly {8388608: 108,
#     absent: 12} — identical to 2023;
#   * 8388608 = DoNotScroll only, on 108 of the 109 text widgets;
#   * the other 12 carry NO /Ff at all: Page1[0].f1_02[0] (the identifying
#     number, also the only /MaxLen on the form) and the eleven /Btn widgets;
#   * NOT ONE widget has bit 1 set, and no widget sets the comb bit;
#   * mapped-intersect-ReadOnly = 0 over 120 mapped fields.
# EVERY DIFFERENCE from 2023 was adjudicated rather than counted: the ReadOnly
# SET is empty in both years, so there is no per-widget difference to adjudicate
# at all, and the 99 renamed widgets cannot smuggle one in because the histogram
# and the set are both computed from THIS blank. The port therefore introduces
# no P-007 difference. The integrator needs NO pin row in
# test_readonly_widget_mapping.py: absent from RESERVED_LINE_KEEPS,
# RESERVED_LINES_UNMAPPED and STATE_COMPUTED_READONLY, this pack is pinned at
# zero by default, and the shipped network test
# test_f1116_blank_has_no_readonly_widgets_and_the_states_are_real asserts that
# equality in both directions for every f1116 year.
# The other three P-007 classes were worked against the 2024 printed face too,
# so the zero is an adjudication and not a flag reading:
#   * class 1 (the widget already HOLDS an IRS-printed constant, sched_se's wage
#     base): none. The only dollar figure printed anywhere on this form is line
#     1b's "$250,000 or more", printed in the ROW TEXT outside any widget, which
#     is the opposite of the sched_se shape.
#   * class 2 (the printed text makes a correct entry IMPOSSIBLE, sched_d's
#     shaded (g) cells): worked, and the answer is that the IRS shipped NO
#     WIDGET in any of the grey regions. Enumerated from the 2024 render plus
#     the /Rect dump: the Total column is grey beside line i, line 1b and lines
#     2 through 5; the A/B/C cells are grey for the whole upper part of the tall
#     line-1a row, for all of line 1b, and for the "Deductions and losses", "3"
#     and "4" caption rows; and page 2 carries a grey gutter beside lines 9-13
#     and 25-31 (the rows whose amount box is in the INNER column). Not one of
#     those regions holds a widget — 120 widgets, 120 keys, no leftovers — so
#     there is nothing to unmap and fill_form already raises its unknown-line-key
#     ValueError for e.g. "2.total" or "1b.col_a".
#   * class 3 ("Reserved for future use"): the string does not appear anywhere on
#     either page of the 2024 blank. The printed ladder is gap-free.
#   * class 4 (form-owned / JS-propagated value): not applicable — no /AA, no
#     /CO, no XFA calculation the renderer would run, no page-2 identity header
#     to mirror, and no DOR-style running total the form owns.
# Two widget-level judgments re-measured because a port could get them wrong:
#   * line 1a's f1_07/f1_08/f1_09 sit in the LABEL column on the three printed
#     dashed rules, not in any country column (their x-lefts are 115.2 / 64.8 /
#     64.8, far left of column A's 266.4). They are the description of the
#     income type, so they are keyed 1a.income_type_1..3 and typed text.
#   * line 12's widget f2_04 is 78.4 pt wide where every sibling money box in
#     page 2's inner column is 85.65 pt, because the form prints "(" and ")"
#     around it (2023: 92.8 against 100.05 — both columns narrowed, the
#     RELATIVE narrowing survived). That geometry is the sign convention (see
#     relations).
#
# ---------------------------------------------------------------------------
# TYPES — the two places this form is NOT dollars (unchanged, re-verified)
# ---------------------------------------------------------------------------
# The masthead prints "Report all amounts in U.S. dollars except where specified
# in Part II below", and both exceptions are honoured with `type: text` rather
# than money, so verify's dollar-denominated relation math and recompute pass
# never see a non-dollar figure (f8962's precedent: its tax-family-size count
# and its 0.0850 applicable figure are text for the same reason).
#   * Part II columns (m)(n)(o)(p) are headed "In foreign currency". Column (l)
#     is headed "Date paid or accrued" but is not a date field either — the 2024
#     instructions put words in it: "Enter '909 taxes' in column (l) instead of
#     the date paid or accrued" and, for the case this pack exists for, "If
#     foreign tax paid on passive income is reported to you in U.S. dollars on a
#     Form 1099-DIV, 1099-INT, or similar statement, you don't have to convert
#     the amount shown into foreign currency ... Enter '1099 taxes' in Part II,
#     column (l), and complete columns (q) through (u) for each foreign country
#     indicated in Part I" (Instructions for Form 1116 (2024), Part II, p.19 —
#     both quoted verbatim from the 2024 document, not carried from 2023).
#     Columns (q)..(u) ARE dollars and are typed money.
#   * Lines 3f and 19 are RATIOS. "Divide line 3d by line 3e and round off the
#     result to at least four decimal places (for example, if your result is
#     0.8756782, round off to 0.8757, not to 0.876 or 0.88). Enter the result,
#     but don't enter more than '1.'" (Instructions for Form 1116 (2024), Line
#     3f, p.18.) Line 19 is printed "Divide line 17 by line 18. If line 17 is
#     more than line 18, enter '1'". verify compares relation sides in WHOLE
#     DOLLARS after IRS rounding, so a 0.8757 line would round to 0 and any
#     relation touching it would be nonsense — which is also why lines 3g, 19
#     and 21 get no relation.
#
# ---------------------------------------------------------------------------
# THE §904(j) ELECTION — this form is often NOT the answer
# ---------------------------------------------------------------------------
# IRC 904(j) lets an individual take the credit with NO Form 1116 at all, and for
# the 1099-DIV box 7 population that is usually the right branch. The engine
# answers it deterministically: calc op `foreign_tax_credit_election`
# (packages/core/src/taxfill_core/calc.py). Run it BEFORE authoring this form.
# Conditions, all required — 904(j)(2): every dollar of foreign-source gross
# income is qualified passive income shown on a payee statement; creditable
# foreign taxes not over $300 ($600 on a joint return); the individual elects it;
# and 904(j)(3)(D): "This subsection shall not apply to any estate or trust."
# The 2024 instructions restate all four in "Election To Claim the Foreign Tax
# Credit Without Filing Form 1116" (p.1), unchanged from 2023, and give the
# mechanics: "To make the election, just enter on the foreign tax credit line of
# your tax return (for example, Schedule 3 (Form 1040), Part I, line 1) the
# smaller of (a) your total foreign tax, or (b) your regular tax."
# What it COSTS, so it is never presented as free — 904(j)(1)(B) and (C), and the
# instructions' own bullet "You can't carry over to or from any other year any
# foreign taxes paid or accrued in a tax year to which the election applies (but
# carryovers to and from other years are unaffected)" (pp.1-2): Form 1116's own
# line 10 and the 1-back/10-forward carryover it feeds are
# exactly what the election gives up.
#
# ---------------------------------------------------------------------------
# WHAT THIS PACK DELIBERATELY DOES NOT DO
# ---------------------------------------------------------------------------
# * Schedule B (Form 1116) (the carryover reconciliation feeding line 10) and
#   Schedule C (Form 1116) (foreign tax redeterminations) are SEPARATE forms with
#   their own OMB numbers; neither is mapped here.
# * Line 20's printed formula spans two other forms ("the total of Form 1040,
#   1040-SR, or 1040-NR, line 16, and Schedule 2 (Form 1040), line 1z") and the
#   instructions subtract "any tax included on line 16 from Form 4972".
#   cross_form has no arithmetic — each side resolves as ONE ref — so a rule like
#   "20 == f1040.16 + sched_2.1z" would be SILENTLY skipped, not failed. Omitted,
#   and re-pointed in the comment for 2024 rather than left saying "line 2".
# * The Worksheet for Line 18, the Worksheets A/B for foreign qualified dividends
#   and capital gains, the Worksheet for Lump-Sum Distributions and the Worksheet
#   for Home Mortgage Interest are instruction-only math and belong to calc, not
#   to `relations` (formpacks/CONVENTIONS.md).
#
# WHAT 2025 THEN DID, so the next porter does not assume 2024 is the new stable
# shape: formpacks/federal/2025/f1116/pack.yaml (authored in the same run, from
# its own blank) re-nests the Part II Paid/Accrued wrapper one level deeper
# (Page1[0].ActiveHeaderElements[0] -> Page1[0].Part2[0].ActiveHeaderElements[0])
# and REPLACES this year's three 12-pt line-1a description boxes with ONE 36-pt
# Multiline box, so 2025 keys `1a.income_type` (singular) where 2024 keys
# `1a.income_type_1/_2/_3`. Measured on the 2024 blank and stated here because a
# porter reading only the 2025 pack could "fix" this year's three keys into one:
# f1_07 [115.2,504,259.2,516], f1_08 [64.8,492,259.2,504] and f1_09
# [64.8,480,259.2,492] are THREE distinct 12-pt widgets in 2024, all /Ff
# 8388608 with the Multiline bit CLEAR, one per printed dashed rule, and all
# three were read in the sweep render. Measured across all three blanks with the
# same field-level dump: 2023 -> 2024 is 99 names removed and 99 added at a
# constant 120 widgets; 2023 -> 2025 is 99 removed and 97 added at 118 widgets;
# and 2024 -> 2025 is only 4 removed and 2 added — so 2024 is where the
# re-authoring happened and 2025 is a small delta on top of it, NOT the other
# way round. Three years, three different AcroForm hierarchies for one printed
# form: do NOT port this map by name alone either (the PORTABLE-is-not-done
# rule, docs/CONTRIBUTING-PACKS.md).
#
# INTEGRATOR NOTE (what landed outside this file): the f1116 pin tables in
# packages/core/tests/test_formpacks_federal.py were already per-YEAR dicts when
# this pack arrived (the 2025 lane converted them, following
# SCHED_D_SHADED_G_WIDGETS' precedent in the same module), and a year with no row
# FAILS rather than skipping — so this port added its 2024 rows to all four:
# F1116_CATEGORY_BOXES_BY_YEAR, _F1116_CREDIT_CLAIMED_BY_YEAR,
# _F1116_STANDALONE_BOXES_BY_YEAR and _F1116_INCOME_TYPE_KEYS_BY_YEAR. The 2023
# and 2025 rows were not touched. Three prose corrections went with them: those
# tables' comments attributed the AcroForm re-authoring, the c1_1[0] box-a ->
# box-g move and the 1b "/Yes" -> "/1" state change to the 2025 REVISION, and
# all three landed in 2024 (measured on both blanks here).
form: "1116"
jurisdiction: federal
tax_year: 2024
source_url: "https://www.irs.gov/pub/irs-prior/f1116--2024.pdf"
pdf_sha256: "3ce3fac93870bc965c99add80d5ee651fe596ffd187c0fb68c6213984bf2c065"
acroform_root: "topmostSubform[0]"

fields:
  # ---- header ---------------------------------------------------------------
  - { line: "name", field: "Page1[0].f1_01[0]", type: text }                       # "Name"
  # "Identifying number as shown on page 1 of your tax return" — plain box, NOT a
  # comb; the ONLY widget on the form with a /MaxLen (11, which fits a dashed
  # SSN "000-00-0000"). No ssn_digits_only: the form is "(Individual, Estate, or
  # Trust)", so this box legitimately carries an estate/trust EIN too.
  - { line: "identifying_number", field: "Page1[0].f1_02[0]", type: text, maxlen: 11 }

  # ---- category of income (one-of-7; see the banner) -------------------------
  # "Use a separate Form 1116 for each category of income listed below. See
  # Categories of Income in the instructions. Check only one box on each Form
  # 1116." Printed letter in each comment; on_states read off /AP /N.
  # THE 2024 RE-AUTHORING: boxes a/b, c/d and e/f now live in three per-COLUMN
  # subforms (LineA-B_ReadOrder, LineC-D_ReadOrder, LineE-F_ReadOrder) and only
  # box g kept the bare 2023 name Page1[0].c1_1[0] — where 2023 put box A. Every
  # one of the seven was re-derived from two discriminating 200-dpi renders, not
  # from the name. See the banner: this is the port's headline catch.
  - { line: "category.section_951a", field: "Page1[0].LineA-B_ReadOrder[0].c1_1[0]", type: checkbox, on_state: "/1", group: category, required: true }  # a Section 951A category income
  - { line: "category.foreign_branch", field: "Page1[0].LineA-B_ReadOrder[0].c1_1[1]", type: checkbox, on_state: "/2", group: category }                # b Foreign branch category income
  - { line: "category.passive", field: "Page1[0].LineC-D_ReadOrder[0].c1_1[0]", type: checkbox, on_state: "/3", group: category }                       # c Passive category income  <- the 1099-DIV box 7 box
  - { line: "category.general", field: "Page1[0].LineC-D_ReadOrder[0].c1_1[1]", type: checkbox, on_state: "/4", group: category }                       # d General category income
  - { line: "category.section_901j", field: "Page1[0].LineE-F_ReadOrder[0].c1_1[0]", type: checkbox, on_state: "/5", group: category }                  # e Section 901(j) income
  - { line: "category.resourced_by_treaty", field: "Page1[0].LineE-F_ReadOrder[0].c1_1[1]", type: checkbox, on_state: "/6", group: category }           # f Certain income re-sourced by treaty
  - { line: "category.lump_sum", field: "Page1[0].c1_1[0]", type: checkbox, on_state: "/7", group: category }                      # g Lump-sum distributions
  - { line: "h", field: "Page1[0].f1_03[0]", type: text }                          # "h Resident of (name of country)"

  # ---- Part I — Taxable Income or Loss From Sources Outside the United States -
  # Three country columns A/B/C (col_a/col_b/col_c) plus the printed
  # "Total (Add cols. A, B, and C.)" column (total), which has a widget on only
  # three rows: 1a, 6 and 7.
  # "i Enter the name of the foreign country or U.S. territory" — no Total cell.
  # (2023 printed "U.S. possession"; the 2024 revision says "territory" here, in
  # the Part I column head and in the Note above Part I. Terminology only — see
  # the banner's PRINTED FACE section.)
  - { line: "i.col_a", field: "Page1[0].Table_Part1_LinesI-1a[0].Rowi[0].f1_04[0]", type: text }
  - { line: "i.col_b", field: "Page1[0].Table_Part1_LinesI-1a[0].Rowi[0].f1_05[0]", type: text }
  - { line: "i.col_c", field: "Page1[0].Table_Part1_LinesI-1a[0].Rowi[0].f1_06[0]", type: text }
  # "1a Gross income from sources within country shown above and of the type
  # checked above (see instructions):" — three dashed rules in the LABEL column
  # carry the description of the income type: "Identify the type of income on the
  # dotted line next to line 1a" (Instructions for Form 1116 (2024), Part I,
  # p.11), worked example "check box c (passive category income), enter the
  # dividends on line 1a, and enter 'Dividends' on the dotted line" (same, p.17).
  - { line: "1a.income_type_1", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].Line1a_Text[0].f1_07[0]", type: text }
  - { line: "1a.income_type_2", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].Line1a_Text[0].f1_08[0]", type: text }
  - { line: "1a.income_type_3", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].Line1a_Text[0].f1_09[0]", type: text }
  - { line: "1a.col_a", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].ColA[0].f1_10[0]", type: money }
  - { line: "1a.col_b", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].ColB[0].f1_11[0]", type: money }
  - { line: "1a.col_c", field: "Page1[0].Table_Part1_LinesI-1a[0].Line1a[0].ColC[0].f1_12[0]", type: money }
  - { line: "1a.total", field: "Page1[0].f1_13[0]", type: money }   # the box printed "1a"
  # "b Check if line 1a is compensation for personal services as an employee,
  # your total compensation from all sources is $250,000 or more, and you used an
  # alternative basis to determine its source. See instructions" — ONE box, in
  # the label column. Its /AP /N state CHANGED in 2024: "/Yes" -> "/1" (dumped,
  # not guessed; porting "/Yes" would have written nothing and warned about
  # nothing). All three conditions must hold and a statement must be attached
  # (Instructions for Form 1116 (2024), Line 1b, p.17).
  - { line: "1b", field: "Page1[0].Line1b_ReadOrder[0].c1_2[0]", type: checkbox, on_state: "/1" }
  # "Deductions and losses (Caution: See instructions.):"
  - { line: "2.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line2[0].f1_14[0]", type: money }   # 2 Expenses definitely related to the income on line 1a (attach statement)
  - { line: "2.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line2[0].f1_15[0]", type: money }
  - { line: "2.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line2[0].f1_16[0]", type: money }
  # "3 Pro rata share of other deductions not definitely related:"
  - { line: "3a.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3a[0].f1_17[0]", type: money }  # a Certain itemized deductions or standard deduction
  - { line: "3a.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3a[0].f1_18[0]", type: money }
  - { line: "3a.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3a[0].f1_19[0]", type: money }
  - { line: "3b.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3b[0].f1_20[0]", type: money }  # b Other deductions (attach statement)
  - { line: "3b.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3b[0].f1_21[0]", type: money }
  - { line: "3b.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3b[0].f1_22[0]", type: money }
  - { line: "3c.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3c[0].f1_23[0]", type: money }  # c Add lines 3a and 3b
  - { line: "3c.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3c[0].f1_24[0]", type: money }
  - { line: "3c.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3c[0].f1_25[0]", type: money }
  - { line: "3d.col_a", field: "Page1[0].Table_Part1_Lines2-6[0].Line3d[0].f1_26[0]", type: money }  # d Gross foreign source income
  - { line: "3d.col_b", field: "Page1[0].Table_Part1_Lines2-6[0].Line3d[0].f1_27[0]", type: money }
  - { line: "3d.col_c", field: "Page1[0].Table_Part1_Lines2-6[0].Line3d[0].f1_28[0]", type: money }
