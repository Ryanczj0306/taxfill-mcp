# ---------------------------------------------------------------------------
# EXACTLY 2 of the 244 widgets carry the AcroForm ReadOnly bit, and neither is
# mapped, so mapped n ReadOnly = 0 over 242 mapped fields. The measurement was
# REPEATED on this blank rather than inherited. Flags read at FIELD level,
# walking /Parent (the shape P-007 requires):
#   * the /Ff histogram over all 244 widgets is exactly
#     {8388608: 206, 8392704: 28, absent: 8, 8388609: 2} — identical to 2023,
#     bucket for bucket AND name for name;
#   * 8388608 = DoNotScroll, the plain text-cell value;
#   * 8392704 = DoNotScroll|Multiline (bit 13), on exactly the 28 column-(a)
#     description cells (14 per page) — the form gives the description box two
#     printed text lines' worth of height (/Rect 24 pt tall vs 12 pt for every
#     other cell in the same row);
#   * absent (no /Ff at all) on 8 widgets: the two SSN boxes f1_2/f2_2 and the
#     six /Btn boxes;
#   * 8388609 = DoNotScroll|ReadOnly on exactly TWO: Page1[0].f1_117[0] and
#     Page2[0].f2_117[0]. Run through the harness's OWN reader
#     (test_formpacks_federal._read_only_widget_names, which walks /Parent),
#     the ReadOnly set on the 2024 blank is exactly those two names and the
#     mapped-intersect-ReadOnly set is empty — executed against both blanks
#     side by side, so the port introduced no P-007 difference and there is no
#     DIFFERENCE to adjudicate. What follows re-adjudicates the two widgets
#     themselves against the 2024 printed face, because "unchanged flags" is
#     not the same claim as "still the right verdict".
# Both are the Totals-row column-(f) cell, and both are P-007 CLASS 2 — the
# printed text makes a correct entry IMPOSSIBLE, so the line key must not
# exist and fill_form has to raise:
#   * printed line 2's own text enumerates the columns it totals and column
#     (f) is NOT among them: "2 Totals. Add the amounts in columns (d), (e),
#     (g), and (h) (subtract negative amounts)." — read on the 2024 render, on
#     both pages. Column (f) holds letter CODES ("BOQ"), which cannot be
#     added, so there is no correct entry to make.
#   * the 2024 blank agrees in pixels: at 200 dpi both cells render SOLID GREY
#     while the (d)/(e)/(g)/(h) cells of the very same Totals row, and the (f)
#     cells of all 28 transaction rows, are white.
#   * This is the sched_d 1a.g / 8a.g shape exactly: the IRS locked precisely
#     the cells its own printed text makes impossible, and it is the only
#     place it set the flag on this form. `short_term.2.f` and `long_term.2.f`
#     therefore DO NOT EXIST as keys; fill_form({"short_term.2.f": "B"})
#     raises "unknown line key(s) ['short_term.2.f'] for form 8949 (2024)"
#     (reproduced against this pack, both Parts, see the report).
# The other three classes were each re-checked against the 2024 printed face,
# so the zero is an adjudication and not a flag reading:
#   * class 1 (the widget already HOLDS an IRS-printed constant, sched_se's
#     wage base): none. The form prints no dollar figures, rates or dates at
#     all — its only pre-printed tokens are the column captions and the
#     "(Example: 100 sh. XYZ Co.)" hint, and every one sits in printed TABLE
#     TEXT, outside any widget.
#   * class 3 ("Reserved for future use"): the string does not appear anywhere
#     on either page (checked against `pdftotext -layout` of the pinned 2024
#     blank — zero case-insensitive hits for "reserved" — not from memory).
#     Printed lines are just 1 and 2 on each page: a gap-free two-line ladder.
#   * class 4 (form-owned / JS-propagated value): structurally impossible here
#     — the document JavaScript is three Adobe version-check scripts, no widget
#     has an /AA, and the AcroForm has no /CO (see PROVENANCE, re-dumped for
#     2024). That verdict cuts BOTH ways on this form: it is also why the
#     page-2 identity mirrors below must be mapped, because nothing propagates
#     them.
# The integrator needs NO pin row in test_readonly_widget_mapping.py: absent
# from RESERVED_LINE_KEEPS, RESERVED_LINES_UNMAPPED and
# STATE_COMPUTED_READONLY, this pack is pinned at zero mapped-ReadOnly by
# default and the network layer asserts that equality in both directions.
#
# ---------------------------------------------------------------------------
# CHECKBOX / GROUP ADJUDICATION (pitfalls P-003, P-008)
# ---------------------------------------------------------------------------
# Six /Btn widgets, two sets of three, one set per Part:
#   Page1[0].c1_1[0]/[1]/[2] -> printed boxes (A) (B) (C), on-states /1 /2 /3
#   Page2[0].c2_1[0]/[1]/[2] -> printed boxes (D) (E) (F), on-states /1 /2 /3
# Each set is ONE question printed "You must check Box A, B, or C below.
# Check only one box." (and D/E/F on page 2).
#
# TOPOLOGY, dumped from the 2024 blank and not guessed: this is the P-008
# SEPARATE-WIDGET shape, the one that gets no exemption. Each of the six
# widgets is its own TERMINAL field — it carries its own /T ("c1_1[0]",
# "c1_1[1]", "c1_1[2]"), has NO /Kids, has no /Ff at all (so no radio bit), and
# its only ancestor with a /T is the page subform Page1[0]/Page2[0], which has
# NO /FT. So the three boxes of a set are three independent fields and NOT the
# kids of one radio field, and nothing in the PDF makes them exclusive. Proved
# on the 2024 render, not argued: the sentinel sweep turned every /Btn on and
# printed a page 1 with (A), (B) AND (C) all ticked, and a page 2 with (D), (E)
# and (F) all ticked — three mutually exclusive answers on one form, which is
# what ships if the `group` id is missing.
# So all three members of each set carry a `group`: `short_term.box` and
# `long_term.box`. GROUP SPELLING: the group id is the LINE STEM, sched_d's
# convention (`qof`, `line17`) applied to a lettered rather than numbered
# question; a numeric `line<N>` id is unavailable here because the question
# has no printed line number of its own, and `short_term.box` cannot collide
# with `long_term.box` the way a shared `box` would. OPTION KEY SPELLING:
# `short_term.box.a` rather than `short_term.a` — the extra `box` segment
# keeps the printed BOX letters (a,b,c / d,e,f) from reading like the printed
# COLUMN letters (a..h) that fill the rest of this pack; `long_term.box.d` and
# `long_term.2.d` would otherwise be one segment apart and mean entirely
# different things.
# BOTH halves of the guard were RE-REPRODUCED against THIS pack and its pinned
# 2024 blank, not carried over:
#   * fill_form(pack, {"short_term.box.a": True, "short_term.box.b": True})
#     raises ValueError "lines 'short_term.box.a' and 'short_term.box.b' all
#     turn on members of checkbox group 'short_term.box' — these are the
#     mutually exclusive options of ONE question and exactly one may be
#     selected", and so does the long_term.box.d/.e pair, while a single
#     answer still writes its one field ({c1_1[0]: '/1'}, no warnings);
#   * a PDF whose c1_1[0]+c1_1[1] and c2_1[0]+c2_1[1] widgets were patched on
#     DIRECTLY (the P-008 reproduction shape, bypassing the filler) makes
#     verify's at-most-one checkbox audit report two FAILs: "checkbox group
#     'short_term.box' has 2 boxes checked (short_term.box.a,
#     short_term.box.b) — exactly one is allowed" and the long_term
#     equivalent. That check fires for every group whether or not it is
#     `required`, which is what keeps the read side covered despite the
#     `required: false` adjudication below.
#
# NEITHER `group` IS `required: true`, and this one is settled by the
# instructions rather than by the emphatic printed "You must": a correct Form
# 8949 may consist of ONE Part. "You don't need to complete and file an entire
# copy of Form 8949 (Parts I and II) if you can check a single box to describe
# all your transactions. In that case, complete and file either Part I or II
# and check the box that describes the transactions." (Instructions for Form
# 8949 (2024), p.4 — re-read in the 2024 edition.) A long-term-only filer
# therefore files page 2 with a blank page 1 — `required: true` on
# `short_term.box` would FAIL verification on that correct return, and vice
# versa. What the printed "must" really states is a CONDITIONAL requirement —
# required if that Part carries any transaction — and the pack schema has no
# way to express a conditional `required`, so the honest choice is the sched_d
# line-17/20/22 one: leave it off rather than ship a check that false-FAILs a
# legal filing (reported as an open issue, since the unconditional half is
# genuinely worth catching).
#
# THE GATE BLIND SPOT, RE-MEASURED ON THIS PACK — neither shipped P-008 gate
# can see these two sets, so their `group` ids are house discipline rather
# than a gate result. `test_every_yes_no_pair_shares_one_group_id` keys off the
# LINE SHAPE `<stem>.yes` + `<stem>.no` and these options are lettered, not
# yes/no; `test_pack_radio_options_share_one_group_and_distinct_states` only
# fires when two checkbox lines SHARE one AcroForm field, and these six lines
# bind six different fields. That is the THIRD topology blind spot recorded in
# docs/ROADMAP.md Phase E — this pack adds two more sets to that sweep's
# population, and unlike most of them these two are genuinely EXCLUSIVE
# ("Check only one box"), so they belong on the grouped side of the
# adjudication table that item calls for. Verified by execution against this
# 2024 pack rather than claimed: with the six `group:` lines deleted, both
# gates still pass (4 selected 8949 cases pass, and all 324 group/radio cases
# repo-wide pass).
#
# ---------------------------------------------------------------------------
# IDENTITY PAGE MIRRORS — 2, and they are load-bearing
# ---------------------------------------------------------------------------
# Page 2 prints its own header pair, "Name(s) shown on return. Name and SSN or
# taxpayer identification no. not required if shown on other side" and "Social
# security number or taxpayer identification number" (read on the 2024 render),
# bound to DIFFERENT AcroForm fields from page 1 (Page2[0].f2_1[0] / f2_2[0] vs
# Page1[0].f1_1[0] / f1_2[0]). They are mapped as `page2_name` and
# `page2_identifying_number`, the house `page<N>_<what>` shape
# (formpacks/CONVENTIONS.md, "Identity page mirrors"; sched_e uses the other
# house shape, `identifying_number_page2`).
# Why they are mapped even though the caption says "not required": the escape
# clause is "IF SHOWN ON OTHER SIDE", and the instructions quoted above make a
# Part-II-only filing correct — that filing has no other side, so its page-2
# header is the only place the filer's name and SSN appear. Nothing propagates
# the value either (no JS, no /AA, no /CO on the 2024 blank), so an unmapped
# mirror ships a blank header on a filed return, which is the ri1040/it1040_oh
# defect exactly. The one thing the schema cannot express is that the mirror's
# VALUE equals its source's: a caller that fills `page2_name` differently from
# `name` files an internally inconsistent return and no gate catches it
# (CONVENTIONS says so; the audit render above shows what it looks like).
# INTEGRATOR: test_pack_invariants.IDENTITY_MIRROR_COUNTS needs the row
# "federal/2024/f8949/pack.yaml": 2 — added here beside the 2023 row it
# duplicates, because an absent row pins ZERO and the gate then reads these
# two mirrors as a defect.
#
# ---------------------------------------------------------------------------
# YEAR TOKENS IN LINE KEYS (formpacks/CONVENTIONS.md) — none, by rule 3
# ---------------------------------------------------------------------------
# NO line key in this pack embeds a year, so the year-offset gate has nothing
# to pin and this port could not go stale the sched_oi way. Re-checked on the
# 2024 face rather than assumed from 2023: "2024" appears only in the masthead
# year box and the three "Form 8949 (2024)" header/footers — never inside
# printed LINE text, and never as a box LABEL, so nothing here is the
# f8843-line-4a shape where a year picks WHICH BOX. The `row01`..`row14` tokens
# are row indices, not years, and do not match the gate's `(?:19|20)\d{2}`
# pattern. Mechanically confirmed: the ported body is character-identical to
# the 2023 body except `tax_year`, `source_url` and `pdf_sha256` — the only
# three lines in the whole file that carried a year at all.
#
# ---------------------------------------------------------------------------
# RELATIONS — deliberately EMPTY, and the reason is the relation GRAMMAR
# ---------------------------------------------------------------------------
# Form 8949 prints exactly two pieces of on-face arithmetic, and NEITHER can be
# expressed in this repo's relation grammar, because every money line on this
# form is a DOTTED column key:
#   * the per-row column identity, printed in the column (h) head: "Gain or
#     (loss). Subtract column (e) from column (d) and combine the result with
#     column (g)." The 2024 instructions restate it with worked examples
#     ("Column (d) is $6,000, column (e) is $2,000, and column (g) is
#     ($1,000). Enter $3,000 in column (h)." — Instructions for Form 8949
#     (2024), Column (h)—Gain (or Loss), Example 3, p.10). As a rule that is
#     `short_term.1.row01.h == short_term.1.row01.d - short_term.1.row01.e
#     + short_term.1.row01.g`, x28 rows.
#   * the Totals row: "2 Totals. Add the amounts in columns (d), (e), (g), and
#     (h) (subtract negative amounts)", i.e. `short_term.2.d == ` the sum of
#     the 14 `short_term.1.rowNN.d` cells, x8 (4 columns x 2 Parts).
# verify's tokenizer (_TOKEN_RE in packages/core/src/taxfill_core/verify.py)
# admits whitespace, floats, `\d+[a-z]?` line ids, `[A-Za-z_][A-Za-z0-9_]*`
# names, and the operators `== .. + - * / ( ) ,` — a single `.` is not an
# operator and not part of any token, so a dotted key cannot appear in a
# relation at all. Note WHERE it fails, because the first guess was wrong:
# `load_pack` accepts the string without complaint (the schema does not parse
# relations), and it is verify.relations() — the call the harness's
# test_pack_relations_parse_in_verifys_evaluator makes — that raises "could not
# parse relation '...': unexpected character '.'". Its `sum()` form fails at
# the same character, for a second and independent reason on top of that:
# `sum(a..b)` ranges over a shared numeric prefix with single-letter suffixes
# (sum(1a..1h)) — a COLUMN range across one printed line, not a range down 14
# rows.
# This is the same wall sched_d's banner records ("the verify relation grammar
# resolves a line id as a single token and cannot reference dotted column
# keys"), and the same disposition: these checks are left to the recompute
# engine plus human review. Nothing is being hidden — the arithmetic is
# printed in the COLUMN LEGEND above and in each Part's row comments — and a
# false or unparseable relation would be worse than none (the f8606 header's
# rule). Reported as an open issue: this form is the strongest case in the repo
# for a dotted-key relation grammar, at 36 unexpressible on-face equalities per
# year.
#
# ---------------------------------------------------------------------------
# CROSS-FORM — deliberately EMPTY, on two independent grounds
# ---------------------------------------------------------------------------
# The Totals row cites Schedule D by name on both pages: "Enter each total here
# and include on your Schedule D, line 1b (if Box A above is checked), line 2
# (if Box B above is checked), or line 3 (if Box C above is checked)" (page 1)
# and "... line 8b (if Box D ...), line 9 (if Box E ...), or line 10 (if Box F
# ...)" (page 2) — both re-read on the 2024 render. Not one of the six is an
# unconditional equality:
#   1. Each is CONDITIONAL on which box is checked — one Totals row lands on
#      one of three different Schedule D lines depending on an answer
#      elsewhere on the form. The grammar has no conditional.
#   2. Each is ADDITIVE across FORMS, not one-to-one. The printed face says so
#      itself: "If you have more short-term transactions than will fit on this
#      page for one or more of the boxes, complete as many forms with the same
#      box checked as you need", and the 2024 instructions repeat it —
#      "Complete as many copies of Part I as you need to report all
#      transactions of each type (A, B, or C)" (p.3) and "Include on your
#      Schedule D the totals from all your Parts I and II" (p.4). A filer with
#      20 box-A short-term sales files two Forms 8949 whose line 2 column (d)
#      totals SUM to Schedule D line 1b column (d); neither alone equals it.
#      This is the f8889 per-spouse shape, one step worse.
# There is also a hard mechanical bar: a `cross_form` ref is split at the FIRST
# dot, so `short_term.2.d == sched_d.1b.d` would be read as form_key
# "short_term" (not a pack) referring to line "2.d". Only undotted lines of
# THIS pack can appear on the left, and this pack has none. So even a
# conditional-free, one-to-one carry could not be written; both facts are
# recorded so a porter does not try. sched_d 2024 DOES map `1b.d`, `2.d`,
# `3.d`, `8b.d`, `9.d`, `10.d` and their .e/.g/.h siblings — checked in
# formpacks/federal/2024/sched_d/pack.yaml, the pack for THIS pack's own year,
# never a line number remembered from another year — so the targets exist and
# this is a deliberate omission, not a missing pack. No
# CROSS_FORM_TARGET_ALLOWLIST row is needed.
#
# ---------------------------------------------------------------------------
# IDENTITY FIELDS / SIGNATURE / MAILING
# ---------------------------------------------------------------------------
# identity_fields: [name, identifying_number] — the house shape for an
# attachment (sched_d, sched_b, sched_c, f8606, f8889 all ship exactly this).
# `name` is printed "Name(s) shown on return", i.e. the parent return's names
# by construction. NO `identity_per_person` entry — the two packs that ship one
# were checked before deciding, so this is a considered call rather than an
# omission. Both of them are per-PERSON on their own printed face: Form 8889's
# box is captioned "Social security number of HSA beneficiary. If both spouses
# have HSAs, see instructions", and Form 8606's header prints "If married, file
# a separate form for each spouse required to file" — so on a joint return
# either can legitimately carry the SPOUSE's SSN while the 1040 carries the
# primary filer's, which is why they declare `identity_per_person:
# [identifying_number]`. Form 8949 prints neither qualification: its box is the
# unqualified "Social security number or taxpayer identification number", it is
# filed per RETURN (it feeds one Schedule D, which carries the return's own
# SSN), and nothing in its 2024 instructions contemplates a per-spouse copy —
# the joint-return passage says the opposite, "You and your spouse may list
# your transactions on separate forms or you may combine them. However, you
# must include on your Schedule D the totals from all Forms 8949 for both you
# and your spouse" (p.1), which pools both spouses onto one Schedule D under
# one SSN. So a difference from the 1040 here is an error, and verify should
# keep FAILing it.
# `maxlen: 11` tracks the widget's OWN /MaxLen (dumped from the 2024 blank:
# /MaxLen 11 on f1_2 and f2_2, absent on every other widget), which is what
# formpacks/CONVENTIONS.md requires and what sched_b / sched_c / sched_8812 /
# f2555 / f8889 do; f8606 and f8960 pin 9 on the identical 11-wide widget, an
# inconsistency this pack reports rather than copies (ROADMAP Phase E has the
# open item). Neither box is a comb (no comb bit on either, re-dumped for
# 2024), so `format: ssn_digits_only` is here for cross-form identity
# consistency and overflow-proofing, not because dashes would clip (P-001).
# signature: null, mailing: null — the attachment-only shape (sched_d, f8889,
# f8960). Confirmed on the 2024 dump AND the 2024 render: 244 widgets, none in
# a signature area, and no signature or preparer block is printed on either
# page. The form is filed inside the parent return's envelope, so it has no
# where-to-file of its own.
form: "8949"
jurisdiction: federal
tax_year: 2024
source_url: https://www.irs.gov/pub/irs-prior/f8949--2024.pdf
pdf_sha256: "dcd2d7ff6833485038aa34946d9a91b7d5adf639677116b57f143677a85a3b51"
acroform_root: "topmostSubform[0]"

fields:
  # ---- page 1 header --------------------------------------------------------
  - line: "name"                            # "Name(s) shown on return"
    field: "Page1[0].f1_1[0]"
    type: text
  - line: "identifying_number"              # "Social security number or taxpayer identification number" — plain box, NOT a comb
    field: "Page1[0].f1_2[0]"
    type: text
    maxlen: 11                              # the widget's own /MaxLen (fits a dashed SSN/ITIN)
    format: ssn_digits_only                 # digits only keeps cross-form identity values consistent and can never overflow (P-001)

  # ---- Part I box set: "You must check Box A, B, or C below. Check only one
  # ---- box." THREE separate terminal /Btn fields, so the shared `group` is the
  # ---- only thing making them exclusive (P-008). Not `required`: a
  # ---- long-term-only filer files page 2 alone (see the header).
  - line: "short_term.box.a"                # "(A) Short-term transactions reported on Form(s) 1099-B showing basis was reported to the IRS (see Note above)"
    field: "Page1[0].c1_1[0]"
    type: checkbox
    on_state: "/1"
    group: short_term.box
  - line: "short_term.box.b"                # "(B) Short-term transactions reported on Form(s) 1099-B showing basis wasn't reported to the IRS"
    field: "Page1[0].c1_1[1]"
    type: checkbox
    on_state: "/2"
    group: short_term.box
  - line: "short_term.box.c"                # "(C) Short-term transactions not reported to you on Form 1099-B"
    field: "Page1[0].c1_1[2]"
    type: checkbox
    on_state: "/3"
    group: short_term.box

  # ---- Part I — Short-Term: printed line 1, the FOURTEEN transaction rows ----
  # Columns, in printed order (full captions in the COLUMN LEGEND in the header):
  #   .a description (MULTILINE widget)   .b date acquired   .c date sold
  #   .d proceeds   .e cost/basis   .f code(s)   .g adjustment   .h gain/(loss)
  # Widget arithmetic, so the map can be checked without the field dump: row N
  # binds f1_(8N-5) .. f1_(8N+2) inside Page1[0].Table_Line1[0].RowN[0] —
  # row 1 -> f1_3..f1_10, row 7 -> f1_51..f1_58, row 14 -> f1_107..f1_114.
  # row 1 of 14
  - line: "short_term.1.row01.a"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_3[0]"
    type: text
  - line: "short_term.1.row01.b"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_4[0]"
    type: text
  - line: "short_term.1.row01.c"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_5[0]"
    type: text
  - line: "short_term.1.row01.d"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_6[0]"
    type: money
  - line: "short_term.1.row01.e"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_7[0]"
    type: money
  - line: "short_term.1.row01.f"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_8[0]"
    type: text
  - line: "short_term.1.row01.g"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_9[0]"
    type: money
  - line: "short_term.1.row01.h"
    field: "Page1[0].Table_Line1[0].Row1[0].f1_10[0]"
    type: money
  # row 2 of 14
  - line: "short_term.1.row02.a"
    field: "Page1[0].Table_Line1[0].Row2[0].f1_11[0]"
    type: text
  - line: "short_term.1.row02.b"
    field: "Page1[0].Table_Line1[0].Row2[0].f1_12[0]"
    type: text
  - line: "short_term.1.row02.c"
    field: "Page1[0].Table_Line1[0].Row2[0].f1_13[0]"
