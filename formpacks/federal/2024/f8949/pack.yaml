# ---------------------------------------------------------------------------
# THE ROW-KEY CONVENTION — what makes this pack different, and how to address it
# ---------------------------------------------------------------------------
# Form 8949 is a REPEATING-ROW form. Each Part is one printed line 1 holding
# FOURTEEN transaction rows of eight columns, plus a printed line 2 "Totals"
# row. The AcroForm agrees exactly: Page<P>[0].Table_Line1[0].Row1[0] ..
# Row14[0], eight widgets each, then five page-level totals widgets.
#
#   <part>.<printed line>.<row>.<column>      e.g.  short_term.1.row01.d
#   <part>.<printed line>.<column>            e.g.  short_term.2.d   (Totals)
#   <part>.box.<printed box letter>           e.g.  short_term.box.a
#
# Each segment, and why it is spelled that way:
#
# * <part> = `short_term` | `long_term`. A part namespace is FORCED, not
#   stylistic: page 1 and page 2 print the SAME two line numbers (a "1" at the
#   top-left of the table and a "2" on the Totals row), so `1.row01.d` alone
#   collides across the two Parts and could not be a unique key. The printed
#   face offers two spellings for the disambiguator — the numeral ("Part I" /
#   "Part II") and the caption ("Short-Term." / "Long-Term.", printed in bold
#   immediately after it) — and the CAPTION was chosen deliberately. `parti`
#   vs `partii` (or `part1` vs `part2`) differ by ONE character buried in a
#   long key, and the failure that typo produces is not a crash but a silent
#   wrong return: the two Parts route to DIFFERENT Schedule D lines by the
#   printed text of their own Totals rows (Part I -> line 1b/2/3, Part II ->
#   line 8b/9/10), and those feed Schedule D's separately-netted line 7 (net
#   SHORT-term) and line 15 (net LONG-term), which the printed page-2 flow
#   then treats differently. `short_term` vs `long_term` cannot be confused by
#   eye or by a fuzzy caller. Both spellings are recorded here so
#   a reader of Schedule D — whose column (g) heading cites "Form(s) 8949,
#   Part I, line 2, column (g)" — can map the vocabularies: Part I =
#   short_term (page 1, boxes A/B/C), Part II = long_term (page 2, D/E/F).
#
# * <printed line> = `1` for the transaction table, `2` for the Totals row.
#   These are the form's OWN printed line labels (formpacks/CONVENTIONS.md:
#   "Best of all, key by the printed line NUMBER when the form gives one"), and
#   they are what Schedule D cites ("from Form(s) 8949, Part I, line 2,
#   column (g)").
#
# * <row> = `row01` .. `row14`, this pack's index of the row WITHIN printed
#   line 1. The form prints no per-row label, so this segment is ours, the way
#   sched_b's `interest_1..interest_14` / `dividend_1..` blocks are. It is
#   ZERO-PADDED, which is a deliberate divergence from sched_b and the reason
#   is mechanical rather than aesthetic: with 14 rows, sorted() over sched_b's
#   spelling yields interest_1, interest_10, interest_11, ..., interest_2, so
#   any caller, report or diff that lists keys in lexical order shows the rows
#   out of printed order. `row01..row14` sorts into printed order. The `row`
#   prefix (rather than a bare `01`) is required by the line-id grammar: a
#   segment is either a printed label `[0-9]+[a-z]?` or a word
#   `[a-z][a-z0-9_]*`, so a bare `01` would read as a printed line label the
#   form does not have.
#
# * <column> = the PRINTED column letter, `a`..`h`, exactly as sched_d keys
#   `1b.d`/`2.g` and sched_e keys `3.a`. COLUMN LEGEND, re-transcribed from
#   the 2024 printed table head (identical on both pages, and identical to
#   2023):
#     (a) Description of property (Example: 100 sh. XYZ Co.)        text
#     (b) Date acquired (Mo., day, yr.)                             text
#     (c) Date sold or disposed of (Mo., day, yr.)                  text
#     (d) Proceeds (sales price) (see instructions)                 money
#     (e) Cost or other basis. See the Note below and see Column
#         (e) in the separate instructions.                         money
#     (f) Code(s) from instructions   [under the spanning head
#         "Adjustment, if any, to gain or loss / If you enter an
#         amount in column (g), enter a code in column (f)."]       text
#     (g) Amount of adjustment                                      money
#     (h) Gain or (loss). Subtract column (e) from column (d) and
#         combine the result with column (g).                       money
#   Column (f) is TEXT, not money, and that is a primary-source call, not a
#   guess: "In order to explain any adjustment to gain (or loss) in column (g),
#   enter the appropriate code(s) in column (f)... If more than one code
#   applies, enter all the codes that apply in alphabetical order (for example,
#   "BOQ"). Don't separate the codes by a space or comma." (Instructions for
#   Form 8949 (2024), Column (f)—Code, p.7.) Columns (b) and (c) are TEXT for
#   the same kind of reason — the instructions put non-dates in them: "Enter
#   "INHERITED" in column (b)" for inherited property, and "you may report the
#   sale on one row and enter "VARIOUS" in column (b)" for stock acquired on
#   several dates (Instructions for Form 8949 (2024), Column (b)—Date
#   Acquired, p.5).
#
# Whole-form worked example, so a caller can see the shape end to end. An ESPP
# sale whose broker-reported basis omits the discount already taxed as wages —
# the exact case that needed this pack — lands as:
#   short_term.box.a       = true            (1099-B, basis reported to the IRS)
#   short_term.1.row01.a   = "100 sh. XYZ Co."
#   short_term.1.row01.b   = "03/15/2024"
#   short_term.1.row01.c   = "09/20/2024"
#   short_term.1.row01.d   = 5000            proceeds
#   short_term.1.row01.e   = 4000            the basis AS REPORTED on the 1099-B
#   short_term.1.row01.f   = "B"             the code that says that basis is wrong
#   short_term.1.row01.g   = -800            the correction (negative = reduces gain)
#   short_term.1.row01.h   = 200             5000 - 4000 + (-800)
# The -800 SIGN is the worksheet's, not an inference: "1. Enter the cost or
# other basis shown on Form 1099-B" (4,000) "2. Enter the correct cost or other
# basis" (4,800 — the 4,000 paid plus the 800 discount already taxed as wages)
# "3. If line 1 is larger than line 2, leave this line blank and go to line 4.
# If line 2 is larger than line 1, subtract line 1 from line 2. Enter the
# result here and in column (g) AS A NEGATIVE NUMBER (in parentheses)"
# (Instructions for Form 8949 (2024), Worksheet for Basis Adjustments in
# Column (g), p.11). The instructions' own Example 4 runs the OTHER branch —
# reported basis 900 too HIGH against a correct 100, so line 4 applies and
# column (g) is +800 (p.10) — which is why the sign has to be taken from the
# worksheet rather than from the nearest worked example.
# and the printed page-1 Note is what forces that shape: "If you checked Box A
# above but the basis reported to the IRS was incorrect, enter in column (e)
# the basis as reported to the IRS, and enter an adjustment in column (g) to
# correct the basis." The instructions' code table says the same in the other
# direction, and the two-branch rule is worth quoting because it decides which
# column the correction goes in: "You received a Form 1099-B (or substitute
# statement) and the basis shown in box 1e is incorrect -> THEN enter this code
# in column (f): B ... * If this transaction is reported on a Part I with box B
# checked at the top or ... a Part II with box E checked at the top, enter the
# CORRECT basis in column (e), and enter -0- in column (g). * If this
# transaction is reported on a Part I with box A checked at the top or ... a
# Part II with box D checked at the top, enter the basis shown on Form 1099-B
# (or substitute statement) in column (e), EVEN THOUGH THAT BASIS IS INCORRECT.
# Correct the error by entering an adjustment in column (g)." (Instructions for
# Form 8949 (2024), How To Complete Form 8949, Columns (f) and (g), p.8.) So
# which box is checked changes which cell the ESPP correction occupies — and
# both cells are addressable here.
#
