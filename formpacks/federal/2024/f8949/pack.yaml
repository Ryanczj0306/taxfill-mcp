  # ---- Part I printed line 2 — "Totals. Add the amounts in columns (d), (e),
  # ---- (g), and (h) (subtract negative amounts). Enter each total here and
  # ---- include on your Schedule D, line 1b (if Box A above is checked), line 2 (if
  # ---- Box B above is checked), or line 3 (if Box C above is checked)."
  # The carry is CONDITIONAL on the box AND additive across forms, so no
  # cross_form rule (see the header). Column (f) has NO key: its Totals cell is
  # shaded grey and ReadOnly (f1_117[0]) because the printed row totals only
  # (d), (e), (g) and (h) — P-007 class 2.
  - line: "short_term.2.d"                       # Totals, column (d) Proceeds
    field: "Page1[0].f1_115[0]"
    type: money
  - line: "short_term.2.e"                       # Totals, column (e) Cost or other basis
    field: "Page1[0].f1_116[0]"
    type: money
  - line: "short_term.2.g"                       # Totals, column (g) Amount of adjustment
    field: "Page1[0].f1_118[0]"
    type: money
  - line: "short_term.2.h"                       # Totals, column (h) Gain or (loss)
    field: "Page1[0].f1_119[0]"
    type: money

  # ---- page 2 header — identity MIRRORS, mapped because nothing propagates
  # ---- them and a Part-II-only filing has no "other side" (see the header)
  - line: "page2_name"                      # "Name(s) shown on return. Name and SSN or taxpayer identification no. not required if shown on other side"
    field: "Page2[0].f2_1[0]"
    type: text
  - line: "page2_identifying_number"        # "Social security number or taxpayer identification number" (page-2 header box)
    field: "Page2[0].f2_2[0]"
    type: text
    maxlen: 11                              # this widget's own /MaxLen — same 11 as the page-1 source here
    format: ssn_digits_only                 # must match the source's format, or the same SSN reaches the two boxes spelled differently

  # ---- Part II box set: "You must check Box D, E, or F below. Check only one
  # ---- box." Same separate-widget topology and same adjudication as Part I.
  - line: "long_term.box.d"                 # "(D) Long-term transactions reported on Form(s) 1099-B showing basis was reported to the IRS (see Note above)"
    field: "Page2[0].c2_1[0]"
