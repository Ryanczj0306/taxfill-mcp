#      1074/1075/P1R07f/1077/1078; row 14 shows P1R14a-c with
#      1144/1145/P1R14f/1147/1148 in the last band above the Totals row; Part
#      II the same with the 2xxx sentinels (2014.., 2074.., 2144..). No shift
