[project]
name = "taxfill-mcp"
version = "0.1.0"
description = "MCP server exposing the TaxFill core engine over stdio (official mcp python-sdk). v0.1 in development — not yet published to PyPI."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    # Upper bound is load-bearing: the MCP python-sdk 2.0.0 (released 2026-08)
    # REMOVED the high-level FastMCP API from the `mcp` distribution entirely
    # (extracted upstream to the standalone `fastmcp` package — mcp 2.0's wheel
    # contains no fastmcp module at all), so server.py's
    # `from mcp.server.fastmcp import FastMCP, Image` cannot resolve on 2.x.
    # A clean-venv install of an unbounded `mcp>=1.2` therefore produces an
    # IMPORT-BROKEN wheel — exactly what the packaging CI job caught. Keep the
    # cap until the 2.x migration is evaluated (see ROADMAP A1 follow-up).
    "mcp>=1.2,<2",
    # Pin to the matching core release so `uvx taxfill-mcp` never resolves a
    # mismatched taxfill-core from PyPI. Keep in sync with the version bump
    # (see docs/PUBLISHING.md).
    "taxfill-core==0.1.0",
]

[project.scripts]
taxfill-mcp = "taxfill_mcp.server:main"
taxfill = "taxfill_mcp.cli:main"

[tool.uv.sources]
taxfill-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxfill_mcp"]
