# Schema v2 conversion of knowledge/states/ga/2025.yaml — Phase K JK24 parity fixture, NOT a shipped pack.
# Generated by scripts/convert_state_pack_v2.py; regenerate, never hand-edit. Loaded through
# load_state_knowledge, it must give the ga_2025 JK21 golden byte for byte (test_state_knowledge_v2.py).
schema_version: 2
jurisdiction: states/ga
tax_year: 2025
income_tax: true
citation:
  id: forms-1
treaty:
  conforms_to_federal_treaties: true
  note:
    text: 'Georgia conforms. The resident return (Form 500) starts from federal adjusted gross income (2025 Form 500, Line
      8: "Federal adjusted gross income (From Federal Form 1040)" with the warning "Do not use FEDERAL TAXABLE INCOME"),
      and adjustments are made only on Form 500 Schedule 1. The Schedule 1 ADDITIONS do not include any add-back of federally
      treaty-exempt income (unlike California''s Schedule CA add-back). To the contrary, the IT-511 booklet expressly lists
      as a SUBTRACTION item income specifically exempted by Federal law or treaty. Because treaty-exempt income is already
      excluded from federal AGI and GA neither adds it back nor otherwise re-taxes it (and explicitly recognizes the treaty
      exemption), it flows through untaxed.'
tax:
  citation:
    id: rates-1
  flat_rate: 0.0519
  base: federal_agi
  tax_line: 'Form 500, Line 16: ''Tax (Multiply Line 15c by 5.19%. Round to the nearest dollar)''. Line 15c Georgia Taxable
    Income = Line 10 Georgia AGI minus Line 11 standard deduction (or Line 12c itemized), minus Line 14 dependent exemption
    (Line 7c x $4,000), minus Line 15b Georgia NOL utilized.'
  exemptions:
    dependent:
      amount: 4000
      note: 'Form 500 Line 14: number of dependents (Line 7c) x $4,000 (unchanged from 2024; the 2024 legislation that raised
        it from $3,000 to $4,000 and repealed the personal exemptions still governs — only the dependent exemption survives).
        A true base reduction (Line 15a = Line 13 minus Line 14), not a credit. Line 7c includes unborn dependents with
        a detectable heartbeat (Line 7b, Georgia LIFE Act); an unborn dependent cannot be claimed if the child is born during
        the same tax year.'
  standard_deduction:
    single: 12000
    married_filing_jointly: 24000
    married_filing_separately: 12000
    head_of_household: 12000
  caveats:
  - text: '2025 STRUCTURAL CHANGE — HB 111 ACCELERATED THE FLAT RATE: for tax years beginning on or after January 1, 2025
      the Georgia flat rate DROPS to 5.19% (2024: 5.39%), per the 2025 IT-511 What''s New (''Effective January 1, 2025,
      the income tax rate is 5.19%'') and Form 500 Line 16. The $12,000/$24,000 standard deductions and the $4,000 dependent
      exemption are UNCHANGED from 2024; personal exemptions remain repealed (only the dependent exemption survives). Do
      NOT carry the 2024 5.39% rate into 2025, and do NOT use this pack for 2024.'
  - text: 'Base guidance: Supply Form 500, Line 10 ''Georgia adjusted gross income'' (Line 8 federal AGI from Form 1040,
      net of Line 9 adjustments from Form 500 Schedule 1) for a FULL-YEAR resident. The op subtracts the per-status Line
      11 standard deduction and $4,000 per dependent (Line 14) to reach Line 15c Georgia taxable income (assuming no Line
      15b NOL), then multiplies by 5.19%. Pass exemptions_count=0 — Georgia has NO personal exemption (repealed); pass dependents_count
      = Form 500 Line 7c (qualified dependents plus unborn dependents). Do not use this op if you itemize deductions, claim
      a Georgia NOL (Line 15b), or file as a part-year resident/nonresident (they omit Lines 9-14 and use Schedule 3, which
      prorates the deduction) — compute those on the form.'
  - text: 'QUALIFYING SURVIVING SPOUSE (CRITICAL): Georgia files QSS under filing status D ''Head of Household or Qualifying
      Surviving Spouse'' with a $12,000 standard deduction (both the 2025 Form 500 Line 5 status list and the IT-511 Standard
      Deductions chart, which prints ''Qualifying surviving spouse $12,000'') — pass head_of_household to this op, NOT married_filing_jointly.
      The engine''s default QSS -> married_filing_jointly mapping would apply MFJ''s $24,000 and UNDERSTATE tax.'
  - text: 'AGE-65/BLIND ADDITIONAL DEDUCTION: none for Georgia — the flat $12,000/$24,000 amounts are the entire standard
      deduction; the old (pre-2024) $1,300-per-checkbox additional standard deduction is gone. No age_65/blind keys ship.'
  - text: 'ITEMIZERS NOT MODELED: if you itemized on your federal return (or are MFS and your spouse itemizes), you MUST
      itemize on the Georgia return (Line 12c = federal Schedule A total less Georgia adjustments) and the standard deduction
      does not apply. Itemizing residents may claim the Georgia Eligible Itemizer Tax Credit of up to $300 per taxpayer
      on Form 500 Line 19 — a CREDIT against Line 16 tax, not a base reduction, and not modeled.'
  - text: 'NO tax table and NO rate schedule: Line 16 is a straight multiplication printed on the form (''Multiply Line
      15c by 5.19%. Round to the nearest dollar'').'
  - text: 'Georgia NOL not modeled: Form 500 Line 15b (Georgia NOL utilized, limited to 80% of Line 15a income for losses
      from tax years 2018+) is subtracted before Line 15c taxable income.'
  - text: 'Part-year residents and nonresidents not modeled: they omit Form 500 Lines 9-14 and use Schedule 3, which prorates
      the standard deduction and dependent exemption by the Georgia-income ratio. This pack''s subtractions apply only to
      full-year residents. Taxpayers required to file federal Form 1040NR generally may NOT take the Georgia standard deduction.
      NOTE: Form 500-EZ is DISCONTINUED for 2025 — all filers use Form 500.'
  - text: 'CREDITS (subtracted from tax, NOT modeled and NOT base reductions): Low Income Credit (Form 500 Line 17 — a per-exemption
      CREDIT of $5-$26 for federal AGI under $20,000); Other State(s) Tax Credit (Line 18); Georgia Eligible Itemizer Tax
      Credit (Line 19, up to $300 per itemizing taxpayer); IND-CR series 200 credits (Line 20); Schedule 2 series 100 credits
      (Line 21). Total credits used (Line 22) cannot exceed Line 16 tax.'
  - text: 'Rounding: the Form 500 Line 16 instruction itself mandates ''Round to the nearest dollar''; this pack rounds
      half-up to whole dollars (irs_round), matching the form''s presentation.'
credits:
  caveat: State credits were researched from the cited DOR sources and are not tax advice — confirm each amount and your
    eligibility at the cited source before claiming it.
  items:
  - name: Low Income Tax Credit
    line: Form 500, Line 17 (17a = number of exemptions, 17b = per-exemption credit from table, 17c = total) using the Low
      Income Credit Worksheet in the 2025 IT-511 booklet
    type: nonrefundable
    eligibility:
      text: Georgia residents whose Federal adjusted gross income (FAGI) is less than $20,000 and who are not claimed (or
        eligible to be claimed) as a dependent on another taxpayer's federal or Georgia return. Cannot be claimed by an
        inmate in a correctional facility. Part-year residents qualify only if they were Georgia residents at the end of
        the tax year.
    ref:
      id: credits-1
  - name: Georgia Eligible Itemizer Tax Credit
    line: Form 500, Line 19
    type: nonrefundable
    eligibility:
      text: Full-year residents and part-year residents living in Georgia at the end of the year who itemized deductions
        on their returns.
    ref:
      id: credits-1
      description: 1
  - name: Child and Dependent Care Expense Credit (Credit Code 202)
    line: Form IND-CR Schedule 202 (included with Form 500/500X); result carried to the IND-CR Summary Worksheet, whose
      total flows to Form 500, Line 20
    type: nonrefundable
    eligibility:
      text: Georgia taxpayers who claimed and were allowed the federal child & dependent care expense credit under Internal
        Revenue Code Section 21 on their federal Form 1040.
    ref:
      id: credits-1
      description: 2
  - name: Qualified Caregiving Expense Credit (Credit Code 204)
    line: Form IND-CR Schedule 204 (included with Form 500/500X); result carried to the IND-CR Summary Worksheet, whose
      total flows to Form 500, Line 20
    type: nonrefundable
    eligibility:
      text: Taxpayers who pay qualified caregiving expenses for a qualifying family member who is at least age 62 OR has
        been determined disabled by the Social Security Administration. Qualified services must be obtained from an organization
        or individual NOT related to the taxpayer or family member.
    ref:
      id: credits-1
      description: 3
  - name: Disabled Person Home Purchase or Retrofit Credit (Credit Code 201)
    line: Form IND-CR Schedule 201 (included with Form 500/500X); result carried to the IND-CR Summary Worksheet, whose
      total flows to Form 500, Line 20
    type: nonrefundable
    eligibility:
      text: A permanently disabled person (the taxpayer or the taxpayer's spouse on a joint return) who has been issued
        a permanent parking permit by the Department of Revenue, and who purchases a new single-family home containing all
        four required accessibility features, or retrofits an existing single-family home with one or more of those features.
    ref:
      id: credits-1
      description: 4
law_changes:
  changes:
  - description: 'HB 111 (2025 session) ACCELERATED THE FLAT RATE: for tax years beginning on or after January 1, 2025 the
      Georgia flat rate DROPS to 5.19%, down from 2024''s 5.39% — 2025 IT-511 What''s New: "Effective January 1, 2025, the
      income tax rate is 5.19%", printed on Form 500 Line 16 as "Tax (Multiply Line 15c by 5.19%. Round to the nearest dollar)".
      This accelerates the HB 1015/HB 1437 phase-down schedule. Everything else is unchanged from 2024: the $12,000/$24,000
      standard deductions and the $4,000 dependent exemption stand, and personal exemptions remain repealed (only the dependent
      exemption survives).'
    status: final_form_published
    affects:
    - tax.flat_rate
    - Form 500 Line 16
    modeled: true
    ref:
      id: law-1
forms:
  resident: Form 500 (Georgia Individual Income Tax Return) for tax year 2025. NOTE — Form 500-EZ is DISCONTINUED for tax
    years beginning on or after January 1, 2025; all filers use Form 500.
  part_year_or_nonresident: Form 500 with Schedule 3 (part-year residents and nonresidents file the same Form 500, omit
    Lines 9-14, and complete Form 500 Schedule 3 to calculate Georgia taxable income). The residency status box on Form
    500 Line 4 (1=full-year resident, 2=part-year resident, 3=nonresident) designates status.
  refs:
    part_year:
    - id: forms-2
      description: 1
    - id: forms-1
      description: 2
    nonresident:
    - id: forms-2
      description: 2
    - id: forms-1
      description: 2
logistics:
  mailing:
    refund_or_no_payment: 'Form 500 without payment: PROCESSING CENTER, GEORGIA DEPARTMENT OF REVENUE, PO BOX 740392, ATLANTA,
      GA 30374-0392'
    with_payment: 'Form 500 with payment: PROCESSING CENTER, GEORGIA DEPARTMENT OF REVENUE, PO BOX 740399, ATLANTA, GA 30374-0399.
      (Form 500X amended: PO BOX 740318, ATLANTA, GA 30374-0318.)'
    verification: Some state facts could not be independently re-confirmed — see the pack's `unverified` list; confirm at
      the cited DOR source before relying on a specific figure/address.
    ref:
      id: logistics-1
  deadlines:
    filing_due_date: '2026-04-15'
    ref:
      id: logistics-1
      description: 1
  payment:
    check_payee: Georgia Department of Revenue (2025 IT-511 filing checklist — make your check or money order payable to
      the Georgia Department of Revenue; send with the 525-TV voucher when paying by check. The voucher prints its own address
      for a payment on an e-filed return — PROCESSING CENTER, GEORGIA DEPARTMENT OF REVENUE, PO BOX 740323, ATLANTA GA 30374-0323
      (2025 Form 500 page 28 / 2025 IT-511 booklet, Form 525-TV); a paper return and its voucher go to the return's with-payment
      mailing address)
    web_pay_url: https://gtc.dor.ga.gov/ (Georgia Tax Center, GTC)
  amended_return:
    form: Form 500X
    mailing_address: PROCESSING CENTER, GEORGIA DEPARTMENT OF REVENUE, PO BOX 740318, ATLANTA, GA 30374-0318
    payment:
    - 'Form 500X line 38 "Amount Owed Pay in full with this Return (Add Line 32, Line 35 through 37)": you add line 35 "Form
      500 UET (Estimated tax penalty)", line 36 "Late Payment Penalty (1/2 of 1% per month from due date)" and line 37 "Interest
      (See IT-511 Tax Booklet)" on the form yourself (2025 Form 500X).'
    - 'Pay on the Georgia Tax Center (gtc.dor.ga.gov), or by check or money order "payable to: Georgia Department of Revenue"
      with your SSN on it and Form 525-TV, its "Amended Return" box checked: "Mail your return, payment voucher and payment
      to the address that appears on the return if filing a paper return"; do not staple the payment and voucher together
      (525-TV, Rev. 05/20/25).'
    assemble:
    - '"Include any supporting documents and new or changed forms and schedules. In the space provided below, tell us why
      you are filing Form 500X. Mail pages 1-5 and any applicable schedules, forms, and documentation. DO NOT staple pages."
      (2025 Form 500X)'
    - 'Line 8, federal adjusted gross income: "If the amount on Line 8 is $40,000 or more, or your gross income is less
      than your W-2s you must include a copy of your Federal Form 1040 Pages 1, 2, and Schedule 1." (2025 Form 500X)'
    timing:
    - '"A claim for refund must be made within three (3) years from the later of the date the tax was paid or the due date
      of the return, including extensions." (2025 IT-511, p. 3)'
    - 'After a federal change: "Whenever a Federal audit or other Federal adjustment results in a change in net income for
      any year, you are required to furnish, within 180 days, a Form 500X with supporting schedules and a copy of Form 1040
      to the Georgia Department of Revenue reflecting all changes. Additionally, if the changes result in a refund, the
      refund must be claimed within one year from the date the changes are submitted." (2025 IT-511, Federal Audits, p.
      12) And (p. 9, "Update to Final Determination Date for Reporting Federal Changes"): "Taxpayers must report any federal
      changes or corrections resulting from a federal audit within 180 days of the final determination date. When those
      changes result from an amended federal return, a federal refund claim, an administrative adjustment request, or a
      similar report filed under Section 6225(c) of the Internal Revenue Code, the final determination date is the date
      the amended return, claim, adjustment request, or related report is filed."'
    mail:
    - 'Georgia DOR: "Sending your return via certified mail or courier will NOT speed the processing of your return. The
      postal service imposes special handling procedures for certified mail that may delay processing your return" (Mailing
      Address - Individual/Fiduciary Income Tax).'
    notes:
    - '"File Form 500X to correct information reported on Form 500. Do not use Form 500 to correct a previously filed return
      or use Form 500X as an original return." (2025 IT-511, Amended Returns, p. 10)'
    - An amendment that follows an IRS audit checks the "Amended due to IRS Audit" box on the 2025 Form 500X header.
    refs:
    - id: logistics-2
    - id: logistics-1
      description: 2
    - id: logistics-3
    - id: logistics-4
