    part-year residents use the same PA-40 form as PA residents.'' — ''(P) Part-Year Resident If you moved into Pennsylvania
    during 2025, fill in this oval even though you were a PA resident at the end of 2025. If you moved from Pennsylvania
    during 2025, fill in this oval even though you were not a PA resident at the end of 2025.'' — and ''INSTRUCTIONS FOR
    NONRESIDENTS AND PART-YEAR RESIDENTS'' (p. 42): ''Part-Year Resident of Pennsylvania - You must report all taxable income
    you earned, received, and realized from all sources for the time you were a PA resident, and report the PA-taxable income
    you earned, received, and realized from sources within Pennsylvania for the time you were not a PA resident.'''
  - '2025 Pennsylvania Personal Income Tax Return Instructions (PA-40 IN), ''Residency Status'' (p. 6): ''Nonresidents and
    part-year residents use the same PA-40 form as PA residents.'' — ''(N) Nonresident If you were a nonresident of Pennsylvania
    for all of 2025, fill in this oval. PA law taxes nonresidents on the income earned, received, or realized from Pennsylvania
    sources during 2025.'' — and ''INSTRUCTIONS FOR NONRESIDENTS AND PART-YEAR RESIDENTS'' (p. 42): ''Nonresident of Pennsylvania
    - You must report all taxable income you earned, received, and realized from PA sources.'''
