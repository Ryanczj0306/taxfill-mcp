  detail: 'Exact treatment of FEDERAL TAX TREATY-EXEMPT income: PA does not start from federal AGI and has no documented
    treaty add-back or pass-through (zero ''treaty'' occurrences in the 2025 PA-40 instructions or the 2025 PA-40 form),
    so conforms_to_federal_treaties is set to false per the rubric''s ''builds income from scratch'' rule. However, PA generally
    does not tax compensation that a federal treaty exempts (such wages are typically excluded from PA-taxable compensation/Box
