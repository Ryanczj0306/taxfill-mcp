citation:
  id: forms-1
treaty:
  conforms_to_federal_treaties: false
  note:
    text: 'PA does NOT start from federal adjusted gross income. Per the 2025 PA-40 instructions and the PA PIT Guide, PA
      imposes a flat 3.07% tax on eight SEPARATELY-computed classes of income (2025 PA-40 lines 1a-8: compensation; interest
      income; dividend and capital gains distributions income; net income or loss from the operation of a business, profession,
      or farm; net gain or loss from the sale, exchange, or disposition of property; net income or loss from rents, royalties,
      patents, or copyrights; estate or trust income; gambling and lottery winnings). PA provides no standard deduction
      or personal exemption ("PA law does not allow standard deductions, deductions for personal exemptions, itemized deductions,
      or deductions for personal expenses" — 2025 PA-40IN) and the 2025 instructions state PA filing requirements "are different
      than federal requirements." Because PA computes taxable compensation from gross PA-source wages rather than inheriting
      federal AGI, there is NO automatic federal-AGI pass-through that would carry a federal tax-treaty exclusion into the
      state return, and the 2025 PA-40 instructions contain zero occurrences of "treaty"/"treaties" (no treaty pass-through
      mechanism). Under the task rubric this is the state-builds-income-from-scratch (not federal AGI), no-treaty-pass-through
      case -> conforms_to_federal_treaties = false. CAVEAT: In administrative practice PA generally does not tax compensation
      a federal treaty exempts (such wages typically are excluded from PA-taxable Box 16 compensation), so the precise treatment
      of treaty-exempt income should be confirmed with the PA DOR; flagged in unverified.'
tax:
  citation:
    id: rates-1
  flat_rate: 0.0307
  base: state_gross_income
  tax_line: PA-40 Line 12 (PA Tax Liability) = Line 11 (Adjusted PA Taxable Income = Line 9 minus Line 10 other deductions)
    x 3.07 percent (0.0307).
  exemptions: {}
  caveats:
  - text: 'PA does NOT start from federal AGI: it taxes eight SEPARATELY-computed classes of income (2025 PA-40 Lines 1a-8
      — compensation; interest income; dividend and capital gains distributions income; net income or loss from the operation
      of a business, profession, or farm; net gain or loss from the sale, exchange, or disposition of property; net income
      or loss from rents, royalties, patents, or copyrights; estate or trust income; gambling and lottery winnings). Line
      9 adds ONLY the positive amounts — a loss in one class may never offset income in another class.'
  - text: '"PA law does not allow standard deductions, deductions for personal exemptions, itemized deductions, or deductions
      for personal expenses" — calc.state_tax multiplies the supplied PA taxable-income base only (pass exemptions_count=0
      and dependents_count=0).'
  - text: 'PA Tax Forgiveness (Schedule SP, PA-40 Line 21) and other low-income relief are OUTSIDE this flat-rate computation
      — check Schedule SP eligibility separately (2025 Eligibility Income Tables: unmarried base $6,500, married base $13,000,
      +$9,500 per dependent child, 100% down to 10%).'
  - text: 'UNCHANGED for 2025: the 3.07% flat rate, eight-class system, and no-deduction rule are identical to 2024. Local
      earned-income taxes (PA municipalities/school districts) are NOT modeled here.'
credits:
  caveat: State credits were researched from the cited DOR sources and are not tax advice — confirm each amount and your
    eligibility at the cited source before claiming it.
  items:
  - name: Tax Forgiveness Credit (Special Tax Forgiveness)
    line: PA-40 Schedule SP (Section IV), carried to PA-40 Line 21 (with Lines 19a filing status, 19b dependents, and 20
      total eligibility income from the schedule). PA Schedule SP must be completed and included.
    type: nonrefundable
    eligibility:
      text: PA residents (and part-year/nonresidents with PA-taxable income) who are subject to PA personal income tax,
        are not a dependent on another person's federal tax return (a dependent child can still qualify if listed as a dependent
        on the PA Schedule SP of their parents/grandparents/foster parents), and meet the eligibility-income limits. Determined
        by filing status, number of dependent children, and total eligibility income (which includes some nontaxable income).
        Married claimants must use their JOINT eligibility income and Table 2 even when filing separately — a married taxpayer
        cannot claim Tax Forgiveness independently of their spouse.
    ref:
      id: credits-1
  - name: Child and Dependent Care Enhancement Tax Credit
    line: PA-40 Schedule DC (Section III), carried to PA-40 Line 23 (Total Other Credits, together with any Schedule OC
      credits)
    type: refundable
    eligibility:
      text: PA residents who receive a credit under section 21 of the Internal Revenue Code (federal Child and Dependent
        Care Credit, federal Form 2441) may claim the credit; the expenses must also have been claimed on the federal 1040.
        Care expenses must be for a dependent child under age 13, a spouse incapable of self-care who lived with you more
        than half the year, or another individual incapable of self-care meeting the dependency tests. In general, married
        persons must file a joint return to claim it. A completed copy of federal Form 2441 and 1040 Schedule 3 must be
        included with the PA-40 or the credit will be removed.
    ref:
      id: credits-2
  - name: Property Tax/Rent Rebate Program (PTRR)
    line: Form PA-1000, Property Tax or Rent Rebate Claim (standalone application, not the PA-40; also filable online via
      myPATH)
    type: refundable
    eligibility:
      text: 'Pennsylvania residents who are age 65 or older; widows/widowers age 50 or older; or people with disabilities
        age 18 or older, who owned and occupied a home (and paid property tax) or rented during the claim year. NOTE: This
        is a standalone rebate filed on Form PA-1000, not a credit on the PA-40 income tax return. Since Act 7 of 2023 the
        income limits are indexed to the cost of living annually.'
    ref:
      id: credits-3
law_changes:
  changes:
  - description: NEW STUDENT LOAN INTEREST DEDUCTION — up to $2,500 of student loan interest may be deducted from Pennsylvania
      taxable income, on PA-40 Schedule O.
    status: final_form_published
    affects:
    - PA-40 Schedule O (deductions) / PA-40 line 10
    - calc.state_tax taxable_base (caller-supplied — must already net the deduction)
    modeled: false
    lookup_path: 2025 PA-40 Instructions, 2025 State Tax Change, and the PA-40 Schedule O instructions.
    ref:
      id: law-1
  - description: GRANTOR TRUST INCOME TAXED TO THE GRANTOR — under Act 64 of 2023 (SB 815), income of a resident trust (and
      Pennsylvania-source income of a nonresident trust) is taxable to the grantor or other person treated as its owner
      under the Internal Revenue Code, distributed or not.
    status: final_form_published
    affects:
    - PA-40 income classes (grantor trust income) and the PA-41 filing method
    modeled: false
    lookup_path: 2025 PA-40 Instructions, Grantor Trust (p.19), and the PA-41 instructions.
    ref:
      id: law-1
      description: 1
  - description: 'NEW WORKING PENNSYLVANIANS TAX CREDIT (WPTC) — created in the 2025-26 budget (signed November 12, 2025),
      after the April 2025 instructions were printed: 10 percent of the federal earned income tax credit, at most $805,
      for a filer with Pennsylvania earned income who qualifies for the federal EITC and files both returns. The Department
      computes it from the PA-40.'
    status: final_form_published
    affects:
    - PA-40 credits (the Working Pennsylvanians Tax Credit)
    modeled: false
    lookup_path: The Department of Revenue's Working Pennsylvanians Tax Credit page (the citation URL, pa.gov/wptc) and
      its calculator; the credit follows the federal EITC (this repo's federal EITC tables).
    ref:
      id: law-2
  checked:
    checked: 2026-09-28
    finding: '''2025 STATE TAX CHANGE'' (PA-40 Instructions, PA-40 IN 04-25, p.1) read in full: the student loan interest
      deduction and the grantor trust rules are recorded above. The Schedule D update (a digital asset question and like-kind
      exchanges) and the Schedule OC redesign are form changes. The rate stays 3.07%. The instructions predate the 2025-26
      budget, so the Working Pennsylvanians Tax Credit comes from the Department''s own page, added to this pack''s citations.'
    ref:
      id: law-1
      description: 2
convenience_rule:
  summary: '61 Pa. Code § 109.8: "Any allowance claimed for days worked outside of this Commonwealth shall be based upon
    the performance of services which, of necessity, obligate the employe or casual employe to perform out-of-State duties
    in the service of his employer or casual employer." Out-of-state days reduce Pennsylvania-source compensation only when
    the employer''s business NECESSITY — not the employee''s convenience — puts the work out of state.'
  trigger: A nonresident allocating compensation from Pennsylvania-based employment between in-state and out-of-state working
    days.
  exceptions: Days that of necessity obligate out-of-State duties in the employer's service qualify for the allowance; the
    regulation names no home-office factor test — necessity is the single standard.
  ref:
    id: remote-1
