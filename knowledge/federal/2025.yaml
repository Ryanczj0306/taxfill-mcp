# Federal knowledge pack — tax year 2025 (docs/DEV_PLAN.md sections 3, 7, 10).
#
# Tax math lives here as DATA with citations, never hardcoded in engine code
# (the no-LLM-arithmetic rule, dev plan section 10). Every number in this file
# was transcribed from the official IRS document named in its block's
# citation (irs.gov only; see knowledge/sources.yaml). Mirrors the schema of
# knowledge/federal/2024.yaml exactly. Do NOT edit a number without
# re-verifying it against that source.
#
# 2025 is the OBBBA year: the One Big Beautiful Bill Act (P.L. 119-21, enacted
# July 4, 2025) changed several mid-year figures AFTER Rev. Proc. 2024-40 was
# published. Where the two disagree (standard deduction, CTC), the published
# 2025 FORM INSTRUCTIONS are the final authority for what the 2026 filing
# season actually used — each such block notes the supersession. OBBBA also
# added four new above/below-the-line deductions on the new Schedule 1-A
# (tips, overtime, car-loan interest, enhanced senior deduction — see
# tax.obbba_schedule_1a) and raised the Schedule A SALT cap (tax.salt_cap).
# 2025 Form 1040 line changes: AGI split into 11a/11b, deductions 12a-12e,
# 13a QBI, 13b = Schedule 1-A line 38 (13c on the 1040-NR), 14 = 12e+13a+13b,
# taxable income line 15 = 11b - 14.

jurisdiction: federal
tax_year: 2025

tax:
  # Section 1(j)(2) rate schedules for 2025, exactly as published in
  # Rev. Proc. 2024-40, Section 2.01 (Tables 1-4):
  #   Table 1: Married Individuals Filing Joint Returns and Surviving Spouses
  #   Table 2: Heads of Households
  #   Table 3: Unmarried Individuals (other than Surviving Spouses and HoH)
  #   Table 4: Married Individuals Filing Separate Returns
  # OBBBA made the TCJA rate structure permanent but did NOT change the 2025
  # bracket dollar amounts (its extra 10%/12%-bracket inflation bump starts in
  # 2026) — the Rev. Proc. 2024-40 tables are what the 2025 filing season used.
  # Note the HoH 32% bracket starts at $250,500 (not the $250,525 the other
  # unmarried schedules use) — transcribed exactly as published.
  rate_schedules:
    citation:
      source: "Rev. Proc. 2024-40, Section 2.01 (2025 tax rate tables), Tables 1-4"
      url: "https://www.irs.gov/pub/irs-drop/rp-24-40.pdf"
    schedules:
      single:
        - { over: 0, but_not_over: 11925, rate: 0.10 }
        - { over: 11925, but_not_over: 48475, rate: 0.12 }
        - { over: 48475, but_not_over: 103350, rate: 0.22 }
        - { over: 103350, but_not_over: 197300, rate: 0.24 }
        - { over: 197300, but_not_over: 250525, rate: 0.32 }
        - { over: 250525, but_not_over: 626350, rate: 0.35 }
        - { over: 626350, but_not_over: null, rate: 0.37 }
      married_filing_jointly:
        - { over: 0, but_not_over: 23850, rate: 0.10 }
        - { over: 23850, but_not_over: 96950, rate: 0.12 }
        - { over: 96950, but_not_over: 206700, rate: 0.22 }
        - { over: 206700, but_not_over: 394600, rate: 0.24 }
        - { over: 394600, but_not_over: 501050, rate: 0.32 }
        - { over: 501050, but_not_over: 751600, rate: 0.35 }
        - { over: 751600, but_not_over: null, rate: 0.37 }
      married_filing_separately:
        - { over: 0, but_not_over: 11925, rate: 0.10 }
        - { over: 11925, but_not_over: 48475, rate: 0.12 }
        - { over: 48475, but_not_over: 103350, rate: 0.22 }
        - { over: 103350, but_not_over: 197300, rate: 0.24 }
        - { over: 197300, but_not_over: 250525, rate: 0.32 }
        - { over: 250525, but_not_over: 375800, rate: 0.35 }
        - { over: 375800, but_not_over: null, rate: 0.37 }
      head_of_household:
        - { over: 0, but_not_over: 17000, rate: 0.10 }
        - { over: 17000, but_not_over: 64850, rate: 0.12 }
        - { over: 64850, but_not_over: 103350, rate: 0.22 }
        - { over: 103350, but_not_over: 197300, rate: 0.24 }
        - { over: 197300, but_not_over: 250500, rate: 0.32 }
        - { over: 250500, but_not_over: 626350, rate: 0.35 }
        - { over: 626350, but_not_over: null, rate: 0.37 }

  # The published 2025 Tax Table — mandatory for the ORDINARY line 16
  # computation when taxable income is below $100,000. Scope caution (same as
  # 2024.yaml): qualified dividends / capital gains (Qualified Dividends and
  # Capital Gain Tax Worksheet / Schedule D Tax Worksheet), Form 8615, or the
  # Foreign Earned Income Tax Worksheet compute the tax from their own
  # worksheet even below $100,000 — those are OUT OF SCOPE for
  # calc.tax_from_taxable_income; never apply the table to preferential-rate
  # income. Row structure is stable across years. PUBLICATION CHANGE for 2025:
  # the tables booklet is now "Publication 1040" (Cat. No. 46895T) — the old
  # i1040tt--<year>.pdf URL pattern redirects to p1040.pdf; the year-pinned
  # archive copy is irs-prior/p1040--2025.pdf.
  tax_table:
    citation:
      source: >-
        2025 Tax Table, Publication 1040, "TAX AND EARNED INCOME CREDIT
        TABLES" (Cat. No. 46895T), extracted from the 2025 Instructions for
        Form 1040 (worked example: MFJ taxable income $25,300 -> $2,562)
      url: "https://www.irs.gov/pub/irs-prior/p1040--2025.pdf"
    applies_below: 100000
    rounding: half_up
    row_bands:
      - { at_least: 0, below: 5, row_width: 5 }
      - { at_least: 5, below: 25, row_width: 10 }
      - { at_least: 25, below: 3000, row_width: 25 }
      - { at_least: 3000, below: 100000, row_width: 50 }

  tax_computation_worksheet:
    citation:
      source: >-
        2025 Tax Computation Worksheet—Line 16 (Single, Married filing jointly
        / Qualifying surviving spouse, Married filing separately, Head of
        household), from Publication 1040 (2025), page 14
      url: "https://www.irs.gov/pub/irs-prior/p1040--2025.pdf"
    applies_at_or_above: 100000

  # OBBBA SUPERSESSION: Rev. Proc. 2024-40, Section 2.15(1) originally set the
  # 2025 base amounts at $15,000 single/MFS, $30,000 MFJ, $22,500 HoH. OBBBA
  # (P.L. 119-21, enacted 2025-07-04) raised them mid-year; the amounts below
  # are what the published 2025 Form 1040 instructions actually use (line 12e
  # charts and Standard Deduction Worksheet line 3): $15,750 / $31,500 /
  # $23,625. The additional standard deduction for the aged or the blind is
  # UNCHANGED from Rev. Proc. 2024-40 Section 2.15(3): $1,600 per condition
  # per person, increased to $2,000 if the individual is also unmarried and
  # not a surviving spouse. Cross-checked against the instructions' printed
  # chart (Single 1 box = $17,750, 2 = $19,750; MFJ 1-4 boxes = $33,100 /
  # $34,700 / $36,300 / $37,900; MFS 1-4 = $17,350 / $18,950 / $20,550 /
  # $22,150; HoH = $25,625 / $27,625). "Age 65" = born before January 2, 1961.
  # Dependent standard deduction (Rev. Proc. 2024-40 Section 2.15(2)): greater
  # of $1,350 or earned income + $450, capped at the regular amount.
  standard_deduction:
    citation:
      source: >-
        2025 Instructions for Form 1040, line 12e Standard Deduction charts and
        Standard Deduction Worksheet for Dependents (OBBBA, P.L. 119-21,
        amounts — supersede Rev. Proc. 2024-40, Section 2.15(1)); additional
        aged/blind amounts per Rev. Proc. 2024-40, Section 2.15(3)
      url: "https://www.irs.gov/pub/irs-prior/i1040gi--2025.pdf"
    amounts:
      single: 15750
      married_filing_jointly: 31500
      married_filing_separately: 15750
      head_of_household: 23625
    additional_aged_or_blind:
      married: 1600
      unmarried: 2000

