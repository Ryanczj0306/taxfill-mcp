# 402(g) is per PERSON across all employers (traditional + Roth share it),
# 415(c) is per EMPLOYER PLAN (the mega-backdoor door), the HSA limit follows
# the COVERAGE TIER (two self-only people beat one family plan), 125(i) is per
# employee per employer, 132(f) is monthly. Every figure transcribed with a
# verbatim quote from the cited document before authoring.
contribution_limits:
