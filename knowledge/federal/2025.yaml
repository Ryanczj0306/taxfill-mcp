        219(b)(5)(B)(ii) "remains $1,000" (p. 4). Traditional-IRA deduction phase-outs for active
        participants (p. 4): single/HoH $79,000-$89,000; MFJ contributor covered $126,000-$146,000;
        contributor not covered but spouse covered $236,000-$246,000; MFS $0-$10,000 ("not subject to
        an annual cost-of-living adjustment"). Roth IRA MAGI phase-outs (p. 5): single/HoH
        $150,000-$165,000; MFJ $236,000-$246,000; MFS $0-$10,000.
      url: "https://www.irs.gov/pub/irs-drop/n-24-80.pdf"
    limit: 7000
    catch_up_50: 1000
    roth_magi_phaseout:
