    memo: Write "2019 Form 1040" (or "2019 Form 1040-SR") plus your name, address, daytime phone number,
      and SSN on the payment; make the check or money order payable to United States Treasury for the
      full amount due; attach Form 1040-V; don't attach the payment to the return and don't send cash;
      on a joint return, enter the SSN shown first on the return.
  electronic:
  - name: IRS Direct Pay (online transfer directly from your checking or savings account)
    fee: false
    url: https://www.irs.gov/payments
  - name: EFTPS (Electronic Federal Tax Payment System)
    fee: false
    url: https://www.eftps.gov
    enrollment_required: true
  - name: 'Debit card, credit card, or digital wallet (via approved service providers: PAY1040, payUSAtax,
      Official Payments)'
    fee: true
    url: https://www.irs.gov/payments
  cash:
    limit_usd: 1000
    url: https://www.irs.gov/payments
mailing_addresses:
  citation:
    source: 2019 Instructions for Forms 1040 and 1040-SR, "Where Do You File?", pages 107-108; 2019 Instructions
      for Form 1040-NR, "Where To File" (Individuals), page 10
    url: https://www.irs.gov/pub/irs-prior/i1040gi--2019.pdf
