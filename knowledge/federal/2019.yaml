payment_options:
  citation:
    source: 2019 Instructions for Form 1040 (and 1040-SR), "Amount You Owe" / "How To Pay" (Pay Online,
      Pay by Phone, Pay by Cash, Pay by Check or Money Order), page 58
    url: https://www.irs.gov/pub/irs-prior/i1040gi--2019.pdf
  check:
