# Common credits with their 2023 parameters and eligibility predicates.
credits:
  citation:
    source: "2023 Instructions for Schedule 8812 (CTC/ACTC/ODC); Rev. Proc. 2022-38 Section 3.06 (EITC)"
    url: "https://www.irs.gov/pub/irs-prior/i1040s8--2023.pdf"
  child_tax_credit:
    citation:
      source: "Schedule 8812 (Form 1040) 2023 and its Instructions ('What's New', 'Limits on the CTC and ODC')"
      url: "https://www.irs.gov/pub/irs-prior/f1040s8--2023.pdf"
    per_qualifying_child: 2000
    additional_ctc_refundable_cap_per_child: 1600   # the refundable ACTC cap for 2023
    credit_for_other_dependents: 500
    qualifying_child_age_test: "under age 17 at the end of 2023"
    magi_phaseout_threshold:
      married_filing_jointly: 400000
      single: 200000
      married_filing_separately: 200000
      head_of_household: 200000
      qualifying_surviving_spouse: 200000
    phaseout_step: "reduced $50 for each $1,000 (or fraction) of MAGI above the threshold"
  # ── Foreign tax credit (Form 1116) ──
  # Only the §904(j) DE-MINIMIS ELECTION figures live here, because they are the
  # only per-return dollar amounts in the foreign-tax-credit rules that a calc op
  # needs. Everything else about the credit (the §904(a) limitation, the
  # per-category baskets, the 1-back/10-forward carryover) is FORM math and lives
  # in formpacks/federal/<year>/f1116 plus calc.foreign_tax_credit_election.
  #
  # These two figures are STATUTORY and NOT INDEXED. IRC 904(j) was added by
  # P.L. 105-34 (Taxpayer Relief Act of 1997, enacted 1997-08-05) and carries no
  # inflation-adjustment provision, so $300/$600 has been the test since 1998 and
  # is the same in every year pack. They are carried here rather than hardcoded in
  # calc.py so the citation travels with the number (dev plan section 7), and the
  # per-year duplication is deliberate: a future Congress indexing or changing the
  # amount would change it for ONE year forward, not retroactively.
  foreign_tax_credit:
    citation:
      source: >-
        IRC 904(j)(2)(B) verbatim: "the amount of the creditable foreign taxes
        paid or accrued by the individual during the taxable year does not exceed
        $300 ($600 in the case of a joint return)". Restated in the 2023
        Instructions for Form 1116, General Instructions, "Election To Claim the
        Foreign Tax Credit Without Filing Form 1116": "Your total creditable
        foreign taxes aren't more than $300 ($600 if married filing a joint
        return)." Estates and trusts are excluded by IRC 904(j)(3)(D) ("This
        subsection shall not apply to any estate or trust") and by the same
        instructions ("This election isn't available to estates or trusts.").
      url: "https://www.irs.gov/pub/irs-prior/i1116--2023.pdf"
    de_minimis_election:
      # "in the case of a joint return" is LITERAL: only married filing jointly
      # takes $600. A qualifying surviving spouse files as an unmarried
      # individual (it borrows the joint RATE schedule under IRC 1(a)(2)/2(a),
      # it is not a joint return) and married filing separately is not one
      # either, so both take $300.
      creditable_foreign_taxes_limit:
        joint_return: 600
        other: 300
      statute: "IRC 904(j)"
      statute_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section904&num=0&edition=prelim"
      added_by: "P.L. 105-34 (Taxpayer Relief Act of 1997), enacted 1997-08-05"
      inflation_indexed: false
      excluded_entities: [estate, trust]
      # What the election COSTS — IRC 904(j)(1)(B) and (C), verbatim in substance:
      # no tax paid or accrued in an election year may be deemed paid or accrued
      # under 904(c) in any OTHER year, and no tax from any other year may be
      # deemed paid or accrued in an election year. So the 1-back / 10-forward
      # carryover is forfeited for the election year in BOTH directions.
      forfeits_carryback_and_carryforward: true
      claimed_on: "Schedule 3 (Form 1040), Part I, line 1"
  earned_income_tax_credit:
    citation:
      source: "Rev. Proc. 2022-38, Section 3.06 (2023 Earned Income Credit)"
      url: "https://www.irs.gov/pub/irs-drop/rp-22-38.pdf"
    investment_income_limit: 11000
    # keyed by number of qualifying children: 0, 1, 2, 3+ (3+ shares the 2-child earned-income amount)
    by_qualifying_children:
      "0": { earned_income_amount: 7840, max_credit: 600, phaseout_begins_other: 9800, phaseout_begins_mfj: 16370, phaseout_complete_other: 17640, phaseout_complete_mfj: 24210 }
      "1": { earned_income_amount: 11750, max_credit: 3995, phaseout_begins_other: 21560, phaseout_begins_mfj: 28120, phaseout_complete_other: 46560, phaseout_complete_mfj: 53120 }
      "2": { earned_income_amount: 16510, max_credit: 6604, phaseout_begins_other: 21560, phaseout_begins_mfj: 28120, phaseout_complete_other: 52918, phaseout_complete_mfj: 59478 }
      "3+": { earned_income_amount: 16510, max_credit: 7430, phaseout_begins_other: 21560, phaseout_begins_mfj: 28120, phaseout_complete_other: 56838, phaseout_complete_mfj: 63398 }

