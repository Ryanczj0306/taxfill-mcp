# Federal knowledge pack — tax year 2023 (docs/DEV_PLAN.md sections 3, 7, 10).
#
# Tax math lives here as DATA with citations, never hardcoded in engine code
# (the no-LLM-arithmetic rule, dev plan section 10). Every number in this file
# was transcribed from the official IRS document named in its block's
# citation. Do NOT edit a number without re-verifying it against that source
# (irs.gov only; see knowledge/sources.yaml for the source registry).
#
# Loaded and validated by packages/core/src/taxfill_core/knowledge.py.
# Additional top-level blocks (filing thresholds, payment options, mailing
# addresses, credits, effective_law_changes) land in M3; the loader tolerates
# extra blocks so this file can grow without engine changes.

jurisdiction: federal
tax_year: 2023

tax:
  # Section 1(j)(2) rate schedules for 2023, exactly as published in
  # Rev. Proc. 2022-38 (Tables 1-4 of Section 3.01):
  #   Table 1: Married Individuals Filing Joint Returns and Surviving Spouses
  #   Table 2: Heads of Households
  #   Table 3: Unmarried Individuals (other than Surviving Spouses and HoH)
  #   Table 4: Married Individuals Filing Separate Returns
  # `but_not_over: null` marks the top bracket. For income X inside a
  # bracket, tax = (sum of rate x span over all lower brackets)
  #              + rate x (X - over),
  # which reproduces the published "$B plus R% of the excess over $O" rows
  # (e.g. single over $44,725 but not over $95,375: $5,147 plus 22%).
  rate_schedules:
    citation:
      source: "Rev. Proc. 2022-38, Section 3.01 (2023 tax rate tables), Tables 1-4"
      url: "https://www.irs.gov/pub/irs-drop/rp-22-38.pdf"
    schedules:
      single:
        - { over: 0, but_not_over: 11000, rate: 0.10 }
        - { over: 11000, but_not_over: 44725, rate: 0.12 }
        - { over: 44725, but_not_over: 95375, rate: 0.22 }
        - { over: 95375, but_not_over: 182100, rate: 0.24 }
        - { over: 182100, but_not_over: 231250, rate: 0.32 }
        - { over: 231250, but_not_over: 578125, rate: 0.35 }
        - { over: 578125, but_not_over: null, rate: 0.37 }
      married_filing_jointly:
        - { over: 0, but_not_over: 22000, rate: 0.10 }
        - { over: 22000, but_not_over: 89450, rate: 0.12 }
        - { over: 89450, but_not_over: 190750, rate: 0.22 }
        - { over: 190750, but_not_over: 364200, rate: 0.24 }
        - { over: 364200, but_not_over: 462500, rate: 0.32 }
        - { over: 462500, but_not_over: 693750, rate: 0.35 }
        - { over: 693750, but_not_over: null, rate: 0.37 }
      married_filing_separately:
        - { over: 0, but_not_over: 11000, rate: 0.10 }
        - { over: 11000, but_not_over: 44725, rate: 0.12 }
        - { over: 44725, but_not_over: 95375, rate: 0.22 }
        - { over: 95375, but_not_over: 182100, rate: 0.24 }
        - { over: 182100, but_not_over: 231250, rate: 0.32 }
        - { over: 231250, but_not_over: 346875, rate: 0.35 }
        - { over: 346875, but_not_over: null, rate: 0.37 }
      head_of_household:
        - { over: 0, but_not_over: 15700, rate: 0.10 }
        - { over: 15700, but_not_over: 59850, rate: 0.12 }
        - { over: 59850, but_not_over: 95350, rate: 0.22 }
        - { over: 95350, but_not_over: 182100, rate: 0.24 }
        - { over: 182100, but_not_over: 231250, rate: 0.32 }
        - { over: 231250, but_not_over: 578100, rate: 0.35 }
        - { over: 578100, but_not_over: null, rate: 0.37 }

  # The published 2023 Tax Table — mandatory for the ORDINARY line 16
  # computation when taxable income is below $100,000 (the booklet's last
  # row is "99,950 / 100,000" followed by "$100,000 or over — use the Tax
  # Computation Worksheet"). Scope caution, mirroring the booklet's own
  # line 16 note ("See the instructions for line 16 to see if you must use
  # the Tax Table below to figure your tax"): returns with qualified
  # dividends or capital gains (Qualified Dividends and Capital Gain Tax
  # Worksheet / Schedule D Tax Worksheet), Form 8615, or the Foreign Earned
  # Income Tax Worksheet compute line 16 from their own worksheet even
  # below $100,000 — those are OUT OF SCOPE for calc.tax_from_taxable_income;
  # never apply the table to preferential-rate income.
  #
  # Row structure transcribed from the published table (pp. 3-14):
  #   one row  [0, 5)            -> tax 0 for all statuses
  #   rows     [5, 15), [15, 25) -> $10-wide bottom rows (tax 1 and 2)
  #   rows     [25, 3000)        -> $25-wide rows
  #   rows     [3000, 100000)    -> $50-wide rows
  # The published tax for a row equals the rate schedule evaluated at the
  # row MIDPOINT, rounded to the nearest whole dollar with 50 cents rounding
  # UP ("half_up"). Verified against published rows including the rounding
  # edges: row 3,000-3,050 = 303 (302.50 rounds up), row 50-75 = 6 (6.25
  # rounds down to nearest), HoH row 60,000-60,050 = 6,907 (6,906.50 rounds
  # up), MFJ row 95,000-95,050 = 11,521 (11,520.50 rounds up).
  # Footnote on the "Married filing jointly" column: "* This column must
  # also be used by a qualifying surviving spouse."
  tax_table:
    citation:
      source: >-
        2023 Tax Table, "1040 and 1040-SR TAX AND EARNED INCOME CREDIT
        TABLES" (Cat. No. 24327A), from the 2023 Instructions for Form 1040,
        pages 3-14
      url: "https://www.irs.gov/pub/irs-prior/i1040tt--2023.pdf"
    applies_below: 100000
    rounding: half_up
    row_bands:
      - { at_least: 0, below: 5, row_width: 5 }
      - { at_least: 5, below: 25, row_width: 10 }
      - { at_least: 25, below: 3000, row_width: 25 }
      - { at_least: 3000, below: 100000, row_width: 50 }

  # At or above $100,000 the Tax Table does not apply; the published
  # worksheet computes tax as (income x rate) - subtraction_amount, which is
  # algebraically identical to the rate schedules above (the engine uses the
  # rate schedules and shows bracket math). Worksheet subtraction amounts
  # spot-checked: Single 24% row -$6,600.00; MFJ 22% row -$9,385.00;
  # MFS 37% row -$35,043.00; HoH 35% row -$29,711.50.
  tax_computation_worksheet:
    citation:
      source: >-
        2023 Tax Computation Worksheet—Line 16 (Section A: Single,
        B: Married filing jointly / Qualifying surviving spouse,
        C: Married filing separately, D: Head of household), from the 2023
        Instructions for Form 1040, page 15 of the Tax Table booklet
      url: "https://www.irs.gov/pub/irs-prior/i1040tt--2023.pdf"
    applies_at_or_above: 100000

  # Rev. Proc. 2022-38, Section 3.15:
  #   (1) base amounts under section 63(c)(2);
  #   (3) "the additional standard deduction amount under section 63(f) for
  #       the aged or the blind is $1,500. The additional standard deduction
  #       amount is increased to $1,850 if the individual is also unmarried
  #       and not a surviving spouse."
  # One additional amount applies PER condition PER person (a married couple
  # both 65+ where one is blind adds 3 x $1,500).
  standard_deduction:
    citation:
      source: "Rev. Proc. 2022-38, Section 3.15 (Standard Deduction)"
      url: "https://www.irs.gov/pub/irs-drop/rp-22-38.pdf"
    amounts:
      single: 13850
      married_filing_jointly: 27700
      married_filing_separately: 13850
      head_of_household: 20800
    additional_aged_or_blind:
      married: 1500
      unmarried: 1850

  # Schedule SE (Form 1040) 2023, Part I:
  #   line 4a: "multiply line 3 by 92.35% (0.9235)"
  #   line 4c: "If less than $400, stop; you don't owe self-employment tax."
  #   line 7:  "Maximum amount of combined wages and self-employment
  #             earnings subject to social security tax ... for 2023 ...
  #             160,200"
  #   line 10: "Multiply the smaller of line 6 or line 9 by 12.4% (0.124)"
  #   line 11: "Multiply line 6 by 2.9% (0.029)"
  #   line 13: "Multiply line 12 by 50% (0.50)" (deduction for one-half)
  se_tax:
    citation:
      source: "Schedule SE (Form 1040) 2023, Part I, lines 4a-13"
      url: "https://www.irs.gov/pub/irs-prior/f1040sse--2023.pdf"
    net_earnings_factor: 0.9235
    ss_rate: 0.124
    medicare_rate: 0.029
    ss_wage_base: 160200
    minimum_net_earnings: 400

  # High-income surtaxes (Schedule 2 lines 11/12). Both are STATUTORY amounts,
  # unchanged since 2013 and not inflation-indexed, so the same values apply to
  # every supported year. Qualifying surviving spouse is explicit in both maps
  # because the two forms bucket it differently (8959: $200,000 with single/HoH;
  # 8960: $250,000 with MFJ).
  additional_medicare_tax:
    citation:
      source: "IRS Topic No. 560, Additional Medicare Tax (Form 8959): 0.9% of Medicare wages and self-employment income above the filing-status threshold; thresholds statutory under IRC section 3101(b)(2), not indexed"
      url: "https://www.irs.gov/taxtopics/tc560"
    rate: 0.009
    thresholds:
      married_filing_jointly: 250000
      married_filing_separately: 125000
      single: 200000
      head_of_household: 200000
      qualifying_surviving_spouse: 200000
  niit:
    citation:
      source: "IRS Topic No. 559, Net Investment Income Tax (Form 8960): 3.8% of the lesser of net investment income or MAGI above the filing-status threshold; thresholds statutory under IRC section 1411, not indexed"
      url: "https://www.irs.gov/taxtopics/tc559"
    rate: 0.038
    thresholds:
      married_filing_jointly: 250000
      married_filing_separately: 125000
      single: 200000
      head_of_household: 200000
      qualifying_surviving_spouse: 250000

  # Maximum capital gains rate breakpoints under IRC section 1(h), indexed
  # separately under section 1(j)(5): TAXABLE-INCOME ceilings for the 0% and
  # 15% rates on adjusted net capital gain / qualified dividends (20% above
  # the 15% ceiling), with ordinary income stacked first — the Qualified
  # Dividends and Capital Gain Tax Worksheet line 6 / line 13 amounts. NOT
  # equal to the ordinary bracket boundaries; never derive them from the rate
  # schedules. MFS is exactly half of MFJ; a qualifying surviving spouse uses
  # the MFJ amounts (the Rev. Proc. groups surviving spouses with joint returns).
  capital_gains_brackets:
    citation:
      source: "Rev. Proc. 2022-38, Section 3.03 (Maximum Capital Gains Rate)"
      url: "https://www.irs.gov/pub/irs-drop/rp-22-38.pdf"
    max_zero_rate_amount:
      single: 44625
      married_filing_jointly: 89250
      married_filing_separately: 44625
      head_of_household: 59750
      qualifying_surviving_spouse: 89250
    max_15_percent_rate_amount:
      single: 492300
      married_filing_jointly: 553850
      married_filing_separately: 276900
      head_of_household: 523050
      qualifying_surviving_spouse: 553850

  # Social Security Benefits Worksheet parameters (Form 1040 line 6b; line 5b
  # in 2019). Statutory under IRC section 86(c) and never indexed — identical
  # in every year 2019-2024. MFS splits by BEHAVIOR, not just status: lived
  # apart from the spouse ALL year -> the single thresholds (write "D" next to
  # the benefits line on paper returns); lived with the spouse at ANY time ->
  # both tiers are $0 (mfs_living_with_spouse_base) and taxable benefits =
  # min(0.85 x provisional income, 0.85 x benefits). The published worksheet
  # prints the second tier as the line-10 gap ($9,000, or $12,000 for MFJ);
  # the explicit IRC 86(c)(2) adjusted base amounts stored here are
  # arithmetically identical.
  taxable_social_security:
    citation:
      source: "2023 Instructions for Form 1040, Social Security Benefits Worksheet (lines 6a/6b); IRC section 86(c)"
      url: "https://www.irs.gov/pub/irs-prior/i1040gi--2023.pdf"
    base_amount:
      single: 25000
      married_filing_jointly: 32000
      head_of_household: 25000
      qualifying_surviving_spouse: 25000
      married_filing_separately_lived_apart_all_year: 25000
    adjusted_base_amount:
      single: 34000
      married_filing_jointly: 44000
      head_of_household: 34000
      qualifying_surviving_spouse: 34000
      married_filing_separately_lived_apart_all_year: 34000
    mfs_living_with_spouse_base: 0
    inclusion_rate_tier1: 0.50
    inclusion_rate_tier2: 0.85
    max_taxable_share_of_benefits: 0.85

  # Excess social security / tier 1 RRTA withholding credit parameters
  # (Schedule 3 line 11).
  # The cap is PER PERSON: each spouse's box-4 withholding is compared to the
  # max separately, never combined. The credit exists only when MULTIPLE
  # employers together over-withheld; a single employer's excess must be
  # adjusted by that employer (Form 843 if it refuses) and is never claimable
  # on the return. max_withholding = rate x wage base, exact to the cent.
  employee_social_security:
    citation:
      source: "2023 Instructions for Form 1040, Schedule 3 line 11 (Excess Social Security and Tier 1 RRTA Tax Withheld); Pub 15 (2023), social security rate and wage base limit"
      url: "https://www.irs.gov/pub/irs-prior/i1040gi--2023.pdf"
    rate: 0.062
    ss_wage_base: 160200
    max_withholding: 9932.40

  # Section 221 student-loan-interest deduction (Schedule 1). The $2,500 cap
  # is statutory (IRC 221(b)(1)), not indexed. married_filing_separately is
  # deliberately ABSENT: MFS may not take the deduction at all (IRC 221(e)(2))
  # — a missing status means not-allowed. Reduction = tentative deduction
  # (min(cap, interest paid)) x (MAGI - start) / (end - start); the span is
  # $15,000 ($30,000 MFJ) in every supported year.
  student_loan_interest:
    citation:
      source: "Rev. Proc. 2022-38, Section 3.30 (Interest on Education Loans)"
      url: "https://www.irs.gov/pub/irs-drop/rp-22-38.pdf"
    max_deduction: 2500
    phaseout:
      single: { start: 75000, end: 90000 }
      head_of_household: { start: 75000, end: 90000 }
      qualifying_surviving_spouse: { start: 75000, end: 90000 }
      married_filing_jointly: { start: 155000, end: 185000 }

  # Form 8863 education credits. AOTC: 100% of the first $2,000 of qualified
  # expenses PER STUDENT plus 25% of the next $2,000 (max $2,500 per student),
  # 40% refundable unless the Form 8863 line 7 under-age-24 exception applies;
  # its phaseout is statutory (IRC 25A(i)(4)) and identical in all years.
  # LLC: 20% of up to $10,000 of expenses PER RETURN, nonrefundable. MFS may
  # claim NEITHER credit (rule — hence no MFS keys). "other" = single /
  # head_of_household / qualifying_surviving_spouse.
  education_credits:
    citation:
      source: "2023 Instructions for Form 8863 (Education Credits)"
      url: "https://www.irs.gov/pub/irs-prior/i8863--2023.pdf"
    aotc:
      per_student_cap: 2500
      first_dollar_cap: 2000
      second_rate: 0.25
      refundable_fraction: 0.40
      phaseout:
        married_filing_jointly: { start: 160000, end: 180000 }
        other: { start: 80000, end: 90000 }
    llc:
      per_return_expense_cap: 10000
      rate: 0.20
      phaseout:
        married_filing_jointly: { start: 160000, end: 180000 }
        other: { start: 80000, end: 90000 }

  # Premium Tax Credit (Form 8962) — the ARPA 0%-8.5% applicable percentage
  # table, extended to taxable years 2023-2025 by IRA section 12001(a) and
  # expiring after TY2025 (never extrapolate forward). CITATION WARNING: the
  # pre-IRA indexed table printed in Rev. Proc. 2022-34 Section 2.01
  # (1.92%-9.12%) is INOPERATIVE for 2023 — never transcribe it; the extension
  # is confirmed in Rev. Proc. 2023-29, footnote 1
  # (https://www.irs.gov/pub/irs-drop/rp-23-29.pdf).
  # Mechanics (Worksheet 2 + Table 2): line 5 = household income / FPL x 100,
  # TRUNCATED to an integer (3.997 -> 399, never rounded; enter literally 401
  # when over 400%); the applicable figure equals linear interpolation within
  # the band rounded HALF-UP to 4 decimals (349 -> 0.0723, 399 -> 0.0848);
  # 0.0850 flat from 400% up — no eligibility cliff, but the repayment
  # LIMITATION vanishes at 400% (full excess APTC is repaid). Initial/final
  # are stored as DECIMAL fractions (the Rev. Proc. prints percent form).
  ptc:
    citation:
      source: "2023 Instructions for Form 8962 (Table 2, Worksheet 2, Tables 1-1 to 1-3, Table 5); Rev. Proc. 2023-29, footnote 1 (IRA section 12001(a) extends the ARPA table to 2023-2025)"
      url: "https://www.irs.gov/pub/irs-prior/i8962--2023.pdf"
    applicable_percentage_table:
      - { fpl_pct_at_least: 0, fpl_pct_less_than: 150, initial: 0.00, final: 0.00 }
      - { fpl_pct_at_least: 150, fpl_pct_less_than: 200, initial: 0.00, final: 0.02 }
      - { fpl_pct_at_least: 200, fpl_pct_less_than: 250, initial: 0.02, final: 0.04 }
      - { fpl_pct_at_least: 250, fpl_pct_less_than: 300, initial: 0.04, final: 0.06 }
      - { fpl_pct_at_least: 300, fpl_pct_less_than: 400, initial: 0.06, final: 0.085 }
      - { fpl_pct_at_least: 400, fpl_pct_less_than: null, initial: 0.085, final: 0.085 }
    federal_poverty_line:
      guidelines_year: 2022   # Form 8962 line 4: for 2023, the 2022 federal poverty lines are used
      contiguous_48_and_dc:
        household_size: { 1: 13590, 2: 18310, 3: 23030, 4: 27750, 5: 32470, 6: 37190, 7: 41910, 8: 46630 }
        per_additional_person: 4720
      alaska:
        household_size: { 1: 16990, 2: 22890, 3: 28790, 4: 34690, 5: 40590, 6: 46490, 7: 52390, 8: 58290 }
        per_additional_person: 5900
      hawaii:
        household_size: { 1: 15630, 2: 21060, 3: 26490, 4: 31920, 5: 37350, 6: 42780, 7: 48210, 8: 53640 }
        per_additional_person: 5430
    # Table 5 repayment limitation, keyed by line 5 (integer FPL%): "Single"
    # vs every other filing status (MFJ, MFS, HoH and QSS all use the higher
    # column). Last row = 400% or more: NO limitation, line 28 left blank.
    repayment_limitation:
      - { fpl_band_lt: 200, single: 350, other: 700 }
      - { fpl_band_lt: 300, single: 900, other: 1800 }
      - { fpl_band_lt: 400, single: 1500, other: 3000 }
      - { fpl_band_lt: null, single: null, other: null }
    no_400_pct_cliff: true

  # Form 2441 child & dependent care credit (IRC 21) — Phase G item G2. Every
  # figure transcribed from the year-pinned IRS PDFs named in the citation and
  # re-verified against IRC 21 (govinfo.gov, 2023 ed.). Caps are STATUTORY
  # (IRC 21(c)(1)/(2)), not inflation-indexed. Percentage slide (form line 8
  # table): 35% for AGI up to $15,000, minus 1 point per $2,000 OR FRACTION
  # THEREOF of AGI over $15,000, floor 20% for AGI over $43,000 (the table's
  # "43,000 — No limit = .20" row). Bracket semantics: 'Over X — but not over
  # Y', so AGI exactly at a boundary keeps the HIGHER rate (exactly $15,000 =
  # .35; exactly $43,000 = .21) — the engine rounds the excess UP to the next
  # $2,000. The caps are reduced by employer dependent care benefits actually
  # deducted or excluded (Form 2441 line 27 minus line 28 -> line 29), NOT by
  # the exclusion ceiling itself. Nonrefundable — limited by tax via the
  # line 10 Credit Limit Worksheet.
  dependent_care:
    citation:
      source: "2023 Instructions for Form 2441; 2023 Form 2441 line 8 table; IRC 21(a)(2), (c), (d), (e)"
      url: "https://www.irs.gov/pub/irs-prior/i2441--2023.pdf"
    expense_cap:
      one_qualifying_person: 3000
      two_or_more_qualifying_persons: 6000
    phase_downs:
      # 1 point per $2,000 (or fraction) of AGI over $15,000; .21 at
      # 41,000-43,000, then "43,000 — No limit = .20".
      - { starts_above_agi: 15000, from_rate: 0.35, to_rate: 0.20 }
    refundable_if_us_abode: false
    earned_income_limitation: >-
      Form 2441 line 6: the credit base is the SMALLEST of the capped qualified
      expenses (line 3), your earned income (line 4), and — married filing
      jointly — your spouse's earned income (line 5; all others enter the
      line 4 amount).
    deemed_income_per_month:
      one_qualifying_person: 250
      two_or_more_qualifying_persons: 500
    student_spouse_rule: >-
      A spouse (or the taxpayer) who was a full-time student — enrolled
      full-time during some part of each of 5 calendar months of 2023 — or was
      physically or mentally incapable of self-care is DEEMED to have earned
      income of $250 per month ($500 with two or more qualifying persons) for
      each such month or part month (IRC 21(d)(2)); only one spouse may use the
      deemed amount for any given month, and a spouse who also worked that
      month uses the HIGHER of actual or deemed earned income.
    married_filing_separately_note: >-
      Generally, married persons must file a joint return to claim the credit.
      A married-filing-separately filer is treated as unmarried (and may claim
      the credit, checking the Form 2441 married-filing-separately checkbox)
      ONLY if ALL of: they lived apart from the spouse during the last 6 months
      of 2023; their home was the qualifying person's main home for more than
      half the year; and they paid more than half the cost of keeping up that
      home for the year.
    dependent_care_benefits:
      exclusion_max: 5000        # Form 2441 line 21
      exclusion_max_mfs: 2500

# ─────────────────────────────────────────────────────────────────────────────
# M3 filing-logistics & benefits blocks. Every number below was fetched from the
# cited irs.gov source and adversarially re-verified against that page (no value
# from memory). Filing thresholds were additionally cross-checked against the
# standard_deduction block above and reconcile exactly.

# Pub 501 (2023) "Table 1 / Chart A — For Most Taxpayers": the gross-income level
# at or above which a return is required, by status and age. Non-elderly amounts
# equal that status's standard deduction; each 65+ person adds the additional
# standard deduction ($1,850 unmarried / $1,500 married). MFS is the exception:
# $5 regardless of age.
filing_thresholds:
  citation:
    source: "IRS Publication 501 (2023), Table 1 (Filing Requirements Chart for Most Taxpayers), page 2"
    url: "https://www.irs.gov/pub/irs-prior/p501--2023.pdf"
  amounts:
    single: { under_65: 13850, age_65_or_older: 15700 }
    married_filing_jointly: { both_under_65: 27700, one_spouse_65_or_older: 29200, both_spouses_65_or_older: 30700 }
    married_filing_separately: { any_age: 5 }
    head_of_household: { under_65: 20800, age_65_or_older: 22650 }
    qualifying_surviving_spouse: { under_65: 27700, age_65_or_older: 29200 }

# 2023 Instructions for Form 1040, "Amount You Owe" / "How To Pay" (p. 61).
# The 2023 check payee wording is "United States Treasury".
payment_options:
  citation:
    source: '2023 Instructions for Form 1040 (and 1040-SR), Line 37 "Amount You Owe" / "How To Pay", page 61'
    url: "https://www.irs.gov/pub/irs-prior/i1040gi--2023.pdf"
  check:
    payee: "United States Treasury"
    memo: >-
      Write "2023 Form 1040" (or "2023 Form 1040-SR") plus your name, address,
      daytime phone number, and SSN (on a joint return, the SSN shown first) on
      the payment; enter the amount as $ XXX.XX with no dashes; attach Form
      1040-V; don't staple the payment to the return and don't send cash.
  electronic:
    - { name: "IRS Direct Pay (from a checking/savings account)", fee: false, url: "https://www.irs.gov/payments" }
    - { name: "EFTPS (Electronic Federal Tax Payment System)", fee: false, enrollment_required: true, url: "https://www.eftps.gov" }
    - { name: "Debit card, credit card, or digital wallet (via approved processors)", fee: true, url: "https://www.irs.gov/payments" }
  cash:
    limit_usd: 1000
    url: "https://www.irs.gov/paywithcash"

# 2023 Instructions for Form 1040 "Where Do You File?" (p. 113) for the 1040,
# and the 2023 Instructions for Form 1040-NR "Where To File" (p. 11). The 1040
