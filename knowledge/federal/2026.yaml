# Federal knowledge pack — TAX YEAR 2026
#
# ⚠️ PROVISIONAL — PLANNING / PROJECTION ONLY. NOT FOR FILING A RETURN. ⚠️
#
# Authored 2026-08-04 (ROADMAP Phase H5) for in-year budgeting. This header was
# rewritten 2026-09-27 (Phase J JT0c) after re-reading every source it names.
# Every number below is cited to an irs.gov primary source that exists today. A
# block whose authority does not exist yet is ABSENT, not guessed: calc raises its
# prescriptive "no block for this year" error rather than return a fabricated figure.
#
# WHAT THE PACK RESTS ON (as of 2026-09-27)
#   Final and in force:
#     * Rev. Proc. 2025-32, the 2026 inflation adjustments (rate_schedules,
#       standard_deduction, tax_computation_worksheet, capital_gains_brackets).
#     * Notice 2025-67 (IRB 2025-49), the 2026 retirement-plan and IRA limits
#       (contribution_limits).
#     * Pub 15 (2026), Circular E (the wage base, supplemental withholding).
#     * Form 1040-ES (2026), Cat. No. 11340T, Created 2/12/26
#       (irs.gov/pub/irs-prior/f1040es--2026.pdf). It is the pass-2 source below.
#       Its own final revision makes its form pack filing-grade
#       (filing_grade_basis: own_final_revision); the Q4 voucher is due Jan. 15, 2027.
#     * Form W-2 (2026), Created 1/7/26, and the 2026 General Instructions for
#       Forms W-2 and W-3 (irs-prior/fw2--2026.pdf, irs-prior/iw2w3--2026.pdf).
#   Drafts only (irs.gov/pub/irs-dft/, projection-grade until each final posts;
#   footer "Created" dates):
#     * Form 1040 (8/19/26); Schedules 1 (4/24/26), 1-A (6/16/26), 2 (4/27/26),
#       3 (4/27/26), 3-A (6/24/26), A (5/12/26), B (4/7/26), D (4/1/26),
#       SE (4/27/26); Forms 8949 (4/1/26), 8959 (5/27/26), 8889 (4/30/26),
#       8606 (4/21/26).
#     * Pub 1040 (2026), Tax and Earned Income Credit Tables, draft dated Aug 28,
#       2026 (posted 09/16/2026).
#   Not posted in any form (irs-prior/<form>--2026.pdf answers 404 and the drafts
#   page carries no 2026 edition):
#     * the 2026 Instructions for Form 1040 (i1040gi; the draft on the page is the
#       2025 edition) and Pub 501 (2026) (likewise the 2025 edition);
#     * the Schedule 1-A and Schedule 3-A instructions.
#   scripts/check_finals.py watches irs-prior for the finals (.github/workflows/finals.yml)
#   and opens the `ty2026-finals: re-pin now` issue when one posts.
#
# WHAT IS OUTSTANDING before this pack can back a filed return
#   1. The absent blocks (provisional.blocks_deliberately_absent):
#      taxable_social_security, student_loan_interest, education_credits,
#      filing_thresholds, payment_options, mailing_addresses and deadlines. Each needs its 2026 source and two-pass verification (JT1, JT2).
#   2. tax_table.row_bands still rests on a carried-forward STRUCTURE
#      (provisional.still_assumed). The draft Pub 1040 (2026) now prints the 2026 Tax
#      Table, so its rows are a projection-grade check; the final booklet decides.
#   3. Every form line a 2026 return uses is read off the FINAL 2026 face (form_lines
#      below). The drafts renumber: the draft Form 1040 puts Schedule 1-A line 44 on
#      13a and QBI on 13b, and adds 12f, 24a-24c and 32a-32c.
#   4. The finals of Form 1040 and its schedules, i1040gi, Pub 501 and Pub 1040. By
#      the 2025 precedent the form finals and Pub 1040 post by mid-January 2027 and
#      i1040gi around late February (an inference, not a guarantee).
#   Phase J JT6 then re-pins the draft packs to the finals and lifts the marker.
#
# TWO-PASS VERIFICATION (DEV_PLAN section 7) — pass 2 DONE 2026-08-04 against Form
# 1040-ES (2026), an independent, already-published 2026 IRS form:
#   * "2026 Tax Rate Schedules" (Schedules X / Y-1 / Y-2 / Z) — ALL FOUR match the
#     Rev. Proc. 2025-32 transcription line for line, including the HoH-vs-unmarried
#     $201,750/$201,775 and $256,200/$256,225 offsets and the MFS $384,350 top.
#   * "Standard deduction amount increased" chart — $32,200 MFJ/QSS, $24,150 HoH,
#     $16,100 single or MFS; dependent floor "greater of $1,350, or earned income
#     plus $450" — matches Rev. Proc. 2025-32 section 4.14 exactly.
#   * 2026 Self-Employment Tax and Deduction Worksheet line 5 "Social security tax
#     maximum income $184,500" — matches Pub 15 (2026).
# So rate_schedules, standard_deduction, and the wage base are two-source verified.
#
# NOTE on `provisional.second_pass.verified_blocks` below: entries are paths
# relative to the `tax:` mapping. A bare name (`rate_schedules`) is a whole block;
# a dotted name (`se_tax.ss_wage_base`) is one field inside a block. This differs
# from `blocks_deliberately_absent`, which is bare names only — anyone walking
# verified_blocks with a plain getattr must split on "." first.

jurisdiction: federal
tax_year: 2026

provisional:
  status: planning_only
  authored: "2026-08-04"
  second_passes:
    - date: "2026-08-04"
      source: "Form 1040-ES (2026), Cat. No. 11340T (Feb 12, 2026) — 2026 Tax Rate Schedules + standard-deduction chart + SE worksheet line 5"
      url: "https://www.irs.gov/pub/irs-prior/f1040es--2026.pdf"
      verified_blocks: [rate_schedules, standard_deduction, se_tax.ss_wage_base, employee_social_security.ss_wage_base]
      result: "all figures matched the Rev. Proc. 2025-32 / Pub 15 (2026) transcription exactly; zero discrepancies"
    # JF8: tax.obbba_schedule_1a (pass 1 = the statute, see the block).
    - date: "2026-09-27"
      source: "Form W-4 (2026), Cat. No. 10220Q (Created 12/8/25) — Step 4(b) Deductions Worksheet lines 1a, 1b, 1c, 3a and 3b"
      url: "https://www.irs.gov/pub/irs-pdf/fw4.pdf"
      verified_blocks: [obbba_schedule_1a.tips, obbba_schedule_1a.overtime, obbba_schedule_1a.car_loan_interest, obbba_schedule_1a.senior_deduction]
      result: >-
        the caps and MAGI thresholds match the statute: tips "up to $25,000" under $150,000
        ($300,000 MFJ); overtime "up to $12,500 ($25,000 if married filing jointly)"; vehicle loan
        interest "up to $10,000" under $100,000 ($200,000 MFJ); seniors "$6,000" under $75,000
        ($150,000 MFJ). The worksheet prints no phase-out slopes or rounding.
    # JT1a: tax.ptc (pass 1 = Rev. Proc. 2025-25 + the 2025 HHS guidelines + Rev. Proc. 2025-32 §2.04).
    - date: "2026-09-27"
      source: "Draft Form 8962 (2026), Created 4/21/26 — lines 5-6 and 28-29"
      url: "https://www.irs.gov/pub/irs-dft/f8962--dft.pdf"
      source_status: draft
      draft_created: "4/21/26"
      verified_blocks: [ptc.no_400_pct_cliff, ptc.repayment_limitation]
      result: >-
        line 6 "Did you enter 401% on line 5?" with "Yes. You are not eligible to take the PTC" — the
        bounded top band; lines 28 and 29 "Reserved for future use" — no repayment limitation. The
        applicable percentages and the FPL table are not printed on the form.
    - date: "2026-09-27"
      source: "Draft Schedule 1-A (Form 1040) 2026, Created 6/16/26 — Parts I-VI"
      url: "https://www.irs.gov/pub/irs-dft/f1040s1a--dft.pdf"
      source_status: draft
      draft_created: "6/16/26"
      verified_blocks: [obbba_schedule_1a]
      result: >-
        every figure, slope and rounding direction matches the statute and the 2025 block: $25,000
        (line 9), $150,000/$300,000 and x $100 (lines 11/14, round down on 13); $12,500/$25,000
        (21), the same phase-out (23-26); $10,000 (30), $100,000/$200,000 (32), round UP (34),
        x $200 (35); $75,000/$150,000 (38), 6% (40), $6,000 (41), "born before January 2, 1962"
        (42a/42b); married must file jointly for Parts II, III and V only.
  still_assumed: "tax_table.row_bands (the final 2026 Publication 1040 is not posted; a draft, dated Aug 28, 2026, is)"
  reason: >-
    The 2026 return forms and the Tax Table booklet exist only as drafts, and the
    Form 1040 instructions are not posted at all; the inflation-adjustment
    revenue procedure, Circular E and Form 1040-ES are final. The
    numbers that ARE here are citable and projection-grade (what will I owe /
    what should I set aside / married-vs-separate comparisons), but the absent
    blocks mean a bottom line built on this pack can OMIT real items — e.g. a
    student's education credits price at $0 until the 2026 education_credits
    block publishes — so any consumer must surface which engaged inputs went
    unestimated (the estimator emits 'NOT ESTIMATED' assumptions for them).
    Insufficient for filing in every case.
  blocks_deliberately_absent:
    - taxable_social_security
    - student_loan_interest
    - education_credits
    - filing_thresholds
    - payment_options
    - mailing_addresses
    - deadlines

tax:
  # Section 1(j)(2) rate schedules for 2026, transcribed exactly as published in
  # Rev. Proc. 2025-32, SECTION 4 ("2026 ADJUSTED ITEMS"), .01 Tax Rate Tables:
  #   TABLE 1: section 1(j)(2)(A) Married Individuals Filing Joint Returns and Surviving Spouses
  #   TABLE 2: section 1(j)(2)(B) Heads of Households
  #   TABLE 3: section 1(j)(2)(C) Unmarried Individuals (other than Surviving Spouses and HoH)
  #   TABLE 4: section 1(j)(2)(D) Married Individuals Filing Separate Returns
  # NOTE the numbering change vs prior years: the 2026 items live in SECTION 4 of
  # Rev. Proc. 2025-32 (its section 3 instead MODIFIES the 2025 items of
  # Rev. Proc. 2024-40 — that is where the OBBBA 2025 standard deductions were
  # formally substituted). Do not cite "section 2.01" for a 2026 figure.
  #
  # Transcription was verified by recomputing every published bracket base from
  # the bracket below it (each "$X plus Y% of the excess over Z" line must equal
  # the cumulative tax at Z) — all four tables are internally consistent:
  #   MFJ:  2,480 -> 11,600 -> 35,932 -> 82,048 -> 116,896 -> 206,583.50
  #   HoH:  1,770 ->  7,740 -> 16,155 -> 39,207 ->  56,631 -> 191,171
  #   Single/MFS: 1,240 -> 5,800 -> 17,966 -> 41,024 -> 58,448 -> then
  #               192,979.25 (single, top starts $640,600) /
  #               103,291.75 (MFS,   top starts $384,350 = half of MFJ's)
  # Quirks transcribed as published, NOT normalized: the HoH 24%/32%/35%
  # thresholds are $201,750 / $256,200 while the unmarried and MFS schedules use
  # $201,775 / $256,225 (the same $25 offset the 2025 tables carried at
  # $250,500 vs $250,525).
  rate_schedules:
    citation:
      source: >-
        Rev. Proc. 2025-32, Section 4.01 (2026 tax rate tables), Tables 1-4;
        independently verified line-for-line against the "2026 Tax Rate Schedules"
        (Schedules X, Y-1, Y-2, Z) in Form 1040-ES (2026), Cat. No. 11340T
        (https://www.irs.gov/pub/irs-prior/f1040es--2026.pdf) — zero discrepancies
      url: "https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"
    schedules:
      single:
        - { over: 0, but_not_over: 12400, rate: 0.10 }
        - { over: 12400, but_not_over: 50400, rate: 0.12 }
        - { over: 50400, but_not_over: 105700, rate: 0.22 }
        - { over: 105700, but_not_over: 201775, rate: 0.24 }
        - { over: 201775, but_not_over: 256225, rate: 0.32 }
        - { over: 256225, but_not_over: 640600, rate: 0.35 }
        - { over: 640600, but_not_over: null, rate: 0.37 }
      married_filing_jointly:
        - { over: 0, but_not_over: 24800, rate: 0.10 }
        - { over: 24800, but_not_over: 100800, rate: 0.12 }
        - { over: 100800, but_not_over: 211400, rate: 0.22 }
        - { over: 211400, but_not_over: 403550, rate: 0.24 }
        - { over: 403550, but_not_over: 512450, rate: 0.32 }
        - { over: 512450, but_not_over: 768700, rate: 0.35 }
        - { over: 768700, but_not_over: null, rate: 0.37 }
      married_filing_separately:
        - { over: 0, but_not_over: 12400, rate: 0.10 }
        - { over: 12400, but_not_over: 50400, rate: 0.12 }
        - { over: 50400, but_not_over: 105700, rate: 0.22 }
        - { over: 105700, but_not_over: 201775, rate: 0.24 }
        - { over: 201775, but_not_over: 256225, rate: 0.32 }
        - { over: 256225, but_not_over: 384350, rate: 0.35 }
        - { over: 384350, but_not_over: null, rate: 0.37 }
      head_of_household:
        - { over: 0, but_not_over: 17700, rate: 0.10 }
        - { over: 17700, but_not_over: 67450, rate: 0.12 }
        - { over: 67450, but_not_over: 105700, rate: 0.22 }
        - { over: 105700, but_not_over: 201750, rate: 0.24 }
        - { over: 201750, but_not_over: 256200, rate: 0.32 }
        - { over: 256200, but_not_over: 640600, rate: 0.35 }
        - { over: 640600, but_not_over: null, rate: 0.37 }

  # PROVISIONAL BLOCK — STRUCTURE carried forward, numbers are not.
  # The 2026 Tax Table booklet does not exist yet. The row-band structure below
  # is byte-identical in every shipped pack 2019-2025 (5 / 10 / 25 / 50-dollar
  # bands up to $100,000, midpoint rule, half-up rounding), and the engine
  # reproduces published table values from it exactly for those years — so it is
  # the best-supported structure for 2026, but it is an assumption about
  # PRESENTATION, not a cited 2026 figure. The tax it produces is the
  # Rev. Proc. 2025-32 rate schedule evaluated at the row midpoint, which is how
  # the IRS generates the table. Differences from the eventual published 2026
  # table, if any, are single dollars — acceptable for a projection, NOT for a
  # filed line 16. Re-verify against Publication 1040 (2026) when it publishes.
  # Same scope caution as every year: never apply the table to preferential-rate
  # income (QDCGT worksheet / Schedule D worksheet / Form 8615 / FEI worksheet).
  tax_table:
    citation:
      source: >-
        PROVISIONAL (authored 2026-08-04): the 2026 Tax Table (Publication 1040)
        is not yet published. Underlying tax authority is Rev. Proc. 2025-32,
        Section 4.01; the row-band structure is carried forward unchanged from
        the published 2019-2025 tables, which the engine reproduces exactly.
        MUST be re-verified against Publication 1040 (2026) before any 2026
        return is filed.
      url: "https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"
    applies_below: 100000
    rounding: half_up
    row_bands:
      - { at_least: 0, below: 5, row_width: 5 }
      - { at_least: 5, below: 25, row_width: 10 }
      - { at_least: 25, below: 3000, row_width: 25 }
      - { at_least: 3000, below: 100000, row_width: 50 }

  # At or above $100,000 the tax comes straight from the rate schedule (the
  # published Tax Computation Worksheet is exactly that arithmetic), so this
  # block needs no 2026-specific source beyond Rev. Proc. 2025-32. The
  # $100,000 boundary is structural and has been stable for decades.
  tax_computation_worksheet:
    citation:
      source: >-
        Rev. Proc. 2025-32, Section 4.01 rate schedules (the Tax Computation
        Worksheet is the published presentation of the same section 1(j)(2)
        arithmetic). The $100,000 table/worksheet boundary is carried forward
        from the published 2019-2025 instructions; re-verify with the 2026
        Instructions for Form 1040.
      url: "https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"
    applies_at_or_above: 100000

  # Rev. Proc. 2025-32, Section 4.14: (1) in general — MFJ/SS $32,200,
  # HoH $24,150, unmarried $16,100, MFS $16,100. (3) aged or blind — $1,650 per
  # condition per person, increased to $2,050 if the individual is also
  # unmarried and not a surviving spouse. (2) dependent cap — greater of $1,350
  # or earned income + $450 (not modeled as its own field here; same shape as
  # prior years' Standard Deduction Worksheet for Dependents).
  # CAUTION for 2025 -> 2026 comparisons: the 2025 amounts in Rev. Proc. 2024-40
  # were superseded mid-year by OBBBA; 2026's were published post-OBBBA and
  # already reflect it. Nonresident aliens generally get NO standard deduction
  # (the India treaty article 21(2) exception aside) — that restriction lives in
  # the engine, not in this block.
  standard_deduction:
    citation:
      source: >-
        Rev. Proc. 2025-32, Section 4.14(1) (Standard Deduction, 2026) and Section 4.14(3)
        (aged or blind); the base amounts independently verified against the "Standard
        deduction amount increased" chart in Form 1040-ES (2026), Cat. No. 11340T
        (https://www.irs.gov/pub/irs-prior/f1040es--2026.pdf) — $32,200 / $24,150 / $16,100
      url: "https://www.irs.gov/pub/irs-drop/rp-25-32.pdf"
    amounts:
      single: 16100
      married_filing_jointly: 32200
      married_filing_separately: 16100
      head_of_household: 24150
    additional_aged_or_blind:
      married: 1650
      unmarried: 2050

  # Rates are statutory (IRC 1401: 12.4% OASDI + 2.9% HI; 92.35% net-earnings
  # factor; $400 filing floor) and unchanged. The only year-varying number is
  # the social security wage base: $184,500 for 2026, stated in Pub 15 (2026),
  # "Tax rates and the social security wage base limit" ("The social security
  # wage base limit is $184,500."), and repeated at the motion-picture-project
  # and Form W-2 checks. Schedule SE (2026) line 7 will restate it — re-verify
  # when that form publishes.
  se_tax:
    citation:
      source: >-
        Pub 15 (2026), Circular E, "Tax rates and the social security wage base
        limit" — social security wage base limit $184,500 for 2026; rates and
        the 92.35% factor statutory under IRC sections 1401/1402(a)(12).
        Corroborated by Form 1040-ES (2026) "2026 Self-Employment Tax and Deduction
        Worksheet" line 5 ("Social security tax maximum income $184,500")
      url: "https://www.irs.gov/pub/irs-pdf/p15.pdf"
    net_earnings_factor: 0.9235
    ss_rate: 0.124
    medicare_rate: 0.029
    ss_wage_base: 184500
    minimum_net_earnings: 400

  # Employee side (IRC 3101(a)): 6.2% up to the same $184,500 base, so the
  # maximum employee withholding for 2026 is 184,500 x 0.062 = $11,439.00
  # exactly (2025: $10,918.20 on $176,100). This is the block that makes the
  # F/J-to-H-1B FICA switch computable: F-1/J-1 student wages are exempt under
  # IRC 3121(b)(19); H-1B wages are not.
  employee_social_security:
    citation:
      source: >-
        Pub 15 (2026), Circular E — employee social security rate 6.2% (IRC
        3101(a)) and the $184,500 social security wage base limit for 2026
        (same base confirmed by Form 1040-ES (2026) SE worksheet line 5);
        maximum withholding 184,500 x 6.2% = $11,439.00
      url: "https://www.irs.gov/pub/irs-pdf/p15.pdf"
    rate: 0.062
    ss_wage_base: 184500
    max_withholding: 11439.00
    # Employee Medicare withholding, Pub 15 (2026) Section 9 (p. 29): "The tax
    # rate for Medicare is 1.45% (amount withheld) each for the employee and
    # employer (2.9% total)" — no wage base; "you must withhold a 0.9%
    # Additional Medicare Tax from wages you pay to an employee in excess of
    # $200,000 in a calendar year" (pp. 29-30) — per employer, no
    # filing-status qualifier (the status thresholds are the Form 8959 TAX).
    medicare_rate: 0.0145
    additional_medicare_withholding_rate: 0.009
    additional_medicare_withholding_threshold: 200000

  # ── H4 projection parameters (statutory, both citable to PUBLISHED 2026
  # documents — the same class as rate_schedules, NOT carried forward) ──────
  estimated_tax_safe_harbor:
    citation:
      source: >-
        Form 1040-ES (2026) (Cat. No. 11340T, Feb 12, 2026), page 1: General Rule item 1 ("You expect
        to owe at least $1,000 in tax for 2026, after subtracting your withholding and refundable
        credits"), item 2a ("90% of the tax to be shown on your 2026 tax return"), item 2b ("100% of
        the tax shown on your 2025 tax return. Your 2025 tax return must cover all 12 months");
        Special Rules, Higher income taxpayers ("If your adjusted gross income (AGI) for 2025 was more
        than $150,000 ($75,000 if your filing status for 2026 is married filing separately),
        substitute 110% for 100% in (2b)"); restated at page 8, Line 12b. Statutory: IRC 6654(d).
      url: "https://www.irs.gov/pub/irs-prior/f1040es--2026.pdf"
    current_year_pct: 0.90
    prior_year_pct: 1.00
    high_income_prior_year_pct: 1.10
    high_income_agi_threshold: 150000
    high_income_agi_threshold_mfs: 75000
    underpayment_de_minimis: 1000
    farmers_fishermen_note: >-
      Farming and fishing: if at least two-thirds of gross income for 2025 or 2026 is from farming or
      fishing, 66 2/3% substitutes for the 90% current-year prong — and the 110% higher-income rule
      does NOT apply (Form 1040-ES (2026), page 1, Special Rules). Not computed by the op; quoted.

  # Pub 15 (2026) Section 7 — the flat rate is the employer's OPTION and only when
  # both Treas. Reg. 31.3402(g)-1(a)(7)(i)(B) and (C) hold; otherwise the aggregate
  # procedure is required (P-017). Re-read against Pub 15 (2025) on 2026-09-25: the
  # section 7 wording of items 1-2 and the $1 million rule is identical.
  supplemental_withholding:
    citation:
      source: >-
        Pub 15 (2026) ("For use in 2026", Dec 15, 2025), Section 7 Supplemental Wages, p. 24: the
        optional flat 22% rate for separately-identified supplemental wages, and the mandatory rate on
        the excess over $1 million ("the excess is subject to withholding at 37% (or the highest rate
        of income tax for the year)"), applied without regard to Form W-4; What's New, p. 2: "The
        withholding rate on supplemental wages remains 22% (37% if supplemental wages paid to an
        employee during the calendar year exceed $1 million) because P.L. 119-21 permanently extended
        the individual income tax rates."
      url: "https://www.irs.gov/pub/irs-pdf/p15.pdf"
    flat_rate: 0.22
    high_rate: 0.37
    high_threshold: 1000000
    flat_rate_optional: true
    flat_rate_conditions:
      - paragraph: "31.3402(g)-1(a)(7)(i)(B)"
        quote: >-
          The supplemental wages are either not paid concurrently with regular wages or are
          separately stated on the payroll records of the employer
      - paragraph: "31.3402(g)-1(a)(7)(i)(C)"
        quote: >-
          Income tax has been withheld from regular wages of the employee during the calendar year
          of the payment or the preceding calendar year
    conditions_citation:
      source: >-
        Treas. Reg. 31.3402(g)-1 (eCFR, current text, read 2026-09-25; last amended 2020-10-06 per
        the eCFR version history, so the same text governs every payment in 2026): (a)(7)(i) "The
        employer may determine withholding upon supplemental wages under this paragraph (a)(7) if
        three conditions are met", (A) being that the (a)(2) mandatory rate does not apply and
        (B)/(C) quoted in flat_rate_conditions; (a)(6)(i) the aggregate procedure is required
        otherwise; (a)(2) the mandatory flat rate on the excess over $1,000,000.
      url: "https://www.ecfr.gov/current/title-26/section-31.3402(g)-1"
    method_if_conditions_fail: aggregate
    aggregate_rule: >-
      The employer is required to determine withholding upon supplemental wages under this paragraph
      (a)(6) if paragraph (a)(2) of this section does not apply to the payment or portion of the
      payment and if paragraph (a)(7) of this section may not be used with respect to the payment.
    employer_fallback: >-
      Pub 15 (2026) section 7, Supplemental wages identified separately from regular wages, item 2: "If
      you didn't withhold income tax from the employee's regular wages in the current or immediately
      preceding calendar year, use method 1b." Item 1 reads condition (C) as the employer's own
      withholding: "If you withheld income tax from an employee's regular wages in the current or
      immediately preceding calendar year, you can use one of the following methods".
    mandatory_rate_rule: >-
      If a supplemental wage payment, when added to all supplemental wage payments previously made by
      one employer (as defined in paragraph (a)(3) of this section) to an employee during the calendar
      year, exceeds $1,000,000, the rate used in determining the amount of withholding on the excess
      (including any excess which is a portion of a supplemental wage payment) shall be equal to the
      highest rate of tax applicable under section 1 for such taxable years beginning in such
      calendar year.

  # Both surtaxes are STATUTORY and not inflation-indexed (unchanged since 2013;
  # OBBBA did not touch them), so the 2026 values are identical to every shipped
  # year. Same citations as 2019-2025.
  additional_medicare_tax:
    citation:
      source: "IRS Topic No. 560, Additional Medicare Tax (Form 8959): 0.9% of Medicare wages and self-employment income above the filing-status threshold; thresholds statutory under IRC section 3101(b)(2), not indexed"
      url: "https://www.irs.gov/taxtopics/tc560"
    rate: 0.009
    thresholds:
      married_filing_jointly: 250000
      married_filing_separately: 125000
      single: 200000
      head_of_household: 200000
      qualifying_surviving_spouse: 200000
  # CORRECTION 2026-08-26: qualifying_surviving_spouse was 200000 here — the ONLY
  # shipped year that got it wrong (2019-2025 all carry 250000), and the value
  # appears to have been copied from the additional_medicare_tax block directly
  # above, where QSS really is 200000. That asymmetry is the whole reason the
  # schema makes all five statuses explicit instead of aliasing QSS to MFJ.
  # Two independent primary sources: IRC 1411(b)(1) — "in the case of a taxpayer
  # making a joint return under section 6013 OR A SURVIVING SPOUSE (as defined in
  # section 2(a)), $250,000" — and the Instructions for Form 8960 (2025), both the
  # "Application to Individuals" bullets and the Line 14 threshold table, which
  # print "Qualifying surviving spouse $250,000". Left uncorrected the threshold was
  # too LOW, which enlarges the MAGI excess, so it OVERSTATED a 2026 QSS filer's
  # NIIT by up to 3.8% x $50,000 = $1,900.
  niit:
    citation:
      source: "IRS Topic No. 559, Net Investment Income Tax (Form 8960): 3.8% of the lesser of net investment income or MAGI above the filing-status threshold; thresholds statutory under IRC section 1411, not indexed. QSS threshold re-verified against IRC 1411(b)(1) and the Line 14 threshold table in the Instructions for Form 8960 (2025)"
      url: "https://www.irs.gov/taxtopics/tc559"
    rate: 0.038
    thresholds:
      married_filing_jointly: 250000
      married_filing_separately: 125000
      single: 200000
      head_of_household: 200000
      qualifying_surviving_spouse: 250000

