  # ── OBBBA Schedule 1-A additional deductions (TY2026) — Phase J JF8 ────────
  # PASS 1, THE STATUTE (P.L. 119-21), read 2026-09-27 at uscode.house.gov. None of
  # the four is indexed, so 2026 carries the 2025 figures (test-pinned):
  #   IRC 224(b)(1) "shall not exceed $25,000"; 224(b)(2)(A) "reduced (but not below
  #     zero) by $100 for each $1,000 by which the taxpayer's modified adjusted gross
  #     income exceeds $150,000 ($300,000 in the case of a joint return)"; 224(h) no
  #     deduction "for any taxable year beginning after December 31, 2028".
  #   IRC 225(b)(1) "shall not exceed $12,500 ($25,000 in the case of a joint
  #     return)"; 225(b)(2)(A) the same $100-per-$1,000 phase-out; 225(g) the same end.
  #   IRC 163(h)(4)(C)(i) "shall not exceed $10,000"; (C)(ii) "reduced (but not below
  #     zero) by $200 for each $1,000 (or portion thereof) by which the modified
  #     adjusted gross income of the taxpayer for the taxable year exceeds $100,000
  #     ($200,000 in the case of a joint return)" — "or portion thereof" is the
  #     round-UP; (A) years "beginning after December 31, 2024, and before January 1,
  #     2029"; (B) "indebtedness incurred by the taxpayer after December 31, 2024".
  #   IRC 151(d)(5)(C)(i) "$6,000 for each qualified individual"; (ii) "attained age
  #     65 before the close of the taxable year"; (iii) "reduced (but not below zero)
  #     by 6 percent of so much of the taxpayer's modified adjusted gross income as
  #     exceeds $75,000 ($150,000 in the case of a joint return)".
