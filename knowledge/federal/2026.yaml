# ── Charitable contributions for 2026 (Phase J JF9) ────────────────────────────
# TOP-LEVEL on purpose (the contribution_limits precedent: the sources-coverage
# meta-test walks top-level keys). Every figure read 2026-09-27 off its primary
# source:
#   IRC 170(p) (P.L. 119-21 §70424(a)): "if the individual does not elect to
#     itemize deductions for such taxable year, the deduction under this section
#     shall be equal to the deduction, not in excess of 1,000 ($2,000 in the case
#     of a joint return), which would be determined under this section if the only
#     charitable contributions taken into account in determining such deduction
#     were contributions made in cash during such taxable year (determined without
#     regard to subsections (b)(1)(G)(ii), (b)(1)(I), and (d)(1)) to an
#     organization described in section 170(b)(1)(A) and not- (1) to an
#     organization described in section 509(a)(3), or (2) for the establishment of
#     a new, or maintenance of an existing, donor advised fund". (uscode.house.gov's
#     prelim text prints "1,000" without its dollar sign; the W-4 below prints
#     "$1,000".)
#   IRC 170(b)(1)(I) (§70425(a)(1)), the 0.5-percent floor: "allowed only to the
#     extent that the aggregate of such contributions exceeds 0.5 percent of the
#     taxpayer's contribution base for the taxable year"; contribution base is AGI
#     "computed without regard to any net operating loss carryback" (170(b)(1)(H)).
#   Both apply "to taxable years beginning after December 31, 2025" (§§70424(b),
#     70425(c)).
#   TEOS deductibility codes (irs.gov): PC "A public charity", POF "A private
#     operating foundation" and FED (a federal governmental unit) carry "50% (60% for
#     cash contributions)"; so do SO / SONFI / SOUNK, the supporting organizations
#     170(p)(1) excludes. PF "30% (generally)", LODGE "30%"; GROUP, UNKWN, EO and
#     FORGN "Depends on various factors" — the op needs the caller's own
#     determination for those.
#   Rev. Proc. 2025-32 §4.33(2): the Rev. Proc. 90-12 "$5, $25, and $50 guidelines
#     ... are $13.90, $69.50 and $139" for 2026. Their shape (a benefit worth "not
#     more than 2 percent of the payment" or the $50 figure, "whichever is less";
#     token items for a payment of at least the $25 figure costing no more than the
#     $5 figure) as IRS INFO 2010-0172 states it.
#   Pub 526 (2025): "membership benefits if you get them in return for an annual
#     payment of $75 or less"; IRC 6115(a): "a quid pro quo contribution in excess of
#     $75"; IRC 170(f)(8)(A): "any contribution of $250 or more".
# PASS 2: the FINAL Form W-4 (2026) Step 4(b) Deductions Worksheet — line 12 "Cash
# gifts to charities. If you take the standard deduction, enter cash contributions
# up to $1,000 ($2,000 if married filing jointly)" and line 6d "Enter contributions
# in excess of 0.5% (0.005) of your total income" — and the draft 2026 Form 1040
# line 12f / Form 1040-NR line 12b "Charitable contribution deduction for
# non-itemizers" (form_lines below). Not recorded in provisional.second_passes:
# those paths name blocks under `tax`, and this block is top-level.
charitable_contributions:
  citation:
    source: >-
      IRC 170(p) (P.L. 119-21 §70424) and 170(b)(1)(I) (§70425), taxable years beginning after
      December 31, 2025; Rev. Proc. 2025-32 §4.33(2); Pub 526 (2025), Membership fees or dues;
      IRC 6115(a); IRC 170(f)(8)(A) and (C); checked against Form W-4 (2026) Step 4(b) lines 12
      and 6d
    url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section170&num=0&edition=prelim"
  effective: "taxable years beginning after December 31, 2025 (P.L. 119-21 §§70424(b), 70425(c))"
