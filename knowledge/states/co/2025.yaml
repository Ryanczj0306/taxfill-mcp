payment:
  check_payee: Colorado Department of Revenue ("Make your check or money order payable to 'Colorado Department of
    Revenue' and clearly write your Social Security number and '2025 DR 0104' on the memo line"; keep a copy of the
    money order or note the check number with your tax records; if you file electronically but pay by mail, complete
    form DR 0900 and mail it with your payment)
  web_pay_url: https://www.colorado.gov/revenueonline
  note: After submitting the return on Revenue Online you are offered an online payment (a small processing fee may
    apply); paper filers may still pay electronically. Unpaid balances are billed, and a payment plan can be set
    up as instructed on the bill.
deadlines:
  filing_due_date: '2026-04-15'
  automatic_extension: An automatic extension to file is granted until October 15, but there is no extension to
    pay (use form DR 0158-I to pay before filing). Revenue Online accepts returns as timely filed until midnight
    on the due date; mailed returns and payments must be postmarked by April 15. If a due date falls on a weekend
    or legal holiday it moves to the next business day. Taxpayers abroad on the due date mark the "Abroad on due
    date" box.
  citation:
    source: Colorado DOR — 2025 Book 104, "Due Date" ("Your Colorado income tax return and payment for any tax owed
      are due April 15... An automatic extension to file is granted until October 15, but there is no extension to
      pay. If you need to make a payment before filing, see form DR 0158 in this book.")
    url: https://tax.colorado.gov/sites/tax/files/documents/Book104_2025.pdf
