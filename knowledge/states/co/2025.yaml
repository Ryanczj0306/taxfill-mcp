unverified:
- Exact statutory residency wording (domicile definition and the >6-month 'six-month rule') comes from CO DOR Residency
  Status / Individual Income Tax Guide HTML pages as in the 2023/2024 packs; the 2025 booklet confirms the DR 0104PN
  proration and the residency-box mechanics but does not restate the six-month statutory test — confirm the statutory
  wording at the DOR.
- 'Online payment portal URL: the 2025 booklet references ''Colorado.gov/RevenueOnline'' (a redirect alias) rather
  than printing a full canonical https URL; the exact current canonical URL should be confirmed at the DOR.'
- The 2025 DR 0104CN Colorado child tax credit / family affordability tax credit per-child tables and AGI ceilings,
  the 2025 DR 0347 child-and-dependent-care percentages, and the 2025 DR 0104PTC (Property Tax/Rent/Heat Rebate)
  figures were NOT fetched. The 2024 figures were deliberately NOT carried forward — resolve them from the 2025 DR
  0104CN / DR 0347 / 104PTC Book before claiming.
- DR 0104EZ eligibility criteria for 2025 were not fetched (the booklet's Who Must File names DR 0104EZ as an option
  for full-year residents) — confirm at the DOR.
- 'Internal inconsistency in the 2025 booklet, recorded rather than resolved: the "Worksheet for taxable incomes
  over $50,000" is captioned "Colorado Taxable Income from Form 104 line 11", but Colorado Taxable Income is Line
  12 on the 2025 DR 0104 (Line 11 is the DR 0104AD subtractions). The Line 13 instructions and the tax-table header
  both point at line 12, and the standalone 2025 form confirms line 12 = Colorado Taxable Income, so the worksheet
  caption is a stale label. Use Line 12.'
tax:
  citation:
    source: '2025 Book 104, Colorado Individual Income Tax Filing Guide (Book104_2025.pdf) — Line 13 instructions: "The
      income tax rate is currently 4.4%. Full-year residents should refer to the tax table in this booklet."; "2025
      Colorado Income Tax Table with tax rate of 4.4%"; the "Worksheet for taxable incomes over $50,000" — "Multiply
      by 4.4% X .044"; DR 0104 Line 1 = "Federal Taxable Income from your federal income tax form: 1040, 1040 SR, or
      1040 SP line 15"; Line 12 = Colorado Taxable Income (line 10 subtotal minus line 11 DR 0104AD subtractions). Printed
      2025 table rows verified at 4.4%: $5,100-$5,200 -> $227; $21,600-$21,700 -> $953; $45,100-$45,200 -> $1,987; $49,900-$50,000
      -> $2,198 (each = 4.4% of the $100 band midpoint, rounded). Second pass: the standalone 2025 DR 0104 form PDF
      (revision "DR 0104 (10/03/25)") prints the same structure — line 1 federal taxable income, line 12 "Colorado Taxable
      Income, subtract line 11 from line 10", line 13 "Colorado Tax from tax table or the DR 0104PN line 36" — both
      passes agree.'
    url: https://tax.colorado.gov/sites/tax/files/documents/Book104_2025.pdf
  flat_rate: 0.044
  base: federal_taxable_income
  tax_line: 'DR 0104 Line 13 (Colorado Tax): full-year residents take the amount from the 2025 booklet tax table (built
    at 4.4%) for Line 12 Colorado Taxable Income (= Line 10 subtotal minus Line 11 DR 0104AD subtractions); for taxable
    income over $50,000 the booklet worksheet multiplies Line 12 by 4.4% (.044); part-year residents and nonresidents
    transfer the apportioned tax from DR 0104PN line 36.'
  exemptions: {}
  notes:
  - 'Rate change: the 2025 rate is 4.4% (.044) — BACK UP from the temporarily reduced 4.25% of tax year 2024, and
    equal to the 2023 rate. The 2025 DR 0104 Book prints 4.4% three independent ways (the Line 13 instructions "The
    income tax rate is currently 4.4%", the "2025 Colorado Income Tax Table with tax rate of 4.4%" header, and the
    over-$50,000 worksheet''s "Multiply by 4.4% X .044"), and the printed booklet is the sole authority for the year''s
    rate — never substitute a TABOR-adjusted figure from another year.'
  - 'Colorado starts from federal TAXABLE income (DR 0104 Line 1, Form 1040 line 15) — the federal standard/itemized
    deduction is already embedded, so Colorado has no exemptions and no separate standard deduction. (Colorado does
    ADD BACK part of a large federal deduction: DR 0104 Line 4, for filers with federal AGI over $300,000.)'
  - '2025 line renumbering: additions are Lines 2-7, Line 8 is "Reserved for future use", Other Additions moved to
    Line 9, subtotal Line 10 (sum of lines 1-7 and line 9), DR 0104AD subtractions Line 11, Colorado Taxable Income
    Line 12, Colorado Tax Line 13 (2024: subtotal 9, subtractions 10, taxable income 11, tax 12; 2023: taxable income
    10, tax 11). Never carry a line number between years.'
  - 'The DR 0104 form itself does not print a multiplication — Line 13 says to use the tax table (or the DR 0104PN
    apportionment). For 2025 the printed table stops at $50,000 (2024: $100,000) and the worksheet covers taxable
    incomes over $50,000. The table is built at 4.4% but its $100-band midpoint rounding can differ from raw multiplication
    by a dollar or two; the printed table row controls on the filed form.'
  - 'Not modeled by calc.state_tax: Line 14 Alternative Minimum Tax, Line 15 recapture of prior-year credits, the
    Line 17 nonrefundable credits (DR 0104CR line 65) and Line 31 refundable credits (DR 0104CR line 26), and the
    TABOR State Sales Tax Refund on Lines 34-38 (Modified AGI is computed there solely to size the refund and does
    not affect the tax).'
