# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 DR 0104 Book (rate printed three
# ways: Line 12 instructions "currently 4.25%", the 2024 tax table header, and the
# over-$100,000 worksheet X .0425 — the 2024 rate is 4.25%, down from 4.4% in 2023)
# and the standalone 2024 DR 0104 form PDF (tax.colorado.gov). Three test vectors
# reproduce printed booklet tax-table rows exactly.
tax:
  citation:
    source: '2024 Book 104, Colorado Individual Income Tax Filing Guide (DR 0104 Book) — Line 12 instructions: "The
      income tax rate is currently 4.25%" (the document is the year-pinned 2024 filing guide); "2024 Colorado Income
      Tax Table with tax rate of 4.25%"; tax-over-$100,000 worksheet "Multiply by 4.25% X .0425"; DR 0104 Line 1 = Federal
      Taxable Income from Form 1040/1040-SR/1040-SP line 15; "Colorado income tax is based on your federal taxable income,
      which has already considered your deductions"; Line 11 = Colorado Taxable Income (line 9 subtotal minus line 10
      subtractions). Booklet table rows verified at 4.25%: $5,100-$5,200 -> $219; $30,800-$30,900 -> $1,311; $49,900-$50,000
      -> $2,123 (each = 4.25% of the band midpoint). Second pass: the standalone 2024 DR 0104 form PDF prints the same
      line structure (line 1 federal taxable income, line 11 Colorado Taxable Income, line 12 Colorado Tax from tax
      table or DR 0104PN line 36).'
    url: https://tax.colorado.gov/sites/tax/files/documents/DR0104_book_2024.pdf
  flat_rate: 0.0425
  base: federal_taxable_income
  tax_line: 'DR 0104 Line 12 (Colorado Tax): full-year residents take the amount from the 2024 booklet tax table (built
    at 4.25%) for Line 11 Colorado Taxable Income (= Line 9 subtotal minus Line 10 subtractions); the tax-over-$100,000
    worksheet multiplies Line 11 by 4.25% (.0425); part-year residents and nonresidents use the apportioned tax from
    the DR 0104PN.'
  exemptions: {}
  notes:
  - 'Rate change: the 2024 rate is 4.25% (down from 4.4% in 2023) — printed three ways in the 2024 DR 0104 Book (Line
    12 instructions, the 2024 tax table header, and the over-$100,000 worksheet''s X .0425).'
  - Colorado starts from federal TAXABLE income (DR 0104 Line 1) — the federal standard/itemized deduction is already
    embedded, so Colorado has no exemptions or separate standard deduction.
  - '2024 line renumbering: additions are Lines 2-8 (new Line 5 business-meals addback), subtotal Line 9, subtractions
    Line 10, Colorado Taxable Income Line 11, Colorado Tax Line 12 (2023: taxable income Line 10, tax Line 11).'
  - The DR 0104 form itself does not print a multiplication — Line 12 says to use the tax table (or the DR 0104PN
    apportionment). The booklet table is built at 4.25% but its $100-band midpoint rounding can differ from raw multiplication
    by a few dollars; the printed table row controls on the filed form.
