unverified:
- The nonresident/part-year due date and mailing addresses were not separately read from the 2025 RI-1040NR
  instruction booklet; they are assumed identical to the resident return (4/15/2026; refund to 02908-5806,
  with-payment to 02908-5807). Confirm at the DOR via the RI-1040NR booklet.
- Treaty conformity is inferred from the absence of any treaty add-back on the 2025 RI Schedule M AND on the new
  RI Schedule HR1 (whose four add-backs are business deductions under P.L. 119-21) rather than from an explicit RI
  statement that treaty-exempt income is excluded. The Schedule HR1 line list was read from the instructions'
  WHAT'S NEW summary, not from the Schedule HR1 form itself. If a specific treaty article is at issue, or if the
  filer has business income touched by IRC 163(j)/174A/179(b)/181, confirm at the DOR.
- The 2025 RI Tax Table booklet was not re-read for this pack; the "use the Tax Table below $100,000, the Tax
  Computation Worksheet at or above $100,000" mandate is carried forward from the 2024 pack and is consistent with
  the 2025 instructions' Line 8 wording ("Enter the RI income tax from the RI Tax Table or Computation Worksheet").
  The $100,000 boundary itself was NOT re-confirmed against the 2025 booklet.
- The statutory authority for the RI EITC percentage (R.I. Gen. Laws section 44-30-2.6(c)(2)(N)) was not re-derived
  from the session law text; the 16% figure is printed in the cited 2025 RI Schedule EIC instructions.
