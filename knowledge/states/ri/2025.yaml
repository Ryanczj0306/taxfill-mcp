        "Exemption Amount: Multiply the number of exemptions in the box by $5,100"). RI Schedule E counts yourself
        plus spouse plus dependents in ONE total; every exemption is worth the same $5,100 base reduction subtracted
        from income before the rate applies. Zero if someone else can claim you as a dependent ("NOTE: If someone
        else can claim you on their return, your exemption amount is zero."). Phases out when Line 3 modified
        federal AGI exceeds $254,250 (see notes).'
    dependent:
      amount: 5100
      note: Dependents are counted in the same RI Schedule E total at the same $5,100 per exemption (there is no
        separate dependent rate). Shipping personal and dependent at $5,100 each reproduces RI-1040 Line 6 = $5,100
        x (taxpayer/spouse count + dependents count). Subject to the same $254,250 modified-federal-AGI phase-out.
  standard_deduction:
    single: 10900
    married_filing_jointly: 21800
    married_filing_separately: 10900
    head_of_household: 16350
  notes:
  - 'Base guidance: Supply 2025 Form RI-1040, Line 3 ''Modified Federal Adjusted Gross Income'' (Line 1 federal AGI
    from Federal Form 1040 or 1040-SR, line 11, combined with Line 2 net modifications from RI Schedule M; with no
    modifications Line 3 equals federal AGI). Do NOT subtract anything yourself: the op subtracts the shipped RI
    standard deduction (Line 4) and the shipped $5,100-per-person exemptions (Line 6) to reach RI TAXABLE INCOME
    (Line 7), then applies the rate schedule.'
  - 'Adjudication note (two-pass): base is federal_agi — RI-1040 starts from federal AGI (line 1) and taxable_base
    is Line 3 modified federal AGI (federal AGI +/- RI Schedule M modifications, and for 2025 +/- RI Schedule HR1
    add-backs); the op subtracts the standard deduction and the $5,100-per-exemption Line 6 amount.'
  - '2025 indexation: the three-bracket structure is unchanged from 2024; the breakpoints rose to $79,900/$181,650
    (from $77,450/$176,050), the standard deduction to $10,900/$21,800/$10,900/$16,350 (from
    $10,550/$21,150/$10,575/$15,850), the exemption to $5,100 (from $4,950), and the phase-out threshold to $254,250
    (from $246,450) with the increment rising to $7,250 (from $7,050). The 3.75/4.75/5.99% RATES are unchanged.'
  - 'MFS standard-deduction quirk RESOLVED in 2025: for 2024 the married-filing-separately standard deduction was
    $25 HIGHER than the single amount ($10,575 vs $10,550) — an artifact of independent rounding. For 2025 both are
    $10,900. Do not carry the 2024 asymmetry forward.'
  - 'Single rate schedule for every filing status: the 2025 Rhode Island rate schedule is captioned ''FOR ALL FILING
    STATUS TYPES'' (the ADV 2025-22 advisory calls it the "uniform tax rate schedule, which is used by all filers")
    — the same three brackets (3.75% to $79,900; 4.75% to $181,650; 5.99% above) apply to Single, MFJ, MFS, HoH and
    Qualifying widow(er); the schedule is duplicated per status here. Qualifying widow(er)/surviving spouse maps to
    married_filing_jointly: the RI standard-deduction list gives Qualifying Widow(er) the same $21,800 as Married
    Joint, so the mapping is exact.'
  - 'Tax-table mandate below $100,000: RI-1040 Line 8 takes the tax from "the RI Tax Table or Computation
    Worksheet". The table uses $50 bands computed at the band midpoint, so bracket math may differ by a few dollars
    within a table band; the FILED form must use the table below the booklet''s threshold. The $100,000 boundary is
    carried forward from the 2024 pack and was not re-confirmed against the 2025 Tax Table booklet — see
    `unverified`.'
  - 'Standard-deduction and exemption PHASE-OUT is NOT modeled: if RI-1040 Line 3 (modified federal AGI) exceeds
    $254,250, BOTH the standard deduction and the $5,100 exemptions phase down in 20-percentage-point steps (factors
    0.8000/0.6000/0.4000/0.2000) per $7,250 increment of the excess (rounded UP to a whole increment), and both are
    $0 once the excess is more than $29,000 (i.e. Line 3 above $283,250 — the range ADV 2025-22 prints as "$254,250
    to $283,250"). This op ships the full amounts — taxpayers with Line 3 over $254,250 must use the Standard
    Deduction Worksheet and Exemption Worksheet on the inside back cover of the 2025 instructions instead.'
  - 'Rhode Island does not allow the use of federal itemized deductions. 2025 RI-1040 instructions, Line 4 reads
    "Rhode Island does not allow the use of federal itemized deductions" — every filer takes the RI standard
    deduction shipped here; there is no itemized alternative to model.'
  - If someone else can claim you as a dependent on their return, your RI exemption amount is zero (2025 RI-1040
    instructions, Line 6 NOTE) — not modeled; such filers should be computed with zero exemptions.
  - 'NEW FOR 2025 and NOT MODELED — RI Schedule HR1 (Individual): Rhode Island decouples from four federal
    deductions enacted by P.L. 119-21 (H.R.1, 119th Cong. — the OBBBA) and ADDS THEM BACK to Rhode Island income:
    the business interest expense deduction (IRC 163(j)), the section 174A amortization adjustment for research and
    experimental expenditures, depreciation of business assets (IRC 179(b)), and the qualified sound recording
    production deduction (IRC 181). A filer with any of those federal deductions has a Rhode Island base HIGHER
    than their federal AGI, and must add the Schedule HR1 amount into the taxable_base supplied to this op. This
    matters for the same OBBBA-year returns the federal TY2025 pack set covers.'
  - taxable_base must be RI-1040 Line 3 (Modified Federal AGI = federal AGI plus/minus net RI Schedule M
    modifications, plus any RI Schedule HR1 add-backs). Schedule M modifications (out-of-state municipal bond
    interest add-back, US-government-interest subtraction, the social security modification, and the
    pension/401(k)/403(b)/annuity modification — which for TY2025 allows up to $50,000 of federally taxable
    retirement income to be subtracted, with federal-AGI limits of $107,000 single/HoH/MFS and $133,750 MFJ) are
    NOT computed by this op; with no modifications Line 3 equals federal AGI.
  - 'Printed-constant rounding in the rate schedule: the second bracket''s "Pay" constant is EXACT for 2025 —
    $79,900 x 3.75% = $2,996.25 to the cent, unlike 2024 where the printed $2,904.38 sat $0.005 above the exact
    $2,904.375. The third constant still carries the half-cent: printed $7,829.38 vs exact $7,829.375
    ($2,996.25 + $101,750 x 4.75% = $2,996.25 + $4,833.125). This pack''s brackets use the exact marginal math.'
  - Rhode Island's personal and dependent exemptions ARE base reductions (subtracted from income on Line 6 before
    the rate applies), so they are shipped as exemptions. By contrast, RI's credits — the 16% RI earned income
    credit (Line 14d, RI Schedule EIC line 41), 25% of the federal child and dependent care credit (RI Schedule I,
    carried to Line 9a), credit for taxes paid to other states (Line 9b), and the RI-1040H property-tax relief
    circuit breaker (Line 14c, max $700 for 2025) — are subtracted from TAX, not income, and are NOT applied by
    this op.
  - 'No mid-year 2025 rate change: the 3.75/4.75/5.99% structure and the $79,900/$181,650 breakpoints are the final
    figures, printed in the November 2025 ADV 2025-22 advisory and in the Revised 11/2025 instructions that the
    2026 filing season uses.'
