# RI state knowledge — tax year 2025. Fetched + cited from the RI DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
#
# TWO-PASS VERIFICATION: every key figure below was drafted from the FINAL "2025 INSTRUCTIONS
# FOR FILING RI-1040" (Revised 11/2025, posted 12/2025) — Line 4 standard-deduction list,
# Line 6 exemption amount, Line 8 tax, RI Schedule EIC/I, Where and When to File — then
# independently re-derived from a SECOND final official document: RI Division of Taxation
# ADVISORY **ADV 2025-22** (November 3, 2025), whose "Uniform tax rate schedule for Tax Year
# 2025" table and by-tax-year standard-deduction / exemption / phase-out tables are printed
# specifically so the 2025 and 2026 figures can be told apart. Both passes agree on every
# figure with zero discrepancies.
#
# SOURCING NOTE (why the rate-and-worksheets page is NOT the primary citation): the
# "2025 Tax Rate and Worksheets" PDF the DOR serves under a `_d` filename is stamped
# "DRAFT 10/01/2025" on its face. Its figures happen to match the two final sources
# above exactly, so it is cited only as corroboration — never as the authority. Prefer the
# instructions booklet and the ADV advisory, both of which are final.
#
# HEADLINE 2025 ITEMS. Every indexed amount moved: brackets $79,900/$181,650 (from
# $77,450/$176,050), standard deduction $10,900/$21,800/$10,900/$16,350, exemption $5,100
# (from $4,950), phase-out threshold $254,250 (from $246,450) with a $7,250 increment (from
# $7,050). The 3.75/4.75/5.99% RATES are unchanged, as is the 16% RI EITC and the 25% child
# and dependent care percentage. Two structural items are new:
#   * NEW RI SCHEDULE HR1 — Individual: Rhode Island DECOUPLES from four federal deductions
#     enacted by P.L. 119-21 (H.R.1, 119th Cong. — the OBBBA) and adds them back: the
#     business interest expense deduction (IRC 163(j)), the section 174A amortization
#     adjustment for research and experimental expenditures, depreciation of business assets
#     (IRC 179(b)), and the qualified sound recording production deduction (IRC 181). This is
#     the first RI add-back schedule aimed at the OBBBA and it is NOT modeled by this pack —
#     see notes.
#   * The MFS standard deduction now EQUALS the single amount ($10,900 each). For 2024 it was
#     deliberately $25 HIGHER than single ($10,575 vs $10,550); that quirk is gone.
# Also: the RI-1040H property-tax-relief maximum credit rises to $700 (from $675) with the
# household-income ceiling at $40,730 (from $39,275), and starting with TY2025 the
# pension/401(k)/403(b)/annuity modification allows up to $50,000 of federally taxable
# retirement income to be subtracted.
jurisdiction: states/ri
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'The RI-1040 resident return starts from federal adjusted gross income (2025 RI-1040 Line 1 = federal
  AGI from Federal Form 1040 or 1040-SR, line 11; instructions Line 3 "Modified Federal Adjusted Gross Income:
  Determine your modified federal adjusted gross income by combining the amount on line 1 with the amount on line
  2"), and the General Instructions state that the Rhode Island income tax is imposed on the federal taxable income
  of a resident. RI taxable income is then built only via the RI Schedule M modifications and — new for 2025 — the
  RI Schedule HR1 add-backs. NEITHER schedule adds back income that is exempt from federal tax under a U.S. income
  tax treaty: Schedule M''s increasing modifications are the same list as 2024 (out-of-state municipal bond interest,
  RI fiduciary adjustment, Family Education Account / Tuition Savings Program / Scituate Medical Savings Account
  recaptures, bonus depreciation, recapture of previously-claimed tax-credit income, pass-through entity tax deducted
  federally, unemployment compensation not in federal AGI, taxable PPP loan amount), and the new Schedule HR1
  add-backs are FOUR BUSINESS DEDUCTIONS ONLY (IRC 163(j) business interest, 174A research and experimental
  amortization, 179(b) depreciation, 181 sound recording) enacted by P.L. 119-21 — none of them touches treaty-exempt
  income. Because treaty-exempt income is already excluded from federal AGI and RI has no add-back of it, it flows
  through and is not re-taxed by Rhode Island. Therefore RI conforms (treaty-exempt income is not re-taxed).'
citation:
  source: '2025 INSTRUCTIONS FOR FILING RI-1040 (for full year Rhode Island residents filing Form RI-1040), Revised
    11/2025 — RI Division of Taxation: WHAT''S NEW FOR TAX YEAR 2025 (p. I-1, inflation adjustments + the new RI
    Schedule HR1 P.L. 119-21 add-backs), Who Must File / Resident & 183-day domicile definitions (p. I-1), Where
    and When to File (postmarked by Wednesday, April 15, 2026; refund returns to 02908-5806, with-payment returns
    to 02908-5807), Line 3 Modified Federal AGI, Line 4 standard-deduction list ($10,900 Single / $21,800 Married
    Joint / $21,800 Qualifying Widow(er) / $10,900 Married Separate / $16,350 Head of Household), Line 6 "Exemption
    Amount: Multiply the number of exemptions in the box by $5,100" with the $254,250 phase-out pointer, Line 7 RI
    Taxable Income, Line 8 "Rhode Island Income Tax: Enter the RI income tax from the RI Tax Table or Computation
    Worksheet", RI Schedule EIC Line 40 "The Rhode Island percentage is 16%", RI Schedule I Line 21 "Multiply the
    amount on line 20 by 25%"'
  url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2025-12/2025%201040R%20Instructions%20122025.pdf
starts_from: federal AGI (Federal Form 1040/1040-SR, line 11) — RI-1040 Line 1; RI taxable income then computed
  via RI Schedule M modifications and the new RI Schedule HR1 add-backs, the RI standard deduction, and RI exemptions
# DEV_PLAN §7.2 effective_law_changes — the typed delta registry (schema shipped in
# knowledge.py long before any pack used it; this is the FIRST data instance repo-wide,
# D2c). The same facts were already in this pack's header prose; the typed block is what
# lets state_scope surface the delta instead of an agent re-reading comments.
# modeled: false = the engine does NOT compute the HR1 add-backs; the taxable_base a
# caller passes to calc.state_tax must already include them.
effective_law_changes:
- description: >-
    NEW RI Schedule HR1 — Individual (first RI add-back schedule aimed at P.L. 119-21,
    the OBBBA): Rhode Island DECOUPLES from four federal business deductions and adds
    them back to RI income — the business interest expense deduction (IRC 163(j)), the
    section 174A research and experimental amortization adjustment, depreciation of
    business assets (IRC 179(b)), and the qualified sound recording production deduction
    (IRC 181). None of the four touches treaty-exempt income (see treaty_note).
  status: final_form_published
  lookup_path: >-
    RI Schedule HR1 — Individual and its instructions inside the 2025 RI-1040 instructions
    booklet (the citation URL); the add-back amounts come from the filer's federal return
    (Forms 8990/4562 and the 174A/181 deductions actually taken).
  affects:
  - starts_from
  - RI Schedule HR1
  - calc.state_tax taxable_base (caller-supplied — must already include the HR1 add-backs)
  modeled: false
  citation:
    source: >-
      2025 INSTRUCTIONS FOR FILING RI-1040 (Revised 11/2025) — RI Division of Taxation:
      WHAT'S NEW FOR TAX YEAR 2025 (p. I-1), the new RI Schedule HR1 P.L. 119-21 add-backs
      (IRC 163(j) business interest, 174A research and experimental amortization, 179(b)
      depreciation, 181 qualified sound recording production).
    url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2025-12/2025%201040R%20Instructions%20122025.pdf
residency:
  summary: 'Resident = an individual domiciled in the State of Rhode Island, OR an individual who maintains a permanent
    place of abode in Rhode Island and spends more than 183 days of the year in Rhode Island (statutory resident).
    Domicile is the place an individual regards as their permanent home — the place to which they intend to return
    after a period of absence — and a domicile once established continues until a new fixed and permanent home is
    acquired. Nonresident = any person not within the definition of a resident, who must file if they have income
    derived from or connected with Rhode Island sources and are required to file a federal return. Part-year resident
    = an individual who was a RI resident for a period of less than 12 months; files if required to file a federal
    return. Nonresidents and part-year residents both use Form RI-1040NR (nonresidents complete RI Schedule II;
    part-year residents complete RI Schedule III). Note: the Rhode Island income tax is imposed on all the federal
    taxable income of a resident who is a member of the armed forces regardless of where received, while military
    pay received by a NONRESIDENT service person stationed in Rhode Island is not subject to RI income tax (other
    RI-source income of that person still is); under the Military Spouses Residency Relief Act a servicemember''s
    spouse''s service income may be taxable only by their state of legal residence if certain conditions are met.'
forms:
  resident: Form RI-1040 (Rhode Island Resident Individual Income Tax Return)
  part_year_or_nonresident: Form RI-1040NR (Rhode Island Nonresident Individual Income Tax Return) — nonresidents
    complete RI Schedule II; part-year residents complete RI Schedule III
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Rhode Island Earned Income Credit (RI EITC)
  type: refundable
  eligibility: Resident (and part-year/eligible nonresident) taxpayers who qualify for and claim the FEDERAL Earned
    Income Tax Credit. RI does not impose its own separate eligibility test - if you receive the federal EITC, you
    receive the RI EITC. You must claim the federal EITC (federal Form 1040/1040-SR, line 27a) to claim the RI credit.
  amount: '16% of the federal earned income credit for 2025 (UNCHANGED from 16% for 2024). Computed on RI Schedule
    EIC: Line 39 = federal EITC from Federal Form 1040/1040-SR line 27a; Line 40 = 16% (the Rhode Island percentage);
    Line 41 = Line 39 x Line 40.'
  income_limit_2025: No separate Rhode Island income limit; eligibility and income limits track the federal EITC
    (the federal EITC AGI/investment-income limits for the 2025 tax year apply).
  claimed_on: RI Schedule EIC, line 41; carried to Form RI-1040, page 1, line 14d. RI Schedule EIC is on page 3
    of the RI-1040 Resident booklet and must be completed and attached.
  citation:
    source: '2025 INSTRUCTIONS FOR FILING RI-1040 (RI Division of Taxation, Revised 11/2025) - RI Schedule EIC instructions:
      ''Line 40 - The Rhode Island percentage is 16%.'' and ''Line 41 - Rhode Island Earned Income Credit: Multiply
      line 39 by line 40. Enter here and on page 1, line 14d.'''
    url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2025-12/2025%201040R%20Instructions%20122025.pdf
- name: Property Tax Relief Credit (Form RI-1040H, the RI property-tax "circuit breaker")
  type: refundable
  eligibility: 'Must answer YES to ALL eligibility questions on Form RI-1040H Part 1: (A) domiciled in Rhode Island
    for all of 2025; (B) lived in a household or rented a dwelling that was subject to property tax in 2025; (C)
    current on property taxes or rent due on the homestead for 2025 and all prior years; (D) you OR your spouse
    were 65 years of age or older AND/OR disabled as of December 31, 2025; and (E) 2025 total household income was
    $40,730 or less. Both homeowners (attach the 2025 property tax bill) and renters (attach the 2025 lease or rent
    receipts; rent paid is multiplied by 20% as deemed property tax) may claim it.'
  amount: 'Maximum credit is $700.00 for 2025 (up from $675 for 2024; the maximum has been inflation-adjusted for
    tax years beginning on or after January 1, 2024 per R.I. Gen. Laws section 44-33-9). The tentative credit is
    property tax paid (or 20% of rent) minus (household income x the table percentage), then the lesser of that
    amount or $700. The 2025 income-based percentage table runs: less than $6,991 = 3%; $6,991-$10,480 = 4%;
    $10,481-$13,970 = 5%; $13,971-$17,460 = 6% (1 person) or 5% (2 or more); $17,461-$40,730 = 6%.'
  income_limit_2025: Total household income of $40,730 or less for 2025 (up from $39,275 for 2024).
  claimed_on: Form RI-1040H; carried to Form RI-1040, page 1, line 14c. RI-1040H must be filed by April 15, 2026;
    an extension to file RI-1040 does NOT extend the time to file RI-1040H.
  citation:
    source: 'RI Division of Taxation ADVISORY ADV 2025-22, "Inflation-adjusted amounts set for Tax Year 2026 /
      Division also posts changes for certain items involving 2025 Tax Year" (November 3, 2025), p. 4 — "Property
      tax relief credit - maximum credit amount by tax year": 2024 $675, 2025 $700; and "Property tax relief credit
      - income ranges by tax year" 2025 column (top band $17,461 - $40,730 at 6%)'
    url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2025-11/ADV_2025_22_Inflation_Adjustments.pdf
- name: Credit for Child and Dependent Care Expenses (Rhode Island percentage of the allowable federal credit)
  type: nonrefundable
  eligibility: Taxpayers who claimed the federal Credit for Child and Dependent Care Expenses (federal Form 1040/1040-SR,
    Schedule 3, line 2). Rhode Island allows a credit equal to a percentage of that federal care credit, limited
    to the amount of Rhode Island income tax (so any excess is not refunded - it is nonrefundable).
  amount: '25% of the federal Credit for Child and Dependent Care Expenses, capped at the Rhode Island income tax.
    Computed on RI Schedule I: Line 19 = RI income tax from RI-1040 line 8; Line 20 = federal care credit (federal
    Schedule 3, line 2); Line 21 = Line 20 x 25%; Line 22 (Maximum Credit) = the amount from line 19 or 21, whichever
    is less.'
  income_limit_2025: No separate Rhode Island income limit stated; the federal child and dependent care credit rules
    (federal AGI-based percentage and expense caps) govern the base amount.
  claimed_on: RI Schedule I, line 22; carried to Form RI-1040, page 1, line 9a (Rhode Island Percentage of Allowable
    Federal Credit), in the credits-against-tax section - nonrefundable.
  citation:
    source: '2025 INSTRUCTIONS FOR FILING RI-1040 (RI Division of Taxation, Revised 11/2025), RI Schedule I:
      ''Line 20 - Credit for Child and Dependent Care Expenses: Enter the amount from Federal Form 1040 or Federal
      Form 1040-SR, Schedule 3, line 2''; ''Line 21 - Multiply the amount on line 20 by 25%''; ''Line 22 - Maximum
      Credit: Enter the amount from line 19 or 21, whichever is less. Enter here and on form RI-1040, page 1, line 9a.'''
    url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2025-12/2025%201040R%20Instructions%20122025.pdf
- name: Credit for Income Taxes Paid to Another State
  type: nonrefundable
  eligibility: Rhode Island residents who also paid income tax to another state on income that is also taxed by
    Rhode Island. Authorized under R.I. Gen. Laws section 44-30-18. If credit is claimed for taxes paid to more
    than one other state, a separate calculation for each state must be made on Form RI-1040MU (page 11 of the
    RI-1040 Resident booklet); a signed copy of each other-state return must be attached.
  amount: 'The smallest of the Rhode Island income tax less allowable federal credit, the tentative credit (RI tax
    x the proportion of income from the other state), or the income tax actually due and paid to the other state.
    Computed on RI Schedule II, line 29.'
  income_limit_2025: None.
  claimed_on: RI Schedule II, line 29; carried to Form RI-1040, page 1, line 9b (credits-against-tax section -
    nonrefundable).
  citation:
    source: '2025 INSTRUCTIONS FOR FILING RI-1040 (RI Division of Taxation, Revised 11/2025), Line 9b and RI Schedule
      II - Credit for Taxes Paid to Other States (R.I. Gen. Laws section 44-30-18); Form RI-1040MU for more than
      one state'
    url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2025-12/2025%201040R%20Instructions%20122025.pdf
filing_requirement:
  note: 'Every resident individual of Rhode Island who is required to file a federal income tax return must file
    a RI individual income tax return (RI-1040). A resident not required to file a federal return may still be
    required to file a Rhode Island income tax return if their income for the taxable year is in excess of the sum
    of their Rhode Island personal exemptions and applicable standard deduction. Every nonresident individual
    required to file a federal return who has income derived from or connected with Rhode Island sources must file
    (RI-1040NR). A part-year resident (RI resident for less than 12 months) must file if they are required to file
    a federal return. (Source: 2025 RI-1040 instructions, "Who Must File a Return," p. I-1.)'
