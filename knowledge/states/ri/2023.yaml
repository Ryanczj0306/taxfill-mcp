unverified:
- The nonresident/part-year due date and mailing addresses were not separately read from the 2023 RI-1040NR instruction
  booklet; they are assumed identical to the resident return (4/15/2024; refund to 02908-5806, with-payment to 02908-5807).
  Confirm at the DOR via the RI-1040NR booklet.
- Treaty conformity is inferred from the absence of any treaty add-back on RI Schedule M (which I reviewed line-by-line)
  rather than from an explicit RI statement that treaty-exempt income is excluded. RI has no Schedule-CA-style treaty
  add-back, so treaty-exempt income flows through federal AGI untaxed; if a specific treaty article is at issue,
  confirm at the DOR.
tax:
  citation:
    source: '2023 RHODE ISLAND TAX RATE SCHEDULE AND WORKSHEETS (RI Division of Taxation) — ''2023 Tax Rate Schedule
      - FOR ALL FILING STATUS TYPES'' (over $0 but not over $73,450: 3.75%; over $73,450 but not over $166,950: pay
      $2,754.38 + 4.75% of the amount over $73,450; over $166,950: pay $7,195.63 + 5.99% of the amount over $166,950),
      STANDARD DEDUCTION WORKSHEET chart (Single $10,000; Married filing jointly $20,050; Qualifying widow(er) $20,050;
      Married filing separately $10,025; Head of household $15,050; $233,750 phaseout threshold), and EXEMPTION WORKSHEET
      (''Multiply $4,700 by the total number of exemptions''; $233,750 phaseout threshold). Corroborated by: 2023 Instructions
      for Filing RI-1040, p. I-4 (Line 4 deduction list, Line 6 exemption amount $4,700) and p. I-11 (RHODE ISLAND TAX
      COMPUTATION WORKSHEET: 3.75% / subtract $0.00, 4.75% / subtract $734.50, 5.99% / subtract $2,804.68) at https://tax.ri.gov/sites/g/files/xkgbur541/files/2023-12/2023%201040R%20Instructions.pdf;
      2023 Rhode Island Tax Table pp. T-1 and T-2 (tax-table mandate under $100,000) at https://tax.ri.gov/sites/g/files/xkgbur541/files/2023-12/2023%20RI%20Tax%20Tables_Complete.pdf;
      2023 Form RI-1040 page 1 (Lines 1-8) at https://tax.ri.gov/sites/g/files/xkgbur541/files/2023-12/2023_1040WE_w.pdf'
    url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2023-12/2023%20Tax%20Rate%20and%20Worksheets.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 73450, rate: 0.0375}
    - {over: 73450, but_not_over: 166950, rate: 0.0475}
    - {over: 166950, but_not_over: null, rate: 0.0599}
    married_filing_jointly:
    - {over: 0, but_not_over: 73450, rate: 0.0375}
