  base: federal_agi
  tax_line: 'RI-1040, Line 8: "RI income tax from Rhode Island Tax Table or Tax Computation Worksheet" (Line 7 "RI
    TAXABLE INCOME. Subtract line 6 from line 5. If zero or less, enter 0"; Line 5 = Line 3 modified federal AGI minus
    Line 4 RI standard deduction; Line 6 = number of exemptions x $4,950)'
  exemptions:
    personal:
      amount: 4950
      note: 'RI-1040 Line 6: number of exemptions from RI Schedule E multiplied by $4,950 (2024 instructions: ''Exemption
        Amount: Multiply the number of exemptions in the box by $4,950''). RI Schedule E counts yourself plus spouse plus
        dependents in ONE total; every exemption is worth the same $4,950 base reduction subtracted from income before
        the rate applies. Zero if someone else can claim you as a dependent (''NOTE: If someone else can claim you on
        their return, your exemption amount is zero.''). Phases out when Line 3 modified federal AGI exceeds $246,450
        (see notes).'
    dependent:
      amount: 4950
      note: Dependents are counted in the same RI Schedule E total at the same $4,950 per exemption (there is no separate
        dependent rate). Shipping personal and dependent at $4,950 each reproduces RI-1040 Line 6 = $4,950 x (taxpayer/spouse
        count + dependents count). Subject to the same $246,450 modified-federal-AGI phaseout.
  standard_deduction:
    single: 10550
    married_filing_jointly: 21150
    married_filing_separately: 10575
    head_of_household: 15850
  notes:
  - 'Base guidance: Supply 2024 Form RI-1040, Line 3 ''Modified Federal AGI'' (Line 1 federal AGI from Federal Form
    1040 or 1040-SR, line 11, combined with Line 2 net modifications from RI Schedule M; with no modifications Line
    3 equals federal AGI). Do NOT subtract anything yourself: the op subtracts the shipped RI standard deduction (Line
    4) and the shipped $4,950-per-person exemptions (Line 6) to reach RI TAXABLE INCOME (Line 7), then applies the
    rate schedule.'
  - 'Adjudication note (two-pass): base is federal_agi — RI-1040 starts from federal AGI (line 1) and taxable_base
    is Line 3 modified federal AGI (federal AGI +/- RI Schedule M modifications); the op subtracts the standard deduction
    and $4,950-per-exemption Line 6 amount.'
  - '2024 indexation: the three-bracket structure is unchanged from 2023; the breakpoints rose to $77,450/$176,050
    (from $73,450/$166,950), the standard deduction to $10,550/$21,150/$10,575/$15,850, the exemption to $4,950 (from
    $4,700), and the phaseout threshold to $246,450 (from $233,750) — all from the December 2024 official rate-and-worksheets
    page.'
  - 'Single rate schedule for every filing status: the 2024 Rhode Island Tax Rate Schedule is captioned ''FOR ALL
    FILING STATUS TYPES'' — the same three brackets (3.75% to $77,450; 4.75% to $176,050; 5.99% above) apply to Single,
    MFJ, MFS, HoH, and Qualifying widow(er); the schedule is duplicated per status here. Qualifying widow(er)/surviving
    spouse maps to married_filing_jointly: the RI standard deduction chart lists Qualifying widow(er) at the same
    $21,150 as MFJ, so the mapping is exact.'
  - 'Tax-table mandate below $100,000: the 2024 RI Tax Table booklet instructs ''if your taxable income is less than
    $100,000 use the Rhode Island Tax Table... If your taxable income is larger than $100,000, use the Rhode Island
    Tax Computation Worksheet.'' The table uses $50 bands computed at the band midpoint (e.g. taxable income $25,300-$25,350
    yields tax $950 = $25,325 x 3.75% rounded), so bracket math may differ by a few dollars within table bands; the
    filed form must use the table below $100,000.'
  - 'Standard-deduction and exemption PHASEOUT is NOT modeled: if RI-1040 Line 3 (modified federal AGI) exceeds $246,450,
    BOTH the standard deduction and the $4,950 exemptions phase down in 20-percentage-point steps (factors 0.8000/0.6000/0.4000/0.2000)
    per $7,050 increment of the excess (rounded up to a whole increment), and both are $0 once the excess is more
    than $28,200 (i.e. Line 3 above $274,650). This op ships the full amounts — taxpayers with Line 3 over $246,450
    must use the Standard Deduction Worksheet and Exemption Worksheet from the 2024 RI Tax Rate Schedule and Worksheets
    page instead.'
  - Rhode Island does not allow the use of federal itemized deductions (2024 RI-1040 instructions, Line 4) — every
    filer takes the RI standard deduction shipped here; there is no itemized alternative to model.
  - If someone else can claim you as a dependent on their return, your RI exemption amount is zero (2024 RI-1040 instructions,
    Line 6 NOTE) — not modeled; such filers should be computed with zero exemptions.
  - taxable_base must be RI-1040 Line 3 (Modified Federal AGI = federal AGI plus/minus net RI Schedule M modifications).
    Schedule M modifications (e.g. out-of-state municipal bond interest add-back, US-government-interest subtraction,
    taxable-Social-Security and pension/annuity modifications, military service pension modification) are NOT computed
    by this op; with no modifications Line 3 equals federal AGI (Federal Form 1040/1040-SR, line 11).
  - 'Printed-constant rounding in the rate schedule: the ''Pay'' constants are rounded to the cent and each diverges
    from the exact cumulative bracket sum by +$0.005 — printed $2,904.38 vs exact $2,904.375 (3.75% x $77,450), and
    printed $7,587.88 vs exact $7,587.875. The instructions'' RI Tax Computation Worksheet (p. I-11) subtraction amounts
    ($0.00 / $774.50 / $2,957.52) reproduce the exact marginal math to the cent; this pack''s brackets use the exact
    marginal math.'
  - Rhode Island's personal and dependent exemptions ARE base reductions (subtracted from income on Line 6 before
    the rate applies), so they are shipped as exemptions. By contrast, RI's credits — the 16% RI earned income credit
    for 2024 (Line 14d, RI Schedule EIC line 41), 25% of the federal child and dependent care credit (RI Schedule
    I, carried to Line 9a), credit for taxes paid to other states (Line 9b), the RI-1040H property-tax relief circuit
    breaker (Line 14c, max $675 for 2024) — are subtracted from TAX, not income, and are NOT applied by this op.
  - 'No mid-year 2024 rate change: the 3.75%/4.75%/5.99% structure and the $77,450/$176,050 breakpoints are the final
    inflation-adjusted figures from the December 2024 rate schedule the 2025 filing season uses.'
