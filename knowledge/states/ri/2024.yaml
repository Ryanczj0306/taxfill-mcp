unverified:
- The nonresident/part-year due date and mailing addresses were not separately read from the 2024 RI-1040NR instruction
  booklet; they are assumed identical to the resident return (4/15/2025; refund to 02908-5806, with-payment to 02908-5807).
  Confirm at the DOR via the RI-1040NR booklet.
- Treaty conformity is inferred from the absence of any treaty add-back on the 2024 RI Schedule M (reviewed line-by-line
  in the instructions) rather than from an explicit RI statement that treaty-exempt income is excluded. If a specific
  treaty article is at issue, confirm at the DOR.
- The statutory authority for the 2024 EITC increase to 16% (R.I. Gen. Laws § 44-30-2.6(c)(2)(N) as amended) was
  not re-derived from the session law text; the 16% figure itself is printed in the cited 2024 Schedule EIC instructions.
tax:
  citation:
    source: '2024 RHODE ISLAND TAX RATE SCHEDULE AND WORKSHEETS (RI Division of Taxation) — ''2024 Tax Rate Schedule
      - FOR ALL FILING STATUS TYPES'' (over $0 but not over $77,450: 3.75%; over $77,450 but not over $176,050: pay
      $2,904.38 + 4.75% of the amount over $77,450; over $176,050: pay $7,587.88 + 5.99% of the amount over $176,050),
      STANDARD DEDUCTION WORKSHEET chart (Single $10,550; Married filing jointly $21,150; Qualifying widow(er) $21,150;
      Married filing separately $10,575; Head of household $15,850; $246,450 phaseout threshold), and EXEMPTION WORKSHEET
      (''Multiply $4,950 by the total number of exemptions''; $246,450 phaseout threshold). Corroborated by: 2024 Instructions
      for Filing RI-1040 (updated 12/09/2024), Line 4 standard deduction list and Line 6 exemption amount $4,950, and
      p. I-11 RHODE ISLAND TAX COMPUTATION WORKSHEET (3.75% / subtract $0.00, 4.75% / subtract $774.50, 5.99% / subtract
      $2,957.52) at https://tax.ri.gov/sites/g/files/xkgbur541/files/2024-12/2024%201040R%20Instructions%20-%20updated%2012092024.pdf;
      2024 Rhode Island Tax Table booklet page T-1 (tax-table mandate under $100,000) at https://tax.ri.gov/sites/g/files/xkgbur541/files/2024-12/2024%20RI%20Tax%20Tables_Complete.pdf;
      2024 Form RI-1040 page 1 (Lines 1-8) at https://tax.ri.gov/sites/g/files/xkgbur541/files/2024-12/2024_1040WE_w.pdf
      — both passes agree.'
    url: https://tax.ri.gov/sites/g/files/xkgbur541/files/2024-12/2024%20Tax%20Rate%20and%20Worksheets.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 77450, rate: 0.0375}
    - {over: 77450, but_not_over: 176050, rate: 0.0475}
    - {over: 176050, but_not_over: null, rate: 0.0599}
    married_filing_jointly:
    - {over: 0, but_not_over: 77450, rate: 0.0375}
    - {over: 77450, but_not_over: 176050, rate: 0.0475}
