# VA state knowledge — tax year 2025. Fetched + cited from the VA DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure was drafted from the 2025 Form 760 instruction
# booklet (43 pages), then independently re-derived from the 2025 Form 763 nonresident
# instructions (44 pages), which print the identical Tax Rate Schedule and the same
# $8,750/$17,500 standard deduction — resolutions recorded in the tax.notes.
# RESOLVED — THE 2024 PACK'S SUNSET FLAG: the 2024 pack warned that the $8,500/$17,000
# standard deduction was scheduled to sunset after Taxable Year 2025 (reverting to
# $3,000/$6,000) and that the live DOR page already showed TY2025 = $8,750/$17,500. The
# 2025 booklet's own What's New resolves it: "Legislation enacted during the 2025 General
# Assembly session increased the standard deduction for Taxable Years 2025 and 2026 from
# $8,500 to $8,750 for single filers and from $17,000 to $17,500 for married filers filing
# jointly. The increase in the standard deduction is scheduled to sunset after Taxable Year
# 2026 and revert to the standard deduction amounts that applied prior to Taxable Year 2019:
# $3,000 for single filers and $6,000 for married couples filing jointly." So TY2025 =
# $8,750 / $17,500 (NOT $3,000/$6,000, and NOT the 2024 $8,500/$17,000), and the sunset
# moved out one year to after TY2026.
# Other 2025 changes: the refundable Virginia EITC rose from 15% to 20% (TY2025-2026); the
# rate schedule (2% / 3% / 5% / 5.75%) and the $930 / $800 exemptions are UNCHANGED; the
# detailed tax table is no longer printed in the booklet (online only); and Virginia's IRC
# conformity is now a FIXED date of December 31, 2025.
jurisdiction: states/va
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Virginia''s individual income tax computation starts from federal adjusted gross income (Form 760,
  Line 1: "Adjusted Gross Income from federal return - Not federal taxable income"). The 2025 Schedule ADJ additions
  are limited to Line 1 interest on obligations of other states, Line 2a conformity additions (bonus depreciation
  and other conformity items) and the enumerated Lines 2b-2c codes (10 interest on federally exempt U.S. obligations;
  11 accumulation distribution income; 12 lump-sum distribution income; 14 income from dealer disposition of property;
  17 first-time home buyer savings accounts; 18 food donation; 19 federal partnership income addition; 20 pass-through
  entity tax add back; 99 other) — NO addback for income exempt from federal tax under a U.S. tax treaty. The word
  "treaty" appears ZERO times in the 2025 Form 760 instructions (re-counted this session across all 43 pages). Because
  treaty-exempt income is already excluded from federal AGI and Virginia does not add it back, it flows through
  and is NOT re-taxed -> conforms.'
citation:
  source: 2025 Form 760 Resident Individual Income Tax Instructions (Virginia Tax, 43 pages) — What's New (standard
    deduction increased to $8,750/$17,500 for Taxable Years 2025 and 2026; refundable Virginia EITC raised to 20%;
    fixed IRC conformity date of December 31, 2025), Line 1 Federal Adjusted Gross Income, Line 9 filing thresholds,
    Line 11 standard deduction chart, Line 12 exemptions ($930 / $800), Tax Rate Schedule p. 35, Payment Options,
    mailing addresses, May 1 2026 due date
  url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
starts_from: federal AGI (federal adjusted gross income; Form 760 Line 1 "Adjusted Gross Income from federal return
  - Not federal taxable income")
residency:
  summary: 'Resident: a person who is a legal (domiciliary) resident of Virginia, OR an "actual" resident — one
    who maintained an abode in Virginia or was physically present in Virginia for more than 183 total days during
    the taxable year, even if a domiciliary resident of another state or country. File Form 760 if you were an actual
    or domiciliary resident for the entire year, or for a portion of the year but all of your income for the entire
    year was from Virginia sources. Part-year resident (Form 760PY): moved into Virginia during the year and became
    an actual or domiciliary resident, or moved out and became a domiciliary resident of another state (without
    moving back within six months). Nonresident (Form 763): not a resident or part-year resident but had income
    from Virginia sources. Students follow the same rules as anyone else; special rules apply to members of Congress,
    and servicemembers/military spouses may elect the member''s residence, the spouse''s residence, or the permanent
    duty station under the SCRA as amended.'
  citation:
    source: 2025 Form 760 Resident Individual Income Tax Instructions - 'Residency Status and Choosing the Right
      Form to File' (p. 5)
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
forms:
  resident: Form 760 (Resident Individual Income Tax Return)
  part_year_or_nonresident: 'Nonresident: Form 763 (Nonresident Individual Income Tax Return). Part-year resident:
    Form 760PY (Part-Year Resident Individual Income Tax Return).'
credits_verification: 'State credits were researched from the cited DOR sources and are not tax advice - confirm
  each amount and your eligibility at the cited source before claiming it. Two 2025 figures CHANGED from 2024: the
  refundable Virginia EITC rose from 15% to 20% (for Taxable Years 2025 and 2026), and the poverty guideline table
  used for the Credit for Low-Income Individuals was re-indexed.'
credits:
- name: Credit for Low-Income Individuals (CLI)
  type: nonrefundable
  eligibility: Virginia residents whose family Virginia Adjusted Gross Income (family VAGI, Schedule ADJ Line 10)
    is equal to or less than the federal poverty amount for their family size. May NOT be claimed if you, your spouse,
    or any dependent claims the age deduction, the blind/65-and-over exemption, the Virginia National Guard subtraction,
    the basic military pay subtraction, or the federal & state employee subtraction, or if you are claimed as a
    dependent on another taxpayer's return. Mutually exclusive with both Virginia EITC options — claim only the
    one of the three that gives the greatest benefit.
  amount: $300 per personal and dependent exemption reported on Form 760, excluding the age 65-or-older and blind
    exemptions (Schedule ADJ Line 12 count x $300 on Line 13); nonrefundable, limited to Virginia income tax liability.
  income_limit_2025: 'Family VAGI at or below the 2025 Poverty Guideline Table in the instructions: $15,650 (1 eligible
    exemption), $21,150 (2), $26,650 (3), $32,150 (4), $37,650 (5), $43,150 (6), $48,650 (7), $54,150 (8); add $5,500
    for each additional person, spouse, and dependent exemption. (2024: $15,060 through $52,720, +$5,380.)'
  claimed_on: Virginia Schedule ADJ, Lines 9-13, carried to Schedule ADJ Line 17 and Form 760 Line 23
  citation:
    source: 2025 Form 760 Resident Individual Income Tax Instructions - 'Tax Credit for Low-Income Individuals or
      Virginia Earned Income Tax Credit' (Schedule ADJ Lines 9-17), including the 2025 Poverty Guideline Table and
      the Line 13 '$300' multiplier
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
- name: Virginia Earned Income Tax Credit (nonrefundable option)
  type: nonrefundable
  eligibility: Taxpayers who claimed an Earned Income Tax Credit on their federal return. Mutually exclusive with
    the Credit for Low-Income Individuals and with the refundable Virginia EITC — the instructions direct the filer
    to claim whichever of the three gives the greatest tax benefit. A married-filing-separately taxpayer must first
    determine their proportion of the earned income used to qualify for the federal credit and apply that proportion
    to the Virginia credit.
  amount: 20% of the Earned Income Tax Credit claimed on the federal return; nonrefundable (limited to Virginia
    tax liability).
  income_limit_2025: No separate Virginia dollar cap; eligibility follows the federal EITC for tax year 2025.
  claimed_on: Virginia Schedule ADJ, Lines 14-17, carried to Form 760 Line 23
  citation:
    source: 2025 Form 760 Resident Individual Income Tax Instructions - Schedule ADJ Line 14 instructions ('the
      total Virginia Earned Income Credit, which is 20% of the federal Earned Income Tax Credit')
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
- name: Refundable Virginia Earned Income Tax Credit
  type: refundable
  eligibility: Full-year Virginia residents who claimed a federal Earned Income Tax Credit. Nonresidents and part-year
    residents are INELIGIBLE for the refundable credit. Mutually exclusive with the Credit for Low-Income Individuals
    and the nonrefundable 20% option.
  amount: 'INCREASED FOR 2025: 20% of the federal Earned Income Tax Credit, refundable — up from 15% for taxable
    years before 2025. The increase applies to Taxable Years 2025 and 2026 (''For taxable years Taxable Years 2025
    and 2026, new legislation increased the refundable portion of the Virginia Earned Income Tax Credit from 15%
    to 20%'').'
  income_limit_2025: No separate Virginia dollar cap; eligibility follows the federal EITC for tax year 2025.
  claimed_on: Form 760 refundable-credit line (via the Schedule ADJ earned income credit computation)
  citation:
    source: 2025 Form 760 Resident Individual Income Tax Instructions - What's New, 'Refundable Virginia Earned
      Income Tax Credit' (15% -> 20% for Taxable Years 2025 and 2026; nonresidents and part-year residents ineligible)
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
- name: Credit for Taxes Paid to Another State
  type: nonrefundable
  eligibility: Virginia residents who paid income tax to another state on income also taxed by Virginia (computed
    on Virginia Schedule OSC). Special rules apply for the reverse-credit states.
  amount: The lesser of the tax actually paid to the other state on the qualifying income or the Virginia tax attributable
    to that income (Schedule OSC computation); nonrefundable.
  income_limit_2025: No income limit; the credit is limited by the Schedule OSC computation.
  claimed_on: Virginia Schedule OSC, carried to Form 760 Line 24
  citation:
    source: 2025 Form 760 Resident Individual Income Tax Instructions - 'Credit for Taxes Paid to Another State'
      and the Schedule OSC Line Instructions (pp. 31-33)
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
filing_requirement:
  note: 'Every Virginia resident whose Virginia Adjusted Gross Income (VAGI) is at or above the minimum threshold
    must file Form 760. For tax year 2025 the thresholds are UNCHANGED from 2024: Single and your VAGI is $11,950
    or more; Married filing jointly and combined VAGI is $23,900 or more; Married filing separately and your VAGI
    is $11,950 or more. If VAGI is below the threshold, Virginia tax is $0.00 and the rate schedule/tax table must
    NOT be used (''If your Virginia Adjusted Gross Income is less than the filing threshold, do not use the rate
    schedule or tax table. Enter $0 as your tax instead.''); a return is filed only to obtain a refund of withholding
    or estimated tax paid.'
mailing_addresses:
  refund_or_no_payment: 'REFUND RETURNS: Virginia Department of Taxation, P.O. Box 1498, Richmond, VA 23218-1498.
    Alternatively, returns may be filed with the Commissioner of the Revenue / Director of Finance / Director of
    Tax Administration of the locality where the taxpayer lives, per the booklet''s ''List of Localities and Mailing
    Addresses''.'
  with_payment: 'TAX DUE RETURNS: Virginia Department of Taxation, P.O. Box 760, Richmond, VA 23218-0760. Alternatively,
    may be filed/paid with the locality where the taxpayer lives, per the booklet''s locality list.'
  citation:
    source: '2025 Form 760 Resident Individual Income Tax Instructions, ''List of Localities and Mailing Addresses''
      (booklet p. 36 onward) - ''You may mail your income tax return directly to the Department of Taxation at the
      addresses listed to the right or to your Commissioner of the Revenue'': REFUND RETURNS P.O. Box 1498; TAX
      DUE RETURNS P.O. Box 760'
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
payment:
  check_payee: 'Department of Taxation (2025 instructions, Payment Options - ''Check: If you file your return locally,
    make your check payable to the Treasurer or Director of Finance of the city or county in which you reside; otherwise,
    make your check payable to the Department of Taxation.'' Make sure your Social Security Number is on the check
    and note that it is your 2025 Virginia income tax payment. To pay separately from the return on or before May
    1, use Form 760PMT.)'
  web_pay_url: https://www.tax.virginia.gov/payments
deadlines:
  filing_due_date: '2026-05-01'
  automatic_extension: All taxpayers are granted an AUTOMATIC 6-month extension of time to file (to November 1,
    2026) — no application is required; however, any tentative tax due must be paid with extension voucher Form
    760IP by the original May 1, 2026 due date. An extension penalty of 2% per month (maximum 12%) applies if the
    return is filed within 6 months of the due date and the balance due exceeds 10% of total tax liability; a late
    filing penalty of 30% applies if filed more than 6 months late. Taxpayers living or traveling outside the United
    States and Puerto Rico (or in naval service on duty outside the U.S. and Puerto Rico) must file by July 1, 2026.
  citation:
    source: 2025 Form 760 Resident Individual Income Tax Instructions - 'your individual income tax return must
      be postmarked no later than May 1, 2026, to avoid penalties and interest'; Reminders, 'Extension for Filing
      Income Tax Returns' (automatic 6 months, Form 760IP); 'The due date for filing a calendar year return is May
      1, and the automatic extension provisions apply to returns filed by November 1'; the July 1, 2026 out-of-country
      date
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
