  base: federal_agi
  tax_line: Form 760 Line 16, 'Amount of Tax from Tax Table or Tax Rate Schedule (round to whole dollars)', computed
    on Line 15 Virginia Taxable Income = Line 9 (Virginia Adjusted Gross Income) minus Line 14 (Line 10 itemized OR
    Line 11 standard deduction, plus Line 12 exemptions plus Line 13 Schedule ADJ deductions). For 2025 the booklet
    no longer prints the tax table — the rate-schedule page states 'A detailed tax table can be found at www.tax.virginia.gov'.
  exemptions:
    personal:
      amount: 930
      note: 'Form 760 Exemption Section A / Line 12: ''Multiply the sum of exemptions claimed in the You, Spouse and Dependents
        boxes by $930'' (2025 instructions, Line 12). A BASE reduction: Line 12 is part of Line 14, subtracted from VAGI
        (Line 9) to get Virginia taxable income (Line 15). Applies to taxpayer and spouse ($930 each); MFJ with both spouses
        = exemptions_count 2 = $1,860. UNCHANGED for 2025 (same $930 as 2023 and 2024).'
    dependent:
      amount: 930
      note: Same $930 per exemption for each dependent claimed in the Dependents box of Exemption Section A. A base reduction
        via Line 12, not a credit. Unchanged for 2025.
    age_65:
      amount: 800
      note: 'Exemption Section B: ''Multiply the sum of exemptions claimed for 65 or over and Blind by $800.'' Must be
        65 or older on or before January 1, 2026. A base reduction via Line 12, but NOT applied by calc.state_tax (the
        op applies only the personal/dependent keys) — claim it on the form. Cannot be claimed together with the Credit
        for Low-Income Individuals.'
    blind:
      amount: 800
      note: 'Exemption Section B: $800 per blind exemption (blind for federal income tax purposes; taxpayer and spouse
        each). A base reduction via Line 12, but NOT applied by calc.state_tax — claim it on the form. Cannot be claimed
        together with the Credit for Low-Income Individuals.'
  standard_deduction:
    single: 8750
    married_filing_jointly: 17500
    married_filing_separately: 8750
    head_of_household: 8750
  notes:
  - '2025 STANDARD DEDUCTION RESOLVED — $8,750 / $17,500, NOT the sunset amounts: the 2024 pack flagged that the $8,500/$17,000
    deduction was scheduled to sunset after Taxable Year 2025 to $3,000/$6,000, and that the live DOR page already
    showed $8,750/$17,500 for TY2025. The 2025 booklet''s own What''s New settles it: ''Legislation enacted during
    the 2025 General Assembly session increased the standard deduction for Taxable Years 2025 and 2026 from $8,500
    to $8,750 for single filers and from $17,000 to $17,500 for married filers filing jointly. The increase in the
    standard deduction is scheduled to sunset after Taxable Year 2026 and revert to the standard deduction amounts
    that applied prior to Taxable Year 2019: $3,000 for single filers and $6,000 for married couples filing jointly.''
    The Line 11 chart prints Filing Status 1 $8,750, Filing Status 2 $17,500, Filing Status 3 $8,750, and the 2025
    Form 763 nonresident instructions print the same amounts. So TY2025 = $8,750/$17,500, the sunset moved out one
    year (now after TY2026), and $3,000/$6,000 must NOT be used for 2025.'
  - 'Base guidance: Supply Form 760 Line 9, Virginia Adjusted Gross Income (VAGI) = federal AGI (Line 1, ''Adjusted
    Gross Income from federal return - Not federal taxable income'') + Virginia additions (Line 2, Schedule ADJ Line
    3) - Line 8 subtractions (Line 4 age deduction of up to $12,000 each, Line 5 taxable Social Security / Tier 1
    Railroad Retirement benefits, Line 6 state income tax refund reported as federal income, Line 7 Schedule ADJ subtractions).
    If the filer has no Virginia additions or subtractions, VAGI equals federal AGI. The op then subtracts the shipped
    $930-per-exemption amounts and the per-status standard deduction to reproduce Virginia taxable income (Line 15
    = Line 9 - Line 14). Schedule ADJ Line 13 deductions (Line 8 of Schedule ADJ) are NOT modeled — subtract them
    from the base you supply.'
  - 'Single rate schedule for ALL filing statuses, UNCHANGED for 2025: Virginia publishes one Tax Rate Schedule (2%
    up to $3,000; $60 + 3% for $3,000-$5,000; $120 + 5% for $5,000-$17,000; $720 + 5.75% over $17,000) that applies
    regardless of filing status; it is duplicated per status here. The printed constants $60/$120/$720 exactly equal
    the cumulative sums of the prior brackets (2% x 3,000 = 60.00; 60 + 3% x 2,000 = 120.00; 120 + 5% x 12,000 = 720.00)
    — no rounding divergence at all, so marginal accumulation reproduces the schedule exactly.'
  - 'Adjudication note (two-pass, TY2025): the rate schedule, the $8,750/$17,500 standard deduction, and the $930/$800
    exemption multipliers were drafted from the 2025 Form 760 instructions and re-verified against the 2025 Form 763
    nonresident instructions, which reprint the identical rate schedule and standard deduction chart. The 2025 FORM
    760 itself could not be retrieved (the 2024-style vatax-pdf/2025-760.pdf URL 404s), so the second pass used the
    nonresident instructions instead of the form — recorded in `unverified`. The booklet''s own worked example was
    used as a shipped test vector: taxable income $90,000 -> $720 + (.0575 x $73,000) = $4,917.50, ''which should
    be rounded to $4,918''.'
  - 'Virginia filing statuses are only 1 = Single, 2 = Married Filing Jointly, 3 = Married Filing Separately. Head
    of Household is NOT a separate Virginia status: the instructions say to ''Fill in the Head of Household oval if
    your filing status is Single and you checked the Head of Household box on your federal return'' — HoH filers use
    Filing Status 1 (Single) and the $8,750 standard deduction, which is what this pack ships for head_of_household.'
  - 'ZERO-TAX FILING THRESHOLD not applied by the engine: if Virginia Adjusted Gross Income (Line 9) is less than
    $11,950 (Filing Status 1 or 3) or $23,900 (Filing Status 2, combined), Virginia tax is $0.00 — the 2025 rate-schedule
    page states ''If your Virginia Adjusted Gross Income is less than the filing threshold, do not use the rate schedule
    or tax table. Enter $0 as your tax instead.'' Bracket math on a below-threshold filer yields a positive number
    that is WRONG; the correct answer is $0.'
  - 'Tax table for 2025 is ONLINE ONLY and optional: unlike the 2024 booklet (which printed the table on pp. 35-43),
    the 2025 booklet prints only the rate schedule and says ''A detailed tax table can be found at www.tax.virginia.gov''.
    Line 16 permits the table, the rate schedule, or the Department''s online Tax Calculator; within table bands the
    table may differ from exact bracket math by about a dollar.'
  - 'Spouse Tax Adjustment (STA) NOT modeled: couples filing jointly (Filing Status 2) may reduce their tax by up
    to $259 on Form 760 Line 17 if both spouses have taxable income (''The Spouse Tax Adjustment cannot exceed $259'';
    the worksheet short-circuits to $259 above a stated income level). The engine computes Line 16 only, so a joint
    filer''s net tax may be up to $259 lower than this op reports.'
  - Age 65+/blind exemptions ($800 each, Exemption Section B) and the age deduction (up to $12,000 per qualifying
    spouse, Line 4, income-based for individuals born after January 1, 1939) are real Virginia reductions that this
    op does NOT apply — the age deduction belongs in the VAGI you supply and the $800 exemptions must be claimed on
    the form. Neither may be combined with the Credit for Low-Income Individuals.
