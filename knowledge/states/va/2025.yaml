unverified:
- 'The 2025 Form 760 itself (the fillable return PDF) was NOT retrieved this session: the 2024-style URL pattern
  (vatax-pdf/2025-760.pdf) returns 404. Every figure in this pack therefore comes from the two INSTRUCTION booklets
  (Form 760 resident and Form 763 nonresident), which agree with each other on the rate schedule, the standard deduction,
  and the $930/$800 exemption multipliers. The form''s own printed ''X $930'' / ''X $800'' multiplier boxes and
  its Line 16 caption were not re-read for 2025 — confirm at tax.virginia.gov if the exact form wording matters.'
- The 2025 detailed tax table is NO LONGER PRINTED in the Form 760 booklet (the rate-schedule page says only 'A
  detailed tax table can be found at www.tax.virginia.gov'), and it was not fetched. Table amounts within a band
  can differ from exact rate-schedule math by about a dollar; Line 16 permits the table, the rate schedule, or the
  Department's online Tax Calculator.
- 'Virginia''s 2025 conformity position is unusually late-breaking: the What''s New section describes 2026 General
  Assembly action (the 2026 Amendments to the 2025 Appropriation Act) that replaced suspended rolling conformity
  with a FIXED conformity date of December 31, 2025, and points to Tax Bulletin 26-1 for the required return adjustments.
  Tax Bulletin 26-1 was not fetched. Filers with bonus depreciation, qualified production property, domestic research
  and experimental expenditures, or business interest adjustments must consult it.'
- 'Qualifying surviving spouse status: the 2025 booklet lists only Filing Status 1 (Single), 2 (Married Filing Jointly)
  and 3 (Married Filing Separately) and does not state which Virginia status a federal qualifying surviving spouse
  uses. See the tax.notes caveat — only the standard deduction would differ.'
- The Credit for Taxes Paid to Another State summary is a structural description from the booklet's Schedule OSC
  section; the Schedule OSC form itself and the reverse-credit state list were not separately fetched.
tax:
  citation:
    source: '2025 Form 760 Resident Individual Income Tax Instructions (Virginia Tax, 43 pages) — TAX RATE SCHEDULE,
      p. 35: ''Not over $3,000, your tax is 2% of your Virginia taxable income; $3,000-$5,000: $60 + 3%; $5,000-$17,000:
      $120 + 5%; over $17,000: $720 + 5.75% of excess over $17,000''; What''s New ''Increase in Standard Deduction''
      and the Line 11 chart (Filing Status 1 $8,750 / Filing Status 2 $17,500 / Filing Status 3 $8,750, for Taxable
      Years 2025 and 2026, sunsetting after TY2026 to $3,000/$6,000); Line 12 Exemptions (''Multiply the sum of exemptions
      claimed in the You, Spouse and Dependents boxes by $930'' and ''Multiply the sum of exemptions claimed for 65
      or over and Blind by $800''); Line 9 VAGI filing threshold; Spouse Tax Adjustment Worksheet ($259 cap). Second
      pass: the 2025 Form 763 nonresident instructions independently print the identical TAX RATE SCHEDULE and the same
      $8,750/$17,500 standard deduction chart (https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-763-instructions.pdf)
      — both passes agree on every bound, rate, printed constant, and deduction amount.'
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2025-760-instructions.pdf
