# VA state knowledge — tax year 2024. Fetched + cited from the VA DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form 760
# instruction booklet (2614089 Rev. 09/24), then independently re-derived from a second
# official document (the 2024 Form 760 itself, Rev. 11/24, or the 2024 Form 763
# nonresident instructions) — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGE (What's New): the standard deduction ROSE to $8,500 single /
# $17,000 MFJ (2023 General Assembly session legislation) — it is NOT the 2023
# $8,000/$16,000; the increase sunsets after Taxable Year 2025 (reverting to the
# pre-TY2019 $3,000/$6,000).
jurisdiction: states/va
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Virginia''s individual income tax computation starts from federal adjusted gross income (2024 Form
  760, Line 1: "Adjusted Gross Income from federal return - Not federal taxable income"). The 2024 Schedule ADJ
  additions are limited to Line 1 interest on obligations of other states, Line 2a conformity additions (bonus
  depreciation and other conformity items), and the enumerated Lines 2b-2c codes (10 interest on federally exempt
  U.S. obligations; 11 accumulation distribution income; 12 lump-sum distribution income; 19 federal partnership
  income addition; 20 pass-through entity tax add back; 99 other) — NO addback for income exempt from federal tax
  under a U.S. tax treaty. Because treaty-exempt income is already excluded from federal AGI and Virginia does not
  add it back, it flows through and is NOT re-taxed -> conforms.'
citation:
  source: 2024 Form 760 Resident Individual Income Tax Instructions (Virginia Tax, 2614089 Rev. 09/24) — What's
    New (standard deduction increase to $8,500/$17,000), Line 1 Federal Adjusted Gross Income, due date May 1, 2025,
    filing thresholds, Tax Rate Schedule p.35, payment options / check payee, mailing addresses
  url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2024-760-instructions.pdf
starts_from: federal AGI (federal adjusted gross income; Form 760 Line 1 "Adjusted Gross Income from federal return
  - Not federal taxable income")
residency:
  summary: 'Resident: a person who is a legal (domiciliary) resident of Virginia, OR an "actual" resident — one
    who maintained an abode in Virginia or was physically present in Virginia for more than 183 total days during
    the taxable year, even if a domiciliary resident of another state or country (2024 instructions, "Actual Resident").
    File Form 760 if you were an actual or domiciliary resident for the entire year, or for a portion of the year
    but all of your income for the entire year was from Virginia sources. Part-year resident (Form 760PY): moved
    into Virginia during the year and became an actual or domiciliary resident, or moved out and became a domiciliary
    resident of another state (without moving back within six months). Nonresident (Form 763): not a resident or
    part-year resident but had income from Virginia sources. Students follow the same rules as anyone else; special
    rules apply to members of Congress and, for TY2023 and after, servicemembers/military spouses may elect the
    member''s residence, the spouse''s residence, or the permanent duty station under the SCRA as amended.'
forms:
  resident: Form 760 (Resident Individual Income Tax Return)
  part_year_or_nonresident: 'Nonresident: Form 763 (Nonresident Individual Income Tax Return). Part-year resident:
    Form 760PY (Part-Year Resident Individual Income Tax Return).'
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Credit for Low-Income Individuals (CLI)
  type: nonrefundable
  eligibility: Virginia residents whose family Virginia Adjusted Gross Income (family VAGI) is at or below the federal
    poverty guideline for their family size. May NOT be claimed if you, your spouse, or any dependent claims the
    age deduction, the blind/65-and-over exemption, the Virginia National Guard subtraction (Code 28), the basic
    military pay subtraction (Code 38), or the federal & state employee subtraction (Code 39), or if you are claimed
    as a dependent on another taxpayer's return. Mutually exclusive with both Virginia EITC options — claim only
    the one of the three credits that benefits you most.
  amount: $300 per personal and dependent exemption reported on Form 760 (excluding the age 65+ and blind exemptions;
    Schedule ADJ Lines 12-13); nonrefundable, limited to Virginia income tax liability
  income_limit_2024: 'Family VAGI must be at or below the 2024 federal poverty guideline (Schedule ADJ Poverty Guideline
    Table): 1 exemption $15,060; 2 $20,440; 3 $25,820; 4 $31,200; 5 $36,580; 6 $41,960; 7 $47,340; 8 $52,720; add
    $5,380 for each additional person'
  claimed_on: Schedule ADJ (Form 760-ADJ) Lines 10-13, carried to Line 17, then Form 760 Line 23
  citation:
    source: 2024 Form 760 Resident Individual Income Tax Instructions, pp.23-24 ('Tax Credit for Low-Income Individuals
      or Virginia Earned Income Tax Credit', Eligibility Requirements, and Poverty Guideline Table), Virginia Tax
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2024-760-instructions.pdf
- name: Virginia Earned Income Credit (nonrefundable, 20% option)
  type: nonrefundable
  eligibility: Virginia residents who claimed an Earned Income Tax Credit on their 2024 federal return. Mutually
    exclusive with the Credit for Low-Income Individuals and with the 15% refundable EITC option — taxpayer claims
    only the one option that benefits them most.
  amount: 20% (.20) of the federal Earned Income Tax Credit claimed on the federal return (Schedule ADJ Line 15
    'Multiply the amount on Line 14 by 20% (.20)'); nonrefundable, limited to Virginia income tax liability
  income_limit_2024: No separate Virginia income cap; eligibility tracks the federal EITC income limits since it
    requires a federal EITC claim
  claimed_on: Schedule ADJ (Form 760-ADJ) Lines 14-15 and 16a, carried to Line 17, then Form 760 Line 23
  citation:
    source: 2024 Form 760 Resident Individual Income Tax Instructions, p.24 (Schedule ADJ Lines 14-16 instructions,
      'Virginia Earned Income Credit, which is 20% of the federal' EITC), Virginia Tax
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2024-760-instructions.pdf
- name: Refundable Virginia Earned Income Tax Credit (15% option)
  type: refundable
  eligibility: Virginia residents who claimed an Earned Income Tax Credit on their 2024 federal return; available
    for taxable years beginning January 1, 2022, but before January 1, 2026. Mutually exclusive with the Credit
    for Low-Income Individuals and the 20% nonrefundable EITC — taxpayer claims only one of the three.
  amount: 15% (.15) of the federal Earned Income Tax Credit claimed on the federal return (Schedule ADJ Line 16b
    'Multiply Line 14 by 15% (.15)'); refundable, so it may exceed the taxpayer's Virginia tax liability
  income_limit_2024: No separate Virginia income cap; eligibility tracks the federal EITC income limits since it
    requires a federal EITC claim
  claimed_on: Schedule ADJ (Form 760-ADJ) Line 16b, carried to Line 17, then Form 760 Line 23
  citation:
    source: 2024 Form 760 Resident Individual Income Tax Instructions, pp.23-24 ('For taxable years beginning January
      1, 2022, but before January 1, 2026 ... Refundable Virginia Earned Income Tax Credit (EITC), equal to 15 percent
      of the federal EITC'), Virginia Tax
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2024-760-instructions.pdf
- name: Credit for Tax Paid to Another State
  type: nonrefundable
  eligibility: Virginia residents (and certain part-year residents) who paid income tax to another state on income
    that is also taxed by Virginia, to avoid double taxation. Special border-state and District of Columbia rules
    apply; computed on Schedule OSC with a copy of the other state's return enclosed.
  income_limit_2024: None stated; the credit equals the qualifying tax paid to the other state subject to a limitation
    based on the proportion of Virginia tax attributable to the out-of-state income (computed on Schedule OSC)
  claimed_on: Schedule OSC, Line 21; entered on Form 760 Line 24 ('Credit for Tax Paid to Another State from Schedule
    OSC, Line 21. You must enclose Schedule OSC and a copy of all other state returns')
  citation:
    source: 2024 Form 760 Resident Individual Income Tax Instructions, pp.31-33 ('Credit for Taxes Paid to Another
      State' / Schedule OSC line instructions) and 2024 Form 760 Line 24, Virginia Tax
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2024-760-instructions.pdf
filing_requirement:
  note: 'Every Virginia resident whose Virginia Adjusted Gross Income (VAGI) is at or above the minimum threshold
    must file Form 760. For tax year 2024 the thresholds are unchanged: Single or Married filing separately — VAGI
    $11,950 or more; Married filing jointly — combined VAGI $23,900 or more (2024 instructions, Line 9; the 2024
    Form 760 Line 9 prints "If less than $11,950 for Filing Status 1 or 3; or $23,900 for Filing Status 2, your
    tax is $0.00"). If VAGI is below the threshold, tax is $0.00 and a return is filed only to obtain a refund of
    withholding or estimated tax paid.'
mailing_addresses:
  refund_or_no_payment: 'REFUND RETURNS: Virginia Department of Taxation, P.O. Box 1498, Richmond, VA 23218-1498.
    Alternatively, returns may be filed with the locality (Commissioner of the Revenue / Director of Finance / Director
    of Tax Administration) where the taxpayer lives, per the booklet''s locality list (pp.45-46).'
  with_payment: 'TAX DUE RETURNS: Virginia Department of Taxation, P.O. Box 760, Richmond, VA 23218-0760. Alternatively,
    may be filed/paid with the locality where the taxpayer lives, per the booklet''s locality list (pp.45-46).'
  citation:
    source: 2024 Form 760 Resident Individual Income Tax Instructions, pp.44-46 ('2024 Income Tax Return Mailing
      Addresses and Locality Codes' — 'REFUND RETURNS ... P.O. Box 1498 ... TAX DUE RETURNS ... P.O. Box 760'),
      Virginia Tax
    url: https://www.tax.virginia.gov/sites/default/files/vatax-pdf/2024-760-instructions.pdf
payment:
  check_payee: 'Department of Taxation (make check payable to the Department of Taxation; make sure your Social
    Security Number is on your check and make a notation that it is your 2024 Virginia income tax payment). NOTE:
    If filing the return locally, make the check payable to the Treasurer or Director of Finance of the city or
    county in which you reside.'
  web_pay_url: https://www.tax.virginia.gov/payments
deadlines:
  filing_due_date: '2025-05-01'
  citation:
    source: 2024 Form 760 Resident Individual Income Tax Instructions ('your individual income tax return must be
