    (p.12); pass 2 = the INDEPENDENT 2025 GB-1210 withholding booklet''s Vermont Percentage Method ANNUAL PAYROLLS
    table, whose bounds net of the built-in offsets ($3,825 single, $11,475 married) reproduce Schedule X and Y-1
