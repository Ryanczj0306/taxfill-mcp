unverified:
- 'The Renter Credit''s per-county / per-household-size income eligibility limits and the credit amounts for 2025 were NOT fetched — they are published as a separate calculator and table, not in the IN-111 instructions. Only the three threshold eligibility requirements and the RCC-146 due dates are verified here; run the official Renter Credit Calculator before claiming.'
- 'Exact ZIP+4 routing was taken from the 2025 IN-111 Instructions; confirm current-year addresses at the DOR before mailing, as PO Box assignments can change between filing years.'
- 'myVTax portal base URL (myvtax.vermont.gov) is cited from the IN-111 instructions; the exact deep-link for an individual income tax payment was not separately captured — confirm the payment path at the DOR.'
- 'Whether a specific tax treaty article is recognized for a given taxpayer should be confirmed at the DOR; the general conformity conclusion is based on the federal-AGI starting point plus the explicit U.S.-law-exempt-income subtraction (Schedule IN-112, Part I, Line 7 interest from U.S. obligations, and the DOR Resident page''s ''income exempted from state taxation by the laws of the United States''), with no observed treaty add-back.'
- 'The 2025 Schedule IN-119 (Vermont Tax Adjustments and Nonrefundable Credits) was not fetched; the Elderly-or-Disabled 24% figure comes from the DOR Tax Credits page and the IN-111 Line 9 subtraction list, not from the 2025 IN-119 itself.'
