# VT 2025 pack — derived from the verified 2024 pack; every figure re-verified against
# the official 2025 documents. Two-pass: pass 1 = the 2025 Form IN-111 Instructions
# (tax.vermont.gov, pp.6/12-13 — the 2025 Vermont Tax Rate Schedules X/Y-1/Y-2/Z, the
# 2025 Vermont Tax Tables, the Line 4 standard-deduction chart and the Line 5e personal
# exemption); pass 2 = the 2025 GB-1210 'Income Tax Withholding Instructions, Tables,
# and Charts' ANNUAL PAYROLLS percentage-method table, an independently-published
# document whose wage bounds minus the built-in offsets ($3,825 single / $11,475 married)
# reproduce the income-tax bracket bounds exactly and whose UNROUNDED cumulative
# constants (1,654.90 / 6,294.70 / 16,174.70 single; 2,763.75 / 10,482.45 / 18,428.25
# married) confirm the schedules' rounded printed 'VT Base Tax' figures. NOTE: unlike
# 2024, direct https fetches of tax.vermont.gov succeeded with a browser User-Agent, so
# these are live official copies, not Wayback captures. TY2025 indexation: SD
# 7,650/15,300/7,650/11,450 (+$1,250 per federal standard-deduction box, born before
# Jan. 2, 1961 or blind); personal exemption $5,300 x Line 5d; bracket bounds
# X 49,400/119,700/249,700, Y-1 82,500/199,450/304,000, Y-2 exactly half Y-1
# (41,250/99,725/152,000), Z 66,200/171,000/276,850; rates unchanged at
# 3.35/6.60/7.60/8.75%; 3%-of-AGI minimum over $150,000 federal AGI retained; tax-table
# mandate under $75,000 retained. New for 2025: the refundable Veteran Tax Credit
# (Act 71 of 2025).
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
jurisdiction: states/vt
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Vermont''s resident return starts from federal adjusted gross income and does NOT add back federally treaty-exempt income; it explicitly SUBTRACTS it. Form IN-111 Line 1 is ''Federal Adjusted Gross Income REQUIRED entry. Enter the amount from your federal Form 1040 or, if applicable, from the recomputed federal Form 1040'' (2025 IN-111 Instructions). The DOR ''Resident'' page states: ''If you are a Vermont resident, your income starts with federal adjusted gross income minus the following: Income exempted from state taxation by the laws of the United States...''. Line 2 (Net Modifications to Federal AGI, from Schedule IN-112, Part I, Line 19) contains the standard state additions/subtractions — non-Vermont state/local obligation interest and federal bonus depreciation as additions; U.S.-obligation interest, the capital-gains exclusion, the retirement-income exemption, medical expenses, state/local taxes, railroad retirement, and military retirement/survivor benefits as subtractions — with no treaty-income add-back. Because treaty-exempt income is already excluded from federal AGI and is additionally listed as a Vermont subtraction (not an addition), it is not re-taxed -> conforms = true.'
citation:
  source: 'VT Dept of Taxes — 2025 Form IN-111 Instructions (PDF, 20 pages): Line 1 = Federal Adjusted Gross Income; Line 4 2025 Vermont Standard Deduction chart; Line 5e personal exemption $5,300; Line 8 tax from the 2025 tax table or rate schedule (3%-of-AGI minimum over $150,000); 2025 Vermont Tax Rate Schedules (p.12) and 2025 Vermont Tax Tables (pp.13-17); due date April 15, 2026; mailing addresses (PO Box 1881 refund/no tax due, PO Box 1779 balance due); check payable to Vermont Department of Taxes with 2025 Form IN-116; myVTax'
  url: https://tax.vermont.gov/sites/tax/files/documents/IN-111-Instr-2025.pdf
starts_from: 'federal AGI (Form IN-111 Line 1 = Federal Adjusted Gross Income from federal Form 1040; net modifications applied on Line 2 from Schedule IN-112, Part I, Line 19)'
residency:
  summary: 'Resident: you qualify as a Vermont resident for that part of the taxable year during which you are domiciled in Vermont, OR you maintain a permanent home in Vermont and are present in Vermont for more than 183 days of the taxable year (statutory residency). Part-year resident: a Vermont resident for only part of the tax year (typically moved into or out of Vermont) — combine income while a resident with Vermont-source income while a nonresident. Nonresident: does not qualify as a resident during any part of the year; taxed only on Vermont-source income. (Framework unchanged for 2025; nonresidents and part-year residents apportion on Schedule IN-113 and carry the Line 35 income adjustment percentage to IN-111 Line 15.)'
forms:
  resident: Form IN-111, Vermont Income Tax Return
  part_year_or_nonresident: 'Form IN-111 (same return) plus Schedule IN-113, Vermont Income Adjustment Calculations (nonresidents and part-year residents complete IN-113 to apportion/allocate Vermont income; the IN-113 Line 35 percentage goes on IN-111 Line 15 and multiplies Line 14 to produce Line 16 Adjusted Vermont Income Tax)'
credits_verification: 'State credits were researched from the cited DOR sources and are not tax advice — confirm each amount and your eligibility at the cited source before claiming it. Not independently confirmed for 2025 (verify the figure): Renter Credit (renter rebate / circuit-breaker) — the per-county/per-household income limits and the credit calculator were not re-fetched.'
credits:
- name: Vermont Earned Income Tax Credit (EITC)
  type: refundable
  eligibility: 'Full-year and part-year Vermont residents who qualify for and receive the federal Earned Income Tax Credit. Available to all qualifying VT residents regardless of whether they, their spouse, or qualifying dependents have an SSN or ITIN (such returns must be paper-filed).'
  amount: 'For a filer WITH qualifying children (Schedule IN-112, Part II, Line 5 greater than zero): 38% of the federal Earned Income Tax Credit (multiply the federal EITC by 0.38). For a filer with NO qualifying children on federal Schedule EIC (Line 5 is zero): 100% of the federal EITC — the 2025 Schedule IN-112 Line 7 reads ''If Line 5 is GREATER than zero, MULTIPLY Line 6 by 38% (0.38). If Line 5 is zero, enter the amount from Line 6.'' Part-year residents prorate the total refundable credits by the Vermont portion of income (IN-112 Lines 14-17).'
  income_limit_2025: 'No separate Vermont income limit; eligibility tracks the federal EITC income limits (the federal EITC must be claimed on federal Form 1040).'
  claimed_on: 'Schedule IN-112, Part II, Line 7 (federal EITC entered on Line 6, number of qualifying children on Line 5); the Part II Line 13 total refundable credits carries to Form IN-111, Line 26c (part-year residents: Line 17).'
  citation:
    source: 'Vermont Department of Taxes - 2025 Schedule IN-112 (form, Rev. 10/25) Part II Line 7 and 2025 Schedule IN-112 Instructions, Line 7'
    url: https://tax.vermont.gov/sites/tax/files/documents/IN-112-2025.pdf
- name: Vermont Child Tax Credit
  type: refundable
  eligibility: 'Full-year and part-year Vermont resident families with a qualifying child age six or younger at the close of the tax year — the 2025 Schedule IN-112 says to list only children born 2019 through 2025. Available to all qualifying VT residents regardless of SSN/ITIN status of taxpayer, spouse, or dependents.'
  amount: '$1,000 per qualifying child (Schedule IN-112, Part II, Line 4 = Line 3 x $1,000). Full credit if AGI (Form IN-111, Line 1) is $125,000 or less. Above $125,000 the credit is reduced by $20 for each additional $1,000 (or fraction) of AGI per the official Child Tax Credit Table in the 2025 IN-112 instructions (e.g. $720 at $138,001-$139,000, $500 at $149,001-$150,000, $20 at $173,001-$174,000, and $0 at $174,001 and above).'
  income_limit_2025: 'Full credit at AGI up to $125,000; partial credit for AGI between $125,001 and $174,000; no credit at AGI of $174,001 or more.'
  claimed_on: 'Schedule IN-112, Part II, Line 4 (number of qualifying children on Line 3); the Part II Line 13 total carries to Form IN-111, Line 26c (part-year residents: Line 17).'
  citation:
    source: 'Vermont Department of Taxes - 2025 Schedule IN-112 Instructions (Child Tax Credit Table and the $20-per-$1,000 phase-down above $125,000 AGI) and the 2025 Schedule IN-112 form, Part II Line 4'
    url: https://tax.vermont.gov/sites/tax/files/documents/IN-112-Instr-2025.pdf
- name: Vermont Child and Dependent Care Credit
  type: refundable
  eligibility: 'Full-year and part-year Vermont residents who earn income, pay dependent care expenses, and are eligible for the federal Child and Dependent Care Credit (federal Form 2441).'
  amount: '72% of the federal Child and Dependent Care Credit (Schedule IN-112, Part II, Line 2 = federal Form 2441, Line 11 x 0.72). Part-year residents prorate by the Vermont portion of income.'
  income_limit_2025: 'No separate Vermont income limit stated; eligibility tracks the federal Child and Dependent Care Credit.'
  claimed_on: 'Schedule IN-112, Part II, Line 2 (federal amount on Line 1); the Part II Line 13 total carries to Form IN-111, Line 26c (part-year residents: Line 17).'
  citation:
    source: 'Vermont Department of Taxes - 2025 Schedule IN-112 (form, Rev. 10/25) Part II Line 2 (''MULTIPLY Line 1 by 72% (0.72)'') and the Tax Credits and Adjustments for Individuals page (''The tax credit amount is 72% of the federal Child and Dependent Care Tax Credit'')'
    url: https://tax.vermont.gov/sites/tax/files/documents/IN-112-2025.pdf
- name: Vermont Veteran Tax Credit
  type: refundable
  eligibility: 'NEW FOR 2025 (signed into law June 25, 2025 as part of Act 71, effective beginning with the 2025 tax year). Any Vermont resident or part-year resident who has a discharge record or other record of separation from active duty verifying service in the uniformed services, whose adjusted gross income (Form IN-111, Line 1) is at or below the phase-out range.'
  amount: '$250 if AGI is $25,000 or less. Above $25,000 the credit is reduced by $5 for each full $100 of AGI over $25,000 (Schedule IN-112, Part II: Line 9 = AGI - $25,000; Line 10 = Line 9 / 100 rounded DOWN to a whole number; Line 11 = Line 10 x $5; Line 12 = $250 - Line 11). No credit at AGI of $30,000 or more.'
  income_limit_2025: 'Full $250 at AGI of $25,000 or less; phased down over $25,000 to $30,000; no credit at AGI of $30,000 or more.'
  claimed_on: 'Schedule IN-112, Part II, Lines 8-12; the Part II Line 13 total carries to Form IN-111, Line 26c (part-year residents: Line 17).'
  citation:
    source: 'Vermont Department of Taxes - 2025 Schedule IN-112 Instructions, Veteran Tax Credit (''signed into law on June 25, 2025, as part of Act 71 ... $250 refundable tax credit if their adjusted gross income is less than or equal to $25,000 ... No credit is available for veterans with an adjusted gross income equal to or greater than $30,000'') and the 2025 Schedule IN-112 form, Part II Lines 8-12'
    url: https://tax.vermont.gov/sites/tax/files/documents/IN-112-Instr-2025.pdf
- name: Renter Credit (renter rebate / circuit-breaker)
  type: refundable
  eligibility: 'Vermont renters who meet all three 2025 requirements per the 2025 IN-111 instructions: (1) domiciled in Vermont for the entire calendar year 2025, (2) not claimed in 2025 as a dependent of another taxpayer, and (3) rented in Vermont for at least six months in 2025. Eligibility also depends on income, family size, and county of residency.'
  amount: 'Income-based; the credit is computed from the renter''s income and 10% of the U.S. HUD fair market rent for an apartment of the household''s size in the renter''s county. Specific dollar amounts and the per-county/per-household income eligibility limits vary and are determined via the official Renter Credit Calculator and tables (not a single fixed figure).'
  income_limit_2025: 'County- and household-size-specific income limits apply (set per the Renter Credit limits); a single statewide dollar limit was not confirmed from the cited source.'
  claimed_on: 'Form RCC-146, Renter Credit Claim (filed separately from / alongside the income tax return). Due April 15, 2026; may be late-filed through Oct. 15, 2026 with no penalty for late filing. Can be filed at myVTax.'
  citation:
    source: 'Vermont Department of Taxes - 2025 Form IN-111 Instructions, Renter Credit Claim section (three eligibility requirements; April 15, 2026 due date, late-file to Oct. 15, 2026) and the Renter Credit page'
    url: https://tax.vermont.gov/sites/tax/files/documents/IN-111-Instr-2025.pdf
  unverified: true
- name: Elderly or Permanently Disabled Tax Credit
  type: nonrefundable
  eligibility: 'Taxpayers who qualify for and receive the federal Credit for the Elderly or the Disabled: you are age 65 or older, OR you retired on permanent and total disability and have taxable disability income, and your income is within the federal limits. Intended for seniors and disabled persons with little tax-exempt retirement or disability income.'
  amount: 24% of the federal Credit for the Elderly or the Disabled.
  income_limit_2025: 'Tracks the federal Credit for the Elderly or the Disabled income/AGI and nontaxable-benefit limits; no separate Vermont dollar limit confirmed from the cited source.'
  claimed_on: 'Schedule IN-119, Vermont Tax Adjustments and Nonrefundable Credits, Part I (a subtraction from Vermont income tax); flows to Form IN-111, Line 9 ''Net Adjustment to Vermont Tax''.'
  citation:
    source: 'Vermont Department of Taxes - Tax Credits and Adjustments for Individuals page (''The Vermont tax credit is 24% of the federal Credit for the Elderly or the Disabled'') and the 2025 Form IN-111 Instructions, Line 9 (Schedule IN-119, Part I subtractions include the Credit for the Elderly or the Disabled)'
    url: https://tax.vermont.gov/individuals/personal-income-tax/tax-credits
filing_requirement:
  note: 'A 2025 Vermont Income Tax Return must be filed by all full-year or part-year Vermont residents or nonresidents if you are required to file a 2025 federal income tax return, AND you earned or received more than $100 in Vermont income, OR you earned or received gross income of more than $1,000 as a nonresident (2025 Form IN-111 Instructions, ''Requirement to File a Vermont Income Tax Return''; see 32 V.S.A. sections 5861 and 5823(b) for sources of income). You must also file a Vermont Income Tax Return to claim a refund of Vermont withholding or estimated tax payments — you have up to three years from the due date of the return, including extensions, to file a claim for overpayment.'
