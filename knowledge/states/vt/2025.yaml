    the exact cumulative bracket sums this engine computes. Unlike TY2024, direct https fetches of tax.vermont.gov
    succeeded with a browser User-Agent, so both documents are live official copies rather than Wayback captures.'
  - 'Printed-constant divergence: the schedules'' ''VT Base Tax'' constants are whole-dollar roundings of the exact
    cumulative sums (Y-1 at 82,500 prints 2,764.00 vs exact 2,763.75; X at 49,400 prints 1,655.00 vs exact 1,654.90;
    Y-2 at 152,000 prints 9,214.00 vs exact 9,214.125; Z at 66,200 prints 2,218.00 vs exact 2,217.70), so form arithmetic
    using the printed constants can differ from this op''s exact marginal math by up to $1. The booklet''s own $85,000
    MFJ example prints $2,929 and exact math also gives $2,928.75 -> $2,929, so they agree there.'
  - 'Base guidance: supply Form IN-111, Line 3 ''Federal Adjusted Gross Income with Modifications'' = Line 1 federal
    AGI (federal Form 1040, Line 11) plus/minus Line 2 net modifications to federal AGI (Schedule IN-112, Part I,
    Line 19 — note the 2025 line number; it was Line 18 on the 2024 schedule). With no Vermont modifications, Line
    3 equals federal AGI, so plain federal AGI is the correct input for most filers. The op then subtracts the shipped
    2025 Vermont standard deduction (IN-111 Line 4) and $5,300 per exemption (Lines 5a-5e) to reproduce Line 7, Vermont
    Taxable Income.'
  - 'Tax-table mandate below $75,000: each 2025 Vermont Tax Rate Schedule prints ''TAXABLE INCOME UNDER $75,000 USE
    THE TAX TABLES'' across its sub-$75,000 rows. The 2025 Vermont Tax Tables (IN-111 Instr. pp.13-17) compute tax
    at the MIDPOINT of each $100 band using the schedules'' PRINTED (rounded) base-tax constants, then round to whole
    dollars — spot-verified: the Single $25,000-$25,100 band prints $839 (3.35% x $25,050 = $839.175) where exact
    math at $25,000 gives $837.50; the $30,000-$30,100 band prints $1,007; the $74,900-$75,000 band prints Single
    $3,341 / MFJ $2,511 / MFS $3,606 / HoH $2,796, and the HoH figure only reproduces from the PRINTED $2,218.00 constant
    ($2,218.00 + 6.6% x $8,750 = $2,795.50 -> $2,796), not from the exact $2,217.70. Bracket math therefore differs
    from the table by a few dollars inside a band; the filed form must use the table below $75,000.'
  - 'CRITICAL - 3% minimum tax not modeled: 2025 IN-111 Instr. Line 8: ''Taxpayers who have a federal Adjusted Gross
    Income (AGI) greater than $150,000 must pay a minimum Vermont tax of 3% of federal AGI. If your federal AGI, Line
    1, is greater than $150,000, enter the amount that is higher: 1) 3% of your federal AGI less interest from U.S.
    obligations, or 2) tax calculated on Vermont Taxable Income, Line 7, using the applicable tax rate schedule.''
    This op computes only (2); when the 3% floor binds (typically large modifications/deductions relative to AGI),
    plain bracket math understates Line 8.'
  - The printed schedules break a row at exactly $75,000 solely to flag the tax-table mandate — the rate does NOT
    change at $75,000 (e.g. MFJ 3.35% actually runs $0-$82,500; Single 6.60% runs $49,400-$119,700; MFS 6.60% runs
    $41,250-$99,725; HoH 6.60% runs $66,200-$171,000). Same-rate rows are merged in the shipped brackets; the math
    is identical.
  - 'Qualifying Widow(er)/surviving spouse: Schedule Y-1 is captioned ''Married Filing Jointly; Qualifying Widow(er);
    or Civil Union Filing Jointly'' and the 2025 standard-deduction chart gives Qualifying Widow(er) the same $15,300
    as MFJ, so the engine''s QSS-to-MFJ mapping matches Vermont exactly. Civil Union Filing Separately uses Schedule
    Y-2 (married_filing_separately); Civil Union Filing Jointly uses Y-1.'
  - 'Additional standard deduction not applied by the engine: $1,250 per standard-deduction box checked on federal
    Form 1040 (born before Jan. 2, 1961, or blind) is added to the Line 4 standard deduction per the 2025 chart —
    Single 8,900/10,150 for 1/2 boxes; MFJ or QW 16,550/17,800/19,050/20,300 for 1/2/3/4 boxes; MFS 8,900/10,150/11,400/12,650;
    HoH 12,700/13,950. Compute those cases from the form''s chart.'
  - 'Exemption gates not modeled: Line 5a counts yourself ONLY if no one can claim you as a dependent on a 2025 return;
    Line 5b (spouse/civil union partner) must be left blank if filing status is Qualifying Widow(er) or Married Filing
    Separately.'
  - Vermont has no itemized-deduction option on the 2025 IN-111 — Line 4 offers only the Vermont standard deduction
    (there is no itemized line on the form).
  - 'Steps between Line 8 and the final Line 14 ''Vermont Income Tax'' are NOT modeled: Line 9 Net Adjustment to Vermont
    Tax (Schedule IN-119 Part I — additions such as recapture of a Vermont tax credit and 24% of additional federal
    tax on qualified retirement plan/IRA/HSA/MSA distributions, federal Investment Tax Credit recapture, and Form
    4972 lump-sum distributions; subtractions such as the Credit for the Elderly or the Disabled, the Vermont-based
    portion of the Investment Tax Credit, and the Farm Income Averaging Credit), and Lines 11-13 the Tax Deductible
    Charitable Contribution — despite the caption, the 2025 instructions describe it as a nonrefundable tax CREDIT
    equal to 5% of the first $20,000 of qualifying charitable contributions (max $1,000, Line 13) subtracted from
    tax on Line 14, not an income deduction.'
  - 'Part-year residents and nonresidents: Line 15 income adjustment percentage (Schedule IN-113, Line 35) multiplies
    Line 14 to get Line 16 Adjusted Vermont Income Tax — not modeled; full-year residents enter 100%.'
