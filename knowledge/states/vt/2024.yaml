unverified:
- Exact ZIP+4 routing nuances were taken from the 2024 IN-111 Instructions; confirm current-year addresses at the
  DOR before mailing as PO Box assignments can change between filing years.
- myVTax portal base URL (myvtax.vermont.gov) is cited from the IN-111 instructions ('myVTax.vermont.gov'); the
  exact deep-link for an individual income tax payment was not separately captured — confirm the payment path at
  the DOR.
- Whether a specific tax treaty article is recognized for a given taxpayer should be confirmed at the DOR; the general
  conformity conclusion is based on the federal-AGI starting point plus the explicit U.S.-law-exempt-income subtraction,
  with no observed treaty add-back.
tax:
  citation:
    source: 'VT Dept. of Taxes — 2024 Form IN-111 instructions (archived official copy, Wayback 20250304 of the exact
      tax.vermont.gov URL; the standalone 2024 Tax Rate Schedules PDF, Wayback 20250117, prints identical schedules):
      Schedule X 47,900/116,000/242,000; Y-1 79,950/193,300/294,600; Y-2 (MFS) exactly half Y-1: 39,975/96,650/147,300;
      Z 64,200/165,700/268,300; rates 3.35/6.60/7.60/8.75%; printed base-tax constants (2,678/10,159/17,858 etc.) equal
      cumulative sums rounded to whole dollars; Line 4 standard deduction chart 7,400/14,850/7,400/11,100 (+$1,200 per
      federal box); Line 5e ''Multiply Line 5d by $5,100''; Line 8 3%-of-AGI minimum when federal AGI > $150,000; ''TAXABLE
      INCOME UNDER $75,000 USE THE TAX TABLES''; official worked example: $82,000 MFJ -> $2,813.'
    url: https://tax.vermont.gov/sites/tax/files/documents/IN-111-Instr-2024.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 47900, rate: 0.0335}
    - {over: 47900, but_not_over: 116000, rate: 0.066}
    - {over: 116000, but_not_over: 242000, rate: 0.076}
    - {over: 242000, but_not_over: null, rate: 0.0875}
    married_filing_jointly:
    - {over: 0, but_not_over: 79950, rate: 0.0335}
    - {over: 79950, but_not_over: 193300, rate: 0.066}
    - {over: 193300, but_not_over: 294600, rate: 0.076}
    - {over: 294600, but_not_over: null, rate: 0.0875}
    married_filing_separately:
    - {over: 0, but_not_over: 39975, rate: 0.0335}
    - {over: 39975, but_not_over: 96650, rate: 0.066}
    - {over: 96650, but_not_over: 147300, rate: 0.076}
    - {over: 147300, but_not_over: null, rate: 0.0875}
    head_of_household:
    - {over: 0, but_not_over: 64200, rate: 0.0335}
    - {over: 64200, but_not_over: 165700, rate: 0.066}
    - {over: 165700, but_not_over: 268300, rate: 0.076}
    - {over: 268300, but_not_over: null, rate: 0.0875}
  base: federal_agi
  tax_line: 'Form IN-111, Line 8: "Vermont Income Tax from tax table or tax rate schedule (If Line 1 is greater than
    $150,000, see instructions)". Line 7: "Vermont Taxable Income (SUBTRACT Line 6 from Line 3. If less than zero,
    enter -0-)", where Line 6 = Line 4 standard deduction + Line 5e personal exemption deduction.'
  exemptions:
    personal:
      amount: 5100
      note: 'IN-111 Line 5e: ''Multiply Line 5d by $5,100 (2024 Personal Exemption)''. Line 5d counts yourself (5a, only
        if nobody can claim you), jointly-filed spouse/CU partner (5b), and other dependents (5c) — pass the TOTAL count
        as exemptions_count (dependents are inside Line 5d, so dependents_count stays 0).'
  standard_deduction:
    single: 7400
    married_filing_jointly: 14850
    married_filing_separately: 7400
    head_of_household: 11100
  notes:
  - 'TY2024 sourcing: tax.vermont.gov 403s every direct fetcher — figures verified from Wayback CDX 200-status captures
    of the two exact official URLs (independent documents, identical schedules). Printed base-tax constants are whole-dollar
    roundings of exact cumulative sums (e.g. Y-1 at 79,950: 3.35% x 79,950 = 2,678.325 -> printed 2,678).'
  - 'Printed-constant divergence: the 2024 schedules'' VT Base Tax constants are whole-dollar roundings of exact cumulative
    sums (Y-1 at 79,950 prints 2,678 vs exact 2,678.325), so the filed worksheet can differ from exact marginal math
    by up to $1 (the booklet''s own $82,000 example prints $2,813; exact math gives $2,814). The <$75,000 tax-table
    mandate governs most filers.'
  - 'Base guidance: Supply Form IN-111, Line 3 "Federal AGI with Modifications" = Line 1 federal AGI (federal Form
    1040, Line 11) plus/minus Line 2 net modifications to federal AGI (Schedule IN-112, Part I, Line 18). With no
    Vermont modifications, Line 3 equals federal AGI, so plain federal AGI is the correct input for most filers. The
    op then subtracts the shipped Vermont standard deduction (IN-111 Line 4) and $4,850 per exemption (Lines 5a-5e)
    to reproduce Line 7, Vermont Taxable Income.'
  - 'Tax-table mandate below $75,000: each 2024 Vermont Tax Rate Schedule prints ''TAXABLE INCOME UNDER $75,000 USE
    THE TAX TABLES'' across its sub-$75,000 rows. The 2024 Vermont Tax Tables (IN-111 Instr. pp.13-17) compute tax
    at the midpoint of each $100 band, rounded to whole dollars (spot-verified: Single $30,000-$30,100 band = $1,007
    vs $1,005 exact bracket math at $30,000; $74,900-$75,000 band matches midpoint math for all four statuses), so
    bracket math may differ by a few dollars within table bands; the filed form must use the table below $75,000.'
  - 'CRITICAL - 3% minimum tax not modeled: IN-111 Instr. p.7, Line 8: ''Taxpayers who have a federal Adjusted Gross
    Income (AGI) greater than $150,000 must pay a minimum Vermont tax of 3% of federal AGI. If your federal AGI, Line
    1, is greater than $150,000, enter the amount that is higher: 1) 3% of your federal AGI less interest from U.S.
    obligations, or 2) tax calculated on Vermont Taxable Income, Line 7, using the applicable tax rate schedule.''
    This op computes only (2); when the 3% floor binds (typically large modifications/deductions relative to AGI),
    plain bracket math understates Line 8.'
  - 'Printed base-tax constants are rounded: the schedules'' ''VT Base Tax'' dollar constants are rounded to whole
    dollars and differ from the exact cumulative bracket sums by up to $0.50 (e.g., Single $1,521.00 printed vs $1,520.90
    exact; MFS $4,820.00 printed vs $4,819.64 exact; HoH $2,038.00 printed vs $2,038.48 exact). Form arithmetic using
    the printed constants can therefore differ by $1 from this op''s exact marginal-bracket math.'
  - The printed schedules break a row at exactly $75,000 solely to flag the tax-table mandate — the rate does NOT
    change at $75,000 (e.g., MFJ 3.35% actually runs $0-$75,850; Single 6.60% runs $45,400-$110,050). Same-rate rows
    are merged in the shipped brackets; the math is identical.
  - 'Qualifying Widow(er)/surviving spouse: Schedule Y-1 is captioned ''Married Filing Jointly; Qualifying Widow(er);
    or Civil Union Filing Jointly'' and the QW standard deduction is the same $14,050, so the engine''s QSS-to-MFJ
    mapping matches Vermont exactly. Civil Union Filing Separately uses Schedule Y-2 (married_filing_separately);
    Civil Union Filing Jointly uses Y-1.'
  - 'Additional standard deduction not applied by the engine: $1,150 per standard-deduction box checked on federal
    Form 1040 (born before Jan. 2, 1959, or blind) is added to the Line 4 standard deduction per the chart on IN-111
    Instr. p.7 — compute those cases from the form''s chart.'
  - 'Exemption gates not modeled: Line 5a counts yourself ONLY if no one can claim you as a dependent on a 2024 return;
    Line 5b (spouse/CU partner) must be left blank if filing status is Qualifying Widow(er) or Married Filing Separately.'
  - Vermont has no itemized-deduction option on the 2024 IN-111 — Line 4 offers only the Vermont standard deduction
    (there is no itemized line on the form).
  - 'Steps between Line 8 and the final Line 14 ''Vermont Income Tax'' are NOT modeled: Line 9 Net Adjustment to Vermont
    Tax (Schedule IN-119 Part I — additions such as recapture of a Vermont tax credit and 24% of certain additional
    federal taxes on IRA/HSA/MSA distributions, federal ITC recapture, Form 4972 lump-sum distributions; subtractions
    such as the credit for the elderly or disabled, Vermont-based ITC, farm income averaging credit), and Lines 11-13
    Vermont Charitable Contribution Deduction — despite the line caption, the instructions describe it as a nonrefundable
    tax CREDIT equal to 5% of the first $20,000 of eligible charitable contributions (max $1,000, Line 13) subtracted
    from tax on Line 14, not an income deduction.'
  - 'Part-year residents and nonresidents: Line 15 income adjustment percentage (Schedule IN-113, Line 35) multiplies
    Line 14 to get Line 16 Adjusted Vermont Income Tax — not modeled; full-year residents use 100%.'
