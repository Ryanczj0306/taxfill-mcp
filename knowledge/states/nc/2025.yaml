starts_from: federal adjusted gross income (Form D-400, Line 6 "Federal Adjusted Gross Income"; the 2025 D-401 Schedule
  S instructions — "The starting point for North Carolina taxable income is federal adjusted gross income as of
  January 1, 2023"); NC's starting basis remains the Internal Revenue Code as of January 1, 2023, so post-2023
  federal changes (including the 2025 federal reconciliation act, "OBBBA") do not apply unless NC specifically conforms
residency:
  summary: Residency is based on domicile. A North Carolina RESIDENT is an individual domiciled in NC at any time
    during 2025, or who resided in NC during 2025 for other than a temporary or transitory purpose; in the absence
    of convincing proof to the contrary, an individual present within NC for more than 183 days during the taxable
    year is presumed to be a resident, though absence from the state for more than 183 days raises no presumption
    of non-residence. A resident who moves from the state during 2025 remains an NC resident until the individual
    has BOTH established a definite domicile elsewhere AND abandoned any NC domicile (mere intent is not enough;
    voluntary and positive action must be taken). A PART-YEAR RESIDENT is one who moved into and became a resident
    of NC during 2025, or who moved out of NC and became a resident of another state during 2025. A NONRESIDENT
    is one who was not a resident at any time during 2025 but received NC-source income (real/tangible property
    in NC, a business/trade/profession/occupation carried on in NC, or NC gambling activities). A nonresident alien
    (one who has not passed the green card test or the substantial presence test) may be treated as resident, part-year,
    or nonresident for NC purposes; nonresident aliens are required to file NC returns at the same time they are
    required to file their federal returns.
forms:
  resident: Form D-400 (North Carolina Individual Income Tax Return, "D-400 Web-Fill 9-25") — used by all individuals
    including residents
  part_year_or_nonresident: Form D-400 with Form D-400 Schedule PN (2025 Part-Year Resident and Nonresident Schedule)
    to compute the NC taxable percentage (D-400 Line 13, from Schedule PN Line 24); if needed, Form D-400 Schedule
    PN-1 (Other Additions and Other Deductions). All filers, including part-year residents and nonresidents, file
    the same Form D-400.
credits_verification: 'State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it. Not independently confirmed (verify the
