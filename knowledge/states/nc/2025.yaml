# NC state knowledge — tax year 2025. Fetched + cited from the NC DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 D-401
# instruction booklet, then independently re-checked against a second official document
# (the 2025 Form D-400 web-fill itself, "D-400 Web-Fill 9-25", tax year 2025) —
# resolutions recorded inline where a second document does not print the figure.
# CHANGED for 2025 vs the 2024 pack: the individual income tax rate dropped 4.5% -> 4.25%
# (2025 D-401 "What is the Tax Rate?"; 2025 D-400 Line 15 "Multiply Line 14 by 4.25%
# (0.0425)"). UNCHANGED: the NC Standard Deduction Chart ($12,750/$25,500/$12,750/$19,125),
# the Child Deduction Table, the Filing Requirements Chart, and the January 1, 2023 IRC
# conformity date. NEW disclosure for 2025: the 2025 booklet states expressly that federal
# changes made by the reconciliation act ("OBBBA") do NOT apply for NC tax year 2025 —
# NC does not conform to the federal standard deduction, the federal itemized deduction
# amount, or the new federal Schedule 1-A additional deductions.
jurisdiction: states/nc
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'NC conforms. The 2025 D-401 instructions state for Form D-400 Schedule S: "The starting point for
  North Carolina taxable income is federal adjusted gross income as of January 1, 2023" (the 2025 booklet keeps
  the January 1, 2023 conformity date and adds expressly that OBBBA changes do not apply for tax year 2025 unless
  NC conforms). Because federally treaty-exempt income is already excluded from federal AGI, it flows through to
  NC untaxed UNLESS NC adds it back. The 2025 Form D-400 Schedule S, Part A "Additions to Federal Adjusted Gross
  Income" list, as enumerated line-by-line in the 2025 D-401 (Line 1 interest from obligations of states other than
  NC; Line 2 deferred gains reinvested into a qualified Opportunity Fund under IRC 1400Z-2; Line 3 85% of bonus
  depreciation — NC did not adopt IRC 168(k) or the new IRC 168(n); Line 4 85% of the IRC 179 difference; Line 5
  S-corporation shareholder built-in gains tax; Line 6 amount by which federal basis exceeds state basis on property
  disposed of in 2025; Line 7 federal net operating loss deduction; Line 8 state/local/foreign income tax deducted
  under IRC 164 by an S corporation, partnership, or estate and trust; Line 9 withdrawal of 529 plan contributions
  not used for qualified purposes; Line 10 discharge of qualified principal residence indebtedness; Line 11 qualified
  education loan payments paid by an employer excluded under IRC 127(c); Line 12 expenses allocable to income exempt
  or excluded; Line 13 discharge of certain student loan debt; Line 14 taxed pass-through entity loss; Line 15 "Reserved
  for Future Use. Do not enter an amount on this line."; Line 16 "Total Additions. Add Lines 1 through 15") contains
  NO add-back of treaty-exempt income. Since treaty-exempt income is not re-taxed, conforms_to_federal_treaties
  = true. Note one nuance to flag for filers: Schedule S Part A Line 12 requires adding back EXPENSES allocable
  to income exempt from NC tax, but it does not add back the exempt income itself. (For 2025 the whole Part A list
  is transcribed — the 2024 pack''s unverified gap on Lines 14-15 is CLOSED: Line 14 is the taxed pass-through entity
  loss and Line 15 is expressly reserved and left blank.)'
