payment:
  check_payee: NC Department of Revenue ("Make your check or money order payable to the NC Department of Revenue
    for the full amount due. Write ''2025 D-400'' and your name, address, and the last 4 digits of your Social Security
    number on your payment"; on a joint return write the last 4 digits of both SSNs in the order they appear on
    the return; a check/money order/cashier's check must be drawn on a US (domestic) bank with funds payable in
    US dollars; do not send cash). The 2025 "What You Should Send Us" list writes the payee as the "North Carolina
    Department of Revenue" — the two spellings are the same payee.
  web_pay_url: https://www.ncdor.gov/file-pay/file-pay-individuals
  note: Pay online by bank draft with NO convenience fee, or by Mastercard/Visa with a $2 convenience fee for every
    $100 paid (2025 D-401 "How Can I Pay?"). If you do not pay online you must generate a personalized Form D-400V
    payment voucher from the Department's website and mail it with the return and payment.
