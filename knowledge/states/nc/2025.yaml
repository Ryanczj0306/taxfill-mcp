  source: 2025 D-401 North Carolina Individual Income Tax Instructions (Form D-401) — General Information (Who Must
    File, residency/183-day presumption), When Must I File ("the 2025 return is due on or before April 15th, 2026"),
    What is the Tax Rate? ("For tax year 2025, the individual income tax rate is 4.25%. To calculate your North Carolina
