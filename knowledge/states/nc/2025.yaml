credits:
- name: Credit for Income Tax Paid to Another State or Country
  type: nonrefundable
  eligibility: N.C. residents (and part-year residents for the resident period) only. Available when income earned
    while a legal resident of North Carolina is taxed by both North Carolina and another U.S. state or a foreign
    country because it was earned in or derived from sources in that other state/country. No credit for tax paid
    to a city/county/other political subdivision or to the federal government. Nonresidents are NOT entitled to
    this credit. A copy of the return filed with the other state/country and proof of payment must be attached
    (the 2025 D-401 "What You Should Send Us" list requires Form D-400TC — and, if applicable, Form NC-478 and
    Form NC-Rehab — whenever a tax credit is claimed on Form D-400, Line 16).
  amount: Credit = the LESSER of (a) the proportion of N.C. income tax attributable to the double-taxed income
    or (b) the net income tax actually paid to the other state/country on that income (2025 D-401, Form D-400TC
    Part 1 instructions — Line 1 total income while an NC resident, Line 2 the portion taxed by the other state
    or country, Line 3 the Line 2 / Line 1 decimal, Line 4 "Total North Carolina Income Tax. Enter the amount
    from Form D-400, Line 15", Line 6 "Amount of Net Tax Paid to the Other State or Country on the Income Shown
    on Line 2"). No fixed dollar amount. For multiple states/countries, a separate Out-of-State Tax Credit
    Worksheet is used per jurisdiction.
  income_limit_2025: 'No income limit. The credit is limited mechanically: total credits taken (D-400TC Part 3)
    cannot exceed the N.C. income tax on D-400 Line 15.'
  claimed_on: Form D-400TC, Part 1 (result flows through Part 3); then reported on Form D-400, Line 16 ("Tax Credits
    (From Form D-400TC, Part 3, Line 20)" per the 2025 Form D-400 itself).
  citation:
    source: NCDOR 2025 D-401 Individual Income Tax Instructions (Instructions for Form D-400TC, Part 1) and 2025
      Form D-400 Line 16
    url: https://www.ncdor.gov/2025-d-401-individual-income-tax-instructions/open
- name: Tax Credit for Rehabilitating Historic Structures (Articles 3D / 3H / 3L)
  type: nonrefundable
  eligibility: Narrow / not broadly applicable to ordinary residents. Available to taxpayers who incur qualified
    rehabilitation expenditures/expenses on a certified historic structure or historic mill facility under Article
    3D, Article 3H (historic mill facility), or Article 3L (Historic Rehabilitation Tax Credits Investment Program;
    requires Form NC-Rehab, "NC-Rehab, 2025 Historic Rehabilitation Tax Credits", attached to the front of Form
    D-400). Distinguishes income-producing vs. non-income-producing structures.
  income_limit_2025: No income limit, but total credits on D-400TC cannot exceed the N.C. income tax on D-400 Line
    15. Specific credit percentages/caps vary by Article (3D/3H/3L) and are set in the respective General Statutes
    / Form NC-Rehab, which were not extracted as exact figures here.
  claimed_on: Form D-400TC, Part 2 (Article 3L requires Form NC-Rehab; the 2025 D-401 "What You Should Send Us"
    list names Form NC-478, "2025 Summary of Tax Credits Limited to 50% of Tax", and Form NC-Rehab attachments);
    flows to D-400 Line 16.
  citation:
    source: NCDOR 2025 D-401 Instructions (Form D-400TC credits; What You Should Send Us — NC-478/NC-Rehab; "What
      Form Should I File?" form list)
    url: https://www.ncdor.gov/2025-d-401-individual-income-tax-instructions/open
  unverified: true
filing_requirement:
  note: 'A 2025 NC return is required if federal gross income for 2025 exceeds the filing threshold for your status
    (2025 Filing Requirements Chart, D-401 p.6): Single $12,750; Married - Filing Jointly $25,500; Married - Filing
    Separately $12,750 (if spouse does not claim itemized deductions) or $0 (if spouse claims itemized deductions);
    Head of Household $19,125; Qualifying Widow(er)/Surviving Spouse $25,500; Nonresident Alien $0 (regardless of
    filing status). NC minimum gross income filing requirements differ from the IRC because NC law "does not allow
    the same standard deduction amount as the Internal Revenue Code." Even below the threshold you must file to
    get a refund of NC tax withheld. A part-year resident or nonresident with NC-source income must file if total
    gross income from all sources exceeds the threshold for the filing status.'
