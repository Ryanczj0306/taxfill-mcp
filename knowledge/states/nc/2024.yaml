starts_from: federal adjusted gross income (Form D-400, Line 6 — "The starting point for determining North Carolina
  taxable income is federal adjusted gross income"); the NC starting basis is the Internal Revenue Code as of January
  1, 2023 (the 2024 D-401 states all IRC changes as of January 1, 2023 apply for tax year 2024 unless NC specifically
  decouples)
residency:
  summary: Residency is based on domicile. A North Carolina RESIDENT is an individual domiciled in NC at any time
    during 2024, or who resided in NC during 2024 for other than a temporary or transitory purpose; an individual
    present in NC for more than 183 days during the taxable year is presumed (rebuttably) to be a resident, though
    absence for more than 183 days raises no presumption of non-residence. A PART-YEAR RESIDENT is one who moved
    into and became a resident of NC during 2024, or who moved out of NC and became a resident of another state
    during 2024 (a resident who moves away remains an NC resident until a definite new domicile is established elsewhere
    and the NC domicile is abandoned). A NONRESIDENT is one who was not a resident at any time during 2024 but received
    income from NC sources. A nonresident alien may be treated as resident, part-year, or nonresident for NC purposes;
    nonresident aliens are required to file NC returns at the same time they are required to file their federal returns.
forms:
  resident: Form D-400 (North Carolina Individual Income Tax Return) — used by all individuals including residents
  part_year_or_nonresident: Form D-400 with Form D-400 Schedule PN (2024 Part-Year Resident and Nonresident Schedule)
    to compute the NC taxable percentage (D-400 Line 13); if needed, Form D-400 Schedule PN-1 (Other Additions and
    Other Deductions). All filers, including part-year residents and nonresidents, file the same Form D-400.
credits_verification: 'State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it. Not independently confirmed (verify the
  figure): Tax Credit for Rehabilitating Historic Structures (Articles 3D / 3H / 3L).'
credits:
- name: Credit for Income Tax Paid to Another State or Country
  type: nonrefundable
  eligibility: N.C. residents (and part-year residents for the resident period) only. Available when income earned
    while a legal resident of North Carolina is taxed by both North Carolina and another U.S. state or a foreign
    country because it was earned in or derived from sources in that other state/country. No credit for tax paid
    to a city/county/other political subdivision or to the federal government. Nonresidents are NOT entitled to
    this credit. A copy of the return filed with the other state/country and proof of payment must be attached
    (the 2024 D-401 "What You Should Send Us" list requires a copy of the other state's return when the credit
    is claimed on Form D-400TC, Part 1, Line 7a).
  amount: Credit = the LESSER of (a) the proportion of N.C. income tax attributable to the double-taxed income
    or (b) the net income tax actually paid to the other state/country on that income (2024 D-401, Form D-400TC
    Part 1 instructions — "Line 6. Amount of Net Tax Paid to the Other State or Country on the Income Shown on
    Line 2"). No fixed dollar amount. For multiple states/countries, a separate Out-of-State Tax Credit Worksheet
    is used per jurisdiction.
  income_limit_2024: 'No income limit. The credit is limited mechanically: total credits taken (D-400TC Part 3)
    cannot exceed the N.C. income tax on D-400 Line 15.'
  claimed_on: Form D-400TC, Part 1 (result flows through Part 3); then reported on Form D-400, Line 16 ("Tax Credits
    (From Form D-400TC, Part 3, Line 20)" per the 2024 D-400 form).
  citation:
    source: NCDOR 2024 D-401 Individual Income Tax Instructions (Instructions for Form D-400TC, Part 1) and 2024
      Form D-400 Line 16
    url: https://www.ncdor.gov/2024-d-401-individual-income-tax-instructions/open
- name: Tax Credit for Rehabilitating Historic Structures (Articles 3D / 3H / 3L)
  type: nonrefundable
  eligibility: Narrow / not broadly applicable to ordinary residents. Available to taxpayers who incur qualified
    rehabilitation expenditures/expenses on a certified historic structure or historic mill facility under Article
    3D, Article 3H (historic mill facility), or Article 3L (Historic Rehabilitation Tax Credits Investment Program;
    requires Form NC-Rehab attached to the front of Form D-400). Distinguishes income-producing vs. non-income-producing
    structures.
  income_limit_2024: No income limit, but total credits on D-400TC cannot exceed the N.C. income tax on D-400 Line
    15. Specific credit percentages/caps vary by Article (3D/3H/3L) and are set in the respective General Statutes
    / Form NC-Rehab, which were not extracted as exact figures here.
  claimed_on: Form D-400TC, Part 2 (Article 3L requires Form NC-Rehab; the 2024 D-401 "What You Should Send Us"
    list names Form NC-478 and Form NC-Rehab attachments); flows to D-400 Line 16.
  citation:
    source: NCDOR 2024 D-401 Instructions (Form D-400TC credits; What You Should Send Us — NC-478/NC-Rehab)
    url: https://www.ncdor.gov/2024-d-401-individual-income-tax-instructions/open
  unverified: true
filing_requirement:
  note: 'A 2024 NC return is required if federal gross income for 2024 exceeds the filing threshold for your status
    (2024 Filing Requirements Chart, D-401 p.6): Single $12,750; Married Filing Jointly $25,500; Married Filing
    Separately $12,750 (if spouse does not claim itemized deductions) or $0 (if spouse claims itemized deductions);
    Head of Household $19,125; Qualifying Widow(er)/Surviving Spouse $25,500; Nonresident Alien $0 (regardless of
    filing status). NC minimum gross income filing requirements differ from the IRC because NC''s standard deduction
    differs from the federal. A part-year resident or nonresident with NC-source income must file if total gross
    income from all sources exceeds the threshold for the filing status.'
