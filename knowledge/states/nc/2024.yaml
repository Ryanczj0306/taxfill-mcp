# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 D-401 instructions and the 2024
# Form D-400 web-fill itself (ncdor.gov): rate 4.5% (down from 4.75% in 2023),
# standard deduction chart unchanged from 2023.
tax:
  citation:
    source: '2024 D-401 North Carolina Individual Income Tax Instructions — "For tax year 2024, the individual income
      tax rate is 4.5%. To calculate your North Carolina tax liability, multiply your North Carolina taxable income
      by 4.5% (0.0450)"; N.C. Standard Deduction Chart (D-400 Line 11): $12,750 single / $25,500 MFJ-QSS / $12,750 MFS
      ($0 if spouse itemizes) / $19,125 HoH; child deduction table (D-400 Line 10); D-400 Line 6 = federal AGI. Second
      pass: the 2024 Form D-400 (web-fill 9-24) itself prints Line 15 "Multiply Line 14 by 4.5% (0.0450). If zero or
      less, enter a zero." — both passes agree (the form does not print the standard-deduction chart; see pack unverified).'
    url: https://www.ncdor.gov/2024-d-401-individual-income-tax-instructions/open
  flat_rate: 0.045
  base: federal_agi
  tax_line: 'D-400 Line 15: multiply Line 14 (N.C. taxable income, full-year residents) by the income tax rate of
    4.5% (0.0450) — printed on the 2024 form: "Multiply Line 14 by 4.5% (0.0450). If zero or less, enter a zero."
    Line 6 starts from federal AGI; Line 14 = federal AGI + additions - deductions - child deduction (Line 10) - N.C.
    standard/itemized deduction (Line 11).'
  exemptions: {}
  standard_deduction:
    single: 12750
    married_filing_jointly: 25500
    married_filing_separately: 12750
    head_of_household: 19125
  notes:
  - 'Rate change: the individual income tax rate dropped to 4.5% (0.0450) for tax year 2024 (from 4.75% in 2023) —
    2024 D-401 "What is the Tax Rate?"; the standard deduction chart is unchanged from 2023.'
  - 'Standard-deduction gates NOT modeled by calc.state_tax: MFS gets $0 if the spouse itemizes, and the N.C. standard
    deduction is ZERO for anyone not eligible for the FEDERAL standard deduction (see federal Pub 501; the filing
    chart lists nonresident aliens at $0) — itemizers use D-400 Line 11 itemized deductions (Form D-400 Schedule A)
    instead; compute those cases on the form.'
  - 'N.C. child deduction (D-400 Line 10) is NOT modeled: up to $3,000 per qualifying child (a child for whom the
    federal child tax credit was allowed), stepping down $3,000/$2,500/$2,000/$1,500/$1,000/$500/$0 by federal AGI
    (MFJ/QSS brackets up to $40,000 ... over $140,000; HoH up to $30,000 ... over $105,000; Single/MFS up to $20,000
    ... over $70,000) — the 2024 D-401 Child Deduction Table is unchanged from 2023; take it from the worksheet, not
    from a per-dependent exemption.'
  - North Carolina has no personal or dependent exemptions.
