# NC state knowledge — tax year 2024. Fetched + cited from the NC DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 D-401
# instruction booklet, then independently re-checked against a second official document
# (the 2024 Form D-400 web-fill itself) — resolutions recorded inline where a second
# document does not print the figure.
jurisdiction: states/nc
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'NC conforms. The 2024 D-401 instructions state on Line 6: "The starting point for determining North
  Carolina taxable income is federal adjusted gross income" (IRC as of January 1, 2023 — the 2024 booklet keeps
  the January 1, 2023 conformity date). Because federally treaty-exempt income is already excluded from federal
  AGI, it flows through to NC untaxed UNLESS NC adds it back. The Form D-400 Schedule S, Part A "Additions to Federal
  Adjusted Gross Income" list in the 2024 D-401 (Lines 1-16: non-NC state/local bond interest, Opportunity Fund
  deferred gains, 85% bonus depreciation, 85% of the IRC 179 difference, S-corp built-in gains, federal-over-state
  basis on 2024 dispositions, federal NOL, pass-through state/local/foreign income tax under IRC 164, non-qualifying
  N.C. 529 withdrawals, discharge of qualified principal residence indebtedness, employer education-loan payments
  under IRC 127(c), expenses allocable to exempt income, discharge of certain student loan debt, etc.) contains
  NO add-back of treaty-exempt income. Since treaty-exempt income is not re-taxed, conforms_to_federal_treaties
  = true. Note one nuance to flag for filers: Schedule S Part A Line 12 requires adding back EXPENSES allocable
  to income exempt from NC tax, but it does not add back the exempt income itself.'
