tax:
  citation:
    source: 'Georgia DOR, 2023 IT-511 Individual Income Tax Booklet (500 and 500EZ Forms and General Instructions) —
      Georgia Tax Rate Schedule, p.59 (Single; Married Filing Joint or Head of Household; Married Filing Separate);
      Georgia Tax Rate Worksheet and Examples 1-2, pp.60-61; Form 500 line instructions pp.11-12 (Line 11a standard
      deduction $5,400 Single/HoH/QSS, $3,550 MFS, $7,100 MFJ, $1,300 additional deduction; Line 14a personal exemption
      $2,700 status A/D, $3,700 status B/C; Line 14b $3,000 per dependent; Line 16 tax); Filing Requirements chart p.9
      (combined standard deduction + personal exemptions: $8,100 Single/HoH/QSS, $14,500 MFJ, $7,250 MFS); Georgia Income
      Tax Table pp.63-65; What''s New p.7 (2024 changes). Cross-checked against Form 500 (Rev. 08/30/23) pages 2-3 (Lines
