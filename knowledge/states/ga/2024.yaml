# GA state knowledge — tax year 2024. Fetched + cited from the GA DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 IT-511 Individual
# Income Tax Instruction Booklet, then independently re-derived from a second official
# document (the 2024 Form 500 blank return itself, which prints the $12,000/$24,000
# standard deduction, the $4,000 dependent multiplier, and the 5.39% tax line) —
# resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGE (What's New): Georgia went FLAT. "Effective January 1, 2024, the
# income tax rate is 5.39%. Additionally, personal exemptions have been repealed except
# for the $4,000 dependent exemption. Finally, Georgia standard deductions have increased
# to $24,000 for Married filing jointly returns and $12,000 for Single, Head of household,
# and Married filing separately returns." The 2023 graduated schedules, the $2,700/$3,700
# personal exemptions, the $5,400/$7,100/$3,550 standard deductions, and the $1,300
# age-65/blind additional deduction are ALL GONE — do not carry 2023 figures forward.
jurisdiction: states/ga
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Georgia conforms. The resident return (Form 500) starts from federal adjusted gross income (2024 Form
  500, Line 8: "Federal adjusted gross income (From Federal Form 1040)" with the warning "Do not use FEDERAL TAXABLE
  INCOME"), and adjustments are made only on Form 500 Schedule 1. The 2024 Schedule 1 ADDITIONS (lines 1-5) are
  limited to: (1) Interest on Non-Georgia Municipal and State Bonds, (2) Lump Sum Distributions, (3) Depreciation,
  (4) Net operating loss carryover deducted on the Federal return, and (5) Other (Specify) — there is NO add-back
  of federally treaty-exempt income (unlike California''s Schedule CA add-back). To the contrary, the 2024 IT-511
  booklet expressly lists as a SUBTRACTION item: "Income from any fund, program or system which is specifically
  exempted by Federal law or treaty." Because treaty-exempt income is already excluded from federal AGI and GA neither
  adds it back nor otherwise re-taxes it (and explicitly recognizes the treaty exemption), it flows through untaxed.'
