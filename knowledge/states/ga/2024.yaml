  source: GA Form 500 (2024) blank return - Line 8 'Federal adjusted gross income (From Federal Form 1040)', Line
    9 Schedule 1 adjustments, Line 4 residency status (1 full-year/2 part-year/3 nonresident), Line 11 standard
    deduction ($12,000 status A/C/D, $24,000 status B), Line 14 dependent exemption (Line 7c x $4,000), Line 16
