unverified:
- The statutory citations for the 2024 flat-rate structure (HB 1437 (2022) created the flat tax at 5.49% and HB
  1015 (2024) lowered the 2024 rate to 5.39%) were not re-derived from the session-law texts; the 5.39% rate, the
  $12,000/$24,000 standard deductions, and the $4,000 dependent exemption are two-pass confirmed at the cited official
  2024 IT-511 booklet and 2024 Form 500.
- Exact gross-income filing thresholds for nonresidents/part-year residents as a standalone dollar figure (the IT-511
  chart thresholds are framed for full-year residents; nonresidents/part-year file Form 500+Schedule 3 if required
  to file federally and they have GA-source income) - confirm at DOR if a precise nonresident threshold is needed.
- The exact GTC URL (gtc.dor.ga.gov) is printed in the 2024 IT-511 booklet ('Visit https://gtc.dor.ga.gov'); the
  canonical payment landing page remains https://dor.georgia.gov/taxes/how-do-i-make-tax-payment — confirm the live
  GTC URL at the DOR site.
tax:
  citation:
    source: 'Georgia DOR, 2024 IT-511 Individual Income Tax Instruction Booklet — What''s New: ''Effective January 1,
      2024, the income tax rate is 5.39%. Additionally, personal exemptions have been repealed except for the $4,000
      dependent exemption. Finally, Georgia standard deductions have increased to $24,000 for Married filing jointly
      returns and $12,000 for Single, Head of household, and Married filing separately returns''; Line 11 standard deduction
      chart (Married filing jointly $24,000; Single, Married filing separately, Head of household, Qualifying surviving
      spouse $12,000 each); Line 14 ''Multiply the number of dependents on Line 7c by $4,000''; Line 16 ''Multiply the
      amount on Line 15c by 5.39%. Round to nearest dollar.'' Second pass: the 2024 Form 500 itself prints Line 11 ''Enter
      $12,000 if the filing status from Line 5 is A, C, or D. If the filing status is B, enter $24,000'', Line 14 ''Enter
      the number from Line 7c. Multiply by $4,000'', and Line 16 ''Tax (Multiply Line 15c by 5.39%. Round to the nearest
      dollar)'' (https://dor.georgia.gov/document/document/2024-500-individual-income-tax-return-blank-form-printing/download)
      — both passes agree.'
    url: https://dor.georgia.gov/document/document/2024-it-511-individual-income-tax-booklet/download
  flat_rate: 0.0539
  base: federal_agi
  tax_line: 'Form 500, Line 16: ''Tax (Multiply Line 15c by 5.39%. Round to the nearest dollar)''. Line 15c Georgia
    Taxable Income = Line 10 Georgia AGI minus Line 11 standard deduction (or Line 12c itemized), minus Line 14 dependent
    exemption (Line 7c x $4,000), minus Line 15b Georgia NOL utilized.'
  exemptions:
    dependent:
      amount: 4000
      note: 'Form 500 Line 14: number of dependents (Line 7c) x $4,000 (raised from $3,000 by 2024 legislation; the 2024
        What''s New confirms ''personal exemptions have been repealed except for the $4,000 dependent exemption''). A
        true base reduction (Line 15a = Line 13 minus Line 14), not a credit. Line 7c includes unborn dependents with
        a detectable heartbeat (Line 7b, Georgia LIFE Act); an unborn dependent cannot be claimed if the child is born
        during the same tax year.'
  standard_deduction:
    single: 12000
    married_filing_jointly: 24000
    married_filing_separately: 12000
    head_of_household: 12000
  notes:
  - '2024 STRUCTURAL CHANGE — GEORGIA WENT FLAT: 5.39% of Georgia taxable income for ALL filing statuses (What''s
    New: ''Effective January 1, 2024, the income tax rate is 5.39%''), replacing the 2023 1%-5.75% graduated schedules.
    Personal exemptions are REPEALED (the 2023 $2,700/$3,700 per-status amounts are gone) except the dependent exemption,
    now $4,000 (2023: $3,000). Standard deductions are now $24,000 MFJ and $12,000 for everyone else (2023: $5,400/$7,100/$3,550
    + exemptions). The 2023 pack''s folding trick (shipping standard deduction + personal exemption as a combined
    $8,100/$14,500/$7,250 figure) NO LONGER APPLIES — the shipped standard_deduction is the printed Form 500 Line
    11 amount, verbatim.'
  - 'Base guidance: Supply Form 500, Line 10 ''Georgia adjusted gross income'' (Line 8 federal AGI from Form 1040,
    net of Line 9 adjustments from Form 500 Schedule 1) for a FULL-YEAR resident. The op subtracts the per-status
    Line 11 standard deduction and $4,000 per dependent (Line 14) to reach Line 15c Georgia taxable income (assuming
    no Line 15b NOL), then multiplies by 5.39%. Pass exemptions_count=0 — Georgia has NO personal exemption for 2024
    (repealed); pass dependents_count = Form 500 Line 7c (qualified dependents plus unborn dependents). Do not use
    this op if you itemize deductions, claim a Georgia NOL (Line 15b), or file as a part-year resident/nonresident
    (they omit Lines 9-14 and use Schedule 3, which prorates the deduction) — compute those on the form.'
  - 'QUALIFYING SURVIVING SPOUSE: Georgia files QSS under filing status D ''Head of Household or Qualifying Surviving
    Spouse'' with a $12,000 standard deduction (both the 2024 Form 500 Line 5 status list and the IT-511 Line 11 chart,
    which prints ''Qualifying surviving spouse $12,000'') — pass head_of_household to this op, NOT married_filing_jointly.
    The engine''s default QSS->married_filing_jointly mapping would apply MFJ''s $24,000 and UNDERSTATE tax.'
  - 'AGE-65/BLIND ADDITIONAL DEDUCTION GONE: the 2023 $1,300-per-checkbox additional standard deduction (old Form
    500 Line 11b) is NOT printed anywhere on the 2024 Form 500 or in the 2024 IT-511 Line 11 instructions — the flat
    $12,000/$24,000 amounts are the entire standard deduction. No age_65/blind keys ship for 2024.'
  - 'ITEMIZERS NOT MODELED: if you itemized on your federal return (or are MFS and your spouse itemizes), you MUST
    itemize on the Georgia return (Line 12c = federal Schedule A total less Georgia adjustments) and the standard
    deduction does not apply. NEW for 2024: itemizing residents may claim the Georgia Resident Itemizer Tax Credit
    of up to $300 per taxpayer on Form 500 Line 19 — a CREDIT against Line 16 tax, not a base reduction, and not modeled.'
  - 'NO tax table and NO rate schedule for 2024: Line 16 is a straight multiplication printed on the form (''Multiply
    Line 15c by 5.39%. Round to the nearest dollar'') — the 2023 booklet''s per-status Tax Rate Schedules and $100-band
    Georgia Income Tax Table no longer exist.'
  - 'Georgia NOL not modeled: Form 500 Line 15b (Georgia NOL utilized, limited to 80% of Line 15a income for losses
    from tax years 2018+) is subtracted before Line 15c taxable income.'
  - 'Part-year residents and nonresidents not modeled: they omit Form 500 Lines 9-14 and use Schedule 3, which prorates
    the standard deduction and dependent exemption by the Georgia-income ratio. This pack''s subtractions apply only
    to full-year residents. Taxpayers required to file federal Form 1040NR generally may NOT take the Georgia standard
    deduction (2024 IT-511: most are allowed only the limited Form 1040NR itemized deductions).'
  - 'CREDITS (subtracted from tax, NOT modeled and NOT base reductions): Low Income Credit (Form 500 Line 17 — a per-exemption
    CREDIT of $5-$26 for federal AGI under $20,000); Other State(s) Tax Credit (Line 18); Georgia Resident Itemizer
    Tax Credit (Line 19, NEW for 2024, up to $300 per itemizing taxpayer); IND-CR series 200 credits (Line 20); Schedule
    2 series 100 credits (Line 21). Total credits used (Line 22) cannot exceed Line 16 tax.'
  - 'Rounding: the Form 500 Line 16 instruction itself mandates ''Round to the nearest dollar''; this pack rounds
    half-up to whole dollars (irs_round), matching the form''s presentation.'
