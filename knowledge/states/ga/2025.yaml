  - Georgia DOR 2025 IT-511 booklet, Line 19 instructions (Georgia Eligible Itemizer Tax Credit)
  - Georgia DOR 2025 IT-511 booklet, IND-CR 202 Child and Dependent Care Expense Credit (Tax Credit 202), O.C.G.A.
    Section 48-7-29.10
  - Georgia DOR 2025 IT-511 booklet, IND-CR 204 Qualified Caregiving Expense Credit (Tax Credit 204), O.C.G.A. Section
    48-7-29.2
  - Georgia DOR 2025 IT-511 booklet, IND-CR 201 Disabled Person Home Purchase or Retrofit Credit (Tax Credit 201),
    O.C.G.A. Section 48-7-29.1
