# Provenance: see git history (git show 7a90a06:knowledge/states/ga/2025.yaml); sources: the `sources` table
jurisdiction: states/ga
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Georgia conforms. The resident return (Form 500) starts from federal adjusted gross income (2025 Form
  500, Line 8: "Federal adjusted gross income (From Federal Form 1040)" with the warning "Do not use FEDERAL TAXABLE
  INCOME"), and adjustments are made only on Form 500 Schedule 1. The Schedule 1 ADDITIONS do not include any add-back
  of federally treaty-exempt income (unlike California''s Schedule CA add-back). To the contrary, the IT-511 booklet
  expressly lists as a SUBTRACTION item income specifically exempted by Federal law or treaty. Because treaty-exempt
  income is already excluded from federal AGI and GA neither adds it back nor otherwise re-taxes it (and explicitly
  recognizes the treaty exemption), it flows through untaxed.'
citation:
  source: GA Form 500 (2025) blank return - Line 8 'Federal adjusted gross income (From Federal Form 1040)', Line
    9 Schedule 1 adjustments, Line 5 filing statuses (A Single / B MFJ / C MFS / D Head of household or Qualifying
    surviving spouse), Line 11 standard deduction ($12,000 status A/C/D, $24,000 status B), Line 14 dependent exemption
    (Line 7c x $4,000), Line 16 tax (Line 15c x 5.19%, round to nearest dollar)
  url: https://dor.georgia.gov/document/document/2025-500-individual-income-tax-return-blank-form-printing/download
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Low Income Tax Credit
  type: nonrefundable
  eligibility: Georgia residents whose Federal adjusted gross income (FAGI) is less than $20,000 and who are not
    claimed (or eligible to be claimed) as a dependent on another taxpayer's federal or Georgia return. Cannot be
    claimed by an inmate in a correctional facility. Part-year residents qualify only if they were Georgia residents
    at the end of the tax year.
  claimed_on: Form 500, Line 17 (17a = number of exemptions, 17b = per-exemption credit from table, 17c = total)
    using the Low Income Credit Worksheet in the 2025 IT-511 booklet
  citation:
    source: Georgia DOR 2025 IT-511 Individual Income Tax Instruction Booklet, Low Income Credit Worksheet and Line
      17 instructions
    url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
- name: Georgia Eligible Itemizer Tax Credit
  type: nonrefundable
  eligibility: Full-year residents and part-year residents living in Georgia at the end of the year who itemized
    deductions on their returns.
  claimed_on: Form 500, Line 19
  citation:
    source: Georgia DOR 2025 IT-511 booklet, Line 19 instructions (Georgia Eligible Itemizer Tax Credit)
    url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
- name: Child and Dependent Care Expense Credit (Credit Code 202)
  type: nonrefundable
  eligibility: Georgia taxpayers who claimed and were allowed the federal child & dependent care expense credit
    under Internal Revenue Code Section 21 on their federal Form 1040.
  claimed_on: Form IND-CR Schedule 202 (included with Form 500/500X); result carried to the IND-CR Summary Worksheet,
    whose total flows to Form 500, Line 20
  citation:
    source: Georgia DOR 2025 IT-511 booklet, IND-CR 202 Child and Dependent Care Expense Credit (Tax Credit 202),
      O.C.G.A. Section 48-7-29.10
    url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
- name: Qualified Caregiving Expense Credit (Credit Code 204)
  type: nonrefundable
  eligibility: Taxpayers who pay qualified caregiving expenses for a qualifying family member who is at least age
    62 OR has been determined disabled by the Social Security Administration. Qualified services must be obtained
    from an organization or individual NOT related to the taxpayer or family member.
  claimed_on: Form IND-CR Schedule 204 (included with Form 500/500X); result carried to the IND-CR Summary Worksheet,
    whose total flows to Form 500, Line 20
  citation:
    source: Georgia DOR 2025 IT-511 booklet, IND-CR 204 Qualified Caregiving Expense Credit (Tax Credit 204), O.C.G.A.
      Section 48-7-29.2
    url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
- name: Disabled Person Home Purchase or Retrofit Credit (Credit Code 201)
  type: nonrefundable
  eligibility: A permanently disabled person (the taxpayer or the taxpayer's spouse on a joint return) who has been
    issued a permanent parking permit by the Department of Revenue, and who purchases a new single-family home containing
    all four required accessibility features, or retrofits an existing single-family home with one or more of those
    features.
  claimed_on: Form IND-CR Schedule 201 (included with Form 500/500X); result carried to the IND-CR Summary Worksheet,
    whose total flows to Form 500, Line 20
  citation:
    source: Georgia DOR 2025 IT-511 booklet, IND-CR 201 Disabled Person Home Purchase or Retrofit Credit (Tax Credit
      201), O.C.G.A. Section 48-7-29.1
    url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
