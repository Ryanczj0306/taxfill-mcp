unverified:
- The statutory citation for the 2025 rate acceleration (HB 111, 2025 session) is taken from the GA DOR press release
  and cross-referenced to the 2025 IT-511 What's New; the 5.19% rate, the $12,000/$24,000 standard deductions, and
  the $4,000 dependent exemption are two-pass confirmed at the cited official 2025 IT-511 booklet and 2025 Form 500.
- Exact gross-income filing thresholds for nonresidents/part-year residents as a standalone dollar figure (the IT-511
  chart thresholds are framed for full-year residents; nonresidents/part-year file Form 500+Schedule 3 if required
  to file federally and they have GA-source income) — confirm at DOR if a precise nonresident threshold is needed.
- The 2025 IND-CR credit percentages/caps and the Low Income Credit Worksheet table were carried from 2024 and not
  line-by-line re-transcribed this pass; confirm at the cited 2025 IT-511 booklet when claiming.
tax:
  citation:
    source: 'Georgia DOR, 2025 IT-511 Individual Income Tax Instruction Booklet — What''s New: ''Effective January 1,
      2025, the income tax rate is 5.19%. Form 500EZ has been discontinued''; Standard Deductions chart (Married filing
      jointly $24,000; Single, Married filing separately, Head of household, Qualifying surviving spouse $12,000 each);
      Line 14 dependent exemption ''multiply by $4,000''; Line 16 ''Multiply the amount on Line 15c by 5.19%. Round
      to nearest dollar.'' Second pass: the 2025 Form 500 prints Line 11 ''Enter $12,000 if the filing status from Line
      5 is A, C, or D. If the filing status is B, enter $24,000'', Line 14 ''Enter the number from Line 7c. Multiply
      by $4,000'', and Line 16 ''Tax (Multiply Line 15c by 5.19%. Round to the nearest dollar)'' (https://dor.georgia.gov/document/document/2025-500-individual-income-tax-return-blank-form-printing/download)
      — both passes agree. HB 111 (2025 session) accelerated the rate to 5.19% (from 2024''s 5.39%); the $12,000/$24,000
      standard deductions and the $4,000 dependent exemption are unchanged from 2024.'
    url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
  flat_rate: 0.0519
  base: federal_agi
  tax_line: 'Form 500, Line 16: ''Tax (Multiply Line 15c by 5.19%. Round to the nearest dollar)''. Line 15c Georgia
    Taxable Income = Line 10 Georgia AGI minus Line 11 standard deduction (or Line 12c itemized), minus Line 14 dependent
    exemption (Line 7c x $4,000), minus Line 15b Georgia NOL utilized.'
  exemptions:
    dependent:
      amount: 4000
      note: 'Form 500 Line 14: number of dependents (Line 7c) x $4,000 (unchanged from 2024; the 2024 legislation that
        raised it from $3,000 to $4,000 and repealed the personal exemptions still governs — only the dependent exemption
        survives). A true base reduction (Line 15a = Line 13 minus Line 14), not a credit. Line 7c includes unborn dependents
        with a detectable heartbeat (Line 7b, Georgia LIFE Act); an unborn dependent cannot be claimed if the child is
        born during the same tax year.'
  standard_deduction:
    single: 12000
    married_filing_jointly: 24000
    married_filing_separately: 12000
    head_of_household: 12000
  notes:
  - '2025 STRUCTURAL CHANGE — HB 111 ACCELERATED THE FLAT RATE: for tax years beginning on or after January 1, 2025
    the Georgia flat rate DROPS to 5.19% (2024: 5.39%), per the 2025 IT-511 What''s New (''Effective January 1, 2025,
    the income tax rate is 5.19%'') and Form 500 Line 16. The $12,000/$24,000 standard deductions and the $4,000 dependent
    exemption are UNCHANGED from 2024; personal exemptions remain repealed (only the dependent exemption survives).
    Do NOT carry the 2024 5.39% rate into 2025, and do NOT use this pack for 2024.'
  - 'Base guidance: Supply Form 500, Line 10 ''Georgia adjusted gross income'' (Line 8 federal AGI from Form 1040,
    net of Line 9 adjustments from Form 500 Schedule 1) for a FULL-YEAR resident. The op subtracts the per-status
    Line 11 standard deduction and $4,000 per dependent (Line 14) to reach Line 15c Georgia taxable income (assuming
    no Line 15b NOL), then multiplies by 5.19%. Pass exemptions_count=0 — Georgia has NO personal exemption (repealed);
    pass dependents_count = Form 500 Line 7c (qualified dependents plus unborn dependents). Do not use this op if
    you itemize deductions, claim a Georgia NOL (Line 15b), or file as a part-year resident/nonresident (they omit
    Lines 9-14 and use Schedule 3, which prorates the deduction) — compute those on the form.'
  - 'QUALIFYING SURVIVING SPOUSE (CRITICAL): Georgia files QSS under filing status D ''Head of Household or Qualifying
    Surviving Spouse'' with a $12,000 standard deduction (both the 2025 Form 500 Line 5 status list and the IT-511
    Standard Deductions chart, which prints ''Qualifying surviving spouse $12,000'') — pass head_of_household to this
    op, NOT married_filing_jointly. The engine''s default QSS -> married_filing_jointly mapping would apply MFJ''s
    $24,000 and UNDERSTATE tax.'
  - 'AGE-65/BLIND ADDITIONAL DEDUCTION: none for Georgia — the flat $12,000/$24,000 amounts are the entire standard
    deduction; the old (pre-2024) $1,300-per-checkbox additional standard deduction is gone. No age_65/blind keys
    ship.'
  - 'ITEMIZERS NOT MODELED: if you itemized on your federal return (or are MFS and your spouse itemizes), you MUST
    itemize on the Georgia return (Line 12c = federal Schedule A total less Georgia adjustments) and the standard
    deduction does not apply. Itemizing residents may claim the Georgia Eligible Itemizer Tax Credit of up to $300
    per taxpayer on Form 500 Line 19 — a CREDIT against Line 16 tax, not a base reduction, and not modeled.'
  - 'NO tax table and NO rate schedule: Line 16 is a straight multiplication printed on the form (''Multiply Line
    15c by 5.19%. Round to the nearest dollar'').'
  - 'Georgia NOL not modeled: Form 500 Line 15b (Georgia NOL utilized, limited to 80% of Line 15a income for losses
    from tax years 2018+) is subtracted before Line 15c taxable income.'
  - 'Part-year residents and nonresidents not modeled: they omit Form 500 Lines 9-14 and use Schedule 3, which prorates
    the standard deduction and dependent exemption by the Georgia-income ratio. This pack''s subtractions apply only
    to full-year residents. Taxpayers required to file federal Form 1040NR generally may NOT take the Georgia standard
    deduction. NOTE: Form 500-EZ is DISCONTINUED for 2025 — all filers use Form 500.'
  - 'CREDITS (subtracted from tax, NOT modeled and NOT base reductions): Low Income Credit (Form 500 Line 17 — a per-exemption
    CREDIT of $5-$26 for federal AGI under $20,000); Other State(s) Tax Credit (Line 18); Georgia Eligible Itemizer
    Tax Credit (Line 19, up to $300 per itemizing taxpayer); IND-CR series 200 credits (Line 20); Schedule 2 series
    100 credits (Line 21). Total credits used (Line 22) cannot exceed Line 16 tax.'
  - 'Rounding: the Form 500 Line 16 instruction itself mandates ''Round to the nearest dollar''; this pack rounds
    half-up to whole dollars (irs_round), matching the form''s presentation.'
# DEV_PLAN §7.2 effective_law_changes — promoted 2026-08-11 from THIS pack's own prose (the
# header's "HEADLINE 2025 CHANGE (HB 111, 2025 session)" block and the tax.notes "2025 STRUCTURAL
# CHANGE" note); transcription only, no new research and no new sources. modeled: true because
# tax.flat_rate already ships the accelerated 5.19% rate.
effective_law_changes:
- description: >-
    HB 111 (2025 session) ACCELERATED THE FLAT RATE: for tax years beginning on or after January 1,
    2025 the Georgia flat rate DROPS to 5.19%, down from 2024's 5.39% — 2025 IT-511 What's New:
    "Effective January 1, 2025, the income tax rate is 5.19%", printed on Form 500 Line 16 as
    "Tax (Multiply Line 15c by 5.19%. Round to the nearest dollar)". This accelerates the HB
    1015/HB 1437 phase-down schedule. Everything else is unchanged from 2024: the $12,000/$24,000
    standard deductions and the $4,000 dependent exemption stand, and personal exemptions remain
    repealed (only the dependent exemption survives).
  status: final_form_published
  affects:
  - tax.flat_rate
  - Form 500 Line 16
  modeled: true
  citation:
    source: >-
      GA 2025 IT-511 Individual Income Tax Instruction Booklet - What's New ('Effective January 1,
      2025, the income tax rate is 5.19%'; Form 500EZ discontinued for 2025); Standard Deductions
      chart ($24,000 MFJ; $12,000 Single/MFS/Head of household/Qualifying surviving spouse); Line 14
      dependent exemption (Line 7c x $4,000); Line 16 tax (Line 15c x 5.19%, round to nearest
      dollar); Filing Requirements chart; 'file on or before April 15, 2026'; mailing addresses; Low
      Income Credit Worksheet; IND-CR 201/202/204
    url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
# `forms` sits at the END of this pack on purpose (Phase K JK28, 2026-10-16). The source registry
# (knowledge/sources_states.yaml, built by scripts/assemble_state_sources.py) keeps the FIRST citation of each URL per
# topic in file order, and get_sources routes a question by those descriptions. forms.citations below reuse the IT-511
# URL that `all_citations` describes; placed before `all_citations` (where Virginia keeps `forms`), the role pinpoint
# replaced that description in the registry. Keep `forms` after `all_citations`.
forms:
  resident: Form 500 (Georgia Individual Income Tax Return) for tax year 2025. NOTE — Form 500-EZ is DISCONTINUED
    for tax years beginning on or after January 1, 2025; all filers use Form 500.
  part_year_or_nonresident: Form 500 with Schedule 3 (part-year residents and nonresidents file the same Form 500,
    omit Lines 9-14, and complete Form 500 Schedule 3 to calculate Georgia taxable income). The residency status box
    on Form 500 Line 4 (1=full-year resident, 2=part-year resident, 3=nonresident) designates status.
  # (Phase K JK28, 2026-10-16): the role's own instructions and form pages, which state_scope adds to a part-year or
  # nonresident filer's citations. Georgia has ONE return (Form 500) for every role, plus Schedule 3 for part-year
  # residents and nonresidents; the top-level `citation` is that Form 500, pinned to resident lines, so this entry named
  # Schedule 3 without citing the instructions that send each role to it. The IT-511 URL is the "2025 IT-511 Individual
  # Income Tax Booklet" link on DOR's IT-511 page (dor.georgia.gov/it-511-individual-income-tax-instruction-booklet);
  # the Form 500 URL is the pack's primary citation, the "2025 500 Individual Income Tax Return - Blank form for
  # printing" link on dor.georgia.gov/print-blank-tax-forms, whose PDF carries Schedule 3. Each PDF was downloaded twice
  # on 2026-10-16 with identical sha256 (IT-511 ae43633e68ca4236..., Form 500 8933cb4fda483d21...). The entry above
  # agrees with both (IT-511 p. 16: 'Part-year residents and nonresidents must skip Lines 9-14 and follow the Schedule 3
  # instructions').
  citations:
    part_year:
    - source: >-
        2025 IT-511 Individual Income Tax Instructions Booklet (Georgia DOR), Filing Requirements (p. 13): 'Part-year
        and Nonresidents 1. Part-year residents and nonresidents who work in Georgia or receive income from Georgia
        sources are required to file Georgia Form 500 and complete Form 500 Schedule 3 to calculate Georgia taxable
        income.' — and Form 500 Instructions, Line 4 (p. 15): '2. PART-YEAR RESIDENT- You lived in Georgia part of the
        year. Or if one spouse is a resident and one is a part-year or nonresident. List the dates you lived in
        Georgia, and you must complete Schedule 3 to calculate Georgia taxable income.'
      url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
    - source: >-
        2025 Georgia Form 500, Individual Income Tax Return — page 1, Line 4 Residency Status: 'Omit Lines 9 thru 14 and
        use Form 500 Schedule 3 if you are a part-year or nonresident filer.'; Schedule 3 (Rev. 07/09/25, PDF page 11):
        'COMPUTATION OF GEORGIA TAXABLE INCOME FOR ONLY PART-YEAR RESIDENTS AND NONRESIDENTS.'
      url: https://dor.georgia.gov/document/document/2025-500-individual-income-tax-return-blank-form-printing/download
    nonresident:
    - source: >-
        2025 IT-511 Individual Income Tax Instructions Booklet (Georgia DOR), Filing Requirements (p. 13): 'Part-year
        and Nonresidents 1. Part-year residents and nonresidents who work in Georgia or receive income from Georgia
        sources are required to file Georgia Form 500 and complete Form 500 Schedule 3 to calculate Georgia taxable
        income.' — and Form 500 Instructions, Line 4 (p. 15): '3. NONRESIDENT - You did not live in Georgia or, if
        filing Married Filing Jointly and neither lived in Georgia. You must complete Schedule 3 to calculate Georgia
        taxable income.'
      url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
    - source: >-
        2025 Georgia Form 500, Individual Income Tax Return — page 1, Line 4 Residency Status: 'Omit Lines 9 thru 14 and
        use Form 500 Schedule 3 if you are a part-year or nonresident filer.'; Schedule 3 (Rev. 07/09/25, PDF page 11):
        'COMPUTATION OF GEORGIA TAXABLE INCOME FOR ONLY PART-YEAR RESIDENTS AND NONRESIDENTS.'
      url: https://dor.georgia.gov/document/document/2025-500-individual-income-tax-return-blank-form-printing/download

