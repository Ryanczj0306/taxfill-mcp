- id: logistics-4
  topic: filing_logistics
  url: https://dor.georgia.gov/mailing-address-individualfiduciary-income-tax
  descriptions:
  - 'Georgia DOR, Mailing Address - Individual/Fiduciary Income Tax: "500X Amended Georgia Dept. of Revenue PO Box
    740318 Atlanta, GA 30374-0318"; "Make checks payable to Georgia Department of Revenue"; the certified-mail note
    (read 2026-10-16)'
- id: forms-2
  topic: forms_and_instructions
  url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
  descriptions:
  - GA 2025 IT-511 Individual Income Tax Instruction Booklet - What's New ('Effective January 1, 2025, the income
    tax rate is 5.19%'; Form 500EZ discontinued for 2025); Standard Deductions chart ($24,000 MFJ; $12,000 Single/MFS/Head
    of household/Qualifying surviving spouse); Line 14 dependent exemption (Line 7c x $4,000); Line 16 tax (Line
    15c x 5.19%, round to nearest dollar); Filing Requirements chart; 'file on or before April 15, 2026'; mailing
    addresses; Low Income Credit Worksheet; IND-CR 201/202/204
  - '2025 IT-511 Individual Income Tax Instructions Booklet (Georgia DOR), Filing Requirements (p. 13): ''Part-year
    and Nonresidents 1. Part-year residents and nonresidents who work in Georgia or receive income from Georgia
    sources are required to file Georgia Form 500 and complete Form 500 Schedule 3 to calculate Georgia taxable
    income.'' — and Form 500 Instructions, Line 4 (p. 15): ''2. PART-YEAR RESIDENT- You lived in Georgia part of
    the year. Or if one spouse is a resident and one is a part-year or nonresident. List the dates you lived in
    Georgia, and you must complete Schedule 3 to calculate Georgia taxable income.'''
  - '2025 IT-511 Individual Income Tax Instructions Booklet (Georgia DOR), Filing Requirements (p. 13): ''Part-year
    and Nonresidents 1. Part-year residents and nonresidents who work in Georgia or receive income from Georgia
    sources are required to file Georgia Form 500 and complete Form 500 Schedule 3 to calculate Georgia taxable
    income.'' — and Form 500 Instructions, Line 4 (p. 15): ''3. NONRESIDENT - You did not live in Georgia or, if
    filing Married Filing Jointly and neither lived in Georgia. You must complete Schedule 3 to calculate Georgia
    taxable income.'''
- id: forms-3
  topic: forms_and_instructions
  url: https://dor.georgia.gov/press-releases/2025-04-17/gov-kemp-signs-legislation-delivering-more-1-billion-tax-cuts-and-relief
  descriptions:
  - GA DOR - Gov. Kemp Signs Legislation (2025-04-17 press release) — HB 111 accelerates the Georgia income tax
    rate to 5.19% for tax year 2025 (delivering over $1 billion in tax cuts and relief)
- id: rates-1
  topic: tax_rates_and_brackets
  url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
  descriptions:
  - 'Georgia DOR, 2025 IT-511 Individual Income Tax Instruction Booklet — What''s New: ''Effective January 1, 2025,
    the income tax rate is 5.19%. Form 500EZ has been discontinued''; Standard Deductions chart (Married filing
    jointly $24,000; Single, Married filing separately, Head of household, Qualifying surviving spouse $12,000 each);
    Line 14 dependent exemption ''multiply by $4,000''; Line 16 ''Multiply the amount on Line 15c by 5.19%. Round
    to nearest dollar.'' Second pass: the 2025 Form 500 prints Line 11 ''Enter $12,000 if the filing status from
    Line 5 is A, C, or D. If the filing status is B, enter $24,000'', Line 14 ''Enter the number from Line 7c. Multiply
    by $4,000'', and Line 16 ''Tax (Multiply Line 15c by 5.19%. Round to the nearest dollar)'' (https://dor.georgia.gov/document/document/2025-500-individual-income-tax-return-blank-form-printing/download)
    — both passes agree. HB 111 (2025 session) accelerated the rate to 5.19% (from 2024''s 5.39%); the $12,000/$24,000
    standard deductions and the $4,000 dependent exemption are unchanged from 2024.'
- id: law-1
  topic: law_changes
  url: https://dor.georgia.gov/document/document/2025-it-511-individual-income-tax-booklet/download
  descriptions:
  - GA 2025 IT-511 Individual Income Tax Instruction Booklet - What's New ('Effective January 1, 2025, the income
    tax rate is 5.19%'; Form 500EZ discontinued for 2025); Standard Deductions chart ($24,000 MFJ; $12,000 Single/MFS/Head
    of household/Qualifying surviving spouse); Line 14 dependent exemption (Line 7c x $4,000); Line 16 tax (Line
    15c x 5.19%, round to nearest dollar); Filing Requirements chart; 'file on or before April 15, 2026'; mailing
    addresses; Low Income Credit Worksheet; IND-CR 201/202/204
