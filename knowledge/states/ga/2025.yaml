# scripts/hoist_state_sources.py. The source registry (taxfill_core.state_sources.state_block, behind
# knowledge/sources_states.yaml and get_sources) is built from this table, so a citation outlives the block that
# carried it (Phase K JK22, 2026-10-24, dropped the never-read blocks). Inline citations of read blocks stay inline.
# A new citation goes inline AND here (test_state_sources_table.py fails on an inline .gov citation this table
# lacks, and on a row no inline citation backs, unless JK22 dropped the block that carried it).
sources:
- id: forms-1
  topic: forms_and_instructions
  url: https://dor.georgia.gov/document/document/2025-500-individual-income-tax-return-blank-form-printing/download
  descriptions:
  - GA Form 500 (2025) blank return - Line 8 'Federal adjusted gross income (From Federal Form 1040)', Line 9 Schedule
    1 adjustments, Line 5 filing statuses (A Single / B MFJ / C MFS / D Head of household or Qualifying surviving
    spouse), Line 11 standard deduction ($12,000 status A/C/D, $24,000 status B), Line 14 dependent exemption (Line
    7c x $4,000), Line 16 tax (Line 15c x 5.19%, round to nearest dollar)
  - 'GA Form 500 (2025) blank return — second-pass verification: Line 8 federal AGI; Line 5 filing statuses A Single
    / B Married filing jointly / C Married filing separately / D Head of household or Qualifying surviving spouse;
    Line 11 ''Enter $12,000 if the filing status from Line 5 is A, C, or D. If the filing status is B, enter $24,000'';
    Line 14 ''Enter the number from Line 7c. Multiply by $4,000''; Line 16 ''Tax (Multiply Line 15c by 5.19%. Round
    to the nearest dollar)'''
  - '2025 Georgia Form 500, Individual Income Tax Return — page 1, Line 4 Residency Status: ''Omit Lines 9 thru
    14 and use Form 500 Schedule 3 if you are a part-year or nonresident filer.''; Schedule 3 (Rev. 07/09/25, PDF
    page 11): ''COMPUTATION OF GEORGIA TAXABLE INCOME FOR ONLY PART-YEAR RESIDENTS AND NONRESIDENTS.'''
