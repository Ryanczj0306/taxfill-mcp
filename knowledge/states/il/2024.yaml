unverified:
- Schedule M was not opened line-by-line; the conclusion that Schedule M contains no foreign income-tax-treaty add-back
  is based on the Line 2 and Line 3 'Other additions' enumerations in the 2024 IL-1040 instructions (which list no
  treaty add-back; the 2024 Schedule M changes named in What's New — cannabis 280E clarification, fertility-fraud
  subtraction — are subtractions, not treaty additions). Confirm against the full 2024 Schedule M / Schedule M Instructions
  if a treaty-income edge case is in play.
- The statutory source of the 2024 $2,775 personal exemption (the 2023 booklet attributed $2,425 to P.A. 103-0009)
  was not re-derived from the Public Act text; the $2,775 figure itself is confirmed by BOTH the 2024 IL-1040 instructions
  ("The personal exemption amount for tax year 2024 is $2,775") and the 2024 Schedule IL-E/EITC form (Step 2 Line 1).
# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 IL-1040 instruction booklet and
# the 2024 Form IL-1040 / 2024 Schedule IL-E/EITC forms themselves (IL DOR .gov).
# NEW for 2024 vs the 2023 pack: the per-DEPENDENT exemption SHIPS ($2,775) — the
# 2024 Schedule IL-E/EITC form prints the Step 2 Line 1 multiplication, so the
# amount is verified at source (the 2023 pack had omitted it as unverified).
tax:
  citation:
    source: '2024 Form IL-1040 Instructions (IL-1040 Instructions R-02/25) — "The Illinois income tax rate is 4.95 percent
      (.0495)"; "The personal exemption amount for tax year 2024 is $2,775"; Line 10 exemption allowance chart ($2,775
      per person, $5,550 MFJ both; +$1,000 each 65-or-older / blind, Lines 10b/10c; Line 10d dependents via Schedule
      IL-E/EITC); Line 11 net income. Second pass: the 2024 Form IL-1040 itself prints Line 12 "Residents: Multiply
      Line 11 by 4.95% (.0495)", and the 2024 Schedule IL-E/EITC form prints Step 2 Line 1 "Multiply the total number
      of dependents you are claiming by $2,775" — both passes agree.'
    url: https://tax.illinois.gov/content/dam/soi/en/web/tax/forms/incometax/documents/2024/individual/il-1040-instr.pdf
  flat_rate: 0.0495
  base: federal_agi
  tax_line: 'IL-1040 Line 12 (Tax) = Line 11 (net income = Line 9 base income minus Line 10 exemption allowance) x
    4.95% (.0495) — printed on the 2024 form: "Residents: Multiply Line 11 by 4.95% (.0495). Cannot be less than zero."
    Line 9 base income starts from federal AGI (Line 1) plus IL additions (Lines 2-3) minus IL subtractions.'
  exemptions:
    personal:
      amount: 2775
      note: Per-exemption allowance for the taxpayer (and spouse), Line 10a — "the personal exemption amount for tax year
        2024 is $2,775"; married filing jointly, both spouses = $5,550 (Line 10a chart).
    dependent:
      amount: 2775
      note: 'Per-dependent allowance, Line 10d via 2024 Schedule IL-E/EITC Step 2, Line 1: "Multiply the total number
        of dependents you are claiming by $2,775." (Verified on the schedule form itself for 2024 — the 2023 pack had
        omitted this amount as unverified.)'
    age_65:
      amount: 1000
      note: Additional $1,000 per 65-or-older checkbox, Line 10b (taxpayer and spouse each). NOT applied by calc.state_tax
        — enter it on the form's Line 10b.
    blind:
      amount: 1000
      note: Additional $1,000 per legally-blind checkbox, Line 10c (taxpayer and spouse each). NOT applied by calc.state_tax
        — enter it on the form's Line 10c.
  notes:
  - 'Dependent exemptions (Line 10d) ship for 2024: the 2024 Schedule IL-E/EITC form prints the per-dependent multiplication
    (Step 2 Line 1, $2,775 per dependent), so dependents_count is applied at $2,775 each. Attach Schedule IL-E/EITC
    when claiming dependents.'
  - 'Exemption phase-out: the entire Line 10 exemption allowance (including Lines 10b-10d) is $0 when federal AGI
    exceeds $500,000 (married filing jointly) or $250,000 (all other statuses) — the ''Income Exceptions'' box in
    the Line 10 instructions.'
  - 'Claimed as a dependent by another: if base income exceeds $2,775, the filer''s own exemption is $0 (Line 10a
    chart rows with the Step 1 Line C box checked).'
