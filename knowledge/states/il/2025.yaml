unverified:
- Schedule M was not opened line-by-line; the conclusion that Schedule M contains no foreign income-tax-treaty add-back
  is based on the Line 2 and Line 3 'Other additions' enumerations in the 2025 IL-1040 instructions (which list no
  treaty add-back; the 2025 Schedule M changes named in What's New — Line 18 medical debt relief subtraction, Line
  30 re-wording — are subtractions/wording, not treaty additions). Confirm against the full 2025 Schedule M / Schedule
  M Instructions if a treaty-income edge case is in play.
- The statutory source of the 2025 $2,850 personal exemption (the COLA indexation under 35 ILCS 5/204) was not re-derived
  from the Public Act / index text; the $2,850 figure itself is confirmed by THREE official 2025 documents (the 2025
  IL-1040 instructions "The personal exemption amount for tax year 2025 is $2,850", the 2025 Form IL-1040 Exemption
  Allowance Chart, and the 2025 Schedule IL-E/EITC form Step 2 Line 1).
- Citation URLs use the IL DOR 'currentyear' path (tax.illinois.gov/.../documents/currentyear/individual/...), the
  live location for the 2025 tax-year forms as of this authoring. Once TY2026 becomes current, IL migrates prior-year
  forms to taxarchive.illinois.gov/.../2025/individual/... — re-point the URLs there if the currentyear path later
  404s (see the 2024 pack's taxarchive citations for the pattern).
tax:
  citation:
    source: '2025 Form IL-1040 Instructions (PDF title "2025 IL-1040 Instructions") — "The Illinois income tax rate
      is 4.95 percent (.0495)"; "The personal exemption amount for tax year 2025 is $2,850"; Line 10a Exemption Allowance
      Chart ($2,850 per person, $5,700 MFJ both; +$1,000 each 65-or-older / blind; $500,000 MFJ / $250,000 other AGI
      phase-out); Line 11 net income. Second pass: the 2025 Form IL-1040 itself (IL-1040 R-12/25) prints Line 12 "Residents:
      Multiply Line 11 by 4.95% (.0495)", and the 2025 Schedule IL-E/EITC form prints Step 2 Line 1 "Multiply the total
      number of dependents you are claiming by $2,850" — both passes agree.'
    url: https://tax.illinois.gov/content/dam/soi/en/web/tax/forms/incometax/documents/currentyear/individual/il-1040-instr.pdf
  flat_rate: 0.0495
  base: federal_agi
  tax_line: 'IL-1040 Line 12 (Tax) = Line 11 (net income = Line 9 base income minus Line 10 exemption allowance) x
    4.95% (.0495) — printed on the 2025 form: "Residents: Multiply Line 11 by 4.95% (.0495). Cannot be less than zero."
    Line 9 base income starts from federal AGI (Line 1) plus IL additions (Lines 2-3) minus IL subtractions.'
  exemptions:
    personal:
      amount: 2850
      note: Per-exemption allowance for the taxpayer (and spouse), Line 10a — "the personal exemption amount for tax year
        2025 is $2,850"; married filing jointly, both spouses = $5,700 (Line 10a Exemption Allowance Chart). CHANGED from
        $2,775 (2024) by COLA indexation.
    dependent:
      amount: 2850
      note: 'Per-dependent allowance, Line 10d via 2025 Schedule IL-E/EITC Step 2, Line 1: "Multiply the total number
        of dependents you are claiming by $2,850." (Verified on the schedule form itself for 2025.)'
    age_65:
      amount: 1000
      note: Additional $1,000 per 65-or-older checkbox, Line 10b (taxpayer and spouse each). NOT applied by calc.state_tax
        — enter it on the form's Line 10b.
    blind:
      amount: 1000
      note: Additional $1,000 per legally-blind checkbox, Line 10c (taxpayer and spouse each). NOT applied by calc.state_tax
        — enter it on the form's Line 10c.
  notes:
  - 'Dependent exemptions (Line 10d) ship for 2025 at $2,850 each: the 2025 Schedule IL-E/EITC form prints the per-dependent
    multiplication (Step 2 Line 1, $2,850 per dependent), so dependents_count is applied at $2,850 each. Attach Schedule
    IL-E/EITC when claiming dependents.'
  - 'Exemption phase-out: the entire Line 10 exemption allowance (including Lines 10b-10d) is $0 when federal AGI
    exceeds $500,000 (married filing jointly) or $250,000 (all other statuses) — the ''Income Exceptions'' box in
    the Line 10 instructions / Exemption Allowance Chart.'
  - 'Claimed as a dependent by another: if base income exceeds $2,850, the filer''s own exemption is $0 (Line 10a
    chart rows with the Step 1 Line C box checked).'
  - Rate is UNCHANGED at 4.95% (.0495) for 2025; the exemption amount is year-specific ($2,850 for 2025, $2,775 for
    2024) — never carry an exemption amount to another year.
# effective_law_changes — promoted on 2026-08-11 from this pack's own header "CHANGED for 2025"
# note, credits prose and the booklet's "What's New for 2025" list quoted in `all_citations`
# (DEV_PLAN §7.2). Both are modeled: false — a credit percentage and a Schedule M subtraction,
# neither of which calc.state_tax computes. The $2,775 -> $2,850 exemption move is COLA
# indexation, not a law change, so it gets no entry (it already lives in tax.exemptions).
effective_law_changes:
- description: >-
    Illinois Child Tax Credit INCREASED to 40% of the Illinois Earned Income Tax Credit for 2025, up
    from 20% for 2024 (What's New for 2025: "Illinois Child Tax Credit amount was increased to 40
    percent of the Illinois Earned Income Tax Credit"). The 2025 Schedule IL-E/EITC Step 5, Line 12
    prints "Multiply the amount on Line 11 [the Illinois EITC from Line 9] by 40% (0.4). This is your
    Illinois Child Tax Credit." Eligibility is unchanged (qualify for the Illinois EITC and have at
    least one dependent child under age 12 as of the last day of 2025); the credit stays refundable.
  status: final_form_published
  affects:
  - credits
  - Form IL-1040 Line 30
  - Schedule IL-E/EITC Step 5 Line 12
  modeled: false
  lookup_path: >-
    2025 Schedule IL-E/EITC Step 5 (Lines 11-12) — 40% of the Illinois EITC from Step 4 — carried to
    Form IL-1040 Line 30. calc.state_tax computes only the Line 12 flat-rate tax, so the credit is
    applied after it in Step 8 (Payments and Refundable Credit).
  citation:
    source: >-
      Illinois Department of Revenue — 2025 Schedule IL-E/EITC (form, Step 5, Line 12 "by 40% (0.4)")
      and 2025 Form IL-1040 Instructions "What's New for 2025?" (Illinois Child Tax Credit increased
      to 40 percent of the Illinois EITC)
    url: https://tax.illinois.gov/content/dam/soi/en/web/tax/forms/incometax/documents/currentyear/individual/il-1040-schedule-il-e-eic.pdf
- description: >-
    NEW Schedule M Line 18 subtraction for medical debt relief, named in the 2025 IL-1040 instructions'
    What's New for 2025 (this pack's `unverified` note records it as one of the 2025 Schedule M changes
    and classifies it as a SUBTRACTION, not an addition). It reduces Illinois base income below federal
    AGI on IL-1040 Line 7 / Schedule M, so a filer with medical debt relief must fold it into the base
    income supplied to the engine.
  status: final_form_published
  affects:
  - starts_from
  - Schedule M Line 18
  - Form IL-1040 Line 7 (Total subtractions)
  - calc.state_tax taxable_base (caller-supplied)
  modeled: false
  lookup_path: >-
    2025 Schedule M and its instructions, reached from the 2025 IL-1040 Instructions What's New for
    2025 (the citation URL) — Line 18 medical debt relief subtraction; the pack did not open Schedule M
    line-by-line (see `unverified`), so resolve the amount and eligibility there before subtracting it.
  citation:
    source: >-
      2025 Form IL-1040 Instructions (PDF title "2025 IL-1040 Instructions"; internal label R-02/25) —
      cover/mailing addresses, due date (April 15, 2026), income tax rate 4.95%, exemption allowance
      $2,850, What's New for 2025 (personal exemption $2,850, Child Tax Credit increased to 40% of the
      Illinois EITC, Schedule M Line 18 medical debt relief subtraction, full date of birth now required
      on Line A)
    url: https://tax.illinois.gov/content/dam/soi/en/web/tax/forms/incometax/documents/currentyear/individual/il-1040-instr.pdf
