    source: 'State of Maine - Individual Income Tax, 2025 Rates (Maine Revenue Services, Income/Estate Tax Division,
      prepared February 3, 2026) — the standalone MRS rate sheet: Tax Rate Schedule #1 ''For Single Individuals and
      Married Persons Filing Separate Returns'' (less than $26,800 = 5.8% of Maine taxable income; $26,800 but less
      than $63,450 = $1,554 plus 6.75% of excess; $63,450 or more = $4,028 plus 7.15% of excess); Schedule #2 ''For
      Unmarried or Legally Separated Individuals who Qualify as Heads of Household'' ($40,200 / $95,150, $2,332 / $6,041
      constants); Schedule #3 ''For Married Individuals and Surviving Spouses Filing Joint Returns'' ($53,600 / $126,900,
      $3,109 / $8,057 constants); ''Personal Exemption: $5,150''; ''Standard Deduction: Single - $15,000, Married Filing
      Jointly - $30,000, Head of Household - $22,500, Married Filing Separately - $15,000''; additional age/blindness
      amounts $1,600 married / $2,000 unmarried; COLA 1.274 / 1.269 on the bracket dollar amounts and 1.25 on the personal
      exemption (36 M.R.S. 5403). SECOND PASS (two independent documents): the 2025 MAINE Individual Income Tax booklet
      (25_1040me_gen_instr_w_cover_pg.pdf) prints the identical 2025 TAX RATE SCHEDULES, the same 2025 Tax Year Quick
      Facts ($5,150 personal exemption; standard deduction base $15,000 single/MFS, $22,500 HoH, $30,000 MFJ/QSS), the
      Line 18 instruction ''Multiply the amount shown on line 13 by $5,150'', and its IMPORTANT UPDATE stating Maine
      conforms to the Code as of December 31, 2024 (so the federal OBBBA standard-deduction increase does NOT apply);
      the standalone 2025 MAINE INCOME TAX TABLE (25_tax_tables.pdf) reprints the same three schedules on its last page
      and its printed rows reproduce this op''s marginal math at band midpoints (e.g. the $51,000-$51,100 row prints
      3,191 / 2,961 / 3,064 and midpoint 51,050 computes to 3,191.275 / 2,960.90 / 3,063.975); and the printed 2025
      Form 1040ME (25_1040ME_fillable.pdf) prints ''EXEMPTION. (Multiply line 13 x $5,150.)''. All passes agree.'
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/ind_tax_rate_sched_2025.pdf
