unverified:
- Whether 'Treasurer, State of Maine' is also the exact wording for estimated-tax/voucher payments (confirmed only
  for the 1040ME balance-due check payee in the 2025 booklet, Line 35) — confirm at the DOR.
- The nonresident employee de minimis rule (not required to file on personal-services income unless working in Maine
  more than 12 days AND deriving more than $3,000 from Maine sources) was carried from earlier packs; the 2025 general-instructions
  booklet again defers minimum taxability thresholds to the Schedule NR instructions, which were not re-pulled this
  pass — confirm at 36 M.R.S. § 5142(8-B) / MRS Rule 806 / the Schedule NR instructions.
- Resident minimum-filing dollar thresholds are stated as a formula (standard deduction + personal exemption) rather
  than a fixed dollar chart; specific 2025 dollar amounts were not extracted from a .gov chart in this pass.
- 'CONFORMITY IS CONTINGENT: the 2025 booklet''s IMPORTANT UPDATE states that the 2025 returns and instructions ''have
  been developed pursuant to the Governor''s directive but are contingent upon the enactment by the Legislature of
  legislation'' conforming Maine law to the OBBBA changes the Assessor adopted administratively. The shipped standard
  deduction ($15,000/$30,000/$22,500) reflects Maine''s December 31, 2024 conformity date and was NOT among the items
  the Governor directed to be adopted federally — but if the 132nd Legislature''s Second Regular Session conforms
  to the OBBBA standard deduction retroactively, these amounts could change. Re-check the MRS conformity documents
  and Maine Tax Alerts before relying on them late in the season.'
- 'BOTTOM-BAND DIVERGENCE BETWEEN THE TWO 2025 TABLE PRINTS: the tax table printed inside the instruction booklet
  splits the first band into ''$0-$50 -> $0'' and ''$50-$100 -> $3'', while the standalone 25_tax_tables.pdf collapses
  it into a single ''$0-$100 -> $3'' row. Every row from $100 up is identical in both. A filer with line 19 taxable
  income under $50 therefore reads $0 from the booklet and $3 from the standalone table. Also, the booklet''s in-book
  table stops at $52,000 while the standalone table runs to $100,000 — above $52,000 use the standalone table or the
  rate schedules.'
