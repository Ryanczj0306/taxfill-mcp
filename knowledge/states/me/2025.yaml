  base: federal_agi
  tax_line: '2025 Form 1040ME, line 20: ''INCOME TAX. (Find the tax for the amount on line 19 in the tax table in
    this booklet or compute your tax using the tax table or tax rate schedules available at maine.gov/revenue/tax-return-forms.)''
    — where line 19 is ''TAXABLE INCOME. (Line 16 minus lines 17 and 18.)'''
  exemptions:
    personal:
      amount: 5150
      note: 'Maine personal exemption DEDUCTION, Form 1040ME line 18: ''EXEMPTION. (Multiply line 13 x $5,150.)'' — RAISED
        from 2024''s $5,000 (COLA 1.25 applied to the 36 M.R.S. 5126-A amount). Subtracted from Maine AGI before the rate
        applies. Line 13 count: 1 if single, head of household, married filing separately, or qualifying surviving spouse;
        2 if married filing jointly; MFS enters 2 only if the taxpayer would claim a federal personal exemption for the
        spouse but for the federal suspension; enter 0 if you may be claimed as a dependent on another person''s return
        (MFJ: 0 if both spouses may be claimed, 1 if only one). Phases out when line 16 Maine AGI exceeds $333,450 single
        / $366,750 HoH / $400,100 MFJ-QSS / $200,050 MFS (fully gone over the next $125,000; $62,500 MFS) — phaseout NOT
        modeled by this op.'
  standard_deduction:
    single: 15000
    married_filing_jointly: 30000
    married_filing_separately: 15000
    head_of_household: 22500
  notes:
  - 'Base guidance: Supply Form 1040ME, line 16 (Maine adjusted gross income) = line 14 federal adjusted gross income
    + line 15a income addition modifications (Maine Schedule 1A) - line 15b income subtraction modifications (Maine
    Schedule 1S). The op then subtracts the shipped per-status standard deduction (Form 1040ME line 17) and $5,150
    x exemptions_count (line 18) to reproduce line 19 TAXABLE INCOME, and applies the 2025 rate schedules to produce
    line 20. Do NOT pre-subtract the deduction or exemption from the figure you supply. If you itemize (Schedule 2)
    or your line 16 exceeds a phaseout threshold (deduction: $100,000 single/MFS, $150,000 HoH, $200,050 MFJ/QSS;
    exemption: $333,450 single, $366,750 HoH, $400,100 MFJ/QSS, $200,050 MFS), compute lines 17-18 on the form''s
    worksheets instead — the op does not model those adjustments.'
  - 'Adjudication note (two-pass): base is federal_agi — 2025 Form 1040ME line 14 is FEDERAL ADJUSTED GROSS INCOME
    and line 16 Maine AGI = federal AGI +/- Schedule 1A/1S modifications; supply line 16 (the op subtracts the $5,150-per-exemption
    line 18 deduction and the standard deduction). Dependent counts are zero by design: Maine dependents get the Dependent
    Exemption Tax Credit, not an income exemption.'
  - '2025 RE-INDEXATION: all three rate schedules keep the 5.8% / 6.75% / 7.15% rates but the bracket boundaries rose
    (single/MFS $26,050/$61,600 -> $26,800/$63,450; HoH $39,050/$92,450 -> $40,200/$95,150; MFJ/QSS $52,100/$123,250
    -> $53,600/$126,900) — COLA 1.274 on the lowest dollar amounts and 1.269 on the highest (36 M.R.S. 5403, MRS 2025
    Rates sheet). The personal exemption rose $5,000 -> $5,150 (COLA 1.25).'
  - 'CRITICAL — THE 2025 STANDARD DEDUCTION IS THE PRE-OBBBA FEDERAL AMOUNT: $15,000 single/MFS, $30,000 MFJ/QSS,
    $22,500 HoH. The 2025 booklet''s IMPORTANT UPDATE states ''Under current law, Maine conforms to the Internal Revenue
    Code (the "Code") as of December 31, 2024'', and that the federal One Big Beautiful Bill Act (P.L. 119-21, enacted
    July 4, 2025) changes await Maine legislation in the Second Regular Session of the 132nd Legislature. The Governor''s
    P.L. 2025, c. 336 directive adopted federal treatment only for qualified disaster losses, qualified farmland sales,
    IRC 179 expensing, the business interest deduction, and research and experimental expenditures — NOT the standard
    deduction. Do NOT substitute the federal 2025 OBBBA amounts ($15,750/$31,500/$23,625) into a Maine return, and
    note the booklet flags that the 2025 instructions are contingent on the Legislature enacting the conformity legislation.'
  - 'Rate schedule sharing: 2025 Tax Rate Schedule #1 is titled ''For Single Individuals and Married Persons Filing
    Separate Returns'' — one schedule covers BOTH single and MFS, so the identical brackets are duplicated per status
    (MFS is NOT half of MFJ in Maine; it equals single).'
  - 'Qualifying surviving spouse maps to married_filing_jointly: Tax Rate Schedule #3 is titled ''For Married Individuals
    and Surviving Spouses Filing Joint Returns'', and the 2025 tax table''s MFJ column is footnoted ''*This column
    must also be used by a surviving spouse with dependent child.'' QSS also uses the $30,000 standard deduction and
    the MFJ phaseout thresholds.'
  - 'Printed ''$X plus Y% of excess over $Z'' constants are rounded to whole dollars and do not exactly equal the
    cumulative marginal sums: Single/MFS constants $1,554 vs exact $1,554.40 (-$0.40) and $4,028 vs exact $4,028.275
    (-$0.275); HoH constants $2,332 vs exact $2,331.60 (+$0.40) and $6,041 vs exact $6,040.725 (+$0.275); MFJ constants
    $3,109 vs exact $3,108.80 (+$0.20) and $8,057 vs exact $8,056.55 (+$0.45). Pure marginal bracket math (what this
    op does) can therefore differ from the printed-constant method by up to about $1 in the middle and top brackets.'
  - 'Tax table: the 2025 MAINE INCOME TAX TABLE is printed BOTH inside the instruction booklet (there covering line
    19 taxable income only up to $52,000) and as the standalone 25_tax_tables.pdf (covering $0 through $100,000 in
    $100 bands, three columns). Form 1040ME line 20 authorizes computing tax with EITHER ''the tax table or tax rate
    schedules'', so bracket math is a permitted method; within a $100 band the table (built on band midpoints) may
    differ from exact bracket math by a few dollars. The two prints also disagree on the very first band: the booklet
    splits it into ''$0-$50 -> $0'' and ''$50-$100 -> $3'' while the standalone prints a single ''$0-$100 -> $3''
    row (identical from $100 up).'
  - 'SUPERSEDED-TABLES CAUTION (carried forward and re-checked): for 2024, maine.gov hosted a WRONG 24_1040me_tax_tables.pdf
    (printing 2023 boundaries under a ''2024'' heading) alongside a corrected 24_1040me_tax_tables_2.pdf. For 2025
    there is no such duplicate — both 25_1040me_tax_tables.pdf and 25_1040me_tax_tables_2.pdf return HTTP 404, and
    the live 2025 forms index points to 25_tax_tables.pdf, whose rate schedules match the MRS February 3, 2026 rate
    sheet and the booklet exactly. Source 2025 figures from those three files only.'
  - 'Standard/itemized deduction PHASEOUT is NOT modeled: if Form 1040ME line 16 (Maine AGI) is more than $100,000
    (single or MFS), $150,000 (HoH), or $200,050 (MFJ/QSS), the Worksheet for Standard/Itemized Deductions reduces
    the line 17 deduction proportionally, reaching $0 once line 16 exceeds the threshold by $75,000 (single/MFS),
    $112,500 (HoH), or $150,000 (MFJ/QSS) — i.e. fully phased out at $175,000 / $262,500 / $350,050. Above the threshold,
    compute line 17 on the worksheet, not with the shipped standard deduction.'
  - 'Personal exemption PHASEOUT is NOT modeled: if line 16 exceeds $333,450 (single), $366,750 (HoH), $400,100 (MFJ/QSS),
    or $200,050 (MFS), the Worksheet for Phaseout of Personal Exemption Deduction Amount reduces the line 18 exemption
    proportionally over the next $125,000 ($62,500 MFS).'
  - 'DEPENDENTS GET A CREDIT, NOT AN EXEMPTION: Maine has no per-dependent income exemption. For 2025 the Dependent
    Exemption Tax Credit is $305 per qualifying child/dependent who is at least six years of age and $610 — DOUBLED
    — for each qualifying dependent under age six (L.D. 210; P.L. 2025, c. 388, Pt. Q), refundable for Maine residents
    and part-year residents and nonrefundable for nonresidents, and reduced by $20 for each $500 (2024: $7.50 per
    $1,000) by which Maine AGI exceeds $100,000 single / $125,000 HoH / $150,000 MFJ-QSS / $75,000 MFS (2024: $200,000/$400,000).
    It is subtracted from TAX, not from income, and this op does not model it — dependents_count does not change the
    base.'
  - 'Maine''s standard deduction equals the federal standard deduction amount as Maine conforms to it; the shipped
    figures are the 2025 BASE amounts. Additional amounts for age 65+ or blindness are NOT shipped because they vary
    by marital status: $1,600 per occurrence if married (filing jointly or separately) or a qualified surviving spouse
    (MFS may count spouse occurrences only if an exemption is claimable for the spouse); $2,000 per occurrence if
    unmarried (single or HoH) — both raised from 2024''s $1,550/$1,950. Use the Maine Standard Deduction Chart for
    line 17 in those cases (e.g. head of household with one box checked = $24,500, two boxes = $26,500).'
  - 'Itemizers are not modeled: taxpayers who itemized federally complete Form 1040ME Schedule 2 (Maine itemized deductions,
    limited to $36,300 for 2025 — up from $35,250 — except medical expenses) and use the larger of that or the standard
    deduction on line 17 — except a filer filing as a nonresident alien MUST use itemized deductions.'
  - Part-year residents, nonresidents, and safe-harbor residents compute line 20 tax on full Maine taxable income,
    then subtract the nonresident credit on line 21 (Schedule NR line 9 or NRH line 11) — not modeled by this op.
  - Tax credit recapture (Form 1040ME line 20a) is added after line 20 and is not modeled.
  - 'Rounding: use whole dollar amounts — ''Round down to the next lower dollar any amount less than 50 cents. Round
    up to the next higher dollar any amount 50 cents or more'' (2025 booklet), matching the engine''s half-up rounding.'
  - 'No mid-year 2025 rate change: rates 5.8% / 6.75% / 7.15% with bracket dollar amounts inflation-adjusted under
    36 M.R.S. 5403 (published by MRS February 3, 2026; 36 M.R.S. 5111 sub-secs 1-F, 2-F, 3-F). Other 2025 changes
    are outside the rate schedule: the pension income deduction gained an FAGI phaseout ($125,000 single/MFS, $187,500
    HoH, $250,000 MFJ/surviving spouses) and now excludes certain pre-age-55 distributions; the Maine capital investment
    credit is repealed prospectively; the easy-enrollment health insurance checkoff is repealed.'
