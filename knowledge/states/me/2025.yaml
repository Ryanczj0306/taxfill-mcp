# ME state knowledge — tax year 2025. Fetched + cited from the ME DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the standalone MRS sheet
# 'State of Maine - Individual Income Tax, 2025 Rates' (ind_tax_rate_sched_2025.pdf, prepared
# February 3, 2026), then independently re-derived from the 2025 MAINE Individual Income Tax
# booklet / Form 1040ME general instructions (25_1040me_gen_instr_w_cover_pg.pdf), the
# standalone 2025 MAINE INCOME TAX TABLE (25_tax_tables.pdf, which reprints the same rate
# schedules on its last page), and the printed 2025 Form 1040ME (25_1040ME_fillable.pdf,
# which prints 'EXEMPTION. (Multiply line 13 x $5,150.)'). Resolutions recorded inline.
# NOTE ON THE 2024 SUPERSEDED-FILE TRAP: for 2024, maine.gov hosted a wrong
# 24_1040me_tax_tables.pdf alongside a corrected _2 revision. For 2025 there is no '_2'
# duplicate — 25_1040me_tax_tables.pdf and 25_1040me_tax_tables_2.pdf both return 404, and
# the live 2025 forms index points to 25_tax_tables.pdf, whose rate schedules match the MRS
# rate sheet and the booklet exactly. All three were compared before shipping.
# HEADLINE 2025 CHANGES:
#   * Brackets re-indexed, rates unchanged at 5.8% / 6.75% / 7.15% (COLA 1.274 on the lowest
#     dollar amounts and 1.269 on the highest, 36 M.R.S. 5403): single/MFS $26,800/$63,450
#     (2024: $26,050/$61,600); HoH $40,200/$95,150 (2024: $39,050/$92,450); MFJ/surviving
#     spouses $53,600/$126,900 (2024: $52,100/$123,250).
#   * Personal exemption ROSE $5,000 -> $5,150 (COLA 1.25 on the 36 M.R.S. 5126-A amount).
#   * STANDARD DEDUCTION IS PRE-OBBBA: $15,000 single/MFS, $30,000 MFJ/QSS, $22,500 HoH.
#     Maine conforms to the Code as of DECEMBER 31, 2024, so the federal One Big Beautiful
#     Bill Act (P.L. 119-21, enacted July 4, 2025) standard-deduction increase to
#     $15,750/$31,500/$23,625 does NOT apply in Maine for 2025. Do NOT use federal 2025
#     OBBBA figures here. Age/blindness additional amounts: $1,600 married / $2,000 unmarried.
#   * Dependent exemption tax credit: $305 per qualifying child/dependent age six or older,
#     DOUBLED to $610 for each qualifying dependent under age six, and the phaseout was
#     re-cut to $20 per $500 of Maine AGI over $100,000 single / $125,000 HoH / $150,000
#     MFJ-QSS / $75,000 MFS (2024: $7.50 per $1,000 over $200,000/$400,000).
#   * Pension income deduction gained an FAGI phaseout ($125,000 / $187,500 / $250,000) and
#     excludes certain pre-age-55 distributions.
#   * Maine itemized deduction cap $36,300 (2024: $35,250); STFC maximum $280 (2024: $270);
#     deduction phaseout thresholds $100,000 / $150,000 / $200,050; exemption phaseout
#     thresholds $333,450 / $366,750 / $400,100 / $200,050.
jurisdiction: states/me
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Maine''s resident return (Form 1040ME) starts from federal adjusted gross income: 2025 Form 1040ME
  line 14 is "FEDERAL ADJUSTED GROSS INCOME" and line 16 is "MAINE ADJUSTED GROSS INCOME. (Line 14 plus line 15a,
  minus line 15b.)" Maine''s only income additions are on Schedule 1A (per 36 M.R.S. § 5122(1)), and the 2025 Schedule
  1A list contains NO add-back of federally treaty-exempt income — the additions are limited to specific items (non-Maine
  municipal/state bond interest, NOL recovery adjustment, MainePERS contributions, bonus depreciation / Maine capital
  investment credit add-backs, fiduciary adjustments, nonresident installment-sale gain election, pass-through financial-institution
  adjustments, wellness programs credit adjustment, enrolled tribal members). Because treaty-exempt income is already
  excluded from federal AGI and there is no Maine add-back, it flows through and is not re-taxed. Maine therefore
  conforms to federal treaty exclusions (unlike California, which adds treaty income back on Schedule CA). Basis:
  2025 Form 1040ME instructions, Line 14/15a/15b and Schedule 1A (25_1040me_gen_instr_w_cover_pg.pdf).'
citation:
  source: '2025 MAINE Individual Income Tax Booklet (Form 1040ME general instructions with cover page) — IMPORTANT
    UPDATE (Maine conforms to the Code as of December 31, 2024; OBBBA conformity deferred to the Second Regular Session
    of the 132nd Legislature, with the Governor directing limited administrative adopt-ins under P.L. 2025, c. 336),
    IMPORTANT CHANGES for 2025, Who must file, residency and safe harbors, ''Form 1040ME due date: Wednesday, April
    15, 2026'', whole-dollar rounding, payee ''Treasurer, State of Maine'' and the Maine Tax Portal at revenue.maine.gov,
    Line 13/13a personal-exemption count chart, Line 17 Deduction + Maine Standard Deduction Chart and Worksheet for
    Standard/Itemized Deductions, Line 18 Exemption (''Multiply the amount shown on line 13 by $5,150'') + Worksheet
    for Phaseout of Personal Exemption Deduction Amount, 2025 Tax Year Quick Facts, the 2025 MAINE INCOME TAX TABLE,
    and the 2025 TAX RATE SCHEDULES'
  url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/25_1040me_gen_instr_w_cover_pg.pdf
starts_from: federal AGI (Form 1040ME Line 14 = "FEDERAL ADJUSTED GROSS INCOME" from the federal return)
residency:
  summary: Maine taxes individuals based on domicile and a statutory-resident test. Per the 2025 booklet, a full-year
    resident is one for whom (1) Maine was their domicile for the entire year of 2025, or (2) they maintained a permanent
    place of abode in Maine for the entire year and spent a total of more than 183 days in Maine. Domicile is the
    place an individual establishes as their permanent home, including the place to which they intend to return after
    any period of absence; once established it continues until a new, fixed and permanent home is acquired. A part-year
    resident was domiciled in Maine for part of the year and was not a full-year resident. A nonresident was not a
    resident or part-year resident in 2025 but has Maine-source income. A "safe harbor resident" is treated as a nonresident
    — General Safe Harbor (Maine domicile in 2025 but no permanent place of abode in Maine, a permanent place of abode
    maintained outside Maine, and no more than 30 days spent in Maine) or Foreign Safe Harbor (at least 450 days in
    a foreign country during any 548-day period occurring partially or fully in the tax year, plus other criteria).
    Safe harbor residents, part-year residents, and nonresidents file Form 1040ME with Schedule NR or NRH.
forms:
  resident: Form 1040ME (Maine Individual Income Tax Return) — resident return
  part_year_or_nonresident: Form 1040ME with Schedule NR (Form 1040ME), "Schedule for Calculating the Nonresident
    Credit" (line 9 flows to Form 1040ME line 21); married taxpayers electing to file as single may use Schedule NRH
    (Form 1040ME) instead (line 11). Used by nonresidents, part-year residents, and safe harbor residents. (Full-year
    residents may not file Schedule NR.)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Maine Earned Income Credit (EIC)
  type: refundable
  eligibility: Maine residents and part-year residents who properly claim the federal earned income tax credit (including
    filers using an IRS-issued ITIN who would otherwise qualify, and filers at least age 18 with no qualifying children
    who would otherwise qualify for the federal EIC). For nonresidents the credit is nonrefundable and may not reduce
    the Maine income tax to less than zero.
  amount: 25% of the federal EIC (50% of the federal EIC for taxpayers with no qualifying children), for tax years
    beginning on or after January 1, 2022 — which includes 2025. Confirmed refundable for residents and part-year
    residents by the 2025 Tax Year Quick Facts.
  income_limit_2025: No separate Maine income limit; eligibility tracks the federal EIC income limits (the taxpayer
    must otherwise qualify for the federal earned income tax credit).
  claimed_on: Form 1040ME, Schedule A (refundable section) for residents/part-year residents and the nonrefundable
    section for nonresidents; computed on the Earned Income Tax Credit Worksheet available at maine.gov/revenue/tax-return-forms.
  citation:
    source: Maine Revenue Services - Maine Earned Income Credit (EIC) page, re-fetched live ('For tax years beginning
      on or after January 1, 2022, the Maine EIC is equal to 25% (50% for taxpayers with no qualifying children)
      of the federal earned income tax credit'; 'The Maine EIC is refundable for Maine residents and part-year residents.
      The credit for nonresidents may not reduce the Maine income tax to less than zero.'), and the 2025 booklet
      Schedule A instructions plus 2025 Tax Year Quick Facts
    url: https://www.maine.gov/revenue/taxes/tax-relief-credits-programs/income-tax-credits/earned-income-credit
- name: Property Tax Fairness Credit (PTFC)
  type: refundable
  eligibility: Maine residents during any part of 2025 who owned or rented a home in Maine during any part of the
    year and lived in it as their principal residence, and who paid property tax on that home greater than 4% of
    total income OR rent greater than 26.67% of total income. Cannot be claimed if the filing status is married filing
    separately.
  amount: 'Refundable credit up to $1,000 ($2,000 if you are 65 years of age or older); up to $2,000 ($4,000 if 65
    or older) if you or your spouse is a U.S. Armed Forces veteran rated 100% permanently and totally disabled by
    the VA. Credit = benefit base (property tax, or rent x 15%, capped at the maximum benefit base: $2,550 single
    at any dependent count; $3,300 head of household with 0 or 1 dependent / $4,050 with more than 1; $3,300 MFJ/QSS
    with 0 dependents / $4,050 with 1 or more; or $4,100 for any filer 65 or older) minus 4% of total income, capped
    at the applicable maximum.'
  income_limit_2025: '2025 total income must be less than: Single $63,750 (any dependent count); Head of Household
    $82,500 (0 or 1 dependent) / $101,250 (more than 1); Married Filing Jointly or Qualifying Surviving Spouse $82,500
    (0 dependents) / $101,250 (1 or more); OR, if you are 65 years of age or older, do not use the table — the limit
    is $102,500 (the Quick Facts maximum) and the schedule''s 65-or-older path uses $100,000 in its own line.'
  claimed_on: Form 1040ME, line 25d; computed on Schedule PTFC/STFC, line 16.
  citation:
    source: 2025 Schedule PTFC/STFC (Form 1040ME) — 'Who is eligible?' (up to $1,000 / $2,000 if 65 or older; veteran
      $2,000 / $4,000; 4%-of-income and 26.67%-of-rent tests; income-limit table $63,750 / $82,500 / $101,250), line
      8 maximum benefit base table ($2,550 / $3,300 / $4,050, or $4,100 if 65 or older) and line 12 ($2,000 if 65
      or older, otherwise $1,000); 2025 Tax Year Quick Facts (PTFC maximum income limitation $63,750 / $101,250 /
      $102,500)
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/25_1040me_sch_ptfc_fillable.pdf
- name: Sales Tax Fairness Credit (STFC)
  type: refundable
  eligibility: Individuals who were Maine residents during any part of the 2025 tax year, are not married filing
    separately, and cannot be claimed as a dependent on another person's return. The credit amount depends on the
    number of qualifying children and dependents claimed on Form 1040ME, line 13a.
  amount: Refundable credit up to $280 for 2025 (raised from 2024's $270), depending on the number of qualifying
    children and dependents (the exact amount comes from the Schedule PTFC/STFC line 17 table based on filing status,
    total income, and dependents).
  income_limit_2025: '2025 total income not more than: $32,950 if single; $51,700 if head of household; $63,950 if
    married filing jointly or qualifying surviving spouse.'
  claimed_on: Form 1040ME, line 25e; computed on Schedule PTFC/STFC, line 17 (or line 17a if filing Schedule NR/NRH).
  citation:
    source: 2025 Schedule PTFC/STFC (Form 1040ME) — 'You may qualify for the refundable Sales Tax Fairness Credit
      up to $280 ... if your total income during 2025 was not more than $32,950 if filing single; $51,700 if filing
      head of household; or, $63,950 if married filing jointly or qualifying surviving spouse'; and the 2025 Tax
      Year Quick Facts
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/25_1040me_sch_ptfc_fillable.pdf
- name: Child Care Credit
  type: refundable
  eligibility: Maine residents and part-year residents (a nonrefundable portion is also available to nonresidents)
    who claimed the federal credit for child and dependent care expenses. The credit doubles if the expenses are related
    to a quality child care provider. Maine also allows a separate adult dependent care credit, refundable up to $500
    for residents and part-year residents.
  amount: 25% of the federal child and dependent care credit (doubled — 50% — for expenses paid to a quality child
    care provider). The credit is refundable up to $500 for Maine residents and part-year residents; any amount above
    $500 is claimed as a nonrefundable credit.
  income_limit_2025: No stated Maine income limit; the credit is a percentage of the federal child and dependent care
    credit.
  claimed_on: Form 1040ME, Schedule A — refundable line (up to $500) and the nonrefundable line for the remainder;
    computed on the Worksheet for Child Care Credit.
  citation:
    source: Maine Revenue Services — Credit for Child Care Expenses page, re-fetched live ('This credit is equal
      to 25% of the federal credit for child and dependent care expenses'; 'The credit doubles if the expenses are
      related to a quality child care provider'; 'This credit is also refundable up to $500'; 36 M.R.S. § 5218, with
      a Tax Year 2025 worksheet posted) and the 2025 Tax Year Quick Facts ('Child and dependent care credit is refundable
      for Maine residents and part-year residents, up to $500'; adult dependent care credit likewise up to $500)
    url: https://www.maine.gov/revenue/taxes/tax-relief-credits-programs/income-tax-credits/child-care-credit
- name: Dependent Exemption Tax Credit
  type: refundable
  eligibility: Taxpayers with qualifying children and dependents (the number reported on Form 1040ME, line 13a) for
    whom they are eligible to claim the federal child tax credit or the credit for other dependents under IRC Section
    24. The credit is REFUNDABLE for Maine residents and part-year residents (36 M.R.S. § 5219-SS) and remains nonrefundable
    for nonresidents.
  amount: '2025 amounts (indexed and newly age-tiered): $305 for each qualifying child or dependent who is at least
    six years of age, and $610 — DOUBLE — for each qualifying child or dependent who has not attained six years of
    age before the end of the taxable year (L.D. 210; P.L. 2025, c. 388, Pt. Q). 2024''s flat $300 no longer applies.'
  income_limit_2025: 'Phaseout re-cut for 2025: the credit is reduced by $20 for each $500 (previously $7.50 for each
    $1,000), or fraction thereof, by which Maine adjusted gross income exceeds $100,000 for single individuals; $125,000
    for heads of household; $150,000 for married filing jointly or surviving spouses; or $75,000 for married filing
    separately. (2024 thresholds were $200,000 / $400,000.) Thresholds are inflation-adjusted for tax years after
    2025.'
  claimed_on: Form 1040ME, Schedule A — the refundable line for residents/part-year residents (line 13a count x the
    per-dependent amount) or the nonrefundable line for nonresidents; computed on the Worksheet for Dependent Exemption
    Tax Credit.
  citation:
    source: 2025 MAINE Individual Income Tax Booklet — IMPORTANT CHANGES for 2025, 'Dependent exemption tax credit'
      ('For tax years beginning on or after January 1, 2025, the dependent exemption tax credit amount is doubled
      for each qualifying dependent of the taxpayer who has not attained six years of age before the end of the taxable
      year' and the $20-per-$500 phaseout over $100,000 / $125,000 / $150,000 / $75,000), and 2025 Tax Year Quick
      Facts ('up to $305 for each qualifying child or dependent that is at least six years of age, or $610 for each
      qualifying child or dependent that is under six years of age')
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/25_1040me_gen_instr_w_cover_pg.pdf
filing_requirement:
  note: 'Per the 2025 Form 1040ME instructions ("Who must file?"): a Maine income tax return must be filed by April
    15, 2026, if you are a resident of Maine who is required to file a federal income tax return, OR if you are not
    required to file a federal return but have income subject to Maine income tax resulting in a Maine income tax
    liability. Even if required to file federally, a resident does not have to file a Maine return if they have no
    income addition modifications (Form 1040ME, Schedule 1A, line 11) AND their income subject to Maine income tax
    is less than the sum of their Maine standard deduction amount plus their personal exemption amount. A return must
    still be filed to claim any refund due. Generally, a nonresident or safe harbor resident with income from Maine
    sources resulting in a Maine income tax liability must file (see the Schedule NR instructions for minimum taxability
    thresholds; 36 M.R.S. § 5142(8-B) and MRS Rule 806).'
