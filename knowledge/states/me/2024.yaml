# ME state knowledge — tax year 2024. Fetched + cited from the ME DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 MAINE Individual
# Income Tax Booklet (24_1040me_book_gen_instr.pdf — general instructions + 2024 tax table
# + 2024 tax rate schedules), then independently re-derived from a second official document
# (the standalone MRS "State of Maine - Individual Income Tax, 2024 Rates" sheet of
# Sept 15, 2023, and the 2024 Form 1040ME itself, which prints the "line 13 x $5,000"
# exemption multiplier) — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGES: brackets re-indexed (single 5.8% to $26,050 / 6.75% to $61,600 /
# 7.15% above; HoH $39,050/$92,450; MFJ $52,100/$123,250 — 2023: $24,500/$58,050,
# $36,750/$87,100, $49,050/$116,100); personal exemption ROSE $4,700 -> $5,000 (COLA 1.215);
# standard deduction tracks the FEDERAL 2024 amounts $14,600/$29,200/$21,900; the Dependent
# Exemption Tax Credit ($300) became REFUNDABLE for Maine residents/part-year residents
# (L.D. 258; P.L. 2023, c. 412, Pt. ZZZ) and the PTFC 65+ maximums increased.
jurisdiction: states/me
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Maine''s resident return (Form 1040ME) starts from federal adjusted gross income: 2024 Form 1040ME
  line 14 is "FEDERAL ADJUSTED GROSS INCOME" and the instructions (Line 14) say to enter the federal adjusted gross
  income shown on your federal return. Maine''s only income additions are on Schedule 1A (per 36 M.R.S. § 5122(1)),
  and the full 2024 Schedule 1A list contains NO add-back of federally treaty-exempt income — the additions are
  limited to specific items (line 1 non-Maine municipal/state bond interest; line 2 NOL recovery adjustment; line
  3 MainePERS contributions; lines 4-5 bonus depreciation / Maine capital investment credit add-backs; line 6 fiduciary
  adjustments; line 7 nonresident installment-sale gain election; line 8 pass-through financial-institution adjustments;
  line 9 wellness programs credit adjustment; line 10 enrolled tribal members; line 11 reserved). Because treaty-exempt
  income is already excluded from federal AGI and there is no Maine add-back, it flows through and is not re-taxed.
  Maine therefore conforms to federal treaty exclusions (unlike California, which adds treaty income back on Schedule
  CA). Basis: 2024 Form 1040ME instructions, Line 14 and Schedule 1A (24_1040me_book_gen_instr.pdf).'
citation:
  source: 2024 MAINE Individual Income Tax Booklet (Form 1040ME general instructions) — Line 14 federal AGI starting
    point, Schedule 1A income additions (no treaty add-back), Who-must-file, due date Tuesday April 15 2025, payee
    'Treasurer, State of Maine', Maine Tax Portal revenue.maine.gov, IMPORTANT CHANGES for 2024 (refundable dependent
    exemption tax credit; PTFC 65+ increase; pension income deduction increase), 2024 Tax Year Quick Facts ($5,000
    personal exemption; $14,600/$21,900/$29,200 standard deduction), 2024 MAINE INCOME TAX TABLE and 2024 TAX RATE
    SCHEDULES
  url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_1040me_book_gen_instr.pdf
starts_from: federal AGI (Form 1040ME Line 14 = "FEDERAL ADJUSTED GROSS INCOME" from the federal return)
residency:
  summary: Maine taxes individuals based on domicile and a statutory-resident test. Per the 2024 booklet ("What
    is my Residency Status?"), a full-year resident is one for whom (1) Maine was their domicile for the entire
    year of 2024, or (2) they maintained a permanent place of abode in Maine for the entire year and spent a total
    of more than 183 days in Maine. Domicile is the place an individual establishes as their permanent home, including
    the place to which they intend to return after any period of absence; once established it continues until a
    new, fixed and permanent home is acquired. A part-year resident was domiciled in Maine for part of the year
    and was not a full-year resident. A nonresident was not a resident or part-year resident in 2024 but has Maine-source
    income. A "safe harbor resident" is treated as a nonresident — General Safe Harbor (Maine domicile in 2024 but
    no permanent place of abode in Maine, a permanent abode maintained outside Maine, and no more than 30 days spent
    in Maine) or Foreign Safe Harbor (at least 450 days in a foreign country during any 548-day period occurring
    partially or fully in the tax year, plus other criteria). Safe harbor residents, part-year residents, and nonresidents
    file Form 1040ME with Schedule NR or NRH.
forms:
  resident: Form 1040ME (Maine Individual Income Tax Return) — resident return
  part_year_or_nonresident: Form 1040ME with Schedule NR (Form 1040ME), "Schedule for Calculating the Nonresident
    Credit"; married taxpayers electing to file as single may use Schedule NRH (Form 1040ME) instead. Used by nonresidents,
    part-year residents, and safe harbor residents. (Full-year residents may not file Schedule NR.)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Maine Earned Income Credit (EIC)
  type: refundable
  eligibility: Maine residents and part-year residents who properly claim the federal earned income tax credit
    (including filers using an IRS-issued ITIN who would otherwise qualify, and filers at least age 18 with no qualifying
    children who would otherwise qualify for the federal EIC). For nonresidents the credit is nonrefundable (Schedule
    A, line 12) and may not reduce Maine tax below zero.
  amount: 25% of the federal EIC (50% of the federal EIC for taxpayers with no qualifying children), for tax years
    beginning on or after January 1, 2022 (which includes 2024).
  income_limit_2024: No separate Maine income limit; eligibility tracks the federal EIC income limits (taxpayer
    must otherwise qualify for the federal earned income tax credit).
  claimed_on: Form 1040ME, Schedule A, line 4 (refundable, residents/part-year residents); Schedule A, line 12 for
    nonresidents. Computed on the Earned Income Tax Credit Worksheet.
  citation:
    source: Maine Revenue Services - Maine Earned Income Credit (EIC) page ('For tax years beginning on or after
      January 1, 2022, the Maine EIC is equal to 25% (50% for taxpayers with no qualifying children) of the federal
      earned income tax credit'); and 2024 Form 1040ME booklet, Schedule A lines 4 and 12 instructions
    url: https://www.maine.gov/revenue/taxes/tax-relief-credits-programs/income-tax-credits/earned-income-credit
- name: Property Tax Fairness Credit (PTFC)
  type: refundable
  eligibility: Maine residents and part-year residents who owned or rented a home in Maine during any part of 2024
    and lived in it as their principal residence, and who paid property tax greater than 4% of total income OR rent
    greater than 26.67% of total income. Cannot be claimed if filing status is married filing separately.
  amount: 'Refundable credit up to $1,000 ($2,000 if you or your spouse were at least 65 — raised for 2024 from
    $1,500 by L.D. 258, P.L. 2023, c. 412, Pt. S). Up to $2,000 ($4,000 if 65+) if you or your spouse is a U.S.
    Armed Forces veteran rated 100% permanently and totally disabled by the VA. Credit = benefit base (property
    tax, or rent x 15%, capped at the maximum benefit base: $2,450 single; $3,200 HoH with 0-1 dependents / $3,900
    with more; $3,200 MFJ/QSS with 0 dependents / $3,900 with 1 or more; $4,000 for any filer 65+ regardless of
    status/dependents) minus 4% of total income, capped at the applicable maximum.'
  income_limit_2024: '2024 total income must be less than: Single $61,250; Head of Household $80,000 (0 or 1 dependent)
    / $97,500 (more than 1 dependent); Married Filing Jointly or Qualifying Surviving Spouse $80,000 (0 dependents)
    / $97,500 (1 or more dependents); OR less than $100,000 for any filer 65 years of age or older.'
  claimed_on: Form 1040ME, line 25d; computed on Schedule PTFC/STFC, line 16.
  citation:
    source: 2024 Form 1040ME, Schedule PTFC/STFC (lines 7-16 and 'Who is eligible?' — $2,450/$3,200/$3,900 maximum
      benefit base, $4,000 if 65+, line 12 $1,000/$2,000 maximums, veteran $2,000/$4,000) and 2024 booklet PTFC
      page (income-limit table) + IMPORTANT CHANGES for 2024 (65+ maximums increased)
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_Form%201040ME_Sch%20PTFC_ff_0.pdf
- name: Sales Tax Fairness Credit (STFC)
  type: refundable
  eligibility: Individuals who were Maine residents during any part of the 2024 tax year, are not married filing
    separately, and cannot be claimed as a dependent on another person's return. Credit amount depends on the number
    of qualifying children and dependents claimed on Form 1040ME, line 13a.
  amount: Refundable credit up to $270 for 2024, depending on number of qualifying children and dependents (the
    exact amount comes from the Schedule PTFC/STFC line 17 table based on filing status, total income, and dependents).
  income_limit_2024: '2024 total income not more than: $31,750 if single; $49,850 if head of household; $62,500
    if married filing jointly or qualifying surviving spouse.'
  claimed_on: Form 1040ME, line 25e; computed on Schedule PTFC/STFC, line 17 (or line 17a if filing Schedule NR/NRH).
  citation:
    source: 2024 MAINE Individual Income Tax Booklet — SALES TAX FAIRNESS CREDIT section (up to $270; income limits
      $31,750/$49,850/$62,500) and 2024 Tax Year Quick Facts
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_1040me_book_gen_instr.pdf
- name: Child Care Credit
  type: refundable
  eligibility: Maine residents and part-year residents (a nonrefundable portion is also available to nonresidents,
    Schedule A line 10) who claimed the federal credit for child and dependent care expenses. The credit doubles
    if the expenses are related to a quality child care provider.
  amount: 25% of the federal child and dependent care credit (doubled — 50% — for expenses paid to a quality child
    care provider). The credit is refundable up to $500 (Schedule A, line 2); any amount above $500 is claimed as
    a nonrefundable credit (Schedule A, line 10).
  income_limit_2024: No stated Maine income limit; the credit is a percentage of the federal child and dependent
    care credit.
  claimed_on: Form 1040ME, Schedule A, line 2 (refundable, up to $500) and line 10 (nonrefundable remainder); computed
    on the Worksheet for Child Care Credit.
  citation:
    source: Maine Revenue Services — Credit for Child Care Expenses page ('equal to 25% of the federal credit...
      doubles if the expenses are related to a quality child care provider... refundable up to $500', 36 M.R.S.
      § 5218) and 2024 Form 1040ME booklet, Schedule A lines 2 and 10 instructions
    url: https://www.maine.gov/revenue/taxes/tax-relief-credits-programs/income-tax-credits/child-care-credit
- name: Dependent Exemption Tax Credit
  type: refundable
  eligibility: Taxpayers with qualifying children and dependents (the number reported on Form 1040ME, line 13a)
    for whom they are eligible to claim the federal child tax credit or the credit for other dependents under IRC
    Section 24. NEW FOR 2024 — the credit is REFUNDABLE for Maine residents and part-year residents (L.D. 258; P.L.
    2023, c. 412, Pt. ZZZ; 36 M.R.S. § 5219-SS); it remains nonrefundable for nonresidents (Schedule A, line 9).
  amount: '$300 per qualifying child and dependent. Phases out for higher incomes: the credit may be limited if
    Form 1040ME, line 16 Maine AGI exceeds $200,000 ($400,000 if married filing jointly) — computed on the Worksheet
    for Dependent Exemption Tax Credit. Adjusted for inflation for tax years after 2024.'
  income_limit_2024: Phaseout begins when Maine adjusted gross income exceeds $200,000 ($400,000 if married filing
    jointly).
  claimed_on: Form 1040ME, Schedule A, line 1 (refundable portion, residents/part-year residents — line 13a x $300)
    or line 9 (nonrefundable, nonresidents); computed on the Worksheet for Dependent Exemption Tax Credit.
  citation:
    source: 2024 MAINE Individual Income Tax Booklet — IMPORTANT CHANGES for 2024 ('For tax years beginning on or
      after January 1, 2024, the dependent exemption tax credit is refundable and for tax years beginning after
      2024, the credit is adjusted for inflation. The credit is subject to phaseout.') and Schedule A lines 1/9
      instructions ($300 per line 13a dependent; $200,000/$400,000 caution)
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_1040me_book_gen_instr.pdf
filing_requirement:
  note: 'Per the 2024 Form 1040ME instructions ("Who must file?"): a Maine income tax return must be filed by April
    15, 2025, if you are a Maine resident who is required to file a federal income tax return, OR if you are not
    required to file a federal return but have income subject to Maine income tax resulting in a Maine income tax
    liability. Even if required to file federally, a resident does not have to file a Maine return if they have
    no income addition modifications (Schedule 1A, line 12) AND their income subject to Maine tax is less than the
    sum of their Maine standard deduction plus personal exemption. A return must still be filed to claim a refund.
    Generally, nonresidents/safe harbor residents with Maine-source income resulting in a Maine tax liability must
    file (see Schedule NR instructions for minimum taxability thresholds; 36 M.R.S. § 5142(8-B) and Rule 806).'
