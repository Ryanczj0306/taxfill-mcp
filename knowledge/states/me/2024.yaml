  base: federal_agi
  tax_line: '2024 Form 1040ME, line 20: ''INCOME TAX. (Find the tax for the amount on line 19 in the tax table in
    this booklet or compute your tax using the tax table or tax rate schedules available at maine.gov/revenue/tax-return-forms.)''
    — where line 19 is ''TAXABLE INCOME. (Line 16 minus lines 17 and 18.)'''
  exemptions:
    personal:
      amount: 5000
      note: 'Maine personal exemption DEDUCTION, Form 1040ME line 18: ''EXEMPTION. (Multiply line 13 x $5,000.)'' — RAISED
        from 2023''s $4,700 (COLA 1.215 applied to the 36 M.R.S. § 5126-A amount). Subtracted from Maine AGI before the
        rate applies. Line 13 count: 1 if single, head of household, married filing separately, or qualifying surviving
        spouse; 2 if married filing jointly; MFS enters 2 only if the taxpayer would claim a federal personal exemption
        for the spouse but for the federal suspension; enter 0 if you may be claimed as a dependent on another person''s
        return (MFJ: 0 if both spouses may be claimed, 1 if only one). Phases out when line 16 Maine AGI exceeds $323,900
        single / $356,300 HoH / $388,650 MFJ-QSS / $194,325 MFS (fully gone over the next $125,000; $62,500 MFS) — phaseout
        NOT modeled by this op.'
  standard_deduction:
    single: 14600
    married_filing_jointly: 29200
    married_filing_separately: 14600
    head_of_household: 21900
  notes:
  - 'Base guidance: Supply Form 1040ME, line 16 (Maine adjusted gross income) = line 14 federal adjusted gross income
    + line 15a income addition modifications (Maine Schedule 1A) - line 15b income subtraction modifications (Maine
    Schedule 1S). The op then subtracts the shipped per-status standard deduction (Form 1040ME line 17) and $5,000
    x exemptions_count (line 18) to reproduce line 19 TAXABLE INCOME, and applies the 2024 rate schedules to produce
    line 20. Do NOT pre-subtract the deduction or exemption from the figure you supply. If you itemize (Schedule 2)
    or your line 16 exceeds a phaseout threshold (deduction: $97,150 single/MFS, $145,750 HoH, $194,300 MFJ/QSS; exemption:
    $323,900 single, $356,300 HoH, $388,650 MFJ/QSS, $194,325 MFS), compute lines 17-18 on the form''s worksheets
    instead — the op does not model those adjustments.'
  - 'Adjudication note (two-pass): base is federal_agi — 2024 Form 1040ME line 14 is FEDERAL ADJUSTED GROSS INCOME
    and line 16 Maine AGI = federal AGI +/- Schedule 1A/1S modifications; supply line 16 (the op subtracts the $5,000-per-exemption
    line 18 deduction and the federal-amount standard deduction). Dependent counts are zero by design: Maine dependents
    get the $300 Dependent Exemption Tax Credit (REFUNDABLE for 2024 residents/part-year residents), not an income
    exemption.'
  - '2024 re-indexation (What''s New context): all three rate schedules keep the 5.8% / 6.75% / 7.15% rates but the
    bracket boundaries rose (single/MFS $24,500/$58,050 -> $26,050/$61,600; HoH $36,750/$87,100 -> $39,050/$92,450;
    MFJ/QSS $49,050/$116,100 -> $52,100/$123,250) — COLA 1.238 on the lowest dollar amounts and 1.233 on the highest
    (36 M.R.S. § 5403, MRS 2024 Rates sheet). The personal exemption rose $4,700 -> $5,000 (COLA 1.215) and the standard
    deduction tracks the FEDERAL 2024 amounts ($13,850/$27,700/$20,800 -> $14,600/$29,200/$21,900).'
  - 'Rate schedule sharing: 2024 Tax Rate Schedule #1 is titled ''For Single Individuals and Married Persons Filing
    Separate Returns'' — one schedule covers BOTH single and MFS, so the identical brackets are duplicated per status
    (MFS is NOT half of MFJ in Maine; it equals single).'
  - 'Qualifying surviving spouse maps to married_filing_jointly: Tax Rate Schedule #3 is titled ''For Married Individuals
    and Surviving Spouses Filing Joint Returns'', and the tax table''s MFJ column is footnoted ''*This column must
    also be used by a surviving spouse with dependent child.'' QSS also uses the $29,200 standard deduction and the
    MFJ phaseout thresholds.'
  - 'Printed ''$X plus Y% of excess over $Z'' constants are rounded to whole dollars and do not exactly equal the
    cumulative marginal sums: Single/MFS constants $1,511 vs exact $1,510.90 (+$0.10) and $3,911 vs exact $3,910.525
    (+$0.475); HoH constants $2,265 vs exact $2,264.90 (+$0.10) and $5,870 vs exact $5,869.40 (+$0.60); MFJ constants
    $3,022 vs exact $3,021.80 (+$0.20) and $7,825 vs exact $7,824.425 (+$0.575). Pure marginal bracket math (what
    this op does) can therefore differ from the printed-constant method by up to about $1 in the middle and top brackets.'
  - 'Tax table: the booklet prints a 2024 MAINE INCOME TAX TABLE for line 19 taxable income under $100,000 in $100
    bands; Form 1040ME line 20 authorizes computing tax with EITHER ''the tax table or tax rate schedules'', so bracket
    math is a permitted method, but within a $100 band the table (built on band midpoints) may differ from exact bracket
    math by a few dollars. At $100,000 and over the table itself directs the printed amount ''plus 7.15% of excess
    over 100,000'' ($6,653 Single/MFS, $6,406 HoH) or the rate schedule (MFJ column).'
  - 'SUPERSEDED-TABLES CAUTION: maine.gov hosts TWO 2024 tax-table files — the original 24_1040me_tax_tables.pdf prints
    WRONG (2023-boundary) values and even reprints the 2023 rate schedules ($24,500/$58,050...) under a ''2024 TAX
    RATE SCHEDULES'' heading; the corrected revision 24_1040me_tax_tables_2.pdf matches the booklet and the 2024 Rates
    sheet. This pack''s schedules were verified against the booklet, the 2024 Rates sheet, and the corrected _2 revision
    — do not source 2024 figures from the un-suffixed file.'
  - 'Standard/itemized deduction PHASEOUT is NOT modeled: if Form 1040ME line 16 (Maine AGI) is more than $97,150
    (single or MFS), $145,750 (HoH), or $194,300 (MFJ/QSS), the Worksheet for Standard/Itemized Deductions reduces
    the line 17 deduction proportionally, reaching $0 once line 16 exceeds the threshold by $75,000 (single/MFS),
    $112,500 (HoH), or $150,000 (MFJ/QSS) — i.e. fully phased out at $172,150 / $258,250 / $344,300. Above the threshold,
    compute line 17 on the worksheet, not with the shipped standard deduction.'
  - 'Personal exemption PHASEOUT is NOT modeled: if line 16 exceeds $323,900 (single), $356,300 (HoH), $388,650 (MFJ/QSS),
    or $194,325 (MFS), the Worksheet for Phaseout of Personal Exemption Deduction Amount reduces the line 18 exemption
    proportionally over the next $125,000 ($62,500 MFS).'
  - 'DEPENDENTS GET A CREDIT, NOT AN EXEMPTION: Maine has no per-dependent income exemption. The Dependent Exemption
    Tax Credit is $300 per qualifying child/dependent (Form 1040ME, Schedule A, line 1 — REFUNDABLE for Maine residents
    and part-year residents beginning tax year 2024 per L.D. 258, P.L. 2023, c. 412, Pt. ZZZ; line 9 nonrefundable
    for nonresidents), limited when Maine AGI exceeds $200,000 ($400,000 MFJ). It is subtracted from TAX, not from
    income, and this op does not model it — dependents_count does not change the base.'
  - 'Maine''s standard deduction is equal to the federal standard deduction amount (federal Form 1040, line 12); the
    shipped figures are the 2024 BASE amounts. Additional amounts for age 65+ or blindness are NOT shipped because
    they vary by marital status: $1,550 per occurrence if married (filing jointly or separately) or a qualified surviving
    spouse (MFS may count spouse occurrences only if an exemption is claimable for the spouse); $1,950 per occurrence
    if unmarried (single or HoH). Enter them via the federal standard deduction on the form.'
  - 'Itemizers are not modeled: taxpayers who itemized federally complete Form 1040ME Schedule 2 (Maine itemized deductions,
    limited to $35,250 for 2024 except medical expenses) and use the larger of that or the standard deduction on line
    17 — except nonresident aliens MUST use itemized deductions.'
  - Part-year residents, nonresidents, and safe-harbor residents compute line 20 tax on full Maine taxable income,
    then subtract the nonresident credit on line 21 (Schedule NR or NRH) — not modeled by this op.
  - Tax credit recapture (Form 1040ME line 20a) is added after line 20 and is not modeled.
  - 'Rounding: use whole dollar amounts — ''Round down to the next lower dollar any amount less than 50 cents. Round
    up to the next higher dollar any amount 50 cents or more'' (2024 booklet, Specific Instructions), matching the
    engine''s half-up rounding.'
  - 'No mid-year 2024 rate change: rates 5.8% / 6.75% / 7.15% with bracket dollar amounts inflation-adjusted under
    36 M.R.S. § 5403 (published by MRS Sept 15, 2023; 36 M.R.S. § 5111 sub-§§ 1-F, 2-F, 3-F).'
  - 'Cross-source confirmation: the standalone MRS document ''State of Maine - Individual Income Tax, 2024 Rates''
    prints identical rate schedules, the $5,000 personal exemption, and the standard deduction amounts (https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/ind_tax_rate_sched_2024.pdf);
    the corrected 2024 tax table file prints the same rate schedules on its final page (https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_1040me_tax_tables_2.pdf);
    the line 18/19/20 wording is from the 2024 Form 1040ME (https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_Form%201040ME_ff.pdf).'
# DEV_PLAN §7.2 effective_law_changes — promoted on 2026-08-11 from this pack's OWN header
# ('HEADLINE 2024 CHANGES'), the citation strings' 'IMPORTANT CHANGES for 2024' list and the
# credits/tax.notes prose; no new research. The re-indexed brackets (COLA 1.238/1.233), the
# $4,700 -> $5,000 personal exemption (COLA 1.215) and the federal-tracking standard deduction
# are INFLATION movements under 36 M.R.S. § 5403 and are deliberately NOT recorded here. All
# three entries are modeled: false — they are tax credits and a Schedule 1S subtraction, none
# of which calc.state_tax computes (dependents_count does not change the Maine base).
effective_law_changes:
- description: >-
    The $300 Dependent Exemption Tax Credit became REFUNDABLE for Maine residents and part-year
    residents: "For tax years beginning on or after January 1, 2024, the dependent exemption tax credit
    is refundable and for tax years beginning after 2024, the credit is adjusted for inflation. The
    credit is subject to phaseout." (L.D. 258; P.L. 2023, c. 412, Pt. ZZZ; 36 M.R.S. § 5219-SS.) It
    remains NONREFUNDABLE for nonresidents (Schedule A, line 9), and it moved to Schedule A line 1 for
    residents/part-year residents. Phaseout applies when Form 1040ME line 16 Maine AGI exceeds $200,000
    ($400,000 if married filing jointly).
  status: final_form_published
  lookup_path: >-
    2024 Form 1040ME Schedule A lines 1 and 9 plus the Worksheet for Dependent Exemption Tax Credit in
    the 2024 booklet at the citation URL — the credit is subtracted from TAX, not from income, so it sits
    entirely outside the base supplied to calc.state_tax.
  affects:
  - Form 1040ME Schedule A line 1 (refundable) / line 9 (nonresidents)
  - credits
  modeled: false
  citation:
    source: 2024 MAINE Individual Income Tax Booklet — IMPORTANT CHANGES for 2024 ('For tax years beginning on or
      after January 1, 2024, the dependent exemption tax credit is refundable and for tax years beginning after
      2024, the credit is adjusted for inflation. The credit is subject to phaseout.') and Schedule A lines 1/9
      instructions ($300 per line 13a dependent; $200,000/$400,000 caution)
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_1040me_book_gen_instr.pdf
- description: >-
    Property Tax Fairness Credit maximums for filers 65 or older were RAISED for 2024 by L.D. 258,
    P.L. 2023, c. 412, Pt. S: the age-65-or-older maximum went from $1,500 to $2,000, and the maximum
    for a 65-or-older filer who is (or whose spouse is) a U.S. Armed Forces veteran rated 100%
    permanently and totally disabled by the VA went to $4,000. A single $4,000 maximum benefit base now
    applies to any filer 65 or older regardless of status or dependent count, and a separate
    under-$100,000 income limit applies to 65-or-older filers.
  status: final_form_published
  lookup_path: >-
    2024 Schedule PTFC/STFC (Form 1040ME) lines 7-16 and the 2024 booklet's PTFC page / IMPORTANT CHANGES
    for 2024 at the citation URL — the credit is computed on the schedule and entered on Form 1040ME line
    25d, outside anything calc.state_tax computes.
  affects:
  - Form 1040ME line 25d
  - Schedule PTFC/STFC
  - credits
  modeled: false
  citation:
    source: 2024 Form 1040ME, Schedule PTFC/STFC (lines 7-16 and 'Who is eligible?' — $2,450/$3,200/$3,900 maximum
      benefit base, $4,000 if 65+, line 12 $1,000/$2,000 maximums, veteran $2,000/$4,000) and 2024 booklet PTFC
      page (income-limit table) + IMPORTANT CHANGES for 2024 (65+ maximums increased)
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_Form%201040ME_Sch%20PTFC_ff_0.pdf
- description: >-
    The 2024 booklet's IMPORTANT CHANGES for 2024 list also includes a PENSION INCOME DEDUCTION INCREASE
    (alongside the refundable dependent exemption tax credit and the PTFC 65+ increase). The pension
    income deduction is a Maine Schedule 1S income SUBTRACTION reached on Form 1040ME line 15b, so it
    changes the line 16 Maine AGI a caller supplies rather than anything the engine computes. This pack
    did NOT transcribe the new deduction amount.
  status: final_form_published
  lookup_path: >-
    2024 MAINE Individual Income Tax Booklet — IMPORTANT CHANGES for 2024 and the Schedule 1S instructions
    at the citation URL; resolve the 2024 pension income deduction amount there and take it on line 15b
    before supplying line 16 as taxable_base.
  affects:
  - Form 1040ME line 15b
  - Maine Schedule 1S
  - calc.state_tax taxable_base (caller-supplied line 16 Maine AGI)
  modeled: false
  citation:
    source: 2024 MAINE Individual Income Tax Booklet (Form 1040ME general instructions) — Line 14 federal AGI starting
      point, Schedule 1A income additions (no treaty add-back), Who-must-file, due date Tuesday April 15 2025, payee
      'Treasurer, State of Maine', Maine Tax Portal revenue.maine.gov, IMPORTANT CHANGES for 2024 (refundable dependent
      exemption tax credit; PTFC 65+ increase; pension income deduction increase), 2024 Tax Year Quick Facts ($5,000
      personal exemption; $14,600/$21,900/$29,200 standard deduction), 2024 MAINE INCOME TAX TABLE and 2024 TAX RATE
      SCHEDULES
    url: https://www.maine.gov/revenue/sites/maine.gov.revenue/files/inline-files/24_1040me_book_gen_instr.pdf
