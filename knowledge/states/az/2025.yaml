income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Arizona''s resident return (Form 140) starts from federal adjusted gross income: 2025 Form 140 line
  12 is "Federal adjusted gross income (from your federal return)", and the 2025 instructions state "Arizona uses
  federal adjusted gross income as a starting point to determine Arizona taxable income. Your federal adjusted gross
  income is your Arizona gross income." Because federally treaty-exempt income is already excluded from federal
  AGI, it flows through to the AZ return excluded. AZ then applies only specific statutory additions (2025 Form
  140 lines 14-18): the small-business-income modification (lines 13-14), non-Arizona municipal interest (line 15),
  the partnership income adjustment (line 16), total federal depreciation (line 17, reversed via the line 26 recalculated-Arizona-depreciation
  subtraction), and line 18 "Other Additions to Income" — whose 2025 schedule (Form 140 page 5) enumerates items
  A through S: A married persons filing separate returns, B Form 141AZ Schedule K-1 fiduciary adjustment, C ordinary-income
  portion of federally excluded lump-sum distributions, D items previously deducted for Arizona purposes, E/F claim-of-right
  repayment adjustments (incl. the NOL variant), G agricultural water conservation expenses / S-corporation pass-through
  addition, H adjusted-basis add-backs for credit property (Forms 338/325/315), I nonqualified 529 withdrawals, J
  sole-proprietorship loss of an Arizona nonprofit medical marijuana dispensary, K federal NOL carryforward from
  non-Arizona sources accrued while a nonresident, L federal capital-loss carryforward from non-Arizona sources before
  Arizona residency, M ADA access expenditures, N pre-1990 child-care-facility amortization/depreciation, O net capital
  loss from exchanging one kind of legal tender for another, P entity-level income tax payment, Q motion picture
  production costs, R other adjustments related to tax credits, S other adjustments, T total. NO line on Form 140
  or its additions schedule adds back federal tax-treaty-exempt income (unlike California''s Schedule CA). Therefore
  treaty-exempt income is NOT re-taxed by Arizona -> conforms. (The 2025 list is longer than the 2024 A-J list —
  items K-S were read line-by-line off the fetched 2025 form and none is a treaty add-back.)'
