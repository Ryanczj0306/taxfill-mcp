credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Dependent Tax Credit
  type: nonrefundable
  eligibility: Available to taxpayers who claim qualifying dependents (an individual that qualifies as a dependent
    for federal purposes) on the Arizona return. Credit amount is higher for dependents under age 17. Cannot claim
    the same individual as a qualifying parent/grandparent exemption (line 41) or Other Exemption (line 40).
  claimed_on: Arizona Form 140, page 2, line 49. Worksheet/Tables I-V in the 2025 Form 140 instructions.
  citation:
    source: Arizona Department of Revenue, 2025 Form 140 Resident Personal Income Tax Return Instructions (Line
      49 - Dependent Tax Credit; 2025 Adjusted Dependent Tax Credit worksheets Tables III/IV/V)
    url: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2025_140i.pdf
- name: Family Income Tax Credit
  type: nonrefundable
  eligibility: Arizona residents whose income (Worksheet I — Form 140 line 42 Arizona AGI plus the line 38-41 exemptions
    added back, plus any Form 140-SBI small business income from line 13) does not exceed the maximum allowed for
    their filing status and number of dependents. The credit only reduces tax and cannot be refunded.
  claimed_on: Arizona Form 140, page 2, line 50. Worksheets I and II / Tables I-III in the Form 140 instructions.
  citation:
    source: Arizona Department of Revenue, 2025 Form 140 Instructions (Line 50 - Family Income Tax Credit, Tables
      I-III, Worksheets I-II)
    url: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2025_140i.pdf
- name: Credit for Increased Excise Taxes
  type: refundable
  eligibility: Taxpayer must have an SSN valid for employment, meet the income threshold for their filing status,
    not be claimed as a dependent by another taxpayer, and not have been sentenced for at least 60 days of 2025
    to a county/state/federal prison. Married joint filers may also claim for a spouse who has either a valid SSN
    or an ITIN; if the spouse has a valid SSN but the taxpayer does not, neither may claim it.
  claimed_on: Arizona Form 140, page 2, line 56. If also claiming the property tax credit, computed on Form 140PTC
    (line 17) and carried to Form 140 line 56.
  citation:
    source: Arizona Department of Revenue, 2025 Form 140 Instructions (Line 56 - Increased Excise Tax Credit; Credit
      for Increased Excise Taxes Worksheet; Pub. 709)
    url: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2025_140i.pdf
- name: Property Tax Credit (Form 140PTC)
  type: refundable
  eligibility: Must have been an Arizona resident for the full year in 2025 and have paid property tax on an Arizona
    home, rent on taxable property for the entire year, or a combination of both during 2025. Must be either (a)
    age 65 or older in 2025, or (b) under 65 but receiving SSI Title 16 income from the Social Security Administration
    (NOT normal Social Security disability). Total household income must be under the limits below. The claim (or
    an extension request) must be filed by April 15, 2026.
  claimed_on: Arizona Form 140PTC, page 1, line 15 (carried to Form 140 page 2 line 57; if claiming both this and
    the excise credit, Form 140PTC line 17 feeds Form 140 line 56).
  citation:
    source: Arizona Department of Revenue, 2025 Form 140 Instructions (Line 57 - Property Tax Credit) and Form 140PTC
    url: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2025_140i.pdf
  unverified: true
