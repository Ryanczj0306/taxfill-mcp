- 'Standard deduction second pass: the 2025 Form 140 itself does not print the standard-deduction chart, so the
  $15,750/$31,500/$15,750/$23,625 amounts were verified against two separate places WITHIN the 2025 instructions
  (the Line 43 "Your Standard Deduction" chart and the "Do You Have to File?" filing-requirement thresholds, which
  Arizona pegs to the same figures) rather than against a second document. Arizona''s statutory link is to the FEDERAL
  standard deduction, so the 2025 amounts are the OBBBA-raised federal amounts, not the pre-OBBBA $15,000/$30,000/$22,500
  projections.'
tax:
  citation:
    source: 'AZ DOR — 2025 Form 140 Instructions: Line 46 "Multiply line 45 by 2.5% (.025) and enter the result" (Line
      45 = Arizona taxable income); Line 12 = federal AGI ("Arizona uses federal adjusted gross income as a starting
      point to determine Arizona taxable income. Your federal adjusted gross income is your Arizona gross income");
      "Your Standard Deduction" chart (Line 43) — $15,750 single, $31,500 married filing joint, $15,750 married filing
      separate, $23,625 head of household (the same figures set the "Do You Have to File?" thresholds); exemptions on
      lines 38-41 (age 65 or over $2,100; blind $1,500; other exemptions $2,300; qualifying parents and grandparents
      $10,000); Line 44 increased standard deduction for charitable contributions at 34% (.34); Dependent Tax Credit
      on Line 49. Second pass: the 2025 Form 140 itself (ADOR 10413 (25), "AZ Form 140 (2025)") prints line 46 "Tax:
      Multiply line 45 by 2.5% (.025). Enter the result", the line 38-41 multiplications ($2,100/$1,500/$2,300/$10,000),
      and the page-3 charitable standard-deduction-increase worksheet line 7C "Multiply line 6C by 34% (.34)" — both
      passes agree.'
    url: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2025_140i.pdf
  flat_rate: 0.025
  base: federal_agi
  tax_line: 'Form 140 Line 46: "Tax: Multiply line 45 by 2.5% (.025). Enter the result" (Line 45 = Arizona taxable
    income = Line 42 Arizona AGI minus Lines 43-44; Line 42 = line 37 minus lines 38-41; Line 12 starts from federal
    AGI).'
  exemptions:
    age_65:
      amount: 2100
      note: 'Form 140 Line 38: $2,100 per age-65-or-over box ("Age 65 or over: Multiply the number in box 8 by $2,100")
        — subtracted before Arizona taxable income (Line 42 = line 37 minus lines 38-41). NOT applied by calc.state_tax
        — enter it on Line 38.'
    blind:
      amount: 1500
      note: 'Form 140 Line 39: $1,500 per blind box ("Blind: Multiply the number in box 9 by $1,500"). NOT applied by
        calc.state_tax — enter it on Line 39.'
    other:
      amount: 2300
      note: 'Form 140 Line 40: $2,300 per "Other Exemptions" person (box 40E; page 4 Part 3 required). Covers e.g. a person
        age 65 or over whose Arizona home health care or other medical costs you paid, and a stillborn child; only ONE
        $2,300 exemption per individual even if two boxes apply. NOT applied by calc.state_tax — enter it on Line 40.'
    qualifying_parent_grandparent:
      amount: 10000
      note: 'Form 140 Line 41: $10,000 per qualifying parent or grandparent (box 11a) — mutually exclusive with the Line
        40 "Other Exemption" and the Line 49 dependent credit for the SAME individual. NOT applied by calc.state_tax —
        enter it on Line 41.'
  standard_deduction:
    single: 15750
    married_filing_jointly: 31500
    married_filing_separately: 15750
    head_of_household: 23625
  notes:
  - 'Rate unchanged for 2025: Arizona stays at the 2.5% flat rate for all income levels and filing statuses (first
    effective 2023). What CHANGED is the standard deduction, which rose to the 2025 federal amounts as raised by the
    federal reconciliation act ("OBBBA"): $15,750 single/MFS, $31,500 MFJ, $23,625 HoH (from $14,600/$29,200/$21,900
    in 2024) — do NOT use the pre-OBBBA $15,000/$30,000/$22,500 projections. The lines 38-41 exemption amounts are
    unchanged.'
  - Arizona has NO personal exemption, and the plain dependent exemption was replaced by the Line 49 Dependent Tax
    Credit ($100 per qualifying dependent under 17, $25 per dependent 17 or over, phased down when federal AGI exceeds
    $200,000 — $400,000 MFJ — and gone once the excess tops $19,000). It is a CREDIT against tax, not a base reduction,
    and is NOT modeled by calc.state_tax.
  - 'Increased Standard Deduction for charitable contributions (Line 44): non-itemizers may add 34% (.34) of the qualified
    charitable contributions that would have been allowed had they itemized — RAISED for 2025 from 33% (2024) and
    31% (2022) — via the Form 140 page-3 worksheet (line 7C). NOT modeled; claim it on Line 44 with box 44C checked,
    or the increase may be denied.'
  - 'Exemptions on Form 140 lines 38-41 (age 65+ $2,100; blind $1,500; other $2,300; qualifying parent/grandparent
    $10,000) reduce Arizona AGI on the form — calc.state_tax does not apply them; a 65+/blind filer computes lines
    38-41 on the form. A deceased-spouse special rule applies to Line 43: if you and your deceased spouse would have
    filed jointly for 2025 enter $31,500, if separately enter $15,750.'
  - 'Not modeled: the Line 47 tax from recapture of Form 301 credits (added to the Line 46 tax at Line 48), the Form
    140-SBI small-business-income election (lines 13-14 remove SBI from the Form 140 base and tax it on a separate
    return), and every Arizona credit (lines 49-58).'
