  a .gov page in this session; only the domicile-based resident definition from the 2025 Form 140 instructions was
  confirmed (the instructions do point to the department's "Procedure For Determining Residency Status").
- The 2025 Form 140PTC credit tables (Schedules 1 and 2 per-bracket amounts and the maximum credit — $502 in 2023)
  were not re-verified; the eligibility tests and household-income limits ($3,751 / $5,501) ARE verified from the
  2025 Form 140 instructions, Line 57. Confirm the table amounts on the 2025 Form 140PTC before computing the credit.
- Form 140A / 140EZ eligibility specifics beyond the Form 140 instructions' "Who Must Use Form 140?" list were not
