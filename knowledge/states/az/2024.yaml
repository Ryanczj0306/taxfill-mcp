unverified:
- The Arizona statutory-resident / 9-month-presence presumption (A.R.S. 43-104) was not separately confirmed on
  a .gov page in this session; only the domicile-based resident definition from the 2024 Form 140 instructions was
  confirmed.
- The 2024 Form 140PTC credit tables (Schedules 1 and 2 per-bracket amounts and the maximum credit — $502 in 2023)
  were not re-verified; the eligibility tests and household-income limits ($3,751 / $5,501) ARE verified from the
  2024 Form 140 instructions, Line 57. Confirm the table amounts on the 2024 Form 140PTC before computing the credit.
- Form 140A / 140EZ eligibility specifics beyond the Form 140 instructions' "Who Must Use Form 140?" list were not
  fetched.
# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 Form 140 instructions and the 2024
# Form 140 itself (azdor.gov), INCLUDING the verifier's 2023 correction carried forward:
# Form 140 lines 38-41 are real exemptions subtracted before Arizona taxable income
# (Line 42 Arizona AGI = line 37 minus lines 38-41) — only the plain dependent
# exemption was replaced by the Line 49 Dependent Tax Credit. 2024: rate stays 2.5%;
# the standard deduction tracks the 2024 federal amounts; lines 38-41 are unchanged.
tax:
  citation:
    source: 'AZ DOR — 2024 Form 140 Instructions: Line 46 "Multiply line 45 by 2.5% (.025) and enter the result" (Line
      45 = Arizona taxable income); Line 12 = federal AGI ("Arizona uses federal adjusted gross income as a starting
      point... Your federal adjusted gross income is your Arizona gross income"); "Your Standard Deduction" chart —
      $14,600 single/MFS, $29,200 MFJ, $21,900 HoH (Line 43; tracks the printed 2024 federal amounts, which also set
      the filing thresholds); exemptions on lines 38-41 (age 65+ $2,100; blind $1,500; other exemptions $2,300; qualifying
      parents/grandparents $10,000); Dependent Tax Credit on Line 49. Second pass: the 2024 Form 140 itself prints line
      46 "Tax: Multiply line 45 by 2.5% (.025)", the line 38-41 multiplications ($2,100/$1,500/$2,300/$10,000), and
      the page-3 charitable standard-deduction-increase worksheet at 33% (.33) — both passes agree.'
    url: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2024_140i.pdf
  flat_rate: 0.025
  base: federal_agi
  tax_line: 'Form 140 Line 46: "Tax: Multiply line 45 by 2.5% (.025). Enter the result" (Line 45 = Arizona taxable
    income = Line 42 Arizona AGI minus Lines 43-44; Line 42 = line 37 minus lines 38-41; Line 12 starts from federal
    AGI).'
  exemptions:
    age_65:
      amount: 2100
      note: 'Form 140 Line 38: $2,100 per age-65-or-over box ("Multiply the number in box 8 by $2,100") — subtracted before
        Arizona taxable income (Line 42 = line 37 minus lines 38-41). NOT applied by calc.state_tax — enter it on Line
        38.'
    blind:
      amount: 1500
      note: 'Form 140 Line 39: $1,500 per blind box ("Multiply the number in box 9 by $1,500"). NOT applied by calc.state_tax
        — enter it on Line 39.'
    other:
      amount: 2300
      note: 'Form 140 Line 40: $2,300 per "Other Exemptions" person (box 40E; page 4 Part 3 required). NOT applied by
        calc.state_tax — enter it on Line 40.'
    qualifying_parent_grandparent:
      amount: 10000
      note: 'Form 140 Line 41: $10,000 per qualifying parent or grandparent (box 11a) — mutually exclusive with the Line
        40 other exemption / Line 49 dependent credit for the SAME individual. NOT applied by calc.state_tax — enter it
        on Line 41.'
  standard_deduction:
    single: 14600
    married_filing_jointly: 29200
    married_filing_separately: 14600
    head_of_household: 21900
  notes:
  - 'Rate unchanged for 2024: Arizona stays at the 2.5% flat rate for all income levels and filing statuses (first
    effective 2023); the standard deduction rose to the printed 2024 federal amounts ($14,600/$29,200/$21,900, from
    $13,850/$27,700/$20,800), and the lines 38-41 exemption amounts are unchanged.'
  - Arizona has NO personal exemption, and the plain dependent exemption was replaced by the Line 49 Dependent Tax
    Credit ($100 per dependent under 17, $25 per dependent 17 or over, phased down when federal AGI exceeds $200,000
    — $400,000 MFJ, no credit once the excess tops $19,000). It is a CREDIT against tax, not a base reduction, and
    is NOT modeled by calc.state_tax.
  - 'The 2024 Arizona standard deduction equals the printed 2024 federal amounts. Increased Standard Deduction for
    charitable contributions (Line 44): non-itemizers may add 33% (.33) of qualified charitable contributions (2024
    rate, up from 31% in 2023) via the Form 140 page-3 worksheet — NOT modeled; claim it on Line 44 with box 44C checked.'
  - Exemptions on Form 140 lines 38-41 (age 65+ $2,100; blind $1,500; other $2,300; qualifying parent/grandparent
    $10,000) reduce Arizona AGI on the form — calc.state_tax does not apply them; a 65+/blind filer computes lines
    38-41 on the form.
