  url: https://azdor.gov/sites/default/files/document/FORMS_INDIVIDUAL_2024_140i.pdf
- source: 'AZ DOR — 2024 Form 140 (form PDF; second-pass verification: line 12 "Federal adjusted gross income (from
    your federal return)", line 38 "Multiply the number in box 8 by $2,100", line 39 "$1,500", line 40 "$2,300",
    line 41 "$10,000", line 42 Arizona adjusted gross income = line 37 minus lines 38-41, line 45 Arizona taxable
