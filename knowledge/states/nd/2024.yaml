unverified:
- The mailing address is the same PO Box (5621) for both refund/no-payment and with-payment returns per the 2024
  booklet's single 'Mail your return to' instruction and the ND-1 form footer; ND does not appear to publish separate
  refund vs payment PO boxes. Confirm at tax.nd.gov before relying on a split address.
- Online payment portal URL given as https://tap.nd.gov/ (ND TAP); the booklet directs users to tax.nd.gov 'Make
  A Payment'. Confirm the current ND TAP payment URL at the DOR.
- The 2024 Schedule ND-1FC (Family Member Care Tax Credit) and Schedule ND-1TC per-credit amounts were not re-pulled
  this pass (the booklet's Line 23 defers to Schedule ND-1TC); the 2023 pack's ND-1FC figures ($2,000/$4,000 caps,
  0.20-0.30 decimal, $50,000/$70,000/$35,000 phaseouts) were NOT carried forward as verified 2024 facts — confirm
  on the 2024 schedules before claiming.
- Exact ND-EZ vs ND-1 eligibility questions were summarized, not fully enumerated; confirm the 'Which form to use'
  checklist in the 2024 booklet for a specific taxpayer.
tax:
  citation:
    source: '2024 North Dakota Individual Income Tax Booklet (Forms ND-EZ and ND-1 instructions, 28702/April 2025),
      ND Office of State Tax Commissioner — ''2024 Tax Rate Schedules'' (p.28): Single — $0-$47,150 0.00% of North Dakota
      taxable income; $47,150-$238,200 $0.00 + 1.95% of amount over $47,150; over $238,200 $3,725.48 + 2.50% of amount
      over $238,200; Married filing jointly and Qualifying surviving spouse — $78,775 / $289,975, top constant $4,118.40;
      Married filing separately — $39,375 / $144,975, top constant $2,059.20; Head of household — $63,175 / $264,100,
      top constant $3,918.04. ''Line 20 - Tax'' instruction (full-year residents use the Tax Table, pp.20-27, below
      $100,000; the schedules print ''If your North Dakota taxable income is $100,000 or more, use the tax rate schedule'').
      Second pass: the 2024 Form ND-1 (SFN 28702, https://www.tax.nd.gov/sites/www/files/documents/forms/individual/2024-iit/form-nd-1-2024.pdf)
      prints line 1b ''Federal taxable income from Form 1040 or 1040-SR, line 15'', line 18 North Dakota taxable income,
      and line 20 ''Tax - If full-year resident, enter tax on amount on line 19 from Tax Table in instructions''; Tax
      Table rows recompute against the schedules at band midpoints (e.g. single $50,100-$50,150 -> $58 = 1.95% x (50,125
      - 47,150) = 58.01 rounded) — both passes agree.'
    url: https://www.tax.nd.gov/sites/www/files/documents/forms/individual/2024-iit/2024-individual-income-tax-booklet.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 47150, rate: 0}
    - {over: 47150, but_not_over: 238200, rate: 0.0195}
    - {over: 238200, but_not_over: null, rate: 0.025}
    married_filing_jointly:
    - {over: 0, but_not_over: 78775, rate: 0}
    - {over: 78775, but_not_over: 289975, rate: 0.0195}
    - {over: 289975, but_not_over: null, rate: 0.025}
    married_filing_separately:
    - {over: 0, but_not_over: 39375, rate: 0}
    - {over: 39375, but_not_over: 144975, rate: 0.0195}
    - {over: 144975, but_not_over: null, rate: 0.025}
    head_of_household:
    - {over: 0, but_not_over: 63175, rate: 0}
    - {over: 63175, but_not_over: 264100, rate: 0.0195}
    - {over: 264100, but_not_over: null, rate: 0.025}
  base: federal_taxable_income
  tax_line: 'Form ND-1 (2024), page 2, line 20: ''Tax - If full-year resident, enter tax on amount on line 19 from
    Tax Table in instructions. If full-year nonresident or part-year resident, enter tax from Schedule ND-1NR, line
    23. All filers: If you have farm income or sold a research credit, see instructions.'' Line 19 is the North Dakota
    taxable income carried from line 18 (= line 1b federal taxable income + additions lines 2-4a - subtractions).'
  exemptions: {}
  notes:
  - 'Base guidance: Supply federal taxable income — Form 1040/1040-SR line 15, which is entered on Form ND-1 line
    1b. If any North Dakota additions (ND-1 lines 2-4a, e.g. the planned gift/endowment credit adjustment) or subtractions
    (lines 5-17, e.g. U.S.-obligation interest, net long-term capital gain exclusion, qualified dividend exclusion,
    Social Security exclusion) apply, supply Form ND-1 line 19 (North Dakota taxable income, carried from line 18
    = line 1b + additions - subtractions, floored at 0) instead. The brackets apply directly to that figure with nothing
    further subtracted: North Dakota has no state standard deduction and no personal/dependent exemptions — the federal
    standard/itemized deduction is already embedded in federal taxable income. Nonresident-alien edge case: ND does
    not conform to federal treaty exemptions; an NRA must build a Pro Forma 1040NR disregarding treaty provisions
    and use its line 15 as ND-1 line 1b.'
  - '2024 RE-INDEXATION (structure unchanged from the 2023 reform): the three-bracket 0% / 1.95% / 2.5% system continues
    with inflation-adjusted boundaries — single 0% band now to $47,150 (2023: $44,725) and the 2.5% bracket now starting
    at $238,200 (2023: $225,975); MFJ/QSS $78,775 / $289,975 (2023: $74,750 / $275,100); MFS $39,375 / $144,975 (2023:
    $37,375 / $137,550); HoH $63,175 / $264,100 (2023: $59,950 / $250,550). The rates themselves are unchanged. The
    shipped schedules are the ones printed in the 2024 booklet (p.28).'
  - 'Tax Table mandate below $100,000: the booklet''s ''Line 20 - Tax'' instructs full-year residents to use the Tax
    Table (pp.20-27, $50 income bands), and the rate-schedule page itself says to use the schedules only ''If your
    North Dakota taxable income is $100,000 or more.'' Table values are the schedules evaluated at the band midpoint
    (verified: single $50,100-$50,150 row prints $58 = 1.95% x ($50,125 - $47,150) = $58.01 rounded), so bracket math
    may differ from the table by about a dollar within a band; the filed form must use the table below $100,000.'
  - Qualifying surviving spouse (Form ND-1 filing status 5) uses the Married filing jointly column — the 2024 rate
    schedule is titled 'Married filing jointly and Qualifying surviving spouse' and the Tax Table is footnoted '*If
    a Qualifying surviving spouse, use the Married filing jointly column'; the engine's QSS-to-MFJ mapping is exactly
    correct.
  - 'Printed ''$X + Y% of amount over $Z'' top-bracket constants reconcile with cumulative bracket sums to within
    half a cent: Single $3,725.48 printed vs exact 1.95% x $191,050 = $3,725.475 (+$0.005); MFJ/QSS $4,118.40 = 1.95%
    x $211,200 exactly; MFS $2,059.20 = 1.95% x $105,600 exactly; HoH $3,918.04 printed vs exact 1.95% x $200,925
    = $3,918.0375 (+$0.0025). Pure marginal bracket math (what this op does) therefore matches the printed schedules
    to the cent after whole-dollar rounding.'
  - 'No state standard deduction and no personal or dependent exemptions: ND starts from federal taxable income (Form
    1040 line 15 -> ND-1 line 1b), which already reflects the FEDERAL standard or itemized deduction; nothing further
    is subtracted before the rates apply. Pass exemptions_count=0 and dependents_count=0.'
  - 'ND additions and subtractions (ND-1 lines 2-17: e.g. 40% net long-term capital gain exclusion, qualified dividend
    exclusion, Social Security benefit exclusion, U.S.-obligation interest, ND-1SA items) are NOT modeled — if any
    apply, compute ND-1 line 18/19 on the form and supply that as the base.'
  - Marriage penalty credit (Form ND-1 line 22, maximum $303 for 2024, up from $287) is a nonrefundable CREDIT subtracted
    from tax for joint filers where joint ND taxable income exceeds $78,836 and the lower-earning spouse's qualified
    income exceeds $46,275 — computed on the booklet worksheet (p.14, $14,600 line-5 constant); it is NOT an income
    exemption and is not modeled by this op. The line 21 credit for income tax paid to another state (Schedule ND-1CR)
    and line 23 Schedule ND-1TC credits are likewise not modeled.
  - 'Full-year nonresidents and part-year residents do not use this computation directly: their tax comes from Schedule
    ND-1NR line 23 (the full-year tax prorated by the ND income ratio); this pack reproduces the full-year-resident
    tax on ND-1 line 20 only.'
  - 'Alternate computations not modeled: farm income averaging via Schedule ND-1FA (federal Schedule J filers) and
    tax on proceeds from the sale of a research expense credit via Schedule ND-1CS — ND-1 line 20 directs those filers
    to the instructions.'
  - 'ND does NOT conform to federal income tax treaties (booklet p.5): treaty-exempt income is effectively rebuilt
    into the base via a Pro Forma 1040NR that disregards treaty provisions, whose line 15 becomes ND-1 line 1b.'
  - 'No mid-year 2024 rate change: the three-bracket system enacted effective tax year 2023 (0%/1.95%/2.5%) simply
    carried into 2024 with indexed boundaries; the 2024 booklet prints one set of schedules for the whole year.'
