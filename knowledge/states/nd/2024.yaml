# ND state knowledge — tax year 2024. Fetched + cited from the ND DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Individual Income
# Tax Booklet (Forms ND-EZ/ND-1 instructions, 28702/April 2025 print), then independently
# re-derived from a second official document (the 2024 Form ND-1 itself — lines 1a/1b,
# 18/19/20, PO Box 5621 — plus the booklet's 2024 Tax Table rows recomputed against the
# rate schedules) — resolutions recorded inline where the passes differed.
# HEADLINE 2024: the 2023 three-bracket 0%/1.95%/2.5% structure CONTINUES with RE-INDEXED
# boundaries — single 0% now to $47,150 (was $44,725) and 2.5% above $238,200 (was
# $225,975); MFJ/QSS $78,775/$289,975; MFS $39,375/$144,975; HoH $63,175/$264,100.
# Marriage penalty credit maximum rose to $303 (was $287), thresholds $78,836/$46,275.
# Still NO state standard deduction and NO personal/dependent exemptions (federal
# taxable income base).
jurisdiction: states/nd
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'ND does NOT conform — it re-taxes federally treaty-exempt income. Although the ND-1 resident return
  starts from federal taxable income (Form 1040/1040-SR line 15, ND-1 line 1b), the 2024 ND-1 Individual Income
  Tax Booklet (p.5) states: "Except where an income tax treaty between the United States and a foreign country specifically
  exempts income from taxation by a U.S. state, income tax treaties between the U.S. and foreign countries do not
  apply for North Dakota income tax purposes. Therefore, you may have to pay North Dakota income tax on gross income
  from North Dakota sources even though the income is exempt from U.S. income tax because of a treaty." The mechanism
  is in the Guideline: Income Taxation of Nonresident Aliens — the taxpayer must complete a Pro Forma U.S. Form
  1040NR but "you must disregard any instruction to the U.S. income tax return that refers to the treaty," then
  carry that pro-forma 1040NR line 15 (with treaty income NOT excluded) to ND-1 line 1b. So treaty-exempt income
  that drops out of the actual federal return is effectively added back (rebuilt) before flowing into ND income.
  This is the same non-conforming posture as CA/CT/MD/MS. The treaty pass-through applies ONLY where a treaty article
  specifically extends the exemption to the 50 U.S. states.'
citation:
  source: ND 2024 Individual Income Tax Booklet (Forms ND-EZ/ND-1 instructions) — Who must file (pp.4-5), Statutory
    7-month rule, treaty statement (p.5), file on or before April 15 2025, mailing PO Box 5621, payee 'ND State
    Tax Commissioner', 2024 Tax Table (pp.20-27) and 2024 Tax Rate Schedules (p.28)
  url: https://www.tax.nd.gov/sites/www/files/documents/forms/individual/2024-iit/2024-individual-income-tax-booklet.pdf
starts_from: federal taxable income (Form 1040/1040-SR line 15 -> ND-1 line 1b; line 1a also captures federal AGI
  from line 11). Per the Nonresident Aliens guideline, a nonresident alien builds a Pro Forma 1040NR disregarding
  treaty provisions and enters its line 15 on ND-1 line 1b.
residency:
  summary: 'Full-year resident: a legal resident of ND (domicile = the permanent home to which you always intend
    to return whenever absent; if you have more than one physical abode, only one may be your legal residence, based
    on intent and actions) for the entire tax year, OR someone meeting the statutory 7-month rule. Statutory 7-month
    rule: even if not a ND resident, you must file as a full-year resident if you maintain a permanent place of
    abode in ND (a house, apartment, or other dwelling with cooking and bathroom facilities suitable for year-round
    living, maintained on a permanent/indefinite basis) and spend in the aggregate more than 210 days of the tax
    year in ND; the rule does not apply to part-year residents, full-year nonresidents serving in the U.S. armed
    forces, or full-year Montana/Minnesota residents covered by reciprocity. Part-year resident: a ND resident for
    only part of 2024 — files if required to file federally and derived gross income from any source while a ND
    resident or from a ND source while a nonresident. Full-year nonresident: not a ND resident for any part of the
    year and does not meet the 7-month rule — files if required to file federally and derived gross income from
    ND sources. Residents are taxed on all income; nonresidents/part-year residents apportion via Schedule ND-1NR.
    Reciprocity exempts MN full-year residents (personal/professional-service compensation, with monthly returns
    home) and MT full-year residents (wages) from ND filing on that income. A resident may claim a credit for tax
    paid to another state (Schedule ND-1CR).'
forms:
  resident: Form ND-1 (Individual Income Tax Return). A simplified Form ND-EZ is available for qualifying full-year
    residents who answer "No" to all the "Which form to use" questions (e.g., no additions/most subtractions, no
    nonresident/part-year status, no other-state credit).
  part_year_or_nonresident: Schedule ND-1NR (Tax Calculation for Nonresidents and Part-Year Residents), filed with
    Form ND-1. (Nonresidents and part-year residents file Form ND-1 plus Schedule ND-1NR; they cannot use Form ND-EZ.)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Marriage Penalty Credit
  type: nonrefundable
  eligibility: Married couples filing a JOINT North Dakota return where both spouses have qualified income (wages/salaries/tips
    from Form 1040 line 1z, net self-employment income, and taxable retirement/Social Security amounts). Qualifies
    only if joint ND taxable income (Form ND-1 line 18) exceeds $78,836 AND the lower-earning spouse's qualified
    income exceeds $46,275 (2024 indexed amounts — up from $74,862/$43,980 in 2023). Designed to offset the higher
    tax that two-earner couples pay versus filing as singles.
  amount: Calculated via the Marriage Penalty Credit Worksheet (2024 booklet p.14, which nets the joint-schedule
    tax against each spouse's tax computed at single rates using a $14,600 constant on worksheet line 5); equals
    the smaller of the computed marriage penalty or the maximum credit of $303 for 2024 (up from $287 in 2023).
  income_limit_2024: Joint ND taxable income must be more than $78,836 and the lower-earning spouse's qualified
    income must be more than $46,275 to qualify (these are eligibility thresholds, not upper income caps).
  claimed_on: Form ND-1, line 22 (Marriage Penalty Credit Worksheet in the 2024 ND-1 booklet, p.14)
  citation:
    source: ND Office of State Tax Commissioner — 2024 Individual Income Tax Booklet, 'Line 22 - Marriage penalty
      credit' and Marriage Penalty Credit Worksheet (thresholds $78,836 / $46,275; line 5 constant $14,600; line
      13 maximum credit $303.00)
    url: https://www.tax.nd.gov/sites/www/files/documents/forms/individual/2024-iit/2024-individual-income-tax-booklet.pdf
- name: Credit for Income Tax Paid to Another State
  type: nonrefundable
  eligibility: Full-year residents or part-year residents of North Dakota who paid income tax to another state (or
    local jurisdiction in that state) on income also taxed by North Dakota.
  income_limit_2024: None stated; the credit is limited by the Schedule ND-1CR computation (generally the lesser
    of the other state's tax or the ND tax attributable to that income).
  claimed_on: Form ND-1, line 21, computed on Schedule ND-1CR (include the schedule)
  citation:
    source: ND Office of State Tax Commissioner — 2024 Individual Income Tax Booklet, 'Line 21 - Credit for income
      tax paid to another state' (Schedule ND-1CR)
    url: https://www.tax.nd.gov/sites/www/files/documents/forms/individual/2024-iit/2024-individual-income-tax-booklet.pdf
- name: Renter's Refund (Renter's Property Tax Refund / circuit-breaker)
  type: refundable
  eligibility: A North Dakota renter who is age 65 or older OR has a permanent and total disability (physician's
    certificate or SSA/agency determination required), whose income (including spouse and dependents) does not exceed
    $70,000 for the calendar year preceding the assessment date. Rent must be for the renter's place of residence
    or a mobile home lot (heat, water, lights, telephone, and furniture costs do not count as rent; properties exempt
    from property tax, such as nursing homes, do not qualify). There is no asset limitation for renters.
  amount: 'Refund equals (20% of annual rent) minus (4% of annual income), up to a maximum refund of $600. (Official
    example: $9,600 annual rent and $35,000 income gives $1,920 - $1,400 = $520 refund.)'
  income_limit_2024: $70,000 (total income including spouse and dependents)
  claimed_on: Application for Renter's Refund filed directly with the ND Office of State Tax Commissioner (not on
    Form ND-1); applications accepted from the Tuesday after MLK Jr. Day through May 31, postmarked by May 31.
  citation:
    source: ND Office of State Tax Commissioner — Renter's Refund web page (qualifications, $70,000 income limit,
      20%-of-rent minus 4%-of-income formula, $600 maximum, application window)
    url: https://www.tax.nd.gov/property-tax-credits/renters-refund
- name: Homestead Property Tax Credit
  type: nonrefundable
  eligibility: A North Dakota homeowner who is age 65 or older OR has a permanent and total disability (no age requirement
    for disability; proof required), who lives at and has an ownership interest in the property (co-ownership prorates
    the credit), and whose income (including spouse and dependents) does not exceed $70,000 for the calendar year
    preceding the assessment date. There is no asset limitation for homeowners.
  amount: 'Reduction in the property''s taxable value based on income: income $0-$40,000 = 100% reduction up to
    a maximum $9,000 of taxable value (max true & full value $200,000); income $40,001-$70,000 = 50% reduction up
    to a maximum $4,500 of taxable value (max true & full value $100,000). The dollar property-tax savings depends
    on the local mill rate.'
  income_limit_2024: $70,000 (total income including spouse and dependents)
  claimed_on: Application filed with the local assessor or county director of tax equalization, due April 1 of the
    assessment year (a property-tax program, not claimed on Form ND-1; once approved the credit is applied automatically).
  citation:
    source: ND Office of State Tax Commissioner — Homestead Property Tax Credit web page (qualifications, $70,000
      income limit, 100%/50% taxable-value reduction table, April 1 application)
    url: https://www.tax.nd.gov/homestead-property-tax-credit
filing_requirement:
  note: 'You must file a 2024 ND individual income tax return if you are required to file a 2024 federal return
    AND you are: (a) a full-year ND resident (taxed on all income, even if earned outside ND or overseas); (b) a
    part-year resident with ND-source income or income earned while a resident; or (c) a full-year nonresident (including
    a nonresident alien) with gross income from ND sources. MN full-year residents (personal/professional-service
    compensation with monthly returns home) and MT full-year residents (wages) are exempt under reciprocity. (2024
    ND-1 Booklet, "Who must file a return," pp.4-5.)'
