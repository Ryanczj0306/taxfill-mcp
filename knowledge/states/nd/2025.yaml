  base: federal_taxable_income
  tax_line: 'Form ND-1 (2025), page 2, line 20: ''Tax - If full-year resident, enter tax on amount on line 19 from
    Tax Table in instructions. If full-year nonresident or part-year resident, enter tax from Schedule ND-1NR. All
    filers: If you have farm income or sold a research credit, see instructions.'' Line 19 is the North Dakota taxable
    income carried from line 18 (= line 1b federal taxable income + additions lines 2-4 - subtractions lines 5-17,
    floored at 0).'
  exemptions: {}
  notes:
  - 'Base guidance: Supply federal taxable income — Form 1040/1040-SR line 15, which is entered on Form ND-1 line
    1b. If any North Dakota additions (ND-1 lines 2-4, e.g. the planned gift/endowment credit adjustment and Schedule
    ND-1SA additions) or subtractions (lines 5-17: U.S.-obligation interest, the net long-term capital gain exclusion,
    exempt income of an eligible Native American, Railroad Retirement Board benefits, the military pay exclusion,
    the College SAVE deduction, the qualified dividend exclusion, the military retirement benefit exclusion, the Social
    Security benefit exclusion, Schedule ND-1SA items) apply, supply Form ND-1 line 19 (North Dakota taxable income,
    carried from line 18 = line 4b - line 17, floored at 0) instead. The brackets apply directly to that figure with
    nothing further subtracted: North Dakota has no state standard deduction and no personal/dependent exemptions
    — the federal standard/itemized deduction is already embedded in federal taxable income. Nonresident-alien edge
    case: ND does not conform to federal treaty exemptions; an NRA must build a Pro Forma 1040NR disregarding treaty
    provisions and use its line 15 as ND-1 line 1b.'
  - '2025 RE-INDEXATION (structure unchanged from the 2023 reform): the three-bracket 0% / 1.95% / 2.5% system continues
    with inflation-adjusted boundaries — single 0% band now to $48,475 (2024: $47,150) and the 2.5% bracket now starting
    at $244,825 (2024: $238,200); MFJ/QSS $80,975 / $298,075 (2024: $78,775 / $289,975); MFS $40,475 / $149,025 (2024:
    $39,375 / $144,975); HoH $64,950 / $271,450 (2024: $63,175 / $264,100). The rates themselves are unchanged. Note
    the MFS boundaries are NOT exactly half of MFJ ($80,975/2 = $40,487.50 but the printed MFS figure is $40,475;
    $298,075/2 = $149,037.50 vs the printed $149,025) — each column is independently rounded, so do not derive MFS
    by halving. The shipped schedules are the ones printed in the 2025 booklet (p.28).'
  - 'Tax Table mandate below $100,000: the booklet''s ''Line 20 - Tax'' instructs full-year residents to use the Tax
    Table (pp.20-27, $50 income bands), and the rate-schedule page itself says to use the schedules only ''If your
    North Dakota taxable income is $100,000 or more.'' Table values are the schedules evaluated at the band midpoint
    (verified: the single $53,450-$53,500 row prints 98 = 1.95% x ($53,475 - $48,475) = $97.50 rounded half up; the
    $50,100-$50,150 row prints 32 = 1.95% x ($50,125 - $48,475) = $32.175; the same $53,450-$53,500 row''s MFS column
    prints 254 = 1.95% x ($53,475 - $40,475) = $253.50), so bracket math may differ from the table by about a dollar
    within a band; the filed form must use the table below $100,000.'
  - Qualifying surviving spouse (Form ND-1 filing status 5) uses the Married filing jointly column — the 2025 rate
    schedule is titled 'Married Filing Jointly and Qualifying Surviving Spouse' and the Tax Table is footnoted '*If
