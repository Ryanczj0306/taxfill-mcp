unverified:
- The mailing address is the same PO Box (5621) for both refund/no-payment and with-payment returns per the 2025
  booklet's single 'Mail to' instruction and the ND-1 form footer; ND does not appear to publish separate refund
  vs payment PO boxes. Confirm at tax.nd.gov before relying on a split address.
- Check-payee wording appears in two forms in the 2025 booklet — 'ND State Tax Commissioner' in the payment paragraph
  and 'North Dakota Office of State Tax Commissioner' in the assembly checklist. Either should be honored; confirm
  at tax.nd.gov if a bank rejects one.
- Online payment portal recorded as https://tax.nd.gov/payment (the booklet's 'To pay online, go to tax.nd.gov/payment'),
  which redirects to the ND TAP portal (tap.tax.nd.gov). Confirm the current URL at the DOR.
- The 2025 Schedule ND-1FC (Family Member Care Tax Credit) and the per-credit amounts on Schedule ND-1TC were not
  pulled this pass (the booklet's Line 23 defers to Schedule ND-1TC); do not assume prior-year figures — confirm
  on the 2025 schedules before claiming.
- Schedule ECC (the new Employer Child Care Contribution credit) was not read line-by-line; the 50%-of-first-$1,000-per-employee
  amount and the qualified-payment description are from the booklet's 'New for 2025' summary.
- Exact ND-EZ vs ND-1 eligibility questions were summarized, not fully enumerated; confirm the 'Which form to use'
  checklist in the 2025 booklet for a specific taxpayer.
- The 2025 Form ND-1 PDF carries two text layers; the visible one prints line 1a as 'Form 1040 or 1040-SR, line
  11a' while a residual layer reads 'line 11'. Line 1b ('Form 1040 or 1040-SR, line 15') is identical in both layers
  and is the figure this pack's tax base uses, so the ambiguity does not affect the computation.
tax:
  citation:
    source: '2025 North Dakota Individual Income Tax Booklet (Forms ND-EZ and ND-1 instructions, 28702 12-2025), ND
      Office of State Tax Commissioner — ''2025 Tax Rate Schedules'' (p.28): Single — $0-$48,475 0.00% of North Dakota
      taxable income; $48,475-$244,825 $0.00 + 1.95% of amount over $48,475; over $244,825 $3,828.83 + 2.50% of amount
      over $244,825; Married Filing Jointly and Qualifying Surviving Spouse — $80,975 / $298,075, top constant $4,233.45;
      Married Filing Separately — $40,475 / $149,025, top constant $2,116.73; Head of Household — $64,950 / $271,450,
      top constant $4,026.75. The schedule page states ''If your North Dakota taxable income is $100,000 or more, use
      the tax rate schedule below for your filing status to calculate your tax,'' and the ''Line 20 - Tax'' instruction
      sends full-year residents to the Tax Table on pp.20-27 otherwise. Second pass: the 2025 Form ND-1 (SFN 28702,
      12-2025, https://www.tax.nd.gov/sites/www/files/documents/forms/individual/2025-iit/28702-form-nd-1-2025.pdf)
      prints line 1b ''Federal taxable income from Form 1040 or 1040-SR, line 15'', line 18 ''North Dakota taxable income.
      Subtract line 17 from line 4b. If less than zero, enter 0'', line 19 the page-2 carry, and line 20 ''Tax - If
      full-year resident, enter tax on amount on line 19 from Tax Table in instructions''; the booklet''s own Tax Table
      rows recompute against these schedules at band midpoints (single $53,450-$53,500 row prints 98 = 1.95% x ($53,475
      - $48,475) = 97.50 rounded half up; single $50,100-$50,150 row prints 32 = 1.95% x ($50,125 - $48,475) = 32.175;
      MFS same $53,450-$53,500 row prints 254 = 1.95% x ($53,475 - $40,475) = 253.50) — both passes agree.'
    url: https://www.tax.nd.gov/sites/www/files/documents/forms/individual/2025-iit/2025-individual-income-tax-booklet.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 48475, rate: 0}
