unverified:
- 'The 2025 booklet is inconsistent about Schedule M: Form IT-140 line 2 reads "Additions to income (line 61
  of Schedule M)" and line 3 "(line 52 of Schedule M)" (the 2024 numbering), while the 2025 Schedule M itself
  prints "59. TOTAL ADDITIONS" and "50. Total Subtractions". This pack follows the Schedule M face.'
- Exact mytaxes.wvtax.gov URL path/label for paying personal income tax may change; instructions say visit mytaxes.wvtax.gov
  and click 'Pay Personal Income Tax.' Confirm current portal at the DOR.
