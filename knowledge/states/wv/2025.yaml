- description: >-
    DISABLED VETERAN'S PROPERTY TAX CREDIT EXTENDED TO A WIDOWED SPOUSE — a widowed spouse may now claim the credit
    if the deceased disabled veteran claimed it in the prior year, as long as the widow(er) has not remarried and the
    qualifying property has not been reclassified or sold. A refundable credit, claimed on Form IT-140 line 21, box B.
  status: final_form_published
  affects:
  - Form IT-140 line 21, WV Property Tax Adjustment Tax Credits — box B Disabled Veteran Real Property Tax; the sum
    enters line 21 and is totalled on line 23 (Payments and Refundable Credits, lines 15-22). NOT the Tax Credit
    Recap Schedule — its lines are non-refundable credits whose total (RECAP line 27) goes to IT-140 line 9.
