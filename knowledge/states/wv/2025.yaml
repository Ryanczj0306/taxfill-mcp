  increasing-modifications
  list plus the FAGI starting point; WV statute/regs were not independently reviewed for a treaty-specific add-back.
  Confirm at the DOR if a taxpayer relies on a US tax-treaty exclusion.
tax:
  citation:
    source: 'WV Tax Division — 2025 IT-140 Personal Income Tax Forms and Instructions booklet: TY2025 rate schedules
      print the REDUCED set (Less than $10,000 -> 2.22% of the taxable income; $222.00 plus 2.96% of excess over $10,000;
      $666.00 plus 3.33% over $25,000; $1,165.50 plus 4.44% over $40,000; $2,053.50 plus 4.82% over $60,000; Rate Schedule
      II for married filing separately at exactly half boundaries with constants 111.00/333.00/582.75/1,026.75). ''You
      can deduct $2,000 for every exemption claimed''; ''$500 if you claim zero exemptions''; cover: ''2025 PERSONAL
      INCOME TAX IS DUE APRIL 15, 2026''.'
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 10000, rate: 0.0222}
    - {over: 10000, but_not_over: 25000, rate: 0.0296}
    - {over: 25000, but_not_over: 40000, rate: 0.0333}
    - {over: 40000, but_not_over: 60000, rate: 0.0444}
    - {over: 60000, but_not_over: null, rate: 0.0482}
    married_filing_jointly:
    - {over: 0, but_not_over: 10000, rate: 0.0222}
    - {over: 10000, but_not_over: 25000, rate: 0.0296}
    - {over: 25000, but_not_over: 40000, rate: 0.0333}
    - {over: 40000, but_not_over: 60000, rate: 0.0444}
    - {over: 60000, but_not_over: null, rate: 0.0482}
    married_filing_separately:
    - {over: 0, but_not_over: 5000, rate: 0.0222}
    - {over: 5000, but_not_over: 12500, rate: 0.0296}
    - {over: 12500, but_not_over: 20000, rate: 0.0333}
    - {over: 20000, but_not_over: 30000, rate: 0.0444}
    - {over: 30000, but_not_over: null, rate: 0.0482}
    head_of_household:
    - {over: 0, but_not_over: 10000, rate: 0.0222}
    - {over: 10000, but_not_over: 25000, rate: 0.0296}
    - {over: 25000, but_not_over: 40000, rate: 0.0333}
    - {over: 40000, but_not_over: 60000, rate: 0.0444}
    - {over: 60000, but_not_over: null, rate: 0.0482}
  base: state_gross_income
  tax_line: 'Form IT-140 line 8: ''Income Tax Due (Check One)'' with method checkboxes ''Tax Table'', ''Rate Schedule'',
    ''Nonresident/Part-Year Resident Calculation Schedule''. Line 7 feeding it reads ''West Virginia Taxable Income
    (line 4 minus lines 5 & 6) IF LESS THAN ZERO, ENTER ZERO''. Instructions p.24: ''LINE 8 WEST VIRGINIA INCOME TAX.
    Check the appropriate box to indicate the method you used to calculate your tax.'''
  exemptions:
    personal:
      amount: 2000
      note: 'Form IT-140 Exemptions boxes (a) Yourself and (b) Spouse, deducted via line 6: ''Enter the number of exemptions
        shown in box e... and multiply that number by $2,000'' (instructions p.24: ''You can deduct $2,000 for every exemption
        claimed in your exemption schedule''). A BASE reduction: line 7 WV Taxable Income = line 4 minus lines 5 & 6,
        computed BEFORE the rate schedules. Married filing jointly with both spouses = exemptions_count 2 = $4,000. Box
        (a) is left blank (0) if someone can claim you as a dependent.'
    dependent:
      amount: 2000
      note: Same $2,000 per exemption for each dependent entered in Exemptions box (c) (child/relative or household member
        meeting the age/support/residency tests, instructions p.24), included in box (e) and deducted via line 6 before
        the rates — a base reduction, not a credit. You cannot claim any dependents if you can be claimed as a dependent
        on another person's return.
    surviving_spouse:
      amount: 2000
      note: 'Exemptions box (d): ''A surviving spouse may claim an additional exemption for the two (2) taxable years
        following the year in which the spouse died, provided he/she has not remarried before the end of the taxable year''
        (instructions p.24). One more $2,000 exemption included in box (e). NOT applied by calc.state_tax (the engine
        applies only the personal/dependent keys) — claim it on the form, or reflect it by raising exemptions_count only
        if eligible.'
  notes:
  - 'TY2025 verification (2026-08-04): West Virginia''s trigger-based reduction DID reach TY2025 — the booklet prints
    2.22/2.96/3.33/4.44/4.82% (2024 printed 2.36/3.15/3.54/4.72/5.12). All eight printed constants across both schedules
    were re-derived and equal EXACT cumulative marginal sums (222.00 = 2.22%x10,000; 666.00 = 222 + 2.96%x15,000;
    1,165.50 = 666 + 3.33%x15,000; 2,053.50 = 1,165.50 + 4.44%x20,000; Schedule II mirrors at half boundaries), so
    there is no printed-constant divergence to disclose for either schedule.'
  - 'Base guidance: Supply Form IT-140 line 4, West Virginia Adjusted Gross Income = line 1 federal adjusted gross
    income (''Enter your federal adjusted gross income as shown on Federal Form 1040'') plus line 2 additions to income
    (Schedule M line 59) minus line 3 subtractions from income (Schedule M line 50). If the filer has no Schedule
    M modifications, line 4 equals federal AGI. The op then subtracts the shipped $2,000-per-exemption amounts (standard_deduction
    is 0 — West Virginia has none) to reproduce line 7 West Virginia Taxable Income, assuming line 5 (Low-Income Earned
    Income Exclusion, only available when federal AGI is $10,000 or less / $5,000 MFS) is zero.'
  - 'Adjudication note (two-pass): standard_deduction is null — West Virginia allows neither a standard deduction
    nor itemized deductions on Form IT-140 (the only base reductions are the $2,000-per-exemption line 6 amounts,
    shipped as personal/dependent). Rate-schedule constants re-verified against the 2025 IT-140 booklet (222.00 /
    666.00 / 1,165.50 / 2,053.50).'
  - 'THE 2025 RATE CUT (corrected 2026-09-28, Phase J JS2 — this note had quoted the 2023 statute and 2024''s rates):
    the shipped rates (2.22%/2.96%/3.33%/4.44%/4.82%) are W. Va. Code §11-21-4i, ''Rate of tax — Taxable years
    beginning on and after January 1, 2025'' (2024 Second Special Session SB 2033), which ''shall apply for all
    taxable years beginning on and after January 1, 2025, and shall be in lieu of the rates of tax specified in
    §11-21-4g of this code and as those rates were modified by the application of §11-21-4h of this code in 2024''
    (https://code.wvlegislature.gov/11-21-4I/, fetched 2026-09-28) — it supersedes the Tax Commissioner''s August
    2024 administrative notice under the §11-21-4h trigger. Do not use the 2023-2024 §11-21-4g rates
    (2.36%-5.12%).'
  - 'TWO RATE SCHEDULES: Rate Schedule I applies ''if you checked 1 (Single), 2 (Head of household), 3 (Married filing
    joint), or 5 (Widow[er] with dependent child)''; it is duplicated here for single, married_filing_jointly, and
    head_of_household. Rate Schedule II applies only to filing status 4 (Married filing separately); its bracket bounds
    ($5,000/$12,500/$20,000/$30,000) were copied directly from the published schedule, not derived. The printed constants
    ($236.00/$708.50/$1,239.50/$2,183.50 on Schedule I; $118.00/$354.25/$619.75/$1,091.75 on Schedule II) exactly
    equal the cumulative sums of the prior brackets — no rounding divergence.'
  - 'TAX TABLE MANDATE BELOW $100,000: Line 8 instructions (p.24) — ''If your filing status is single, head of household,
    widow(er) with a dependent child or married filing jointly and your taxable income is less than $100,000, apply
    the amount of taxable income shown on line 7 to the Tax Table on page 36 and enter your tax on this line''; the
    rate schedule is for taxable income over $100,000. The table (booklet pp.36–40, last row $99,950–100,000 = $4,230)
    is band-midpoint based, so bracket math may differ by a few dollars within table bands — the filed form must use
    the table. Married-filing-separately filers CANNOT use the table at any income: ''If your filing status is Married
    Filling Separately you MUST use RATE SCHEDULE II to compute your tax.'''
  - 'NO STANDARD OR ITEMIZED DEDUCTION: West Virginia allows neither a standard deduction nor federal itemized deductions
    on Form IT-140 — the only across-the-board deduction is the $2,000-per-exemption allowance (''You can deduct $2,000
    for every exemption claimed in your exemption schedule'', p.24). standard_deduction is shipped as 0 for every
    filing status so the engine subtracts exemptions only.'
  - 'ZERO-EXEMPTION $500 ALLOWANCE NOT MODELED: ''If you claimed zero exemptions, enter $500 on this line [line 6]''
    (box (e) = 0, e.g. a filer claimable as a dependent on another return). The engine with exemptions_count=0 subtracts
    $0, not $500, so it can overstate tax by up to about $26 (5.12% of $500) for such filers — use the form''s line
    6 in that case.'
  - 'LOW-INCOME EARNED INCOME EXCLUSION (LINE 5) NOT MODELED: filers with federal AGI of $10,000 or less ($5,000 or
    less MFS) who have earned income may exclude the smaller of federal AGI, earned income, or $10,000 ($5,000 MFS)
    on line 5 before line 7 (worksheet, booklet p.29). The engine assumes line 5 = 0; it only affects returns with
    federal AGI at or below $10,000/$5,000.'
  - 'SCHEDULE M MODIFICATIONS COME BEFORE THE SUPPLIED BASE: the senior-citizen modification (up to $8,000 of income
    per taxpayer age 65+ or permanently/totally disabled), the up-to-$8,000 surviving-spouse decreasing modification,
    Social Security benefit modification, and all other Schedule M items are line 2/line 3 adjustments taken BEFORE
    line 4 — the caller must supply line 4 WV AGI already reflecting them.'
  - 'QUALIFYING SURVIVING SPOUSE: the engine maps QSS to married_filing_jointly. West Virginia''s own filing status
    5, ''Widow(er) with dependent child'', uses the SAME Rate Schedule I as married filing jointly and the same $2,000
    exemptions, so the mapping reproduces the correct tax.'
  - 'ROUNDING: the booklet requires whole dollars (''Round off amounts to WHOLE DOLLARS – NO CENTS'', Tips on Filing a Paper Return, printed page 16 / PDF page 18) and both
    rate-schedule examples say ''Round to nearest whole dollar'' — consistent with the engine''s half-up rounding
    to whole dollars.'
  - 'LINE 7 FLOOR: ''IF LESS THAN ZERO, ENTER ZERO'' matches the engine''s max(0, base_after).'
  - 'CREDITS ARE NOT EXEMPTIONS AND ARE NOT MODELED: line 8 tax is reduced on line 9 by the Tax Credit Recap Schedule
    credits — notably the Family Tax Credit (Schedule FTC-1), which can reduce the line 8 tax by up to 100% for low-income
    families based on family size and Modified Federal AGI, plus the refundable Senior Citizen Tax Credit (line 18)
    and Homestead Excess Property Tax Credit (line 19). The engine computes line 8 only; actual line 10 liability
    may be lower.'
  - No county or municipal income tax is collected through Form IT-140 — the return computes only the West Virginia
    state personal income tax.

# Phase J JS2 (2026-09-28): the state law-change sweep. Each entry below was adjudicated from this year's own
# booklet section named in law_changes_checked, every quoted run re-found in the fetched document; an
# empty list means the section was read and carries no law change for this year.
effective_law_changes:
- description: >-
    RATE CUT for 2025 — every rate falls about 6%, to 2.22% / 2.96% / 3.33% / 4.44% / 4.82% (2023-2024: 2.36% / 3.15%
    / 3.54% / 4.72% / 5.12%), under W. Va. Code §11-21-4i (2024 Second Special Session SB 2033), which supersedes
    the Tax Commissioner's August 2024 trigger notice under §11-21-4h. The shipped brackets carry the 2025 schedule.
  status: final_form_published
  affects:
  - tax (brackets — all five rates)
  - IT-140 line 8 (Rate Schedule I / II)
  modeled: true
  citation:
    source: >-
      2025 West Virginia Personal Income Tax Forms and Instructions (IT-140), Rate Schedule I: 'Less than $10,000'
      — '2.22% of the taxable income' (Rate Schedule II the same at half the bounds).
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
- description: >-
    SOCIAL SECURITY PHASE-OUT, SECOND STEP — for 2025, a filer above the income limits (federal AGI over $100,000
    joint, $50,000 otherwise) may subtract 65% of the social security benefits included in federal AGI (35% in 2024);
    below the limits benefits stay fully exempt. A Schedule M decreasing modification.
