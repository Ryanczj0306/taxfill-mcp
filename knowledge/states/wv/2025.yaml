# Provenance: see git history (git show 7a90a06:knowledge/states/wv/2025.yaml); sources: the `sources` table
jurisdiction: states/wv
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'WV''s resident return (Form IT-140) starts from federal adjusted gross income (line 1). The 2025
  instructions state plainly (p.24): "The starting point for the West Virginia income tax return is your federal
  adjusted gross income."
  Federally treaty-exempt income is already excluded from FAGI and flows through. WV''s Schedule M "Modifications
  Increasing Federal Adjusted Gross Income" (lines 51-58) lists ONLY: interest/dividends on federal obligations
  exempt from federal but not state tax; interest/dividends on non-WV state/local bonds; interest on money borrowed
  to buy WV-exempt bonds; 402(e) lump-sum distributions; "Other income deducted from federal adjusted gross income but subject to state tax"
  (example given is IRC Section 199 income); and savings-plan/ABLE/Jumpstart withdrawals. There is NO add-back for
  tax-treaty income, foreign/nonresident-alien treaty income, or income excluded under a US tax treaty. Therefore
  treaty-exempt income is NOT re-taxed by WV -> conforms = true.'
citation:
  source: 'WV Tax Division - 2025 personal income tax Forms & Instructions (IT-140 booklet): starting point = FAGI
    (p.24), Schedule M increasing modifications lines 51-58 (no treaty add-back),
    Who Must File & Residency Status (p.17), due date April 15, 2026 (cover, p.24), mailing addresses (Form
    IT-140 p.2), Special Nonresident / 183-day PA-VA rule (Schedule A Part II instructions, p.32)'
  url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
forms:
  resident: Form IT-140 (West Virginia Personal Income Tax Return) - check "Resident" status
  part_year_or_nonresident: 'Form IT-140 with its single "NONRESIDENT/PART YEAR RESIDENT" box checked (one box for both
    roles), completed together with Schedule A (Form IT-140), "Nonresidents/Part-Year Residents Schedule of Income":
    nonresidents and part-year residents first complete Form IT-140 lines 1 through 7, then Schedule A, whose Part I
    tax goes on Form IT-140 line 8. A full-year resident of Kentucky, Maryland, Ohio, Pennsylvania or Virginia whose
    only West Virginia income was wages and salaries instead checks the separate "NONRESIDENT SPECIAL" box and completes
    Schedule A Part II. (Nonresident partners, S corporation shareholders and estate or trust beneficiaries may elect
    to be included on the pass-through entity''s IT-140NRC composite return instead.)'
  # Role citations (Phase K JK28, 2026-10-16), which state_scope adds to a part-year or nonresident filer's citations
  # (the JK27 mechanism; see the VA pack): the top-level `citation` is the IT-140 booklet's resident pages, so this
  # entry named Schedule A without citing it. West Virginia has no separate nonresident return — both roles file Form
  # IT-140 with Schedule A — so each role cites the booklet's 'Who Must File' and nonresident/part-year text for it and
  # Schedule A. The URLs are the "IT-140 Personal Income Tax Forms and Instructions" and "Schedule A" links on the Tax
  # Division's Individuals page (tax.wv.gov/Individuals); the Schedule A link's spelling (Schedule-A) serves the same
  # bytes as the schedule-A spelling cited elsewhere in this pack. Each PDF was downloaded twice on 2026-10-16 with
  # identical sha256 (booklet 6383bf9748fde18c..., Schedule A d091c45f0ba020f1...). CORRECTED the same day from that
  # booklet: this entry said to check "Filing as Nonresident" or "Filing as Part-Year Resident", but the 2025 Form
  # IT-140 has one "NONRESIDENT/PART YEAR RESIDENT" box ('Enter a check mark in this box if you are filing as a
  # nonresident or part-year resident', p. 24) beside a separate "NONRESIDENT SPECIAL" box (p. 17 'Special
  # Nonresidents'); the return's page 1 prints exactly those boxes ("AMENDED RETURN", "NONRESIDENT SPECIAL",
  # "NONRESIDENT/PART YEAR RESIDENT", "FORM WV-8379 FILED AS AN INJURED SPOUSE"). The old wording survives in one place:
  # Schedule A's Part II note (its second page, printed 8, in the booklet and in the separate PDF) still says 'You must
  # check the box Filing as Nonresident or Filing as a Part-Year Resident' — a stale instruction, since the 2025 return
  # has no such pair of boxes.
