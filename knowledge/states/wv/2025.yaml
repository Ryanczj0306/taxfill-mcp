    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
- description: >-
    SOCIAL SECURITY PHASE-OUT, SECOND STEP — for 2025, a filer above the income limits (federal AGI over $100,000
    joint, $50,000 otherwise) may subtract 65% of the social security benefits included in federal AGI (35% in 2024);
    below the limits benefits stay fully exempt. A Schedule M decreasing modification.
  status: final_form_published
  affects:
  - Schedule M decreasing modifications (IT-140 line 3)
  - calc.state_tax taxable_base (caller-supplied — must already net the modification)
  modeled: false
  lookup_path: >-
    2025 IT-140 booklet, Important Information for 2025, and the Schedule M social security benefits line.
  citation:
    source: >-
      2025 West Virginia Personal Income Tax Forms and Instructions (IT-140), Important Information for 2025: 'For
      taxable year 2025, when the federal adjusted gross income of a married couple filing jointly exceeds $100,000
      or $50,000 in the case of a single, head of household, widow(er), or married individual filing a separate return,
      65% of social benefits received and included in the federal adjusted gross income shall be allowed as a decreasing
      modification.'
    url: https://tax.wv.gov/Documents/PIT/2025/it140.PersonalIncomeTaxFormsAndInstructions.2025.pdf
