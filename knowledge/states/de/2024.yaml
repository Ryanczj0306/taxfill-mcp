# DE state knowledge — tax year 2024. Fetched + cited from the DE DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form PIT-RES
# instructions (PIT-RES_TY24_2024-01_Instructions.pdf), then independently re-derived
# from a second official document (the printed 2024 Form PIT-RES itself Rev. 20240821,
# the 2024 State Income Tax Table & Schedule TY24_taxtable.pdf, or 30 Del. C.
# sec. 1102(a)(14) at delcode.delaware.gov) — resolutions recorded inline.
# HEADLINE FOR 2024: NO tax change — statutory brackets (zero floor to $2,000, then
# 2.2%/3.9%/4.8%/5.2%/5.55% to $60,000 and 6.6% above), the $3,250/$6,500 standard
# deduction, and the $110 personal credits are all unchanged; the tax-table top rule
# re-prints '$2,943.50 plus 6.60% (.066) for the portion over $60,000.' The FORM was
# RENUMBERED for 2024: taxable income moved from Line 22 to LINE 23 and the tax
# liability from Line 23 to LINE 24 (deduction election Line 20, additional standard
# deduction Line 21, total deductions Line 22; personal credits now Lines 27a/27b).
jurisdiction: states/de
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Delaware''s resident return (PIT-RES) starts at Section A, Line 1 = "FEDERAL AGI AMOUNT FROM FEDERAL
  FORM 1040." Section A - Additions contains ONLY Line 2 (INTEREST ON STATE & LOCAL OBLIGATIONS OTHER THAN DELAWARE)
  and Line 3 (FIDUCIARY ADJUSTMENT, OIL DEPLETION). There is no add-back of federally treaty-exempt income anywhere
  in the additions schedule. Because income excluded by treaty is already excluded from federal AGI and Delaware
  has no treaty add-back, that income flows through untaxed -> conforms. (Source: 2024 Form PIT-RES, Section A,
  and 2024 PIT-RES instructions.) Note: the resident form''s Line 14 "Foreign Taxes Paid" is an itemized-deduction
  adjustment for those who took the federal Foreign Tax Credit, NOT a treaty-exempt-income add-back.'
citation:
  source: 'DE Division of Revenue - 2024 Individual Income Tax Return RESIDENT (Form PIT-RES) Instructions: Who
    Must File thresholds (unchanged: under-60 $9,400 single / $15,450 joint), Who is a Resident (domicile any part
    of year, or abode + more than 183 days), When to File (due 4/30/2025; PIT-EXT extension to 10/15/2025), Section
    A Additions (federal AGI start; Lines 2-3 only), Line 24 tax table/schedule mandate, mailing addresses (P.O.
    Box 508 / 8710 / 8711), check payee ''DE Division of Revenue'', portal tax.delaware.gov'
  url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf
starts_from: federal AGI (Federal Form 1040), entered on 2024 PIT-RES Section A, Line 1
residency:
  summary: 'A resident is an individual who EITHER (a) is domiciled in Delaware for any part of the taxable year,
    OR (b) maintains a place of abode in Delaware and spends more than 183 days of the taxable year in Delaware
    (statutory resident). Domicile is the place an individual intends as a permanent home — the place to which he
    intends to return whenever absent; an individual can have only one domicile, and once established it continues
    until the individual moves to a new location with a bona fide intention of making it the permanent home. Full-time
    students with a legal residence in another state remain legal residents of that state unless they exhibit intentions
    to make Delaware their permanent residence. A part-year resident is one who changes legal residence during the
    year; part-year residents may elect to file either as a full-year resident (PIT-RES) or as a non-resident (PIT-NON),
    whichever is more advantageous (the Volunteer Firefighter, Child Care, and Earned Income Tax Credits cannot
    be taken on PIT-NON). A non-resident is someone who is neither domiciled nor a statutory resident but has gross
    income from Delaware sources; non-residents must file if they had any gross income from Delaware sources during
    the year. Military compensation follows the servicemember''s legal residence, and a non-military spouse''s income
    is taxed by the state of the spouse''s legal residence (Form W-4DE for withholding exemption).'
forms:
  resident: Form PIT-RES (Delaware Individual Income Tax Return - Resident; formerly Form 200-01)
  part_year_or_nonresident: Form PIT-NON (Delaware Individual Income Tax Return - Non-Resident; formerly Form 200-02).
    Part-year residents may file either PIT-RES (electing full-year resident treatment) or PIT-NON (electing non-resident
    treatment), whichever is more advantageous.
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Earned Income Tax Credit (Delaware EITC)
  type: refundable
  eligibility: 'Resident individuals who claimed (and qualified for) the federal Earned Income Credit. The taxpayer
    ELECTS one of two options: a REFUNDABLE credit equal to 4.5% of the federal EITC, OR a NONREFUNDABLE credit
    equal to 20% of the federal EITC. Computed on DE Schedule II (Form PIT-RSS); check the Refundable box on Line
    34 if the refundable amount is entered on PIT-RSS Line 16, or Non-Refundable if from PIT-RSS Line 17. Do NOT
    complete PIT-RSS Schedule II if you did not take the Earned Income Credit on your federal return. For spouses
    filing separate/combined-separate Delaware returns from a joint federal return, the credit may only be applied
    against the tax of the spouse with the HIGHER Line 23 taxable income.'
  amount: 'Refundable: 4.5% of federal earned income credit (federal EITC x 0.045). Nonrefundable alternative: 20%
    of federal earned income credit (federal EITC x 0.20).'
  income_limit_2024: No separate Delaware income limit; eligibility and amount are tied to the federal EITC (which
    has its own income limits based on filing status and number of qualifying children).
  claimed_on: Form PIT-RES, Line 34 (Refundable/Non-Refundable box checked); computed on DE Schedule II of Form
    PIT-RSS
  citation:
    source: Delaware Division of Revenue, 2024 Form PIT-RES Instructions, Line 34 Earned Income Tax Credit ('a refundable
      credit of 4.5% of the federal earned income credit or a nonrefundable credit of 20%') and DE Schedule II (PIT-RSS)
    url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf
- name: Child Care Credit (Child and Dependent Care Credit)
  type: nonrefundable
  eligibility: Resident individuals who claimed the federal child and dependent care credit. Must attach a copy
    of federal Form 2441. For spouses who file a joint federal return but separate/combined-separate Delaware returns,
    the credit may only be applied against the tax of the spouse with the LOWER Line 23 taxable income. This is
    the child/dependent CARE credit — the federal Child Tax Credit is not an allowable credit on the Delaware return.
  amount: 50% of the federal child and dependent care credit (Line 31 Worksheet — 'Enter the total amount from Line
    11 of federal Form 2441 ... and multiply by 50% (.50)'). Do not enter an amount in excess of $3,000.
  income_limit_2024: No stated Delaware income limit; amount derives from the federal Form 2441 credit.
  claimed_on: Form PIT-RES, Line 31 (Line 31 Worksheet - Child Care Credit)
  citation:
    source: Delaware Division of Revenue, 2024 Form PIT-RES Instructions, Line 31 Child Care Credit and Line 31
      Worksheet (50% of federal Form 2441 Line 11; max $3,000)
    url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf
- name: Personal Credits (exemption credit)
  type: nonrefundable
  eligibility: Resident individuals are allowed a credit for each personal exemption. If you were not required to
    file a federal return, enter $110 for each spouse reporting income plus $110 for each person who could have
    been listed as a dependent. NOT available if you are claimed as a dependent on another person's return. The
    number of personal credits is verified against the federal return with the IRS.
  amount: $110 per personal exemption (number of exemptions x $110; e.g., MFJ with no dependents = $220).
  income_limit_2024: No income limit.
  claimed_on: Form PIT-RES, Line 27a
  citation:
    source: Delaware Division of Revenue, 2024 Form PIT-RES Instructions, Line 27a Personal Credits; 2024 Form PIT-RES
      Line 27a ('Enter number of exemptions ___ x $110')
    url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf
- name: Additional Personal Credit (age 60 or over)
  type: nonrefundable
  eligibility: Resident taxpayer and/or spouse who were 60 years of age or over on December 31, 2024. Check the
    appropriate box(es) for self/spouse on Line 27b. This is Delaware's main senior-relief credit on the income-tax
    return (separate senior relief is also provided via the pension exclusion and the Line 11 persons-60-or-over
    exclusion, which are income exclusions rather than credits).
  amount: $110 per qualifying person age 60+ (number of boxes checked x $110).
  income_limit_2024: No income limit.
  claimed_on: Form PIT-RES, Line 27b
  citation:
    source: Delaware Division of Revenue, 2024 Form PIT-RES Instructions, Line 27b Additional Personal Credits and
      the Persons 60 or Over Checklist ('You are entitled to an additional personal credit of $110')
    url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf
- name: Credit for Income Taxes Paid to Another State
  type: nonrefundable
  eligibility: Delaware residents (or those electing to be taxed as residents) who paid income tax to another state
    on income earned in that state that is also included in Delaware taxable income. Must attach a signed copy of
    the other state's return. Does not include city wage taxes or county taxes paid directly to the county; the
    District of Columbia counts as a 'State' for this credit. Use Form PIT-RSS Schedule I if claiming credit for
    more than one state (list states highest-to-lowest credit).
  amount: 'Formula (Line 28 Worksheet): the credit is the SMALLEST of (a) the Delaware tax liability, (b) the tax
    due and paid to the other state after all credits, or (c) Delaware tax (Line 24) multiplied by the ratio of
    other-state AGI to Delaware AGI (Line 12). No fixed dollar amount.'
  income_limit_2024: No income limit.
  claimed_on: Form PIT-RES, Line 28 (Line 28 Worksheet; DE Schedule I / Form PIT-RSS if multiple states)
  citation:
    source: Delaware Division of Revenue, 2024 Form PIT-RES Instructions, Line 28 Other State Tax Credit and Line
      28 Worksheet
    url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf
- name: Volunteer Firefighter Credit
  type: nonrefundable
  eligibility: Delaware residents who are active volunteer firefighters on call to fight fires on a regular basis,
    members of a fire company auxiliary, or active members of an organized rescue squad in a Delaware volunteer
    company. Active status is verified annually with the volunteer fire companies; the Fire Company number must
    be entered on Line 29 (Spouse Column A and/or Self Column B). Only one $1,000 credit may be claimed per spouse.
  amount: $1,000 per qualifying volunteer (max one $1,000 per spouse; Filing Status 2 enters in Column B only).
  income_limit_2024: No income limit.
  claimed_on: Form PIT-RES, Line 29
  citation:
    source: Delaware Division of Revenue, 2024 Form PIT-RES Instructions, Line 29 Volunteer Firefighter Credit
    url: https://revenuefiles.delaware.gov/2024/PIT_2024_Forms/PIT_Instructions/PIT-RES_TY24_2024-01_Instructions.pdf
filing_requirement:
  note: 'Full-year residents must file a 2024 return if their individual Delaware adjusted gross income exceeds
    the age/status threshold (unchanged from 2023): Under 60 - $9,400 (Filing Statuses 1, 4, & 5 single/separate)
    or $15,450 (Status 2 married filing joint); 60-64 - $12,200 / $17,950; 65+ or blind - $14,700 / $20,450; 65+
    AND blind - $17,200 / $22,950; claimed as a dependent on another''s return - $5,250 (or $7,750 / $10,250 for
    65+ and/or blind). The dollar amount is the INDIVIDUAL''s AGI, not a combined total. Part-year residents must
    file if they had income from any source while a DE resident, or DE-source income while a non-resident. Non-residents
    must file if they had any gross income from Delaware sources during 2024. (Source: 2024 PIT-RES instructions,
    ''Who Must File a Return,'' p.2.)'
