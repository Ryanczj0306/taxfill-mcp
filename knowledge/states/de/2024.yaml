  base: federal_agi
  tax_line: '2024 Form PIT-RES Line 24: ''TAX LIABILITY FROM TAX RATE TABLE/SCHEDULE (See instructions)''. Line 23:
    ''TAXABLE INCOME - Subtract Line 22 from Line 12, and compute tax on this amount''. Instructions, Line 24: ''If
    Line 23 is less than $60,000, use the tax table to compute your tax liability. If line 23 is $60,000 or greater,
    use the tax schedule at the end of the tax table to compute your tax liability. Enter your tax liability on Line
    24.'' NOTE — 2024 renumbering: these were Lines 22/23 on the 2023 form.'
