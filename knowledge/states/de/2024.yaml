  notes:
  - '2024 UNCHANGED TAX / RENUMBERED FORM: the brackets, the $3,250/$6,500 standard deduction, the $2,500 additional
    standard deduction, and the $110 personal credits are all unchanged from 2023, but the 2024 PIT-RES renumbered
    the lines — the deduction election is Line 20 (was 19a), additional standard deduction Line 21 (was 20), total
    deductions Line 22 (was 21), TAXABLE INCOME Line 23 (was 22), TAX LIABILITY Line 24 (was 23), and the personal
    credits moved to Lines 27a/27b (were 26a/26b). Use the 2024 line numbers when reading amounts off the form.'
  - 'Base guidance: Supply 2024 Form PIT-RES Line 12, DELAWARE ADJUSTED GROSS INCOME = Line 1 federal AGI (from federal
    Form 1040) + Section A additions (Line 2 interest on non-Delaware state/local obligations; Line 3 fiduciary adjustment
    / oil depletion) - Section B subtractions (Line 5 U.S.-obligation interest; Line 6 pension/retirement exclusions;
    Line 7 Delaware state tax refund, fiduciary adjustment, work opportunity credit, Delaware NOL carryforward; Line
    8a taxable Social Security / Railroad Retirement benefits, higher-education exclusion, certain lump-sum distributions;
    Line 8b 529/ABLE contribution deduction) - Line 11 exclusion for certain persons 60 and over or disabled. If the
    filer has no Delaware additions or subtractions, Line 12 equals federal AGI. The op then subtracts the shipped
    per-status standard deduction to reproduce Line 23 taxable income (Line 23 = Line 12 - Line 22 total deductions).'
  - 'NO income-based exemptions are shipped (exemptions = {}): Delaware''s per-person allowances are TAX CREDITS,
    not subtractions from income. 2024 Form PIT-RES Line 27a Personal Credits = $110 x the number of exemptions (''Enter
    number of exemptions ___ x $110''; e.g., MFJ with no dependents = $220), and Line 27b Additional Personal Credits
    = $110 per taxpayer/spouse age 60 or over on December 31, 2024 — both are subtracted from the Line 26 tax, not
    from income. They are NOT applied by calc.state_tax; claim them on the form. exemptions_count and dependents_count
    must therefore be 0 for this pack. A filer claimed as a dependent on another person''s return gets $0 personal
    credit.'
  - 'SINGLE rate schedule for ALL filing statuses: 30 Del. C. sec. 1102(a)(14) publishes one rate table with no filing-status
    variation, and the 2024 State Income Tax Table has no filing-status columns; the schedule is duplicated per status
    here. Only the standard deduction differs by status ($6,500 Filing Status 2 vs $3,250 Statuses 1, 3, 4, 5).'
  - 'TAX TABLE MANDATE below $60,000 — bracket math may differ by a few dollars within table bands; the filed form
    must use the table: ''If Line 23 is less than $60,000, use the tax table to compute your tax liability'' (Line
    24 instructions). The 2024 table uses $50-wide bands; sampled band values reproduce midpoint bracket math exactly
    (taxable $26,550-$26,600: table $1,088 vs midpoint math $1,088.41 -> $1,088; $10,100-$10,150: $267; $2,200-$2,250:
    $5). At $60,000 or over the printed schedule ($2,943.50 + 6.60% of the portion over $60,000) IS exact marginal
    math.'
  - 'Printed-constant check (re-derived for 2024): the schedule''s $2,943.50 at $60,000 exactly equals the cumulative
    sum of the prior brackets (0.022 x 3,000 = 66.00; + 0.039 x 5,000 = 195.00; + 0.048 x 10,000 = 480.00; + 0.052
    x 5,000 = 260.00; + 0.0555 x 35,000 = 1,942.50; total 2,943.50) — no divergence.'
  - 'Provenance of the sub-$60,000 rates: the 2024 DOR booklet and tax-table PDF print a rate schedule ONLY for taxable
    income of $60,000 or over (below that they mandate the table). The 2.2%/3.9%/4.8%/5.2%/5.55% marginal rates and
    their $2,000/$5,000/$10,000/$20,000/$25,000/$60,000 breakpoints are copied from 30 Del. C. sec. 1102(a)(14) (official
    Delaware Code site, taxable years beginning after December 31, 2013 — re-fetched live and unchanged for 2024)
    and cross-check exactly against the DOR table''s band values and the printed $2,943.50 constant.'
  - 'The first bracket is a zero-rate floor: sec. 1102(a)(14) imposes no tax on the first $2,000 of taxable income
    (the rate schedule starts at ''2.2% of taxable income in excess of $2,000''), and the 2024 tax table shows $0
    tax for taxable income under $2,000.'
  - 'Additional standard deduction NOT applied by the engine: Line 21 allows $2,500 per box checked for taxpayer/spouse
    age 65 or over and/or blind (maximum $5,000 per individual), ONLY for filers electing the Delaware standard deduction
    (''If you elect to itemize your deductions, you do not qualify for the additional standard deduction''). Enter
    it on the form; the shipped standard_deduction covers Line 20a only.'
  - 'Itemizers: the standard deduction is in lieu of itemizing. Filers may itemize on the Delaware return (Section
    C Lines 13-19 + Form PIT-RSA, checked on Line 20b) even if they took the federal standard deduction; the shipped
    standard_deduction applies only to standard-deduction electors. For Filing Status 3 or 4, if one spouse itemizes
    the other must itemize; if one takes the standard deduction the other must too.'
  - Delaware filing statuses are 1 Single/Divorced/Widow(er); 2 Married Filing Joint; 3 Married Filing Separate Forms;
    4 Married Filing Combined Separate (two separate computations in Columns A and B of one form, $3,250 standard
    deduction per column); 5 Head of Household. The engine's married_filing_separately corresponds to Status 3 or
    per-column Status 4 (both $3,250).
  - 'QUALIFYING SURVIVING SPOUSE caution: the engine maps QSS to married_filing_jointly ($6,500 standard deduction),
    but the PIT-RES Filing Status 1 covers ''Single, Divorced, Widow(er)'' and the 2024 booklet never mentions the
    federal QSS status. A widow(er) not remarried at year-end appears to file Delaware Status 1 ($3,250 standard deduction)
    — the brackets are identical either way, but the deduction differs by $3,250. Confirm the correct Delaware status
    at revenue.delaware.gov before relying on the QSS->MFJ mapping.'
  - 'Tax on lump-sum distributions is NOT modeled: 2024 Form PIT-RES Line 25 adds a separate tax on qualified lump-sum
    distributions computed on Form PIT-STC (30 Del. C. sec. 1102(b) separate tax); the engine computes Line 24 only
    (Line 26 TOTAL TAX = Line 24 + Line 25).'
  - 'Base subtractions taken BEFORE Line 12 are the caller''s responsibility: the pension/retirement exclusion (Line
    6), the exclusion for certain persons 60 and over or disabled (Line 11), the DE 529/ABLE contribution deduction
    (Line 8b — 529 max $1,000 single-type filers under $100,000 federal AGI / $2,000 joint under $200,000; ABLE max
    $5,000/$10,000), U.S.-obligation interest (Line 5), and taxable Social Security / Railroad Retirement benefits
    (Line 8a) — supply Line 12 Delaware AGI already reflecting them.'
  - Delaware EITC (elect refundable 4.5% or nonrefundable 20% of federal EITC, Line 34), child care credit (50% of
    federal Form 2441 Line 11, max $3,000, Line 31), other-state credit (Line 28), volunteer firefighter credit ($1,000,
    Line 29), and the $110 personal credits (Lines 27a/27b) are all CREDITS against tax — none of them are exemptions
    and none are modeled by this op.
  - 'Rounding: ''Dollar amounts on your return must be rounded off to the nearest whole dollar. This means that amounts
    from 50 to 99 cents are increased to the next dollar'' — matches the engine''s half-up rounding. The 2024 tax-schedule
    example rounds $3,455.06 to $3,455.'
  - No local income tax is collected on Form PIT-RES (the return has no local/county tax line). Part-year residents
    may elect to file either PIT-RES (full-year resident treatment) or PIT-NON, whichever is more advantageous; this
    pack models the resident form PIT-RES.
