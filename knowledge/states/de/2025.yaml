- source: '30 Del. C. sec. 1102(a)(14) (official Delaware Code) — "For taxable years beginning after December 31, 2013,
    the amount of tax shall be determined as follows: 2.2% of taxable income in excess of $2,000 but not in excess
    of $5,000; 3.9% ... $5,000-$10,000; 4.8% ... $10,000-$20,000; 5.2% ... $20,000-$25,000; 5.55% ... $25,000-$60,000;
    and 6.6% of taxable income in excess of $60,000" — statutory second pass on the sub-$60,000 rates, re-fetched live
    this session and still the operative paragraph for 2025 (paragraph (13), which ended at 6.75%, remains the superseded
    prior-year rule)'
  url: 'https://delcode.delaware.gov/title30/c011/sc01/index.html'
