- 'Canonical online payment portal URL: the 2025 instructions cite "tax.delaware.gov" as the portal for on-line PIT-EXT
  filing, estimated payments and refund status; structured here as https://tax.delaware.gov. The exact landing URL
  for a balance-due payment was not independently re-confirmed on a live page beyond the instruction-booklet references
  — confirm at the DOR.'
- 'The 2025 PIT-NON instructions were not fetched this session; the PIT-NON side of the part-year election and its
  Line 42 taxable-income line are taken from the 2025 tax-table/schedule header ("Line 23 of DE PIT-RES or Line 42
  of DE PIT-NON") and the PIT-RES instructions'' cross-references.'
- 'Whether the federal-AGI start on the 2025 form ("FEDERAL AGI AMOUNT FROM FEDERAL FORM 1040", no federal line number
  printed) corresponds to federal Form 1040 Line 11 was not restated on the 2025 form itself; the 2025 federal 1040
  keeps AGI on Line 11, so the mapping is unambiguous in practice.'
- 'The new 2025 Form PIT-RES Line 39 "CAPITAL GAINS TAX PAYMENTS (Attach Form REW-EST)" and DE Schedule IV were not
  researched beyond their appearance on the form and in the Line 39 instruction; Form REW-EST itself was not fetched.
  This is the line that shifted the 2025 settle-up numbering.'
- 'The 2025 tax table (TY25_taxtable.pdf) was spot-checked, not transcribed: the $2,750-$2,800 band prints $17, $16,750-$16,800
  prints $586, $43,500-$43,550 prints $2,029, $45,400-$45,450 prints $2,135, $49,500-$49,550 prints $2,362 and $50,000-$50,050
  prints $2,390 — every sampled band equals band-midpoint bracket math under 30 Del. C. sec. 1102(a)(14), rounded
  half-up.'
