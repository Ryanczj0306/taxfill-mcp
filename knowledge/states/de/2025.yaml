# DE state knowledge — tax year 2025. Fetched + cited from the DE DOR (.gov),
# authored per the shipped 2024 template (state-year knowledge program). Loaded as
# a StateKnowledge. conforms_to_federal_treaties: whether federally treaty-exempt
# income flows through (most states start from federal AGI) or is added back
# (CA/CT/MD/MS-style). Figures the fetch could not independently confirm are in
# `unverified` — confirm at the cited source.
#
# Two-pass verification: every key figure below was drafted from the 2025 Form
# PIT-RES instructions (PIT-RES_Instructions_2025-01.pdf), then independently
# re-derived from a second official document — the printed 2025 Form PIT-RES
# itself (PIT-RES_2025-01_PaperInteractiveIPM.pdf, Revision 20260407), the 2025
# State Income Tax Table & Schedule (TY25_taxtable.pdf), or 30 Del. C.
# sec. 1102(a)(14) fetched live from delcode.delaware.gov.
#
# HEADLINE FOR 2025: NO tax change. The statutory brackets are still the
# "taxable years beginning after December 31, 2013" schedule (zero-rate floor to
# $2,000, then 2.2% / 3.9% / 4.8% / 5.2% / 5.55% to $60,000 and 6.6% above), the
# standard deduction is still $3,250 / $6,500, the additional standard deduction
# is still $2,500 per box, the personal credits are still $110, and the 2025 tax
# schedule re-prints "$2,943.50 plus 6.60% (.066) ... for the portion over
# $60,000" with the same $67,751 -> $3,455.06 -> $3,455 worked example.
#
# THE 2025 LINE-NUMBER ANSWER (the 2024 pack recorded a renumbering, so 2025's
# numbering was re-checked line by line): Sections A-D are UNCHANGED from 2024 —
# deduction election Line 20, additional standard deduction Line 21, total
# deductions Line 22, TAXABLE INCOME Line 23, TAX LIABILITY Line 24, lump-sum tax
# Line 25, total tax Line 26, personal credits Lines 27a/27b, other-state credit
# Line 28, volunteer firefighter Line 29, child care Line 31, EITC Line 34,
# withholding Line 35, total refundable credits Line 40. The TAIL shifted by one:
# a new Line 39 "CAPITAL GAINS TAX PAYMENTS (Attach Form REW-EST)" pushed the
# settle-up lines down, so for 2025 balance due is Line 41, overpayment Line 42,
# contributions Line 43, applied-to-2026-estimated Line 44, penalties/interest
# Line 45, NET BALANCE DUE Line 46 (was 45) and NET REFUND Line 47 (was 46). The
# mailing table in the 2025 instructions cites the new numbers ("If Enclosing
# Payment w/ Balance Due (from Line 46)"; "If Refund Due (from Line 47)").
jurisdiction: states/de
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Delaware''s resident return (PIT-RES) starts at Section A, Line 1 = "FEDERAL AGI AMOUNT FROM FEDERAL
  FORM 1040." Section A - Additions contains ONLY Line 2 (INTEREST ON STATE & LOCAL OBLIGATIONS OTHER THAN DELAWARE)
  and Line 3 (FIDUCIARY ADJUSTMENT, OIL DEPLETION) — verified verbatim on the 2025 form. There is no add-back of federally
  treaty-exempt income anywhere in the additions schedule, and the word "treaty" appears ZERO times in either the 2025
  PIT-RES instructions or the 2025 PIT-RES form (re-counted this session). Because income excluded by treaty is already
  excluded from federal AGI and Delaware has no treaty add-back, that income flows through untaxed -> conforms. Note:
  the resident form''s Section C "Foreign Taxes Paid" line is an itemized-deduction adjustment for those who took the
  federal Foreign Tax Credit, NOT a treaty-exempt-income add-back.'
citation:
  source: 'DE Division of Revenue - 2025 Individual Income Tax Return RESIDENT (Form PIT-RES) Instructions: Who Must
    File thresholds (unchanged: under-60 $9,400 single / $15,450 joint), Who is a Resident (domicile any part of year,
    or abode + more than 183 days), When to File (due 4/30/2026; PIT-EXT extension to 10/15/2026), Section A Additions
    (federal AGI start; Lines 2-3 only), Line 24 tax table/schedule mandate, mailing addresses (P.O. Box 508 / 8710
    / 8711), check payee ''DE Division of Revenue'', portal tax.delaware.gov'
  url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
starts_from: 'federal AGI (Federal Form 1040), entered on 2025 PIT-RES Section A, Line 1 ("FEDERAL AGI AMOUNT FROM
  FEDERAL FORM 1040")'
residency:
  summary: 'Verbatim from the 2025 PIT-RES instructions, "Who is a Resident?": a resident is an individual who either
    "Is domiciled in this State for any part of the taxable year; or Maintains a place of abode in this State and spends
    more than 183 days of the taxable year in this State." "A domicile is the place an individual intends to be his
    permanent home; a place to which he intends to return whenever he may be absent. An individual can have only one
    domicile. A domicile, once established, continues until the individual moves to a new location and exhibits a bona
    fide intention of making it his or her permanent home." Full-time students with a legal residence in another state
    remain legal residents of that state unless they exhibit intentions to make Delaware their permanent residence.
    A foreign-traveler exception applies to an individual out of the United States for at least 495 days in the last
    18 consecutive months who did not maintain a Delaware permanent place of abode occupied by the individual, spouse,
    children or parents. A part-year resident is one who changes legal residence during the year; part-year residents
    may elect to file either as a full-year resident (PIT-RES) or as a non-resident (PIT-NON), whichever is more advantageous
    (the Volunteer Firefighter, Child Care, and Earned Income Tax Credits cannot be taken on PIT-NON). A non-resident
    is someone who is neither domiciled nor a statutory resident but has gross income from Delaware sources; non-residents
    must file if they had any gross income from Delaware sources during the year. Military compensation follows the
    servicemember''s legal residence, and all income of a non-military spouse is taxed in the state of the spouse''s
    legal residence (Form W-4DE for withholding exemption).'
  citation:
    source: 'DE Division of Revenue - 2025 Form PIT-RES Instructions, "Who is a Resident?", "Members of Armed Forces",
      "Military Spouses" and the Foreign Travelers note'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
forms:
  resident: 'Form PIT-RES (Delaware Individual Resident Income Tax Return; formerly Form 200-01)'
  part_year_or_nonresident: 'Form PIT-NON (Delaware Individual Income Tax Return - Non-Resident; formerly Form 200-02).
    Part-year residents may file either PIT-RES (electing full-year resident treatment) or PIT-NON (electing non-resident
    treatment), whichever is more advantageous.'
credits_verification: 'State credits were researched from the cited DOR sources (the 2025 PIT-RES instructions, with
  every rate and dollar amount confirmed against the printed 2025 Form PIT-RES itself) and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.'
credits:
- name: 'Earned Income Tax Credit (Delaware EITC)'
  type: refundable
  eligibility: 'Resident individuals who claimed (and qualified for) the federal Earned Income Credit. The taxpayer
    ELECTS one of two options: a REFUNDABLE credit equal to 4.5% of the federal EITC, OR a NONREFUNDABLE credit equal
    to 20% of the federal EITC. Computed on DE Schedule II (Form PIT-RSS); check the Refundable or Non-Refundable box
    on Line 34. Do NOT complete PIT-RSS Schedule II if you did not take the Earned Income Credit on your federal return.
    For spouses filing separate/combined-separate Delaware returns from a joint federal return, the credit may only
    be applied against the tax of the spouse with the HIGHER Line 23 taxable income.'
  amount: 'Refundable: 4.5% of the federal earned income credit (federal EITC x 0.045). Nonrefundable alternative:
    20% of the federal earned income credit (federal EITC x 0.20). Unchanged from 2024.'
  income_limit_2025: 'No separate Delaware income limit; eligibility and amount are tied to the federal EITC (which
    has its own income limits based on filing status and number of qualifying children).'
  claimed_on: 'Form PIT-RES, Line 34 (Refundable / Non-Refundable box checked); computed on DE Schedule II of Form
    PIT-RSS'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 34 Earned Income Tax Credit ("A Resident
      individual is allowed a refundable credit of 4.5% of the federal earned income credit or a nonrefundable credit
      of 20% of the federal earned income credit") and DE Schedule II (PIT-RSS)'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Child Care Credit (Child and Dependent Care Credit)'
  type: nonrefundable
  eligibility: 'Resident individuals who claimed the federal child and dependent care credit. Must attach a copy of
    federal Form 2441. For spouses who file a joint federal return but separate/combined-separate Delaware returns,
    the credit may only be applied against the tax of the spouse with the LOWER Line 23 taxable income. This is the
    child/dependent CARE credit — the federal Child Tax Credit is not an allowable credit on the Delaware return.'
  amount: '50% of the federal child and dependent care credit (Line 31 Worksheet — the federal Form 2441 credit "must
    be attached" and is multiplied "by 50% (.50)"). Do not enter an amount in excess of $3,000. The 2025 Form PIT-RES
    Line 31 prints "CHILD CARE CREDIT. Must attach Form 2441. (Enter 50% of Federal credit)".'
  income_limit_2025: 'No stated Delaware income limit; amount derives from the federal Form 2441 credit.'
  claimed_on: 'Form PIT-RES, Line 31 (Line 31 Worksheet - Child Care Credit)'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 31 Child Care Credit and Line 31 Worksheet
      (50% of the federal Form 2441 credit; maximum $3,000); confirmed against the printed 2025 Form PIT-RES Line 31'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Personal Credits (exemption credit)'
  type: nonrefundable
  eligibility: 'Resident individuals are allowed a credit for each personal exemption. If you were not required to
    file a federal return, "enter $110 for each spouse reporting income plus $110 for each person who could have been
    listed as a dependent." NOT available if you are claimed as a dependent on another person''s return. The number
    of personal credits is verified against the federal return with the IRS.'
  amount: '$110 per personal exemption (number of exemptions x $110; e.g. married filing joint with no dependents =
    $220). Unchanged from 2024. The 2025 Form PIT-RES Line 27a prints "Enter number of exemptions ___ x $110".'
  income_limit_2025: 'No income limit.'
  claimed_on: 'Form PIT-RES, Line 27a'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 27a Personal Credits; printed 2025
      Form PIT-RES Line 27a ("Enter number of exemptions ___ x $110")'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Additional Personal Credit (age 60 or over)'
  type: nonrefundable
  eligibility: 'Resident taxpayer and/or spouse who were 60 years of age or over on December 31, 2025. Check the appropriate
    box(es) for Self (Column B) and/or Spouse (Column A) on Line 27b. This is Delaware''s main senior-relief credit
    on the income-tax return (separate senior relief is also provided via the pension exclusion and the Section B exclusion
    for certain persons 60 or over, which are income exclusions rather than credits).'
  amount: '$110 per qualifying person age 60 or over (number of boxes checked x $110). Unchanged from 2024.'
  income_limit_2025: 'No income limit.'
  claimed_on: 'Form PIT-RES, Line 27b'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 27b Additional Personal Credits and
      the Persons 60 or Over Checklist ("You are entitled to an additional personal credit of $110"); printed 2025
      Form PIT-RES Line 27b'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Credit for Income Taxes Paid to Another State'
  type: nonrefundable
  eligibility: 'Delaware residents (or those electing to be taxed as residents) who paid income tax to another state
    on income earned in that state that is also included in Delaware taxable income. Must attach a signed copy of the
    income tax return filed with the other state(s). Does not include city wage taxes or county taxes paid directly
    to the county; the District of Columbia counts as a "State" for this credit. Use Form PIT-RSS DE Schedule I if
    claiming credit for more than one state (list states highest-to-lowest credit).'
  amount: 'Formula (Line 28 Worksheet): the credit is the SMALLEST of (a) the Delaware tax liability, (b) the tax due
    and paid to the other state after all credits, or (c) Delaware tax (Line 24) multiplied by the ratio of other-state
    AGI to Delaware AGI (Line 12). No fixed dollar amount.'
  income_limit_2025: 'No income limit.'
  claimed_on: 'Form PIT-RES, Line 28 (Line 28 Worksheet; DE Schedule I / Form PIT-RSS if multiple states)'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 28 Tax Imposed by Other States and
      the Line 28 Worksheet; printed 2025 Form PIT-RES Line 28 ("TAX IMPOSED BY OTHER STATES (Must attach copy of
      PIT-RSS and other state return.)")'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Volunteer Firefighter Credit'
  type: nonrefundable
  eligibility: 'Delaware residents who are active volunteer firefighters, members of a fire company auxiliary, or active
    members of an organized rescue squad in a Delaware volunteer company. Active status is verified annually with the
    volunteer fire companies; the Fire Company number must be entered on Line 29 (Spouse Column A and/or Self Column
    B). Only one $1,000 credit may be claimed by each spouse.'
  amount: '$1,000 per qualifying volunteer (maximum one $1,000 per spouse). Unchanged from 2024.'
  income_limit_2025: 'No income limit.'
  claimed_on: 'Form PIT-RES, Line 29'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 29 Volunteer Firefighter Credit ("one
      $1,000 credit may be claimed by each spouse"); printed 2025 Form PIT-RES Line 29'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
filing_requirement:
  note: 'Full-year residents must file a 2025 return if their INDIVIDUAL Delaware adjusted gross income exceeds the
    age/status threshold — the 2025 chart is unchanged from 2024 and 2023: Under 60 — $9,400 (single filing status)
    / $15,450 (married filing joint) / $9,400 (married filing separate) / $5,250 (claimed as a dependent on another
    person''s return); 60 to 64 — $12,200 / $17,950 / $12,200 / $5,250; 65 and over OR blind — $14,700 / $20,450 /
    $14,700 / $7,750; 65 and over AND blind — $17,200 / $22,950 / $17,200 / $10,250. The booklet stresses: "This dollar
    amount represents your individual Adjusted Gross Income, NOT a total combined with anyone else" and the age/blindness
    rows assume only one spouse meets the criteria. Part-year residents must file if they had income from any source
    while a DE resident, or DE-source income while a non-resident. Non-residents must file if they had any gross income
    from Delaware sources during 2025.'
  citation:
    source: 'DE Division of Revenue - 2025 Form PIT-RES Instructions, "Who Must File" chart ("If you are a Full-Year
      Resident of the State, you must file a tax return for 2025 if, based on your Age/Status, your individual Delaware
      adjusted gross income (AGI) exceeds the amount shown below")'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
