  base: federal_agi
  tax_line: '2025 Form PIT-RES Line 24: ''TAX LIABILITY FROM TAX RATE TABLE/SCHEDULE (See instructions)''. Line 23:
    ''TAXABLE INCOME - Subtract Line 22 from Line 12, and compute tax on this amount''. Instructions, Line 24: ''If
    Line 23 is less than $60,000, use the tax table to compute your tax liability. If line 23 is $60,000 or greater,
    use the tax schedule at the end of the tax table to compute your tax liability.'' NOTE — these are the SAME line
    numbers as 2024: the 2025 form did NOT renumber Sections A-D (only the post-Line-38 settle-up lines shifted by
    one, because a new Line 39 ''CAPITAL GAINS TAX PAYMENTS (Attach Form REW-EST)'' was inserted).'
  exemptions: {}
  standard_deduction:
    single: 3250
    married_filing_jointly: 6500
    married_filing_separately: 3250
    head_of_household: 3250
  notes:
  - '2025 UNCHANGED TAX AND (for the tax lines) UNCHANGED FORM NUMBERING: the brackets, the $3,250/$6,500 standard
    deduction, the $2,500 additional standard deduction, and the $110 personal credits are all unchanged from 2024,
    and — unlike the 2023-to-2024 transition, which renumbered them — the 2025 PIT-RES keeps the deduction election
    on Line 20, additional standard deduction Line 21, total deductions Line 22, TAXABLE INCOME Line 23, TAX LIABILITY
    Line 24, lump-sum tax Line 25, total tax Line 26 and personal credits Lines 27a/27b. Only the settle-up tail shifted:
    a new Line 39 ''CAPITAL GAINS TAX PAYMENTS (Attach Form REW-EST)'' pushed balance due to Line 41, overpayment
    42, contributions 43, applied-to-2026-estimated 44, penalties/interest 45, NET BALANCE DUE 46 (was 45) and NET
    REFUND 47 (was 46) — and the 2025 mailing table cites the new numbers.'
  - 'Base guidance: Supply 2025 Form PIT-RES Line 12, DELAWARE ADJUSTED GROSS INCOME = Line 1 federal AGI (from federal
    Form 1040) + Section A additions (Line 2 interest on non-Delaware state/local obligations; Line 3 fiduciary adjustment
    / oil depletion) - Section B subtractions (U.S.-obligation interest; pension/retirement exclusions; Delaware state
    tax refund, fiduciary adjustment, work opportunity credit, Delaware NOL carryforward; taxable Social Security
    / Railroad Retirement benefits, higher-education exclusion, certain lump-sum distributions; 529/ABLE contribution
    deduction) - the exclusion for certain persons 60 and over or disabled. If the filer has no Delaware additions
    or subtractions, Line 12 equals federal AGI. The op then subtracts the shipped per-status standard deduction to
    reproduce Line 23 taxable income (Line 23 = Line 12 - Line 22 total deductions).'
  - 'NO income-based exemptions are shipped (exemptions = {}): Delaware''s per-person allowances are TAX CREDITS,
    not subtractions from income. 2025 Form PIT-RES Line 27a Personal Credits = $110 x the number of exemptions (''Enter
    number of exemptions ___ x $110''; e.g. MFJ with no dependents = $220), and Line 27b Additional Personal Credits
    = $110 per taxpayer/spouse age 60 or over on December 31, 2025 — both are subtracted from the Line 26 total tax,
    not from income. They are NOT applied by calc.state_tax; claim them on the form. exemptions_count and dependents_count
    must therefore be 0 for this pack. A filer claimed as a dependent on another person''s return gets $0 personal
    credit.'
  - 'SINGLE rate schedule for ALL filing statuses: 30 Del. C. sec. 1102(a)(14) publishes one rate table with no filing-status
    variation, and the 2025 State Income Tax Table has no filing-status columns; the schedule is duplicated per status
    here. Only the standard deduction differs by status ($6,500 Filing Status 2 vs $3,250 Statuses 1, 3, 4, 5).'
  - 'TAX TABLE MANDATE below $60,000 — bracket math may differ by a dollar or two within table bands; the filed form
    must use the table: ''If Line 23 is less than $60,000, use the tax table to compute your tax liability'' (Line
    24 instructions). The 2025 table uses $50-wide bands and every sampled band equals band-MIDPOINT bracket math
    rounded half-up: taxable $2,750-$2,800 prints $17 (midpoint $2,775 -> 2.2% x $775 = $17.05); $16,750-$16,800 prints
    $586 (midpoint -> $586.20); $43,500-$43,550 prints $2,029 (midpoint -> $2,029.14); $45,400-$45,450 prints $2,135;
    $49,500-$49,550 prints $2,362; $50,000-$50,050 prints $2,390. So at the BOTTOM of a band the op can read $1 lower
    than the table (e.g. exactly $43,500 computes $2,027.75 -> $2,028 vs the table''s $2,029). At $60,000 or over
    the printed schedule ($2,943.50 + 6.60% of the portion over $60,000) IS exact marginal math.'
  - 'Printed-constant check (re-derived for 2025): the schedule''s $2,943.50 at $60,000 exactly equals the cumulative
    sum of the prior brackets (0.022 x 3,000 = 66.00; + 0.039 x 5,000 = 195.00; + 0.048 x 10,000 = 480.00; + 0.052
    x 5,000 = 260.00; + 0.0555 x 35,000 = 1,942.50; total 2,943.50) — no divergence. The DOR''s own worked example
    then adds 6.6% x $7,751 = $511.56 for $3,455.06.'
  - 'Provenance of the sub-$60,000 rates: the 2025 DOR booklet and tax-table PDF print a rate schedule ONLY for taxable
    income of $60,000 or over (below that they mandate the table). The 2.2%/3.9%/4.8%/5.2%/5.55% marginal rates and
    their $2,000/$5,000/$10,000/$20,000/$25,000/$60,000 breakpoints are copied from 30 Del. C. sec. 1102(a)(14) (official
    Delaware Code site, ''For taxable years beginning after December 31, 2013'' — re-fetched live and still the operative
    paragraph for 2025; the superseded paragraph (13) ended at 6.75%) and cross-check exactly against the 2025 DOR
    table''s band values and the printed $2,943.50 constant.'
  - 'The first bracket is a zero-rate floor: sec. 1102(a)(14) imposes no tax on the first $2,000 of taxable income
    (the rate schedule starts at ''2.2% of taxable income in excess of $2,000''), and the 2025 tax table shows $0
    tax for taxable income under $2,000.'
  - 'Additional standard deduction NOT applied by the engine: Line 21 allows $2,500 per box checked for taxpayer/spouse
    age 65 or over and/or blind (maximum $5,000 per individual), ONLY for filers electing the Delaware standard deduction
    (''ADDITIONAL STANDARD DEDUCTIONS (Not Allowed with Itemized Deductions)'' on the 2025 form). Enter it on the
    form; the shipped standard_deduction covers Line 20a only.'
  - 'Itemizers: the standard deduction is in lieu of itemizing. Filers may itemize on the Delaware return (Section
    C + Form PIT-RSA, checked on Line 20b) even if they took the federal standard deduction; the shipped standard_deduction
    applies only to standard-deduction electors. For Filing Status 3 or 4, if one spouse itemizes the other must itemize;
    if one takes the standard deduction the other must too.'
  - Delaware filing statuses are 1 Single/Divorced/Widow(er); 2 Married Filing Joint; 3 Married Filing Separate Forms;
    4 Married Filing Combined Separate (two separate computations in Columns A and B of one form, $3,250 standard
    deduction per column); 5 Head of Household. The engine's married_filing_separately corresponds to Status 3 or
    per-column Status 4 (both $3,250).
  - 'QUALIFYING SURVIVING SPOUSE caution: the engine maps QSS to married_filing_jointly ($6,500 standard deduction),
    but PIT-RES Filing Status 1 covers ''Single, Divorced, Widow(er)'' and the 2025 booklet never mentions the federal
    QSS status. A widow(er) not remarried at year-end appears to file Delaware Status 1 ($3,250 standard deduction)
    — the brackets are identical either way, but the deduction differs by $3,250. Confirm the correct Delaware status
    at revenue.delaware.gov before relying on the QSS-to-MFJ mapping.'
  - 'Tax on lump-sum distributions is NOT modeled: 2025 Form PIT-RES Line 25 adds a separate tax on qualified lump-sum
    distributions computed on Form PIT-STC (30 Del. C. sec. 1102(b) separate tax, equal to the initial separate tax
    times the ordinary-income fraction); the engine computes Line 24 only (Line 26 TOTAL TAX = Line 24 + Line 25).'
  - 'Base subtractions taken BEFORE Line 12 are the caller''s responsibility: the pension/retirement exclusion, the
    exclusion for certain persons 60 and over or disabled, the DE 529/ABLE contribution deduction, U.S.-obligation
    interest, and taxable Social Security / Railroad Retirement benefits — supply Line 12 Delaware AGI already reflecting
    them.'
  - Delaware EITC (elect refundable 4.5% or nonrefundable 20% of the federal EITC, Line 34), child care credit (50%
    of the federal Form 2441 credit, maximum $3,000, Line 31), other-state credit (Line 28), volunteer firefighter
    credit ($1,000 per spouse, Line 29), and the $110 personal credits (Lines 27a/27b) are all CREDITS against tax
    — none of them are exemptions and none are modeled by this op. All are unchanged for 2025.
  - 'Rounding: ''Dollar amounts on your return must be rounded off to the nearest whole dollar. This means that amounts
    from 50 to 99 cents are increased to the next dollar'' — matches the engine''s half-up rounding, and the 2025
    tax-schedule example rounds $3,455.06 to $3,455.'
  - No local income tax is collected on Form PIT-RES (the return has no local/county tax line). Part-year residents
    may elect to file either PIT-RES (full-year resident treatment) or PIT-NON, whichever is more advantageous; this
    pack models the resident form PIT-RES. Delaware's filing deadline is April 30, 2026 — NOT the federal April 15.

# H3 remote-work trap: the convenience-of-the-employer rule as CITED data (verbatim-
# verified 2026-08-10 from the 2025 Form PIT-SCW itself, both pages read).
convenience_rule:
  summary: >-
    Delaware Schedule W (Form PIT-SCW): a nonresident whose Delaware-sourced employment includes
    income earned while working outside Delaware gets an allowance "equivalent to the ratio of
    days worked outside of the State versus the total number of Delaware sourced employment
    working days. Any allowance claimed must be based on necessity of work outside the State of
    Delaware in performance of duties for the employer, as opposed to solely for the convenience
    of the employee."
  trigger: >-
    A nonresident apportioning wages from Delaware-sourced employment on Schedule W; every
    out-of-state day must be itemized on page 2 with date, location and the purpose of the
    out-of-state business.
  exceptions: >-
    Verbatim from the form: "Working from an office out of your home does not satisfy the
    requirements of 'necessity' of duties for your employer and is considered for the
    convenience of the employee unless working from home is a requirement of employment with
    your employer."
  citation:
    source: 2025 Delaware Schedule W — Apportionment Worksheet (Form PIT-SCW, Revision 20250515), page 1 apportionment instructions + page 2 days-worked-outside-Delaware log.
    url: https://revenuefiles.delaware.gov/2025/PITForms_Instructions/PIT-SCW_2025-01_PaperInteractiveIPM.pdf
