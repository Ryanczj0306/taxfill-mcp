credits:
- name: 'Earned Income Tax Credit (Delaware EITC)'
  type: refundable
  eligibility: 'Resident individuals who claimed (and qualified for) the federal Earned Income Credit. The taxpayer
    ELECTS one of two options: a REFUNDABLE credit equal to 4.5% of the federal EITC, OR a NONREFUNDABLE credit equal
    to 20% of the federal EITC. Computed on DE Schedule II (Form PIT-RSS); check the Refundable or Non-Refundable box
    on Line 34. Do NOT complete PIT-RSS Schedule II if you did not take the Earned Income Credit on your federal return.
    For spouses filing separate/combined-separate Delaware returns from a joint federal return, the credit may only
    be applied against the tax of the spouse with the HIGHER Line 23 taxable income.'
  claimed_on: 'Form PIT-RES, Line 34 (Refundable / Non-Refundable box checked); computed on DE Schedule II of Form
    PIT-RSS'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 34 Earned Income Tax Credit ("A Resident
      individual is allowed a refundable credit of 4.5% of the federal earned income credit or a nonrefundable credit
      of 20% of the federal earned income credit") and DE Schedule II (PIT-RSS)'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Child Care Credit (Child and Dependent Care Credit)'
  type: nonrefundable
  eligibility: 'Resident individuals who claimed the federal child and dependent care credit. Must attach a copy of
    federal Form 2441. For spouses who file a joint federal return but separate/combined-separate Delaware returns,
    the credit may only be applied against the tax of the spouse with the LOWER Line 23 taxable income. This is the
    child/dependent CARE credit — the federal Child Tax Credit is not an allowable credit on the Delaware return.'
  claimed_on: 'Form PIT-RES, Line 31 (Line 31 Worksheet - Child Care Credit)'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 31 Child Care Credit and Line 31 Worksheet
      (50% of the federal Form 2441 credit; maximum $3,000); confirmed against the printed 2025 Form PIT-RES Line 31'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Personal Credits (exemption credit)'
  type: nonrefundable
  eligibility: 'Resident individuals are allowed a credit for each personal exemption. If you were not required to
    file a federal return, "enter $110 for each spouse reporting income plus $110 for each person who could have been
    listed as a dependent had you been required to file a federal return." NOT available if you are claimed as a
    dependent on another person''s return. The number
    of personal credits is verified against the federal return with the IRS.'
  claimed_on: 'Form PIT-RES, Line 27a'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 27a Personal Credits; printed 2025
      Form PIT-RES Line 27a ("Enter number of exemptions ___ x $110")'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Additional Personal Credit (age 60 or over)'
  type: nonrefundable
  eligibility: 'Resident taxpayer and/or spouse who were 60 years of age or over on December 31, 2025. Check the appropriate
    box(es) for Self (Column B) and/or Spouse (Column A) on Line 27b. This is Delaware''s main senior-relief credit
    on the income-tax return (separate senior relief is also provided via the pension exclusion and the Section B exclusion
    for certain persons 60 or over, which are income exclusions rather than credits).'
  claimed_on: 'Form PIT-RES, Line 27b'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 27b Additional Personal Credits and
      the Persons 60 or Over Checklist ("You are entitled to an additional personal credit of $110"); printed 2025
      Form PIT-RES Line 27b'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Credit for Income Taxes Paid to Another State'
  type: nonrefundable
  eligibility: 'Delaware residents (or those electing to be taxed as residents) who paid income tax to another state
    on income earned in that state that is also included in Delaware taxable income. Must attach a signed copy of the
    income tax return filed with the other state(s). Does not include city wage taxes or county taxes paid directly
    to the county; the District of Columbia counts as a "State" for this credit. Use Form PIT-RSS DE Schedule I if
    claiming credit for more than one state (list states highest-to-lowest credit).'
  claimed_on: 'Form PIT-RES, Line 28 (Line 28 Worksheet; DE Schedule I / Form PIT-RSS if multiple states)'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 28 Tax Imposed by Other States and
      the Line 28 Worksheet; printed 2025 Form PIT-RES Line 28 ("TAX IMPOSED BY OTHER STATES (Must attach copy of
      PIT-RSS and other state return.)")'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
- name: 'Volunteer Firefighter Credit'
  type: nonrefundable
  eligibility: 'Delaware residents who are active volunteer firefighters, members of a fire company auxiliary, or active
    members of an organized rescue squad in a Delaware volunteer company. Active status is verified annually with the
    volunteer fire companies; the Fire Company number must be entered on Line 29 (Spouse Column A and/or Self Column
    B). Only one $1,000 credit may be claimed by each spouse.'
  claimed_on: 'Form PIT-RES, Line 29'
  citation:
    source: 'Delaware Division of Revenue, 2025 Form PIT-RES Instructions, Line 29 Volunteer Firefighter Credit ("one
      $1,000 credit may be claimed by each spouse"); printed 2025 Form PIT-RES Line 29'
    url: 'https://revenuefiles.delaware.gov/2025/PITForms_Instructions/Instructions/PIT-RES_Instructions_2025-01.pdf'
