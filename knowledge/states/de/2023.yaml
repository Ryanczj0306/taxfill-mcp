  base: federal_agi
  tax_line: 'Form PIT-RES Line 23: "TAX LIABILITY FROM TAX RATE TABLE/SCHEDULE (See instructions)". Line 22: "TAXABLE
    INCOME - Subtract Line 21 from Line 12, and compute tax on this amount". Instructions (PDF p.8): "If Line 22 is
    less than $60,000, use the tax table to compute your tax liability. If line 22 is $60,000 or greater, use the
    tax schedule at the end of the tax table to compute your tax liability. Enter your tax liability on Line 23."'
  exemptions: {}
  standard_deduction:
    single: 3250
    married_filing_jointly: 6500
    married_filing_separately: 3250
    head_of_household: 3250
  notes:
  - 'Base guidance: Supply Form PIT-RES Line 12, DELAWARE ADJUSTED GROSS INCOME = Line 1 federal AGI (Federal Form
    1040, Line 11) + Section A additions (Line 2 interest on non-Delaware state/local obligations; Line 3 fiduciary
    adjustment / oil depletion) - Section B subtractions (Line 5 U.S.-obligation interest; Line 6 pension/retirement
    exclusions; Line 7 Delaware state tax refund, fiduciary adjustment, work opportunity credit, Delaware NOL carryforward;
    Lines 8a/8b taxable Social Security / Railroad Retirement benefits, higher-education exclusion, certain lump-sum
    distributions; Line 11 529/ABLE contribution deduction and the $2,000/$4,000 exclusion for certain persons 60-and-over
    or disabled). If the filer has no Delaware additions or subtractions, Line 12 equals federal AGI. The op then
    subtracts the shipped per-status standard deduction to reproduce Line 22 taxable income (Line 22 = Line 12 - Line
    21 total deductions).'
  - 'Adjudication note (two-pass): base is federal_agi — 2023 PIT-RES starts from a printed Federal Adjusted Gross
    Income line; Delaware AGI (Line 12) = federal AGI plus Section A additions minus Section B subtractions. Supply
    Line 12 as taxable_base; the op subtracts the Line 21 standard deduction.'
  - 'NO income-based exemptions are shipped (exemptions = {}): Delaware''s per-person allowances are TAX CREDITS,
    not subtractions from income. Form PIT-RES Line 26a Personal Credits = $110 x the number of exemptions/dependents
    from the federal return (''Enter the total number of dependents listed on your federal return, multiply by $110'';
    e.g., MFJ with no dependents = $220), and Line 26b Additional Personal Credits = $110 per taxpayer/spouse age
    60 or over on December 31, 2023 — both are subtracted from the Line 23 tax, not from income (2023 PIT-RES instructions,
    PDF p.8). They are NOT applied by calc.state_tax; claim them on the form. exemptions_count and dependents_count
    must therefore be 0 for this pack. A filer claimed as a dependent on another person''s federal return gets $0
    personal credit.'
  - 'SINGLE rate schedule for ALL filing statuses: 30 Del. C. § 1102(a)(14) publishes one rate table with no filing-status
    variation, and the 2023 State Income Tax Table has no filing-status columns; the schedule is duplicated per status
    here. Only the standard deduction differs by status ($6,500 Filing Status 2 vs $3,250 Statuses 1, 3, 4, 5).'
  - 'TAX TABLE MANDATE below $60,000 — bracket math may differ by a few dollars within table bands; the filed form
    must use the table: ''If Line 22 is less than $60,000, use the tax table to compute your tax liability'' (Line
    23 instructions, PDF p.8). The table uses $50-wide bands (first bands: $0-$1,000 and $1,000-$2,000 tax $0); observed
    divergences from exact marginal math are $1-$2 (e.g., taxable income $26,750: table $1,100 vs bracket math $1,098;
    $14,750: table $490 vs $489; $22,000: table $846 vs $845). At $60,000 or over the printed schedule ($2,943.50
    + 6.60% of the portion over $60,000) IS exact marginal math.'
  - 'Printed-constant check: the schedule''s $2,943.50 at $60,000 exactly equals the cumulative sum of the prior brackets
    (0.022x3,000 = 66.00; + 0.039x5,000 = 195.00; + 0.048x10,000 = 480.00; + 0.052x5,000 = 260.00; + 0.0555x35,000
    = 1,942.50; total 2,943.50) — no divergence.'
  - 'Provenance of the sub-$60,000 rates: the 2023 DOR booklet and tax-table PDF print a rate schedule ONLY for taxable
    income of $60,000 or over (below that they mandate the table). The 2.2%/3.9%/4.8%/5.2%/5.55% marginal rates and
    their $2,000/$5,000/$10,000/$20,000/$25,000/$60,000 breakpoints are copied from 30 Del. C. § 1102(a)(14) (official
    Delaware Code site, taxable years beginning after December 31, 2013 — unchanged for 2023) and cross-check exactly
    against the DOR table''s band values and the printed $2,943.50 constant.'
  - 'The first bracket is a zero-rate floor: § 1102(a)(14) imposes no tax on the first $2,000 of taxable income (the
    rate schedule starts at ''2.2% of taxable income in excess of $2,000''), and the 2023 tax table shows $0 tax for
    taxable income under $2,000.'
  - 'Additional standard deduction NOT applied by the engine: Line 20 allows $2,500 per box checked for taxpayer/spouse
    age 65 or over and/or blind (maximum $5,000 per individual), ONLY for filers electing the Delaware standard deduction
    (''If you elect to itemize your deductions, you do not qualify''). Enter it on the form; the shipped standard_deduction
    covers Line 19a only.'
  - 'Itemizers: the standard deduction is in lieu of itemizing. Filers may itemize on the Delaware return (Section
    C Lines 13-18 + Form PIT-RSA) even if they took the federal standard deduction; the shipped standard_deduction
    applies only to standard-deduction electors. For Filing Status 3 or 4, if one spouse itemizes the other must itemize;
    if one takes the standard deduction the other must too.'
  - Delaware filing statuses are 1 Single/Divorced/Widow(er); 2 Married Filing Joint; 3 Married Filing Separate Forms;
    4 Married Filing Combined Separate (two separate computations in Columns A and B of one form, $3,250 standard
    deduction per column); 5 Head of Household. The engine's married_filing_separately corresponds to Status 3 or
    per-column Status 4 (both $3,250). The instructions note separate returns (Status 3/4) are generally advantageous
    when both spouses have Delaware AGI over $9,400.
  - 'QUALIFYING SURVIVING SPOUSE caution: the engine maps QSS to married_filing_jointly ($6,500 standard deduction),
    but the PIT-RES Filing Status 1 box reads ''Single, Divorced, Widow(er)'' and the instructions define Statuses
    2-4 as being for ''Married Taxpayers''; the 2023 booklet never mentions the federal QSS status. A widow(er) not
    remarried at year-end appears to file Delaware Status 1 ($3,250 standard deduction) — the brackets are identical
    either way, but the deduction differs by $3,250. Confirm the correct Delaware status at revenue.delaware.gov before
    relying on the QSS->MFJ mapping.'
  - 'Tax on lump-sum distributions is NOT modeled: Form PIT-RES Line 24 adds a separate tax on qualified lump-sum
    distributions computed on Form PIT-STC (30 Del. C. § 1102(b) ten-year-averaging separate tax); the engine computes
    Line 23 only.'
  - 'Base subtractions taken BEFORE Line 12 are the caller''s responsibility: the pension/retirement exclusion (Line
    6), the exclusion for certain persons 60 and over or disabled ($2,000, or $4,000 joint, income-limited; Line 11),
    the DE 529/ABLE contribution deduction (Line 11), U.S.-obligation interest (Line 5), and taxable Social Security
    / Railroad Retirement benefits (Line 8a) — supply Line 12 Delaware AGI already reflecting them.'
  - Delaware EITC, child care credit, other-state credit, volunteer firefighter credit, and the $110 personal credits
    are all CREDITS against tax on Lines 26-33 — none of them are exemptions and none are modeled by this op.
  - 'Rounding: ''Dollar amounts on your return must be rounded off to the nearest whole dollar. This means that amounts
    from 50 to 99 cents are increased to the next dollar'' (PDF p.4) — matches the engine''s half-up rounding. The
    tax-schedule example rounds $3,455.06 to $3,455.'
  - No local income tax is collected on Form PIT-RES (the return has no local/county tax line). Part-year residents
    may elect to file either PIT-RES (full-year resident treatment) or PIT-NON, whichever is more advantageous; this
    pack models the resident form PIT-RES.
