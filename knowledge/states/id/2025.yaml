- description: >-
    IRC CONFORMITY DATE MOVED TO JANUARY 1, 2026 (the 2024 booklet said January 1, 2024), with
    bonus depreciation, Idaho net operating losses and the Idaho Research Credit as the notable
    exceptions. That later conformity date is why the shipped standard deduction is the OBBBA-amended
    federal 2025 amount — $15,750 single/MFS, $31,500 MFJ/QSS, $23,625 HOH (2024: $14,600/$29,200/$21,900)
    — and not the pre-OBBBA figures, and why the age-65/blind additional standard deduction is $1,600
    ($2,000 if single or head of household). The federal-linked resident gross-income filing thresholds
    rose with it.
