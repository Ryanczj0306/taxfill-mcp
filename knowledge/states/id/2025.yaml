effective_law_changes:
- description: >-
    RATE CUT to 5.3%, effective January 1, 2025, down from 2024's 5.695% — attributed by the
    Idaho Legislature's own bill page to 2025 House Bill 40, which cut the individual and business
    rate from 5.695% to 5.3%. The booklet's What's New states 'Effective January 1, 2025, the
    individual income tax rate is 5.3%' and the live tax.idaho.gov individual-income online guide
    independently states 'The income tax rate for 2025 is 5.3% on Idaho taxable income.' The Line 20
    worksheet's zero-floor subtraction amounts were re-indexed alongside it to $4,811 (single/MFS)
    and $9,622 (MFJ/HOH/QSS) from 2024's $4,673/$9,346.
