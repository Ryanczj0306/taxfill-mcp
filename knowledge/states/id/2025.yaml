  source: 2025 Idaho Individual Income Tax instructions, Form 40/43/39R/39NR booklet (EIN00046, 03-02-2026) — What's
    New for 2025 (Tax Rate Reduction to 5.3% effective January 1, 2025; IRC conformity as of January 1, 2026; Food
    Tax Credit increased to $155 per person with a $250 actual-receipts option), Who Must File and the Idaho Resident
