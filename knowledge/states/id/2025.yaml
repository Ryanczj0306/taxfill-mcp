  notes:
  - '2025 CHANGE — RATE CUT AND RE-INDEXED FLOOR: ''Effective January 1, 2025, the individual income tax rate is 5.3%''
    (What''s New for 2025) — down from 2024''s 5.695%, enacted by 2025 House Bill 40 — and the Line 20 worksheet''s
    zero-floor subtraction amounts were re-indexed to $4,811 (single/MFS) and $9,622 (MFJ/HOH/QSS), from 2024''s $4,673/$9,346.
    Do not use the 2024 rate or amounts for 2025. The live tax.idaho.gov online guide states the same rate independently
    of the booklet.'
  - '2025 CHANGE — IRC CONFORMITY AND THE STANDARD DEDUCTION: the booklet''s What''s New says ''Idaho conforms to
    the IRC as of January 1, 2026'' (2024''s booklet said January 1, 2024), with bonus depreciation, Idaho net operating
    losses, and the Idaho Research Credit as notable exceptions. That later conformity date is why the shipped standard
    deduction is the OBBBA-amended federal 2025 amount — $15,750 single/MFS, $31,500 MFJ/QSS, $23,625 HOH — and NOT
    the pre-OBBBA inflation-only figures. The age-65/blind additional deduction is likewise $1,600 ($2,000 if single
    or head of household).'
  - 'Base guidance: Supply Form 40, line 11 ''Total Adjusted Income'' = federal AGI (Form 40 line 7, from federal
    Form 1040/1040-SR line 11) plus Form 39R Part A additions minus Form 39R Part B subtractions. With no Idaho additions
    or subtractions this equals federal AGI. The op subtracts only the per-status standard deduction (Form 40 line
    16); if you claim the federal qualified business income deduction (Form 40 line 18) or itemize (Form 40 lines
    13-15), the op will overstate tax — subtract your line 18 QBI amount from line 11 before supplying it, or compute
    on the form.'
  - 'Structure: Idaho''s 2025 tax is a single 5.3% rate on Idaho taxable income ABOVE a filing-status threshold —
    $4,811 (single or married filing separately) / $9,622 (married filing jointly, head of household, or qualifying
    surviving spouse) — per the Form 40 line 20 worksheet (2025 instructions p.9). It is modeled here as a 0% bracket
    up to the threshold and 5.3% above it; taxable income at or below the threshold owes $0.'
  - Head of household uses the SAME $9,622 worksheet threshold as married filing jointly (instructions p.9), even
    though its standard deduction ($23,625) differs from MFJ's ($31,500).
  - Qualifying surviving spouse (Form 40 filing status 5) is listed in the worksheet with the same $9,622 amount as
    married filing jointly, so the engine's QSS-to-MFJ mapping is exact for both the brackets and the $31,500 standard
    deduction.
  - The worksheet's line 5 prints an explicit zero clause — 'If zero or less, enter zero'; the 0% floor bracket implements
    the $0 result for taxable income at or below the subtraction amount.
  - 'Qualified business income deduction NOT modeled: Form 40 line 18 subtracts the federal QBI deduction AFTER the
    standard/itemized deduction to reach Idaho taxable income (line 19). See base guidance for how to account for
    it.'
  - 'Itemizers NOT modeled: Form 40 lines 13-15 use federal Schedule A itemized deductions MINUS state and local income
    or general sales taxes (line 14 addback), so ''it might be more beneficial to itemize for federal purposes but
    use the standard deduction for Idaho''; filers use the LARGER of net itemized (line 15) or the standard deduction
    (line 16). The op applies only the standard deduction.'
  - 'Standard-deduction gates NOT modeled (Standard Deduction Worksheet and ''You Must Itemize If'', 2025 instructions
    p.8): married filing separately MUST itemize if the spouse itemizes; a filer with dual status as a nonresident
    alien for part of 2025 must itemize; a person claimable as another''s dependent is limited to the greater of $1,350
    or earned income + $450 when earned income exceeds $900 (capped at the status amount); age-65+/blind boxes add
    $1,600 per box ($2,000 if single or head of household). Compute those cases on the worksheet.'
  - 'Idaho has NO personal or dependent exemptions (''Idaho conforms to the Internal Revenue Code (IRC), which no
    longer allows personal exemptions'' — Noncitizens guidance). The per-person amounts on the return are TAX CREDITS
    subtracted from tax or refundable payments, not base reductions, and are not modeled: the Idaho Child Tax Credit
    is $205 per qualifying child age 16 or under (Form 40 line 24 for 2025 — line 25 in 2024, nonrefundable), and
    the Food Tax Credit (formerly the Grocery Credit) is $155 per qualifying person, or actual Idaho food sales tax
    up to $250 each with receipts (Form 40 line 43, refundable).'
  - $10 Permanent Building Fund (PBF) tax (Form 40 line 31 for 2025 — line 32 in 2024) is a separate flat tax owed
    by everyone Idaho requires to file an Idaho return (waived for those below the filing threshold — draw a line
    through the $10 and enter 'NRF' — and for recipients of Idaho public assistance). It is outside the line 20 computation
    and NOT modeled.
  - 'New for 2025 and NOT modeled: the Parental Choice Tax Credit (Form 40 line 42), claimable only in the amount
    pre-approved through Idaho''s Taxpayer Access Point; it sits in the Payments and Other Credits section, outside
    the line 20 tax computation.'
  - 'No tax-table mandate: the 2025 booklet contains no tax tables — every filer computes line 20 with the worksheet,
    so bracket math reproduces the form exactly (whole-dollar rounding aside).'
  - Part-year residents and nonresidents file Form 43, not Form 40; Form 43 line 42 uses the identical worksheet (same
    $4,811/$9,622 amounts, same 5.3%) applied to Form 43 line 41 Idaho taxable income (2025 instructions p.20).
  - 'Form 40 face cross-check: printed 2025 Form 40 (EFO00089, 03-02-2026), https://tax.idaho.gov/wp-content/uploads/forms/EFO00089/EFO00089_03-02-2026.pdf
    — line 20 reads ''Tax from worksheet. See instructions, page 9'', line 19 reads ''Idaho taxable income. Subtract
    line 18 from line 17. If less than zero, enter zero'', and the line-16 margin prints the standard deduction amounts
    ($15,750 single/MFS, $23,625 head of household, $31,500 MFJ/qualifying surviving spouse).'
