# ID state knowledge — tax year 2025. Fetched + cited from the ID State Tax Commission
# (.gov), authored per the 2024 template (state-year knowledge program). Loaded as a
# StateKnowledge. conforms_to_federal_treaties: whether federally treaty-exempt income
# flows through (most states start from federal AGI) or is added back (CA/CT/MD/MS-style).
# Figures the fetch could not independently confirm are in `unverified` — confirm at the
# cited source. Two-pass verification: every key figure below was drafted from the 2025
# Form 40/43/39R/39NR instruction booklet (EIN00046, 03-02-2026), then independently
# re-derived from second official documents — the printed 2025 Form 40 (EFO00089,
# 03-02-2026), the live tax.idaho.gov individual-income online guide (which states the 2025
# rate on its own), and the live tax.idaho.gov Noncitizens guidance — resolutions recorded
# inline where the passes differed.
# HEADLINE 2025 CHANGES (What's New for 2025):
#   * RATE CUT to 5.3%, effective January 1, 2025 (from 2024's 5.695%) — 2025 House Bill 40,
#     signed by Gov. Little, which cut the individual and business rate from 5.695% to 5.3%.
#     The booklet states 'Effective January 1, 2025, the individual income tax rate is 5.3%'
#     and the live online guide independently states 'The income tax rate for 2025 is 5.3%
#     on Idaho taxable income.'
#   * The Line 20 worksheet's zero-floor subtraction amounts were RE-INDEXED to $4,811
#     (single/MFS) and $9,622 (MFJ/HOH/QSS), from 2024's $4,673/$9,346.
#   * IRC CONFORMITY MOVED TO JANUARY 1, 2026 (2024's booklet said January 1, 2024), which
#     is why the standard deduction tracks the OBBBA-amended federal 2025 amounts:
#     $15,750 single/MFS, $31,500 MFJ/QSS, $23,625 HOH (2024: $14,600/$29,200/$21,900).
#     Age-65/blind add-on is now $1,600 ($2,000 if single or head of household).
#   * The GROCERY CREDIT WAS RENAMED the FOOD TAX CREDIT and INCREASED to $155 per person
#     ($12.92 per qualified month), with a NEW option to claim actual Idaho sales tax paid on
#     qualifying food (up to $250 each) by including scanned receipts. The 2024 age-65+ $20
#     add-on ($140 total) is GONE — 2025 is a flat $155 for every qualifying person.
#   * NEW Line 42 PARENTAL CHOICE TAX CREDIT (pre-approved through Idaho TAP).
#   * Form 40 line renumbering: the Idaho Child Tax Credit is line 24 (2024: line 25) and the
#     $10 Permanent Building Fund tax is line 31 (2024: line 32).
jurisdiction: states/id
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Idaho''s resident return (Form 40) starts on line 7 from federal adjusted gross income (''Enter your
  federal adjusted gross income from federal Form 1040 or 1040-SR, line 11''), and the only statutory additions
  are on Form 39R, Part A (2025 instructions): federal NOL deduction, capital loss carryover incurred outside the
  state before becoming an Idaho resident, non-Idaho state/local bond interest and dividends, Idaho college savings
  account (IDeal) withdrawal, bonus depreciation, and other additions. There is NO add-back of federally treaty-exempt
  income (unlike CA''s Schedule CA). Because treaty-exempt income is already excluded from federal AGI and is not
  added back, it flows through untaxed. Idaho also affirmatively confirms this in its Noncitizens guidance (re-fetched
  live this session): ''Idaho honors all tax treaties recognized by the United States'' and ''Gross income amounts
  exempt by treaty are not included in the gross income filing requirement for Idaho'' (with a worked Venezuela-treaty
  example against the $2,500 nonresident threshold). Therefore Idaho conforms to federal treaty exemptions.'
