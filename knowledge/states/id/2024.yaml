tax:
  citation:
    source: '2024 Idaho Individual Income Tax instructions, Form 40/43/39R/39NR booklet (EIN00046, 10-23-2024) — Line
      20 Tax Worksheet, page 9: ''1. Enter the amount of Idaho taxable income from Form 40, line 19; 2. Enter the amount
      shown below for your filing status: Single or married filing separately, enter $4,673 — Married filing jointly,
      head of household, or qualifying surviving spouse, enter $9,346; 3. Subtract line 2 from line 1; 4. Multiply subtotal
      by 5.695%; 5. Idaho tax ... If zero or less, enter zero''; ''What''s New for 2024 — Tax Rate Reduction: Effective
      January 1, 2024, the individual income tax rate is 5.695%'' (page 1, CUT from 2023''s 5.8%; subtraction amounts
      re-indexed from $4,489/$8,978); Standard Deduction Worksheet, page 8 ($14,600 single/MFS, $29,200 MFJ/QSS, $21,900
      HOH — 2024 federal amounts). Second pass: the 2024 Form 40 face (EFO00089, 09-04-2024) — the line-16 margin prints
      $14,600/$21,900/$29,200, line 19 reads ''Idaho taxable income. Subtract line 18 from line 17. If less than zero,
      enter zero'', and line 20 reads ''Tax from worksheet. See instructions, page 9''; the Form 43 line 42 worksheet
      (booklet p.34) prints the identical $4,673/$9,346 amounts and 5.695% — both passes agree.'
    url: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_10-23-2024.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 4673, rate: 0}
    - {over: 4673, but_not_over: null, rate: 0.05695}
    married_filing_jointly:
    - {over: 0, but_not_over: 9346, rate: 0}
    - {over: 9346, but_not_over: null, rate: 0.05695}
    married_filing_separately:
    - {over: 0, but_not_over: 4673, rate: 0}
    - {over: 4673, but_not_over: null, rate: 0.05695}
    head_of_household:
    - {over: 0, but_not_over: 9346, rate: 0}
    - {over: 9346, but_not_over: null, rate: 0.05695}
  base: federal_agi
  tax_line: 'Form 40, line 20: ''Tax from worksheet. See instructions, page 9.'' Worksheet (2024 instructions p.9):
    1. ''Enter the amount of Idaho taxable income from Form 40, line 19''; 2. ''Enter the amount shown below for your
    filing status: Single or married filing separately, enter $4,673 — Married filing jointly, head of household,
    or qualifying surviving spouse, enter $9,346''; 3. ''Subtract line 2 from line 1. Enter the subtotal''; 4. ''Multiply
    subtotal by 5.695%''; 5. ''Idaho tax. Enter the total here and on Form 40, line 20. If zero or less, enter zero.'''
  exemptions:
    age_65:
      amount: 1550
      note: 'NOT an exemption and NOT applied by calc.state_tax — it is an ADDITIONAL STANDARD DEDUCTION: $1,550 per age-65-or-older
        box checked on Form 40 line 12a ($1,950 instead if single or head of household), added to the base standard deduction
        via the Standard Deduction Worksheet, line 5 (2024 instructions pp.8-9; born before January 2, 1960). Boxes must
        match the federal return.'
    blind:
      amount: 1550
      note: 'NOT an exemption and NOT applied by calc.state_tax — it is an ADDITIONAL STANDARD DEDUCTION: $1,550 per blind
        box checked on Form 40 line 12b ($1,950 instead if single or head of household), added to the base standard deduction
        via the Standard Deduction Worksheet, line 5 (2024 instructions pp.8-9). Boxes must match the federal return.'
  standard_deduction:
    single: 14600
    married_filing_jointly: 29200
    married_filing_separately: 14600
    head_of_household: 21900
  notes:
  - '2024 CHANGE — RATE CUT AND RE-INDEXED FLOOR: ''Effective January 1, 2024, the individual income tax rate is 5.695%''
    (What''s New, p.1) — down from 2023''s 5.8% — and the Line 20 worksheet''s zero-floor subtraction amounts were
    re-indexed to $4,673 (single/MFS) and $9,346 (MFJ/HOH/QSS), from 2023''s $4,489/$8,978. Do not use the 2023 rate
    or amounts for 2024.'
  - 'Base guidance: Supply Form 40, line 11 ''Total Adjusted Income'' = federal AGI (Form 40 line 7, from federal
    Form 1040/1040-SR line 11) plus Form 39R Part A additions minus Form 39R Part B subtractions. With no Idaho additions
    or subtractions this equals federal AGI. The op subtracts only the per-status standard deduction (Form 40 line
    16); if you claim the federal qualified business income deduction (Form 40 line 18 = federal 1040 line 13) or
    itemize (Form 40 lines 13-15), the op will overstate tax — subtract your line 18 QBI amount from line 11 before
    supplying it, or compute on the form.'
  - 'Structure: Idaho''s 2024 tax is a single 5.695% rate on Idaho taxable income ABOVE a filing-status threshold
    — $4,673 (single or married filing separately) / $9,346 (married filing jointly, head of household, or qualifying
    surviving spouse) — per the Form 40 line 20 worksheet (2024 instructions p.9). It is modeled here as a 0% bracket
    up to the threshold and 5.695% above it; taxable income at or below the threshold owes $0.'
  - Head of household uses the SAME $9,346 worksheet threshold as married filing jointly (instructions p.9), even
    though its standard deduction ($21,900) differs from MFJ's ($29,200).
  - Qualifying surviving spouse (Form 40 filing status 5) is listed in the worksheet with the same $9,346 amount as
    married filing jointly, so the engine's QSS-to-MFJ mapping is exact for both the brackets and the $29,200 standard
    deduction.
  - 'The 2024 worksheet prints an explicit zero clause — line 5: ''If zero or less, enter zero'' (new wording versus
    2023, which left it implicit); the 0% floor bracket implements the $0 result for taxable income at or below the
    subtraction amount.'
  - 'Qualified business income deduction NOT modeled: Form 40 line 18 subtracts the federal QBI deduction (federal
    1040/1040-SR line 13) AFTER the standard/itemized deduction to reach Idaho taxable income (line 19). See base
    guidance for how to account for it.'
  - 'Itemizers NOT modeled: Form 40 lines 13-15 use federal Schedule A itemized deductions MINUS state and local income
    or general sales taxes (line 14 addback), and Idaho lets you ADD any federal foreign tax credit amount to Idaho
    itemized deductions (''If you claim the federal foreign tax credit, Idaho allows that amount as a deduction'');
    filers use the LARGER of net itemized or the standard deduction. The op applies only the standard deduction.'
  - 'Standard-deduction gates NOT modeled (Standard Deduction Worksheet and ''You Must Itemize If'', 2024 instructions
    p.8): married filing separately MUST itemize if the spouse itemizes; dual-status nonresident aliens must itemize;
    a person claimable as another''s dependent is limited to the greater of $1,300 or earned income + $450 (capped
    at the status amount); age-65+/blind boxes add $1,550 per box ($1,950 if single or head of household). Compute
    those cases on the worksheet.'
  - 'Idaho has NO personal or dependent exemptions (''Idaho conforms to the Internal Revenue Code (IRC), which no
    longer allows personal exemptions'' — Noncitizens guidance). The per-person amounts on the return are TAX CREDITS
    subtracted from tax, not base reductions, and are not modeled: the Idaho Child Tax Credit is $205 per qualifying
    child age 16 or under (Form 40 line 25, nonrefundable), and the grocery credit is $120 per qualifying person ($140
    if 65+) (Form 40 line 43, refundable).'
  - $10 Permanent Building Fund (PBF) tax (Form 40 line 32) is a separate flat tax owed by everyone required to file
    an Idaho return (waived for those below the filing threshold ('NRF'), recipients of Idaho public assistance at
    year-end, and the legally blind). It is outside the line 20 computation and NOT modeled.
  - 'No tax-table mandate: the 2024 booklet contains no tax tables — every filer computes line 20 with the worksheet,
    so bracket math reproduces the form exactly (whole-dollar rounding aside).'
  - Part-year residents and nonresidents file Form 43, not Form 40; Form 43 line 42 uses the identical worksheet (same
    $4,673/$9,346 amounts, same 5.695%) applied to Form 43 line 41 Idaho taxable income (2024 instructions p.34).
  - 'Form 40 face cross-check: 2024 Form 40 (EFO00089, 09-04-2024), https://tax.idaho.gov/wp-content/uploads/forms/EFO00089/EFO00089_09-04-2024.pdf
    — line 20 reads ''Tax from worksheet. See instructions, page 9'', line 19 reads ''Idaho taxable income. Subtract
    line 18 from line 17. If less than zero, enter zero'', and the line-16 margin prints the standard deduction amounts
    ($14,600 single/MFS, $21,900 HOH, $29,200 MFJ).'
