# ID state knowledge — tax year 2024. Fetched + cited from the ID State Tax Commission
# (.gov), authored per the 2023 template (state-year knowledge program). Loaded as a
# StateKnowledge. conforms_to_federal_treaties: whether federally treaty-exempt income
# flows through (most states start from federal AGI) or is added back (CA/CT/MD/MS-style).
# Figures the fetch could not independently confirm are in `unverified` — confirm at the
# cited source. Two-pass verification: every key figure below was drafted from the 2024
# Form 40/43/39R/39NR instruction booklet (EIN00046, 10-23-2024), then independently
# re-derived from a second official document (the printed 2024 Form 40, EFO00089
# 09-04-2024, or the live tax.idaho.gov Noncitizens guidance) — resolutions recorded
# inline where the passes differed.
# HEADLINE 2024 CHANGE (What's New): the individual income tax rate was CUT to 5.695%
# effective January 1, 2024 (from 2023's 5.8%), and the Line 20 worksheet's zero-floor
# subtraction amounts were RE-INDEXED to $4,673 (single/MFS) and $9,346 (MFJ/HOH/QSS)
# (from 2023's $4,489/$8,978). The standard deduction tracks federal 2024 amounts:
# $14,600 single/MFS, $29,200 MFJ/QSS, $21,900 HOH. The 2024 worksheet also now prints
# an explicit 'If zero or less, enter zero' on its final line.
jurisdiction: states/id
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Idaho''s resident return (Form 40) starts on line 7 from federal adjusted gross income (federal Form
  1040/1040-SR, line 11), and the only statutory additions are on Form 39R, Part A (2024 instructions pp.30-31):
  federal NOL deduction, capital loss carryover incurred outside the state before becoming an Idaho resident, non-Idaho
  state/local bond interest and dividends, Idaho college savings account withdrawal, bonus depreciation, and other
  additions. There is NO add-back of federally treaty-exempt income (unlike CA''s Schedule CA). Because treaty-exempt
  income is already excluded from federal AGI and is not added back, it flows through untaxed. Idaho also affirmatively
  confirms this in its Noncitizens guidance (re-fetched live this session): ''Idaho honors all tax treaties recognized
  by the United States'' and ''Gross income amounts exempt by treaty are not included in the gross income filing
  requirement for Idaho.'' Therefore Idaho conforms to federal treaty exemptions.'
