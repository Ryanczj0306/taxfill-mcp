residency:
  summary: Idaho residency is domicile-based with a statutory-resident overlay. You are a RESIDENT if Idaho is your
    permanent home / the place you intend to return to; you are ALSO a (statutory) resident if you maintain a home
    in Idaho the entire year AND spend more than 270 days in Idaho during the tax year. You are a PART-YEAR resident
    if you moved into or out of Idaho during the year (you remain a resident if you only temporarily moved outside
    Idaho and moved back after a temporary absence). You are a NONRESIDENT if your permanent home is outside Idaho
    all year (a detailed safe-harbor also treats certain people as nonresidents if they lived outside Idaho at least
    445 days in a 15-month period and meet other conditions). Military and Military Spouses Residency Relief Act
    rules can override these (a spouse or dependent of a nonresident military person stationed in Idaho can still
    be an Idaho resident or part-year resident).
forms:
  resident: Form 40 (Individual Income Tax Return); residents claiming additions, subtractions, or certain credits
    also file Form 39R (Resident Supplemental Schedule)
  part_year_or_nonresident: Form 43 (Part-year Resident and Nonresident Income Tax Return); part-year/nonresident
    filers claiming additions, subtractions, or certain credits also file Form 39NR (Part-year Resident and Nonresident
    Supplemental Schedule)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Idaho Grocery Credit (Food Tax Credit)
  type: refundable
  eligibility: Idaho residents only. Claimed for yourself, spouse, and each qualifying Idaho-resident dependent.
    If someone else can claim you as a dependent, you cannot claim it. Does NOT qualify for any month (or part of
    a month) a person received federal food stamp (SNAP) assistance, was incarcerated, or lived illegally in the
    US. Members of the Armed Forces domiciled in Idaho can take it; nonresidents under the Servicemembers Civil
    Relief Act cannot. Refundable even if you are not required to file an income tax return (file Form 40, or Form
    24 if not filing — Form 24 due by April 15, 2025).
  amount: $120 each for taxpayer, spouse, and each qualifying dependent for the full year (prorated at $10/qualified
    month). Additional $20 each for taxpayer and/or spouse who is age 65 or older on December 31, 2024 (i.e., $140
    for a full-year resident 65+; prorated at $11.67 per qualified month). The credit may also be donated to the
    Cooperative Welfare Fund.
  income_limit_2024: None
  claimed_on: Form 40, line 43 (Grocery Credit Worksheet, 2024 instructions pp.11-12). Nonfilers may use Form 24.
  citation:
    source: Idaho State Tax Commission, 2024 Form 40 instructions (EIN00046, 10-23-2024), Line 43 Grocery Credit
      and Grocery Credit Worksheet ($120 / $140 if 65+; $10 or $11.67 per qualified month)
    url: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_10-23-2024.pdf
- name: Idaho Child Tax Credit
  type: nonrefundable
  eligibility: You must have a qualifying child (per the federal qualifying-child definition) who is age 16 or under
    as of December 31, 2024. For divorced parents or parents who don't live together, only one parent can claim
    a qualifying child — typically the custodial parent. No qualifying child means no credit.
  amount: '$205 per qualifying child. Per the Line 25 worksheet: multiply the number of qualifying children by $205,
    then limit to the remaining tax after subtracting Form 40 lines 22-24 credits (worksheet line 7: if less than
    zero, enter zero; line 8: enter the lesser).'
  income_limit_2024: None stated; the credit is limited to your remaining Idaho tax liability after certain other
    credits (nonrefundable).
  claimed_on: Form 40, line 25 (Idaho Child Tax Credit Worksheet, 2024 instructions pp.9-10). Nonresidents don't
    qualify (Form 43, line 46 instructions).
  citation:
    source: Idaho State Tax Commission, 2024 Form 40 instructions (EIN00046, 10-23-2024), Line 25 Idaho Child Tax
      Credit Worksheet ('Multiply line 1 by $205')
    url: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_10-23-2024.pdf
- name: Credit for Maintaining a Home for a Family Member Age 65 or Older or with a Developmental Disability
  type: refundable
  eligibility: You maintained a household during 2024 for an immediate family member who is (a) age 65 or older
    (not counting yourself or your spouse), or (b) has a developmental disability (may include yourself or your
    spouse) AND you did NOT claim the $1,000-per-person deduction for that family member on Form 39R, Part B, line
    15. You can claim this credit even if your gross income is below the filing requirement.
  amount: $100 per qualifying person, up to a maximum of $300.
  income_limit_2024: None (claimable even if gross income is below the filing threshold).
  claimed_on: Form 40, line 44 (requires Form 39R).
  citation:
    source: Idaho State Tax Commission, 2024 Form 40 instructions (EIN00046, 10-23-2024), Line 44 Maintaining a
      Home for a Family Member Age 65 or Older or a Family Member with a Developmental Disability
    url: https://tax.idaho.gov/wp-content/uploads/forms/EIN00046/EIN00046_10-23-2024.pdf
filing_requirement:
  note: '2024 thresholds (EIN00046 General Information, ''Who Must File'' / Idaho Resident Filing Requirements chart):
    every Idaho resident who must file a federal return must file; every part-year resident with more than $2,500
    total gross income (all sources while resident + Idaho sources while nonresident) must file; every nonresident
    with more than $2,500 gross income from Idaho sources must file. Resident gross-income thresholds for 2024 (federal-linked):
    Single under 65 = $14,600 (65+ = $16,550); Head of household under 65 = $21,900 (65+ = $23,850); MFJ under 65
    (both) = $29,200 (one 65+ = $30,750, both = $32,300); Qualifying surviving spouse under 65 = $29,200; Married
    filing separately (any age) = $5. Treaty-exempt amounts are excluded from the gross-income filing test. A resident
    filing a federal return only to pay self-employment tax need not file.'
