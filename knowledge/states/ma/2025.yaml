# MA state knowledge — tax year 2025. Fetched + cited from the MA DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 Form 1
# instructions, then independently re-checked against the 2025 Form 1 blank itself
# (which prints the $4,400/$6,800/$8,800 line 2a exemptions, the $1,000/$1,700/$2,200
# line 2b-2d multipliers, the line 22 '$24,000 / multiply by .05' tax line, and the
# line 28b 4% surtax line). mass.gov sits behind Akamai and 403s non-browser fetchers,
# so BOTH documents were recovered from the Wayback Machine's 200-status captures of the
# SAME official mass.gov URLs (instructions capture 20260425134124; Form 1 capture
# 20260420000228) — the identical provenance path the shipped MA form pack used.
# HEADLINE 2025 CHANGES (Major 2025 Tax Changes): (1) the 4% surtax threshold indexed
# $1,053,750 -> $1,083,150; (2) Senior Circuit Breaker maximum rose $2,730 -> $2,820
# (income limits $75,000/$94,000/$112,000; valuation cap $1,298,000); (3) the federal
# earned-income ceiling referenced for the MA EITC rose $66,819 -> $68,675 (the MA credit
# stays 40% of the federal); (4) a NEW real-estate-closing withholding regime for
# non-resident sellers (830 CMR 62B.2.4) applies to closings on or after November 1, 2025;
# (5) a new Climatetech Tax Incentive Program plus other new/revised credits (TIR 24-16,
# TIR 25-5); (6) employer-provided parking and combined transit-pass/commuter-highway-
# vehicle monthly exclusions are $325 each. UNCHANGED for 2025: the 5.0% Part B rate, the
# 8.5%/12% Schedule B classes, the line 2a-2d exemption amounts, the $24,000 tax-table
# cutoff, the $8,000 filing threshold, the No Tax Status / Limited Income Credit
# thresholds, and the $440 Child and Family Tax Credit.
jurisdiction: states/ma
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Net result: treaty-exempt income is NOT re-taxed by MA, so conforms = true — but the mechanism is
  an EXPLICIT DEDUCTION, not passive federal-AGI conformity. Important nuance: MA''s Form 1 does NOT start from federal
  AGI. It builds Massachusetts gross income from its own categories. Line 3 (Wages) is taken from W-2 state wages
  (Box 16), and Massachusetts gross income can include items not subject to U.S. income tax. So treaty-exempt income
  that an employer reports in state wages would otherwise land in MA income. MA neutralizes this with the dedicated
  Schedule Y, Line 4 deduction — for 2025 titled ''Amounts Excludible Under MGL Ch 41, § 111F or U.S. Tax Treaty
  Included in Form 1, Line 3'' and SPLIT INTO TWO SUB-LINES: ''Massachusetts allows an exclusion from income of amounts
  received by a firefighter or police officer incapacitated in the line of duty, per MGL ch 41, § 111F, and an exclusion
  from income of amounts received by a qualifying student or taxpayer exempt under a U.S. tax treaty... If you were
  a qualifying student or a taxpayer with income exempt under a United States tax treaty, enter any excludible amount
  of income received that was exempt under such tax treaty in line 4b'' (the § 111F amount goes on line 4a). Because
  Schedule Y reduces income, the treaty-exempt amount is deducted back out and is not taxed. PRACTICAL NOTE: unlike
  a pure federal-AGI conformity state where treaty income flows out automatically, in MA the taxpayer must affirmatively
  claim the Schedule Y, Line 4b deduction — if treaty wages appear in W-2 Box 16 / Form 1 line 3 and the deduction
  is not claimed, the income would be taxed. Source: 2025 Form 1 Instructions, Schedule Y Line 4 (income exempt under
  a U.S. tax treaty) and Line 3 (Wages, Salaries, Tips).'
