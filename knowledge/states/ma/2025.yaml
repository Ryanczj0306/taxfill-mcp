  source: 2025 Form 1 Instructions (MA DOR) — Major 2025 Tax Changes (4% surtax threshold $1,083,150; Circuit Breaker
    maximum $2,820 with income limits $75,000/$94,000/$112,000 and valuation cap $1,298,000; new non-resident real-estate-closing
    withholding under 830 CMR 62B.2.4; Climatetech Tax Incentive Program; TIR 24-16 / TIR 25-5 credit changes; $325
