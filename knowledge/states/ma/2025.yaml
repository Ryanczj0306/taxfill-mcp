starts_from: 'federal wages (W-2 state wages, Box 16) — NOT federal AGI. MA Form 1 builds Massachusetts gross income
  from its own income categories (5.0% income incl. wages from W-2; interest/dividends on Schedule B; capital gains
  on Schedule D); it does not begin from a single federal AGI line. The header boxes a/b (total federal income from
  U.S. Form 1040, line 9; total federal AGI from U.S. Form 1040, line 11a) are informational.'
residency:
  summary: 'MA recognizes four statuses (MGL ch 62). FULL-YEAR RESIDENT: "You are a full-year resident if your residence
    (domicile) is in Massachusetts or if you maintain a permanent place of abode in Massachusetts and during the year
    spend more than 183 days, in the aggregate, in the state" — file Form 1. "The words residence and domicile are
    used to denote the place where you have your permanent home and to which, whenever you are absent, you have the
    intention of returning." NONRESIDENT: not a MA resident but received Massachusetts-source income (e.g., from a
    MA job) — file Form 1-NR/PY. PART-YEAR RESIDENT: you moved into MA or terminated MA residency during the year;
    income/deductions/exemptions are apportioned — file Form 1-NR/PY. NONRESIDENT AND PART-YEAR RESIDENT: meet both
    criteria; file Form 1-NR/PY and complete Schedule R/NR (Resident/Nonresident Worksheet). MILITARY: nonresident
    military personnel stationed in MA may be subject to MA tax and should file Form 1-NR/PY if they earn income from
    outside military sources; the Military Spouses Residency Relief Act (P.L. 111-97) prevents a servicemember''s spouse
    from gaining/losing MA domicile solely by accompanying the servicemember, and the Veterans Auto and Education Improvement
    Act (P.L. 117-333, as of January 5, 2023) lets a servicemember and spouse elect as residence/domicile for each
    taxable year of the marriage either spouse''s residence/domicile or the servicemember''s permanent duty station.
    JOINT RETURNS: a joint Form 1 is generally not allowed unless both spouses were Massachusetts residents for the
    same portion of 2025; NEW for 2025 there is an express exemption where one spouse has no MA filing requirement
    because their Massachusetts gross income does not exceed $8,000 — that couple may choose married-filing-separate
    status by filling in the "if joint filing exemption for spouses with Massachusetts gross income under $8,000" oval
    on Form 1.'
forms:
  resident: Form 1 — Massachusetts Resident Income Tax Return (2025)
  part_year_or_nonresident: Form 1-NR/PY — Massachusetts Nonresident or Part-Year Resident Income Tax Return (2025).
    Taxpayers who are both nonresident and part-year resident also complete Schedule R/NR (Resident/Nonresident Worksheet).
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Massachusetts Earned Income Tax Credit (EITC)
  type: refundable
  eligibility: Massachusetts residents (full- or part-year) who qualify for and claim the federal Earned Income Credit
    — earned income under $68,675 for 2025 (the maximum may be lower depending on filing status and number of eligible
    children). MA adopts the federal EIC expansion rules; a married person who is a victim of domestic abuse, living
    apart from their spouse at the time of filing and unable to file jointly, may file married filing separately and
    still claim the MA EIC (keep records such as a protective/restraining order or police report). Part-year residents
    prorate the credit.
  amount: A credit equal to 40% of the federal earned income credit claimed on the taxpayer's federal return. Refundable
    to the extent the credit exceeds total income tax payable. Worksheet A filers use Worksheet A line 6 and Worksheet
    B filers use Worksheet B line 11 for the "Amount from U.S. return" entry (see TIR 17-10).
  income_limit_2025: No separate MA income limit; tied to the federal EITC income/AGI limits for 2025 (federal earned-income
    ceiling referenced as $68,675, up from $66,819 for 2024).
  claimed_on: 2025 Form 1 (Resident), line 43 (enter qualifying children in 43a, the federal EIC amount in 43b, multiply
    by 40%); Form 1-NR/PY for nonresidents/part-year residents.
  citation:
    source: 2025 Form 1 Instructions (MA DOR), Line 43 Earned Income Credit — credit equal to 40% of the federal amount;
      $68,675 earned-income ceiling; domestic-abuse married-filing-separately exception; TIR 17-10
    url: https://www.mass.gov/doc/2025-form-1-instructions/download
- name: Senior Circuit Breaker Tax Credit (Real Estate Tax Credit for persons age 65+)
  type: refundable
  eligibility: Taxpayer must be age 65 or older, own or rent residential property located in Massachusetts and occupy
    it as their principal residence, and meet the income and assessed-valuation limits. Married taxpayers generally
    must file jointly to claim.
  amount: 'For homeowners: the amount by which 2025 real estate tax payments exceed 10% of total income. For renters:
    the amount by which 25% of rent paid for the principal residence exceeds 10% of total income. Either way the credit
    cannot exceed the 2025 maximum of $2,820 (up from $2,730 for 2024). Homeowners enter Schedule CB line 17; renters
    line 21. Refundable — any excess over total income tax payable is refunded without interest.'
  income_limit_2025: '2025 total income may not exceed $75,000 (single filer who is not a head of household), $94,000
    (head of household), or $112,000 (joint filer). Homeowners: the assessed value of the principal residence for
    tax year 2025 must not exceed $1,298,000. Total income and maximum credit thresholds are adjusted annually for
    inflation.'
  claimed_on: 2025 Form 1, line 44 (complete and enclose Schedule CB, Circuit Breaker Credit); Form 1-NR/PY for part-year
    residents.
  citation:
    source: 2025 Form 1 Instructions (MA DOR) — Circuit Breaker Tax Credit (maximum $2,820; income limits $75,000/$94,000/$112,000;
      valuation cap $1,298,000) and Line 44 instructions
    url: https://www.mass.gov/doc/2025-form-1-instructions/download
- name: Child and Family Tax Credit
  type: refundable
  eligibility: 'Resident (or part-year resident for the period of residency) who may claim the credit for an individual
    who is (1) under the age of 13 and who qualifies for exemption as a dependent for federal purposes; (2) a dependent,
    or the taxpayer''s spouse, who is physically or mentally incapable of taking care of himself or herself and principally
    lives with the taxpayer; or (3) a dependent who is age 65 or over or disabled. For tax years beginning on or after
    January 1, 2024 a noncustodial parent may claim the credit with respect to a child dependent age 13 or older who
    is physically or mentally incapable of caring for himself or herself. Cannot be claimed by a full-year nonresident.'
  amount: $440 for each qualifying individual, with no cap on the number of qualifying individuals — "Enter the number
    of qualified dependents in line 46a and multiply that amount by $440." (Unchanged from 2024.)
  income_limit_2025: No income limit specified.
  claimed_on: 2025 Form 1, line 46 (count in 46a x $440); Schedule DI for dependent information; Form 1-NR/PY for
    nonresidents/part-year residents.
  citation:
    source: 2025 Form 1 Instructions (MA DOR), Line 46 Child and Family Tax Credit ($440 per qualifying individual;
      noncustodial-parent rule for tax years beginning on or after January 1, 2024)
    url: https://www.mass.gov/doc/2025-form-1-instructions/download
- name: Limited Income Credit (with No Tax Status)
  type: nonrefundable
  eligibility: 'Low-income MA filers whose Massachusetts AGI exceeds the No Tax Status threshold but falls within
    the Limited Income Credit range. 2025 No Tax Status: MA AGI $8,000 or less (single); $14,400 or less plus $1,000
    per dependent (head of household); $16,400 or less plus $1,000 per dependent (married filing jointly). 2025 Limited
    Income Credit range: MA AGI between $8,000 and $14,000 (single); between $14,400 and $25,200 plus $1,750 per dependent
    (head of household); between $16,400 and $28,700 plus $1,750 per dependent (married filing jointly). Married filing
    separately qualifies for neither. The Limited Income Credit is an alternative tax calculation, computed via the
    Massachusetts AGI Worksheet / Line 29 worksheet in the Form 1 instructions. (Thresholds unchanged from 2024.)'
  claimed_on: 2025 Form 1 — No Tax Status oval on line 27 (enter 0 in line 28); Limited Income Credit on line 29;
    Schedule NTS-L-NR/PY for nonresidents and part-year residents.
  citation:
    source: 2025 Form 1 Instructions (MA DOR) — Massachusetts AGI worksheet, No Tax Status and Limited Income Credit
      thresholds and the Line 27/29 instructions
    url: https://www.mass.gov/doc/2025-form-1-instructions/download
filing_requirement:
  note: 'RESIDENT: "If you were a resident of Massachusetts and your gross income was more than $8,000 — whether received
    from sources inside or outside of Massachusetts — you are required to file a Massachusetts income tax return. If
    your gross income was $8,000 or less, you do not need to file a return." NONRESIDENT: "If you did not live in
    Massachusetts but received Massachusetts source income in excess of your personal exemption amount multiplied by
    the ratio of your Massachusetts income to your total income, you must file as a nonresident on the Nonresident/Part-Year
    Resident Income Tax Return, Form 1-NR/PY." PART-YEAR RESIDENT: if during the taxable year you moved to Massachusetts
    or terminated MA residency, and gross income was more than $8,000 (from sources inside or outside MA), file as
    a part-year resident on Form 1-NR/PY. A joint Form 1 is generally not allowed unless both spouses were MA residents
    for the same portion of 2025; where one spouse''s Massachusetts gross income does not exceed $8,000 the couple
    may elect married filing separate status via the Form 1 "joint filing exemption" oval. Source: 2025 Form 1 Instructions
    (Filing Your Massachusetts Return; Major 2025 Tax Changes).'
