  Machine's 200-status captures of the official mass.gov document URLs (instructions capture 20260425134124; Form
  1 capture 20260420000228, digest PVUOCKIXXY7LBARA76BUJRFZWSQZIJF5, which is byte-identical across three separate
  captures). No fact in this record relies on a non-.gov-originated document.
- The 2025 Form 1 tax table pages (mandatory for line 21 amounts under $24,000) were not included in the fetched
  instructions capture; the table's band structure and any within-band divergence from exact 5% multiplication were
  not re-verified.
- Form 1-NR/PY 2025 instructions were not fetched; nonresident/part-year specifics are carried from the resident
  instructions' summaries. Note the 2025 resident-instruction wording of the NONRESIDENT threshold is the prorated
  personal exemption alone (personal exemption x the ratio of MA income to total income) — it no longer states the
  "lesser of $8,000 or the prorated exemption" formulation used in the 2024 pack. Confirm on Form 1-NR/PY.
- The new/revised 2025 credits referenced only by TIR (TIR 24-16, TIR 25-5) and the Climatetech Tax Incentive Program
  components (including the Climatetech Incentive Jobs Credit) were not transcribed; the new 830 CMR 62B.2.4 non-resident
  real-estate-closing withholding regime is recorded as a change but its exemptions and rates were not extracted.
tax:
  citation:
    source: 'MA DOR — 2025 Form 1 Massachusetts Resident Income Tax Return (form face): line 2a ''Personal exemptions.
      Single/Married filing separately ($4,400), Head of household ($6,800), Married filing jointly ($8,800)''; line
      2b number of dependents x $1,000; line 2c age 65 or over before 2026 x $1,700; line 2d blindness x $2,200; line
      17 ''5.0% INCOME AFTER DEDUCTIONS. Subtract line 16 from line 10. Not less than 0''; line 18 total exemption amount
      (from line 2g); line 19 ''5.0% INCOME AFTER EXEMPTIONS. Subtract line 18 from line 17. Not less than 0''; line
      20 INTEREST AND DIVIDEND INCOME (from Schedule B, line 38); line 21 ''TOTAL TAXABLE 5.0% INCOME. Add lines 19
      and 20''; line 22 ''TAX ON 5.0% INCOME (from tax table). If line 21 is more than $24,000, multiply by .05''; line
      28b ''4% Surtax (from Schedule 4% Surtax, line 7)''. Second pass: 2025 Form 1 Instructions — Line 22 ''If line
      21 is less than $24,000, find the proper tax by using the tax tables found in the back of this booklet. If line
      21 is greater than $24,000 multiply by 0.05 and enter the result in line 22''; 4% Surtax ''Starting with tax year
      2023, personal income taxpayers must pay an additional 4% on taxable income over $1,000,000, increased annually
      for inflation. For the 2025 tax year, the threshold is $1,083,150.'' — both passes agree. (mass.gov returns HTTP
      403 to non-browser fetchers; both documents were retrieved from the Wayback Machine''s 200-status captures of
      the SAME official mass.gov URLs, the same provenance path as the shipped MA form pack.)'
    url: https://www.mass.gov/doc/2025-form-1-instructions/download
  flat_rate: 0.05
  base: state_gross_income
  tax_line: 'Form 1 line 22: ''TAX ON 5.0% INCOME (from tax table). If line 21 is more than $24,000, multiply by .05''
    (line 21 = TOTAL TAXABLE 5.0% INCOME = line 19 income after exemptions + line 20 Schedule B interest and dividend
    income).'
  exemptions:
    dependent:
      amount: 1000
      note: 'Form 1 line 2b: $1,000 per dependent (''Number of dependents (do not include yourself or your spouse). Enclose
        Schedule DI ... x $1,000''). APPLIED by calc.state_tax via dependents_count.'
    age_65:
      amount: 1700
      note: 'Form 1 line 2c: $1,700 per age-65-or-over-before-2026 box (You/Spouse). NOT applied by calc.state_tax — subtract
        it from the supplied base or compute line 2c on the form.'
    blind:
      amount: 2200
      note: 'Form 1 line 2d: $2,200 per blindness box (You/Spouse). NOT applied by calc.state_tax — subtract it from the
        supplied base or compute line 2d on the form.'
  standard_deduction:
    single: 4400
    married_filing_jointly: 8800
    married_filing_separately: 4400
    head_of_household: 6800
  notes:
  - 'Figures unchanged from 2024 (both passes re-verified for 2025): the 5.0% rate, the line 2a-2d exemption amounts
    ($4,400/$6,800/$8,800 personal; $1,000 dependent; $1,700 age 65+; $2,200 blindness) and the $24,000 tax-table
    cutoff are identical. What MOVED for 2025 is the 4% surtax threshold, indexed $1,053,750 -> $1,083,150, plus credit
    figures outside this block (Senior Circuit Breaker maximum $2,730 -> $2,820; the MA EITC''s referenced federal
    earned-income ceiling $66,819 -> $68,675).'
  - 'Base guidance: supply 2025 Form 1 line 17 (''5.0% INCOME AFTER DEDUCTIONS'' = line 10 TOTAL 5.0% INCOME minus
    line 16 total deductions) PLUS line 20 (interest and dividend income from Schedule B, line 38) — i.e., the Part
    B 5.0% taxable income BEFORE the line 18 exemptions. The op subtracts the line 2a personal exemption (shipped
    per filing status in standard_deduction) and $1,000 per dependent (line 2b), reproducing lines 18-21, then multiplies
    by 5% (line 22). Filers with line 2c-2f exemptions (age 65+ $1,700 each, blindness $2,200 each, medical/dental
    from U.S. Schedule A line 4, adoption) must subtract those amounts from the supplied base themselves.'
  - 'Modeling decision — standard_deduction carries the Form 1 line 2a PERSONAL EXEMPTION: Massachusetts has NO standard
    deduction; line 2a is a fixed per-filing-status base reduction ($4,400 single or married filing separately, $6,800
    head of household, $8,800 married filing jointly) and ships in the per-status standard_deduction slot because
    the per-person ''personal'' exemption key cannot represent the $6,800 head-of-household amount. Pass exemptions_count=0
    — the taxpayer/spouse exemption is already inside the per-status amount.'
  - 'CRITICAL — 4% surtax NOT modeled: ''Starting with tax year 2023, personal income taxpayers must pay an additional
    4% on taxable income over $1,000,000, increased annually for inflation. For the 2025 tax year, the threshold is
    $1,083,150'' (2025 Form 1 instructions, Major 2025 Tax Changes). The surtax is computed on Schedule 4% Surtax
    and entered on Form 1 line 28b, and it applies to the SUM of all classes of taxable income (the 5.0% Part B income
    modeled here PLUS Schedule B 8.5%/12% income PLUS Schedule D long-term capital gains) over $1,083,150. It is NOT
    a marginal bracket of the 5.0% schedule — encoding it as one would misstate Massachusetts'' class-separated system.
    If total taxable income across all classes exceeds $1,083,150, complete Schedule 4% Surtax on the form. (Related
    2025 change: employers must withhold on wages once an employee''s wages equal or exceed $1,000,000.)'
  - 'Class separation (PA-like): Massachusetts taxes income classes separately, and this op computes ONLY the Form
    1 line 22 tax on 5.0% income. Not modeled: Schedule B 8.5% income (line 23a x .085 — short-term capital gains
    and certain other gains), 12% income (line 23b x .12 — long-term gains on collectibles and pre-1996 installment
    sales), and Schedule D long-term capital gain tax (line 24). Never merge those classes into the supplied base.'
  - 'Tax-table mandate: ''If line 21 is less than $24,000, find the proper tax by using the tax tables found in the
    back of this booklet. If line 21 is greater than $24,000 multiply by 0.05'' (Line 22 instructions, unchanged for
    2025). Below $24,000 the filed form uses the booklet table, which can differ from exact multiplication by a small
    amount within a table band; the fetched instructions capture did not include the table pages, so the band structure
    was not re-verified this session.'
  - 'Optional 5.85% rate (NOT modeled): Form 1 line 22 carries an oval to voluntarily pay tax at 5.85% on income that
    would otherwise be taxed at 5.0%; the election does not apply to the 8.5%/12% items.'
  - 'Excess exemptions: if line 18 exemptions exceed line 17, the form sets line 19 to 0 and the excess may be applied
    against interest and dividend income and income taxed at 8.5% or 12%, then against long-term capital gain income
    (the instructions'' Line 36 / Schedule D Line 20 worksheet, available to single, head of household and married-filing-jointly
    filers). Because this op subtracts the exemptions from the combined line 17 + line 20 base, the offset against
    Part B interest/dividends is reproduced automatically; the offset against the 8.5%/12% and long-term-gain classes
    is NOT modeled (fill in the Form 1 line 24 oval if excess exemptions were used in calculating lines 20, 23 or
    24).'
  - 'No Tax Status / Limited Income Credit (Form 1 lines 27-29, NOT modeled): Massachusetts AGI of $8,000 or less
