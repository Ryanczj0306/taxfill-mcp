# MA state knowledge — tax year 2024. Fetched + cited from the MA DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form 1
# instructions, then independently re-checked against the 2024 Form 1 blank itself
# (which prints the $4,400/$6,800/$8,800 line 2a exemptions, the $1,000/$1,700/$2,200
# line 2b-2d multipliers, the line 22 '$24,000 / multiply by .05' tax line, and the
# line 28b 4% surtax line). mass.gov sits behind Akamai and 403s non-browser fetchers,
# so BOTH documents were recovered from the Wayback Machine's archive of the SAME
# official mass.gov URLs — the identical provenance path the shipped MA form pack used.
# HEADLINE 2024 CHANGES (Major 2024 Tax Changes): (1) the up-to-$100/$200 deduction for
# Massachusetts bank interest is REPEALED for tax years beginning on or after 1/1/2024
# (2024 Form 1 line 5 no longer carries the exemption boxes); (2) married couples who
# file a joint federal return MUST file a joint Massachusetts return (TIR 24-4);
# (3) the 4% surtax threshold indexed to $1,053,750; (4) Child and Family Tax Credit
# rose $310 -> $440 per qualifying individual, with a noncustodial-parent expansion
# (TIR 24-13); (5) Senior Circuit Breaker maximum rose to $2,730 (income limits
# $72,000/$91,000/$109,000; valuation cap $1,172,000); (6) Angel Investor Tax Credit
# repealed.
jurisdiction: states/ma
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Net result: treaty-exempt income is NOT re-taxed by MA, so conforms = true — but the mechanism is
  an EXPLICIT DEDUCTION, not passive federal-AGI conformity. Important nuance: MA''s Form 1 does NOT start from
  federal AGI. It builds Massachusetts gross income from its own categories. Line 3 (Wages) is taken from W-2 state
  wages (Box 16), and Massachusetts gross income can include items not subject to U.S. income tax. So treaty-exempt
  income that an employer reports in state wages would otherwise land in MA income. MA neutralizes this with the
  dedicated Schedule Y, Line 4 deduction: ''Amounts Excludible Under MGL Ch 41, § 111F or U.S. Tax Treaty Included
  in Form 1, Line 3'' — the 2024 Form 1 instructions repeat the 2023 rule: a taxpayer with income exempt under a
  United States tax treaty enters the excludible amount that was included in Form 1, line 3 on Schedule Y line 4
  and fills in the treaty oval. Because Schedule Y reduces income, the treaty-exempt amount is deducted back out
  and is not taxed. PRACTICAL NOTE: unlike a pure federal-AGI conformity state where treaty income flows out automatically,
  in MA the taxpayer must affirmatively claim the Schedule Y, Line 4 deduction (and fill the treaty oval) — if treaty
  wages appear in W-2 Box 16/Form 1 line 3 and the deduction is not claimed, the income would be taxed. Source:
  2024 Form 1 Instructions, Schedule Y Line 4 (income exempt under a U.S. tax treaty) and Line 3 (Wages, Salaries,
  Tips).'
citation:
  source: 2024 Form 1 Instructions (MA DOR) — Major 2024 Tax Changes (bank-interest deduction repeal; joint-filing
    mandate TIR 24-4; 4% surtax threshold $1,053,750; Child and Family Tax Credit $440 with TIR 24-13 expansion;
    Circuit Breaker maximum $2,730), residency definitions, $8,000 threshold, MA gross income definition, Line 3
    wages from W-2 state wages, Schedule Y Line 4 U.S. tax treaty deduction, Filing Due Dates (April 15, 2025),
    mailing PO Box 7000 / 7003, mass.gov/masstaxconnect. Retrieved via the Wayback Machine archive of the official
    mass.gov URL (mass.gov 403s non-browser fetchers).
  url: https://www.mass.gov/doc/2024-form-1-instructions/download
starts_from: 'federal wages (W-2 state wages, Box 16) — NOT federal AGI. MA Form 1 builds Massachusetts gross income
  from its own income categories (5.0% income incl. wages from W-2; interest/dividends on Schedule B; capital gains
  on Schedule D); it does not begin from a single federal AGI line. The header boxes a/b (total federal income from
  U.S. Form 1040 line 9; total federal AGI from U.S. Form 1040 line 11) are informational. NOTE (2024 change): Form
  1 line 5 is now plain ''Massachusetts bank interest'' — the former up-to-$100/$200 exemption boxes are gone (deduction
  repealed for tax years beginning on or after 1/1/2024).'
residency:
  summary: 'MA recognizes four statuses (MGL ch 62). FULL-YEAR RESIDENT: your residence (domicile) is in Massachusetts
    for the entire year, OR you maintain a permanent place of abode in MA and spend more than 183 days in the aggregate
    in the state during the year (the statutory-resident test) — file Form 1. ''Residence'' and ''domicile'' denote
    the place where you have your permanent home and to which, whenever absent, you intend to return. NONRESIDENT:
    not a MA resident but received Massachusetts-source income (e.g., from a MA job) — file Form 1-NR/PY. PART-YEAR
    RESIDENT: you moved into or out of MA during the year; income/deductions/exemptions are apportioned based on
    days resident or MA-source income — file Form 1-NR/PY. NONRESIDENT AND PART-YEAR RESIDENT: meet both criteria;
    file Form 1-NR/PY and complete Schedule R/NR (Resident/Nonresident Worksheet). NEW for 2024 (TIR 24-4): married
    couples must file a joint Massachusetts return for any year in which they file a joint federal return, unless
    an exception applies.'
forms:
  resident: Form 1 — Massachusetts Resident Income Tax Return (2024)
  part_year_or_nonresident: Form 1-NR/PY — Massachusetts Nonresident or Part-Year Resident Income Tax Return (2024).
    Taxpayers who are both nonresident and part-year resident also complete Schedule R/NR (Resident/Nonresident
    Worksheet).
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Massachusetts Earned Income Tax Credit (EITC)
  type: refundable
  eligibility: Massachusetts residents (full- or part-year) who qualify for and claim the federal Earned Income
    Credit — earned income under $66,819 for 2024 (maximum may be lower depending on filing status and number of
    eligible children). MA adopts the federal expansion rules; a married person who is a victim of domestic abuse,
    living apart from their spouse at filing, may file married filing separately and still claim the MA EIC. Part-year
    residents prorate the credit by days resided in MA.
  amount: 40% of the federal earned income credit claimed on the taxpayer's federal return (U.S. Form 1040, line
    27). Refundable to the extent the credit exceeds total income tax payable.
  income_limit_2024: No separate MA income limit; tied to the federal EITC income/AGI limits for 2024 (federal earned-income
    ceiling referenced as $66,819).
  claimed_on: 2024 Form 1 (Resident), line 43 (enter qualifying children in 43a, federal EIC in 43b, multiply by
    40%); Form 1-NR/PY for nonresidents/part-year.
  citation:
    source: 2024 Form 1 Instructions (MA DOR), Line 43 Earned Income Credit — 40% of the federal amount; $66,819
      earned-income ceiling; domestic-abuse MFS rule
    url: https://www.mass.gov/doc/2024-form-1-instructions/download
- name: Senior Circuit Breaker Tax Credit (Real Estate Tax Credit for persons age 65+)
  type: refundable
  eligibility: Taxpayer must be age 65 or older, own or rent and occupy a principal residence in Massachusetts,
    and meet income/valuation limits. Married taxpayers generally must file jointly to claim.
  amount: 'For homeowners: the amount by which 2024 real estate tax payments exceed 10% of total income, capped
    at the 2024 maximum credit of $2,730. For renters: the amount by which 25% of rent paid for the principal residence
    exceeds 10% of total income, also capped at $2,730. Homeowners enter Schedule CB line 17; renters line 21.'
  income_limit_2024: '2024 total income may not exceed $72,000 (single, not head of household), $91,000 (head of
    household), or $109,000 (married filing jointly). Homeowners: assessed valuation of the principal residence
    for tax year 2024 may not exceed $1,172,000. Thresholds are adjusted annually for inflation.'
  claimed_on: 2024 Form 1, line 44 (enclose Schedule CB, Circuit Breaker Credit); Form 1-NR/PY for part-year residents.
  citation:
    source: 2024 Form 1 Instructions (MA DOR) — Annual Update of Circuit Breaker Tax Credit (maximum $2,730; income
      limits $72,000/$91,000/$109,000; valuation cap $1,172,000) and Line 44 instructions
    url: https://www.mass.gov/doc/2024-form-1-instructions/download
- name: Child and Family Tax Credit
  type: refundable
  eligibility: 'Resident (or part-year resident for the period of residency) maintaining a household that includes
    a qualifying individual: a dependent under age 13, a dependent age 65 or older or disabled, or a dependent or
    spouse physically or mentally incapable of self-care who principally lives with the taxpayer. NEW for 2024 (TIR
    24-13): a noncustodial parent may claim the credit for a child dependent age 13 or older who is physically or
    mentally incapable of caring for himself or herself. Cannot be claimed by a full-year nonresident.'
  amount: $440 for each qualifying individual for tax years beginning on or after Jan 1, 2024 (up from $310 in 2023),
    with no cap on the number of qualifying individuals (enter the count in line 46a and multiply by $440).
  income_limit_2024: No income limit specified.
  claimed_on: 2024 Form 1, line 46 (count in 46a x $440); Schedule DI for dependent information; Form 1-NR/PY for
    nonresidents/part-year residents.
  citation:
    source: 2024 Form 1 Instructions (MA DOR), Line 46 Child and Family Tax Credit ($440 per qualifying individual;
      TIR 24-13 noncustodial-parent expansion)
    url: https://www.mass.gov/doc/2024-form-1-instructions/download
- name: Limited Income Credit (with No Tax Status)
  type: nonrefundable
  eligibility: 'Low-income MA filers whose Massachusetts AGI exceeds the No Tax Status threshold but falls within
    the Limited Income Credit range. 2024 No Tax Status: MA AGI $8,000 or less (single); $14,400 or less plus $1,000
    per dependent (head of household); $16,400 or less plus $1,000 per dependent (married filing jointly). Limited
    Income Credit range: MA AGI up to $14,000 (single); $14,400-$25,200 plus $1,750 per dependent (head of household);
    $16,400-$28,700 plus $1,750 per dependent (married filing jointly). Married filing separately qualifies for
    neither. Computed via the Massachusetts AGI Worksheet / Line 29 worksheet in the Form 1 instructions.'
  claimed_on: 2024 Form 1 — No Tax Status oval on line 27 (enter 0 in line 28); Limited Income Credit on line 29;
    Schedule NTS-L-NR/PY for nonresidents and part-year residents.
  citation:
    source: 2024 Form 1 Instructions (MA DOR) — Massachusetts AGI worksheet, No Tax Status and Limited Income Credit
      thresholds and Line 27/29 instructions
    url: https://www.mass.gov/doc/2024-form-1-instructions/download
filing_requirement:
  note: 'RESIDENT: Must file Form 1 if a MA resident and gross income (from all sources, inside or outside MA) was
    more than $8,000; if $8,000 or less, no return required. NONRESIDENT: Must file Form 1-NR/PY if Massachusetts-source
    income exceeded the lesser of (a) $8,000, OR (b) the prorated personal exemption (personal exemption amount
    multiplied by the ratio of MA-source income to total income). PART-YEAR RESIDENT: Must file Form 1-NR/PY if
    gross income during the residency period was more than $8,000. NEW for 2024 (TIR 24-4): married couples filing
    a joint federal return must file a joint Massachusetts return unless an exception applies. Source: 2024 Form
    1 Instructions (Filing Your Massachusetts Return; Major 2024 Tax Changes).'
