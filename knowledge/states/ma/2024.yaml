# Flat-rate tax computation block (Phase G item G4, formerly-C3 adoption tranche) —
# consumed by calc.state_tax. Two-pass verification: figures drafted from the 2024
# Form 1 face (line 2a $4,400/$6,800/$8,800 personal exemptions; line 22 'from tax
# table. If line 21 is more than $24,000, multiply by .05'; line 28b 4% surtax), then
# independently re-checked against the 2024 Form 1 instructions (Line 22 text; the
# 2024 surtax threshold $1,053,750; the excess-exemptions worksheet). Both documents
# recovered from the Wayback archive of the official mass.gov URLs (mass.gov 403s
# non-browser fetchers), the same provenance path as the shipped MA form pack.
# Modeling decisions carried forward from 2023: flat_rate 0.05 on Part B (5.0%) income
# ONLY — the 4% surtax and the 8.5%/12%/Schedule D classes are CRITICAL notes, never
# brackets (MA taxes classes separately, PA-style). The line 2a personal exemption is
# a fixed PER-STATUS base deduction on the Form 1 face, so it ships in the per-status
# standard_deduction slot (the per-person 'personal' key cannot express HoH's $6,800);
# line 2b dependents ship as an applied 'dependent' key; age-65/blind ship
# disclosed-only. 2024 deltas: surtax threshold $1,053,750; the line 5 bank-interest
# exemption is repealed (base note updated); exemption amounts unchanged.
tax:
  citation:
    source: 'MA DOR — 2024 Form 1 Massachusetts Resident Income Tax Return (form face): line 2a ''Personal exemptions.
      If single or married filing separately, enter $4,400. If head of household, enter $6,800. If married filing jointly,
      enter $8,800''; line 2b dependents x $1,000; line 2c age 65 or over before 2025 x $1,700; line 2d blindness x
      $2,200; line 17 ''5.0% INCOME AFTER DEDUCTIONS''; line 18 total exemption amount (from line 2g); line 19 ''5.0%
      INCOME AFTER EXEMPTIONS... Not less than 0''; line 20 INTEREST AND DIVIDEND INCOME (Schedule B, line 38); line
      21 ''TOTAL TAXABLE 5.0% INCOME. Add lines 19 and 20''; line 22 ''TAX ON 5.0% INCOME (from tax table). If line
      21 is more than $24,000, multiply by .05''; line 28b ''4% Surtax (from Schedule 4% Surtax, line 7)''. Second pass:
      2024 Form 1 Instructions — Line 22: ''If line 21 is less than $24,000, find the proper tax by using the tax tables
      found in the back of this booklet. If line 21 is greater than $24,000 multiply by 0.05''; ''For the 2024 tax year,
      the threshold is $1,053,750'' (4% surtax, TIR 23-12 and the 4% Surtax FAQs); Major 2024 Tax Changes (bank-interest
      deduction repeal; TIR 24-4 joint-filing mandate) — both passes agree. (mass.gov returns HTTP 403 to non-browser
      fetchers; both documents were retrieved from the Wayback Machine''s archive of the SAME official mass.gov URLs,
      the same provenance path as the shipped MA form pack.)'
    url: https://www.mass.gov/doc/2024-form-1-instructions/download
  flat_rate: 0.05
  base: state_gross_income
  tax_line: 'Form 1 line 22: ''TAX ON 5.0% INCOME (from tax table). If line 21 is more than $24,000, multiply by .05''
    (line 21 = TOTAL TAXABLE 5.0% INCOME = line 19 income after exemptions + line 20 Schedule B interest and dividend
    income).'
  exemptions:
    dependent:
      amount: 1000
      note: 'Form 1 line 2b: $1,000 per dependent (do not include yourself or your spouse; enclose Schedule DI). APPLIED
        by calc.state_tax via dependents_count.'
    age_65:
      amount: 1700
      note: 'Form 1 line 2c: $1,700 per age-65-or-over-before-2025 box (You/Spouse). NOT applied by calc.state_tax — subtract
        it from the supplied base or compute line 2c on the form.'
    blind:
      amount: 2200
      note: 'Form 1 line 2d: $2,200 per blindness box (You/Spouse). NOT applied by calc.state_tax — subtract it from the
        supplied base or compute line 2d on the form.'
  standard_deduction:
    single: 4400
    married_filing_jointly: 8800
    married_filing_separately: 4400
    head_of_household: 6800
  notes:
  - 'Figures unchanged from 2023 (both passes re-verified for 2024): the 5.0% rate, the line 2a-2d exemption amounts,
    and the $24,000 tax-table cutoff are identical; the 4% surtax threshold INDEXED UP to $1,053,750 (2023: $1,000,000),
    and the former line 5 up-to-$100/$200 Massachusetts bank interest exemption is REPEALED for 2024 (line 5 is now
    plain ''Massachusetts bank interest'').'
  - 'Base guidance: supply 2024 Form 1 line 17 (''5.0% INCOME AFTER DEDUCTIONS'' = line 10 TOTAL 5.0% INCOME minus
    line 16 total deductions) PLUS line 20 (interest and dividend income from Schedule B, line 38) — i.e., the Part
    B 5.0% taxable income BEFORE the line 18 exemptions. The op subtracts the line 2a personal exemption (shipped
    per filing status in standard_deduction) and $1,000 per dependent (line 2b), reproducing lines 18-21, then multiplies
    by 5% (line 22). Filers with line 2c-2f exemptions (age 65+ $1,700 each, blindness $2,200 each, medical/dental
    from U.S. Schedule A line 4, adoption) must subtract those amounts from the supplied base themselves.'
  - 'Modeling decision — standard_deduction carries the Form 1 line 2a PERSONAL EXEMPTION: Massachusetts has NO standard
    deduction; line 2a is a fixed per-filing-status base reduction ($4,400 single or married filing separately, $6,800
    head of household, $8,800 married filing jointly) and ships in the per-status standard_deduction slot because
    the per-person ''personal'' exemption key cannot represent the $6,800 head-of-household amount. Pass exemptions_count=0
    — the taxpayer/spouse exemption is already inside the per-status amount.'
  - 'CRITICAL — 4% surtax NOT modeled: ''Starting with tax year 2023, personal income taxpayers must pay an additional
    4% (4% surtax) on taxable income over $1,000,000, increased annually for inflation (surtax threshold). For the
    2024 tax year, the threshold is $1,053,750'' (2024 Form 1 instructions; TIR 23-12 and the 4% Surtax FAQs). The
    surtax is computed on Schedule 4% Surtax and entered on Form 1 line 28b, and it applies to the SUM of all classes
    of taxable income (the 5.0% Part B income modeled here PLUS Schedule B 8.5%/12% income PLUS Schedule D long-term
    capital gains) over $1,053,750. It is NOT a marginal bracket of the 5.0% schedule — encoding it as one would misstate
    Massachusetts'' class-separated system. If total taxable income across all classes exceeds $1,053,750, complete
    Schedule 4% Surtax on the form.'
  - 'Class separation (PA-like): Massachusetts taxes income classes separately, and this op computes ONLY the Form
    1 line 22 tax on 5.0% income. Not modeled: Schedule B 8.5% income (line 23a x .085 — short-term capital gains
    and certain other gains), 12% income (line 23b x .12 — collectibles, subject to a 50% deduction), and Schedule
    D long-term capital gain tax (line 24). Never merge those classes into the supplied base.'
  - 'Tax-table mandate: ''If line 21 is less than $24,000, find the proper tax by using the tax tables found in the
    back of this booklet. If line 21 is greater than $24,000 multiply by 0.05'' (Line 22 instructions, unchanged for
    2024). Below $24,000 the filed form uses the booklet table, which can differ from exact multiplication by a small
    amount within a table band; the fetched instructions capture did not include the table pages, so the band structure
    was not re-verified this session.'
  - 'Optional 5.85% rate (NOT modeled): Form 1 line 22 carries an oval to voluntarily pay tax at 5.85% on income otherwise
    taxed at 5.0%; the election does not apply to 8.5%/12% items.'
  - 'Excess exemptions: if line 18 exemptions exceed line 17, the form sets line 19 to 0 and the excess may be applied
    against interest and dividend income and 8.5%/12% income (Schedule B line 36 via the instructions worksheet),
    then against long-term capital gains (Schedule D line 20). Because this op subtracts the exemptions from the combined
    line 17 + line 20 base, the offset against Part B interest/dividends is reproduced automatically; the offset against
    the 8.5%/12% and long-term-gain classes is NOT modeled.'
  - 'No Tax Status / Limited Income Credit (Form 1 lines 27-29, NOT modeled): Massachusetts AGI of $8,000 or less
    (single), $14,400 or less plus $1,000 per dependent (head of household), or $16,400 or less plus $1,000 per dependent
    (married filing jointly) qualifies for No Tax Status — line 28 tax becomes 0 (married filing separately never
    qualifies). Limited Income Credit ranges: up to $14,000 single; $14,400-$25,200 plus $1,750 per dependent HoH;
    $16,400-$28,700 plus $1,750 per dependent MFJ. Check the Massachusetts AGI worksheet before relying on the computed
    tax.'
  - 'Massachusetts gross income is built from MA''s OWN categories, not federal AGI: Form 1 line 3 wages come from
    W-2 state wages (Box 16); income exempt under a U.S. tax treaty that landed in line 3 must be deducted on Schedule
    Y line 4 (fill the treaty oval). The header boxes a/b (federal total income / federal AGI) are informational only.
    NEW for 2024 (TIR 24-4): married couples filing a joint federal return must file a joint Massachusetts return
    unless an exception applies.'
  - 'Rounding: the instructions direct whole-dollar entry (''amounts between $1.50 and $2.00 should be entered as
    $2.00'' — a .50 tie rounds UP), consistent with this op''s rounding.'
  - 'Not modeled — credits and later lines: Limited Income Credit (line 29), taxes due other jurisdictions (line 30,
    Schedule OJC), Schedule CMS credits (line 31), the refundable 40%-of-federal Massachusetts EITC (line 43), the
    $440-per-qualifying-individual Child and Family Tax Credit (line 46, 2024 amount, up from $310), the Senior Circuit
    Breaker credit up to $2,730 (line 44), use tax (line 34), and the Schedule HC health-care penalty (line 35).'
