# Common California credits. Eligibility/structure are stable; the dollar limits
# are the 2025 booklet figures, re-confirmed against the HTML booklet edition.
credits_verification: 'Dollar limits below are transcribed from the cited 2025 FTB booklet and re-confirmed against
  the FTB HTML edition of the same booklet (two-pass: the $53,994/$107,988 renter''s-credit AGI ceilings and the
  $32,901 CalEITC earned-income ceiling were re-grepped out of the independently published HTML). Confirm your eligibility
  at the cited URL before relying on a figure.'
credits:
- name: 'Nonrefundable Renter''s Credit'
  type: nonrefundable
  eligibility: 'Full-year California resident who paid rent for at least half of 2025 on a non-property-tax-exempt
    principal residence in California; California AGI within the limit; did not claim (and spouse/RDP did not claim,
    subject to lived-apart exceptions) the homeowner''s property tax exemption; not living for more than half the
    year in the home of a person who can claim them as a dependent.'
  amount: '$60 (single); $120 (head of household, qualifying surviving spouse/RDP, or married/RDP filing jointly).
    Married/RDP filing separately: if both qualify and lived in the same rental, one may claim the full $120 or each
    may claim $60; if they lived apart all year, $60 each.'
  income_limit_2025: 'California adjusted gross income (Form 540 line 17) $53,994 or less (single or married/RDP filing
    separately); $107,988 or less (married/RDP filing jointly, head of household, or qualifying surviving spouse/RDP)'
  claimed_on: 'Form 540 line 46 (per the booklet Nonrefundable Renter''s Credit Qualification Record, pp. 25-26)'
  citation:
    source: '2025 Personal Income Tax Booklet (Form 540), Nonrefundable Renter''s Credit Qualification Record, pp.
      25-26; line 46 instructions'
    url: 'https://www.ftb.ca.gov/forms/2025/2025-540-booklet.pdf'
- name: 'California Earned Income Tax Credit (CalEITC)'
  type: refundable
  eligibility: 'Requires California wage income and/or net earnings from self-employment of less than $32,901 (2025).
    You do not need a child to qualify. Computed on form FTB 3514.'
  claimed_on: 'FTB 3514, then Form 540 line 75'
  citation:
    source: '2025 Personal Income Tax Booklet (Form 540), "$$$ for You" — California Earned Income Tax Credit (less
      than $32,901 of California wage income and/or self-employment net earnings); Form 540 line 75 instructions'
    url: 'https://www.ftb.ca.gov/forms/2025/2025-540-booklet.pdf'
- name: 'Young Child Tax Credit (YCTC)'
  type: refundable
  eligibility: 'Available if you qualified for the California EITC (or would have been allowed it but for earned
    income of zero dollars or less) and have at least one qualifying child younger than six years old as of the last
    day of the taxable year. Computed on form FTB 3514.'
  claimed_on: 'FTB 3514, then Form 540 line 76'
  citation:
    source: '2025 Personal Income Tax Booklet (Form 540), "$$$ for You" — Young Child Tax Credit; form FTB 3514'
    url: 'https://www.ftb.ca.gov/forms/2025/2025-540-booklet.pdf'

filing_requirement:
  note: 'California has its own gross-income and AGI threshold charts ("Do I Have to File?") that vary by filing
    status, age (under 65 vs 65 or older on 12/31/25) and number of dependents. 2025 chart values: single or head
    of household, under 65 — file if California gross income exceeds $22,941 (0 dependents), $38,774 (1), $50,649
    (2 or more), or if California AGI exceeds $18,353 / $34,186 / $46,061; single or HoH 65 or older — $30,591 /
    $42,466 / $51,966 gross and $26,003 / $37,878 / $47,378 AGI; married/RDP filing jointly or separately with both
    under 65 — $45,887 / $61,720 / $73,595 gross and $36,711 / $52,544 / $64,419 AGI (one spouse/RDP 65 or older
    $53,537 / $65,412 / $74,912 gross, $44,361 / $56,236 / $65,736 AGI; both 65 or older $61,187 / $73,062 / $82,562
    gross, $52,011 / $63,886 / $73,386 AGI); qualifying surviving spouse/RDP under 65 — $38,774 (1 dependent) /
    $50,649 (2 or more) gross and $34,186 / $46,061 AGI. A dependent of another person (any filing status, any age)
    files if income exceeds their standard deduction computed on the California Standard Deduction Worksheet for
    Dependents (larger of earned income or the $1,350 minimum, capped at the per-status chart amount). Read the full
    charts in the booklet.'
  citation:
    source: '2025 Personal Income Tax Booklet (Form 540), "Do I Have to File?" Steps 1-4 and the gross income / adjusted
      gross income chart, p. 4'
    url: 'https://www.ftb.ca.gov/forms/2025/2025-540-booklet.pdf'

