  base: federal_agi
  tax_line: 'Form 540, line 31 ''Tax''. Booklet p. 13: ''Line 31 – Tax. To figure your tax, use one or more of the
    following methods and check the matching box(es) on line 31, as applicable: Tax Table – If your taxable income
    on line 19 is $100,000 or less, use the tax table beginning on page 69... Tax Rate Schedules – If your taxable
    income on line 19 is over $100,000, use the tax rate schedule for your filing status on page 75.'' Rate schedule
    header (booklet p. 74): ''If the amount on Form 540, line 19 is over – / but not over – / Enter on Form 540, line
    31 [$X + Y%] of the amount over –''. Line 19 = line 17 (California AGI) minus line 18 (larger of California itemized
    deductions or the California standard deduction); ''Subtract line 18 from line 17. This is your taxable income.'''
