# California (FTB) state knowledge — tax year 2025 (state-year knowledge program).
#
# Loaded by taxfill_core.knowledge.load_state_knowledge as a StateKnowledge.
# Every figure is cited to ftb.ca.gov and was authored per the shipped, two-pass
# verified 2024 pack (same structure, same tax: modeling decisions, same CRITICAL
# notes) with every number RE-DERIVED from the 2025 documents — nothing carried
# forward.
#
# Verification status (honest provenance — this project never ships unverified
# numbers as authoritative):
#   - treaty non-conformity + residency rules + forms: CONFIRMED verbatim against
#     FTB Pub 1031 (2025) p. 10 "Tax Treaty" (the China-treaty $15,000 worked
#     example survives verbatim into the 2025 edition), fetched from ftb.ca.gov.
#   - brackets / standard deduction / exemption credits: THREE independent 2025
#     sources agree — the 2025 Form 540 booklet PDF (pp. 74-75 rate schedules,
#     p. 13 line 18/19/31, p. 14 line 32), the standalone "2025 California Tax
#     Rate Schedules" PDF, and the separately published HTML edition of the same
#     booklet (all 24 bracket bounds re-grepped out of the HTML).
#   - credits + logistics (mailing addresses, filing thresholds, deadlines):
#     transcribed from the 2025 Form 540 booklet PDF and re-confirmed against the
#     HTML booklet edition and the standalone 2025 Form 540 PDF.
#
# 2025 CHANGES vs the 2024 pack (all found in the 2025 booklet, none inferred):
#   - Every bracket bound moved: California applied a 3.0% inflation factor to the
#     2024 Schedule X/Z bounds (Schedule Y = exactly 2x Schedule X). Verified by
#     re-deriving each 2025 bound as round(2024_bound x 1.03) — all 18 primitive
#     bounds reproduce to the dollar, and all 27 printed "$X + Y%" constants
#     reconcile against cumulative bracket sums.
#   - Standard deduction $5,540/$11,080 -> $5,706/$11,412; dependent minimum
#     standard deduction $1,300 -> $1,350.
#   - Exemption credits $149/$461 -> $153/$475; the line 32 AGI limitation
#     thresholds $244,857/$489,719/$367,291 -> $252,203/$504,411/$378,310.
#   - The 1% surcharge over $1,000,000 taxable income was RENAMED: the Mental
#     Health Services Act became the Behavioral Health Services Act for taxable
#     years beginning on or after 2025-01-01, so Form 540 line 62 is now the
#     "Behavioral Health Services Tax". Same 1% rate, same $1,000,000 threshold,
#     same line — still NOT modeled (see tax.notes).
#   - CalEITC earned-income ceiling $31,951 -> $32,901; renter's credit CA AGI
#     limits $52,421/$104,842 -> $53,994/$107,988 (credit still $60/$120).

jurisdiction: states/ca
tax_year: 2025
income_tax: true

# THE critical CA fact (confirmed verbatim, FTB Pub 1031 2025 p. 10): California
# does NOT conform to federal tax treaties — income exempt from federal tax under
# a treaty is STILL taxable by California. Directly hits NRA / F-1 / J-1 filers.
conforms_to_federal_treaties: false
treaty_note: 'California does not conform to federal income tax treaties. FTB Pub. 1031 (2025), Section on Tax
  Treaty, p. 10, verbatim: "A tax treaty between the U.S. Government and a foreign country may exempt some types
  of income from federal taxation. Generally, unless the treaty specifically excludes the income from taxation by
  California, the income is taxable." Worked Example 1 (unchanged from the 2024 edition): a resident of China doing
  research at a California university received $15,000 of teaching/research wages excludable for federal purposes
  under the U.S.-China treaty — determination: "Although the wages may be exempt from income for federal income
  tax purposes, the wages will be taxable by California... Tax treaties between the United States and other countries
  which expressly limit their application to federal income taxes do not apply to California." The $15,000 is included
  on Schedule CA (540NR), Part II, Section A, line 1a, column C. California also disallows the foreign tax credit
  and the foreign earned income exclusion (same publication, "Foreign Tax Credit or Foreign Earned Income Exclusion").'
citation:
  source: 'FTB Publication 1031 (2025), Guidelines for Determining Resident Status — Tax Treaty section (p. 10)'
  url: 'https://www.ftb.ca.gov/forms/2025/2025-1031-publication.pdf'

residency:
  resident: 'A California resident is taxed on ALL income (worldwide), regardless of source.'
  nonresident: 'A nonresident is taxed only on income from California sources. Nonresidents of California are not
    taxed on pensions received after December 31, 1995.'
  part_year: 'A part-year resident is taxed on all income received while a California resident, plus California-source
    income received while a nonresident. Form 540NR computes taxable income as if you were a California resident
    for the entire year, then prorates.'
  domicile: 'Domicile is the place where you voluntarily establish yourself and family, not merely for a special
    or limited purpose, but with the present intention of making it your true, fixed, permanent home and principal
    establishment — the place to which you intend to return whenever absent. You can have only one domicile at a
    time; once acquired you retain it until you acquire another. A change of domicile requires abandonment of the
    prior domicile, physically moving to and residing in the new locality, and intent to remain there permanently
    or indefinitely as demonstrated by your actions. Maintenance of a marital abode in California is a significant
    factor in establishing California domicile.'
  closest_connection: 'Residency follows your closest connections; in using the factors (home, family, time, licenses,
    registrations, bank accounts, voter registration) it is the STRENGTH of your ties, not the number, that decides
    — no one factor is determinative and all must be considered.'
  citation:
    source: 'FTB Publication 1031 (2025), Guidelines for Determining Resident Status — residency/temporary or transitory
      purposes/income taxable by California/meaning of domicile sections (pp. 5-11)'
    url: 'https://www.ftb.ca.gov/forms/2025/2025-1031-publication.pdf'

