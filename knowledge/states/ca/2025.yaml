  notes:
  - 'Base guidance: Supply California adjusted gross income — 2025 Form 540, line 17 (''California adjusted gross
    income. Combine line 15 and line 16''), i.e. federal AGI (line 13) plus California additions minus California
    subtractions per Schedule CA (540). Do NOT supply unmodified federal AGI: California does not conform to federal
    income tax treaties (treaty-exempt income is added back on Schedule CA) and has many other adjustments. The op
    subtracts the shipped per-status standard deduction to reproduce line 19 (taxable income, floored at 0) and applies
    the rate schedule to reproduce line 31 — the tax BEFORE exemption credits (line 32) and special credits.'
  - 'Adjudication note (two-pass): base is federal_agi — Form 540 line 13 is federal AGI and line 17 California AGI
    = federal AGI +/- Schedule CA (540) adjustments; supply line 17 as taxable_base (the op subtracts the line 18
    standard deduction). California exemptions are $153/$475 CREDITS (lines 7-10), so vectors pass zero counts by
    design. Bracket bounds were adjudicated three ways: the booklet pp. 74-75 schedules, the standalone 2025 Tax Rate
    Schedules PDF, and the HTML booklet edition all print the same 24 bounds; independently, every 2025 bound reproduces
    as round(2024 bound x 1.03) with Schedule Y = exactly 2x Schedule X, so the 3.0% indexing is confirmed rather
    than assumed.'
  - 'EXEMPTIONS ARE TAX CREDITS, NOT DEDUCTIONS — the op does not model them: California''s personal exemption ($153
    per exemption, 2025 Form 540 lines 7-9: personal, blind, senior) and dependent exemption ($475 per dependent,
    line 10) are exemption CREDITS totaled on line 11 and subtracted from TAX on Form 540 line 32 — they never reduce
    taxable income. This op reproduces line 31 (tax before exemption credits) only; subtract the line 32 credits (and
    any special credits, lines 40-47) on the form.'
  - 'Exemption-credit AGI limitation (not modeled): if federal AGI (Form 540 line 13) exceeds $252,203 (single or
    married/RDP filing separately), $504,411 (MFJ or qualifying surviving spouse/RDP), or $378,310 (head of household),
    the line 32 exemption credits are reduced via the AGI Limitation Worksheet (booklet p. 14). These 2025 thresholds
    replace the 2024 $244,857/$489,719/$367,291.'
  - 'Table mandate below $100,000 — ''Tax Table – If your taxable income on line 19 is $100,000 or less, use the tax
    table beginning on page 69'' and ''Use only if your taxable income on Form 540, line 19 is more than $100,000.
    If $100,000 or less, use the Tax Table'' (booklet pp. 13, 74): bracket math may differ by a few dollars from the
    table amount within a $100 band; the filed form must use the Tax Table (booklet pp. 69-74).'
  - '1% surcharge over $1,000,000 taxable income is NOT modeled, and it was RENAMED for 2025: ''Behavioral Health
    Services Act – For taxable years beginning on or after January 1, 2025, the Mental Health Services Act has been
    renamed to the Behavioral Health Services Act. Therefore, references to the Mental Health Services Tax have been
    renamed to Behavioral Health Services Tax'' (2025 booklet, 2025 Tax Law Changes/What''s New). Form 540 line 62
    is now the Behavioral Health Services Tax: taxable income (line 19) less $1,000,000, times 1%, whole dollars only.
    Same rate, same threshold, same line as the 2024 Mental Health Services Tax.'
  - Alternative Minimum Tax (Form 540 line 61, Schedule P (540)) and other taxes/credit recapture (line 63, e.g. FTB
    3805P early-distribution tax, IRC 409A NQDC 5% tax) are NOT modeled. FTB 3800 (tax for certain children with unearned
    income) and FTB 3803 (parents' election to report a child's interest/dividends) change the line 31 computation
    and are NOT modeled.
  - 'Standard-deduction gates NOT modeled: a person claimable as a dependent on another''s return must use the California
    Standard Deduction Worksheet for Dependents (larger of earned income or the $1,350 minimum standard deduction
    for 2025, up from $1,300 for 2024, capped at the regular per-status amount) — not the chart amount; married/RDP
    filing separately, both spouses/RDPs must either both itemize or both take the standard deduction; itemizers enter
    California itemized deductions from Schedule CA (540) Part II line 30 on line 18 instead of the standard deduction.
    For California, deductions for net disaster losses are allowed only to itemizers (no standard-deduction add-on
    as federally).'
  - Qualifying surviving spouse/RDP uses Schedule Y — identical to married/RDP filing jointly (the engine's QSS-to-MFJ
    mapping matches the published schedule exactly). Married/RDP filing separately uses Schedule X, the same printed
    schedule as Single (copied from the schedule, not derived; note CA MFS is NOT half of MFJ at the bracket boundaries
    — it equals the Single schedule, and Schedule Y is exactly 2x Schedule X).
  - 'Base caution: Form 540 line 17 (California AGI) differs from federal AGI via Schedule CA (540) adjustments —
    notably California does NOT conform to federal income tax treaties (treaty-exempt income is added back), disallows
    the foreign earned income exclusion and the foreign tax credit, and subtracts items like Social Security benefits.
    Registered domestic partners (RDPs) file using the married/RDP statuses with recalculated federal amounts (FTB
    Pub. 737).'
  - 'Printed ''$X + Y% of the amount over $Z'' constants verified against cumulative bracket sums: all 27 constants
    (9 per schedule) reconcile, largest print-rounding divergence $0.01 (Schedule X''s $30,986.19 / $38,638.27 / $72,219.84
    half-cent chain) — bracket math and the printed schedules agree.'
  - 'Rounding: the booklet''s worked example (p. 75) rounds the schedule result to whole dollars for line 31 — Chris
    and Pat Smith, MFJ, taxable income $125,000: $3,974.82 + 8% x $9,916 = $4,768.10, entered as $4,768 — consistent
    with this op''s round-half-up-to-whole-dollars behavior.'
  - '2025 filing-season schedule confirmed final: California had no mid-year 2025 rate change; the nine rates 1/2/4/6/8/9.3/10.3/11.3/12.3%
    are unchanged from 2024 and only the bounds were indexed (3.0%). These are the schedules printed in the final
    2025 booklet used for the 2026 filing season and republished unchanged in the standalone 2025 Tax Rate Schedules
    PDF.'
