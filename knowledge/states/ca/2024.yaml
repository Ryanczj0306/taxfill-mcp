  base: federal_agi
  tax_line: 'Form 540, line 31 ''Tax''. Booklet p. 13: ''Line 31 – Tax. To figure your tax, use one or more of the
    following methods...: Tax Table – If your taxable income on line 19 is $100,000 or less, use the tax table beginning
    on page 69... Tax Rate Schedules – If your taxable income on line 19 is over $100,000, use the tax rate schedule
    for your filing status on page 75.'' Rate schedule header (p. 75): ''If the amount on Form 540, line 19 is over
    – / but not over – / Enter on Form 540, line 31 [$X + Y% ] of the amount over –''. Line 19 = line 17 (California
    AGI) minus line 18 (larger of California itemized deductions or California standard deduction); ''Subtract line
    18 from line 17. This is your taxable income. If less than zero, enter -0-''.'
  exemptions: {}
  standard_deduction:
    single: 5540
    married_filing_jointly: 11080
    married_filing_separately: 5540
    head_of_household: 11080
  notes:
  - 'Base guidance: Supply California adjusted gross income — 2024 Form 540, line 17 (''California adjusted gross
    income. Combine line 15 and line 16''), i.e. federal AGI (line 13) plus California additions minus California
    subtractions per Schedule CA (540). Do NOT supply unmodified federal AGI: California does not conform to federal
    income tax treaties (treaty-exempt income is added back on Schedule CA) and has other adjustments. The op subtracts
    the shipped per-status standard deduction to reproduce line 19 (taxable income, floored at 0) and applies the
    rate schedule to reproduce line 31 — the tax BEFORE exemption credits (line 32) and special credits.'
  - 'Adjudication note (two-pass): base is federal_agi — Form 540 line 13 is federal AGI and line 17 California AGI
    = federal AGI +/- Schedule CA (540) adjustments; supply line 17 as taxable_base (the op subtracts the line 18
    standard deduction). California exemptions are $149/$461 CREDITS (lines 7-10), so vectors pass zero counts by
    design.'
  - 'EXEMPTIONS ARE TAX CREDITS, NOT DEDUCTIONS — the op does not model them: California''s personal exemption ($149
    per exemption, 2024 Form 540 lines 7-9: personal, blind, senior) and dependent exemption ($461 per dependent,
    line 10) are exemption CREDITS totaled on line 11 and subtracted from TAX on Form 540 line 32 — they never reduce
    taxable income. This op reproduces line 31 (tax before exemption credits) only; subtract line 32 credits (and
    any special credits, lines 40-47) on the form.'
  - 'Exemption-credit AGI limitation (not modeled): if federal AGI (Form 540 line 13) exceeds $244,857 (single/MFS),
    $489,719 (MFJ/qualifying surviving spouse), or $367,291 (head of household), the line 32 exemption credits are
    reduced via the AGI Limitation Worksheet (booklet p. 14).'
  - 'Table mandate below $100,000 — ''Tax Table – If your taxable income on line 19 is $100,000 or less, use the tax
    table beginning on page 69'' (booklet pp. 13, 75): bracket math may differ by a few dollars within table bands;
    the filed form must use the Tax Table (booklet pp. 69-74).'
  - '1% Mental Health Services Tax is NOT modeled: if taxable income (line 19) exceeds $1,000,000, an additional 1%
    of the excess over $1,000,000 is due on Form 540 line 62 (booklet p. 16 worksheet).'
  - Alternative Minimum Tax (Form 540 line 61, Schedule P (540)) and other taxes/credit recapture (line 63, e.g. FTB
    3805P early-distribution tax, IRC 409A NQDC 5% tax) are NOT modeled. FTB 3800 (tax for certain children with unearned
    income) and FTB 3803 (parents' election to report child's interest/dividends) change the line 31 computation and
    are NOT modeled.
  - 'Standard-deduction gates NOT modeled: a person claimable as a dependent on another''s return must use the California
    Standard Deduction Worksheet for Dependents (larger of earned income or the $1,300 minimum standard deduction,
    capped at the regular per-status amount) — not the chart amount; married/RDP filing separately, both spouses must
    either both itemize or both take the standard deduction; itemizers enter California itemized deductions from Schedule
    CA (540) Part II line 30 on line 18 instead of the standard deduction.'
  - Qualifying surviving spouse/RDP uses Schedule Y — identical to married/RDP filing jointly (engine's QSS-to-MFJ
    mapping matches the published schedule exactly). Married/RDP filing separately uses Schedule X, the same printed
    schedule as Single (copied from the schedule, not derived; note CA MFS is NOT half of MFJ at the bracket boundaries
    — it equals the Single schedule).
  - 'Base caution: Form 540 line 17 (California AGI) differs from federal AGI via Schedule CA (540) adjustments —
    notably California does NOT conform to federal income tax treaties (treaty-exempt income is added back), disallows
    the foreign earned income exclusion and foreign tax credit, and subtracts items like Social Security benefits.
    Registered domestic partners (RDPs) file using the married/RDP statuses with recalculated federal amounts.'
  - 'Printed ''$X + Y% of amount over $Z'' constants verified against cumulative bracket sums: all 27 constants match
    to the cent (largest print-rounding divergence $0.004, on Schedule X''s $30,083.65 / $37,512.83 / $70,116.38 and
    Schedule Y''s $60,167.30 / $140,232.77 constants) — bracket math and the printed schedule agree.'
  - 'Rounding: the booklet''s worked example (p. 75) rounds the schedule result to whole dollars for line 31 ($4,920.48
    entered as $4,920), consistent with this op''s round-half-up-to-whole-dollars behavior.'
  - '2024 filing-season schedule confirmed final: California had no mid-year 2024 rate change; these are the inflation-indexed
    schedules printed in the final 2024 booklet used for the 2025 filing season (and republished unchanged in the
    standalone 2024 Tax Rate Schedules PDF).'
