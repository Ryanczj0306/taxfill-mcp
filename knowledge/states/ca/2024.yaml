# California (FTB) state knowledge — tax year 2024 (state-year knowledge program pilot).
#
# Loaded by taxfill_core.knowledge.load_state_knowledge as a StateKnowledge.
# Every figure is cited to ftb.ca.gov.
#
# Verification status (honest provenance — this project never ships unverified
# numbers as authoritative):
#   - treaty non-conformity + residency rules + forms: CONFIRMED verbatim
#     against FTB Pub 1031 (2024), fetched directly from ftb.ca.gov.
#   - credits + logistics (mailing addresses, filing thresholds, deadlines):
#     transcribed from the 2024 Form 540 booklet PDF fetched directly from
#     ftb.ca.gov, and re-confirmed against the separately published HTML
#     booklet / standalone 2024 Form 540 PDF (two-pass; unlike the 2023 pack,
#     the re-fetch was NOT blocked — no 403 caveat carries over).

jurisdiction: states/ca
tax_year: 2024
income_tax: true

# THE critical CA fact (confirmed verbatim, FTB Pub 1031 2024): California does
# NOT conform to federal tax treaties — income exempt from federal tax under a
# treaty is STILL taxable by California. Directly hits NRA / F-1 / J-1 filers.
conforms_to_federal_treaties: false
treaty_note: >-
  California does not conform to federal income tax treaties; tax treaties that expressly limit
  their application to federal income taxes do not apply to California. Income exempt from federal
  tax under a U.S. treaty is generally still taxable by California unless the treaty specifically
  excludes it from California tax. FTB Pub. 1031 (2024) worked example: a resident of China doing
  research at a California university received $15,000 in wages excludable for federal purposes
  under the U.S.-China treaty — those wages are nonetheless taxable by California and must be
  included on Schedule CA (540NR), Part II, Section A, line 1a, column C. California also disallows
  the foreign earned income exclusion and the foreign tax credit (Pub 1031, "Foreign Tax Credit or
  Foreign Earned Income Exclusion").
citation:
  source: "FTB Publication 1031 (2024), Guidelines for Determining Resident Status — Tax Treaty section (p. 10)"
  url: "https://www.ftb.ca.gov/forms/2024/2024-1031-publication.pdf"

residency:
  resident: "A California resident is taxed on ALL income (worldwide), regardless of source."
  nonresident: "A nonresident is taxed only on income from California sources."
  part_year: "A part-year resident is taxed on all income received while a California resident, plus California-source income received while a nonresident."
  domicile: >-
    Domicile is the one place you intend as your true, fixed, permanent home and to which you intend
    to return whenever absent. You have only one domicile at a time. California distinguishes domicile
    from residence — you can be domiciled in California but not a resident, or domiciled elsewhere but
    a California resident for income-tax purposes.
  closest_connection: "Residency follows your closest connections; it is the STRENGTH of your ties (home, family, time, licenses, registrations, bank accounts), not the number, that decides — no single factor is determinative."
  citation:
    source: "FTB Publication 1031 (2024), Sections G/H/I/L (residency, temporary or transitory purposes, income taxable by California, meaning of domicile)"
    url: "https://www.ftb.ca.gov/forms/2024/2024-1031-publication.pdf"

# Which California return each role files (confirmed, FTB Pub 1031 2024).
forms:
  resident: "540"
  part_year_or_nonresident: "540NR"
  schedule: "Schedule CA"

# Common CA credits. Eligibility/structure are stable; the dollar limits are the
# 2024 booklet figures, re-confirmed against the separately published HTML booklet.
credits_verification: >-
  Dollar limits below are transcribed from the cited 2024 FTB booklets and re-confirmed against the
  FTB's HTML edition of the same booklet (two-pass). Confirm your eligibility at the cited URL
  before relying on a figure. (The live FTB pages display current-year, inflation-adjusted figures.)
credits:
  - name: "Nonrefundable Renter's Credit"
    type: nonrefundable
    eligibility: "Full-year California resident who paid rent for at least half of 2024 on a non-tax-exempt principal residence in California; California AGI within the limit; did not claim (and spouse did not claim, subject to lived-apart exceptions) the homeowner's property tax exemption; not living more than half the year in the home of a person who can claim them as a dependent."
    amount: "$60 (single / married-RDP filing separately); $120 (head of household / MFJ / qualifying surviving spouse). Special MFS split rules apply when both spouses qualify ($60 each or $120 to one)."
    income_limit_2024: "California AGI (Form 540 line 17) <= $52,421 (single or MFS); <= $104,842 (MFJ, HoH, or QSS)"
    claimed_on: "Form 540 line 46 (per the booklet's Nonrefundable Renter's Credit Qualification Record)"
    citation:
      source: "2024 Personal Income Tax Booklet (Form 540), Nonrefundable Renter's Credit Qualification Record, pp. 25-26"
      url: "https://www.ftb.ca.gov/forms/2024/2024-540-booklet.pdf"
  - name: "California Earned Income Tax Credit (CalEITC)"
    type: refundable
    eligibility: "Requires California wage income and/or net earnings from self-employment of less than $31,951 (2024). You do not need a child to qualify. Computed on form FTB 3514."
    claimed_on: "FTB 3514, then Form 540 line 75"
    citation:
      source: "2024 Personal Income Tax Booklet (Form 540), 'What's New and Other Important Information for 2024' — California Earned Income Tax Credit; form FTB 3514"
      url: "https://www.ftb.ca.gov/forms/2024/2024-540-booklet.pdf"
  - name: "Young Child Tax Credit (YCTC)"
    type: refundable
    eligibility: "Available if you qualified for the California EITC (or would have but for earned income of zero dollars or less) and have at least one qualifying child younger than six years old as of the last day of the taxable year. Computed on form FTB 3514."
    claimed_on: "FTB 3514, then Form 540 line 76"
    citation:
      source: "2024 Personal Income Tax Booklet (Form 540), 'What's New and Other Important Information for 2024' — Young Child Tax Credit; form FTB 3514"
      url: "https://www.ftb.ca.gov/forms/2024/2024-540-booklet.pdf"

filing_requirement:
  note: >-
    California has its own gross-income and AGI threshold charts ('Do I Have to File?') that vary by
    filing status, age (under 65 vs 65+), and number of dependents. 2024 examples: single or head of
    household, under 65, 0 dependents — file if California gross income exceeds $22,273 or California
    AGI exceeds $17,818; MFJ both under 65, 0 dependents — gross income over $44,550 or AGI over
    $35,642. A dependent of another person (any filing status, any age) files if income exceeds their
    standard deduction (use the Standard Deduction Worksheet for Dependents: larger of earned income
    or the $1,300 minimum, capped at the per-status chart amount). Read the full charts in the booklet.
  citation:
    source: "2024 Personal Income Tax Booklet (Form 540), 'Do I Have to File?' charts, p. 4"
    url: "https://www.ftb.ca.gov/forms/2024/2024-540-booklet.pdf"

