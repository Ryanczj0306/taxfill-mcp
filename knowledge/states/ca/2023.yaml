        note: 'Form 540 line 8 "Blind: If you (or your spouse/RDP) are visually impaired, enter 1; if both are
          visually impaired, enter 2." Booklet p. 12, Line 8: "Visually impaired means not capable of seeing better
          than 20/200 while wearing glasses or contact lenses, or if your field of vision is not more than 20
          degrees." "The first year you claim this exemption credit, attach a doctor''s statement to the back of Form
          540 indicating you or your spouse/RDP are visually impaired." "Do not claim this credit if someone else can
          claim you as a dependent on their tax return." Only a joint return enters 2: the second count is the
          spouse/RDP''s ("if both"). A single or head-of-household return has no spouse/RDP on it, and a separate
          return counts the filer alone (booklet p. 4, "Married/RDP Filing Separately": "You cannot claim a personal
          exemption credit for your spouse/RDP even if your spouse/RDP had no income, is not filing a tax return, and
          is not claimed as a dependent on another person''s tax return."). On a qualifying surviving spouse/RDP
          return the spouse/RDP died in an earlier year (p. 5: "Your spouse/RDP died in 2021 or 2022 and you did not
          remarry or enter into another registered domestic partnership in 2023"), so "if both" cannot apply there
          either.'
