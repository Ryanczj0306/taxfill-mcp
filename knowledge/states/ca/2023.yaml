  notes:
  - 'Base guidance: Supply California adjusted gross income — 2023 Form 540, line 17 (''California adjusted gross
    income. Combine line 15 and line 16''), i.e. federal AGI (line 13) plus California additions minus California
    subtractions per Schedule CA (540). Do NOT supply unmodified federal AGI: California does not conform to federal
    income tax treaties (treaty-exempt income is added back on Schedule CA) and has other adjustments. The op
    subtracts the shipped per-status standard deduction to reproduce line 19 (taxable income, floored at 0) and
    applies the rate schedule to reproduce line 31 — the tax BEFORE exemption credits (line 32; see
    tax.exemption_credits) and special credits.'
  - 'Adjudication note (two-pass): base is federal_agi — Form 540 line 13 is federal AGI and line 17 California AGI =
    federal AGI +/- Schedule CA (540) adjustments; supply line 17 as taxable_base (the op subtracts the line 18
    standard deduction). California exemptions are $144/$446 CREDITS (lines 7-10), so vectors pass zero
    exemptions_count/dependents_count by design (the credits have their own input, exemption_credit_counts, and block,
    tax.exemption_credits).'
  - 'EXEMPTIONS ARE TAX CREDITS, NOT DEDUCTIONS: California''s personal exemption ($144 per exemption, Form 540 lines
    7-9: personal, blind, senior) and dependent exemption ($446 per dependent, line 10) are exemption CREDITS totaled
    on line 11 and subtracted from TAX on Form 540 line 32 — they never reduce taxable income, so exemptions_count and
    dependents_count are refused. tax is line 31 (tax before exemption credits); pass exemption_credit_counts
    (personal, blind, senior, dependent) with federal_agi and the result''s exemption_credits carries lines 7-11, 32
    and 33 (tax.exemption_credits, Phase K JK28). Special credits (lines 40-47) stay on the form.'
  - 'Exemption-credit AGI limitation (applied with the credits, from tax.exemption_credits.agi_limitation): if federal
    AGI (Form 540 line 13) exceeds $237,035 (single/MFS), $474,075 (MFJ/qualifying surviving spouse), or $355,558
    (head of household), the line 32 exemption credits are reduced via the AGI Limitation Worksheet (booklet p. 14).
    The worksheet takes $6 off each credit counted for each $2,500 ($1,250 married/RDP filing separately) of the
    excess, a fraction of a step counting as a whole one.'
  - 'Table mandate below $100,000 — ''Use only if your taxable income on Form 540, line 19 is more than $100,000.
    If $100,000 or less, use the Tax Table'' (booklet pp. 13, 75): bracket math may differ by a few dollars within
    table bands; the filed form must use the Tax Table (booklet pp. 69-74).'
  - '1% Mental Health Services Tax is NOT modeled: if taxable income (line 19) exceeds $1,000,000, an additional 1%
    of the excess over $1,000,000 is due on Form 540 line 62 (booklet p. 16 worksheet).'
  - Alternative Minimum Tax (Form 540 line 61, Schedule P (540)) and other taxes/credit recapture (line 63, e.g. FTB
    3805P early-distribution tax, IRC 409A NQDC 5% tax) are NOT modeled. FTB 3800 (tax for certain children with unearned
    income) and FTB 3803 (parents' election to report child's interest/dividends) change the line 31 computation and
    are NOT modeled.
  - 'Standard-deduction gates NOT modeled: a person claimable as a dependent on another''s return must use the California
    Standard Deduction Worksheet for Dependents (larger of earned income or the $1,250 minimum standard deduction,
    capped at the regular per-status amount) — not the chart amount; married/RDP filing separately, both spouses must
    either both itemize or both take the standard deduction; itemizers enter California itemized deductions from Schedule
    CA (540) Part II line 30 on line 18 instead of the standard deduction.'
  - Qualifying surviving spouse/RDP uses Schedule Y — identical to married/RDP filing jointly (engine's QSS-to-MFJ
    mapping matches the published schedule exactly). Married/RDP filing separately uses Schedule X, the same printed
    schedule as Single (copied from the schedule, not derived; note CA MFS is NOT half of MFJ at the bracket boundaries
    — it equals the Single schedule).
  - 'Base caution: Form 540 line 17 (California AGI) differs from federal AGI via Schedule CA (540) adjustments —
    notably California does NOT conform to federal income tax treaties (treaty-exempt income is added back), disallows
    the foreign earned income exclusion and foreign tax credit, and subtracts items like Social Security benefits.
    Registered domestic partners (RDPs) file using the married/RDP statuses with recalculated federal amounts.'
  - 'Printed $X + Y% of amount over $Z constants verified against cumulative bracket sums: all 27 constants match
    to the cent (largest print-rounding divergence $0.006, on Schedule Y''s $72,628.92 and $135,752.98 constants)
    — bracket math and the printed schedule agree.'
  - 'Rounding: the booklet''s worked example (p. 75) rounds the schedule result to whole dollars for line 31 ($5,082.80
    entered as $5,083), consistent with this op''s round-half-up-to-whole-dollars behavior.'
