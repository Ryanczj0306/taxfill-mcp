deadlines:
  filing_due_date: '2026-04-15'
  automatic_extension: NJ grants a six-month extension of time to FILE if you pay at least 80% of your tax liability
    (line 45) through withholdings, estimated payments, or other payments by the original due date AND either enclose
    a copy of the federal automatic-extension application (filling in the oval on the front of the NJ-1040) or file
    Form NJ-630 by April 15, 2026; the extension application can be filed online until 11:59 p.m. April 15, 2026
    at nj.gov/taxation. If you do not meet the requirements, or do not file by the extended due date, the Division
    will deny the extension request.
  citation:
    source: 2025 NJ-1040 Resident Income Tax Return Instructions - 'When to File' and 'Extension of Time to File'
      p. 4 (April 15, 2026 due date; six-month extension conditioned on 80% paid and NJ-630 / federal extension)
    url: https://www.nj.gov/treasury/taxation/pdf/current/1040i.pdf
