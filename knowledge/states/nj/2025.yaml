unverified:
- 'Exact NJ treatment of a SPECIFIC federal tax-treaty article (e.g., student/researcher/teacher exemptions): the
  conforms_to_federal_treaties=false conclusion is inferred from NJ''s wholly independent Gross Income Tax base
  (box-16 state wages, no federal-AGI starting point, no statutory treaty recognition; the word ''treaty'' appears
  zero times in the 2025 instructions) rather than from explicit treaty language. Confirm the specific treaty scenario
  directly with the NJ Division of Taxation.'
- The 2025 booklet is served from the YEAR-AGNOSTIC 'current' path (nj.gov/treasury/taxation/pdf/current/1040i.pdf);
  the dated 2025 path (.../other_forms/tgi-ee/2025/1040i.pdf) returns 404 during the 2025 filing season. The fetched
  artifact self-identifies as '2025 NJ-1040 Instructions' on every page footer and in its PDF Title metadata (build
  date 2025-10-21), so the content is unambiguous, but the cited URL will serve a LATER year's booklet once NJ rolls
  over. Re-resolve to the archived dated URL after the season.
- The general online tax/payment portal URL (nj.gov/treasury/taxation -> nj.gov/taxation) was cited from the instructions
  text; the exact direct e-check / 'Make a Payment' deep link was not separately verified for the 2025 cycle. Confirm
  the current direct payment URL at the DOR.
- GIT-6 (residency publication) was not re-fetched this session; the domicile / 30-day / 183-day summary was re-confirmed
  from the 2025 NJ-1040 instructions' own Terms to Know and Part-Year Residents text instead.
- The 2025 booklet has no 'What's New' section; changes were detected by figure-by-figure comparison against the
  2024 pack rather than from a DOR change summary. The only figure found to have changed is the $260 NJEITC age-expansion
  amount. Check the DOR's 2025 filing-season notices for anything not modeled here.
