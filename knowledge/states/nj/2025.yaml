  - 'No 2025 rate change: the 2025 schedules (top rate 10.75% over $1,000,000) are the statutory schedules in force
    since tax year 2020, republished unchanged in the final 2025 booklet used for the 2026 filing season; New Jersey
    had no mid-year retroactive rate legislation for 2025. Return due April 15, 2026.'
  - 'Whole-dollar rounding: the 2025 booklet permits (and the tax table presumes) whole-dollar entries — ''Instead
    of making dollars-and-cents entries on your return'' you may round, dropping amounts under 50 cents and increasing
