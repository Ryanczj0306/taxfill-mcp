unverified:
- 'Exact NJ treatment of a SPECIFIC federal tax-treaty article (e.g., student/researcher/teacher exemptions): the
  conforms_to_federal_treaties=false conclusion is inferred from NJ''s wholly independent Gross Income Tax base
  (box-16 state wages, no federal-AGI starting point, no statutory treaty recognition; the word ''treaty'' does
  not appear in the 2024 instructions) rather than from explicit treaty language. Confirm the specific treaty scenario
  directly with the NJ Division of Taxation.'
- The general online tax/payment portal URL (nj.gov/treasury/taxation -> nj.gov/taxation) was cited from the instructions
  text; the exact direct e-check / 'Make a Payment' deep link was not separately verified for the 2024 cycle. Confirm
  the current direct payment URL at the DOR.
- GIT-6 (residency publication) was not re-fetched this session; the domicile / 30-day / 183-day summary was re-confirmed
  from the 2024 NJ-1040 instructions' own residency flowchart and Domicile text instead.
