# IA state knowledge — tax year 2025. Fetched + cited from the IA DOR (.gov),
# authored per the 2023/2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 IA 1040 blank
# form (revenue.iowa.gov media/4400 — Step 4 line 4 'Iowa taxable income', Step 5 line 5
# 'Iowa tax. Multiply line 4 by 3.8%', Step 3 $40/$20/$40 exemption CREDITS, the April 30
# 2026 due date, PO Box 9187, 'Make checks payable to Iowa Department of Revenue'), then
# independently re-checked against the 2025 IA 1040 Expanded Instructions (Line 05 'Iowa
# Tax' page: 'Iowa now has a flat tax rate of 3.8%'; What's New) and the 2025 IA 1040
# Alternate Tax Worksheet (41-145, Rev. 10/17/2025) — both passes agree on the flat rate.
# 2025 STRUCTURAL CHANGE (SF 2442, enacted May 2024): Iowa went FLAT. The three 2024
# brackets (4.40%/4.82%/5.70%) are GONE — for tax years beginning on or after 1/1/2025
# Iowa has a SINGLE flat rate of 3.8% (IA 1040 line 5 = line 4 x 3.8%). The alternate tax
# survives for 2025 at 4.3% (down from 5.7%) over $13,500/$32,000, and is repealed for
# 2026. base is still federal taxable income; the Step 3 exemption CREDITS ($40/$20/$40)
# and the low-income exemption are unchanged. Do NOT carry 2024 bracket figures forward.
jurisdiction: states/ia
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: Iowa conforms. The 2025 IA 1040 keeps the redesign's starting point — "federal taxable income" — with
  Step 4 computing Iowa taxable income as federal taxable income (IA 1040 line 2, from federal 1040 line 15) plus
  net Iowa modifications from IA 1040 Schedule 1 (line 3, from Schedule 1 line 21). Lines 1a-1f (federal total income,
  adjustments, AGI, standard/itemized deduction, QBI deduction, and — new for 2025 — the federal senior deduction)
  are printed for reference only ("Do not include lines 1a through 1f"). Iowa applies rolling IRC conformity. Federally
  treaty-exempt income is excluded from federal AGI/federal taxable income before it ever reaches the Iowa return,
  and there is NO treaty/foreign-income re-inclusion among the Schedule 1 Column A additions. Reinforced by Iowa Admin.
  Code rule 701—300.17 (a resident is taxed on all income "except when an item of income is specifically exempted
  from taxation by a provision of federal or Iowa law"). Therefore treaty-exempt income is not re-taxed.
