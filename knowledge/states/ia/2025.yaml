  # (the top-level `citation` is the IA 1040 itself, the only document this entry pointed at before). Both roles file
  # the IA 1040 with Schedule IA 126; the Department's 2025 IA 1040 instructions are its "1040 Expanded Instructions"
  # web pages (each marked 'Instruction Year: 2025'), and the IA 126 PDF is the 2025 "IA 126" link on its forms search
  # (revenue.iowa.gov/forms?name=41-126&year=2025). Each was downloaded twice on 2026-10-16 with identical sha256 (Who
  # Must File page 539f7bac6f795b75..., Line 13 page e53ff76733b67cb3..., IA 126 3334dd85e9879066...). The
  # part_year_or_nonresident text above agrees with the 2025 instructions.
  # The two instruction pages' URLs carry no year, and the Department publishes its IA 1040 instructions only as web
  # pages: its forms search for the 2025 IA 1040 (revenue.iowa.gov/forms?name=41-001&year=2025, fetched twice on
  # 2026-10-16, sha256 d0c6d9073f5ee788...) links 'IA 1040 Instructions' to the 1040-expanded-instructions pages and
  # lists no instructions PDF. The verification anchors are therefore each page's 'Instruction Year: 2025' line and the
  # year-specific sentence quoted ('... you were a resident or part-year resident of Iowa in 2025 ...'): a TY2026 run
  # re-checks those, not the URL.
