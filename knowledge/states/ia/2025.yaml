credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Iowa Earned Income Tax Credit (EITC)
  type: refundable
  eligibility: Available only to taxpayers who qualify for the federal Earned Income Tax Credit (EITC); Iowa piggybacks
    on federal EITC eligibility. A taxpayer who qualifies for the Iowa low-income exemption may file solely to claim
    a refund of this credit.
  amount: 15% (.15) of the taxpayer's federal EITC (nonresidents/part-year residents multiply by the IA 126 Iowa
    income percentage)
  income_limit_2025: No separate Iowa income limit; bounded by the federal EITC income limits for 2025
  claimed_on: IA 1040, line 25 (2025 line numbering)
  citation:
    source: Iowa Department of Revenue — 2025 IA 1040 Expanded Instructions, 'Iowa Earned Income Tax Credit'
    url: https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/1040-expanded-instructions/whats-new
- name: Child and Dependent Care Credit
  type: refundable
  eligibility: Residents with Iowa taxable income (IA 1040 line 4) of less than $90,000 who paid qualifying child/dependent
    care expenses and qualify for the federal child and dependent care credit. Only one of the Child & Dependent
    Care Credit OR the Early Childhood Development Credit may be claimed per year.
  amount: 'A percentage of the federal Form 2441 amount, set by Iowa taxable income (IA 1040 line 4): less than $10,000
    = 75%; $10,000-$19,999 = 65%; $20,000-$24,999 = 55%; $25,000-$34,999 = 50%; $35,000-$39,999 = 40%; $40,000-$89,999
    = 30%; $90,000 and over = not eligible (per 2024 instructions; confirm the 2025 table at the cited source)'
  income_limit_2025: Iowa taxable income must be less than $90,000 (combined for married filing jointly)
  claimed_on: IA 1040, line 24 (check the 'Child and Dependent Care Credit' box)
  citation:
    source: Iowa Department of Revenue — 2025 IA 1040 Expanded Instructions, 'Child and Dependent Care Credit or Early
      Childhood Development Credit'
    url: https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/1040-expanded-instructions/whats-new
- name: Early Childhood Development Credit
  type: refundable
  eligibility: Residents with Iowa taxable income (IA 1040 line 4) of less than $90,000 who paid qualifying early
    childhood development expenses for a dependent aged three through five. Claimed in lieu of (not in addition to)
    the Child and Dependent Care Credit.
  amount: 25% of the first $1,000 of qualifying expenses paid in 2025 for each dependent ages three through five
    (maximum $250 per qualifying dependent)
  income_limit_2025: Iowa taxable income must be less than $90,000
  claimed_on: IA 1040, line 24 (check the 'Early Childhood Development Credit' box)
  citation:
    source: Iowa Department of Revenue — 2025 IA 1040 Expanded Instructions, 'Early Childhood Development Credit'
    url: https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/1040-expanded-instructions/whats-new
- name: Tuition and Textbook Credit (K-12)
  type: nonrefundable
  eligibility: A parent/taxpayer who claims a dependent attending grades K-12 at an accredited Iowa school (or receiving
    qualifying private instruction under Iowa Code 422.12) and who paid tuition and textbook expenses for that dependent.
    Purchases made from Students First Educational Savings Account (ESA) funds are NOT eligible.
  amount: 25% of the first $2,000 of qualifying tuition and textbook expenses paid for each dependent (maximum $500
    credit per dependent)
  income_limit_2025: No income limit
  claimed_on: IA 1040, line 9
  citation:
    source: Iowa Department of Revenue — 2025 IA 1040 Expanded Instructions, 'Tuition and Textbook Credit (K-12 Only)'
    url: https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/1040-expanded-instructions/whats-new
- name: Low-Income Exemption (with elevated threshold for filers age 65+)
  type: nonrefundable
  eligibility: An exemption from Iowa income tax (not a dollar credit) functioning as Iowa's primary low-income and
    senior relief. A taxpayer is exempt from Iowa income tax if Iowa taxable income (IA 1040 line 4, with required
    add-backs) is at or below the threshold for their filing status. NEW for 2025 — the federal 'Enhanced Deduction
    for Seniors' is treated as a personal exemption that must be ADDED BACK when calculating the low-income exemption.
  amount: Not a dollar credit — it eliminates Iowa income-tax liability when income is at or below the threshold.
  income_limit_2025: 'Single: Iowa taxable income $9,000 or less ($24,000 or less if age 65+ on 12/31/25); or under
    $5,000 if claimed as a dependent. Married filing jointly / head of household / qualifying surviving spouse: $13,500
    or less ($32,000 or less if taxpayer or spouse is 65+ on 12/31/25). Married filing separately: each spouse $9,000
    or less AND combined $13,500 or less. (Carried from 2024 — confirm the exact 2025 thresholds at the cited source.)'
  # Box location re-read on the 2025 face (JK27, 2026-10-16): page 2 (41-001b 10/14/2025) prints the box on its
  # own row under the Step 5 heading, above line 5, as the 2024 face does. The 2025 Expanded Instructions still
  # say "check the box between Steps 4 and 5" (the "Line 25: Iowa Earned Income Tax Credit" page, Instruction
  # Year 2025); the quote is kept and the location is the face's.
  claimed_on: 'IA 1040 Step 5 — check the box printed under the Step 5 heading, above line 5: "Check if using alternate
    tax (line 5), tax reduction calculation (line 12), or low-income exemption. See instructions." (The 2025 Expanded
    Instructions'' "Line 25: Iowa Earned Income Tax Credit" page still says "check the box between Steps 4 and 5"; the
    "Line 04: Iowa Taxable Income" page explains the box: "Check the box only if using low-income exemption, alternate
    tax, or tax reduction.")'
  citation:
    source: Iowa Department of Revenue — 2025 IA 1040 Expanded Instructions, low-income exemption / What's New (federal
      senior deduction add-back); box wording from the "Line 04" and "Line 25" pages (Instruction Year 2025); box
      location from the 2025 IA 1040 page 2 (41-001b 10/14/2025), https://revenue.iowa.gov/media/4400/download?inline
    url: https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/1040-expanded-instructions/whats-new
filing_requirement:
  note: A resident or part-year resident must file if Iowa taxable income (IA 1040 line 4, with specified add-backs
    incl. the line 1d standard/itemized deduction, line 1e QBI deduction, the new federal senior deduction, lump-sum
    distributions, and the Schedule 1 Iowa NOL carryforward) is more than $9,000 for single/married-filing-separately
    ($24,000 if 65 or older on 12/31/25), or more than $13,500 for married filing jointly, head of household, or qualifying
    surviving spouse ($32,000 if you or spouse is 65 or older). A dependent must file if Iowa taxable income is $5,000
    or more. A nonresident or part-year resident must file if Iowa-source net income (IA 126, line 25) was $1,000 or
    more. Anyone with Iowa tax withheld who wants a refund must also file. (2025 IA 1040 Expanded Instructions, "Who
    Must File" — thresholds carried from 2024; confirm at the cited source.)
