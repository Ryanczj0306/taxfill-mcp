      lump-sum tax, and line 11 adds the line 9 tuition/textbook and line 10 volunteer credits to line 8. It equals
      the filed line 12 when lines 6, 9 and 10 are zero; otherwise add those on the form. The alternate tax, tax
      reduction worksheet and low-income exemption change line 5 or 12 on the form (see the pack notes).'
  notes:
  - '2025 STRUCTURAL CHANGE (SF 2442, enacted May 2024): Iowa went FLAT. The three 2024 brackets (4.40%/4.82%/5.70%)
    are GONE — for tax years beginning on or after 1/1/2025 there is a SINGLE flat rate of 3.8% on Iowa taxable income
    (IA 1040 line 5 = line 4 x 3.8%). Do NOT apply 2024 bracket figures to 2025, and do NOT use this pack for 2024.'
  - 'Base guidance: supply 2025 IA 1040 line 4 ''Iowa taxable income'' = line 2 federal taxable income (federal 1040,
    line 15) + line 3 net Iowa modifications (IA 1040 Schedule 1, line 21). Lines 1a-1f (federal total income, adjustments,
    AGI, standard/itemized deduction, QBI deduction, and — new for 2025 — the federal senior deduction) are printed
    for reference only. The federal standard/itemized and QBI deductions are already inside federal taxable income
    — Iowa has no state standard deduction or base personal exemptions, so this op subtracts nothing before applying
    the 3.8% rate (standard_deduction is null; exemptions is empty).'
  - 'Flat rate makes filing status irrelevant to line 5: with a single 3.8% rate and no per-status standard deduction,
    single / MFS / HoH / MFJ all compute the identical tax on the same base. The op''s qualifying-surviving-spouse
    -> married_filing_jointly aliasing (which was a CRITICAL understatement warning in the 2024 graduated pack, since
    Iowa status 5 is NON-JOINT on the bracket worksheet) is now HARMLESS — the flat rate is status-independent. It
    matters only for the ALTERNATE tax (off-model, below).'
  - 'Alternate tax (NOT modeled) survives for 2025 at a REDUCED rate: all statuses except single may compute an alternate
    tax on the 2025 IA 1040 Alternate Tax Worksheet (41-145) — 4.3% (.043), DOWN from 5.7% in 2024 — of income above
    $13,500 ($32,000 if you or your spouse was 65 or older on 12/31/2025), and enter the SMALLER of that or 3.8% x
    line 4 on line 5 (check the Step 5 box). Status-3 (MFS) spouses prorate it. This provision is REPEALED for tax
    years beginning on or after 1/1/2026. Single taxpayers may instead qualify for the Iowa Income Tax Reduction Worksheet
    (41-146). Check these when income is just above the threshold.'
  - 'Exemption CREDITS, not base exemptions: IA 1040 Step 3 computes personal credits at $40 (enter
    1 for statuses 1, 3, and 5; 2 for statuses 2 and 4), $20 per 65-or-older / blind condition, and $40 per dependent;
    the Step 3 total is a CREDIT against tax on line 8 — never a base reduction. exemptions ships empty; pass exemptions_count=0
    and dependents_count=0, and pass the Step 3 counts as exemption_credit_counts (tax.exemption_credits, Phase K JK28).'
  # The low-income box and the surtax line below were re-read on the 2025 face (JK27, 2026-10-16). Page 2
  # (41-001b) prints the box under the Step 5 heading, above line 5; page 3 (41-001c) prints "19. School district
  # surtax or EMS surtax. Multiply line 18 by the percentage from list" inside Step 5, and the "Line 19" page of
  # the 2025 Expanded Instructions agrees ("Step: 5"; "Multiply the amount on line 18 by the surtax rate").
  - 'Low-income exemption (NOT modeled): filers whose Iowa taxable income plus specified add-backs is at or below
    $9,000 (single/MFS; $24,000 if 65+ on 12/31/25), or $13,500 (MFJ / HoH / QSS; $32,000 if 65+), owe no Iowa income
    tax (check the box the 2025 IA 1040 prints under the Step 5 heading, above line 5: "Check if using alternate tax
    (line 5), tax reduction calculation (line 12), or low-income exemption. See instructions." The Expanded Instructions''
    "Line 25" page still calls it "the box between Steps 4 and 5"); a dependent filer''s threshold is $5,000; MFS also
    requires combined income of $13,500 or less. NEW for 2025: the federal Enhanced Deduction for Seniors is added
    back when testing this exemption.'
  - 'Cents vs whole dollars: the IA 1040 is captioned ''Enter Dollars and Cents'' and computes tax to the cent; whole-dollar
    rounding is OPTIONAL (drop under 50 cents; 50-99 cents up — a .50 tie rounds UP, matching this op). No tax-table
    mandate: all filers apply the 3.8% rate (or the alternate-tax / tax-reduction worksheets).'
  - 'Not modeled — later lines: Iowa lump-sum tax (line 6), tuition and textbook
    credit (line 9), volunteer firefighter/EMS/reserve peace officer credit (line 10), the IA 126 nonresident/part-year
    credit, out-of-state tax credit, SCHOOL DISTRICT SURTAX and EMS surtax (line 19, in Step 5: "School district surtax
    or EMS surtax. Multiply line 18 by the percentage from list"; Step 6 is "Refundable Credits and Payments", lines
    23-30), the 15%-of-federal Iowa EITC (line 25), and the child and dependent care / early childhood development
    credits (line 24).'
# DEV_PLAN §7.2 effective_law_changes — promoted 2026-08-11 from THIS pack's own prose (the header's
# "2025 STRUCTURAL CHANGE (SF 2442, enacted May 2024)" block and the tax.notes flat-rate,
# alternate-tax and low-income-exemption notes); transcription only, no new research and no new
# sources. modeled: true for the flat conversion because tax.flat_rate already ships 3.8%; the
# alternate tax and the federal senior-deduction add-back are modeled: false — calc.state_tax
# computes neither.
effective_law_changes:
- description: >-
    IOWA WENT FLAT (SF 2442, enacted May 2024): the three 2024 brackets (4.40% / 4.82% / 5.70%) are
    GONE — for tax years beginning on or after 1/1/2025 there is a SINGLE flat rate of 3.8% on Iowa
    taxable income, printed on the return as IA 1040 line 5 "Iowa tax. Multiply line 4 by 3.8%" and
    restated in the Expanded Instructions ("Iowa now has a flat tax rate of 3.8%"). The base is still
    federal taxable income plus Schedule 1 net modifications, and the Step 3 exemption CREDITS
    ($40/$20/$40) are unchanged.
  status: final_form_published
  affects:
  - tax.flat_rate
  - IA 1040 Step 5 line 5
  modeled: true
  citation:
    source: >-
      Iowa Department of Revenue — 2025 IA 1040 Expanded Instructions, Line 05 'Iowa Tax' + What's
      New: 'Iowa now has a flat tax rate of 3.8%' (SF 2442 flat tax begins TY2025); the federal
      Enhanced Deduction for Seniors is added back for the low-income exemption / alternate tax / tax
      reduction; ISave 529 deduction limit $5,800 per beneficiary
    url: https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/1040-expanded-instructions/whats-new
- description: >-
    ALTERNATE TAX SURVIVES 2025 AT A REDUCED RATE AND IS THEN REPEALED: all statuses except single
    may compute the alternate tax at 4.3% (.043) — DOWN from 5.7% in 2024 — on income above $13,500
    ($32,000 if the taxpayer or spouse was 65 or older on 12/31/2025), entering the SMALLER of that
    or 3.8% x IA 1040 line 4 on line 5 (status-3 MFS spouses prorate it). The provision is REPEALED
    for tax years beginning on or after 1/1/2026.
  status: final_form_published
  lookup_path: >-
    2025 IA 1040 Alternate Tax Worksheet (41-145, Rev. 10/17/2025) at the citation URL; single filers
    use the Iowa Income Tax Reduction Worksheet (41-146) instead.
  affects:
  - IA 1040 Step 5 line 5 (alternate tax election)
  - calc.state_tax (off-model — the op always applies the 3.8% flat rate)
  modeled: false
  citation:
    source: >-
      Iowa Department of Revenue — 2025 IA 1040 Alternate Tax Worksheet (41-145, Rev. 10/17/2025):
      line 2 threshold $13,500 ($32,000 if you or your spouse was 65 or older on 12/31/2025); line 4
      'Multiply line 3 by 4.3% (.043)'; line 5 'Multiply Iowa taxable income from IA 1040, line 4 by
      3.8% (.038)'; take the SMALLER; single filers use the Iowa Income Tax Reduction Worksheet
      (41-146) instead
    url: https://revenue.iowa.gov/media/4386/download?inline
- description: >-
    NEW FOR 2025 — the federal "Enhanced Deduction for Seniors" is treated as a personal exemption
    that must be ADDED BACK when calculating the Iowa low-income exemption, the alternate tax and the
    tax-reduction worksheet, and it joins the IA 1040 informational reference lines (which became
    1a-1f, "Do not include lines 1a through 1f"). The ISave 529 deduction limit is $5,800 per
    beneficiary for 2025.
  status: final_form_published
  lookup_path: >-
    2025 IA 1040 Expanded Instructions, What's New and the low-income exemption / alternate tax /
    tax reduction instructions at the citation URL; the senior-deduction amount comes from the
    filer's own federal return.
  affects:
  - filing_requirement (the add-back applies when testing the thresholds)
  - credits (Low-Income Exemption)
  - IA 1040 line 1f
  modeled: false
  citation:
    source: >-
      Iowa Department of Revenue — 2025 IA 1040 Expanded Instructions, Line 05 'Iowa Tax' + What's
      New: 'Iowa now has a flat tax rate of 3.8%' (SF 2442 flat tax begins TY2025); the federal
      Enhanced Deduction for Seniors is added back for the low-income exemption / alternate tax / tax
      reduction; ISave 529 deduction limit $5,800 per beneficiary
    url: https://revenue.iowa.gov/taxes/tax-guidance/individual-income-tax/1040-expanded-instructions/whats-new

