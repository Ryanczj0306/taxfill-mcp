  base: federal_taxable_income
  tax_line: 'IA 1040 (41-001) Step 5, line 5: ''Iowa tax from tax rate schedule or alternate tax'' — computed on IA
    1040 line 4 ''Iowa taxable income'' via the 2024 Tax Calculation Worksheet (41-026) or the IA 1040 Tax Calculator
    (line 4 = line 2 federal taxable income + line 3 net Iowa modifications; ''Do not include lines 1a through 1e'').'
  exemptions: {}
  notes:
  - '2024 schedule change (VERIFIED): the four 2023 brackets consolidated to THREE — the 6.00% top bracket is gone
    and 5.70% now applies to all income over $31,050 (non-joint) / $62,100 (joint); bracket bounds indexed up from
    $6,000/$30,000 and $12,000/$60,000. Iowa''s single flat rate of 3.8% (SF 2442) begins TAX YEAR 2025 — do NOT apply
    it to 2024.'
  - 'Base guidance: supply 2024 IA 1040 line 4 ''Iowa taxable income'' = line 2 federal taxable income (federal 1040,
    line 15) + line 3 net Iowa modifications (IA 1040 Schedule 1, line 21 — renumbered from line 22 in 2023). Lines
    1a-1e (federal total income, adjustments, AGI, standard/itemized deduction, QBI deduction) are printed for reference
    only. The federal standard/itemized deduction and QBI deduction are already inside federal taxable income — Iowa
    has no state standard deduction or base personal exemptions, and this op subtracts nothing before the schedule.'
  - 'Two schedules only: the 2024 Tax Calculation Worksheet (41-026) prints one schedule for JOINT filers (Iowa filing
    status 2) and one for NON-JOINT filers (statuses 1, 3, 4, and 5) — single, married filing separately, and head
    of household ship the identical non-joint schedule; married_filing_jointly ships the joint schedule.'
  - 'CRITICAL — qualifying surviving spouse: Iowa status 5 (qualifying surviving spouse) is a NON-JOINT filer on the
    41-026 worksheet, but this op''s status aliasing resolves qualifying-surviving-spouse to the married_filing_jointly
    schedule, which would UNDERSTATE Iowa tax. For an Iowa QSS filer, pass filing_status=''single'' (the identical
    non-joint schedule).'
  - 'Printed-constant rounding (quantified): the 2024 top-bracket Column C constants are the exact cumulative sums
    rounded to the CENT — non-joint $1,470.53 vs exact $1,470.528 (+$0.002), joint $2,941.06 vs exact $2,941.056 (+$0.004);
    the first constants ($273.24 / $546.48) are exact. This op does exact marginal math, so worksheet results can
    exceed it by less than half a cent — immaterial after whole-dollar rounding.'
  - 'Cents vs whole dollars: the IA 1040 is captioned ''Enter Dollars and Cents'' and the worksheet computes tax to
    the cent; whole-dollar rounding is OPTIONAL (''To round, drop amounts under 50 cents and increase amounts from
    50 to 99 cents to the next dollar'' — a .50 tie rounds UP, matching this op). No tax-table mandate: all filers
    use the 41-026 worksheet or the online IA 1040 Tax Calculator.'
  - 'Exemption CREDITS, not base exemptions (NOT modeled): IA 1040 Step 3 computes personal credits at $40 (enter
    1 for statuses 1, 3, and 5; 2 for statuses 2 and 4), $20 per 65-or-older (on or before January 1, 2025) or blind
    condition, and $40 per dependent; the Step 3 total is a CREDIT against tax on line 8 — never a base reduction.
    exemptions ships empty; pass exemptions_count=0 and dependents_count=0.'
  - 'Alternate tax (NOT modeled): all statuses except single may compute an alternate tax — 5.7% (.057) for 2024 (down
    from 6% in 2023) of the alternate-tax-worksheet income above $13,500 ($32,000 if you or your spouse was 65 or
    older on 12/31/2024) — and enter the SMALLER amount on line 5 (check the Step 5 box); status-3 spouses prorate
    it. Single taxpayers may instead qualify for the Iowa Income Tax Reduction Worksheet (41-146). Check these when
    income is just above the threshold.'
  - 'Low-income exemption (NOT modeled): filers whose Iowa taxable income plus specified add-backs is at or below
    $9,000 (single/married filing separately; $24,000 if 65+ on 12/31/24), or $13,500 (married filing jointly / head
    of household / qualifying surviving spouse; $32,000 if 65+), owe no Iowa income tax (check the box between Steps
    4 and 5); a dependent filer''s threshold is $5,000; MFS also requires combined income of $13,500 or less.'
  - 'Not modeled — later lines: Iowa lump-sum tax (line 6), the Step 3 exemption credits (line 8), tuition and textbook
    credit (line 9 — 2024: Students First ESA purchases not eligible), volunteer firefighter/EMS/reserve peace officer
    credit (line 10), the IA 126 nonresident/part-year credit (line 13), out-of-state tax credit (line 15), SCHOOL
    DISTRICT SURTAX and EMS surtax (Step 6 — a local percentage of the line 16 balance), the 15%-of-federal Iowa EITC
    (line 25), and the child and dependent care / early childhood development credits (line 24).'
