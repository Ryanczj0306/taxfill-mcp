    2); the remaining rates are 4.40% and 4.82%, and the bracket bounds moved up from 2023's
    $6,000/$30,000 (non-joint) and $12,000/$60,000 (joint). Iowa's single flat rate of 3.8% (SF 2442)
    begins TAX YEAR 2025 — it does NOT apply to 2024.
