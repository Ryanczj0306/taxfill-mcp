# Graduated-bracket tax computation block (Phase G item G4, formerly-C3 adoption
# tranche) — consumed by calc.state_tax. Two-pass verification: brackets drafted from
# the 2024 Tax Calculation Worksheet (41-026, joint vs non-joint schedules with Column
# C constants and worked examples), then independently re-checked against the 2024
# IA 1040 form face (Step 4/Step 5) and the official 2024 IA 1040 Expanded
# Instructions PDF (What's New: 'The tax rates for each tax bracket have decreased.
# For tax year 2025, Iowa will have a single tax rate of 3.8%'; alternate tax 5.7%).
# VERIFIED: 2024 is THREE brackets (4.40% / 4.82% / 5.70%) — the four-bracket 2023
# schedule lost its 6% top rate, and the SF 2442 flat 3.8% rate begins TAX YEAR 2025,
# not 2024. Modeling decisions carried forward from 2023: joint (status 2) vs
# non-joint (statuses 1/3/4/5) schedules — single/MFS/HoH ship the identical non-joint
# schedule; Iowa status 5 (QSS) is NON-JOINT, so the op's QSS->MFJ aliasing is flagged
# CRITICAL in the notes (pass 'single' for a QSS filer). Step 3 amounts are CREDITS
# against tax (line 8), never base reductions -> exemptions ships empty,
# standard_deduction ships null (the federal deduction is already inside federal
# taxable income).
tax:
  citation:
    source: 'Iowa Department of Revenue — 2024 Tax Calculation Worksheet (41-026): NON-JOINT FILERS (filing status 1,
      3, 4, or 5) $0-$6,210 at 4.40% (.044), $6,210-$31,050 at 4.82% (.0482) plus $273.24, $31,050-and-over at 5.70%
      (.057) plus $1,470.53; JOINT FILERS (filing status 2) $0-$12,420 at 4.40%, $12,420-$62,100 at 4.82% plus $546.48,
      $62,100-and-over at 5.70% plus $2,941.06; worked example $25,000 non-joint -> $1,178.92. Second pass: 2024 IA
      1040 (41-001) Step 4 ''Iowa taxable income. Add lines 2 and 3. Do not include lines 1a through 1e'' (line 2 =
      federal taxable income from federal 1040 line 15; line 3 = net Iowa modifications from IA 1040 Schedule 1, line
      21) and Step 5 line 5 ''Iowa tax from tax rate schedule or alternate tax'', Step 3 $40/$20/$40 exemption CREDITS;
      2024 IA 1040 Expanded Instructions — What''s New: ''Line 5: The tax rates for each tax bracket have decreased.
      For tax year 2025, Iowa will have a single tax rate of 3.8%'' (the flat rate begins TY2025, NOT TY2024); alternate
      tax = 5.7% of income over $13,500/$32,000 — both passes agree.'
    url: https://revenue.iowa.gov/media/4093/download?inline
  brackets:
    single:
    - {over: 0, but_not_over: 6210, rate: 0.044}
    - {over: 6210, but_not_over: 31050, rate: 0.0482}
    - {over: 31050, but_not_over: null, rate: 0.057}
    married_filing_jointly:
    - {over: 0, but_not_over: 12420, rate: 0.044}
    - {over: 12420, but_not_over: 62100, rate: 0.0482}
    - {over: 62100, but_not_over: null, rate: 0.057}
    married_filing_separately:
    - {over: 0, but_not_over: 6210, rate: 0.044}
    - {over: 6210, but_not_over: 31050, rate: 0.0482}
    - {over: 31050, but_not_over: null, rate: 0.057}
    head_of_household:
    - {over: 0, but_not_over: 6210, rate: 0.044}
