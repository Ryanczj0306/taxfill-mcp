# CT state knowledge — tax year 2024. Fetched + cited from the CT DRS (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure was drafted from the 2024 Form CT-1040
# instructions (Rev. 01/25) and independently re-verified against the 2024 Form
# CT-1040NR/PY instructions (Rev. 01/25) and the 2024 Form CT-1040 itself —
# resolutions recorded inline where the passes differed. TY2024 headline change:
# the bottom two rates were CUT (3% -> 2% and 5% -> 4.5%, Connecticut's first
# income-tax rate cut since the mid-1990s), Table C became the '2% Phase-Out
# Add-Back' (new maxima $250/$500/$250/$400), and Table D recapture now begins
# at CT AGI over $105,000/$210,000/$168,000 (new maxima $3,400/$6,800/$5,320).
# Improvement over the 2023 pack: the check-payee wording is now confirmed from
# the 2024 form's own payment box ('Make your check payable to: Commissioner of
# Revenue Services ... write your SSN(s) (optional) and "2024 Form CT-1040"').
jurisdiction: states/ct
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'CT''s resident return (Form CT-1040) starts from federal AGI (Line 1 = "Federal adjusted gross income
  from your 2024 federal income tax return"), so treaty-exempt income is initially excluded. HOWEVER, CT has an
  EXPLICIT ADD-BACK: the 2024 CT-1040 instructions (Schedule 1 additions, Line 37 "Other") and the 2024 CT-1040NR/PY
  instructions (Schedule 1 additions, Line 39 "Other") both direct: "1. Add back any treaty income reported on federal
  Form 1040NR if a nonresident alien. Enter the words ''treaty income'' in the space provided." Because CT requires
  nonresident aliens to add federally treaty-exempt income back into Connecticut adjusted gross income, CT does NOT
  conform to federal treaty exemptions for affected filers (analogous to California''s Schedule CA add-back). Note:
  this add-back is scoped to nonresident aliens filing federal Form 1040NR; a filer with no treaty income / not a
  nonresident alien is unaffected, but the statutory rule re-taxes treaty income, so conforms_to_federal_treaties
  = false. (Unchanged from 2023 — the identical sentence appears in both 2024 instruction booklets.)'
citation:
  source: '2024 Form CT-1040 Connecticut Resident Income Tax Return (Line 1 = federal AGI; Line 2 additions from
    Schedule 1, Line 38; ''Due date: April 15, 2025''; mailing addresses PO Box 2976/2977; check payable to Commissioner
    of Revenue Services)'
  url: https://portal.ct.gov/-/media/drs/forms/2024/income/ct-1040_1224.pdf
starts_from: federal AGI (Form CT-1040, Line 1 = "Federal adjusted gross income from your 2024 federal income tax
  return"; then Line 2 additions from Schedule 1, Line 38 and Line 4 subtractions from Schedule 1, Line 50 produce
  Connecticut adjusted gross income on Line 5.)
residency:
  summary: Connecticut taxes by domicile and statutory residence. You are a RESIDENT if Connecticut was your domicile
    (permanent home you intend to return to) for the entire taxable year, OR (statutory resident) if you maintained
    a permanent place of abode in Connecticut during the entire taxable year AND spent more than 183 days of the
    taxable year in Connecticut. A PART-YEAR RESIDENT changed legal residence by moving into or out of Connecticut
    during the year. A NONRESIDENT is neither a resident nor a part-year resident; a nonresident is taxed only on
    Connecticut-source income and prorates the tax. (The statutory domicile/permanent-place-of-abode + 183-day framework
    is unchanged for 2024; the DRS Tax-Information page states the same rules.)
forms:
  resident: Form CT-1040, Connecticut Resident Income Tax Return
  part_year_or_nonresident: Form CT-1040NR/PY, Connecticut Nonresident and Part-Year Resident Income Tax Return
    (use Schedule CT-SI to report Connecticut-source income)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Connecticut Earned Income Tax Credit (CT EITC)
  type: refundable
  eligibility: Connecticut full-year residents who claimed and were allowed the 2024 federal Earned Income Credit.
    Taxpayer (and spouse/qualifying children, if applicable) must have valid Social Security Numbers by the return
    due date, must have earned income from employment or self-employment, and must meet all federal EITC rules.
    Either qualify with a qualifying child, or as a worker without a qualifying child aged 25-64.
  amount: 40% (.40) of the federal earned income credit allowed on the 2024 federal return ("For the tax year 2024,
    the CT EITC is 40% (.40) of the federal earned income credit" — 2024 CT-1040 instructions, Schedule CT-EITC).
  income_limit_2024: Mirrors federal EITC income limits; additionally, investment income must be $11,600 or less
    for 2024 ("You cannot claim the CT EITC if your investment income is more than $11,600").
  claimed_on: Schedule CT-EITC (Line 16), carried to Form CT-1040, Line 20a (or Form CT-1040X, Line 20a)
  citation:
    source: CT DRS - 2024 Form CT-1040 Instructions (Rev. 01/25), Line 20a and Schedule CT-EITC line instructions
      (40% rate; $11,600 investment-income limit)
    url: https://portal.ct.gov/-/media/drs/forms/2024/income/2024-ct-1040-instructions_1224.pdf
- name: Property Tax Credit (Schedule 3)
  type: nonrefundable
  eligibility: Connecticut residents who paid qualifying property tax during 2024 to a Connecticut political subdivision
    on their primary residence and/or a privately owned or leased motor vehicle. Single/MFS/HOH limited to one motor
    vehicle; MFJ/qualifying surviving spouse limited to two. Cannot be claimed if Form CT-1040 Line 10 is zero.
  amount: Maximum credit is $300 per return regardless of filing status; limited to the lesser of qualifying property
    tax paid or $300, then phased down by Connecticut AGI per the Property Tax Credit Table. Full $300 (no reduction)
    allowed if Connecticut AGI is at or below the filing-status threshold below; above it, the credit is multiplied
    by a decimal that decreases as AGI rises.
  income_limit_2024: 'Full credit allowed at Connecticut AGI of: Single $49,500 or less; MFJ/qualifying surviving
    spouse $70,500 or less; Married filing separately $35,250 or less; Head of household $54,500 or less (unchanged
    from 2023). Above these the credit phases out per the Property Tax Credit Table.'
  claimed_on: Form CT-1040, Schedule 3 (Lines 60-68), carried to Form CT-1040, Line 11
  citation:
    source: CT DRS - 2024 Form CT-1040 Instructions (Rev. 01/25), Line 11 / Schedule 3 - Property Tax Credit and
      Property Tax Credit Table
    url: https://portal.ct.gov/-/media/drs/forms/2024/income/2024-ct-1040-instructions_1224.pdf
- name: Personal Tax Credit (low-income credit, Table E)
  type: nonrefundable
  eligibility: Connecticut resident individuals whose Connecticut AGI falls within the Table E phase-out ranges
    for their filing status. Taxpayers below the no-tax threshold owe no income tax and need no credit; the personal
    credit reduces the income tax for low-to-moderate income filers just above that threshold.
  amount: 'A decimal percentage reduction of the calculated Connecticut income tax, up to .75 (75%), declining in
    steps to .00 as Connecticut AGI rises. Example (Single): .75 for AGI over $15,000 up to $18,800; stepping down
    to .00 once AGI exceeds $64,500. (2024 Table E is identical to 2023.)'
  income_limit_2024: 'Credit fully phases out (decimal = .00) above: Single $64,500; MFJ/qualifying surviving spouse
    $100,500; Married filing separately $52,500; Head of household $78,500. Filers at or below the no-tax floor
    (MFS $12,000 / Single $15,000 / HOH $19,000 / MFJ $24,000) owe no tax.'
  claimed_on: Tax Calculation Schedule, Line 8 (decimal from Table E), reducing the income tax reported on Form
    CT-1040, Line 6
  citation:
    source: CT DRS - 2024 Form CT-1040 Instructions (Rev. 01/25), Table E - Personal Tax Credits; Tax Calculation
      Schedule Line 8; Line 6 no-tax floors
    url: https://portal.ct.gov/-/media/drs/forms/2024/income/2024-ct-1040-instructions_1224.pdf
- name: Credit for Income Taxes Paid to Qualifying Jurisdictions (Schedule 2)
  type: nonrefundable
  eligibility: Connecticut residents (and part-year residents) whose income reported on the CT return is also subject
    to income tax in another qualifying jurisdiction (another U.S. state, a local jurisdiction within another state,
    or the District of Columbia) where the taxpayer filed a return and paid income tax. Prevents double taxation
    of the same income. A copy of the other jurisdiction's return must be attached.
  amount: Limited to the lesser of (a) the income tax actually paid to the qualifying jurisdiction on income also
    taxed by Connecticut, or (b) the proportion of Connecticut income tax attributable to that income (Connecticut
    income tax multiplied by the ratio of income taxed in the other jurisdiction to Connecticut AGI). Computed on
    Schedule 2.
  income_limit_2024: No specific income limit; the credit amount is capped by the formula above.
  claimed_on: Form CT-1040, Schedule 2 (Line 59), carried to Form CT-1040, Line 7
  citation:
    source: CT DRS - 2024 Form CT-1040 Instructions (Rev. 01/25), Line 7 / Schedule 2 - Credit for Income Taxes
      Paid to Qualifying Jurisdictions
    url: https://portal.ct.gov/-/media/drs/forms/2024/income/2024-ct-1040-instructions_1224.pdf
filing_requirement:
  note: 'Connecticut uses a "Gross Income Test." A resident generally must file Form CT-1040 if Connecticut gross
    income exceeds the threshold for their filing status: $12,000 (married filing separately), $15,000 (single),
    $19,000 (head of household), or $24,000 (married filing jointly or qualifying surviving spouse) — unchanged
    for 2024 (the 2024 CT-1040 instructions print the same dollar levels as the Line 6 no-tax floors). You must
    also file if you had Connecticut income tax withheld, made estimated payments, meet the Gross Income Test, had
    a federal alternative minimum tax liability, or are claiming a Connecticut refund. Nonresidents/part-year residents
    file CT-1040NR/PY if they meet the Gross Income Test or had federal AMT liability (and, for nonresidents, had
    Connecticut-source income).'
