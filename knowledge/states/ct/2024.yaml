  base: federal_agi
  tax_line: '2024 Form CT-1040, Line 6: ''Income Tax''. Computed on the Tax Calculation Schedule (2024 CT-1040 instructions,
    p. 19): Line 1 = Connecticut AGI (Form CT-1040, Line 5); Line 2 = Table A personal exemption; Line 3 = Connecticut
    Taxable Income (Line 1 - Line 2, not less than zero); Line 4 = Table B Initial Tax Calculation (the rate schedules
    this block ships); Lines 5-6 add Table C (2% phase-out) and Table D (recapture); Line 8-9 subtract the Table E
    personal-credit percentage; Line 10 ''Connecticut Income Tax: Subtract Line 9 from Line 7. Enter here and on Form
    CT-1040, Line 6.'''
  exemptions: {}
  notes:
  - 'TY2024 RATE CUT (first since the mid-1990s): the bottom two rates fell from 3% to 2% and from 5% to 4.5%; the
    upper five rates (5.5%/6%/6.5%/6.9%/6.99%) and every bracket bound are unchanged from 2023. Table C was renamed
    the ''2% Phase-Out Add-Back'' with new amounts, and Table D recapture was restructured to begin at much lower
    CT AGI (see the CRITICAL notes).'
  - 'Base guidance: supply Tax Calculation Schedule Line 3 (Connecticut Taxable Income) = Connecticut AGI (Form CT-1040
    Line 5 = federal AGI + Schedule 1 additions - Schedule 1 subtractions) MINUS the Table A personal exemption. The
    Table A exemption (up to $15,000 single / $24,000 MFJ-QSS / $12,000 MFS / $19,000 HoH — unchanged for 2024) is
    INCOME-DEPENDENT — it falls $1,000 for each $1,000 (or part) of CT AGI over $30,000 / $48,000 / $24,000 / $38,000
    and is $0 at CT AGI of $44,000 / $71,000 / $35,000 / $56,000 or more — so it is NOT shipped as a key; compute
    Table A on the form. At or above the zero point, Line 3 = CT AGI. Do NOT supply raw federal AGI when CT modifications
    apply, and do NOT subtract the exemption twice.'
  - 'Adjudication note (two-pass): drafted from the 2024 CT-1040 instructions (Rev. 01/25) Tables A-E and independently
    re-verified against the 2024 CT-1040NR/PY instructions (Rev. 01/25) — identical tables, zero discrepancies. Every
    printed ''$X plus Y% of the excess over $Z'' constant in Table B equals the EXACT cumulative sum of the prior
    brackets (200/2,000/4,750/10,750/14,000/31,250 single-MFS; 400/4,000/9,500/21,500/28,000/62,500 MFJ; 320/3,200/7,600/17,200/22,400/50,000
    HoH), so pure marginal accumulation reproduces Table B to the half-dollar; the only divergence is IRS half-up
    rounding of a trailing $.50 (the DRS''s own printed examples round $2,500 x .045 = $112.50 to $113 at MFJ $22,500
    and $25,000 x .0699 = $1,747.50 up at single $525,000 -> $32,998).'
  - 'CRITICAL — Table C 2% Phase-Out Add-Back NOT modeled: if CT AGI (Tax Calculation Schedule Line 1, NOT taxable
    income) exceeds $56,500 single / $100,500 MFJ-QSS / $50,250 MFS / $78,500 HoH, Line 5 ADDS BACK $25-to-$250 (single/MFS,
    max above $101,500/$72,750), $50-to-$500 (MFJ, max above $145,500), or $40-to-$400 (HoH, max above $114,500),
    clawing back the benefit of the 2% bottom rate. Plain bracket math (this op) UNDERSTATES the filed tax by the
    Table C amount — compute Line 5 on the form. (Same AGI bands as 2023 but larger add-backs, since the phased-out
    benefit is now 2%-vs-4.5%.)'
  - 'CRITICAL — Table D Tax Recapture NOT modeled and RESTRUCTURED for 2024: recapture now begins at CT AGI over $105,000
    single/MFS / $210,000 MFJ-QSS / $168,000 HoH (2023: $200,000/$400,000/$320,000), recapturing the 4.5%-rate benefit
    in $25/$50/$40 steps to a first plateau of $250/$500/$400 at CT AGI $150,000-$200,000 / $300,000-$400,000 / $240,000-$320,000,
    then a second phase in $90/$180/$140 steps to a plateau of $2,950/$5,900/$4,600, then a third phase above CT AGI
    $500,000/$1,000,000/$800,000 to the maximum $3,400 (single/MFS, over $540,000), $6,800 (MFJ, over $1,080,000),
    $5,320 (HoH, over $864,000). Plain bracket math understates the filed tax by the Table D amount — CT''s Tax Calculation
    Schedule is the filed method.'
  - 'Table E Personal Tax Credits NOT modeled (a TAX CREDIT, not a base reduction): a CT-AGI-keyed decimal (.75 down
    to .01) multiplies the Line 7 tax and is subtracted on Line 9 for low/moderate incomes — e.g. .75 for single CT
    AGI $15,000-$18,800 — fully phased out above CT AGI $64,500 single / $100,500 MFJ-QSS / $52,500 MFS / $78,500
    HoH (identical to 2023).'
  - 'No-tax floor (2024 CT-1040 instructions, Line 6): if CT AGI (Line 5) is $12,000 or less MFS / $15,000 or less
    single / $19,000 or less HoH / $24,000 or less MFJ-QSS, enter ''0'' on Line 6 — no income tax is owed. This coincides
    with the full Table A exemption at those AGI levels (the engine''s max(0, ...) floor matches).'
  - 'Tax tables are OPTIONAL, not mandated: at CT AGI of $102,000 or less the filer ''may'' use the DRS website Tax
    Tables (portal.ct.gov/DRS/DRS-Forms/Current-Year-Forms/Calculators-and-Tables); the Tax Calculation Schedule is
    the universal filed method at any income (table bands can differ from schedule arithmetic by a few dollars).'
  - One Table B schedule covers 'Single or Married Filing Separately' — duplicated for both statuses here, copied,
    not derived (Table A/C/E amounts DO differ between single and MFS). The MFJ schedule is titled 'Married Filing
    Jointly/Qualifying Surviving Spouse', so qualifying surviving spouse maps exactly to married_filing_jointly as
    the engine assumes.
  - Connecticut has no county or municipal income taxes and no standard deduction; the Table A personal exemption
    and the personal credit are the only general-relief mechanisms, both income-dependent, both computed on the Tax
    Calculation Schedule.
