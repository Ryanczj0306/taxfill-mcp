  base: federal_agi
  tax_line: '2025 Form CT-1040, Line 6: ''Income Tax''. Computed on the Tax Calculation Schedule (2025 CT-1040 instructions,
    p. 19): Line 1 = Connecticut AGI (Form CT-1040, Line 5); Line 2 = Table A personal exemption; Line 3 = ''Connecticut
    Taxable Income: Subtract Line 2 from Line 1. If less than zero, enter 0.''; Line 4 = Table B Initial Tax Calculation
    (the rate schedules this block ships); Lines 5-6 add Table C (2% Tax Rate Phase-Out Add-Back) and Table D (Tax
    Recapture); Lines 8-9 apply the Table E personal-credit decimal; Line 10 ''Connecticut Income Tax: Subtract Line
    9 from Line 7. Enter here and on Form CT-1040, Line 6.'''
  exemptions: {}
  notes:
  - 'TY2025 RATES UNCHANGED — the TY2024 cut HELD: the 2024 reduction of the bottom two rates (3% -> 2% and 5% ->
    4.5%, Connecticut''s first income-tax rate cut since the mid-1990s) was NOT changed again for 2025. Table B for
    2025 is digit-identical to TY2024 in every bound, rate and printed constant, and the DRS reprints the same four
    worked examples. Tables A, C, D and E are likewise unchanged from 2024 (Table C maxima still $250/$500/$250/$400;
    Table D still begins at CT AGI over $105,000/$210,000/$168,000 with maxima $3,400/$6,800/$5,320).'
  - 'Base guidance: supply Tax Calculation Schedule Line 3 (Connecticut Taxable Income) = Connecticut AGI (Form CT-1040
    Line 5 = federal AGI + Schedule 1 additions - Schedule 1 subtractions) MINUS the Table A personal exemption. The
    Table A exemption (up to $15,000 single / $24,000 MFJ-QSS / $12,000 MFS / $19,000 HoH — unchanged for 2025) is
    INCOME-DEPENDENT — it falls $1,000 for each $1,000 (or part) of CT AGI over $30,000 / $48,000 / $24,000 / $38,000
    and is $0 at CT AGI of $44,000 / $71,000 / $35,000 / $56,000 or more — so it is NOT shipped as a key; compute
    Table A on the form. At or above the zero point, Line 3 = CT AGI. Do NOT supply raw federal AGI when CT modifications
    apply, and do NOT subtract the exemption twice.'
  - 'Adjudication note (two-pass): drafted from the 2025 CT-1040 instructions (Rev. 12/25) Tables A-E and independently
    re-verified against the 2025 CT-1040NR/PY instructions (Rev. 12/25) — Table A (221 numeric tokens), Table C (136)
    and Table D (450) compare as digit-identical multisets, all 28 Table E rows match row-by-row, and all 21 Table
    B rows match; zero discrepancies. Every printed ''$X plus Y% of the excess over $Z'' constant in Table B equals
    the EXACT cumulative sum of the prior brackets (200/2,000/4,750/10,750/14,000/31,250 single-MFS; 400/4,000/9,500/21,500/28,000/62,500
    MFJ-QSS; 320/3,200/7,600/17,200/22,400/50,000 HoH), so pure marginal accumulation reproduces Table B to the half-dollar;
    the only divergence is IRS half-up rounding of a trailing $.50, and the DRS''s own printed examples round the
    same way ($2,500 x .045 = $112.50 shown as $113 at MFJ Line 3 $22,500 -> $513, and $25,000 x .0699 = $1,747.50
    shown as $1,748 at single Line 3 $525,000 -> $32,998).'
  - 'CRITICAL — Table C 2% Phase-Out Add-Back NOT modeled: if CT AGI (Tax Calculation Schedule Line 1, NOT taxable
    income) exceeds $56,500 single / $100,500 MFJ-QSS / $50,250 MFS / $78,500 HoH, Line 5 ADDS BACK $25-to-$250 in
    $25 steps (single, maximum above $101,500), $25-to-$250 (MFS, maximum above $72,750), $50-to-$500 (MFJ-QSS, maximum
    above $145,500), or $40-to-$400 (HoH, maximum above $114,500), clawing back the benefit of the 2% bottom rate.
    Plain bracket math (this op) UNDERSTATES the filed tax by the Table C amount — compute Line 5 on the form. Bands
    and amounts are identical to 2024.'
  - 'CRITICAL — Table D Tax Recapture NOT modeled: recapture begins at CT AGI over $105,000 single/MFS / $210,000
    MFJ-QSS / $168,000 HoH, recapturing the 4.5%-rate benefit in $25/$50/$40 steps to a first plateau of $250/$500/$400
    at CT AGI $150,000-$200,000 / $300,000-$400,000 / $240,000-$320,000, then a second phase in $90/$180/$140 steps
    to a plateau of $2,950/$5,900/$4,600 (single at CT AGI $345,000-$500,000; MFJ-QSS $690,000-$1,000,000; HoH $552,000-$800,000),
    then a third phase in $50/$100/$80 steps to the maximum $3,400 (single/MFS, over $540,000), $6,800 (MFJ-QSS, over
    $1,080,000), $5,320 (HoH, over $864,000). Plain bracket math understates the filed tax by the Table D amount —
    CT''s Tax Calculation Schedule is the filed method. All 450 Table D numeric tokens are unchanged from 2024.'
  - 'Table E Personal Tax Credits NOT modeled (a TAX CREDIT, not a base reduction): a CT-AGI-keyed decimal (.75 down
    to .01 in 28 steps) multiplies the Line 7 tax and is subtracted on Line 9 for low/moderate incomes — e.g. .75
    for single CT AGI over $15,000 up to $18,800 — fully phased out above CT AGI $64,500 single / $100,500 MFJ-QSS
    / $52,500 MFS / $78,500 HoH (identical to 2023 and 2024).'
  - 'No-tax floor (2025 CT-1040 instructions, Line 6): ''For each filing status, if the amount on Line 5 is: $12,000
    or less for married filing separately; $15,000 or less for single; $19,000 or less for head of household; or $24,000
    or less for married filing jointly, or qualifying surviving spouse, enter 0 on Line 6. You do not owe any income
    tax.'' This coincides with the full Table A exemption at those AGI levels (the engine''s max(0, ...) floor matches).'
  - 'Tax tables are OPTIONAL, not mandated: at CT AGI of $102,000 or less the filer ''may use the Tax Tables on the
    DRS website at portal.ct.gov/DRS/DRS-Forms/Current-Year-Forms/Calculators-and-Tables''; above $102,000 the filer
    may use the myconneCT Income Tax Calculator or the Tax Calculation Schedule. The Tax Calculation Schedule is the
    universal filed method at any income (table bands can differ from schedule arithmetic by a few dollars).'
  - One Table B schedule covers 'Single or Married Filing Separately' — duplicated for both statuses here, copied,
    not derived (Table A/C/E amounts DO differ between single and MFS). The MFJ schedule is titled 'Married Filing
    Jointly/Qualifying Surviving Spouse', so qualifying surviving spouse maps exactly to married_filing_jointly as
    the engine assumes.
  - Connecticut has no county or municipal income taxes and no standard deduction; the Table A personal exemption
    and the Table E personal credit are the only general-relief mechanisms, both income-dependent, both computed on
    the Tax Calculation Schedule. The CT EITC (Line 20a) was expanded for 2025 — still 40% of the federal EIC, plus
    an additional $250 for a taxpayer with at least one federal qualifying child — but it is a refundable payment/credit
    applied after Line 6 and is not part of this block.
  - 'Schedule 1 subtractions are the caller''s, not this block''s — the 2025 face adds Line 48d "Achieving Better Life
    Experience (ABLE)", summed into Line 50 and Line 4. 2025 Instructions p. 10, Line 48d ABLE (Achieving a Better Life
    Experience) Account: "Subtract the amount of your contributions made to an ABLE (Achieving a Better Life Experience)
    account. The modification cannot exceed the maximum allowable contribution. The maximum ABLE contribution that may
    be subtracted is the lesser of (1) the amount of contributions to all ABLE accounts during the taxable year; or
    (2)(A) $5,000 for each individual taxpayer, including individuals whose filing status on their Connecticut income
    tax return is single, head of household, filing separately, or (B) $10,000 for individuals whose filing status on
    their Connecticut income tax return is filing jointly or qualifying surviving spouse." The booklet prints no
    statute, effective year, carryforward or beneficiary rule, and is silent on whether the account must be
    Connecticut''s. (Schedule CT-IT Credit Line 3 "ABLE Account Tax Credit" is a different item — an employer credit.)'
  - 'Line 1 of the 2025 face cites "federal Form 1040, Line 11a, or federal Form 1040-SR, Line 11a" (the TY2025 Form 1040
    prints AGI on 11a); Line 13 "Total allowable credits from Schedule CT-IT Credit, Part 1, Line 10" (2023: Line 11).
    The page-1 "Do you need health coverage?" box has no tax effect: 2025 Instructions p. 2, "By checking the box on
    Form CT-1040, Connecticut Resident Income Tax Return, you authorize the Department of Revenue Services to transmit
    certain demographic information about you and your household to Access Health CT. This election authorizes Access
    Health CT to contact you with information about health coverage options and financial assistance that may be
    available to you." — an authorization, so it is checked only when the filer asks for it.'
# Promoted from this pack's own prose on 2026-08-11 (DEV_PLAN section 7.2): the single "2025 CHANGE FOUND"
# in this pack's header comment (the CT EITC expansion), also recorded in the credits block and
# tax.notes. modeled: false — the CT EITC is a refundable credit applied after Form CT-1040 Line 6, and
# this pack's tax block reproduces the Tax Calculation Schedule only. Rates and Tables A-E are unchanged
# from TY2024 (the TY2024 3% -> 2% / 5% -> 4.5% cut HELD), so there is no rate-side entry for 2025.
effective_law_changes:
- description: >-
    CT EITC EXPANDED for 2025: the credit remains 40% (.40) of the federal earned income credit claimed
    and allowed, but a new supplement was added — "Any taxpayer eligible for CT EITC that has at least one
    qualifying child for federal income tax purposes for the same taxable year, is eligible to receive an
    additional two hundred fifty dollars ($250)." The Schedule CT-EITC investment-income ceiling also rose
    to $11,950 for 2025 (from $11,600 for 2024). The DRS records the expansion on its "What's New for
    2025" page.
  status: final_form_published
  affects:
  - credits (Connecticut Earned Income Tax Credit)
  - Schedule CT-EITC
  - Form CT-1040 Line 20a
  modeled: false
  lookup_path: >-
    2025 Form CT-1040 Instructions (Rev. 12/25), Line 20a and the Schedule CT-EITC line instructions (the
    citation URL); the credit amount derives from the filer's federal EIC. This pack's tax block computes
    Line 6 income tax only and applies no refundable credits. (The Schedule CT-EITC form itself was not
    fetched — see the pack's unverified list.)
  citation:
    source: >-
      CT DRS — 2025 Form CT-1040 Instructions (Rev. 12/25), Line 20a Connecticut Earned Income Tax Credit (40%
      of the federal EIC plus the additional $250 for a taxpayer with at least one federal qualifying child) and Schedule
      CT-EITC line instructions ($11,950 investment-income limit); confirmed against the DRS "What's New for 2025"
      EITC expansion note
    url: 'https://portal.ct.gov/-/media/drs/forms/2025/income/2025-ct-1040-instructions_1225.pdf'

