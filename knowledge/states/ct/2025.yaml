  result.")'
residency:
  summary: 'Connecticut taxes by domicile and statutory residence. Per the DRS Tax-Information page, stated with explicit
    2025 wording: you are a RESIDENT for the 2025 taxable year if Connecticut was your domicile (permanent legal residence)
    for the entire 2025 taxable year, OR if you were not domiciled in Connecticut but maintained a permanent place
    of abode in Connecticut during the entire 2025 taxable year AND spent a total of more than 183 days in Connecticut
    during the 2025 taxable year. Nonresident aliens who meet either condition are considered Connecticut residents
    even if federal Form 1040NR is filed for federal purposes. Domicile is "the place you intend to have as your permanent
    home... the place you intend to return to whenever you are away. You can have only one domicile although you may
    have more than one place to live"; it does not change until you move to a new location and definitely intend to
    make your permanent home there. A PART-YEAR RESIDENT changed legal residence by moving into or out of Connecticut
    during the year. A NONRESIDENT is neither a resident nor a part-year resident and is taxed only on Connecticut-source
    income (Schedule CT-SI), prorating the tax.'
  citation:
    source: 'CT DRS Resident Income Tax — Tax Information (2025 edition: Who Must File a Connecticut Resident Return,
      Gross Income Test, residency/domicile and the 183-day statutory-resident rule, Special Information for Nonresident
      Aliens, What''s New for 2025)'
    url: 'https://portal.ct.gov/drs/individuals/resident-income-tax/tax-information'
