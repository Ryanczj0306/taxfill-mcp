# CT state knowledge — tax year 2025. Fetched + cited from the CT DRS (.gov),
# authored per the shipped 2024 template (state-year knowledge program). Loaded as
# a StateKnowledge. conforms_to_federal_treaties: whether federally treaty-exempt
# income flows through (most states start from federal AGI) or is added back
# (CA/CT/MD/MS-style). Figures the fetch could not independently confirm are in
# `unverified` — confirm at the cited source.
#
# Two-pass verification: every key figure was drafted from the 2025 Form CT-1040
# instructions (Rev. 12/25, 28 pages) and independently re-verified against the
# 2025 Form CT-1040NR/PY instructions (Rev. 12/25, 28 pages) and the 2025 Form
# CT-1040 itself (Rev. 12/25). Tables A, B, C, D and E were compared
# ROW-BY-ROW/token-by-token between the two 2025 booklets: Table A (221 numeric
# tokens), Table C (136), Table D (450) and Table E (28 rows) are digit-identical,
# and all 21 Table B rows across the three schedules print the same bounds, rates
# and constants. Zero discrepancies.
#
# THE 2025 RATE QUESTION, ANSWERED: the TY2024 bottom-rate cut (3% -> 2% and
# 5% -> 4.5%) HELD — Connecticut did NOT change rates again for 2025. Table B for
# 2025 is digit-identical to TY2024: 2.00% / 4.5% / 5.5% / 6.0% / 6.5% / 6.9% /
# 6.99% on the same bounds with the same printed constants ($200/$2,000/$4,750/
# $10,750/$14,000/$31,250 single-MFS; $400/$4,000/$9,500/$21,500/$28,000/$62,500
# MFJ-QSS; $320/$3,200/$7,600/$17,200/$22,400/$50,000 HoH) and the same four DRS
# worked examples ($335 / $32,998 / $513 / $69,490 / $500 / $51,748). Table A
# personal exemptions, Table C 2% Phase-Out Add-Back (max $250/$500/$250/$400),
# Table D Tax Recapture (still beginning at CT AGI over $105,000/$210,000/
# $168,000, max $3,400/$6,800/$5,320) and Table E personal-credit decimals are
# also unchanged from 2024.
#
# 2025 CHANGE FOUND: the CT EITC was EXPANDED. It remains 40% of the federal EIC,
# but a taxpayer eligible for the CT EITC who has at least one qualifying child
# for federal purposes now receives an ADDITIONAL $250 (2025 CT-1040 instructions,
# Line 20a; DRS "What's New for 2025"). The EITC investment-income ceiling rose
# from $11,600 (2024) to $11,950 (2025).
#
# Improvement over the 2024 pack: the Gross Income Test dollar chart and the
# statutory-residence rules are now confirmed 2025-specific from the DRS
# Tax-Information page, which prints them with explicit "2025 taxable year"
# wording — the 2024 pack could only infer the chart from the Line 6 no-tax floors.
jurisdiction: states/ct
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'CT''s resident return (Form CT-1040) starts from federal AGI (Line 1 = "Federal adjusted gross income
  from your 2025 federal income tax return"), so treaty-exempt income is initially excluded. HOWEVER, CT has an EXPLICIT
  ADD-BACK: the 2025 CT-1040 instructions (Schedule 1 additions, Line 37 "Other") and the 2025 CT-1040NR/PY instructions
  (Schedule 1 additions, "Other") both direct, verbatim and unchanged from 2023 and 2024: "1. Add back any treaty
  income reported on federal Form 1040NR if a nonresident alien. Enter the words ''treaty income'' in the space provided."
  Because CT requires nonresident aliens to add federally treaty-exempt income back into Connecticut adjusted gross
  income, CT does NOT conform to federal treaty exemptions for affected filers (analogous to California''s Schedule
  CA add-back). Reinforcing this, the DRS Tax-Information page states that nonresident aliens who are domiciled in
  Connecticut, or who keep a permanent place of abode there and spend more than 183 days in the state, "are considered
  Connecticut residents even if federal Form 1040NR is filed for federal income tax purposes." Note: the add-back
  is scoped to nonresident aliens filing federal Form 1040NR; a filer with no treaty income is unaffected, but the
  statutory rule re-taxes treaty income, so conforms_to_federal_treaties = false.'
