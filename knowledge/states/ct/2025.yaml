credits:
- name: 'Connecticut Earned Income Tax Credit (CT EITC)'
  type: refundable
  eligibility: 'Connecticut full-year residents who claimed and were allowed the 2025 federal earned income credit
    ("You must have claimed the 2025 federal earned income credit to claim the CT EITC"). Taxpayer (and spouse/qualifying
    children, if applicable) must have valid Social Security Numbers by the return due date, must have earned income
    from employment or self-employment, and must meet all federal EITC rules. Either qualify with a qualifying child,
    or as a worker without a qualifying child aged 25-64.'
  amount: '40% (.40) of the federal earned income credit claimed and allowed on the 2025 federal return, PLUS a new
    2025 supplement: "Any taxpayer eligible for CT EITC that has at least one qualifying child for federal income
    tax purposes for the same taxable year, is eligible to receive an additional two hundred fifty dollars ($250)."
    If the CT EITC exceeds the Connecticut income tax liability the excess is an overpayment and is refunded.'
  income_limit_2025: 'Mirrors federal EITC income limits; additionally, investment income must be $11,950 or less
    for 2025 ("You cannot claim the CT EITC if your investment income is more than $11,950") — up from $11,600 for
    2024.'
  claimed_on: 'Schedule CT-EITC, carried to Form CT-1040, Line 20a (or Form CT-1040X, Line 20a)'
  citation:
    source: 'CT DRS — 2025 Form CT-1040 Instructions (Rev. 12/25), Line 20a Connecticut Earned Income Tax Credit (40%
      of the federal EIC plus the additional $250 for a taxpayer with at least one federal qualifying child) and Schedule
      CT-EITC line instructions ($11,950 investment-income limit); confirmed against the DRS "What''s New for 2025"
      EITC expansion note'
    url: 'https://portal.ct.gov/-/media/drs/forms/2025/income/2025-ct-1040-instructions_1225.pdf'
- name: 'Property Tax Credit (Schedule 3)'
  type: nonrefundable
  eligibility: 'Connecticut residents who paid qualifying property tax during 2025 to a Connecticut political subdivision
    on their primary residence and/or a privately owned or leased motor vehicle. Single/MFS/HoH limited to one motor
    vehicle; MFJ/qualifying surviving spouse limited to two. Cannot be claimed if Form CT-1040 Line 10 is zero, cannot
    be carried forward, and is not refundable — "This credit can be used to offset only your 2025 income tax."'
  amount: 'Maximum credit is $300 per return regardless of filing status; limited to the lesser of qualifying property
    tax paid or $300, then phased down by Connecticut AGI per the Property Tax Credit Table (2025 instructions, Page
    27). Full $300 (no reduction) allowed at or below the filing-status threshold below; above it, the credit is multiplied
    by a decimal that decreases as AGI rises.'
  income_limit_2025: 'Full credit allowed at Connecticut AGI of: Single $49,500 or less; MFJ/qualifying surviving spouse
    $70,500 or less; Married filing separately $35,250 or less; Head of household $54,500 or less (unchanged from
    2023 and 2024). Above these the credit phases out per the Property Tax Credit Table.'
  claimed_on: 'Form CT-1040, Schedule 3 (Lines 60-68), carried to Form CT-1040, Line 11'
  citation:
    source: 'CT DRS — 2025 Form CT-1040 Instructions (Rev. 12/25), Line 11 / Schedule 3 Property Tax Credit ($300
      maximum per return, Connecticut AGI thresholds) and the Property Tax Credit Table on Page 27'
    url: 'https://portal.ct.gov/-/media/drs/forms/2025/income/2025-ct-1040-instructions_1225.pdf'
- name: 'Personal Tax Credit (low-income credit, Table E)'
  type: nonrefundable
  eligibility: 'Connecticut resident individuals whose Connecticut AGI falls within the Table E phase-out ranges for
    their filing status. Taxpayers below the no-tax threshold owe no income tax and need no credit; the personal credit
    reduces the income tax for low-to-moderate income filers just above that threshold.'
  amount: 'A decimal percentage reduction of the calculated Connecticut income tax, up to .75 (75%), declining in
    28 steps to .00 as Connecticut AGI rises. Example (Single): .75 for CT AGI over $15,000 up to $18,800; stepping
    down to .00 once CT AGI exceeds $64,500. The 2025 Table E is digit-identical to 2023 and 2024 (all 28 rows compared).'
  income_limit_2025: 'Credit fully phases out (decimal = .00) above: Single $64,500; MFJ/qualifying surviving spouse
    $100,500; Married filing separately $52,500; Head of household $78,500. Filers at or below the no-tax floor (MFS
    $12,000 / Single $15,000 / HoH $19,000 / MFJ-QSS $24,000) owe no tax at all.'
  claimed_on: 'Tax Calculation Schedule, Line 8 (decimal from Table E), multiplied on Line 9 and subtracted from the
    Line 7 tax to give the income tax reported on Form CT-1040, Line 6'
  citation:
    source: 'CT DRS — 2025 Form CT-1040 Instructions (Rev. 12/25), Table E Personal Tax Credits (Page 23); Tax Calculation
      Schedule Lines 8-10 (Page 19); Line 6 Income Tax no-tax floors'
    url: 'https://portal.ct.gov/-/media/drs/forms/2025/income/2025-ct-1040-instructions_1225.pdf'
- name: 'Credit for Income Taxes Paid to Qualifying Jurisdictions (Schedule 2)'
  type: nonrefundable
  eligibility: 'Connecticut residents (and part-year residents) whose income reported on the CT return is also subject
    to income tax in another qualifying jurisdiction (another U.S. state, a local jurisdiction within another state,
    or the District of Columbia) where the taxpayer filed a return and paid income tax. Prevents double taxation of
    the same income. A copy of the other jurisdiction''s return must be attached.'
  amount: 'Limited to the lesser of (a) the income tax actually paid to the qualifying jurisdiction on income also
    taxed by Connecticut, or (b) the proportion of Connecticut income tax attributable to that income (Connecticut
    income tax multiplied by the ratio of income taxed in the other jurisdiction to Connecticut AGI). Computed on
    Schedule 2.'
  income_limit_2025: 'No specific income limit; the credit amount is capped by the formula above.'
  claimed_on: 'Form CT-1040, Schedule 2, carried to Form CT-1040, Line 7'
  citation:
    source: 'CT DRS — 2025 Form CT-1040 Instructions (Rev. 12/25), Line 7 / Schedule 2 Credit for Income Taxes Paid
      to Qualifying Jurisdictions'
    url: 'https://portal.ct.gov/-/media/drs/forms/2025/income/2025-ct-1040-instructions_1225.pdf'
filing_requirement:
  note: 'Connecticut uses a "Gross Income Test." Per the DRS Tax-Information page, stated for 2025: "You must file
    a Connecticut income tax return if your gross income for the 2025 taxable year exceeds: $12,000 and you are married
    filing separately; $15,000 and you are filing single; $19,000 and you are filing head of household; or $24,000
    and you are married filing jointly or qualifying surviving spouse." (Unchanged from 2023 and 2024, and the same
    dollar levels as the Line 6 no-tax floors printed in the 2025 instructions.) You must also file if you had Connecticut
    income tax withheld, made estimated payments, meet the Gross Income Test, had a federal alternative minimum tax
    liability, or are claiming a Connecticut refund. Nonresidents/part-year residents file CT-1040NR/PY if they meet
    the Gross Income Test or had federal AMT liability (and, for nonresidents, had Connecticut-source income).'
  citation:
    source: 'CT DRS Resident Income Tax — Tax Information, "Gross Income Test" section (2025 taxable-year dollar thresholds)'
    url: 'https://portal.ct.gov/drs/individuals/resident-income-tax/tax-information'
