  # section — page 1 sends the filer to DRS's nonresident and part-year information page, whose 'Who Must File Form
  # CT-1040NR/PY' section is quoted here. The two PDFs are the CT-1040NR/PY links on DRS's current-year Individual
  # Income Tax Forms page (portal.ct.gov/drs/drs-forms/current-year-forms/individual-income-tax-forms); each was
  # downloaded twice on 2026-10-16 with identical sha256 (instructions 2c9648d6ba3c59f7..., return abddac561c4471ec...).
  # The HTML page was fetched twice the same day: its bytes differ only in a server timestamp and the stylesheet and
  # script version strings (2309ab0d0e69b5b5..., d023cdd15d5a76d1...), and its visible text is identical in both, the
  # quoted section's text included (37d21b053ad5c0ec...). The
  # part_year_or_nonresident text above agrees with the 2025 return (line 6 is 'Income from Connecticut sources from
  # Schedule CT-SI, Line 30').
  # The information page's URL carries no year, but its text is written for one taxable year ('... if you were a
  # nonresident or part-year resident of Connecticut in 2025 and any of the following is true for the 2025 taxable
  # year:'). That year-specific sentence is therefore the verification anchor: a TY2026 run re-checks it, not the URL.
  # No 2025 DRS PDF carrying the who-must-file list was found (the 2025 CT-1040NR/PY instructions have none), so the
  # page stays the citation.
  # The source registry (knowledge/sources_states.yaml, written by scripts/assemble_state_sources.py) keeps only the
  # first citation of a URL under each topic, and it reads `forms` before `all_citations`. So the part-year
  # instructions entry, the first one for that URL, repeats word for word after ' | ' the all_citations description of
  # the same instructions. Without it the registry and get_sources would lose that description (the treaty-income
  # add-back and the Tables A-E second pass).
