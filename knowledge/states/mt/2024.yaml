- description: >-
    NEW for 2024 — NET LONG-TERM CAPITAL GAINS are taxed on their own schedule, 3.0% up to the
    filing-status breakpoint ($20,500 single/MFS, $41,000 MFJ/QSS, $30,750 HoH, measured after
    stacking on ordinary income) and 4.1% above, computed on Form 2 page 2 lines 2-11; the old
    Resident Capital Gains Credit (2% of net capital gains) is REPEALED. The two-rate 4.7%/5.9%
    schedule therefore applies only to "taxable income without long-term capital gains" (Montana
    Ordinary Income, which includes qualified dividends). Running a filer's whole line 7 through
    the ordinary brackets OVERSTATES the tax whenever there are net long-term capital gains.
  status: final_form_published
  affects:
  - Form 2 page 2 lines 2-11 (net long-term capital gains tax)
  - tax.brackets (ordinary income only)
  - credits (Resident Capital Gains Credit — repealed)
  modeled: false
  lookup_path: >-
    The Montana Individual Income Tax worksheet on page 2 of the 2024 Form 2 itself (the citation
    URL), lines 2-11 with the printed $20,500/$41,000/$30,750 breakpoints on line 5 and the 3%
    (0.03) / 4.1% (0.041) multipliers; calc.state_tax has no capital-gains split.
  citation:
