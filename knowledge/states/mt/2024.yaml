  point plus the absence of any treaty add-back among the enumerated Schedule I addition lines. Recommend confirming
  treaty treatment with the MT DOR for any case with treaty-specific facts.
- The Elderly Homeowner/Renter Credit amount (up to $1,150) and $45,000 household-income limit are from the 2024
