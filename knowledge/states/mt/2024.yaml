tax:
  citation:
    source: '2024 Montana Form 2 Individual Income Tax Instructions (MT DOR, V5 12/17/2024), p.14 — ''2024 Montana Ordinary
      Income Tax Rates'': Single and Married Filing Separately — $0 to less than $20,500 multiply by 4.7% less $0, $20,500
      or greater multiply by 5.9% less $246; Married Filing Jointly and Qualifying Surviving Spouse — breakpoint $41,000,
      5.9% less $492; Head of Household — breakpoint $30,750, 5.9% less $369. The rates apply to Montana ORDINARY income
      (taxable income without net long-term capital gains). Worked example (instructions p.12): $50,000 single -> ''Her
      Montana Ordinary Income Tax is $2,704'' — matching marginal bracket math (4.7% x 20,500 + 5.9% x 29,500 = 963.50
      + 1,740.50 = 2,704). Second pass: the 2024 Form 2 itself (https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2/2024_Montana_Individual_Income_Tax_Return_Form_2.pdf)
      prints the $20,500/$41,000/$30,750 filing-status amounts on page 2, line 5, and the What''s New confirms the two-rate
      structure (SB 399 (2021); SB 121 (2023) reduced the top rate 6.5% -> 5.9%) — both passes agree.'
    url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2024_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 20500, rate: 0.047}
    - {over: 20500, but_not_over: null, rate: 0.059}
    married_filing_jointly:
    - {over: 0, but_not_over: 41000, rate: 0.047}
    - {over: 41000, but_not_over: null, rate: 0.059}
    married_filing_separately:
    - {over: 0, but_not_over: 20500, rate: 0.047}
    - {over: 20500, but_not_over: null, rate: 0.059}
    head_of_household:
    - {over: 0, but_not_over: 30750, rate: 0.047}
    - {over: 30750, but_not_over: null, rate: 0.059}
  base: federal_taxable_income
  tax_line: 'Form 2, page 1, line 8 ''Tax liability before tax credits'', computed on the page 2 ''Montana Individual
    Income Tax'' worksheet: line 12 ''figure your tax on the amount on line 1 [Montana taxable income, page 1 line
    7] using the Montana Ordinary Income Tax Table'' (on line 4 — taxable income minus net long-term capital gains
    — if you have net LTCG), plus the line 11 net long-term capital gains tax; residents enter the line 13 sum on
    page 1, line 8.'
  exemptions:
    age_65:
      amount: 5500
      note: 'NEW 2024 subtraction, NOT an exemption in the old sense: Form 2, page 1, line 6 — ''$5,500 subtraction for
        taxpayers 65 and older ($11,000 if married filing jointly and both are 65 and older)'', subtracted from federal
        taxable income in computing line 7 Montana taxable income. NOT applied by calc.state_tax (the engine applies only
        personal/dependent keys) — claim it on the form; the caller''s supplied line 7 base should already reflect it.
        Inflation-adjusted beginning tax year 2025.'
  notes:
  - '2024 STRUCTURAL CHANGE (SB 399 (2021) + SB 121 (2023)) — DO NOT USE 2023 FIGURES: the seven-bracket 1%-6.75%
    schedule, the $2,960-per-person exemptions, and the 20%-of-AGI Montana standard deduction (max $5,540/$11,080)
    are ALL REPEALED. For 2024 Montana taxes ORDINARY income in two brackets — 4.7% to $20,500 (single/MFS), $41,000
    (MFJ/QSS), $30,750 (HoH); 5.9% above — applied to Montana taxable income built from FEDERAL TAXABLE income. There
    are no Montana personal or dependent exemptions and no Montana standard deduction (the federal one is embedded
    in the base): pass exemptions_count=0 and dependents_count=0.'
  - 'Base guidance: Supply 2024 Form 2, page 1, line 7 — ''Montana taxable income'' = line 3 federal taxable income
    for Montana + line 4 Montana additions (Schedule I) - line 5 Montana subtractions (Schedule I) - line 6 the $5,500/$11,000
    age-65+ subtraction; floored at 0. For a filer with no Montana adjustments, under 65, who took the FEDERAL STANDARD
    deduction and has no federal QBI deduction, line 7 equals federal Form 1040, line 15 (federal taxable income).
    CAVEATS in deriving line 3: itemizers must use Worksheet A to remove state income taxes from federal itemized
    deductions (only to the extent the deduction stays above the federal standard deduction — MFS itemizers remove
    ALL of it), and the federal qualified business income (QBI) deduction under IRC 199A is NEVER included — so 1040
    line 15 understates line 3 for QBI claimants. The op subtracts NOTHING further — line 7 already reflects every
    deduction and subtraction.'
  - 'CRITICAL — the shipped brackets tax ORDINARY income only: Montana''s two-bracket 4.7%/5.9% schedule applies to
    ''taxable income without long-term capital gains'' (Montana Ordinary Income, which includes qualified dividends).
    NET LONG-TERM CAPITAL GAINS are taxed separately at 3.0% up to the same filing-status breakpoint (measured after
    stacking on ordinary income, Form 2 page 2 lines 2-10) and 4.1% above. If the filer has NO net long-term capital
    gains, this op''s bracket math on line 7 reproduces the page 2 line 12 tax exactly. If they do, compute the split
    on the page 2 worksheet — running the full line 7 through these brackets OVERSTATES the tax (the LTCG portion
    would be taxed at 4.7%/5.9% instead of 3.0%/4.1%). The old Resident Capital Gains Credit (2% of gains) is REPEALED.'
  - 'FEDERAL FILING STATUSES (new 2024): taxpayers must use the same filing status as the federal return — including
    QUALIFYING SURVIVING SPOUSE, which shares the MFJ schedule (the rate table is titled ''Married Filing Jointly
    and Qualifying Surviving Spouse'' and the Form 2 line 5 prints $41,000 for both), so the engine''s QSS-to-MFJ
    mapping is exactly correct. The old Montana statuses 2a/2b/2c (married filing separately on the same form, etc.)
    are gone; MFS is allowed only if the couple filed separate federal returns. MFS uses the single-status schedule
    ($20,500 breakpoint), NOT half of MFJ.'
  - 'The printed ''multiply by ... Less'' constants are EXACT: $246 = (5.9% - 4.7%) x $20,500, $492 = (5.9% - 4.7%)
    x $41,000, and $369 = (5.9% - 4.7%) x $30,750 to the cent — no rounding divergence between the printed worksheet
    method (5.9% x income - constant) and pure marginal bracket math. The instructions'' own example ($50,000 single
    -> $2,704) matches both methods exactly.'
  - 'No lookup-table mandate: the ''Montana Ordinary Income Tax Table'' (p.14) is a rate FORMULA schedule (''Then
    your tax rate is ... Less''), not a row-lookup table, so bracket math is exact at every income level.'
  - 'Age 65+ subtraction NOT applied by the op: the $5,500 ($11,000 MFJ both 65+) line 6 subtraction is disclosed
    as an informational ''age_65'' key but calc.state_tax does not subtract it — the supplied line 7 base must already
    reflect it (it is a return line, not an engine adjustment).'
  - Montana EITC (Form 2, page 1, line 15 = 10% of the federal EITC for 2024, up from 3% in 2023) is a refundable
    CREDIT — NOT modeled by this op. Nonrefundable credits (Schedule III Part I) and refundable credits (Schedule
    III lines 15-16, e.g. the $7,500/$5,000 Adoption Credit) reduce or supplement tax AFTER line 8 and are not modeled.
  - Recapture taxes, lump-sum distribution taxes, penalties, and interest are reported on Schedule IV and added on
    page 1, line 19 — NOT modeled; if owed, the return total exceeds plain bracket math on line 7.
  - 'Nonresidents and part-year residents (and Montana residents filing jointly with nonresident/part-year spouses):
    bracket math on line 7 yields only the resident tax (page 2 lines 11-12); the tax is then apportioned by the Montana-source
    ratio on Schedule II (Tax on Montana Source Income) — page 2 line 12 goes to Schedule II line 19 and line 11 to
    Schedule II line 24. This op models the full-year RESIDENT computation (page 2, line 13).'
  - 'Rounding: the 2024 Form 2 is a whole-dollar return (every money field prints ''00'' cents); the engine''s half-up
    rounding to whole dollars matches the form''s presentation. The instructions'' worked examples round the same
    way ($2,704 exactly).'
  - '2024 is the FIRST year of this structure and there was NO mid-year 2024 rate change: SB 399 (2021) set the redesign
    effective tax year 2024 with a 6.5% top rate, and SB 121 (2023) lowered the top rate to 5.9% before the year began.
    The 2023 pack (7 brackets, $2,960 exemptions, 20% standard deduction) must not be used for 2024, and this pack
    must not be used for 2023 or earlier.'
# effective_law_changes promoted 2026-08-11 from this pack's OWN prose (the HEADLINE 2024
# CHANGE header comment, the What's New enumeration in all_citations, the EITC credit entry and
# the tax notes) per DEV_PLAN §7.2 — no new research. The SB 399/SB 121 restructure is
# modeled: true (this pack's tax block IS the two-rate federal-taxable-income structure); the
# separate capital-gains rates and the age-65 subtraction are modeled: false — the shipped
# brackets tax ORDINARY income only, and the line 6 subtraction is disclosed informationally but
# never applied by calc.state_tax.
effective_law_changes:
- description: >-
    TOTAL RESTRUCTURE for tax year 2024 — SB 399 (2021) "Income Tax Simplification" as amended by
    SB 121 (2023). The old seven-bracket 1%-6.75% schedule, the $2,960-per-person exemptions and
    the 20%-of-AGI Montana standard deduction (max $5,540/$11,080) are ALL REPEALED, and the
    Montana NOL was repealed. Montana now starts from FEDERAL TAXABLE INCOME (Form 2 line 3 =
    federal AGI from Form 1040 line 11 minus the federal standard deduction or adjusted federal
    itemized deductions, with the federal QBI deduction NOT allowed), requires the same filing
    status as the federal return (including Qualifying Surviving Spouse, and MFS only if separate
    federal returns were filed), and taxes ORDINARY income in TWO brackets — 4.7% up to $20,500
    single/MFS ($41,000 MFJ/QSS, $30,750 HoH) and 5.9% above, SB 121 having lowered that top rate
    from SB 399's 6.5% before the year began. The filing requirement now simply follows the
    federal one (the old fixed $5,540-style thresholds are gone), and tax year 2024 carries a
    one-time transition adjustment (Schedule I line 7).
  status: final_form_published
