      Federal EIC by 10% (0.10)'
    url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2/2024_Montana_Individual_Income_Tax_Return_Form_2.pdf
- description: >-
    NEW for 2024 — a $5,500 subtraction for taxpayers 65 and older ($11,000 if married filing
    jointly and both are 65 and older), taken on Form 2 page 1 line 6 against federal taxable
    income in arriving at line 7 Montana taxable income. It replaces the repealed $2,960
    age-65/blind exemptions and is inflation-adjusted beginning tax year 2025.
  status: final_form_published
  affects:
  - tax.exemptions.age_65 (informational only)
  - Form 2 page 1 line 6
  - calc.state_tax taxable_base (caller-supplied line 7 must already reflect it)
  modeled: false
  lookup_path: >-
    Form 2 page 1 line 6 and the corresponding line instruction in the 2024 Form 2 instructions
    (the citation URL); the engine applies only personal/dependent exemption keys, so the caller's
    line 7 base must already net this subtraction out.
