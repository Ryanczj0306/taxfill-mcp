  source: 2025 Montana Form 2 Individual Income Tax Instructions (MT DOR, 42 pages) — What's New (2025 legislative
    changes HB 845 / SB 53 / SB 93 / SB 544, and the notice that HB 337's rate cut and the 20% EITC begin in tax
    year 2026), 2025 Montana Income Tax Rates (p.12), Filing Requirements incl. the thirty-day nonresident worker
    exclusion, Residency Status and the new Mixed Residency checkbox, North Dakota Reciprocity, Due Dates (April
    15, 2026), mailing addresses (PO Box 6577 refund / PO Box 6308 with payment), payment (check payable to the Montana
    Department of Revenue; TransAction Portal https://tap.dor.mt.gov)
  url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2025_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
starts_from: 'federal TAXABLE income: 2025 Form 2, line 1 = federal AGI (Form 1040, line 11b); line 2 = Form 1040
  lines 12e and 13b (the federal standard deduction or federal itemized deductions, plus the additional Schedule
  1-A deductions for qualified tips and the other One Big Beautiful Bill items); line 3 = federal taxable income
  for Montana. Montana taxable income (line 7) = line 3 + line 4 Montana additions (Schedule I) - line 5 Montana
  subtractions (Schedule I) - line 6 the $5,660 subtraction for taxpayers 65 and older ($11,320 MFJ if both are
  65 and older), floored at zero. NOTE: for tax year 2023 and earlier Montana started from federal AGI with its own
  standard deduction and $2,960 exemptions — do not use this pack for those years.'
residency:
  summary: 'Montana recognizes resident, part-year resident, and nonresident status, plus a NEW-for-2025 "Mixed Residency"
    checkbox. RESIDENT: "You are a Montana resident if you are domiciled or maintain a permanent place of abode in
    Montana," and Montana taxes all of a resident''s income even if earned out-of-state. Domicile/permanent-abode
    factors include a MT driver''s license or ID, voting/registering to vote in MT, MT resident hunting/fishing licenses,
    claiming MT residency for college admission/financial aid, receiving MT-resident-only DPHHS program services,
    a concealed-weapon permit, claiming MT residency for tax purposes in prior years, motor-vehicle registration,
    where real estate/a mobile home/an RV with sleeping facilities is owned, rented, or occupied (non-exhaustive).
    PART-YEAR RESIDENT: a MT resident at the start of the year who established residency in another state during
    the year, OR a nonresident who established MT residency during the year; MT taxes income received while living
    in MT plus MT-source income received while not living in MT (Schedule II). NONRESIDENT: neither; MT taxes only
    Montana-source income. MIXED RESIDENCY (new 2025 checkbox): a resident filing jointly with a nonresident or part-year
    resident spouse marks Mixed Residency instead of Resident and uses Schedule II. A separate Nonresident Military
    Spouse checkbox was added for filers whose exempt wages were withheld on and who are filing only for a refund.
    The thirty-day nonresident worker exclusion (nonresidents earning only wages for services performed in Montana
    for 30 days or less who worked in more than one state) continues, with the same exclusions (professional athletes,
    entertainers, per-event performers, construction workers, salaries over $500,000, MEDIA-credit production employees),
    and does not apply to self-employed taxpayers or filers with other Montana-source income. Montana keeps its North
    Dakota wage reciprocity agreement and SCRA/MSRRA servicemember-spouse rules.'
forms:
  resident: Montana Form 2 — Individual Income Tax Return (most taxpayers complete only pages 1 and 2; Schedules
    I-V are separate pages included only when used).
  part_year_or_nonresident: There is no separate nonresident/part-year individual form for 2025. Nonresidents, part-year
    residents, and mixed-residency filers also file Montana Form 2 and complete Schedule II, "Tax on Montana Source
    Income," to apportion the tax. (The Transition Schedule used in 2024 has been discontinued — it applied only
    to tax year 2024.)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Montana Earned Income Tax Credit (EITC)
  type: refundable
  eligibility: Full-year Montana residents who claimed the federal Earned Income Tax Credit on their federal return.
    Nonresidents do NOT qualify (leave the line blank). Part-year residents, enrolled tribal members living on their
    reservation, members of IRC section 501(d) agricultural organizations, and resident active-duty servicemembers
    use Worksheet A (renamed for 2025 from the Earned Income Tax Credit Reduction Worksheet) to reduce the credit
    by the Montana-earned-income ratio.
  amount: '10% of the federal EITC for 2025 — 2025 Form 2, page 1, line 15: "Earned Income Credit. Federal EIC ___
    Multiply Federal EIC by 10% (0.10)", and the instructions'' Line 15 text, "a Montana earned income tax credit
    (EITC) of 10 percent of the federal EITC." Refundable — any excess over the Montana tax liability is refunded.
    NOTE: HB 337 raises the credit to 20% of the federal EITC BEGINNING IN TAX YEAR 2026 — that rate must not be
    used for 2025.'
  income_limit_2025: No separate Montana income limit; governed by federal EITC eligibility (the federal AGI/earned-income
    limits that determine federal EITC qualification).
  claimed_on: Form 2, page 1, line 15 (Worksheet A for part-year residents / tribal members / 501(d) members / resident
    active-duty servicemembers)
  citation:
    source: 2025 Montana Form 2 Instructions, Line 15 - Montana earned income tax credit ('a Montana earned income
      tax credit (EITC) of 10 percent of the federal EITC'; Worksheet A reduction examples 1-4) and What's New (HB
      337 increases the credit to 20% beginning in tax year 2026)
    url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2025_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
- name: Elderly Homeowner/Renter Credit
  type: refundable
  eligibility: Montana taxpayers age 62 or older who lived in Montana for more than nine months during the tax year,
    occupied a Montana residence as a renter, owner, or lessee for a total of six months or more during the year,
    and live in a household where the total income of all its members is less than $45,000. Available even to those
    with no other filing requirement (Schedule 2EC may be filed directly on the TransAction Portal under Individuals).
    One credit per household.
  amount: Refundable credit of up to $1,150. The exact amount is determined by the household income / rent / property-tax
    formula on Schedule 2EC (for 2025 the long-term care facility rent worksheet was renamed from Worksheet D to
    Worksheet C).
  income_limit_2025: Total household income of all household members must be less than $45,000.
  claimed_on: Schedule 2EC (Elderly Homeowner/Renter Credit), carried to Form 2, page 1, line 16
  citation:
    source: 2025 Montana Form 2 Instructions, Line 16 - Elderly Homeowner/Renter Credit ('a refundable tax credit
      of up to $1,150'; household income less than $45,000; age 62 or older; more than nine months in Montana; six
      months or more as renter/owner/lessee) and the Schedule 2EC instructions
    url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2025_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
- name: Montana Adoption Credit
  type: refundable
  eligibility: Montana residents who complete an adoption. Form ADPT and paperwork documenting the adoption (for
    foster-care adoptions, the signed adoption confirmation letter from Montana DPHHS) must be included with the
    return.
  amount: $7,500 for the adoption of a child in the Montana foster care system and $5,000 for any other child under
    the age of 18 or person who is physically or mentally incapable of providing self-care.
  income_limit_2025: None stated.
  claimed_on: Schedule III (Tax Credits), Part I refundable credits, line 15, carried to Form 2, page 1, line 17;
    Form ADPT required
  citation:
    source: 2025 Montana Form 2 Instructions, Schedule III, Line 15 - Adoption Credit ($7,500 for a child in the
      Montana foster care system, $5,000 for any other child under 18 or person incapable of self-care)
    url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2025_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
- name: Credit for Income Taxes Paid to Another State or Country
  type: nonrefundable
  eligibility: Full-year or part-year Montana residents who paid income tax to another state or country on income
    that is also taxed by Montana. Not available if the other state allowed a credit against its own tax for the
    Montana tax on the same income, or for taxes paid on Montana-source income. Pass-through entity owners may claim
    their share of qualifying entity-level income taxes (including composite and pass-through entity taxes).
  income_limit_2025: No income limit; the credit is limited by the Schedule III Part II computation.
  claimed_on: Schedule III (Tax Credits), Part II — the credit is calculated SEPARATELY for ordinary income and for
    net long-term capital gains (because Montana has two rate tables), each limited by an income-ratio formula.
  citation:
    source: 2025 Montana Form 2 Instructions, Schedule III Part II - Credit for Income Taxes Paid to Another State
      or Country (separate ordinary-income and net-long-term-capital-gains computations)
    url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2025_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
filing_requirement:
  note: 'Per the 2025 Form 2 instructions, General Instructions - Filing Requirements: "In general, if during the
    tax year you were a resident or part-year resident of Montana, or if you were a nonresident who received Montana
    source income; and you had a requirement to file a federal tax return, then you must file a Montana income tax
    return. If you did not have a federal filing requirement, but have a Montana addition or subtraction, you also
    must file a Montana income tax return." There are no fixed dollar thresholds. You must also file to claim the
    Montana EITC or the Elderly Homeowner/Renter Credit (Schedule 2EC may alternatively be filed on the TransAction
    Portal), and taxpayers who incurred or reported capital or passive losses must file to track the sourcing of
    those losses (unreported losses may be disallowed in future years). THIRTY-DAY NONRESIDENT WORKER EXCLUSION:
    nonresidents who earned only wages for services performed in Montana for 30 days or less and worked in more than
    one state during the tax year do not have to file or pay Montana tax on that income; the exclusion does not apply
    to professional athletes, entertainers, per-event performers, construction workers, employees with annual salaries
    over $500,000, MEDIA-credit qualified production employees, self-employed taxpayers, or filers with other Montana-source
    income. Enrolled tribal members living on their own reservation generally have a filing requirement but may subtract
    reservation-sourced income on Schedule I. North Dakota residents'' Montana wages are exempt under reciprocity
    (file only to recover withholding, marking the Nonresident and North Dakota Reciprocity boxes).'
