# MT state knowledge — tax year 2025. Fetched + cited from the MT DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 Montana Form 2
# Individual Income Tax Instructions (42 pages), then independently re-derived from the
# 2025 Form 2 itself, which prints the $21,100/$42,200/$31,700 breakpoints on page 2 line 5,
# the 3% (0.03) / 4.1% (0.041) capital-gains multipliers, the $5,660/$11,320 age-65
# subtraction on page 1 line 6, and the 10% EITC multiplier on page 1 line 15 —
# resolutions recorded inline where the passes differed.
# HEADLINE 2025 CHANGES: the SB 399 structure from 2024 is UNCHANGED in shape — Montana
# still starts from FEDERAL TAXABLE INCOME and still taxes ORDINARY income in two brackets
# at 4.7% and 5.9%, with net long-term capital gains taxed separately at 3.0%/4.1%. What
# moved for 2025: the bracket breakpoints were re-indexed to $21,100 single/MFS, $42,200
# MFJ/QSS, $31,700 HoH (2024: $20,500/$41,000/$30,750), the printed 'Less' constants became
# $253/$506/$380 (and, unlike 2024's, they are now ROUNDED DOWN from the exact 1.2% x
# breakpoint — see the tax notes), and the age-65 subtraction was inflation-adjusted to
# $5,660 ($11,320 MFJ both 65+) from $5,500/$11,000. Legislative changes effective for 2025:
# HB 845 + SB 53 (529 subtraction max up to $4,500 / $9,000 joint), SB 93 (military
# retirement subtraction made permanent), SB 544 (Montana NOL transition adjustment).
# CRITICAL: HB 337's top-rate cut to 5.65% and the EITC increase to 20% begin in TAX YEAR
# 2026 (5.4% in 2027) — they must NOT be applied to 2025. The 2025 top rate is 5.9% and the
# 2025 EITC is 10% of the federal EITC.
jurisdiction: states/mt
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'MT conforms. For tax year 2025 Montana starts from FEDERAL TAXABLE INCOME: 2025 Form 2, line 1 is
  "Federal adjusted gross income from Form 1040, line 11b", line 2 is "Add Form 1040, lines 12e and 13b" (the federal
  standard or itemized deduction plus the additional Schedule 1-A deductions), and line 3 is the resulting federal
  taxable income for Montana. Federally treaty-exempt income (excluded from federal AGI under an applicable U.S.
  tax treaty) is therefore already absent from the MT starting figure. Montana additions on Schedule I, Part I are
  items of income not included in federal taxable income that must be added back, and the enumerated 2025 addition
  lines are interest/mutual-fund dividends from other states'' state/county/municipal bonds; other recoveries of
  amounts deducted in earlier years; Montana MSA / First-Time Homebuyer Account nonqualified withdrawals; state income
  taxes included in federal itemized deductions (line 4, computed on Worksheet B — NEW placement for 2025); expenses
  used to claim a Montana tax credit; and other additions by code. NONE is an add-back of treaty-exempt income. Unlike
  California (Schedule CA), Montana has no treaty-income addback for 2025, so treaty-exempt income is not re-taxed.'
