unverified:
- No explicit statement found in the 2025 Form 2 instructions that uses the word 'treaty' or directly addresses U.S.
  tax-treaty-exempt income; conformity is inferred (high confidence) from the federal-taxable-income starting point
  plus the absence of any treaty add-back among the enumerated Schedule I addition lines. Recommend confirming treaty
  treatment with the MT DOR for any case with treaty-specific facts.
- The Elderly Homeowner/Renter Credit amount (up to $1,150) and $45,000 household-income limit are from the 2025
  instructions Line 16 text; the full Schedule 2EC computation was not re-derived line-by-line this pass.
- The full text of HB 337 was not pulled; the pack relies on the instructions' own What's New statement that its
  rate cut, wider brackets, and 20% EITC begin with tax year 2026 (with a further reduction in 2027), and on the
  2026/2027 tax tables printed on p.42 of the booklet (2026 top rate 5.65% at $47,500 single / $95,000 MFJ / $71,250
  HoH; 2027 top rate 5.4% at $65,000 / $130,000 / $97,500).
- Worksheet B (the new computation for the state-income-tax addback on Schedule I, Part I, line 4) was not read line-by-line;
  only its purpose and placement were captured.
tax:
  citation:
    source: '2025 Montana Form 2 Individual Income Tax Instructions (MT DOR, 42 pages), p.12 — ''2025 Montana Income
      Tax Rates'': Single and Married Filing Separately Ordinary Income Tax Rates — $0 to less than $21,100 tax rate
      4.7% Less $0, $21,100 or greater 5.9% Less $253; Married Filing Jointly and Qualifying Surviving Spouse — breakpoint
      $42,200, 5.9% Less $506; Head of Household — breakpoint $31,700, 5.9% Less $380. The rates apply to Montana ORDINARY
      income (''taxable income without net long-term capital gains'', which includes qualified dividends); net long-term
      capital gains are taxed separately at 3% up to the same breakpoint (measured after ordinary income) and 4.1% above.
      Worked example (instructions p.11, Marla): Montana taxable income $50,000, single, no net long-term capital gains
      -> ''Her Montana Ordinary Income Tax is $2,697'' — matching marginal bracket math (4.7% x 21,100 + 5.9% x 28,900
      = 991.70 + 1,705.10 = 2,696.80 -> 2,697) and the printed formula method (5.9% x 50,000 - 253 = 2,697.00). Second
      pass: the 2025 Form 2 itself (https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2/2025_Montana_Individual_Income_Tax_Return_Form_2.pdf)
      prints the $21,100 / $42,200 / $31,700 filing-status amounts on page 2, line 5, and the 0.03 / 0.041 capital-gains
      multipliers on lines 8 and 10 — both passes agree. The booklet''s What''s New confirms the 4.7%/5.9% structure
      is unchanged for 2025 and that HB 337''s lower top rate (5.65%) and wider brackets begin in TAX YEAR 2026.'
    url: https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2-Instructions/2025_Montana_Individual_Income_Tax_Return_Form_2_Instructions.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 21100, rate: 0.047}
    - {over: 21100, but_not_over: null, rate: 0.059}
    married_filing_jointly:
    - {over: 0, but_not_over: 42200, rate: 0.047}
    - {over: 42200, but_not_over: null, rate: 0.059}
    married_filing_separately:
    - {over: 0, but_not_over: 21100, rate: 0.047}
    - {over: 21100, but_not_over: null, rate: 0.059}
    head_of_household:
    - {over: 0, but_not_over: 31700, rate: 0.047}
    - {over: 31700, but_not_over: null, rate: 0.059}
  base: federal_taxable_income
  tax_line: 'Form 2, page 1, line 8 ''Tax liability before tax credits'', computed on the page 2 ''Montana Individual
    Income Tax'' worksheet: line 12 is the Montana Ordinary Income Tax figured from the Ordinary Income Tax Table
    on page 12 of the instructions, applied to page 2 line 1 (Montana taxable income from page 1, line 7) — or to
    line 4 (taxable income minus net long-term capital gains) if the filer has a net long-term capital gain — plus
    the line 11 net long-term capital gains tax; residents enter the line 13 sum on page 1, line 8.'
  exemptions:
    age_65:
      amount: 5660
      note: 'Not an exemption in the old sense — it is the Form 2, page 1, line 6 subtraction: ''$5,660 subtraction for
        taxpayers 65 and older ($11,320 if married filing jointly and both are 65 and older)'', subtracted from federal
        taxable income in computing line 7 Montana taxable income. INFLATION-ADJUSTED for 2025, up from 2024''s $5,500/$11,000.
        NOT applied by calc.state_tax (the engine applies only personal/dependent keys) — claim it on the form; the caller''s
        supplied line 7 base should already reflect it.'
  notes:
  - '2025 CHANGES: the SB 399 (2021) structure is UNCHANGED in shape for 2025 — federal-taxable-income base, two ordinary-income
    rates of 4.7% and 5.9%, separate 3.0%/4.1% net-long-term-capital-gains rates, federal filing statuses, no Montana
    standard deduction and no Montana personal/dependent exemptions. What moved: the breakpoints were RE-INDEXED to
    $21,100 single/MFS, $42,200 MFJ/QSS, $31,700 HoH (2024: $20,500/$41,000/$30,750); the printed ''Less'' constants
    became $253/$506/$380 (2024: $246/$492/$369); and the age-65 subtraction was inflation-adjusted to $5,660/$11,320
    (2024: $5,500/$11,000). Pass exemptions_count=0 and dependents_count=0.'
  - 'CRITICAL — HB 337''s RATE CUT IS TAX YEAR 2026, NOT 2025: the 2025 booklet''s ''Changes Beginning in Tax Year
    2026'' section states ''House Bill 337 lowered the top marginal tax rate and increased the income brackets for
    tax year 2026. Beginning in tax year 2027, the bill lowers the top marginal ordinary income tax rate and increases
    the income brackets even further. The bill also increases the Montana earned income tax credit to 20% of the federal
    earned income tax credit beginning in tax year 2026.'' The booklet prints those future tables on p.42 (2026: 5.65%
    over $47,500 single / $95,000 MFJ / $71,250 HoH; 2027: 5.4% over $65,000 / $130,000 / $97,500). The 2025 top rate
    is 5.9% and the 2025 EITC is 10% — do NOT apply the 2026 or 2027 figures to tax year 2025.'
  - 'Base guidance: Supply 2025 Form 2, page 1, line 7 — ''Montana taxable income'' = line 3 federal taxable income
    for Montana + line 4 Montana additions (Schedule I) - line 5 Montana subtractions (Schedule I) - line 6 the $5,660/$11,320
    age-65+ subtraction; ''Your Montana taxable income cannot be less than zero. If zero or less, enter zero.'' Line
    3 = line 1 federal AGI (Form 1040, line 11b) minus line 2 (Form 1040 lines 12e and 13b — the federal standard
    or itemized deduction PLUS the additional Schedule 1-A deductions for qualified tips and the other One Big Beautiful
    Bill items). CAVEAT that CHANGED for 2025: itemizers no longer remove state income taxes on line 2 — instead any
    state income tax deduction included in federal itemized deductions is ADDED BACK on Schedule I, Part I, line 4
    (computed on Worksheet B), and only to the extent it does not reduce the deduction below the federal standard
    deduction. The op subtracts NOTHING further — line 7 already reflects every deduction and subtraction.'
  - 'CRITICAL — the shipped brackets tax ORDINARY income only: Montana''s two-bracket 4.7%/5.9% schedule applies to
    ''taxable income without net long-term capital gains'' (Montana Ordinary Income, which includes qualified dividends).
    NET LONG-TERM CAPITAL GAINS are taxed separately at 3.0% up to the same filing-status breakpoint (measured after
    stacking on ordinary income, Form 2 page 2 lines 2-10) and 4.1% above; if Montana Ordinary Income already exceeds
    the breakpoint ($21,100 / $42,200 / $31,700), ALL net long-term capital gains are taxed at 4.1%. If the filer
    has NO net long-term capital gains, this op''s bracket math on line 7 reproduces the page 2 line 12 tax exactly.
    If they do, compute the split on the page 2 worksheet — running the full line 7 through these brackets OVERSTATES
    the tax (the LTCG portion would be taxed at 4.7%/5.9% instead of 3.0%/4.1%). The old Resident Capital Gains Credit
    (2% of gains) remains repealed.'
  - 'FEDERAL FILING STATUSES: taxpayers must use the same filing status as the federal return — including QUALIFYING
    SURVIVING SPOUSE, which shares the MFJ schedule (the 2025 rate table is titled ''Married Filing Jointly and Qualifying
    Surviving Spouse'' and Form 2 page 2 line 5 prints $42,200 for both), so the engine''s QSS-to-MFJ mapping is exactly
    correct. MARRIED FILING SEPARATELY uses the SINGLE-status schedule ($21,100 breakpoint), NOT half of MFJ.'
  - 'PRINTED-CONSTANT DIVERGENCE — NEW for 2025 (2024''s constants were exact): the ''Less'' constants are now ROUNDED
    DOWN from the exact (5.9% - 4.7%) x breakpoint. Exact: 1.2% x $21,100 = $253.20 (printed $253), 1.2% x $42,200
    = $506.40 (printed $506), 1.2% x $31,700 = $380.40 (printed $380). So above the breakpoint the printed formula
    method (5.9% x income - constant) yields $0.20 MORE tax than pure marginal bracket math for single/MFS and $0.40
    more for MFJ/QSS and HoH. Both methods round to the same whole dollar in most cases (including the booklet''s
    own $50,000 single example: marginal 2,696.80 -> 2,697; printed 2,697.00 -> 2,697), but they can split by $1 when
    the marginal total lands just below a .50 boundary. For 2024 the same constants were exact ($246 / $492 / $369)
    and no divergence existed.'
  - 'No lookup-table mandate: the ''Ordinary Income Tax Rates'' table (instructions p.12) is a rate FORMULA schedule
    (''Then your tax rate is ... Less''), not a row-lookup table, so bracket math applies at every income level.'
  - 'Age 65+ subtraction NOT applied by the op: the $5,660 ($11,320 MFJ both 65+) line 6 subtraction is disclosed
    as an informational ''age_65'' key but calc.state_tax does not subtract it — the supplied line 7 base must already
    reflect it (it is a return line, not an engine adjustment). The amount is adjusted annually for inflation.'
  - Montana EITC (Form 2, page 1, line 15 = 10% of the federal EITC for 2025) is a refundable CREDIT — NOT modeled
    by this op. Nonrefundable credits (Schedule III Part I, to page 1 line 9) and refundable credits (Schedule III
    Part I lines 15-16, e.g. the $7,500/$5,000 Adoption Credit, and the up-to-$1,150 Elderly Homeowner/Renter Credit
    on line 16) reduce or supplement tax AFTER line 8 and are not modeled.
  - Recapture taxes, lump-sum distribution taxes (10% of the federal tax calculated on the distribution), contributions,
    penalties, and interest are reported on Schedule IV and added later on page 1 — NOT modeled; if owed, the return
    total exceeds plain bracket math on line 7.
  - 'Nonresidents, part-year residents, and MIXED-RESIDENCY filers (a resident filing jointly with a nonresident or
    part-year resident spouse — a new 2025 checkbox): bracket math on line 7 yields only the resident-equivalent tax
    (page 2 lines 11-12); the tax is then apportioned by the Montana-source ratio on Schedule II, Tax on Montana Source
    Income. The booklet''s Marla example makes this explicit — $2,697 resident ordinary income tax x a 20% Montana-source
    ratio = $540 reported on Form 2, line 8. This op models the full-year RESIDENT computation (page 2, line 13).'
  - 'Rounding: the 2025 Form 2 is a whole-dollar return (every money field prints ''00'' cents); the engine''s half-up
    rounding to whole dollars matches the form''s presentation, and vector 1 below is the exact .50 half-up tie.'
  - 'Do not carry 2023-or-earlier figures forward: the seven-bracket 1%-6.75% schedule, the $2,960-per-person exemptions,
    and the 20%-of-AGI Montana standard deduction were repealed effective tax year 2024. This pack is for tax year
    2025 only — the breakpoints and the age-65 subtraction differ from 2024, and the rates differ from 2026.'
