  base: state_taxable_income
  tax_line: 'IT 1040 line 8a: ''Nonbusiness income tax liability on line 7a (see tax.ohio.gov/taxcalculator or see
    the instructions for the tax brackets)''. Booklet p. 18 table headings: ''Taxable Nonbusiness Income (Ohio IT
    1040, line 7)'' -> ''Nonbusiness Income Tax (enter on Ohio IT 1040, line 8a)''. Line 8c ''Income tax liability
    before credits (line 8a plus line 8b)'' adds the separate 3% business income tax (line 8b), which this op does
    not model.'
  exemptions: {}
  notes:
  - '2025 CHANGE — TOP RATE CUT TO 3.125%, STRUCTURE STILL THREE ROWS: ''Ohio Income Tax Brackets. For tax year 2025,
    the highest tax rate has been reduced to 3.125%'' (Highlights for Tax Year 2025). The 2025 schedule (booklet p.
    18) is 0.000% for 0 to $26,050, then 2.750% to $100,000, then 3.125% over $100,000. Ohio did NOT consolidate to
    a single rate for 2025 — do not use the 2024 3.50% top rate, and do not flatten. R.C. 5747.02(A)(3)(c) shows the
    consolidation arrives NEXT year: ''For taxable years beginning in 2026 and thereafter, $332.00 plus 2.75% of the
    amount in excess of $26,050'' — a single rate above the zero bracket. That 2026 schedule must not be applied to
    2025.'
  - 'Base guidance: Supply 2025 Ohio IT 1040 line 7 (= line 7a), ''Taxable nonbusiness income (line 5 minus line 6;
    if negative, enter zero)''. Compute it on the form: line 1 federal AGI (federal 1040/1040-SR line 11a) plus line
    2a additions (Ohio Schedule of Adjustments line 12) minus line 2b deductions (Schedule of Adjustments line 47)
    = line 3 Ohio adjusted gross income; minus line 4 exemption amount (MAGI-tiered, see below) = line 5 Ohio income
    tax base; minus line 6 taxable business income (Ohio Schedule of Business Income line 15) = line 7. This pack
    ships NO standard deduction and NO exemptions, so the engine applies the brackets directly to the figure you supply
    — do not pass federal AGI or Ohio AGI.'
  - 'CRITICAL — printed-constant divergence, RE-DERIVED for 2025 (the constants changed): Ohio''s published 2025 schedule
    is discontinuous, and the jump is NOT 2024''s $360.69. The middle row reads ''$342.00 plus 2.750% of the amount
    in excess of $26,050'' while the cumulative sum of the 0% bracket below it is $0.00, so between $26,050 and $100,000
    this op''s marginal math is exactly $342.00 BELOW the form''s printed schedule. The booklet''s own example makes
    the gap explicit: taxable nonbusiness income of $68,050 -> ''he owes $342 on the first $26,050 of income'', then
    $42,000 x 0.0275 = $1,155, then ''$1,155 + $342 = $1,497'' on line 8a — while pure bracket math yields $1,155.
    ABOVE $100,000 the divergence is DIFFERENT AGAIN, because Ohio changed the middle constant but left the top constant
    untouched: $342.00 + 2.75% x $73,950 = $2,375.625, yet the printed top row starts at $2,394.32, which is $18.695
    higher. So relative to this op''s cumulative $2,033.625 at $100,000, the printed schedule runs $360.695 ahead
    above $100,000 (coincidentally the same gap as 2024) and $342.00 ahead in the middle bracket. This is NOT a booklet
    typo: R.C. 5747.02(A)(3)(b) prints the same $342.00 and $2,394.32 pair, so the internal inconsistency is statutory.
    The filed form must use the printed brackets — add $342.00 to this op''s result when line 7 is between $26,050
    and $100,000, and $360.695 when line 7 exceeds $100,000.'
  - 'NO tax table (unchanged from 2024): the 2025 booklet prints only the p. 18 Income Tax Brackets. Line 8a instructs
    all filers to use the brackets or the Department''s calculator at tax.ohio.gov/taxcalculator.'
  - 'Personal/dependent exemption NOT shipped because it is income-dependent, and it gained a FOURTH TIER for 2025
    (booklet p. 17): $2,400 per exemption if modified adjusted gross income is $40,000 or less; $2,150 if MAGI is
    $40,001-$80,000; $1,900 if MAGI is $80,001-$749,999; and $0 if MAGI is $750,000 or greater. The 2024 table had
    no upper cutoff — the $1,900 tier ran to infinity — so a high-income 2025 filer now gets NO exemption. The same
    tiered amount applies to the taxpayer, spouse, and each dependent (IT 1040 line 4; the booklet''s example: MAGI
    $75,000, three exemptions = $6,450). MAGI = Ohio adjusted gross income plus the business income deduction (R.C.
    5747.01(II)). A filer claimed as a dependent on someone else''s return gets $0 for themselves. Dependents claimed
    require the Ohio Schedule of Dependents. Compute line 4 on the form; supply line 7 to this op.'
  - Ohio has NO standard deduction and no itemized deduction; the only base reductions are the Schedule of Adjustments
