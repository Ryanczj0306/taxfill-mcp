unverified:
- 'The booklet''s own Highlights list several 2025 items this pack does not model in detail: the new deduction for
  contributions to a qualifying pregnancy resource center (p. 22), the Ohio educator expense deduction increased
  to $300 per taxpayer (p. 25), the home school expense credit changed to $250 per qualifying student (p. 30), and
  a new certificate-based Transformational Mixed-Use Development Credit (p. 31). Their existence and headline amounts
  are quoted from the Highlights page; the underlying instruction pages were not read in full.'
- The 2025 Ohio Schedule of Adjustments deduction lines (line 47 total) were not enumerated one by one for 2025;
  the additions list was read to support the treaty conclusion, and the deduction side is described only structurally.
  Confirm a specific deduction at the booklet page cited on the schedule.
- The Ohio school district income tax (form SD 100) shares this booklet but is NOT modeled anywhere in this pack
  — the per-district rates and the traditional-vs-earned-income base election were not transcribed.
- The 2025 form bundle PDF carries a stale 2020 creation date in its metadata; its content self-identifies as '2025
  Ohio IT 1040' with the 2025 form barcode (25000189) and was used only as a structural second pass, with every
  dollar figure independently confirmed in the booklet and (for the rate schedule) in the Ohio Revised Code.
- MAGI for the exemption table and the credit thresholds is Ohio adjusted gross income plus the business income
  deduction (R.C. 5747.01(II)); the 2025 booklet's MAGI worksheet (referenced as 'line 3 of the worksheet on page
  40') was not transcribed line by line.
tax:
  citation:
    source: '2025 Ohio IT 1040 / SD 100 Instruction Booklet (Ohio Department of Taxation, 64 pages, PDF build 2026-01-23)
      — p. 18 table ''2025 Ohio Income Tax Brackets for Ohio IT 1040'' (0.000% of Ohio taxable nonbusiness income for
      0 to $26,050; ''$342.00 plus 2.750% of the amount in excess of $26,050'' for $26,050-$100,000; ''$2,394.32 plus
      3.125% of the amount in excess of $100,000'' over $100,000, with the booklet''s own worked $68,050 example); p.
      17 ''Line 8a - Tax on Line 7'' (''Calculate your tax on your Ohio income tax base less business income using the
      Income Tax Brackets found on page 18... the Department provides a tool to assist you with this calculation at
      tax.ohio.gov/taxcalculator'', R.C. 5747.02(A)(3)) and the personal and dependent exemption table ($2,400 / $2,150
      / $1,900 / $0 by MAGI). Second pass: form line labels (lines 1-8c) and Schedule of Business Income lines 12-16
      (3% business tax, $250,000/$125,000 business income deduction) verified from the 2025 IT 1040 form bundle at https://tax.ohio.gov/static/forms/ohio_individual/individual/2025/1040-bundle-original-fi.pdf.
      THIRD pass on the schedule itself: Ohio Revised Code 5747.02(A)(3)(b) (effective September 30, 2025, House Bill
      96 of the 136th General Assembly, https://codes.ohio.gov/ohio-revised-code/section-5747.02) prints the identical
      2025 constants and rates — $342.00 / 2.75% and $2,394.32 / 3.125%.'
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
  brackets:
