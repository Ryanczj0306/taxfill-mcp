# OH state knowledge — tax year 2025. Fetched + cited from the OH DOT (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure was drafted from the 2025 Ohio IT 1040 / SD 100
# instruction booklet (64 pages, PDF build 2026-01-23), then independently re-derived from
# the 2025 IT 1040 form bundle (the form, Schedule of Adjustments, Schedule of Business
# Income, Schedule of Credits) AND — for the rate schedule specifically — from Ohio Revised
# Code 5747.02(A)(3)(b) itself on codes.ohio.gov.
# HEADLINE 2025 CHANGE (Highlights for Tax Year 2025): "the highest tax rate has been
# reduced to 3.125%". The structure is STILL THREE ROWS, not flat: 0% to $26,050, 2.75% to
# $100,000, 3.125% over $100,000. The 2024 3.50% top rate is gone. The discontinuity
# constant was RE-DERIVED, not copied: it is $342.00 for 2025 (2024: $360.69), while the
# over-$100,000 constant $2,394.32 was left UNCHANGED from 2024 — which makes the 2025
# printed schedule internally inconsistent by $18.695 at $100,000. Both the booklet and the
# statute print it that way (see the CRITICAL note in tax.notes).
# CONSOLIDATION TO A SINGLE RATE HAPPENS IN 2026, NOT 2025: R.C. 5747.02(A)(3)(c) reads
# "For taxable years beginning in 2026 and thereafter, $332.00 plus 2.75% of the amount in
# excess of $26,050" — one rate above the zero-bracket. Do not apply that to 2025.
# Other 2025 changes: the exemption table gained a FOURTH tier ($0 at MAGI of $750,000 or
# greater), the Joint Filing Credit now requires MAGI under $750,000, and form IT NRS is
# discontinued in favor of an Ohio Nonresident Statement checkbox on IT 10 / IT 1040.
jurisdiction: states/oh
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Ohio IT 1040 line 1 starts from federal adjusted gross income (2025 form line 1: "Federal adjusted
  gross income (federal 1040 or 1040-SR, line 11a)"). Ohio AGI = line 1 + additions (Ohio Schedule of Adjustments,
  line 12) - deductions (line 47). The 2025 Schedule of Adjustments additions list (non-Ohio state or local government
  interest and dividends; pass-through entity add-back; taxes paid to another state or D.C. related to IRS notice
  2020-75; 529 plan funds used for non-qualified expenses; losses from sale or disposition of Ohio public obligations;
  nonmedical withdrawals from a medical savings account; reimbursement of expenses previously deducted on an Ohio
  return; Ohio Homebuyer Plus non-eligible withdrawals; IRC 168(k)/179 depreciation add-back; federally exempt U.S.
  obligation interest taxable by the state; federal conformity additions) contains NO add-back of federally treaty-exempt
  income. Therefore income excluded from federal AGI under a U.S. tax treaty flows through and is not re-taxed by
  Ohio. Federal-AGI common case, no treaty addback -> conforms.'
citation:
  source: 2025 Ohio IT 1040 / SD 100 Instruction Booklet (Ohio Department of Taxation, 64 pages, PDF build 2026-01-23)
    - Line 1 federal AGI, Schedule of Adjustments additions/deductions, Who Must File an Ohio Income Tax Return?,
    Ohio Residency (contact periods, the new Ohio Nonresident Statement checkbox), mailing addresses p. 3, due date
    April 15 2026, payment / check payee ('Ohio Treasurer of State'), 2025 Ohio Income Tax Brackets (p. 18), personal
    and dependent exemption table (p. 17)
  url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
starts_from: federal AGI (Ohio IT 1040 line 1 = federal 1040/1040-SR line 11a; the 2025 form cites line 11a where
  the 2024 form cited line 11)
residency:
  summary: 'Resident: domiciled in Ohio ("domiciled" and "resident" mean the same thing under Ohio law). Any individual
    with an abode (owned or rented) in Ohio is presumed a resident; temporary absence, no matter how long, does
    not change residency. Part-year resident: a resident for part of the tax year and a nonresident for the rest
    (permanently moved into or out of Ohio during the year); entitled to the nonresident credit for income earned
    while a resident of another state, and eligible for the resident credit. Nonresident: a resident of another
    state for the entire tax year. The presumption of Ohio residency can be challenged using the contact period
    test: with fewer than 213 contact periods in Ohio, the taxpayer must show by a preponderance of the evidence
    that they were a nonresident; with 213 or more contact periods, clear and convincing documentation is required.
    A contact period requires an abode outside Ohio, being away overnight from it, and spending any portion of two
    consecutive days in Ohio. NEW FOR 2025: Ohio no longer uses form IT NRS — individuals who meet the required
    criteria establish the irrebuttable nonresident presumption by checking the Ohio Nonresident Statement box on
    form IT 10 or IT 1040 (booklet pp. 61-62). Authorities: R.C. 5747.01(I)(1) and R.C. 5747.24(B)-(D).'
  citation:
    source: 2025 Ohio IT 1040 / SD 100 Instruction Booklet - 'Ohio Residency', 'What Is a Contact Period?', and
      the Ohio Nonresident Statement instructions (Highlights for Tax Year 2025 and pp. 61-62)
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
forms:
  resident: Ohio IT 1040 (Individual Income Tax Return). Residency status (resident / part-year resident / nonresident)
    is indicated by checkbox on the IT 1040 itself; there is no separate resident-only return.
  part_year_or_nonresident: No separate nonresident/part-year return; nonresidents and part-year residents file
    the same Ohio IT 1040 and check the part-year resident or nonresident box. They compute the Nonresident Credit
    on form IT NRC (Ohio Nonresident Credit Calculation), which must be included with the IT 1040. Beginning with
    tax year 2025 the optional nonresident-presumption statement is a CHECKBOX on form IT 10 or IT 1040 — form IT
    NRS is discontinued.
credits_verification: 'State credits were researched from the cited DOR sources and are not tax advice - confirm
  each amount and your eligibility at the cited source before claiming it. Two 2025 changes: the Joint Filing Credit
  now requires MAGI under $750,000 (its top tier reads $75,001-$749,999), and the Home School Expenses Credit changed
  from $250 per RETURN to $250 per qualifying STUDENT.'
credits:
- name: Ohio Earned Income Credit (EIC)
  type: nonrefundable
  eligibility: Taxpayers who qualified for and claimed the federal Earned Income Tax Credit for tax year 2025 (federal
    Form 1040/1040-SR, line 27a). Eligibility tracks the federal EIC.
  amount: '30% of your federal EIC: ''Your nonrefundable Ohio earned income credit (EIC) equals 30% of your federal
    EIC (federal 1040 and 1040-SR, line 27a).'' No state-level dollar cap for 2025.'
  income_limit_2025: No separate Ohio income limit; bounded by the federal EIC income/investment-income thresholds
    since the credit is a percentage of the federal credit.
  claimed_on: Ohio Schedule of Credits, line 13 (attached to Ohio IT 1040)
  citation:
    source: Ohio Department of Taxation - 2025 Ohio IT 1040 / SD 100 Instruction Booklet, Ohio Schedule of Credits,
      Line 13 Earned Income Credit (R.C. 5747.71)
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
- name: Retirement Income Credit
  type: nonrefundable
  eligibility: Taxpayer (and spouse, if filing jointly) who (a) has modified adjusted gross income less exemptions
    under $100,000; (b) received income from a pension, profit-sharing, or retirement plan (such as a traditional
    IRA or 401(k)) on account of retirement; (c) has that income included in Ohio adjusted gross income; and (d)
    has not previously taken the Ohio lump sum retirement credit. Amounts deducted on the Ohio Schedule of Adjustments
    (e.g. Social Security, uniformed-services retirement income) do not qualify.
  amount: 'Table-based (2025 booklet Table 2, p. 44) on total eligible retirement income included in Ohio AGI: $0-$500
    = $0; $501-$1,500 = $25; $1,501-$3,000 = $50; $3,001-$5,000 = $80; $5,001-$8,000 = $130; $8,001 or more = $200.
    Maximum credit per return is $200. Unchanged from 2024.'
  income_limit_2025: Modified adjusted gross income less exemptions must be less than $100,000.
  claimed_on: Ohio Schedule of Credits, line 2 (attached to Ohio IT 1040)
  citation:
    source: Ohio Department of Taxation - 2025 Ohio IT 1040 / SD 100 Instruction Booklet, Ohio Schedule of Credits,
      Line 2 Retirement Income Credit and Table 2 p. 44 (R.C. 5747.055(B))
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
- name: Senior Citizen Credit
  type: nonrefundable
  eligibility: Taxpayer who (a) has modified adjusted gross income less exemptions under $100,000; (b) was 65 or
    older at the end of the tax year; and (c) has not previously taken the Ohio lump sum distribution credit (taking
    that credit permanently forfeits the senior citizen credit).
  amount: $50 per return. Unchanged from 2024.
  income_limit_2025: Modified adjusted gross income less exemptions must be less than $100,000.
  claimed_on: Ohio Schedule of Credits, line 4 (attached to Ohio IT 1040)
  citation:
    source: Ohio Department of Taxation - 2025 Ohio IT 1040 / SD 100 Instruction Booklet, Ohio Schedule of Credits,
      Line 4 Senior Citizen Credit (R.C. 5747.055(F))
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
- name: Child Care and Dependent Care Credit
  type: nonrefundable
  eligibility: Taxpayer whose modified adjusted gross income is less than $40,000 AND who claimed the federal 'credit
    for child and dependent care expenses' on federal Form 2441.
  amount: 'Per the 2025 Child and Dependent Care Credit Worksheet (booklet p. 45): if Ohio MAGI is less than $20,000,
    the full amount from federal Form 2441 line 9c; if MAGI is $20,000 or more but less than $40,000, 25% of the
    amount on federal Form 2441 line 11. Unchanged from 2024.'
  income_limit_2025: Modified adjusted gross income must be less than $40,000 (the worksheet says STOP at $40,000
    or more).
  claimed_on: Ohio Schedule of Credits, line 6 (attached to Ohio IT 1040)
  citation:
    source: Ohio Department of Taxation - 2025 Ohio IT 1040 / SD 100 Instruction Booklet, Ohio Schedule of Credits,
      Line 6 Child Care and Dependent Care Credit and the worksheet on p. 45 (R.C. 5747.054)
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
- name: Joint Filing Credit
  type: nonrefundable
  eligibility: 'Married taxpayers filing a joint Ohio return where EACH spouse has at least $500 of ''qualifying
    income'' (any amount included in Ohio AGI other than interest, dividends and distributions, capital gains, and
    rents and royalties; amounts deducted on the Ohio Schedule of Adjustments — business income, state and local
    tax refunds, Social Security and railroad retirement benefits, certain military compensation and retirement
    — are not in Ohio AGI and therefore are not qualifying income). NEW FOR 2025: the couple must also have MAGI
    less than $750,000.'
  amount: 'A percentage of tax liability before the credit, by MAGI less exemptions: 20% for $0-$25,000; 15% for
    $25,001-$50,000; 10% for $50,001-$75,000; 5% for $75,001-$749,999. The maximum credit per return is $650. (For
    2024 the top tier had no upper bound; for 2025 it stops at $749,999 and the credit is unavailable at MAGI of
    $750,000 or more.)'
  income_limit_2025: MAGI must be less than $750,000; the 5% tier tops out at MAGI less exemptions of $749,999.
  claimed_on: Ohio Schedule of Credits, line 12 (attached to Ohio IT 1040)
  citation:
    source: Ohio Department of Taxation - 2025 Ohio IT 1040 / SD 100 Instruction Booklet, Ohio Schedule of Credits,
      Line 12 Joint Filing Credit (percentage table, $650 maximum, the new MAGI-under-$750,000 requirement)
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
- name: Exemption Credit
  type: nonrefundable
  eligibility: Taxpayers whose modified adjusted gross income (MAGI) less exemptions is less than $30,000.
  amount: $20 for each exemption claimed on the return. Unchanged from 2024. This is a CREDIT against tax, never
    an income exemption.
  income_limit_2025: MAGI less exemptions must be less than $30,000.
  claimed_on: Ohio Schedule of Credits, line 9 (attached to Ohio IT 1040)
  citation:
    source: Ohio Department of Taxation - 2025 Ohio IT 1040 / SD 100 Instruction Booklet, Ohio Schedule of Credits,
      Line 9 Exemption Credit (R.C. 5747.022)
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2025/it1040-booklet.pdf
filing_requirement:
  note: 'Every Ohio resident and every part-year resident is subject to the Ohio income tax, and every nonresident
    having Ohio-sourced income must also file (Ohio-sourced income includes wages or other compensation earned in
    Ohio, Ohio lottery/casino/sports gaming winnings, income or gain from Ohio property, income or gain from a sole
    proprietorship doing business in Ohio, and income or gain from a pass-through entity doing business in Ohio).
    You do NOT have to file an Ohio income tax return if: your Ohio adjusted gross income (IT 1040 line 3) is less
    than or equal to $0; OR the total of your senior citizen credit, lump sum distribution credit, and joint filing
    credit (Ohio Schedule of Credits lines 4, 5 and 12) equals or exceeds your income tax liability (IT 1040 line
    8c) and you are not liable for school district income tax; OR your exemption amount (IT 1040 line 4) is the
    same as or more than your Ohio adjusted gross income (line 3). Residents of a taxing school district may still
    have to file the SD 100. (2025 booklet, ''Who Must File an Ohio Income Tax Return?'')'
