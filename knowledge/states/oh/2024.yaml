tax:
  citation:
    source: '2024 Ohio IT 1040 / SD 100 Instruction Booklet (Ohio Department of Taxation; printed version accurate as
      of November 27, 2024) — p. 18 table ''2024 Ohio Income Tax Brackets for Ohio IT 1040'' (0.00% of Ohio taxable
      nonbusiness income up to $26,050; ''$360.69 plus 2.75% of the amount in excess of $26,050'' for $26,050-$100,000;
      ''$2,394.32 plus 3.50% of the amount in excess of $100,000'' over $100,000); p. 17 ''Line 8a – Tax on Line 7a''
      instruction (''Calculate your tax on your Ohio income tax base less business income using the Income Tax Brackets
      found on page 18... the Department provides a tool to assist you with this calculation at tax.ohio.gov/taxcalculator'',
      R.C. 5747.02(A)(3)) and personal/dependent exemption table ($2,400/$2,150/$1,900 by MAGI). Second pass: form line
      labels (lines 1-8c) and Schedule of Business Income lines 12-16 (3% business tax, $250,000/$125,000 business income
      deduction) verified from the 2024 IT 1040 form bundle at https://tax.ohio.gov/static/forms/ohio_individual/individual/2024/1040-bundle-original-fi.pdf
      — both passes agree.'
    url: https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/ohio_individual/individual/2024/it1040-booklet.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 26050, rate: 0}
    - {over: 26050, but_not_over: 100000, rate: 0.0275}
    - {over: 100000, but_not_over: null, rate: 0.035}
    married_filing_jointly:
    - {over: 0, but_not_over: 26050, rate: 0}
    - {over: 26050, but_not_over: 100000, rate: 0.0275}
    - {over: 100000, but_not_over: null, rate: 0.035}
    married_filing_separately:
    - {over: 0, but_not_over: 26050, rate: 0}
    - {over: 26050, but_not_over: 100000, rate: 0.0275}
    - {over: 100000, but_not_over: null, rate: 0.035}
    head_of_household:
    - {over: 0, but_not_over: 26050, rate: 0}
    - {over: 26050, but_not_over: 100000, rate: 0.0275}
    - {over: 100000, but_not_over: null, rate: 0.035}
  base: state_taxable_income
  tax_line: 'IT 1040 line 8a: ''Nonbusiness income tax liability on line 7a (see tax.ohio.gov/taxcalculator or see
    the instructions for the tax brackets)''. Booklet p. 18 table headings: ''Taxable Nonbusiness Income (Ohio IT
    1040, line 7)'' -> ''Nonbusiness Income Tax (enter on Ohio IT 1040, line 8a)''. Line 8c ''Income tax liability
    before credits (line 8a plus line 8b)'' adds the separate 3% business income tax (line 8b), which this op does
    not model.'
  exemptions: {}
  notes:
  - '2024 CHANGE — BRACKETS CONSOLIDATED AGAIN: ''Ohio has reduced the number of tax brackets used to calculate tax
    on nonbusiness income and reduced one of the two tax rates'' (Highlights for Tax Year 2024, p. 5). The 2023 3.688%
    ($100,000-$115,300) and 3.75% (over $115,300) top tiers are GONE: 2024 is 0% to $26,050, 2.75% to $100,000, and
    3.50% over $100,000 (p. 18). Do not use the 2023 schedule for 2024.'
  - 'Base guidance: Supply 2024 Ohio IT 1040 line 7 (= line 7a), ''Taxable nonbusiness income (line 5 minus line 6;
    if negative, enter zero)''. Compute it on the form: line 3 Ohio adjusted gross income (federal AGI line 1 + Schedule
    of Adjustments additions line 2a - deductions line 2b), minus line 4 exemption amount (MAGI-tiered, see notes)
    = line 5 Ohio income tax base, minus line 6 taxable business income (Ohio Schedule of Business Income line 15)
    = line 7. This pack ships NO standard deduction and NO exemptions, so the engine applies the brackets directly
    to the figure you supply — do not pass federal AGI or Ohio AGI.'
  - 'CRITICAL — printed-constant divergence at $26,050 (re-derived for the 2024 constants): Ohio''s published 2024
    schedule (booklet p. 18) is discontinuous. It reads 0.00% up to $26,050, then ''$360.69 plus 2.75% of the amount
    in excess of $26,050'' — but the cumulative sum of the prior bracket is $0.00, not $360.69. Pure marginal bracket
    math cannot reproduce this fixed $360.69 jump, so this op''s result is exactly $360.69 BELOW the form''s printed
    schedule for line 7 between $26,050 and $100,000. The top printed constant IS internally consistent with the middle
    row: $360.69 + 2.75% x $73,950 = $2,394.315 vs printed $2,394.32 (+$0.005), so above $100,000 the printed schedule
    exceeds this op''s marginal math by $360.695. The filed form must use the printed brackets (R.C. 5747.02(A)(3))
    — add $360.69 ($360.695 above $100,000) to this op''s result when line 7 exceeds $26,050 to match the form.'
  - 'NO tax table for 2024 (change from 2023): the 2024 booklet prints ONLY the p. 18 Income Tax Brackets — the 2023
    booklet''s Income Tax Table (formerly pp. 47-52, mandatory presentation below $115,300) is gone. Line 8a instructs
    all filers to use the brackets or the Department''s calculator at tax.ohio.gov/taxcalculator; booklet pp. 47-48
    now carry sample income statements instead.'
  - 'Personal/dependent exemption NOT shipped because it is income-dependent (booklet p. 17, unchanged amounts from
    2023): $2,400 per exemption if modified adjusted gross income (MAGI) is $40,000 or less; $2,150 if MAGI is $40,001-$80,000;
    $1,900 if MAGI is more than $80,000. The same tiered amount applies to the taxpayer, spouse, and each dependent
    (IT 1040 line 4; the booklet''s example: MAGI $75,000, three exemptions = $6,450). MAGI = Ohio adjusted gross
    income (line 3) plus the business income deduction (Schedule of Adjustments line 13) (booklet p. 8, R.C. 5747.01(II)).
    A filer claimed as a dependent on someone else''s return gets $0 exemption for themselves. Dependents claimed
    require the Ohio Schedule of Dependents. Compute line 4 on the form; supply line 7 to this op.'
  - Ohio has NO standard deduction and no itemized deduction; the only base reductions are the Schedule of Adjustments
    deductions (line 2b) and the line 4 exemption, both already reflected in the line 7 figure you supply.
  - 'Business income is taxed SEPARATELY and is not modeled: taxable business income (IT 1040 line 6, after the business
    income deduction of $250,000 single/MFJ or $125,000 MFS) is taxed at a flat 3% on the 2024 Ohio Schedule of Business
    Income line 16 (''multiply line 15 by 3% (.03)'') and reported on IT 1040 line 8b; total income tax liability
    before credits is line 8c = 8a + 8b. The line 7 figure supplied to this op already excludes business income.'
  - 'One rate schedule for ALL filing statuses: Ohio''s 2024 brackets do not vary by filing status (the p. 18 schedule
    prints a single set of brackets); the identical schedule is duplicated per status here. Qualifying surviving spouse
    shares the form''s ''Single, head of household or qualifying surviving spouse'' checkbox and maps to married_filing_jointly
    in the engine with an identical result.'
  - Ohio school district income tax (form SD 100) is a separate ADDITIONAL tax on top of the IT 1040 for residents
    of taxing school districts — not modeled by this op.
  - 'Ohio''s personal/dependent-linked ''exemption credit'' is a CREDIT, not an exemption: $20 for each exemption
    claimed, on the 2024 Ohio Schedule of Credits line 9, only if MAGI less exemptions is under $30,000 (R.C. 5747.022)
    — it is subtracted from tax (IT 1040 line 9), never from income, and is not modeled. Other unmodeled credits include
    the joint filing credit (5-20% of tax, max $650), retirement income credit (max $200), senior citizen credit ($50),
    and Ohio EIC (30% of federal EIC).'
  - 'Rounding: the booklet''s Common Filing Tips instruct ''Round all figures to the nearest dollar.'''
