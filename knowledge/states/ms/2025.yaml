starts_from: Mississippi gross income computed from scratch on the return (NOT federal AGI). The 2025 resident Form
  80-105 starts from individual income line items, totals them at line 49 "Total income," then subtracts MS adjustments
  (lines 50-65) to reach line 66 "Mississippi adjusted gross income." There is no "federal adjusted gross income"
  starting line on the resident return.
residency:
  summary: 'Per the 2025 instructions (Form 80-100, "Am I a Resident or a Non-Resident?"): a legal resident is an
    individual who maintains a home, apartment, or other place of abode in Mississippi, OR who exercises the rights
    of citizenship in Mississippi by meeting the requirements as a voter, OR who enjoys the benefits of homestead
    exemption. Residency is based on domicile/legal residence: an individual remains a legal resident of Mississippi
    (even if temporarily absent) until citizenship rights are relinquished and a new legal residence is established
    (changes in driver''s license, vehicle tags, voter registration, and property taxes evidence intent to change
    legal residence). A part-year resident moved into or out of Mississippi during the year; part-year residents file
    Form 80-205 and are taxed only on income earned while a Mississippi resident, prorating deductions and exemptions.
    Nonresidents file Form 80-205 and are taxed only on Mississippi-source income, reporting total income from all
    sources solely to prorate deductions and exemptions.'
forms:
  resident: Form 80-105, Mississippi Resident Individual Income Tax Return (2025; Form 80-105-25-8-1-000, Rev. 09/25)
  part_year_or_nonresident: Form 80-205, Mississippi Non-Resident / Part-Year Resident Individual Income Tax Return
    (2025)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Dependent Care Credit (2025 credit code 44)
  type: nonrefundable
  eligibility: Mississippi individuals who claim the federal income tax credit for certain dependent care expenses
    on their federal return. The taxpayer must actually claim the federal credit and must have federal adjusted gross
    income (AGI) of not more than $50,000.
  amount: 25% of the amount of the federal dependent care credit claimed on the taxpayer's federal income tax return;
    the credit is limited to the taxpayer's total Mississippi income tax liability.
  income_limit_2025: Federal AGI must be not more than $50,000.
  claimed_on: Form 80-401 (Tax Credit Summary Schedule), credit code 44; total carried to Form 80-105 line 19 (resident).
  citation:
    source: Mississippi Department of Revenue, 2025 Individual Income Tax Instructions (Form 80-100-25-1-1-000),
      'Dependent Care Credit' section and TAX CREDIT CODES table (code 44)
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100251%202.pdf
- name: Child Adoption Credit (credit code 25)
  type: nonrefundable
  eligibility: A Mississippi taxpayer who legally adopts a dependent child, for qualified adoption expenses paid
    or incurred during the tax year for each child. Claimed for the tax year in which the adoption becomes final.
  amount: Up to $10,000 per child for a dependent child residing in Mississippi before adoption; up to $5,000 per
    child for a dependent child residing outside Mississippi before adoption. Any unused credit may be carried forward
    5 years.
  income_limit_2025: None stated.
  claimed_on: Form 80-401 (Tax Credit Summary Schedule), credit code 25; total carried to Form 80-105 line 19 (resident).
  citation:
    source: Mississippi Department of Revenue, 2025 Individual Income Tax Instructions (Form 80-100-25-1-1-000),
      'Child Adoption Credit' section and TAX CREDIT CODES table (code 25)
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100251%202.pdf
- name: Credit for Income Tax Paid to Another State
  type: nonrefundable
  eligibility: A legal resident of Mississippi who earns income in another state and is required to pay income tax
    to that other state, on income also taxed by Mississippi. The taxpayer MUST file a return with the other state
    and attach a copy (plus Form 80-160); W-2 withholding amounts alone are not sufficient. Not applicable on the
    Non-Resident return.
  amount: 'Credit for the total income tax due to the other state, subject to three statutory limitations under Miss.
    Code Ann. Sec. 27-7-77: (1) cannot exceed the Mississippi income tax due on line 17; (2) cannot exceed income
    tax actually paid to the other state; (3) cannot exceed an amount computed by applying the highest applicable
    Mississippi rates to the net taxable income reported to the other state.'
  income_limit_2025: None (limited instead by the formula above).
  claimed_on: Form 80-105 line 18 (resident return); supported by Form 80-160 with a copy of the other state's return
    attached.
  citation:
    source: 'Mississippi Department of Revenue, 2025 Individual Income Tax Instructions (Form 80-100-25-1-1-000),
      ''Line 18: Credit for Income Tax Paid to Another State'' section'
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100251%202.pdf
filing_requirement:
  note: 'Per the 2025 instructions (Form 80-100, "DO I HAVE TO FILE?"), file a Mississippi return if any apply: you
    had Mississippi income tax withheld (other than gambling); you are a non-resident or part-year resident with income
    taxed by Mississippi (other than gambling); single resident with gross income over $8,300 plus $1,500 per dependent;
    married resident (combined) with gross income over $16,600 plus $1,500 per dependent; a minor resident with gross
    income over the personal exemption plus standard deduction for the filing status; residents working outside Mississippi/abroad
    must report total gross income regardless of source. If not required to file but Mississippi tax was withheld,
    file to obtain a refund.'
