# MS state knowledge — tax year 2025. Fetched + cited from the MS DOR (.gov),
# authored per the 2023/2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 Resident,
# Non-Resident and Part-Year Resident Income Tax Instructions (Form 80-100-25-1-1-000,
# Rev. 12/25), then independently re-derived from the 2025 Form 80-105 itself
# (Form 80-105-25-8-1-000, Rev. 09/25 — which prints the filing-status exemption amounts
# next to each checkbox and the line 10 'Line 9 x $1,500' multiplier) — both passes agree.
# HEADLINE 2025 CHANGE (HB 531 phase-in): the rate on taxable income in excess of $10,000
# DROPS to 4.4% (2024: 4.7%). The 0% band on the first $10,000 is unchanged. Exemptions
# ($6,000/$12,000/$8,000 + $1,500 dependent) and standard deductions ($2,300/$4,600/$3,400)
# are UNCHANGED from 2024. The 2025 'Build Up Mississippi Act' (HB 1, eff. 7/1/2025) leaves
# 2025 at 4.4% and 2026 at 4.0% and adds further cuts (2027 3.75%, 2028 3.5%, 2029 3.25%,
# 2030+ 3%, with contingent reductions below 3% from 2031) — do NOT use those for 2025.
jurisdiction: states/ms
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Mississippi does NOT conform to federal tax treaties and re-taxes treaty-exempt income. Two .gov findings
  establish this. (1) The MS DOR Individual Income Tax FAQ states: "Does Mississippi honor federal income tax exemption
  treaties between the United States and other foreign countries? No, as a general rule, Mississippi does not follow
  federal income tax exemption treaties. Any income earned on a 1042S should be reported on the Mississippi return
  as taxable income." (2) Unlike most states, MS does NOT start from federal AGI — the 2025 Form 80-105 builds Mississippi
  income from scratch line-by-line (wages through other income; "Total income" line 49) and then applies MS-specific
  adjustments to reach "Mississippi adjusted gross income" (line 66). Because the return is built from gross income
  items rather than inheriting the federal AGI exclusion, treaty-exempt wages/income (e.g., reported on a 1042-S)
  are pulled into Mississippi taxable income directly; no special add-back schedule is needed. Net effect: treaty-exempt
  income IS taxed by Mississippi, so conforms_to_federal_treaties = false.'
