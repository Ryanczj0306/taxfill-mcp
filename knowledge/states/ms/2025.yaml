- id: rates-1
  topic: tax_rates_and_brackets
  url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100251%202.pdf
  descriptions:
  - '2025 Mississippi Resident, Non-Resident and Part-Year Resident Income Tax Instructions (Form 80-100-25-1-1-000,
    Rev. 12/25), MS DOR - ''TAX RATES'' (p.22): ''Income Tax: 0% on the first $10,000.00 of taxable income and 4.4%
    on taxable income in excess of $10,000.00''; ''SCHEDULE OF TAX COMPUTATION'' (line 1 First $10,000 x 0%, line
    2 Remaining balance x 4.4%, line 4 total to page 1 line 17); ''Filing Status and Exemptions'' table: exemption
    $12,000 MFJ/combined and Married-Spouse Died 2025, $6,000 MFS (each), $8,000 Head of Family, $6,000 single;
    standard deduction $4,600 MFJ, $2,300 MFS, $3,400 Head of Family, $2,300 single; ''Additional Exemptions'' chart
    $1,500 each dependent, $1,500 age 65 or over (taxpayer/spouse only), $1,500 blind. Second pass: 2025 Form 80-105
    (Form 80-105-25-8-1-000, Rev. 09/25) prints the exemption amounts next to each filing-status checkbox (''Married
    - Combined or Joint Return ($12,000)'' ... ''Single ($6,000)'') and the line 10 ''Line 9 x $1,500'' - https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80105258%201.pdf
    - both passes agree. Only the rate changed from 2024 (4.7% -> 4.4%); exemptions and standard deductions are
    unchanged.'
