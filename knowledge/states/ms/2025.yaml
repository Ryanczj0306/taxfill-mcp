income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Mississippi does NOT conform to federal tax treaties and re-taxes treaty-exempt income. Two .gov findings
  establish this. (1) The MS DOR Individual Income Tax FAQ states: "Does Mississippi honor federal income tax exemption
  treaties between the United States and other foreign counties [sic]? No, as a general rule, Mississippi does not follow
  federal income tax exemption treaties. Any income earned on a 1042S should be reported on the Mississippi return
  as taxable income." (2) Unlike most states, MS does NOT start from federal AGI — the 2025 Form 80-105 builds Mississippi
  income from scratch line-by-line (wages through other income; "Total income" line 49) and then applies MS-specific
  adjustments to reach "Mississippi adjusted gross income" (line 66). Because the return is built from gross income
  items rather than inheriting the federal AGI exclusion, treaty-exempt wages/income (e.g., reported on a 1042-S)
  are pulled into Mississippi taxable income directly; no special add-back schedule is needed. Net effect: treaty-exempt
  income IS taxed by Mississippi, so conforms_to_federal_treaties = false.'
