tax:
  citation:
    source: '2025 Mississippi Resident, Non-Resident and Part-Year Resident Income Tax Instructions (Form 80-100-25-1-1-000,
      Rev. 12/25), MS DOR - ''TAX RATES'' (p.22): ''Income Tax: 0% on the first $10,000.00 of taxable income and 4.4%
      on taxable income in excess of $10,000.00''; ''SCHEDULE OF TAX COMPUTATION'' (line 1 First $10,000 x 0%, line
      2 Remaining balance x 4.4%, line 4 total to page 1 line 17); ''Filing Status and Exemptions'' table: exemption
      $12,000 MFJ/combined and Married-Spouse Died 2025, $6,000 MFS (each), $8,000 Head of Family, $6,000 single; standard
      deduction $4,600 MFJ, $2,300 MFS, $3,400 Head of Family, $2,300 single; ''Additional Exemptions'' chart $1,500
      each dependent, $1,500 age 65 or over (taxpayer/spouse only), $1,500 blind. Second pass: 2025 Form 80-105 (Form
      80-105-25-8-1-000, Rev. 09/25) prints the exemption amounts next to each filing-status checkbox (''Married - Combined
      or Joint Return ($12,000)'' ... ''Single ($6,000)'') and the line 10 ''Line 9 x $1,500'' - https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80105258%201.pdf
      - both passes agree. Only the rate changed from 2024 (4.7% -> 4.4%); exemptions and standard deductions are unchanged.'
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100251%202.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.044}
    married_filing_jointly:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.044}
    married_filing_separately:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.044}
    head_of_household:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.044}
  base: state_gross_income
  tax_line: 'Form 80-105, page 1, line 17 ''Income tax due (from Schedule of Tax Computation, see instructions)''.
    Line 16 ''Mississippi Taxable Income'' = line 13 Mississippi AGI minus line 14 (deductions) and line 15 (exemptions).
    Schedule of Tax Computation: line 1 ''First $10,000'' x 0%; line 2 ''Remaining balance'' x 4.4%; line 4 ''Total
    income tax - enter on page 1, line 17''.'
  exemptions:
    dependent:
      amount: 1500
      note: 'Line 10 = line 9 x $1,500 (2025 instructions, ''Additional Exemptions'': ''Each dependent, other than yourself
        or spouse ... $1,500''). A dependency exemption is not authorized for yourself or your spouse. Head of Family
        filers: the one required dependent IS counted here. MARRIED FILING SEPARATELY CAVEAT: line 15 halves the TOTAL
        line-12 exemption, so the effective per-spouse dependent exemption is $750, not $1,500 - this pack overstates
        the MFS-with-dependents exemption; compute that case on the form. Unchanged from 2024.'
    age_65:
      amount: 1500
      note: Additional $1,500 exemption per box checked on line 8, taxpayer or spouse ONLY (no age exemption for dependents).
        It IS a base reduction (flows through lines 9-12 to line 15) but is NOT applied by calc.state_tax - enter it on
        the form's lines 8-10. Unchanged from 2024.
    blind:
      amount: 1500
      note: Additional $1,500 exemption per box checked on line 8 for blindness, taxpayer or spouse ONLY. It IS a base
        reduction (flows through lines 9-12 to line 15) but is NOT applied by calc.state_tax - enter it on the form's
        lines 8-10. Unchanged from 2024.
  standard_deduction:
    single: 8300
    married_filing_jointly: 16600
    married_filing_separately: 8300
    head_of_household: 11400
  notes:
  - '2025 RATE CUT (HB 531 phase-in): the rate on taxable income in excess of $10,000 DROPS to 4.4% (2024: 4.7%);
    the 0% band on the first $10,000 is unchanged. This is the ONLY change from 2024 - exemptions and standard deductions
    are identical. The 2025 Build Up Mississippi Act (HB 1, eff. 7/1/2025) keeps 2025 at 4.4% and 2026 at 4.0% and
    adds later cuts (2027 3.75%, 2028 3.5%, 2029 3.25%, 2030+ 3%, contingent reductions below 3% from 2031) - do NOT
    use those for 2025.'
  - 'Base guidance: Supply Mississippi adjusted gross income: 2025 Form 80-105 (resident return), page 1, line 13
    (from page 2, line 66 ''Mississippi adjusted gross income''). Mississippi does NOT start from federal AGI - the
    return builds MS income from its own line items minus MS adjustments. Do NOT supply federal AGI. The pack ships
    the subtractions to get from line 13 to line 16 ''Mississippi taxable income'' for a standard-deduction filer:
    the shipped standard_deduction per status is the SUM of the MS standard deduction and the MS filing-status exemption,
    and the shipped dependent exemption is $1,500 each; the rate schedule then reproduces line 17. Itemizers (Form
    80-108 Schedule A) and nonresident/part-year filers (Form 80-205) must be computed on the form instead.'
  - 'Adjudication note (two-pass): exemptions_count must be 0 - the Mississippi per-status personal exemption ($6,000
    single/MFS, $12,000 MFJ, $8,000 Head of Family) is FOLDED INTO the shipped standard_deduction amounts, never applied
    per count. Only dependents_count is applied ($1,500 each).'
  - '2025 Mississippi rates (instructions p.22, ''TAX RATES''): 0% on the first $10,000.00 of taxable income and 4.4%
    on taxable income in excess of $10,000.00. ONE schedule covers ALL filing statuses (the Schedule of Tax Computation
    has no per-status rate columns); it is duplicated per status here.'
  - 'MODELING NOTE - shipped standard_deduction is a COMBINED per-status amount: Mississippi''s personal exemption
    is a fixed per-FILING-STATUS amount (Single $6,000; MFJ/Combined $12,000; MFS $6,000 per spouse; Head of Family
    $8,000), not a per-person amount. The shipped standard_deduction = MS standard deduction + MS filing-status exemption:
    Single $2,300 + $6,000 = $8,300; MFJ $4,600 + $12,000 = $16,600; MFS $2,300 + $6,000 = $8,300; Head of Family
    $3,400 + $8,000 = $11,400. No ''personal'' exemption key is shipped, so exemptions_count has no effect. Corroboration:
    the booklet''s own filing thresholds are exactly these sums (''Single... in excess of $8,300...; Married... in
    excess of $16,600...''). All amounts unchanged from 2024.'
  - 'MARRIED COMBINED RETURN (two-column) math is NOT modeled - can OVERSTATE tax by up to $440 for two-income couples
    in 2025: on a combined return where both spouses have positive taxable income (Form 80-105 columns A and B), the
    Schedule of Tax Computation line 1 gives EACH column its own first $10,000 at 0%, so up to $20,000 is taxed at
    0% (the DOR FAQ confirms: ''If married filing joint, the first $10,000 of each taxpayer''s taxable income is exempt'').
    This pack''s single-base married_filing_jointly computation gives only one $10,000 zero band and matches the form
    only when all income is in Column A (one-income couple).'
  - 'MARRIED FILING SEPARATELY: Form 80-105 line 15 instruction halves the total authorized exemptions (($12,000 +
    $1,500 x dependents)/2 = $6,000 + $750 per dependent), and any unused portion of one spouse''s standard deduction
    or exemption may NOT be used by the other spouse. The shipped $8,300 is exact for MFS with zero dependents; with
    dependents the shipped $1,500/dependent overstates the exemption by $750 each - compute on the form.'
  - Head of Family (Mississippi's head-of-household status) REQUIRES at least one dependent living in the home the
    entire year; that required dependent IS counted and DOES receive the $1,500 dependent exemption - pass it in dependents_count.
  - 'Qualifying surviving spouse mapping: Mississippi''s ''Married - Spouse Died in Tax Year (2025)'' status uses
    the identical $12,000 exemption and $4,600 standard deduction as Married Filing Joint/Combined, so it maps cleanly
    to married_filing_jointly. Mississippi has no multi-year qualifying-surviving-spouse status.'
  - Age 65-or-over and blind additional exemptions ($1,500 per box checked, taxpayer and spouse only, Form 80-105
    line 8) are base reductions but are NOT applied by calc.state_tax - take them on the form (shipped as informational
    'age_65'/'blind' keys only).
  - 'Itemized deductions: filers may itemize on Form 80-108 Schedule A instead of the standard deduction (state income
    taxes and MS gaming losses are NOT deductible); this pack assumes the standard deduction.'
  - 'Tax CREDITS are not modeled: line 18 credit for income tax paid to another state (Form 80-160) and line 19 other
    credits (Form 80-401 - e.g. Dependent Care Credit 2025 code 44 = 25% of the federal credit for federal AGI <=
    $50,000; Child Adoption Credit code 25) are subtracted from line 17 tax AFTER the rate schedule; they are credits,
    not exemptions.'
  - 'No tax-table mandate: Mississippi has no lookup-table requirement - every filer computes line 17 with the Schedule
    of Tax Computation bracket math, so the pack''s marginal math matches the form exactly. The schedule prints no
    additive constants, so there is no rounded-constant divergence to quantify.'
  - 'Rounding: the booklet mandates whole-dollar rounding (round down amounts under $.50, round up amounts of $.50
    and over) - identical to the engine''s round-half-up.'
  - Nonresidents and part-year residents file Form 80-205 (taxable income line 19, tax line 20) and must PRORATE deductions
    and exemptions by the MS-income ratio - this pack models only the full-year resident Form 80-105.
