tax:
  citation:
    source: '2023 Mississippi Resident, Non-Resident and Part-Year Resident Income Tax Instructions (Form 80-100-23-1-1-000,
      Rev. 09/23), MS DOR — ''Tax Rates'' (p.22): ''Income Tax: 0% on the first $10,000.00 of taxable income and 5%
      on taxable income in excess of $10,000.00''; ''Schedule of Tax Computation'' (Appendix, p.27): line 1 first $10,000
      ($0-$10,000) x 0%, line 2 remaining balance x 5%, line 4 total to Form 80-105 page 1 line 17; ''Filing Status
      and Exemptions'' table (p.6): exemption $12,000 married filing joint/combined and Married-Spouse Died 2023, $6,000
      married filing separate (each), $8,000 Head of Family, $6,000 single; standard deduction $4,600 / $4,600 / $2,300
      / $3,400 / $2,300; ''Additional Exemptions'' chart (p.7): $1,500 each dependent, $1,500 age 65 or over (taxpayer/spouse
      only), $1,500 blind (taxpayer/spouse only); Deductions and Line 14/15/16/17 instructions (p.8); ''Round to the
      Nearest Dollar'' (p.22). Corroborated by 2023 Form 80-105 (Form 80-105-23-8-1-000, Rev. 11/23) page 1, which prints
      the exemption amounts next to each filing-status box and the line 10 ''Line 9 x $1,500'' multiplication.'
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100231.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.05}
    married_filing_jointly:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.05}
    married_filing_separately:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.05}
    head_of_household:
    - {over: 0, but_not_over: 10000, rate: 0}
    - {over: 10000, but_not_over: null, rate: 0.05}
  base: state_gross_income
  tax_line: 'Form 80-105, page 1, line 17 ''Income tax due (from Schedule of Tax Computation, see instructions)''.
    Instructions p.8, Line 16: ''Subtract lines 14 and 15 from line 13 and enter the result on line 16... The amount
    of income tax due is calculated based on this amount. Use the Schedule of Tax Computation, on page 27 to compute
    the amount of income tax due.'' Line 17: ''Using the taxable income amount(s) from line 16... the Schedule of
    Tax Computation, on page 27 should be completed to determine the total Mississippi income tax liability.'' Schedule
    of Tax Computation (p.27): line 1 ''First $10,000'' x 0%; line 2 ''Remaining balance'' x 5%; line 4 ''Total income
    tax - enter on page 1, line 17''.'
  exemptions:
    dependent:
      amount: 1500
      note: 'Line 10 = line 9 x $1,500 (instructions p.7, ''Additional Exemptions'': ''Each dependent, other than yourself
        or spouse ... $1,500''). A dependency exemption is not authorized for yourself or your spouse. Head of Family
        filers: the one required dependent IS counted here — p.7: ''you are allowed $8,000 on line 11 and $1,500 for the
        required dependent listed on line 6 which totals $9,500''. MARRIED FILING SEPARATELY CAVEAT: line 15 halves the
        TOTAL line-12 exemption (($12,000 + $1,500 x dependents)/2), so the effective per-spouse dependent exemption is
        $750, not $1,500 — this pack overstates the MFS-with-dependents exemption; compute that case on the form.'
    age_65:
      amount: 1500
      note: Additional $1,500 exemption per box checked on line 8, taxpayer or spouse ONLY (age 65 on the day before the
        65th birthday counts; no age exemption for dependents). It IS a base reduction (flows through lines 9-12 to line
        15) but is NOT applied by calc.state_tax — enter it on the form's lines 8-10.
    blind:
      amount: 1500
      note: Additional $1,500 exemption per box checked on line 8 for blindness, taxpayer or spouse ONLY. It IS a base
        reduction (flows through lines 9-12 to line 15) but is NOT applied by calc.state_tax — enter it on the form's
        lines 8-10.
  standard_deduction:
    single: 8300
    married_filing_jointly: 16600
    married_filing_separately: 8300
    head_of_household: 11400
  notes:
  - 'Base guidance: Supply Mississippi adjusted gross income: 2023 Form 80-105 (resident return), page 1, line 13,
    which is carried from page 2, line 66 ''Mississippi adjusted gross income (line 49 minus line 65)''. Mississippi
    does NOT start from federal AGI — the return builds MS income from its own line items (wages line 38 through other
    income line 48, totaled at line 49) minus MS adjustments (lines 50-65). Do NOT supply federal AGI. The pack ships
    the subtractions to get from line 13 to line 16 ''Mississippi taxable income'' for a standard-deduction filer:
    the shipped standard_deduction for each status is the SUM of the MS standard deduction and the MS filing-status
    exemption (see notes), and the shipped dependent exemption is $1,500 each; the rate schedule then reproduces line
    17. Itemizers (Form 80-108 Schedule A) and nonresident/part-year filers (Form 80-205, which prorates deductions
    and exemptions) must be computed on the form instead.'
  - 'Adjudication note (two-pass): exemptions_count must be 0 — the Mississippi per-status personal exemption ($6,000
    single/MFS, $12,000 MFJ, $8,000 Head of Family) is FOLDED INTO the shipped standard_deduction amounts (see modeling
    note), never applied per count. Only dependents_count is applied ($1,500 each).'
  - '2023 Mississippi rates (instructions p.22, ''Tax Rates''): 0% on the first $10,000.00 of taxable income and 5%
    on taxable income in excess of $10,000.00. ONE schedule covers ALL filing statuses (the Schedule of Tax Computation,
    p.27, has no per-status columns for rates); it is duplicated per status here.'
  - 'MODELING NOTE — shipped standard_deduction is a COMBINED per-status amount: Mississippi''s personal exemption
    is a fixed per-FILING-STATUS amount (Single $6,000; Married Filing Joint/Combined $12,000; Married Filing Separate
    $6,000 per spouse; Head of Family $8,000), not a per-person amount, so it cannot be shipped as a ''personal''
    per-item exemption (Head of Family''s $8,000 is not $6,000 x any count). The shipped standard_deduction = MS standard
    deduction + MS filing-status exemption: Single $2,300 + $6,000 = $8,300; MFJ $4,600 + $12,000 = $16,600; MFS $2,300
    + $6,000 = $8,300; Head of Family $3,400 + $8,000 = $11,400. No ''personal'' exemption key is shipped, so exemptions_count
    has no effect. Corroboration: the booklet''s own filing thresholds (p.5) are exactly these sums — ''Single...
    gross income in excess of $8,300 plus $1,500 for each dependent; Married... in excess of $16,600 plus $1,500 for
    each dependent.'''
  - 'MARRIED COMBINED RETURN (two-column) math is NOT modeled — can OVERSTATE tax by up to $500 for two-income couples:
    on a combined return where both spouses have positive taxable income (Form 80-105 columns A and B), the Schedule
    of Tax Computation line 1 gives EACH column its own first $10,000 (or part) at 0%, so up to $20,000 of the couple''s
    combined taxable income is taxed at 0%. This pack''s single-base married_filing_jointly computation gives only
    one $10,000 zero band and matches the form only when all income is in Column A (one-income couple / true joint
    return). If one column is positive and the other negative, the form nets them in Column A; if both are negative,
    no tax is due.'
  - 'MARRIED FILING SEPARATELY: Form 80-105 line 15 instruction — ''Enter the amount from line 12. If Married-Filing
    Separate, divide this amount by 2.'' Each MFS spouse gets exactly half the total authorized exemptions (($12,000
    + $1,500 x dependents)/2 = $6,000 + $750 per dependent), and any unused portion of one spouse''s standard deduction
    ($2,300) or exemption ($6,000) may NOT be used by the other spouse. The shipped $8,300 is exact for MFS with zero
    dependents; with dependents the shipped $1,500/dependent overstates the exemption by $750 each — compute on the
    form. If one MFS spouse itemizes, the other must also itemize.'
  - 'Head of Family (Mississippi''s head-of-household status) REQUIRES at least one dependent living in the home the
    entire year; that required dependent is listed on line 6, counted on line 7/9, and DOES receive the $1,500 dependent
    exemption (p.7: ''$8,000 on line 11 and $1,500 for the required dependent... totals $9,500'') — pass it in dependents_count.'
  - 'Qualifying surviving spouse mapping: Mississippi''s ''Married - Spouse Died in Tax Year (2023)'' status uses
    the identical $12,000 exemption and $4,600 standard deduction as Married Filing Joint/Combined, so it maps cleanly
    to married_filing_jointly. Mississippi has no multi-year qualifying-surviving-spouse status.'
  - Age 65-or-over and blind additional exemptions ($1,500 per box checked, taxpayer and spouse only, Form 80-105
    line 8) are base reductions but are NOT applied by calc.state_tax — take them on the form (they are shipped as
    informational 'age_65'/'blind' keys only).
  - 'Itemized deductions: filers may itemize on Form 80-108 Schedule A instead of the standard deduction (state income
    taxes and MS gaming losses are NOT deductible); this pack assumes the standard deduction.'
  - 'Tax CREDITS are not modeled: line 18 credit for income tax paid to another state (Form 80-160) and line 19 other
    credits (Form 80-401 — e.g. new-for-2023 Dependent Care Credit code 37 = 25% of the federal credit for federal
    AGI <= $50,000, Child Adoption Credit code 25) are subtracted from line 17 tax AFTER the rate schedule; they are
    credits, not exemptions.'
  - Consumer use tax (line 21, 7%) and catastrophe savings tax (line 22, additional 2.5% on non-qualified distributions)
    are separate additions on the return and are NOT part of the line 17 income tax this pack computes.
  - 'No tax-table mandate: Mississippi has no lookup-table requirement — every filer computes line 17 with the Schedule
    of Tax Computation (p.27) bracket math, so the pack''s marginal math matches the form exactly.'
  - 'Rounding: the booklet mandates whole-dollar rounding (p.22, ''Round to the Nearest Dollar'': round down under
    $.50, up at $.50 and over) — identical to the engine''s round-half-up.'
  - '2023 legislative context (HB 531, 2022 session, p.3 ''What''s New''): beginning tax year 2023 no tax is levied
    on taxable income up to and including $10,000; the printed 2023 rate on the excess is 5% (p.22). HB 531 schedules
    future cuts on the excess over $10,000: 4.7% (2024), 4.4% (2025), 4.0% (2026) — those rates do NOT apply to 2023.
    There was no mid-year 2023 rate change; the 2023 filing-season schedule is 0%/$10,000 then 5%.'
  - The Schedule of Tax Computation prints no '$X + Y% of excess over $Z' additive constants, so there is no rounded-constant
    divergence to quantify.
  - Nonresidents and part-year residents file Form 80-205 (taxable income line 19, tax line 20) and must PRORATE deductions
    and exemptions by the MS-income ratio — this pack models only the full-year resident Form 80-105.
