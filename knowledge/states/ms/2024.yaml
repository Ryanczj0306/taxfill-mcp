# MS state knowledge — tax year 2024. Fetched + cited from the MS DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Resident,
# Non-Resident and Part-Year Resident Income Tax Instructions (Form 80-100-24-1-1-000,
# Rev. 10/24), then independently re-derived from a second official document (the 2024
# Form 80-105 itself, Rev. 09/24 — which prints the filing-status exemption amounts next
# to each checkbox and the line 10 'Line 9 x $1,500' multiplier — plus the 2024 Form
# 80-106 payment voucher) — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGE (HB 531, 2022 session, phase-in): the rate on taxable income in
# excess of $10,000 DROPS to 4.7% (2023: 5%). The 0% band on the first $10,000 stays.
# Exemptions ($6,000/$12,000/$8,000 + $1,500 dependent) and standard deductions
# ($2,300/$4,600/$3,400) are UNCHANGED. Scheduled: 4.4% (2025), 4.0% (2026) — do NOT
# use those for 2024, and do NOT source the 2024 rate from the live DOR FAQ (it already
# shows the 2025 4.4% rate).
jurisdiction: states/ms
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Mississippi does NOT conform to federal tax treaties and re-taxes treaty-exempt income. Two .gov findings
  establish this for 2024. (1) The MS DOR Individual Income Tax FAQ states verbatim: "Does Mississippi honor federal
  income tax exemption treaties between the United States and other foreign counties? No, as a general rule, Mississippi
  does not follow federal income tax exemption treaties. Any income earned on a 1042S should be reported on the
  Mississippi return as taxable income." (2) Unlike most states, MS does NOT start from federal AGI — the 2024 Form
  80-105 builds Mississippi income from scratch line-by-line (wages line 38 through other income line 48; "Total
  income" line 49) and then applies MS-specific adjustments (lines 50-65) to reach "Mississippi adjusted gross income"
  (line 66). Because the return is built from gross income items rather than inheriting the federal AGI exclusion,
  treaty-exempt wages/income (e.g., reported on a 1042-S) are pulled into Mississippi taxable income directly; no
  special add-back schedule is needed. Net effect: treaty-exempt income IS taxed by Mississippi, so conforms_to_federal_treaties
  = false.'
citation:
  source: MS DOR — Individual Income Tax Frequently Asked Questions (treaty non-conformity; resident/nonresident/part-year
    forms; filing requirement; 1042-S taxable). CAUTION on rates — the live FAQ shows the CURRENT-year (2025, 4.4%)
    rate; the 2024 filing-season rate (4.7%) is verified at the 2024 Form 80-100 instructions instead.
  url: https://www.dor.ms.gov/individual/individual-income-tax-frequently-asked-questions
starts_from: Mississippi gross income computed from scratch on the return (NOT federal AGI). The 2024 resident Form
  80-105 starts from individual income line items (wages line 38 through other income line 48), totals them at line
  49 "Total income," then subtracts MS adjustments (lines 50-65) to reach line 66 "Mississippi adjusted gross income."
  There is no "federal adjusted gross income" starting line on the resident return.
residency:
  summary: 'Per the 2024 instructions (Form 80-100, "Am I a Resident or a Non-Resident?"): a legal resident is an
    individual who maintains a home, apartment, or other place of abode in Mississippi, OR who exercises the rights
    of citizenship in Mississippi by meeting the requirements as a voter, OR who enjoys the benefits of homestead
    exemption. Residency is based on domicile/legal residence: an individual remains a legal resident of Mississippi
    (even if temporarily absent for varying intervals) until citizenship rights are relinquished and a new legal
    residence is established (changes in driver''s license, vehicle tags, voter registration, and property taxes
    evidence intent to change legal residence). A part-year resident is someone who moved into or out of Mississippi
    during the year; part-year residents file Form 80-205 and are taxed only on income earned while a Mississippi
    resident, prorating deductions and exemptions. Nonresidents file Form 80-205 and are taxed only on Mississippi-source
    income (e.g., wages for services performed in Mississippi), reporting total income from all sources solely to
    prorate deductions and exemptions.'
