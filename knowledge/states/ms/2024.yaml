credits:
- name: Dependent Care Credit (2024 credit code 44)
  type: nonrefundable
  eligibility: Mississippi individuals who claim the federal income tax credit for certain dependent care expenses
    on their federal return. The taxpayer must actually claim the federal credit and must have federal adjusted
    gross income (AGI) of not more than $50,000.
  amount: 25% of the amount of the federal dependent care credit claimed on the taxpayer's federal income tax return;
    the credit is limited to the taxpayer's total Mississippi income tax liability.
  income_limit_2024: Federal AGI must be not more than $50,000.
  claimed_on: Form 80-401 (Tax Credit Summary Schedule), credit code 44 per the 2024 TAX CREDIT CODES table (NOTE
    — the code moved; in the 2023 booklet this credit was listed under a different code, and code 37 is the Endowment
    Fund Charitable Credit for 2024); total carried to Form 80-105 line 19 (resident) or Form 80-205 line 21 (non-resident/part-year).
  citation:
    source: Mississippi Department of Revenue, 2024 Individual Income Tax Instructions (Form 80-100-24-1-1-000,
      Rev. 10/24), 'Dependent Care Credit' section and TAX CREDIT CODES table (code 44)
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100241.pdf
- name: Child Adoption Credit (credit code 25)
  type: nonrefundable
  eligibility: A Mississippi taxpayer who legally adopts a dependent child, for qualified adoption expenses paid
    or incurred during the tax year for each child. The credit is claimed for the tax year in which the adoption
    becomes final.
  amount: Up to $10,000 per child for a dependent child residing in Mississippi before adoption; up to $5,000 per
    child for a dependent child residing outside Mississippi before adoption. Any unused credit may be carried forward
    5 years.
  income_limit_2024: None stated.
  claimed_on: Form 80-401 (Tax Credit Summary Schedule), credit code 25; total carried to Form 80-105 line 19 (resident)
    or Form 80-205 line 21 (non-resident/part-year).
  citation:
    source: Mississippi Department of Revenue, 2024 Individual Income Tax Instructions (Form 80-100-24-1-1-000),
      'Child Adoption Credit' section and TAX CREDIT CODES table (code 25)
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100241.pdf
- name: Long Term Care Credit (2024 credit code 27)
  type: nonrefundable
  eligibility: Mississippi individual taxpayers who pay premiums during the taxable year for certain qualified long-term
    care insurance policies as defined in IRC Section 7702B. If more than one person is carried on the same policy,
    the credit is available only for that one policy.
  amount: 25% of premiums paid during the taxable year, not to exceed $500.00, or the taxpayer's income tax liability,
    whichever is less, for each individual qualified long-term care insurance policy. No carryforward is allowed
    for any unused portion.
  income_limit_2024: None stated.
  claimed_on: Form 80-401 (Tax Credit Summary Schedule), credit code 27 per the 2024 TAX CREDIT CODES table; total
    carried to Form 80-105 line 19 (resident) or Form 80-205 line 21 (non-resident/part-year).
  citation:
    source: Mississippi Department of Revenue, 2024 Individual Income Tax Instructions (Form 80-100-24-1-1-000),
      'Long Term Care Credit' section and TAX CREDIT CODES table (code 27)
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100241.pdf
- name: Credit for Income Tax Paid to Another State
  type: nonrefundable
  eligibility: A legal resident of Mississippi who earns income in another state and is required to pay income tax
    to that other state, on income also taxed by Mississippi. The taxpayer MUST file a return with the other state
    and attach a copy (plus Form 80-160); W-2 withholding amounts alone are not sufficient. Not applicable on the
    Non-Resident return.
  amount: 'Credit for the total income tax due to the other state, subject to three statutory limitations under
    Miss. Code Ann. Sec. 27-7-77: (1) cannot exceed the Mississippi income tax due on line 17; (2) cannot exceed
    income tax actually paid to the other state; (3) cannot exceed an amount computed by applying the highest applicable
    Mississippi rates to the net taxable income reported to the other state.'
  income_limit_2024: None (limited instead by the formula above).
  claimed_on: Form 80-105 line 18 (resident return); supported by Form 80-160 with a copy of the other state's return
    attached.
  citation:
    source: 'Mississippi Department of Revenue, 2024 Individual Income Tax Instructions (Form 80-100-24-1-1-000),
      ''Line 18: Credit for Income Tax Paid to Another State'' section'
    url: https://www.dor.ms.gov/sites/default/files/tax-forms/individual/80100241.pdf
filing_requirement:
  note: 'Per 2024 instructions (Form 80-100, "DO I HAVE TO FILE?"), file a Mississippi return if any apply: you
    had Mississippi income tax withheld (other than gambling); you are a non-resident or part-year resident with
    income taxed by Mississippi (other than gambling); single resident with gross income over $8,300 plus $1,500
    per dependent; married resident (combined) with gross income over $16,600 plus $1,500 per dependent; a minor
    resident with gross income over the personal exemption plus standard deduction for the filing status; residents
    working outside Mississippi/abroad must report total gross income regardless of source. If not required to file
    but Mississippi tax was withheld, file to obtain a refund.'
