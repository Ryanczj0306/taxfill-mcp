  resident: Form 80-105, Mississippi Resident Individual Income Tax Return (2024; Form 80-105-24-8-1-000, Rev. 09/24)
  part_year_or_nonresident: Form 80-205, Mississippi Non-Resident / Part-Year Resident Individual Income Tax Return
    (2024)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
