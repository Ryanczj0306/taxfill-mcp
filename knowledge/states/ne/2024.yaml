  base: federal_agi
  tax_line: 'Form 1040N, line 15 "Nebraska income tax" — the 2024 Tax Calculation Schedule states: "This calculation
    represents Nebraska income tax before any credits are applied. Enter on line 15, Form 1040N." Booklet Line 15
    instruction: "Nebraska Income Tax. Nonresidents and partial-year residents, enter the amount from line 9, Nebraska
    Schedule III. Paper filers may use the Nebraska Tax Table. Electronic filers must use the Nebraska Tax Calculation
    Schedule."'
  exemptions: {}
  standard_deduction:
    single: 8350
    married_filing_jointly: 16700
    married_filing_separately: 8350
    head_of_household: 12250
  notes:
  - '2024 CHANGE — TOP RATE CUT TO 5.84% AND BRACKETS RE-INDEXED: the booklet''s What''s New states ''Individual Income
    Tax Rate Change (LB 754, 2023). For the 2024 taxable year, the highest rate for the Nebraska individual income
    tax is reduced to 5.84%'' (down from 6.64% in 2023; the lower rates stay 2.46%/3.51%/5.01%). All four schedules''
    breakpoints are re-indexed for 2024 (Single/MFS $3,900/$23,370/$37,670; MFJ/QSS $7,790/$46,760/$75,340; HoH $7,270/$37,400/$55,850).
    Do not use 2023 tables or early-2024 withholding-era rates.'
  - 'Base guidance: Supply Form 1040N line 5 — federal adjusted gross income, i.e. Federal Form 1040 or 1040-SR, line
    11. The pack ships Nebraska''s standard deduction for the op to subtract, which reproduces line 14 (Nebraska Taxable
    Income = line 5 minus line 10 deduction, plus line 12 minus line 13 Schedule I adjustments) whenever there are
    no Nebraska Schedule I adjustments and the standard deduction is used. If Nebraska Schedule I adjustments apply,
    supply line 5 plus line 12 minus line 13 instead, so that subtracting the shipped standard deduction still reproduces
    line 14.'
  - 'Adjudication note (two-pass): vector counts are zero by design — Nebraska personal exemptions are a $166-per-person
    nonrefundable CREDIT on Form 1040N line 18 for 2024 (raised from $157 in 2023), never an income exemption, so
    the pack ships no personal/dependent keys and the engine refuses nonzero counts.'
  - 'Nebraska personal exemptions are a TAX CREDIT, not an income exemption: Form 1040N line 18 gives RESIDENTS a
    nonrefundable credit of $166 times the number of Nebraska personal exemptions on line 4 (yourself, spouse, and
    dependents; the 2024 form prints ''$166 times the number on line 4''). It is subtracted from tax, not from income,
    so no personal/dependent amounts are shipped in exemptions and calc.state_tax does not apply it — claim it on
    line 18 of the form (nonresidents and partial-year residents claim it prorated on Nebraska Schedule III, line
    7).'
  - 'The shipped standard deduction is the 2024 chart amount with ZERO boxes checked on Form 1040N line 2a (under
    65, not blind) for a filer who cannot be claimed for the federal child/dependent tax credit by another taxpayer.
    Nebraska Standard Deduction Chart (booklet p.9) with line-2a boxes checked: Single $10,300 (1 box) / $12,250 (2);
    Married Filing Jointly $18,300 / $19,900 / $21,500 / $23,100 (1-4 boxes); Qualifying surviving spouse $18,300
    / $19,900 (1-2); Married Filing Separately $9,950 / $11,550 / $13,150 / $14,750 (1-4; the spouse''s 65-and-over
    and blind boxes count only if the primary taxpayer can claim a personal exemption for the spouse); Head of Household
    $14,200 / $16,150 (1-2). These are NOT applied by calc.state_tax — use the chart amount on line 6.'
  - If you or your spouse CAN be claimed by another taxpayer for federal child tax credit or dependent tax credit
    purposes, your standard deduction is the SMALLER of the federal standard deduction allowed on line 12 of Federal
    Form 1040/1040-SR or the Nebraska chart amount — not modeled; compute on the form.
  - 'Itemizers are not modeled: taxpayers who itemized on the federal return take the LARGER of the Nebraska standard
    deduction or Nebraska itemized deductions (line 9 = federal Schedule A line 17 total minus line 5a state and local
    income taxes); if you used the federal standard deduction you MUST use the Nebraska standard deduction (booklet
    p.9, Line 6).'
  - Nebraska Schedule I adjustments (Form 1040N line 12 adjustments increasing federal AGI, line 13 adjustments decreasing
    federal AGI) are not modeled — if they apply, fold them into the supplied base per base_guidance or compute line
    14 on the form.
  - 'Tax table option (paper filers only): ''Only taxpayers filing paper returns may use the Nebraska Tax Table'';
    electronic filers must use the Tax Calculation Schedule (booklet, Line 15), which is the exact bracket math this
    op implements. The table calculates tax at the midpoint of each $100 band and covers Nebraska taxable income up
    to $75,360, so a paper filer''s table amount may differ by a few dollars from this op''s result within a band;
    above $75,360 the booklet worksheet is (taxable income - $75,360) x .0584 plus $3,697 Single/MFS, $2,993 MFJ/QSS,
    or $3,300 HoH.'
  - 'Qualifying surviving spouse: the schedule''s second table is titled ''Married Taxpayers, Filing Jointly and Qualifying
    Surviving Spouses'' — the engine''s QSS-to-MFJ mapping is exact for the brackets, and the QSS standard deduction
    with zero boxes is the same $16,700.'
  - Married filing separately is printed with the SAME schedule as Single on the 2024 Tax Calculation Schedule (identical
    breakpoints $3,900/$23,370/$37,670 and constants) — copied from the MFS table, not derived.
  - The schedule's printed '$X + Y% of excess over $Z' constants are the exact cumulative bracket sums rounded to
    the nearest cent; maximum divergence from the exact sum is $0.005 (Single/MFS $779.34 vs exact $779.337 and $1,495.77
    vs $1,495.767; MFJ $191.63 vs $191.634, $1,559.48 vs $1,559.481, $2,991.34 vs $2,991.339; HoH $178.84 vs $178.842,
    $1,236.41 vs $1,236.405; the HoH top constant $2,160.75 is exact) — after rounding to whole dollars the results
    agree.
  - 'Nebraska other tax is NOT modeled: Form 1040N line 16 adds 29.6% (x .296) of federal tax on lump-sum distributions
    of qualified retirement plans (Federal Form 4972) and federal tax on early distributions (lesser of Federal Form
    5329 or Schedule 2 line 8); line 17 total tax = line 15 + line 16.'
  - 'Nonresidents and partial-year residents are NOT modeled: they compute line 15 via Nebraska Schedule III (line
    9), which apportions the tax by the Nebraska-income ratio.'
  - 'Standard deduction chart source: 2024 Nebraska Individual Income Tax Booklet (8-307-2024), Line 6, p.9 — https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_Individual_Income_Tax_Booklet.pdf'
