tax:
  citation:
    source: '2024 Nebraska Tax Calculation Schedule for Individual Income Tax (8-460-2024), single page — all four filing-status
      rate tables ("This calculation represents Nebraska income tax before any credits are applied. Enter on line 15,
      Form 1040N."): Single and Married Filing Separately — 2.46% of Nebraska Taxable Income not over $3,900; $95.94
      + 3.51% of the excess over $3,900 to $23,370; $779.34 + 5.01% to $37,670; $1,495.77 + 5.84% over $37,670. Married
      Filing Jointly and Qualifying Surviving Spouses — 2.46% not over $7,790; $191.63 + 3.51% to $46,760; $1,559.48
      + 5.01% to $75,340; $2,991.34 + 5.84% over $75,340. Head of Household — 2.46% not over $7,270; $178.84 + 3.51%
      to $37,400; $1,236.41 + 5.01% to $55,850; $2,160.75 + 5.84% over $55,850. Standard deduction and line instructions:
      2024 Nebraska Individual Income Tax Booklet, Form 1040N (8-307-2024) — What''s New (''For the 2024 taxable year,
      the highest rate for the Nebraska individual income tax is reduced to 5.84%'', LB 754, 2023), Line 6 Nebraska
      Standard Deduction Chart (p.9: Single $8,350 / MFJ $16,700 / QSS $16,700 / MFS $8,350 / HoH $12,250 with zero
      boxes), Line 15 Nebraska Income Tax and Line 18 personal exemption credit $166 (p.10 area), 2024 Nebraska Tax
      Table and over-$75,360 worksheet, at https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_Individual_Income_Tax_Booklet.pdf.
      Second pass: the standalone 2024 Nebraska Tax Table (https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/2024_Tax_Tables.pdf)
      reproduces the identical math — its $13,060-$13,160 row prints $419/$378/$419/$384, exactly the four schedules
      at the $13,110 band midpoint, and its over-$75,360 worksheet constants ($3,697 single/MFS, $2,993 MFJ/QSS, $3,300
      HoH, each + 5.84% of the excess) equal the schedule evaluated at $75,360 rounded to whole dollars — and the 2024
      Form 1040N line 6 prints the same standard deduction amounts. Both passes agree.'
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/2024_Tax_Calculation_Schedule.pdf
