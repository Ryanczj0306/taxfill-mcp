# NE state knowledge — tax year 2024. Fetched + cited from the NE DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Individual
# Income Tax Booklet (Form 1040N instructions, 8-307-2024), then independently re-derived
# from a second official document (the standalone 2024 Nebraska Tax Calculation Schedule
# 8-460-2024, the 2024 Form 1040N itself, or the standalone 2024 Nebraska Tax Table whose
# band-midpoint rows and over-$75,360 worksheet constants reproduce the same bracket math)
# — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGES: (1) the TOP RATE IS CUT to 5.84% (LB 754, 2023 — booklet What's
# New: 'For the 2024 taxable year, the highest rate for the Nebraska individual income
# tax is reduced to 5.84%', down from 6.64% in 2023) and the four bracket breakpoints are
# re-indexed; (2) the personal exemption CREDIT rises to $166 (from $157); (3) the
# standard deduction rises to $8,350 single/MFS, $16,700 MFJ/QSS, $12,250 HoH; (4) Form
# PTC is now COMMUNITY-COLLEGE-ONLY — LB 34 (2024 special session) moved school district
# property tax relief onto the property tax statement itself.
jurisdiction: states/ne
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Nebraska''s resident return (Form 1040N) starts from federal adjusted gross income: 2024 line 5 is
  "Federal adjusted gross income (AGI) (line 11, Federal Form 1040 or 1040-SR) Do not leave blank." Federally
  treaty-exempt income is already excluded from federal AGI and therefore flows through. The only additions to
  federal AGI are on Nebraska Schedule I, Part A ("Adjustments Increasing Federal AGI"), whose nine 2024 line items
  are: (1) interest income from state/local obligations exempt from federal tax, (2) exempt interest from Nebraska
  obligations, (3) total taxable interest (line 1 minus line 2), (4) Financial Institution Tax Credit claimed, (5)
  Nebraska College Savings Program recapture, (6) Nebraska Enable plan recapture, (7) federal net operating loss
  deduction, (8) S corporation or LLC Non-Nebraska loss, and (9) Nebraska PTET deduction. NONE of these requires
  adding back income exempt under a U.S. income tax treaty. With no treaty add-back and a federal-AGI starting
  point, treaty-exempt income is not re-taxed -> Nebraska conforms.'
citation:
  source: 2024 Nebraska Individual Income Tax Booklet (Form 1040N instructions, 8-307-2024) — What's New (top rate
    reduced to 5.84% per LB 754; Form PTC community-college-only per LB 34), federal AGI starting point (Line 5),
    residency definitions, Who Must File, due date, check payee
  url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_Individual_Income_Tax_Booklet.pdf
starts_from: federal AGI (Form 1040N line 5 = federal AGI from Federal Form 1040/1040-SR, line 11)
residency:
  summary: 'Nebraska bases residency on domicile plus a statutory-resident (183-day) rule. RESIDENT: an individual
    whose domicile is in Nebraska, OR an individual who is physically present in Nebraska and maintains a permanent
    place of abode in the state for an aggregate of more than six months; specifically, if an individual maintains
    a permanent place of abode in Nebraska and is present in Nebraska for at least 183 days during the tax year,
    that individual is a Nebraska resident even if domiciled in another state (any part of a day in Nebraska counts
    as a day in the state). DOMICILE is the place of one''s permanent home, where the individual intends to return;
    once established it remains until abandoned (by leaving the state, abandoning Nebraska domicile, and establishing
    domicile elsewhere). PARTIAL-YEAR RESIDENT: an individual who is a resident for part, but less than all, of
    the year, having changed domicile during the year by moving into or out of Nebraska. NONRESIDENT: a non-domiciliary
    not meeting the statutory-resident test, taxed only on income derived from or connected with Nebraska sources.
    (2024 booklet, Definitions, p.7.)'
forms:
  resident: Form 1040N — Nebraska Individual Income Tax Return
  part_year_or_nonresident: Form 1040N with Nebraska Schedule III (Computation of Nebraska Tax for Nonresidents
    and Partial-Year Residents); there is no separate nonresident form number — nonresidents and partial-year residents
    file the same Form 1040N and must attach Schedule III.
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Nebraska Earned Income Credit (state EITC)
  type: refundable
  eligibility: Full-year and partial-year Nebraska residents who qualify for and claim the federal Earned Income
    Credit. Nonresidents may not claim it. If filing Nebraska married-filing-separately, eligibility depends on
    whether the federal EIC is allowed on a federal MFS return. Paper filers must attach pages 1 and 2 of the federal
    return.
  amount: 10% of the federal earned income credit (federal credit x .10). Partial-year residents multiply by the
    line-4 Schedule III apportionment ratio.
  income_limit_2024: 'Same income limits as the federal EITC. For 2024 the earned-income thresholds cited in the
    booklet''s NOL worksheet are: $18,591 ($25,511 MFJ) for no qualifying children; $49,084 ($56,004 MFJ) for one
    child; $55,768 ($62,688 MFJ) for two children; $59,899 ($66,819 MFJ) for three or more children.'
  claimed_on: Form 1040N, line 42 (residents); Nebraska Schedule III, lines 11-12 (partial-year residents)
  citation:
    source: 2024 Nebraska Individual Income Tax Booklet (Form 1040N booklet, 8-307-2024), line 42 instructions and
      Nebraska Earned Income Worksheet (NOL)
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_Individual_Income_Tax_Booklet.pdf
- name: Nebraska Child/Dependent Care Credit (refundable, AGI $29,000 or less)
  type: refundable
  eligibility: Full-year and partial-year residents whose federal AGI (Form 1040N, line 5) is $29,000 or less and
    who have qualifying federal child & dependent care expenses. Must complete and attach Nebraska Form 2441N (the
    federal Form 2441 alone is not accepted). Taxpayers who file federal MFJ but Nebraska MFS cannot claim it; nonresidents
    cannot claim it.
  amount: 'Refundable amount = (smallest of qualifying expenses/earned income, capped at $3,000 for one qualifying
    person or $6,000 for two or more) x federal decimal (2024 Form 2441N line 8 table: .35 at AGI of $15,000 or
    less down to .28 for AGI over $27,000 up to $29,000) x Nebraska state decimal (2024 Form 2441N line 9 table:
    1.00 for AGI of $22,000 or less, stepping down .90, .80, .70, .60, .50, .40, and .30 for AGI over $28,000 up
    to $29,000).'
  income_limit_2024: Federal AGI of $29,000 or less (Form 1040N line 5). Above $29,000 the credit is instead the
    nonrefundable version on line 23 (25% of the federal credit).
  claimed_on: Form 2441N, line 11, carried to Form 1040N, line 40 (residents); partial-year residents use Form 2441N
    line 12 / Schedule III
  citation:
    source: 2024 Nebraska Form 2441N (Nebraska Child and Dependent Care Expenses) — lines 3-12 with the 2024 federal
      and state decimal tables — and 2024 Form 1040N booklet line 40 instructions
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_2441N.pdf
- name: Nebraska Child/Dependent Care Nonrefundable Credit (AGI over $29,000)
  type: nonrefundable
  eligibility: Resident taxpayers with federal AGI greater than $29,000 who claim the federal child & dependent
    care credit. Must include a copy of federal Form 2441 (credit disallowed if not received). Taxpayers who file
    federal MFJ but Nebraska MFS cannot claim it; nonresidents may not claim it (partial-year residents use Schedule
    III line 6c).
  amount: 25% (.25) of the amount on line 2 of Schedule 3, Federal Form 1040 (i.e., 25% of the federal child & dependent
    care credit).
  income_limit_2024: Federal AGI greater than $29,000 (taxpayers at or below $29,000 use the refundable version
    on line 40 instead).
  claimed_on: Form 1040N, line 23 (residents); Nebraska Schedule III, line 6c (partial-year residents)
  citation:
    source: 2024 Nebraska Individual Income Tax Booklet (Form 1040N booklet, 8-307-2024), line 23 instructions
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_Individual_Income_Tax_Booklet.pdf
- name: Credit for Community College Property Taxes (Form PTC)
  type: refundable
  eligibility: Any individual (and other entities) who paid qualified Nebraska community college property taxes
    during the 2024 calendar year, directly or through a mortgage escrow. Qualified taxes exclude amounts for bonded
    indebtedness, voter-approved levy overrides, and property taxes 5+ years delinquent when paid. Must file Form
    PTC with the return; the DOR Property Tax Look-up Tool computes qualified amounts. NOTE 2024 CHANGE — for tax
    years beginning on or after January 1, 2024, Form PTC is used ONLY for community college property taxes; school
    district property tax relief is now applied directly on the property tax statement under the School District
    Property Tax Relief Act (LB 34, 2024 special session), not claimed on the income tax return.
  amount: The credit equals the qualified community college property taxes paid in 2024 as computed in Form PTC
    Part B (Part A line 1 = the line 2a total — no percentage multiplier on the 2024 form).
  income_limit_2024: None (not income-limited).
  claimed_on: Form PTC, line 1, carried to Form 1040N line 43
  citation:
    source: 2024 Nebraska Property Tax Credit, Form PTC instructions (in the 2024 Form 1040N booklet, 8-307-2024)
      and What's New (Form PTC community-college-only; LB 34 School District Property Tax Relief Act)
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_Individual_Income_Tax_Booklet.pdf
- name: Nebraska Personal Exemption Credit (residents only)
  type: nonrefundable
  eligibility: Nebraska residents may claim a credit for each Nebraska personal exemption reported on line 4, Form
    1040N (taxpayer, spouse, and dependents). Nonresidents and partial-year residents claim a prorated version on
    Schedule III line 7.
  amount: $166 per Nebraska personal exemption for 2024 (multiply $166 by the number of exemptions on line 4, Form
    1040N) — up from $157 in 2023.
  income_limit_2024: None (not income-limited).
  claimed_on: Form 1040N, line 18 (residents); Nebraska Schedule III, line 7 (nonresidents/partial-year residents)
  citation:
    source: 2024 Nebraska Individual Income Tax Booklet (Form 1040N booklet, 8-307-2024), line 18 instructions ('Residents
      may claim a $166 credit for each Nebraska personal exemption'); the 2024 Form 1040N line 18 prints '$166 times
      the number on line 4'
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2024/f_Individual_Income_Tax_Booklet.pdf
filing_requirement:
  note: 'Per the 2024 Form 1040N booklet ("Who Must File?"): A Nebraska RESIDENT must file if they (a) are required
    to file a federal individual income tax return reporting a federal tax liability before credits, OR (b) have
    $5,000 or more of net Nebraska adjustments to federal AGI (including non-Nebraska state and local bond interest
    exempt from federal tax). A PARTIAL-YEAR RESIDENT or NONRESIDENT must file if they have income derived from
    or connected with Nebraska sources.'
