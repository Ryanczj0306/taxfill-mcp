  links to it, but the standalone e-pay app URL was not quoted verbatim on a .gov page during this research). Confirm
  the precise login URL at the DOR e-pay page.
- Whether PO Box 98934 ('returns not requesting a refund') is the literal address Nebraska intends for paper returns
  mailed WITH a check (Nebraska frames the split as refund vs. no-refund rather than refund vs. with-payment); confirm
  at the DOR before relying on it for a with-payment paper return.
- The statutory citation trail for the 2025 rate cut (LB 754, 2023, codified in Neb. Rev. Stat. section 77-2715.03)
  was not re-derived from the session law text, and the booklet's What's New for 2025 does not restate the rate change
  in prose. The 5.20% top rate and the re-indexed 2025 brackets are two-pass confirmed at the cited official documents
  (Tax Calculation Schedule 8-460-2025 + the standalone 2025 Tax Table's over-$77,760 worksheet constants, which
  recompute exactly from those brackets).
