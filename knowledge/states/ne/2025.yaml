  summaries, not from their own forms; confirm amounts and application deadlines before claiming.
tax:
  citation:
    source: '2025 Nebraska Tax Calculation Schedule for Individual Income Tax (8-460-2025), single page — all four filing-status
      rate tables (''This calculation represents Nebraska income tax before any credits are applied. Enter on line 15,
      Form 1040N.''): Single Taxpayers — 2.46% of Nebraska Taxable Income, line 14, Form 1040N, not over $4,030; $99.14
      + 3.51% of the excess over $4,030 to $24,120; $804.30 + 5.01% of the excess over $24,120 to $38,870; $1,543.28
      + 5.20% of the excess over $38,870. Married Taxpayers, Filing Jointly and Qualifying Surviving Spouses — 2.46%
      not over $8,040; $197.78 + 3.51% to $48,250; $1,609.15 + 5.01% to $77,730; $3,086.10 + 5.20% over $77,730. Married
      Taxpayers, Filing Separately — identical to Single ($4,030 / $24,120 / $38,870 with $99.14 / $804.30 / $1,543.28).
      Head of Household Taxpayers — 2.46% not over $7,510; $184.75 + 3.51% to $38,590; $1,275.66 + 5.01% to $57,630;
      $2,229.56 + 5.20% over $57,630. Standard deduction and line instructions: 2025 Nebraska Individual Income Tax
      Booklet, Form 1040N — Line 6 Nebraska Standard Deduction Chart (Single $8,600 / Married Filing Jointly $17,200
      / Qualifying surviving spouse $17,200 / Married Filing Separately $8,600 / Head of Household $12,600 with zero
      boxes checked on line 2a), Line 15 Nebraska Income Tax, Line 18 personal exemption credit $171, and the 2025 Nebraska
      Tax Table with its over-$77,760 worksheet, at https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf.
      Second pass: the standalone 2025 Nebraska Tax Table (https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/2025_Tax_Tables.pdf)
      reproduces the identical math — its $13,060-$13,160 row prints $418/$376/$418/$381, exactly the four schedules
      at the $13,110 band midpoint (single 99.138 + 9,080 x .0351 = 417.846; MFJ 197.784 + 5,070 x .0351 = 375.741;
      HoH 184.746 + 5,600 x .0351 = 381.306), and its over-$77,760 worksheet constants ($3,566 single/MFS, $3,088 MFJ/QSS,
      $3,276 HoH, each + 5.20% of the excess) equal the schedule evaluated at $77,760 rounded to whole dollars (single
      3,565.552; MFJ 3,087.663; HoH 3,276.318) — and the 2025 Form 1040N line 6 prints the same standard deduction amounts
      and line 18 prints ''$171 times the number on line 4''. Both passes agree.'
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/2025_Tax_Calculation_Schedule.pdf
