# NE state knowledge — tax year 2025. Fetched + cited from the NE DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the standalone 2025 Nebraska
# Tax Calculation Schedule (8-460-2025) and the 2025 Individual Income Tax Booklet (Form
# 1040N instructions), then independently re-derived from second official documents — the
# 2025 Form 1040N itself (line 5 federal AGI, line 6 printed standard deductions, line 18
# '$171 times the number on line 4') and the standalone 2025 Nebraska Tax Table, whose
# band-midpoint rows and over-$77,760 worksheet constants reproduce the same bracket math —
# resolutions recorded inline where the passes differed.
# HEADLINE 2025 CHANGES: (1) the TOP RATE IS CUT AGAIN, to 5.20% (2024: 5.84%; 2023: 6.64%)
# — the LB 754 (2023) glide path continues toward 3.99% by 2027 — and all four schedules'
# breakpoints are re-indexed (Single/MFS $4,030/$24,120/$38,870; MFJ/QSS $8,040/$48,250/
# $77,730; HoH $7,510/$38,590/$57,630); the three lower rates stay 2.46%/3.51%/5.01%;
# (2) the personal exemption CREDIT rises to $171 (2024: $166); (3) the standard deduction
# rises to $8,600 single/MFS, $17,200 MFJ/QSS, $12,600 HoH; (4) Form PTC remains
# COMMUNITY-COLLEGE-ONLY (school district property tax relief stays on the property tax
# statement under LB 34); (5) many NEW credits arrive with tax year 2025 — the $500
# refundable Intellectual and Developmental Disabilities Direct Support Professional credit
# (Form 1040N line 51), the Nebraska Pregnancy Help Act credit, the Shortline Rail
# Modernization credit, the Relocation Incentive Act refundable employer credit with its
# employee Nebraska wage exclusion, and the Food Bank/Food Pantry/Food Rescue Donation
# credit (2025 only); (6) Form 1040N's credit lines are RENUMBERED (refundable child/dependent
# care 42, Nebraska EITC 44, community college property tax credit 45).
jurisdiction: states/ne
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Nebraska''s resident return (Form 1040N) starts from federal adjusted gross income: 2025 line 5 is
  "Federal adjusted gross income (AGI) (line 11a, Federal Form 1040 or 1040-SR) Do not leave blank." Federally treaty-exempt
  income is already excluded from federal AGI and therefore flows through. The only additions to federal AGI are
  on Nebraska Schedule I, Part A ("Adjustments Increasing Federal AGI"), whose 2025 line items are: (1) interest
  income from state/local obligations exempt from federal tax, (2) exempt interest from Nebraska obligations, (3)
  total taxable interest (line 1 minus line 2), (4) Financial Institution Tax Credit claimed, (5) Nebraska College
  Savings Program recapture, (6) Nebraska Enable plan recapture, (7) federal net operating loss deduction, (8) S
  corporation or LLC Non-Nebraska loss, (9) Nebraska PTET deducted under IRC section 164, (10) Relocation Incentive
  Act employee recapture, (11) loss on the sale or exchange of gold or silver bullion included in federal AGI, and
  (12) Food Bank/Food Pantry/Food Rescue donation amounts deducted as a federal charitable contribution. NONE of
  these requires adding back income exempt under a U.S. income tax treaty. With no treaty add-back and a federal-AGI
  starting point, treaty-exempt income is not re-taxed -> Nebraska conforms.'
citation:
  source: 2025 Nebraska Individual Income Tax Booklet (Form 1040N instructions) — What's New (the 2025 credit slate),
    federal AGI starting point (Line 5), Nebraska Standard Deduction Chart (Line 6), Line 15 Nebraska Income Tax,
    Line 18 personal exemption credit $171, residency definitions, Who Must File, due date, check payee
  url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf
starts_from: federal AGI (Form 1040N line 5 = federal AGI from Federal Form 1040/1040-SR, line 11a)
residency:
  summary: 'Nebraska bases residency on domicile plus a statutory-resident (183-day) rule. RESIDENT: an individual
    whose domicile is in Nebraska, OR an individual who is physically present in Nebraska and maintains a permanent
    place of abode in the state for an aggregate of more than six months; specifically, if an individual maintains
    a permanent place of abode in Nebraska and is present in Nebraska for at least 183 days during the tax year,
    that individual is a Nebraska resident even if domiciled in another state (any part of a day in Nebraska counts
    as a day in the state). DOMICILE is the place an individual has his or her permanent home, where the individual
    intends to return even if absent at times; an individual establishes Nebraska domicile on the date of arrival
    for other than temporary or transitory purposes, and once established it remains until abandoned (by leaving
    the state, abandoning Nebraska domicile, and establishing domicile in another state while present there for other
    than temporary or transitory purposes). PERMANENT PLACE OF ABODE is a dwelling place permanently maintained by
    the taxpayer, whether or not owned by the taxpayer. PARTIAL-YEAR RESIDENT: an individual who is a resident for
    part, but less than all, of the year, having changed domicile during the year by moving into or out of Nebraska.
    NONRESIDENT: a non-domiciliary not meeting the statutory-resident test, taxed only on income derived from or
    connected with Nebraska sources. (2025 booklet, Definitions.)'
forms:
  resident: Form 1040N — Nebraska Individual Income Tax Return
  part_year_or_nonresident: Form 1040N with Nebraska Schedule III (Computation of Nebraska Tax for Nonresidents
    and Partial-Year Residents); there is no separate nonresident form number — nonresidents and partial-year residents
    file the same Form 1040N and must attach Schedule III.
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Nebraska Earned Income Credit (state EITC)
  type: refundable
  eligibility: Full-year and partial-year Nebraska residents who qualify for and claim the federal Earned Income
    Credit. Nonresidents may not claim it. If filing Nebraska married-filing-separately, eligibility depends on
    whether the federal EIC is allowed on a federal MFS return. Paper filers must attach pages 1 and 2 of the federal
    Form 1040 (or pages 1, 2, and 3 of Form 1040-SR).
  amount: 10% of the federal earned income credit (a state credit equal to 10% of the federal credit, using the
    federal credit from line 27a of Form 1040/1040-SR). Partial-year residents enter the amount calculated on line
    12, Nebraska Schedule III.
  income_limit_2025: 'Same income limits as the federal EITC. For 2025 the earned-income thresholds cited in the
    booklet''s NOL worksheet are: $19,104 ($26,214 MFJ) for no qualifying children; $50,434 ($57,554 MFJ) for one
    child; $57,310 ($64,430 MFJ) for two children; $61,555 ($68,675 MFJ) for three or more children.'
  claimed_on: Form 1040N, line 44 (residents — RENUMBERED from 2024's line 42); Nebraska Schedule III, lines 11-12
    (partial-year residents)
  citation:
    source: 2025 Nebraska Individual Income Tax Booklet (Form 1040N instructions), Line 44 instructions ('Nebraska
      residents and partial-year residents who have a federal earned income credit are allowed a state credit equal
      to 10% of the federal credit') and the Nebraska Earned Income Worksheet for Taxpayers Claiming a Net Operating
      Loss Deduction
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf
- name: Nebraska Child/Dependent Care Credit (refundable, AGI $29,000 or less)
  type: refundable
  eligibility: Full-year and partial-year residents whose federal AGI (Form 1040N, line 5) is $29,000 or less and
    who have qualifying federal child & dependent care expenses. Must complete and attach Nebraska Form 2441N (the
    federal Form 2441 alone is NOT accepted — the credit will be disallowed). Taxpayers who file federal MFJ but
    Nebraska MFS cannot claim it; nonresidents cannot claim it.
  amount: 'Refundable amount = (smallest of qualifying expenses/earned income, capped at $3,000 for one qualifying
    person or $6,000 for two or more) x federal decimal (2025 Form 2441N line 8 table: .35 at AGI of $15,000 or
    less, stepping down .34, .33, .32, .31, .30, .29, and .28 for AGI over $27,000 up to $29,000) x Nebraska state
    decimal (2025 Form 2441N line 9 table: 1.00 for AGI of $22,000 or less, stepping down .90, .80, .70, .60, .50,
    .40, and .30 for AGI over $28,000 up to $29,000).'
  income_limit_2025: Federal AGI of $29,000 or less (Form 1040N line 5). Above $29,000 the credit is instead the
    nonrefundable version on line 23 (25% of the federal credit).
  claimed_on: Form 2441N, carried to Form 1040N, line 42 (residents — RENUMBERED from 2024's line 40); partial-year
    residents use Form 2441N / Schedule III
  citation:
    source: 2025 Nebraska Form 2441N (Nebraska Child and Dependent Care Expenses) — 'File Form 2441N ONLY if your
      federal adjusted gross income (AGI) is $29,000 or less' with the 2025 federal and state decimal tables — and
      the 2025 Form 1040N booklet line 42 instructions
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_2441N.pdf
- name: Nebraska Child/Dependent Care Nonrefundable Credit (AGI over $29,000)
  type: nonrefundable
  eligibility: Resident taxpayers with federal AGI greater than $29,000 who claim the federal child & dependent
    care credit. Must include a copy of federal Form 2441 (credit disallowed if not received). Taxpayers who file
    federal MFJ but Nebraska MFS cannot claim it; nonresidents may not claim it (partial-year residents use Schedule
    III line 6c).
  amount: 25% (.25) of the amount on line 2 of Schedule 3, Federal Form 1040 (i.e., 25% of the federal child & dependent
    care credit).
  income_limit_2025: Federal AGI greater than $29,000 (taxpayers at or below $29,000 use the refundable version
    on line 42 instead).
  claimed_on: Form 1040N, line 23 (residents); Nebraska Schedule III, line 6c (partial-year residents)
  citation:
    source: 2025 Nebraska Individual Income Tax Booklet (Form 1040N instructions), Line 23 instructions ('Resident
      taxpayers with AGI greater than $29,000 can claim this credit ... Multiply the amount on line 2 of Schedule
      3, Federal Form 1040 by 25% (.25)')
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf
- name: Credit for Community College Property Taxes (Form PTC)
  type: refundable
  eligibility: 'Any individual (and other entities) who paid qualified Nebraska community college property taxes
    during the 2025 calendar year, directly or through a mortgage escrow. Property taxes that were delinquent for
    five years or more at the time of payment cannot be included. The completed Form PTC must be filed with the return;
    the DOR Property Tax Look-up Tool computes qualified amounts. CONTINUING RULE: for tax years beginning on or
    after January 1, 2024, Form PTC is used ONLY to claim a credit for community college property taxes — school
    district property tax relief is applied directly on the property tax statement under the School District Property
    Tax Relief Act (LB 34, 2024 special session), reducing property taxes before they are paid rather than refunding
    them afterward.'
  amount: The credit equals the qualified community college property taxes paid in 2025 as computed in Form PTC
    Part B (Part A line 1 = the line 2a total — no percentage multiplier on the 2025 form).
  income_limit_2025: None (not income-limited).
  claimed_on: Form PTC, line 1, carried to Form 1040N line 45 (RENUMBERED from 2024's line 43)
  citation:
    source: 2025 Nebraska Property Tax Credit, Form PTC and its instructions (in the 2025 Form 1040N booklet) — Part
      A Computation of the Credit, Part B Community College Property Taxes Paid in 2025, and the LB 34 School District
      Property Tax Relief Act note
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf
- name: Nebraska Personal Exemption Credit (residents only)
  type: nonrefundable
  eligibility: Nebraska residents may claim a credit for each Nebraska personal exemption reported on line 4, Form
    1040N (taxpayer, spouse, and dependents). Nonresidents and partial-year residents claim a prorated version on
    Schedule III line 7.
  amount: $171 per Nebraska personal exemption for 2025 (multiply $171 by the number of exemptions on line 4, Form
    1040N) — up from $166 in 2024 and $157 in 2023.
  income_limit_2025: None (not income-limited).
  claimed_on: Form 1040N, line 18 (residents); Nebraska Schedule III, line 7 (nonresidents/partial-year residents)
  citation:
    source: 2025 Nebraska Individual Income Tax Booklet (Form 1040N instructions), Line 18 instructions ('Residents
      may claim a $171 credit for each Nebraska personal exemption reported on line 4, Form 1040N'); the 2025 Form
      1040N line 18 prints '$171 times the number on line 4'
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf
- name: Intellectual and Developmental Disabilities Direct Support Professional Tax Credit (NEW for 2025)
  type: refundable
  eligibility: 'An individual who worked at least six months AND at least 500 hours during the taxable year as a
    direct support professional — any individual employed in Nebraska who provides direct care support or any other
    form of treatment, services, or care for individuals with intellectual and developmental disabilities. Created
    by LB 937 (2024), beginning with tax year 2025. The taxpayer must apply to and be approved by DOR BEFORE claiming
    it: Form 3157-A (application) and Form 3157-E (employer verification) must be submitted electronically through
    the Electronic Document & Application Submission Hub (eDASH). Enter the certificate number and credit amount
    from the approved Form 3157-A. Total credits under the act are capped by the statutory limit for each State fiscal
    year (employers may separately claim three nonrefundable credits of $500 / $1,000 / $1,000 per qualifying employee
    or served individual).'
  amount: $500 refundable credit per qualifying direct support professional.
  income_limit_2025: None stated.
  claimed_on: Form 1040N, line 51 (approved Form 3157-A certificate number and amount)
  citation:
    source: 2025 Nebraska Individual Income Tax Booklet (Form 1040N instructions) — What's New, 'Individuals with
      Intellectual and Developmental Disabilities Support Act (LB 937, 2024)' ($500 refundable credit; six months
      and 500 hours) and Line 51 instructions (Forms 3157-A / 3157-E via eDASH)
    url: https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf
filing_requirement:
  note: 'Per the 2025 Form 1040N booklet ("Who Must File?"): A Nebraska RESIDENT must file if they (a) are required
    to file a federal individual income tax return reporting a federal tax liability before credits, OR (b) have
    $5,000 or more of net Nebraska adjustments to federal AGI, including non-Nebraska state and local bond interest
    exempt from federal tax (see the Nebraska Schedule I instructions). A PARTIAL-YEAR RESIDENT or NONRESIDENT must
    file if they have income derived from or connected with Nebraska sources.'
