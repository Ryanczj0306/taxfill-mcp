    by tax year 2027. The three lower rates are unchanged at 2.46% / 3.51% / 5.01%, and all four schedules'' breakpoints
    are re-indexed for 2025 (Single/MFS $4,030/$24,120/$38,870, 2024: $3,900/$23,370/$37,670; MFJ/QSS $8,040/$48,250/$77,730,
    2024: $7,790/$46,760/$75,340; HoH $7,510/$38,590/$57,630, 2024: $7,270/$37,400/$55,850). Do NOT use 2024 tables
    or the 2026/2027 legislated rates.'
  - 'Base guidance: Supply Form 1040N line 5 — federal adjusted gross income, i.e. Federal Form 1040 or 1040-SR, line
    11a. The pack ships Nebraska''s standard deduction for the op to subtract, which reproduces line 14 (Nebraska
    Taxable Income = line 11 = line 5 minus the line 10 deduction, plus line 12 minus line 13 Schedule I adjustments)
    whenever there are no Nebraska Schedule I adjustments and the standard deduction is used. If Nebraska Schedule
    I adjustments apply, supply line 5 plus line 12 minus line 13 instead, so that subtracting the shipped standard
    deduction still reproduces line 14. Form 1040N line 14 says ''If less than -0-, enter -0-'' — the engine''s max(0,
    ...) floor matches.'
  - 'Adjudication note (two-pass): vector exemption counts are zero by design — Nebraska personal exemptions are a
    $171-per-person nonrefundable CREDIT on Form 1040N line 18 for 2025 (raised from $166 in 2024 and $157 in 2023),
    never an income exemption, so the pack ships no personal/dependent keys and the engine refuses nonzero counts.'
  - 'Nebraska personal exemptions are a TAX CREDIT, not an income exemption: Form 1040N line 18 gives RESIDENTS a
    nonrefundable credit of $171 times the number of Nebraska personal exemptions on line 4 (yourself, spouse, and
    dependents; the 2025 form prints ''$171 times the number on line 4''). It is subtracted from tax, not from income,
    so no personal/dependent amounts are shipped in exemptions and calc.state_tax does not apply it — claim it on
    line 18 of the form (nonresidents and partial-year residents claim it prorated on Nebraska Schedule III, line
    7).'
  - 'The shipped standard deduction is the 2025 chart amount with ZERO boxes checked on Form 1040N line 2a (under
    65, not blind) for a filer who cannot be claimed by another taxpayer for the federal child tax credit or dependent
    tax credit. Nebraska Standard Deduction Chart with line-2a boxes checked: Single $10,600 (1 box) / $12,600 (2);
    Married Filing Jointly $18,850 / $20,500 / $22,150 / $23,800 (1-4 boxes); Qualifying surviving spouse $18,850
    / $20,500 (1-2); Married Filing Separately $10,250 / $11,900 / $13,550 / $15,200 (1-4; the spouse''s 65-and-over
    and blind boxes count only if the primary taxpayer can claim a personal exemption for the spouse); Head of Household
    $14,600 / $16,600 (1-2). These are NOT applied by calc.state_tax — use the chart amount on line 6.'
  - If you or your spouse CAN be claimed by another taxpayer for federal child tax credit or dependent tax credit
    purposes, your standard deduction is the SMALLER of the federal standard deduction allowed on line 12e of Federal
    Form 1040/1040-SR or the Nebraska chart amount — not modeled; compute on the form.
  - 'Itemizers are not modeled: taxpayers who itemized on the federal return take the LARGER of the Nebraska standard
    deduction (line 6) or Nebraska itemized deductions (line 9 = federal Schedule A line 17 total minus line 8, the
    state and local income taxes reported on federal Schedule A line 5a — which must be entered even if the total
    state and local taxes were limited to $40,000, or $20,000 married filing separately, on federal Schedule A line
    5e). If you used the federal standard deduction you MUST use the Nebraska standard deduction (booklet, Line 6).'
  - Nebraska Schedule I adjustments (Form 1040N line 12 adjustments increasing federal AGI from Schedule I line 13,
    line 13 adjustments decreasing federal AGI from Schedule I line 44) are NOT modeled — if they apply, fold them
    into the supplied base per the base guidance or compute line 14 on the form. New Schedule I Part A lines for 2025
    include the Relocation Incentive Act employee recapture, losses on the sale or exchange of gold or silver bullion,
    and the addback of food-donation amounts deducted federally.
  - 'Tax table option (paper filers only): ''Only taxpayers filing paper returns may use the Nebraska Tax Table'';
    electronic filers must use the Tax Calculation Schedule (booklet, Line 15), which is the exact bracket math this
    op implements. The table calculates tax at the midpoint of each $100 band and covers Nebraska taxable income up
    to $77,760 (2024: $75,360), so a paper filer''s table amount may differ by a few dollars from this op''s result
    within a band; above $77,760 the booklet worksheet is (taxable income - $77,760) x .0520 plus $3,566 Single/MFS,
    $3,088 MFJ/QSS, or $3,276 HoH — each of which is the shipped schedule evaluated at $77,760 and rounded to whole
    dollars.'
  - 'Qualifying surviving spouse: the schedule''s second table is titled ''Married Taxpayers, Filing Jointly and Qualifying
    Surviving Spouses'' — the engine''s QSS-to-MFJ mapping is exact for the brackets, and the QSS standard deduction
    with zero boxes is the same $17,200.'
  - Married filing separately is printed with the SAME schedule as Single on the 2025 Tax Calculation Schedule (identical
    breakpoints $4,030/$24,120/$38,870 and identical constants $99.14/$804.30/$1,543.28) — copied from the MFS table,
    not derived by halving MFJ.
  - The schedule's printed '$X + Y% of the excess over $Z' constants are the exact cumulative bracket sums rounded
    to the nearest cent; maximum divergence from the exact sum is $0.008 (Single/MFS $99.14 vs exact $99.138, $804.30
    vs $804.297, $1,543.28 vs $1,543.272; MFJ $197.78 vs $197.784, $1,609.15 vs $1,609.155, $3,086.10 vs $3,086.103;
    HoH $184.75 vs $184.746, $1,275.66 vs $1,275.654, $2,229.56 vs $2,229.558) — after rounding to whole dollars the
    printed-schedule result and pure marginal bracket math agree.
  - 'Nebraska other tax is NOT modeled: Form 1040N line 16 adds 29.6% of the federal tax on lump-sum distributions
    of qualified retirement plans and on early distributions of qualified retirement plans; line 17 total tax = line
    15 + line 16.'
  - 'Nonresidents and partial-year residents are NOT modeled: they compute line 15 via Nebraska Schedule III (line
    9), which apportions the tax by the Nebraska-income ratio from Schedule III line 4.'
  - 'Credits are NOT modeled (they reduce tax after line 17): the $171-per-exemption personal exemption credit (line
    18), credit for tax paid to another state (line 19, Schedule II), the nonrefundable child/dependent care credit
    (line 23, 25% of the federal credit when AGI exceeds $29,000), the refundable child/dependent care credit (line
    42, Form 2441N, AGI $29,000 or less), the Beginning Farmer credit (line 43), the Nebraska EITC (line 44, 10% of
    the federal EITC), the community-college-only property tax credit (line 45, Form PTC), the $250 volunteer emergency
    responder credit (line 46), and — new or newly effective for 2025 — the stillborn child credit (line 47), child
    care credit for a parent or legal guardian (line 48), school readiness credit (line 49), reverse osmosis system
    credit (line 50), and the $500 refundable Intellectual and Developmental Disabilities Direct Support Professional
    credit (line 51). Note the 2025 RENUMBERING versus 2024 (refundable child/dependent care moved 40 -> 42, Nebraska
    EITC 42 -> 44, community college property tax credit 43 -> 45).'
  - 'Standard deduction chart source: 2025 Nebraska Individual Income Tax Booklet, Form 1040N, Line 6 — https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2025/f_Individual_Income_Tax_Booklet.pdf'

# H3 remote-work trap: the convenience-of-the-employer rule as CITED data (verified
# 2026-08-10 from the Nebraska DOR legislative-changes page). NOTE: LB 1023 AMENDED the
# rule effective TY2025 — the pre-2025 rule reached further; this block states the law
# for THIS pack year only, which is why the 2023/2024 NE packs do not carry it.
convenience_rule:
  summary: >-
    Nebraska's convenience-of-the-employer rule as AMENDED by LB 1023 for taxable years
    beginning on or after January 1, 2025: where a nonresident is paid for services performed
    outside Nebraska that are directly related to a business, trade, or profession carried on
    within Nebraska and, except for the nonresident's convenience, could have been performed in
    Nebraska — "Only the compensation paid for services performed within Nebraska constitutes
    Nebraska sourced income of the nonresident under this provision."
  trigger: >-
    A nonresident working remotely for a Nebraska business, trade, or profession (the pre-2025
    rule sourced convenience-based out-of-state wages TO Nebraska; the TY2025 amendment narrows
    Nebraska-source income to Nebraska-performed services).
  exceptions: >-
    Conference/training safe harbor (TY2025+): wages are not Nebraska-sourced when they are paid
    while present in Nebraska for a conference or training, the employee is present and earning
    wages in Nebraska for seven days or less during the taxable year, earned not more than
    $5,000 during the taxable year, and earned wages for work performed in more than one state
    during the taxable year.
  citation:
    source: Nebraska Department of Revenue, "2024 Nebraska Legislative Changes" — LB 1023 nonresident compensation sourcing, effective for taxable years beginning on or after 2025-01-01.
    url: https://revenue.nebraska.gov/about/2024-nebraska-legislative-changes
