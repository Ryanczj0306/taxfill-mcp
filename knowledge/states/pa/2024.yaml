# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 PA-40 instruction booklet
# (PA-40 IN 07-24) and the 2024 Form PA-40 itself (pa.gov): the form prints Line 12
# "PA Tax Liability. Multiply Line 11 by 3.07 percent (0.0307)" and the booklet
# opens with "The state income tax rate for 2024 is 3.07 percent (0.0307)".
# UNCHANGED for 2024 vs the 2023 pack: 3.07% flat rate, eight-class system, no
# standard deduction and no personal exemptions.
tax:
  citation:
    source: '2024 PA-40 Personal Income Tax Return Instructions (PA-40 IN 07-24) — "The state income tax rate for 2024
      is 3.07 percent (0.0307)"; Line 12 PA Tax Liability "Multiply Line 11 by 3.07 percent (0.0307)"; "PA law does
      not allow standard deductions, deductions for personal exemptions, itemized deductions, or deductions for personal
      expenses"; the eight income classes (Lines 1a-8). Second pass: the 2024 Form PA-40 itself prints Line 12 "PA Tax
      Liability. Multiply Line 11 by 3.07 percent (0.0307)" and Line 9 "Add only the positive income amounts from Lines
      1c, 2, 3, 4, 5, 6, 7, and 8. DO NOT ADD any losses" — both passes agree.'
    url: https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforindividuals/pit/documents/2024/2024_pa-40in.pdf
  flat_rate: 0.0307
  base: state_gross_income
  tax_line: PA-40 Line 12 (PA Tax Liability) = Line 11 (Adjusted PA Taxable Income = Line 9 minus Line 10 other deductions)
    x 3.07 percent (0.0307).
  exemptions: {}
  notes:
  - 'PA does NOT start from federal AGI: it taxes eight SEPARATELY-computed classes of income (2024 PA-40 Lines 1a-8
    — compensation; interest income; dividend and capital gains distributions income; net income or loss from the
    operation of a business, profession, or farm; net gain or loss from the sale, exchange, or disposition of property;
    net income or loss from rents, royalties, patents, or copyrights; estate or trust income; gambling and lottery
    winnings). Line 9 adds ONLY the positive amounts — a loss in one class may never offset income in another class.'
  - '"PA law does not allow standard deductions, deductions for personal exemptions, itemized deductions, or deductions
    for personal expenses" — calc.state_tax multiplies the supplied PA taxable-income base only.'
  - 'PA Tax Forgiveness (Schedule SP, PA-40 Line 21) and other low-income relief are OUTSIDE this flat-rate computation
    — check Schedule SP eligibility separately (2024 Eligibility Income Tables: unmarried base $6,500, married base
    $13,000, +$9,500 per dependent child, 100% down to 10%).'
  - Local earned-income taxes (PA municipalities/school districts) are NOT modeled here.
