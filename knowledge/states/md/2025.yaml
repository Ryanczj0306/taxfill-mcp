    - source: >-
        2025 Maryland Nonresident Tax Forms & Instructions (Form 505), Instruction 1 'WHAT FORM TO FILE?' (p. 1):
        'Taxpayer whose permanent home (domicile) is a state other than Maryland, you are a nonresident, unless you are
        a statutory resident.' — 'Form 505 Nonresident Return'; 'Nonresident of Maryland but received salary, wages or
        other compensation for personal services performed in any Maryland county or Baltimore City and you lived in a
        jurisdiction that imposes a local or earnings tax on Maryland residents. NOTE: If you have other income subject
        to Maryland tax, you must also file Form 505.' — 'Form 515 Nonresident Local Tax Return'
      url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/2025/nonresident-booklet.pdf
    - source: >-
        2025 Maryland Form 505, Nonresident Income Tax Return (COM/RAD-022 09/25) — the 4-page form itself
      url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/forms/2025/505.pdf
    - source: >-
        2025 Maryland Form 505NR, Nonresident Income Tax Calculation (COM/RAD-318 09/25) — 'ATTACH TO YOUR TAX RETURN'
      url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/forms/2025/505nr.pdf
    - source: >-
        2025 Maryland Form 515, for nonresidents employed in Maryland who reside in jurisdictions that impose a local
        income or earnings tax on Maryland residents (COM/RAD-023 09/25), with its instructions — Instruction 2 'WHO MUST
        FILE?' (instructions Page 1): 'In general, you are liable for local income tax and must file this return if you
