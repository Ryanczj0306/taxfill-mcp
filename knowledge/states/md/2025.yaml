unverified:
- Form 502CG (the NEW 2025 form that computes net capital gain income subject to the additional 2% tax for filers
  with federal AGI over $350,000) was NOT fetched this session. Its existence, purpose, the $350,000 FAGI trigger,
  and the mechanics (Form 502CG line 9 -> Form 502 line 20a; line 21b = line 20a x .02) are confirmed from the 2025
  Resident Booklet (NEW FOR 2025, Instructions 16 and 17) and from the printed 2025 Form 502 itself, but the exceptions
  and the definition of 'certain net capital gain income' come from the 502CG instructions, which were not read.
  Anyone with FAGI over $350,000 and capital gain income MUST consult Form 502CG.
- The 2025 Maryland Tax Table (mandatory when taxable net income is under $100,000) and the Anne Arundel County
  tax table were not transcribed; only their mandate and the Worksheet 17A / 19D schedules were read. Table amounts
  within a band can differ from rate-schedule math by a few dollars.
- Exact official title string of Form 515 was not opened on a .gov page in this session (referenced via the resident
  booklet as the alternate nonresident/local-jurisdiction form); confirm at the Comptroller if precise Form 515
  wording is needed.
- The online payment portal URL (interactive.marylandtaxes.gov/Individuals/Payment/) is carried from the 2024 pack
  and the booklet's 'marylandtaxes.gov ... Bill Pay' direction; the deep-link path was not independently re-fetched
  as a live page this session.
- The 2025 Form 505NR (nonresident calculation) was not opened; nonresident special-rate mechanics are summarized
  from the 2025 Nonresident Booklet's instructions and the local rate chart's 'Nonresidents use .0225' line.
- The 2025 LOCAL TAX RATE CHART was transcribed in full from the 2025 booklet, but was NOT diffed county by county
  against the 2024 chart; only the changes this session could substantiate against the 2024 pack's own recorded
  figures are called out (Dorchester .0330, Cecil .0274, Anne Arundel's middle rate 2.94% with new $11,640/$13,932.00
  constants). Verify a specific county's year-over-year change at the Comptroller if it matters.
- The 2025 Resident Booklet PDF carries a March 2025 creation date in its metadata even though its content is the
  final tax-year-2025 booklet (cover 'MARYLAND 2025 State & Local Tax Forms & Instructions', NEW FOR 2025 describing
  HB 352 and the One Big Beautiful Bill Act decoupling, April 15 2026 due date). The metadata date is not evidence
  of a draft; the content and the independently dated Nonresident Booklet (2026-01-20) and Form 502 (2025-11-25)
  agree on every figure used here.
