  tax_line: '2025 Form 502 line 21: ''Maryland tax (from Tax Table or Computation Worksheet Schedules I or II)'',
    computed on line 20 ''Taxable net income (Subtract Line 19 from Line 18.)'''
  exemptions: {}
  notes:
  - '2025 RESTRUCTURE (Budget Reconciliation and Financing Act, House Bill 352 — ''NEW FOR 2025'', booklet p. i: ''The
    State income tax brackets have been altered beginning in tax year 2025''): TWO NEW TOP BRACKETS were added. Tax
    Rate Schedule I (single/MFS/dependent/fiduciary) now runs ... $250,001-$500,000 at 5.75%, $500,001-$1,000,000
    at 6.25%, and $1,000,001+ at 6.50%; Tax Rate Schedule II (joint/HoH/QSS) now runs ... $300,001-$600,000 at 5.75%,
    $600,001-$1,200,000 at 6.25%, and $1,200,001+ at 6.50%. The 5.75% rate is NO LONGER the top rate and its bracket
    is now BOUNDED. Do NOT apply the 2024 eight-bracket schedules to 2025. The Comptroller will waive interest or
    penalties on underpaid 2025 estimated tax to the extent the underpayment results from these rate changes.'
  - 'Base guidance: Supply Form 502 line 20 ''Taxable net income (Subtract Line 19 from Line 18.)''. Compute it on
    the form: line 1 federal AGI (2025 Instruction 11 says copy federal Form 1040/1040SR line 11a) + additions (lines
    2-6, including code letter g, treaty-exempt income) - subtractions (lines 8-15) = line 16 Maryland adjusted gross
    income; minus line 17 deduction amount (for 2025 the standard deduction is a FLAT $3,350 for single/dependent/married-filing-separately
    or $6,700 for joint/head-of-household/qualifying-surviving-spouse — Instruction 16; OR itemized per Instruction
    14, reduced for filers with federal AGI over $200,000/$100,000 MFS) = line 18 net income; minus line 19 exemption
    amount (Exemption Amount Chart 10A: $3,200 per person phased down by federal AGI, plus $1,000 each for age 65
    or over and/or blind, never phased out) = line 20. Neither the deduction nor the exemptions are shipped as engine
    amounts — the caller must take both on the form before supplying line 20.'
  - 'Adjudication note (two-pass, TY2025): the 2025 Schedules I and II were drafted from Instruction 17 of the Resident
    Booklet and re-verified against three independent prints — the Worksheet 17A computation schedules at the end
    of the 2025 tax table (booklet p. 33), the 2025 Nonresident Booklet''s Instruction 19 reprint, and the 2025 Nonresident
    Booklet''s Form 505NR worksheet rows. All rates, bounds, and printed constants agree. PASS-2 FINDING (a real defect
    in the published booklet, not in this pack): the RESIDENT booklet''s Worksheet 17A Schedule I mislabels the 6.25%
    row as ''At least $250,001 but not over $1,000,000'' — it should read ''At least $500,001 but not over $1,000,000'',
    which is what the NONRESIDENT booklet''s identical row prints. The row''s own subtraction amount ($500,000.00)
    and addition amount ($27,135.00) are correct, so the arithmetic is unaffected; only the row label is wrong. Use
    the Instruction 17 schedule (or the nonresident print) to pick the right row.'
  - 'Every printed ''$X plus Y% of excess over $Z'' constant in both 2025 schedules equals the exact cumulative sum
    of the prior brackets — re-derived digit by digit this session: Schedule I $20.00 / $50.00 / $90.00 / $4,697.50
    / $5,947.50 / $7,260.00 / $12,760.00 / $27,135.00 / $58,385.00; Schedule II $20.00 / $50.00 / $90.00 / $7,072.50
    / $8,322.50 / $10,947.50 / $15,072.50 / $32,322.50 / $69,822.50. There is NO rounding divergence, so pure marginal
    bracket math reproduces the worksheet exactly, and the Worksheet 17A subtraction-method rows are algebraically
    identical.'
  - 'Tax-table mandate below $100,000: Instruction 17 states ''You must use the tax tables if your taxable income
    is less than $100,000'' and ''The 2025 Maryland tax rate schedules are shown so you can see the tax rate that
    applies to all levels of income; however, do not use them to figure your tax.'' Bracket math may differ by a few
    dollars within the table''s $50 bands; the filed Form 502 must use the 2025 Maryland Tax Table for line-20 income
    under $100,000 and the MARYLAND TAX COMPUTATION WORKSHEET SCHEDULES (17A) at $100,000 or more.'
  - 'CRITICAL — NEW FOR 2025, additional 2% tax on net capital gain income is OUTSIDE this schedule: a filer who reported
    federal adjusted gross income of MORE THAN $350,000 on Form 502 line 1 and capital gain income on line 1c must
    compute certain net capital gain income on the NEW Form 502CG, enter it on Form 502 line 20a, and enter 2% of
    it on line 21b (''Additional tax on net capital gain income. Multiply Line 20a by .02''). Maryland tax after credits
    (line 27) adds lines 21 through 21b. This op computes LINE 21 ONLY, so for any filer over the $350,000 FAGI trigger
    the result UNDERSTATES Maryland tax by the entire line 21b amount. See Form 502CG for the exceptions and the definition
    of qualifying gain.'
  - 'CRITICAL — mandatory LOCAL income tax is NOT modeled: every Maryland county and Baltimore City levies a local
    income tax on the SAME Form 502 line-20 taxable net income, entered on Form 502 line 28 (Local Tax Worksheet 19A:
    line 20 x the county rate). The 2025 Local Tax Rate Chart (Instruction 19) runs from .0225 (Worcester County;
    also the rate nonresidents use) to .0330 (Dorchester County — a NEW statewide maximum for 2025, above the .0320
    that had been the ceiling), with .0320 for Baltimore City, Baltimore, Calvert, Caroline, Howard, Kent, Montgomery,
    Prince George''s, Queen Anne''s, St. Mary''s, Somerset and Wicomico; .0306 Harford; .0303 Allegany, Carroll and
    Charles; .0295 Washington; .0274 Cecil (down from .0275); .0265 Garrett; .0240 Talbot. TWO counties are GRADUATED:
    Anne Arundel (single/MFS/dependent: 2.7% to $50,000, then $1,350 plus 2.94% of the excess over $50,000 to $400,000,
    then $11,640 plus 3.2% over $400,000; joint/HoH/QSS: 2.7% to $75,000, then $2,025 plus 2.94% to $480,000, then
    $13,932.00 plus 3.2% over $480,000 — the middle rate rose from 2.81% in 2024; use the Anne Arundel county tax
    table or Worksheet 19D) and Frederick (single/MFS/dependent: .0225 to $25,000, .0275 to $50,000, .0296 to $150,000,
    .0320 above; joint/HoH/QSS: .0225 to $25,000, .0275 to $100,000, .0296 to $250,000, .0320 above). Local tax adds
    roughly 2.25%-3.30% of line-20 income on top of the state tax computed here.'
  - 'Standard deduction is NOT shipped even though it became a FLAT amount for 2025: Instruction 16 now reads ''If
    your filing status is single, dependent, or married filing separately, your standard deduction amount is $3,350.
    If your filing status is married filing jointly, head of household, or qualifying surviving spouse, your standard
    deduction amount is $6,700.'' The 2024 mechanism (15% of Maryland AGI clamped to $1,800-$2,700 / $3,650-$5,450
    via Standard Deduction Worksheet 16A) is GONE — the worksheet no longer appears in the booklet. It is still not
    shipped here because this pack''s base is Form 502 LINE 20, which is already net of the line 17 deduction; shipping
    it would subtract the deduction twice. Take it on line 17.'
  - 'Personal and dependent exemptions are NOT shipped because they phase out by federal AGI (Exemption Amount Chart
    10A, Instruction 10, unchanged for 2025): $3,200 each for taxpayer, spouse, and each dependent when federal AGI
    is $100,000 or less, reduced to $1,600 (FAGI $100,000-$125,000), $800 ($125,000-$150,000), and $0 (over $150,000)
    for single/MFS, and to $3,200 (through $150,000), $1,600 ($150,000-$175,000), $800 ($175,000-$200,000), and $0
    (over $200,000) for joint/HoH/QSS; dependent taxpayers get $0 for themselves. An additional $1,000 each for age
    65 or over and/or blind (taxpayer and spouse) is never phased out. These are genuine base reductions subtracted
    on Form 502 line 19 BEFORE the rate applies — they are already inside the caller-supplied line-20 base.'
  - 'Filing-status mapping: Maryland prints exactly two schedules. Tax Rate Schedule I covers Single, Married Filing
    Separately, and Dependent Taxpayers (and fiduciaries); Tax Rate Schedule II covers Married Filing Jointly, Head
    of Household, and Qualifying Surviving Spouse. Qualifying surviving spouse therefore maps to married_filing_jointly
    with no difference; a dependent taxpayer (filing status 6) uses the shipped ''single'' brackets. Both schedules
    begin ''At least $1'', which is modeled here as over=0 for the first bracket.'
  - 'Items after line 21 are NOT modeled: line 21a recaptured credit (Form 502CR Part DD) and line 21b (the new 2%
    capital-gain tax) are ADDED to tax, and lines 22-26 CREDITS are subtracted from it — Maryland earned income credit
    (50% of the federal EIC on line 22, up to 100% via Worksheet 18A.1 for no-child single/HoH/QSS filers, plus a
    refundable portion equal to the excess of 45% of the federal EIC over Maryland tax on line 44), poverty level
    credit (line 23, 5% of earned income), and Form 502CR credits (line 24, including the Senior Tax Credit and the
    child and dependent care credit). Local credits are lines 29-31. These are tax CREDITS, not income exemptions,
    and must never be treated as base reductions.'
  - This pack models the resident Form 502 only. Nonresidents file Form 505/505NR and pay a special nonresident tax
    (the 2025 local-rate chart lists 'Nonresidents use .0225') in lieu of the county local tax; part-year residents
    must adjust deductions and exemptions under Instruction 26. Maryland is a treaty NON-conforming state (Instruction
    12 code letter g adds federally treaty-exempt income back).
  - 'No mid-year 2025 rate surprise beyond HB 352: the 2025 Schedules I and II in the final Resident Booklet, the
    Worksheet 17A schedules, and the 2025 Nonresident Booklet (built 2026-01-20, after the season opened) all print
    the same ten-bracket structure. Return due April 15, 2026.'
