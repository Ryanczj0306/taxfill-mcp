        2025 Maryland State & Local Tax Forms & Instructions (resident booklet, Form 502), Instruction 1 'WHO MUST
        FILE?' — 'PART-YEAR RESIDENTS' (p. 1): 'If you began or ended residence in Maryland during the tax year, you
        must file a Maryland resident income tax return. See Instruction 26.' — Instruction 26 'SPECIAL INSTRUCTIONS FOR
        PART-YEAR RESIDENTS.' (p. 22): 'a. You must file Form 502.'
      url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/2025/resident-booklet.pdf
    - source: >-
        2025 Maryland Nonresident Tax Forms & Instructions (Form 505), Instruction 1 'WHAT FORM TO FILE?' (p. 1):
        'Taxpayer who moved into or out of Maryland during the tax year and received income from Maryland sources while
        you were a nonresident of Maryland.' — 'Form 505 Nonresident Return and Form 502 Resident Return'; Instruction 28
        'PART-YEAR RESIDENTS.' (p. 15): 'If you moved into or out of Maryland during 2025 AND received taxable Maryland
        income both while you were a resident and while you were a nonresident AND you are required to file a federal
        return, you are required to file two returns with the State of Maryland.' | 2025 Maryland Nonresident Tax Forms
        and Instructions (Form 505 instructions, 25 pages, PDF build 2026-01-20) — the independent SECOND-PASS source;
