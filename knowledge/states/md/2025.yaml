jurisdiction: states/md
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Maryland Form 502 starts from federal adjusted gross income (line 1 = "Adjusted gross income from
  your federal return"), so treaty-exempt income is initially excluded — BUT Maryland then adds it back. Instruction
  12 (Additions to Income), Line 5 "Other Additions to Income," code letter g reads verbatim in the 2025 Resident
  Booklet: "Income exempt from federal tax by federal law or treaty that is not exempt from Maryland tax." This
  is an explicit add-back of federally treaty-exempt income (analogous to California''s Schedule CA addback), entered
  on Form 502 line 5 with code letter g. Therefore treaty-exempt income IS re-taxed by Maryland and the state does
  NOT conform. Source: 2025 Resident Booklet, Instruction 12, code letter g (marylandcomptroller.gov) — re-read
  and confirmed present for tax year 2025.'
citation:
  source: 2025 Maryland Form 502 Resident Income Tax Return (COM/RAD-009, PDF build 2025-11-25) — line 1 'Adjusted
    gross income from your federal return'; Additions lines 2-6 incl. line 5 'Other additions (Enter code letter(s)
    from Instruction 12.)'; lines 16-20 (Maryland adjusted gross income, deduction amount, net income, exemption
    amount, taxable net income); NEW line 20a 'Net capital gain income subject to additional tax from Line 9 of
    Form 502CG'; line 21 'Maryland tax (from Tax Table or Computation Worksheet Schedules I or II)'; line 21a recaptured
    credit; NEW line 21b 'Additional tax on net capital gain income. Multiply Line 20a by .02'; line 28 local tax
  url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/forms/2025/502.pdf
forms:
  resident: Form 502 — Maryland Resident Income Tax Return (COM/RAD-009). Part-year residents also file Form 502
    (per Instruction 26).
  part_year_or_nonresident: 'Nonresidents: Form 505 — Maryland Nonresident Income Tax Return, with Form 505NR (Nonresident
    Income Tax Calculation) attached. A nonresident employed in Maryland who lived in a jurisdiction that imposes a local
    income or earnings tax on Maryland residents files Form 515 (Nonresident Local Tax Return) for that wage income, and
    also Form 505 if they have other income subject to Maryland tax. Part-year residents file the resident Form 502 with
    part-year adjustments (Instruction 26); a part-year resident who also received Maryland-source income while a
    nonresident files two returns, Form 502 and Form 505 (Form 505 Instructions 1 and 28).'
  # (Phase K JK28, 2026-10-16): each role's own instructions and forms, which state_scope adds to a part-year or
  # nonresident filer's citations — the top-level `citation` is the RESIDENT Form 502, so this entry named Forms 505,
  # 505NR and 515 but pointed only at Form 502. CORRECTED from the 2025 documents: the entry said "Part-year residents
  # do NOT use 505", but the 2025 Form 505 instructions send a "Taxpayer who moved into or out of Maryland during the
  # tax year and received income from Maryland sources while you were a nonresident of Maryland" to "Form 505
  # Nonresident Return and Form 502 Resident Return" (Instruction 1) — "you are required to file two returns with the
  # State of Maryland" (Instruction 28); and Form 515, described before as for "nonresidents subject to the special
  # nonresident/local-jurisdiction rules", is now described from its title and its Instruction 2. The URLs are the
  # Comptroller's 2025 paths (content/dam/mdcomp/tax/instructions/2025/ and .../forms/2025/, the pattern this pack's
  # other citations use; the Comptroller's forms list renders client-side); each PDF was downloaded twice on
  # 2026-10-16 with identical sha256 (resident booklet 17bc9f77e055c057..., nonresident booklet 6374472b22453e0e...,
  # 505 e042f70a30672aaf..., 505NR 7177b20646147e2a..., 515 e0fe52462271f6ac...). The first nonresident-booklet entry
  # (part_year) ends, after ' | ', with this pack's all_citations description of the same URL, verbatim: the source
  # registry keeps one description per (topic, url) and reads `forms` before `all_citations`, so the role quote alone
  # had replaced it and get_sources stopped routing "capital gain", "worksheet" and "net capital gain additional tax"
  # to the booklet. That description was re-checked against a fresh download (same sha256): 25 pages, created
  # 2026-01-20; Tax Rate Schedules I and II (Instruction 19) and Lines 31a and 32d, the additional tax on net capital
  # gain income, are on p. 10; the Form 505NR worksheet rows are the Tax Computation Worksheet Schedules on p. 21; and
  # both schedules' rows equal the resident booklet's (re-downloaded, same sha256 17bc9f77e055c057...).
  citations:
