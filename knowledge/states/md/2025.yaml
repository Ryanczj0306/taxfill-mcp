effective_law_changes:
- description: >-
    TWO NEW TOP BRACKETS added by the Budget Reconciliation and Financing Act, House Bill 352 ("The
    State income tax brackets have been altered beginning in tax year 2025"): Tax Rate Schedule I
    (single/MFS/dependent/fiduciary) now runs $250,001-$500,000 at 5.75%, $500,001-$1,000,000 at 6.25%
    and $1,000,001+ at 6.50%; Tax Rate Schedule II (joint/HoH/QSS) now runs $300,001-$600,000 at 5.75%,
    $600,001-$1,200,000 at 6.25% and $1,200,001+ at 6.50%. The 5.75% rate is NO LONGER the top rate and
    its bracket is now BOUNDED — do NOT apply 2024's eight-bracket schedules to 2025. The Comptroller
    will waive interest or penalties on underpaid 2025 estimated tax to the extent the underpayment
    results from these rate changes.
