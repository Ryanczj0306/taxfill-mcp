# MD state knowledge — tax year 2024. Fetched + cited from the MD Comptroller (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure was drafted from the 2024 Resident Booklet
# (marylandcomptroller.gov), then independently re-derived from a second official 2024
# document (the 2024 Nonresident Booklet's identical rate-schedule print, the 2024 Form
# 502 itself, or the 2024 Form 502CR) — resolutions recorded inline where the passes
# differed. NOTE the 2024 changes vs 2023: indexed standard-deduction clamps
# ($1,800-$2,700 / $3,650-$5,450), new GRADUATED local brackets in Anne Arundel and
# Frederick counties (booklet cover: 'New local tax brackets for 2024'), Cecil County
# cut to .0275, and 2024-adjusted credit thresholds (CDCC chart, poverty guidelines).
jurisdiction: states/md
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Maryland Form 502 starts from federal adjusted gross income (line 1 = "Adjusted gross income from
  your federal return"), so treaty-exempt income is initially excluded — BUT Maryland then adds it back. Instruction
  12 (Additions to Income), Line 5 "Other Additions to Income," code letter g reads verbatim: "Income exempt from
  federal tax by federal law or treaty that is not exempt from Maryland tax." This is an explicit add-back of federally
  treaty-exempt income (analogous to California''s Schedule CA addback), entered on Form 502 line 5 with code letter
  g. Therefore treaty-exempt income IS re-taxed by Maryland and the state does NOT conform. Source: 2024 Resident
  Booklet, Instruction 12, code letter g (marylandcomptroller.gov / marylandtaxes.gov).'
citation:
  source: 2024 Maryland Form 502 Resident Income Tax Return (COM/RAD-009) — line 1 'Adjusted gross income from your
    federal return'; Additions lines 2-6 incl. line 5 'Other additions (Enter code letter(s) from Instruction 12.)';
    lines 16-21 (Maryland AGI, deduction, exemption, taxable net income, Maryland tax); line 28 local tax
  url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/forms/2024/502.pdf
starts_from: 'federal AGI (Form 502 line 1: "Adjusted gross income from your federal return"; Instruction 11: "Copy
  the figure for federal adjusted gross income from Line 11 of your federal Form 1040/1040SR onto Line 1 of Form
  502")'
residency:
  summary: 'You are a resident of Maryland if (a) your permanent home is or was in Maryland (domicile), OR (b) your
    permanent home is outside Maryland but you maintained a place of abode (a place to live) in Maryland for more
    than six months of the tax year AND you were physically present in the state for 183 days or more (statutory
    resident) — in which case you must file a full-year resident return. Part-year residents (those who began or
    ended legal residence in Maryland during 2024) file the resident Form 502 with adjustments per Instruction 26.
    Nonresidents who had Maryland-source income (and were not Maryland residents) file the nonresident return (Form
    505, or Form 515 for nonresidents employed in a Maryland local jurisdiction that imposes a local tax). Military
    personnel domiciled in Maryland but stationed elsewhere generally retain Maryland residency (see Instruction
    29). Source: 2024 Resident Booklet, "Who Is a Resident?" and Instructions 9 and 26.'
forms:
  resident: Form 502 — Maryland Resident Income Tax Return (COM/RAD-009). Part-year residents also file Form 502
    (per Instruction 26).
  part_year_or_nonresident: 'Nonresidents: Form 505 — Maryland Nonresident Income Tax Return (COM/RAD-022), with
    Form 505NR (Nonresident Income Tax Calculation) attached; Form 515 is used by nonresidents subject to the special
    nonresident/local-jurisdiction rules. Part-year residents do NOT use 505 — they file the resident Form 502 with
    part-year adjustments (Instruction 26).'
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it. The 2024 credit thresholds shown here
  (CDCC chart endpoints, refundable-CDCC FAGI caps, poverty income guidelines) are the 2024-adjusted figures — do
  not reuse 2023 values.
credits:
- name: Maryland Earned Income Credit (state EITC) - nonrefundable portion
  type: nonrefundable
  eligibility: Maryland residents who qualify for the federal Earned Income Credit — including, for Maryland purposes,
    taxpayers who miss the federal minimum-age requirement (calculate the federal EIC disregarding the age minimum)
    and ITIN filers otherwise eligible (calculate disregarding the SSN requirement). Dependent taxpayers (filing
    status 6) are excluded from the poverty level credit but may claim the EIC per the worksheet.
  amount: 'Married couples (joint or separate) and taxpayers with at least one qualifying child: 50% of the federal
    earned income credit (Worksheet 18A line 2: federal EIC x .50), entered on Form 502 line 22, limited to Maryland
    tax (Worksheet 18A line 1). Individuals filing single, head of household, or qualifying surviving spouse WITHOUT
    a qualifying child instead use Worksheet 18A.1 and may claim up to 100% of the federal EIC (refundable; amounts
    to Lines 22 and 42).'
  income_limit_2024: No separate Maryland income cap; eligibility tracks the federal EITC income limits for tax
    year 2024.
  claimed_on: Form 502, line 22 (computed on State Earned Income Credit Worksheet 18A / 18A.1 in Resident Booklet
    Instruction 18).
  citation:
    source: Comptroller of Maryland - 2024 Resident Booklet (Form 502 Instructions), Instruction 18 and Worksheets
      18A / 18A.1
    url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/2024/Resident-Booklet.pdf
- name: Maryland Refundable Earned Income Credit (refundable portion of state EITC)
  type: refundable
  eligibility: Residents whose Maryland earned income credit exceeds their Maryland tax. Available to a married
    couple filing jointly or separately (with or without a qualifying child), or any taxpayer with at least one
    qualifying child; individuals without a qualifying child use Worksheet 18A.1. Must have an entry on Form 502
    line 22 and line 29 and zero on line 3 of Worksheet 18A.
  amount: The amount by which 45% of your federal earned income credit exceeds your Maryland tax liability (Worksheet
    21A line 1, 'ENTER your federal earned income credit x 45% (.45)').
  income_limit_2024: No separate Maryland income cap; tracks federal EITC income limits for tax year 2024.
  claimed_on: Form 502, line 42 (Refundable Earned Income Credit Worksheet 21A in Resident Booklet Instruction 21).
  citation:
    source: Comptroller of Maryland - 2024 Resident Booklet, Instruction 21 (Line 42) and Worksheet 21A
    url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/2024/Resident-Booklet.pdf
- name: Maryland State Poverty Level Credit
  type: nonrefundable
  eligibility: Residents whose earned income and federal adjusted gross income (plus additions) are below the poverty
    income guidelines for the number of persons in the family/household claimed on the federal return, and generally
    whose Maryland tax exceeds 50% of their federal earned income credit. NOT available if you checked filing status
    6 (dependent taxpayer).
  amount: '5% of your earned income (Worksheet 18B line 5: earned income x .05). This is not a refundable credit.'
  income_limit_2024: Must be below the 2024 poverty income guidelines listed in the booklet, e.g. $15,060 (1 person),
    $20,440 (2), $25,820 (3), $31,200 (4), $36,580 (5), $41,960 (6), $47,340 (7), $52,720 (8); add $5,380 per additional
    person.
  claimed_on: Form 502, line 23 (State Poverty Level Credit Worksheet 18B in Resident Booklet Instruction 18).
  citation:
    source: Comptroller of Maryland - 2024 Resident Booklet, Instruction 18 (Line 23) and 2024 Poverty Income Guidelines
      chart
    url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/2024/Resident-Booklet.pdf
- name: Maryland Credit for Child and Dependent Care Expenses
  type: nonrefundable
  eligibility: Maryland residents only who were eligible for the federal Child and Dependent Care Credit (federal
    Form 2441) for tax year 2024. (A separate refundable top-up exists for lower-income filers — Worksheet 21B;
    for 2024 it is unavailable if FAGI exceeds $59,400 (individual) or $89,100 (joint); claimed on Form 502CR Part
    CC line 7.)
  amount: A percentage of the federal credit, starting at 32% (decimal 0.3200) and phasing down as FAGI rises (per
    the 2024 Credit for Child and Dependent Care Expenses Chart in the Form 502CR instructions); the credit equals
    federal Form 2441 credit x the chart decimal (Form 502CR Part B line 2 x line 3).
  income_limit_2024: Phases to 0.0000 for FAGI of $109,301 and up (individual) or $169,901 and up (married filing
    jointly) — the 2024 chart endpoints (higher than 2023's $103,650/$161,100).
  claimed_on: Form 502CR, Part B (line 4), carried to Part AA line 2; total credits flow to Form 502 line 24.
  citation:
    source: Comptroller of Maryland - 2024 Form 502CR (Part B, Credit for Child and Dependent Care Expenses Chart,
      and instructions)
    url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/forms/2024/502CR.pdf
- name: Maryland Senior Tax Credit
  type: nonrefundable
  eligibility: Resident individuals who are at least age 65 (created by SB405, Acts of 2022). Subject to federal
    AGI limits below. Part-year residents are not required to prorate the credit amount.
  amount: $1,000 if FAGI does not exceed $100,000. For married filing jointly, qualifying surviving spouse, and
    head of household whose FAGI does not exceed $150,000, the credit is $1,750 (reduced to $1,000 if only one spouse
    on a joint return is at least age 65). Nonrefundable - excess is not refunded.
  income_limit_2024: FAGI must not exceed $100,000 (single/other) or $150,000 (married filing jointly, qualifying
    surviving spouse, head of household).
  claimed_on: Form 502CR, Part M (line 1), carried to Part AA line 13; total flows to Form 502 line 24.
  citation:
    source: Comptroller of Maryland - 2024 Form 502CR (Part M instructions) and 2024 Resident Booklet Instruction
      18 (Line 24, letter m)
    url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/forms/2024/502CR.pdf
- name: Refundable Maryland Child Tax Credit
  type: refundable
  eligibility: Residents with a federal AGI of $15,000 or less AND one or more qualified dependents — a child under
    age 6 on the last day of the tax year, or a child over age 5 and under age 17 who has a disability (physician
    certification required with Form 502CR). No limit on the number of qualifying children.
  amount: '$500 multiplied by the number of qualified children (Worksheet 21C: number of qualified children on Form
    502B x $500).'
  income_limit_2024: 'Federal adjusted gross income must be $15,000 or less (Worksheet 21C line 1: if Form 502 Line
    1 is greater than $15,000, not eligible).'
  claimed_on: Form 502CR, Part CC, line 8 (Refundable Maryland Child Tax Credit, Worksheet 21C).
  citation:
    source: Comptroller of Maryland - 2024 Resident Booklet, Instruction 21 (Line 43 item 8) and Refundable Child
      Tax Credit Worksheet 21C
    url: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/2024/Resident-Booklet.pdf
filing_requirement:
  note: 'You generally must file a Maryland return if you are/were a Maryland resident and are required to file
    a federal return, or if your Maryland gross income (total federal income plus Maryland additions, minus certain
    subtractions) equals or exceeds the minimum filing level for your status. 2024 minimum filing levels for taxpayers
    under 65 (Table 1): Single (incl. dependent taxpayers) $14,600; Joint $29,200; Married filing separately $14,600;
    Head of household $21,900; Qualifying surviving spouse $29,200. Higher thresholds apply if 65 or over (Table
    2: Single 65+ $16,550; Joint one 65+ $30,750; Joint both 65+ $32,300; MFS 65+ $14,600; HoH 65+ $23,850; QSS
    65+ $30,750). You should also file to claim a refund if Maryland tax was withheld. Source: 2024 Resident Booklet,
    Instruction 1 "Who Must File?" and Minimum Filing Levels Tables 1 and 2.'
