  base: state_taxable_income
  tax_line: '2024 Form 502 line 21: ''Maryland tax (from Tax Table or Computation Worksheet Schedules I or II)'''
  exemptions: {}
  notes:
  - 'Base guidance: Supply Form 502 line 20 ''Taxable net income (Subtract line 19 from line 18.)''. Compute it on
    the form: line 1 federal AGI + additions (lines 2-6) - subtractions (lines 8-15) = line 16 Maryland adjusted gross
    income; minus line 17 deduction (standard = 15% of line 16 clamped to $1,800-$2,700 for filing statuses 1/3/6
    or $3,650-$5,450 for statuses 2/4/5 via Worksheet 16A — the 2024 indexed clamps, up from $1,700-$2,550 / $3,450-$5,150
    in 2023 — OR itemized = federal itemized deductions less state and local income taxes) = line 18 net income; minus
    line 19 exemption amount (Exemption Amount Chart 10A: $3,200 per person phased down by federal AGI, +$1,000 each
    age-65/blind) = line 20. Because Maryland''s standard deduction is a percentage of income with min/max clamps
    and its exemptions phase out by federal AGI, neither is shipped as a fixed amount — the caller must supply line
    20 with deductions and exemptions already taken on the form.'
  - 'Adjudication note (two-pass): the 2024 Schedules I and II are UNCHANGED from 2023 — same bounds, rates, and printed
    constants in the Instruction 17 print, the Worksheet 17A schedules at the end of the tax table, and the 2024 Nonresident
    Booklet''s reprint. What DID change for 2024 is outside the state schedule: the standard-deduction clamps were
    indexed and several LOCAL rates changed (see the local-tax note).'
  - 'Tax-table mandate below $100,000: Instruction 17 states ''You must use the tax tables if your taxable income
    is less than $100,000'' and ''The 2024 Maryland tax rate schedules are shown so you can see the tax rate that
    applies to all levels of income; however, do not use them to figure your tax.'' Bracket math may differ by a few
    dollars within the $50 table bands; the filed Form 502 must use the 2024 Maryland Tax Table for line-20 income
    under $100,000 and Worksheet Schedules 17A at $100,000 or more.'
  - 'Mandatory LOCAL income tax is NOT modeled: every Maryland county and Baltimore City levies a local income tax
    on the SAME Form 502 line-20 taxable net income, entered on Form 502 line 28. The 2024 Local Tax Rate Chart (Instruction
    19) runs from .0225 (Worcester County; also the nonresident rate) to .0320 (e.g. Baltimore City, Baltimore, Caroline,
    Dorchester, Howard, Kent, Montgomery, Prince George''s, Queen Anne''s, Somerset, Wicomico). NEW FOR 2024 (''New
    local tax brackets for 2024''): Anne Arundel County is now THREE-bracket graduated by filing status (single/MFS/dependent:
    2.7% to $50,000, $1,350 + 2.81% of excess to $400,000, $11,185 + 3.2% over $400,000; joint/HoH/QSS: 2.7% to $75,000,
    $2,025 + 2.81% to $480,000, $13,405.50 + 3.2% over $480,000 — use the Anne Arundel county tax table or Worksheet
    19D), and Frederick County is FOUR-bracket graduated by filing status (.0225 to $25,000; .0275 to $50,000 single-side
    / $100,000 joint-side; .0296 to $150,000 / $250,000; .0320 above). Cecil County dropped to .0275. Local tax adds
    roughly 2.25%-3.20% of line-20 income on top of the state tax computed here.'
  - 'Standard deduction is NOT shipped because it is income-dependent: 15% of Maryland adjusted gross income (Form
    502 line 16) with a 2024 minimum of $1,800 and maximum of $2,700 for filing statuses 1, 3, 6 (single, married
    filing separately, dependent taxpayer) and a 2024 minimum of $3,650 and maximum of $5,450 for statuses 2, 4, 5
    (joint, head of household, qualifying surviving spouse) — Standard Deduction Worksheet 16A, Instruction 16 (flat
    $1,800/$3,650 at or below $12,000/$24,333 of income; 15% between; flat $2,700/$5,450 at or above $18,000/$36,333).
    Itemizers instead enter federal itemized deductions less state and local income taxes (lines 17a/17b). Take the
    deduction on Form 502 line 17 before supplying line 20 as the base.'
  - 'Personal and dependent exemptions are NOT shipped because they phase out by federal AGI (Exemption Amount Chart
    10A, Instruction 10): $3,200 each for taxpayer, spouse, and each dependent when federal AGI is $100,000 or less,
    reduced to $1,600 (FAGI $100,000-$125,000), $800 ($125,000-$150,000), and $0 (over $150,000) for single/MFS, and
    to $1,600 ($150,000-$175,000), $800 ($175,000-$200,000), and $0 (over $200,000) for joint/HoH/QSS; dependent taxpayers
    (filing status 6) get $0 for themselves. An additional $1,000 each for age 65-or-over and/or blind (taxpayer and
    spouse) is never phased out. These are genuine base reductions subtracted on Form 502 line 19 BEFORE the rate
    applies — they are already inside the caller-supplied line-20 base.'
  - 'Filing-status mapping: Maryland prints exactly two schedules. Tax Rate Schedule I covers Single, Married Filing
    Separately, and Dependent Taxpayers (and fiduciaries); Tax Rate Schedule II covers Joint, Head of Household, and
    Qualifying Surviving Spouse. Qualifying surviving spouse therefore maps to married_filing_jointly with no difference;
    a dependent taxpayer (filing status 6) uses the shipped ''single'' brackets.'
  - 'The printed ''$X plus Y% of excess over $Z'' constants in both 2024 schedules equal the exact cumulative sum
    of the prior brackets (verified: Schedule I $20.00/$50.00/$90.00/$4,697.50/$5,947.50/$7,260.00/$12,760.00; Schedule
    II $20.00/$50.00/$90.00/$7,072.50/$8,322.50/$10,947.50/$15,072.50) — no rounding divergence, so marginal bracket
    math reproduces the worksheet exactly; the Worksheet 17A subtraction-method rows are algebraically identical.'
  - 'Items after line 21 are NOT modeled: line 21a recaptured credit (Form 502CR Part DD) is added, and lines 22-26
    CREDITS are subtracted from tax — Maryland earned income credit (50% of federal EIC on line 22, 100% via Worksheet
    18A.1 for no-child singles/HoH/QSS, plus a refundable portion up to 45% of federal EIC on line 42), poverty level
    credit (line 23), and Form 502CR credits (line 24). These are tax CREDITS, not income exemptions, and must never
    be treated as base reductions.'
  - This pack models the resident Form 502 only. Nonresidents file Form 505/505NR and pay a special nonresident tax
    (the 2024 local-rate chart lists 'Nonresidents use .0225') in lieu of the county local tax; part-year residents
    must prorate exemptions and deductions under Instruction 26.
  - 'No 2024 state rate change: the 2024 Schedules I and II are the same statutory schedules printed since 2012 (top
    rate 5.75% over $250,000/$300,000); Maryland had no mid-year 2024 state rate legislation. The 2024 booklet''s
    ''New local tax brackets for 2024'' cover-page item refers to the county (local) changes only.'
