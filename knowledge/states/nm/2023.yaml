unverified:
- The 2023 PIT-1/PIT-B/PIT-ADJ instructions were retrieved from the NM Taxation & Revenue Department's public-files
  host (klvg4oyd4j.execute-api.us-west-2.amazonaws.com), which is the AWS-backed document store linked from tax.newmexico.gov
  rather than a tax.newmexico.gov URL itself; content matches the Department's official 2023 PIT booklet but the
  host domain is an AWS execute-api endpoint. Confirm at tax.newmexico.gov Forms & Publications if a tax.newmexico.gov-hosted
  copy is required.
- Exact dollar filing-requirement thresholds (income amounts below which a return need not be filed) were not extracted
  line-by-line from the federal-filing-requirement charts; the requirement is stated as keyed to the federal filing
  requirement plus NM residency/NM-source income. Confirm specific dollar thresholds against the federal Form 1040
  instructions / NM PIT-1 booklet at the DOR.
tax:
  citation:
    source: 'Statutory rate schedules of Section 7-2-7 NMSA 1978 as enacted by 2019 House Bill 6 (Laws 2019, ch. 270),
      ''for any taxable year beginning on or after January 1, 2021'' and unchanged for 2023 — MFS 1.7% to $4,000 / $68
      + 3.2% to $8,000 / $196 + 4.7% to $12,000 / $384 + 4.9% to $157,500 / $7,513.50 + 5.9%; HoH-QSS-MFJ 1.7% to $8,000
      / $136 + 3.2% to $16,000 / $392 + 4.7% to $24,000 / $768 + 4.9% to $315,000 / $15,027 + 5.9%; Single (and estates/trusts)
      1.7% to $5,500 / $93.50 + 3.2% to $11,000 / $269.50 + 4.7% to $16,000 / $504.50 + 4.9% to $210,000 / $10,010.50
      + 5.9%. Second pass: the Department''s 2023 TAX RATE TABLE (PIT-TRT) — the mandated tax look-up table for PIT-1
      line 18 (worked example: MFJ taxable income $25,325 -> table $834) and its continuation schedules (''If line 17
      of Form PIT-1 (Taxable Income) is over $96,000'': Single $4,422 + 4.9% of excess over $96,000 to $210,000, then
      $10,008 + 5.9%; MFJ/HoH $4,294 + 4.9% to $315,000, then $15,025 + 5.9%; MFS $4,498 + 4.9% to $157,500, then $7,512
      + 5.9%; footnote ''* This column must also be used by surviving spouse''), retrieved from the Department''s public-files
      library, the AWS-backed document store linked from tax.newmexico.gov (the NM pack''s documented host exception):
      https://klvg4oyd4j.execute-api.us-west-2.amazonaws.com/prod/PublicFiles/34821a9573ca43e7b06dfad20f5183fd/89e01cee-3d91-46d0-bd4b-72c8b0d6ed00/2023trt.pdf'
    url: https://www.nmlegis.gov/Sessions/19%20Regular/final/HB0006.pdf
  brackets:
