tax:
  citation:
    source: 'Statutory rate schedules of Section 7-2-7 NMSA 1978 as enacted by 2019 House Bill 6 (Laws 2019, ch. 270),
      ''for any taxable year beginning on or after January 1, 2021'' — still in force for tax year 2024 (the 2024 omnibus
      restructure to a six-bracket schedule first applies to tax year 2025): MFS 1.7% to $4,000 / $68 + 3.2% to $8,000
      / $196 + 4.7% to $12,000 / $384 + 4.9% to $157,500 / $7,513.50 + 5.9%; HoH-QSS-MFJ 1.7% to $8,000 / $136 + 3.2%
      to $16,000 / $392 + 4.7% to $24,000 / $768 + 4.9% to $315,000 / $15,027 + 5.9%; Single (and estates/trusts) 1.7%
      to $5,500 / $93.50 + 3.2% to $11,000 / $269.50 + 4.7% to $16,000 / $504.50 + 4.9% to $210,000 / $10,010.50 + 5.9%.
      Second pass: the Department''s 2024 TAX RATE TABLE (PIT-TRT) — the mandated look-up table for PIT-1 line 18 (worked
      example: MFJ taxable income $25,325 -> table $834; now extended through $100,000) and its continuation schedules
      (''If line 17 of Form PIT-1 (Taxable Income) is over $100,000'': Single $4,618 + 4.9% of excess over $100,000
      to $210,000, then $10,008 + 5.9%; MFJ/HoH $4,490 + 4.9% to $315,000, then $15,025 + 5.9%; MFS $4,694 + 4.9% to
      $157,500, then $7,512 + 5.9%; footnote ''* This column must also be used by surviving spouse''), retrieved from
      the Department''s public-files library, the AWS-backed document store linked from tax.newmexico.gov (the NM pack''s
      documented host exception): https://klvg4oyd4j.execute-api.us-west-2.amazonaws.com/prod/PublicFiles/34821a9573ca43e7b06dfad20f5183fd/8c12623f-2127-489a-886f-6efb1cd55d0e/2024pit-trt.pdf
      — the 5.9% continuation constants (10,008/15,025/7,512) are digit-identical to 2023, confirming the schedules
      did not change.'
    url: https://www.nmlegis.gov/Sessions/19%20Regular/final/HB0006.pdf
