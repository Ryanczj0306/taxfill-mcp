unverified:
- The 2025 PIT-1 instructions, the 2025 Personal Income Tax Packet (which carries the 2025 PIT-TRT rate table and
  the PIT-ADJ/PIT-RC instructions) and the Department's 'Personal Income Tax Rates' publication were retrieved from
  the NM Taxation & Revenue Department's public-files host (klvg4oyd4j.execute-api.us-west-2.amazonaws.com), which
  is the AWS-backed document store that tax.newmexico.gov links to from its Forms & Publications page rather than a
  tax.newmexico.gov URL itself; content matches the Department's official 2025 PIT booklet but the host domain is an
  AWS execute-api endpoint. Confirm at tax.newmexico.gov Forms & Publications if a tax.newmexico.gov-hosted copy is
  required.
- The additional Low Income Property Tax Rebate for Los Alamos, Santa Fe, Dona Ana, and Bernalillo county residents
  (PIT-RC Section 4) is not carried in `credits`; the 2025 Modified Gross Income Limitations table gates it at
  modified gross income of $24,000 or less, but its rebate computation was not transcribed here — see the 2025
  PIT-RC instructions Section 4 before claiming.
- Exact dollar filing-requirement thresholds (income amounts below which a return need not be filed) are keyed to
  the federal filing requirement plus NM residency / NM-source income; confirm specific dollar thresholds against
  the federal Form 1040 instructions and the NM PIT-1 booklet at the DOR.
tax:
  citation:
    source: 'Statutory rate schedules of Section 7-2-7 NMSA 1978 as RESTRUCTURED by 2024 House Bill 252 (Laws 2024,
      Chapter 67, Section 5), ''for any taxable year beginning on or after January 1, 2025'' — six brackets replacing
      the 1.7-5.9% five-bracket schedule that ran TY2021-TY2024: MFJ/HoH/surviving spouse 1.5% to $8,000 / $120 + 3.2%
      to $25,000 / $664 + 4.3% to $50,000 / $1,739 + 4.7% to $100,000 / $4,089 + 4.9% to $315,000 / $14,624 + 5.9%;
      Single (and estates/trusts) 1.5% to $5,500 / $82.50 + 3.2% to $16,500 / $434.50 + 4.3% to $33,500 / $1,165.50
      + 4.7% to $66,500 / $2,716.50 + 4.9% to $210,000 / $9,748 + 5.9%; MFS 1.5% to $4,000 / $60.00 + 3.2% to $12,500
      / $332 + 4.3% to $25,000 / $869.50 + 4.7% to $50,000 / $2,044.50 + 4.9% to $157,500 / $7,312 + 5.9%. Second pass:
      the Department''s own ''Personal Income Tax Rates'' publication (PIT rates_2005_2025.pdf, page 1 ''PERSONAL INCOME
      TAX RATES FOR TAX YEARS STARTING 2025'') prints the same schedules digit-for-digit, and the Department''s 2025
      PIT-TRT Tax Rate Table (2025 Personal Income Tax Packet, page T-1 ff.) implements them: the look-up table now
      runs through $100,000 and its continuation schedules read ''If line 17 of Form PIT-1 (Taxable Income) is over
      $100,000'': Single $4,356 + 4.9% of excess over $100,000 to $210,000, then $9,746 + 5.9%; Married Filing Jointly
      and Head of Household $4,087 + 4.9% to $315,000, then $14,622 + 5.9%; Married Filing Separately $4,492 + 4.9%
      to $157,500, then $7,310 + 5.9% (footnote ''* This column must also be used by surviving spouse''). Packet URL
      (Department AWS-backed public-files library, the NM pack''s documented host exception): https://klvg4oyd4j.execute-api.us-west-2.amazonaws.com/prod/PublicFiles/34821a9573ca43e7b06dfad20f5183fd/0558a902-6362-47ca-8e3b-7cca3bc69b9d/2025%20PIT%20Packet_Final.pdf'
    url: https://www.nmlegis.gov/Sessions/24%20Regular/final/HB0252.pdf
