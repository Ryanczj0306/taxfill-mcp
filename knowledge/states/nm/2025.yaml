  notes:
  - 'TY2025 = THE RESTRUCTURE YEAR: Section 7-2-7 NMSA 1978 now carries SIX brackets (1.5%, 3.2%, 4.3%, 4.7%, 4.9%,
    5.9%) instead of the five (1.7%, 3.2%, 4.7%, 4.9%, 5.9%) that ran TY2021 through TY2024. 2024 House Bill 252 (Laws
    2024, ch. 67, Sec. 5) cut the bottom rate 1.7% -> 1.5%, inserted a new 4.3% bracket, and widened the 3.2%/4.7%/4.9%
    bands (single: 3.2% now to $16,500 not $11,000, 4.7% to $66,500, 4.9% starts at $66,500 not $16,000; MFJ/HoH:
    3.2% to $25,000, 4.3% to $50,000, 4.7% to $100,000). The top 5.9% thresholds are unchanged ($210,000 single /
    $315,000 MFJ-HoH / $157,500 MFS) but their constants moved ($9,748 / $14,624 / $7,312 for 2025 vs $10,010.50 /
    $15,027 / $7,513.50 for 2024). Do NOT reuse the 2024 block, and do not reuse this block for 2024.'
  - 'Base guidance: supply Form PIT-1, line 17 (New Mexico Taxable Income) = lines 9 (federal AGI) + 10 (SALT add-back
    for itemizers) + 11 (PIT-ADJ additions) MINUS lines 12, 13, 14 and 15, zero floor. STRUCTURAL 2025 CHANGE: line
    16 (the medical care expense deduction for persons 65+, which was subtracted on the 2024 return) is now ''Reserved
    for Future Use. Do not use this line.'' — that exemption is claimed on Schedule PIT-ADJ line 18 and arrives inside
    line 15 instead, so line 17 subtracts lines 12-15 only. Every deduction/exemption is computed ON THE FORM, so
    none ship as keys: line 12 is the filer''s OWN federal standard or itemized deduction amount (federal Form 1040/1040SR
    line 12); line 13 is the $4,000 ''Deduction for Certain Dependents'' (head-of-household or MFJ filers only, and
    the worksheet multiplies $4,000 by total dependents MINUS ONE — never a flat per-dependent amount); line 14 is
    the New Mexico low- and middle-income tax exemption (maximum $2,500 per qualified exemption, phasing with AGI
    and filing status — 2025 gates: PIT-1 line 9 must be $36,667 or less single, $55,000 or less MFJ/surviving spouse/head
    of household, $27,500 or less MFS); line 15 is the PIT-ADJ deductions and exemptions total. Do NOT supply raw
    federal AGI.'
  - 'Adjudication note (two-pass): pass 1 = the statutory schedules in 2024 HB 252 as retrieved from nmlegis.gov (printed
    constants exact: $120/$664/$1,739/$4,089/$14,624 MFJ-HoH-surviving spouse; $82.50/$434.50/$1,165.50/$2,716.50/$9,748
    single; $60.00/$332/$869.50/$2,044.50/$7,312 MFS — each constant reproduces exactly as the cumulative marginal
    tax at the bracket floor, e.g. single $2,716.50 + 143,500 x 4.9% = $9,748). Pass 2 = the Department''s ''Personal
    Income Tax Rates'' publication (identical text) plus the 2025 PIT-TRT look-up table''s over-$100,000 continuation
    schedules, whose constants ($4,356/$4,087/$4,492 at $100,000 and $9,746/$14,622/$7,310 at the 5.9% thresholds)
    sit $2-$2.50 below the statutory cumulative figures ($4,358/$4,089/$4,494.50 and $9,748/$14,624/$7,312) exactly
    as expected from a table that chains from its last $100 midpoint row — the same offset the 2024 pack recorded
    when it previewed the 2025 table (9,746/14,622/7,310).'
  - 'CRITICAL — the filed line 18 value comes from the MANDATED look-up table, which sits a few dollars BELOW statutory
    marginal math: for line 17 of $100,000 or less the 2025 PIT-TRT table row (in $100 bands, computed at band midpoints)
    is the filed figure; over $100,000 the TRT continuation schedule CHAINS FROM THE LAST TABLE ROW (''Your Tax is
    $4,356 + 4.9% of taxable income in excess of $100,000'' single; $4,087 MFJ/HoH; $4,492 MFS; then $9,746/$14,622/$7,310
    + 5.9%) instead of the statutory cumulative ($4,358 / $4,089 / $4,494.50; $9,748 / $14,624 / $7,312), so the filed
    figure runs about $2-$3 below this engine''s statutory bracket math at high incomes. The filed form must take
    the table/schedule value — never plain bracket arithmetic (the NM hand-fill pack''s line 18 carries the same mandate).'
  - 'Statuses: the statute groups ''married individuals filing joint returns, heads of household and surviving spouses''
    on ONE schedule — head_of_household here is the SAME schedule as married_filing_jointly (copied per the schema,
    not derived), and the 2025 PIT-TRT prints identical MFJ and Head of Household columns with the footnote ''* This
    column must also be used by surviving spouse'', so qualifying surviving spouse maps to married_filing_jointly
    exactly as the engine assumes.'
  - 'The single schedule also applies to estates and trusts (Section 7-2-7(B) NMSA 1978 as amended for 2025: ''For
    single individuals and for estates and trusts'').'
  - 'Not modeled on the same return: line 19 additional tax on lump-sum distributions (New Mexico''s 5x averaging
    method, Line 19 worksheet); PIT-B allocation/apportionment for income from sources inside and outside New Mexico
    (line 18 then comes from PIT-B line 14, indicator B); Schedule CC alternative tax (gross sales of $100,000 or
    less, no NM real estate); the nonresident gross-royalty-income election under $5,000 (indicator Y); line 20 credit
    for taxes paid to another state; PIT-CR business credits; and the refundable credits/rebates (Working Families
    Tax Credit 25% of the federal EIC, Child Income Tax Credit, PIT-RC rebates) — all tax credits or separate computations,
    never base reductions.'
  - New Mexico has no state-defined standard deduction or personal exemption of its own — the federal deduction flows
    through on PIT-1 line 12 (the federal Form 1040/1040SR line 12 amount), which is why the caller supplies the form's
    own taxable-income line and no standard_deduction or exemptions ship.
