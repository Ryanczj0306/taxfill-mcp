  web_pay_url: https://tap.state.nm.us
deadlines:
  filing_due_date: '2026-04-15'
  citation:
    source: '2025 PIT-1 New Mexico Personal Income Tax Return Instructions — Filing Due Date: "Both paper and
      electronic PIT returns are due on or before April 15, 2026." (CHANGE from TY2024: there is no longer a later
      April 30 due date for returns that are both e-filed and e-paid — the instructions state "April 15, 2026 is the
      deadline for filing both electronic" and paper returns, and "Electronically-filed returns are due April 15,
      2026". If April 15 falls on a weekend or observed holiday the return is due the next business day. New Mexico
      accepts the IRS automatic six-month extension: with a federal Form 4868 for tax year 2025, October 15, 2026 is
      the extended due date for calendar-year filers; an extension of time to file does not extend the time to pay,
      so use a PIT-EXT voucher to stop interest.)'
    url: https://klvg4oyd4j.execute-api.us-west-2.amazonaws.com/prod/PublicFiles/34821a9573ca43e7b06dfad20f5183fd/2d774fd0-be97-4b57-8dae-68aed999da0f/2025pit-1-ins.pdf
