  base: state_gross_income
  tax_line: 'AR1000F Line 29: "TAX: (Enter tax from tax table)" — the tax on Line 28 ("Subtract Line 27 from Line
    25. This is your Net Taxable Income."), per the 2024 AR1000F/AR1000NR Instructions, Tax Computation, Lines 26-29.'
  exemptions: {}
  standard_deduction:
    single: 2410
    married_filing_jointly: 4820
    married_filing_separately: 2410
    head_of_household: 2410
  notes:
  - 'Base guidance: Supply AR1000F Line 25, ''Adjusted Gross Income (AGI)'' — Arkansas AGI, i.e. Line 23 Total Income
    (built line-by-line from source documents, Lines 8–22: W-2 wages, interest, dividends, etc.; Arkansas does NOT
    start from federal AGI or federal taxable income) minus Line 24 adjustments (Form AR1000ADJ). The op subtracts
    the shipped per-status standard deduction (Line 27) to reach Line 28 Net Taxable Income and applies the brackets
    (the Line 29 tax). If you itemize (Form AR3), the shipped standard deduction is wrong for you — compute Line 27
    on the form instead.'
  - 'Test-vector counts are zero by construction: Arkansas ships NO personal/dependent exemption keys (the $29-per-person
    amounts are CREDITS against tax, AR1000F Lines 7A/7B) — the engine refuses nonzero counts for this state by design.'
  - 'RETROACTIVE 2024 RATE CUT — Act 1 of the Second Extraordinary Session of 2024 (June 2024 special session): ''Marginal
    Income Tax rates for 2024 have been amended, and the top rate will be reduced to 3.9%'' (booklet, Special Information
    for Tax Year 2024), retroactive to January 1, 2024. The shipped schedule is the FINAL 2024 filing-season version:
    the 2024 Indexed Tax Brackets document and the booklet tax tables (Low Income Rev 09/23/2024; Regular Rev 09/19/2024)
    all print the 3.9% top rate. The whole schedule was re-indexed vs 2023: 0% floor to $5,499 (was $5,299), 2% to
    $10,899, 3% to $15,599, 3.4% to $25,699, 3.9% above (2023 top was 4.7% above $24,999).'
  - Arkansas has ONE bracket schedule for every filing status — the published 2024 Indexed Tax Brackets and the tax
    tables do not vary by status, so all four statuses ship identical brackets. Filing Status 2 (married filing joint)
    runs the couple's COMBINED Line 28 net taxable income through the same un-widened schedule; Arkansas instead offers
    Filing Status 4 (married filing separately on the SAME return), where each spouse's own Line 28 income goes through
    the schedule in a separate column (tax = Line 29(A) + Line 29(B), summed on Line 30) — often less total tax than
    status 2. This op models a single run of one income through the schedule.
  - Surviving Spouse is a SEPARATE Arkansas status (Filing Status 6) with a $2,410 standard deduction — NOT the $4,820
    married-filing-joint amount. The engine maps qualifying surviving spouse to married_filing_jointly, which would
    wrongly apply $4,820; an Arkansas surviving spouse gets $2,410 (compute as single for the deduction).
  - 'Table mandate at ALL income levels: AR1000F Line 29 takes the tax from the 2024 tax tables (booklet pp.24-30),
    which are computed at the MIDPOINT of each income band and rounded to the whole dollar — ''If you use a formula
    to calculate Arkansas income tax, the results must match the table exactly. The calculations in the table are
    made at the midpoint of each income level'' (2024 Indexed Tax Brackets; worked examples: $75,900–$76,000 band
    -> $75,950 x .039 - $409.86 = $2,552.19 -> $2,552; $14,800–$14,900 band -> $14,850 x .030 - $218.97 = $226.53
    -> $227). Bracket math may differ from the table by a few dollars within a band; the filed form must use the table.'
  - CRITICAL — shipped brackets are exact ONLY for net taxable income up to $92,300. From $92,301 to $95,500 the official
    schedule phases the 3.9% bracket's 'minus adjustment' down from $409.86 to $87.40 in $10-per-$100-band steps (the
    $94,301–$94,500 range intentionally spans $200 per the Ark. Code Ann. 26-51-201(d)(1) rounding note), and at $95,501+
    the tax is 3.9% x net taxable income - $87.40. The shipped bracket math (equivalent to 3.9% x income - $409.86)
    UNDERSTATES the true tax above $92,300 — by $322.46 once net taxable income reaches $95,501 — so above $92,300
    compute from the official schedule/table, not from these brackets.
  - 'The Regular Income Tax Table''s printed top rule — ''For $100,001 and over, your tax is $3,811 + 3.9% of the
    excess over $100,000'' (booklet p.30, Rev 09/19/2024) — equals 3.9% x income - $89.00, while the 2024 Indexed
    Tax Brackets constant for $95,501+ is $87.40 (3.9% x $100,000 - $87.40 = $3,812.60): a $1.60 divergence, because
    $3,811 is the midpoint-rounded last table row ($99,901–$100,001: $99,951 x .039 - $87.40 = $3,810.689 -> $3,811).
    The filed form follows the printed table/formula.'
  - The published 'minus adjustment' constants equal the cumulative sum of the prior brackets to the cent ($109.98
    = 2% x $5,499 exactly; $218.97 exactly; $281.37 vs exact $281.366; $409.86 vs exact $409.861) — no material rounding
    divergence, so the shipped marginal brackets reproduce the official formula to within one cent below $92,301.
  - 'EXEMPTIONS ARE CREDITS IN ARKANSAS — none are shipped: Arkansas has no personal or dependent exemption that reduces
    income. It gives $29-per-person PERSONAL TAX CREDITS instead (AR1000F Line 7A boxes: yourself, spouse, 65 or over,
    ''65 Special'', blind, deaf, head-of-household/surviving-spouse; Line 7B: $29 per dependent; totaled on Line 7C
    and subtracted from TAX on Line 34). These credits are not modeled by this op.'
  - 'Other nonrefundable credits reduce the computed tax on the form but are NOT modeled: the ''Additional Tax Credit
    for Qualified Individuals'' (up to $60 per individual, 2024 net taxable income up to $26,900, worksheet p.21 R
    10/7/2024: $60 at $0–$25,800 declining $5 per $100 band to $0 at $26,901+), the 20%-of-federal-computation Child
    and Dependent Care Credit (2024 AR2441 line 10 ''Multiply line 9 by .20''), the $50/$100 state political contributions
    credit, and the $500-per-dependent Developmental Disabilities credit (AR1000TC). The 2023 one-time Inflationary
    Relief Income Tax Credit does NOT exist for 2024.'
  - 'Low Income Tax Table (NOT modeled): full-year residents whose total income from all sources is within the limits
    may take tax from the 2024 Low Income Tax Table applied to Line 25 AGI with NO deduction on Line 27 (''CAUTION:
    If you qualify to use a Low-Income Tax Table, enter zero (0) on line 27, column A. The Standard Deduction is already
    built into the table.''), which yields LESS tax than the shipped math at low incomes — tax is $0 up to $14,265
    (single), $20,282 / $24,176 (HoH or Surviving Spouse with 1-or-no / 2-or-more dependents), $24,057 / $28,953 (MFJ
    with 1-or-no / 2-or-more dependents), and the table is usable up to AGI of $17,000 (single), $24,600 / $28,200
    (HoH/SS), $28,300 / $35,100 (MFJ). Married couples must file Status 2 to qualify; filers claiming the active-duty
