  citation:
    source: 'Arkansas DFA, Revenue Division — ''2024 Indexed Tax Brackets'' (Individual Income Tax): full bracket table
      (From / Less Than or Equal To / Percentage / Minus Adjustment: 0% to $5,499; 2% $5,500–$10,899 minus $109.98;
      3% $10,900–$15,599 minus $218.97; 3.4% $15,600–$25,699 minus $281.37; 3.9% $25,700–$92,300 minus $409.86; then
      $10-per-$100 adjustment phase-down $92,301–$95,500; 3.9% minus $87.40 at $95,501+), midpoint-of-band formula examples
      ($75,950 x .039 - $409.86 = $2,552.19 -> $2,552; $14,850 x .030 - $218.97 = $226.53 -> $227), and Ark. Code Ann.
      26-51-201(d)(1) indexing note (the $94,301–$94,500 range intentionally spans $200). Cross-verified against the
      2024 AR1000F and AR1000NR Instructions booklet (https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR1000F_and_AR1000NR_Instructions.pdf):
      ''Special Information for Tax Year 2024'' (Act 1 of the Second Extraordinary Session of 2024 — top rate reduced
