# AR state knowledge — tax year 2024. Fetched + cited from the AR DFA (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 AR1000F/AR1000NR
# instructions booklet, then independently re-derived from a second official document —
# the DFA '2024 Indexed Tax Brackets' PDF, the 2024 AR1000F form itself, the 2024 AR2441,
# or the 2024 AR1000TC instructions — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGE (Special Information for Tax Year 2024): Act 1 of the SECOND
# Extraordinary Session of 2024 (June 2024 special session, retroactive to 1/1/2024) cut
# the top marginal rate to 3.9% (from 2023's 4.7%), and the whole schedule was re-indexed
# (0% floor now to $5,499; 3.9% from $25,700; bracket-adjustment phase-down $92,301-$95,500).
# The 2023 one-time Inflationary Relief Income Tax Credit does NOT exist for 2024.
jurisdiction: states/ar
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Arkansas does NOT conform to federal tax treaty exemptions. Two independent .gov-sourced facts establish
  this for 2024: (1) The AR1000F return does NOT start from federal adjusted gross income. It builds Arkansas income
  line-by-line from source documents — Line 8 W-2 wages, Line 10 interest, Line 11 dividends, etc., summed to Line
  23 ''Total Income'' and then to Arkansas AGI on Line 25. Because income is captured from the W-2/source level,
  a federal treaty exclusion taken on the federal return does NOT carry through. (2) The 2024 instructions state
  explicitly (Line 22/income section): ''Foreign students who are exempt from federal taxes because of a tax treaty
  must file and pay tax on all income including non-qualified scholarship or fellowship income. Stipends are taxable.''
  That is an affirmative requirement to tax treaty-exempt income, equivalent to a treaty add-back. Therefore
  treaty-exempt income IS re-taxed by Arkansas -> conforms_to_federal_treaties = false.'
citation:
  source: 'Arkansas 2024 Individual Income Tax Forms and Instructions (AR1000F and AR1000NR Instructions booklet)
    - Arkansas Dept. of Finance and Administration. Contains: Special Information for Tax Year 2024 (Act 1 of the
    Second Extraordinary Session of 2024, top rate 3.9%), residency/domicile definitions, who-must-file thresholds
    and ''When to File'' April 15, 2025 due date, tax-treaty foreign-student taxation language, line-by-line income
    section (Lines 8-25), Standard Deduction chart ($2,410/$4,820), Personal Tax Credits ($29), Low Income Tax
    Tables (Rev 09/23/2024) and Regular Income Tax Table (Rev 09/19/2024), mailing addresses, and check-payable
    instructions.'
  url: https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR1000F_and_AR1000NR_Instructions.pdf
starts_from: Arkansas does NOT start from federal AGI. The AR1000F/AR1000NR income section is built line-by-line
  from source documents (Line 8 W-2 wages, Line 10 interest, Line 11 dividends, ... Line 23 Total Income), then
  computes Arkansas Adjusted Gross Income on Line 25 (Line 23 minus Line 24 AR1000ADJ adjustments). Effectively
  the starting point is federal wages / individual income items, not federal AGI or federal taxable income.
residency:
  summary: 'Residency is based on domicile (the place you intend as your permanent home and to return to whenever
    away; you can have only one, and it does not change until you move somewhere you intend to make your permanent
    home). FULL YEAR RESIDENT: you lived in Arkansas all of calendar year 2024, or maintained a domicile or Home
    of Record in Arkansas during the tax year (file AR1000F). NONRESIDENT: you did not make your domicile in Arkansas
    (file AR1000NR); nonresidents who received ANY gross income from Arkansas sources must file, regardless of amount,
    and remote workers must file if the employer reports Arkansas taxable income (but per Act 1019 of 2021, a nonresident
    is only taxed on income for work physically performed inside Arkansas). PART YEAR RESIDENT: you established a
    domicile in Arkansas, or moved out of the state, during calendar year 2024 (file AR1000NR); must file if any
    gross income was received while an Arkansas resident. The instructions do not state a bright-line day-count
    statutory-resident test (no 183-day rule); residency turns on domicile. (Military: Home of Record in Arkansas
    keeps you an Arkansas resident, though active-duty military compensation is exempt.)'
forms:
  resident: AR1000F - Full Year Resident Individual Income Tax Return
  part_year_or_nonresident: AR1000NR - Part Year or Non-Resident Individual Income Tax Return
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Personal Tax Credit (personal exemption credit)
  type: nonrefundable
  eligibility: 'Every Arkansas individual filer. One credit each for: yourself, spouse, and each dependent; plus
    extra credit boxes for age 65 or over, ''65 Special'' (age 65+ not claiming the retirement income exemption
    on line 18), blind, deaf, and head of household/surviving spouse. Listed in the Personal Tax Credits section
    of the return.'
  amount: $29 per box checked and $29 per dependent (Line 7A boxes x $29, Line 7B dependents x $29, totaled on Line
    7C) — unchanged for 2024; the 2024 AR1000F form prints the 'X $29 =' multipliers on lines 7A and 7B.
  income_limit_2024: None
  claimed_on: Form AR1000F lines 7A/7B/7C, carried to AR1000F line 34
  citation:
    source: Arkansas DFA - 2024 AR1000F Full Year Resident Individual Income Tax Return (form, P1, lines 7A/7B/7C
      'X $29 =') and 2024 AR1000F/AR1000NR Instructions (Line 7A/7B personal tax credits, Line 34)
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR1000F_FullYearResidentIndividualIncomeTaxReturn.pdf
- name: Child and Dependent Care Credit
  type: nonrefundable
  eligibility: Resident taxpayers who paid for the care of a qualifying person (a dependent under age 13, or a spouse/dependent
    incapable of self-care) so the taxpayer (and spouse, if married) could work or look for work. Mirrors the federal
    child and dependent care credit (federal Form 2441 mechanics on Form AR2441). Filing status 5 (married filing
    separately on different returns) generally cannot claim it unless the AR2441 checkbox requirements are met.
  amount: 20% of the federally-computed child and dependent care credit. The 2024 AR2441 computes an applicable
    percentage (0.35 at AGI of $15,000 or less, sliding to 0.20 for AGI over $43,000, line 8 table) of qualified
    expenses up to $3,000 for one qualifying person or $6,000 for two or more (line 3), then line 10 is 'Multiply
    line 9 by .20. Enter this amount on line 35 and/or line 43 of AR1000F/AR1000NR.'
  income_limit_2024: No hard income cap; the federal-style percentage applied to expenses declines with higher AGI
    (35% at $15,000 or less, down to 20% for over $43,000).
  claimed_on: Form AR2441, result entered on AR1000F/AR1000NR line 35 (and/or line 43 Early Childhood Credit — combined
    total cannot exceed the AR2441 amount)
  citation:
    source: Arkansas DFA - 2024 AR2441 Child and Dependent Care Expenses (form, lines 3, 8-10) and 2024 AR1000F/AR1000NR
      Instructions (Line 35)
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR2441_Child_andDependentCareExpenses.pdf
- name: Additional Tax Credit for Qualified Individuals (low-income credit)
  type: nonrefundable
  eligibility: An individual taxpayer with net income up to $26,900 (2024, indexed from 2023's $26,100) who timely
    files an Arkansas income tax return (Act 1 of the Second Extraordinary Session of 2021). Doubled for joint Filing
    Status 2, and computed separately per spouse for Filing Status 4.
  amount: 'Up to $60 per individual. Per the 2024 table (R 10/7/2024): $60 for net taxable income $0-$25,800, then
    declining by $5 per $100 bracket ($55, $50, ... $5) up to $26,900, and $0 once net taxable income is $26,901
    or more.'
  income_limit_2024: Net taxable income (AR1000F line 28) of $26,900 or less for tax year 2024
  claimed_on: Additional Tax Credit for Qualified Individuals Worksheet (booklet p.21), then Form AR1000TC line
    6, carried to AR1000F line 36
  citation:
    source: Arkansas DFA - 2024 Individual Income Tax Forms and Instructions booklet, 'Additional Tax Credit For
      Qualified Individuals Worksheet' and table (p.21, R 10/7/2024) and Special Information for Tax Year 2024 (net
      income up to $26,900)
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR1000F_and_AR1000NR_Instructions.pdf
- name: Credit for Individuals with Developmental Disabilities
  type: nonrefundable
  eligibility: Taxpayers who have a dependent (or self) who qualifies with a developmental disability, as certified
    on Form AR1000-DD (formerly AR1000RC5). Certifications valid on/after January 1, 2022 have no expiration date;
    the AR1000TC must be submitted yearly, and the AR1000-DD attached the first year the credit is claimed. The
    credit follows the child and can only be claimed on one tax return per year.
  amount: $500 per qualifying dependent with a developmental disability ('Multiply number of dependents with developmental
    disabilities by $500 and enter the total', 2024 AR1000TC instructions, Line 7)
  income_limit_2024: None
  claimed_on: Form AR1000TC line 7 (names/SSNs on lines 7A-7F; attach Form AR1000-DD the first year), carried to
    AR1000F line 36
  citation:
    source: Arkansas DFA - Instructions for AR1000TC (2024), Line 7 (R 10/15/2024); 2024 booklet Special Information
      (Act 191 of 2023, AR1000RC5 renamed AR1000-DD)
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR1000TC_Instructions.pdf
- name: State Political Contributions Credit
  type: nonrefundable
  eligibility: Any Arkansas taxpayer who made cash contributions by April 15, 2025 to a candidate seeking nomination
    or election to a PUBLIC (state/local, not federal) office or to the candidate's campaign committee, an approved
    political action committee, or an organized political party.
  amount: Up to $50.00 per taxpayer ($100.00 total for a joint return — filing status 2 or 4).
  income_limit_2024: None
  claimed_on: Form AR1000TC line 1, carried to AR1000F line 36
  citation:
    source: Arkansas DFA - Instructions for AR1000TC (2024), Line 1
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2024_AR1000TC_Instructions.pdf
filing_requirement:
  note: '2024 minimum gross-income filing thresholds (full-year residents, AR1000F): Single $14,266; Head of Household
    with 1 or no dependents $20,283; Head of Household with 2+ dependents $24,177; Married Filing Joint with 1 or
    no dependents $24,058; Married Filing Joint with 2+ dependents $28,954; Married Filing Separately $9,410; Surviving
    Spouse with 1 or no dependents $20,283; Surviving Spouse with 2+ dependents $24,177. ''Gross income'' is all
    income before deductions other than income specifically exempt, but it DOES include the $6,000 retirement-income
    exemption and U.S. active-duty/military-retirement amounts. If gross income is below your threshold you are
    not required to file, but must file to claim any refund. NONRESIDENTS (AR1000NR): must file if they received
    any gross income from Arkansas sources, regardless of marital/filing status or amount (remote workers must file
    if the employer reports Arkansas taxable income). PART YEAR RESIDENTS (AR1000NR): must file if they received
    any gross income while an Arkansas resident, regardless of amount.'
