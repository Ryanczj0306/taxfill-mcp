# AR state knowledge — tax year 2025. Fetched + cited from the AR DFA (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 AR1000F/AR1000NR
# instructions booklet, then independently re-derived from second official documents — the
# DFA '2025 Indexed Tax Brackets' PDF (whole schedule + phase-down), the 2025 AR1000F form
# itself, the 2025 AR2441 (R 4/28/2025), and the 2025 AR1000TC instructions (R 6/9/2025).
# Resolutions recorded inline where the passes differed.
# HEADLINE FOR 2025: NO NEW RATE CUT. 'Special Information for Tax Year 2025' states the
# rate position verbatim — 'Individual Income Tax Rate Reduction (Act 1 of the Second
# Extraordinary Session of 2024): Marginal Income Tax rates for 2025 are 3.9%, as amended
# in 2024.' The 2024 top rate of 3.9% carries into 2025 UNCHANGED; no 2025-session act moved
# it. What DID change is the annual indexing (Ark. Code Ann. 26-51-201(d)(1)):
#   * 0% floor now runs to $5,599 (2024: $5,499); 2% to $11,199; 3% to $15,999;
#     3.4% to $26,399; 3.9% from $26,400.
#   * The 'minus adjustment' phase-down region moved to $94,701-$97,800 (2024: $92,301-$95,500),
#     ending at 3.9% minus $89.30 for $97,801 and over (2024: minus $87.40).
#   * Standard deduction indexed to $2,470 / $4,940 MFJ (2024: $2,410 / $4,820).
#   * Additional Tax Credit for Qualified Individuals net-income ceiling rose to $27,600
#     (2024: $26,900).
#   * Filing thresholds and the Low Income Tax Tables were re-indexed.
# 2025 FORM CHANGE: withholding is now reported on TWO lines — line 39A (W-2/W-2G) and
# line 39B (1099-R/1099-PT/AR-K1). Lines 27-38 keep their 2024 numbering.
jurisdiction: states/ar
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Arkansas does NOT conform to federal tax treaty exemptions. Two independent .gov-sourced facts establish
  this for 2025: (1) The AR1000F return does NOT start from federal adjusted gross income. It builds Arkansas income
  line-by-line from source documents — Line 8 W-2 wages, Line 10 interest, Line 11 dividends, etc., summed to Line
  23 ''Total Income'' and then to Arkansas AGI on Line 25. Because income is captured from the W-2/source level,
  a federal treaty exclusion taken on the federal return does NOT carry through. (2) The 2025 instructions state
  explicitly (Line 22 income section, p.13-14): ''Foreign students who are exempt from federal taxes because of
  a tax treaty must file and pay tax on all income including non-qualified scholarship or fellowship income'' and
  ''Stipends are taxable.'' That is an affirmative requirement to tax treaty-exempt income, equivalent to a treaty
  add-back. Therefore treaty-exempt income IS re-taxed by Arkansas -> conforms_to_federal_treaties = false. (The
  2025 wording is verbatim identical to the 2024 wording — re-read, not assumed.)'
citation:
  source: 'Arkansas 2025 Individual Income Tax Forms and Instructions (AR1000F and AR1000NR Instructions booklet)
    - Arkansas Dept. of Finance and Administration. Contains: Special Information for Tax Year 2025 (rates remain
    3.9% per Act 1 of the Second Extraordinary Session of 2024; withholding split to lines 39A/39B; Additional Tax
    Credit net income up to $27,600), Definitions (domicile / full year / nonresident / part year resident / military),
    who-must-file thresholds, ''When to File'' April 15, 2026 due date, tax-treaty foreign-student taxation language,
    line-by-line income section (Lines 8-25), Standard Deduction chart ($2,470/$4,940), Personal Tax Credits ($29),
    2025 Low Income Tax Tables (pp.24-25, Rev 12/12/2025 and Rev 09/29/2025) and 2025 Regular Income Tax Table (pp.26-30,
    Rev 09/29/2025), Additional Tax Credit worksheet and table (p.21), How to Fill Out Your Check (p.20), and mailing
    addresses.'
  url: https://www.dfa.arkansas.gov/wp-content/uploads/2025_AR1000F_and_AR1000NR_Instructions.pdf
starts_from: Arkansas does NOT start from federal AGI. The AR1000F/AR1000NR income section is built line-by-line
  from source documents (Line 8 W-2 wages, Line 10 interest, Line 11 dividends, ... Line 23 Total Income), then
  computes Arkansas Adjusted Gross Income on Line 25 (Line 23 minus Line 24 AR1000ADJ adjustments). Effectively
  the starting point is federal wages / individual income items, not federal AGI or federal taxable income.
residency:
  summary: 'Residency is based on domicile — ''the place you intend to have as your permanent home and the place
    you intend to return to whenever you are away. You can have only one domicile. Your domicile does not change
    until you move to a new location which you intend to make your permanent home'' (and a move intended to be for
    a limited time, however long, does not change it, including a move to a foreign country). FULL YEAR RESIDENT:
    you lived in Arkansas all of calendar year 2025, or you maintained a domicile or Home of Record in Arkansas
    during the tax year (file AR1000F). NONRESIDENT: you did not make your domicile in Arkansas (file AR1000NR);
    nonresidents who received ANY gross income from Arkansas sources must file, regardless of amount, and remote
    workers must file if the employer reports Arkansas taxable income (but per Act 1019 of 2021, a nonresident is
    only taxed on income for work physically performed inside Arkansas — for a remote worker performing all duties
    outside Arkansas, no income is taxed). PART YEAR RESIDENT: you established a domicile in Arkansas, or moved out
    of the state, during calendar year 2025 (file AR1000NR); must file if any gross income was received while an
    Arkansas resident. The instructions state no bright-line day-count statutory-resident test (no 183-day rule);
    residency turns on domicile. MILITARY: if Arkansas is your Home of Record you must still file an AR1000F reporting
    all income including U.S. active-duty military compensation, but that compensation is exempt from Arkansas tax
    (beginning tax year 2014); if you are stationed in Arkansas with another state as your Home of Record, Arkansas
    does not tax your U.S. active-duty military compensation.'
forms:
  resident: AR1000F - Full Year Resident Individual Income Tax Return
  part_year_or_nonresident: AR1000NR - Part Year or Non-Resident Individual Income Tax Return
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Personal Tax Credit (personal exemption credit)
  type: nonrefundable
  eligibility: 'Every Arkansas individual filer. One credit each for: yourself, spouse, and each dependent; plus
    extra credit boxes for age 65 or over (as of January 1, 2026), ''65 Special'' (age 65+ not claiming the retirement
    income exemption), blind, deaf, and head of household/surviving spouse. Listed in the Personal Tax Credits section
    of the return.'
  amount: $29 per box checked and $29 per dependent (Line 7A boxes x $29, Line 7B dependents x $29, totaled on Line
    7C) — unchanged for 2025; the 2025 AR1000F form prints the 'X $29 =' multipliers on lines 7A and 7B.
  income_limit_2025: None
  claimed_on: Form AR1000F lines 7A/7B/7C, carried to AR1000F line 34
  citation:
    source: 'Arkansas DFA - 2025 AR1000F Full Year Resident Individual Income Tax Return (form, P1, lines 7A/7B
      ''X $29 ='' and line 7C ''TOTAL PERSONAL TAX CREDITS: (Add lines 7A and 7B. Enter total here and on line 34)'')
      and 2025 AR1000F/AR1000NR Instructions (Line 7A/7B personal tax credits, Line 34)'
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2025_AR1000F_FullYearResidentIndividualIncomeTaxReturn.pdf
- name: Child and Dependent Care Credit
  type: nonrefundable
  eligibility: Resident taxpayers who paid for the care of a qualifying person (a dependent under age 13, or a spouse/dependent
    incapable of self-care) so the taxpayer (and spouse, if married) could work or look for work. Mirrors the federal
    child and dependent care credit (federal Form 2441 mechanics on Form AR2441). Filing status 5 (married filing
    separately on different returns) generally cannot claim it unless the AR2441 checkbox requirements are met.
  amount: 20% of the federally-computed child and dependent care credit. The 2025 AR2441 (R 4/28/2025) computes an
    applicable percentage (0.35 at income of $15,000 or less, sliding to 0.20 for over $43,000, line 8 table) of
    qualified expenses up to $3,000 for one qualifying person or $6,000 for two or more (line 3), then line 10 is
    'Multiply line 9 by .20. Enter this amount on line 35 and/or line 43 of AR1000F/AR1000NR.'
  income_limit_2025: No hard income cap; the federal-style percentage applied to expenses declines with higher income
    (35% at $15,000 or less, down to 20% for over $43,000).
  claimed_on: Form AR2441, result entered on AR1000F/AR1000NR line 35 (and/or line 43 Early Childhood Credit — the
    combined total of lines 35 and 43 cannot exceed the AR2441 amount)
  citation:
    source: Arkansas DFA - 2025 AR2441 Child and Dependent Care Expenses (form, R 4/28/2025, lines 3, 8-10) and
      2025 AR1000F/AR1000NR Instructions (Line 35, Line 43)
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2025_AR2441_Child_andDependentCareExpenses.pdf
- name: Additional Tax Credit for Qualified Individuals (low-income credit)
  type: nonrefundable
  eligibility: An individual taxpayer with net income up to $27,600 (2025, indexed from 2024's $26,900) who timely
    files an Arkansas income tax return (Act 1 of the Second Extraordinary Session of 2021). Doubled for joint Filing
    Status 2, and computed separately per spouse for Filing Status 4.
  amount: 'Up to $60 per individual. Per the 2025 table (booklet p.21): $60 for net taxable income $0-$26,500, then
    declining by $5 per $100 band ($55, $50, ... $5 for $27,501-$27,600), and $0 once net taxable income exceeds
    $27,600.'
  income_limit_2025: Net taxable income (AR1000F line 28) of $27,600 or less for tax year 2025
  claimed_on: Additional Tax Credit for Qualified Individuals Worksheet (booklet p.21), then Form AR1000TC line
    6, carried to AR1000F line 36
  citation:
    source: Arkansas DFA - 2025 Individual Income Tax Forms and Instructions booklet, 'Additional Tax Credit For
      Qualified Individuals Worksheet' and table (p.21 — '$0 - $26,500 / $60' declining $5 per $100 band) and Special
      Information for Tax Year 2025 (net income up to $27,600)
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2025_AR1000F_and_AR1000NR_Instructions.pdf
- name: Credit for Individuals with Developmental Disabilities
  type: nonrefundable
  eligibility: Taxpayers who have a dependent (or self) who qualifies with a developmental disability, as certified
    on Form AR1000-DD (formerly AR1000RC5). Certifications valid on January 1, 2022 and all new certifications from
    that date forward have no expiration date; the AR1000TC must be submitted yearly, and the AR1000-DD attached
    the first year the credit is claimed. The credit follows the child (no matter who the caretaker is) and can only
    be claimed on one tax return per year.
  amount: $500 per qualifying dependent with a developmental disability ('Multiply number of dependents with developmental
    disabilities by $500 and enter the total', 2025 AR1000TC instructions, Line 7, R 6/9/2025)
  income_limit_2025: None
  claimed_on: Form AR1000TC line 7 (names/SSNs on lines 7A-7F; attach Form AR1000-DD the first year), carried to
    AR1000F line 36
  citation:
    source: Arkansas DFA - Instructions for AR1000TC (2025), Line 7 (R 6/9/2025); 2025 booklet Special Information
      for Tax Year 2025 (Act 191 of the General Session of 2023 — no re-certification, AR1000RC5 renamed AR1000-DD)
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2025_AR1000TC_Instructions.pdf
- name: State Political Contributions Credit
  type: nonrefundable
  eligibility: Any Arkansas taxpayer who made cash contributions to a candidate seeking nomination or election to
    a PUBLIC (state/local, not federal) office or to the candidate's campaign committee, an approved political action
    committee, or an organized political party.
  amount: Up to $50.00 per taxpayer ($100.00 for a joint return — filing status 2 or 4).
  income_limit_2025: None
  claimed_on: Form AR1000TC line 1, carried to AR1000F line 36
  citation:
    source: Arkansas DFA - Instructions for AR1000TC (2025), Line 1 — 'A credit of up to $50.00 per taxpayer ($100.00
      for a joint return) is allowed against your Arkansas individual income tax'
    url: https://www.dfa.arkansas.gov/wp-content/uploads/2025_AR1000TC_Instructions.pdf
filing_requirement:
  note: '2025 minimum gross-income filing thresholds (full-year residents, AR1000F), each re-indexed from 2024: Single
    $14,644; Head of Household with 1 or no dependents $20,821; Head of Household with 2 or more dependents $24,819;
    Married Filing Joint with 1 or no dependents $24,696; Married Filing Joint with 2 or more dependents $28,723;
    Married Filing Separately $9,470; Surviving Spouse (spouse died in 2023 or 2024, not remarried in 2025) with
    1 or no dependents $20,821; Surviving Spouse with 2 or more dependents $24,819. ''Gross income'' is all income
    before deductions other than income specifically described as exempt, but it DOES include the $6,000 retirement-income
    exemption and the U.S. active-duty military / military-retirement amounts. If gross income is below your threshold
    you are not required to file, but must file to claim any refund. NONRESIDENTS (AR1000NR): must file if they received
    any gross income from Arkansas sources, regardless of marital/filing status or amount (remote workers must file
    if the employer reports Arkansas taxable income). PART YEAR RESIDENTS (AR1000NR): must file if they received
    any gross income while an Arkansas resident, regardless of amount.'
