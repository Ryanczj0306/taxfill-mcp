  - '2025 FORM RENUMBERING (payments side only): Arkansas withholding is now reported on two lines — 39A for W-2/W-2G
    withholding and 39B for 1099-R/1099-PT/AR-K1 withholding. The tax-computation and credit lines this op cites (27,
    28, 29, 34, 35, 36, 37, 38) keep their 2024 numbers.'
  - 'Round all amounts to the nearest whole dollar on the return (2025 booklet: ''Round all amounts to the nearest
    dollar. For example, if your Form W-2 shows $10,897.50, round to $10,898. If your Form W-2 shows $10,897.49, round
