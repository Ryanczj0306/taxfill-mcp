  standard_deduction:
    single: 2470
    married_filing_jointly: 4940
    married_filing_separately: 2470
    head_of_household: 2470
  notes:
  - 'Base guidance: Supply AR1000F Line 25, ''Adjusted Gross Income (AGI)'' — Arkansas AGI, i.e. Line 23 Total Income
    (built line-by-line from source documents, Lines 8-22: W-2 wages, interest, dividends, etc.; Arkansas does NOT
    start from federal AGI or federal taxable income) minus Line 24 adjustments (Form AR1000ADJ). The op subtracts
    the shipped per-status standard deduction (Line 27) to reach Line 28 Net Taxable Income and applies the brackets
    (the Line 29 tax). If you itemize (Form AR3), the shipped standard deduction is wrong for you — compute Line 27
    on the form instead.'
  - 'Test-vector counts are zero by construction: Arkansas ships NO personal/dependent exemption keys (the $29-per-person
    amounts are CREDITS against tax, AR1000F Lines 7A/7B) — the engine refuses nonzero counts for this state by design.'
  - 'NO 2025 RATE CUT — the 3.9% top rate carries forward from 2024 unchanged. The 2025 booklet''s Special Information
    for Tax Year 2025 states it verbatim: ''Individual Income Tax Rate Reduction (Act 1 of the Second Extraordinary
    Session of 2024) — Marginal Income Tax rates for 2025 are 3.9%, as amended in 2024.'' What moved for 2025 is the
    annual INDEXING (Ark. Code Ann. 26-51-201(d)(1)): the 0% floor now runs to $5,599 (2024: $5,499), 2% to $11,199
    (was $10,899), 3% to $15,999 (was $15,599), 3.4% to $26,399 (was $25,699), and 3.9% starts at $26,400 (was $25,700).
    Both the 2025 Indexed Tax Brackets PDF and the booklet''s 2025 tax tables print the same schedule.'
  - Arkansas has ONE bracket schedule for every filing status — the published 2025 Indexed Tax Brackets and the tax
    tables do not vary by status, so all four statuses ship identical brackets. Filing Status 2 (married filing joint)
    runs the couple's COMBINED Line 28 net taxable income through the same un-widened schedule; Arkansas instead offers
    Filing Status 4 (married filing separately on the SAME return), where each spouse's own Line 28 income goes through
    the schedule in a separate column (tax = Line 29 column A + column B, summed on Line 30) — often less total tax
    than status 2. This op models a single run of one income through the schedule.
  - Surviving Spouse is a SEPARATE Arkansas status (Filing Status 6) with a $2,470 standard deduction — NOT the $4,940
    married-filing-joint amount. The engine maps qualifying surviving spouse to married_filing_jointly, which would
    wrongly apply $4,940; an Arkansas surviving spouse gets $2,470 (compute as single for the deduction).
  - 'Table mandate at ALL income levels: AR1000F Line 29 takes the tax from the 2025 tax tables (booklet pp.24-30),
    which are computed at the MIDPOINT of each income band and rounded to the whole dollar — ''If you use a formula
    to calculate Arkansas income tax, the results must match the table exactly. The calculations in the table are
    made at the midpoint of each income level'' (2025 Indexed Tax Brackets; worked examples: $75,900-$76,000 band
    -> $75,950 x .039 = $2,962.05 - $419.96 = $2,542.09 -> $2,542; $14,800-$14,900 band -> $14,850 x .030 = $445.50
    - $223.97 = $221.53 -> $222). Bracket math may differ from the table by a few dollars within a band; the filed
    form must use the table.'
  - CRITICAL — shipped brackets are exact ONLY for net taxable income up to $94,700 (2024's boundary was $92,300).
    From $94,701 to $97,800 the official 2025 schedule phases the 3.9% bracket's 'minus adjustment' down from $419.96
    to $99.30 (first step to $399.30 at $94,701, then $10 per $100 band), and at $97,801 and over the tax is 3.9%
    x net taxable income - $89.30. The shipped bracket math (equivalent to 3.9% x income - $419.96) UNDERSTATES the
    true tax above $94,700 — by $330.66 once net taxable income reaches $97,801 — so above $94,700 compute from the
    official schedule/table, not from these brackets.
  - 'The Regular Income Tax Table''s printed top rule — ''For $100,001 and over, your tax is $3,809 + 3.9% of the
    excess over $100,000'' (booklet p.30, Rev 09/29/2025) — equals 3.9% x income - $91.00, while the 2025 Indexed
    Tax Brackets constant for $97,801+ is $89.30 (3.9% x $100,000 - $89.30 = $3,810.70): a $1.70 divergence, because
    $3,809 is the midpoint-rounded last table row ($99,901-$100,001: $99,951 x .039 - $89.30 = $3,808.789 -> $3,809).
    The filed form follows the printed table/formula.'
  - 'The published ''minus adjustment'' constants equal the cumulative sum of the prior brackets to within half a
    cent ($111.98 = 2% x $5,599 exactly; $223.97 exactly; $287.97 vs exact $287.966; $419.96 vs exact $419.961) —
    no material rounding divergence, so the shipped marginal brackets reproduce the official formula to within one
    cent below $94,701. The phase-down region was independently checked against the printed table: the $94,901-$95,001
    row prints $3,324 ($94,951 x .039 - $379.30 = $3,323.789) and the $95,401-$95,501 row prints $3,393 ($95,451 x
    .039 - $329.30 = $3,393.289), both matching the phase-down constants exactly.'
  - 'EXEMPTIONS ARE CREDITS IN ARKANSAS — none are shipped: Arkansas has no personal or dependent exemption that reduces
    income. It gives $29-per-person PERSONAL TAX CREDITS instead (AR1000F Line 7A boxes: yourself, spouse, 65 or over
    as of January 1, 2026, ''65 Special'', blind, deaf, head-of-household/surviving-spouse; Line 7B: $29 per dependent;
    totaled on Line 7C and subtracted from TAX on Line 34). These credits are not modeled by this op.'
  - 'Other nonrefundable credits reduce the computed tax on the form but are NOT modeled: the ''Additional Tax Credit
    for Qualified Individuals'' (up to $60 per individual, 2025 net taxable income up to $27,600 — worksheet p.21:
    $60 at $0-$26,500 declining $5 per $100 band to $5 at $27,501-$27,600), the 20%-of-federal-computation Child and
    Dependent Care Credit (2025 AR2441 line 10 ''Multiply line 9 by .20''), the $50/$100 state political contributions
    credit, and the $500-per-dependent Developmental Disabilities credit (AR1000TC line 7).'
  - 'Low Income Tax Table (NOT modeled): full-year residents whose total income from all sources is within the limits
    may take tax from the 2025 Low Income Tax Table applied to Line 25 AGI with NO deduction on Line 27 (''CAUTION:
    If you qualify to use a Low-Income Tax Table, enter zero (0) on line 27, column A. The Standard Deduction is already
    built into the table.''), which yields LESS tax than the shipped math at low incomes — tax is $0 up to $14,643
    (single), $20,820 / $24,818 (HoH or Surviving Spouse with 1-or-no / 2-or-more dependents), $24,695 / $29,722 (MFJ
    with 1-or-no / 2-or-more dependents), and the tables are usable up to AGI of $17,500 (single), $25,300 / $29,000
    (HoH/SS), $29,000 / $36,100 (MFJ). Married couples must file Status 2 to qualify; filers using the military-compensation,
    military-retirement, or employment-related pension exemptions do not qualify; itemizers must use the Regular Income
    Tax Table.'
  - 'Standard-deduction gates not modeled: the deduction is capped at income (''If the amount on line 25 is less than
    the Standard Deduction, enter the amount from line 25 on line 27'' — consistent with the engine''s max(0, ...));
    the $2,470 Standard Deduction ''does not apply to taxpayer''s dependent(s)''; itemizers use Form AR3 on Line 27
    instead; and for Filing Status 4 or 5, if one spouse itemizes both must itemize (status 5 prorates deductions
