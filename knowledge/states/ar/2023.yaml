tax:
  citation:
    source: 'Arkansas DFA, Revenue Division — ''2023 Indexed Tax Brackets'' (Individual Income Tax): full bracket table
      (From / Less Than or Equal To / Percentage / Minus Adjustment: 0% to $5,299; 2% $5,300–$10,599 minus $105.98;
      3% $10,600–$15,099 minus $211.97; 3.4% $15,100–$24,999 minus $272.37; 4.7% $25,000–$89,600 minus $597.35; then
      $10-per-$100 adjustment phase-down $89,601–$94,200; 4.7% minus $153.70 at $94,201+), midpoint-of-band formula
      examples, and Ark. Code Ann. 26-51-201(d)(1) indexing note. Cross-verified against the 2023 AR1000F and AR1000NR
      Instructions booklet (https://www.dfa.arkansas.gov/wp-content/uploads/2023_AR1000F_and_AR1000NR_Instructions.pdf):
      p.5 ''Special Information for Tax Year 2023'' (Act 532 top rate 4.7%), p.12 Personal Tax Credits ($29), p.14 Standard
      Deduction chart and Lines 26–29, pp.25–31 2023 Low Income Tax Tables (Rev 09/21/2023) and Regular Income Tax Table
      (Rev 10/4/2023) with ''For $100,001 and over, your tax is $4,544 + 4.7% of the excess over $100,000.'''
    url: https://www.dfa.arkansas.gov/wp-content/uploads/TaxBrackets_2023.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 5299, rate: 0}
    - {over: 5299, but_not_over: 10599, rate: 0.02}
    - {over: 10599, but_not_over: 15099, rate: 0.03}
    - {over: 15099, but_not_over: 24999, rate: 0.034}
    - {over: 24999, but_not_over: null, rate: 0.047}
