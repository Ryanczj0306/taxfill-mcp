  base: state_taxable_income
  tax_line: 'Form 1, Line 12 ''Tax (see table on page 38)''. Instructions: ''Use the amount on line 11 to find your
    tax in the Tax Table on pages 38-43... EXCEPTION If line 11 is $100,000 or more, use the Tax Computation Worksheet
    on page 44 to compute your tax.'' Line 11 (printed on the 2025 form): ''Subtract line 10c from line 9. If line
    10c is larger than line 9, fill in 0. This is taxable income.'''
  exemptions: {}
  notes:
  - 'TY2025 HEADLINE CHANGE — 2025 WISCONSIN ACT 15 EXPANDED THE 4.4% BRACKET (this is NOT mere indexation): the 2025
    Form 1-ES instructions open with ''Instruction Updates: 2025 Wisconsin Act 15 increased the income threshold for
    the top of the second and bottom of the third tax brackets for each filing status. The 2025 Tax Rate Schedules
    on page 3 have been updated to reflect that change.'' The 4.4% band now runs to $50,480 for single/head of household
    (2024: $28,640), $67,300 for married filing jointly (2024: $38,190), and $33,650 for married filing separately
    (2024: $19,090) — an increase of roughly 76% in each case, far beyond inflation indexation. The first-bracket
    tops moved only by indexation ($14,320 -> $14,680; $19,090 -> $19,580; $9,550 -> $9,790) and the 5.3%/7.65% crossover
    also re-indexed ($315,310 -> $323,290; $420,420 -> $431,060; $210,210 -> $215,530). The four rates 3.5% / 4.4%
    / 5.3% / 7.65% are UNCHANGED.'
  - 'Base guidance: Supply 2025 Wisconsin Form 1, Line 11 (''Subtract line 10c from line 9. If line 10c is larger
    than line 9, fill in 0. This is taxable income''). Line 11 = Wisconsin income (Line 7) minus the sliding-scale
    standard deduction (Line 8, from the 2025 Standard Deduction Table, p.35) minus Line 10c exemptions ($700 x exemptions
    on Line 10a + $250 x age-65 checkboxes on Line 10b). Those deductions/exemptions must be computed on the form
    BEFORE supplying the base — this pack ships no standard deduction and no exemptions, so nothing is re-subtracted
    here.'
  - 'SOURCE ASSEMBLY: the 2025 Form 1 booklet prints no single four-bracket rate schedule. Brackets 1-2 (rates and
    dollar boundaries $14,680/$50,480 single-HoH, $19,580/$67,300 MFJ, $9,790/$33,650 MFS) are from the 2025 Form
    1-ES ''2025 Tax Rate Schedules for Full-Year Residents''; brackets 3-4 (5.3% up to $323,290/$431,060/$215,530,
    then 7.65%) are corroborated by the Form 1 p.44 Tax Computation Worksheet. Cross-check: every worksheet subtraction
    constant equals the cumulative sum of the prior brackets — Single/HoH $586.44 exact and $8,183.76 vs exact $8,183.755;
    MFJ $781.92 and $10,911.83 both exact; MFS $390.96 exact and $5,455.92 vs exact $5,455.915 — and every 1-ES gross-tax
    constant ($513.80/$2,089.00/$16,547.93; $685.30/$2,784.98/$22,064.26; $342.65/$1,392.49/$11,032.13) equals the
    cumulative marginal sum exactly. Max divergence $0.005 (cent rounding), immaterial. Schedule C (MFS) is exactly
    half Schedule B (MFJ) at every bound.'
  - 'TABLE MANDATE below $100,000 — Form 1 Line 12 requires the Tax Table (instructions pp.38-43) when Line 11 is
    under $100,000; the table computes tax at the MIDPOINT of each income band (spot-verified: the $15,900-$16,000
    row prints Single/HoH $570, MFJ $558, MFS $614, which reproduce from midpoint $15,950 as $569.68 / $558.25 / $613.69),
    so bracket math may differ by a few dollars within a table band and the filed form must use the table. At $100,000
    or more the mandated Tax Computation Worksheet IS exact bracket math (identical to this pack, to within the half-cent
    constant rounding above).'
  - 'STANDARD DEDUCTION NOT SHIPPED (income-dependent): Wisconsin''s standard deduction is a sliding amount from the
    2025 Standard Deduction Table (p.35) based on Line 7 income — maximums $13,560 single / $25,110 married filing
    jointly / $11,930 married filing separately / $17,520 head of household, phasing to $0 as income rises (per the
    2025 Form 1-ES schedules: single $13,560 less 12% of income over $19,550, zero above $132,549; MFJ $25,110 less
    19.778% of income over $28,210, zero above $155,169; MFS $11,930 less 19.778% of income over $13,390, zero above
    $73,709; head of household $17,520 less 22.515% of income over $19,550 up to $57,210, then the single formula,
    zero above $132,549). Filers claimable as a dependent use the Standard Deduction Worksheet for Dependents (greater
    of $1,350 or earned income plus $450, capped at the table amount); short-period filers and federal Form 4563 filers
    get $0. Compute it on Form 1 Line 8 — the supplied Line 11 base is already net of it.'
  - 'EXEMPTIONS NOT SHIPPED (already inside the Line 11 base): Wisconsin''s exemptions ARE base reductions — $700
    per exemption on Line 10a (taxpayer, spouse, and each dependent listed on federal Form 1040/1040-SR; 0 exemptions
    for a filer claimable as a dependent on another return) plus $250 on Line 10b for taxpayer and/or spouse 65 or
    older on December 31, 2025 (only if allowed the $700 on Line 10a) — but they are subtracted on the form in arriving
    at Line 11, so this pack ships none; do NOT re-subtract them from the supplied base.'
  - Head of household uses the SAME rate schedule as single (2025 Tax Computation Worksheet Section A 'Single or Head
    of household'; 2025 Form 1-ES Schedule A 'Single, Head of Household, Estates and Trusts'). Estates and trusts
    (fiduciaries) also use this schedule.
  - 'QUALIFYING SURVIVING SPOUSE — the engine''s default mapping is WRONG for Wisconsin: Wisconsin has no QSS status;
    per the 2025 Form 1 instructions, ''If you file your federal return as a qualifying surviving spouse, you may
    file your Wisconsin return as head of household.'' A federal QSS must therefore be passed as head_of_household
    here, NOT married_filing_jointly. (A taxpayer whose spouse died during 2025 may still file 2025 as married filing
    jointly.)'
  - 'FULL-YEAR RESIDENT Form 1 ONLY: nonresidents and part-year residents file Form 1NPR and must PRORATE the tax
    brackets by the ratio of Wisconsin income to federal adjusted gross income — the 2025 Form 1-ES instructions print
    the rule with a worked example (''for a single individual the tax brackets are $14,680, $35,800, and $272,810.
    Assuming the individual has a ratio of 20%, the first $2,936 ($14,680 x .20) is taxed at 3.5%, the next $7,160
    ($35,800 x .20) is taxed at 4.4%, and the next $54,562 ($272,810 x .20) is taxed at 5.3%. Taxable income over
    $64,658 ($323,290 x .20) is taxed at 7.65%.''). Applying these brackets unprorated to a 1NPR filer is wrong. The
    standard deduction and exemptions must be prorated by the same ratio.'
  - 'Credits taken after Line 12 are NOT modeled (they are subtracted from tax, not from income): itemized deduction
    credit (Line 13, Schedule 1), additional child and dependent care credit (Line 14, Schedule WI-2441), blind worker
    transportation services credit (Line 15), school property tax credit (Line 16, max $300 / $150), Working Families
    Tax Credit (Line 17 — the 2025 instructions say ''Do not enter any amount on this line. No credit is allowable
    for any individual or couple filing this form, since any taxpayer(s) who would qualify will not have a tax to
    offset.''), married couple credit (Line 18, Schedule 2, 3% of up to $16,000, max $480), earned income credit (Line
    30, 4% / 11% / 34% of the federal EIC), homestead credit (Line 33, Schedule H), and the other Form 1 credits.'
  - '2025 subtraction changes affect the BASE the caller supplies, not this schedule (2025 Form 1 instructions, ''New
