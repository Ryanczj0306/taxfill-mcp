unverified:
- 'No WI DOR page was found that explicitly mentions U.S. tax-treaty-exempt income or whether such income is added back. Conformity (true) is inferred from the federal-AGI starting point (Form 1 Line 1) plus the absence of any treaty add-back across the 2025 Schedule AD additions list. Confirm at the DOR (e.g. Publication 122, or DORIncome@wisconsin.gov / (608) 266-2486) for treaty-specific situations, particularly for nonresident aliens filing Form 1NPR.'
- 'The 2025 maximum homestead credit dollar amount was not re-derived from the 2025 Schedule H credit tables in this session (the 2023 maximum was $1,460); the 2025 qualification rules and the $24,680 household-income limit are confirmed from the 2025 Form 1 instructions. Confirm the 2025 maximum in the 2025 Schedule H instructions.'
- 'The 2025 Schedule WI-2441 (Additional Child and Dependent Care Credit computation) was not read line by line; only the Form 1 line routing and the Worksheet A submission rule are confirmed — confirm the specific 2025 qualifying-expense and maximum-credit dollar caps on Schedule WI-2441 before computing the credit.'
- 'The 2025 ''New in 2025'' section of the Form 1 instruction booklet does NOT mention the 2025 Wisconsin Act 15 bracket change; that change is documented only in the 2025 Form 1-ES instructions'' Instruction Updates banner and is corroborated arithmetically by the Form 1 p.44 Tax Computation Worksheet constants. The underlying Act 15 statutory text was not read directly.'
tax:
  citation:
    source: '2025 Wisconsin Form 1 Instructions (I-111), Wisconsin Department of Revenue — p.44 ''2025 Tax Computation
      Worksheet – Line 12'' (Section A Single or Head of household: at least $100,000 but less than $323,290 x 5.3%
      (.053) minus $586.44, $323,290 or over x 7.65% (.0765) minus $8,183.76; Section B Married filing jointly: less
      than $431,060 x 5.3% minus $781.92, $431,060 or over x 7.65% minus $10,911.83; Section C Married filing separately:
      less than $215,530 x 5.3% minus $390.96, $215,530 or over x 7.65% minus $5,455.92); Line 12 Tax (Tax Table pp.38-43,
      mandatory below $100,000); p.35 2025 Standard Deduction Table; Line 10 Exemptions ($700 / $250). FIRST TWO BRACKETS
      with dollar boundaries: 2025 Form 1-ES Instructions, ''2025 Tax Rate Schedules for Full-Year Residents'' — Schedule
      A (Single, Head of Household, Estates and Trusts): $0-$14,680 at 3.5%, $513.80 + 4.4% to $50,480, $2,089.00 +
      5.3% to $323,290, $16,547.93 + 7.65% over; Schedule B (MFJ): $0-$19,580, $685.30 + 4.4% to $67,300, $2,784.98
      + 5.3% to $431,060, $22,064.26 + 7.65% over; Schedule C (MFS): $0-$9,790, $342.65 + 4.4% to $33,650, $1,392.49
      + 5.3% to $215,530, $11,032.13 + 7.65% over (https://www.revenue.wi.gov/TaxForms2025/2025-Form1-ES-inst.pdf),
      carrying the Instruction Updates banner ''2025 Wisconsin Act 15 increased the income threshold for the top of
      the second and bottom of the third tax brackets for each filing status. The 2025 Tax Rate Schedules on page 3
      have been updated to reflect that change.'' SECOND PASS: every Form 1 worksheet subtraction constant equals the
      cumulative marginal sum implied by the 1-ES schedules exactly (Section A $586.44 and $8,183.76 vs exact $586.44
      / $8,183.755; Section B $781.92 and $10,911.83 both exact; Section C $390.96 exact and $5,455.92 vs exact $5,455.915),
      and every 1-ES gross-tax constant equals the exact cumulative marginal sum ($513.80 = 3.5% x $14,680; $2,089.00
      = $513.80 + 4.4% x $35,800; $16,547.93 = $2,089.00 + 5.3% x $272,810; likewise for B and C). The 1-ES proration
      example independently prints the bracket WIDTHS $14,680 / $35,800 / $272,810, which cumulate to $14,680 / $50,480
      / $323,290.'
