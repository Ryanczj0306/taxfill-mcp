  base: state_taxable_income
  tax_line: 'Form 1, Line 12 ''Tax (see table on page 38)''. Instructions: ''Use the amount on line 11 to find your
    tax in the Tax Table on pages 38-43... EXCEPTION If line 11 is $100,000 or more, use the Tax Computation Worksheet
    on page 44 to compute your tax.'' Line 11 (printed on the 2024 form): ''Subtract line 10c from line 9. If line
    10c is larger than line 9, fill in 0. This is taxable income.'''
  exemptions: {}
  notes:
  - '2024 INDEXATION, NO RATE CHANGE: the four rates 3.5% / 4.4% / 5.3% / 7.65% carry over from 2023 (Act 19 rates;
    the 2024 What''s New lists no rate change), while the dollar boundaries re-indexed — single/HoH $14,320 / $28,640
    / $315,310 (2023: $13,810 / $27,630 / $304,170); MFJ $19,090 / $38,190 / $420,420 (2023: $18,420 / $36,840 / $405,550);
    MFS $9,550 / $19,090 / $210,210 (2023: $9,210 / $18,420 / $202,780). Unlike 2023 there was no mid-year retroactive
    rate act; the 2024 Form 1-ES schedules and the filing-season Form 1 worksheet agree.'
  - 'Base guidance: Supply 2024 Wisconsin Form 1, Line 11 (''Subtract line 10c from line 9. If line 10c is larger
    than line 9, fill in 0. This is taxable income''). Line 11 = Wisconsin income (Line 7) minus the sliding-scale
    standard deduction (Line 8, from the 2024 Standard Deduction Table, p.35) minus Line 10c exemptions ($700 x exemptions
    on Line 10a + $250 x age-65 checkboxes on Line 10b). Those deductions/exemptions must be computed on the form
    BEFORE supplying the base — this pack ships no standard deduction and no exemptions, so nothing is re-subtracted
    here.'
  - 'SOURCE ASSEMBLY: the 2024 Form 1 booklet prints no single four-bracket rate schedule. Brackets 1-2 (rates and
    dollar boundaries $14,320/$28,640 single-HOH, $19,090/$38,190 MFJ, $9,550/$19,090 MFS) are from the 2024 Form
    1-ES ''2024 Tax Rate Schedules for Full-Year Residents''; brackets 3-4 (5.3% up to $315,310/$420,420/$210,210,
    then 7.65%) are from the Form 1 p.44 Tax Computation Worksheet. Cross-check: every worksheet subtraction constant
    equals the cumulative sum of the prior brackets — Single/HOH $386.64 exact and $7,796.43 vs exact $7,796.425;
    MFJ $515.52 and $10,395.39 both exact; MFS $257.76 exact and $5,197.70 vs exact $5,197.695 — and every 1-ES gross-tax
    constant ($501.20/$1,131.28/$16,324.79; $668.15/$1,508.55/$21,766.74; $334.25/$754.01/$10,883.37) equals the cumulative
    marginal sum exactly. Max divergence $0.005 (cent rounding), immaterial.'
  - TABLE MANDATE below $100,000 — Form 1 Line 12 requires the Tax Table (instructions pp.38-43) when Line 11 is under
    $100,000; the table computes tax at the midpoint of each income band, so bracket math may differ by a few dollars
    within table bands; the filed form must use the table. At $100,000 or more the mandated Tax Computation Worksheet
    IS exact bracket math (identical to this pack).
  - 'STANDARD DEDUCTION NOT SHIPPED (income-dependent): Wisconsin''s standard deduction is a sliding amount from the
    2024 Standard Deduction Table (p.35) based on Line 7 income — maximums $13,230 single / $24,490 married filing
    jointly / $11,630 married filing separately / $17,090 head of household, phasing to $0 as income rises. Filers
    claimable as a dependent use the Standard Deduction Worksheet for Dependents (greater of $1,300 or earned income
    + $450, capped at the table amount); short-period filers and federal Form 4563 filers get $0. Compute it on Form
    1 Line 8 — the supplied Line 11 base is already net of it.'
  - 'EXEMPTIONS NOT SHIPPED (already inside the Line 11 base): Wisconsin''s exemptions ARE base reductions — $700
    per exemption on Line 10a (taxpayer, spouse, and each dependent listed on federal Form 1040; $0 for a filer claimable
    as a dependent on another return) plus $250 on Line 10b for taxpayer and/or spouse 65 or older on December 31,
    2024 (only if allowed the $700 on Line 10a) — but they are subtracted on the form in arriving at Line 11, so this
    pack ships none; do NOT re-subtract them from the supplied base.'
  - Head of household uses the SAME rate schedule as single (Tax Computation Worksheet Section A 'Single or Head of
    household'; 2024 Form 1-ES Schedule A 'Single, Head of Household, Estates and Trusts'). Estates and trusts (fiduciaries)
    also use this schedule.
  - 'QUALIFYING SURVIVING SPOUSE — engine mapping is WRONG for Wisconsin: Wisconsin has no QSS status; per the 2024
    Form 1 instructions, ''If you file your federal return as a qualifying surviving spouse, you may file your Wisconsin
    return as head of household.'' A federal QSS (spouse died 2022 or 2023) must therefore use the head_of_household
    brackets here, NOT married_filing_jointly. (A taxpayer whose spouse died during 2024 may still file 2024 as married
    filing jointly.)'
  - 'FULL-YEAR RESIDENT Form 1 ONLY: nonresidents and part-year residents file Form 1NPR and must PRORATE the tax
    brackets by the ratio of Wisconsin income to federal adjusted gross income (2024 Form 1-ES instructions print
    the proration rule with a worked example) — applying these brackets unprorated to a 1NPR filer is wrong.'
  - 'Credits taken after Line 12 are NOT modeled (they are subtracted from tax, not from income): itemized deduction
    credit (Line 13, Schedule 1), additional child and dependent care credit (Line 14, NEW Schedule WI-2441 for 2024),
    blind worker transportation services credit (Line 15, new for 2024, up to $1,500), renter''s/homeowner''s school
    property tax credit (Line 16, max $300/$150), married couple credit (Line 18, Schedule 2, max $480), earned income
    credit (Line 30, 4%/11%/34% of federal EIC), homestead credit (Line 33), and other Form 1 credits. Note the 2024
    Form 1 renumbered several credit lines vs 2023.'
