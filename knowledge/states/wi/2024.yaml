unverified:
- No WI DOR page was found that explicitly mentions U.S. tax-treaty-exempt income or whether such income is added
  back. Conformity (true) is inferred from the federal-AGI starting point (Form 1 Line 1) plus the absence of any
  treaty add-back across the 2024 Schedule AD additions list. Confirm at the DOR (e.g., Publication 122, or DORIncome@wisconsin.gov
  / (608) 266-2486) for treaty-specific situations, particularly for nonresident aliens filing Form 1NPR.
- The 2024 maximum homestead credit dollar amount was not re-derived from the 2024 Schedule H credit tables in this
  session (the 2023 maximum was $1,460); the 2024 qualification rules and the $24,680 household-income limit are
  confirmed from the 2024 Form 1 instructions. Confirm the 2024 maximum at the 2024 Schedule H instructions.
- The 2024 Schedule WI-2441 (new Additional Child and Dependent Care Credit computation) was not read line-by-line;
  the credit's increased qualifying-expense and maximum amounts are stated in the What's New section — confirm the
  specific 2024 dollar caps on Schedule WI-2441 before computing the credit.
tax:
  citation:
    source: '2024 Wisconsin Form 1 Instructions (I-111), Wisconsin Department of Revenue — p.44 ''2024 Tax Computation
      Worksheet – Line 12'' (Section A Single or Head of household: at least $100,000 but less than $315,310 x 5.3%
      (.053) minus $386.64, $315,310 or over x 7.65% (.0765) minus $7,796.43; Section B Married filing jointly: less
      than $420,420 x 5.3% minus $515.52, $420,420 or over x 7.65% minus $10,395.39; Section C Married filing separately:
      less than $210,210 x 5.3% minus $257.76, $210,210 or over x 7.65% minus $5,197.70); Line 12 Tax (Tax Table pp.38-43);
      p.35 2024 Standard Deduction Table; Line 10 Exemptions ($700 / $250). First- and second-bracket dollar boundaries:
      2024 Form 1-ES Instructions, ''2024 Tax Rate Schedules for Full-Year Residents'' — Schedule A (Single, Head of
      Household, Estates and Trusts): $0-$14,320 at 3.5%, $501.20 + 4.4% to $28,640, $1,131.28 + 5.3% to $315,310, $16,324.79
      + 7.65% over; Schedule B (MFJ): $0-$19,090, $668.15 + 4.4% to $38,190, $1,508.55 + 5.3% to $420,420, $21,766.74
      + 7.65% over; Schedule C (MFS): $0-$9,550, $334.25 + 4.4% to $19,090, $754.01 + 5.3% to $210,210, $10,883.37 +
      7.65% over (https://www.revenue.wi.gov/TaxForms2024/2024-Form1-ES-inst.pdf). Second pass: every Form 1 worksheet
      subtraction constant equals the cumulative marginal sum implied by the 1-ES schedules (max print-rounding divergence
      $0.005) — both documents agree.'
    url: https://www.revenue.wi.gov/TaxForms2024/2024-Form1-Inst.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 14320, rate: 0.035}
    - {over: 14320, but_not_over: 28640, rate: 0.044}
    - {over: 28640, but_not_over: 315310, rate: 0.053}
    - {over: 315310, but_not_over: null, rate: 0.0765}
