  source: 2024 Form 1 Instructions (I-111), Wisconsin Department of Revenue - Line 1 federal adjusted gross income;
    Which Form to File / domicile; Who Must File thresholds; Where to File mailing addresses; due date April 15,
    2025; 2024 Standard Deduction Table p.35; 2024 Tax Table pp.38-43; 2024 Tax Computation Worksheet p.44
  url: https://www.revenue.wi.gov/TaxForms2024/2024-Form1-Inst.pdf
starts_from: federal AGI (federal adjusted gross income from line 11 of federal Form 1040/1040-SR)
residency:
  summary: 'Full-year residents file Form 1; nonresidents and part-year residents file Form 1NPR. You must file
    Form 1NPR if you were domiciled in another state or country at any time during the year, or are filing a joint
    return and your spouse was domiciled elsewhere at any time during the year. Domicile is your true, fixed, and
    permanent home to which, whenever absent, you intend to return; you can be physically present/residing in one
    locality but maintain domicile in another. An established domicile does not change unless all three occur: (1)
    you intend to abandon your old domicile and act consistently, (2) you intend to acquire a new domicile and act
    consistently, and (3) you are physically present in the new domicile. Tax treatment: full-year residents are
    taxed on income from all sources; nonresidents only on Wisconsin-source income; part-year residents on all income
    while a Wisconsin resident and only on Wisconsin-source income while a nonresident. Service members may elect
    Wisconsin residence under 50 U.S.C. 4001 (see Publication 128).'
forms:
  resident: Form 1 (Wisconsin Income Tax) - full-year residents
  part_year_or_nonresident: Form 1NPR (Nonresident and Part-Year Resident Wisconsin Income Tax Return)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Wisconsin Earned Income Credit (EITC)
  type: refundable
  eligibility: Full-year Wisconsin resident who qualifies for the federal earned income credit AND has at least
    one qualifying child (federal definition of qualifying child applies). A married-filing-separate filer is ineligible
    unless they meet sec. 7703(b) IRC (then files as head of household, married). "Federal earned income credit"
    means the credit computed using the IRC as adopted by Wisconsin — filers with Schedule I adjustments recompute
    it on Schedule I Part III. A copy of federal Schedule EIC must be included (and Form 8867 if a paid preparer
    was used).
  amount: 'A percentage of the federal earned income credit (from federal Form 1040/1040-SR line 27, or Schedule
    I Part III if recomputed), based on qualifying children: 1 child = 4%; 2 children = 11%; 3 or more children
    = 34% (2024 Form 1 instructions, Line 30 Step 3).'
  income_limit_2024: No separate Wisconsin income limit stated; eligibility follows the federal EITC income/eligibility
    limits (after Schedule I adjustments).
  claimed_on: Form 1, line 30 (2023 line 29 — the 2024 Form 1 renumbered the credit lines)
  citation:
    source: 2024 I-111 Form 1 Instructions (Wisconsin Department of Revenue), Line 30 Earned Income Credit
    url: https://www.revenue.wi.gov/TaxForms2024/2024-Form1-Inst.pdf
- name: Wisconsin Homestead Credit (property-tax / rent circuit-breaker)
  type: refundable
  eligibility: 'Per the 2024 Form 1 instructions Special Instructions: at least 18 years old on December 31, 2024;
    if under age 62 and not disabled, must have earned income; a legal resident of Wisconsin for all of 2024; not
    claimed as a dependent on anyone''s 2024 federal return (unless 62 or older); not living in tax-exempt public
    housing for all of 2024 (exceptions apply); not living in a nursing home receiving Title XIX medical assistance;
    and not claiming (self or spouse) the veterans and surviving spouses property tax credit or farmland preservation
    credit. Claimed on Schedule H (or simpler Schedule H-EZ).'
  amount: Credit is computed from the Schedule H tables based on household income and property taxes (and/or rent
    constituting property taxes) up to the allowable amounts.
  income_limit_2024: Total household income (including wages, interest, social security, and income from certain
    other sources) must be below $24,680 in 2024.
  claimed_on: Schedule H or Schedule H-EZ; carried to Form 1, line 33
  citation:
    source: 2024 I-111 Form 1 Instructions (Wisconsin Department of Revenue), Special Instructions 'Homestead Credit'
      and Line 33
    url: https://www.revenue.wi.gov/TaxForms2024/2024-Form1-Inst.pdf
- name: Renter's and Homeowner's School Property Tax Credit
  type: nonrefundable
  eligibility: Wisconsin filers who paid rent during 2024 for living quarters used as their primary residence, OR
    who paid property taxes during 2024 on their home. Available whether or not the homestead credit is claimed.
    Cannot be claimed if you or your spouse claim the veterans and surviving spouses property tax credit. Rent for
    property-tax-exempt housing (e.g., university dorms, nonprofit senior housing, certain public housing) does
    not qualify.
  amount: Credit figured from the Renter's School Property Tax Credit Table (renter's portion of rent, with different
    columns for heat included vs not included) and the Homeowner's School Property Tax Credit Table (based on property
    taxes paid). Total combined credit on lines 16a and 16b may not exceed $300 ($150 if married filing separately
    or married filing as head of household).
  income_limit_2024: No income limit.
  claimed_on: Form 1, line 16 (16a renter's portion, 16b homeowner's portion; 2023 line 15 — renumbered for 2024)
  citation:
    source: 2024 I-111 Form 1 Instructions (Wisconsin Department of Revenue), Line 16 Renter's and Homeowner's School
      Property Tax Credit and credit tables
    url: https://www.revenue.wi.gov/TaxForms2024/2024-Form1-Inst.pdf
- name: Additional Child and Dependent Care Tax Credit
  type: nonrefundable
  eligibility: You must have claimed the federal child and dependent care tax credit on your federal return, and
    you must have been a legal resident of Wisconsin for the entire year (on a joint return, qualifies if at least
    one spouse is a full-year Wisconsin resident).
  amount: 'INCREASED for 2024 (What''s New: "The amount of qualifying expenses and maximum credit allowable have
    been increased"): computed on the NEW Schedule WI-2441 (amount from its line 14 carried to Form 1 line 14) —
    no longer a flat 50% of the federal Form 2441 credit as in 2023.'
  income_limit_2024: No separate Wisconsin income limit stated; follows the federal child and dependent care credit
    framework, which phases with income at the federal level.
  claimed_on: Form 1, line 14, computed on Schedule WI-2441 (new for 2024)
  citation:
    source: 2024 I-111 Form 1 Instructions (Wisconsin Department of Revenue), 'New in 2024' and Line 14 Additional
      Child and Dependent Care Tax Credit / Schedule WI-2441
    url: https://www.revenue.wi.gov/TaxForms2024/2024-Form1-Inst.pdf
- name: Married Couple Credit
  type: nonrefundable
  eligibility: Married filing a joint return where both spouses have qualified earned income (taxable wages, salaries,
    tips, W-2-reported scholarships/fellowships, other employee compensation, and net self-employment earnings;
    deferred compensation and pensions excluded). Not available if federal Form 2555/2555-EZ (foreign earned income
    exclusion) or Form 4563 is filed. Computed on Schedule 2 of Form 1.
  amount: 3% of the lower-earning spouse's qualified earned income, with that income capped at $16,000 — maximum
    credit $480 (2024 Form 1, Schedule 2, lines 6-8, printed on the form; verified at source for 2024, unlike the
    2023 pack which carried the cap unconfirmed).
  income_limit_2024: No income limit; the earned-income base for the computation is capped at $16,000 per Schedule
    2 line 6.
  claimed_on: Form 1, line 18 (computed on Schedule 2, page 4 of Form 1; 2023 line 17 — renumbered for 2024)
  citation:
    source: 2024 Wisconsin Form 1 (Schedule 2 - Married Couple Credit When Both Spouses Are Employed, lines 6-8)
      and 2024 I-111 Form 1 Instructions, Line 18
    url: https://www.revenue.wi.gov/TaxForms2024/2024-Form1f.pdf
filing_requirement:
  note: 'A full-year resident must file Form 1 for 2024 if gross income (or combined gross income of a married couple)
    met the threshold for the filing status/age: Single $13,930 (under 65) / $14,180 (65+); Married filing joint
    $25,890 (both under 65) / $26,140 (one 65+) / $26,390 (both 65+); Married filing separate $12,330 (under 65)
    / $12,580 (65+) per spouse; Head of household $17,790 (under 65) / $18,040 (65+). Gross income means all income
    (before deducting expenses) reportable to Wisconsin and does not include items exempt from Wisconsin tax (e.g.,
    Social Security benefits or U.S. government interest). A dependent must file if gross income exceeded $1,300
    including at least $451 of unearned income, or exceeded the per-status standard-deduction maximum ($13,230 single
    / $17,090 HoH / $24,490 MFJ / $11,630 MFS). Nonresidents/part-year residents must file Form 1NPR if Wisconsin
    gross income (or combined with spouse) was $2,000 or more.'
