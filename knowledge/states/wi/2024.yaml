# WI state knowledge — tax year 2024. Fetched + cited from the WI DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form 1
# instructions (I-111), then independently re-derived from a second official document
# (the 2024 Form 1 itself, the 2024 Form 1-ES instructions' rate schedules, or the 2024
# Schedule AD instructions) — resolutions recorded inline where the passes differed.
# 2024: NO rate change (3.5%/4.4%/5.3%/7.65% carried over from 2023 Act 19); bracket
# dollar boundaries re-indexed for inflation. The 2024 What's New items are credit and
# subtraction changes (Additional Child and Dependent Care Credit increased via new
# Schedule WI-2441; college-savings subtraction $5,000; tuition subtraction $7,333;
# new Blind Worker Transportation Services Credit up to $1,500).
jurisdiction: states/wi
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Wisconsin Form 1 starts from federal adjusted gross income (2024 Form 1, Line 1; the instructions:
  fill in federal AGI from line 11 of federal Form 1040 or 1040-SR). Federally treaty-exempt income is already excluded
  from federal AGI and is never added back on the Wisconsin return. The 2024 Schedule AD (Additions to Income) instructions
  enumerate all addition modifications (Line 1 state and municipal interest; 2 capital gain/loss addition; 3-4 nonqualified
  Edvest/Tomorrow''s Scholar and ABLE distributions; 5 federal NOL deduction; 6 lump-sum distributions (federal Form
  4972); 7 PFIC excess distributions; 8 related-entity expenses; 9 expenses for moving a business outside Wisconsin/the
  U.S.; 10 federal/Wisconsin basis differences; 12 marital-property reporting differences; 13-27 farmland preservation
  and other computed-credit addbacks; 28-31 tax-option (S) corporation and partnership entity-level adjustments;
  32 other) and NONE adds back income exempt under a U.S. tax treaty. Form 1 Line 2 (additions via Schedule I) only
  converts for federal-law provisions Wisconsin has not adopted, not treaties. Therefore treaty-exempt income flows
  through and is NOT re-taxed -> conforms = true. (No explicit treaty provision text found at the DOR, so flagged
  in unverified.)'
