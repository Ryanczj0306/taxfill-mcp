unverified:
- The treaty-conformity conclusion relies on the parsed contents of the 2024 IT-201-I additions section and the 2024
  IT-225-I addition-modification chart (codes A-101 through A-222, zero occurrences of 'treaty'); no NY .gov page
  affirmatively states 'treaty income is not added back.' The conclusion is inferred from the absence of any treaty
  addback modification, not from an explicit statement. Confirm at the DOR for cases involving treaty-exempt income.
- The IT-203 (nonresident/part-year) instructions were not separately fetched this session; the April 15, 2025 due
  date and the mailing addresses were confirmed from the 2024 IT-201-I, which states they apply to the resident return.
  Confirm IT-203-specific logistics at the DOR if filing IT-203.
- The 184-day statutory-resident summary is carried from the DOR's undated income-tax-definitions page (year-independent
  URL); it was not re-fetched this session. The 11-month 'substantially all of the taxable year' convention is the
  historical guidance figure — confirm at the definitions page for edge cases.
