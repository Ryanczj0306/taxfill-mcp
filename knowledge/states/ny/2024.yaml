# NY state knowledge — tax year 2024. Fetched + cited from the NY DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure was drafted from the 2024 IT-201-I HTML
# instructions (tax.ny.gov publishes the instructions as HTML), then independently
# re-derived from the separately published printer-friendly 2024 IT-201-I PDF and the
# 2024 form PDFs (IT-201, IT-215, IT-214) — resolutions recorded inline where the
# passes differed. Improvements over the 2023 pack: the check-payee wording, the
# IT-216 credit percentages, and the mailing addresses are now confirmed at source
# (all three were 2023 `unverified` carryovers).
jurisdiction: states/ny
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'NY Form IT-201 begins from the federal return''s income items (line 1 = "wages, salaries, tips, etc."
  from federal Form 1040 line 1z) and arrives at federal adjusted gross income on line 19. Because the return starts
  from federal AGI, income that is exempt from federal tax under a U.S. income tax treaty is already excluded from
  federal AGI and flows through to NY. NY''s additions to federal AGI (IT-201 lines 20-23, with "other additions"
  detailed on Form IT-225) do not include any modification that adds back treaty-exempt income. The 2024 IT-225-I
  addition-modification chart (codes A-101 through A-222) contains no code referencing a federal tax treaty,
  treaty-exempt wages/income, or nonresident-alien treaty exclusions (the word "treaty" does not appear in the 2024
  IT-225-I at all). Net effect: starts from federal AGI and has no treaty addback, so treaty-exempt income is NOT
  re-taxed -> conforms = true. (Unlike CA, which adds treaty-exempt income back on Schedule CA, NY has no analogous
  addback.)'
citation:
  source: Instructions for Form IT-201, Full-Year Resident Income Tax Return (2024) - starting point (line 1 = federal
    1040 line 1z; line 19 federal AGI), additions lines 20-23, due date April 15 2025, filing threshold ($4,000 /
    $3,100 dependent-single)
  url: https://www.tax.ny.gov/forms/html-instructions/2024/it/it201i-2024.htm
starts_from: federal AGI (Form IT-201 builds federal income items on lines 1-16/17/18 and computes federal adjusted
  gross income on line 19, which is the starting point for NY modifications)
residency:
  summary: 'You are a NY State resident if (a) your domicile is New York State, OR (b) you are a "statutory resident"
    - you maintain a permanent place of abode in NY for substantially all of the taxable year (a period exceeding
    11 months) AND spend 184 days or more in NY during the year (any part of a day counts as a day). Domicile is
    your permanent home that you intend to return to; you can have only one domicile, while you may have multiple
    residences. A nonresident is someone who was not a NY resident for any part of the year. A part-year resident
    meets the resident definition for only part of the year and the nonresident definition for the rest; they pay
    NY tax on all income received while a resident plus NY-source income received while a nonresident. (Note: the
    NY .gov definitions page states the statutory-resident day threshold as 184 days, not 183.)'
forms:
  resident: Form IT-201, Resident Income Tax Return
  part_year_or_nonresident: Form IT-203, Nonresident and Part-Year Resident Income Tax Return
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it. (Unlike the 2023 pack, the IT-216 child
  and dependent care credit percentages are now source-verified from the 2024 IT-216-I limitation table.)
credits:
- name: New York State Earned Income Credit (EITC)
  type: refundable
  eligibility: You must have claimed (or been able to claim based on your federal AGI) the federal earned income
    credit for 2024, and not claim the Noncustodial parent earned income credit (Form IT-209) for the same year.
    Valid SSNs required for you and each qualifying child by the return due date (including extensions). Full-year
    residents get a fully refundable credit; nonresidents nonrefundable; part-year residents partially refundable.
  amount: 30% of the allowable federal earned income credit, reduced by the amount of any household credit claimed
    (the 2024 Form IT-215 prints the rate on line 11, "New York State earned income credit (NYS EIC) rate 30% (.30)",
    and line 12 is "your New York State EIC before subtracting the amount of household credit allowed").
  income_limit_2024: Same income/earnings eligibility as the 2024 federal EIC; phases out by family size and earnings
    (the federal 2024 dollar thresholds apply; NY sets no separate dollar limit)
  claimed_on: Form IT-215 (Claim for Earned Income Credit), line 16; amount carried to Form IT-201, line 65
  citation:
    source: 2024 Form IT-215, Claim for Earned Income Credit (lines 11-12, 16) and 2024 Form IT-215-I instructions;
      2024 IT-201-I Line 65
    url: https://www.tax.ny.gov/pdf/2024/inc/it215_2024_fill_in.pdf
- name: Empire State Child Credit
  type: refundable
  eligibility: Full-year New York State resident (or married to a full-year resident, with spousal-split rules if
    separate NY returns are required) with at least one qualifying child — a child under 17 on December 31, 2024,
    who lived with you more than half the year, did not provide over half of their own support, is claimed as a
    dependent on your federal return, and is a U.S. citizen/national/resident noncitizen. Valid SSN or ITIN required
    for you and each child listed on Form IT-213.
  amount: The greater of (a) 33% of the portion of the federal child tax credit and additional child tax credit
    attributable to qualifying children (calculated using the federal credit amounts, income thresholds, and rules
    in effect for tax year 2017, before Public Law 115-97), or (b) $100 times the number of qualifying children.
  income_limit_2024: 'The 33% computation phases out (5% of the excess, per Worksheet A) above the 2017-rule thresholds:
    $110,000 (married filing jointly); $75,000 (single, head of household, or qualifying surviving spouse); $55,000
    (married filing separately)'
  claimed_on: Form IT-213 (Claim for Empire State Child Credit); amount carried to Form IT-201, line 63
  citation:
    source: NY Dept. of Taxation and Finance - 2024 Instructions for Form IT-213 (33% / $100-per-child amounts,
      under-17 qualifying child, Worksheet A thresholds); 2024 IT-201-I Line 63
    url: https://www.tax.ny.gov/forms/html-instructions/2024/it/it213i-2024.htm
- name: Real Property Tax Credit (circuit-breaker, homeowners and renters)
  type: refundable
  eligibility: 'New York State resident for all of 2024 who occupied the same NY residence for at least six months,
    was not claimed as a dependent on another taxpayer''s federal return, and whose residence was not completely
    exempted from real property taxes. Homeowners: did not own real property with a current market value over $85,000
    and paid real property taxes. Renters: average monthly rent (line 21) of $450 or less (excluding charges for
    heat, gas, electricity, furnishings, or board — the 2024 IT-214 subtracts 25% of rent when those are included).'
  amount: Maximum credit (2024 IT-214 credit limit chart) is $75 if all household members are under age 65; $375
    if you, your spouse, or a dependent is age 65 or older (the chart phases both maxima down as household gross
    income rises toward $18,000; the computed credit is 50% of the excess of real property taxes/rent-equivalent
    over a percentage of income, 25% for homeowners electing the 65+ exemption on line 26).
  income_limit_2024: Household gross income (IT-214 line 16) of $18,000 or less for 2024
  claimed_on: Form IT-214 (Claim for Real Property Tax Credit), line 33; amount carried to Form IT-201, line 67
    (or Form IT-214 filed by itself for a refund if not required to file)
  citation:
    source: 2024 Form IT-214 (lines 3, 16, 21-22, 26-33) and 2024 Form IT-214-I (credit limit chart, $375/$75 maxima)
    url: https://www.tax.ny.gov/pdf/2024/inc/it214_2024_fill_in.pdf
- name: Child and Dependent Care Credit (New York State)
  type: refundable
  eligibility: You are entitled to this credit if you qualified to claim the federal child and dependent care credit
    for 2024 (whether or not you actually claimed it). Full-year residents get a fully refundable credit; nonresidents
    nonrefundable; part-year residents partially refundable.
  income_limit_2024: 'No flat income cap; the credit is the federal credit times a decimal from the 2024 IT-216-I
    New York State child and dependent care credit limitation table, based on New York adjusted gross income: 1.100
    (110% of the federal credit) at NYAGI of $25,000 or less, sliding by $200 band to 0.600 for NYAGI over $65,000
    up to $150,000, and 0.200 for NYAGI over $150,000 (no upper limit).'
  claimed_on: Form IT-216 (Claim for Child and Dependent Care Credit), line 14; amount carried to Form IT-201, line
    64
  citation:
    source: NY Dept. of Taxation and Finance - 2024 Form IT-216-I, Instructions for Form IT-216 (New York State
      child and dependent care credit limitation table, p. 7)
    url: https://www.tax.ny.gov/pdf/2024/inc/it216i_2024.pdf
- name: New York State Household Credit
  type: nonrefundable
  eligibility: New York State resident (full-year or part-year) who cannot be claimed as a dependent on another
    taxpayer's federal income tax return (Form IT-201 item C marked No). Amount depends on filing status, federal
    AGI, and (for tables 2 and 3) the number of dependents from item H plus one for you (and one for your spouse
    on a joint return), looked up in the household credit tables in the Form IT-201 instructions.
  amount: 'Determined from the 2024 IT-201-I household credit tables: table 1 (single) pays $75 (federal AGI up
    to $5,000) phasing down ($60, $50, $45, $40, $20) to $0 once federal AGI exceeds $28,000; table 2 (filing statuses
    2, 4, 5) pays $90-$180+ by household size at federal AGI up to $5,000, phasing to $20-$50 in the $28,000-$32,000
    band; table 3 covers married filing separately (half-amounts of table 2 bands, combined-FAGI test).'
  income_limit_2024: Federal AGI of $28,000 or less (single, table 1); $32,000 or less (married filing jointly,
    qualifying surviving spouse, or head of household, table 2; married filing separately, table 3, using both spouses'
    combined federal AGI)
  claimed_on: Claimed directly on Form IT-201, line 40 (or Form IT-203, line 39, for nonresidents/part-year residents)
  citation:
    source: Instructions for Form IT-201 (2024), Line 40 — New York State household credit tables 1, 2, and 3
    url: https://www.tax.ny.gov/forms/html-instructions/2024/it/it201i-2024.htm
filing_requirement:
  note: Full-year residents file IT-201 if they must file a federal return, or if they did not have to file federally
    but federal AGI plus New York additions was more than $4,000 ($3,100 if single and claimable as a dependent
    on another taxpayer's federal return), or to claim a refund of NY/NYC/Yonkers withholding, estimated payments,
    or any refundable or carryover credits (2024 IT-201-I, "New York State full-year residents Who must file?").
    Part-year residents and nonresidents with NY-source income file IT-203. If one spouse is a full-year resident
    and the other is not, separate NY returns are required (resident files IT-201) unless both elect to file a joint
    IT-201 taxed as full-year residents.
