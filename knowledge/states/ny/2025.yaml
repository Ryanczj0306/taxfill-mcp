unverified:
- The treaty-conformity conclusion relies on the parsed contents of the 2025 IT-201-I additions section and the
  2025 IT-225-I addition-modification chart (zero occurrences of 'treaty' across 60 A-1xx and 59 A-2xx codes); no
  NY .gov page affirmatively states 'treaty income is not added back.' The conclusion is inferred from the absence
  of any treaty addback modification, not from an explicit statement. Confirm at the DOR for cases involving treaty-exempt
  income.
- The IT-203 (nonresident/part-year) instructions were not separately fetched this session; the April 15, 2026 due
  date and the mailing addresses were confirmed from the 2025 IT-201-I, which states they apply to the resident
  return. Confirm IT-203-specific logistics at the DOR if filing IT-203.
- The 184-day statutory-resident summary is carried from the DOR's undated income-tax-definitions page (year-independent
  URL); it was not re-fetched this session. The 11-month 'substantially all of the taxable year' convention is the
  historical guidance figure - confirm at the definitions page for edge cases.
- The 2025 IT-201-I "What's new for 2025" section is a POINTER only ("For a detailed list of what's new, including
  a summary of tax law changes, see New for 2025") - it prints no figures. The separate 2025 legislative-changes
  summary page was not fetched; the one substantive 2025 change found (the Empire State child credit decoupling)
  came from the 2025 IT-213-I. Check the New for 2025 page for any 2025 change this pack does not model.
- The 2025 New York State Tax Table (mandated when NYAGI is $107,650 or less and taxable income is under $65,000)
  is published separately from the IT-201-I and was NOT fetched; booklet-table amounts within a band can differ
  from rate-schedule math by a few dollars. See the tax.notes table mandate.
