deadlines:
  filing_due_date: '2026-04-15'
  automatic_extension: Form IT-370 gives an automatic six-month extension of time to file (to October 15, 2026),
    but must be filed along with payment for any tax due on or before April 15, 2026. June 15, 2026 due date if
    you qualify to file your federal income tax return on June 15, 2026 (a U.S. citizen or resident noncitizen living
    outside the U.S. and Puerto Rico whose main place of business or post of duty is outside the U.S. and Puerto
    Rico, or in military service outside the U.S. and Puerto Rico when the return is due). 2026 estimated tax is
    due April 15, June 15, September 15, 2026 and January 15, 2027 (generally required if you expect to owe at least
    $300 of NYS, NYC, or Yonkers income tax after withholding and credits, or any MCTMT).
  citation:
    source: Instructions for Form IT-201 (2025), "When to file/Important dates" (p. 41) - April 15, 2026 filing/payment
      date; IT-370 six-month extension to October 15, 2026; June 15, 2026 special federal-qualifier date; the four
      2026 estimated-tax dates and the $300 threshold
    url: https://www.tax.ny.gov/pdf/2025/inc/it201i_2025.pdf
