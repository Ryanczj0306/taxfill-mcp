# NY state knowledge — tax year 2025. Fetched + cited from the NY DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure was drafted from the printer-friendly 2025
# IT-201-I PDF (41 pages, InDesign build dated 2025-11-20 — p. 11 standard deduction table
# and dependent exemption, p. 12 line 39 plus household credit tables 1-3, p. 32 the
# 'How to calculate your 2025 New York State tax' method table, p. 33 the three rate
# schedules, pp. 34-39 tax computation worksheets 1-16, p. 41 When/Where to file), then
# independently re-derived from the separately published 2025 IT-201-I HTML edition and the
# 2025 Form IT-201 fill-in PDF (page 2 lines 33-37, page 3 lines 38-39) — resolutions
# recorded in the tax.notes adjudication note.
# 2025 CHANGE vs the 2024 pack: the Empire State child credit (line 63) was DECOUPLED from
# the federal child tax credit — no longer 33% of the federal credit / $100 per child, but
# $1,000 per qualifying child under four and $330 per qualifying child age four through 16,
# reduced by $16.50 per $1,000 of federal AGI above $110,000/$75,000/$55,000 (2025 IT-213-I
# 'New for 2025'). The rate schedules, standard deduction table, $1,000 dependent exemption,
# household credit tables, NYS EIC rate (30%), IT-214 limits, and the IT-216 limitation
# table are VERIFIED UNCHANGED from 2024 — New York again did not index. Every
# recapture-worksheet Recapture Base / Incremental Benefit constant was re-derived from the
# 2025 booklet rather than carried forward.
jurisdiction: states/ny
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'NY Form IT-201 begins from the federal return''s income items (line 1 = "wages, salaries, tips, etc."
  from federal Form 1040 line 1z) and arrives at federal adjusted gross income on line 19. Because the return starts
  from federal AGI, income that is exempt from federal tax under a U.S. income tax treaty is already excluded from
  federal AGI and flows through to NY. NY''s additions to federal AGI (IT-201 lines 20-23, with "other additions"
  detailed on Form IT-225) do not include any modification that adds back treaty-exempt income. The 2025 IT-225-I
  addition-modification chart (60 A-1xx plus 59 A-2xx codes) contains no code referencing a federal tax treaty,
  treaty-exempt wages/income, or nonresident-alien treaty exclusions (the word "treaty" appears ZERO times in the
  2025 IT-225-I, re-counted this session). Net effect: starts from federal AGI and has no treaty addback, so treaty-exempt
  income is NOT re-taxed -> conforms = true. (Unlike CA, which adds treaty-exempt income back on Schedule CA, NY
  has no analogous addback.)'
citation:
  source: Instructions for Form IT-201, Full-Year Resident Income Tax Return (2025), printer-friendly PDF (IT-201-I,
    41 pages) - starting point (line 1 = federal 1040 line 1z; line 19 federal AGI), additions lines 20-23, Who
    must file ($4,000 / $3,100 dependent-single), line 34 standard deduction table, line 36 dependent exemption
    ($1,000), line 39 tax computation, p. 33 rate schedules, pp. 34-39 tax computation worksheets, due date April
    15 2026
  url: https://www.tax.ny.gov/pdf/2025/inc/it201i_2025.pdf
starts_from: federal AGI (Form IT-201 builds federal income items on lines 1-16/17/18 and computes federal adjusted
  gross income on line 19, which is the starting point for NY modifications)
residency:
  summary: 'You are a NY State resident if (a) your domicile is New York State, OR (b) you are a "statutory resident"
    - you maintain a permanent place of abode in NY for substantially all of the taxable year (a period exceeding
    11 months) AND spend 184 days or more in NY during the year (any part of a day counts as a day). Domicile is
    your permanent home that you intend to return to; you can have only one domicile, while you may have multiple
    residences. A nonresident is someone who was not a NY resident for any part of the year. A part-year resident
    meets the resident definition for only part of the year and the nonresident definition for the rest; they pay
    NY tax on all income received while a resident plus NY-source income received while a nonresident. (Note: the
    NY .gov definitions page states the statutory-resident day threshold as 184 days, not 183.)'
forms:
  resident: Form IT-201, Resident Income Tax Return
  part_year_or_nonresident: Form IT-203, Nonresident and Part-Year Resident Income Tax Return
credits_verification: State credits were researched from the cited DOR sources and are not tax advice - confirm
  each amount and your eligibility at the cited source before claiming it. Every 2025 amount below was read from
  the 2025 edition of the credit form or its instructions (IT-215, IT-213-I, IT-214, IT-216-I) or from the 2025
  IT-201-I itself - none is carried over from the 2024 pack.
credits:
- name: New York State Earned Income Credit (EITC)
  type: refundable
  eligibility: You must have claimed (or been able to claim based on your federal AGI) the federal earned income
    credit for 2025, and not claim the Noncustodial parent earned income credit (Form IT-209) for the same year.
    Valid SSNs required for you and each qualifying child by the return due date (including extensions). Full-year
    residents get a fully refundable credit; nonresidents nonrefundable; part-year residents partially refundable.
  amount: 30% of the allowable federal earned income credit, reduced by the amount of any household credit claimed
    (the 2025 Form IT-215 prints the rate on line 11, "New York State earned income credit (NYS EIC) rate 30% (.30)",
    with the preprinted value .30, and line 18 carries the credit to Form IT-201, line 65).
  income_limit_2025: Same income/earnings eligibility as the 2025 federal EIC; phases out by family size and earnings
    (the federal 2025 dollar thresholds apply; NY sets no separate dollar limit)
  claimed_on: Form IT-215 (Claim for Earned Income Credit), line 18; amount carried to Form IT-201, line 65
  citation:
    source: 2025 Form IT-215, Claim for Earned Income Credit (line 11 "NYS EIC rate 30% (.30)", line 18); 2025 IT-201-I
      Line 65 (including the "write EIC in the box" IRS-computed-credit path and the 21-days / April 15, 2026 bill
      wording)
    url: https://www.tax.ny.gov/pdf/2025/inc/it215_2025_fill_in.pdf
- name: Empire State Child Credit
  type: refundable
  eligibility: Full-year New York State resident with at least one qualifying child - your child, sibling, stepsibling
    or a descendant of any of them (including a stepchild, eligible foster child, adopted child, or a child placed
    with you for adoption) who is under 17 years old on December 31, 2025, lived with you more than half the year,
    did not provide over half of their own support, has not filed a joint return (except to claim a refund of withholding
    or estimated tax), and is a U.S. citizen/national or holds an ITIN issued by the IRS.
  amount: NEW FOR 2025 - New York DECOUPLED from the federal child tax credit. The credit equals $1,000 per qualifying
    child under four years old plus $330 per qualifying child at least four but less than 17 years old, reduced
    by $16.50 for every $1,000 (federal AGI rounded DOWN to the nearest $1,000 on Form IT-213 line 6) by which your
    federal AGI exceeds the threshold for your filing status. The 33%-of-the-federal-credit / $100-per-child computation
    used through 2024 no longer applies.
  income_limit_2025: 'Phase-down thresholds (the $16.50-per-$1,000 reduction starts above these): $110,000 married
    filing joint return; $75,000 single, head of household, or qualifying surviving spouse; $55,000 married filing
    a separate return. If the computed Form IT-213 line 9 amount is zero or less you are not eligible and must not
    complete or submit the form.'
  claimed_on: Form IT-213 (Claim for Empire State Child Credit), line 9; amount carried to Form IT-201, line 63
  citation:
    source: NY Dept. of Taxation and Finance - 2025 Instructions for Form IT-213 (IT-213-I), "New for 2025" and
      "Credit Calculation" ($1,000 per qualifying child under four / $330 per qualifying child age four to 16; $16.50-per-$1,000
      phase-down; $110,000/$75,000/$55,000 thresholds; line 6 round-down rule), updated December 10, 2025; 2025
      IT-201-I Line 63
    url: https://www.tax.ny.gov/forms/html-instructions/2025/it/it213i-2025.htm
- name: Real Property Tax Credit (circuit-breaker, homeowners and renters)
  type: refundable
  eligibility: 'New York State resident for all of 2025 who occupied the same NY residence for at least six months,
    was not claimed as a dependent on another taxpayer''s federal return, and whose residence was not completely
    exempted from real property taxes. Homeowners: did not own real property with a current market value of more
    than $85,000 during 2025 and paid real property taxes. Renters: average monthly rent (2025 IT-214 line 13) of
    $450 or less (the form takes 75% of rent when the rent includes charges for heat, gas, electricity, and furnishings).'
  amount: Maximum credit (2025 IT-214 credit limit chart) is $75 if all household members are under age 65 and $375
    if you, your spouse, or a dependent is age 65 or older; both maxima phase down as household gross income rises
    toward $18,000 (the 65-or-older column runs $375 at $0-$3,000 down to $150 at $14,001-$18,000; the under-65
    column runs $75 down to $50 at $14,001-$18,000). The computed credit is a percentage-of-income excess computation
    whose 2025 rate table bottoms out at 0.065 for the $14,001-$18,000 band.
  income_limit_2025: Household gross income (2025 IT-214 line 8) of $18,000 or less - the form says stop if line
    8 is more than $18,000
  claimed_on: Form IT-214 (Claim for Real Property Tax Credit for Homeowners and Renters); amount carried to Form
    IT-201, line 67 (or Form IT-214 filed by itself for a refund if not required to file)
  citation:
    source: 2025 Form IT-214 (line 3 $85,000 property-value gate, line 8 $18,000 household-gross-income limit, lines
      11/13 rent computation and $450 limit, credit limit chart $375/$150 and $75/$50) and the 2025 IT-214-I instructions;
      2025 IT-201-I Line 67
    url: https://www.tax.ny.gov/pdf/2025/inc/it214_2025_fill_in.pdf
- name: Child and Dependent Care Credit (New York State)
  type: refundable
  eligibility: You are entitled to this credit if you qualified to claim the federal child and dependent care credit
    for 2025 (whether or not you actually claimed it). Full-year residents get a fully refundable credit; nonresidents
    nonrefundable; part-year residents partially refundable.
  income_limit_2025: 'No flat income cap; the credit is the federal credit times a decimal from the 2025 IT-216-I
    New York State child and dependent care credit limitation table (p. 7 of 7), based on New York adjusted gross
    income: 1.100 (110% of the federal credit) at NYAGI of $25,000 or less, sliding by $200 band (1.000 across the
    $40,000-$50,000 band, then down again) to 0.600 for NYAGI over $65,000 up to $150,000, and 0.200 for NYAGI over
    $150,000 (no upper limit).'
  claimed_on: Form IT-216 (Claim for Child and Dependent Care Credit); amount carried to Form IT-201, line 64. A
    separate New York City child and dependent care credit (its own limitation table, 0.750 at federal AGI of $25,000
    or less down to 0.000 over $30,000) is available to NYC residents with federal AGI of $30,000 or less and a
    qualifying child under four years of age as of December 31, 2025.
  citation:
    source: NY Dept. of Taxation and Finance - 2025 Form IT-216-I, Instructions for Form IT-216 (New York State
      child and dependent care credit limitation table and the New York City child and dependent care credit limitation
      table, p. 7 of 7)
    url: https://www.tax.ny.gov/pdf/2025/inc/it216i_2025.pdf
- name: New York State Household Credit
  type: nonrefundable
  eligibility: New York State resident (full-year or part-year) who cannot be claimed as a dependent on another
    taxpayer's federal income tax return (Form IT-201 item C marked No). Amount depends on filing status, federal
    AGI, and (for tables 2 and 3) the number of dependents from item H plus one for you (and one for your spouse
    on a joint return), looked up in the household credit tables in the Form IT-201 instructions.
  amount: 'Determined from the 2025 IT-201-I household credit tables (p. 12): table 1 (single) pays $75 at federal
    AGI up to $5,000, phasing down ($60, $50, $45, $40, $20) to no credit once federal AGI exceeds $28,000; table
    2 (filing statuses 2, 4, and 5) pays $90/$105/$120/$135/$150/$165/$180 by household size 1-7 (plus $15 per person
    over 7) at federal AGI up to $5,000, phasing to $20-$50 (plus $5) in the $28,000-$32,000 band; table 3 covers
    married filing separately at roughly half those amounts ($45-$90 plus $8 in the top band) using both spouses''
    combined federal AGI.'
  income_limit_2025: Federal AGI of $28,000 or less (single, table 1); $32,000 or less (married filing jointly,
    qualifying surviving spouse, or head of household, table 2; married filing separately, table 3, using both spouses'
    combined federal AGI)
  claimed_on: Claimed directly on Form IT-201, line 40 (or Form IT-203, line 39, for nonresidents/part-year residents)
  citation:
    source: Instructions for Form IT-201 (2025), Line 40 - New York State household credit tables 1, 2, and 3 (p.
      12 of the printer-friendly IT-201-I)
    url: https://www.tax.ny.gov/pdf/2025/inc/it201i_2025.pdf
filing_requirement:
  note: 'Full-year residents file IT-201 if they must file a federal return, or if they did not have to file a federal
    return but federal AGI for 2025 plus New York additions was more than $4,000 ($3,100 if single and can be claimed
    as a dependent on another taxpayer''s federal return), or to claim a refund of any New York State, New York
    City, or Yonkers income taxes withheld from pay or from unemployment insurance benefit payments, or to claim
    any refundable or carryover credits (2025 IT-201-I, "New York State full-year residents: Who must file?"). Part-year
    residents and nonresidents with NY-source income file IT-203. If one spouse is a full-year resident and the
    other is not, separate NY returns are required (resident files IT-201) unless both elect to file a joint IT-201
    taxed as full-year residents.'
