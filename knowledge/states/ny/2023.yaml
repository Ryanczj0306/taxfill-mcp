  base: federal_agi
  tax_line: '2023 Form IT-201, page 3: "39 NYS tax on line 38 amount". IT-201-I, Line 39: "Is line 33 (your New York
    adjusted gross income) $107,650 or less? If Yes, find your New York State tax using the 2023 New York State Tax
    Table; or if line 38 is $65,000 or more, use the New York State tax rate schedule. Enter the tax due on line 39.
    If No, see Tax computation - New York adjusted gross income of more than $107,650."'
  exemptions:
    dependent:
      amount: 1000
      note: 'IT-201 line 36 dependent exemption: ''The value of each New York State dependent exemption is $1,000'' (2023
        IT-201-I, Line 36). Enter the number of dependents from item H; the form multiplies by $1,000 and subtracts it
        from line 35 to reach taxable income. This is a true base reduction (subtracted from income before the rate),
        so it is shipped. New York has NO personal (taxpayer/spouse) exemption — no ''personal'' key is shipped.'
  standard_deduction:
    single: 8000
    married_filing_jointly: 16050
    married_filing_separately: 8000
    head_of_household: 11200
  notes:
  - 'Base guidance: Supply Form IT-201, line 33 (New York adjusted gross income) = federal AGI (line 19) + New York
    additions (lines 20-23) - New York subtractions (lines 25-31). The op then subtracts the shipped NY standard deduction
    (form line 34) and $1,000 per dependent (form line 36) to reproduce NY taxable income (lines 37/38 = line 33 -
    line 34 - line 36), the amount the rate schedule is applied to. Do NOT supply federal AGI unless you have no NY
    modifications; do NOT supply line 38 (taxable income) or the deduction/exemption would be subtracted twice.'
  - 'Adjudication note (two-pass): base is federal_agi — IT-201 line 19 is federal adjusted gross income and line
    33 New York AGI = federal AGI +/- New York additions/subtractions; supply line 33 (the op subtracts the line 34
    standard deduction and $1,000-per-dependent line 36 exemption). Full 2023 rate schedule re-verified against the
    live IT-201-I instructions (all three schedules, constants 600/4,271/12,356/143,754/418,263 match).'
  - 'CRITICAL — benefit-recapture worksheet mandate: if New York adjusted gross income (IT-201 line 33) is more than
    $107,650, the 2023 IT-201-I instructions MANDATE the ''Tax computation — New York adjusted gross income of more
    than $107,650'' worksheets (worksheets 1-6, with fixed Recapture Base and Incremental Benefit amounts phased in
    over $50,000 of NYAGI above each bracket threshold), so plain bracket math is WRONG (understates tax) above that
    threshold; at NYAGI over $25,000,000 the worksheet taxes ALL taxable income at a flat 10.9%. The filed form must
    use the worksheets.'
  - 'Table mandate below $65,000: if NYAGI (line 33) is $107,650 or less and taxable income (line 38) is under $65,000,
    the instructions require the 2023 New York State Tax Table (https://www.tax.ny.gov/pit/file/tax-tables/it201i-2023.htm)
    — bracket math may differ by a few dollars within table bands; the filed form must use the table. The rate schedule
    itself applies only when line 38 is $65,000 or more.'
  - One schedule covers Single AND Married filing separately ('Single and married filing separately—filing status
    1 and 3') — the identical schedule is duplicated for both statuses here, copied, not derived. The MFJ schedule
    is titled 'Married filing jointly and qualifying surviving spouse—filing status 2 and 5', so qualifying surviving
    spouse maps exactly to married_filing_jointly as the engine assumes.
  - 'The printed ''$X plus Y% of the excess over $Z'' constants in the 2023 schedule are rounded to whole dollars
    and do NOT all equal the exact cumulative sum of prior brackets: max divergence is $0.50 (single $600 printed
    vs $599.50 exact at $13,900) and roughly ±$0.25 elsewhere (e.g., MFJ $976 vs $976.25; single top constants $449,929/$2,509,929
    vs exact +$0.45; HoH $434,163/$2,494,163 vs exact +$0.475). Pure marginal accumulation (what this engine does)
    can therefore differ from schedule arithmetic by under $1.'
  - 'Standard-deduction gates NOT modeled: a Single filer who CAN be claimed as a dependent on another taxpayer''s
    return (item C = Yes) gets $3,100, not the shipped $8,000; married-filing-separately spouses must both take the
    standard deduction unless both itemize; itemizers enter the larger Form IT-196 amount on line 34 instead. Compute
    those cases on the form.'
  - New York has no personal (taxpayer/spouse) exemption — only the $1,000 per-dependent exemption on line 36. If
    line 36 exceeds line 35, taxable income is zero (the engine's max(0, ...) floor matches the form's 'leave line
    37 and line 38 blank' rule).
  - New York State household credit (IT-201 line 40, up to $75-$90+ by table for federal AGI under $28,000/$32,000),
    NY EITC (line 65), Empire State child credit, and child/dependent care credit are TAX CREDITS subtracted from
    tax, not base reductions — none are shipped as exemptions and none are modeled by this op.
  - 'Local taxes on the same return are NOT modeled: New York City resident tax (IT-201 lines 47-47a, separate NYC
    tax table / NYC tax rate schedule, own worksheets), NYC school tax credit, Yonkers resident income tax surcharge
    (line 57, a percentage of net state tax) and Yonkers nonresident earnings tax (line 55), and the MCTMT for self-employed
    individuals. New York State tax on line 39/44 only is modeled here.'
  - The shipped standard deduction for qualifying surviving spouse equals MFJ ($16,050, filing status 5 in the standard
    deduction table), consistent with the engine's QSS-to-MFJ mapping.
