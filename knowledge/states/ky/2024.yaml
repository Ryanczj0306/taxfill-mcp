# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 Form 740 instruction packet
# (What's New: rate 4%, standard deduction $3,160) and the 2024 Form 740 itself
# (42A740 10-24, line 10 "$3,160" / line 12 "Multiply line 11 by 4% (.04)").
# UNLIKE the 2023 pack, the personal tax credit amounts ($40/$40/$20) WERE
# extractable from the 2024 Schedule ITC and ship in the credits section above —
# but they are credits against tax, not exemptions, so calc.state_tax still does
# not model them (see notes).
tax:
  citation:
    source: '2024 Kentucky Individual Income Tax Forms — Form 740 Instruction Packet (42A740(PKT)): What''s New — "STANDARD
      DEDUCTION—For 2024, the standard deduction is $3,160" and "INDIVIDUAL INCOME TAX RATE—For 2024, the tax rate for
      individual income tax is 4%"; Line 10 — "Nonitemizers, enter the standard deduction of $3,160. If married filing
      separately on a combined return, enter $3,160 in both Columns A and B. If filing a joint return, only one $3,160
      standard deduction is allowed"; Line 5 = Federal Adjusted Gross Income; Line 9 = Kentucky AGI; Line 11 = Taxable
      Income; Line 12 "Multiply line 11 by four percent (.04)". Second pass: the 2024 Form 740 itself (42A740, 10-24)
      prints line 10 "Nonitemizers: Enter $3,160 in Columns A and/or B" and line 12 "Tax Computation: Multiply line
      11 by 4% (.04)" — both passes agree.'
    url: https://revenue.ky.gov/Forms/740%20instructions%20packet%20(2024).pdf
  flat_rate: 0.04
  base: federal_agi
  tax_line: 'Form 740 Line 12 = Line 11 (Taxable Income = Line 9 Kentucky AGI minus Line 10 deduction) x four percent
    (.04) — printed on the 2024 form: "Tax Computation: Multiply line 11 by 4% (.04)". Line 5 starts from federal
    AGI ("Do not confuse federal adjusted gross income with federal taxable income").'
  exemptions: {}
  standard_deduction:
    single: 3160
    married_filing_jointly: 3160
    married_filing_separately: 3160
    head_of_household: 3160
  notes:
  - 'Rate change: the 2024 rate is 4% (.04), down from 4.5% in 2023 (2024 packet What''s New); the standard deduction
    rose to $3,160 (from $2,980).'
  - Kentucky allows ONE $3,160 standard deduction per return — a joint return gets a single $3,160 (it is NOT doubled);
    spouses filing separately on a combined return (Filing Status 2) get $3,160 each column.
  - Kentucky has no personal or dependent exemptions; the nonrefundable personal tax credits ($40 age 65+, $40 blind,
    $20 Kentucky National Guard — 2024 Schedule ITC Section B) and the Family Size Tax Credit (Form 740 lines 20-21)
    are CREDITS against tax and are NOT modeled by calc.state_tax — compute them on Schedule ITC / the Family Size
    Tax Credit Table.
  - Kentucky local occupational license taxes (county/city payroll taxes) are NOT modeled.
# effective_law_changes — promoted on 2026-08-11 from this pack's own header note, `starts_from`
# and tax-block prose, all sourced to the 2024 packet's "What's New" (DEV_PLAN §7.2). The rate cut
# is modeled: true (tax.flat_rate IS the changed law); the HB 8 IRC reference-date move is
# modeled: false — it works through Schedule M into Kentucky AGI, which the caller supplies. The
# $2,980 -> $3,160 standard deduction is Kentucky's annual cost-of-living adjustment, not a law
# change, so it gets no entry (it already ships in tax.standard_deduction).
effective_law_changes:
- description: >-
    RATE CUT for tax year 2024 — "INDIVIDUAL INCOME TAX RATE—For 2024, the tax rate for individual income
    tax is 4%" (2024 Form 740 instruction packet, What's New), down from 4.5% for 2023. The 2024 Form 740
    line 12 prints "Tax Computation: Multiply line 11 by 4% (.04)".
  status: final_form_published
  affects:
  - tax.flat_rate
  - tax.tax_line
  - Form 740 Line 12
  modeled: true
  citation:
    source: >-
      2024 Kentucky Individual Income Tax Forms — Form 740 Instruction Packet (42A740(PKT)): What's New
      (standard deduction $3,160; individual income tax rate 4%; Family Size Tax Credit 2024 thresholds;
      HB 8 IRC reference date December 31, 2023), starting point ("the individual income tax return begin
      with federal adjusted gross income"), Form 740 line 5 Federal AGI, Schedule M additions list, due
      date April 15 2025, mailing addresses (Refund 40618-0006 / Pay 40619-0008), check payable to Kentucky
      State Treasurer / Form 740-V
    url: https://revenue.ky.gov/Forms/740%20instructions%20packet%20(2024).pdf
- description: >-
    IRC REFERENCE DATE UPDATED to December 31, 2023 by HB 8 (from December 31, 2022), per the 2024 packet's
    What's New. Kentucky law requires the individual income tax return to begin with federal adjusted gross
    income and be adjusted for any differences to arrive at Kentucky adjusted gross income, so the conformity
    date governs which federal provisions flow through and which are modified on Schedule M (special
    depreciation/Section 179 differences, federal NOL, the Kentucky excess business loss limitation, etc.).
  status: final_form_published
  affects:
  - starts_from
  - Schedule M (additions and subtractions)
  - Form 740 Lines 6/8/9 (Kentucky AGI)
  - calc.state_tax taxable_base (caller-supplied)
  modeled: false
  lookup_path: >-
    2024 Form 740 instruction packet (42A740(PKT)) at the citation URL — What's New (HB 8 IRC reference date
    December 31, 2023) and the Schedule M instructions, which enumerate the additions (lines 1-5, totaled on
    line 6) and subtractions that implement the conformity differences.
  citation:
    source: >-
      2024 Kentucky Individual Income Tax Forms — Form 740 Instruction Packet (42A740(PKT)): What's New
      (standard deduction $3,160; individual income tax rate 4%; Family Size Tax Credit 2024 thresholds;
      HB 8 IRC reference date December 31, 2023), starting point ("the individual income tax return begin
