tax:
  citation:
    source: 'Kentucky Department of Revenue — 2025 Form 740, Kentucky Individual Income Tax Return, Full-Year Resident
      (42A740, 10-25): line 10 "Itemizers: Enter itemized deductions from Kentucky Schedule A. Nonitemizers: Enter $3,270
      in Columns A and/or B"; line 11 "Subtract line 10 from line 9. This is your Taxable Income"; line 12 "Tax Computation:
      Multiply line 11 by 4% (.04) or amount from Schedule J"; line 5 = federal AGI ("Enter amount from federal Form
      1040 or 1040-SR, line 11a"); line 9 = Kentucky Adjusted Gross Income (line 7 minus Schedule M subtractions). Second
      pass on the RATE: the live KY DOR Individual Income Tax page states "Kentucky''s individual income tax law is
      based on the Internal Revenue Code in effect as of December 31, 2024. The tax rate is four (4) percent and allows
      itemized deductions and certain income reducing deductions as defined in KRS 141.019" — both sources give 4%.
      The 2025 Form 740 instruction packet (42A740(PKT)), which in prior years carried the "What''s New" standard-deduction
      line, is unretrievable (HTTP 404 on every plausible URL), so $3,270 rests on the form itself — see the pack''s
      `unverified` list.'
    url: https://revenue.ky.gov/Forms/740%20(2025).pdf
  flat_rate: 0.04
  base: federal_agi
  tax_line: 'Form 740 Line 12 = Line 11 (Taxable Income = Line 9 Kentucky AGI minus Line 10 deduction) x 4% (.04)
    — printed on the 2025 form: "Tax Computation: Multiply line 11 by 4% (.04) or amount from Schedule J". Line 5
    starts from federal AGI (federal Form 1040/1040-SR line 11a); Line 6 adds Schedule M line 6 additions and Line
    8 subtracts Schedule M line 17 subtractions.'
  exemptions: {}
  standard_deduction:
    single: 3270
    married_filing_jointly: 3270
    married_filing_separately: 3270
    head_of_household: 3270
  notes:
  - 'Standard deduction change: $3,270 for 2025, up from $3,160 (2024) and $2,980 (2023). The rate is UNCHANGED at
    4% (.04) — verified twice (2025 Form 740 line 12 and the live KY DOR Individual Income Tax page). Never carry
    a Kentucky rate or standard deduction to another tax year without re-verifying that year''s own Form 740.'
  - Kentucky allows ONE $3,270 standard deduction per return — a joint return gets a single $3,270 (it is NOT doubled);
    spouses filing separately on a combined return (Filing Status 2) enter $3,270 in each of Columns A and B, which
    is why the form says "in Columns A and/or B".
  - 'Kentucky has NO head-of-household filing status. The 2025 Form 740 prints only four statuses: 1 Single, 2 Married
    filing separately on this combined return, 3 Married filing joint return, 4 Married filing separate returns. The
    head_of_household column exists only because the engine''s schema requires all four federal statuses; it carries
    the same single $3,270 — a filer who is head of household federally files Kentucky as Single (or married, as applicable).'
  - Kentucky has no personal or dependent exemptions; the nonrefundable personal tax credits ($40 age 65+, $40 blind,
    $20 Kentucky National Guard as of 12/31/2025 — 2025 Schedule ITC Section B, Form 740 line 17), the Family Size
    Tax Credit (Form 740 lines 20-21, from the Schedule ITC Section C Tax Year 2025 table; the form's line 5 gate
    is federal AGI of $42,760 or less), the Education Tuition Tax Credit (line 23, Form 8863-K) and the 20% Child
    and Dependent Care Credit (line 24) are all CREDITS against tax and are NOT modeled by calc.state_tax.
  - 'Not modeled: Schedule J (farm income averaging) as an alternative to the line 12 multiplication, the line 13
    add-ons (Form 4972-K lump-sum tax, Schedule RC-R / DS-R recapture, Angel Investor recapture), the line 27 Kentucky
    Use Tax, and Kentucky LOCAL occupational license taxes (county/city payroll taxes).'
