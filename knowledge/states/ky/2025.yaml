- id: rates-1
  topic: tax_rates_and_brackets
  url: https://revenue.ky.gov/Forms/740%20(2025).pdf
  descriptions:
  - 'Kentucky Department of Revenue — 2025 Form 740, Kentucky Individual Income Tax Return, Full-Year Resident (42A740,
    10-25): line 10 "Itemizers: Enter itemized deductions from Kentucky Schedule A. Nonitemizers: Enter $3,270 in
    Columns A and/or B"; line 11 "Subtract line 10 from line 9. This is your Taxable Income"; line 12 "Tax Computation:
    Multiply line 11 by 4% (.04) or amount from Schedule J"; line 5 = federal AGI ("Enter amount from federal Form
    1040 or 1040-SR, line 11a"); line 9 = Kentucky Adjusted Gross Income (line 7 minus Schedule M subtractions).
    Second pass on the RATE: the live KY DOR Individual Income Tax page states "Kentucky''s individual income tax
    law is based on the Internal Revenue Code in effect as of December 31, 2024. The tax rate is four (4) percent
    and allows itemized deductions and certain income reducing deductions as defined in KRS 141.019" — both sources
    give 4%. The 2025 Form 740 instruction packet (42A740(PKT)), which in prior years carried the "What''s New"
    standard-deduction line, is unretrievable (HTTP 404 on every plausible URL), so $3,270 rests on the form itself
    — see the pack''s `unverified` list.'
