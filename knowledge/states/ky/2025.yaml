  than April 15, 2026" wording, the Modified Gross Income worksheet, and the Form 740EXT extension mechanics.'
- 'Standard deduction second pass: $3,270 is printed on the 2025 Form 740 line 10 ("Nonitemizers: Enter $3,270 in
  Columns A and/or B") but NO second official document confirming it could be fetched (the packet''s "What''s New"
  is where the 2024 pack''s second confirmation came from). The 4% rate IS double-verified (Form 740 line 12 and
  the live DOR page). Confirm $3,270 against the 2025 packet when it becomes retrievable.'
- No KY .gov page explicitly addresses tax-TREATY-exempt income by name; the conformity conclusion is inferred from
  KY beginning at federal AGI plus the absence of any treaty add-back in the 2025 Schedule M additions list. This
  is the standard federal-AGI-conformity case but the specific treaty-income treatment is not stated verbatim on
  a KY .gov page.
- 'Residency definitions (the 183-day statutory-resident rule and the reciprocal-states list IL/IN/MI/OH/VA/WV/WI)
  were carried from the Form 740-NP packet series and the 2023/2024 packs; the 2025 Form 740-NP and its packet both
