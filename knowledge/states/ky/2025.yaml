jurisdiction: states/ky
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Kentucky''s resident return (Form 740) starts from federal adjusted gross income — 2025 Form 740 line
  5 is "Enter amount from federal Form 1040 or 1040-SR, line 11a", i.e. federal AGI, and Kentucky law requires the
  individual income tax return to begin with federal adjusted gross income and be adjusted for any differences to
  arrive at Kentucky adjusted gross income (Form 740 line 6 additions from Schedule M line 6, line 8 subtractions
  from Schedule M line 17, line 9 Kentucky AGI). The 2025 Schedule M "Additions to Federal Adjusted Gross Income"
  (Part I, lines 1-5, totaled on line 6) are: (1) interest on other states'' obligations / taxable mutual-fund dividends,
  (2) resident adjustment from Kentucky Schedule K-1, (3) special depreciation/Section 179 differences, (4) federal
  net operating loss, and (5) "other additions" (reservist/National Guard expenses, the lump-sum distribution capital-gains
  portion, passive activity loss adjustment, pension/IRA basis differences, intangible-asset and depreciable-property
  gain differences, Armed Forces moving expenses, Kentucky excess business loss limitation). NONE of these add back
  federally tax-treaty-exempt income. Because treaty-exempt income is already excluded from federal AGI and KY has
  no add-back for it, it is not re-taxed by Kentucky — therefore KY conforms. (Kentucky''s starting basis is the
  Internal Revenue Code in effect as of December 31, 2024, per the live KY DOR Individual Income Tax page.)'
citation:
  source: 'Kentucky Department of Revenue — 2025 Form 740, Kentucky Individual Income Tax Return, Full-Year Resident
    (42A740, 10-25) — line 5 federal AGI (federal Form 1040/1040-SR line 11a) with the "$42,760 or less" Family Size
    Tax Credit note, line 9 Kentucky Adjusted Gross Income, line 10 "Nonitemizers: Enter $3,270 in Columns A and/or
    B", line 11 Taxable Income, line 12 "Tax Computation: Multiply line 11 by 4% (.04) or amount from Schedule J",
    lines 20-21 Family Size Tax Credit, line 24 Child and Dependent Care Credit x 20% (.20), page-3 Enclose/Payment
    block (Check Payable "Kentucky State Treasurer", "KY Income Tax—2025", Refund or No Payment Frankfort KY 40618-0006
    / With Payment Frankfort KY 40619-0008)'
  url: https://revenue.ky.gov/Forms/740%20(2025).pdf
forms:
  resident: Form 740 (2025 Kentucky Individual Income Tax Return — Full-Year Resident, 42A740, 10-25). Filing statuses
    printed on the 2025 form are 1 Single, 2 Married filing separately on this combined return (if both had income),
    3 Married filing joint return, 4 Married filing separate returns.
  part_year_or_nonresident: Form 740-NP (Kentucky Individual Income Tax Return — Nonresident or Part-Year Resident).
    Reciprocal-state residents with only KY wages use Form 740-NP-R (mailed to Frankfort, KY 40620-0012 per the live
    DOR page).
  # (Phase K JK28, 2026-10-16): each role's own form and its instructions, which state_scope adds to a part-year or
  # nonresident filer's citations — the top-level `citation` is the RESIDENT Form 740, so this entry named Form 740-NP
  # and Form 740-NP-R but pointed only at Form 740. The three URLs are the "740-NP Packet Instructions (2025)",
  # "25_42A740-NP" and "740-NP-R (2025)" files in Kentucky DOR's Forms library (revenue.ky.gov/Forms); each PDF was
  # downloaded twice on 2026-10-16 with identical sha256 (740-NP instructions b1ef413f0e37e2b4..., 740-NP
  # dc1bad0d9b911eef..., 740-NP-R 91887367d2f2ff74...). The entry above agrees with the 2025 instructions (pp. 3 and 7)
  # and the 740-NP-R (whose page 1 prints the Frankfort, KY 40620-0012 address) and is unchanged. The 740-NP-R's page-1
  # sentence is quoted up to "nonresidents" (re-downloaded: same sha256): its purpose clause, "to claim a refund of
  # Kentucky income taxes withheld during 2025", made get_sources("refund") drop the filing_logistics entry that holds
  # the Form 740 refund address.
  citations:
    part_year:
    - source: >-
        2025 Kentucky Form 740-NP Packet Instructions (42A740-NP(P) (10-25)), Instructions for Form 740-NP, p. 7: 'WHO
        MUST FILE FORM 740-NP—Form 740-NP must be used by full-year nonresidents who had income from Kentucky sources and
        by part-year residents who had income while a Kentucky resident or from Kentucky sources while a nonresident.'
        — 'Individuals who established or abandoned Kentucky residency are considered part-year residents.'
      url: https://revenue.ky.gov/Forms/740-NP%20Packet%20Instructions%20(2025).pdf
    - source: >-
        2025 Form 740-NP (42A740-NP (10-25)), Kentucky Individual Income Tax Return, Nonresident or Part-Year Resident —
        the 4-page form itself
      url: https://revenue.ky.gov/Forms/25_42A740-NP.pdf
    nonresident:
    - source: >-
        2025 Kentucky Form 740-NP Packet Instructions (42A740-NP(P) (10-25)), Instructions for Form 740-NP, p. 7: 'WHO
        MUST FILE FORM 740-NP—Form 740-NP must be used by full-year nonresidents who had income from Kentucky sources and
        by part-year residents who had income while a Kentucky resident or from Kentucky sources while a nonresident.'
        — 'Reciprocal States' (p. 7): 'Taxpayers who qualify for this exemption and have no other Kentucky taxable
        income should file Form 740-NP-R, Kentucky Income Tax Return, Nonresident–Reciprocal State, to obtain a refund.'
      url: https://revenue.ky.gov/Forms/740-NP%20Packet%20Instructions%20(2025).pdf
    - source: >-
        2025 Form 740-NP (42A740-NP (10-25)), Kentucky Individual Income Tax Return, Nonresident or Part-Year Resident —
        the 4-page form itself
      url: https://revenue.ky.gov/Forms/25_42A740-NP.pdf
    - source: >-
        2025 Form 740-NP-R (42A740-NP-R (10-25)), Kentucky Income Tax Return, Nonresident—Reciprocal State, page 1:
        'This form may be used by qualifying full-year nonresidents' — 'Nonresidents who answered “No” to any of the
        statements above must file Form 740-NP to report Kentucky income.'
      url: https://revenue.ky.gov/Forms/740-NP-R%20(2025).pdf
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Family Size Tax Credit
  type: nonrefundable
  eligibility: Resident individuals/families with modified gross income (MGI) at or below the Schedule ITC Section
    C table ceiling for their family size. Family size is capped at 4 (yourself, spouse if living in the same household,
    and qualifying children). Available even to someone claimed as a dependent on a parent's return (family size
    1). The 2025 Form 740 line 5 prints the outer gate directly — "If total of Columns A and B is $42,760 or less,
    you may qualify for the Family Size Tax Credit."
  claimed_on: Form 740, line 20 (check the box for total family size) and line 21 ("Multiply line 19 by Family Size
    Tax Credit decimal amount ... from Schedule ITC"); percentage determined from the Schedule ITC Section C Family
    Size Tax Credit Table.
  citation:
    source: Kentucky Department of Revenue — 2025 Schedule ITC (42A740-ITC, "TAX CREDIT SCHEDULE 2025"), Section
      C Family Size Tax Credit Table (Tax Year 2025 bands), and 2025 Form 740 lines 5, 20-21
    url: https://revenue.ky.gov/Forms/Schedule%20ITC%20(2025).pdf
  # Phase K JK31 (2026-10-25): the credit quotes this form face's caption; its citation names the instructions; downloaded twice, identical sha256 cb68242eb8351dcd...
  citations:
  - source: 'Kentucky DOR 2025 Form 740, lines 5 and 21'
    url: https://revenue.ky.gov/Forms/740%20(2025).pdf
- name: Child and Dependent Care Credit
  type: nonrefundable
  eligibility: Residents who qualified for and claimed the federal child and dependent care credit on federal Form
    2441 (care expenses for a qualifying child/dependent so the taxpayer can work). Kentucky has no separate income
    limit; eligibility tracks the federal credit.
  claimed_on: Form 740, line 24 (federal Form 2441 line 11 x 20%).
  citation:
    source: Kentucky Department of Revenue — 2025 Form 740 (42A740, 10-25), line 24
    url: https://revenue.ky.gov/Forms/740%20(2025).pdf
- name: Personal Tax Credits (age 65+, blind, or Kentucky National Guard)
  type: nonrefundable
  eligibility: Taxpayer (and spouse, if filing jointly or married filing separately on a combined return) who, as
    of 12/31/2025, was age 65 or older, was legally blind, and/or was a member of the Kentucky National Guard. A
    taxpayer can claim more than one (e.g., 65+ AND blind). No income limit.
  claimed_on: Schedule ITC, Section B (lines 1-3 taxpayer, lines 5-7 spouse), carried to Form 740, line 17 ("Enter
    personal tax credit amounts from Schedule ITC, Section B").
  citation:
    source: Kentucky Department of Revenue — 2025 Schedule ITC (42A740-ITC), Section B Personal Tax Credits, and
      2025 Form 740 line 17
    url: https://revenue.ky.gov/Forms/Schedule%20ITC%20(2025).pdf
  # Phase K JK31 (2026-10-25): the credit quotes this form face's caption; its citation names the instructions; downloaded twice, identical sha256 cb68242eb8351dcd...
  citations:
  - source: 'Kentucky DOR 2025 Form 740, line 17'
    url: https://revenue.ky.gov/Forms/740%20(2025).pdf
