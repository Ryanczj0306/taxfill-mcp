- id: logistics-2
  topic: filing_logistics
  url: https://revenue.ky.gov/Individual/Individual-Income-Tax/Pages/default.aspx
  descriptions:
  - Kentucky Department of Revenue — Individual Income Tax page (Kentucky individual income tax law, Chapter 141
    of the Kentucky Revised Statutes; a calendar-year individual return is due the fifteenth day of the fourth month
    after the close of the taxable year, i.e. April 15, 2026 for tax year 2025, with a six-month extension via Form
    740EXT or the federal automatic extension). NOTE the exact "postmarked or submitted electronically no later
    than April 15, 2026" wording lives in the 2025 Form 740 instruction packet, which could not be retrieved this
    pass — see the pack's `unverified` list.
