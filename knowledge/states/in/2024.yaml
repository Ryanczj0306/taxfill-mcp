# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 IT-40 booklet (SP 265 R25/9-24)
# and the 2024 Form IT-40 (State Form 154 R23/9-24) / 2024 Schedule 3 (State Form
# 53997 R15/9-24) forms themselves (forms.in.gov, IN DOR .gov).
# CHANGED for 2024 vs the 2023 pack: the flat rate drops 3.15% -> 3.05% (the 2024
# Form IT-40 Line 8 prints .0305, and the booklet's credit-for-other-states worksheet
# multiplies by "3.05% (.0305)"). Exemption amounts are UNCHANGED
# ($1,000 personal / $1,000 dependent / $1,500 additional dependent child).
tax:
  citation:
    source: 'Indiana DOR — 2024 Form IT-40 (State Form 154 R23/9-24) Line 8 "State adjusted gross income tax: multiply
      line 7 by 3.05% (.0305)" (Line 7 = Line 5 minus Line 6 exemptions; Line 1 = federal AGI from Form 1040/1040-SR
      line 11); 2024 Schedule 3: Exemptions (State Form 53997 R15/9-24) Lines 1-6. Second pass: the 2024 IT-40 booklet
      (SP 265 R25/9-24) Credit for Taxes Paid to Other States Group A Worksheet line B multiplies by "3.05% (.0305)"
      with the worked example "$305 ($10,000 x .0305)", and the booklet''s Schedule 3 line-by-line instructions repeat
      the $1,000/$2,000, $1,000-per-dependent and $1,500 additional-dependent-child amounts — both passes agree.'
    url: https://forms.in.gov/Download.aspx?id=16344
  flat_rate: 0.0305
  base: federal_agi
  tax_line: 'IT-40 Line 8: "State adjusted gross income tax: multiply line 7 by 3.05% (.0305)" (Line 7 = Indiana adjusted
    gross income = Line 5 minus Line 6 exemptions; Line 1 starts from federal AGI, Form 1040/1040-SR line 11).'
  exemptions:
    personal:
      amount: 1000
      note: 'Schedule 3 Line 1: $1,000 per taxpayer ($2,000 married filing jointly — $1,000 each spouse). Enter $1,000
        even if claimed as a dependent on someone else''s return.'
    dependent:
      amount: 1000
      note: 'Schedule 3 Line 2: $1,000 per dependent listed on Schedule IN-DEP (enclose Schedule IN-DEP).'
    additional_dependent_child:
      amount: 1500
      note: 'Schedule 3 Line 3: additional $1,500 per qualifying dependent CHILD (son/stepdaughter/foster child/legal-guardian
        child etc., under 19 by Dec. 31, 2024, or a full-time student under 24). NOT applied by calc.state_tax — enter
        it on Schedule 3 Line 3.'
    age_65_or_blind:
      amount: 1000
      note: 'Schedule 3 Line 4: $1,000 per 65-or-older / blind checkbox (taxpayer and spouse each). NOT applied by calc.state_tax.'
    age_65_low_income:
      amount: 500
      note: 'Schedule 3 Line 5: additional $500 per 65-or-older box when IT-40 Line 1 (federal AGI) is under $40,000 (under
        $20,000 married filing separately). NOT applied by calc.state_tax.'
    adopted_child:
      amount: 3000
      note: 'Schedule 3 Line 6: additional $3,000 per adopted child listed on Schedule IN-DEP-A. NOT applied by calc.state_tax.'
  notes:
  - First-year $3,000 dependent-child amount (instead of $1,500) has NARROWER mechanics than "first year claimed"
    — per the 2024 IT-40 booklet it is allowed only in "the first taxable year in which the additional dependent exemption
    is allowable for that child" and "is not permitted if the child could have been claimed for the $1,500 exemption
    in any previous year, regardless of whether the child had been claimed." Eligibility gates on could-have-claimed,
    not first-actually-claimed — decide it on Schedule 3/Schedule IN-DEP, not here.
  - Indiana COUNTY income taxes (IT-40 Line 9, Schedule CT-40, per-county rates) are NOT modeled — calc.state_tax
    computes the state 3.05% line only; most Indiana filers also owe a county add-on.
  - 'Rate is year-specific: 3.05% applies to tax year 2024 only (2023 was 3.15%) — never carry either rate to another
    year.'
