# IN state knowledge — tax year 2025. Fetched + cited from the IN DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 IT-40 Full-Year
# Resident booklet (PDF title "IT-40 Full Year Resident Individual Income Tax Booklet",
# CreationDate 2026-02-06) and the 2025 Form IT-40 (State Form 154, CreationDate
# 2025-06-27), then independently re-derived from a second official document (the 2025
# Schedule 3: Exemptions (State Form 53997, rev 9-25) for the exemption amounts, and the
# live 2026 IN DOR "Tax Chapter for the 2025 filing year" (www.in.gov, revised Oct 2025)
# for the rate) — resolutions recorded inline where the passes differed.
# CHANGED for 2025 vs the 2024 pack: the flat rate drops 3.05% -> 3.00% (the phased cut
# continues; the 2025 Form IT-40 Line 8 prints "multiply line 7 by 3% (.03)" and the Tax
# Chapter states "Individual Income tax rate is lowered to 3% for tax year 2025 and 2.95%
# for tax year 2026"); the Indiana EIC federal-income ceiling rises $66,819 -> $68,650.
# Schedule 3 exemption amounts are UNCHANGED ($1,000 personal / $1,000 dependent / $1,500
# additional dependent child / $1,000 age-65-or-blind / $500 low-income 65+ / $3,000 adopted).
jurisdiction: states/in
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Indiana''s resident return (Form IT-40) starts from federal adjusted gross income: the 2025 Form
  IT-40 Line 1 is "Enter your federal adjusted gross income from your federal income tax return, Form 1040 or Form
  1040-SR, line 11," and the 2025 booklet Line 1 instruction repeats "Enter the adjusted gross income from your
  federal Form 1040/1040-SR, line 11." Income exempt from federal tax under a U.S. tax treaty is already excluded
  from federal AGI, so it flows through to Indiana untaxed. The only Indiana additions are Schedule 1: Add-Backs,
  which are IRC-conformity / decoupling items (Line 1 of Form IT-40 assumes conformity with the Internal Revenue
  Code as amended and in effect on the statutory conformity date). A full-text search of the entire 2025 IT-40
  booklet returns ZERO occurrences of "treaty"/"treaties" — there is no add-back for treaty-exempt or U.S.-tax-treaty
  income. Because IN starts from federal AGI and has no treaty add-back, federally treaty-exempt income is NOT
  re-taxed -> conforms. (Contrast with CA, which adds treaty income back on Schedule CA.)'
citation:
  source: Indiana DOR - 2025 IT-40 Full-Year Resident Individual Income Tax Booklet - Line 1 federal AGI start;
    Schedule 1 Add-Backs (no treaty add-back); residency definitions; due date April 15, 2026; mailing addresses;
    check payee DOR; INTIME; filing requirement/exemption thresholds; rate 3% for tax year 2025
  url: https://forms.in.gov/Download.aspx?id=16915
starts_from: 'federal AGI (Form IT-40, Line 1: federal adjusted gross income from federal Form 1040/1040-SR, line
  11)'
residency:
  summary: 'Indiana residency is based on legal residence (domicile). Full-year resident: you maintain your legal
    residence in Indiana from Jan. 1 - Dec. 31 of the tax year; you need not be physically present the entire year
    (residents, including military personnel, who leave Indiana for a temporary stay are considered residents during
    their absence; retirees who keep their Indiana home, driver''s license, voting rights, and homestead deduction
    remain full-year residents). Full-year residents file Form IT-40. Part-year resident: an Indiana resident for
    less than the full year (e.g., moved in/out during 2025); files Form IT-40PNR and is taxed on income received
    while an Indiana resident plus income from Indiana sources. Nonresident: a legal resident of another state with
    Indiana-source income (except certain interest, dividends, or retirement income) files Form IT-40PNR. Special
    case: full-year residents of the reciprocal states (Kentucky, Michigan, Ohio, Pennsylvania, Wisconsin) whose
    only Indiana income is wages/salaries/tips/commissions file the reciprocal Form IT-40RNR instead. Indiana does
    not publish a day-count statutory-resident test like some states; residency turns on legal residence/domicile.
    Filing status must match federal: joint federal return -> joint Indiana return; separate federal returns ->
    separate Indiana returns.'
forms:
  resident: Form IT-40, Indiana Full-Year Resident Individual Income Tax Return (2025, State Form 154)
  part_year_or_nonresident: Form IT-40PNR, Indiana Part-Year and Full-Year Nonresident Individual Income Tax Return
    (2025). (Reciprocal-state full-year nonresidents with only IN wage income file Form IT-40RNR instead.)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Indiana Earned Income Credit (EIC)
  type: refundable
  eligibility: You must be eligible for and have actually claimed the federal Earned Income Credit on your federal
    tax return; if not, you are not eligible to claim Indiana's EIC. For the 2025 tax year Indiana follows all requirements
    and allowances for the federal EIC. Schedule IN-EIC must be completed and enclosed by all filers claiming the
    credit.
  amount: 'Indiana EIC = 10% of your federal EIC ("Your 2025 EIC will be your federal EIC multiplied by 10%" —
    2025 IT-40 booklet, Schedule 5 Line 6 instructions).'
  income_limit_2025: Income on Form IT-40, line 1 (or Indiana Schedule A, line 36A) must be less than $68,650; at
    $68,650 or more you are not eligible.
  claimed_on: 'Form IT-40, Schedule 5: Credits, line 6 ("Earned income credit: enclose Schedule IN-EIC").'
  citation:
    source: 2025 IT-40 Full-Year Resident Individual Income Tax Booklet (Schedule 5, Line 6 — Indiana's Earned Income
      Credit, 10% of federal EIC, income ceiling less than $68,650)
    url: https://forms.in.gov/Download.aspx?id=16915
- name: Unified Tax Credit for the Elderly
  type: refundable
  eligibility: You and/or your spouse must have been age 65 or older by Dec. 31, 2025; if married and living together
    at any time during the year you must file a joint return; you must have been an Indiana resident for at least
    six months during 2025; and you must not have been in prison for 180 days or more in 2025. Disabled persons
    under age 65 do not qualify. The tax return must be filed and credit claimed within three years of the filing
    due date (including extensions). Low-income filers not otherwise required to file may claim it on the simplified
    Form SC-40; others claim it on Schedule 5, line 5. File either SC-40 or IT-40, not both.
  amount: 'Refund/credit ranges from $40 to $140 based on filing status, age, and income. Joint filers both age
    65+ (2025 booklet Table A): under $1,000 = $140; $1,000-$2,999 = $90; $3,000-$9,999 = $80. Only one person age
    65+ / single or widowed (Table B): under $1,000 = $100; $1,000-$2,999 = $50; $3,000-$9,999 = $40.'
  income_limit_2025: Income on Form IT-40, line 1 must be less than $10,000. (Simplified Form SC-40 filing thresholds
    are under $2,500 if single/widowed, under $3,500 if married with only one spouse 65+, and under $5,000 if married
    with both 65+.)
  claimed_on: 'Form IT-40, Schedule 5: Credits, line 5 (Table A or Table B), OR Form SC-40.'
  citation:
    source: 2025 IT-40 Full-Year Resident Individual Income Tax Booklet (Schedule 5, Line 5 — Unified Tax Credit
      for the Elderly, Tables A and B; income limit less than $10,000)
    url: https://forms.in.gov/Download.aspx?id=16915
- name: Lake County (Indiana) Residential Income Tax Credit
  type: nonrefundable
  eligibility: Available only to residents who paid property tax to Lake County, Indiana on their residence (principal
    dwelling, owned or being bought under contract); whose Modified Indiana Adjusted Gross Income is less than $18,600
    (less than $9,300 married filing separately); and who are NOT claiming the Homeowner's Residential Property
    Tax Deduction on Indiana Schedule 2, line 2. This is the closest Indiana equivalent to a property-tax credit
    but is limited to Lake County residents (not statewide).
  amount: Credit equals the lesser of the Lake County property tax you paid or $300 (maximum, Worksheet A). For
    married filing separately the maximum is $150. An income-based phaseout applies for Modified Indiana AGI between
    $18,000 and $18,600 (between $9,000 and $9,300 MFS) — the credit is limited to 50% of the amount by which the
    $18,600 (or $9,300) ceiling exceeds Modified Indiana AGI.
  income_limit_2025: Modified Indiana Adjusted Gross Income must be less than $18,600 (phaseout begins at $18,000);
    married filing separately less than $9,300 (phaseout begins at $9,000).
  claimed_on: 'Form IT-40, Schedule 5: Credits, line 7 (computed via Worksheets A-D in the IT-40 instructions).'
  citation:
    source: 2025 IT-40 Full-Year Resident Individual Income Tax Booklet (Schedule 5, Line 7 — Lake County Residential
      Income Tax Credit, Modified Indiana AGI less than $18,600, maximum $300)
    url: https://forms.in.gov/Download.aspx?id=16915
- name: Indiana529 Education Savings Plan Credit (credit code 837)
  type: nonrefundable
  eligibility: Any Indiana taxpayer who makes a contribution to an Indiana529 (formerly CollegeChoice 529) Education
    Savings Plan account during the tax year; the taxpayer need not be the account owner. You may make a contribution
    before the regular due date of your 2025 tax return (April 15, 2026) and claim the credit for that contribution
    on the 2025 return. Claimed on Schedule IN-529.
  amount: 'The lesser of: 20% of total contributions made for the tax year (including contributions designated for
    K-12 tuition); the taxpayer''s adjusted gross income tax liability reduced by other allowed credits; or the
    cap — $1,500 for single individuals and married couples filing jointly, $750 for a married individual filing
    separately (Income Tax Information Bulletin #98). No carryback, carryforward, or refund of any unused credit.'
  income_limit_2025: No income limit.
  claimed_on: 'Schedule IN-529, with the resulting credit reported on Form IT-40, Schedule 6: Offset Credits (code
    837).'
  citation:
    source: 'Indiana DOR Income Tax Information Bulletin #98, ''Indiana 529 Savings Plan Credit'' (20% of contributions,
      $1,500/$750 cap), corroborated by the 2025 IT-40 booklet''s Indiana529 Education Savings Plan Credit 837 section'
    url: https://www.in.gov/dor/files/ib98.pdf
- name: Adoption Credit
  type: nonrefundable
  eligibility: You are eligible to claim the Indiana adoption credit if you claimed an adoption credit on your federal
    tax return (federal Form 8839). A credit may also be allowed based on a federal adoption credit carryforward
    from the preceding five tax years.
  amount: 20% of the federal adoption credit allowed per child, or $2,500 per child, whichever is less. A credit
    claimed because of a federal carryforward of the adoption credit is likewise limited to $2,500 total per child.
  income_limit_2025: No separate Indiana income limit stated (federal Form 8839 phaseouts apply at the federal level).
  claimed_on: 'Form IT-40, Schedule 5: Credits, line 11 (computed via the Adoption Credit Worksheet in the IT-40
    instructions; keep federal Form 8839 and worksheets with your records).'
  citation:
    source: '2025 IT-40 Full-Year Resident Individual Income Tax Booklet (Schedule 5, Line 11 — Adoption Credit;
      references Income Tax Information Bulletin #111)'
    url: https://forms.in.gov/Download.aspx?id=16915
filing_requirement:
  note: 'A full-year Indiana resident must file Form IT-40 if gross income (the total of all income before deductions)
    was greater than total allowable exemptions. For filing-requirement purposes Indiana allows a $1,000 exemption
    for the taxpayer, $1,000 for the spouse (if married filing jointly), and $1,000 per dependent; if gross income
    is less than total exemptions, no return is required (though one may be filed to claim refunds of withheld state/county
    tax or refundable credits such as the earned income credit or estimated payments). Deceased-taxpayer thresholds:
    file if the deceased was under 65 with gross income more than $1,000, age 65+ with gross income more than $2,000,
    or a nonresident with gross income from Indiana. Part-year residents and nonresidents with Indiana-source income
    file IT-40PNR.'
