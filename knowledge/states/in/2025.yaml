tax:
  citation:
    source: 'Indiana DOR — 2025 Form IT-40 (State Form 154) Line 8 "State adjusted gross income tax: multiply line 7
      by 3% (.03)" (Line 7 = Line 5 minus Line 6 exemptions; Line 1 = federal AGI from Form 1040/1040-SR line 11); 2025
      Schedule 3: Exemptions (State Form 53997, rev 9-25) Lines 1-6. Second pass: the 2026 IN DOR Tax Chapter for the
      2025 Filing Year (www.in.gov, revised Oct 2025) states "Individual Income tax rate is lowered to 3% for tax year
      2025 and 2.95% for tax year 2026", and the 2025 IT-40 booklet''s Credit for Taxes Paid to Other States worksheet
      multiplies by "3% (.03)" — both passes agree.'
    url: https://forms.in.gov/Download.aspx?id=16914
  flat_rate: 0.03
  base: federal_agi
  tax_line: 'IT-40 Line 8: "State adjusted gross income tax: multiply line 7 by 3% (.03)" (Line 7 = Indiana adjusted
    gross income = Line 5 minus Line 6 exemptions; Line 1 starts from federal AGI, Form 1040/1040-SR line 11).'
  exemptions:
    personal:
      amount: 1000
      note: 'Schedule 3 Line 1: $1,000 per taxpayer ($2,000 married filing jointly — $1,000 each spouse). Enter $1,000
        even if claimed as a dependent on someone else''s return.'
    dependent:
      amount: 1000
      note: 'Schedule 3 Line 2: $1,000 per dependent listed on Schedule IN-DEP (enclose Schedule IN-DEP).'
    additional_dependent_child:
      amount: 1500
      note: 'Schedule 3 Line 3: additional $1,500 per qualifying dependent CHILD (son/stepdaughter/foster child/legal-guardian
        child etc., under 19 by Dec. 31, 2025, or a full-time student under 24). NOT applied by calc.state_tax — enter
        it on Schedule 3 Line 3.'
    age_65_or_blind:
      amount: 1000
      note: 'Schedule 3 Line 4: $1,000 per 65-or-older / blind checkbox (taxpayer and spouse each). NOT applied by calc.state_tax.'
    age_65_low_income:
      amount: 500
      note: 'Schedule 3 Line 5: additional $500 per 65-or-older box when IT-40 Line 1 (federal AGI) is under $40,000 (under
        $20,000 married filing separately). NOT applied by calc.state_tax.'
    adopted_child:
      amount: 3000
      note: 'Schedule 3 Line 6: additional $3,000 per adopted child listed on Schedule IN-DEP-A. NOT applied by calc.state_tax.'
  notes:
  - 'Rate is year-specific: 3.00% (.03) applies to tax year 2025 only (2024 was 3.05%, 2026 will be 2.95% — the phased
    cut continues) — never carry any year''s rate to another year.'
  - First-year $3,000 dependent-child amount (instead of $1,500) has NARROWER mechanics than first-year-claimed
    — per the 2025 IT-40 booklet it is allowed only in the first taxable year the additional dependent exemption is
    allowable for that child and "is not permitted if the child could have been claimed for the $1,500 exemption in
    any previous year, regardless of whether the child had been claimed." Decide it on Schedule 3/Schedule IN-DEP,
    not here.
  - Indiana COUNTY income taxes (IT-40 Line 9, Schedule CT-40, per-county rates) are NOT modeled — calc.state_tax
    computes the state 3.00% line only; most Indiana filers also owe a county add-on.
  - Schedule 3 exemption amounts are UNCHANGED from 2024 ($1,000 personal / $1,000 dependent / $1,500 additional dependent
    child / $1,000 age-65-or-blind / $500 low-income 65+ / $3,000 adopted); only the 3.05% -> 3.00% rate changed.
# effective_law_changes — promoted on 2026-08-11 from this pack's own "CHANGED for 2025" header
# note and tax-block prose (DEV_PLAN §7.2). One entry only: the rate step is the pack's single
# law delta, and it is modeled: true because tax.flat_rate IS the changed law. The Indiana EIC
# ceiling move ($66,819 -> $68,650) tracks the federal EIC's annual indexation, not a law change,
# so it gets no entry.
effective_law_changes:
- description: >-
    RATE CUT for tax year 2025 — the state adjusted gross income tax rate drops from 3.05% (2024) to
    3.00% as Indiana's phased reduction continues: the 2025 Form IT-40 Line 8 prints "State adjusted
    gross income tax: multiply line 7 by 3% (.03)", and the IN DOR Tax Chapter for the 2025 filing year
    states "Individual Income tax rate is lowered to 3% for tax year 2025 and 2.95% for tax year 2026".
    Indiana county income taxes (Schedule CT-40) are separate and unaffected.
  status: final_form_published
  affects:
  - tax.flat_rate
  - tax.tax_line
  - Form IT-40 Line 8
  modeled: true
  citation:
    source: >-
      Indiana DOR - 2026 Tax Chapter for the 2025 Filing Year (revised October 2025) — "Individual Income
      tax rate is lowered to 3% for tax year 2025 and 2.95% for tax year 2026" (independent live-host
      confirmation of the 3% rate)
    url: https://www.in.gov/dor/files/tax-chapter.pdf

