# States with no broad personal income tax (dev plan section 6 — the
# "nothing to file" cheap win). A state here means a wage earner who only
# lived/worked there owes no state income-tax return.
#
# Each entry is verifiable at that state's revenue department (no single .gov
# page lists them all); confirm at the cited DOR before relying on it. Caveats
# capture the narrow exceptions (a few states tax investment income or capital
# gains even with no wage tax) so scoping never over-promises "nothing to file".

citation:
  source: "Each state's Department of Revenue (no broad personal income tax); verify per state at the URL listed."
  url: "https://www.irs.gov/businesses/small-businesses-self-employed/state-government-websites"

# Fully no personal income tax (wages, interest, dividends, etc.).
none:
  - { state: AK, dor: "https://tax.alaska.gov" }
  # The Florida Department of Revenue is at floridarevenue.com, not a government host, so the citation is the
  # Florida Constitution itself (read 2026-10-16, two fetches agree on Art. VII, s. 5(a)); state_scope names the
  # revenue site in its reason text (Phase K JK27: the bare .com URL crashed state_scope for every FL resident).
  - state: FL
    dor: "https://floridarevenue.com"
    citation:
      source: "Florida Constitution, Art. VII, s. 5(a), NATURAL PERSONS: \"No tax upon estates or inheritances or upon the income of natural persons who are residents or citizens of the state shall be levied by the state, or under its authority, in excess of the aggregate of amounts which may be allowed to be credited upon or deducted from any similar tax levied by the United States or any state.\""
      url: "https://www.flsenate.gov/Laws/Constitution"
  - { state: NV, dor: "https://tax.nv.gov" }
  - { state: SD, dor: "https://dor.sd.gov" }
  - { state: TX, dor: "https://comptroller.texas.gov" }
  - { state: WY, dor: "https://revenue.wyo.gov" }
  - { state: TN, dor: "https://www.tn.gov/revenue", note: "Hall income tax (interest/dividends) fully repealed effective 2021 — no income tax for 2021+." }

# No tax on WAGES, but a narrow tax on some income — scoping must flag, not skip.
wages_only_exempt:
  # The 2022 tax, its standard deduction and the 2025 tier (ESSB 5813, Chapter 421, Laws of 2025) were read in RCW
  # 82.87.040 / .060 and the DOR notice on 2026-10-16 (Phase K JK5: the note said a flat 7% for every year).
  - state: WA
    dor: "https://dor.wa.gov"
    note: "No personal income tax on wages; a capital-gains excise tax applies to long-term capital gains above an annual standard deduction (tax years 2022+): 7%, and from tax year 2025 an additional 2.9% on taxable gains over $1 million. Flag if the user had large long-term capital gains."
    citations:
      - source: "RCW 82.87.040(1): \"(a) Beginning January 1, 2022, an excise tax is imposed on the sale or exchange of long-term capital assets. Only individuals are subject to payment of the tax, which equals seven percent multiplied by an individual's Washington capital gains. (b) Beginning January 1, 2025, an additional excise tax is imposed on the sale or exchange of long-term capital assets, which equals 2.90 percent multiplied by the portion of an individual's Washington capital gains exceeding $1,000,000.\""
        url: "https://app.leg.wa.gov/RCW/default.aspx?cite=82.87.040"
      - source: "RCW 82.87.060(1): \"A standard deduction of $250,000 per individual, or in the case of spouses or domestic partners, their combined standard deduction is limited to $250,000\"; the amount is adjusted under RCW 82.87.150."
        url: "https://app.leg.wa.gov/RCW/default.aspx?cite=82.87.060"
      - source: "WA Department of Revenue, special notice 'New tiered rates for Washington’s capital gains tax' (issued June 30, 2025): \"Beginning with tax year 2025, Washington’s long-term capital gains tax has a tiered rate.\" \"Your first $1 million in taxable Washington capital gains is subject to tax at a rate of 7%. Any amount of Washington capital gains exceeding $1 million is subject to a 7% tax, plus an additional 2.9% tax.\""
        url: "https://dor.wa.gov/forms-publications/publications-subject/special-notices/new-tiered-rates-washingtons-capital-gains-tax"
  - { state: NH, dor: "https://www.revenue.nh.gov", note: "No tax on wages; an Interest & Dividends Tax applied through 2024 (repealed for 2025+). Flag if the user had significant interest/dividends in 2023/2024." }
