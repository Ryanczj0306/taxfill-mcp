  base: state_taxable_income
  tax_line: 'Form MO-1040 Line 30: ''Tax (see tax chart on page 21 of the instructions)'', computed per column (30Y/30S)
    from Line 29Y/29S. Instructions p.21, ''2025 Tax Chart'': ''To identify your tax, use your Missouri taxable income
    from Form MO-1040, Line 29Y and 29S and the tax chart in Section A below. A separate tax must be computed for
    you and your spouse. Calculate your Missouri tax using the online tax calculator at dor.mo.gov/personal/individual/
    or by using the worksheet in Section B below. Round to the nearest whole dollar and enter on Form MO-1040, Line
    30Y and 30S.'''
  exemptions: {}
  notes:
  - '2025 CHANGES: the top rate fell AGAIN, to 4.7% (2024: 4.8%; 2023: 4.95%), and the chart''s income steps re-indexed
    to $1,313 increments (2024: $1,273) — breakpoints $1,313 / $2,626 / $3,939 / $5,252 / $6,565 / $7,878 / $9,191,
    with the printed constants $26 / $59 / $98 / $144 / $197 / $256. Verified against BOTH the 2025 MO-1040 instructions
    p.21 and the 2025 MO-1040A short-form instructions (identical chart), and corroborated a third time by the booklet''s
    composite-return note ''The tax rate for a composite return is 4.7 percent.'''
  - '2025 BASE CHANGE — NEW 100% CAPITAL GAIN SUBTRACTION (affects the taxable_base you must supply): Form MO-A, Part
    1, Line 18 is new for 2025 — ''The state of Missouri allows a subtraction from your federal adjusted gross income
    for 100 percent of your federally reported capital gains. Enter the amount of capital gains reported on your Federal
    Form 1040 or 1040-SR, Line 7a'' (if Line 7a is negative, enter $0). Total subtractions moved from 2024''s MO-A
    Part 1 Line 18 to 2025''s Line 19, and Form MO-1040 Line 4 now carries MO-A Part 1 Line 19. A 2025 Missouri taxable
    income computed without this subtraction will be OVERSTATED.'
  - 'Base guidance: Supply 2025 Form MO-1040 Line 29 ''Taxable income'' — one column at a time: Line 29Y (yourself)
    or Line 29S (spouse). Line 29 = total Missouri AGI (Line 6, which starts from federal AGI at Line 1 plus Form
    MO-A Part 1 additions at Line 2 and minus Form MO-A Part 1 total subtractions at Line 4, now MO-A Line 19 including
    the new 100% capital gain subtraction) minus total deductions (Line 25 = Line 8 plus Lines 13 through 24: the
    pension/Social Security exemption; the Lines 9-13 FEDERAL INCOME TAX DEDUCTION — Line 11 federal tax x a percentage
    set by Missouri AGI: 35% if Line 6 is $25,000 or less, 25% for $25,001-$50,000, 15% for $50,001-$100,000, 5% for
    $100,001-$125,000, 0% for $125,001 or more, capped at $5,000 per individual / $10,000 married filing combined;
    the Line 14 standard or itemized deduction; the Line 15 $1,400 head-of-household/qualifying-widow(er) exemption;
    and the other deductions on Lines 16-24, with Lines 20, 22, and 23 ''Reserved'' for 2025), giving Line 26; then
    apportioned by each spouse''s income percentage (Line 7Y/7S, applied at Line 27), minus any Line 28 enterprise-zone/rural-empowerment
    modification = Line 29. Single, married filing separately, head of household, and qualifying widow(er) filers
    have one column — supply that Line 29 amount. MARRIED FILING COMBINED: Missouri taxes each spouse''s column separately
    — run this op once with Line 29Y and once with Line 29S and add the two results (Form MO-1040 Lines 30Y + 30S);
    do NOT supply the couple''s combined taxable income as one amount, or the tax will be overstated.'
  - 'One rate schedule for all filing statuses: the 2025 Tax Rate Chart (MO-1040 instructions p.21) makes no distinction
    by filing status, so the identical schedule is shipped for all four statuses. Qualifying widow(er) maps to married_filing_jointly
    here and uses the same chart.'
  - 'CRITICAL for married filing combined: Missouri computes tax SEPARATELY for each spouse — ''A separate tax must
    be computed for you and your spouse'' (instructions p.21). Combined income is split by each spouse''s income percentage
    (Line 7Y/7S, applied at Line 27), producing Line 29Y and 29S, each run through the chart (Line 30Y/30S), then
    added at Line 36. Running a couple''s combined taxable income through the brackets as one amount OVERSTATES tax
    (a second pass through the below-4.7% brackets). Run this op once per spouse''s Line 29 column and sum the results.'
  - 'Printed-constant rounding (quantified for 2025): the chart''s flat add-on constants ($26 / $59 / $98 / $144 /
    $197 / $256) are rounded from the exact cumulative marginal sums ($26.26 / $59.085 / $98.475 / $144.43 / $196.95
    / $256.035); the largest divergence is $0.475 at the $5,252 breakpoint. This op does exact marginal math, so its
    result can differ from the form worksheet''s result by up to ~$1 after rounding. Both agree on the booklet''s
    own worked examples (Example A, taxable income $3,090: worksheet 26 + 11.60 = 37.60 -> 38, exact marginal 26.26
    + 11.60 = 37.86 -> 38; Example B, $12,000: worksheet 256 + 132.03 = 388.03 -> 388, exact marginal 256.035 + 132.023
    = 388.058 -> 388). Where they can split is a top-bracket amount whose exact total lands on a .50 tie (exact =
    printed + $0.035 there), e.g. taxable income $9,286: exact 260.50 -> 261 while the worksheet''s 256 + 4.465 =
    260.465 -> 260. The filed return should use the p.21 Tax Calculation Worksheet''s printed constants or the DOR
    online calculator at dor.mo.gov/personal/individual/.'
  - 'Federal income tax deduction (Missouri base quirk, NOT modeled): MO-1040 Lines 9-13 deduct Line 11 federal income
    tax times a Missouri-AGI-based percentage (Line 12 chart: 35% if Line 6 is $25,000 or less; 25% $25,001-$50,000;
    15% $50,001-$100,000; 5% $100,001-$125,000; 0% $125,001 or more), capped at $5,000 per individual / $10,000 married
    filing combined. Because it is income-dependent it is not modeled — it must already be reflected in the Line 29
    taxable income you supply.'
  - 'standard_deduction ships as null because the base is Line 29 taxable income, from which the Line 14 deduction
    was already subtracted — do not subtract it again. For reference, 2025 Missouri standard deductions (printed on
    Form MO-1040 Line 14): $15,750 single or married filing separate; $23,625 head of household; $31,500 married filing
    combined or qualifying widow(er). Additional standard deduction for each 65-or-older or blind condition (Line
    14 instructions, CHANGED for 2025): $2,000 for single and head of household (2024: $1,950); $1,600 for married
    filing combined, married filing separately, or qualifying widow(er) (2024: $1,550). A net qualified disaster loss
    increase to the federal standard deduction increases the Missouri one by the same amount (paper filing required).
    Itemizers use Form MO-A Part 2 instead — note the 2025 MO-A Part 2 worksheet trigger at federal Schedule A Line
    5d over $40,000 ($20,000 MFS) or federal Form 1040 Line 11a over $500,000 ($250,000 MFS).'
  - 'Head of household / qualifying widow(er) additional exemption: $1,400 on MO-1040 Line 15 (unchanged for 2025)
    — a base reduction already included in the Line 29 base, so it is not shipped; the Missouri filing status must
    match the federal filing status to claim it.'
  - The 2025 MO-1040 has NO personal or dependent exemption lines — exemptions is intentionally empty; exemptions_count
    and dependents_count have no effect for Missouri.
  - 'Zero-rate floor: Missouri taxable income of $0 to $1,313 owes $0 (shipped as a rate-''0'' bottom bracket); the
    state is graduated, not flat, for 2025.'
  - 'Rounding rule (instructions ''Dollars and Cents'': ''For 1 cent through 49 cents, round down to the previous
    whole dollar amount. For 50 cents through 99 cents, round up to the next whole dollar amount'', with the booklet''s
    own examples ''Round $32.49 down to $32.00'' and ''Round $32.50 up to $33.00'') — matches the engine''s half-up
    rounding, and vector 1 below is the exact .50 half-up tie.'
  - 'No lookup-table mandate: Missouri publishes no tax table; all filers compute Line 30 from the Tax Rate Chart
    / Tax Calculation Worksheet (Section B) or the DOR online calculator.'
  - 'Not modeled — MO-1040 Line 34 other taxes: tax on lump-sum distributions (10% of the tax shown on Federal Form
    4972) and recapture of low income housing credits (Federal Form 8611); these are added after Line 30 on the form.'
  - 'Not modeled — apportionment and credits after Line 30: nonresidents/part-year residents multiply Line 30 by the
    Missouri income percentage (Line 32, Form MO-NRI), and residents may take the resident credit for taxes paid to
    other states (Line 31, Form MO-CR); this op produces the pre-apportionment Line 30 amount. Also not modeled (they
    are CREDITS against tax, not base reductions): Property Tax Credit (Line 43 for 2025, renumbered from 2024''s
    Line 45; Form MO-PTS), Missouri Working Family Tax Credit (Line 44, Form MO-WFTC — still 20% of the federal EIC),
    and miscellaneous credits (Line 42 for 2025, renumbered from 2024''s Line 43; Form MO-TC).'
  - This pack follows the 2025 Form MO-1040 long form; the MO-1040A short form uses the same 2025 Tax Chart (its instructions
    were the second-pass source) but has its own line layout.
# effective_law_changes promoted 2026-08-11 from this pack's OWN prose (the HEADLINE 2025
# CHANGES header comment and the tax notes '2025 CHANGES' / '2025 BASE CHANGE') per
# DEV_PLAN §7.2 — no new research. The rate cut is modeled: true (it IS the shipped
# tax.brackets top rate); the new 100% capital gain subtraction is modeled: false because it
# is a base reduction the caller must already have folded into the supplied Line 29 taxable
# income. Credit-line renumbering (MO-TC to Line 42, Property Tax Credit to Line 43) and the
# annual standard-deduction figures are form/inflation movement, not law changes.
effective_law_changes:
- description: >-
    Missouri's TOP INDIVIDUAL RATE was cut AGAIN for tax year 2025, to 4.7% (2024: 4.8%; 2023:
    4.95%), with the 2025 Tax Chart's income steps re-indexed to $1,313 increments (2024:
    $1,273) — breakpoints $1,313 / $2,626 / $3,939 / $5,252 / $6,565 / $7,878 / $9,191 and
    printed constants $26 / $59 / $98 / $144 / $197 / $256, the top bracket reading "over
    $9,191 -> $256 plus 4.7% of the excess over $9,191". Verified against both the 2025 MO-1040
    instructions p.21 and the identical 2025 MO-1040A chart, and corroborated a third time by
    the booklet's composite-return note, "The tax rate for a composite return is 4.7 percent."
    Missouri remains graduated, not flat, with a 0% band up to $1,313.
  status: final_form_published
  affects:
  - tax.brackets
  - Form MO-1040 Line 30 (30Y/30S)
  modeled: true
  citation:
    source: >-
      2025 Form MO-1040 Individual Income Tax Long Form & Instructions (Line 1 = Federal AGI;
      Form MO-A Part 1 additions Lines 1-6 and the NEW Line 18 capital gain subtraction with
      total subtractions at Line 19; residency/domicile definitions incl. 183-day
      statutory-resident and 30-day exception rules; filing requirement thresholds
      $1,200/$600/standard deduction; April 15, 2026 due date; mailing addresses incl. 2-D
      barcode boxes; Nonresident Alien instructions Line 1 = 1040NR Line 11a; rounding rule
      'Round $32.50 up to $33.00'; 2025 Tax Chart p.21; Line 12 Federal Tax Percentage chart;
      Line 14 standard deductions $15,750/$23,625/$31,500 with $2,000/$1,600 additional amounts;
      Line 15 $1,400 head-of-household/qualifying-widow(er) exemption; Line 42 MO-TC; Line 43
      Property Tax Credit; Line 44 WFTC 20%; composite-return rate 4.7%)
    url: https://dor.mo.gov/forms/MO-1040%20Instructions_2025.pdf
- description: >-
    NEW for 2025 — a 100% CAPITAL GAIN SUBTRACTION on Form MO-A, Part 1, Line 18: "The state of
    Missouri allows a subtraction from your federal adjusted gross income for 100 percent of
    your federally reported capital gains. Enter the amount of capital gains reported on your
    Federal Form 1040 or 1040-SR, Line 7a" (enter $0 if Line 7a is negative). Total Form MO-A
    Part 1 subtractions moved from 2024's Line 18 to 2025's Line 19, and Form MO-1040 Line 4 now
    carries MO-A Part 1 Line 19. A 2025 Missouri taxable income computed without this
    subtraction will be OVERSTATED.
