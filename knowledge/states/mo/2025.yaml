    source: '2025 Form MO-1040 Individual Income Tax Long Form Instructions, Missouri Department of Revenue — p.21 ''2025
      Tax Chart'' (Tax Rate Chart, Section A: $0 to $1,313 -> $0; over $1,313 not over $2,626 -> 2.0% of the excess
      over $1,313; over $2,626 not over $3,939 -> $26 plus 2.5%; over $3,939 not over $5,252 -> $59 plus 3.0%; over
      $5,252 not over $6,565 -> $98 plus 3.5%; over $6,565 not over $7,878 -> $144 plus 4.0%; over $7,878 not over $9,191
      -> $197 plus 4.5%; over $9,191 -> $256 plus 4.7% of the excess over $9,191; ''A separate tax must be computed
      for you and your spouse''; ''Round to the nearest whole dollar and enter on Form MO-1040, Line 30Y and 30S'');
      Line 30 - Missouri Tax (''Calculate your tax by using your taxable income from Form MO-1040, Line 29Y and 29S,
      the Tax Rate Chart (page 21, Section A), and Tax Calculation Worksheet (page 21, Section B)''); Line 12 Federal
      Tax Percentage chart; Line 13 federal income tax deduction caps; Line 14 standard deduction ($15,750/$23,625/$31,500);
      Line 15 head of household / qualifying widow(er) $1,400. Second pass: the 2025 Form MO-1040A short-form instructions
      print the IDENTICAL 2025 Tax Rate Chart and Tax Calculation Worksheet (https://dor.mo.gov/forms/MO-1040A%20Instructions_2025.pdf)
      — both passes agree digit for digit. Third corroboration of the top rate: the booklet''s composite-return note,
      ''The tax rate for a composite return is 4.7 percent.'''
