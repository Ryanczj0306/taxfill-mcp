# MO state knowledge — tax year 2025. Fetched + cited from the MO DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 Form MO-1040
# instruction booklet, then independently re-derived from a second official document —
# the 2025 Form MO-1040A short-form instructions, which print the IDENTICAL 2025 Tax Rate
# Chart and Tax Calculation Worksheet — plus the booklet's own composite-return statement
# ('The tax rate for a composite return is 4.7 percent') as a third corroboration of the
# top rate. Resolutions recorded inline where the passes differed.
# HEADLINE 2025 CHANGES: top individual rate cut AGAIN, to 4.7% (2024: 4.8%; 2023: 4.95%),
# with the tax-chart income steps re-indexed to $1,313 increments (2024: $1,273); a NEW
# 100%-of-federally-reported CAPITAL GAIN SUBTRACTION on Form MO-A, Part 1, Line 18 (total
# subtractions moved from 2024's MO-A Line 18 to 2025's MO-A Line 19, and Form MO-1040 Line 4
# now comes from MO-A Part 1 Line 19); standard deduction $15,750 single/MFS, $23,625 head of
# household, $31,500 married filing combined or qualifying widow(er), with the additional
# 65-or-older/blind amount now $2,000 single/HoH and $1,600 MFC/MFS/QW (2024: $1,950/$1,550);
# MO-1040 credit lines renumbered (Miscellaneous credits MO-TC now Line 42, Property Tax
# Credit now Line 43 — 2024 was 43/45 — Working Family Tax Credit stays Line 44), and
# deduction Lines 20, 22, and 23 are 'Reserved'. The Working Family Tax Credit remains 20%
# of the federal EIC.
jurisdiction: states/mo
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Missouri''s resident return starts from federal adjusted gross income and has no treaty-exempt income
  add-back, so federally treaty-exempt income (already excluded from federal AGI) flows through untaxed -> conforms.
  Form MO-1040 Line 1 is captioned "Federal adjusted gross income from federal return," and the 2025 MO-1040 instructions
  state "You must begin your Missouri return with your total federal adjusted gross income, even if you have income
  from a state other than Missouri." The only additions to federal AGI are on Form MO-A, Part 1, Lines 1-6 (interest
  on state and local obligations other than Missouri source; partnership/fiduciary/S-corp adjustments; nonqualified
  529-plan distributions; Food Pantry contributions included on federal Schedule A; nonresident property tax modification;
  nonqualified ABLE-program distributions) — none of which add back federally treaty-exempt income or foreign-earned
  income. Corroborating: the 2025 "Nonresident Alien Special Filing Instructions" direct the filer to "Enter your
  federal adjusted gross income from U.S. Nonresident Alien Income Tax Return (Federal Form 1040NR), Line 11a, on
  Form MO-1040, Line 1," meaning treaty-exempt income already excluded from 1040NR AGI carries to MO Line 1 unchanged
  with no reattachment. Unlike California (which adds treaty income back on Schedule CA), Missouri has no analogous
  addback. Cite: 2025 MO-1040 Instructions, Line 1 and Form MO-A Part 1.'
