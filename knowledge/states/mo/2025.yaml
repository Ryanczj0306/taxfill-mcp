  filers, federal 1040NR Line 11a)
residency:
  summary: 'A Missouri resident is an individual who either (1) maintained a domicile in Missouri, or (2) did not
    maintain a domicile in Missouri but did have permanent living quarters and spent more than 183 days of the taxable
    year in Missouri (statutory-resident rule). Exception: an individual domiciled in Missouri who did not maintain
    permanent living quarters in Missouri, did maintain permanent living quarters elsewhere, and spent 30 days or
    less of the taxable year in Missouri is NOT a resident. "Domicile" is the place an individual intends to be his
    or her permanent home, a place he or she intends to return to when absent; once established it continues until
    the individual moves to a new location with the true intention of making a permanent home there, and an individual
    can have only one domicile at a time. A nonresident is an individual who does not meet the definition of resident;
    if required to file, nonresidents with income from another state must use Form MO-NRI (Missouri Income Percentage)
    to determine income percentages. A part-year resident is taxed on all income earned while living in Missouri
    and may either elect to be taxed as a full-year resident using Form MO-CR (credit for taxes paid to other states)
    or use Form MO-NRI (Missouri income percentage), whichever is more beneficial. Form MO-CR and Form MO-NRI may
    not be used by the same taxpayer on Form MO-1040, but on a combined return one spouse may use MO-NRI and the
    other MO-CR.'
forms:
  resident: Form MO-1040 (2025 Individual Income Tax Return - Long Form). The same MO-1040 is used by all filers;
    residents claiming credit for taxes paid to another state attach Form MO-CR. (A short Form MO-1040A exists for
    single / married-one-income filers with no Missouri modifications.)
  part_year_or_nonresident: Form MO-NRI (Missouri Income Percentage), filed with Form MO-1040, for nonresidents
    and part-year residents (the percentage goes on MO-1040 Line 32). Part-year residents may alternatively use
    Form MO-CR (resident credit, Line 31) with MO-1040, whichever is more beneficial.
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Property Tax Credit Claim (Circuit Breaker)
  type: refundable
  eligibility: 'Missouri residents who fall into one of four qualification categories (2025 Form MO-PTS): (A) 65
    years of age or older and a full-year MO resident (attach Form SSA-1099); (B) 100% disabled veteran as a result
    of military service (attach a letter from the Department of Veterans Affairs); (C) 100% disabled (attach an SSA
    letter or Form SSA-1099); or (D) 60 years of age or older and received surviving spouse benefits (attach Form
    SSA-1099). Available to both renters/part-year owners and full-year homeowners. Renters who rent from a facility
    that does not pay property tax are not eligible.'
  amount: Credit based on real estate tax or rent paid and net household income, per the official Property Tax Credit
    Chart (2025 instructions pp.50-52). Maximum is $750 for rent paid (MO-PTS Line 12, total MO-CRP Line 9 amounts
    or $750, whichever is less) and $1,100 for property tax paid (Line 11), with a combined Line 13 cap of $1,100.
  income_limit_2025: 'Net household income (MO-PTS Line 10, after the Line 9 deduction of $0 single or married living
    separate / $2,000 married filing combined renting or not owning the whole year / $4,000 married filing combined
    owning and occupying the whole year): renters or part-year owners — $27,200 or less; owners who occupied the
    home the entire year — $30,000 or less. Above the applicable limit you are not eligible to file the claim.'
  claimed_on: Form MO-PTS attached to Form MO-1040 (credit carried to Form MO-1040, Line 43 — renumbered from 2024's
    Line 45); or standalone Form MO-PTC if not required to file an income tax return.
  citation:
    source: Missouri Department of Revenue - 2025 Form MO-1040 instruction booklet, Form MO-PTS section (Qualifications
      A-D; Lines 9-14; $27,200/$30,000 net-household-income limits; $750 rent / $1,100 combined caps) and 2025 Property
      Tax Credit Chart pp.50-52
    url: https://dor.mo.gov/forms/MO-1040%20Instructions_2025.pdf
- name: Missouri Working Family Tax Credit (state EITC)
  type: nonrefundable
  eligibility: Resident individual who was allowed a federal earned income credit (EIC) on the federal return for
    the same tax year; filing status must be single, head of household, qualifying widow(er), or married filing
    combined (married filing separately does not qualify); must have a tax liability after the application of all
    other credits. Form MO-WFTC and a copy of the federal return must be attached or the credit may be disallowed.
  amount: '20 percent of what the taxpayer''s federal earned income credit (EIC) would be under the EIC law as of
    January 1, 2021 (2025 instructions, Line 44: "The Missouri Working Family Tax Credit (WFTC) is a credit for
    20 percent of what your federal earned income credit (EIC) would be under the EIC law as of January 1, 2021").
    Unchanged from 2024 (it was 10 percent in 2023). Limited to remaining MO tax liability; cannot be refunded.'
  income_limit_2025: No separate state income limit beyond federal EIC eligibility.
  claimed_on: Form MO-WFTC (2025 booklet p.43), carried to Form MO-1040, Line 44.
  citation:
    source: Missouri Department of Revenue - 2025 Form MO-1040 instruction booklet, Line 44 Missouri Working Family
      Tax Credit and Form MO-WFTC
    url: https://dor.mo.gov/forms/MO-1040%20Instructions_2025.pdf
- name: Food Pantry / Homeless Shelter / Soup Kitchen Tax Credit
  type: nonrefundable
  eligibility: Any taxpayer (individual, corporation, or trust) who donates cash or food supplies to a local food
    pantry, homeless shelter, or soup kitchen in the county where the taxpayer resides. If the donation is also
    reported as a federal Schedule A charitable contribution, the amount must be added back on Form MO-A, Part 1,
    Line 4 (2025 MO-A Line 4, 'Food Pantry contributions included on Federal Schedule A'). Program sunsets December
    31, 2026 (fully terminates September 1, 2027), so tax year 2025 is still within the program.
  amount: 50 percent of donations, up to $2,500 per taxpayer per year. Limited to the taxpayer's tax liability;
    excess may be carried forward three subsequent years. Subject to a cumulative statewide cap of $1,750,000 per
    fiscal year (credits apportioned if claims exceed the cap; returns claiming it must be filed July 1 through
    April 15).
  income_limit_2025: No income limit.
  claimed_on: Form MO-FPT, claimed through Form MO-TC (2025 Miscellaneous Income Tax Credits, credit code FPT),
    carried to Form MO-1040, Line 42 (renumbered from 2024's Line 43).
  citation:
    source: Missouri Department of Revenue - Food Pantry Tax Credit (FPT) program page and 2025 MO-1040 instruction
      booklet (Form MO-A Part 1 Line 4; Form MO-TC credit code FPT / Form MO-FPT)
    url: https://dor.mo.gov/tax-credits/fpt.html
filing_requirement:
  note: 'Per the 2025 MO-1040 instructions: you do not have to file a Missouri return if you are not required to
    file a federal return. If required to file a federal return, you may still not have to file a Missouri return
    if you (a) are a resident and have less than $1,200 of Missouri adjusted gross income; (b) are a nonresident
    with less than $600 of Missouri income; or (c) have Missouri adjusted gross income less than the amount of your
    standard deduction for your filing status. (If not required to file but a Form W-2 shows Missouri tax withheld,
    file to claim a refund.)'
