tax:
  citation:
    source: '2024 Form MO-1040 Individual Income Tax Long Form Instructions, Missouri Department of Revenue — p.26 ''2024
      Tax Chart'' (Tax Rate Chart, Section A: $0 to $1,273 -> $0; over $1,273 not over $2,546 -> 2.00% of excess over
      $1,273; over $2,546 not over $3,819 -> $25 + 2.50%; over $3,819 not over $5,092 -> $57 + 3.00%; over $5,092 not
      over $6,365 -> $95 + 3.50%; over $6,365 not over $7,638 -> $140 + 4.00%; over $7,638 not over $8,911 -> $191 +
      4.50%; over $8,911 -> $248 + 4.80% of excess over $8,911; ''A separate tax must be computed for you and your spouse'';
      ''Round to the nearest whole dollar and enter on Form MO-1040, Line 30Y and 30S''); Line 30 ''Tax (see tax chart
      on page 26 of the instructions)''; Line 12 Federal Tax Percentage chart; Line 13 federal income tax deduction
      caps; Line 14 standard deduction; Line 15 head of household / qualifying widow(er) $1,400. Second pass: the 2024
      Form MO-1040A short-form instructions print the IDENTICAL 2024 Tax Rate Chart and Tax Calculation Worksheet (p.10)
      — both passes agree.'
