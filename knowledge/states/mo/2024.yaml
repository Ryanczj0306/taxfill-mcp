residency:
  summary: 'A Missouri resident is an individual who either (1) maintained a domicile in Missouri, or (2) did not
    maintain a Missouri domicile but had permanent living quarters in Missouri and spent more than 183 days of the
    taxable year in Missouri (statutory-resident rule). Exception: an individual domiciled in Missouri who did not
    maintain permanent living quarters in Missouri, did maintain permanent living quarters elsewhere, and spent
    30 days or less of the taxable year in Missouri is NOT a resident. "Domicile" is the place an individual intends
    to be his or her permanent home, a place he or she intends to return to when absent; once established it continues
    until the individual moves to a new location with the true intention of making a permanent home there, and an
    individual can have only one domicile at a time. A nonresident is an individual who does not meet the definition
    of resident; if required to file, nonresidents with income from another state must use Form MO-NRI (Missouri
    Income Percentage) to determine income percentages. A part-year resident (one who establishes or changes Missouri
    domicile during the year) is taxed on all income earned while living in Missouri and may either elect to be
    taxed as a full-year resident using Form MO-CR (credit for taxes paid to other states) or use Form MO-NRI (Missouri
    income percentage), whichever is more beneficial.'
forms:
  resident: Form MO-1040 (Individual Income Tax Long Form). The same MO-1040 is used by all filers; residents claiming
    credit for taxes paid to another state attach Form MO-CR. (A short Form MO-1040A exists for single / married-one-income
    filers with no Missouri modifications.)
  part_year_or_nonresident: Form MO-NRI (Missouri Income Percentage), filed with Form MO-1040, for nonresidents
    and part-year residents. Part-year residents may alternatively use Form MO-CR (resident credit) with MO-1040,
    whichever is more beneficial.
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Property Tax Credit Claim (Circuit Breaker)
  type: refundable
  eligibility: 'Missouri residents who fall into one of four qualification categories (2024 Form MO-PTS): (A) age
    65 or older and a full-year MO resident; (B) 100% disabled veteran as a result of military service; (C) 100%
    disabled (per SSA letter or Form SSA-1099); or (D) age 60 or older and receiving surviving spouse Social Security
    benefits. Available to both renters/part-year owners and full-year homeowners. Renters who rent from a facility
    that does not pay real estate tax are not eligible.'
  amount: Credit based on real estate tax or rent paid and net household income, per the official Property Tax Credit
    Chart (2024 instructions pp.50-52). Maximum is $750 for rent paid (MO-PTS Line 12, total MO-CRP Line 9 amounts
    or $750, whichever is less) and $1,100 for property tax paid (Line 11), with a combined Line 13 cap of $1,100.
  income_limit_2024: 'Net household income (MO-PTS Line 10, after the Line 9 deduction of $0 single / $2,000 married
    filing combined renting / $4,000 married filing combined owning): renters or part-year owners — $27,200 or less;
    owners who occupied the home the entire year — $30,000 or less. Above the applicable limit, not eligible.'
  claimed_on: Form MO-PTS attached to Form MO-1040 (credit carried to Form MO-1040, Line 45); or standalone Form
    MO-PTC if not required to file an income tax return.
  citation:
    source: Missouri Department of Revenue - 2024 Form MO-1040 instruction booklet, Form MO-PTS section (Qualifications
      A-D; Lines 9-14; $27,200/$30,000 net-household-income limits; $750 rent / $1,100 combined caps) and 2024 Property
      Tax Credit Chart pp.50-52
    url: https://dor.mo.gov/forms/MO-1040%20Instructions_2024.pdf
- name: Missouri Working Family Tax Credit (state EITC)
  type: nonrefundable
  eligibility: Resident individual who was allowed a federal earned income credit (EIC) on the federal return for
    the same tax year; filing status must be single, head of household, qualifying widow(er), or married filing
    combined (married filing separately does not qualify); must have a tax liability remaining after the application
    of all other credits. Form MO-WFTC and a copy of the federal return must be attached or the credit may be disallowed.
  amount: 'NEW FOR 2024: 20 percent (up from 10 percent in 2023) of what the taxpayer''s federal earned income credit
    would be under the EIC law as of January 1, 2021 (2024 instructions, Line 44: "The Missouri Working Family Tax
    Credit (WFTC) is a credit for 20 percent of what your federal earned income credit (EIC) would be under the
    EIC law as of January 1, 2021"). Limited to remaining MO tax liability; cannot be refunded.'
  income_limit_2024: No separate state income limit beyond federal EIC eligibility.
  claimed_on: Form MO-WFTC (2024 booklet pp.37-38), carried to Form MO-1040, Line 44.
  citation:
    source: Missouri Department of Revenue - 2024 Form MO-1040 instruction booklet, Line 44 Missouri Working Family
      Tax Credit and Form MO-WFTC
    url: https://dor.mo.gov/forms/MO-1040%20Instructions_2024.pdf
- name: Food Pantry / Homeless Shelter / Soup Kitchen Tax Credit
  type: nonrefundable
  eligibility: Any taxpayer (individual, corporation, or trust) who donates cash or food supplies to a local food
    pantry, homeless shelter, or soup kitchen in the county where the taxpayer resides. If the donation is also
    reported as a federal Schedule A charitable contribution, the amount must be added back on Form MO-A, Part 1,
    Line 4. Program sunsets December 31, 2026 (fully terminates September 1, 2027).
  amount: 50 percent of donations, up to $2,500 per taxpayer per year. Limited to the taxpayer's tax liability;
    excess may be carried forward three subsequent years. Subject to a cumulative statewide cap of $1,750,000 per
    fiscal year (credits apportioned if claims exceed the cap; returns claiming it must be filed July 1 through
    April 15).
  income_limit_2024: No income limit.
  claimed_on: Form MO-FPT, claimed through Form MO-TC (Miscellaneous Income Tax Credits), carried to Form MO-1040,
    Line 43.
  citation:
    source: Missouri Department of Revenue - Food Pantry Tax Credit (FPT) program page and 2024 MO-1040 instruction
      booklet (Form MO-A Part 1 Line 4; MO-TC credit code FPT)
    url: https://dor.mo.gov/tax-credits/fpt.html
filing_requirement:
  note: 'Per the 2024 MO-1040 instructions: you do not have to file a Missouri return if you are not required to
    file a federal return. If required to file a federal return, you may still not have to file a Missouri return
    if you (a) are a resident with less than $1,200 of Missouri adjusted gross income; (b) are a nonresident with
    less than $600 of Missouri income; or (c) have Missouri adjusted gross income less than the amount of your standard
    deduction for your filing status. (If not required to file but Missouri tax was withheld, file to claim a refund.)'
