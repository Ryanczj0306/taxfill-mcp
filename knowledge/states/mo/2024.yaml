# MO state knowledge — tax year 2024. Fetched + cited from the MO DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form MO-1040
# instruction booklet, then independently re-derived from a second official document
# (the 2024 Form MO-1040A short-form instructions, which print the identical 2024 Tax
# Chart, or the DOR program pages) — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGES: top individual rate cut to 4.8% (from 4.95%) with the tax-chart
# income steps re-indexed to $1,273 increments (2023: $1,207); Working Family Tax Credit
# doubled to 20% of the federal EIC (2023: 10%).
jurisdiction: states/mo
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Missouri''s resident return starts from federal adjusted gross income and has no treaty-exempt income
  add-back, so federally treaty-exempt income (already excluded from federal AGI) flows through untaxed -> conforms.
  Form MO-1040 Line 1 is captioned "Federal adjusted gross income," and the 2024 MO-1040 instructions state "You
  must begin your Missouri return with your total federal adjusted gross income, even if you have income from a
  state other than Missouri." The only additions to federal AGI are on Form MO-A, Part 1, Lines 1-6 (interest on
  state and local obligations other than Missouri source; partnership/fiduciary/S-corp/business-interest/NOL adjustments;
  nonqualified 529-plan distributions; Food Pantry contributions included on federal Schedule A; nonresident property
  tax modification; nonqualified ABLE-program distributions) — none of which add back federally treaty-exempt income
  or foreign-earned income. Corroborating: the "Nonresident Alien" special filing instructions direct the filer
  to "Enter your federal adjusted gross income from U.S. Nonresident Alien Income Tax Return (Federal Form 1040NR),
  Line 11, on Form MO-1040, Line 1," meaning treaty-exempt income already excluded from 1040NR AGI carries to MO
  Line 1 unchanged with no reattachment. Unlike California (which adds treaty income back on Schedule CA), Missouri
  has no analogous addback. Cite: 2024 MO-1040 Instructions, Line 1 and Form MO-A Part 1.'
