unverified:
- 'TREATY CONFORMITY: No .gov page confirms whether income exempt under a U.S. income-tax TREATY is excluded for
  Alabama purposes. Alabama does not start from federal AGI, and the only foreign-income mechanism the Form 40NR
  booklet describes is the IRC sec. 911 foreign EARNED income exclusion (claimed via a negative-line credit with
  federal Form 2555), with an explicit instruction that ''all foreign income must be reported.'' Whether treaty-exempt
  wages must be included in Alabama wages, or whether a treaty exclusion is honored, COULD NOT be confirmed and
  should be confirmed with the Alabama DOR before relying on conformity. conforms_to_federal_treaties was set false
  on the conservative basis that no pass-through/exclusion for treaty income is established.'
- The April 15, 2024 due date for the 2023 return is inferred from the .gov rule 'due the same date as the federal
  return / April 15th unless a weekend or holiday' (April 15, 2024 was a Monday and the federal deadline). No .gov
  page was found stating the literal string '2024-04-15' for the 2023 tax year.
- The Form 40NR booklet text could only be read reliably for pp.1-12; the page-4 filing-threshold chart shows the
  listed dollar amounts for full-year and part-year residents, but the standalone resident Form 40 instruction booklet's
  identical thresholds were not separately fetched (same amounts are standard and reflected on the 40NR chart).
- 'The 23f40nrbk.pdf booklet (Where To File, p.11) lists a third address for ''not receiving a refund or making
  a payment'': P.O. Box 327469, Montgomery, AL 36132-7469. The official Forms Mailing Addresses page consolidates
  refund/no-payment to P.O. Box 154 (36135-0001); the no-payment-no-refund Box 327469 variant from the booklet was
  not reconciled with the mailing-addresses page and should be confirmed.'
- Form 40A short-form eligibility details summarized from the 40NR booklet's 'Which Form To File' cross-reference,
  not from a separately fetched 2023 Form 40A booklet.
tax:
  citation:
    source: 2023 Alabama Form 40 Booklet (Individual Income Tax — Long Return, Residents and Part-Year Residents) —
      Tax Table pp. 25-30 (based on Form 40 line 16 taxable income; one column for Single/Married-filing-separately/Head-of-Family,
      one for Married-filing-jointly) and 'Over $100,000.00' worksheet, p. 30 (tax = $4,958.00 [Single/MFS/HoF] or $4,918.00
      [MFJ] plus .05 x taxable income over $100,000); Standard Deduction chart p. 9; dependent-exemption chart p. 8;
      personal exemption printed on Form 40 filing-status boxes 1-4. Rate schedule text (2% first $500/$1,000, 4% next
      $2,500/$5,000, 5% over $3,000/$6,000) corroborated by ADOR FAQ 'What is Alabama's Individual Income Tax Rate?'
      (revenue.alabama.gov/faqs/what-is-alabamas-individual-income-tax-rate/).
    url: https://www.revenue.alabama.gov/wp-content/uploads/2024/01/23f40bk.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 500, rate: 0.02}
    - {over: 500, but_not_over: 3000, rate: 0.04}
    - {over: 3000, but_not_over: null, rate: 0.05}
    married_filing_jointly:
    - {over: 0, but_not_over: 1000, rate: 0.02}
    - {over: 1000, but_not_over: 6000, rate: 0.04}
    - {over: 6000, but_not_over: null, rate: 0.05}
    married_filing_separately:
    - {over: 0, but_not_over: 500, rate: 0.02}
    - {over: 500, but_not_over: 3000, rate: 0.04}
    - {over: 3000, but_not_over: null, rate: 0.05}
    head_of_household:
    - {over: 0, but_not_over: 500, rate: 0.02}
    - {over: 500, but_not_over: 3000, rate: 0.04}
    - {over: 3000, but_not_over: null, rate: 0.05}
  base: state_taxable_income
  tax_line: 'Form 40, line 17: ''Income Tax due. Enter amount from tax table or check if from Form NOL-85A'' (line
    16: ''Taxable income. Subtract line 15 from line 10.''); booklet Line 17 instructions: ''You must figure your
    tax from the Tax Tables unless you are claiming a carryover or carryback Net Operating Loss from another year.'''
  exemptions: {}
  notes:
  - 'Base guidance: Supply 2023 Alabama Form 40, page 1, line 16 ''Taxable income. Subtract line 15 from line 10.''
    Alabama does NOT start from federal AGI: line 10 Alabama adjusted gross income is built from Alabama line items
    (line 8 total income minus line 9 adjustments), and line 15 total deductions = line 11 (itemized OR sliding standard
    deduction) + line 12 (FEDERAL income tax deduction, from the Federal Income Tax Deduction Worksheet) + line 13
    (personal exemption $1,500/$3,000) + line 14 (income-dependent dependent exemption). All of those subtractions
    must already be taken on the form before line 16 — this op subtracts nothing further.'
  - 'Tax-table mandate: the 2023 Form 40 booklet (Line 17 instructions) states ''You must figure your tax from the
    Tax Tables unless you are claiming a carryover or carryback Net Operating Loss from another year.'' The Tax Table
    (booklet pp. 25-30) covers taxable income under $100,000 in bands (mostly $100 wide) priced at the band midpoint,
    so bracket math may differ by a few dollars within table bands; the filed form must use the table.'
  - 'Over $100,000: the booklet''s worksheet (p. 30) computes tax as $4,958.00 (Single/MFS/Head of Family) or $4,918.00
    (MFJ) plus 5% of taxable income over $100,000. Those printed constants are each $2 LESS than the exact cumulative
    bracket sums ($4,960 / $4,920) because they carry forward the last tax-table row''s midpoint value; above $100,000
    the tax the form produces is therefore $2 lower than pure bracket math.'
  - 'Alabama does not start from federal AGI: Form 40 income is built from Alabama line items (line 8 total income,
    line 9 adjustments, line 10 Alabama AGI). Supply line 16 exactly as computed on the form.'
  - 'FEDERAL income tax deduction quirk: Alabama allows a base deduction for federal income tax liability (Form 40
    line 12; Federal Income Tax Deduction Worksheet, booklet p. 31: 2023 Form 1040/1040-SR/1040-NR line 22 plus Form
    8960 line 17 net investment income tax, minus refundable EIC, Additional Child Tax Credit, American Opportunity
    Credit, and Form 2439 credits). It is already inside the line 16 base this op consumes — do not re-subtract it.'
  - 'standard_deduction is NOT shipped because Alabama''s standard deduction slides with Alabama AGI (booklet p. 9
    chart, per Act 2022-292 amounts): MFJ $8,500 (AL AGI $0-$25,999) phasing down to $5,000 at $35,500 and above;
    MFS $4,250 ($0-$12,999) down to $2,500 at $17,750 and above; Head of Family $5,200 ($0-$25,999) down to $2,500
    at $35,500 and above; Single $3,000 ($0-$25,999) down to $2,500 at $35,500 and above. Take it from the chart on
    Form 40 line 11; it is already inside line 16.'
  - Personal exemption (Form 40 line 13) is $1,500 (Single or Married Filing Separately) / $3,000 (Married Filing
    Jointly or Head of Family), printed on the Form 40 filing-status boxes 1-4. It is a base reduction, but it is
    already inside the line 16 base this op consumes, so it is NOT shipped as an engine exemption.
  - 'Dependent exemption (Form 40 line 14) is income-dependent and NOT shipped: $1,000 per dependent when Alabama
    AGI (line 10) is $0-$50,000; $500 when $50,001-$100,000; $300 when over $100,000 (booklet p. 8 chart). It is already
    inside line 16 — claim it on the form, not through this op.'
  - One rate schedule covers Single, Married Filing Separately, and Head of Family (2% on the first $500, 4% on the
    next $2,500, 5% over $3,000); Married Filing Jointly has its own schedule (2% on the first $1,000, 4% on the next
    $5,000, 5% over $6,000).
  - Alabama has no qualifying-surviving-spouse filing status (Form 40 boxes are Single / Married filing joint / Married
    filing separate / Head of Family, and the booklet's Head-of-Family definition requires the individual 'is not
    a surviving spouse'). The engine's QSS-to-MFJ mapping does not correspond to an Alabama status — a filer widowed
    before 2023 files Single or Head of Family in Alabama, so do not rely on the MFJ schedule for a federal QSS filer.
  - The 2%/4%/5% schedule text is printed on the ADOR FAQ 'What is Alabama's Individual Income Tax Rate?' (https://www.revenue.alabama.gov/faqs/what-is-alabamas-individual-income-tax-rate/)
    and was verified numerically against the 2023 booklet's Tax Table rows and over-$100,000 worksheet.
