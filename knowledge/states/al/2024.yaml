unverified:
- 'TREATY CONFORMITY: No .gov page confirms whether income exempt under a U.S. income-tax TREATY is excluded for
  Alabama purposes. Alabama does not start from federal AGI, and the only foreign-income mechanism the 2024 Form
  40NR booklet describes is the IRC sec. 911 foreign EARNED income exclusion (claimed as a negative line-8 entry
  with federal Form 2555), with an explicit instruction that ''all foreign income must be reported.'' Whether
  treaty-exempt wages must be included in Alabama wages, or whether a treaty exclusion is honored, COULD NOT be
  confirmed and should be confirmed with the Alabama DOR before relying on conformity. conforms_to_federal_treaties
  was set false on the conservative basis that no pass-through/exclusion for treaty income is established.'
- The April 15, 2025 due date for the 2024 return is inferred from the booklet rule 'no later than the due date
  of the federal return' (April 15, 2025 was a Tuesday and the federal deadline) plus the printed automatic-extension
  date of October 15, 2025. No .gov page was found stating the literal string '2025-04-15' for the 2024 tax year.
- 'PRINTED CHART TYPO (both 2024 booklets): the Married Filing Joint standard-deduction column prints its third
  band as ''$25,500 - $26,999 / $8,150'' where the surrounding rows make clear it means $26,500 - $26,999 (the
  second band is $26,000 - $26,499 / $8,325). The engine does not ship the sliding chart, so nothing downstream
  consumes the typo''d bound; noted for anyone reading the chart off the booklet.'
- Form 40A short-form eligibility details are summarized from the 2024 Form 40 booklet's 'Which Form To File' section;
  a separately published 2024 Form 40A booklet was not fetched.
tax:
  citation:
    source: '2024 Alabama Form 40 Booklet (Individual Income Tax — Long Return, Residents and Part-Year Residents) —
      Tax Table pp. 25-30 (based on Form 40 line 16 taxable income; one column for Single/Married-filing-separately/Head-of-Family,
      one for Married-filing-jointly; worked example p. 25: MFJ $23,360 -> $1,088) and ''Over $100,000.00'' worksheet,
      p. 30 (tax = $4,958.00 [Single/MFS/HoF] or $4,918.00 [MFJ] plus .05 x taxable income over $100,000 — both constants
      re-derived for 2024, unchanged from 2023); Standard Deduction chart p. 9; dependent-exemption chart p. 8; personal
      exemptions printed on the 2024 Form 40 filing-status boxes 1-4 ($1,500/$3,000/$1,500/$3,000). Rate schedule text
      (2% first $500/$1,000, 4% next $2,500/$5,000, 5% over $3,000/$6,000) corroborated by the live ADOR FAQ ''What
      is Alabama''s Individual Income Tax Rate?'' (revenue.alabama.gov/faqs/what-is-alabamas-individual-income-tax-rate/).
      Second pass: the printed 2024 Form 40 (line 16 ''Taxable income. Subtract line 15 from line 10'', line 17 ''Income
      Tax due. Enter amount from tax table or check if from Form NOL-85A'', the ''X $1,500 / $3,000'' filing-status
      boxes) and the 2024 Form 40NR booklet''s identical tax-table rows — both passes agree; no 2024 changes.'
    url: https://www.revenue.alabama.gov/wp-content/uploads/2025/01/24f40bk.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 500, rate: 0.02}
    - {over: 500, but_not_over: 3000, rate: 0.04}
    - {over: 3000, but_not_over: null, rate: 0.05}
    married_filing_jointly:
    - {over: 0, but_not_over: 1000, rate: 0.02}
    - {over: 1000, but_not_over: 6000, rate: 0.04}
    - {over: 6000, but_not_over: null, rate: 0.05}
    married_filing_separately:
    - {over: 0, but_not_over: 500, rate: 0.02}
    - {over: 500, but_not_over: 3000, rate: 0.04}
    - {over: 3000, but_not_over: null, rate: 0.05}
    head_of_household:
    - {over: 0, but_not_over: 500, rate: 0.02}
    - {over: 500, but_not_over: 3000, rate: 0.04}
    - {over: 3000, but_not_over: null, rate: 0.05}
  base: state_taxable_income
  tax_line: 'Form 40, line 17: ''Income Tax due. Enter amount from tax table or check if from Form NOL-85A'' (line
    16: ''Taxable income. Subtract line 15 from line 10.''); booklet Line 17 Figuring Your Tax (p.10): ''You must
    figure your tax from the Tax Tables unless you are claiming a carryover or carryback Net Operating Loss from another
    year.'''
  exemptions: {}
  notes:
  - '2024 UNCHANGED: the 2024 booklet''s What''s New page lists only credit changes (Volunteer First Responder Mileage
    credit, Preceptor Tax Incentive, refund check-offs, MAT pre-approval) — the 2%/4%/5% dual schedules, sliding standard
    deduction chart, $1,500/$3,000 personal exemptions, income-tiered dependent exemption, and the over-$100,000 worksheet
    constants were each re-verified from the 2024 prints, not assumed.'
  - 'Base guidance: Supply 2024 Alabama Form 40, page 1, line 16 ''Taxable income. Subtract line 15 from line 10.''
    Alabama does NOT start from federal AGI: line 10 Alabama adjusted gross income is built from Alabama line items
    (line 8 total income minus line 9 adjustments), and line 15 total deductions = line 11 (itemized OR sliding standard
    deduction) + line 12 (FEDERAL income tax deduction, from the Federal Income Tax Deduction Worksheet) + line 13
    (personal exemption $1,500/$3,000) + line 14 (income-dependent dependent exemption). All of those subtractions
    must already be taken on the form before line 16 — this op subtracts nothing further.'
  - 'Tax-table mandate: the 2024 Form 40 booklet (Line 17 instructions, p.10) states ''You must figure your tax from
    the Tax Tables unless you are claiming a carryover or carryback Net Operating Loss from another year.'' The Tax
    Table (booklet pp. 25-30) covers taxable income under $100,000 in $100-wide bands priced at the band midpoint,
    so bracket math may differ by a few dollars within table bands (booklet example: MFJ $23,360 -> table $1,088 vs
    bracket math $1,088.00 exact at the midpoint); the filed form must use the table.'
  - 'Over $100,000: the 2024 booklet''s worksheet (p. 30) computes tax as $4,958.00 (Single/MFS/Head of Family) or
    $4,918.00 (MFJ) plus 5% of taxable income over $100,000. Those printed constants are each $2 LESS than the exact
    cumulative bracket sums ($4,960 / $4,920) because they carry forward the last tax-table row''s midpoint value
    (the $99,900-$100,000 row prints $4,958/$4,918); above $100,000 the tax the form produces is therefore $2 lower
    than this op''s pure bracket math.'
  - 'FEDERAL income tax deduction quirk: Alabama allows a base deduction for federal income tax liability (Form 40
    line 12; Federal Income Tax Deduction Worksheet, booklet p. 31: 2024 Form 1040/1040-SR/1040-NR line 22 plus Form
    8960 line 17 net investment income tax, minus refundable EIC, Additional Child Tax Credit, American Opportunity
    Credit, and Form 2439 credits). It is already inside the line 16 base this op consumes — do not re-subtract it.'
  - 'standard_deduction is NOT shipped because Alabama''s standard deduction slides with Alabama AGI (2024 booklet
    p. 9 chart, amounts unchanged from 2023): MFJ $8,500 (AL AGI $0-$25,999) phasing down to $5,000 at $35,500 and
    above; MFS $4,250 ($0-$12,999) down to $2,500 at $17,750 and above; Head of Family $5,200 ($0-$25,999) down to
    $2,500 at $35,500 and above; Single $3,000 ($0-$25,999) down to $2,500 at $35,500 and above. Take it from the
    chart on Form 40 line 11; it is already inside line 16.'
  - Personal exemption (Form 40 line 13) is $1,500 (Single or Married Filing Separately) / $3,000 (Married Filing
    Jointly or Head of Family), printed on the 2024 Form 40 filing-status boxes 1-4. It is a base reduction, but it
    is already inside the line 16 base this op consumes, so it is NOT shipped as an engine exemption.
  - 'Dependent exemption (Form 40 line 14) is income-dependent and NOT shipped: $1,000 per dependent when Alabama
    AGI (line 10) is $0-$50,000; $500 when $50,001-$100,000; $300 when over $100,000 (2024 booklet p. 8 chart, unchanged).
    It is already inside line 16 — claim it on the form, not through this op.'
  - One rate schedule covers Single, Married Filing Separately, and Head of Family (2% on the first $500, 4% on the
    next $2,500, 5% over $3,000); Married Filing Jointly has its own schedule (2% on the first $1,000, 4% on the next
    $5,000, 5% over $6,000).
  - Alabama has no qualifying-surviving-spouse filing status (Form 40 boxes are Single / Married filing joint / Married
    filing separate / Head of Family, and the booklet's Head-of-Family definition requires the individual 'is not
    a surviving spouse'). The engine's QSS-to-MFJ mapping does not correspond to an Alabama status — a filer widowed
    before 2024 files Single or Head of Family in Alabama, so do not rely on the MFJ schedule for a federal QSS filer.
  - The 2%/4%/5% schedule text is printed on the ADOR FAQ 'What is Alabama's Individual Income Tax Rate?' (https://www.revenue.alabama.gov/faqs/what-is-alabamas-individual-income-tax-rate/)
    and was verified numerically against the 2024 booklet's Tax Table rows (e.g. $16,000-$16,100 -> $763 single /
    $723 MFJ; $4,100-$4,200 -> $168 / $146) and the over-$100,000 worksheet.
