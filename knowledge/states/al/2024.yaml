# AL state knowledge — tax year 2024. Fetched + cited from the AL DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form 40 booklet
# (Long Return, Residents and Part-Year Residents), then independently re-derived from a
# second official document (the printed 2024 Form 40 itself, the 2024 Form 40NR booklet,
# the 2024 Schedule OC instructions, or the live ADOR rate FAQ) — resolutions recorded
# inline where the passes differed.
# HEADLINE FOR 2024: NO structural tax change. The What's New page is credit-only
# (Volunteer First Responder Mileage credit, Act 2023-510; Preceptor Tax Incentive
# Program, Act 2023-519; new refund check-offs, Act 2023-327; MAT pre-approval now
# required for certain credits). The 2%/4%/5% dual schedules, the sliding standard
# deduction chart, the $1,500/$3,000 personal exemptions, the income-tiered dependent
# exemption, and the over-$100,000 worksheet constants ($4,958/$4,918) are all
# unchanged from 2023 — each was re-verified (not assumed) from the 2024 prints.
jurisdiction: states/al
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Alabama does NOT start the return from federal adjusted gross income. Both the resident Form 40 and
  the nonresident Form 40NR build Alabama income from their own line items computed under Alabama law (Form 40 line
  5 wages/salaries/tips from Schedule W-2, line 6 interest and dividends, line 7 other income; Form 40NR equivalents),
  not by importing a federal AGI figure. Because the federal-AGI-conformity flow-through does not exist here, a treaty
  exclusion that is already netted out of federal AGI does NOT automatically carry to the Alabama return. The 2024
  Form 40NR booklet (24f40nrbk.pdf, Other Income/Foreign Income Exclusion) is explicit on the only foreign-income
  mechanism it recognizes: ''All foreign income must be reported on your return, in order to receive any foreign
  income exclusion,'' and that exclusion is the IRC sec. 911 foreign EARNED income exclusion, claimed as a negative
  entry on line 8 Other Income with federal Form 2555 attached. There is NO Alabama line, schedule, or instruction
  that recognizes or excludes income exempt under a U.S. income-TAX TREATY. Given (a) the separate Alabama income
  build-up rather than a federal-AGI start, and (b) the affirmative ''report all foreign income'' rule with only a
  sec. 911-style exclusion path, conformity to federal treaty exemptions is NOT established on any .gov page. Per
  conservative handling this is set false and flagged. See unverified/notes.'
citation:
  source: 2024 Form 40 Booklet (Alabama Department of Revenue, Long Return — Residents and Part-Year Residents,
    Forms and Instructions) — What's New For 2024 (p.2, credit-only changes); You Must File A Return If chart (p.5);
    When To File / automatic extension to October 15, 2025 (p.5); Filing Status and Personal Exemption Lines 1-4
    (p.6); Standard Deduction chart (p.9); dependent exemption chart (p.8); Line 17 Figuring Your Tax tax-table
    mandate (p.10); Where To File (p.12); Tax Table pp.25-30 and Over $100,000.00 worksheet (p.30)
  url: https://www.revenue.alabama.gov/wp-content/uploads/2025/01/24f40bk.pdf
starts_from: 'Alabama gross income computed under Alabama law (separate line items: Form 40 line 5 wages/salaries/tips
  from Schedule W-2, line 6 interest and dividend income, line 7 other income; Form 40NR equivalents) — it does NOT
  start from federal adjusted gross income or federal taxable income.'
residency:
  summary: Residency is domicile-based. A resident is anyone domiciled in (a resident of) Alabama — domicile being
    where one lives, has a permanent home, and intends to return when absent — and residents are taxed on their
    entire income whether earned within or without Alabama. A part-year resident establishes or abandons Alabama
    domicile during the year and reports income earned (with prorated itemized deductions but the FULL standard
    deduction and personal/dependent exemptions) only during the period of Alabama residency. A nonresident has
    no Alabama domicile/permanent home but is taxed on income from Alabama sources or services performed in Alabama;
    the 2024 Form 40 booklet (p.4) repeats that a foreign citizen who comes to Alabama to work, buys a home, secures
    an Alabama driver's license, and intends to ultimately return to the country of origin is considered to have
    established Alabama domicile and is liable for Alabama income tax on income earned from all sources. Military
    personnel whose legal residence is Alabama remain residents regardless of duty station; nonresident military
    merely stationed in Alabama file only if they have non-military Alabama-source income (Form 40NR).
forms:
  resident: Form 40 — Alabama Individual Income Tax Return (Residents & Part-Year Residents). (Form 40A is an optional
    short form for full-year residents who do not itemize, claim no adjustments to income, have income only from
    salaries/wages plus up to $1,500 of interest and dividends, no Schedule C/D/E/F income, and no other-state credit;
    part-year residents use Form 40.)
  part_year_or_nonresident: Form 40NR — Alabama Individual Income Tax Return (Nonresidents Only). Part-year residents
    file the resident Form 40 (reporting only the resident-period income); a person who is part-year resident AND
    has nonresident-period Alabama-source income files BOTH Form 40 and Form 40NR (personal and dependent exemptions
    all claimed on the part-year Form 40, none on the 40NR).
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Credit for Taxes Paid to Another State
  type: nonrefundable
  eligibility: Legal residents of Alabama filing Form 40 who have income from sources outside Alabama that is taxed
    by BOTH Alabama and another U.S. state or territory in the same tax year. (Part-year residents only if the AL
    and other-state returns cover the same periods. No credit when the out-of-state income is totally offset by
    a corresponding deduction. Schedule CR must be completed with a copy of the other state's return attached —
    or W-2Gs if the taxing state does not allow a return to be filed for gambling winnings.)
  amount: Credit equals the tax paid to the other state, limited per the 2024 Schedule OC instructions Part A to
    the LESSER of (a) the Alabama tax liability multiplied by the ratio of other states' adjusted gross income to
    Alabama AGI (lines A1-A4), or (b) the actual other-state tax from Schedule CR line 27 (line A5).
  income_limit_2024: None (no income cap; the credit is capped by the lesser-of limitation above).
  claimed_on: Form 40, page 1, line 18 (net tax due computed with Schedule OC — check the Schedule OC box), via
    Schedule CR and Schedule OC, Part A.
  citation:
    source: Alabama Department of Revenue, 2024 Form 40 Booklet, 'Credits - Schedule OC' and 'Credit for Taxes Paid
      to Another State' (p.10), and 2024 Schedule OC Instructions, Part A lines A1-A6.
    url: https://www.revenue.alabama.gov/wp-content/uploads/2025/01/24f40bk.pdf
- name: Alabama Adoption Tax Credit
  type: refundable
  eligibility: 'Taxpayers who reside in Alabama and complete an adoption. Two cases: (1) a private adoption in which
    the adopted child is a resident of Alabama, or a qualified foster child in the custody of the Alabama Department
    of Human Resources; (2) an out-of-state adoption or where the adopted child is not otherwise an Alabama resident.
    Schedule AAC must be completed.'
  amount: $2,000 per child for a private adoption where the adopted child is an Alabama resident or a qualified
    foster child in DHR custody; $1,000 per child for an out-of-state adoption / when the adopted child is not an
    Alabama resident.
  income_limit_2024: None stated.
  claimed_on: Computed on Schedule AAC, Part III, carried to Schedule OC, Part M (line M1); the refundable amount
    flows through Schedule OC, Section F (line F2) to Form 40, page 1, line 25 (Refundable Credit).
  citation:
    source: Alabama Department of Revenue, 2024 Schedule OC Instructions, Part M - Alabama Adoption Tax Credit ($2,000
      per Alabama-resident/foster child, $1,000 out-of-state) and Section F; 2024 Form 40 Booklet Line 25 (refundable
      portion of Alabama Accountability Act, Adoption Credit, or Historic Tax Rehabilitation Act of 2017 Credit).
    url: https://www.revenue.alabama.gov/wp-content/uploads/2025/01/24schocinstr.pdf
- name: Rural Physician Credit
  type: nonrefundable
  eligibility: Licensed physicians who practice and reside in a small or rural Alabama community of fewer than 25,000
    residents, with admission privileges to a 'small or rural hospital' that has an emergency room (acute care hospital
    with fewer than 105 beds, located more than 20 miles from another acute care facility, or receiving Medicare
    rural reimbursement). Does not apply to physicians who met the requirements on/before May 5, 1993, nor to a
    physician who previously practiced in such a community unless they return after practicing in a large/urban
    community for at least three years.
  amount: $5,000 per year for a qualifying physician ($10,000 if married filing jointly and both spouses qualify,
    per 2024 Schedule OC instructions line D2). May be claimed for no more than five consecutive tax years.
  income_limit_2024: None.
  claimed_on: Schedule OC, Part D (lines D1-D3), carried to Schedule OC Section C; reduces net tax on Form 40, page
    1, line 18.
  citation:
    source: Alabama Department of Revenue, 2024 Schedule OC Instructions, Part D - Rural Physician Credit (amount
      $5,000.00 per year, max five consecutive years; D2 '$10,000' if MFJ and both spouses qualify).
    url: https://www.revenue.alabama.gov/wp-content/uploads/2025/01/24schocinstr.pdf
filing_requirement:
  note: 'Domicile-based. Full-year residents (2024) must file if gross income is at least: Single $4,500; Head of
    Family $8,200; Married Filing Joint $11,500; Married Filing Separate $5,750 — unchanged from 2023 (2024 Form
    40 booklet p.5 ''You Must File A Return If'' chart; the same chart with the same amounts is printed in the 2024
    Form 40NR booklet). Part-year residents use the same thresholds measured against gross income earned while an
    Alabama resident. Nonresidents must file Form 40NR if Alabama-source income exceeds the allowable prorated personal
    exemption. Even if below the threshold, file to claim a refund of any Alabama tax withheld.'
