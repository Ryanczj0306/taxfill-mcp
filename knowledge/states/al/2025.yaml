# AL state knowledge — tax year 2025. Fetched + cited from the AL DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 Form 40 booklet
# (Long Return, Residents and Part-Year Residents, 25f40bk.pdf), then independently
# re-derived from second official documents — the printed 2025 Form 40 (25f40blk.pdf), the
# 2025 Form 40NR booklet (25f40nrbk.pdf), the 2025 Schedule OC instructions
# (25schocinstr.pdf), and the live ADOR rate FAQ — resolutions recorded inline where the
# passes differed.
# HEADLINE FOR 2025: NO structural rate/deduction/exemption change. The What's New For 2025
# page carries only credits and income EXCLUSIONS (Identity Quiz notice; new-vehicle loan
# interest deduction under Sec. 40-18-15 for 2025-2028; expanded military-pay exemption,
# Act 2024-0170; Sound Money Tax Neutrality Act, Act 2024-0447, excluding net capital gains
# on precious metal bullion beginning January 1, 2025; Alabama Workforce Housing Tax Credit,
# Act 2024-302; Childcare Facility / Employer / Employer Provider credits, Act 2024-303).
# The 2%/4%/5% dual schedules, the sliding standard deduction chart (identical amounts AND
# the identical printed MFJ typo), the $1,500/$3,000 personal exemptions, the income-tiered
# dependent exemption ($1,000/$500/$300), and the over-$100,000 worksheet constants
# ($4,958/$4,918) were each RE-DERIVED from the 2025 prints, not assumed.
# TWO 2025-ONLY WAGE/FORM CHANGES OUTSIDE THE BOOKLET'S WHAT'S NEW PAGE:
#   * OVERTIME EXEMPTION SUNSET — the Act 2023-421 (as amended by Act 2024-437) exclusion of
#     overtime pay for full-time hourly employees ENDED June 30, 2025 (ADOR NOTICE of
#     May 29, 2025). TY2025 is therefore a HALF-YEAR exclusion: overtime earned in the period
#     the exemption was in effect is denoted in Box 14 of the W-2 as 'EX OT WAGES' and is NOT
#     included in Box 16 state wages; overtime paid after June 30, 2025 is fully taxable.
#     (The successor Overtime Premium Deduction is a 2026-2028 provision — NOT a TY2025 item.)
#   * The printed 2025 Form 40 filing-status box 4 (Head of Family) now reads 'Complete
#     Schedule HOF' — the exemption amount is unchanged at $3,000.
jurisdiction: states/al
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: false
treaty_note: 'Alabama does NOT start the return from federal adjusted gross income. Both the resident Form 40 and
  the nonresident Form 40NR build Alabama income from their own line items computed under Alabama law (2025 Form
  40 line 5b wages/salaries/tips from Schedule W-2 line 18 column I plus column J, line 6 interest and dividends,
  line 7 other income; Form 40NR equivalents), not by importing a federal AGI figure. Because the federal-AGI-conformity
  flow-through does not exist here, a treaty exclusion that is already netted out of federal AGI does NOT automatically
  carry to the Alabama return. The 2025 Form 40NR booklet (25f40nrbk.pdf, Other Income / Foreign Income Exclusion)
  is explicit on the only foreign-income mechanism it recognizes: ''All foreign income must be reported on your return,
  in order to receive any foreign income exclusion,'' and that exclusion is the IRC sec. 911 foreign EARNED income
  exclusion, claimed as a negative entry on line 8 Other Income with federal Form 2555 attached. There is NO Alabama
  line, schedule, or instruction that recognizes or excludes income exempt under a U.S. income-TAX TREATY. Given
  (a) the separate Alabama income build-up rather than a federal-AGI start, and (b) the affirmative ''report all
  foreign income'' rule with only a sec. 911-style exclusion path, conformity to federal treaty exemptions is NOT
  established on any .gov page. Per conservative handling this is set false and flagged. See unverified/notes.'
