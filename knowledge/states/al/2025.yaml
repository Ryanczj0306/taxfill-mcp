  base: state_taxable_income
  tax_line: 'Form 40, line 17: ''Income Tax due. Enter amount from tax table or check if from Form NOL-85A'' (line
    16: ''Taxable income. Subtract line 15 from line 10.''); booklet Line 17 Figuring Your Tax (p.10): ''You must
    figure your tax from the Tax Tables unless you are claiming a carryover or carryback Net Operating Loss from another
    year.'''
  exemptions: {}
  notes:
  - '2025 UNCHANGED: the 2025 booklet''s What''s New page carries only credits and income exclusions (Identity Quiz
    notice; new-vehicle loan interest deduction under Sec. 40-18-15 for 2025-2028; expanded military-pay exemption,
    Act 2024-0170; Sound Money Tax Neutrality Act, Act 2024-0447, excluding net capital gains on precious metal bullion
    beginning January 1, 2025; Alabama Workforce Housing Tax Credit, Act 2024-302; Childcare Facility / Employer /
    Employer Provider credits, Act 2024-303) — the 2%/4%/5% dual schedules, the sliding standard deduction chart,
    the $1,500/$3,000 personal exemptions, the income-tiered dependent exemption, and the over-$100,000 worksheet
    constants were each RE-VERIFIED from the 2025 prints (booklet, printed Form 40, and 40NR booklet), not assumed.'
  - 'Base guidance: Supply 2025 Alabama Form 40, page 1, line 16 ''Taxable income. Subtract line 15 from line 10.''
    Alabama does NOT start from federal AGI: line 10 Alabama adjusted gross income is built from Alabama line items
    (line 8 total income minus line 9 adjustments), and line 15 total deductions = line 11 (itemized OR sliding standard
    deduction) + line 12 (FEDERAL income tax deduction, from the Federal Income Tax Deduction Worksheet) + line 13
    (personal exemption $1,500/$3,000) + line 14 (income-dependent dependent exemption). All of those subtractions
    must already be taken on the form before line 16 — this op subtracts nothing further.'
  - 'Tax-table mandate: the 2025 Form 40 booklet (Line 17 Figuring Your Tax, p.10) states ''You must figure your tax
    from the Tax Tables unless you are claiming a carryover or carryback Net Operating Loss from another year.'' The
    Tax Tables (booklet pp. 25-30) cover taxable income under $100,000 in $100-wide bands priced at the band midpoint,
    so bracket math may differ by a few dollars within a table band (booklet example: MFJ $23,360 -> table $1,088,
    which equals exact bracket math at that figure); the filed form must use the table.'
  - 'Over $100,000: the 2025 booklet''s worksheet (p. 30) computes tax as $4,958.00 (Single/Married filing separately/Head
    of family) or $4,918.00 (Married filing jointly) plus 5% of taxable income over $100,000 — both constants re-derived
    for 2025 and unchanged. Those printed constants are each $2 LESS than the exact cumulative bracket sums ($4,960
    = 500x.02 + 2,500x.04 + 97,000x.05; $4,920 = 1,000x.02 + 5,000x.04 + 94,000x.05) because they carry forward the
    last tax-table row''s midpoint value (the $99,900-$100,000 row prints $4,958/$4,918); at and above $100,000 the
    tax the form produces is therefore $2 lower than this op''s pure bracket math.'
  - 'FEDERAL income tax deduction quirk: Alabama allows a base deduction for federal income tax liability (Form 40
