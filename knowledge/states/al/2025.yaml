unverified:
- 'TREATY CONFORMITY: No .gov page confirms whether income exempt under a U.S. income-tax TREATY is excluded for
  Alabama purposes. Alabama does not start from federal AGI, and the only foreign-income mechanism the 2025 Form
  40NR booklet describes is the IRC sec. 911 foreign EARNED income exclusion (claimed as a negative line-8 entry
  with federal Form 2555), with an explicit instruction that ''all foreign income must be reported.'' Whether
  treaty-exempt wages must be included in Alabama wages, or whether a treaty exclusion is honored, COULD NOT be
  confirmed and should be confirmed with the Alabama DOR before relying on conformity. conforms_to_federal_treaties
  was set false on the conservative basis that no pass-through/exclusion for treaty income is established.'
- The April 15, 2026 due date for the 2025 return is inferred from the booklet rule 'no later than the due date
  of the federal return' (April 15, 2026 is a Wednesday and the federal deadline) plus the printed automatic-extension
  date of October 15, 2026. No .gov page was found stating the literal string '2026-04-15' for the 2025 tax year.
- 'PRINTED CHART TYPO PERSISTS INTO 2025 (both 2025 booklets): the Married Filing Joint standard-deduction column
  prints its third band as ''$25,500 - $26,999 / $8,150'' where the surrounding rows make clear it means $26,500
  - $26,999 (the second band is $26,000 - $26,499 / $8,325, and the Married Filing Separate / Head of Family / Single
  columns all print $26,500 - $26,999 for their third band). This is the SAME typo the 2024 pack recorded — it was
  re-checked in the 2025 Form 40 booklet AND independently in the 2025 Form 40NR booklet, and it is present in both.
  The engine does not ship the sliding chart, so nothing downstream consumes the typo''d bound; noted for anyone
  reading the chart off the booklet.'
- 'OVERTIME EXEMPTION IS A HALF-YEAR ITEM FOR TY2025 AND IS NOT DESCRIBED IN THE BOOKLET: neither the 2025 Form
  40 booklet nor the 2025 Form 40NR booklet mentions overtime anywhere (grep of both PDFs: zero hits), and neither
  did the 2024 Form 40 booklet — the exclusion lives in the withholding/W-2 channel (Box 14 ''EX OT WAGES'', excluded
  from Box 16 state wages) per the May 29, 2025 ADOR notice. The exact allocation rule for overtime straddling June
  30, 2025 (paid-date versus earned-date) is NOT stated on any fetched .gov page; confirm with ADOR. The successor
  Overtime Premium Deduction (lesser of the actual overtime premium or $1,000 per taxpayer) is a 2026-2028 provision
  and does NOT apply to TY2025.'
- Form 40A short-form eligibility details are summarized from the 2025 Form 40 booklet's 'Which Form To File' section;
  the separately published 2025 Form 40A booklet (25f40abk.pdf) was not fetched.
- 'The Head of Family personal exemption amount ($3,000) was taken from the printed 2025 Form 40 filing-status box
  4 rather than from the booklet''s narrative: the booklet prints the ''enter $1,500/$3,000 on line 13'' sentences
  for boxes 1, 2, and 3, and the box-4 sentence did not survive text extraction of the multi-column page. The printed
  form is the controlling second-pass source and shows ''4 $3,000 Head of Family (with qualifying person). Complete
  Schedule HOF''.'
tax:
  citation:
    source: '2025 Alabama Form 40 Booklet (Individual Income Tax — Long Return, Residents and Part-Year Residents) —
      Tax Tables pp. 25-30 (based on Form 40 line 16 taxable income; one column for Single/Married-filing-separately/Head-of-Family,
      one for Married-filing-jointly; worked example p. 25: MFJ $23,360 -> $1,088) and the "Over $100,000.00" worksheet,
      p. 30 (tax = $4,958.00 [Single/MFS/Head of family] or $4,918.00 [MFJ] plus .05 x taxable income over $100,000
      — both constants RE-DERIVED for 2025, unchanged from 2024); Standard Deduction chart p. 9; dependent-exemption
      chart p. 10; personal exemptions printed on the 2025 Form 40 filing-status boxes 1-4 ($1,500/$3,000/$1,500/$3,000).
      Rate schedule text (2% first $500/$1,000, 4% next $2,500/$5,000, 5% over $3,000/$6,000) corroborated by the live
      ADOR FAQ "What is Alabama''s Individual Income Tax Rate?" (revenue.alabama.gov/faqs/what-is-alabamas-individual-income-tax-rate/).
      Second pass: the printed 2025 Form 40 (line 16 "Taxable income. Subtract line 15 from line 10", line 17 "Income
      Tax due. Enter amount from tax table or check if from Form NOL-85A", the "$1,500 / $3,000" filing-status boxes)
      and the 2025 Form 40NR booklet''s identical tax-table rows and identical over-$100,000 worksheet — all passes
