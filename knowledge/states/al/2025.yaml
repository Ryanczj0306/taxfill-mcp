starts_from: 'Alabama gross income computed under Alabama law (separate line items: 2025 Form 40 line 5b wages/salaries/tips
  from Schedule W-2 line 18 column I plus column J, line 6 interest and dividend income, line 7 other income; Form
  40NR equivalents) — it does NOT start from federal adjusted gross income or federal taxable income.'
residency:
  summary: Residency is domicile-based. A resident is anyone domiciled in (a resident of) Alabama — domicile being
    where one lives, has a permanent home, and intends to return when absent — and residents are taxed on their
    entire income whether earned within or without Alabama. A part-year resident establishes or abandons Alabama
    domicile during the year and reports income earned only during the period of Alabama residency (itemized deductions
    prorated and the federal tax liability deduction prorated by the ratio of Alabama AGI to federal AGI, but the
    FULL standard deduction and personal/dependent exemptions are allowed). A nonresident has no Alabama domicile/permanent
    home but is taxed on income from Alabama sources or services performed in Alabama; the 2025 Form 40 booklet
    repeats that a foreign citizen who comes to Alabama to work, buys a home, secures an Alabama driver's license,
    and intends to ultimately return to the country of origin is considered to have established Alabama domicile
    and is liable for Alabama income tax on income earned from all sources. Military personnel whose legal residence
    is Alabama remain residents regardless of duty station (burden of proof of a change in home of record is on
    the taxpayer); nonresident military merely stationed in Alabama file only if they have non-military Alabama-source
    income (Form 40NR).
forms:
  resident: Form 40 — Alabama Individual Income Tax Return (Residents & Part-Year Residents). (Form 40A is an optional
    short form for full-year residents who do not itemize, claim no adjustments to income, have income only from
    salaries/wages plus up to $1,500 of interest and dividends, no Schedule C/D/E/F income, and no other-state credit;
    part-year residents use Form 40.)
  part_year_or_nonresident: Form 40NR — Alabama Individual Income Tax Return (Nonresidents Only). Part-year residents
    file the resident Form 40 (reporting only the resident-period income); a person who is part-year resident AND
    has nonresident-period Alabama-source income files BOTH Form 40 and Form 40NR (personal and dependent exemptions
    all claimed on the part-year Form 40, none on the 40NR).
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Credit for Taxes Paid to Another State
  type: nonrefundable
  eligibility: 'Legal residents of Alabama filing Form 40 who have income from sources outside Alabama that is taxed
    by BOTH Alabama and another U.S. state or territory in the same tax year. (Part-year residents only if the AL
    and other-state returns cover the same periods. Schedule CR must be completed with a copy of the other state''s
    return attached — or W-2Gs if the taxing state does not allow a return to be filed for gambling winnings. The
    2025 Schedule OC instructions add an explicit NOTE: residents who worked and received income/wages from a state
    that has NO income tax are not eligible. Taxes paid to a FOREIGN country use Schedule OC Section B, Part I —
    not Schedule CR.)'
  amount: Credit equals the tax paid to the other state, limited per the 2025 Schedule OC instructions Part A to
    the SMALLER of (a) the current Alabama tax liability multiplied by the other states' percentage of Alabama AGI
    (line A1 Schedule CR line 26 divided by line A2 Form 40 line 10, applied on line A4), or (b) the actual other-state
    tax from Schedule CR line 27 (line A5).
  income_limit_2025: None (no income cap; the credit is capped by the smaller-of limitation above).
  claimed_on: Form 40, page 1, line 18 (net tax due computed with Schedule OC — check the Schedule OC box), via
    Schedule CR and Schedule OC, Part A (lines A1-A6, carried to Section C, Part A, Column 3).
  citation:
    source: Alabama Department of Revenue, 2025 Schedule OC Instructions, 'Part A - Credit for Taxes Paid to Other
      States (Form 40 Only)' lines A1-A6, and 2025 Form 40 Booklet, 'Credit for Taxes Paid to Another State' (Line
      17/18 credits discussion, p.10).
    url: https://www.revenue.alabama.gov/wp-content/uploads/2026/01/25schocinstr.pdf
- name: Alabama Adoption Tax Credit
  type: refundable
  eligibility: 'Taxpayers who reside in Alabama and complete an adoption. Two cases: (1) a private adoption in which
    the adopted child is a resident of Alabama, or a qualified foster child in the custody of the Alabama Department
    of Human Resources; (2) an out-of-state adoption or where the adopted child is not otherwise an Alabama resident.
    Schedule AAC must be completed.'
  amount: $2,000 per child for a private adoption where the adopted child is an Alabama resident or a qualified
    foster child in DHR custody; $1,000 per child for an out-of-state adoption / when the adopted child is not an
    Alabama resident.
  income_limit_2025: None stated.
  claimed_on: Computed on Schedule AAC, Part III, line 3, carried to Schedule OC, Part M (line M1) and Section C,
    Part M; the refundable amount flows through Schedule OC, Section F (line F2) to Form 40, page 1, line 25 (Refundable
    Credit).
  citation:
    source: Alabama Department of Revenue, 2025 Schedule OC Instructions, Part M - Alabama Adoption Tax Credit ($2,000
      per Alabama-resident/foster child, $1,000 for an out-of-state adoption) and Section F line F2 (refundable
      portion).
    url: https://www.revenue.alabama.gov/wp-content/uploads/2026/01/25schocinstr.pdf
- name: Rural Physician Credit
  type: nonrefundable
  eligibility: Licensed physicians who practice and reside in a small or rural Alabama community of less than 25,000
    residents, with admission privileges to a 'small or rural hospital' having an emergency room (an acute care
    hospital with less than 105 beds, located more than 20 miles from another acute care facility, or which receives
    Medicare rural reimbursement from the federal government). No credit is allowed to physicians meeting the requirements
    on or before May 5, 1993, nor to a physician having previously practiced within a rural community unless he/she
    returns to such practice after having practiced in a large or urban community for at least three years.
  amount: $5,000.00 per year for a qualifying physician ($10,000 if married filing jointly and both spouses qualify,
    per the 2025 Schedule OC instructions line D2). May be claimed for not more than five consecutive tax years.
  income_limit_2025: None.
  claimed_on: Schedule OC, Part D (lines D1-D3), carried to Schedule OC Section C, Part D, Column 3; reduces net
    tax on Form 40, page 1, line 18.
  citation:
    source: Alabama Department of Revenue, 2025 Schedule OC Instructions, Part D - Rural Physician Credit ('The
      amount of this credit is $5,000.00 per year and may be claimed for not more than five consecutive tax years';
      D2 '$10,000' if MFJ and both spouses qualify).
    url: https://www.revenue.alabama.gov/wp-content/uploads/2026/01/25schocinstr.pdf
filing_requirement:
  note: 'Domicile-based. Full-year residents (2025) must file if gross income is at least: Single $4,500; Head of
    family $8,200; Married, joint return $11,500; Married, separate return $5,750 — unchanged from 2024 (2025 Form
    40 booklet p.5 ''You Must File A Return If'' chart; the same chart with the same amounts is printed in the 2025
    Form 40NR booklet). Part-year residents use the same thresholds measured against gross income earned while
    an Alabama resident. Nonresidents must file Form 40NR if Alabama-source gross income exceeds the allowable prorated
    personal exemption (or if filing Married Filing Joint under the Military Spouses Residency Relief Act). Even
    if below the threshold, file to claim a refund of any Alabama tax withheld.'
