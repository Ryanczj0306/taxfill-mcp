  base: federal_agi
  tax_line: '2025 Form K-40, Line 8: ''Tax (from Tax Tables or Tax Computation Schedule)''. Instructions: ''LINE 8
    (Tax): If line 7 is $100,000 or less, use the Tax Tables beginning on page 27 to find the amount of your tax.
    If line 7 is more than $100,000, you will need to use the Tax Computation Worksheet on page 34 to compute your
    tax.'' Line 7 = Line 3 (KAGI) minus Line 6 (Line 4 standard/itemized deduction + Line 5 exemption allowance);
    ''if less than zero, enter 0''.'
  exemptions:
    personal:
      amount: 9160
      note: 'Filing-status allowance (the 2024 SB 1 structure, unchanged for 2025), not a per-person amount: the 2025
        booklet''s Exemptions and Dependents instructions say ''If your filing status is married filing joint ... enter
        2 in the box for the number of exemptions and $18,320 in the amount box'' and ''If your filing status is single,
        married filing separate or head of household ... enter one in the box for number of exemptions and $9,160 in the
        amount box''. Ship $9,160 per exemption: pass exemptions_count=1 for single/HoH/MFS and 2 for MFJ (2 x $9,160
        = $18,320 exactly). Flows into K-40 Line 5 via the Total Kansas Exemption Amount box — a base reduction, not a
        credit.'
    dependent:
      amount: 2320
      note: '''Enter the number of dependents claimed on your federal return. Multiply that number by $2,320 and enter
        that total in the amount box'' (2025 booklet, Exemptions and Dependents; do NOT include yourself or your spouse).
        A filer claimed as a dependent by another taxpayer enters 0 in the dependents box. HEAD OF HOUSEHOLD: the form
        also grants HoH filers an additional $2,320 (''If your filing status is Head of Household, you are allowed an
        additional exemption of $2,320''), and 2025 adds $2,320 exemptions for a child born in the tax year and for a
        stillbirth — all three equal the per-dependent allowance, so they can be captured by ADDING to dependents_count
        (see notes).'
    disabled_veteran:
      amount: 2320
      note: 'Disabled Veteran Personal Exemption: an additional $2,320 per honorably discharged veteran certified by the
        U.S. Department of Veterans Affairs as receiving disability compensation at the 100% rate (permanent, service-sustained),
        ''for tax year 2025 and all tax years thereafter'' — RAISED from 2024''s $2,250. Printed on the 2025 K-40 front
