      row ''$26 - $50 -> $2'', columns for Single/Head of Household/Married Filing Separate and for Married Filing Joint)
      with the ''$100,001 and over - use the Tax Computation Worksheet'' rule; Important Information + K-40 instructions
      — Line 4 Kansas Standard Deduction ($3,605 Single / $8,240 Married Filing Joint / $6,180 Head of Household / $4,120
      Married Filing Separate) and the ''WORKSHEET - Standard Deduction for People 65 or Older and/or Blind''; Exemptions
      and Dependents instructions ($18,320 MFJ / $9,160 single-HoH-MFS filing-status allowance, $2,320 per dependent,
