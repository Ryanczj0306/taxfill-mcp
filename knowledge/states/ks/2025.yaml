unverified:
- No explicit Kansas statutory '183-day' statutory-resident bright-line was found in the 2025 booklet; Kansas residency
  is stated in domicile/intent-to-return terms only (the precise day-count statutory test, if any, was not confirmed
  on a .gov page).
- Kansas publishes a single PO Box (PO BOX 750260, TOPEKA KS 66699-0260) for both refund and with-payment returns;
  a separate distinct box for balance-due returns was not found, so the with-payment vs refund mailing distinction
  could not be confirmed as different addresses — confirm at the DOR if a distinct balance-due box is expected. (Estimated-tax
  payments do use a different box, PO Box 3506, Topeka KS 66625-3506.)
- 'The 2025 booklet''s Exemptions and Dependents instruction zeroes only the DEPENDENTS box for a filer claimed as
  a dependent by another taxpayer (''If you are claimed as a dependent by another taxpayer, enter "0" in the number
  of dependents box''); like 2024, it prints NO rule zeroing the filing-status allowance itself for dependent filers.
  Whether a dependent filer claims the full $9,160 allowance was not restated elsewhere in the booklet — confirm
  at the DOR for a dependent-filer return.'
- 'FONT-EXTRACTION LIMIT ON THE 2025 K-40: the K-40 PDF embeds its body text in a non-embedded identity-encoded Arial,
  so most of the form''s instruction text does not survive either text extraction or page rendering. The ''X $2,320''
  additional-exemption boxes, the Total Kansas Exemption Amount box, and the mailing block ARE legible, but the $18,320
  / $9,160 filing-status allowance amounts printed inside the ''Check One Box'' section are NOT independently readable
  on the form for 2025 (the 2024 pack could read them). Those two amounts are therefore booklet-sourced — stated
  twice, in Important Information (p.2) and in the Exemptions and Dependents instructions (p.6) — rather than confirmed
  against the form print. The rates and the four standard deductions ARE independently confirmed, by the 2025 K-40ES
  worksheet.'
- 'FOOD SALES TAX CREDIT REMOVAL IS INFERRED FROM ABSENCE, not from an affirmative repeal statement: the 2025 booklet
  contains no food-sales-tax-credit section (a full-text search finds no ''food sales'' occurrence) and the 2025
  K-40 front carries no lines A-H block, and the line numbering after line 17 shifts accordingly. No ''What''s New''
  sentence announcing the repeal was found in the booklet, and the session law was not pulled — confirm with the
  DOR before telling a 2025 filer the credit is unavailable.'
- The statutory citation (2024 Special Session Senate Bill 1) for the two-bracket 5.2%/5.58% structure, the standard
  deductions, and the $9,160/$18,320/$2,320 exemption allowances was not re-derived from the session-law text; all
  amounts are two-pass confirmed at the cited official 2025 documents. No 2025-session act changing the rates, standard
  deduction, or allowance appears in the 2025 booklet.
tax:
