    source: 'Kansas DOR, 2025 Individual Income Tax booklet (ip25.pdf): 2025 Tax Computation Worksheet, page 34 (printing
      the two-bracket schedule: Married Filing Joint ''$0 - $46,000'' at ''5.2% (.052)'' subtracting $0, ''$46,001 and
      over'' at ''5.58% (.0558)'' subtracting $175; Single/Head of Household/Married Filing Separate ''$0 - $23,000''
