      years thereafter'', plus new $2,320 exemptions for a child born in the tax year and for a stillbirth); Line 5
      exemption allowance; Line 7 taxable income; Line 8 tax-table/worksheet mandate; the QSS-to-Head-of-Household filing
      status instruction. SECOND PASS (independent document): the 2025 K-40ES estimated-tax voucher worksheet (https://www.ksrevenue.gov/pdf/k-40es25.pdf,
      Rev. 7-24) prints its own STANDARD DEDUCTION CHART (Single $3,605 / MFJ $8,240 / MFS $4,120 / HoH $6,180) and
