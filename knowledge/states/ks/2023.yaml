      and/or Blind' (p. 6), Line 5 exemption allowance ($2,250 per exemption, p. 7), Line 8 tax-table/worksheet
      mandate (p. 7), Filing Status QSS-to-HOH instruction (p. 6); 2023 Form K-40 lines 1-12 and exemption
      boxes (booklet forms section, pp. 19-20)
