# KS state knowledge — tax year 2024. Fetched + cited from the KS DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Individual Income
# Tax Booklet (ip24.pdf), then independently re-derived from a second official document
# (the 2024 Form K-40 itself, which prints the $18,320/$9,160/$2,320/$2,250 exemption
# boxes verbatim, plus the 2024 Homestead booklet and 2024 Form K-40V) — resolutions
# recorded inline where the passes differed.
# HEADLINE 2024 CHANGE (SB 1, 2024 Special Session): Kansas RESTRUCTURED its income tax.
# TWO brackets replace 2023's three: 5.2% up to $23,000 ($46,000 married filing joint)
# and 5.58% above (2023: 3.1%/5.25%/5.7%). Standard deductions ROSE to $3,605 single /
# $8,240 MFJ / $6,180 HoH / $4,120 MFS. The exemption allowance was RESTRUCTURED from
# $2,250 per person to a filing-status allowance of $18,320 (MFJ) / $9,160 (all others)
# PLUS $2,320 per dependent (+$2,320 additional for Head of Household; +$2,250 disabled
# veteran). The 2023 tax table's $0-tax cliff ($2,500/$5,000) is GONE — the 2024 table
# starts at $26-$50 -> $2. Do not carry ANY 2023 tax:-block figures forward.
jurisdiction: states/ks
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Kansas Form K-40 starts from federal adjusted gross income (2024 K-40 Line 1: "Federal adjusted gross
  income (as reported on your federal income tax return)"), and Kansas modifications are made only on Schedule S
  Part A. The 2024 Schedule S Part A "Additions to Federal Adjusted Gross Income" are an enumerated, closed list
  (lines A1-A7): A1 state/municipal bond interest, A2 KPERS contributions, A3 Kansas expensing recapture (K-120EX),
  A4 charitable contributions used for the Low Income Student Scholarship credit (K-70), A5 IRC 163(j) business
  interest expense carryforward, A6 unqualified First-Time Home Buyer savings account withdrawals, and A7 "other
  additions" (whose instructions list only federal income tax refunds, partnership/S-corp/fiduciary adjustments,
  community service contribution credit add-back, LQESP nonqualified withdrawals, energy-credit amortization, nonresident
  ad valorem taxes, and abortion-expense credits). There is NO add-back for federally tax-treaty-exempt income anywhere
  in Part A. Because income exempt under a U.S. tax treaty is already excluded from federal AGI and Kansas has no
  add-back, it flows through and is not re-taxed by Kansas -> conforms. (Source: 2024 Individual Income Tax Booklet,
  ip24.pdf, K-40 Line 1 and Schedule S Part A line-by-line instructions.)'
citation:
  source: 'Kansas DOR — 2024 Individual Income Tax Booklet (ip24.pdf): K-40 Line 1 federal AGI starting point; Schedule
    S Part A additions list and line-by-line instructions (no treaty add-back); residency definitions (Who Must
    File); 2024 filing thresholds; Important Information (April 15, 2025 due date; new standard deduction and exemption
    amounts; new Workforce Retention K-93 and Pregnancy Resource Act K-94 credits); 2024 Kansas Tax Table and 2024
    Tax Computation Worksheet (5.2%/5.58%); payment options/payee'
  url: https://www.ksrevenue.gov/pdf/ip24.pdf
starts_from: federal AGI (K-40 Line 1 = "Federal adjusted gross income (as reported on your federal income tax return)")
residency:
  summary: Kansas taxes by domicile/residence. Per the 2024 booklet, "A Kansas resident for income tax purposes
    is anyone who lives in Kansas, regardless of where they are employed. An individual who is away from Kansas
    for a period of time and has intentions of returning to Kansas is a resident" — a domicile/intent-to-return
    concept; a full-year resident is taxed on all income. A PART-YEAR RESIDENT is a Kansas resident for less than
    12 months during the tax year, must enter the Kansas residency dates on the K-40, and completes Schedule S Part
    B to allocate income. A NONRESIDENT is someone not a resident of Kansas who received income from Kansas sources;
    they must file regardless of the amount of Kansas-source income and complete Schedule S Part B. Military pay
    is taxable only to the service member's state of legal residency; nonresident service members stationed in Kansas
    are taxed only on Kansas-source income.
forms:
  resident: Form K-40 (Kansas Individual Income Tax) — residency status is indicated by checkbox; full-year residents
    complete K-40 (with Schedule S Part A only if they have modifications)
  part_year_or_nonresident: Same Form K-40, with Schedule S (Supplemental Schedule) Part B "Income Allocation for
    Nonresidents and Part-Year Residents" required to compute the nonresident percentage (K-40 line 9 / Schedule
    S line B23). Kansas does not have a separate standalone nonresident form.
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Kansas Earned Income Tax Credit (EITC)
  type: refundable
  eligibility: Kansas residents only (not part-year residents or nonresidents) who qualify for and claim the federal
    Earned Income Tax Credit. A valid SSN is required for the full year for the taxpayer, spouse (if MFJ), and each
    dependent claimed.
  amount: 'Equal to 17% of the taxpayer''s federal EITC. Computed on the EITC Worksheet in the 2024 K-40 instructions:
    Kansas EITC = federal EITC x 17%. The portion that offsets Kansas tax liability goes on line 17 (nonrefundable
    use), and the remainder (worksheet line 4) is refundable and entered on line 23.'
  income_limit_2024: No separate Kansas income limit; eligibility and income phase-out follow the federal EITC rules
    (you must qualify for the federal EITC).
  claimed_on: Form K-40, line 17 (credit against tax) and line 23 (refundable portion); computed on the Earned Income
    Tax Credit (EITC) Worksheet in the 2024 K-40 instructions.
  citation:
    source: Kansas Department of Revenue, 2024 Individual Income Tax Booklet (Form K-40 instructions, ip24.pdf),
      Line 17 / Line 23 instructions and EITC Worksheet (multiply federal EITC by 17%)
    url: https://www.ksrevenue.gov/pdf/ip24.pdf
- name: Food Sales Tax Credit
  type: nonrefundable
  eligibility: 'Must be a Kansas resident for ALL of 2024, AND meet at least one taxpayer-status condition (2024
    K-40 front, lines A-C): (1) had a dependent child who lived with you all year and was under age 18 all of 2024;
    or (2) you (or spouse) were 55 or older all of 2024 (born before January 1, 1969); or (3) you (or spouse) were
    totally and permanently disabled or blind all of 2024, regardless of age. Nonrefundable — it offsets tax on
    line 18 only.'
  amount: $125 for each qualified exemption (2024 K-40 front, Line H = line G qualifying exemptions x $125). Dependents
    age 18 or older (born before January 1, 2007) are subtracted from the exemption count (Line F) and do not qualify,
    and no additional exemption is allowed for head-of-household filing status for this credit.
  income_limit_2024: Federal adjusted gross income of $30,615 or less.
  claimed_on: Form K-40, line 18; computed on lines A through H on the front of Form K-40.
  citation:
    source: Kansas Department of Revenue, 2024 Individual Income Tax Booklet (ip24.pdf), 'Food Sales Tax Credit'
      section and 2024 Form K-40 front (lines A-H)
    url: https://www.ksrevenue.gov/pdf/ip24.pdf
- name: Credit for Child and Dependent Care Expenses
  type: nonrefundable
  eligibility: Kansas residents only - nonresidents and part-year residents are NOT eligible. Available to taxpayers
    who claimed the federal child and dependent care credit on federal Form 2441.
  amount: 'NEW PERCENTAGE FOR 2024: 50% of the amount of the federal credit allowed on federal Form 2441 (2024 booklet,
    Line 14: "Multiply amount of credit allowed on (federal Form 2441) by 50% and enter the result on line 14").
    The 2023 percentage was 25% — do not use it for 2024.'
  income_limit_2024: No separate Kansas income limit stated; tied to the federal Form 2441 credit (which has its
    own federal limits).
  claimed_on: Form K-40, line 14.
  citation:
    source: Kansas Department of Revenue, 2024 Individual Income Tax Booklet (Form K-40 instructions, ip24.pdf),
      Line 14 (Credit for child and dependent care expenses — 50% of the federal Form 2441 credit)
    url: https://www.ksrevenue.gov/pdf/ip24.pdf
- name: Homestead Refund (property tax / circuit-breaker relief)
  type: refundable
  eligibility: 'Kansas resident the entire year of 2024 who OWNED and occupied a Kansas home (homeowners only -
    the 2024 booklet states the program "is not available to renters"), AND meets one of: (1) born before January
    1, 1969 (i.e., 55 or older); or (2) blind or totally and permanently disabled or a disabled veteran all of 2024;
    or (3) had a dependent child who lived with you the entire year, born before January 1, 2024 and under age 18
    all of 2024. Related claims: K-40PT property tax relief (65+ with household income of $24,500 or less) and K-40SVR
    (65+ or disabled veteran or their surviving spouse, household income not more than $56,450); only ONE of K-40H/K-40PT/K-40SVR
    may be filed per household.'
  amount: Refund is a percentage of general property tax paid, based on total household income; the maximum refund
    is $700.
  income_limit_2024: Total household income of $42,600 or less for 2024 (K-40H).
  claimed_on: Form K-40H (Kansas Homestead Claim) - a separate form, not the K-40.
  citation:
    source: Kansas Department of Revenue, 2024 Homestead or Property Tax Refund for Homeowners booklet (k-40hbook24.pdf),
      Homestead refund overview and qualifications ($42,600 income limit, $700 maximum refund; K-40PT $24,500; K-40SVR
      $56,450)
    url: https://www.ksrevenue.gov/pdf/k-40hbook24.pdf
- name: Credit for Taxes Paid to Other States
  type: nonrefundable
  eligibility: Kansas residents whose Kansas adjusted gross income (KAGI, line 3 of K-40) includes income earned
    in another state and who were required to pay income tax to that other state on that income. (Part-year residents
    filing as nonresidents may claim a version via a separate worksheet.) No credit for income from a state with
    no income tax. A copy of the other state's tax return must be enclosed (W-2s are not acceptable).
  amount: 'Determined by the ''Worksheet for Residents'': the credit equals the lesser of (a) the 2024 income tax
    actually paid to the other state (including local political subdivisions), or (b) the maximum credit allowable
    = total Kansas tax x (other-state income included in KAGI / KAGI). The credit cannot exceed the tax liability
    shown on the other state''s return.'
  income_limit_2024: No income limit; the credit is limited by the formula above rather than by an income ceiling.
  claimed_on: Form K-40, line 13; computed on the Worksheet for Residents (or Worksheet for Part-Year Residents
    filing as Nonresidents) in the K-40 instructions.
  citation:
    source: Kansas Department of Revenue, 2024 Individual Income Tax Booklet (Form K-40 instructions, ip24.pdf),
      Line 13 (Credit for taxes paid to other states) and Worksheet for Residents
    url: https://www.ksrevenue.gov/pdf/ip24.pdf
filing_requirement:
  note: 'A full-year Kansas resident must file a 2024 K-40 if (1) they are required to file a federal return, OR
    (2) their Kansas adjusted gross income exceeds the total of their Kansas standard deduction and exemption allowance.
    Minimum gross-income filing thresholds (2024 booklet table — raised by the SB 1 restructure): Single under 65
    = $12,765 (65+ or blind = $13,615; both = $14,465); Married Filing Joint both under 65 = $26,560 (rising to
    $29,360 with all four 65/blind conditions); Head of Household under 65 = $17,660; Married Filing Separate under
    65 = $13,280. Nonresidents must file if they received ANY income from Kansas sources, regardless of amount.
    File to receive a refund of any Kansas withholding regardless of income. (Source: ip24.pdf, "Who Must File a
    Return.")'
mailing_addresses:
  refund_or_no_payment: 'INDIVIDUAL INCOME TAX, KANSAS DEPARTMENT OF REVENUE, PO BOX 750260, TOPEKA, KS 66699-0260
    (printed on the 2024 Form K-40 as "Mail to: Kansas Income Tax, Kansas Dept. of Revenue, PO Box 750260, Topeka,
    KS 66699-0260")'
  with_payment: INDIVIDUAL INCOME TAX, KANSAS DEPARTMENT OF REVENUE, PO BOX 750260, TOPEKA, KS 66699-0260 (Kansas
    uses the same PO Box for both refund/no-balance returns and returns with payment; if paying by check/money order,
    enclose Form K-40V payment voucher — the 2024 K-40V directs payment with voucher to KANSAS INCOME TAX, KANSAS
    DEPARTMENT OF REVENUE, PO BOX 750260, TOPEKA KS 66699-0260)
  citation:
    source: 2024 Form K-40 (k-4024.pdf, 'Mail to' block) and 2024 Form K-40V payment voucher (k-40v24.pdf)
    url: https://www.ksrevenue.gov/pdf/k-4024.pdf
  verification: Some state facts could not be independently re-confirmed — see the pack's `unverified` list; confirm
    at the cited DOR source before relying on a specific figure/address.
payment:
  check_payee: Kansas Income Tax (2024 Form K-40V - 'Make your check or money order payable to "Kansas Income Tax"')
  web_pay_url: https://www.ksrevenue.gov/taxpayment.html
deadlines:
  filing_due_date: '2025-04-15'
  citation:
