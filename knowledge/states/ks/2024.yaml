unverified:
- No explicit Kansas statutory '183-day' statutory-resident bright-line was found in the 2024 booklet; Kansas residency
  is stated in domicile/intent-to-return terms only (the precise day-count statutory test, if any, was not confirmed
  on a .gov page).
- Kansas publishes a single PO Box (PO BOX 750260, TOPEKA KS 66699-0260) for both refund and with-payment returns;
  a separate distinct ZIP/box for balance-due returns was not found, so the with-payment vs refund mailing distinction
  could not be confirmed as different addresses — confirm at the DOR if a distinct balance-due box is expected.
- The 2024 booklet's Exemptions and Dependents instruction zeroes only the DEPENDENTS box for a filer claimed as
  a dependent by another taxpayer ('If you are claimed as a dependent by another taxpayer, enter "0" in the number
  of dependents box'); unlike the 2023 booklet it prints NO rule zeroing the filing-status allowance itself for
  dependent filers. Whether a dependent filer claims the full $9,160 allowance was not restated elsewhere in the
  booklet — confirm at the DOR for a dependent-filer return.
- The statutory citation (2024 Special Session Senate Bill 1) for the two-bracket 5.2%/5.58% structure, the raised
  standard deductions, and the $9,160/$18,320/$2,320 exemption allowances was not re-derived from the session-law
  text; all amounts are two-pass confirmed at the cited official 2024 booklet and 2024 Form K-40.
tax:
  citation:
    source: 'Kansas DOR, 2024 Individual Income Tax booklet (ip24.pdf): 2024 Tax Computation Worksheet (printing the
      two-bracket schedule: Married Filing Joint ''$0 - $46,000'' at ''5.2% (.052)'' subtracting $0, ''$46,001 and over''
      at ''5.58% (.0558)'' subtracting $175; Single/Head of Household/Married Filing Separate ''$0 - $23,000'' at 5.2%
      subtracting $0, ''$23,001 and over'' at 5.58% subtracting $87); 2024 Kansas Tax Table ''for taxable income to
      $100,000''; Important Information + K-40 Instructions — Line 4 Kansas Standard Deduction ($3,605 Single / $8,240
      Married Filing Joint / $6,180 Head of Household / $4,120 Married Filing Separate) and ''WORKSHEET - Standard Deduction
      for People 65 or Older and/or Blind''; Exemptions and Dependents instructions ($18,320 MFJ / $9,160 single-HoH-MFS
      filing-status allowance, $2,320 per dependent, $2,320 additional for Head of Household, $2,250 disabled veteran);
      Line 5 exemption allowance; Line 8 tax-table/worksheet mandate; Filing Status QSS-to-HOH instruction. Second pass:
      the 2024 Form K-40 itself (https://www.ksrevenue.gov/pdf/k-4024.pdf) prints the exemption boxes verbatim (''enter
      "2" ... and enter $18,320''; ''enter "1" ... and $9,160''; ''If Filing Status above is Head of Household, enter
      $2,320''; ''Dependents ... X $2,320''; ''Disabled Veteran ... X $2,250'') — both passes agree.'
    url: https://www.ksrevenue.gov/pdf/ip24.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 23000, rate: 0.052}
    - {over: 23000, but_not_over: null, rate: 0.0558}
    married_filing_jointly:
    - {over: 0, but_not_over: 46000, rate: 0.052}
    - {over: 46000, but_not_over: null, rate: 0.0558}
    married_filing_separately:
    - {over: 0, but_not_over: 23000, rate: 0.052}
    - {over: 23000, but_not_over: null, rate: 0.0558}
    head_of_household:
    - {over: 0, but_not_over: 23000, rate: 0.052}
    - {over: 23000, but_not_over: null, rate: 0.0558}
  base: federal_agi
  tax_line: '2024 Form K-40, Line 8: ''Tax (from Tax Tables or Tax Computation Schedule)''. Instructions: ''LINE 8
    (Tax): If line 7 is $100,000 or less, use the Tax Tables ... to find the amount of your tax. If line 7 is more
    than $100,000, you will need to use the Tax Computation Worksheet ... to compute your tax.'' Line 7 = Line 3 (KAGI)
    minus Line 6 (Line 4 standard/itemized deduction + Line 5 exemption allowance); ''if less than zero, enter 0''.'
  exemptions:
    personal:
      amount: 9160
      note: '2024 RESTRUCTURED filing-status allowance (SB 1, 2024 Special Session), not a per-person $2,250 anymore:
        the K-40 front prints ''Married individuals filing a joint return ... enter "2" in the box ... and enter $18,320''
        and ''Married individuals filing a separate return, individuals with a filing status of Single, or Head of Household
        ... enter "1" ... and $9,160''. Ship $9,160 per exemption: pass exemptions_count=1 for single/HoH/MFS and 2 for
        MFJ (2 x $9,160 = $18,320 exactly). Flows into K-40 Line 5 via the Total Kansas Exemption Amount box — a base
        reduction, not a credit.'
    dependent:
      amount: 2320
      note: '''Dependents, enter the number of individuals you may claim as a dependent ... multiply by $2,320'' (2024
        K-40 front; do NOT include yourself or your spouse). A filer claimed as a dependent by another taxpayer enters
        0 in the dependents box. HEAD OF HOUSEHOLD: the form also grants HoH filers an additional $2,320 (''If Filing
        Status above is Head of Household, enter $2,320'') — the amount equals the per-dependent allowance, so HoH filers
        must ADD 1 to dependents_count to capture it (see notes).'
    disabled_veteran:
      amount: 2250
      note: 'Disabled Veteran Personal Exemption: additional $2,250 per honorably discharged veteran certified by the
        VA as receiving disability compensation at the 100% rate (permanent, service-sustained), 2024 K-40 front ''X $2,250''
        box. NOT applied by calc.state_tax (its $2,250 amount differs from both shipped keys) — claim it on the form and
        it flows into Line 5.'
  standard_deduction:
    single: 3605
    married_filing_jointly: 8240
    married_filing_separately: 4120
    head_of_household: 6180
  notes:
  - '2024 STRUCTURAL CHANGE (SB 1, 2024 Special Session) — DO NOT USE 2023 FIGURES: Kansas replaced the 3.1%/5.25%/5.7%
    three-bracket schedule with TWO brackets — 5.2% on taxable income up to $23,000 ($46,000 married filing joint)
    and 5.58% above. Standard deductions rose to $3,605/$8,240/$6,180/$4,120 (single/MFJ/HoH/MFS). The exemption allowance
    was restructured from $2,250 per person to $18,320 (MFJ) / $9,160 (all other statuses) PLUS $2,320 per dependent,
    $2,320 additional for Head of Household, and $2,250 per disabled veteran.'
  - 'Base guidance: Supply K-40 Line 3, Kansas adjusted gross income (KAGI) = Line 1 federal AGI (''as reported on
    your federal income tax return'') plus or minus Line 2 net modifications from Schedule S Part A (line A25). Most
    filers have no Kansas modifications, in which case Line 3 equals federal AGI. The op then subtracts the shipped
    standard deduction (K-40 Line 4) and the exemption allowance (Line 5) to reach Line 7 taxable income, to which
    the two-bracket schedule applies.'
  - 'EXEMPTION COUNT CONVENTION (2024): pass exemptions_count=1 for single/MFS filers and 2 for married filing jointly
    — the $9,160-per-count math reproduces the form''s $9,160/$18,320 filing-status allowance exactly. Pass dependents_count
    = number of federal dependents (each $2,320; never count yourself or your spouse).'
  - 'HEAD OF HOUSEHOLD: pass exemptions_count=1 AND add 1 to dependents_count — the form grants HoH an additional
    $2,320 exemption (''If Filing Status above is Head of Household, enter $2,320''), which equals the per-dependent
    amount. Example: HoH with 1 dependent -> exemptions_count=1, dependents_count=2 (= $9,160 + $4,640). Missing it
    understates the exemption by $2,320. (For the FOOD SALES TAX CREDIT the HoH extra does NOT count — the booklet
    notes ''Head of Household is not allowed an additional exemption for food sales tax credit.'')'
  - 'QUALIFYING SURVIVING SPOUSE maps to HEAD OF HOUSEHOLD in Kansas, not MFJ: the 2024 booklet Filing Status instruction
    says ''If your federal filing status is Qualifying Widow(er) with Dependent Child, check the Head of Household
    box.'' Do not use a QSS->married_filing_jointly mapping for Kansas — compute QSS filers as head_of_household (single-status
    brackets, $6,180 standard deduction, $9,160 allowance + the extra $2,320 via dependents_count).'
  - 'Tax-table mandate below $100,000: K-40 Line 8 REQUIRES the Tax Tables when Line 7 taxable income is $100,000
    or less; the Tax Computation Worksheet is used only above $100,000. The table uses $50-wide bands (computed at
    band midpoints), so bracket math may differ by a dollar or two within a table band — the filed form must use the
    table.'
  - 'NO zero-tax cliff for 2024 (change from 2023): the 2024 Kansas Tax Table starts at ''$26 - $50 -> $2'' and the
    Tax Computation Worksheet brackets start at $0 — the 2023 table''s $0 rows up to $2,500/$5,000 and the cliff they
    created are GONE. Marginal bracket math applies from the first dollar.'
  - 'Rounded worksheet constants (re-derived for 2024): the Tax Computation Worksheet computes tax as 5.58% x the
    ENTIRE taxable income minus a subtraction amount. The exact continuity constants are $87.40 (Single/HoH/MFS: 5.58%
    x 23,000 - 5.2% x 23,000 = 1,283.40 - 1,196.00) and $174.80 (MFJ, at $46,000); the printed constants are $87 and
    $175. So above the breakpoint the filed worksheet result can be up to $0.40 HIGHER (Single/HoH/MFS) or $0.20 LOWER
    (MFJ) than exact marginal bracket math — up to $1 difference after whole-dollar rounding.'
  - One rate schedule covers Single, Head of Household, and Married Filing Separate ($23,000 breakpoint — the worksheet
    prints a single combined schedule for all three); it is duplicated per status here. Married Filing Joint has its
    own schedule with the breakpoint at exactly twice that ($46,000).
  - 'Standard deduction for people 65 or older and/or blind is NOT modeled: the 2024 booklet worksheet replaces the
    base amounts with $4,455/$5,305 (Single, 1/2 boxes), $8,940/$9,640/$10,340/$11,040 (MFJ, 1-4 boxes), $4,820/$5,520/$6,220/$6,920
    (MFS, 1-4 boxes), $7,030/$7,880 (HOH, 1/2 boxes) — i.e., +$850 per checked box for Single/HOH and +$700 per box
    for MFJ/MFS. Compute K-40 Line 4 from that worksheet in those cases.'
  - Kansas itemized deductions (Kansas Schedule A, K-40 Line 4) may be claimed instead of the standard deduction even
    if the federal return did not itemize — itemizers are not modeled; MFS spouses must both use the same method (if
    one itemizes, both must).
  - 'Claimed as a dependent by another taxpayer: the 2024 instructions zero only the DEPENDENTS box (''enter "0" in
    the number of dependents box''); unlike 2023 they print no rule zeroing the filing-status allowance itself. Confirm
    the dependent-filer treatment at the DOR before relying on the $9,160 allowance for such a filer (see the pack''s
    unverified list).'
