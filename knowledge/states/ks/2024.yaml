    + $2,320 per dependent + $2,250 disabled veteran; new K-93/K-94 credits); Who Must File and 2024 filing thresholds;
    Exemptions and Dependents instructions (incl. HoH additional $2,320 and QSS-to-HOH filing status rule); Line
    4 standard deduction and 65-or-older/blind worksheet; Line 5 exemption allowance; Line 8 tax-table/worksheet
    mandate; 2024 Kansas Tax Table (starting $26-$50 -> $2, no zero cliff) and 2024 Tax Computation Worksheet (MFJ
    5.2% to $46,000, then 5.58% minus $175; Single/HoH/MFS 5.2% to $23,000, then 5.58% minus $87); Schedule S Part
