unverified:
- 'Revenue Online payment URL: the 2025 booklet directs filers to www.oregon.gov/dor and to click on ''Revenue
  Online'' rather than printing a literal payment URL; the portal address recorded in `payment.web_pay_url`
  (revenueonline.dor.oregon.gov) is the login domain that link resolves to — confirm at www.oregon.gov/dor.'
- The 2-D barcode tax-to-pay mailing address (PO Box 14720), which the 2024 Form OR-40 printed alongside PO Box
  14555, does not appear in the 2025 instruction booklet's 'Tax return mailing addresses' block; only PO Box 14700
