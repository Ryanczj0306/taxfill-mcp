tax:
  citation:
    source: '2025 Form OR-40 Instructions, Oregon Individual Income Tax, Full-year Resident (150-101-040-1, Rev. 01-29-26)
      — p.16 line 20 tax computation (tax tables if line 19 is less than $50,000; rate-chart formula if $50,000 or more;
      booklet Examples 1 and 2), p.32 ''2025 Tax rate charts'' (Chart S / Chart J, $50,000-and-over segments: Chart
      S ''your tax is $4,065 plus 8.75% of excess over $50,000'' / ''$10,627 plus 9.9% of excess over $125,000''; Chart
      J ''$3,756 plus 8.75% of excess over $50,000'' / ''$21,256 plus 9.9% of excess over $250,000''), p.16 Table 5
      ''Standard deduction'' ($2,835 single; $5,670 married filing jointly; $2,835 married filing separately if the
      spouse claims the standard deduction, $0 if the spouse itemizes; $4,560 head of household; $5,670 qualifying surviving
      spouse) plus the age-65/blind additions, p.14 Table 4 federal tax liability subtraction AGI phaseout ($8,500 /
      $4,250 for 2025), p.17 line 25 exemption credit worksheet ($256 per exemption CREDIT). Second pass: the FULL four-bracket
      2025 Chart S / Chart J (4.75%, 6.75%, 8.75%, 9.9%; breakpoints $4,400 / $11,100 / $125,000 for S and $8,800 /
      $22,200 / $250,000 for J, with printed constants $209 / $661 / $10,627 and $418 / $1,323 / $21,256) as printed
      in the 2025 Form OR-40-N and OR-40-P Instructions (150-101-048-1, Rev. 12-30-25), p.21 ''2025 Tax rate charts'':
      https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-n_or-40-p-inst_101-048-1_2025.pdf — the resident booklet''s
      $50,000-and-over constants chain exactly onto that schedule (S: $661 + 8.75% x $38,900 = $4,064.75 -> printed
      $4,065; J: $1,323 + 8.75% x $27,800 = $3,755.50 -> printed $3,756), so both passes agree on every rate, breakpoint
      and constant.'
    url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2025.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 4400, rate: 0.0475}
    - {over: 4400, but_not_over: 11100, rate: 0.0675}
