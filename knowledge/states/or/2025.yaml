  base: federal_agi
  tax_line: '2025 Form OR-40, line 20 ''Tax (see instructions)''. Instructions p.16: ''Tax tables. Use the tax tables
    to find your tax if your taxable income on line 19 is less than $50,000.'' and ''Tax rate charts. If your taxable
    income on line 19 is $50,000 or more, calculate your tax using the formula in the tax rate chart for your filing
    status. Use Chart S if your filing status is single or married filing separately. Use Chart J if your filing status
    is married filing jointly, head of household, or qualifying surviving spouse.'''
  exemptions: {}
  standard_deduction:
    single: 2835
    married_filing_jointly: 5670
    married_filing_separately: 2835
    head_of_household: 4560
  notes:
  - 'Base guidance: supply 2025 Form OR-40, line 15 ''Income after subtractions'' (line 9 income after additions minus
    line 14 total subtractions). Line 15 already reflects Oregon additions (Schedule OR-ASC) and all subtractions,
    including the line 10 federal tax liability subtraction (2025 limit $8,500; $4,250 married filing separately;
    phased down by federal AGI per Table 4 — $0 at AGI of $145,000 or more for single/MFS, and at $290,000 or more
    for MFJ/head of household/qualifying surviving spouse) and the new 2025 subtractions that mirror the federal tip-income,
    overtime-wage and passenger vehicle loan interest deductions plus the first-time home buyer savings account (FTHBSA)
    subtraction. The op subtracts only the Table 5 standard deduction to reach line 19 (Oregon taxable income) and
    applies the rate schedule to reproduce line 20. Filers who itemize for Oregon (line 16 Schedule OR-A amount larger
    than the standard deduction) or who claim the age-65-or-older/blind additional standard deduction must compute
    lines 16-19 on the form instead — the op models only the basic per-status standard deduction.'
  - 'Adjudication note (two-pass): base is federal_agi — Form OR-40 line 7 is federal adjusted gross income, and the
    caller supplies the pre-deduction Oregon figure (line 15) so the op can reproduce line 19 by subtracting the standard
    deduction. Vector exemption counts are zero BY DESIGN: Oregon''s personal/dependent exemptions are the $256-per-exemption
    CREDIT on line 25 for 2025 (up from $249 in 2024), income-limited, never a base reduction — exemptions ship as
    {}. Every 2025 boundary was re-indexed upward from 2024 ($4,300 -> $4,400 and $10,750 -> $11,100 on Chart S; $8,600
    -> $8,800 and $21,500 -> $22,200 on Chart J), while the $125,000 / $250,000 top-bracket thresholds and all four
    rates (4.75/6.75/8.75/9.9%) are unchanged; verified across the resident booklet''s $50,000+ chart segments and
    the OR-40-N/OR-40-P full charts.'
  - 'Tax-table mandate below $50,000: the 2025 OR-40 instructions (line 20, p.16) REQUIRE the tax tables when Oregon
    taxable income (line 19) is less than $50,000. The table is built from the rounded chart constants at $100-band
    midpoints, so bracket math may differ by a dollar or two within a band — booklet Example 1: a single filer with
    taxable income $19,525 uses the $19,500-to-$19,600 row and enters $1,400 on line 20, where exact marginal math
    on this schedule is $1,398.44 -> $1,398. The filed form must use the table; the rate-chart formula applies only
    at $50,000 or more.'
  - 'Rounded printed constants: Chart S''s published constants are the exact cumulative bracket sums rounded DOWN
    ($209 is exact; $661 vs $661.25 exact; $10,627 vs $10,627.50 exact; the $50,000+ segment prints $4,065, which
    is both the exact cumulative sum and the value chained from $661), so at and above $125,000 pure marginal bracket
    math (what this op computes) can be up to $1 HIGHER than the printed chart formula. Chart J''s constants are rounded
    UP ($418 is exact; $1,323 vs $1,322.50 exact; $21,256 = $1,323 + 8.75% x $227,800 = $21,255.50 rounded, vs $21,255.00
    exact; the $50,000+ segment prints $3,756 vs $3,755.00 exact), so Chart J formula results run about $1 HIGHER
    than marginal math — booklet Example 2: married filing jointly with taxable income $75,500 computes $3,756 + 8.75%
    x $25,500 = $5,987 on the chart, where exact marginal math gives $5,986.25 -> $5,986.'
  - One schedule covers married filing jointly, head of household, AND qualifying surviving spouse (Chart J / tax-table
    Column J) — head of household brackets are identical to MFJ, and qualifying surviving spouse maps to married_filing_jointly
    with no divergence. Single and married filing separately share Chart S / Column S. Oregon registered domestic
    partners (RDPs) use the married statuses with an 'as if' federal return.
  - 'Oregon''s personal/dependent exemption is a tax CREDIT, not a base reduction, and is NOT shipped as an exemption:
    Form OR-40 line 25 ''Exemption credit'' = $256 per exemption for 2025 (taxpayer, spouse, dependents, plus severe-disability
    and disabled-child exemptions), subtracted from tax after the rate applies; it is $0 when federal AGI exceeds
    $200,000 ($100,000 if single or married filing separately), and the severe-disability/disabled-child counts drop
    out above $100,000 for every status. The calc op does not model this credit.'
  - 'THE 2025 KICKER IS A CREDIT, NOT A RATE OR BASE CHANGE: Oregon''s surplus credit returns on the 2025 return (it
    is claimed in odd tax years — 44.28% on 2023 returns, none on 2024 returns). For 2025 the kicker is 9.863% of
    the filer''s 2024 total Oregon personal income tax liability, claimed on Form OR-40 line 32 in the same way as
    a payment (or donated to the State School Fund). Eligibility requires filing the 2024 return before the 2025 return,
    having had a 2024 Oregon liability, and filing a 2025 return even with no filing requirement. It never touches
    this rate schedule or the base — do not adjust brackets or the standard deduction for it.'
  - 'Standard-deduction gates NOT modeled: married filing separately gets $0 if the other spouse claims itemized deductions
    (the shipped $2,835 assumes the spouse claims the standard deduction); a non-U.S. citizen without permanent resident
    status gets $0 (but may itemize); a person claimable as a dependent on another return is limited to the larger
    of earned income plus $450 or the $1,350 minimum, capped at the basic amount for their status. Compute those cases
    on the form.'
  - 'Age 65-or-older/blind additional standard deduction NOT modeled: each applicable checkbox adds $1,200 (single
    or head of household) or $1,000 (all other filers) to the Table 5 amount — the booklet''s example has a married-filing-jointly
    couple with one spouse who turned 65 by 1/1/2026 entering $6,670 ($5,670 + $1,000). Enter it on the form; this
    op applies only the basic per-status amount.'
  - 'Federal tax liability subtraction is already inside the caller-supplied base (OR-40 line 10 flows into line 15):
    the 2025 limit is $8,500 ($4,250 married filing separately), phased down by federal AGI per Table 4 (single: $8,500
    under $125,000, then $6,800 / $5,100 / $3,400 / $1,700 in $5,000 steps to $0 at $145,000 or more; MFS: $4,250
    under $125,000 stepping to $0 at $145,000 or more; MFJ/head of household/qualifying surviving spouse: $8,500 under
    $250,000, then $6,800 / $5,100 / $3,400 / $1,700 in $10,000 steps to $0 at $290,000 or more).'
  - 'Alternative tax computations on line 20 NOT modeled: Schedule OR-FIA-40 (farm income averaging, box 20a), Worksheet
    FCG in Publication OR-FCG (farm asset capital gain rate, box 20b), and Schedule OR-PTE-FY (Oregon qualified business
    income reduced tax rate, box 20c — an irrevocable election that must be made on the original return) replace the
    table/chart math when elected.'
  - 'Bracket source: the resident OR-40 booklet (p.32) prints Chart S/Chart J only for taxable income of $50,000 or
    more (the tax tables govern below that). The full four-bracket 2025 Chart S/Chart J, including the $4,400 / $11,100
    and $8,800 / $22,200 breakpoints shipped here, is printed in the 2025 Form OR-40-N/OR-40-P instructions (150-101-048-1,
    Rev. 12-30-25) p.21, whose own worked examples corroborate the constants (''Tax on the first $22,200 $1,323 (from
