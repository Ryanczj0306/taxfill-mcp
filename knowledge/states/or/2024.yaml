# OR state knowledge — tax year 2024. Fetched + cited from the OR DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form OR-40
# instruction booklet (150-101-040-1, Rev. 12-13-24), then independently re-derived from
# a second official document — the 2024 Form OR-40 itself (150-101-040, Rev. 08-08-24),
# the 2024 Form OR-40-N/OR-40-P instructions (150-101-048-1, Rev. 10-16-24, which print
# the FULL four-bracket 2024 tax rate charts), or 2024 Publication OR-ESTIMATE
# (150-101-026, Rev. 10-12-23) — resolutions recorded inline where the passes differed.
# Improvement over the 2023 pack: the 2023 'tax-to-pay mailing address discrepancy'
# (PO Box 14555 vs PO Box 14720) is RESOLVED — the 2024 form prints both: 14555 is for
# non-2-D-barcode tax-due returns, 14720 for 2-D-barcode tax-due returns.
# HEADLINE 2024 ITEMS (New information): federal tax liability subtraction limit rose
# to $8,250 ($4,125 MFS); Oregon Kids Credit full-credit income limit $25,750 (phase-out
# to $30,750); exemption credit rose to $249; standard deduction rose to $2,745/$5,495/
# $4,420; NO kicker on the 2024 return (the surplus credit is claimed in odd tax years —
# 2023 had 44.28%; the word 'kicker' does not appear in the 2024 booklet).
jurisdiction: states/or
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Oregon''s resident return (Form OR-40) starts from federal adjusted gross income: 2024 Form OR-40
  line 7 is "Federal adjusted gross income (AGI). Enter your federal AGI from Form 1040, 1040-SR, or 1040-NR, line
  11; or Form 1040-X, line 1C." Oregon taxable income is then built by applying additions (Schedule OR-ASC) and
  subtractions to that federal AGI. The 2024 OR-40 instruction booklet contains no general addition/add-back of
  federally treaty-exempt income (unlike California''s Schedule CA, or CT/MD/MS). Because federally treaty-exempt
  income is already excluded from federal AGI on the 1040 and there is no Oregon add-back code restoring it, the
  treaty exclusion flows through and is NOT re-taxed by Oregon -> conforms. Caveat: confirm against the full
  Schedule OR-ASC / OR-ASC-NP addition code list and Publication OR-17 for any niche addition that could touch a
  specific treaty article.'
citation:
  source: 2024 Form OR-40 Instructions, Full-year Resident (150-101-040-1, Rev. 12-13-24) — line 7 federal AGI
    starting point, residency definitions, 200-day rule, April 15 2025 due date, filing thresholds (Table 1),
    Table 5 standard deduction, line 20 tax computation and 2024 tax rate charts p.28, line 25 exemption credit
    worksheet ($249), New information (federal tax subtraction $8,250, Oregon Kids Credit limits), mailing
    addresses (PO Box 14700 / PO Box 14555), check payee and Revenue Online payment
  url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2024.pdf
starts_from: federal AGI (Form OR-40 line 7 = federal adjusted gross income from federal Form 1040/1040-SR/1040-NR
  line 11, or Form 1040-X line 1C)
residency:
  summary: 'Full-year resident: Oregon is your permanent home and the center of your financial, social, and family
    life (the place you intend to return); you remain a full-year resident through temporary absences. You may ALSO
    be taxed as a full-year resident if your domicile is outside Oregon but you maintained a permanent home in Oregon
    and spent more than 200 days in Oregon during 2024, unless you can show you were in Oregon only for a temporary
    purpose (statutory 200-day rule). Nonresident: your permanent home was outside Oregon all year (Oregon taxes
    only Oregon-source income). Part-year resident: you moved into or out of Oregon during the year (but not merely
    a temporary absence); taxed on all income while an Oregon resident plus Oregon-source income while a nonresident.
    Special cases: "Special-case Oregon residents" who maintained a permanent home outside Oregon the entire year,
    kept no Oregon home, and did not spend more than 200 days in Oregon are treated as nonresidents (file OR-40-N);
    "Oregon residents living abroad" who are qualified individuals for the federal foreign earned income / housing
    exclusion are also treated as nonresidents. An RV is not considered a permanent home outside Oregon. Military
    personnel follow special rules (see the booklet''s "Military personnel" section).'
forms:
  resident: Form OR-40, Oregon Individual Income Tax Return for Full-year Residents (150-101-040, Rev. 08-08-24)
  part_year_or_nonresident: 'Nonresident: Form OR-40-N (150-101-048). Part-year resident: Form OR-40-P (150-101-055).
    Both share the same instruction booklet (150-101-048-1, Rev. 10-16-24).'
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Oregon Earned Income Credit (EIC)
  type: refundable
  eligibility: You must qualify for the federal Earned Income Tax Credit (EITC). Low- to moderate-income working
    individuals and families. ITIN filers who cannot claim any or all of the federal EITC because the taxpayer,
    spouse, or child(ren) do not have an SSN valid for work or use an ITIN may still qualify (see Schedule
    OR-EIC-ITIN, available in English and Spanish). RDPs may claim it if they would otherwise qualify for the EITC
    using their 'as if' federal return.
  amount: 9% (0.09) of your federal EITC if your youngest dependent is at least 3 years old at the end of the tax
    year, or you have no dependents; 12% (0.12) of your federal EITC if your youngest dependent is younger than
    3 at the end of the tax year (2024 Form OR-40 instructions, Table 6 EITC percentage, line 36 — unchanged from
    2023).
  income_limit_2024: Same income limits as the federal EITC (Oregon does not set a separate income cap; eligibility
    follows federal EITC qualification).
  claimed_on: Form OR-40, line 36 (Tax payments and refundable credits section). Computed via the Earned Income
    Credit Worksheet in the OR-40 instructions.
  citation:
    source: Oregon DOR 2024 Form OR-40 Instructions (Full-year Resident), publication 150-101-040-1, Rev. 12-13-24,
      p.19 (line 36, Table 6 EITC percentage — 9 percent (0.09) / 12 percent (0.12)).
    url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2024.pdf
- name: Working Family Household and Dependent Care Credit (WFHDC)
  type: refundable
  eligibility: Low- and middle-income working families who paid qualified expenses for household services or dependent
    care for one or more qualifying individuals (generally a dependent under age 13, or a disabled dependent or
    disabled spouse) so the taxpayer (and spouse, if filing jointly) could work, look for work, or attend school.
    Tied to IRC Section 21; federal Form 2441 must be completed even if the federal credit is not claimed. The care
    provider cannot be your spouse, the parent of the qualifying individual, or a person you can claim as a dependent.
  amount: A refundable credit equal to a percentage of qualified care expenses. Qualified expenses are capped at
    $12,000 for one qualifying individual or $24,000 for two or more (and cannot exceed earned income limits). The
    applicable percentage is based on household size, AGI, and the age of the youngest qualifying individual,
    determined using the DOR WFHDC online calculator or Publication WFHDC-TB (the percentage table is not printed
    in the Schedule OR-WFHDC instructions).
  income_limit_2024: 'Adjusted gross income (Form OR-40 line 7 for full-year residents) must be less than the 2024
    limit for your household size: household size 2 = $61,320; 3 = $77,460; 4 = $93,600; 5 = $109,740; 6 = $125,880;
    7 = $142,020; 8 or more = $158,160. (Student/financial-aid qualification uses a lower AGI table
    by household size: 2 = $22,484; 3 = $28,402; 4 = $34,320; 5 = $40,238; 6 = $46,156; 7 = $52,074; 8 or more =
    $57,992.)'
  claimed_on: Schedule OR-WFHDC (must be included with the return). For Form OR-40 filers the credit flows to the
    refundable credits claimed via Schedule OR-ASC (Form OR-40 line 39, Total refundable credits from Schedule
    OR-ASC).
  citation:
    source: Oregon DOR 2024 Schedule OR-WFHDC Instructions, publication 150-101-195-1, Rev. 10-16-24, pages 1
      (refundable status, $12,000/$24,000 caps, AGI-limit table by household size — $61,320 to $158,160) and 3
      (student AGI-limit table — $22,484 to $57,992).
    url: https://www.oregon.gov/dor/forms/FormsPubs/schedule-or-wfhdc-inst_101-195-1_2024.pdf
- name: Oregon Kids Credit
  type: refundable
  eligibility: Low-income taxpayers with one or more dependents age 5 or younger at the end of 2024 listed on the
    Oregon return. You must use a filing status other than married filing separately. A child listed as a dependent
    only because the custodial parent released the child's dependent exemption to you does NOT qualify.
  amount: 'Up to $1,000 per qualifying dependent age 5 or younger, for up to five dependents (maximum $5,000).
    2024 (indexed): full credit when qualifying income is $25,750 or less; phases down (line 6 of the worksheet:
    excess over $25,750 divided by $5,000) and is unavailable at qualifying income of $30,750 or more.'
  income_limit_2024: Qualifying income (Form OR-40 line 15 income after subtractions, plus the worksheet Part B
    loss add-back for losses over $20,000) must be under $30,750. Full credit at $25,750 or less; partial credit
    between $25,750 and $30,750.
  claimed_on: Form OR-40, line 37 (Tax payments and refundable credits section). Computed via the Oregon Kids Credit
    Worksheet in the OR-40 instructions.
  citation:
    source: Oregon DOR 2024 Form OR-40 Instructions (Full-year Resident), publication 150-101-040-1, Rev. 12-13-24,
      New information p.4 ('For 2024, the income limit for the full credit is $25,750 ... $1,000 per qualifying
      dependent child, and phases down to zero for income at or above $30,750') and pp.19-20 (line 37 worksheet,
      phaseout amount $25,750, divide-by-$5,000 reduction, up to five dependents).
    url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2024.pdf
- name: Exemption credit
  type: nonrefundable
  eligibility: Available to the taxpayer, spouse (if filing jointly), and qualifying dependents (a personal exemption
    credit per allowed exemption, plus severely-disabled and disabled-child exemptions). Phased out (to $0) for
    higher-income filers.
  amount: '$249 for each qualifying exemption for 2024 (2024 Exemption credit worksheet, line 5: line 4 times $249;
    the 2024 Form OR-40 line 25 prints "If the amount on line 7 is $100,000 or less, multiply your total exemptions
    on line 6e by $249"). Up from $236 in 2023.'
  income_limit_2024: Credit is $0 if federal AGI is more than $200,000 (or more than $100,000 if filing status is
    single or married filing separately). The severe-disability and disabled-child exemption credits are $0 if
    federal AGI is more than $100,000 regardless of status.
  claimed_on: Form OR-40, line 25 (Standard and carryforward credits section). Computed via the Exemption credit
    worksheet in the OR-40 instructions.
  citation:
    source: Oregon DOR 2024 Form OR-40 Instructions (Full-year Resident), publication 150-101-040-1, Rev. 12-13-24,
      pp.17-18 (line 25 exemption credit worksheet, line 4 times $249, $200,000/$100,000 federal AGI phaseout);
      second pass — 2024 Form OR-40 line 25 (printed 'multiply your total exemptions on line 6e by $249') and 2024
      Publication OR-ESTIMATE example ('Personal exemption credit ($249 x 5)').
    url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2024.pdf
