      AGI phaseout ($8,250/$4,125 2024 limits), pp.17-18 line 25 exemption credit worksheet ($249/exemption CREDIT).
      Full four-bracket 2024 Chart S / Chart J (4.75%, 6.75%, 8.75%, 9.9%; breakpoints $4,300/$10,750/$125,000 and $8,600/$21,500/$250,000)
      as printed in the 2024 Form OR-40-N and OR-40-P Instructions (150-101-048-1, Rev. 10-16-24), ''2024 Tax rate charts'',
