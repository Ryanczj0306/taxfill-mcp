unverified:
- Treaty conformity confirmed structurally (federal AGI start + no visible treaty add-back in the 2024 OR-40 booklet)
  but the complete Schedule OR-ASC / OR-ASC-NP addition code list and Publication OR-17 were not exhaustively reviewed
  for any niche addition code that could restore a specific treaty-exempt item; confirm at the Oregon DOR if a
  particular treaty article is at issue.
- The WFHDC household-size AGI limits were taken from the 2024 Schedule OR-WFHDC instructions tables; the applicable
  credit PERCENTAGE table itself is published only in the DOR's WFHDC online calculator / Publication WFHDC-TB and
  was not re-derived here.
- 'No-kicker inference: the 2024 booklet contains no surplus-credit (kicker) line and the word ''kicker'' does not
  appear; the kicker is claimed on odd-year returns (44.28% on 2023 returns; the next on 2025 returns). No .gov page
  affirmatively stating ''there is no 2024 kicker'' was captured — confirm at the DOR.'
- Nonresident/part-year (OR-40-N / OR-40-P) line-by-line mechanics beyond the rate charts, standard deduction, and
  exemption credit were not individually verified from the OR-40-N/P booklet text; confirm at the DOR before relying
  on OR-40-N/P specifics.
