  base: federal_agi
  tax_line: 'Form OR-40, line 20 "Tax (see instructions)". Instructions p.16: "Tax tables. Use the tax tables to find
    your tax if your taxable income on line 19 is less than $50,000." and "Tax rate charts. If your taxable income
    on line 19 is $50,000 or more, calculate your tax using the formula in the tax rate chart for your filing status.
    Use Chart S if your filing status is single or married filing separately. Use Chart J if your filing status is
    married filing jointly, head of household, or qualifying surviving spouse."'
  exemptions: {}
  standard_deduction:
    single: 2745
    married_filing_jointly: 5495
    married_filing_separately: 2745
    head_of_household: 4420
  notes:
  - 'Base guidance: Supply 2024 Form OR-40, line 15 "Income after subtractions" (line 9 income after additions minus
    line 14 total subtractions). Line 15 already reflects Oregon additions (Schedule OR-ASC) and all subtractions,
    including the line 10 federal tax liability subtraction (2024 limit $8,250; $4,125 married filing separately;
    phased down by federal AGI per Table 4 — $0 at AGI of $145,000+ single/MFS or $290,000+ MFJ/HoH/QSS). The op subtracts
    only the Table 5 standard deduction to reach line 19 (Oregon taxable income) and applies the rate schedule. Filers
    who itemize for Oregon (line 16 Schedule OR-A amount larger than the standard deduction) or who claim the age-65+/blind
    additional standard deduction must compute lines 17-19 on the form instead — the op models only the basic per-status
    standard deduction.'
  - 'Adjudication note (two-pass): base is federal_agi — Form OR-40 line 7 is federal adjusted gross income; supply
    the pre-deduction Oregon income figure (line 19 taxable income = line 15 minus the line 16/17 deduction is what
    the op reproduces by subtracting the standard deduction). Vector counts are zero by design: Oregon personal/dependent
    exemptions are the $249-per-exemption CREDIT on line 25 (2024, up from $236 in 2023), income-limited, never a
    base reduction. 2024 indexing verified across three documents: OR-40 booklet charts ($50,000+ segments), OR-40-N/P
    instructions (full four-bracket charts), and Publication OR-ESTIMATE (full charts) — all agree on $4,300/$10,750/$125,000
    (S) and $8,600/$21,500/$250,000 (J).'
  - 'Tax-table mandate below $50,000: the 2024 OR-40 instructions (line 20, p.16) REQUIRE the tax tables when Oregon
    taxable income (line 19) is less than $50,000 — the table is built from the rounded chart constants at $100-band
    midpoints, so bracket math may differ by a few dollars within a band (booklet Example 1: single, taxable income
    $19,525 — table tax $1,409 vs. pure bracket math $1,409.63 -> $1,410); the filed form must use the table. The
    rate-chart formula applies only at $50,000 or more.'
  - 'Rounded printed constants: Chart S''s published ''$X plus Y% of excess'' constants are the exact cumulative bracket
    sums rounded DOWN ($204 vs $204.25; $639 vs $639.625; $10,636 vs $10,636.50; the $50,000+ segment prints $4,073
    vs $4,074.00 exact), so pure marginal bracket math (what this op computes) can be up to $1 HIGHER than the printed
    chart formula. Chart J''s constants are rounded UP ($409 vs $408.50; $1,280 vs $1,279.25; $21,274 vs $21,273.00;
    the $50,000+ segment prints $3,774 vs $3,773.00 exact), so chart-formula results can be up to $1 higher than marginal
    math (booklet Example 2: MFJ $75,500 — chart $6,005 vs marginal math $6,004.25 -> $6,004).'
  - One schedule covers married filing jointly, head of household, AND qualifying surviving spouse (Chart J / tax-table
    Column J) — head of household brackets are identical to MFJ, and qualifying surviving spouse maps to married_filing_jointly
    with no divergence. Single and married filing separately share Chart S / Column S. Oregon registered domestic
    partners (RDPs) use the married statuses.
  - 'Oregon''s personal/dependent exemption is a tax CREDIT, not a base reduction, and is NOT shipped as an exemption:
    Form OR-40 line 25 ''Exemption credit'' = $249 per exemption for 2024 (taxpayer, spouse, dependents, plus severely-disabled
    and disabled-child exemptions), subtracted from tax after the rate applies; it is $0 when federal AGI exceeds
    $200,000 ($100,000 if single or married filing separately). The calc op does not model this credit.'
  - 'Standard-deduction gates NOT modeled: married filing separately gets $0 if the other spouse claims itemized deductions;
    a non-U.S. citizen without permanent resident status gets $0 (but may itemize); a person claimable as a dependent
    on another return is limited to the larger of earned income + $450 or $1,300, capped at the basic amount for their
    status. Compute those cases on the form.'
  - 'Age 65+/blind additional standard deduction NOT modeled: each applicable checkbox below line 17 adds $1,200 (single
    or head of household) or $1,000 (all other filers) to the Table 5 standard deduction (booklet example: MFJ couple
    with one spouse 65+ enters $6,495 = $5,495 + $1,000) — enter it on the form; this op applies only the basic per-status
    amount.'
  - 'Federal tax liability subtraction is already inside the caller-supplied base (OR-40 line 10 flows into line 15):
    2024 limit $8,250 ($4,125 married filing separately), phased down by federal AGI per Table 4 (single: $8,250 under
    $125,000 stepping to $0 at $145,000+; MFS: $4,125 stepping to $0 at $145,000+; MFJ/HoH/QSS: $8,250 under $250,000
    stepping to $0 at $290,000+).'
  - 'NO kicker on the 2024 return: Oregon''s surplus (kicker) credit is claimed on odd-year returns (44.28% on 2023
    returns; the next on 2025 returns) — the 2024 booklet has no kicker line and the word does not appear.'
  - 'Alternative tax computations on line 20 NOT modeled: Schedule OR-FIA-40 (farm income averaging, box 20a), Worksheet
    FCG in Publication OR-FCG (farm asset capital gain rate, box 20b), and Schedule OR-PTE-FY (qualified business
    income reduced tax rate, box 20c — irrevocable election) replace the table/chart math when elected.'
  - 'Bracket source: the OR-40 booklet (p.28) prints Chart S/Chart J only for taxable income of $50,000 or more (the
    tables govern below); the full four-bracket 2024 Chart S/Chart J including the $4,300/$10,750 and $8,600/$21,500
    breakpoints is printed in the 2024 Form OR-40-N/OR-40-P instructions (150-101-048-1, Rev. 10-16-24) and in 2024
    Publication OR-ESTIMATE (150-101-026), p.3: https://www.oregon.gov/dor/forms/FormsPubs/publication-or-estimate_101-026_2024.pdf
