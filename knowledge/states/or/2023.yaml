effective_law_changes:
- description: >-
    NEW for tax year 2023: the Oregon Kids Credit, a REFUNDABLE credit of up to $1,000 per
    qualifying dependent age 5 or younger at the end of 2023, for up to five dependents. The
    full $1,000-per-child amount is allowed when qualifying income is $25,000 or less; it phases
    out between $25,000 and $30,000 and is unavailable at $30,000 or more (the worksheet STOPs
    there). Filing status must be single, married filing jointly, head of household, or
    qualifying surviving spouse — married filing separately does not qualify. Claimed on Form
    OR-40 line 37 via the Oregon Kids Credit Worksheet in the OR-40 instructions.
  status: final_form_published
  affects:
  - credits (Oregon Kids Credit)
  - Form OR-40 line 37 (refundable credits)
  modeled: false
  lookup_path: >-
    2023 Form OR-40 Instructions (150-101-040-1, Rev. 12-06-23) pp. 18-19, the Oregon Kids Credit
    Worksheet (the citation URL), for the per-child amount, the age test and the phase-out; this op
    returns Form OR-40 line 20 and applies no Oregon credits.
  citation:
    source: >-
      Oregon DOR 2023 Form OR-40 Instructions (Full-year Resident), publication 150-101-040-1, Rev. 12-06-23,
      pages 18-19 (line 37, credit amount up to $1,000 per dependent, age 5 or younger, qualifying income under
      $30,000, $25,000 phaseout amount, max 5 children).
    url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2023.pdf
- description: >-
    Claimable only on the 2023 return: the Oregon surplus ("kicker") credit — a refundable credit
    equal to 44.28% of the filer's 2022 total Oregon personal income tax liability (before
    payments and before credits other than the credit for taxes paid to another state). It exists
    for 2023 with that year-specific percentage and is reported in the OR-40 refundable-credits
    area (instructions p. 19); it is not part of the rate schedule and is not modeled.
  status: final_form_published
  affects:
  - Form OR-40 refundable credits (lines 36-39 area per the instructions)
  - Schedule OR-ASC
  modeled: false
  lookup_path: >-
    2023 Form OR-40 Instructions (150-101-040-1, Rev. 12-06-23) p. 19 kicker instructions (the citation
    URL) for the 44.28% rate and where to report it; the 2022 tax figure it multiplies comes from the
    filer's own 2022 Oregon return, and calc.state_tax applies no Oregon credits.
