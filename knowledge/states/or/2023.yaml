tax:
  citation:
    source: 2023 Form OR-40 Instructions, Oregon Individual Income Tax, Full-year Resident (150-101-040-1, Rev. 12-06-23)
      — p. 16 line 20 tax computation (tax tables if line 19 < $50,000; rate-chart formula if $50,000 or more; booklet
      Examples 1 and 2), p. 30 "2023 Tax rate charts" (Chart S / Chart J, $50,000-and-over segments) and 2023 Tax Tables,
      p. 15 Table 5 "Standard deduction" ($2,605 single; $5,210 MFJ; $2,605/$0 MFS; $4,195 HoH; $5,210 QSS) plus age-65/blind
      additions, p. 14 Table 4 federal tax liability subtraction AGI phaseout, p. 17 line 25 exemption credit worksheet
      ($236/exemption CREDIT). Full four-bracket 2023 Chart S / Chart J (4.75%, 6.75%, 8.75%, 9.9%; breakpoints $4,050/$10,200/$125,000
      and $8,100/$20,400/$250,000) as printed in 2023 Publication OR-ESTIMATE, Oregon Estimated Income Tax Instructions
      (150-101-026, Rev. 02-15-23), p. 3 of 6, https://www.oregon.gov/dor/forms/FormsPubs/publication-or-estimate_101-026_2023.pdf
    url: https://www.oregon.gov/dor/forms/FormsPubs/form-or-40-inst_101-040-1_2023.pdf
