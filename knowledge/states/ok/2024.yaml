  base: state_gross_income
  tax_line: 'Form 511, line 14(a): ''Oklahoma Income Tax from Tax Table (see pages 27-38 of instructions)'', computed
    on line 13 ''Oklahoma Taxable Income (line 9 minus line 12)'', where line 12 = ''Total deductions and exemptions
    (add lines 10 and 11 or amount from Sch. 511-E, line 5)''.'
  exemptions:
    personal:
      amount: 1000
      note: 'Regular exemption, Form 511 line 11: ''Oklahoma allows $1,000 for each exemption claimed on the top of the
        return'' — one for yourself and one for your spouse (if not claimed as a dependent elsewhere). If you can be claimed
        as a dependent on another person''s return, your own regular exemption is 0 (you still qualify for the Oklahoma
        standard deduction).'
    dependent:
      amount: 1000
      note: $1,000 for each dependent claimed at the top of Form 511 (usually equals the number of dependents on your
        federal return); included in the Form 511 line 11 total (number of exemptions x $1,000).
    age_65:
      amount: 1000
      note: '''Special'' additional $1,000 exemption per taxpayer/spouse who is 65 or older at the close of the tax year,
        allowed ONLY if Form 511 line 1 Federal AGI does not exceed: $15,000 single / $25,000 joint / $12,500 married
        filing separate / $19,000 head of household (2024 packet, Top of Form Instructions). NOT applied by calc.state_tax
        — if eligible, claim it in the exemption boxes at the top of Form 511 and it flows into line 11.'
    blind:
      amount: 1000
      note: Additional $1,000 exemption per taxpayer/spouse who is legally blind; part of the top-of-form exemption count
        flowing into Form 511 line 11. NOT applied by calc.state_tax — claim it on the form.
  standard_deduction:
    single: 6350
    married_filing_jointly: 12700
    married_filing_separately: 6350
    head_of_household: 9350
  notes:
  - '2024 CHANGE — MFJ/HOH/SURVIVING-SPOUSE TOP-TWO BRACKETS RE-INDEXED: the packet''s What''s New states ''Income
    levels are adjusted for the top two income tax rate brackets for income tax returns with a filing status of married
    filing joint, head of household or surviving spouse.'' The 3.75% band widened from $9,800-$12,200 (2023) to $9,800-$14,400,
    so 4.75% now starts at $14,400; verified against BOTH the packet''s $100,000+ worksheet constant (now $4,373;
    2023: $4,395) and printed table rows spanning the old/new breakpoints (e.g. $12,200-$12,250 -> $225 = 2024 math,
    not 2023''s $226; $14,400-$14,450 -> $308), AND 68 O.S. § 2355(C) ''For tax years 2024 and 2025'' (3.75% on ''next
    $4,600.00''). Single/MFS brackets and all six rates (0.25%-4.75%) are unchanged from 2023.'
  - 'Base guidance: Supply 2024 Form 511, line 9 ''Oklahoma income after adjustments (line 7 minus line 8)''. Line
    1 starts from federal AGI; lines 2-8 apply Oklahoma subtractions (Schedule 511-A), out-of-state income (line 4),
    Oklahoma additions (Schedule 511-B) and Oklahoma adjustments (Schedule 511-C) to reach line 9. The op then subtracts
    the shipped per-status standard deduction (Form 511 line 10) and $1,000 per exemption/dependent (Form 511 line
    11) to reproduce line 13 ''Oklahoma Taxable Income'', and applies the brackets to reproduce line 14a. Do NOT pre-subtract
    deductions or exemptions from the figure you supply. If Form 511 line 4 (out-of-state income) is more than zero,
    or you itemize, the shipped fixed deduction/exemption amounts do not apply — see notes.'
  - 'Tax Table mandate below $100,000: Form 511 line 14a instructs ''Oklahoma Income Tax from Tax Table (see pages
    27-38 of instructions)''. The table''s $50-wide bands compute tax at the band midpoint, so plain bracket math
    may differ from the table by a few dollars within a band. The filed form must use the table below $100,000.'
  - 'Taxable income of $100,000 or more uses the packet''s worksheets (p. 38): Single/MFS tax = $4,562 plus 0.0475
    of the excess over $100,000; MFJ/HOH/Qualified Widow(er) tax = $4,373 plus 0.0475 of the excess over $100,000.'
  - 'Printed worksheet constants vs exact bracket sums (re-derived for 2024): the MFJ/HOH/QW constant $4,373 exactly
    equals the cumulative bracket sum at $100,000 ($307.00 through $14,400, plus 4.75% x $85,600 = $4,066); the Single/MFS
    constant $4,562 is the exact cumulative sum $4,561.50 rounded up $0.50, so above $100,000 the Single/MFS form
    worksheet can come out $1 higher than exact marginal bracket math after whole-dollar rounding.'
  - 'Bracket schedule source: the 2024 Form 511 packet prints only the Tax Table and the $100,000+ worksheets, not
    a marginal rate schedule. The brackets shipped here are copied verbatim from 68 O.S. § 2355(C) as in force for
    tax years 2024 and 2025 (current OSCN text, https://www.oscn.net/applications/oscn/DeliverDocument.asp?CiteID=92565
    — the Oklahoma State Courts Network is the state courts'' official statute publisher). Every bracket boundary
    was cross-checked against the packet''s printed table rows and worksheet constants. NOTE for future maintainers:
    subsection D of the same section prints a DIFFERENT schedule ''For tax year 2026 and for subsequent tax years''
    (0%/2.5%/3.5%/4.5%) — do not use it for 2024/2025.'
  - 'One schedule covers Single and Married Filing Separately (identical thresholds — 68 O.S. § 2355(C)(1)); a second
    schedule covers Married Filing Jointly, surviving spouse, AND Head of Household (68 O.S. § 2355(C)(2)) — HOH is
    NOT a separate schedule; it is duplicated from MFJ here. The tax table likewise has only two columns: ''Single
    or married filing separate'' and ''Married filing joint or head of household''.'
  - 'Qualifying surviving spouse uses the married-filing-jointly column and schedule (2024 tax table footnote: ''This
    column must also be used by a Qualified Surviving Spouse''; the statute includes surviving spouses in the MFJ
    paragraph; the line 10 instructions give QSS the $12,700 standard deduction) — the engine''s QSS -> married_filing_jointly
    mapping is correct for Oklahoma.'
  - 'Out-of-state income gate: if Form 511 line 4 (out-of-state income, except wages) is more than zero, do NOT complete
    lines 10-11 — Schedule 511-E prorates deductions and exemptions instead, so the fixed standard deduction and $1,000
    exemptions shipped here do not apply; compute on the form.'
  - 'Itemizers: if you claimed itemized deductions on your federal return you MUST claim Oklahoma itemized deductions
    (Schedule 511-D) instead of the standard deduction; Oklahoma itemized deductions are capped at $17,000 (charitable
    contributions and medical expenses are not subject to the cap). The shipped standard deduction applies only to
    federal standard-deduction claimants. You qualify for the Oklahoma standard deduction even when claimed as a dependent
    on another return.'
  - 'Form 511 line 14b add-ons are NOT modeled: the additional 10% tax on nonqualified Health Savings Account withdrawals,
    recapture of the Oklahoma Affordable Housing Tax Credit, and IRC Section 965(h) installment payments. Farm Income
    Averaging (Form 573, entered on line 14a with a ''1'' in the box) is also not modeled.'
  - Oklahoma's personal/dependent allowances are true income-base exemptions (Form 511 line 11 is subtracted from
    income before the rate applies via lines 12-13), not tax credits. Separately, Oklahoma's Child Care/Child Tax
    Credit (line 15, Schedule 511-F), Oklahoma EIC (line 28, Schedule 511-G, 5% of the federal EIC under 2020 rules),
    Sales Tax Relief Credit (line 25, Form 538-S, $40/exemption), Property Tax Relief credit (line 24, Form 538-H),
    and the NEW-for-2024 Parental Choice Tax Credit for Homeschool Expenses (line 29, Form 591-D) are CREDITS against
    tax and are not part of this computation.
  - All Form 511 money entries are whole dollars ('00' boxes); the packet's rounding rule ('$2.50 to $2.99 - round
    up to $3.00') matches the engine's round-half-up to whole dollars.
# Promoted from this pack's own prose on 2026-08-11 (DEV_PLAN section 7.2): the three 2024
# deltas already recorded in this pack's header comment, treaty_note, credits list and
# tax.notes (all sourced to the packet's What's New page). modeled: true only for the
# re-indexed MFJ/HOH/surviving-spouse top-two brackets, which tax.brackets already ships;
# the new Parental Choice credit and the new bonus-depreciation add-back are NOT computed by
# calc.state_tax (it reproduces Form 511 line 14a only and applies no Oklahoma credits and no
# Schedule 511-B additions), so they stay false.
effective_law_changes:
- description: >-
    BRACKET CHANGE for 2024 — the packet's What's New states "Income levels are adjusted for
    the top two income tax rate brackets for income tax returns with a filing status of married
    filing joint, head of household or surviving spouse." The MFJ/HOH/surviving-spouse 3.75%
    band widened from $9,800-$12,200 (2023) to $9,800-$14,400, so the 4.75% top rate now starts
