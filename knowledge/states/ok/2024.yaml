# OK state knowledge — tax year 2024. Fetched + cited from the OK Tax Commission (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form 511 resident
# packet (forms + instructions + tax table + $100,000 worksheets), then independently
# re-derived from a second official source (68 O.S. § 2355(C) as in force "For tax years
# 2024 and 2025" on the official Oklahoma State Courts Network, and the 2024 Form 511-V
# voucher) — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGE (What's New): "Income levels are adjusted for the top two income
# tax rate brackets for income tax returns with a filing status of married filing joint,
# head of household or surviving spouse" — the MFJ/HOH/QSS 3.75% band widened from
# $9,800-$12,200 to $9,800-$14,400 (4.75% now starts at $14,400), and the packet's
# $100,000 worksheet constant fell from $4,395 to $4,373. Single/MFS brackets, all six
# rates (0.25%-4.75%), and the standard deductions ($6,350/$12,700/$9,350) are unchanged.
jurisdiction: states/ok
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Oklahoma''s resident return (Form 511) starts at line 1 from "Federal adjusted gross income (from
  Federal 1040 or 1040-SR)" and then applies Schedule 511-A (Oklahoma subtractions) and Schedule 511-B (Oklahoma
  additions) to arrive at Oklahoma AGI. The complete Schedule 511-B additions list for 2024 is closed and enumerated:
  (B1) state and municipal bond interest, (B2) out-of-state losses, (B3) lump-sum distributions not in federal AGI,
  (B4) federal net operating loss, (B5) recapture of depletion / excess federal depletion, (B6) recapture of Oklahoma
  529 contributions, (B7) Oklahoma loss distributed by an electing PTE, (B8) Oklahoma bonus depreciation add-back
  (new for 2024), (B9) miscellaneous other additions. There is NO add-back of federally treaty-exempt income anywhere
  in the 2024 resident packet (a full-text search of the packet for "treaty"/"treaties" returns zero hits). Because
  OK begins from federal AGI and does not add treaty income back (unlike CA Schedule CA), federally treaty-exempt
  income already excluded from federal AGI flows through and is NOT re-taxed by Oklahoma. Therefore conforms = true.'
citation:
  source: '2024 Form 511 - Oklahoma Resident Individual Income Tax Forms and Instructions packet (Oklahoma Tax Commission).
    Source for: Form 511 line 1 = Federal AGI starting point; Schedule 511-B additions list (no treaty add-back);
    resident/part-year/nonresident domicile definitions; What''s New (MFJ/HOH/surviving-spouse top-two bracket income
    levels adjusted; Parental Choice Tax Credit for Homeschool Expenses added to Form 511); due date April 15, 2025
    (April 20 e-file/e-pay); WHO MUST FILE thresholds; ''When You Are Finished'' mailing to PO Box 26800, OKC 73126-0800;
    check payable to Oklahoma Tax Commission; OkTAP at tax.ok.gov.'
  url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2024/511-Pkt-2024.pdf
starts_from: 'federal AGI (Form 511 line 1: "Federal adjusted gross income (from Federal 1040 or 1040-SR)")'
residency:
  summary: Domicile-based. Resident = a person domiciled in Oklahoma for the entire tax year ("Domicile" is the
    true, fixed, and permanent home you intend to return to; once established it remains until a new one is adopted).
    Part-year resident = an individual whose domicile was in Oklahoma for less than 12 months during the tax year.
    Nonresident = an individual whose domicile was not in Oklahoma for any portion of the tax year. Military residency
    follows the SCRA (as amended by the Veterans Auto and Education Improvement Act of 2022); an Oklahoma resident
    who enters military service remains an Oklahoma resident until establishing permanent residence in another state
    and changing military records (DD2058); under the VAEIA, for any taxable year of marriage, the servicemember
    and spouse may elect a state of residence based on the servicemember's residence, the spouse's residence, or
    the permanent duty station. Resident income = all income reported on the federal return except income from real/tangible
    personal property located in another state, business activity in another state, or gains/losses on sale of real
    property in another state.
forms:
  resident: Form 511 - Oklahoma Resident Individual Income Tax Return (2024)
  part_year_or_nonresident: Form 511-NR - Oklahoma Nonresident/Part-Year Resident Income Tax Return (2024)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Oklahoma Earned Income Credit (EIC)
  type: refundable
  eligibility: Resident and part-year resident filers who qualify for the federal Earned Income Credit. The federal
    EIC is recalculated using the federal EITC eligibility/computation rules in effect for the 2020 tax year. A copy
    of the federal return and OTC Form 511-EIC must be provided.
  amount: 5% of the federal earned income credit (computed under 2020 federal rules), computed on Schedule 511-G
    with Form 511-EIC.
  income_limit_2024: No separate Oklahoma income limit; eligibility follows the federal EITC income limits/phase-outs
    as in effect for tax year 2020.
  claimed_on: Form 511, line 28 (computed on Schedule 511-G; included in 'payments and credits' and refundable for
    2024).
  citation:
    source: Oklahoma Tax Commission, 2024 Oklahoma Resident Individual Income Tax Forms and Instructions (Form 511
      packet) - Line 28 instructions and Schedule 511-G
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2024/511-Pkt-2024.pdf
- name: Child Care / Child Tax Credit
  type: nonrefundable
  eligibility: Filers whose Federal AGI is $100,000 or less and who are allowed either the federal credit for child
    care expenses or the federal child tax credit. Must provide a copy of the federal return and, if applicable,
    the federal child care credit schedule. If Oklahoma AGI (line 7) is less than Federal AGI (line 1), compute on
    Schedule 511-F (prorated).
  amount: 'The greater of: (a) 20% of the federal credit for child care expenses allowed by the IRC, OR (b) 5% of
    the federal child tax credit (including both the nonrefundable child tax credit and the refundable additional
    child tax credit). Prorated on Schedule 511-F when Oklahoma AGI is less than Federal AGI.'
  income_limit_2024: Federal AGI of $100,000 or less. If Federal AGI is greater than $100,000, no credit is allowed.
  claimed_on: Form 511, line 15 (computed on Schedule 511-F when Oklahoma AGI is less than Federal AGI); subtracted
    from tax before line 18, making it nonrefundable.
  citation:
    source: Oklahoma Tax Commission, 2024 Form 511 packet - Line 15 instructions and Schedule 511-F
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2024/511-Pkt-2024.pdf
- name: Sales Tax Relief Credit (Sales Tax Refund)
  type: refundable
  eligibility: 'Must be an Oklahoma resident for the entire year. General income limit is $20,000 of total gross
    household income, raised to $50,000 if any one of the following applies: you can claim an exemption for a dependent;
    you and/or your spouse are 65 or older by 12/31/2024; or you have a physical disability constituting a substantial
    handicap to employment (proof required). Excluded: anyone who received TANF in any month of 2024; felons who
    were DOC inmates for any part of the year. Claimed on Form 538-S (included in the 2024 packet).'
  amount: $40 per qualified exemption (2024 Form 538-S line 15, 'Total qualified exemptions claimed in Box D on
    page 1 x $40').
  income_limit_2024: $20,000 total gross household income (general), or $50,000 if you have a dependent, are 65+,
    or are disabled.
  claimed_on: Form 538-S, line 15; carried to Form 511, line 25 (refundable).
  citation:
    source: Oklahoma Tax Commission, 2024 Form 511 packet - Line 25 instructions and 2024 Form 538-S 'Claim for
      Credit/Refund of Sales Tax' (included in the packet)
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2024/511-Pkt-2024.pdf
- name: Credit for Property Tax Relief (Low Income Property Tax Credit)
  type: refundable
  eligibility: Any person 65 years of age or older, or any totally disabled person, who is head of a household and
    was a resident of and domiciled in Oklahoma during the entire preceding calendar year, and whose gross household
    income for that year does not exceed $12,000. The claim is for property taxes paid on the household occupied
    during the preceding calendar year. Claim must be made on Form 538-H.
  amount: Based on property taxes paid on the occupied household during the preceding year; the credit may not exceed
    $200.
  income_limit_2024: Gross household income must not exceed $12,000.
  claimed_on: Form 538-H; carried to Form 511, line 24 ('Credit for Property Tax Relief'; refundable).
  citation:
    source: Oklahoma Tax Commission, 2024 Form 511 packet - Line 24 instructions ('Credit for Property Tax Relief')
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2024/511-Pkt-2024.pdf
- name: Parental Choice Tax Credit for Homeschool Expenses (NEW on Form 511 for 2024)
  type: nonrefundable
  eligibility: Taxpayers who paid qualified expenses to homeschool an eligible student; compute on Form 591-D (available
    at tax.ok.gov). Added to Form 511 for 2024 per the packet's What's New.
  amount: Per Form 591-D (the packet directs 'Complete Form 591-D to determine the amount to enter on line 29').
  income_limit_2024: See Form 591-D.
  claimed_on: Form 511, line 29 (provide Form 591-D).
  citation:
    source: Oklahoma Tax Commission, 2024 Form 511 packet - What's New and Line 29 instructions (Parental Choice
      Tax Credit for Homeschool Expenses, Form 591-D)
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2024/511-Pkt-2024.pdf
filing_requirement:
  note: 'Resident: every resident individual whose gross income from both within and outside Oklahoma exceeds the
    standard deduction plus personal exemption must file (Form 511); see the charts on page 5 of the 2024 511 packet.
    Part-year resident: same filing requirements as a resident during the period of residency; during the period
    of nonresidency a return is also required if Oklahoma-source gross income is $1,000 or more (Form 511-NR). Nonresident:
    except as otherwise provided under the Pass-Through Entity Act of 2019, every nonresident with gross income
    from Oklahoma sources of $1,000 or more must file (Form 511-NR). Even without a filing requirement, file to
    claim withholding, estimated payments, the Natural Disaster Tax Credit, or other refundable credits.'
