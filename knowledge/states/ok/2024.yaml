  next $2,300, 3.75% next $4,600, 4.75% remainder. Every boundary was also corroborated against the .gov-hosted
  packet''s printed tax-table rows and $100,000+ worksheet constants.'
tax:
  citation:
    source: '2024 Form 511 — Oklahoma Resident Individual Income Tax Forms and Instructions packet (Oklahoma Tax Commission):
      Form 511 page 2, lines 10-14a (line 10 standard deduction instructions: ''single or married filing separate''
      $6,350, ''head of household'' $9,350, ''married filing joint or qualifying surviving spouse'' $12,700; line 11
      ''Exemptions ... X $1,000''); Select Line Instructions (lines 10-11) and Top of Form Instructions (F Exemptions,
      incl. Special 65+ AGI limits and Legally Blind); What''s New (''Income levels are adjusted for the top two income
      tax rate brackets for income tax returns with a filing status of married filing joint, head of household or surviving
      spouse''); 2024 Oklahoma Income Tax Table pp. 27-38, incl. the worksheets ''Calculating Tax on Taxable Income
      of $100,000 or more'' ($4,562 plus 0.0475 over $100,000 for Single/Married Filing Separate; $4,373 plus 0.0475
      over $100,000 for Married Filing Joint/Head of Household/Qualified Widow(er) — 2023''s constant was $4,395, confirming
      the widened 3.75% band). Second pass: bracket-by-bracket schedule verified verbatim against 68 O.S. § 2355(C)
      as in force ''For tax years 2024 and 2025'' (see notes) — both passes agree.'
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2024/511-Pkt-2024.pdf
