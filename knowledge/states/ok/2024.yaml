- 'Second pass for the bracket boundaries: 68 O.S. § 2355(C) as in force "For tax years 2024 and 2025" was read
  verbatim on the Oklahoma State Courts Network (OSCN, the state courts'' official statute publisher — a .net host,
  https://www.oscn.net/applications/oscn/DeliverDocument.asp?CiteID=92565, so it is recorded here rather than as
  a citation): Single/MFS 0.25% first $1,000, 0.75% next $1,500, 1.75% next $1,250, 2.75% next $1,150, 3.75% next
