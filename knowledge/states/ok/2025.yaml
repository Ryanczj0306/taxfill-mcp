# schedule, and calc.state_tax reproduces Form 511 line 14a only (no Schedule 511-C
# exemptions, no Form 511-CR credits). NOT promoted: 2025 HB 2764, because its new 68 O.S.
# 2355(D) three-bracket / 4.5%-top-rate schedule applies "For tax year 2026 and for subsequent
# tax years" and leaves TY2025's six-bracket 4.75% schedule untouched (see tax.notes) — there
# is no TY2025 computational delta to surface.
