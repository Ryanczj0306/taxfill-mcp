deadlines:
  filing_due_date: '2026-04-15'
  citation:
    source: '2025 Form 511 packet - ''Generally, your return must be postmarked by April 15, 2026'' and the DUE DATE
      section: ''Generally, your Oklahoma income tax return is due April 15th, the same day as your federal return.
      However: If you file your return electronically (through a preparer or the internet), your due date is extended
      to April 20th. Any payment of taxes due on April 20th must be remitted electronically in order to be considered
      timely paid.'' If the due date falls on a weekend or legal holiday when OTC offices are closed, the return is
      due the next business day. A valid federal extension automatically extends the Oklahoma due date if no Oklahoma
      liability is owed (attach a copy); otherwise request an Oklahoma extension on Form 504-I.'
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/current/511-Pkt.pdf
