    single: 6350
    married_filing_jointly: 12700
    married_filing_separately: 6350
    head_of_household: 9350
  notes:
  - 'NO 2025 RATE CHANGE — and the widely-cited Oklahoma rate cut is a 2026 event: 2025 House Bill 2764 (signed May
    28, 2025) amended 68 O.S. Section 2355 so that subsection C now reads ''For all taxable years beginning on or
    after January 1, 2024 tax years 2024 and 2025'' — the six-bracket 0.25%/0.75%/1.75%/2.75%/3.75%/4.75% schedule
    shipped here is unchanged from TY2024, top rate still 4.75%. HB 2764''s NEW subsection D applies ''For tax year
    2026 and for subsequent tax years'': Single/MFS 0% on the first $3,750, 2.5% on the next $1,150, 3.5% on the next
    $2,300, 4.5% on the remainder; MFJ/surviving spouse/HOH 0% on the first $7,500, 2.5% on the next $2,300, 3.5%
    on the next $4,600, 4.5% on the remainder — with subsection E allowing further 0.25-point reductions on a State
    Board of Equalization revenue trigger. Do NOT use subsection D for 2025. The standard deductions ($6,350/$12,700/$9,350),
    the $1,000 exemptions, and the packet''s $100,000+ worksheet constants ($4,562/$4,373) are likewise identical
    to 2024.'
  - 'Base guidance: supply 2025 Form 511, line 9 ''Oklahoma income after adjustments (line 7 minus line 8)''. Line
    1 starts from federal AGI; lines 2-8 apply Oklahoma subtractions (Schedule 511-A), out-of-state income (line 4),
    Oklahoma additions (Schedule 511-B, lines 1-9 totalled on line 10) and Oklahoma adjustments (Schedule 511-C) to
    reach line 9. The op then subtracts the shipped per-status standard deduction (Form 511 line 10) and $1,000 per
    exemption/dependent (Form 511 line 11) to reproduce line 13 ''Oklahoma Taxable Income'', and applies the brackets
    to reproduce line 14a. Do NOT pre-subtract deductions or exemptions from the figure you supply. If Form 511 line
    4 (out-of-state income) is more than zero, or you itemize, the shipped fixed deduction/exemption amounts do not
    apply — see the notes below.'
  - 'Tax Table mandate below $100,000: Form 511 line 14a instructs ''Oklahoma Income Tax from Tax Table (see pages
    27-38 of instructions)''. The 2025 table''s $50-wide bands compute tax at the band midpoint, so plain bracket
    math may differ from the filed table figure by a few dollars within a band. The filed form must use the table
    below $100,000. Oklahoma also mandates whole-dollar rounding with cents included until the final total (''Drop
    amounts under 50 cents to the lower dollar and round amounts from 50 to 99 cents up to the next dollar''), which
    is exactly this engine''s half-up rule.'
  - 'Taxable income of $100,000 or more uses the packet''s tax computation worksheets (p. 38): Single/Married Filing
    Separate tax = $4,562 plus 0.0475 of the excess over $100,000; Married Filing Joint/Head of Household/Qualified
    Widow(er) tax = $4,373 plus 0.0475 of the excess over $100,000. The footnote ''* This column must also be used
    by a Qualified Surviving Spouse'' applies to the MFJ worksheet and table column.'
  - 'Printed worksheet constants vs exact bracket sums (re-derived for 2025): the MFJ/HOH/QW constant $4,373 exactly
    equals the cumulative bracket sum at $100,000 ($307.00 through $14,400 plus 4.75% x $85,600 = $4,066); the Single/MFS
    constant $4,562 is the exact cumulative sum $4,561.50 rounded up $0.50 ($153.50 through $7,200 plus 4.75% x $92,800
    = $4,408), so above $100,000 the Single/MFS form worksheet can come out $1 higher than exact marginal bracket
    math after whole-dollar rounding.'
  - 'Bracket schedule source: the 2025 Form 511 packet prints only the Tax Table and the $100,000+ worksheets, not
    a marginal rate schedule. The brackets shipped here are copied verbatim from 68 O.S. Section 2355(C) as amended
    by 2025 HB 2764 (enrolled text on oklegislature.gov, a .gov host — an improvement over the 2024 pack, which had
    to read the same subsection on the non-gov OSCN statute site), and every boundary was cross-checked against the
    packet''s printed table rows and worksheet constants.'
  - 'One schedule covers Single and Married Filing Separately (identical thresholds — 68 O.S. Section 2355(C)(1));
    a second schedule covers Married Filing Jointly, surviving spouse, AND Head of Household (Section 2355(C)(2))
    — HOH is NOT a separate schedule, it is duplicated from MFJ here. The 2025 tax table likewise has only two columns:
    ''Single or married filing separate'' and ''Married filing joint or head of household''.'
  - Qualifying surviving spouse uses the married-filing-jointly column and schedule (2025 tax table/worksheet footnote
    'This column must also be used by a Qualified Surviving Spouse'; the statute includes surviving spouses in the
    MFJ paragraph; the line 10 instructions give a qualifying surviving spouse the $12,700 standard deduction) — the
    engine's QSS -> married_filing_jointly mapping is correct for Oklahoma.
  - 'Out-of-state income gate: ''STOP AND READ: If line 4 on page 1 is zero, complete lines 10-11. If line 4 is more
    than zero, see Schedule 511-E and do not complete lines 10-11.'' When Form 511 line 4 (out-of-state income other
    than wages) is more than zero, Schedule 511-E prorates deductions and exemptions, so the fixed standard deduction
    and $1,000 exemptions shipped here do NOT apply — compute them on the form and supply a base that already reflects
    Schedule 511-E line 5.'
  - 'Itemizers: if you claimed itemized deductions on your federal return you MUST claim Oklahoma itemized deductions
    (Schedule 511-D) instead of the standard deduction; state and local sales or income tax from federal Schedule
    A must be added back, and Oklahoma itemized deductions are limited to $17,000 (charitable contributions and medical
    expenses are not subject to the $17,000 limit). For an itemizer, do not use the shipped standard_deduction — compute
    line 10 from Schedule 511-D on the form.'
  - 'Not modeled here: line 14(b) the additional 10% Health Savings Account tax, Farm Income Averaging (Form 573),
    the credit for tax paid to another state (Form 511-TX, line 16), Form 511-CR other credits (which for 2025 newly
    include the Electric Vehicle Charging Tax Credit), and every refundable/nonrefundable credit in the pack''s credits
    block — all sit outside the rate schedule.'
# Promoted from this pack's own prose on 2026-08-11 (DEV_PLAN section 7.2): the two items on
