  base: state_gross_income
  tax_line: '2025 Form 511, line 14(a): ''Oklahoma Income Tax from Tax Table (see pages 27-38 of instructions) or
    if using Farm Income Averaging, enter tax from Form 573, line 22 and enter a 1 in box on line 14'', computed on
    line 13 ''Oklahoma Taxable Income (line 9 minus line 12)'', where line 12 = ''Total deductions and exemptions
    (add lines 10 and 11 or amount from Sch. 511-E, line 5)''.'
  exemptions:
    personal:
      amount: 1000
      note: 'Regular exemption, Form 511 line 11: ''Oklahoma allows $1,000 for each exemption claimed on the top of the
        return'' — one for yourself and one for your spouse (if not claimed as a dependent elsewhere). If you can be claimed
        as a dependent on another person''s return your own regular exemption is 0, but you still qualify for the Oklahoma
        standard deduction (''You qualify for the Oklahoma standard deduction even when claimed as a dependent on another
        return'').'
    dependent:
      amount: 1000
      note: $1,000 for each individual who is your dependent as defined in IRC Sec. 152, claimed at the top of Form 511
        (usually equals the number of dependents listed on your federal return); included in the Form 511 line 11 total
        (number of exemptions X $1,000).
    age_65:
      amount: 1000
      note: '''Special'' additional $1,000 exemption per taxpayer or spouse who is 65 years of age or older at the close
        of the tax year, allowed ONLY if Form 511 line 1 Federal AGI does not exceed $15,000 single / $25,000 joint /
        $12,500 married filing separate / $19,000 head of household (2025 packet, Top of Form Instructions F EXEMPTIONS
        — income from a traditional-IRA-to-Roth conversion is excluded in applying these limits, with Form 8606 attached).
        NOT applied by calc.state_tax — if eligible, claim it in the exemption boxes at the top of Form 511 and it flows
        into line 11.'
