      pp. 27-38, incl. the ''Tax Computation Worksheet'' for taxable income of $100,000 or more ($4,562 plus 0.0475
      of the excess over $100,000 for Single/Married Filing Separate; $4,373 plus 0.0475 for Married Filing Joint/Head
      of Household/Qualified Widow(er) — both constants IDENTICAL to 2024, confirming the schedule did not move). Second
      pass: the bracket-by-bracket schedule verified verbatim against 68 O.S. Section 2355(C) as amended by 2025 House
      Bill 2764 (ENROLLED text, oklegislature.gov), which retitles subsection C to ''tax years 2024 and 2025'' and leaves
      the six brackets and the 4.75% top rate unchanged, while its NEW subsection D (three brackets, 4.5% top rate)
