    source: '2025 Form 511 — Oklahoma Resident Individual Income Tax Forms and Instructions packet (Oklahoma Tax Commission):
      Form 511 page 2, lines 10-14a (line 10 standard deduction ''Single or Married Filing Separate: $6,350 - Married
