      $6,350 • Married Filing Joint or Qualifying Widow(er): $12,700 • Head of Household: $9,350''; line 11 prints ''Exemptions
      ... X $1,000''); Select Line Instructions p.9 (lines 10-11) and Top of Form Instructions pp.8-9 (F Exemptions,
      incl. Special 65+ AGI limits and Legally Blind); 2023 Oklahoma Income Tax Table pp.27-38, incl. p.38 worksheets
      ''Calculating Tax on Taxable Income of $100,000 or more'' ($4,562 plus 0.0475 over $100,000 for Single/MFS; $4,395
      plus 0.0475 over $100,000 for MFJ/HOH/Qualified Widow(er)). Bracket-by-bracket schedule verified verbatim against
      68 O.S. § 2355(C) as in force for tax year 2023 (see notes).'
    url: https://oklahoma.gov/content/dam/ok/en/tax/documents/forms/individuals/past-year/2023/511-Pkt-2023.pdf
