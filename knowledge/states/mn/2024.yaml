  base: federal_agi
  tax_line: 'Form M1 line 10: "Tax from the table or schedules in the Form M1 instructions". Instructions, Line 10
    — Tax From Table: "Using the amount on line 9, find the tax amount in the column under your filing status." Tax
    Rate Schedules, p.37: "You must use these schedules if line 9 of Form M1 is $90,000 or more... If line 9 of Form
    M1 is less than $90,000, you must use the tax table on pages 30 through 36."'
  exemptions:
    dependent:
      amount: 5050
      note: 'M1 line 5 dependent exemption, a BASE reduction: Worksheet for Line 5 - Dependent Exemptions, step 2 ''Enter
        $5,050'' (2024, up from $4,800), multiplied by the number of dependents claimed on Schedule M1DQC. Phases out
        at high AGI (see notes; phase-out not modeled). Minnesota has NO taxpayer/spouse personal exemption — line 5 is
        dependents only.'
  standard_deduction:
    single: 14575
    married_filing_jointly: 29150
    married_filing_separately: 14575
    head_of_household: 21900
  notes:
  - 'Base guidance: Supply Form M1 line 1 = federal adjusted gross income (federal Form 1040/1040-SR/1040-NR line
    11), adjusted for Minnesota items if any apply: ADD M1 line 2 additions (Schedule M1M line 10 and Schedule M1MB
    line 9) and SUBTRACT M1 line 6 (state income tax refund from federal Schedule 1 line 1) and M1 line 7 subtractions
    (Schedule M1M line 35 and Schedule M1MB line 21). The op then subtracts the shipped per-status standard deduction
    (M1 line 4) and $5,050 per dependent (M1 line 5) to reach M1 line 9, Minnesota taxable income, to which the rate
    schedule applies. Pass exemptions_count = 0 (Minnesota has no taxpayer/spouse personal exemption) and dependents_count
    = number of dependents claimed on Schedule M1DQC.'
  - 'Adjudication note (two-pass): the 2024 schedules were drafted from the M1 booklet''s p.37 Tax Rate Schedules
    and re-verified digit-by-digit against the DOR''s Dec 12, 2023 indexing press release AND the Tax Year 2024 Tax
    Professional Desk Reference Chart — all three agree on every boundary (single 31,690/104,090/193,240; MFJ 46,330/184,040/321,450;
    MFS 23,165/92,020/160,725 — exactly half of MFJ; HoH 39,010/156,760/256,880), the four rates (5.35%/6.80%/7.85%/9.85%,
    unchanged from 2023), the standard deduction ($14,575/$29,150/$14,575/$21,900), and the $5,050 dependent exemption.
    2024 indexing factor: +5.376%, rounded to the nearest $10.'
  - 'TAX TABLE MANDATE below $90,000: ''If line 9 of Form M1 is less than $90,000, you must use the tax table on pages
    30 through 36'' (2024 M1 instructions, p.37); the rate schedules are only for line 9 of $90,000 or more. The table
    is built on $100-band midpoints chained from the printed schedule constants, so bracket math may differ by a few
    dollars within table bands — the filed form must use the table. (Spot-checked: table row $83,300-$83,400 prints
    5,208 / 4,996 / 5,332 / 5,102 for Single/MFJ/MFS/HoH — all four equal midpoint bracket math at $83,350.)'
  - 'Qualifying Surviving Spouse: the p.37 rate-schedule column is titled ''Married filing jointly or qualifying widow(er)''
    — QSS uses the MFJ schedule exactly as mapped here, and the QSS standard deduction ($29,150 with 0 age/blind boxes)
    equals MFJ.'
  - 'Minnesota has NO personal exemption for the taxpayer or spouse: Form M1 line 5 is for DEPENDENTS only ($5,050
    per dependent from Schedule M1DQC). Callers must pass exemptions_count = 0 and put dependents in dependents_count.'
  - 'Dependent-exemption phase-out NOT modeled (Worksheet for Line 5): the $5,050-per-dependent total is reduced by
    2% for each $2,500 ($1,250 MFS) that M1 line 1 AGI exceeds $232,550 Single / $290,700 Head of Household / $348,850
    MFJ-or-Surviving-Spouse / $174,425 MFS, and is $0 once the excess is more than $122,500 ($61,250 MFS).'
  - 'Standard-deduction limitation NOT modeled (Worksheets A & B for Line 4): if M1 line 1 AGI exceeds $232,500 ($116,250
    MFS), the deduction is reduced by the LESSER of 80% of the deduction or [3% of the excess over $232,500/$116,250
    (capped: enter $88,850, or $44,425 MFS, if AGI exceeds $321,350/$160,675) + 10% of the excess over $321,350 ($160,675
    MFS)]; if AGI exceeds $1,053,750, the deduction is reduced by 80% (Worksheet B).'
  - 'Additional standard deduction for age 65+/blind NOT modeled (Standard Deduction Table for Line 4): +$1,950 per
    checked box for Single and Head of Household (up to 2 boxes); +$1,550 per checked box for Married Filing Jointly
    (up to 4), Married Filing Separately (up to 4), and Qualified Surviving Spouse (up to 2). Born before January
    2, 1960 counts as 65 or older. Enter it on the form''s line 4.'
  - 'Standard-deduction gates NOT modeled: Married Filing Separately gets NO standard deduction if the spouse claims
    itemized deductions (''Not allowed'' row); nonresident aliens may claim it only if allowed by a U.S. income tax
    treaty; a filer claimable as another''s dependent uses the Worksheet for Line 4 - Dependent Standard Deduction
    (greater of $1,300 or earned income + $400, capped at $14,575, plus $1,950/$1,550 age/blind additions) — itemizers
    use Schedule M1SA instead.'
