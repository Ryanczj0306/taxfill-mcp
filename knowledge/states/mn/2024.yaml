unverified:
- Exact check PAYEE wording — the 2024 M1 booklet instructs payment via the Payment Voucher System (voucher + check
  mailed separately from the return) and does not print a 'make your check payable to ...' line; the payee 'Minnesota
  Department of Revenue' is the historical convention. Confirm via the Payment Voucher System when paying.
- The with-payment voucher's mailing destination is printed on the voucher itself ('send the voucher and your check
  or money order separately from your return'); it was not captured verbatim.
- The 2023-12-12 press release noted the 2024 standard deduction amounts 'assume a legislative solution in 2024 to
  a drafting error in the 2023 tax bill'; the final 2024 M1 booklet and the Desk Reference both print $14,575/$29,150/$21,900,
  so the fix is reflected in the filing-season documents — but the session-law citation for the fix was not pulled.
- Renter's Credit table mechanics (Schedule M1RENT line-by-line) were not parsed; the $2,640 maximum and $75,390
  household-income limit are from the M1 booklet's Line 22 credit summary.
