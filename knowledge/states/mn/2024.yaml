# MN state knowledge — tax year 2024. Fetched + cited from the MN DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 Form M1
# instruction booklet (m1-inst-24), then independently re-derived from a second official
# document — the 2024 Form M1 itself, the DOR press release 'Minnesota income tax
# brackets, standard deduction and dependent exemption amounts for 2024' (Dec 12, 2023),
# the Tax Year 2024 Tax Professional Desk Reference Chart, or the 2024 Schedule
# M1CWFC/M1ED PDFs — resolutions recorded inline where the passes differed.
# HEADLINE 2024 CHANGES (What's new for 2024?): the RENTER'S CREDIT moved ONTO the
# income tax return (new Schedule M1RENT with Form M1 — do NOT file Form M1PR for rent
# paid in 2024); a new 1%-style Net Investment Income Tax applies over $1,000,000 of net
# investment income (Schedule NIIT, M1 line 14); taxpayers may elect ADVANCE PAYMENTS of
# the 2025 Child Tax Credit on Schedule M1CWFC; brackets indexed +5.376%; standard
# deduction $14,575/$29,150/$21,900; dependent exemption $5,050.
jurisdiction: states/mn
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Minnesota''s resident return (Form M1) starts from federal adjusted gross income: the 2024 M1 instructions
  for Line 1 state "Line 1—Federal Adjusted Gross Income. Enter your 2024 federal adjusted gross income from line
  11 of Form 1040 or 1040-SR, or 1040-NR." Federally treaty-exempt income is already excluded from federal AGI and
  therefore flows through. The Minnesota additions (M1 line 2 = Schedule M1M line 10 and Schedule M1MB line 9) contain
  NO line that adds back income exempt under a U.S. income tax treaty. The only treaty references in the 2024 M1
  instructions are FAVORABLE to the taxpayer (a nonresident alien may claim the standard deduction if allowed by
  a U.S. income tax treaty — repeated in the What''s New standard-deduction section and the Line 4 Standard Deduction
  Table note). Because there is no treaty addback, treaty-exempt income is not re-taxed -> conforms.'
citation:
  source: 2024 Minnesota Individual Income Tax Return (M1) Instructions — Line 1 = Federal Adjusted Gross Income
    (federal Form 1040/1040-SR/1040-NR line 11); What's new for 2024 (Renter's Credit on Schedule M1RENT, NIIT,
    advance Child Tax Credit payments, standard deduction and $5,050 dependent exemption); residency rules (domicile
    + 183-day/abode); due date April 15, 2025; filing-requirement chart; Tax Tables pp.30-36 and Tax Rate Schedules
    p.37; payment options; Mail Station 0010 mailing address
  url: https://www.revenue.state.mn.us/sites/default/files/2026-01/m1-inst-24.pdf
starts_from: federal AGI (Form M1 Line 1 = federal adjusted gross income, from line 11 of federal Form 1040/1040-SR/1040-NR)
residency:
  summary: 'Minnesota taxes by residency. You are a full-year resident if Minnesota was your permanent home in 2024
    (the domicile test). A statutory-resident rule also applies: if your permanent residence is in another state
    but you were physically in Minnesota for 183 days or more during the tax year AND you or your spouse owned,
    rented, lived in, or leased an abode (house, townhouse, condominium, apartment, mobile home, or cabin, with
    cooking and bathing facilities, that could be lived in year-round) in Minnesota, you are considered a Minnesota
    resident for the length of time you maintained that abode. Part-year residents are those who moved into or out
    of Minnesota during 2024 (file if 2024 Minnesota-source income is $14,575 or more); nonresidents have
    Minnesota-source income but are domiciled elsewhere and do not meet the 183-day/abode test. Part-year residents
    and nonresidents compute Minnesota tax on the share of income assignable to Minnesota using Schedule M1NR (M1
    lines 13a/13b). (See Income Tax Fact Sheets 1 Residency, 2 Part-Year Residents, 3 Nonresidents.)'
forms:
  resident: Form M1, Individual Income Tax
  part_year_or_nonresident: Schedule M1NR, Nonresidents/Part-Year Residents (filed together with Form M1)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Minnesota Working Family Credit (state Earned Income Tax Credit)
  type: refundable
  eligibility: Full-year or part-year MN residents who earned income from a job or self-employment, were self-employed,
    or have qualifying children (mirrors federal EIC concepts; qualifying children determined on Schedule M1DQC).
    Combined with the Child Tax Credit on Schedule M1CWFC. ITINs may be used if you, your spouse, or your qualifying
    children have no SSN. Part-year residents qualify based on their percentage of income assignable to Minnesota.
  amount: '4% of the first $9,220 of earned income, plus an additional amount for up to three qualifying older children.
    2024 maximum Working Family Credit: $369 with zero qualifying older children, $1,339 with one, $2,579 with two,
    $2,999 with three or more. You may claim the credit for qualifying older children even with no earned income.'
  income_limit_2024: Credit is reduced when adjusted gross income exceeds $31,090 ($36,880 if Married Filing Jointly).
    The reduction is 12% of AGI above the limit (9% if you have a qualifying older child but no qualifying child
    for the Child Tax Credit).
  claimed_on: Schedule M1CWFC (with Schedule M1DQC), flows to Schedule M1REF, then Form M1 line 22
  citation:
    source: 2024 Schedule M1CWFC, Minnesota Child and Working Family Credits (form + instructions — 'four percent
      of your first $9,220 of earned income', 2024 maximums $369/$1,339/$2,579/$2,999, $31,090/$36,880 phase-out,
      12%/9% reduction), MN Department of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2025-01/m1cwfc-24.pdf
- name: Minnesota Child Tax Credit
  type: refundable
  eligibility: Full-year or part-year MN residents with one or more qualifying children under age 18 at the end
    of 2024 (qualifying child determined on Schedule M1DQC). ITIN may be used if no SSN. NEW for 2024 filings —
    you may ELECT to receive advance payments of your 2025 Child Tax Credit on Schedule M1CWFC (electing also makes
    you eligible for a 2025 Minimum Credit of up to 50% of the prior-year credit; paper filers who elect mail to
    Mail Station 0015 instead of 0010).
  amount: $1,750 for each qualifying child under age 18, with no cap on the number of qualifying children (2024
    Schedule M1CWFC line 8, 'Multiply line 7 by $1,750').
  income_limit_2024: Credit is reduced when adjusted gross income exceeds $31,090 ($36,880 if Married Filing Jointly);
    the reduction is 12% of AGI above the limit. (Desk Reference phase-out endpoints, e.g. one qualifying child fully
    phased out at $48,744 / $54,534 MFJ when receiving the full $369 Working Family Credit.)
  claimed_on: Schedule M1CWFC (with Schedule M1DQC), flows to Schedule M1REF (qualifying children counted on M1REF),
    then Form M1 line 22
  citation:
    source: 2024 Schedule M1CWFC, Minnesota Child and Working Family Credits ($1,750 per qualifying child; advance-payment
      election; phase-out) and Tax Year 2024 Tax Professional Desk Reference Chart (phase-out table), MN Department
      of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2025-01/m1cwfc-24.pdf
- name: Minnesota Child and Dependent Care Credit
  type: refundable
  eligibility: MN taxpayers who paid someone (other than a dependent child or stepchild younger than 19) to care
    for a qualifying person while you (and your spouse if filing jointly) were working or looking for work — qualifying
    person and expenses are the same as for the federal child and dependent care credit. Also available to licensed
    family daycare operators caring for their own dependent child under age six, and for a child born in 2024 if
    you did not participate in a pre-tax dependent care assistance program. Refundable, unlike the federal credit.
  amount: A percentage of qualifying care expenses (federal Form 2441 mechanics). Computed on Schedule M1CD.
  income_limit_2024: Federal adjusted gross income must be less than $74,410 with one qualifying person or less
    than $86,410 with two or more qualifying persons (2024 M1 instructions, Schedule M1REF section).
  claimed_on: Schedule M1CD, flows to Schedule M1REF (number of qualifying persons on M1REF line 1a), then Form
    M1 line 22
  citation:
    source: 2024 Minnesota Individual Income Tax Return (M1) Instructions, 'Child and Dependent Care Credit (Schedule
      M1CD)' — $74,410 / $86,410 2024 AGI limits, MN Department of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2026-01/m1-inst-24.pdf
- name: Renter's Credit (NEW on the income tax return for 2024)
  type: refundable
  eligibility: 'Minnesota residents who paid rent in 2024 on a building where property taxes (or payments in lieu)
    were payable and who received a Certificate of Rent Paid (CRP). HEADLINE 2024 CHANGE: beginning with rent paid
    in tax year 2024, renters claim this credit on Schedule M1RENT WITH the Form M1 income tax return — renters
    should NOT complete Form M1PR (which remains only for homeowners'' Homestead Credit Refund). CRP information
    must be provided with the return.'
  amount: Based on household income and rent constituting property taxes, using the Renter's Credit Tables printed
    in the 2024 M1 instruction booklet (pp.25-29). The maximum credit is $2,640 for 2024.
  income_limit_2024: Household income must be less than $75,390 to qualify.
  claimed_on: Schedule M1RENT, Renter's Credit, flows to Schedule M1REF, then Form M1 line 22
  citation:
    source: 2024 Minnesota Individual Income Tax Return (M1) Instructions — What's new for 2024 ('Renter's Credit
      ... complete Schedule M1RENT ... Renters should not complete Form M1PR') and Line 22 section ('household income
      was less than $75,390 ... The maximum credit is $2,640'), Renter's Credit Tables pp.25-29, MN Department of
      Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2026-01/m1-inst-24.pdf
- name: K-12 Education Credit
  type: refundable
  eligibility: MN parents/guardians who paid education-related expenses in 2024 for a qualifying child in grades
    K-12 (a qualifying child is the same as for the federal Earned Income Credit). Qualifying expenses include tutoring
    by a qualified instructor, instructional materials, music lessons, and certain educational services (private
    school tuition does NOT qualify for the credit — it is a Schedule M1M subtraction only). Refundable.
  amount: 75% of qualifying K-12 education expenses (2024 Schedule M1ED line 11, 'Multiply line 10 by 75% (.75)'),
    capped at $1,500 per qualifying child (line 12 multiplies the number of K-12 qualifying children by $1,500);
    a phase-out worksheet applies if AGI is more than $73,760.
  income_limit_2024: 'AGI limit varies by number of K-12 qualifying children: $79,760 (1 or 2 children), $82,760
    (3), $85,760 (4), $88,760 (5), $91,760 plus $3,000 for each additional child (6 or more). Above the limit you
    do not qualify (but may use the K-12 Education Subtraction instead).'
  claimed_on: Schedule M1ED, flows to Schedule M1REF, then Form M1 line 22
  citation:
    source: 2024 Schedule M1ED, K-12 Education Credit (75% / $1,500-per-child / $73,760 worksheet trigger) and 2024
      Form M1 instructions K-12 Education Credit AGI-limit table ($79,760 ... $91,760+$3,000), MN Department of
      Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2025-02/m1ed-24.pdf
filing_requirement:
  note: 'Full-year residents must file a 2024 Form M1 if required to file a federal return, or if income exceeds
    the filing-requirement chart amount for their filing status/age (Single born on/after Jan 2, 1960: $14,575;
    born before: $16,525; Married Filing Jointly both born on/after Jan 2, 1960: $29,150; one spouse older: $30,700;
    both older: $32,250; Head of Household: $21,900 / $23,850; Qualifying Surviving Spouse: $29,150 / $30,700;
    Married Filing Separately any age: $5). Part-year residents and nonresidents: add (1) all income while a MN
    resident plus (2) MN-source income while a nonresident; if the total is $14,575 or more they must file Form
    M1 with Schedule M1NR. If not required to file, you can still file to claim refundable credits (K-12 Education,
    Child and Working Family, Child and Dependent Care, Parents of Stillborn Children) or a withholding refund.
    Source: 2024 Form M1 instructions, Filing Requirements (pp.6-7).'
mailing_addresses:
  refund_or_no_payment: Minnesota Department of Revenue, Mail Station 0010, 600 N. Robert St., St. Paul, MN 55146-0010
  with_payment: 'There is NO separate payment-only mailing address. The Form M1 return is mailed to Minnesota Department
    of Revenue, Mail Station 0010, 600 N. Robert St., St. Paul, MN 55146-0010. Payment by check/money order is made
    separately using a voucher created with the department''s Payment Voucher System ("If you are filing a paper
    return, send the voucher and your check or money order separately from your return"). Special case: if electing
    advance payments of the 2025 child tax credit on Schedule M1CWFC, the paper return goes to Mail Station 0015,
    St. Paul, MN 55146-0015.'
  citation:
    source: 2024 Minnesota Individual Income Tax Return (M1) Instructions — Filing Instructions ('mail your forms
      to Minnesota Department of Revenue, Mail Station 0010, 600 N. Robert St., St. Paul, MN 55146-0010'; Mail Station
      0015 for the advance-CTC election) and Payment Options p.21 (Payment Voucher System; send voucher and check
      separately from the return)
    url: https://www.revenue.state.mn.us/sites/default/files/2026-01/m1-inst-24.pdf
payment:
  check_payee: Check payments are made through the MN DOR Payment Voucher System (go to www.revenue.state.mn.us,
    select Make a Payment under Individuals, then Check or Money Order, and create a voucher; the check authorizes
    a one-time electronic fund transfer). Exact check PAYEE wording is not printed in the 2024 M1 booklet — see
    unverified.
  web_pay_url: https://www.revenue.state.mn.us/make-payment
deadlines:
  filing_due_date: '2025-04-15'
  citation:
    source: 2024 Minnesota Individual Income Tax Return (M1) Instructions — 'Your 2024 Minnesota income tax return
      should be electronically filed, postmarked, or dropped off by April 15, 2025. Your tax payment is due in full
      by April 15, 2025, even if you file your return later. ... To avoid a late filing penalty, file your return
      by October 15, 2025.'
    url: https://www.revenue.state.mn.us/sites/default/files/2026-01/m1-inst-24.pdf
