  base: federal_agi
  tax_line: 'Form M1 line 10: "Tax from the table or schedules in the Form M1 instructions". Instructions, Line 10
    — Tax From Table: "Turn to the tax table on pages 32 through 38. Using the amount on line 9, find the tax amount
    in the column under your filing status." Tax Rate Schedules, p.39: "You must use these schedules if line 9 of
    Form M1 is $86,800 or more... If line 9 of Form M1 is less than $86,800, you must use the tax table on pages 32
    through 38."'
  exemptions:
    dependent:
      amount: 5200
      note: 'M1 line 5 dependent exemption, a BASE reduction: Worksheet for Line 5 - Dependent Exemptions, step 2 ''Enter
        $5,200'' (2025, up from $5,050), multiplied by the number of dependents claimed on Schedule M1DQC. Phases out
        at high AGI (see notes; phase-out not modeled). Minnesota has NO taxpayer/spouse personal exemption — line 5 is
        dependents only.'
  standard_deduction:
    single: 14950
    married_filing_jointly: 29900
    married_filing_separately: 14950
    head_of_household: 22500
  notes:
  - 'Base guidance: Supply Form M1 line 1 = federal adjusted gross income (2025 federal Form 1040/1040-SR line 11a,
    or 1040-NR), adjusted for Minnesota items if any apply: ADD M1 line 2 additions (Schedule M1M line 10 and Schedule
    M1MB line 9) and SUBTRACT M1 line 6 (state income tax refund from federal Schedule 1 line 1) and M1 line 7 subtractions
    (Schedule M1M line 40 and Schedule M1MB line 22 — renumbered for 2025 from 2024''s M1M line 35 / M1MB line 21).
    The op then subtracts the shipped per-status standard deduction (M1 line 4) and $5,200 per dependent (M1 line
    5) to reach M1 line 9, Minnesota taxable income, to which the rate schedule applies. Pass exemptions_count = 0
    (Minnesota has no taxpayer/spouse personal exemption) and dependents_count = number of dependents claimed on Schedule
    M1DQC.'
  - 'Adjudication note (two-pass, 2025): the 2025 schedules were drafted from the M1 booklet''s p.39 Tax Rate Schedules
    and re-verified digit-by-digit against the DOR''s Dec 16, 2024 indexing press release, the Tax Year 2025 Tax Professional
    Desk Reference Chart, AND the DOR ''Income Tax Rates and Brackets'' web page — all four agree on every boundary
    (single 32,570/106,990/198,630; MFJ 47,620/189,180/330,410; MFS 23,810/94,590/165,205 — exactly half of MFJ; HoH
    40,100/161,130/264,050), the four rates (5.35%/6.80%/7.85%/9.85%, unchanged since 2023), the standard deduction
    ($14,950/$29,900/$14,950/$22,500), and the $5,200 dependent exemption. 2025 indexing factor: +2.886% from tax
    year 2024, rounded to the nearest $10.'
  - 'CRITICAL — the TAX TABLE MANDATE THRESHOLD MOVED for 2025: it is $86,800, NOT 2024''s $90,000. ''If line 9 of
    Form M1 is less than $86,800, you must use the tax table on pages 32 through 38'' and ''You must use these schedules
