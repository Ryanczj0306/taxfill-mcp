# MN state knowledge — tax year 2025. Fetched + cited from the MN DOR (.gov),
# authored per the 2024 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2025 Form M1 instruction
# booklet (m1-inst-25.pdf, 40 pages), then independently re-derived from second and third
# official documents — the MN DOR press release 'Minnesota income tax brackets, standard
# deduction and dependent exemption amounts for 2025' (Dec 16, 2024), the Tax Year 2025
# Minnesota Revenue Tax Professional Desk Reference Chart, the DOR 'Income Tax Rates and
# Brackets' web page, the 2025 Form M1 itself, and the 2025 Schedule M1CWFC / M1ED PDFs.
# HEADLINE 2025 CHANGES: brackets indexed +2.886% from 2024 (rounded to the nearest $10);
# standard deduction $14,950 Single / $29,900 MFJ-QSS / $14,950 MFS / $22,500 HoH; dependent
# exemption $5,200 (up from $5,050); the TAX-TABLE MANDATE THRESHOLD MOVED from 2024's
# $90,000 to $86,800 (the printed table now ends at '86,800 & over'); a taxpayer who elected
# advance payments of the 2025 Child Tax Credit on the 2024 return MUST file a 2025 return to
# reconcile them (new Schedule M1CWFC line 27 -> Form M1 line 14b); the advance-payment
# election now covers the 2026 credit; new Schedule M1M subtractions for coerced debt,
# consumer-enforcement public compensation, foreign-service retirement pay, and SEIU stipend
# payments. The 2024-new Net Investment Income Tax (Schedule NIIT, >$1,000,000 of net
# investment income) is UNCHANGED for 2025 and now reports on Form M1 line 14a.
jurisdiction: states/mn
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'Minnesota''s resident return (Form M1) starts from federal adjusted gross income: the 2025 M1 instructions
  for Line 1 state "Line 1—Federal Adjusted Gross Income. Enter your 2025 federal adjusted gross income from line
  11a of Form 1040 or 1040-SR, or 1040-NR." Federally treaty-exempt income is already excluded from federal AGI and
  therefore flows through. The Minnesota additions (M1 line 2 = Schedule M1M line 10 and Schedule M1MB line 9) contain
  NO line that adds back income exempt under a U.S. income tax treaty. The only treaty references in the 2025 M1
  instructions are FAVORABLE to the taxpayer (a nonresident alien may claim the standard deduction if allowed by a
  U.S. income tax treaty — stated in the What''s new standard-deduction section, in the Line 4 itemized-deduction
  paragraph, and in the Standard Deduction Table for Line 4 note). Because there is no treaty addback, treaty-exempt
  income is not re-taxed -> conforms.'
citation:
  source: 2025 Minnesota Individual Income Tax Return (M1) Instructions — Line 1 = Federal Adjusted Gross Income
    (federal Form 1040/1040-SR line 11a, or 1040-NR); What's new for 2025 (standard deduction $14,950/$29,900/$14,950/$22,500,
    dependent exemption $5,200, advance Child Tax Credit payments for 2026 and reconciliation of the 2025 advance
    payments, new M1M subtractions); residency rules (domicile + 183-day/abode); due date April 15, 2026; filing-requirement
    chart; Tax Tables pp.32-38 and Tax Rate Schedules p.39 (mandate at $86,800); payment options; Mail Station 0010
    mailing address
  url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1-inst-25.pdf
starts_from: federal AGI (Form M1 Line 1 = federal adjusted gross income, from line 11a of federal Form 1040/1040-SR,
  or 1040-NR)
residency:
  summary: 'Minnesota taxes by residency. You are a full-year resident if Minnesota was your permanent home in 2025
    (the domicile test), or if Minnesota was your home for an indefinite period of time and you maintained an abode
    in Minnesota. A statutory-resident rule also applies: if your permanent residence is in another state but you
    were physically in Minnesota for 183 days or more during the tax year AND you or your spouse owned, rented, lived
    in, or leased an abode (house, townhouse, condominium, apartment, mobile home, or cabin, with cooking and bathing
    facilities, that could be lived in year-round) in Minnesota, you are considered a Minnesota resident for the length
    of time you maintained that abode. Part-year residents are those who moved into or out of Minnesota during 2025
    (file if 2025 Minnesota-source income is $14,950 or more); nonresidents have Minnesota-source income but are
    domiciled elsewhere and do not meet the 183-day/abode test. Part-year residents and nonresidents compute Minnesota
    tax on the share of income assignable to Minnesota using Schedule M1NR (2025 M1NR lines 28 and 29 -> M1 lines
    13a/13b). (See Income Tax Fact Sheets 1 Residency, 2 Part-Year Residents, 3 Nonresidents.)'
forms:
  resident: Form M1, Individual Income Tax
  part_year_or_nonresident: Schedule M1NR, Nonresidents/Part-Year Residents (filed together with Form M1)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Minnesota Working Family Credit (state Earned Income Tax Credit)
  type: refundable
  eligibility: Full-year or part-year MN residents who earned income from a job or self-employment, were self-employed,
    or have qualifying children (qualifying children and qualifying older children determined on Schedule M1DQC).
    Combined with the Child Tax Credit on Schedule M1CWFC. ITINs may be used if you, your spouse, or your qualifying
    children have no SSN. Part-year residents qualify based on their percentage of income assignable to Minnesota.
  amount: 'Four percent of your first $9,480 of earned income (2025 Schedule M1CWFC line 3 caps earned income at
    $9,480), plus an additional amount for up to three qualifying older children. 2025 maximum Working Family Credit:
    $379 with zero qualifying older children, $1,379 with one, $2,649 with two, $3,089 with three or more. You may
    claim the credit for qualifying older children (and the Child Tax Credit) even with no earned income.'
  income_limit_2025: Credit is reduced when adjusted gross income exceeds $31,950 ($37,910 if Married Filing Jointly).
    The reduction is 12% of AGI above the limit (9% if you have a qualifying older child but no qualifying child
    for the Child Tax Credit).
  claimed_on: Schedule M1CWFC (with Schedule M1DQC), flows to Schedule M1REF, then Form M1 line 22
  citation:
    source: 2025 Schedule M1CWFC, Minnesota Child and Working Family Credits (form + instructions — 'The Working
      Family Credit is four percent of your first $9,480 of earned income', 2025 maximums $379/$1,379/$2,649/$3,089,
      $31,950/$37,910 phase-out, 12%/9% reduction), MN Department of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1cwfc-25.pdf
- name: Minnesota Child Tax Credit
  type: refundable
  eligibility: Full-year or part-year MN residents with one or more qualifying children under age 18 at the end
    of 2025 (qualifying child determined on Schedule M1DQC). ITIN may be used if no SSN. You may ELECT to receive
    advance payments of your 2026 Child Tax Credit on Schedule M1CWFC (you must be eligible for a 2025 Child Tax
    Credit to receive 2026 advance payments; paper filers who elect mail to Mail Station 0015 instead of 0010). NEW
    for 2025 — taxpayers who elected advance payments of their 2025 credit on the 2024 return MUST file a 2025 return
    to reconcile them, even if not otherwise required to file.
  amount: $1,750 for each qualifying child under age 18, with no cap on the number of qualifying children (2025
    Schedule M1CWFC line 8, 'Multiply line 7 by $1,750').
  income_limit_2025: Credit is reduced when adjusted gross income exceeds $31,950 ($37,910 if Married Filing Jointly);
    the reduction is 12% of AGI above the limit. (Tax Year 2025 Desk Reference phase-out table, e.g. one qualifying
    child fully phased out at $55,649 MFJ / $49,689 not-MFJ when receiving the full $379 Working Family Credit; reduce
    the phase-out by $3,160 if not eligible for the Working Family Credit.)
  claimed_on: Schedule M1CWFC (with Schedule M1DQC), flows to Schedule M1REF (qualifying children counted on M1REF
    lines 2a/2b), then Form M1 line 22
  citation:
    source: 2025 Schedule M1CWFC, Minnesota Child and Working Family Credits ($1,750 per qualifying child; advance-payment
      election and reconciliation) and Tax Year 2025 Minnesota Revenue Tax Professional Desk Reference Chart (2025
      Child Tax Credit phase-out table), MN Department of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1cwfc-25.pdf
- name: Minnesota Child and Dependent Care Credit
  type: refundable
  eligibility: MN taxpayers who paid someone (other than a dependent child or stepchild younger than 19) to care
    for a qualifying person while you (and your spouse if filing jointly) were working or looking for work — qualifying
    person and expenses are the same as for the federal child and dependent care credit. Also available to licensed
    family daycare operators caring for their own dependent child under age six, and for a child born in 2025 if
    you did not participate in a pre-tax dependent care assistance program. Refundable, unlike the federal credit.
  amount: A percentage of qualifying care expenses (federal Form 2441 mechanics). Computed on Schedule M1CD.
  income_limit_2025: Federal adjusted gross income must be less than $76,150 with one qualifying person or less
    than $88,150 with two or more qualifying persons (2025 M1 instructions, Schedule M1REF section; $88,150 confirmed
    on the Tax Year 2025 Desk Reference Chart).
  claimed_on: Schedule M1CD, flows to Schedule M1REF (number of qualifying persons on M1REF line 1a), then Form
    M1 line 22
  citation:
    source: 2025 Minnesota Individual Income Tax Return (M1) Instructions, 'Child and Dependent Care Credit (Schedule
      M1CD)' — $76,150 / $88,150 2025 AGI limits, MN Department of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1-inst-25.pdf
- name: Renter's Credit
  type: refundable
  eligibility: 'Minnesota residents who paid rent in 2025 on a building where property taxes were payable for 2025
    (or payments in lieu of property taxes were payable in 2025) and who received a Certificate of Rent Paid (CRP).
    Since rent paid in tax year 2024 renters claim this credit on Schedule M1RENT WITH the Form M1 income tax return
    — renters do NOT complete Form M1PR (which remains only for homeowners'' Homestead Credit Refund). A copy of
    any CRP used to claim the credit must be provided with the return.'
  amount: Based on household income and rent constituting property taxes, using the Renter's Credit Tables printed
    in the 2025 M1 instruction booklet (pp.27-31). The maximum credit is $2,720 for 2025.
  income_limit_2025: Household income must be less than $77,570 to qualify.
  claimed_on: Schedule M1RENT, Renter's Credit, flows to Schedule M1REF, then Form M1 line 22
  citation:
    source: 2025 Minnesota Individual Income Tax Return (M1) Instructions — Line 22 section ('You may qualify for
      the Renter''s Credit if you were a Minnesota resident, your household income was less than $77,570 ... The
      maximum credit is $2,720'), Renter's Credit Tables pp.27-31, MN Department of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1-inst-25.pdf
- name: K-12 Education Credit
  type: refundable
  eligibility: MN parents/guardians who paid education-related expenses in 2025 for a qualifying child in grades
    K-12 (a qualifying child is the same as for the federal Earned Income Credit). Qualifying expenses include tutoring
    by a qualified instructor, instructional materials, music lessons, and certain educational services (private
    school tuition does NOT qualify for the credit — it is a Schedule M1M subtraction only). Refundable.
  amount: 75% of qualifying K-12 education expenses (2025 Schedule M1ED line 11, 'Multiply line 10 by 75% (.75)'),
    capped at $1,500 per qualifying child (line 12 multiplies the number of K-12 qualifying children by $1,500);
    a phase-out worksheet applies if AGI is more than $75,820.
  income_limit_2025: 'AGI limit varies by number of K-12 qualifying children: $81,820 (1 or 2 children), $84,820
    (3), $87,820 (4), $90,820 (5), $93,820 plus $3,000 for each additional child (6 or more). Above the limit you
    do not qualify (but may use the K-12 Education Subtraction instead).'
  claimed_on: Schedule M1ED, flows to Schedule M1REF, then Form M1 line 22
  citation:
    source: 2025 Schedule M1ED, K-12 Education Credit (75% / $1,500-per-child / $75,820 worksheet trigger / $81,820
      one-or-two-child AGI limit) and 2025 Form M1 instructions K-12 Education Credit AGI-limit table ($81,820 ...
      $93,820+$3,000), MN Department of Revenue
    url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1ed-25.pdf
filing_requirement:
  note: 'Full-year residents must file a 2025 Form M1 if required to file a federal return, or if income exceeds
    the filing-requirement chart amount for their filing status/age (Single born on/after Jan 2, 1961: $14,950;
    born before: $16,950; Married Filing Jointly both born on/after Jan 2, 1961: $29,900; one spouse older: $31,450;
    both older: $33,000; Head of Household: $22,500 / $24,500; Qualifying Surviving Spouse: $29,900 / $31,450;
    Married Filing Separately any age: $5). Part-year residents and nonresidents: add (1) all income while a MN
    resident plus (2) MN-source income while a nonresident; if the total is $14,950 or more they must file Form
    M1 with Schedule M1NR. A filer who ELECTED advance payments of the 2025 Child Tax Credit on the 2024 return
    must file a 2025 return even if not otherwise required to (and even if MN-source income is below $14,950). A
    nonresident alien with income assignable to Minnesota who was required to file a federal return must also file.
    If not required to file, you can still file to claim refundable credits (K-12 Education, Child and Working Family,
    Child and Dependent Care, Parents of Stillborn Children) or a withholding refund. Source: 2025 Form M1 instructions,
    Filing Requirements (pp.6-8).'
mailing_addresses:
  refund_or_no_payment: Minnesota Department of Revenue, Mail Station 0010, 600 N. Robert St., St. Paul, MN 55146-0010
  with_payment: 'There is NO separate payment-only mailing address. The Form M1 return is mailed to Minnesota Department
    of Revenue, Mail Station 0010, 600 N. Robert St., St. Paul, MN 55146-0010. Payment by check/money order is made
    separately using a voucher created with the department''s Payment Voucher System ("If you are filing a paper
    return, send the voucher and your check or money order separately from your return"). Special case: if electing
    advance payments of the 2026 child tax credit on Schedule M1CWFC, the paper return goes to Mail Station 0015,
    600 N. Robert St., St. Paul, MN 55146-0015.'
  citation:
    source: '2025 Minnesota Individual Income Tax Return (M1) Instructions — Filing Instructions (''mail your forms
      to: Minnesota Department of Revenue, Mail Station 0010, 600 N. Robert St., St. Paul, MN 55146-0010''; Mail Station
      0015 only for the advance-CTC election) and Payment Options (Payment Voucher System; send voucher and check
      separately from the return)'
    url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1-inst-25.pdf
payment:
  check_payee: Check payments are made through the MN DOR Payment Voucher System (go to www.revenue.state.mn.us,
    select Make a Payment under Individuals, then Check or Money Order, and create a voucher; the check authorizes
    a one-time electronic fund transfer). Exact check PAYEE wording is not printed in the 2025 M1 booklet — see
    unverified.
  web_pay_url: https://www.revenue.state.mn.us/make-payment
deadlines:
  filing_due_date: '2026-04-15'
  citation:
    source: 2025 Minnesota Individual Income Tax Return (M1) Instructions — 'Your 2025 Minnesota income tax return
      should be electronically filed, postmarked, or dropped off by April 15, 2026. Your tax payment is due in full
      by April 15, 2026, even if you file your return later. ... To avoid a late filing penalty, file your return
      by October 15, 2026.'
    url: https://www.revenue.state.mn.us/sites/default/files/2026-07/m1-inst-25.pdf
