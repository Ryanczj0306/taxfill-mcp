unverified:
- Exact check PAYEE wording — the 2025 M1 booklet instructs payment via the Payment Voucher System (voucher + check
  mailed separately from the return) and does not print a 'make your check payable to ...' line; the payee 'Minnesota
  Department of Revenue' is the historical convention. Confirm via the Payment Voucher System when paying.
- The with-payment voucher's mailing destination is printed on the voucher itself ('send the voucher and your check
  or money order separately from your return'); it was not captured verbatim.
- Renter's Credit table mechanics (Schedule M1RENT line-by-line) were not parsed; the $2,720 maximum and $77,570
  household-income limit are from the M1 booklet's Line 22 credit summary.
- Schedule M1CD's own percentage-of-expenses table was not parsed; only the $76,150 / $88,150 AGI qualification
  limits were verified.
- The Minnesota Alternative Minimum Tax rate/exemption for 2025 (Schedule M1MT, M1 line 11) was not pulled; the
  pack only records that the line exists and is not modeled.
