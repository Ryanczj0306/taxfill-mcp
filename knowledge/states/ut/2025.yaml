tax:
  citation:
    source: 'Utah State Tax Commission — 2025 Utah TC-40 form (form 40501): Line 4 ''Federal adjusted gross income from
      federal return''; Line 9 ''Utah taxable income/loss - subtract the sum of lines 7 and 8 from line 6''; Line 10
      ''Utah tax - multiply line 9 by 4.5% (.045) (not less than zero)''; Lines 11-20 Taxpayer Tax Credit (Line 11 ''Utah
      personal exemption (multiply line 2d by $2,111)''; Line 14 state income tax from federal 1040 Schedule A line
      5e less lines 5b and 5c; Line 16 initial credit 6% (.06); Line 17 phase-out base $18,213 single/MFS, $27,320 HoH,
      $36,426 MFJ/QSS; Line 19 phase-out 1.3% (.013)). Second pass: the 2025 TC-40 Instructions (PDF title ''2025 TC-40
      Instructions'') — What''s New ''Utah Tax Rate: The 2025 Utah Legislature passed HB 106, lowering the income tax
      rate from 4.55 percent to 4.5 percent''; Line 10 ''Multiply line 9 by 4.5 percent (.045). If the result is zero
      or less, enter 0''; Line 11 ''The Utah personal exemption is $2,111 per dependent''; the Line 17 table ($18,213
      Single / $36,426 Married filing jointly / $18,213 Married filing separately / $27,320 Head of household / $36,426
      Qualifying surviving spouse); ''Rounding Off to Whole Dollars: Round off cents to the nearest whole dollar. Round
      down if under 50 cents; round up if 50 cents and above'' — both passes agree.'
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
  flat_rate: 0.045
  base: federal_agi
  tax_line: 'Form TC-40 Line 10: ''Utah tax - multiply line 9 by 4.5% (.045) (not less than zero)'' (Line 9 = Utah
    taxable income/loss = Line 6 total income minus Lines 7-8; Line 4 starts from federal AGI).'
  exemptions: {}
  notes:
  - 'Rate change for 2025: HB 106 (2025 General Session) lowered Utah''s flat individual income tax rate from 4.55%
    to 4.5% (2025 TC-40 instructions, What''s New; the 4.5% rate is printed on Line 10 of the 2025 TC-40 itself).
    Utah''s rate has now moved three years running — 4.65% (2023), 4.55% (2024), 4.5% (2025); never carry it forward.'
  - 'Base guidance: supply 2025 Form TC-40 Line 9 ''Utah taxable income/loss'' — Line 4 federal adjusted gross income
    plus Line 5 additions (TC-40A Part 1, codes 51-69) minus Line 7 (state tax refund included on federal Schedule
    1) and Line 8 subtractions (TC-40A Part 2). The op multiplies it by 4.5%, producing the Line 10 tax before credits.'
  - 'CRITICAL — Taxpayer Tax Credit (TC-40 Lines 11-20, NOT modeled): Utah has no standard deduction and no base personal
    exemptions; their function is replaced by a nonrefundable CREDIT against the Line 10 tax. Line 16 initial credit
    = 6% (.06) of [Line 11 Utah personal exemption ($2,111 x line 2d qualifying dependents — dependents ONLY, not
    taxpayer/spouse) + Line 12 federal standard or itemized deductions - Line 14 state income tax from federal form
    1040, Schedule A, line 5e less lines 5b and 5c]. It phases out at 1.3% (.013) of Line 9 income above the Line
    17 base: $18,213 single or married filing separately; $27,320 head of household; $36,426 married filing jointly
    or qualifying surviving spouse (RAISED for 2025 from $17,652/$26,478/$35,304). Line 22 Utah income tax = Line
    10 minus Line 20 (not less than zero). This op returns the LINE 10 amount — compute Lines 11-22 on the form.'
  - 'exemptions ships empty and standard_deduction ships null intentionally: the $2,111 personal exemption and the
    federal standard/itemized deduction are inputs to the Line 20 CREDIT, never subtractions from the Line 9 base
    — pass exemptions_count=0 and dependents_count=0. (The 2025 form also newly splits line 2 dependents into a =
    age 16 and under, b = other dependents, c = dependents born in 2025, d = total; only the line 2d total feeds Line
    11.)'
  - 'Qualified exempt taxpayer (TC-40 Line 21, NOT modeled): if federal adjusted gross income is LESS THAN the federal
    standard deduction (excluding the extra age-65/blind amounts), the filer is exempt from Utah income tax entirely
    — check the Line 21 worksheet before relying on the computed tax.'
  - 'Zero floor: Line 10 prints ''not less than zero'' and the instructions say ''If the result is zero or less, enter
    0'' — a Line 9 loss produces $0 tax (the op clamps a negative base to $0).'
  - 'Rounding (instructions, ''Rounding Off to Whole Dollars''): ''Round off cents to the nearest whole dollar. Round
    down if under 50 cents; round up if 50 cents and above'' — matches this op''s whole-dollar half-up rounding exactly.'
  - 'Not modeled — credits and later lines: apportionable nonrefundable credits on Line 24 (TC-40A Part 3 — the 20%-of-federal
    Utah EITC code AM, the $450/$900 retirement credit code 18, the Social Security benefits credit code AH now at
    4.5% with RAISED $45,000/$90,000/$54,000 phase-out thresholds, the $1,000-per-child child tax credit code AT whose
    age window HB 106 EXPANDED to children five and younger, the 4.5% capital gain / gold-and-silver-coin credits,
    the 4.5% military retirement credit AJ, and the new employer-provided childcare credits AW/AX), nonapportionable
    credits (Line 26, e.g. the $100 at-home parent credit code 01), use tax (Line 31) and the TC-40B non/part-year
    resident apportionment (Line 25) all come after Line 10 on the form.'
