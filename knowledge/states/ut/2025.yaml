effective_law_changes:
- description: >-
    RATE CUT for 2025 — "Utah Tax Rate: The 2025 Utah Legislature passed HB 106, lowering the
    income tax rate from 4.55 percent to 4.5 percent" (2025 TC-40 instructions, What's New). The
    4.5% rate is printed on line 10 of the 2025 TC-40 itself ("Utah tax - multiply line 9 by
    4.5% (.045) (not less than zero)"), and the Social Security Benefits Credit and military
    retirement credit percentages track it. Utah's rate has now moved three years running —
    4.65% (2023), 4.55% (2024), 4.5% (2025) — so it must never be carried forward.
  status: final_form_published
  affects:
  - tax.flat_rate
  - TC-40 line 10
  - credits (Social Security Benefits Credit and military retirement credit, computed at 4.5%)
  modeled: true
  citation:
    source: >-
      2025 Utah TC-40 Individual Income Tax Instructions (official PDF, title "2025 TC-40 Instructions", CreationDate
      2025-12-10) — What's New (HB 106 rate 4.55% -> 4.5%, expanded child tax credit age window, employer-provided childcare
      credits AW/AX; HB 547 Diapering Supplies Fund; SB 151 Statewide Hunger Relief Fund; HB 60 pass-through entity
      credit carryforward 5 -> 10 years), Who Must File and the qualified-exempt-taxpayer rule, Utah Domicile Tests
      1 and 2 plus spousal attribution, Resident / Nonresident / Part-Year Resident definitions, the 20-day nonresident
      exemption and its exclusions, Line 4 FAGI starting point, Line 10 tax = 4.5 percent (.045), Line 11 personal exemption
      $2,111 per dependent, Line 17 phase-out bases $18,213/$36,426/$18,213/$27,320/$36,426, TC-40A Part 1 Additions
      (codes 51-69), Income from Other Countries and Foreign Nationals & Expatriates, Rounding Off to Whole Dollars,
      credit worksheets (AM/18/AH/AT/01/04/AJ/AS), When to File and Pay (April 15, 2026), mailing addresses (84134-0266
      / 84134-0260), check payee, tap.utah.gov
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
- description: >-
    CHILD TAX CREDIT AGE WINDOW EXPANDED for 2025: HB 106 (2025) widened the Utah child tax
    credit (UC 59-10-1047, code AT) to cover any child who qualifies for the federal child tax
    credit under IRC 24 and was, on the last day of 2025, NO MORE THAN FIVE YEARS OLD — for 2024
    the child had to be at least one and no more than three years old. The $1,000-per-child
    amount, the 10%-of-excess-MAGI phase-out and its thresholds ($27,000 MFS / 1040NR; $54,000
    MFJ and QSS; $43,000 single and head of household) are unchanged from 2024.
  status: final_form_published
  affects:
  - credits (Utah Child Tax Credit)
  - TC-40A Part 3 code AT, carried to TC-40 line 24
  modeled: false
  lookup_path: >-
    2025 Utah TC-40 Individual Income Tax Instructions, (AT) Child Tax Credit (UCA 59-10-1047) and Child
    Tax Credit Worksheet (the citation URL) for the expanded age test and the MAGI phase-out;
    calc.state_tax returns TC-40 line 10 and applies no TC-40A credits.
  citation:
    source: >-
      2025 Utah TC-40 Individual Income Tax Instructions, (AT) Child Tax Credit (UCA 59-10-1047) and Child
      Tax Credit Worksheet; What's New (HB 106 expanded eligibility age)
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
- description: >-
    NEW credits for 2025 (What's New): HB 106 created two employer-provided-childcare credits —
    code AW for construction and code AX for expenses — claimed on TC-40A Part 3 and carried to
    TC-40 line 24. They come with a five-year recapture schedule that this pack does not
    transcribe (see `unverified`), and this pack's `credits` list does not carry them.
  status: final_form_published
  affects:
  - TC-40A Part 3 codes AW (construction) and AX (expenses), carried to TC-40 line 24
  - credits (not carried in this pack)
  modeled: false
  lookup_path: >-
    2025 Utah TC-40 Individual Income Tax Instructions, What's New and the (AW)/(AX) employer-provided
    childcare credit instructions (the citation URL) for the credit amounts and the five-year recapture
    schedule; calc.state_tax returns TC-40 line 10 and applies no TC-40A credits.
  citation:
    source: >-
      2025 Utah TC-40 Individual Income Tax Instructions (official PDF, title "2025 TC-40 Instructions", CreationDate
      2025-12-10) — What's New (HB 106 rate 4.55% -> 4.5%, expanded child tax credit age window, employer-provided childcare
      credits AW/AX; HB 547 Diapering Supplies Fund; SB 151 Statewide Hunger Relief Fund; HB 60 pass-through entity
      credit carryforward 5 -> 10 years), Who Must File and the qualified-exempt-taxpayer rule, Utah Domicile Tests
      1 and 2 plus spousal attribution, Resident / Nonresident / Part-Year Resident definitions, the 20-day nonresident
      exemption and its exclusions, Line 4 FAGI starting point, Line 10 tax = 4.5 percent (.045), Line 11 personal exemption
      $2,111 per dependent, Line 17 phase-out bases $18,213/$36,426/$18,213/$27,320/$36,426, TC-40A Part 1 Additions
      (codes 51-69), Income from Other Countries and Foreign Nationals & Expatriates, Rounding Off to Whole Dollars,
      credit worksheets (AM/18/AH/AT/01/04/AJ/AS), When to File and Pay (April 15, 2026), mailing addresses (84134-0266
      / 84134-0260), check payee, tap.utah.gov
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf

