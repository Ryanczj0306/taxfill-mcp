- id: forms-2
  topic: forms_and_instructions
  url: https://files.tax.utah.gov/tax/forms/2025/tc-40inst.pdf
  descriptions:
  - '2025 Utah TC-40 Individual Income Tax Instructions — ''Who Must File'' (p. 2): ''You must file a TC-40 return
    if you: 1. are a Utah resident or part-year resident who must file a federal return, 2. are a nonresident or
    part-year resident with income from Utah sources who must file a federal return''; ''Residency'' (p. 7): ''If
    you or your spouse answer "N," complete and attach Schedule B, Non or Part-year Resident Schedule.''; ''TC-40B
    - Non or Part-year Resident Schedule'' (p. 28): ''Use TC-40B to calculate the Utah tax for a nonresident or
    a part-year resident.'' — ''1. If you are a part-year resident, enter the date you established residency in
    Utah and the date the residency ended.'''
  - '2025 Utah TC-40 Individual Income Tax Instructions — ''Who Must File'' (p. 2): ''You must file a TC-40 return
    if you: ... 2. are a nonresident or part-year resident with income from Utah sources who must file a federal
    return''; ''Residency'' (p. 7): ''If you or your spouse answer "N," complete and attach Schedule B, Non or Part-year
    Resident Schedule.''; ''TC-40B - Non or Part-year Resident Schedule'' (p. 28): ''Use TC-40B to calculate the
    Utah tax for a nonresident or a part-year resident.'' — ''2. If you (and your spouse) are a nonresident, enter
    the two-character home state postal abbreviation.'''
