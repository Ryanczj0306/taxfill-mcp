- id: forms-4
  topic: forms_and_instructions
  url: https://files.tax.utah.gov/tax/forms/current/tc-40.pdf
  descriptions:
  - '2025 Utah TC-40 form (official PDF, form number 40501, "202[5]" tax year on the face; second-pass verification:
    Line 1 filing status codes 1-5; Line 2 qualifying dependents a (age 16 and under) / b (other dependents) / c
    (dependents born in 2025) / d (total); Line 4 federal adjusted gross income; Line 9 "Utah taxable income/loss
    - subtract the sum of lines 7 and 8 from line 6"; Line 10 "Utah tax - multiply line 9 by 4.5% (.045) (not less
    than zero)"; Line 11 "Utah personal exemption (multiply line 2d by $2,111)"; Line 14 "State income tax from
    federal 1040, Schedule A, line 5e, less lines 5b and 5c (not less than zero)"; Line 16 initial credit 6% (.06);
    Line 17 "Enter: $18,213 (single or married filing separately); $27,320 (head of household); or $36,426 (married
    filing jointly or qualifying surviving spouse)"; Line 19 phase-out 1.3% (.013); Line 21 qualified exempt taxpayer;
    Line 22 "Utah income tax - subtract line 20 from line 10 (not less than zero)")'
