credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Taxpayer Tax Credit
  type: nonrefundable
  eligibility: Available to essentially all Utah resident filers (and apportioned for part-year/nonresidents). It
    is the broad general credit that offsets Utah's flat 4.5% income tax. The credit is reduced (phased out) as income
    rises above a base amount tied to filing status, and reaches zero for higher earners. Filers whose federal AGI
    is less than their federal standard deduction are instead "Qualified Exempt Taxpayers" and owe no Utah tax (TC-40
    line 21).
  claimed_on: Utah TC-40, line 20 (computed via lines 11-20); personal exemption on line 11, deductions on lines
    12-15.
  citation:
    source: 2025 Utah TC-40 Individual Income Tax Instructions (Utah State Tax Commission), Lines 11-20 Taxpayer
      Tax Credit and the Line 17 filing-status table ($18,213 Single / $36,426 Married filing jointly / $18,213 Married
      filing separately / $27,320 Head of household / $36,426 Qualifying surviving spouse); second pass = the printed
      2025 TC-40 lines 11 ($2,111), 16 (6%), 17 ($18,213/$27,320/$36,426) and 19 (1.3%)
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
- name: Utah Earned Income Tax Credit (EITC)
  type: nonrefundable
  eligibility: 'You must (1) qualify for and claim the federal earned income tax credit in the same tax year, and
    (2) earn Utah income that is reported on a federal W-2. The credit is limited to the amount of Utah wages (Earned
    Income Tax Credit Worksheet: enter the LESSER of 20% of the federal credit or total Utah W-2 box 16 wages). Nonrefundable:
    it can reduce Utah income tax to zero but any excess is not refunded and cannot be carried forward or back.'
  claimed_on: Utah TC-40A, Part 3 (apportionable nonrefundable credits), using code AM; total carried to TC-40, line
    24.
  citation:
    source: 2025 Utah TC-40 Individual Income Tax Instructions, (AM) Earned Income Tax Credit (UCA 59-10-1044) and
      Earned Income Tax Credit Worksheet
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
- name: Retirement Credit
  type: nonrefundable
  eligibility: 'You (and/or your spouse, if filing jointly) must have been born on or before Dec. 31, 1952. You may
    NOT claim it if you (or your spouse) claim either the Social Security Benefits Credit (code AH) or the Military
    Retirement Credit (code AJ). Nonrefundable: reduces tax to zero but no refund of excess; no carryforward/back.
    Because the maximum is only $450, the instructions note many filers do better with the Social Security Benefits
    Credit or the Military Retirement Credit.'
  claimed_on: Utah TC-40A, Part 3, using code 18 (also enter birthdate(s)); total carried to TC-40, line 24.
  citation:
    source: 2025 Utah TC-40 Individual Income Tax Instructions, (18) Retirement Credit (UCA 59-10-1019) and Retirement
      Credit Worksheet
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
- name: Social Security Benefits Credit
  type: nonrefundable
  eligibility: 'Available to filers (or spouses, if filing jointly) who received taxable Social Security retirement,
    disability or survivor benefits included in adjusted gross income on the return. You may NOT also claim the Retirement
    Credit (code 18). Nonrefundable: reduces tax to zero, no refund of excess, no carryforward/back.'
  claimed_on: Utah TC-40A, Part 3, using code AH; total carried to TC-40, line 24.
  citation:
    source: 2025 Utah TC-40 Individual Income Tax Instructions, (AH) Social Security Benefits Credit (UCA 59-10-1042)
      and Social Security Credit Worksheet
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
- name: Utah Child Tax Credit (age window EXPANDED for 2025)
  type: nonrefundable
  eligibility: Available for each child who (1) qualifies for the federal child tax credit under IRC 24, and (2)
    was, on the last day of 2025, NO MORE THAN FIVE YEARS OLD. HB 106 (2025) expanded the window — for 2024 the child
    had to be at least one and no more than three years old. Phased out by modified adjusted gross income. Nonrefundable;
    no carryforward/back.
  claimed_on: Utah TC-40A, Part 3, using code AT; total carried to TC-40, line 24.
  citation:
    source: 2025 Utah TC-40 Individual Income Tax Instructions, (AT) Child Tax Credit (UCA 59-10-1047) and Child
      Tax Credit Worksheet; What's New (HB 106 expanded eligibility age)
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
- name: At-Home Parent Credit
  type: nonrefundable
  eligibility: An at-home parent (biological mother/father, stepmother/stepfather, adoptive parents, foster parents,
    legal guardian, or a person housing a child placed by a child-placing agency for legal adoption) who provides
    full-time care in their residence for a child 12 months old or younger on the last day of 2025, with the child
    claimed as a dependent on the at-home parent's return. The at-home parent's total W-2 wages/tips/compensation
    plus federal Schedule C line 7 gross income must be $3,000 or less for the tax year, and federal adjusted gross
    income (TC-40 line 4) must be $50,000 or less. Nonrefundable; no carryforward/back.
  claimed_on: Utah TC-40A, Part 4 (nonapportionable nonrefundable credits), using code 01 (no form; keep records);
    total carried to TC-40, line 26.
  citation:
    source: 2025 Utah TC-40 Individual Income Tax Instructions, (01) At-Home Parent Credit (UCA 59-10-1005)
    url: https://files.tax.utah.gov/tax/forms/current/tc-40inst.pdf
