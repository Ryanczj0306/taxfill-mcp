unverified:
- 'CITATION-URL CAVEAT: Utah does not (yet) publish a year-pinned 2025 path — https://files.tax.utah.gov/tax/forms/2025/tc-40inst.pdf
  returns HTTP 404, while the 2024 equivalent (.../2024/tc-40inst.pdf) resolves. The citations above therefore use
  the ".../current/" path, which served the TY2025 documents when this pack was authored (verified from the PDF''s
  own title "2025 TC-40 Instructions" and the form''s 2025 tax-year face). Once Utah rolls the year over, re-point
  these citations at .../tax/forms/2025/tc-40inst.pdf and .../tax/forms/2025/tc-40.pdf.'
