tax:
  citation:
    source: '2025 MICHIGAN Individual Income Tax MI-1040 Instructions (MI-1040-Book.pdf) — "For tax year 2025, the Michigan
      income tax rate is 4.25%"; "the personal and stillbirth exemption allowances are $5,800. The special exemption
      allowance for deaf, blind, hemiplegic, paraplegic, quadriplegic, or totally and permanently disabled is $3,400.
      The exemption allowance for qualified disabled veterans is $500"; Line 17 "Tax. Multiply the amount on line 16
      by 4.25% (0.0425)". Second pass: the 2025 MI-1040 form itself prints line 9a "x $5,800", 9b "x $3,400", 9c "x
      $500", 9d "x $5,800", 9e $1,500, and line 17 "Tax. Multiply line 16 by 4.25% (0.0425)" — both passes agree, and
      the instructions'' worked example ($53,000 - $5,800 = $47,200 x 0.0425 = $2,006) confirms half-up whole-dollar
      rounding.'
    url: https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2025/MI-1040-Book.pdf
  flat_rate: 0.0425
  base: federal_agi
  tax_line: 'MI-1040 Line 17: "Tax. Multiply line 16 by 4.25% (0.0425)" (Line 16 = taxable income = line 14 income
    subject to tax minus line 15 exemption allowance; Line 10 starts from federal AGI).'
  exemptions:
    personal:
      amount: 5800
      note: 'Line 9a: $5,800 per exemption — taxpayer and spouse. INCREASED from $5,600 (2024).'
    dependent:
      amount: 5800
      note: 'Line 9a: dependents use the same $5,800 per-exemption allowance (taxpayer, spouse, and dependents all count
        on line 9a).'
    stillbirth:
      amount: 5800
      note: 'Line 9d: $5,800 stillbirth exemption (Certificate of Stillbirth from MDHHS). NOT applied by calc.state_tax.'
    special_disabled:
      amount: 3400
      note: 'Line 9b: $3,400 special exemption — deaf, blind, hemiplegic, paraplegic, quadriplegic, or totally and permanently
        disabled. INCREASED from $3,300 (2024). NOT applied by calc.state_tax.'
    disabled_veteran:
      amount: 500
      note: 'Line 9c: $500 qualified disabled veteran exemption (unchanged from 2024). NOT applied by calc.state_tax.'
  notes:
  - 'CHANGED for 2025: the personal/stillbirth exemption rose $5,600 -> $5,800 and the special-disabled exemption
    rose $3,300 -> $3,400; the 4.25% rate and the $500 disabled-veteran and $1,500 claimed-as-dependent amounts are
    unchanged. Exemption amounts are year-specific — never carry them to another year.'
  - 'Claimed as a dependent by another: enter $0 on line 9a and $1,500 on line 9e instead of the $5,800 personal exemption
    — calc.state_tax does not model this; compute line 9e on the form.'
  - Michigan filing statuses are single / married filing jointly / married filing separately ONLY — if you filed your
    federal return as head of household or qualifying surviving spouse, you must file your Michigan return as single
    (2025 instructions). The flat rate has no per-status schedule, so this mapping never changes the math here.
  - Michigan CITY income taxes (Detroit and other cities; City of Detroit returns are processed by Treasury) are NOT
    modeled — calc.state_tax computes the state 4.25% line only.
