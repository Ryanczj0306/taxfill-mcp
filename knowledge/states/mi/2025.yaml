unverified:
- The 2025 Schedule NR standalone PDF was not opened; the form name 'Nonresident and Part-Year Resident Schedule
  (Schedule NR)' and its role are confirmed from the 2025 MI-1040 instruction book (which includes the Exemption
  Allowance for Schedule NR worksheet) and the TY2025 forms index, not from the standalone Schedule NR form image.
- Home Heating Credit (MI-1040CR-7) 2025 standard-allowance dollar amounts and income ceilings were not fetched;
  only the credit's existence and separate-filing mechanics are asserted, from the MI-1040 instruction book.
- The Homestead Property Tax Credit 2025 figures ($165,400 / $71,500 / $62,500 / $1,900, 3.2%, 23% rent, 60%) were
  read from the MI-1040 instruction book ('New for 2025' and the Homestead Property Tax Credit section, page 26);
  the standalone MI-1040CR instructions PDF was not separately opened (MI-1040CR.pdf, the form, is available).
- Michigan's residency definition is domicile-based per the 2025 instruction book; the book does not state a numeric
