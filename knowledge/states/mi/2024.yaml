# Flat-rate tax computation block (Phase G item G4) — consumed by calc.state_tax.
# Figures verified two-pass against the cited 2024 MI-1040 instruction book and the
# 2024 MI-1040 form itself (michigan.gov): rate 4.25% and every exemption amount are
# PRINTED on the 2024 form (lines 9a-9e, line 17).
# CHANGED for 2024 vs the 2023 pack: rate REVERTS 4.05% -> 4.25% (2023's 4.05% was a
# one-year reduction, exactly as the 2023 pack warned); personal/stillbirth exemption
# $5,400 -> $5,600; special disabled exemption $3,100 -> $3,300; disabled veteran
# exemption $400 -> $500. The $1,500 claimed-as-dependent amount (line 9e) is unchanged.
tax:
  citation:
    source: '2024 Michigan MI-1040 Individual Income Tax forms and instructions — instructions: "For tax year 2024,
      the Michigan income tax rate is 4.25%"; "the personal and stillbirth exemption allowances are $5,600. The special
      exemption allowance for deaf, blind, hemiplegic, paraplegic, quadriplegic, or totally and permanently disabled
      is $3,300. The exemption allowance for qualified disabled veterans is $500"; Line 17 "Tax. Multiply the amount
      on line 16 by 4.25 percent (0.0425)". Second pass: the 2024 MI-1040 form itself prints line 9a "x $5,600", 9b
      "x $3,300", 9c "x $500", 9d "x $5,600", 9e $1,500, and line 17 "Tax. Multiply line 16 by 4.25% (0.0425)" — both
      passes agree, and the instructions'' worked example ($53,000 - $5,600 = $47,400 x 0.0425 reported as $2,015) confirms
      half-up whole-dollar rounding.'
    url: https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2024/MI-1040-Instructions.pdf
  flat_rate: 0.0425
  base: federal_agi
  tax_line: 'MI-1040 Line 17: "Tax. Multiply line 16 by 4.25% (0.0425)" (Line 16 = taxable income = line 14 income
    subject to tax minus line 15 exemption allowance; Line 10 starts from federal AGI).'
  exemptions:
    personal:
      amount: 5600
      note: 'Line 9a: $5,600 per exemption — taxpayer and spouse.'
    dependent:
      amount: 5600
      note: 'Line 9a: dependents use the same $5,600 per-exemption allowance (taxpayer, spouse, and dependents all count
        on line 9a).'
    stillbirth:
      amount: 5600
      note: 'Line 9d: $5,600 stillbirth exemption (Certificate of Stillbirth from MDHHS). NOT applied by calc.state_tax.'
    special_disabled:
      amount: 3300
      note: 'Line 9b: $3,300 special exemption — deaf, blind, hemiplegic, paraplegic, quadriplegic, or totally and permanently
        disabled. NOT applied by calc.state_tax.'
    disabled_veteran:
      amount: 500
      note: 'Line 9c: $500 qualified disabled veteran exemption. NOT applied by calc.state_tax.'
  notes:
  - 'The 4.25% rate is the REVERSION to Michigan''s standard rate: 2023''s 4.05% was a one-year statutory reduction
    for tax year 2023 only — never carry either year''s rate to another year.'
  - 'Claimed as a dependent by another: enter $0 on line 9a and $1,500 on line 9e instead of the $5,600 personal exemption
    — calc.state_tax does not model this; compute line 9e on the form.'
  - Michigan filing statuses are single / married filing jointly / married filing separately ONLY — if you filed your
    federal return as head of household or qualifying surviving spouse, you must file your Michigan return as single
    (2024 instructions, Line 7). The flat rate has no per-status schedule, so this mapping never changes the math
    here.
  - Michigan CITY income taxes (Detroit and other cities; City of Detroit returns are processed by Treasury and may
    be filed with the Michigan return) are NOT modeled — calc.state_tax computes the state 4.25% line only.
