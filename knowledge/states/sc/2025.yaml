  url: https://dor.sc.gov/sites/dor/files/forms/SC1040Instr_2025.pdf
- source: '2025 SC1040 Individual Income Tax Return form (SC Dept. of Revenue) - line 1 ''Enter federal taxable income from your federal form''; line w South Carolina Dependent Exemption; line 6 TAX (see SC1040TT); line 21 Tuition tax credit (attach I-319); MAIL TO addresses'
