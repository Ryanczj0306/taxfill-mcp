unverified:
- 'No 2025 revision of Form TC-60 (SC EITC) was retrievable (TC60_2025.pdf returns the SCDOR error page at both dor.sc.gov/forms-site/Forms/ and dor.sc.gov/sites/dor/files/forms/); the 125% rate is the fully-phased statutory rate under S.C. Code Section 12-6-3632 first effective for tax year 2023, and the 2025 SC1040TC still lists the credit as code 060 routed to SC1040 line 13 — confirm the 2025 TC-60 at dor.sc.gov/forms before claiming.'
- 'Check payee is given as ''SCDOR'' per the SCDOR General Information and the SC1040-V voucher convention; the 2025 SC1040 form itself only surfaces electronic options (MyDORWAY/ACH) on its face, so confirm the exact payee wording on the 2025 SC1040-V if paying a 2025 balance due by mailed check.'
- 'The 2025 ''SC Individual Income Tax General Information and FAQs'' document (the original who-must-file source) was not re-fetched; the filing-requirement framework (including the 65+ federal-threshold-plus-$30,000/$15,000 tests) is carried from the earlier years'' packs with the 2025 dates confirmed from the 2025 SC1040 instructions. The 14-page 2025 instruction booklet does not restate the who-must-file table.'
tax:
  citation:
    source: '2025 South Carolina Individual Income Tax Tables SC1040TT (Revised 6/17/25) — the mandatory tax tables
      for taxable income under $100,000 and the ''2025 Tax Rate Schedule for taxable income of $100,000 or more'' (''1.
      Multiply the amount on line 5 by 6%; 2. Subtract $642; 3. Enter the difference on line 6'', with the worked example
      $101,000 -> $5,418); 2025 SC1040 Instructions Line 6 (''If your income subject to tax on line 5 is less than $100,000,
      use the SC1040TT... If your income subject to tax on line 5 is $100,000 or more, use the tax rate schedule provided
      in the SC1040TT'') and Line w (dependent exemption $4,930). Second pass (bracket bounds and constants): 2025 SC4972,
      Rev. 6/17/25, printed ''2025 Tax Computation Schedule for Line 19 and Line 22'' — $0 to $3,560: 0% times the amount;
      $3,560 to $17,830: 3% times the amount minus $107; $17,830 or more: 6% times the amount minus $642 (https://dor.sc.gov/sites/dor/files/forms/SC4972_2025.pdf).
      TY2025 changes vs 2024: top rate 6.2% -> 6% (the Act 228 of 2022 step-down toward 6%), bounds indexed $3,460/$17,330
      -> $3,560/$17,830, constants $104/$659 -> $107/$642, dependent exemption $4,790 -> $4,930.'
    url: https://dor.sc.gov/sites/dor/files/forms/SC1040TT_2025.pdf
  brackets:
    single:
    - {over: 0, but_not_over: 3560, rate: 0}
    - {over: 3560, but_not_over: 17830, rate: 0.03}
    - {over: 17830, but_not_over: null, rate: 0.06}
    married_filing_jointly:
    - {over: 0, but_not_over: 3560, rate: 0}
    - {over: 3560, but_not_over: 17830, rate: 0.03}
    - {over: 17830, but_not_over: null, rate: 0.06}
    married_filing_separately:
    - {over: 0, but_not_over: 3560, rate: 0}
    - {over: 3560, but_not_over: 17830, rate: 0.03}
    - {over: 17830, but_not_over: null, rate: 0.06}
    head_of_household:
    - {over: 0, but_not_over: 3560, rate: 0}
    - {over: 3560, but_not_over: 17830, rate: 0.03}
    - {over: 17830, but_not_over: null, rate: 0.06}
  base: federal_taxable_income
  tax_line: '2025 Form SC1040, line 6: ''TAX on your South Carolina Income Subject to Tax (see SC1040TT)''. Line 5
    (South Carolina Income Subject to Tax) = line 1 federal taxable income (''Enter federal taxable income from your
    federal form'') + line 2 SC additions (lines a-e) - line 4 SC subtractions (lines f-w, including the line w dependent
    exemption this block ships).'
  exemptions:
    dependent:
      amount: 4930
      note: 'SC1040 line w, ''South Carolina Dependent Exemption (see instructions)'' — $4,930 for each eligible dependent
        for 2025 (2025 SC1040 instructions, Line w ''Worksheet for South Carolina dependent exemption'', line 1: ''South
        Carolina dependent exemption amount ... $4,930''), including both qualifying children and qualifying relatives;
        part of the line 4 subtractions, a true base reduction before line 5 South Carolina Income Subject to Tax. Indexed
        annually (was $4,790 for 2024, $4,610 for 2023).'
  notes:
  - 'TY2025 RATE STEP-DOWN: the top rate fell from 6.2% to 6% (the annual Act 228 of 2022 reduction toward 6%; the
    2025 SC1040TT''s $100,000-or-more schedule prints ''Multiply the amount on line 5 by 6%''), the bracket bounds
    indexed to $3,560/$17,830 (from $3,460/$17,330), the subtraction constants became $107/$642 (from $104/$659),
    and the line w dependent exemption rose to $4,930 (from $4,790).'
  - 'Base guidance: supply SC1040 line 5 (South Carolina Income Subject to Tax) BEFORE the line w dependent exemption
    — i.e. line 1 federal TAXABLE income (federal 1040 line 15; the federal standard/itemized deduction is already
    embedded, never subtract it again) plus SC additions (lines a-e) minus the other SC subtractions (lines f-v) —
    and pass dependents_count so the op subtracts the shipped $4,930-per-dependent line w amount to reproduce line
    5. South Carolina has NO personal exemption and NO state standard deduction of its own.'
  - 'Adjudication note (two-pass): pass 1 = the 2025 SC1040TT, Revised 6/17/25 (mandatory tables below $100,000 +
    the printed $100,000-or-more schedule ''6% minus $642'', example $101,000 -> $5,418); pass 2 = the 2025 SC4972''s
    printed ''2025 Tax Computation Schedule for Line 19 and Line 22'' ($0-$3,560 0%; $3,560-$17,830 3% times the amount
    minus $107; $17,830 or more 6% times the amount minus $642). Both passes agree on every bound and rate, and the
    tables'' own band arithmetic independently pins the bounds (the $3,600-$3,650 row prints $2 = 3% x $3,625 - $107
    rounded; the increment per $100 row switches from $3 to $6 across the $17,830 boundary). NOTE: the SC1040 instruction
    booklet itself prints NO bracket dollar bounds — the SC4972 schedule is the official in-form statement of them.'
  - 'CRITICAL — SC''s filed arithmetic is a SUBTRACTION METHOD, not marginal accumulation: the official computation
    is ''rate x ENTIRE income - constant'', and the printed constants are ROUNDED (2025: $107 vs the exact marginal
    $106.80; $642 vs the exact $641.70 — note the top constant is now rounded AGAINST the taxpayer by 30 cents, the
    reverse of 2024''s $659-vs-$658.36). Pure marginal accumulation (this engine) therefore comes out up to ~$1 LOWER
    than 2024''s relationship above $17,830 and, for 2025, agrees with the SC1040TT''s own printed $100,000-or-more
    example to the dollar ($101,000: engine $5,418.30 -> $5,418; printed 6% x $101,000 - $642 = $5,418). Inside the
    3% band the engine is up to 20 cents higher than the filed formula. The filed return must still use the SC1040TT
    table or the $100,000+ schedule; treat this block''s output as an estimate within ~$1-3 (table bands add their
    own few-dollar spread).'
  - 'Tax-table mandate: taxable income under $100,000 MUST use the SC1040TT tax tables (2025 SC1040 instructions,
    Line 6); the tables are built in $50/$100 bands from the subtraction formulas at band midpoints (rounded), so
    a row can differ from exact arithmetic by a few dollars in either direction (e.g. exact $17,830 -> engine $428,
    but the $17,800-$17,900 row prints $429). Taxable income of $100,000 or more MUST use the rate schedule (6% x
    line 5 - $642).'
  - ONE rate schedule for every filing status — the 2025 SC1040TT states 'Use this Tax Rate Schedule for any filing
    status claimed on the SC1040'; the identical schedule is duplicated across all four statuses here, copied, not
    derived (qualifying surviving spouse included).
  - 'Zero-rate floor: the first $3,560 of SC taxable income is taxed at 0% (the schema''s zero-rate bottom bracket,
    like OH/MS) — a filer at or below $3,560 owes $0 with no exemption needed.'
  - 'Credits are NOT modeled (tax credits, not base reductions): Two Wage Earner Credit (line 12, .007 x up to $50,000
    of the lower-earning spouse''s qualified earned income, max $350), Child and Dependent Care Credit (line 11, 7%
    of the federal expense, max $210/$420), SC Earned Income Tax Credit (125% of the federal EITC via TC-60 -> SC1040TC
    code 060 -> line 13, nonrefundable), and the refundable Tuition Tax Credit (line 21, Form I-319, 50% up to $1,500).'
  - 'Out of scope on the same return: TAX on Lump-Sum Distribution (line 7, SC4972) is a separate additional tax;
    Active Trade or Business income electing the flat rate (Form I-335, line 8) is excluded from this schedule; the
    2.5% additional tax on excess catastrophe-savings withdrawals (line 9) is separate too — all are computed on their
    own forms.'
