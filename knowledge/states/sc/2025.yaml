- id: rates-1
  topic: tax_rates_and_brackets
  url: https://dor.sc.gov/sites/dor/files/forms/SC1040TT_2025.pdf
  descriptions:
  - '2025 South Carolina Individual Income Tax Tables SC1040TT (Revised 6/17/25) — the mandatory tax tables for
    taxable income under $100,000 and the ''2025 Tax Rate Schedule for taxable income of $100,000 or more'' (''1.
    Multiply the amount on line 5 by 6%; 2. Subtract $642; 3. Enter the difference on line 6'', with the worked
    example $101,000 -> $5,418); 2025 SC1040 Instructions Line 6 (''If your income subject to tax on line 5 is less
    than $100,000, use the SC1040TT... If your income subject to tax on line 5 is $100,000 or more, use the tax
    rate schedule provided in the SC1040TT'') and Line w (dependent exemption $4,930). Second pass (bracket bounds
    and constants): 2025 SC4972, Rev. 6/17/25, printed ''2025 Tax Computation Schedule for Line 19 and Line 22''
    — $0 to $3,560: 0% times the amount; $3,560 to $17,830: 3% times the amount minus $107; $17,830 or more: 6%
    times the amount minus $642 (https://dor.sc.gov/sites/dor/files/forms/SC4972_2025.pdf). TY2025 changes vs 2024:
    top rate 6.2% -> 6% (the Act 228 of 2022 step-down toward 6%), bounds indexed $3,460/$17,330 -> $3,560/$17,830,
    constants $104/$659 -> $107/$642, dependent exemption $4,790 -> $4,930.'
- id: law-1
  topic: law_changes
  url: https://dor.sc.gov/sites/dor/files/forms/SC1040TT_2025.pdf
  descriptions:
  - '2025 SC1040TT, South Carolina Tax Tables — Tax Rate Schedule for SC1040 line 5 of $100,000 or more: ''Multiply
    the amount on line 5 by 6%;'' then ''Subtract $642''.'
- id: law-2
  topic: law_changes
  url: https://dor.sc.gov/sites/dor/files/forms/SC1040Instr_2025.pdf
  descriptions:
  - '2025 SC1040 Individual Income Tax Instructions (August 2025), Before You Begin: ''South Carolina conforms to
    the Internal Revenue Code as amended through December 31, 2024, except as otherwise provided.'' — ''These instructions
    reflect the law as of the end of the 2025 South Carolina legislative session.'''
  - 2025 SC1040 Individual Income Tax Instructions (August 2025), Before You Begin
