unverified:
- Whether DC's 'Other' addition (Schedule I, Calculation A, Line 7 — 'items not subject to federal tax but subject
  to DC tax') could in some interpretation capture a specific federal treaty exclusion. The booklet does NOT list
  treaty income as an example; no treaty addback is enumerated, so conformity is assessed as true, but the open-ended
  'Other' line was not exhaustively cross-checked against DC Code sec.47-1803.02(a) additions — confirm at OTR for
  an unusual treaty position.
- The 2024 D-40B (Nonresident Request for Refund) mailing address was not re-verified this session — the 2023 form
  mailed to PO Box 96147, Washington, DC 20090-6147; confirm on the 2024 D-40B itself before mailing.
- The dependent-filer standard deduction worksheet (booklet p.20) prints partially garbled in text extraction; the
  legible fragments ('earned income more than $850? Yes. Add $450 to your earned income', minimum consistent with
  $1,300) match the federal 2024 dependent standard deduction rule (greater of $1,300 or earned income + $450, capped
  at the regular status amount). Confirm exact worksheet lines on the printed page before relying on them.
tax:
  citation:
    source: 'DC Office of Tax and Revenue — 2024 D-40 Individual Income Tax Forms and Instructions booklet (2024_D40_Booklet_062325.pdf):
      ''Reminders — Income Tax Rate Table - For taxable years beginning January 1, 2022'' (p.3) and ''Calculation I/Tax
      Rate Schedule'' (p.17): ''Not over $10,000: 4% of the taxable income; Over $10,000 but not over $40,000: $400,
      plus 6% of the excess over $10,000; Over $40,000 but not over $60,000: $2,200, plus 6.5% of the excess over $40,000;
      Over $60,000 but not over $250,000: $3,500, plus 8.5% of the excess over $60,000; Over $250,000 but not over $500,000:
      $19,650, plus 9.25% of the excess over $250,000; Over $500,000 but not over $1,000,000: $42,775, plus 9.75% of
      the excess over $500,000; Over $1,000,000: $91,525, plus 10.75% of the excess over $1,000,000''; ''New for 2024''
      + ''Standard Deduction'' section p.10 ($14,600 single and married/registered domestic partners filing separately;
      $21,900 head of household; $29,200 married/registered domestic partners filing jointly, qualifying widow(er)s
      with dependent children, and married/RDP filing separately on the same return — increased from $13,850/$20,800/$27,700
      ''based on the federal law''); Line 19 ''DC taxable income — Subtract Line 18 from Line 16'' and Line 20 ''Tax''
      instructions p.18; tax tables for taxable income of $100,000 or less, pp.85-94. Second pass: the live OTR ''DC
      Individual and Fiduciary Income Tax Rates'' page (otr.cfo.dc.gov/page/dc-individual-and-fiduciary-income-tax-rates)
      prints the identical post-12/31/2021 schedule — both passes agree. Recorded resolution: the p.3 Reminders print
      carries a typo ''.8.5%'' for the $60,000-$250,000 row; the p.17 Calculation I print and the live rates page both
      read 8.5%, and the printed constants ($19,650 = $3,500 + 8.5% x $190,000) prove 8.5% is correct.'
    url: https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2024_D40_Booklet_062325.pdf
