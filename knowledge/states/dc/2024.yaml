  base: federal_agi
  tax_line: 'Form D-40 Line 20: ''Tax'' — instructions p.18: ''If Line 19 is $100,000 or less, use the tax tables
    on pages 85-94 to determine your tax. If Line 19 is more than $100,000, use Calculation I on page 17.'' Line 19
    DC taxable income = Line 16 (DC adjusted gross income) minus Line 18 (DC deduction amount): ''Subtract Line 18
    from Line 16. Enter the result; if a loss, fill in the oval.'''
  exemptions: {}
  standard_deduction:
    single: 14600
    married_filing_jointly: 29200
    married_filing_separately: 14600
    head_of_household: 21900
  notes:
  - '2024 CHANGE — STANDARD DEDUCTION ROSE WITH FEDERAL LAW (rates unchanged): ''The standard deductions are increasing
    based on the federal law; beginning January 1, 2024, from $13,850 to $14,600 for single and married/registered
    domestic partner filers filing separately; $20,800 to $21,900 for head of household filers; $27,700 to $29,200
    for married/registered partners filing jointly and qualifying widow(er) with dependent child(ren) filers'' (New
    for 2024, booklet p.3, restated in the Standard Deduction section p.10). The rate table itself is the same one
    in effect ''for taxable years beginning January 1, 2022.'''
  - 'Base guidance: Supply 2024 Form D-40 Line 16, ''DC adjusted gross income'' (Line 7 total DC gross income minus
    Line 15 total subtractions). Line 7 = Line 4 federal adjusted gross income (from the federal 1040/1040-SR/1040-NR)
    plus DC additions (Line 5 franchise tax deducted; Line 6 other additions from DC Schedule I, Calculation A); Lines
    8-14 are DC subtractions (taxable state/local refunds, taxable Social Security and tier 1 railroad retirement,
    income taxed on a DC franchise/fiduciary return, DC/federal government survivor benefits, unemployment insurance
    benefits, other Schedule I Calculation B subtractions). A filer with no DC additions or subtractions has DC AGI
    equal to federal AGI. The engine then subtracts the shipped per-status standard deduction (Line 18 for a standard-deduction
    filer) to reproduce Line 19 DC taxable income, and applies the rate schedule to reproduce Line 20.'
  - 'SINGLE RATE SCHEDULE FOR ALL FILING STATUSES: DC publishes one ''Income Tax Rate Table'' (booklet p.3, repeated
    as ''Calculation I/Tax Rate Schedule'' p.17) that applies to Line 19 DC taxable income regardless of filing status;
    it is duplicated per status here. Married filing separately is NOT half of married filing jointly — every status
    uses the identical schedule.'
  - 'PRINTED CONSTANTS VERIFIED EXACT (re-derived for 2024): $400 = 4% x $10,000; $2,200 = $400 + 6% x $30,000; $3,500
    = $2,200 + 6.5% x $20,000; $19,650 = $3,500 + 8.5% x $190,000; $42,775 = $19,650 + 9.25% x $250,000; $91,525 =
    $42,775 + 9.75% x $500,000 — each printed ''$X plus Y% of the excess over $Z'' constant equals the cumulative
    sum of the prior brackets with no rounding divergence.'
  - 'NO PERSONAL OR DEPENDENT EXEMPTIONS: the 2024 Form D-40 computes DC taxable income as Line 16 minus Line 18 only
    — there is no exemption line on the form, so this pack ships no exemption keys; test vectors use exemptions_count
    0 and dependents_count 0.'
  - 'TAX TABLE MANDATE below $100,000: Form D-40 Line 20 and the p.18 instructions direct filers with Line 19 taxable
    income of $100,000 or less to ''use the tax tables on pages 85-94''; only above $100,000 is Calculation I (exact
    bracket math) used. The 2024 tables are built on $50 income bands, so bracket math may differ from the printed
    table by a dollar or two within a band (observed: $61,100-$61,149 prints $3,595 vs $3,596 at the band midpoint)
    — the filed form must use the table when Line 19 is $100,000 or less.'
  - 'DEDUCTION TYPE MUST MATCH FEDERAL: Line 17 — you must take the same type of deduction on your DC return as you
    took on your federal return. The shipped standard_deduction applies only to standard-deduction filers. Itemizers
    enter DC itemized deductions on Line 18 via Calculation F (full-year/statutory residents) or Calculation D (part-year):
    DC does NOT allow a deduction for state and local income taxes (state/local real estate taxes remain deductible),
    and if DC AGI exceeds $200,000 ($100,000 for a separate return filed by a married individual) the itemized deduction
    (other than medical/dental, investment interest, and casualty/theft losses) is reduced by 5% of DC AGI over the
    threshold.'
  - 'ADDITIONAL STANDARD DEDUCTION for age/blindness NOT modeled: if born before January 2, 1960, or blind, an additional
    standard deduction of $1,550 per checkbox applies ($1,950 if single or head of household) via Schedule S, Calculation
    G-1 (New for 2024, booklet p.3 — up from $1,500/$1,850 for 2023). When married filing separately, the spouse boxes
    may be claimed only if the spouse had no gross income, is not filing, and cannot be claimed as a dependent. Claim
    it on the form — this pack ships only the base per-status amounts.'
  - 'DEPENDENT FILERS: a filer who can be claimed as a dependent must use the Standard Deduction Worksheet for Dependent
    Filers (booklet p.20; ''An updated worksheet is available for use by dependent filers'' per New for 2024) — an
    income-dependent amount (earned income + $450 when earned income exceeds $850, floor consistent with the federal
    $1,300, capped at the regular status amount) NOT modeled by the shipped fixed standard_deduction.'
  - 'MARRIED/REGISTERED DOMESTIC PARTNERS FILING SEPARATELY ON THE SAME RETURN not modeled: this combined-return status
    takes a combined $29,200 standard deduction and computes each person''s tax separately using Calculation J on
    Schedule S (each spouse''s separate federal AGI, additions, subtractions and deductions), then combines Lines
    21-35 — per-couple math the engine does not reproduce. The engine''s married_filing_separately models a separate-return
    MFS filer with the $14,600 standard deduction.'
  - 'REGISTERED DOMESTIC PARTNERS: DC allows registered domestic partners to file jointly (use married_filing_jointly,
    $29,200) or separately on the same return — statuses that do not exist federally.'
  - 'QUALIFYING SURVIVING SPOUSE: DC''s ''qualifying widow(er) with dependent child'' status takes the same $29,200
    standard deduction as married filing jointly (booklet pp.3 and 10) and the same universal rate schedule, so the
    engine''s QSS -> married_filing_jointly mapping reproduces the correct tax.'
  - 'PART-YEAR RESIDENTS: must prorate the standard deduction (and credits) by days domiciled in DC divided by 365
    (366 if leap year — 2024 is a leap year; booklet pp.15-16, e.g. 71 days / 365 = 0.1945 worked example) and subtract
    income received during the period of nonresidence — the shipped full-year standard_deduction amounts do not apply
    as-is to part-year filers.'
  - 'DC HEALTH CARE SHARED RESPONSIBILITY not modeled: Line 25 adds an individual-mandate payment (Schedule HSR, Part
    IV, Line 17) to Line 24, producing Line 26 ''Total tax and DC Health Care Shared Responsibility.'' The engine
    computes only Line 20 tax.'
  - 'CREDITS not modeled (they are credits against tax, not base reductions): Line 21 credit for child and dependent
