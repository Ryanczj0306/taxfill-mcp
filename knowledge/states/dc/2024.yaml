# DC state knowledge — tax year 2024. Fetched + cited from the DC OTR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 D-40 booklet
# (2024_D40_Booklet_062325.pdf), then independently re-derived from a second official
# source (the live otr.cfo.dc.gov 'DC Individual and Fiduciary Income Tax Rates' page,
# or a second in-booklet print) — resolutions recorded inline where the passes differed.
# HEADLINE FOR 2024: rates UNCHANGED (the same seven-bracket table in effect for taxable
# years beginning January 1, 2022); the standard deduction ROSE with federal law to
# $14,600 single/MFS, $21,900 HOH, $29,200 MFJ/QW. New for 2024 is otherwise credit-side
# only: childless DC EITC max $632 (income test $30,019, investment income $11,600);
# Schedule H max $1,375 (AGI limits $63,900/$87,100); Schedule ELC max $1,160 per child;
# new Schedule U Line 6 housing provider credit; QHTC 3% capital-gain rate repealed.
jurisdiction: states/dc
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'DC''s Form D-40 begins from federal adjusted gross income (D-40 Line 4 and Schedule I Calculation
  A are titled around ''Federal Adjusted Gross Income''), and DC''s only mechanism for adding income back is Schedule
  I, Calculation A ''Additions to federal adjusted gross income.'' The verified addition categories on the 2024
  Schedule I (Cal. A, Revised 09/2024) are: (1) part-year resident adjustment, (2) income distributions eligible
  for federal income averaging (Form 4972), (3) 100% federal bonus depreciation / extra IRC sec.179, (4) discrimination
  award subject to income averaging, (5) S-corp deductions from Sch K-1 (1120-S), (6) pass-through losses from DC
  unincorporated businesses exceeding the $12,000 threshold, (7) ''Other ... items not subject to federal tax but
  subject to DC tax,'' and (8) capital gains deferred on the federal return due to investment in a Qualified Opportunity
  Fund. There is NO line that adds back income that is exempt from federal tax under a U.S. income tax treaty (contrast
  California''s explicit Schedule CA treaty addback). Because treaty-exempt income is already excluded from federal
  AGI and DC has no treaty addback, it flows through and is NOT re-taxed by DC. Therefore DC conforms (treaty-exempt
  income remains exempt). Source: 2024 D-40 Instruction Booklet, Schedule I Calculation A and line-by-line instructions.'
citation:
  source: 'DC OTR — 2024 D-40 Individual Income Tax Forms and Instructions (Booklet PDF, 2024_D40_Booklet_062325.pdf):
    New for 2024 Income Tax Returns (filing deadline April 15, 2025; standard deduction increases to $14,600/$21,900/$29,200;
    childless EITC max $632; Schedule H max $1,375; Schedule ELC max $1,160), Who must file, When are your taxes
    due (April 15, 2025), By mail addresses (PO Box 96145 refund/no-money-due; PO Box 96169 with payment), check
    payable to DC Treasurer, Reminders Income Tax Rate Table + Calculation I/Tax Rate Schedule, Schedule I Calculation
    A additions (no treaty addback) and Calculation B subtractions, D-40 starts from federal adjusted gross income'
  url: https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2024_D40_Booklet_062325.pdf
starts_from: federal AGI (Form D-40 income computation starts from 'Federal adjusted gross income'; Schedule I then
  applies Calculation A additions and Calculation B subtractions to arrive at DC adjusted gross income)
residency:
  summary: 'Per the 2024 D-40 booklet ''Who must file a DC Income tax return?'' (p.5): you must file a DC Individual
    Income Tax Return (Form D-40) if you were a DC resident in 2024 and were required to file a federal return —
    and ''a resident is an individual domiciled in DC at any time during the taxable year.'' You are also a (statutory)
    resident, and must file, if you maintained a place of abode in DC for a total of 183 days or more during 2024,
    even if your permanent home was outside DC. Part-year residents (DC resident for only part of the year) file
    Form D-40 and must prorate the standard deduction and applicable credits by days domiciled in DC divided by
    365 (366 if leap year — 2024 is one). True nonresidents are not subject to DC income tax on a regular return;
    DC has no general nonresident income tax return — a nonresident whose employer erroneously withheld DC tax files
    Form D-40B (Nonresident Request for Refund) with W-2s/1099s attached (military spouses include DD Form 2058).
    Exempt: elected members of the US government not domiciled in DC, personal staff of an elected member of Congress
    who are bona fide residents of the same state as the member, Senate-confirmed Presidential appointees, and US
    Supreme Court justices not domiciled in DC.'
forms:
  resident: Form D-40, Individual Income Tax Return (DC resident return; also used by part-year residents)
  part_year_or_nonresident: Part-year residents file Form D-40 (prorating deductions/credits). DC has no general
    nonresident income tax return; a nonresident with DC tax erroneously withheld files Form D-40B, Nonresident
    Request for Refund.
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: DC Earned Income Tax Credit (DC EITC) — filers WITH a qualifying child
  type: refundable
  eligibility: DC residents who qualify for the federal Earned Income Credit and have a qualifying child — or who
    would qualify but for lacking an SSN (ITIN filers compute the federal EIC amount ignoring the SSN requirement).
    Each qualifying child must have an SSN or ITIN. Cannot be claimed by a filer whose status is 'Dependent claimed
    by someone else.'
  amount: '70% of your federal Earned Income Credit (D-40 Line 27d: ''Multiply the calculated federal EIC amount
    x .70''). For taxable years starting January 1, 2024: if the DC EITC allowed is at least $1,200 you may CHOOSE
    (by filling the Line 27 oval) to receive it in 12 equal monthly payments instead of one payment — no longer
    automatic as it was for TY2023.'
  income_limit_2024: Same earned-income / AGI phase-out limits as the federal EIC (tied to number of qualifying
    children and filing status; DC does not impose a separate cap for filers with a qualifying child).
  claimed_on: Form D-40, Lines 27a-27d (Line 27c x .70 = Line 27d) for filers with a qualifying child
  citation:
    source: 'DC OTR — 2024 D-40 booklet: DC Earned Income Tax Credit section p.10 (''The DC EITC is equal to 70%
      of federal EIC''; monthly-payment election for credits of $1,200+), D-40 Line 27d (''x .70'' printed on the
      form), and the cover letter (''For the 2024 tax year, this credit continues to be 70%'')'
    url: https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2024_D40_Booklet_062325.pdf
- name: DC Earned Income Tax Credit (DC EITC) — filers WITHOUT a qualifying child
  type: refundable
  eligibility: DC residents age 25 up to (not) 65 at the end of 2024 without a qualifying child (ITIN filers eligible);
    uses the DC 'EITC Worksheet For Filers Without a Qualifying Child' (booklet pp.21-22). Not eligible if filing
    federal Form 2555, Form 4797, or Schedule E, if claimable as a dependent, or if a qualifying child of another.
  amount: Computed on the worksheet — if earned income is less than $8,261, tentative credit = earned income x 0.0765;
    otherwise $632 ('$632 is the maximum amount that can be claimed', up from $600 for TY2023), then phased by the
    worksheet.
  income_limit_2024: Earned income / federal AGI must not be greater than $30,019 for TY2024 (DC's own childless-EITC
    limit, higher than the federal childless ceiling); investment income must be $11,600 or less (up from $11,000).
  claimed_on: Form D-40, Line 27e (amount from the DC EITC childless worksheet)
  citation:
    source: 'DC OTR — 2024 D-40 booklet: ''New for 2024'' (childless EITC max increased from $600 to $632; investment-income
      test increased from $11,000 to $11,600) and the DC EITC Worksheet For Filers Without a Qualifying Child, Section
      C (''If your earned income or federal adjusted gross income (fed AGI) is greater than $30,019, STOP'')'
    url: https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2024_D40_Booklet_062325.pdf
- name: Schedule H — Homeowner and Renter Property Tax Credit ('circuit-breaker')
  type: refundable
  eligibility: DC residents who owned or rented their DC home and were not claimed as a dependent (with an age-70
    exception path). Renters' property tax is deemed = 20% of rent paid; homeowners use actual DC real property
    tax. One claim per tax filing unit; cannot claim for an exempt property owned by a government, house of worship,
    or nonprofit. Can be filed standalone (electronically via MyTax.DC.gov or by mail) if not required to file a
    D-40.
  amount: Maximum credit $1,375 for TY2024 (increased from $1,325). Computed via the Schedule H worksheets.
  income_limit_2024: Federal AGI of the tax filing unit must not exceed $63,900 (under age 70) or $87,100 (age 70
    or older) for TY2024.
  claimed_on: Schedule H, carried to Form D-40, Line 28 (or filed standalone)
  citation:
    source: DC OTR — 2024 D-40 booklet 'New for 2024' (maximum property tax credit limit increased from $1,325 to
      $1,375; federal AGI eligibility thresholds $63,900 under age 70 / $87,100 age 70 or older) and 'Instructions
      for Schedule H'
    url: https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2024_D40_Booklet_062325.pdf
- name: Keep Child Care Affordable Tax Credit (Schedule ELC; formerly Early Learning Tax Credit)
  type: refundable
  eligibility: DC taxpayer who paid eligible child-care expenses to a licensed 'child development facility' for
    an eligible child — a dependent under age 4 as of 9/30/2024 — and whose DC taxable income does not exceed the
    limit. Child must not be a recipient of the District's subsidized child-care program; expenses reimbursed by
    a state social service agency do not count.
  amount: Maximum credit $1,160 per eligible child for TY2024 (increased); equals the eligible child-care expenses
    paid up to the per-child cap.
  income_limit_2024: 'DC taxable income must not exceed (TY2024): $74,300 for Single and Head of Household; $174,300
    for Married/Registered Domestic Partners filing jointly and Married/RDP filing separately on the same return;
    $87,100 for Married/RDP filing separately.'
  claimed_on: Schedule ELC, totaled to Schedule U Part 1B Line 2, then Form D-40, Line 29
  citation:
    source: DC OTR — 2024 D-40 booklet, 'New for 2024' (maximum credit increased to $1,160 per eligible child) and
      Schedule ELC instructions (eligible child under age 4 as of 9/30/24; District taxable income limits $74,300
      single/HOH, $174,300 MFJ and MFS-same-return, $87,100 MFS)
    url: https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2024_D40_Booklet_062325.pdf
- name: Credit for Child and Dependent Care Expenses
  type: nonrefundable
  eligibility: DC full-year or statutory residents who claimed (or were eligible for) the federal child and dependent
    care credit on federal Form 2441 for the care of a qualifying dependent so the taxpayer could work or look for
    work. Part-year residents use DC Form D-2441 instead.
  amount: 32% of the federal child and dependent care credit ('multiply the amount from federal Form 2441, Line
    9c by .32'). If eligible but not claimed federally, complete federal Form 2441 anyway and multiply the result
    by .32.
  income_limit_2024: No separate DC income limit; the underlying federal Form 2441 credit limits apply.
  claimed_on: Form D-40, Line 21
  citation:
    source: DC OTR — 2024 D-40 booklet, Line 21 instructions ('multiply the amount from federal Form 2441, Line
      9c by .32 ... Do not use the DC Form D-2441' for full-year residents)
    url: https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2024_D40_Booklet_062325.pdf
filing_requirement:
  note: 'Per the 2024 D-40 booklet ''Who must file a DC Income tax return?'' (p.5): you must file Form D-40 if (a)
    you were a DC resident in 2024 and were required to file a federal income tax return (a resident is an individual
    domiciled in DC at any time during the taxable year); or (b) you maintained a place of abode in DC for a total
    of 183 days or more during 2024 even if your permanent home was outside DC; or (c) you were a part-year DC resident
    in 2024; or (d) you were a member of the US armed forces and DC was your legal residence for tax purposes for
    all or part of 2024 — or if you want a refund of DC withholding/estimated payments or to claim the refundable
    DC EITC, Schedule N, Schedule H, or Schedule ELC credits. The DC filing requirement for residents is keyed to
    the federal filing requirement rather than a separate DC dollar threshold. You do NOT need to file if you were
    not required to file a 2024 federal return and were not considered a DC resident during 2024 (certain elected
    members of Congress, their bona-fide-same-state staff, Senate-confirmed Presidential appointees, and US Supreme
    Court justices not domiciled in DC are also exempt).'
