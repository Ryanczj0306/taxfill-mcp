- description: >-
    OBBBA NON-CONFORMITY — DC DECOUPLED FROM FEDERAL LAW: "In July 2025, the U.S. Congress passed
    the One Big Beautiful Bill Act (OBBBA)... In November 2025, the D.C. Council passed a new law
    limiting the number of OBBBA tax changes that will affect District taxpayers." DC will NOT
    recognize the higher federal basic standard deduction, the tips / overtime / car-loan-interest
    deductions, the enhanced senior deduction, or the QSBS capital-gain exclusion. For 2025 the
    booklet ENUMERATES the open-ended Schedule I, Calculation A, Line 7 "Other" additions:
    interest on obligations of other states and their political subdivisions (NEW for 2025),
    capital gains on qualified small business stock, and the federal Schedule 1-A deductions DC
    disallows (tips, overtime, car-loan interest, enhanced senior deduction). DC AGI therefore
    diverges from federal AGI for far more filers than in 2024.
