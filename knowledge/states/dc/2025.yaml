  base: federal_agi
  tax_line: 'Form D-40 Line 20: ''Tax'' — instructions: ''If Line 19 is $100,000 or less, use the tax tables on pages
    93-102 to determine your tax. If Line 19 is more than $100,000, use Calculation I on page 20.'' Line 19 DC taxable
    income = Line 16 (DC adjusted gross income) minus Line 18 (DC deduction amount): ''Subtract Line 18 from Line
    16. Enter the result; if a loss, fill in the oval.'''
  exemptions: {}
  standard_deduction:
    single: 15000
    married_filing_jointly: 30000
    married_filing_separately: 15000
    head_of_household: 22500
  notes:
  - '2025 RATES UNCHANGED, verified THREE ways: the rate table is still the one ''For taxable years beginning January
    1, 2022'' — the booklet''s Reminders print, the booklet''s Calculation I/Tax Rate Schedule print (p. 20), and
    the live OTR ''DC Individual and Fiduciary Income Tax Rates'' page (''The tax rates for tax years beginning after
    12/31/2021 are'') all read the same seven brackets and the same printed constants. DC has not changed individual
    income tax rates since TY2022.'
  - '2025 CHANGE — DC DECOUPLED ITS STANDARD DEDUCTION FROM FEDERAL LAW: ''Starting with tax year 2025, the District
    has established its own standard deduction amounts which are different from the federal standard deduction amounts''
    — $15,000 (single, dependent filers, married/RDP filing separately), $22,500 (head of household), $30,000 (married/RDP
    filing jointly, qualifying widow(er) with dependent children, and married/RDP filing separately on the same return),
    up from $14,600/$21,900/$29,200. This is NOT the 2024 pack''s ''increasing based on the federal law'' mechanism:
    the D.C. Council''s November 2025 law explicitly refuses the OBBBA ''Higher federal basic standard deduction'',
    so the 2025 DC amounts deliberately do NOT match the OBBBA federal figures.'
  - 'Base guidance: Supply 2025 Form D-40 Line 16, ''DC adjusted gross income, Line 7 minus Line 15.'' Line 7 = Line
    4 federal adjusted gross income (from the federal 1040/1040-SR/1040-NR) plus DC additions (Line 5 franchise tax
    deducted; Line 6 other additions from DC Schedule I, Calculation A, Line 9); Lines 8-14 are DC subtractions (taxable
    state/local refunds, taxable Social Security and tier 1 railroad retirement, income taxed on a DC franchise/fiduciary
    return, DC/federal government survivor benefits, unemployment insurance benefits, other Schedule I Calculation
    B subtractions). A filer with no DC additions or subtractions has DC AGI equal to federal AGI. The engine then
    subtracts the shipped per-status standard deduction (Line 18 for a standard-deduction filer) to reproduce Line
    19 DC taxable income, and applies the rate schedule to reproduce Line 20. NEW FOR 2025: out-of-state municipal
    bond interest is a Schedule I Calculation A Line 7 addition, and the federal Schedule 1-A tips/overtime/car-loan-interest/enhanced-senior
    deductions must be added back — so DC AGI now diverges from federal AGI for more filers than in 2024.'
  - 'SINGLE RATE SCHEDULE FOR ALL FILING STATUSES: DC publishes one ''Income Tax Rate Table'' (repeated as ''Calculation
    I/Tax Rate Schedule'') that applies to Line 19 DC taxable income regardless of filing status; it is duplicated
    per status here. Married filing separately is NOT half of married filing jointly — every status uses the identical
    schedule. Only the standard deduction differs by status.'
  - 'PRINTED CONSTANTS VERIFIED EXACT (re-derived for 2025): $400 = 4% x $10,000; $2,200 = $400 + 6% x $30,000; $3,500
    = $2,200 + 6.5% x $20,000; $19,650 = $3,500 + 8.5% x $190,000; $42,775 = $19,650 + 9.25% x $250,000; $91,525 =
    $42,775 + 9.75% x $500,000 — each printed ''$X, plus Y% of the excess over $Z'' constant equals the cumulative
    sum of the prior brackets with no rounding divergence.'
  - 'NO PERSONAL OR DEPENDENT EXEMPTIONS: the 2025 Form D-40 computes DC taxable income as Line 16 minus Line 18 only
    — there is no exemption line on the form, so this pack ships no exemption keys; test vectors use exemptions_count
    0 and dependents_count 0.'
  - 'TAX TABLE MANDATE below $100,000: Form D-40 Line 20 and its instructions direct filers with Line 19 taxable income
    of $100,000 or less to ''use the tax tables on pages 93-102''; only above $100,000 is Calculation I (exact bracket
    math) used. The 2025 tables are built on $50 income bands, so bracket math can differ from the printed table by
    a dollar or two within a band (observed: the $25,000-$25,049 band prints $1,302 vs $1,300 of bracket math at exactly
    $25,000, and $61,100-$61,149 prints $3,595 vs $3,593.50) — the filed form must use the table when Line 19 is $100,000
    or less.'
  - 'DEDUCTION TYPE MUST MATCH FEDERAL: Line 17 — ''Take the same type as you took on your federal return.'' The shipped
    standard_deduction applies only to standard-deduction filers. DC Code sec.47-1803.04(b) is quoted in the booklet:
    electing the federal standard deduction forces the DC standard deduction and bars DC itemized deductions, and
    vice versa; if one spouse''s/registered domestic partner''s net income is determined by itemizing on a separate
    return, NEITHER may take the standard deduction. Itemizers enter DC itemized deductions on Line 18 via Calculation
    F: DC does NOT allow a deduction for state and local income taxes, and if DC AGI exceeds $200,000 ($100,000 if
    married filing separately) the itemized deduction (other than medical/dental, investment-interest, and casualty/theft
    losses) is reduced by 5% of DC AGI over the threshold.'
  - 'ADDITIONAL STANDARD DEDUCTION for age/blindness NOT modeled: if you or your spouse/registered domestic partner
    were born before January 2, 1961, or are blind, an additional standard deduction of $1,600 per checkbox applies
    ($2,000 if single, head of household, or a dependent claimed by someone else and not married) — up from $1,550/$1,850
    for 2024 — computed on Schedule S, Calculation G-1, which must be completed and submitted with the return. When
    married filing separately, the spouse boxes may be claimed only if the spouse had no gross income, is not filing,
    and cannot be claimed as a dependent by another taxpayer.'
  - 'DEPENDENT FILERS — 2025 SIMPLIFICATION: the income-dependent ''Standard Deduction Worksheet for Dependent Filers''
    that the 2024 booklet used is GONE. For 2025 a dependent filer simply takes the $15,000 basic standard deduction
    (''$15,000 for single filers, dependent filers and married/registered domestic partner filers filing separately'';
    the Filing Requirements Chart likewise lists ''Dependent filer $15,000''), and Calculation G-1 adds only the age/blind
    amounts. So the shipped single/MFS amount is correct for a dependent filer too.'
  - 'MARRIED/REGISTERED DOMESTIC PARTNERS FILING SEPARATELY ON THE SAME RETURN not modeled: this combined-return status
    takes a combined $30,000 standard deduction and computes each person''s tax separately using Calculation J on
    Schedule S (each spouse''s separate federal AGI, additions, subtractions and deductions), then combines the result
    — per-couple math the engine does not reproduce. The engine''s married_filing_separately models a separate-return
    MFS filer with the $15,000 standard deduction.'
  - 'REGISTERED DOMESTIC PARTNERS: DC allows registered domestic partners to file jointly (use married_filing_jointly,
    $30,000) or separately on the same return — statuses that do not exist federally.'
  - 'QUALIFYING SURVIVING SPOUSE: DC''s ''qualifying widow(er) with dependent child'' status takes the same $30,000
    standard deduction as married filing jointly and the same universal rate schedule, so the engine''s QSS -> married_filing_jointly
    mapping reproduces the correct tax.'
  - 'PART-YEAR RESIDENTS: must prorate the standard deduction (and credits) by days domiciled in DC divided by 365
    — 2025 is NOT a leap year, so the divisor is 365 (booklet worked example: 71 days of residency / 365) — and subtract
    income received during the period of nonresidence. The shipped full-year standard_deduction amounts do not apply
    as-is to part-year filers.'
  - 'DC HEALTH CARE SHARED RESPONSIBILITY not modeled: Line 25 adds an individual-mandate payment (Schedule HSR, Part
    IV, Line 17) to Line 24, producing Line 26 ''Total tax and DC Health Care Shared Responsibility.'' The engine
    computes only Line 20 tax. (The Worksheet C-1 District Average Bronze Plan Premium amounts were updated for 2025.)'
  - 'CREDITS not modeled (they are credits against tax, not base reductions), and two changed materially for 2025:
    Line 21 credit for child and dependent care expenses (federal Form 2441 Line 9c x .32), Line 22 non-refundable
    credits from DC Schedule U (including the Calculation K out-of-state income tax credit), Line 27 DC EITC — NOW
    100% of the federal EIC, up from 70%, with the childless-filer worksheet maximum raised to $649 (DC ceiling $30,941,
    investment-income limit $11,950) — Line 28 Schedule H homeowner/renter property tax credit (maximum raised to
    $1,425, AGI limits $66,000/$90,000), and Line 29 refundable Schedule U credits (including Schedule ELC, maximum
    raised to $1,200 per child). The DC Child Tax Credit is REPEALED for 2025.'
  - 'ROUNDING: the D-40 and Schedule I instruct dollars-only entries (''Dollars only, do not enter cents''); the engine''s
    round-half-up to whole dollars matches for the Calculation I computation.'
# DEV_PLAN §7.2 effective_law_changes — promoted 2026-08-11 from THIS pack's own prose (the
# header's "2025 CHANGES vs the 2024 pack" list, the Standard Deduction / filing_requirement
# notes and tax.notes); transcription only, no new research and no new sources. modeled: true
# ONLY for the standard-deduction decoupling (tax.standard_deduction already ships
# $15,000/$22,500/$30,000); the OBBBA add-backs and the credit changes are modeled: false
# because calc.state_tax computes neither, so state_scope surfaces them as warnings. Three
# further 2025 deltas the pack's prose records fell outside the 3-entry cap: DC's own D-40
# filing threshold, the Schedule H maximum/limit increases, and the Schedule ELC increase.
effective_law_changes:
- description: >-
    DC DECOUPLED ITS STANDARD DEDUCTION FROM FEDERAL LAW: "Starting with tax year 2025, the
    District has established its own standard deduction amounts which are different from the
    federal standard deduction amounts" — $15,000 (single, dependent filers, married/registered
    domestic partner filing separately), $22,500 (head of household), $30,000 (married/RDP filing
    jointly, qualifying widow(er) with dependent children, and married/RDP filing separately on the
    same return), up from 2024's $14,600/$21,900/$29,200. These are DC's OWN statutory amounts, not
    the 2024 pack's "increasing based on the federal law" mechanism: the D.C. Council's November
    2025 law explicitly refuses the OBBBA "Higher federal basic standard deduction", so the 2025 DC
    amounts deliberately do NOT match the OBBBA federal figures. The additional age/blind standard
    deduction rose to $1,600 per checkbox ($2,000 if single, head of household or a dependent filer,
    up from $1,550/$1,950), and the income-dependent "Standard Deduction Worksheet for Dependent
    Filers" is GONE — a 2025 dependent filer simply takes the $15,000 basic amount.
