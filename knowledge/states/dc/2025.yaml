# DC state knowledge — tax year 2025. Fetched + cited from the DC OTR (.gov),
# authored per the shipped 2024 template (state-year knowledge program). Loaded as
# a StateKnowledge. conforms_to_federal_treaties: whether federally treaty-exempt
# income flows through (most states start from federal AGI) or is added back
# (CA/CT/MD/MS-style). Figures the fetch could not independently confirm are in
# `unverified` — confirm at the cited source.
#
# Two-pass verification: every key figure below was drafted from the 2025 D-40
# booklet (2025_D40_Book_Final_wLinks_030526_v1.0.pdf, 5,548 extracted lines),
# then independently re-derived from a second official source — the live
# otr.cfo.dc.gov "DC Individual and Fiduciary Income Tax Rates" page for the rate
# schedule, and a second in-booklet print for every other figure.
#
# THE 2025 RATE ANSWER: rates are UNCHANGED and still the seven-bracket table "for
# taxable years beginning January 1, 2022" — verified THREE ways for 2025: the
# booklet's Reminders "Income Tax Rate Table" print, the booklet's "Calculation
# I/Tax Rate Schedule" print, and the live OTR rates page ("The tax rates for tax
# years beginning after 12/31/2021 are"). All three read 4% / $400+6% /
# $2,200+6.5% / $3,500+8.5% / $19,650+9.25% / $42,775+9.75% / $91,525+10.75%.
# (The Reminders print still carries the same ".8.5%" typo it carried in 2024; the
# Calculation I print and the live page both read 8.5%, and the printed constants
# prove it.)
#
# 2025 CHANGES vs the 2024 pack — DC decoupled from federal law, a structural
# change the 2024 pack's "increasing based on the federal law" wording no longer
# describes:
#   - OBBBA NON-CONFORMITY: "In July 2025, the U.S. Congress passed the One Big
#     Beautiful Bill Act (OBBBA)... In November 2025, the D.C. Council passed a new
#     law limiting the number of OBBBA tax changes that will affect District
#     taxpayers." DC will NOT recognize the higher federal basic standard
#     deduction, the tips/overtime/car-loan-interest deductions, the enhanced
#     senior deduction, or the QSBS capital-gain exclusion.
#   - OWN STANDARD DEDUCTION: "Starting with tax year 2025, the District has
#     established its own standard deduction amounts which are different from the
#     federal standard deduction amounts" — $15,000 single/MFS/dependent filer,
#     $22,500 head of household, $30,000 MFJ/QSS/MFS-on-the-same-return (up from
#     $14,600/$21,900/$29,200). These are DC's OWN statutory amounts now, NOT a
#     federal follow-on. Additional age/blind standard deduction $1,600 ($2,000 if
#     single, HoH or dependent) — up from $1,550/$1,950.
#   - OWN FILING THRESHOLD: DC established a "2025 DC Individual Income Tax Filing
#     Requirements Chart" — file a D-40 if gross income was at least the basic
#     standard deduction for your status, EVEN IF no federal return is required.
#     The 2024 pack's "keyed to the federal filing requirement" statement is no
#     longer true.
#   - DC EITC IS NOW 100% of the federal EIC (was 70%); childless maximum $632 ->
#     $649 (earned-income floor $8,484, DC ceiling $30,941, phase-out start
#     $23,288); investment-income limit $11,600 -> $11,950.
#   - DC CHILD TAX CREDIT REPEALED for 2025.
#   - Out-of-state municipal bond interest is now a DC addition (Schedule I,
#     Calculation A, Line 7).
#   - Schedule H maximum $1,375 -> $1,425; AGI limits $63,900/$87,100 ->
#     $66,000/$90,000. Schedule ELC maximum $1,160 -> $1,200 per child with new
#     DC-taxable-income limits $80,100 / $180,100 / $90,000.
#   - The dependent-filer income-dependent standard deduction WORKSHEET is gone:
#     dependent filers now simply take $15,000 (Calculation G-1 adds only the
#     age/blind amounts). This closes the 2024 pack's garbled-worksheet caveat.
#   - Form D-40B (Nonresident Request for Refund) can now be filed electronically
#     through MyTax.DC.gov.
jurisdiction: states/dc
tax_year: 2025
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'DC''s Form D-40 begins from federal adjusted gross income (D-40 Line 4; Schedule I is titled "Additions
  to and Subtractions from Federal Adjusted Gross Income"), and DC''s only mechanism for adding income back is Schedule
  I, Calculation A "Additions to federal adjusted gross income." The verified 2025 Schedule I Calculation A addition
  lines are: (1) part-year resident adjustment, (2) income distributions eligible for federal income averaging (Form
  4972), (3) federal additional/bonus depreciation and extra IRC sec.179, (4) any part of a discrimination award subject
  to income averaging, (5) S-corporation deductions from Schedule K-1 (Form 1120-S), (6) pass-through losses from
  DC unincorporated businesses exceeding the $12,000 threshold, (7) "Other. Attach a Calculation A, Line 7 Statement",
  and (8) capital gains deferred on the federal return due to investment in a Qualified Opportunity Fund. For 2025
  the booklet ENUMERATES what belongs on the open-ended Line 7 "Other": interest on obligations of other states and
  their political subdivisions (new for 2025), capital gains on qualified small business stock, and the federal Schedule
  1-A deductions DC disallows (tips, overtime, car-loan interest, enhanced senior deduction). None of these is treaty
  income, and the word "treaty" appears ZERO times in the entire 2025 D-40 booklet (re-counted this session over all
  5,548 extracted lines). There is NO line that adds back income exempt from federal tax under a U.S. income tax treaty
  (contrast California''s explicit Schedule CA treaty add-back). Because treaty-exempt income is already excluded from
  federal AGI and DC has no treaty add-back, it flows through and is NOT re-taxed by DC. Therefore DC conforms (treaty-exempt
  income remains exempt).'
citation:
  source: 'DC OTR — 2025 D-40 Individual Income Tax Forms and Instructions (Booklet PDF, 2025_D40_Book_Final_wLinks_030526_v1.0.pdf):
    Federal Tax Changes and the District (OBBBA non-conformity), Tax Year 2025 Changes, New for 2025 Income Tax Returns
    (filing deadline April 15, 2026; DC''s own basic standard deduction $15,000/$22,500/$30,000; DC EITC 100% of federal;
    childless EITC max $649; Schedule H max $1,425; Schedule ELC max $1,200), Who must file plus the 2025 DC Individual
    Income Tax Filing Requirements Chart (p. 7), When are your taxes due (April 15, 2026), mailing addresses (PO Box
    96145 refund/no money due; PO Box 96169 with payment), check payable to DC Treasurer, Reminders Income Tax Rate
    Table + Calculation I/Tax Rate Schedule (p. 20), Schedule I Calculation A additions (no treaty add-back) and Calculation
    B subtractions, D-40 Lines 4/16/17/18/19/20'
  url: 'https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2025_D40_Book_Final_wLinks_030526_v1.0.pdf'
starts_from: 'federal AGI (Form D-40 Line 4 is federal adjusted gross income from the federal 1040/1040-SR/1040-NR;
  Schedule I then applies Calculation A additions (D-40 Line 6) and Calculation B subtractions (D-40 Line 14) to arrive
  at DC adjusted gross income on Line 16)'
residency:
  summary: 'Per the 2025 D-40 booklet "Who must file a DC Income tax return?" (p. 7): you must file a DC Individual
    Income Tax Return (Form D-40) if you were a DC resident in 2025 and you meet the filing requirements in the 2025
    Filing Requirements Chart according to your filing status and age. You are also a (statutory) resident, and must
    file, if you maintained a place of abode in DC for a total of 183 days or more during 2025, even if your permanent
    home was outside DC. The live OTR rates page states the same test: tax applies to "an individual who is domiciled
    in the District at any time during the tax year (or who maintains an abode in the District for 183 or more days
    during the year)". Part-year residents (DC resident for only part of 2025) file Form D-40 and must prorate the
    standard deduction and applicable credits by days domiciled in DC divided by 365 (2025 is NOT a leap year, so
    the divisor is 365; the booklet''s worked example is 71 days / 365). True nonresidents are not subject to DC income
    tax on a regular return; DC has no general nonresident income tax return — a nonresident whose employer erroneously
    withheld DC tax files Form D-40B (Nonresident Request for Refund), which for tax year 2025 can be filed electronically
    through MyTax.DC.gov. Exempt: elected members of the US government not domiciled in DC, personal staff of an elected
    member of Congress who are bona fide residents of the same state as the member, Senate-confirmed Presidential
    appointees whose tenure is at the pleasure of the President and who were not domiciled in DC during any part of
    2025, and US Supreme Court justices not domiciled in DC. Note: the spouse/registered domestic partner of a person
    not required to file must still file if they themselves meet a requirement.'
forms:
  resident: 'Form D-40, Individual Income Tax Return (DC resident return; also used by part-year residents)'
  part_year_or_nonresident: 'Part-year residents file Form D-40 (prorating deductions/credits by days domiciled in
    DC / 365). DC has no general nonresident income tax return; a nonresident with DC tax erroneously withheld files
    Form D-40B, Nonresident Request for Refund — filable electronically through MyTax.DC.gov starting with tax year
    2025.'
credits_verification: 'State credits were researched from the cited DC OTR sources (the 2025 D-40 booklet, with each
  figure confirmed by a second in-booklet print — the "Tax Year 2025 Changes" / "New for 2025" lists AND the relevant
  line/schedule instructions) and are not tax advice — confirm each amount and your eligibility at the cited source
  before claiming it.'
credits:
- name: 'DC Earned Income Tax Credit (DC EITC) — filers WITH a qualifying child'
  type: refundable
  eligibility: 'DC residents who qualify for the federal Earned Income Credit and have a qualifying child — or who
    would qualify but for lacking an SSN (ITIN filers compute the federal EIC amount ignoring the SSN requirement).
    If married filing jointly, the taxpayer, spouse and qualifying child(ren) must each have an SSN or an IRS-issued
    ITIN; if the adults have SSNs/ITINs but the child(ren) do not, claim the DC EITC for filers WITHOUT a qualifying
    child instead. Cannot be claimed by a filer whose status is "Dependent claimed by someone else."'
  amount: '2025 CHANGE — 100% of your federal Earned Income Credit (up from 70% for 2024): "The DC EITC is equal to
    100% of federal EIC, or 100% of the federal EIC amount you would be eligible for if you met all other requirements
    for federal EIC but do not have an SSN." Enter the calculated federal EIC on D-40 Line 27c and the same amount
    on Line 27d. A filer may still elect (Line 27 oval) to receive the credit in 12 equal monthly payments; OTR calculates
    the distribution and sends a notice, and the initial payment will differ from the D-40 net refund amount.'
  income_limit_2025: 'Same earned-income / AGI phase-out limits as the federal EIC (tied to number of qualifying children
    and filing status; DC does not impose a separate cap for filers with a qualifying child). Investment income must
    be $11,950 or less for 2025 (up from $11,600).'
  claimed_on: 'Form D-40, Lines 27a-27d (Line 27d = the calculated federal EIC, now at 100%) for filers with a qualifying
    child'
  citation:
    source: 'DC OTR — 2025 D-40 booklet: "Tax Year 2025 Changes" ("The District EITC is now 100% of the federal EITC
      amount"), "New for 2025 Income Tax Returns" ("For tax year 2025 DC EITC is increased to 100% of the federal
      credit"; investment-income limit increased from $11,600 to $11,950), and the DC Earned Income Tax Credit section
      / Taxpayers with a Qualifying Child instructions'
    url: 'https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2025_D40_Book_Final_wLinks_030526_v1.0.pdf'
- name: 'DC Earned Income Tax Credit (DC EITC) — filers WITHOUT a qualifying child'
  type: refundable
  eligibility: 'DC residents without a qualifying child (ITIN filers eligible) using the DC "EITC Worksheet For Filers
    Without a Qualifying Child" (booklet Sections A-C). Not eligible if claimable as a dependent on someone else''s
    2025 return, if a qualifying child of another person for EIC purposes, if filing federal Form 2555, Form 4797
    or Schedule E, if reporting income from the rental of personal property not used in a trade or business, or if
    electing to report a child''s interest and dividends federally.'
  amount: 'Computed on the worksheet — if earned income is less than $8,484, tentative credit = earned income x 0.0765;
    otherwise $649 ("$649 is the maximum amount that can be claimed", up from $632 for TY2024). The tentative amount
    is then phased: if the higher of earned income or federal AGI is less than $23,288 the full tentative credit is
    allowed; between $23,288 and $30,941 the worksheet subtracts $23,288 and phases the credit down.'
  income_limit_2025: 'Earned income and federal AGI must not exceed $30,941 for TY2025 ("If your earned income or
    federal adjusted gross income (fed AGI) is greater than $30,941, STOP, you cannot claim this credit") — DC''s own
    childless-EITC ceiling, higher than the federal childless ceiling. Investment income must be $11,950 or less.'
  claimed_on: 'Form D-40, Line 27e (amount from the DC EITC worksheet for filers without a qualifying child)'
  citation:
    source: 'DC OTR — 2025 D-40 booklet: "New for 2025" (EITC Without Qualifying Children maximum increased from $632
      to $649; investment-income limit increased to $11,950) and the DC EITC Worksheet For Filers Without a Qualifying
      Child, Sections B-C ($8,484 / 0.0765 / $649 / $23,288 / $30,941)'
    url: 'https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2025_D40_Book_Final_wLinks_030526_v1.0.pdf'
- name: 'Schedule H — Homeowner and Renter Property Tax Credit (circuit-breaker)'
  type: refundable
  eligibility: 'DC residents who owned or rented their DC home and were not claimed as a dependent (with an age-70
    exception path). Renters'' property tax is deemed = 20% of rent paid; homeowners use actual DC real property tax.
    One claim per tax filing unit; cannot claim for an exempt property owned by a government, house of worship, or
    nonprofit. Can be filed standalone (electronically via MyTax.DC.gov or by mail) if not required to file a D-40.'
  amount: 'Maximum credit $1,425 for TY2025 ("The maximum property tax credit limit is increased from $1,375 to $1,425").
    Computed via the Schedule H worksheets.'
  income_limit_2025: 'Federal AGI of the tax filing unit must not exceed $66,000 (claimants under age 70) or $90,000
    (claimants age 70 or older) for TY2025 — up from $63,900 / $87,100.'
  claimed_on: 'Schedule H, carried to Form D-40, Line 28 (or filed standalone)'
  citation:
    source: 'DC OTR — 2025 D-40 booklet: "Tax Year 2025 Changes" (maximum credit increases to $1,425; income limits
      increase to $66,000 under 70 and $90,000 for 70 or older) and "New for 2025 — Schedule H, Homeowner and Renter
      Property Tax Credit" plus the Instructions for Schedule H'
    url: 'https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2025_D40_Book_Final_wLinks_030526_v1.0.pdf'
- name: 'Keep Child Care Affordable Tax Credit (Schedule ELC)'
  type: refundable
  eligibility: 'DC taxpayer who paid eligible child-care expenses to a licensed "child development facility" for an
    eligible child — a dependent under age 4 as of 9/30/2025 — and whose DC taxable income does not exceed the limit.
    The child must not be a recipient of the District''s subsidized child-care program; expenses reimbursed by a state
    social service agency and amounts for food, lodging, education or entertainment do not count.'
  amount: 'Maximum credit $1,200 per eligible child for TY2025 (increased from $1,160); equals the eligible child-care
    expenses paid up to the per-child cap.'
  income_limit_2025: 'DC taxable income must not exceed (TY2025): $80,100 for Single and Head of Household; $180,100
    for Married/Registered Domestic Partners filing jointly; $180,100 for Married/RDP filing separately on the same
    return; $90,000 for Married/RDP filing separately.'
  claimed_on: 'Schedule ELC, totaled to Schedule U Part 1B, then Form D-40, Line 29'
  citation:
    source: 'DC OTR — 2025 D-40 booklet: "New for 2025 — Schedule ELC, Keep Child Care Affordable Tax Credit" (District
      taxable income thresholds changed; maximum credit increased to $1,200 per eligible child) and the Schedule ELC
      line instructions (eligible child under age 4 as of 9/30/25; DC taxable income limits $80,100 single/HoH, $180,100
      MFJ and MFS-same-return, $90,000 MFS)'
    url: 'https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2025_D40_Book_Final_wLinks_030526_v1.0.pdf'
- name: 'Credit for Child and Dependent Care Expenses'
  type: nonrefundable
  eligibility: 'DC full-year or statutory residents who claimed (or were eligible for) the federal child and dependent
    care credit on federal Form 2441 for the care of a qualifying dependent so the taxpayer could work or look for
    work. Part-year residents use DC Form D-2441 instead. A filer who did not file a federal return because they were
    below the federal filing threshold still completes federal Form 2441 and multiplies the result by .32.'
  amount: '32% of the federal child and dependent care credit ("multiply the amount from federal Form 2441, Line 9c
    by .32"), printed on the 2025 D-40 as Line 21 "Credit for child and dependent care expenses ... X .32".'
  income_limit_2025: 'No separate DC income limit; the underlying federal Form 2441 credit limits apply.'
  claimed_on: 'Form D-40, Line 21'
  citation:
    source: 'DC OTR — 2025 D-40 booklet, Line 21 instructions ("multiply the amount from federal Form 2441, Line 9c
      by .32"), confirmed against the "X .32" printed on the 2025 Form D-40 Line 21 itself'
    url: 'https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2025_D40_Book_Final_wLinks_030526_v1.0.pdf'
filing_requirement:
  note: 'NEW FOR 2025 — DC HAS ITS OWN FILING THRESHOLD. "The District has established its own filing threshold requirements
    for the D-40 Individual Income Tax Return beginning with tax year 2025. This means DC taxpayers may be required
    to file a D-40 return even if they are not required to file a Form 1040 federal income tax return." The 2025 DC
    Individual Income Tax Filing Requirements Chart (booklet p. 7) requires a D-40 if gross income was at least: $15,000
    (Single); $30,000 (Married/registered domestic partner filing jointly or filing separately on the same return);
    $30,000 (qualifying widow(er) with dependent child); $22,500 (Head of household); $15,000 (Married filing separately);
    $15,000 (Dependent filer) — i.e. the basic standard deduction for the status. A filer not required to file federally
    "should prepare a mock-up of the applicable federal return (Form 1040, 1040-SR, 1040-NR or 1040-NR-EZ)" to derive
    the federal AGI. You must also file if you maintained a place of abode in DC for 183 days or more during 2025,
    were a part-year DC resident, were a member of the US armed forces with DC as your legal residence for all or
    part of 2025, or if you want a refund of DC withholding/estimated payments or to claim the refundable DC EITC,
    Schedule N (Non-Custodial Parent EITC), Schedule H, or Schedule ELC credits. Separately, OTR Tax Notice 2025-01
    requires an electronic copy of the federal return from individuals with gross income above a stated threshold
    (single, head of household, qualifying widow(er) with dependent child, or married filing separately) and from
    individuals with gross income exceeding $1,000,000 filing jointly or separately on a combined return. Not required
    to file: someone who does not meet the chart, was not a DC resident during 2025, or falls in the elected-official/Congressional-staff/Presidential-appointee/Supreme-Court-justice
    exemptions.'
  citation:
    source: 'DC OTR — 2025 D-40 booklet, "New for 2025 Income Tax Returns — Filing Threshold" and "Who must file a
      DC Income tax return?" with the 2025 DC Individual Income Tax Filing Requirements Chart, p. 7; "Tax Year 2025
      Changes — D-40 Filing Requirement"; OTR Tax Notice 2025-01 summary'
    url: 'https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2025_D40_Book_Final_wLinks_030526_v1.0.pdf'
