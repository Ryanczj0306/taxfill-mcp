unverified:
- 'Whether DC''s "Other" addition (Schedule I, Calculation A, Line 7) could in some interpretation capture a specific
  federal treaty exclusion. For 2025 the booklet ENUMERATES the Line 7 items (out-of-state municipal bond interest,
  qualified small business stock capital gains, and the disallowed federal Schedule 1-A tips/overtime/car-loan-interest/senior
  deductions) and none is treaty income; the word "treaty" appears zero times in the booklet. Conformity is therefore
  assessed as true, but the open-ended "Other" line was not exhaustively cross-checked against DC Code sec.47-1803.02(a)
  — confirm at OTR for an unusual treaty position.'
- 'The 2025 D-40B (Nonresident Request for Refund) form itself was not fetched; the booklet states it can now be filed
  electronically through MyTax.DC.gov but its paper mailing address was not re-verified this session (the 2023 form
  mailed to PO Box 96147, Washington, DC 20090-6147). Confirm on the 2025 D-40B before mailing.'
- 'The full OTR Tax Notice 2025-01 was not fetched; the booklet''s summary of the new federal-return-attachment requirement
  prints its gross-income threshold in a partially garbled glyph run for the single/HoH/QSS/MFS group (only the $1,000,000
  joint/combined figure extracted cleanly). Confirm the exact threshold in OTR Tax Notice 2025-01.'
- 'The 2025 Schedule H, Schedule ELC and Schedule U forms were read only as reproduced inside the booklet, not as
  standalone PDFs. The Schedule H worksheets and the Worksheet C-1 District Average Bronze Plan Premium amounts (updated
  for 2025) were not transcribed.'
- 'The DC tax tables (booklet pp. 93-102, mandatory when Line 19 is $100,000 or less) were spot-checked, not transcribed:
  the $25,000-$25,049 band prints $1,302 and the $61,100-$61,149 band prints $3,595, both a dollar or two above raw
  bracket math ($1,300 and $3,593.50). See the tax.notes table mandate.'
tax:
  citation:
    source: 'DC Office of Tax and Revenue — 2025 D-40 Individual Income Tax Forms and Instructions booklet (2025_D40_Book_Final_wLinks_030526_v1.0.pdf):
