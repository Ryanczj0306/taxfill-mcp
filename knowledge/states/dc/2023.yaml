effective_law_changes:
- description: >-
    DC EITC EXPANDED for TY2023: the credit was extended to certain ITIN filers (no SSN required); the
    maximum DC EITC for filers WITHOUT a qualifying child rose to $600 (up from $560) with DC's own
    childless income test raised to $28,963 (higher than the federal childless ceiling, so some filers
    over the federal limit still qualify) and an investment-income limit of $11,000. For filers WITH a
    qualifying child the credit stays at 70% of the federal EIC, but for TY2023 a DC EITC of $1,200 or
    more is paid in 12 equal monthly installments rather than a lump sum.
