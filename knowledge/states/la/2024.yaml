  if you have Louisiana additions/exempt income, Line 7 comes from Louisiana Schedule E, Line 5 instead)
residency:
  summary: 'Louisiana residency is domicile-based. A Louisiana resident is a person domiciled in Louisiana (or who
    maintains a Louisiana residence while working in another state); per the 2024 IT-540 instructions, "A temporary
    absence from Louisiana does not automatically change your domicile for income tax purposes" and you must affirmatively
    establish a new domicile elsewhere (e.g., registering to vote, titling vehicles, obtaining a driver''s license,
    homestead exemption) and abandon the Louisiana domicile to change it. Residents file IT-540 and report all income
    from all sources. Nonresidents and part-year residents file IT-540B and are taxed only on Louisiana-source income
    (the IT-540B computes a ratio of Louisiana AGI to Federal AGI and applies it). Part-year residents may elect
    to file either a resident (IT-540) or nonresident (IT-540B) return, whichever is more beneficial (see LDR Revenue
    Ruling 05-008). Nonresident professional athletes must electronically file Form IT-540B with Schedules NRPA-1
    and NRPA-2. Note: unlike some states (e.g., NY), Louisiana does not use a statutory-resident day-count test;
    residency turns on domicile.'
forms:
  resident: IT-540 (2024 Louisiana Resident Income Tax Return)
  part_year_or_nonresident: IT-540B (2024 Louisiana Nonresident and Part-Year Resident Income Tax Return)
credits_verification: State credits were researched from the cited DOR sources and are not tax advice — confirm
  each amount and your eligibility at the cited source before claiming it.
credits:
- name: Louisiana Earned Income Credit (LA EIC)
  type: refundable
  eligibility: Resident individuals who claimed a Federal Earned Income Credit (EIC) for 2024. Authorized by R.S.
    47:297.8. The Louisiana Earned Income Credit Worksheet must be attached to the return.
  amount: '5% of the Federal Earned Income Credit ("The refundable credit is equal to 5 percent of your Federal
    EIC", 2024 IT-540 instructions, Line 15).'
  income_limit_2024: No separate Louisiana income cap stated; eligibility tracks the federal EIC income limits (you
    must have claimed the Federal EIC).
  claimed_on: Form IT-540, Line 15 (from the 2024 Louisiana Earned Income Credit Worksheet)
  citation:
    source: Louisiana Department of Revenue – 2024 IT-540 instructions, Line 15 (LA EIC, 5 percent of the Federal
      EIC, R.S. 47:297.8)
    url: https://dam.ldr.la.gov/taxforms/IT540i%20WEB%202024%20INSTRUCTIONS.pdf
- name: Louisiana Refundable Child Care Credit (federal AGI $25,000 or less)
  type: refundable
  eligibility: Louisiana residents with federal adjusted gross income of $25,000 or less who incurred child and
    dependent care expenses in Louisiana (under IRC Section 21) for a qualifying person, to allow the taxpayer (and
    spouse if married filing jointly) to work or look for work. Refundable whether or not a federal child care credit
    was claimed. Authorized by R.S. 47:297.4. The worksheet must be attached to the return.
  amount: 'Qualified expenses capped at $3,000 for one qualifying person / $6,000 for two or more (2024 worksheet
    Line 3), limited to earned income (Lines 4-6), multiplied by a federal-AGI-based decimal, then multiplied by
    50% (Line 10 ''Multiply Line 9 by 50 percent''). 2024 decimal table verbatim: $0–$15,000 = .35; $15,000–$17,000
    = .34; $17,000–$19,000 = .33; $19,000–$21,000 = .32; $21,000–$23,000 = .31; $23,000–$25,000 = .30.'
  income_limit_2024: Federal adjusted gross income must be $25,000 or less to claim the refundable version.
  claimed_on: Form IT-540, Line 13 (with expense/limit amounts on Lines 13A and 13B; from the 2024 Louisiana Refundable
    Child Care Credit Worksheet, Line 11)
  citation:
    source: Louisiana Department of Revenue – 2024 Form IT-540 (Louisiana Refundable Child Care Credit Worksheet,
      Lines 3-11 and decimal table) and 2024 IT-540 instructions, Lines 13/13A/13B
    url: https://dam.ldr.la.gov/taxforms/IT-540-WEB-BC-2024-F.pdf
- name: Louisiana Nonrefundable Child Care Credit (federal AGI greater than $25,000)
  type: nonrefundable
  eligibility: Louisiana residents with federal adjusted gross income greater than $25,000 who incurred qualifying
    child and dependent care expenses (IRC Section 21) in Louisiana and claimed a federal child care credit. Unused
    credit may be carried forward up to five years (for 2024, carryforwards from 2019 through 2023 may be applied;
    2018 amounts have expired). Authorized by R.S. 47:297.4.
  amount: 'Federal Child Care Credit (Federal Form 1040/1040-SR, Schedule 3, Line 2) multiplied by an AGI-based
    percentage (2024 worksheet Line 1A): $25,001–$35,000 = 30% (.30); $35,001–$60,000 = 10% (.10); over $60,000
    = 10% (.10). If federal AGI is greater than $60,000, the credit is limited to the LESSER of $25.00 or 10 percent
    of the federal credit (worksheet Line 2A).'
  income_limit_2024: Federal adjusted gross income must be greater than $25,000 to claim on this line; for AGI over
    $60,000 the credit is capped at $25 (or 10% of the federal credit, whichever is less).
  claimed_on: Form IT-540, Schedule J – Nonrefundable Priority 3 Credits, Line 2 (carryforward from 2019-2023 on
    Line 3); from the 2024 Louisiana Nonrefundable Child Care Credit Worksheet
  citation:
    source: Louisiana Department of Revenue – 2024 Form IT-540 (2024 Louisiana Nonrefundable Child Care Credit Worksheet,
      Lines 1-2A) and 2024 IT-540 instructions What's New (Schedule J carryforward years)
    url: https://dam.ldr.la.gov/taxforms/IT-540-WEB-BC-2024-F.pdf
- name: Louisiana School Readiness Child Care Expense Credit (refundable, federal AGI $25,000 or less)
  type: refundable
  eligibility: Taxpayers who claimed the Louisiana Refundable Child Care Credit (IT-540 Line 13) and who had a qualified
    dependent under age six that attended a child care facility participating in the Quality Start Rating program
    (administered by the Louisiana Dept. of Education) — facility must provide Form R-10614, and the facility license
    number must be entered on the Refundable Child Care Credit Worksheet. Refundable version requires federal AGI
    of $25,000 or less. Authorized by R.S. 47:6104.
  amount: 'A percentage of the Louisiana refundable child care credit based on the facility''s Quality Star Rating
    (2024 worksheet chart): Five Star = 200% (2.0); Four Star = 150% (1.5); Three Star = 100% (1.0); Two Star =
    50% (.50); One Star = 0% (.00).'
  income_limit_2024: Federal adjusted gross income of $25,000 or less for the refundable version (above $25,000
    the credit is nonrefundable and claimed on Schedule J, with the 2019-2023 five-year carryforward).
  claimed_on: Form IT-540, Line 14 (refundable; from the 2024 Louisiana Refundable School Readiness Credit Worksheet;
    enter the number of qualified dependents per star rating in the boxes under Line 14). Nonrefundable version
    (AGI > $25,000) is on Form IT-540, Schedule J, Lines 4-5.
  citation:
    source: Louisiana Department of Revenue – 2024 Form IT-540 (2024 Louisiana Refundable School Readiness Credit
      Worksheet, star-rating chart) and 2024 IT-540 instructions, Line 14
    url: https://dam.ldr.la.gov/taxforms/IT-540-WEB-BC-2024-F.pdf
filing_requirement:
  note: 'Per the 2024 IT-540 instructions ("WHO MUST FILE A RETURN"): (1) A Louisiana resident who is required to
    file a federal individual income tax return must file a Louisiana return reporting all income earned in 2024.
    (2) You must file to obtain a refund or credit if you overpaid through withholding, estimated tax, a credit
    carried forward, or are claiming a 2024 refundable child care credit or Louisiana earned income credit. (3)
    If you are not required to file a federal return but had Louisiana income tax withheld in 2024, you must file
    to claim a refund (complete Lines 1-6F, enter wages/income in the boxes above Line 7, skip to Line 12 and enter
    zero). Nonresidents/part-year residents with Louisiana-source income who must file a federal return file IT-540B.
    The filing trigger keys off the federal filing requirement rather than a fixed standalone dollar threshold;
    the IRS federal filing thresholds therefore govern.'
