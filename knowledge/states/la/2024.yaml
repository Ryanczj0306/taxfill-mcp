# LA state knowledge — tax year 2024. Fetched + cited from the LA DOR (.gov),
# authored per the 2023 template (state-year knowledge program). Loaded as a StateKnowledge.
# conforms_to_federal_treaties: whether federally treaty-exempt income flows through
# (most states start from federal AGI) or is added back (CA/CT/MD/MS-style). Figures the
# fetch could not independently confirm are in `unverified` — confirm at the cited source.
# Two-pass verification: every key figure below was drafted from the 2024 IT-540
# instructions ('IT540i WEB 2024 INSTRUCTIONS'), then independently re-derived from a
# second official document — the 2024 IT-540 form itself (IT-540-WEB-BC-2024-F, with the
# credit worksheets), the 2024 Louisiana Tax Tables (IT540(2024)D13 TT), or the 2024
# IT-540B instructions (whose Tax Computation Worksheet prints the rates explicitly) —
# resolutions recorded inline where the passes differed.
# 2024 STATUS: rates and structure UNCHANGED from 2023 (1.85%/3.5%/4.25% at
# $12,500/$50,000 single — $25,000/$100,000 MFJ/QSS; $4,500/$9,000 combined personal
# exemption-standard deduction zero-rate floors; $1,000 per extra exemption). The 2024
# What's New lists only donation/credit-schedule housekeeping. NOTE: Louisiana moved to a
# FLAT 3% tax for TAX YEAR 2025 (2024 Third Extraordinary Session) — do not use 2025
# documents for 2024 figures.
jurisdiction: states/la
tax_year: 2024
income_tax: true
conforms_to_federal_treaties: true
treaty_note: 'LA''s resident return (IT-540) starts from Federal Adjusted Gross Income: Line 7 is "FEDERAL ADJUSTED
  GROSS INCOME" and the 2024 instructions say "Line 7 – Enter the amount of your Federal Adjusted Gross Income (Federal
  AGI). This amount is taken from Federal Form 1040 or 1040-SR, Line 11. If your Federal AGI is less than zero, enter
  0." Federally treaty-exempt income is already excluded from federal AGI and therefore flows through. The only
  "additions" to federal AGI are on Schedule E, Lines 2A-2D: (2A) interest and dividend income from other states
  and their political subdivisions, (2B) recapture of START contributions, (2C) recapture of START K12 contributions,
  and (2D) add back of pass-through entity loss. There is NO add-back of tax-treaty-exempt income anywhere on the
  IT-540 form, Schedule E, or in the instructions (the word "treaty" appears zero times in both the 2024 IT-540 form
  PDF and the 2024 IT-540 instructions PDF). Because LA starts from federal AGI and has no treaty addback, treaty-exempt
  income is not re-taxed -> conforms.'
