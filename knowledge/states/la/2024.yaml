tax:
  citation:
    source: '2024 Louisiana Tax Table (IT540(2024)D13 TT, printed with the resident IT-540): ''2024 LOUISIANA TAX TABLE
      - Single or Married Filing Separately (Filing Status Box 1 or 3)'' / ''Married Filing Jointly or Qualifying Surviving
      Spouse (Filing Status Box 2 or 5)'' / ''Head of Household (Filing Status Box 4)''; each header states ''The $4,500
      [Single/MFS] / $9,000 [MFJ-QSS, HOH] combined personal exemption-standard deduction and $1,000 for each exemption
      over one [over two for MFJ-QSS] have been used in determining the tax shown in this table'', with continuations
      ''Plus 4.25% of Tax Table Income in Excess of $51,000'' (Single/MFS, HOH) and ''Plus 4.25% of Tax Table Income
      in Excess of $101,000'' (MFJ/QSS). Rates and bracket boundaries cross-verified against the 2024 IT-540B instructions
      Tax Computation Worksheet (1.85% on the first $12,500/$25,000; 3.5% on the next $37,500/$75,000; 4.25% over $50,000/$100,000;
      Line C1 combined personal exemption-standard deduction $4,500 statuses 1/3, $9,000 statuses 2/4/5; Line C2 $1,000
      per 65-or-over/blind box and per dependent; Lines E/F/G deduct it from the first bracket), https://dam.ldr.la.gov/taxforms/IT540Bi(2024)D10.pdf,
      and the 2024 IT-540 instructions, Lines 6-10, https://dam.ldr.la.gov/taxforms/IT540i%20WEB%202024%20INSTRUCTIONS.pdf
      — 2024 rates and boundaries are UNCHANGED from 2023 (Louisiana''s flat 3% applies only from tax year 2025).'
    url: https://dam.ldr.la.gov/taxforms/IT540(2024)D13%20TT.pdf
