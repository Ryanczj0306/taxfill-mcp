unverified:
- The 'refund/no-payment' address is the same P.O. Box 3440 used for 'all other individual income tax returns' (the
  instructions label it for all non-payment returns rather than a dedicated 'refund' box); confirm at the DOR if a
  return is specifically a refund return.
- The 2025 flat-tax legislation (Act 11 of the 2024 Third Extraordinary Session) is cited here from the 2025 IT-540
  instructions and RIB 25-012 rather than the session-law text itself; the flat 3% rate, the $12,500/$25,000 standard
  deductions, and the exemption repeal are two-pass confirmed at those two official 2025 documents.
- The 2025 refundable child care / school readiness worksheet decimal tables and star-rating percentages were not
  re-transcribed line-by-line this pass (they are unchanged in structure from 2024); confirm the exact 2025 decimals
  on the worksheets when claiming.
- IT-540B part-year mechanics (ratio proration on the 2025 Nonresident Tax Computation Worksheet) were not parsed
  line-by-line; confirm against the 2025 IT-540B instructions when filing IT-540B.
tax:
  citation:
    source: '2025 Louisiana IT-540 Resident Income Tax Return Instructions (IT540i-WEB-2025), LA DOR - WHAT''S NEW FOR
      LOUISIANA 2025: ''Your Louisiana Income Tax - Line 11 - Act 11 of the 2024 Third Extraordinary Legislative Session
      changed the income tax rate to a flat tax rate of 3%''; ''Louisiana Standard Deduction - Line 8 ... The amount
      of the deduction is $12,500 for individuals filing single and married filing separate; $25,000 for individuals
      filing married filing joint, qualifying surviving spouse and head of household''; Line 8 instruction ''If your
      filing status is 1 or 3, enter $12,500; 2, 4, or 5, enter $25,000''; Line 10 ''Subtract Lines 8 and 9D from Line
      7. If less than zero, enter zero 0''; Line 11 ''Multiply Line 10 by .03. Round to the nearest dollar''. Second
      pass: Revenue Information Bulletin No. 25-012 (Louisiana Individual Income Tax Reform) prints the pre/post rate
      tables (graduated 1.85%/3.5%/4.25% -> flat 3%) and the standard-deduction increase table ($4,500 -> $12,500 single/MFS;
      $9,000 -> $25,000 surviving spouse/head of household), and states the additional exemptions for dependents, blind,
      and 65-or-older were repealed - https://dam.ldr.la.gov/lawspolicies/RIB-25-012-Louisiana-Individual-Income-Tax-Reform-1.pdf
      - both passes agree.'
    url: https://dam.ldr.la.gov/taxforms/IT540i-WEB-2025.pdf
  flat_rate: 0.03
  base: federal_agi
  tax_line: 'IT-540 Line 11: ''YOUR LOUISIANA INCOME TAX''. 2025 instructions, Line 11: ''Multiply Line 10 by .03.
    Round to the nearest dollar.'' Line 10 = Line 7 Federal Adjusted Gross Income minus Line 8 standard deduction
    ($12,500 filing status 1/3; $25,000 filing status 2/4/5) minus Line 9D excess federal itemized deductions, floor
    zero (''Subtract Lines 8 and 9D from Line 7. If less than zero, enter zero 0'').'
  exemptions: {}
  standard_deduction:
    single: 12500
    married_filing_jointly: 25000
    married_filing_separately: 12500
    head_of_household: 25000
  notes:
  - '2025 STRUCTURAL CHANGE (Act 11 of the 2024 Third Extraordinary Legislative Session): Louisiana went FLAT. The
    graduated 1.85%/3.5%/4.25% brackets and the combined personal exemption-standard-deduction zero-rate floor of
    2023/2024 are GONE. For tax years beginning on or after 1/1/2025 the rate is a FLAT 3% (IT-540 Line 11 = Line
    10 x .03). Do NOT use this pack for 2024 or earlier, and do NOT carry 2024 graduated figures into 2025.'
  - 'Base guidance: supply IT-540 Line 10 as taxable_base -> the op recomputes it here as Line 7 Federal AGI minus
    the per-status Line 8 standard deduction, so supply Line 7 FEDERAL ADJUSTED GROSS INCOME (Federal Form 1040/1040-SR,
    Line 11; if less than zero enter 0; if you have Louisiana additions/exempt income, Line 7 comes from Louisiana
    Schedule E instead) as taxable_base and the op subtracts the standard deduction. IMPORTANT: if you are a FEDERAL
    ITEMIZER you must also subtract Line 9D ''EXCESS FEDERAL ITEMIZED DEDUCTIONS'' yourself before supplying the base
    (this op models only the standard deduction, not Line 9D). Non-itemizers skip Lines 9A-9D.'
  - 'Standard deduction (Line 8, Act 11): $12,500 for filing status 1 (single) or 3 (married filing separately); $25,000
    for filing status 2 (married filing jointly), 4 (head of household), or 5 (qualifying surviving spouse) - nearly
    tripled from the 2024 $4,500/$9,000 combined floors. The op''s QSS -> married_filing_jointly mapping is exact
    ($25,000). Head of Household ALSO gets $25,000 for 2025 (up from the old $9,000 combined floor and no longer sharing
    the single boundary) - the shipped head_of_household amount reflects this. The standard deduction is CPI-U indexed
    annually starting after 2025; these are the 2025 amounts.'
  - 'Exemptions REPEALED: Act 11 repealed the additional $1,000 deductions for dependents, persons 65 or older, and
    blind persons (old Lines 6A/6B/6D/6E/6F), and those lines were removed from the 2025 form. This pack ships NO
    exemption keys - pass exemptions_count=0 and dependents_count=0. (The prior graduated packs'' ''dependent''/''age_65''/''blind''
    $1,000 entries do not exist for 2025.)'
  - 'No tax table: 2025 Line 11 is a straight multiplication printed on the form (''Multiply Line 10 by .03. Round
    to the nearest dollar'') - the 2024 Louisiana Tax Table no longer applies. This op''s irs_round matches the form''s
    round-to-nearest-dollar.'
  - 'Louisiana credits are NOT modeled by this op and come off after Line 11: Nonrefundable Priority 1 credits (Schedule
    C) on Line 12; refundable child care credit (federal AGI <= $25,000) on Line 14; refundable school readiness credit
    (star-rated) on Line 15; Louisiana Earned Income Credit (5% of the federal EIC) on Line 16; other refundable Priority
    2/4 and nonrefundable Priority 3 credits (Schedules F/I/J) on later lines.'
  - Annual Retirement Income Exemption for taxpayers 65 or older (Schedule E Code 06E) increased from $6,000 to $12,000
    per person for 2025 (Act 11) - this is a Schedule E base subtraction reached on Line 7, not part of this Line
    11 computation; supply Line 7 already net of any Schedule E exemptions.
  - Consumer Use Tax (Line 23A) and the Electric/Hybrid Vehicle Road Usage Fee are separate amounts added on the 2025
    return after the income tax - NOT modeled.
  - 'Source URL: 2025 resident instructions https://dam.ldr.la.gov/taxforms/IT540i-WEB-2025.pdf ; reform bulletin
    https://dam.ldr.la.gov/lawspolicies/RIB-25-012-Louisiana-Individual-Income-Tax-Reform-1.pdf .'
