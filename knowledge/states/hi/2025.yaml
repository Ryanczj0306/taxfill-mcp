  base: federal_agi
  tax_line: '2025 Form N-11 line 27 ''Tax'' — tax on line 26 ''Taxable Income. Line 24 minus line 25 (but not less
    than zero)'', where line 24 = line 20 (Hawaii AGI) minus line 22 (total itemized deductions) or line 23 (standard
    deduction), whichever applies, and line 25 = $1,144 x the total exemptions claimed on line 6e. Line 27 carries
    ovals for Tax Table, Tax Rate Schedule, or Capital Gains Tax Worksheet. Instructions: ''If your taxable income
    is less than $100,000, you MUST use the Tax Table on pages 36 through 47''; ''You must use the Tax Rate Schedules
    on page 48'' otherwise.'
  exemptions:
    personal:
      amount: 1144
      note: 'N-11 line 25: $1,144 multiplied by the total exemptions claimed on line 6e (yourself + spouse when applicable)
        — Hawaii counts everyone in one line 6e total; an individual age 65 or older counts as TWO exemptions ($2,288),
        so pass the doubled count yourself. UNCHANGED for 2025.'
    dependent:
      amount: 1144
      note: Dependents are part of the same $1,144-per-exemption line 6e total — same amount as personal. UNCHANGED for
        2025.
  standard_deduction:
    single: 4400
    married_filing_jointly: 8800
    married_filing_separately: 4400
    head_of_household: 6424
  notes:
  - 'TY2025 IS THE BRACKET-WIDENING YEAR — the schedules MOVED, verified verbatim: 2025 N-11 instructions ''Changes
    to Note'': ''For the 2025 taxable year beginning after December 31, 2024, the individual income tax bracket amounts
    were amended for all the filing statuses by increasing the income limits in each bracket. (Act 45, SLH 2024)''.
    The 2024 pack''s schedules (digit-identical to 2023) are therefore SUPERSEDED. Every 2025 boundary and every 2025
    base-tax constant in this block was re-derived from the printed 2025 schedules, not carried forward.'
  - 'The TWELVE RATES did NOT change — 1.40 / 3.20 / 5.50 / 6.40 / 6.80 / 7.20 / 7.60 / 7.90 / 8.25 / 9.00 / 10.00
    / 11.00 percent, the same twelve as 2023 and 2024. Only the boundaries widened. Schedule I: 2024''s 2,400/4,800/9,600/14,400/19,200/24,000/36,000/48,000/150,000/175,000/200,000
    became 2025''s 9,600/14,400/19,200/24,000/36,000/48,000/125,000/175,000/225,000/275,000/325,000 — the 1.40% bracket
    alone widened from $2,400 to $9,600 and the 11% top threshold rose from $200,000 to $325,000. Effect at Single
    taxable income $20,000: the 2024 schedule produced $1,065.60 (-> $1,066); the 2025 schedule produces $603.20 (->
    $603).'
  - 'Schedule structure: Schedule II (MFJ/QSS) boundaries are EXACTLY 2x Schedule I and Schedule III (HoH) EXACTLY
    1.5x — verified boundary by boundary on the 2025 prints (9,600x2=19,200 ... 325,000x2=650,000; 9,600x1.5=14,400
    ... 325,000x1.5=487,500). Schedule I is titled ''SINGLE TAXPAYERS AND MARRIED FILING SEPARATE RETURNS'', so MFS
    is a copy of the Single schedule (not half of MFJ); Schedule II is titled ''MARRIED TAXPAYERS FILING JOINT RETURNS
    AND QUALIFYING SURVIVING SPOUSES'', so the engine''s QSS-to-MFJ mapping matches the published schedule exactly.'
  - 'ALL 33 PRINTED BASE-TAX CONSTANTS RECONCILED against cumulative bracket sums (re-derived for 2025). Schedule
    I: 9,600 x 1.4% = 134.40 (printed $134); +4,800 x 3.2% = 288.00 ($288); +4,800 x 5.5% = 552.00 ($552); +4,800
    x 6.4% = 859.20 ($859); +12,000 x 6.8% = 1,675.20 ($1,675); +12,000 x 7.2% = 2,539.20 ($2,539); +77,000 x 7.6%
    = 8,391.20 ($8,391); +50,000 x 7.9% = 12,341.20 ($12,341); +50,000 x 8.25% = 16,466.20 ($16,466); +50,000 x 9%
    = 20,966.20 ($20,966); +50,000 x 10% = 25,966.20 ($25,966). Schedule II: 268.80 ($269); 576.00 ($576); 1,104.00
    ($1,104); 1,718.40 ($1,718); 3,350.40 ($3,350); 5,078.40 ($5,078); 16,782.40 ($16,782); 24,682.40 ($24,682); 32,932.40
    ($32,932); 41,932.40 ($41,932); 51,932.40 ($51,932). Schedule III: 201.60 ($202); 432.00 ($432); 828.00 ($828);
    1,288.80 ($1,289); 2,512.80 ($2,513); 3,808.80 ($3,809); 12,586.80 ($12,587); 18,511.80 ($18,512); 24,699.30 ($24,699);
    31,449.30 ($31,449); 38,949.30 ($38,949).'
  - 'Printed-constant divergence: the schedules print WHOLE-DOLLAR base-tax constants that are roundings of the exact
    cumulative sums (e.g. $134 vs exact $134.40; $269 vs $268.80; $1,289 vs $1,288.80), so a filed rate-schedule computation
    can differ from this op''s exact marginal math by up to about $0.50 before rounding. Largest divergence observed:
    $0.40 (Schedule II''s $269 vs $268.80).'
  - 'STANDARD DEDUCTION UNCHANGED FOR 2025 — this is the figure most likely to be assumed wrong. The 2025 N-11 instructions''
    Line 23 table reads: Single $4,400; Married filing jointly $8,800; Married filing separately $4,400; Head of Household
    $6,424; Qualifying Surviving Spouse $8,800 — identical to 2024. The printed 2025 Form N-11 line 23 says the same
    (''If you checked filing status box: 1 or 3 enter $4,400; 2 or 5 enter $8,800; 4 enter $6,424''), and the 2025
    N-15 instructions print the same table. Act 45/46 SLH 2024''s 2025 step was the BRACKET WIDENING, not another
    standard-deduction increase. The instructions also note ''Hawaii did not adopt the federal provision that increases
    the standard deduction amounts for tax years 2018 through 2025'' — Hawaii''s amounts are wholly its own.'
  - 'Base guidance: supply 2025 Form N-11 line 20 (Hawaii AGI) = line 7 federal AGI + lines 8-10 Hawaii additions
    (state/federal wage differences due to COLA/ERS, out-of-state bond interest, and the enumerated ''Other Hawaii
    additions'') - the Hawaii subtractions (pensions taxed federally but not by Hawaii, the new-for-2025 exclusion
    of up to $8,636 of military reserve or Hawaii National Guard duty pay, and the other line 13-19 subtractions).
    The op then subtracts the shipped per-status standard deduction (line 23) and $1,144 x (exemptions_count + dependents_count)
    (line 25) to reproduce line 26 taxable income, floored at zero, and applies the rate schedule to reproduce line
    27.'
  - 'EXEMPTIONS ARE A BASE REDUCTION here (unlike CA/DE): Hawaii''s $1,144 per exemption is subtracted from income
    on line 25, so exemptions_count and dependents_count ARE applied by this op. Hawaii totals every exemption in
    one line 6e count, and an individual age 65 or older counts as TWO exemptions ($2,288) — pass the doubled count.
    The blind/deaf/totally-disabled exemption is a DIFFERENT mechanism (fill the line 25 ovals after filing Form N-172)
    and is NOT modeled.'
  - 'TAX TABLE MANDATE below $100,000 — ''CAUTION: If your taxable income is less than $100,000, you MUST use the
    Tax Table'' (2025 instructions p. 48) and ''If your taxable income is less than $100,000, you MUST use the Tax
    Table on pages 36 through 47''. The table uses $50 bands whose values equal band-MIDPOINT schedule math rounded
    half-up, so at the bottom of a band this op can read a dollar or two lower than the mandated table: at taxable
    income exactly $20,000 the op computes $603 while the table''s $20,000-$20,050 band prints $605 (Single/MFS),
    $295 (MFJ/QSS) and $382 (HoH). At $8,750 the op computes $123 and the table also prints $123.'
  - 'ALTERNATIVE TAX ON CAPITAL GAINS not modeled: line 27 offers a third oval for the Capital Gains Tax Worksheet
    (2025 instructions p. 33), which can yield a lower tax than the rate schedules for a filer with substantial net
    capital gain. Form N-168 (income averaging for farmers/fishermen) and Form N-615 (tax for children under 14 with
    unearned income over $1,000) also replace the line 27 computation and are NOT modeled.'
  - 'Dependent filers NOT modeled: ''If you can be claimed as a dependent by someone else and you do not itemize your
    deductions, your standard deduction is limited to the greater of $500 or your earned income'' (up to the regular
    per-status amount) — an income-dependent amount the shipped fixed standard_deduction does not reproduce.'
  - 'Itemizers: the shipped standard_deduction applies only to filers who do not itemize (line 24 = line 20 minus
    line 22 OR line 23, ''whichever applies''). Hawaii itemized deductions are computed on the N-11 lines 21a-21f
    worksheets and are subject to Hawaii''s own overall limitation (Hawaii did not adopt the federal suspension of
    the overall limitation on itemized deductions).'
  - 'CREDITS not modeled (they reduce tax, not the base): the refundable food/excise tax credit (Form N-311, $220
    down to $70 per qualified exemption by federal AGI), the refundable Hawaii EITC (Form N-356, 40% of the federal
    EIC), the low-income household renters credit (Schedule X Part I, $50 per qualified exemption, AGI under $30,000,
    net rent over $1,000) and the child and dependent care credit (Schedule X Part II, .25 down to .15 of expenses
    capped at $10,000/$20,000). New for 2025 per ''Changes to Note'': all qualified members claiming the Pass-Through
    Entity tax credit must ADD their share of taxes paid by the electing PTE to taxable income (Act 58, SLH 2025)
    — an addition this op does not apply; supply it in the base.'
  - Hawaii is print-only for filing (the render_mode hand_fill pack ships); this op powers the line 27 value. Hawaii's
    filing deadline is April 20, 2026 with an automatic 6-month extension to October 20, 2026 — NOT the federal April
    15.
