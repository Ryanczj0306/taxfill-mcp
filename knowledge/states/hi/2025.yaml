unverified:
- 'Whether hitax.hawaii.gov is the precise canonical payment URL versus tax.hawaii.gov/eservices/ — the 2025 N-11 instructions
  cite Hawaii Tax Online at hitax.hawaii.gov for filing and payment and tax.hawaii.gov/eservices/ for EFT and general
  e-services; the exact deep-link payment page was not separately confirmed.'
- 'The 2025 Form N-15 itself (n15_f.pdf) was not fetched — only the 2025 N-15 INSTRUCTIONS, which were used as the
  second-pass source for the rate schedules and standard deduction. The N-15 due date and mailing addresses are presumed
  identical to the N-11 (April 20, 2026; same Box 1530 / Box 3559 addresses) but were not separately extracted; confirm
  in n15ins.pdf if filing a nonresident/part-year return.'
- 'The full text of Act 45, SLH 2024 was not fetched from capitol.hawaii.gov; the fact that TY2025 is a bracket-widening
  year (and that the standard deduction was NOT raised again for 2025) comes from the 2025 N-11 instructions'' "Changes
  to Note" and from the printed 2025 schedules and Line 23 table themselves, cross-checked against the 2025 N-15 instructions.
  The act''s later-year steps are outside this pack.'
- 'The 2025 Hawaii Tax Table (N-11 instructions pp. 36-47, MANDATORY when taxable income is less than $100,000) was
  spot-checked, not transcribed: the $8,750-$8,800 band prints $123 / $123 / $123 and the $20,000-$20,050 band prints
  $605 (Single/MFS) / $295 (MFJ/QSS) / $382 (HoH). Every sampled cell equals band-midpoint rate-schedule math rounded
  half-up. See the tax.notes table mandate.'
- 'The Capital Gains Tax Worksheet (N-11 instructions p. 33, an ALTERNATIVE tax computation elected on line 27) was
  not transcribed; it can produce a lower tax than the rate schedules for filers with substantial net capital gain
  and is not modeled by the tax block.'
