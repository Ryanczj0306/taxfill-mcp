- description: >-
    TY2025 IS THE BRACKET-WIDENING YEAR — 2025 N-11 instructions "Changes to Note", verbatim: "For
    the 2025 taxable year beginning after December 31, 2024, the individual income tax bracket
    amounts were amended for all the filing statuses by increasing the income limits in each
    bracket. (Act 45, SLH 2024)". The twelve RATES are unchanged (1.40 / 3.20 / 5.50 / 6.40 / 6.80 /
    7.20 / 7.60 / 7.90 / 8.25 / 9.00 / 10.00 / 11.00 percent); only the boundaries moved. Schedule I
    (Single/MFS) went from 2024's
    2,400/4,800/9,600/14,400/19,200/24,000/36,000/48,000/150,000/175,000/200,000 to
    9,600/14,400/19,200/24,000/36,000/48,000/125,000/175,000/225,000/275,000/325,000 — the 1.40%
    bracket alone widened from $2,400 to $9,600 and the 11% top threshold rose from $200,000 to
    $325,000. Schedule II (MFJ/QSS) remains exactly 2x and Schedule III (HoH) exactly 1.5x. The
    standard deduction was NOT raised again for 2025 ($4,400 / $8,800 / $6,424, unchanged), and the
    $1,144 personal exemption is unchanged; the filing thresholds moved with the 2024 deduction step.
