# Phase K JK15 (2026-10-24): the KG6 accuracy table for the pack-blind anchor (taxfill_core.anchor), written by
# scripts/anchor_benchmark.py; do not edit by hand. taxfill_core.anchor reads `thresholds` from this file ONLY when
# `passed` is true and `method` matches its METHOD; otherwise it emits nothing above "low". `measured` holds the
# provisional numbers (a disagreement with a pack counts against the anchor until adjudicated); `adjudication` holds
# the numbers after the blind vision adjudication in adjudications.yaml (--finalize): one blind read per item,
# sharded across adjudicators. The gate is the scored top-tier precision; `notes` says what each number covers.
# A top-tier anchor is worded "anchored (unverified line map)": it is still not a verified line map.
schema: 1
method: jk15-v4
thresholds:
  top: 3.0
  med: 2.0
top_tier_kinds:
- text
passed: true
adjudicated: 185
test_runs: 4
history:
- run: 1
  date: '2026-10-24'
  method: jk15-v1
  thresholds:
    top: 3.0
    med: 2.0
  note: 'first measured TEST run: method jk15-v1 tuned on DEV only (DEV top 937/937), thresholds top 3.0 med 2.0'
- event: 'finalize join normalisation (commit 92c11ec): an adjudicator''s seen_line is normalised the way the anchor normalises
    a printed designator before the join, so ''6C'' equals ''6c'' (AZ 140NR line 6C had been scored wrong on the spelling
    alone); not a TEST run and not a method change'
  date: '2026-10-24'
- run: 2
  date: '2026-10-24'
  method: jk15-v2
  thresholds:
    top: 3.0
    med: 2.0
  note: 'method jk15-v2, after the round-1 verifier failed run 1: (1) a box whose row band holds another fillable text box
    of a different field with no caption words between them is capped below the top tier (multi_column_row) whether or not
    the neighbour got a line, because a row designator does not identify a box on a multi-column row (DE PIT-RES/PIT-NON Column
    A, the spouse column, had reached the top tier 80 times while Column B got no line); (2) a cents token (''.00'', ''00'')
    is a separator, so a second column keeps its own designator; (3) one designator on top-scoring boxes of different fields
    on one page is capped below the top tier (repeated_line; AL 40NR page 2 prints ''2'' once per Part). The table now reports
    the scored top tier, the unscored sample and a combined size-weighted estimate with 95% Wilson intervals, checkboxes apart,
    and words the gate as scored top-tier precision. Thresholds (top 3.0, med 2.0) and the selection (sibling disclosure added)
    are unchanged.'
- run: 3
  date: '2026-10-24'
  method: jk15-v3
  thresholds:
    top: 3.0
    med: 2.0
  note: 'method jk15-v3, after the round-2 verifier failed run 2: the row-identification invariant. A widget reaches the top
    tier only when (i) no fillable text box of any other field shares its row band, or (ii) every fillable text box in that
    band, its own included, carries its own distinct printed_line read from the designator printed immediately before it (beside
    evidence; a gutter number or /TU alone does not count), the 1040 2a/2b row; every other widget caps at med with shared_row:<field>
    evidence (the round-2 cap skipped a pair with caption words between, so GA 500 line 14''s count box, IT-201 line 84''s
    date box and the 1040-X line 23 year box took their row''s top tier while the amount box got no line). Licensing fails
    closed (a missing or non-list top_tier_kinds licenses no group); the unscored sample and the combined estimate are computed
    over the text group only, the only group that can be licensed. Thresholds (top 3.0, med 2.0) and the selection are unchanged.'
- run: 4
  date: '2026-10-24'
  method: jk15-v4
  thresholds:
    top: 3.0
    med: 2.0
  note: 'method jk15-v4 (round 4): the one-to-one rule — a widget keeps the top tier only when no other field''s fillable
    box (text, choice or unknown) on its page carries its printed_line at any score, has its designator printed immediately
    before it, or names that line by /TU or field name; else same_line cap at med (WI Form 1 line 30 count box, Form 2555
    description boxes, WI 2023 line 15a rent box); per-form ''any mis-anchored'' rate over the text group only'
- event: 'Phase K JK10 P-031 re-keys (not a TEST run, no method change): VA 760 2025 keys the STA amount "17" (was "17a";
    its JK15 verdict saw 17, now retired_items in adjudications.yaml) and the spouse-VAGI box "17.spouse_vagi" (unscored);
    OK 511 2025 (DEV) keys line 4''s amount "4" (was "4b") and its Describe box "4.description" (unscored). Re-finalized:
    TEST med scored 561 -> 560, disagreements 186 -> 185; the gate numbers are unchanged'
  date: '2026-10-24'
criteria:
  test_packs_at_least_30: true
  test_federal_at_least_10: true
  test_state_at_least_20_from_12_states: true
  mandatory_cases_flagged: true
  every_disagreement_adjudicated: true
  scored_top_tier_precision_at_least_0.99: true
key_rule:
- '"21", "5a" (1-3 digits, one lowercase letter) score as themselves'
- '"line_21", "line21a" score as the line after "line"'
- '"21.col_b" scores as line 21'
- every other key shape is unscored (see scripts/anchor_benchmark.py)
notes:
- 'Known limits (the fourth review, 2026-10-24): a designator that a second schedule on the page prints again with no box
  beside that copy is not counted, so Wisconsin Form 1 page 4''s Schedule 1 line 7 and Schedule 2 line 8 keep the top tier
  although the other schedule prints a line 7 and a line 8 as preprinted rates; widgets hidden by their annotation flags (/F
  Hidden or NoView) are anchored like any other, and the pack-less fill (JK16) must refuse them; text outside a page''s crop
  box is read (no wrong anchor in the cache comes of it).'
- 'The gate is the SCORED top-tier precision: top-tier widgets whose pack binds a numbered key, after the blind adjudication
  of every disagreement (>= 0.99). The unscored top-tier sample and the combined size-weighted estimate (each with a 95% Wilson
  interval) are reported beside it, not gated; both cover text boxes only (unscored_sample.groups, combined_top_estimate.groups),
  the only group the table can license.'
- 'Checkbox and radio widgets are reported apart from text boxes (top_by_kind); the gate covers both, and the top tier is
  licensed per group: top_tier_kinds lists the text group when its scored top-tier precision is >= 0.99 (checkbox and radio
  widgets are never licensed: run 2 measured checkboxes 10/11, and the sample does not cover them), and taxfill_core.anchor
  caps every other group at ''med''. A table of this method whose top_tier_kinds is missing or not a list licenses no group
  for the top tier.'
- 'Row identification (method jk15-v3): a printed designator names a row, and a fill by line number needs it to name a box.
  taxfill_core.anchor gives a widget the top tier only when (i) no fillable text box of any other field shares its row band,
  or (ii) every fillable text box in that row band, its own included, carries its own printed_line, all distinct, each read
  from the designator printed immediately before the box (beside evidence, not a gutter number or a /TU alone): the 1040 ''2a
  [box] b ... 2b [box]'' row. Every other widget caps at ''med'' with a shared_row:<field> evidence entry (Georgia 500 line
  14''s count box, the 1040-X line 23 year box).'
- 'The per-form ''any mis-anchored'' rate covers the top tier of the licensable group (text boxes) only, like the sample and
  the combined estimate: a form counts in the denominator when it has a top-tier text box, and in the numerator when a scored
  top-tier text box or an unscored-sample widget is adjudicated anchor_wrong.'
- 'One-to-one rule (method jk15-v4): a designator must map to one box on its page. taxfill_core.anchor gives a widget the
  top tier only when no other field''s fillable box on the page (text, choice or unknown kind) carries the same printed_line
  at any score, has that designator printed immediately before it (even when it got no line), or names that line through its
  /TU or field name; else it caps at ''med'' with same_line:<field> (Wisconsin Form 1 line 30''s count box above the line-30
  amount box, Form 2555''s description boxes above their amount boxes, Wisconsin 2023 line 15a''s rent box beside the ''15a''
  credit box).'
- 'The adjudication is one blind read per item: each crop is read by exactly one adjudicator, sharded across adjudicators,
  with the candidate lines sorted and never which side claims which.'
- 'A row designator does not identify a box on a multi-column row (Delaware prints ''N.'' before the spouse''s Column A and
  again before Column B), nor a designator printed once per Part on one page (Alabama 40NR page 2): taxfill_core.anchor caps
  those boxes below the top tier.'
