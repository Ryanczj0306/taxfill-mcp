# Phase K JK15 (2026-10-24), round 2: a disclosure added by hand after the split was frozen; the split itself (dev,
# test) is unchanged and was not re-selected. The split hashes the family, and a resident form and its
# nonresident (or part-year) sibling are different families, so siblings can land on opposite sides: a sibling
# shares page layout and captions with its pair, so TEST is not fully independent of the DEV tuning for these.
disclosure:
  siblings_across_split:
  - dev: states/al/al40
    test: states/al/al40nr
    relation: Alabama Form 40 (resident) and Form 40NR (nonresident)
  - dev: states/ca/form540
    test: states/ca/form540nr
    relation: California Form 540 (resident) and Form 540NR (nonresident or part-year)
  - dev: federal/sched_a
    test: federal/sched_a_nr
    relation: Schedule A (Form 1040) and Schedule A (Form 1040-NR)
  siblings_same_side:
  - [dev, federal/f1040, federal/f1040nr]
  - [dev, states/ar/ar1000f, states/ar/ar1000nr]
  - [test, states/az/az140, states/az/az140nr, states/az/az140py]
  - [test, states/co/dr0104, states/co/dr0104pn]
  - [test, states/de/pit_res, states/de/pit_non]
  name_similar_not_siblings:
  - dev: federal/sched_1
    test: federal/sched_1a
    relation: Schedule 1 and Schedule 1-A (Form 1040) are different schedules, not versions of one form
  mandatory_cases_in_dev_families:
  - case: me_1040me_2023
    family: states/me/f1040me
    split: dev
  - case: al_form40_2023
    family: states/al/al40
    split: dev
    note: its sibling states/al/al40nr is a TEST family
