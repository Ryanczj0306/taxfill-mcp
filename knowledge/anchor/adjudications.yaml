# Phase K JK15 (2026-10-24): the blind vision adjudications that scripts/anchor_benchmark.py --finalize joins onto
# the benchmark's disagreements (KG6). Written by an independent adjudicator who saw only each item's crop and its
# candidate lines in sorted order, never which line the pack or the anchor gave. Format (fixed):
#
#   items:            # one entry per disagreements.json item (TEST and the two mandatory cases)
#     - id: "<pack id>:p<page>:<field>:w<widget index>"
#       seen_line: "21"     # the line printed for the outlined box's row, or null when none is printed
#       ambiguous: false    # true when the crop cannot settle it; excluded from numerator and denominator
#       reason: "..."
#   unscored_sample:  # one entry per unscored_sample.json item (top-tier widgets the packs do not number)
#     - {id: ..., seen_line: ..., ambiguous: ..., reason: ...}
#
# retired_unscored_sample: sample entries of earlier runs (methods jk15-v1 to jk15-v3) whose ids the current method no longer samples;
# kept for the record, never joined. items may hold verdicts for ids that are not disagreements in the current
# run (an id the method no longer anchors differently); --finalize joins only the current disagreements.
