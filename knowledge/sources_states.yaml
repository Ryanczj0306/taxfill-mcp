        answers: '2025 Montana Form 2 Individual Income Tax Instructions (MT DOR, 42 pages), p.12 — ''2025 Montana
          Income Tax Rates'': Single and Married Filing Separately Ordinary Income Tax Rates — $0 to less than $21,100
          tax rate 4.7% Less $0, $21,100 or greater 5.9% Less $253; Married Filing Jointly and Qualifying Surviving
          Spouse — breakpoint $42,200, 5.9% Less $506; Head of Household — breakpoint $31,700, 5.9% Less $380. The
          rates apply to Montana ORDINARY income (''taxable income without net long-term capital gains'', which
          includes qualified dividends); net long-term capital gains are taxed separately at 3% up to the same breakpoint
          (measured after ordinary income) and 4.1% above. Worked example (instructions p.11, Marla): Montana taxable
          income $50,000, single, no net long-term capital gains -> ''Her Montana Ordinary Income Tax is $2,697''
          — matching marginal bracket math (4.7% x 21,100 + 5.9% x 28,900 = 991.70 + 1,705.10 = 2,696.80 -> 2,697)
          and the printed formula method (5.9% x 50,000 - 253 = 2,697.00). Second pass: the 2025 Form 2 itself (https://revenue.mt.gov/files/forms/Montana-Individual-Income-Tax-Return-Form-2/2025_Montana_Individual_Income_Tax_Return_Form_2.pdf)
          prints the $21,100 / $42,200 / $31,700 filing-status amounts on page 2, line 5, and the 0.03 / 0.041 capital-gains
          multipliers on lines 8 and 10 — both passes agree. The booklet''s What''s New confirms the 4.7%/5.9% structure
          is unchanged for 2025 and that HB 337''s lower top rate (5.65%) and wider brackets begin in TAX YEAR 2026.'
