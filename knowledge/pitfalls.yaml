# Known-pitfall registry (docs/DEV_PLAN.md, section 10).
#
# Every bug found becomes (a) a permanent verifier rule,
# (b) a regression test, and (c) where applicable, an intake-question fix.
# Verify reports list each pitfall as PASS/FAIL so agents and users see the
# self-check happening. Contributors must add an entry here with every bug
# fix (enforced in the PR template).
#
# Schema — each entry:
#   id:             stable identifier (P-###)
#   incident:       what actually went wrong
#   countermeasure: the permanent fix (verifier rule / regression test / intake fix)

pitfalls:
  - id: P-001
    incident: >-
      SSN truncated on 1040-NR: a dashed SSN (e.g. "000-00-0000", 11 chars)
      written into a 9-cell comb field, last 2 digits clipped — invisible in
      field dumps, caught only by rendering.
    countermeasure: >-
      Clipping scan on every filled field; "format: ssn_digits_only" on comb
      fields; render+vision pass mandatory before "done".

  - id: P-002
    incident: >-
      A filer supplies a historical address, so IRS notices would go to a
      former residence.
    countermeasure: >-
      Intake disambiguation (current-mailing vs historical); verifier warns
      when return address differs from the user-confirmed current address,
      or matches an address whose date range ended. Shipped in M1: the
      cross-form address consistency check, plus the
      confirmed_current_address parameter on verify_form/verify_filing that
      FAILs when the on-disk address differs from the address the user
      confirmed they receive mail at TODAY. Deferred to M3 intake: flagging
      an address whose intake date range ended (needs the state-footprint
      date ranges from the interview).

  - id: P-003
    incident: >-
      Required Yes/No checkboxes silently unanswered (8843 line 12,
      Sched OI item I).
    countermeasure: >-
      Required-checkbox audit: any required group fully "/Off" fails
      verification.

  - id: P-004
    incident: >-
      Risk: a treaty benefit mis-scoped on a status-change year (an F-1 to
      H-1B filer can still claim for student-period income).
    countermeasure: >-
      Treaty eligibility is evaluated per visa PERIOD, never per year:
      residency.py flags the F-1 -> H-1B mid-year split with tests, the
      estimate carries the agent-confirmed amount via treaty_exempt_income
      (with article/state-conformity disclosures and a P-004 regression
      test), Schedule OI + the 1040-NR 1k == sched_oi.1e cross-form rule
      enforce the reporting chain, and get_sources routes treaty authority
      lookups. A full per-country treaty knowledge base (articles, amounts,
      eligibility predicates) remains roadmap work — until then the amount
      is the agent's recorded position, like itemized deductions.

  - id: P-006
    incident: >-
      Asked what a commuter benefit covers, the engine could quote the
      MONTHLY CAPS (contribution_limits' commuter_132f block) but
      shipped nothing about what QUALIFIES, so eligibility had to be
      researched from scratch — and get_sources("qualified parking")
      mis-routed to obbba_schedule_1a_deductions (the token "qualified"
      pulling toward the OBBBA topic), a wrong-law pointer of the Schedule
      NEC kind. Nothing stated the substantiation or eligible-expense
      rules.
    countermeasure: >-
      The eligibility RULES are year-invariant and live here; only the
      monthly caps are figures (they stay in the year packs). (1) Qualified
      transportation fringes are an EXHAUSTIVE list of three: a ride in a
      commuter highway vehicle (6+ adults excluding the driver, 80% of
      mileage commuting), a transit pass, and qualified parking. Vehicle
      ENERGY is never among them — fuel and EV charging are as ineligible
      as tolls and mileage. (2) Qualified parking is parking on or near the
      employer's business premises, or on or near the place the employee
      commutes from by transit/vanpool/carpool; parking at or near the
      employee's HOME is expressly excluded. Free employer parking leaves
      nothing to shelter. (3) A bona fide reimbursement arrangement
      requires the employee to INCUR AND SUBSTANTIATE the expense BEFORE
      reimbursement, and cash reimbursement for transit passes is barred
      wherever a transit-only voucher is readily available; amounts failing
      these tests are wages subject to income and employment taxes, not an
      exclusion. (4) Cash and cash equivalents can never fall back on the
      de minimis exclusion. get_sources now routes the authority via topic
      commuter_and_fringe_benefits (Pub 15-B's Transportation (Commuting)
      Benefits section, 26 CFR 1.132-9 Q-16..Q-22, Rev. Rul. 2014-32, and
      the de minimis page), with routing regression tests in
      test_sources.py including the "qualified parking" neighbour-theft
      case. Year-varying note carried by the sources entry: P.L. 119-21
      permanently eliminated the qualified bicycle commuting exclusion for
      tax years beginning after 2025.

  - id: P-005
    incident: >-
      A bank account bonus — even one styled as a fee reimbursement or
      "reward" — is easy to mis-characterize from its label alone:
      reward-shaped payments pattern-match to "credit card rewards are not
      taxable" (the
      purchase-price-rebate doctrine, Rev. Rul. 76-96 lineage), but a bonus
      for OPENING or MAINTAINING an account is taxable other income the
      bank reports (1099-MISC box 3 / 1099-INT) even when styled as a
      reimbursement — and for a nonresident it can land in the Schedule NEC
      30%-FDAP corner instead of a resident's Schedule 1. The sources
      registry had no topic for either half, so the characterization came
      from the agent's head, and "Schedule NEC" mis-routed to the OBBBA
      Schedule 1-A deduction page (a wrong-law pointer, worse than a miss).
    countermeasure: >-
      The characterization rule is year-invariant and lives HERE, never in
      a year pack: rewards earned by spending = rebate, not income; a bonus
      for opening/maintaining an account = other income; in-kind travel
      promotional benefits sit under Announcement 2002-18's no-enforcement
      line UNLESS converted to cash. get_sources now routes the authority —
      topics other_income_and_rewards (Pub 525 Other Income + the Cash
      rebates paragraph; Announcement 2002-18) and nonresident_fdap
      (Pub 519 ch. 4 "The 30% Tax", the IRS FDAP and ECI pages, the
      Schedule NEC instructions, Form 1042-S) — with routing regression
      tests in test_sources.py including the Schedule NEC neighbour-theft
      case. Only the statutory 30% rate (IRC 871(a)) and any treaty
      other-income article rate are figures — and the five treaty packs now
      carry verbatim-verified other_income blocks (calc op treaty_benefit,
      income_class other_income): China Art. 21(3), India Art. 23(3) and
      Canada Art. XXII(1) carve US-arising items back to source-state
      taxation, Mexico Art. 23 is source-state-only in form, and Korea
      (1976) verifiably has NO other-income article — so US-arising other
      income gets NO treaty reduction under any shipped treaty.

  - id: P-007
    incident: >-
      The Schedule D packs (2023, 2024 and 2025) mapped the two SHADED
      no-adjustment cells — line 1a column (g) and line 8a column (g) — as
      ordinary money lines, so the filler could print a number inside a box
      the IRS greys out and locks. Reproduced, not theorised:
      fill_form(pack, {"1a.g": 99999, "8a.g": 88888}) wrote both values with
      no warning, they survived a re-read of /V, and a 300-dpi render of page
      1 showed the digits sitting in the grey cells. The printed form leaves
      no room for an entry: each row is defined as totals for 1099-B
      (1099-DA from 2025) transactions "for which you have no adjustments",
      while column (g) is headed "Adjustments to gain or loss from Form(s)
      8949, Part I/II, line 2, column (g)" — an adjustment routes the
      transaction to line 1b/8b + Form 8949 instead, so for rows 1a/8a
      column (h) is simply (d) - (e). The blank agrees: those are the ONLY 2
      of the 55 widgets with the AcroForm ReadOnly bit set (/Ff = 8388609 =
      DoNotScroll|ReadOnly; every other text widget is 8388608 or 0), in all
      three years — the 2025 revision dropped the "_RO" suffix from the
      NAMES (f1_05_RO -> f1_5, f1_25_RO -> f1_25) while keeping the flag, so
      a name-only port audit reads the change as cosmetic. Nothing
      downstream would have caught the bad artifact either: verify.py's
      clipping scan deliberately skips ReadOnly widgets on the stated
      premise that "the filler never writes them", which the mapping made
      false. Inherited from the 2023 base and carried into both ports.
    countermeasure: >-
      The two widgets are unmapped in all three sched_d packs, so
      fill_form now raises its prescriptive unknown-line-key ValueError on
      "1a.g"/"8a.g" instead of silently writing a shaded box, and each pack
      records the printed-text + /Ff proof in its header plus an inline
      comment where the binding used to be. Regression tests in
      test_formpacks_federal.py: an always-run structural test pinning the
      two exclusions and the surviving 1a.d/1a.e/1a.h and 8a.d/8a.e/8a.h
      siblings across 2023/2024/2025 and asserting the filler rejects the
      two keys, plus a network-marked test that reads the official blanks
      and asserts the two widgets really are the only ReadOnly ones and
      that no mapped sched_d field is ReadOnly.
      THE DISCRIMINATOR is the durable rule and it is year-invariant, so it
      lives here and not in a year pack: "greyed + ReadOnly" alone decides
      NOTHING. Read the widget's own printed row off the blank and place it
      in one of four classes. (1) The widget already HOLDS an IRS-printed
      constant: sched_se lines 7 and 14 ship the wage base and the
      optional-method cap inside the widget ($176,100 / $7,240 for 2025) and
      f1040es's four voucher rows ship the printed instalment due dates —
      never map one, or the filler overwrites the form's own figure.
      (2) The printed text makes a correct entry IMPOSSIBLE: sched_d rows
      1a/8a print "...leave this line blank and go to line 1b" right where
      column (g) sits; sched_e's four "Totals" rows are read only by a
      following line that names the OTHER columns ("30 Add columns (h) and
      (k) of line 29a", "31 Add columns (g), (i), and (j) of line 29b");
      sched_nec's loss cells print "Losses aren't allowed". Drop the line
      key so fill_form raises instead of writing a locked box. (3) A
      printed, numbered or lettered line that merely reads "Reserved for
      future use": KEEPING it mapped with a leave-blank comment is what
      makes the revision that un-reserves the line a widget swap instead of
      an API change — f1040 line 30 went live in 2025 as "Refundable
      adoption credit from Form 8839, line 13" and f1040-X line 4a became
      the QBI deduction in Rev. 12-2025, and in BOTH cases the IRS cleared
      the ReadOnly bit on the very same widget. Excluding it is defensible
      too, when nothing on the printed face names the line. What is never
      defensible is the flag-only rationale "the field is read-only, so the
      printed line takes no entry" — that is the exact premise this pitfall
      overturned, and several pack headers still state it. (4) A STATE DOR
      field whose value the form's own JavaScript owns: a running total, a
      carried subtotal, a page-2/3/4 name and SSN header mirror. taxfill
      never executes that JavaScript, so an unmapped one ships BLANK on the
      filed return — these MUST stay mapped. Class 4 is by far the largest
      in the repo and a federal-only audit never sees it.
      WHAT WAS ADJUDICATED (2026-08-20: four parallel printed-text reviews,
      then one fresh sweep of all 140 packs — federal and state — against
      their cached blanks). Excluded as class 2: sched_e 2023/2024/2025, the
      nine shaded "Totals" cells per year (29a.g/29a.i/29a.j, 29b.h/29b.k,
      34a.c/34a.e, 34b.d/34b.f — widgets Page2[0].f2_35/37/38/41/44/60/62/
      65/67[0], /Ff 8388609, exactly 9 of the blank's 185, identical in all
      three years); each pack went 185 -> 176 fields. On sched_e verify did
      not merely fail to catch the bad artifact, it CERTIFIED it: with the
      nine keys mapped, verify_form returned nine PASSing assertion checks
      for digits sitting in locked grey boxes and an EMPTY clipping section.
      Excluded as a reserved line nothing names: f1040x 2023/2024 line 4a
      plus its .original/.net_change pair (their shared pinned Rev. 2-2024
      blank prints "4a Reserved for future use", printed line 5 is "Subtract
      line 4b from line 3", and no relation, calc op, cross_form rule or
      extractor in the repo produces or consumes it — while the same packs
      already excluded lines 9/24/26/28/29, which print the identical
      sentence); 145 widgets = 127 mapped + 18 unmapped reserved. KEPT
      MAPPED as class 3, with leave-blank comments plus printed-text and
      /Ff proof written into the headers: f1040 2023/2024 line 30, f1040nr
      2025 lines 1i/1j/6/27, sched_a 2025 line 8d. CORRECTION to this
      entry's own earlier text: the 2025 f1040x does NOT exclude line 4a and
      must not — Rev. 12-2025 relabelled that line "Qualified business
      income deduction", cleared the ReadOnly bit on the same three widgets
      and names 4a in the printed line-5 formula. That false parenthetical
      propagated out of this registry into an agent's task briefing as a
      "critical extra fact", which is why the cross-year story is now a
      table row rather than prose.
      STILL OPEN, and now pinned by tests so none of it can go quiet.
      (a) The class-3 question is answered INCONSISTENTLY, and the split
      runs along pack authorship rather than the printed face: 13 federal
      bindings keep a reserved line mapped while about thirty exclude one —
      f1040nr 2022/2023/2024 exclude 1i/1j/6/27 (and 30) that the 2025 pack
      keeps, sched_a 2023/2024 exclude the identical 8d the 2025 pack keeps,
      sched_2 2023 excludes reserved line 19 while sched_2 2025 keeps
      reserved line 10, and sched_3 2023/2024/2025 exclude 6e on the
      flag-only rationale. Settling it needs the 2022-2024 pack owners; the
      2023/2024 f1040nr and sched_a headers additionally describe these
      ReadOnly widgets as "fillable", as does sched_1 2023's note on line
      22. (b) The verify blind spot — CLOSED 2026-09-23 for the clipping
      scan. verify.py's clipping scan used to SKIP every ReadOnly text
      widget on the premise "the filler never writes them", which every
      class-3 and class-4 mapping falsifies — including Wisconsin's
      ReadOnly page-2/3/4 SSN mirror cells (maxlen 3/2/4) — so the P-001
      check was structurally blind to the exact field shape P-001 exists
      for. It now scans a ReadOnly widget when the pack BINDS its name
      (bound_widget_names, exported from taxfill_core) and, inside
      verify_form / verify_filing, only while its value DIFFERS from the
      same widget's value on the pack's sha-pinned blank (read from the
      local blank cache, never downloaded; with no cached blank every mapped
      ReadOnly widget is scanned and each FAIL says to run fetch_blank).
      That blank comparison is load-bearing: the first cut (2026-09-11)
      scanned every bound widget and FAILed P-001 on every real one-line
      AL-40 2023 / MO-1040 2023 / 2024 fill (12 / 5 / 5 FAILs where the old
      verifier said ok=True), because those packs mapped DOR instruction
      panels and checkbox captions as lines — a class-1 error (the widget
      already holds the form's own text) that the golden round trips cannot
      see, since their sentinels overwrite every mapped widget. Those 22
      banners, and MO-1040's empty Text1 checkbox frame, are unmapped
      (STATE_COMPUTED_READONLY al40 580 -> 568, mo1040 262 -> 256 and
      260 -> 254). Regression tests:
      packages/core/tests/test_verify_readonly_scan.py (bound vs unbound;
      the blank-owned skip in both verify paths; a rewritten banner is
      scanned again; the no-blank fallback and its note; no download; no
      resurrection through the pack-maxlen fallback) and
      packages/core/tests/test_verify_readonly_sweep.py (for every pack with
      a cached blank, a one-line fill verifies with zero clipping FAILs and
      no mapped ReadOnly widget's blank text already clips; the AL/MO
      reproduction in both verify paths; the banners re-mapped to prove the
      verifier half alone, with its empty-cache control; the unmapped keys
      refused by fill_form). The sweep's first run caught one more
      pre-existing false FAIL of the same kind — WV IT-140 2023's seven
      untouched state-picker combos hold five spaces under a maxlen-2 hint —
      so a whitespace-only value is no longer a clipping candidate
      (test_verify.py). STILL OPEN from (b): fill_form writes ReadOnly
      widgets with NO warning and audit_pack.py's synthetic_values fills
      them, so the audit renders print sentinels inside locked boxes. The
      engine-side fix — a `reserved:` marker on the field, or driving
      fill_form and synthetic_values off the allowlist, with a warning when
      a value is supplied for one — is roadmap work (JEa), not a pack edit,
      as is unmapping the same-shape captions the AL-40 and MO-1040 counts
      still carry (txtMultiScheduleD/E; the 28 printlid.* lids,
      ProtectBarcode, amendedTXT, 1040_30Text, line51txt, vendorid), which
      fit their boxes and so never FAIL. (c) formpacks/CONVENTIONS.md has NO rule about ReadOnly
      widgets or reserved lines (zero hits for readonly / read-only /
      reserved), so this discriminator is discoverable only from here and
      from individual pack headers — plausibly how the sched_a split arose.
      THE GENERIC REGRESSION TEST lives in
      packages/core/tests/test_readonly_widget_mapping.py and replaces the
      per-pack audits that kept missing packs: it sweeps EVERY discovered
      pack, federal AND state, and asserts a mapped field binds a ReadOnly
      widget only where an explicit, per-entry-justified table allows.
      RESERVED_LINE_KEEPS pins the 13 federal keep bindings as (pack, line,
      widget, why) rows — the offline layer proves each row still describes
      its pack, the network layer proves mapped-intersect-ReadOnly equals
      the table EXACTLY in both directions (so a new binding and a stale row
      both fail), and a second network test re-extracts the PRINTED ROW TEXT
      on the widget's own baseline and requires it to still read "Reserved
      for future use", so a line going live forces its row out instead of
      being rubber-stamped. RESERVED_LINES_UNMAPPED pins the exclusions
      (f1040x 4a and 9/24/26/28/29, sched_3 6e, sched_2 2023 line 19,
      sched_c 2022 line 27b, and the contested f1040nr / sched_a years) with
      fill_form-refuses-the-key assertions and surviving-sibling over-reach
      guards; test_reserved_line_tables_agree_about_every_contested_line
      then makes a cross-year claim impossible to assert in prose alone — it
      is the check that would have caught the false 4a parenthetical.
      STATE_COMPUTED_READONLY pins the class-4 bindings per pack by COUNT
      with a per-pack reason (1,390 across 11 packs as of 2026-09-23: al40
      568, ga500 193, mo1040 256 / 254, wv it140 51, de pit_res 16, wi form1
      15, oh it1040 12 / 13, ri1040 6 / 6), because a per-widget list of
      that many names would be a rubber stamp while the count
      still fails the moment a port grows it. The flag reader itself is
      proven offline against a synthetic PDF whose /Ff sits on the TERMINAL
      FIELD dict (the real IRS shape): without that, an annotation-only
      reader would report an empty ReadOnly set for every pack and every
      network assertion would silently pass. Two class-4 curiosities worth
      remembering: Ohio's CHK_AMD ("AMENDED RETURN - Check here") and
      CHK_SP_NON_RES_STMT, and Georgia's CB_DEDUCTION_TYPE selector, carry a
      bare /Ff = 1 on /Btn boxes the printed face requires the filer to
      answer, each while its own sibling box carries no /Ff at all — an
      asymmetry that reads as a DOR authoring slip, not an instruction.

  - id: P-008
    incident: >-
      The Schedule E packs (2023, 2024 and 2025) gave their three Yes/No
      questions — Part I question A ("Did you make any payments in <year>
      that would require you to file Form(s) 1099?"), question B ("If
      'Yes,' did you or will you file required Form(s) 1099?") and Part II
      line 27 (the at-risk / prior-year-unallowed-loss question) — NO
      `group` id, so nothing made the two boxes of one question mutually
      exclusive. Reproduced end to end on the 2024 blank, not theorised:
      fill_form(pack, {"a.yes": True, "a.no": True, "27.yes": True,
      "27.no": True}) returned with zero warnings, a re-read of the PDF
      showed all four widgets at their on-states (c1_1[0]=/1, c1_1[1]=/2,
      c2_1[0]=/1, c2_1[1]=/2), a 400-dpi render of page 1 printed question
      A with BOTH "Yes" and "No" ticked, and verify_form's checkbox_audit
      returned an EMPTY check list — the return was internally
      contradictory and every gate passed it. The cause is a topology gap,
      not a typo. These are not radio groups: each Yes/No pair is TWO
      independent terminal /Btn fields (c1_1[0] + c1_1[1]) with no shared
      parent, no /Ff radio bit, its own /V, and one appearance state each
      (/1 Yes, /2 No) — identical in all three years' blanks, and
      byte-for-byte the same shape as sched_8812's line 12/19/20 pairs,
      which DO carry group ids. The pre-existing gate
      (test_pack_radio_options_share_one_group_and_distinct_states) only
      fires when two checkbox lines SHARE one AcroForm field, so it never
      saw these; and verify's checkbox_audit only audits an ungrouped box
      when it is `required`, which none of them is. sched_e was the lone
      federal outlier — every other pack with a Yes/No question already
      grouped it (sched_c uses payments_1099_required / payments_1099_filed
      for the very same 1099 question). Inherited by the 2024 and 2025
      ports from the 2023 base, which had 0 group keys.
    countermeasure: >-
      All three sched_e packs now carry group ids on all three questions —
      question_a, question_b (f8316's convention for a LETTERED question;
      bare "a"/"b" would collide with this pack's .a/.b/.c property-column
      suffixes) and line27 (sched_8812's "line<N>" form) — so fill_form's
      group guard rejects a double answer before it opens the blank and
      verify's at-most-one checkbox audit FAILs an already-both-checked
      PDF. `required` is deliberately left off all six lines: A and B
      belong to Part I and 27 to Part II, so a filer using only the other
      Parts leaves them blank, and marking one would FAIL verification on
      every legitimately blank Schedule E. The at-most-one check applies to
      every group regardless of `required`, which is the whole point. The
      DURABLE rule is pack- and year-invariant, so the regression test is
      generic rather than sched_e-shaped: test_formpacks_federal.py's
      test_every_yes_no_pair_shares_one_group_id keys off LINE SHAPE
      ("<stem>.yes" + "<stem>.no") instead of shared field, and runs over
      every discovered pack — the check that would have caught this. Two
      sched_e-specific tests pin the group ids, the separate-widget
      topology and the /1,/2 states against a future port, assert no member
      became `required`, and prove the guard both rejects Yes+No and still
      accepts a single answer. Open follow-up, deliberately NOT fixed here:
      that generic sweep found the SAME defect in sched_d 2023/2024/2025 (4
      questions each — qof, 17, 20, 22; all separate-widget pairs, zero
      group keys). sched_d is under concurrent P-007 work and each question
      needs its own printed-face read to settle the group id and the
      `required` question, so the 12 pairs sit in
      KNOWN_UNGROUPED_YESNO_PAIRS — an allowlist that fails the moment a
      pair IS grouped, forcing the stale entry out, so the debt cannot go
      quiet.

  - id: P-009
    incident: >-
      The knowledge-gap pattern for the fourth time, and this one was the most
      expensive: the packs shipped the FIGURES for retirement accounts (the IRA
      limit, the Roth and deductible-IRA MAGI phase-outs, the 6% excess excise)
      and calc shipped ira_contribution_eligibility to police them — while
      NOTHING in the repo modeled IRC 408(d)(2), the rule that decides how much
      of a conversion is actually taxable. The one question a backdoor-Roth
      filer has, "where can I roll my old 401(k)?", had no deterministic answer
      at all: the agent had to do Form 8606 Part I by hand. Two specific traps
      sat inside that gap.
      (1) The DENOMINATOR of the nontaxable ratio: Form 8606 line 9 = line 6
      (Dec-31 value of every traditional/SEP/SIMPLE IRA) + line 7 (distributions
      not converted) + line 8 (the amount converted) — it ADDS THE CONVERSION
      BACK, so converting a bigger slice never dilutes the pretax share.
      Reasoning from "I converted the nondeductible dollars" instead gets the
      answer wrong by the whole pretax fraction: e.g. (demo numbers) on a
      $42,000 pretax pool plus a $6,000 nondeductible contribution, converting
      $6,000 is $5,250 taxable (ratio 6,000/48,000 = 0.125), not $0 — and
      iterating that same backdoor for ten years against the polluted pool
      costs about $9,904 of tax at 32% that a clean pool would never have
      owed. (2) The two Roth-conversion PATHS get
      conflated: a DIRECT rollover from a 401(k)/403(b) to a Roth IRA is fully
      taxable on its pretax part but pro-rata never reaches it (no individual
      retirement plan is involved, and it is reported on Form 1040 line 5a/5b,
      not Form 8606) — that is the only way to empty an old plan WITHOUT
      poisoning every future backdoor conversion, and treating it as an IRA
      conversion loses exactly that.
      The sources registry had the same hole, reproduced before the fix:
      get_sources("Form 8606"), ("pro rata rule") and ("nondeductible IRA
      basis") were clean misses, and get_sources("nondeductible contributions")
      routed to Pub 526 + Form 8283 — CHARITABLE-contribution substantiation, a
      wrong-law pointer of exactly the P-005 "Schedule NEC" / P-006 "qualified
      parking" kind.
    countermeasure: >-
      Calc ops ira_pro_rata and roth_conversion (Phase I, I1) with golden
      regression tests in packages/core/tests/test_tax_calc.py that pin the
      demo worked example, including the ten-year iteration total and the
      clean-pool case that proves a plan-to-Roth-IRA rollover leaves future
      backdoor conversions fully non-taxable. roth_conversion REFUSES to guess
      the path (`source` is required) and REFUSES traditional-IRA arguments on
      the plan path, so the conflation cannot happen silently; it also returns
      the bracket headroom (which conversion dollars spill into the next rate)
      and the IRC 1411 crossing, because conversion income is never itself net
      investment income (1411(c)(5) excludes distributions from 401(a), 403(a),
      403(b), 408, 408A and 457(b) plans) yet it raises the MAGI the threshold is
      measured against — the trap that makes a conversion cost 3.8% on OTHER
      income. get_sources now routes the authority via topic
      ira_basis_and_roth_conversions (Form 8606 + its instructions, Pub 590-A,
      Pub 590-B, Notice 2008-30, Notice 2014-54) with routing regression tests in
      test_sources.py, including the "nondeductible contributions" wrong-law case
      and a neighbour-theft guard proving the new topic does not swallow
      "foreign pension distributions" (it did, on the first draft, until the
      answers text stopped saying "Pension Protection Act").
      THE DURABLE RULES ARE YEAR-INVARIANT, so they live HERE and in the ops'
      work strings, never in a year pack (only the contribution limits and
      phase-out ranges are figures). (1) IRC 408(d)(2): "all individual
      retirement plans shall be treated as 1 contract", "all distributions during
      any taxable year shall be treated as 1 distribution", the value is measured
      at the close of the calendar year, and "the value of the contract shall be
      increased by the amount of any distributions during the calendar year" —
      that last clause IS Form 8606 line 9. Which dollars physically moved is
      irrelevant; a Roth IRA, a 401(k)/403(b) and an inherited IRA are all
      OUTSIDE the pool. (2) The pool is PER PERSON: Form 8606's own header is "If
      married, file a separate form for each spouse required to file", so a
      spouse's traditional IRA never enters your ratio. (3) TIMING: line 6 is the
      DECEMBER 31 value, so an amount rolled into a traditional IRA in December
      pollutes the ratio for a conversion done the previous January; and line 4
      keeps a contribution made between January 1 and April 15 of the following
      year OUT of this year's numerator while line 14 still carries it forward.
      (4) A conversion is IRREVERSIBLE — Pub 590-A: "No recharacterizations of
      conversions made in 2018 or later" — and each one starts its own 5-year
      section 72(t) clock (Notice 2008-30 A-3, section 408A(d)(3)(F)).
      (5) WITHHOLDING: tax withheld from a conversion is not converted, so it is
      Roth space that cannot be replaced, and Pub 590-A's Table 1-5 applies the
      10% additional tax to the taxable part "including an amount equal to the
      tax withheld" that isn't rolled over — pay from OUTSIDE funds. A direct
      plan-to-Roth-IRA rollover escapes the 20% mandatory withholding of section
      3405(c) (Notice 2008-30 A-6); a 60-day rollover does not, and an IRA
      distribution defaults to 10% unless the filer elects out.
      A SEPARATE DEFECT THIS WORK CAUGHT, fixed in the same pass:
      knowledge/federal/2026.yaml carried tax.niit
      qualifying_surviving_spouse = $200,000 — the only shipped year that did
      (2019-2025 all carry $250,000), evidently copied from the
      additional_medicare_tax block sitting immediately above it, where QSS
      really is $200,000. That 8959-vs-8960 asymmetry is the whole reason the
      schema makes all five statuses explicit instead of aliasing QSS to the MFJ
      column, and the two authorities are unambiguous: IRC 1411(b)(1) ("in the
      case of a taxpayer making a joint return under section 6013 or a surviving
      spouse (as defined in section 2(a)), $250,000") and the Line 14 threshold
      table in the Instructions for Form 8960 (2025) ("Qualifying surviving
      spouse $250,000"). It overstated a 2026 QSS filer's NIIT by up to 3.8% x
      $50,000 = $1,900 and nothing saw it: the pre-existing QSS test ran on 2023
      only, and test_surtax_blocks_ship_for_every_supported_year swept
      2019-2024 using the SINGLE column. The durable fix is the sweep that was
      missing — test_the_qss_surtax_asymmetry_holds_for_every_shipped_year in
      test_tax_calc.py pins BOTH forms' QSS bucket for every shipped year, so
      neither block can drift into the other's value again.
      BOTH HALVES SHIPPED TOGETHER (2026-08-26), which is what makes the chain
      usable end to end: ira_pro_rata returns every computed Part I / Part II
      value in `form_8606_lines` keyed by the form's printed line label, and
      formpacks/federal/{2023,2024,2025}/f8606 turn those into a filled, verified
      and rendered page (fill_form / verify_form / render_form), with the ops as
      verify's independent-recompute source. Neither half is much use alone — a
      pack without the ops has nothing to recompute against, and the ops without
      a pack cannot produce a filed page — so check both
      formpacks/federal/<year>/f8606 and KNOWN_FORM_KEYS in
      test_formpacks_federal.py before promising a year.
      One engine defect the pack half exposed, FIXED in the same change:
      verify's _identity_checks took the UNION of every pack's identity_fields
      and then evaluated each name against every pack that merely MAPPED it. Form
      8606's page-1 address block prints "Fill in Your Address Only if You Are
      Filing This Form by Itself and Not With Your Tax Return", so on the
      ordinary ATTACHED path it is correctly blank — and that blank was compared
      against the parent return's real address, so verify_filing([f1040nr,
      f8606]) returned ok=False on a perfectly correct filing. A pack that maps a
      line without DECLARING it in its own identity_fields is no longer compared
      when its value is blank; a non-blank value still is, so P-002's protection
      is unchanged.

  - id: P-010
    incident: >-
      An HSA contribution can be silently disallowed in full by a health FSA
      the filer never thinks of as coverage — including a SPOUSE's. IRC
      223(c)(1)(A)(ii) makes a person eligible only if they have no health
      coverage other than an HDHP, and a general-purpose health FSA is such
      coverage: Publication 969 states that a spouse's general-purpose FSA
      "would generally disqualify you from having an HSA" because it can
      reimburse YOUR expenses, even if you are not enrolled in it and never
      use it. The trap is that eligibility is tested MONTH BY MONTH on the
      first day of each month, so a plan year that overlaps by even one month
      zeroes that month's chart amount — and the grace period of a
      general-purpose FSA extends the disqualification past the plan year's
      end (223(c)(1)(B) carve-outs cover only a LIMITED-PURPOSE or
      post-deductible arrangement). Every dollar contributed for a
      disqualified month is an excess contribution carrying the IRC 4973 6%
      per-year excise until it is withdrawn, and nothing on Form 8889's
      printed face asks about an FSA — line 1 asks only for the HDHP coverage
      tier, so a filer with a disqualifying FSA fills the form out
      "correctly" and still owes the excise. This is the same shape as P-005
      and P-006: a year-invariant CHARACTERIZATION rule that decides whether
      a figure applies at all, with the figures themselves shipping fine.
    countermeasure: >-
      calc.hsa_deduction takes `health_fsa` ('none' | 'general_purpose' |
      'limited_purpose' | 'post_deductible') and refuses prescriptively rather
      than returning a confidently wrong limit: a general-purpose FSA (the
      filer's OR the spouse's) makes the op REFUSE rather than compute, and the
      error names both the law (Rev. Rul. 2004-45, and 223(c)(1)(B)(iii) for
      the grace period) and the fix — drop the FSA-covered months out of
      monthly_coverage, or reduce months_eligible — because only the caller
      knows WHICH months overlapped. A limited-purpose or post-deductible
      arrangement is accepted under 223(c)(1)(B) with the Rev. Rul. situation
      quoted in the work, and the other-coverage gate is stated in the work
      even when no FSA is passed at all, since it is the silent disqualifier. The op's monthly
      chart makes the partial-year case visible instead of collapsing it into
      an annual figure, and its `input_assumptions` field surfaces the
      months_eligible shorthand's year-end placement, which is what silently
      turns a mid-year FSA overlap into a last-month-rule answer. The
      contribution_limits blurb, which previously said only "Payroll HSA
      dollars also avoid FICA", now names the FSA disqualification and the
      monthly proration alongside the corrected FICA tier ladder, so an agent
      reading the limit alone is told the two facts that make the annual
      number wrong on its own. Regression tests in test_tax_calc.py cover the
      general-purpose refusal (including that the message names the SPOUSE's
      employer), the limited-purpose and post-deductible acceptances, and the
      gate being stated even on a no-FSA call.

  - id: P-011
    incident: >-
      The knowledge-gap pattern a fifth time, and this one sat on the single most
      common international fact in an otherwise-domestic return. Every holder of a
      total-international index fund has foreign tax withheld at source — it
      arrives in Form 1099-DIV box 7 — and NOTHING in the repo modeled it:
      sched_3 had shipped line 1 ("Foreign tax credit (Form 1116)") for 2023,
      2024 and 2025 with no Form 1116 pack behind it, so a filer with $412 of
      withheld foreign tax could not assemble a complete return at all, and no
      calc op could say whether the form was even needed. The decisive rule is
      IRC 904(j): a filer may ELECT to claim the credit directly on Schedule 3
      with NO Form 1116 when creditable foreign taxes are $300 or less ($600 in
      the case of a joint return) and every dollar of foreign-source gross income
      is qualified passive income shown on a payee statement. That is the
      difference between a one-line entry and a four-part, three-country-column
      form, and it was unmodeled in both directions.
      The sources registry had the same hole, and it was the widest wrong-law
      routing found so far. Reproduced against the 2023 registry before the fix:
      get_sources("foreign tax credit") routed to foreign_earned_income — Form
      2555, the EXCLUSION, which is the ALTERNATIVE treatment of foreign income,
      so the pointer sends an agent to exclude income it should be crediting tax
      on; ("foreign taxes withheld") routed to nonresident_fdap, the 30% the US
      withholds FROM a nonresident, the exact mirror image of tax a foreign
      country withheld from a US person; ("1099-DIV box 7") routed to
      ira_basis_and_roth_conversions, P-009's own new topic swallowing it;
      ("904(j)") routed to tax_rates_and_tables, the section 1 rate schedules;
      ("de minimis election") routed to commuter_and_fringe_benefits, the de
      minimis FRINGE; and ("Form 1116"), ("passive category income") and
      ("foreign tax credit without filing Form 1116") were clean misses. Five
      wrong-law pointers and three misses, all of the P-005 "Schedule NEC" /
      P-006 "qualified parking" kind.
      Three traps sat inside the gap. (1) THE ELECTION IS NOT FREE, and every
      plain-language summary of it says only "no Form 1116 needed":
      904(j)(1)(B) and (C) forbid carrying foreign tax OUT OF an election year
      and INTO one, so the 904(c) 1-year-back / 10-year-forward carryover is
      forfeited in both directions — and because 904(j)(1)(A) turns the 904(a)
      limitation off while the Instructions still cap the entry at "the smaller
      of (a) your total foreign tax, or (b) your regular tax", foreign tax above
      regular tax is not deferred, it is lost outright. (2) ONE NON-PASSIVE
      DOLLAR ENDS IT for the whole year regardless of how small the tax is:
      904(j)(2)(A) requires "the ENTIRE amount of such individual's gross income
      for the taxable year from sources without the United States" to be
      qualified passive income, so $12 of withheld tax alongside any foreign
      wages, foreign self-employment income, foreign rent or a section 951A
      inclusion still forces Form 1116. (3) THE $600 IS CONDITIONED ON "A JOINT
      RETURN", not on the joint RATE column, and calc's own
      _resolve_filing_status maps qualifying_surviving_spouse onto the
      married_filing_jointly column — correct for rates and wrong here, because a
      surviving spouse borrows the joint rate schedule (IRC 1(a)(2) via 2(a))
      without filing a joint return. Routing QSS through that helper would have
      doubled the ceiling for a filer entitled to $300.
    countermeasure: >-
      Calc op foreign_tax_credit_election (Phase I, I4) plus form pack
      formpacks/federal/2023/f1116, with golden regression tests in
      packages/core/tests/test_tax_calc.py covering BOTH sides of the branch —
      the same $412 of 1099-DIV box 7 tax electing on a joint return and needing
      Form 1116 on a single one, the "does not exceed" boundary at exactly $300
      and $600, the per-status ceiling table that pins QSS and MFS at $300, the
      year-invariance of the figures across all seven shipped year packs, and
      every condition failing on its own. The op REFUSES to guess the two
      judgment facts (all_foreign_income_passive, all_reported_on_payee_statement
      have no default and their error messages name the statute and the way out)
      and reports election_available and election_made SEPARATELY, because
      904(j)(2)(C) is the taxpayer's own act and a filer who qualifies may still
      prefer Form 1116 when there is an excess credit worth carrying. Its
      election_costs field is populated on the ELECTING path too, so the answer
      can never be presented as free, and it quantifies the two concrete losses
      when the caller supplies the inputs: credit_lost_to_regular_tax_cap, and
      the carryover forfeited if excess_credit_if_form_1116 is passed.
      THE DURABLE RULES are year-invariant and live HERE, not in a year pack.
      (a) The election's conditions are all-or-nothing and are about
      CHARACTERIZATION, not size: every foreign-source dollar passive
      (904(j)(2)(A) with 904(d)(2)(B), plus high-taxed income and certain export
      financing interest per the Instructions), every item AND its tax shown on a
      payee statement (904(j)(3)(A)/(B), the term taken from section 6724(d)(2) —
      Form 1099-DIV, Form 1099-INT, Schedule K-1 (Form 1041), Schedule K-3 (Form
      1065), Schedule K-3 (Form 1120-S) or a substitute), and no estates or
      trusts (904(j)(3)(D): "This subsection shall not apply to any estate or
      trust"). (b) The election waives NEITHER creditability (IRC 901/903 still
      decide, including 901(k)'s minimum holding period on dividend withholding)
      NOR the Form 1116 line 12 reduction, which is subtracted BEFORE the
      $300/$600 test. (c) Only the $300/$600 amounts are figures, and they are
      statutory and NOT indexed — 904(j) was added by P.L. 105-34 (1997) with no
      inflation-adjustment provision, and each year's own Instructions for Form
      1116 from 2019 through 2025 were independently confirmed to restate the
      same two numbers — so they ship in each year pack's
      credits.foreign_tax_credit block with a per-year citation rather than
      hardcoded in calc.py.
      get_sources now routes the authority via topic foreign_tax_credit (IRC 904
      and IRC 901 on uscode.house.gov, Form 1116, its instructions, Pub 514, and
      the IRS Foreign Tax Credit page) with routing regression tests in
      test_sources.py covering all five wrong-law cases and all three misses, and
      a neighbour-theft guard proving the new topic does not swallow
      foreign_earned_income's queries ("Form 2555", "foreign earned income
      exclusion", "physical presence test") — the nearest neighbour, since the
      credit and the exclusion are alternative treatments of the same income —
      nor P-009's deliberate "foreign pension distributions" clean miss.
      One thing the f1116 pack could NOT check and which is reported rather than
      hidden: verify's relation tokenizer accepts only `\d+[a-z]?` and a bare
      identifier as operands, so a DOTTED line key cannot appear in a relation at
      all. Form 1116's printed per-column math ("c Add lines 3a and 3b", "Total
      (Add cols. A, B, and C.)", "(u) ... add cols. (q) through (t)", "8 Add
      lines A through C, column (u)") is therefore unchecked, exactly as it is on
      sched_d, sched_e and f8949; the pack names every unchecked formula in its
      relations block so the gap is visible.

  - id: P-012
    incident: >-
      Two defects in the Phase I4 foreign-asset half, both found by RUNNING the
      code rather than reading it, and both in the direction that loses money.
      (1) THE ELICITATION SILENCED ITSELF ON A DOMESTIC ACCOUNT NUMBER. The new
      intake question income_documents.foreign_accounts repeats until the
      document inventory records an answer, and the matcher that decides
      "recorded" accepted the bare three digits "114" (FinCEN Form 114's number)
      anywhere in the entry's free-text `kind`. Because an agent routinely writes
      an account number into `kind`, "Chase checking acct 1145 statement" and
      "1099-INT acct 1140023" both read as a recorded foreign-account answer:
      reproduced, the question — the steepest-penalty question in the whole
      interview, guarding a non-willful FBAR penalty that starts at $10,000 and
      is inflation-adjusted to $16,536 for penalties assessed on or after
      2025-01-17 (31 CFR 1010.821, Table 1) — was SUPPRESSED for a filer with a
      purely domestic bank statement, and the companion note fired at the same
      time telling that filer to e-file an FBAR for a US account. One loose token
      thus produced a false negative and a false positive simultaneously.
      (2) A REGULATORY PRECONDITION WAS MISSING FROM EVERY LAYER. Treas. Reg.
      1.6038D-2(a)(7)(i), read on the eCFR text: a specified person, "including a
      specified individual who is a bona fide resident of a U.S. possession, is
      not required to file Form 8938 with respect to a taxable year if the
      specified person is not required to file an annual return with the Internal
      Revenue Service with respect to such taxable year." Nothing in the repo
      carried it — zero hits across knowledge/, calc.py and the f8938 pack
      headers — so calc.foreign_asset_reporting answered REQUIRED for a filer
      below the IRC 6012 filing threshold however large the assets. Over-
      reporting is the safer error, but it is still a wrong verdict from a form
      the op quotes a $60,000 penalty ladder for, and the FBAR is NOT subject to
      the same precondition (it is not part of the income tax return), so the two
      answers legitimately diverge exactly where the op said they agreed.
      (3) A TRUE CLAIM WAS HUNG ON A PINPOINT THAT DOES NOT SUPPORT IT, found by
      opening the cited page rather than re-reading the YAML. Both the
      foreign_account_reporting.fbar.threshold_note (all eight federal knowledge
      years) and the fincen114 worksheet banner (all three years) proved "the
      $10,000 does not vary by filing status" by quoting the irs.gov FBAR page:
      "Income tax filing status, such as married-filing-jointly and
      married-filing-separately, has no effect." Fetched and read IN PLACE, that
      sentence sits inside the JOINTLY-OWNED-ACCOUNTS spousal exception — it
      directly follows "...your spouse reports the jointly owned accounts on a
      timely-filed signed FBAR" — and governs qualification for THAT exception,
      not the threshold. The claim is right (31 CFR 1010.306(c) states one flat
      figure and no status variant exists anywhere in 1010.350 or FinCEN's
      instructions), which is what made the bad citation survive review: nothing
      about the sentence looks wrong until you read what precedes it.
    countermeasure: >-
      (1) _mentions_foreign_account now matches the form number ONLY in the
      spellings that name the FORM ("FORM114", plus the already-distinctive
      "FINCEN", "FBAR" and the 4-digit "8938" — the _mentions_dependent_care
      "2441" precedent), never as loose digits, with the reasoning written at the
      function so the next author does not re-loosen it. THE DURABLE RULE is
      year-invariant and lives here: a document-inventory matcher keys off
      FREE TEXT an agent writes, so every token must be long enough that a
      customer's account number, a routing number or a neighbouring form number
      cannot collide with it — a 3-digit form number never qualifies, and the
      failure is SILENT because a suppressed question leaves no trace in the
      checklist. (2) calc.foreign_asset_reporting's work string now states the
      1.6038D-2(a)(7)(i) precondition verbatim with the cite, says that a
      REQUIRED verdict is conditional on a return being required at all, and says
      that the FBAR is unaffected by it. (3) The threshold_note now argues from
      the ABSENCE of any status variant in 31 CFR 1010.306(c) / 1010.350 and
      FinCEN's instructions, states outright that the irs.gov sentence is NOT a
      threshold statement, and keeps the quote only for what it does say — that
      filing status does not decide whether one spouse may file a single FBAR
      covering both. THE DURABLE RULE, year-invariant and therefore here: a
      quotation is verified by reading the sentences AROUND it, not by matching
      its text on the page. A search that finds the words confirms only that the
      words exist; scope lives in the neighbours, and a truncated quote whose
      proposition happens to be true is the hardest citation defect to see.
      Regression tests in packages/core/tests/test_foreign_assets.py, all
      P-012-tagged and always run: three domestic `kind` spellings that must NOT
      record the answer (asserting BOTH that the question survives and that the
      note stays silent), four form spellings that must still record it (so the
      tightening cannot go too far and leave the question unstoppable), a
      per-year assertion that the op's work string carries the (a)(7)(i) text
      alongside a REQUIRED verdict for all three shipped pack years, and — over
      ALL EIGHT shipped federal years plus all three worksheet years — that the
      filing-status claim is grounded in the regulation's silence and flags the
      irs.gov sentence as out of scope, with the claim itself
      (threshold_varies_by_filing_status false, aggregate_threshold 10000) still
      asserted so the correction cannot quietly weaken it.

  - id: P-013
    incident: >-
      THE ESTIMATOR WARNED ABOUT A RULE INSTEAD OF APPLYING IT, AND THE WARNING
      WAS THE ONLY PLACE THE RULE LIVED. For every nonresident filer with any
      interest entered, estimate_refund taxed the whole amount as effectively
      connected ordinary income and appended one sentence — "US bank deposit
      interest is typically NOT taxable to a nonresident ... this estimate may
      OVERTAX it" — with no amount, no way to enter the character that decides
      the question, and a pinpoint ("IRC 871(i)") loose enough that get_sources
      could not route it: "871(i)" resolved to foreign_tax_credit and "bank
      deposit interest nonresident" to other_income_and_rewards (the BANK-BONUS
      topic), both wrong-law pointers of the P-005/P-006 kind. Meanwhile the
      1099-INT DocSpec note (N-8's extraction half) told the agent the box-1
      figure was probably not income, so the agent was handed a number the
      engine would then tax and a warning that it might be wrong — the exact
      shape the knowledge-gap pattern describes: the figure ships, the
      year-invariant characterization rule does not. On the repo's own user
      base (F-1 / J-1 students with a US checking account) the interest is
      almost always deposit interest, so the "may OVERTAX" hedge was in
      practice a systematic overstatement of tax owed. The rule, read on the
      .gov texts (2026-09-11): IRC 871(i)(1) "No tax shall be imposed under
      paragraph (1)(A) or (1)(C) of subsection (a) on any amount described in
      paragraph (2)"; 871(i)(2)(A) "Interest on deposits, if such interest is
      not effectively connected with the conduct of a trade or business within
      the United States"; 871(i)(3) "deposits" means deposits with persons
      carrying on the banking business, deposits or withdrawable accounts with
      savings institutions chartered and supervised as savings and loan or
      similar associations (to the extent deductible under section 591), and
      amounts held by an insurance company under an agreement to pay interest
      (uscode.house.gov). Pub 519 ch. 3, Exclusions From Gross Income —
      Interest Income: "Interest income that is not connected with a U.S. trade
      or business is excluded from income if it is from" the same three
      classes (irs.gov/publications/p519). Instructions for Form 1040-NR
      (2025), line 2b Exception 1: "Report on line 2b only your taxable
      interest income from assets effectively connected with a U.S. trade or
      business"; Exception 3: "Don't include on line 2b interest from a U.S.
      bank, savings and loan association, credit union, or similar institution
      (or from certain deposits with U.S. insurance companies) that is exempt
      from tax under a tax treaty or under section 871(i) because the interest
      isn't effectively connected with a U.S. trade or business"; Schedule NEC
      lines 2a-2c list the same interest among items "generally exempt from the
      30% tax" (irs.gov/instructions/i1040nr). And the companion trap
      (N-14): the exclusion ends with the §6013(g)/(h)
      ELECTION, not the marriage — Pub 519 ch. 1, Nonresident Spouse Treated as
      a Resident: "If you make this choice, you and your spouse are treated for
      income tax purposes as residents for your entire tax year."
    countermeasure: >-
      IncomeSnapshot.bank_deposit_interest (packages/core/src/taxfill_core/
      estimate.py): an OPTIONAL subset of `interest` (default 0, validator
      bank_deposit_interest <= interest, summed in combined_with_spouse), whose
      field description carries the three pinpoints. _bottom_line excludes it
      from income BEFORE "Total income" for a nonresident — a registered
      explanatory ledger slot, deposit_interest_exclusion, so status/scenario
      diffs stay total — and switches the exclusion OFF when the candidate
      status is married_filing_jointly, because a nonresident is on a joint
      return only through the §6013(g)/(h) election that makes both spouses
      residents; that path records a note the caller turns into a disclosure.
      estimate_refund replaced the "may OVERTAX" sentence with four
      disclosures that each name an amount (the fourth, the spouse-taxed note,
      is rule (e)'s): the dollars EXCLUDED with the
      871(i)(1)/(2)(A)/(3), Pub 519 ch. 3 and 1040-NR line 2b Exception 3
      pinpoints; the dollars entered WITHOUT deposit character and taxed as
      effectively connected income, with the way to move them (except on the
      election posture, a confirmed married_filing_jointly status: there that
      note says instead that the character no longer matters, because telling
      the filer "871(i)(2)(A) excludes it — rerun" would contradict rule (c).
      The J0.4 regression test found this, 2026-09-23); and, on the election
      posture, the dollars taxed again with the Pub 519 ch. 1 sentence. The
      1099-INT DocSpec status_note (extract.py) now names
      IncomeSnapshot.interest and IncomeSnapshot.bank_deposit_interest, so the
      extraction half gives the agent the field that carries the character,
      not only a warning. intake_checklist asks income_documents.interest_character
      once, for a CONFIRMED nonresident whose inventory holds a 1099-INT not
      yet carrying the word DEPOSIT in its kind (the answer is recorded in the
      entry's kind, either way — the 1095-A / foreign-account convention; the
      form matcher is "1099INT", seven characters naming the FORM, per P-012).
      get_sources routes the authority through nonresident_fdap, which now
      carries the IRC 871 statute on uscode.house.gov and the Pub 519 ch. 3 /
      ch. 1 sentences, with routing regression tests in
      packages/core/tests/test_sources.py for "bank deposit interest
      nonresident", "871(i)" and "871(i) deposit interest", and two
      neighbour-theft guards. The bank-bonus queries ("bank account bonus
      income") still reach other_income_and_rewards. The spouse-election
      queries ("spouse treated as resident", "nonresident spouse treated as a
      resident", "6013(g)", "6013(h)", "married to a nonresident alien",
      "married nonresident alien", "spouse election", and "married to
      nonresident" at least sharing) still reach nonresident_spouse_election.
      The second guard is there because the first J0.4 draft of the fdap text
      quoted the Pub 519 ch. 1 heading, "§6013(g)/(h)" and "nonresident
      alien", and those tokens stole every one of those queries from the page
      that says HOW to elect. So the fdap text states rule (c) without them
      (J0.4 verifier, 2026-09-23). THE DURABLE RULES are year-invariant and live
      HERE, not in a year pack: (a) the exclusion is about CHARACTER, not
      amount or payer name — deposit + not effectively connected; interest that
      IS effectively connected stays taxed under 871(b), and bond, brokerage
      and Treasury interest (1099-INT box 3) are not deposits and fall under
      the separate 871(h) portfolio-interest rules, which are NOT modeled. So
      no surface may tell a nonresident that non-deposit interest simply IS
      taxed; the intake question's `why` did until J0.4 added the 871(h)
      caveat; (b)
      only a characterized amount is excluded — an uncharacterized figure is
      taxed and SAID to be, never silently excluded on the guess that a
      student's interest is probably from a bank; (c) the exclusion turns on
      residency status, so the §6013(g)/(h) election — never the marriage —
      ends it, and an MFJ figure for a nonresident must tax the interest; (d) a
      disclosure that says "may OVERTAX" without an amount is a defect, not a
      caveat: when the engine knows the rule and the input that decides it, it
      models the rule and discloses the amount; (e) the exclusion belongs to
      the PAYEE, so on the two-return MFS path the spouse's own return gets it
      only when the spouse's OWN facts classify nonresident — the J0.4
      verifier caught the spouse borrowing the taxpayer's classification, which
      excluded a US-citizen spouse's deposit interest on a Form 1040 where it is
      taxable ($440 understated in its repro); a spouse whose residency is
      unknown is taxed on it with a disclosure, the rule (b) no-guessing shape.
      What is NOT modeled and is
      reported rather than hidden: the reverse direction (a resident
      taxpayer's nonresident spouse) gets neither the exclusion nor a
      disclosure, and intake asks interest_character on the taxpayer's status
      only (JF5a/JF5b); the spouse's MFS return still borrows the taxpayer's
      nonresident flag for every OTHER rule (no standard deduction, ordinary
      rates, no NIIT) — so the FDAP note covers every return computed under
      those rules, not only the exclusion's payees (JF5a); a compare_scenarios
      us_resident_election on an MFS status still applies the exclusion (only
      the MFJ gate is modeled); and compare_scenarios' one-override-at-a-time
      walk rejects an intermediate step where interest drops below
      bank_deposit_interest (list the subset field first — the same pre-existing
      shape as qualified_dividends / dividends); estimate_refund classifies residency from
      the visa timeline and day counts alone, so an election scenario built by
      compare_scenarios (which flips identity.us_person) leaves `nonresident`
      True on a profile that carries a timeline — the MFJ gate here is what
      keeps the exclusion honest on that path, while the other NRA rules
      (itemized-only deduction, no NIIT) still run under the election there.
      Regression tests, P-013-tagged: packages/core/tests/test_estimate.py
      (excluded when characterized, the ledger line and the disclosure amount;
      partial characterization taxes only the remainder and says so; resident
      control unchanged; uncharacterized interest taxed with the note; the
      confirmed-MFJ election posture taxes it and says why, with the MFS
      control keeping it and the election variant of the uncharacterized
      note; the compare_scenarios election path; the validator; the spouse
      combine; the payee rule — a nonresident spouse keeps their own
      exclusion, a US-citizen spouse is taxed, an unconfirmed marriage never
      inflates the disclosed amount; the 1099-INT DocSpec note naming the
      field; and test_fix2's
      check that no "OVERTAX" text remains), packages/core/tests/test_intake.py
      (asked for a confirmed nonresident with a 1099-INT, silent for a
      resident and for a characterized entry, and — the P-012 rule — a
      1099-INT carrying an account number still asks), and
      packages/core/tests/test_sources.py (routing, the topic's
      characterization text, and neighbour theft on both the bank-bonus and
      the spouse-election side).
  - id: P-014
    incident: >-
      hand_fill_worksheet ticked the box for a "no". Its checkbox branch shared
      the text branch's test (`str(provided).strip() != ""`, then
      `shown = "X" if ln.type == "checkbox"`), so every non-empty answer
      rendered a ticked "X" with source 'entered' — including "no", False
      (whose str is "False") and "0". Reproduced on the clean HEAD a233031 by
      the Phase J review (PJ-05): hand_fill_worksheet(ct1040 2023,
      {"filing_status.single": "no", "filing_status.mfj": False,
      "filing_status.hoh": "yes"}) returned 'X' on all three, and on the
      FEDERAL FBAR pack (fincen114 2025, {"third_party_filing": "no",
      "account1_15a": False, "44a": "0"}) it returned 'X' on all three. Scope:
      the 8 checkbox lines in each of the fincen114 2023/2024/2025 packs (the
      third-party-filer question, the five per-account "amount unknown" boxes,
      and the item 44 / 44a signature boxes), plus ct1040 (14), nm pit1 (18),
      hi n11 (5) and sc1040 (19). A filer who answered no was told to tick the
      box, on the FBAR keyed into the BSA E-Filing System or on the printed
      state return. The AcroForm filler had the right rule all along
      (filler._checkbox_state reads a bool, an int 0/1 or a fixed yes/no word
      list, and refuses anything else); the second rendering path never used
      it. The same code had a second defect of the same kind: a money line
      whose value rounds to Decimal('-0') (a computed 0.2 - 0.6, or 0 times a
      negative) printed as "-0".
    countermeasure: >-
      handfill._checkbox_checked reads a checkbox answer with
      _CHECKBOX_ON_WORDS / _CHECKBOX_OFF_WORDS — a COPY of the filler's sets,
      because the hand-fill path deliberately never imports the filler — and
      takes bool and int 0/1 exactly as the filler does. Anything else raises a
      ValueError that names the line and its label and passes the answer
      through redact() (a short word such as 'maybe' is echoed as typed, an
      SSN-shaped id or a run of 6+ digits is masked). A "no" renders an empty
      box (value '', source 'blank'), and an omitted or None line is left blank,
      as for money and text lines. _fmt_money turns a rounded zero into an
      unsigned 0. THE DURABLE RULE covers every path that turns a checkbox
      answer into a mark — AcroForm /V + /AS, the hand-fill worksheet, and any
      future overlay or stamp renderer: each reads the answer with the ONE
      yes/no vocabulary and refuses what it does not recognise, and none ever
      tests truthiness or non-emptiness, because either test makes "no" a
      tick. Regression tests, P-014-tagged, in
      packages/core/tests/test_handfill.py: the yes, no and refused answers
      (each parametrized) and the redaction of a refused answer;
      test_checkbox_vocabulary_matches_the_acroform_filler, which pins the copy
      to the filler's sets and to _checkbox_state's outcome on every
      vocabulary word and on bool/int/float inputs so the two cannot drift;
      test_fbar_no_answer_leaves_every_box_empty once per FBAR year;
      test_every_shipped_checkbox_line_honours_no, a sweep over every shipped
      handfill.yaml (all boxes answered no/False/"0"/"off" come back empty,
      all answered yes come back "X"); and
      test_money_zero_never_renders_as_negative_zero.
  - id: P-015
    incident: >-
      Form line numbers were typed into engine text as string literals, so one
      string served every tax year while the IRS renumbers lines between
      revisions. The knowledge packs carried each year's dollar figures but not
      the year's line numbers, the repo's knowledge-gap pattern again. At the
      JF6a baseline (2026-09-24) the guard found 135 occurrences in 114
      (module, scope, literal) rows: calc.py 118 in 97 rows, server.py 8,
      estimate.py 5 and intake.py 4. Two shapes hid from the first cuts of the
      guard. One was a year branch typed inside an f-string replacement field,
      calc.excess_ss's "(Schedule 3{', line 10 in 2020' if year == 2020 else
      ' line 11'})", which read as "{}". The other was a line number moved out
      of the string into a Python year table, calc._capital_loss_1040_line
      ('7a' if year >= 2025 else '7'), rendered at three sites (two as "Form
      1040 line {...}", one as "Form 1040, 1040-SR, or 1040-NR, line {...}"). It is wrong for 2019, whose Schedule D line 21 goes to Form
      1040 line 6, and the ROADMAP regex cannot see it. Reading the
      faces for just five keys showed two literals the engine prints today to
      be wrong, and a third line with no literal that is right for every
      year. The treaty text (the estimate_refund treaty_exempt_income description and its
      assumption, the calc and server treaty_benefit docs) says "Form 1040-NR
      line 1k" for every year, but the 2019 Form 1040-NR prints the line as 22
      and the 2020 and 2021 faces print it as 1c. calc.additional_medicare_tax
      says employer box-6 excess withholding "credits against this via Part
      IV", but Form 8959's Withholding Reconciliation is Part V on every face
      from 2019 to the 2026 draft, and the 2026 draft also moves self-employment
      from Part II to Part IV. And the resident-alien treaty destination that
      JF1a must print, Schedule 1's other-income line, is "8" on the 2019 and
      2020 faces and "8z" from 2021, so no single literal is right for every
      shipped year. The same five keys show the drift in both directions: the
      Form 1040 line that takes Form 8959's withholding total is 17 in 2019 and
      25c from 2020.
    countermeasure: >-
      Every federal pack (2019-2026) carries a TOP-LEVEL form_lines block keyed
      '<form>.<role>' (sched1.other_income, f1040nr.treaty_exempt,
      f8959.withholding_part, f1040.additional_medicare_withholding,
      sched_se.ss_wages for JF6a; JF6b and JF6c add the rest). Each entry is a
      typed knowledge.FormLineEntry holding the bare printed designator, a
      line_source of 'final' or 'draft Created <M/D/YY>' copied from the
      draft's footer, the face url, the read date and a printed quote that must
      show the designator. A form or line that does not exist in a year is
      recorded with line null and an absent reason rather than left out. The
      schema refuses a draft entry that does not cite an irs-dft face, a final
      entry that does not cite that year's own irs-prior/<form>--<year>.pdf
      face (never irs-pdf/<form>.pdf, which names no year and serves whatever
      revision is current), and any draft entry in a filing-grade pack. Engine
      text renders a line
      through knowledge.form_line(pack_or_year, key), which raises FormLineError
      (a LookupError, so estimate.py's except-ValueError blocks cannot swallow
      it) for an unknown year, a missing block, a missing key or an absent-by-
      face line, and appends "(<year> DRAFT form — re-verify at final)" to a
      draft entry; form_line_entry returns the bare entry for keying data. The
      block is registered with the sources-coverage meta-test through the new
      form_line_numbers topic, which also ends the routing of
      get_sources("form line numbers"), ("which line") and ("line number") to
      the Form 8606 topic. THE DURABLE RULE: a line number is read off the
      year's own printed face, never typed into engine text and never carried
      from a neighbouring year; a draft's number is projection-grade until JT6
      re-reads it on the final. Regression tests, P-015-tagged, in
      packages/core/tests/test_form_lines.py: the per-year values for all five
      keys against their faces (2020 is '8', 2021 is '8z', the 1040-NR line is
      22 / 1c / 1k), the draft suffix, the unknown-year and unknown-key errors,
      the absent-entry and cache paths, the schema refusals, and the GUARD. The
      guard parses calc.py, estimate.py, intake.py and server.py and runs the
      ROADMAP regex over every text each string expression can render: a
      plain string, a docstring, and an f-string (its format specs too),
      ternary, `or` or `+` built from literals, with each arm of a branch
      rendered in turn. A second rule, LINE_FIELD_RE, flags the same prefixes
      before a line number that is not typed at all: an f-string field other
      than a form_line(...) call, a .format() template field or a positional
      %-format. That catches a literal hoisted into a constant, a dict or a
      helper. A companion test refuses any def, assignment, import, parameter,
      except-as or match-pattern binding of the names form_line and knowledge
      in the guarded modules (one frozen exception: calc.py's Schedule 1-A line
      helper parameter, which JF6b renames), so a local name cannot launder a
      table value through a trusted field. Known gaps, not enforced: a named
      %-format, a literal split across a join, a letter appended after a
      trusted field, a capitalised "Line" or a newline before "line", and
      every prefix outside the ROADMAP regex (Schedule D / SE / C / 8812,
      Forms 8606 / 1116 / 8960 — about 50 literals today); JF6c widens the
      prefixes once the rewiring has shrunk the debt. No function body and no call's
      arguments are skipped, since a form_lines key has no space and cannot
      match. The guard compares the hits with FORM_LINE_DEBT, the frozen
      baseline of 114 (module, scope, literal) rows covering 135 occurrences.
      Probes pin each shape in every guarded module. A new literal fails
      test_no_new_form_line_literal_in_engine_text, and a row whose literal is
      gone fails test_form_line_debt_rows_still_match_the_source, so the list
      only shrinks (JF6b empties the calc.py rows, JF6c the rest). The face
      re-read, face_quote_problems, checks the NUMBER as well as the words,
      because a renumbered line keeps its words. The designator must be the
      first token after the labelling quote on the face, where pypdf puts the
      right-margin entry box, or inside the quote for a Part. Every other
      printed piece must be on the face, and a draft's Created stamp must
      still be in its footer. Offline tests on verbatim face excerpts prove it
      fails on the 2019 Schedule 1 line recorded as 8z, the 2020 Form 1040-NR
      line recorded as 1k and the 2020 Form 1040 line recorded as 25b, with
      the words unchanged. A network-marked test runs it on every entry's
      face.
  - id: P-016
    incident: >-
      Every treaty text in the engine sent the filer to Schedule OI item L and
      the Form 1040-NR treaty-exempt line: the estimate_refund
      treaty_exempt_income description and its assumption, the calc module
      docstring for treaty_benefit and the server tool doc. That is a
      nonresident's destination. A resident alien who keeps a treaty benefit
      through a saving-clause exception (typically a student, trainee or
      researcher article whose exception survives after the exempt-individual
      years end and the substantial presence test is met) files Form 1040,
      which has no Schedule OI. Pub 519 (2025) ch. 9,
      "Resident Aliens", says to "Enter the amount for which treaty benefits
      are claimed, in parentheses, on Schedule 1 (Form 1040)", on its
      other-income line, with "Exempt income," the name of the treaty country,
      and the treaty article. That line is "8" on the 2019 and 2020 faces (Pub
      519 (2020): "in parentheses on line 8, Schedule 1 (Form 1040)") and "8z"
      from 2021, so a single literal could not have been right for every year
      either. A resident-classified profile was told to use a schedule its
      return does not have.
    countermeasure: >-
      The destination is branched on the residency classification and every
      line is rendered through knowledge.form_line from the year's own
      form_lines block (P-015). estimate.estimate_refund's treaty assumption
      (_treaty_reporting_text) reads: resident (a computed 'resident'
      classification, or none computed while the profile declares a US
      person, the profile the roadmap already routes to Form 1040) — in
      parentheses on Schedule 1 line form_line(year, 'sched1.other_income')
      (Schedule 1 (Form 1040), other income), with "Exempt income", the
      country and the article, a saving-clause exception being the way a
      resident generally keeps the benefit (Pub 519: resident aliens
      "generally do not qualify") and no Form 8833 being needed for a
      student, trainee or teacher article (Pub 519 ch. 9, exception 2);
      nonresident — Schedule OI
      item L and Form 1040-NR line form_line(year, 'f1040nr.treaty_exempt');
      a dual-status candidate or an unknown residency — both, framed
      conditionally. Pub 519 ties the resident's two entries together: "if
      the income has been reported as taxable income on a Form W-2, Form
      1042-S, Form 1099, or other information return, you should report it on
      the appropriate line" and then enter the amount claimed in parentheses,
      so the resident text pairs them (the parenthetical offsets that
      inclusion) and says income left off the return ("In certain cases, you
      don't need to report the income") is not also subtracted. A profile
      reaching the resident branch only by declaring a US person is told "Form
      1040", not "a resident alien's", with the caveat that a US citizen is
      generally outside the treaty: the saving clause "preserves or "saves"
      the right of the United States to tax its citizens and residents", and
      every shipped pack's student and teacher exception excludes citizens.
      calc.treaty_benefit gains resident_alien (True / False / None), which
      changes no number and appends the same three-way REPORTING sentence to
      the work whenever something is exempt. That sentence points at the
      saving-clause exception "quoted above" only when the applied block
      records one; the Canada Art. XV de-minimis block records none (the
      irs.gov text's Art. XXIX(3) lists Art. XX, not Art. XV), so a resident is
      told the pack records NO exception, that a resident generally cannot
      claim it, and gets the Form 1040 line only as conditional on an
      exception the caller confirms. Treaty limits are treaty-fixed, so a year
      with no form_lines block (no federal pack) keeps the split and names the
      line in words instead of raising FormLineError or guessing a number. The
      treaty_exempt_income description, the calc module docstring, the
      server's treaty_benefit and estimate_refund docs and SKILL.md say that
      the destination turns on residency without typing a line number, and
      the four FORM_LINE_DEBT rows for the typed "Form 1040-NR line 1k" are
      deleted. THE DURABLE RULE: a treaty exemption is reported where the
      filer's own return reports it — Schedule OI for a Form 1040-NR, Schedule
      1's other-income line in parentheses for a Form 1040 — and the line is
      read off that year's face. Regression tests, P-016-tagged, in
      packages/core/tests/test_estimate.py (a resident-classified 2025 profile
      gets "Schedule 1" and "8z" and no "1040-NR line 1k", a 2020 one gets
      "Schedule 1 line 8" and no "8z", a declared US person is
      routed to Form 1040 with the citizen caveat, the resident note pairs the
      parenthetical with the information-return inclusion, an unclassified visa holder and a dual-status
      year get both, and the nonresident assertion is unchanged) and in
      packages/core/tests/test_treaties.py (resident_alien True / False / None
      on 2020 and 2025, a draft suffix on 2026, nothing appended when nothing
      is exempt, a non-bool refused, the Canada Art. XV resident path naming
      the missing exception with no "(quoted above)", the information-return
      pairing, and 2018 / 2027 answered with the line named in words).
  - id: P-017
    incident: >-
      Four use sites told the agent that bonuses are withheld at the FLAT 22%
      and to "project 22% x bonus": the estimated_tax_safe_harbor work and
      docstring, the SupplementalWithholdingParams docstring, the server's
      estimated_tax_safe_harbor doc and SKILL.md. The flat rate is the
      employer's option and it has preconditions. Treas. Reg.
      31.3402(g)-1(a)(7)(i): "The employer may determine withholding upon
      supplemental wages under this paragraph (a)(7) if three conditions are
      met", (B) "The supplemental wages are either not paid concurrently with
      regular wages or are separately stated on the payroll records of the
      employer" and (C) "Income tax has been withheld from regular wages of
      the employee during the calendar year of the payment or the preceding
      calendar year" (Pub 15 (2026) section 7 reads (C) as the employer's own
      withholding: "If you withheld income tax from an employee's regular
      wages"). Otherwise (a)(6)(i) requires the aggregate procedure (Pub 15:
      "use method 1b"): the bonus is added to the regular wages and withheld as
      one payment under the employee's Form W-4. Only the excess of one
      employer's supplemental wages for the year over $1,000,000 is
      mandatorily withheld at the top rate ((a)(2)). Hire status is not the
      test, and on a large bonus the two methods can differ by thousands of
      dollars, so a projection built on "22% x bonus" can be wrong in either
      direction.
    countermeasure: >-
      The 2025 and 2026 supplemental_withholding blocks (Pub 15 (2025) and Pub
      15 (2026) section 7 re-read 2026-09-25, their items 1-2 identical; eCFR
      31.3402(g)-1, last amended 2020-10-06) carry flat_rate_optional: true,
      flat_rate_conditions (the (B) and (C) quotes, verbatim, each with its
      pinpoint), conditions_citation (the eCFR section), method_if_conditions_fail:
      aggregate, the (a)(6)(i) aggregate_rule sentence, Pub 15's
      employer_fallback ("use method 1b") and the (a)(2) mandatory_rate_rule.
      All are REQUIRED fields of knowledge.SupplementalWithholdingParams, and
      its validator refuses a block whose conditions omit (B) or (C), so no
      year can ship the rate without its preconditions. The safe-harbor work
      renders its withholding-realism paragraph from those fields
      (calc._supplemental_withholding_note): the flat rate as an OPTION under
      31.3402(g)-1(a)(7)(i) with both conditions quoted, the aggregate
      fallback, the $1,000,000 mandatory rate, "hire status is not the test",
      and the instruction to project bonus withholding by the method the
      employer actually uses (the pay stub). No op computes the aggregate
      figure until JP1c ships one, and the work says so. The same rule reaches
      the op docstring, the calc module docstring, the params docstring, the
      server doc and SKILL.md; the unconditional "withheld at the FLAT 22%
      regardless of your marginal rate" sentence and "Project
      expected_withholding as 22% x bonus" are gone. THE DURABLE RULE: never
      state the flat supplemental rate without its two conditions and the
      aggregate fallback. Regression tests, P-017-tagged, in
      packages/core/tests/test_projection_ops.py: the 2025 and 2026 works
      carry "31.3402(g)-1(a)(7)(i)", "separately stated" and "aggregate" and
      not the old sentence, the pack fields load with both quotes, and the
      schema refuses a block missing (C), a non-(a)(7)(i) pinpoint or an
      optional flag other than true.
