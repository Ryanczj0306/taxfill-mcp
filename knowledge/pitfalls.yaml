# Known-pitfall registry (docs/DEV_PLAN.md, section 10).
#
# Every bug found in real use becomes (a) a permanent verifier rule,
# (b) a regression test, and (c) where applicable, an intake-question fix.
# Verify reports list each pitfall as PASS/FAIL so agents and users see the
# self-check happening. Contributors must add an entry here with every bug
# fix (enforced in the PR template).
#
# Schema — each entry:
#   id:             stable identifier (P-###)
#   incident:       what actually went wrong
#   countermeasure: the permanent fix (verifier rule / regression test / intake fix)

pitfalls:
  - id: P-001
    incident: >-
      SSN truncated on 1040-NR: a dashed SSN (e.g. "000-00-0000", 11 chars)
      written into a 9-cell comb field, last 2 digits clipped — invisible in
      field dumps, caught only by rendering.
    countermeasure: >-
      Clipping scan on every filled field; "format: ssn_digits_only" on comb
      fields; render+vision pass mandatory before "done".

  - id: P-002
    incident: >-
      User supplied historical address; bills would have gone to an old
      apartment.
    countermeasure: >-
      Intake disambiguation (current-mailing vs historical); verifier warns
      when return address differs from the user-confirmed current address,
      or matches an address whose date range ended. Shipped in M1: the
      cross-form address consistency check, plus the
      confirmed_current_address parameter on verify_form/verify_filing that
      FAILs when the on-disk address differs from the address the user
      confirmed they receive mail at TODAY. Deferred to M3 intake: flagging
      an address whose intake date range ended (needs the state-footprint
      date ranges from the interview).

  - id: P-003
    incident: >-
      Required Yes/No checkboxes silently unanswered (8843 line 12,
      Sched OI item I).
    countermeasure: >-
      Required-checkbox audit: any required group fully "/Off" fails
      verification.

  - id: P-004
    incident: >-
      Treaty benefit nearly mis-scoped on a status-change year (F-1 to H1B
      still eligible for student-period income).
    countermeasure: >-
      Treaty eligibility is evaluated per visa PERIOD, never per year:
      residency.py flags the F-1 -> H-1B mid-year split with tests, the
      estimate carries the agent-confirmed amount via treaty_exempt_income
      (with article/state-conformity disclosures and a P-004 regression
      test), Schedule OI + the 1040-NR 1k == sched_oi.1e cross-form rule
      enforce the reporting chain, and get_sources routes treaty authority
      lookups. A full per-country treaty knowledge base (articles, amounts,
      eligibility predicates) remains roadmap work — until then the amount
      is the agent's recorded position, like itemized deductions.

  - id: P-006
    incident: >-
      A real session asked what a commuter benefit covers. The engine could
      quote the MONTHLY CAPS (contribution_limits' commuter_132f block) but
      shipped nothing about what QUALIFIES, so eligibility had to be
      researched from scratch — and get_sources("qualified parking")
      mis-routed to obbba_schedule_1a_deductions (the token "qualified"
      pulling toward the OBBBA topic), a wrong-law pointer of the Schedule
      NEC kind. Two live misconceptions surfaced in the same session: an
      employer that DIRECT-DEPOSITED the monthly caps to an employee's
      checking account with no substantiation while excluding the amounts
      from Form W-2, and the assumption that EV charging (or fuel, tolls,
      mileage) can be run through the benefit.
    countermeasure: >-
      The eligibility RULES are year-invariant and live here; only the
      monthly caps are figures (they stay in the year packs). (1) Qualified
      transportation fringes are an EXHAUSTIVE list of three: a ride in a
      commuter highway vehicle (6+ adults excluding the driver, 80% of
      mileage commuting), a transit pass, and qualified parking. Vehicle
      ENERGY is never among them — fuel and EV charging are as ineligible
      as tolls and mileage. (2) Qualified parking is parking on or near the
      employer's business premises, or on or near the place the employee
      commutes from by transit/vanpool/carpool; parking at or near the
      employee's HOME is expressly excluded. Free employer parking leaves
      nothing to shelter. (3) A bona fide reimbursement arrangement
      requires the employee to INCUR AND SUBSTANTIATE the expense BEFORE
      reimbursement, and cash reimbursement for transit passes is barred
      wherever a transit-only voucher is readily available; amounts failing
      these tests are wages subject to income and employment taxes, not an
      exclusion. (4) Cash and cash equivalents can never fall back on the
      de minimis exclusion. get_sources now routes the authority via topic
      commuter_and_fringe_benefits (Pub 15-B's Transportation (Commuting)
      Benefits section, 26 CFR 1.132-9 Q-16..Q-22, Rev. Rul. 2014-32, and
      the de minimis page), with routing regression tests in
      test_sources.py including the "qualified parking" neighbour-theft
      case. Year-varying note carried by the sources entry: P.L. 119-21
      permanently eliminated the qualified bicycle commuting exclusion for
      tax years beginning after 2025.

  - id: P-005
    incident: >-
      A bank's annual "engagement bonus" (a credit-card-fee reimbursement)
      was nearly characterized from its label alone: reward-shaped payments
      pattern-match to "credit card rewards are not taxable" (the
      purchase-price-rebate doctrine, Rev. Rul. 76-96 lineage), but a bonus
      for OPENING or MAINTAINING an account is taxable other income the
      bank reports (1099-MISC box 3 / 1099-INT) even when styled as a
      reimbursement — and for a nonresident it can land in the Schedule NEC
      30%-FDAP corner instead of a resident's Schedule 1. The sources
      registry had no topic for either half, so the characterization came
      from the agent's head, and "Schedule NEC" mis-routed to the OBBBA
      Schedule 1-A deduction page (a wrong-law pointer, worse than a miss).
    countermeasure: >-
      The characterization rule is year-invariant and lives HERE, never in
      a year pack: rewards earned by spending = rebate, not income; a bonus
      for opening/maintaining an account = other income; in-kind travel
      promotional benefits sit under Announcement 2002-18's no-enforcement
      line UNLESS converted to cash. get_sources now routes the authority —
      topics other_income_and_rewards (Pub 525 Other Income + the Cash
      rebates paragraph; Announcement 2002-18) and nonresident_fdap
      (Pub 519 ch. 4 "The 30% Tax", the IRS FDAP and ECI pages, the
      Schedule NEC instructions, Form 1042-S) — with routing regression
      tests in test_sources.py including the Schedule NEC neighbour-theft
      case. Only the statutory 30% rate (IRC 871(a)) and any treaty
      other-income article rate are figures — and the five treaty packs now
      carry verbatim-verified other_income blocks (calc op treaty_benefit,
      income_class other_income): China Art. 21(3), India Art. 23(3) and
      Canada Art. XXII(1) carve US-arising items back to source-state
      taxation, Mexico Art. 23 is source-state-only in form, and Korea
      (1976) verifiably has NO other-income article — so US-arising other
      income gets NO treaty reduction under any shipped treaty.
