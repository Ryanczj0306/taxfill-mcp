# Form 1099-R box 7 (2026: box 7a) distribution codes — Table 1, Guide to Distribution Codes, of the
# Instructions for Forms 1099-R and 5498, transcribed 2026-09-27 from the 2019, 2023, 2024, 2025 and
# 2026 revisions (irs.gov/pub/irs-prior/i1099r--YYYY.pdf; 2026: irs.gov/pub/irs-pdf/i1099r.pdf) by
# word coordinates and read row by row against the page (Phase J JR1). YEAR-INVARIANT with revision
# markers: `since` is the first revision carrying a code, `used_with` the codes it may pair with in
# every revision, `used_with_from` a later revision's additions, `title_until` an older wording kept
# through the named year. Titles are templates: {year} is the form's tax year, {prior_year} the one
# before. The pairing relation is symmetric in every revision (the loader asserts it). A year between
# two transcribed revisions whose tables agree (2020-2022, between 2019 and 2023) takes their table.
revisions: [2019, 2023, 2024, 2025, 2026]
rules:
  max_codes: 2
  numeric_pairs: [["1", "8"], ["2", "8"], ["4", "8"]]
  standalone: ["Q", "T"]
  quotes:
    max_codes: "Enter a maximum of two alphanumeric codes in box 7a. See Table 1 for allowable combinations."
    numeric_pairs: "Only three numeric combinations are permitted on one Form 1099-R: Codes 8 and 1, 8 and 2, or 8 and 4."
    standalone: "Do not combine code Q or T with any other codes."
    ira_box: "Do not check the box for a distribution from a Trump account, from a Roth IRA that is not a Roth SIMPLE IRA, or for an IRA recharacterization."
    ira_box_until_2024: "Do not check the box for a distribution from a Roth IRA or for an IRA recharacterization."
    recharacterization: "Enter the fair market value (FMV) of the amount recharacterized in box 1, -0- (zero) in box 2a, and code R in box 7a if reporting a recharacterization of a prior-year (2025) contribution or code N if reporting a recharacterization of a contribution in the same year (2026)."
    direct_rollover: "Report a direct rollover in box 1 and a -0- (zero) in box 2a, unless the rollover is a direct rollover of a qualified rollover contribution other than from a designated Roth account."
    code_y: "When using code Y, you must use either code 4, 7, or K."
    box_2b: "If the first box is checked, the payer was unable to determine the taxable amount and box 2a should be blank, except for a traditional IRA or traditional SIMPLE IRA."
    box_7d: "Enter the total amount of earnings on the amount of excess contributions distributed from a Trump account that is entered in box 1."
  citation:
    source: "Instructions for Forms 1099-R and 5498 (2026), Box 7a. Distribution Code(s), Box 7b, Box 7d, IRA recharacterizations, Reporting a direct rollover, and Table 1"
    url: "https://www.irs.gov/instructions/i1099r"
