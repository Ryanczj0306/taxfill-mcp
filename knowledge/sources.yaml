# Authoritative source registry (docs/dev/DEV_PLAN.md, section 7).
#
# Tax law moves faster than any shipped knowledge pack, so the repo ships
# "where truth lives" as data and the skill enforces a freshness protocol:
# for any tax year newer than the newest shipped knowledge pack, or any
# benefit a pack does not cover, the agent MUST resolve it via these URLs
# (web search restricted to .gov first), record the citation in
# RECONCILIATION.md, and refuse to fill any line whose authority it cannot
# cite. Blogs/Reddit are never authority — at most leads to a .gov citation.
#
# Schema — every entry:
#   url:     official source URL (.gov / .treasury.gov only)
#   answers: what questions this source resolves
#   cadence: when/how often it updates
#
# Coverage rule: no topic may exist in a knowledge pack or be used by a
# position decision without an entry here backing it. The federal by_topic
# keys below cover every top-level block a federal knowledge pack ships
# (rate schedules & tax table, standard deduction, SE tax, filing thresholds,
# payment options, mailing addresses, deadlines, credits) PLUS the broader
# section-7 areas of individual tax law (charitable, SALT, medical, casualty,
# dependent care, investment income & basis, retirement, AMT, estimated tax).
# A topic block named in a pack maps to the by_topic key of the same area;
# the coverage meta-test (test_knowledge_m3.py) fails if any pack block lacks
# a backing entry here.
#
# Every URL below was web-verified (WebFetch/WebSearch) to resolve to the
# stated official IRS/.gov page before being committed. A nightly CI job
# (planned — DEV_PLAN section 7) re-fetches these URLs and flags drift
# (moved pages, new form revisions); state blocks ship with each state
# knowledge pack in M5.

federal:
  by_topic:
    # JF2.4 (2026-09-27): the statement differs by choice — IRC 6013(g) attaches it to
    # the joint return "for the first tax year for which the choice applies" (a later
    # year of a continuing election attaches none), IRC 6013(h) to the joint return
    # "for the year of the choice" (Pub 519 ch. 1, read 2026-09-27).
    nonresident_spouse_election:
      - url: https://www.irs.gov/individuals/international-taxpayers/nonresident-spouse
        answers: "IRS 'Nonresident spouse' page: the section 6013(g)/(h) election to treat a nonresident-alien spouse as a resident — the worldwide-income consequence (\"S and T must report their worldwide income for the year they make the choice and for all later years unless the choice is ended or suspended\"), suspension/ending, and the ITIN/W-7 requirement for a nonresident spouse."
        cadence: standing page (re-check each filing season)
      - url: https://www.irs.gov/publications/p519
        answers: >-
          Pub 519 ch. 1, how each spouse election is made. Nonresident Spouse
          Treated as a Resident (IRC 6013(g)): "attach a statement, signed by
          both spouses, to your joint return for the first tax year for which
          the choice applies" — a later year of a continuing 6013(g) election
          attaches none. The choice for a couple who "were nonresident aliens
          at the beginning of the tax year" and residents at its end (IRC
          6013(h)): "attach a statement signed by both spouses to your joint
          return for the year of the choice"; "Neither you nor your spouse can
          make this choice for any later tax year".
        cadence: annual (per tax year)
    # ── Filing baseline & logistics (back the pack's filing/payment/where-to-file blocks) ──
    filing_basics:
      - url: https://www.irs.gov/publications/p17
        answers: >-
          Pub 17, Your Federal Income Tax: filing requirements, filing
          status, dependents, income types, standard deduction — the
          general-individual baseline.
        cadence: annual (per tax year)
      # JF2 (2026-09-27): "amended return" was a five-way tie on the lone token
      # "return" and, once the IRA topic landed, a wrong pointer to it.
      - url: https://www.irs.gov/forms-pubs/about-form-1040x
        answers: >-
          About Form 1040-X, Amended U.S. Individual Income Tax Return — the
          amended return, filed to correct an individual income tax return
          already filed (or to make certain elections after the deadline); it
          can be filed electronically "for the current or two prior tax
          periods".
        cadence: standing page (re-check each filing season)

    filing_thresholds:
      - url: https://www.irs.gov/publications/p501
        answers: >-
          Pub 501, Dependents, Standard Deduction, and Filing Information:
          Table 1 / Chart A gross-income filing-requirement amounts by status
          and age, the standard deduction amounts, and dependent-return rules.
        cadence: annual (per tax year)

    standard_deduction:
      - url: https://www.irs.gov/publications/p501
        answers: >-
          Pub 501: base standard deduction per filing status and the
          additional amounts for being 65-or-older / blind (per condition,
          per person), with the unmarried vs married amounts.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/irb
        answers: >-
          Internal Revenue Bulletin: the annual inflation-adjustment Revenue
          Procedure (e.g. Rev. Proc. 2022-38 for 2023) — the authoritative
          source for that year's standard-deduction and bracket figures.
        cadence: annual (the inflation Rev. Proc. issues each autumn)

    tax_rates_and_tables:
      - url: https://www.irs.gov/irb
        answers: >-
          Internal Revenue Bulletin: the annual section 1(j)(2) rate-schedule
          Revenue Procedure (e.g. Rev. Proc. 2022-38) — the tax brackets for
          the year: each tax bracket's boundaries and marginal rate.
        cadence: annual (the inflation Rev. Proc. issues each autumn)
      - url: https://www.irs.gov/instructions/i1040gi
        answers: >-
          Instructions for Forms 1040 and 1040-SR: the published Tax Table
          (mandatory below $100,000) and the Tax Computation Worksheet
          (at/above $100,000) for the line 16 tax computation.
        cadence: annual (per tax year)

    self_employment:
      - url: https://www.irs.gov/forms-pubs/about-schedule-se-form-1040
        answers: >-
          Schedule SE (Form 1040), Self-Employment Tax: net-earnings factor
          (0.9235), social-security and Medicare rates, the year's SS wage
          base, and the $400 minimum-net-earnings threshold.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/forms-pubs/about-schedule-c-form-1040
        answers: >-
          Schedule C (Form 1040), Profit or Loss From Business: what counts as
          business income/expense feeding net earnings from self-employment.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/publications/p463
        answers: >-
          Pub 463, Travel, Gift, and Car Expenses: standard mileage rate,
          deductible travel/meals/gift limits, and car-expense methods.
        cadence: annual (per tax year)

    payment_options:
      - url: https://www.irs.gov/instructions/i1040gi
        answers: >-
          Instructions for Forms 1040 and 1040-SR, "Amount You Owe" / "How To
          Pay": the year's check payee wording, Form 1040-V memo format, and
          the electronic-payment channels.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/payments
        answers: >-
          IRS Payments: Direct Pay and card/digital-wallet channels (which
          charge a processing fee, which are free) and current payment URLs.
        cadence: as channels/processors change (check per use)

    mailing_addresses:
      - url: https://www.irs.gov/instructions/i1040gi
        answers: >-
          Instructions for Forms 1040 and 1040-SR, "Where Do You File?": the
          state-dependent paper-filing addresses (no-payment vs with-payment).
        cadence: annual (addresses move between years — use the year-specific PDF)
      - url: https://www.irs.gov/filing/where-to-file-paper-tax-returns-with-or-without-a-payment
        answers: >-
          IRS Where to File: the CURRENT-year service-center addresses;
          for a prior year use that year's instructions PDF, not this page.
        cadence: as service centers are reassigned (verify against the year's PDF)

    deadlines:
      - url: https://www.irs.gov/instructions/i1040gi
        answers: >-
          Instructions for Forms 1040 and 1040-SR: the filing due date for the
          year (and the abroad automatic 2-month extension), plus Form 4868
          extension mechanics — the automatic
          6-month extension "doesn't extend the time to pay your tax. If you
          don't pay your tax by the original due date of your return, you will
          owe interest on the unpaid tax and may owe penalties."
        cadence: annual (per tax year; shifts for weekends/holidays)
      - url: https://www.irs.gov/instructions/i1040nr
        answers: >-
          Instructions for Form 1040-NR, "When To File" / "Where To File": the
          1040-NR due date, and the later due date for a filer with no US wages
          subject to withholding.
        cadence: annual (per tax year)

    # ── Credits ──
    credits_ctc:
      - url: https://www.irs.gov/forms-pubs/about-schedule-8812-form-1040
        answers: >-
          Schedule 8812 (Form 1040) and its Instructions: the Child Tax Credit
          (CTC), Credit for Other Dependents (ODC), and Additional Child Tax
          Credit (ACTC) — per-child amount, refundable cap, qualifying-child
          age test, and the MAGI phase-out thresholds and step.
        cadence: annual (per tax year; "What's New" flags law changes)

    credits_eitc:
      - url: https://www.irs.gov/publications/p596
        answers: >-
          Pub 596, Earned Income Credit: EITC eligibility, income limits,
          qualifying-child rules, credit amounts and phase-outs for the year.
        cadence: annual (per tax year)

    credits_energy:
      - url: https://www.irs.gov/forms-pubs/about-form-5695
        answers: >-
          Form 5695 and its Instructions, Residential Energy Credits: the
          Residential Clean Energy Credit and the Energy Efficient Home
          Improvement Credit — eligible property, percentages, and annual caps.
        cadence: annual (per tax year; "What's New" flags law changes)

    credits_dependent_care:
      - url: https://www.irs.gov/publications/p503
        answers: >-
          Pub 503, Child and Dependent Care Expenses: qualifying-person and
          work-related-expense tests, earned-income rule, and the credit
          percentage/expense limits (Form 2441).
        cadence: annual (per tax year)

    # ── Itemized deductions (Schedule A) ──
    itemized_mortgage_interest:
      - url: https://www.irs.gov/publications/p936
        answers: >-
          Pub 936, Home Mortgage Interest Deduction: acquisition-debt
          limits, points, grandfathered debt, worksheet rules. Form 1098,
          Mortgage Interest Statement: "If you paid $600 or more of mortgage
          interest (including certain points) during the year on any one
          mortgage, you will generally receive a Form 1098 or a similar
          statement from the mortgage holder."
        cadence: annual (per tax year)

    itemized_charitable:
      - url: https://www.irs.gov/publications/p526
        answers: >-
          Pub 526, Charitable Contributions: which organizations qualify, the
          AGI percentage limits by gift type, and substantiation rules.
          Membership fees or dues: "you can deduct only the amount that is more
          than the value of the benefits you receive" — "Certain membership
          benefits can be disregarded" for an annual payment of $75 or less —
          and token items.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/forms-pubs/about-form-8283
        answers: >-
          Form 8283, Noncash Charitable Contributions: when it is required
          (noncash gifts over $500) and the qualified-appraisal rules for
          larger noncash donations.
        cadence: annual (per tax year)

    itemized_salt:
      - url: https://www.irs.gov/instructions/i1040sca
        answers: >-
          Instructions for Schedule A (Form 1040): the state-and-local-tax
          (SALT) deduction and its dollar cap (income/sales taxes plus
          property taxes), and which taxes are deductible.
        cadence: annual (per tax year; cap is set by statute — confirm via Congress.gov)

    itemized_medical:
      - url: https://www.irs.gov/publications/p502
        answers: >-
          Pub 502, Medical and Dental Expenses: which expenses are deductible,
          whose expenses count, and the 7.5%-of-AGI floor on Schedule A.
        cadence: annual (per tax year)

    casualty_losses:
      - url: https://www.irs.gov/forms-pubs/about-form-4684
        answers: >-
          Form 4684, Casualties and Thefts: deductible casualty/theft losses
          (federally declared disaster limitation for personal-use property).
        cadence: annual (per tax year; disaster declarations update mid-year)

    # ── Investment income & basis ──
    investment_income:
      - url: https://www.irs.gov/publications/p550
        answers: >-
          Pub 550, Investment Income and Expenses: taxation of interest,
          dividends, capital gains/losses, and related investment expenses.
          Interest income (Form 1099-INT), Taxable Interest—General: "Taxable
          interest includes interest you receive from bank accounts, loans you
          make to others, and other sources" — savings account and certificate
          of deposit (CD) interest, U.S. savings bond interest, and deposit
          interest a resident reports in full.
          Certificates of deposit and other deferred interest accounts: "You
          generally must include this interest in your income when you actually
          receive it or are entitled to receive it without paying a substantial
          penalty." Money market funds: "Generally, amounts you receive from
          money market funds should be reported as dividends, not as interest."
          Interest subject to penalty for early withdrawal: "You must report the
          total amount of interest paid or credited to your account during the
          year without subtracting the penalty." Interest income on frozen
          deposits: "Exclude from your gross income interest on frozen deposits.
          A deposit is frozen if, at the end of the year, you cannot withdraw
          any part of the deposit because" the institution is, or may become,
          bankrupt or insolvent.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/publications/p551
        answers: >-
          Pub 551, Basis of Assets: cost basis, adjusted basis, and basis of
          property received by gift, inheritance, or exchange.
        cadence: as needed (revised periodically)
      - url: https://www.irs.gov/forms-pubs/about-schedule-b-form-1040
        answers: >-
          Schedule B (Form 1040), Interest and Ordinary Dividends: when
          required (over $1,500) and the foreign-account questions.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/forms-pubs/about-schedule-d-form-1040
        answers: >-
          Schedule D (Form 1040), Capital Gains and Losses: short/long-term
          netting, capital-loss limit, and the worksheet that computes
          preferential-rate tax.
        cadence: annual (per tax year)

    # ── Retirement ──
    retirement:
      - url: https://www.irs.gov/publications/p590a
        answers: >-
          Pub 590-A, Contributions to IRAs: the year's IRA contribution
          limits, deduction phase-outs, and the saver's credit.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/publications/p590b
        answers: >-
          Pub 590-B, Distributions from IRAs: taxation of distributions,
          required minimum distributions, and the early distribution penalty
          (its Additional 10% Tax on early distributions).
        cadence: annual (per tax year)

    # ── AMT ──
    amt:
      - url: https://www.irs.gov/forms-pubs/about-form-6251
        answers: >-
          Form 6251 and its Instructions, Alternative Minimum Tax — Individuals:
          AMT exemption amounts, phase-out thresholds, and the AMT preference
          and adjustment items.
        cadence: annual (per tax year)

    # ── Estimated tax & withholding ──
    estimated_tax:
      - url: https://www.irs.gov/publications/p505
        answers: >-
          Pub 505, Tax Withholding and Estimated Tax: who must pay estimated
          tax, the safe-harbor percentages, and Form 2210 underpayment-penalty
          mechanics. "Estimated tax is the method used to pay tax on income
          that isn't subject to withholding"; the publication "also explains
          how to take credit on your return for the tax that was withheld and
          for your estimated tax payments."
        cadence: annual (per tax year)

    # ── Nonresident & treaties ──
    nonresident_and_treaties:
      - url: https://www.irs.gov/publications/p519
        answers: >-
          Pub 519, U.S. Tax Guide for Aliens: NRA/RA/dual-status rules,
          Substantial Presence Test, exempt-individual years, which form
          (1040 vs 1040-NR), treaty benefit claiming mechanics.
        cadence: annual (per tax year)
      - url: https://home.treasury.gov/policy-issues/tax-policy/treaties
        answers: >-
          Treasury income tax treaty texts and protocols: the authoritative
          article language (e.g. student articles) behind any treaty
          position; per-country eligibility details.
        cadence: as treaties are signed or amended (rare; check per use)
      # The DISCLOSURE half of a treaty position. calc.treaty_benefit prices the
      # exemption and the f8833 packs fill the form; these two URLs are where the
      # duty and its waivers are written, so an agent can check whether the form
      # is needed at all before telling a filer to attach one.
      - url: https://www.irs.gov/pub/irs-pdf/f8833.pdf
        answers: >-
          Form 8833, Treaty-Based Return Position Disclosure Under Section 6114
          or 7701(b), and its instructions (pages 3-5 of the same PDF): who must
          disclose a treaty-based return position, the positions for which
          reporting is specifically required, the "Exceptions from reporting"
          waiver bullets (including the one covering students, trainees and
          teachers), what each of lines 1-6 must say, the dual-resident-taxpayer
          rules, and where to file. Revision-dated, not annual — read the printed
          "(Rev. <month-year>)" marker on page 1.
        cadence: on revision only (currently Rev. 12-2022; no year-stamped archive copy exists)
      - url: https://www.ecfr.gov/current/title-26/chapter-I/subchapter-F/part-301/section-301.6114-1
        answers: >-
          Treas. Reg. 301.6114-1, the regulation under IRC 6114: paragraph (b)
          lists the positions for which reporting on Form 8833 is specifically
          REQUIRED, paragraph (c) lists the WAIVERS that decide whether a filer
          needs the form at all — (c)(1)(iv) waives dependent-personal-services,
          pension and student/trainee/teacher positions, (c)(2) waives an
          individual at or under $10,000 of reportable items ($100,000 for a
          (b)(8) residency position) — and (d)(1) is what makes a "fully
          completed Form 8833" the required attachment. IRC 6712 sets the $1,000
          ($10,000 for a C corporation) penalty for failing to disclose.
        cadence: amended rarely (check the eCFR "as of" date shown on the page)

    # ── Dual-status year (split residency: 1040 return + 1040-NR statement) ──
    dual_status:
      - url: https://www.irs.gov/individuals/international-taxpayers/taxation-of-dual-status-individuals
        answers: >-
          IRS 'Taxation of dual-status individuals': the split-year filing
          mechanics — file the return for your status on December 31 with the
          other form attached as the statement, write 'Dual-Status Return' and
          'Dual-Status Statement' across the tops, no standard deduction,
          restricted filing statuses, and what income each part of the year
          taxes.
        cadence: standing page (re-check each filing season)
      - url: https://www.irs.gov/publications/p519
        answers: >-
          Pub 519 ch. 1 and ch. 6, dual-status tax year: residency starting
          and ending dates, the First-Year Choice election (IRC 7701(b)(4))
          and its required statement, the no-standard-deduction and
          filing-status restrictions, and the ch. 7 due dates (June 15 when a
          year-end nonresident had no wages subject to withholding).
        cadence: annual (per tax year)

    # ── Foreign earned income (FEIE / Form 2555) ──
    foreign_earned_income:
      - url: https://www.irs.gov/forms-pubs/about-form-2555
        answers: >-
          Form 2555 and its Instructions, Foreign Earned Income: the foreign
          earned income exclusion (FEIE) — the year's maximum exclusion
          amount, the physical presence test and bona fide residence test,
          the foreign housing exclusion/deduction, and how the exclusion is
          claimed on Form 2555.
        cadence: annual (per tax year; the exclusion cap is inflation-adjusted)
      - url: https://www.irs.gov/forms-pubs/about-publication-54
        answers: >-
          Pub 54, Tax Guide for U.S. Citizens and Resident Aliens Abroad:
          who qualifies for the foreign earned income exclusion (FEIE),
          tax home abroad, physical presence and bona fide residence
          qualification details, and the interaction with the foreign tax
          credit for citizens and residents working overseas.
        cadence: annual (per tax year)

    # ── Education ──
    education:
      - url: https://www.irs.gov/publications/p970
        answers: >-
          Pub 970, Tax Benefits for Education: AOTC/LLC eligibility,
          1098-T handling, scholarship taxability, student-loan interest.
        cadence: annual (per tax year)

    # OBBBA (P.L. 119-21) Schedule 1-A deduction family, TY2025-2028. Added
    # 2026-08-07: the tax.obbba_schedule_1a block shipped in the 2025 pack while
    # this registry had NO topic for it, so get_sources mis-routed every query —
    # "qualified overtime" went to itemized_charitable (Pub 526), "car loan
    # interest deduction" to education (Pub 970), "no tax on tips" to
    # dual_status (Pub 519), "Schedule 1-A" to investment_income (Pub 550) —
    # a live DEV_PLAN section-7 coverage-rule violation.
    contribution_limits:
      - url: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-contributions
        answers: >-
          The retirement-plan contribution limits landing page: elective
          deferrals (402(g) — the 401k and 403(b) deferral limit), annual
          additions (415(c)), IRA limits and
          catch-ups, with links to the year's COLA notice — the change channel
          for every per-year figure in the contribution_limits block.
        cadence: annual (COLA notice each November)
      - url: https://www.irs.gov/publications/p590a
        answers: >-
          Pub 590-A, Contributions to IRAs: the Roth and deductible-IRA MAGI
          phase-out worksheets (the round-up-to-$10 / $200-minimum mechanics),
          the Roth MAGI definition, the filing-deadline contribution window,
          and the 6% excess-contribution excise (IRC 4973).
        cadence: annual (per tax year)
      - url: https://www.irs.gov/publications/p969
        answers: >-
          Pub 969, HSAs and other tax-favored health plans: HSA eligibility,
          the self-only/family coverage-tier limits, the age-55 catch-up, and
          the payroll (cafeteria-plan) FICA treatment.
        cadence: annual (per tax year)

    obbba_schedule_1a_deductions:
      - url: https://www.irs.gov/pub/irs-prior/f1040s1a--2025.pdf
        answers: >-
          Schedule 1-A (Form 1040), Additional Deductions: the four new OBBBA
          deductions — no tax on tips (qualified tips, Part II), no tax on
          overtime (the qualified overtime premium half, Part III), qualified
          passenger car loan interest (Part IV), and the senior deduction for
          filers 65-plus (Part V) — each with its MAGI phase-out, cap, and the
          married-filing-jointly requirement where one applies. Attaches to
          Form 1040 line 13b and Form 1040-NR line 13c.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/newsroom/working-families-tax-cuts
        answers: >-
          IRS "working families tax cuts" landing page for the One Big
          Beautiful Bill Act (P.L. 119-21): the statute-level summary of the
          tips / overtime / car-loan-interest / senior deductions, effective
          years (2025-2028), and links to the implementing guidance as it
          publishes.
        cadence: as legislation/guidance publishes

    # Reward/other-income characterization + the NRA FDAP corner (H9, pitfall
    # P-005). Added 2026-08-10: whether a bank account bonus is taxable had
    # no routed authority. The engine could price the tax and resolve the
    # residency branch, but the characterization had to be supplied by the
    # agent — "credit card rewards taxable", "bank account bonus income" and "other income
    # 1099-MISC" were clean get_sources misses, "FDAP" and "effectively
    # connected income" missed too, and (worse) the H6 OBBBA topic made
    # "Schedule NEC" mis-route to the Schedule 1-A deduction page — pointing
    # an agent at the WRONG LAW, the exact failure that topic was added to
    # fix. The two topics below carry the go-look-here authority; the
    # year-invariant characterization RULE lives in knowledge/pitfalls.yaml
    # (P-005) — only the statutory 30% rate (IRC 871(a)) and any treaty
    # other-income article rate are figures, and the five treaty packs carry
    # verbatim-verified other_income blocks (treaty_benefit income_class
    # other_income): no shipped treaty reduces US tax on US-arising other income.
    other_income_and_rewards:
      - url: https://www.irs.gov/publications/p525
        answers: >-
          Pub 525, Taxable and Nontaxable Income — the Other Income chapter,
          with the rebate-vs-income line: credit card rewards earned by
          SPENDING (cash back or points on purchases) are a purchase-price
          rebate, not income (the Cash rebates paragraph; the Rev. Rul. 76-96
          purchase-price-adjustment lineage), while a bonus paid for OPENING
          or MAINTAINING a bank or deposit account relationship is taxable
          other income the bank reports on 1099-MISC box 3 or 1099-INT —
          even when it is styled as a fee reimbursement or reward.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/pub/irs-drop/a-02-18.pdf
        answers: >-
          Announcement 2002-18: the IRS will not assert that a taxpayer
          understated liability by reason of the receipt or personal use of
          frequent flyer miles or other IN-KIND promotional benefits
          attributable to business or official travel — but the relief does
          NOT apply to benefits converted to cash or paid as compensation,
          which is exactly the boundary a cash bank bonus sits on.
        cadence: standing announcement (future guidance applies prospectively)

    # 2026-09-11 (N-8, P-013): "bank deposit interest nonresident" routed to
    # other_income_and_rewards (the BANK-BONUS topic — wrong law) and "871(i)"
    # to foreign_tax_credit, because nothing in this topic named the
    # bank-deposit-interest exclusion. The statute entry and the ch. 3 sentence
    # below are what route those queries here; the year-invariant rule itself
    # lives in knowledge/pitfalls.yaml (P-013) and in estimate.py.
    # The added text avoids the tokens nonresident_spouse_election wins on:
    # "alien", "6013", the Pub 519 ch. 1 heading, and any extra "nonresident"
    # (the key already carries it). The first draft carried them, and it stole
    # "spouse treated as resident", "6013(h)", "married to a nonresident alien"
    # and "married to nonresident" from that topic. test_sources pins each one
    # (test_p013_the_election_sentence_does_not_steal_the_spouse_election_queries).
    nonresident_fdap:
      - url: https://www.irs.gov/publications/p519
        answers: >-
          Pub 519 ch. 4, How Income of Aliens Is Taxed — "The 30% Tax": which
          income of a nonresident is taxed at the flat 30% rate as not
          effectively connected with a US trade or business, versus
          effectively connected income taxed at the regular graduated rates.
          Ch. 3, Exclusions From Gross Income, on interest: for nonresidents,
          interest on deposits (including certificates of deposit) with
          persons in the banking business, on deposits or withdrawable accounts
          with savings institutions (mutual savings banks, cooperative banks,
          credit unions, building and loan associations), and on amounts held by
          an insurance company under an agreement to pay interest is EXCLUDED
          from income when it is not connected with a US trade or business —
          the bank deposit interest exclusion. Bank interest keeps that
          character whichever form reports it (a Form 1099-INT sent to a
          nonresident, or a Form 1042-S).
          What ends that exclusion is the election, not the marriage — ch. 1:
          "If you make this choice, you and your spouse are treated for income
          tax purposes as residents for your entire tax year."
        cadence: annual (per tax year)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section871&num=0&edition=prelim
        answers: >-
          IRC 871, the charging section for nonresidents. 871(a)(1) is the flat
          30% tax on US-source income not effectively connected with a US trade
          or business (the FDAP tax); 871(b) taxes effectively connected income
          at the section 1 graduated rates; 871(h) is the portfolio interest
          exemption. 871(i) "Tax not to apply to certain interest and dividends":
          871(i)(1) imposes no tax under (a)(1)(A) or (a)(1)(C) on 871(i)(2)(A)
          "interest on deposits, if such interest is not effectively connected
          with the conduct of a trade or business within the United States" —
          the 871(i) deposit interest exclusion for bank deposits — and 871(i)(3)
          defines deposits as deposits with persons carrying on the banking
          business, deposits or withdrawable accounts with savings institutions
          chartered as savings and loan or similar associations (to the extent
          deductible under section 591), and amounts held by an insurance
          company under an agreement to pay interest. The exclusion is
          conditioned on CHARACTER (deposits, not effectively connected), so
          interest on deposits that IS effectively connected stays taxed under
          871(b), and bond or brokerage interest is not a deposit at all. A
          fund is not a deposit either: 871(k)(1)(A) is its own exemption, for
          a regulated investment company's payout the company reports "in
          written statements furnished to its shareholders" (871(k)(1)(C)(i)).
        cadence: standing statute (check for amendment)
      - url: https://www.irs.gov/individuals/international-taxpayers/fixed-determinable-annual-periodical-fdap-income
        answers: >-
          FDAP income of nonresident aliens: US-source fixed, determinable,
          annual or periodical income is taxed at a 30% (or lower treaty)
          rate on the GROSS amount — deductions and netting are not allowed —
          collected by a flat 30% withholding at source.
        cadence: standing page (re-check each filing season)
      - url: https://www.irs.gov/individuals/international-taxpayers/effectively-connected-income-eci
        answers: >-
          Effectively connected income (ECI): income connected with a US
          trade or business is taxed AFTER allowable deductions at the same
          graduated rates that apply to citizens and residents — the ECI-vs-
          FDAP split decides whether an amount lands on Form 1040-NR page 1
          or on Schedule NEC.
        cadence: standing page (re-check each filing season)
      - url: https://www.irs.gov/instructions/i1040nr
        answers: >-
          Instructions for Form 1040-NR — the Schedule NEC section (Tax on
          Income Not Effectively Connected With a US Trade or Business): the
          30% / 15% / 10% rate columns, column (d) for any other rate
          including a treaty rate or 0%, and how the Schedule NEC tax carries
          to the return.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/forms-pubs/about-form-1042-s
        answers: >-
          Form 1042-S, Foreign Person's U.S. Source Income Subject to
          Withholding: the information return that reports the US-source
          income paid to a foreign person (NRA interest, dividends and other
          FDAP income) and the amounts withheld — the
          document that substantiates a Schedule NEC line and any
          withholding credit claimed against it.
        cadence: annual (per tax year)

    # Commuter / transportation fringe benefits (§132(f)) and the fringe-benefit
    # characterization rules around them. Added 2026-08-11:
    # the packs ship the DOLLAR LIMITS (contribution_limits' commuter_132f block)
    # but carried nothing about WHAT QUALIFIES, so the eligibility half had to be
    # researched from scratch — the same split H9 fixed for reward income. Worse,
    # get_sources("qualified parking") mis-routed to obbba_schedule_1a_deductions
    # (the token "qualified" pulls toward the OBBBA topic) — a WRONG-LAW pointer
    # of exactly the Schedule NEC kind. The year-invariant eligibility RULES live
    # in knowledge/pitfalls.yaml (P-006); only the monthly caps are figures.
    commuter_and_fringe_benefits:
      - url: https://www.irs.gov/pub/irs-pdf/p15b.pdf
        answers: >-
          Pub 15-B, Employer's Tax Guide to Fringe Benefits — "Transportation
          (Commuting) Benefits": the EXHAUSTIVE list of qualified transportation
          benefits (a ride in a commuter highway vehicle, a transit pass, and
          qualified parking — nothing else); the qualified-parking definition
          ("parking you provide to your employees on or near your business
          premises ... It doesn't include parking at or near your employee's
          home"); the transit-pass and commuter-highway-vehicle (6+ adults, 80%
          mileage) definitions; the bona fide reimbursement arrangement rule
          ("requires that the employee incur and substantiate expenses ... BEFORE
          reimbursement") and the cash-reimbursement/readily-available-voucher
          limit; compensation reduction agreements; de minimis transportation.
          Also carries the P.L. 119-21 change permanently eliminating the
          qualified bicycle commuting exclusion for tax years beginning after 2025.
          Because that three-item list is exhaustive, this is also the authority
          for what is NOT covered — vehicle energy of any kind (gasoline, fuel,
          and electric-vehicle charging), tolls, mileage, parking at the
          employee's own home, and ordinary rideshare that is not a 6+ adult
          commuter highway vehicle.
        cadence: annual (per tax year; the monthly caps are inflation-adjusted)
      - url: https://www.govinfo.gov/content/pkg/CFR-2012-title26-vol2/pdf/CFR-2012-title26-vol2-sec1-132-9.pdf
        answers: >-
          26 CFR 1.132-9, Qualified transportation fringes — the operative Q&A
          regulation: Q-16 how section 132(f) applies to expense reimbursements
          (the bona fide reimbursement arrangement and the rule that cash
          reimbursement for transit passes is allowed only when no voucher
          exchangeable solely for a transit pass is READILY AVAILABLE, judged by
          a fare-media-charge test), Q-17 reimbursement periods longer than one
          month, Q-18/Q-19 substantiation, Q-20/Q-21 parking valuation and
          vanpools, Q-22 reporting and employment taxes on amounts that fail.
        cadence: as the regulation is amended (rare; check for superseding guidance)
      - url: https://www.irs.gov/pub/irs-drop/rr-14-32.pdf
        answers: >-
          Rev. Rul. 2014-32: how smart cards, debit/credit cards and other
          electronic media may (and may not) be used to deliver qualified
          transportation fringes, including when a cash reimbursement
          arrangement is bona fide — the ruling Pub 15-B points to for card-based
          commuter programs.
        cadence: standing ruling (check for superseding guidance)
      - url: https://www.irs.gov/government-entities/federal-state-local-governments/de-minimis-fringe-benefits
        answers: >-
          De minimis fringe benefits (IRC 132(e)): the frequency-and-value test,
          and the hard rule that CASH and cash-equivalent benefits (gift cards,
          charge/credit card use) are NEVER excludable as de minimis no matter
          how small, so no cash payment by an employer can ride the de minimis
          exclusion.
        cadence: standing page (re-check each filing season)

    # IRA basis / pro-rata and the two Roth-conversion paths (Phase I, I1). Added
    # 2026-08-26 alongside calc ops ira_pro_rata and roth_conversion. The gap was
    # the H8/H9 shape again — the packs shipped the IRA LIMIT and the Roth MAGI
    # phase-out (contribution_limits) while nothing carried the CHARACTERIZATION
    # rule that decides how much of a conversion is taxable, so IRC 408(d)(2) had
    # no home in the repo at all. Reproduced before the topic was written:
    # get_sources("Form 8606"), ("pro rata rule") and ("nondeductible IRA basis")
    # were clean misses, and get_sources("nondeductible contributions") routed to
    # Pub 526 + Form 8283 — CHARITABLE-contribution substantiation, a wrong-law
    # pointer of exactly the Schedule NEC / "qualified parking" kind (P-005,
    # P-006). The year-invariant rules live in knowledge/pitfalls.yaml (P-009);
    # only the contribution limits and phase-out ranges are figures.
    ira_basis_and_roth_conversions:
      - url: https://www.irs.gov/pub/irs-prior/f8606--2025.pdf
        answers: >-
          Form 8606, Nondeductible IRAs — the form that computes IRA basis and
          the taxable part of a conversion. Part I: line 1 this year's
          nondeductible contributions, line 2 the prior-year basis carryforward,
          line 4 the slice contributed between January 1 and April 15 of the
          following year, line 5 = 3 - 4 the ratio's NUMERATOR, line 6 the
          December 31 value of ALL traditional/SEP/SIMPLE IRAs plus outstanding
          rollovers, line 7 distributions not converted, line 8 the net amount
          converted, line 9 = 6 + 7 + 8 the DENOMINATOR (it adds the conversion
          back), line 10 the ratio "rounded to at least 3 places ... If the
          result is 1.000 or more, enter 1.000", lines 11-13 the nontaxable
          portions, line 14 the basis carried forward. Part II lines 16-18 give
          the conversion's taxable amount for Form 1040 line 4b; the line 15c
          Note carries the under-59-1/2 10% additional tax warning. The form
          header ("If married, file a separate form for each spouse") is the
          authority that basis is PER PERSON.
        cadence: annual (per tax year; prior revisions at irs.gov/pub/irs-prior/f8606--<year>.pdf)
      - url: https://www.irs.gov/pub/irs-prior/i8606--2025.pdf
        answers: >-
          Instructions for Form 8606 — the Line 2 Total Basis Chart (which prior
          year's line the basis comes from, and why pre-2001 forms renumber),
          Line 4 ("Although the contributions ... you made from January 1 ...
          through April 15 ... can be treated as nondeductible, they aren't
          included in figuring the nontaxable part of any distributions you
          received"), Line 6 (outstanding rollovers), Line 7 (what is NOT a
          distribution: conversions, rollovers, QCDs, recharacterizations,
          returned contributions), Line 14, and "Modified AGI for Roth IRA
          purposes" (which SUBTRACTS Roth conversions on 1040 line 4b and
          plan-to-Roth-IRA rollovers on line 5b, so a conversion cannot phase you
          out of contributing). Its "Purpose of Form" list does NOT include a
          rollover from a qualified retirement plan to a Roth IRA — those are
          reported on Form 1040 line 5a/5b instead.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/publications/p590b
        answers: >-
          Pub 590-B, Distributions from IRAs — "Are Distributions Taxable?" and
          "Distributions Fully or Partly Taxable": with no nondeductible
          contributions there is no basis and every distribution is fully
          taxable; with basis, "Until all of your basis has been distributed,
          each distribution is partly nontaxable and partly taxable" (the plain
          English of the pro-rata rule). Also the Withholding section (federal
          tax is withheld from traditional-IRA distributions unless you elect
          out; generally 10% on nonperiodic payments) and the early-distribution
          10% additional tax.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/pub/irs-drop/n-08-30.pdf
        answers: >-
          Notice 2008-30 (PPA '06, P.L. 109-280, section 824) — the
          DIRECT plan-to-Roth-IRA rollover rule. A-1: a section 401(a) plan
          distribution may be rolled to a Roth IRA and "there is included in
          gross income any amount that would be includible if the distribution
          were not rolled over"; A-2 extends it to 403(a), 403(b) and
          governmental 457(b) plans; A-3 section 72(t) does not apply to the
          rollover, but a taxable amount so rolled in and distributed within 5
          years is (section 408A(d)(3)(F)); A-6 a DIRECT rollover to a Roth IRA
          escapes the section 3405(c) 20% mandatory withholding "even if the
          distribution is includible in gross income", while a voluntary
          withholding agreement is still permitted. This is the authority that
          IRA pro-rata does NOT touch a plan-to-Roth-IRA rollover.
        cadence: standing notice (check for superseding guidance)
      - url: https://www.irs.gov/pub/irs-drop/n-14-54.pdf
        answers: >-
          Notice 2014-54, Allocation of After-Tax Amounts to Rollovers: section
          72(e)(8) pro-rates after-tax and pretax amounts WITHIN a plan account,
          section 402(c)(2) treats a rollover as consisting first of the
          includible portion, and section III aggregates simultaneous
          disbursements into one distribution and assigns the pretax amount to
          the direct rollovers first (so pretax can go to a traditional IRA and
          after-tax to a Roth IRA). Section IV: the allocation is what the plan
          reports on Form 1099-R — the after-tax figure is the plan's
          determination, never the filer's estimate.
        cadence: standing notice (check for superseding guidance)
      - url: https://www.irs.gov/publications/p590a
        answers: >-
          Pub 590-A ch. 1 Table 1-5 (Comparison of Payment to You Versus Direct
          Rollover): a payment to you carries 20% mandatory withholding and, under
          age 59-1/2, "a 10% additional tax may apply to the taxable part
          (including an amount equal to the tax withheld) that isn't rolled
          over", while a direct rollover has neither — plus "you can make up the
          amount withheld with funds from other sources". Ch. 2 "Converting From
          Any Traditional IRA Into a Roth IRA": the conversion is includible in
          gross income, an amount you keep may face the 10% additional tax, an
          RMD cannot be converted, and "No recharacterizations of conversions
          made in 2018 or later" — conversions are irreversible.
        cadence: annual (per tax year)

    # Foreign tax credit + the IRC 904(j) de-minimis election (Phase I, I4).
    # Added 2026-08-27 alongside formpacks/federal/2023/f1116 and calc op
    # foreign_tax_credit_election. The gap was the widest wrong-law hole found
    # so far, and it sat on the single most common international fact in a
    # resident return — foreign tax withheld on a total-international index
    # fund, Form 1099-DIV box 7. Reproduced before this topic was written
    # (get_sources(..., 2023)):
    #   "foreign tax credit"     -> foreign_earned_income (Form 2555, the
    #                               EXCLUSION) — the credit and the exclusion are
    #                               ALTERNATIVE treatments of foreign income, so
    #                               that pointer sends an agent to exclude income
    #                               it should be crediting tax on;
    #   "foreign taxes withheld" -> nonresident_fdap (the 30% the US withholds
    #                               FROM a nonresident) — the mirror image of tax
    #                               a foreign country withheld from a US person;
    #   "1099-DIV box 7"         -> ira_basis_and_roth_conversions (P-009's own
    #                               new topic, swallowing it);
    #   "904(j)"                 -> tax_rates_and_tables (the section 1 rate
    #                               schedules);
    #   "de minimis election"    -> commuter_and_fringe_benefits (the de minimis
    #                               FRINGE);
    #   "Form 1116", "passive category income" and "foreign tax credit without
    #   filing Form 1116" -> clean misses.
    # Five wrong-law pointers and three misses, all of the P-005 "Schedule NEC" /
    # P-006 "qualified parking" kind. The year-invariant rules live in
    # knowledge/pitfalls.yaml (P-011); the only figures are the statutory
    # $300/$600 de-minimis amounts, which sit in each year pack's
    # credits.foreign_tax_credit block.
    foreign_tax_credit:
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section904&num=0&edition=prelim
        answers: >-
          IRC 904 — the foreign tax credit LIMITATION and the de-minimis
          election. 904(a) caps the credit at the same proportion of US tax that
          foreign-source taxable income bears to entire taxable income. 904(c) is
          the carryback/carryover of excess tax paid (1 year back, 10 forward).
          904(d) defines the separate categories (baskets), including passive
          category income at 904(d)(2)(B). 904(j) "Certain individuals exempt" is
          the ELECTION TO CLAIM THE FOREIGN TAX CREDIT WITHOUT FILING FORM 1116:
          904(j)(1) turns off the 904(a) limitation AND forbids carrying tax to or
          from any other year; 904(j)(2) sets the three conditions (all
          foreign-source gross income is qualified passive income; creditable
          foreign taxes "does not exceed $300 ($600 in the case of a joint
          return)"; the individual elects it); 904(j)(3) defines qualified passive
          income (passive under 904(d)(2)(B) without clause (iii), shown on a
          payee statement), creditable foreign taxes (allowable under section 901
          and shown on a payee statement), payee statement (section 6724(d)(2)),
          and excludes estates and trusts. Added by P.L. 105-34 (1997); not
          inflation-indexed.
        cadence: standing statute (check for amendment)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section901&num=0&edition=prelim
        answers: >-
          IRC 901 — which foreign taxes are creditable at all. 901(a) allows the
          credit only if the taxpayer "chooses to have the benefits of this
          subpart" and only "subject to the limitation of section 904";
          901(b)(1) covers a citizen of the United States for "any income, war
          profits, and excess profits taxes paid or accrued during the taxable
          year to any foreign country or to any possession of the United States".
          901(k) is the MINIMUM HOLDING PERIOD for withholding tax on dividends —
          the trap for a fund or share held briefly around a dividend. Read with
          IRC 903, which extends the term to "a tax paid in lieu of a tax on
          income, war profits, or excess profits otherwise generally imposed by
          any foreign country or by any possession of the United States", so an
          in-lieu-of tax is creditable too.
        cadence: standing statute (check for amendment)
      - url: https://www.irs.gov/pub/irs-prior/f1116--2023.pdf
        answers: >-
          Form 1116, Foreign Tax Credit (Individual, Estate, or Trust) — the form
          itself, filed PER CATEGORY OF INCOME (one of boxes a-g above Part I;
          box c is passive category income, the 1099-DIV box 7 basket). Part I
          Taxable Income or Loss From Sources Outside the United States, three
          country columns A/B/C plus a Total column; Part II Foreign Taxes Paid or
          Accrued with the (j) Paid / (k) Accrued method election and the foreign
          currency vs US dollar column halves; Part III Figuring the Credit
          (line 14 taxes available, line 19 the foreign/total taxable-income
          ratio, line 21 the maximum credit, line 24 the smaller of the two);
          Part IV Summary of Credits From Separate Parts III, one line per
          category. Line 35 is the credit and goes to Schedule 3 (Form 1040),
          line 1. Prior revisions at irs.gov/pub/irs-prior/f1116--<year>.pdf.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/pub/irs-prior/i1116--2023.pdf
        answers: >-
          Instructions for Form 1116 — the authority for the ELECTION and for the
          lines the form cannot explain itself. "Election To Claim the Foreign Tax
          Credit Without Filing Form 1116" lists every condition and, critically,
          what the election COSTS ("You can't carry over to or from any other year
          any foreign taxes paid or accrued in a tax year to which the election
          applies"), that it "isn't available to estates or trusts", that the
          line-12 reduction still applies, and how to make it ("just enter on the
          foreign tax credit line of your tax return (for example, Schedule 3
          (Form 1040), Part I, line 1) the smaller of (a) your total foreign tax,
          or (b) your regular tax"). Names the qualified payee statements: Form
          1099-DIV, Form 1099-INT, Schedule K-1 (Form 1041), Schedule K-3 (Form
          1065), Schedule K-3 (Form 1120-S) or similar substitute statements.
          Part II carries the rule that makes a 1099 filer's life easy: foreign
          tax reported in US dollars on a 1099-DIV/1099-INT need not be converted
          into foreign currency — "Enter '1099 taxes' in Part II, column (l), and
          complete columns (q) through (u)". Line 3f is a decimal to four places;
          line 20 is the "regular tax"; the Worksheet for Line 18 is required when
          the filer used the lower qualified-dividend/capital-gain rates.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/publications/p514
        answers: >-
          Pub 514, Foreign Tax Credit for Individuals — the narrative behind the
          form: which foreign taxes qualify (income tax and taxes in lieu of
          income tax, the 901(k) holding period, taxes on excluded income), the
          credit-versus-DEDUCTION choice and that it is all-or-nothing for the
          year, the separate categories, the carryback/carryforward mechanics with
          worked examples, and the allocation of foreign losses and deductions
          (the Form 1116 line 2 / 3 / 4 apportionment).
        cadence: annual (per tax year)
      - url: https://www.irs.gov/individuals/international-taxpayers/foreign-tax-credit
        answers: >-
          IRS "Foreign Tax Credit" page — the four tests a foreign tax must pass
          to be creditable (the tax must be imposed on you, you must have paid or
          accrued it, it must be a legal and actual foreign tax liability, and it
          must be an income tax or a tax in lieu of an income tax), plus the
          choice between the credit and the itemized deduction and pointers to
          Form 1116 and Pub 514.
        cadence: standing page (re-check each filing season)

    # Foreign-ACCOUNT / foreign-ASSET REPORTING — the FBAR and Form 8938 duties
    # (Phase I, I4). Added 2026-08-27 alongside formpacks/federal/<year>/f8938,
    # formpacks/federal/<year>/fincen114/handfill.yaml, the top-level
    # `foreign_account_reporting` knowledge block and calc op
    # foreign_asset_reporting. This is a REPORTING topic, deliberately separate
    # from foreign_tax_credit (which is about tax the filer PAID abroad) and from
    # investment_income (which is about basis and income): the duty here exists
    # even when no tax is owed on the account at all.
    #
    # The routing gap this closes was reproduced before the entry was written
    # (get_sources(..., 2025) against the registry as it stood):
    #   "FBAR"                                -> clean MISS
    #   "Form 8938"                            -> clean MISS
    #   "FinCEN Form 114"                      -> clean MISS
    #   "report foreign accounts"              -> clean MISS
    #   "6038D"                                -> clean MISS
    #   "foreign asset disclosure"             -> clean MISS
    #   "foreign bank account"                 -> other_income_and_rewards
    #   "specified foreign financial assets"   -> investment_income
    #   "foreign financial account"            -> investment_income
    #   "foreign account reporting"            -> investment_income
    # Six misses and four WRONG-LAW pointers of the P-005 "Schedule NEC" /
    # P-006 "qualified parking" kind: "foreign bank account" landed on Pub 525's
    # bank-BONUS doctrine, and the three "foreign financial asset" phrasings
    # landed on Pub 550's basis-and-interest guidance. Neither says a word about
    # a filing duty whose non-willful penalty starts at five figures.
    foreign_asset_and_fbar_reporting:
      - url: https://www.irs.gov/businesses/comparison-of-form-8938-and-fbar-requirements
        answers: >-
          IRS, "Comparison of Form 8938 and FBAR requirements" — the single page
          that settles the question agents get wrong: the two filings are
          SEPARATE and neither substitutes for the other ("The Form 8938 filing
          requirement does not replace or otherwise affect a taxpayer's
          obligation to file FinCEN Form 114"). Carries both reporting-threshold
          ladders side by side, who must file each, the measuring period and
          exchange-rate date for each (Form 8938 the end of the TAXABLE year, the
          FBAR the end of the CALENDAR year), where each is filed, the penalties,
          and the asset-by-asset "Types of foreign assets" grid showing that
          neither is a superset of the other — signature authority and a foreign
          BRANCH of a US bank are FBAR-only; foreign stock outside an account, a
          foreign partnership interest and a foreign hedge fund are 8938-only;
          directly-held foreign real estate, currency and precious metals are
          neither. It also states the penalty exposure on each side, so "what is
          the penalty for not reporting a foreign account?" is answerable without
          leaving the registry: up to $10,000 plus $10,000 per 30 days after IRS
          notice (a $60,000 maximum) on the Form 8938 side, and inflation-
          adjusted Title 31 civil penalties on the FBAR side.
        cadence: standing page (re-check each filing season)
      - url: https://www.irs.gov/businesses/small-businesses-self-employed/report-of-foreign-bank-and-financial-accounts-fbar
        answers: >-
          IRS, "Report of Foreign Bank and Financial Accounts (FBAR)" — who must
          file (a US person with a financial interest in or signature authority
          over foreign accounts whose AGGREGATE value "exceeded $10,000 at any
          time during the calendar year reported"), the accounts that need NOT be
          reported (correspondent/nostro, governmental, IRA-held,
          retirement-plan-held, US military banking facility, certain
          trust-beneficiary), the spouse exception via FinCEN Form 114a, the
          April 15 due date with the automatic October 15 extension, the
          five-year recordkeeping list, the delinquent-FBAR path, and the two
          sentences that decide the repo's whole approach: "You must file the
          FBAR electronically through FinCEN's BSA E-Filing System. You don't
          file the FBAR with your federal tax return." and "IRS will not accept
          paper filings on TD F 90-22.1 (obsolete) or a printed FinCEN Form 114
          (for e-filing only)." Also states that income tax filing status has NO
          effect on the FBAR.
        cadence: standing page (re-check each filing season)
      - url: https://www.fincen.gov/sites/default/files/shared/FBAR%20Line%20Item%20Filing%20Instructions.pdf
        answers: >-
          FinCEN, "BSA Electronic Filing Requirements For Report of Foreign Bank
          and Financial Accounts (FinCEN Form 114)" — FinCEN's OWN line-by-line
          instructions, the document both irs.gov and fincen.gov link to as the
          FBAR instructions. Gives the "Who Must File an FBAR" $10,000 aggregate
          test, the maximum-account-value rule ("If the maximum account value of
          a single account or aggregate of the maximum account values of multiple
          accounts exceeds $10,000, an FBAR must be filed"), the P.L. 114-41
          April 15 due date with the automatic six-month extension, the
          weekend/holiday shift, item-by-item completion instructions for Parts
          I-V (including the 25-or-more-accounts short form and the late-filing
          reason codes), and the recordkeeping requirements. Release January 2017
          (v1.4) — FinCEN publishes it by release version, not per tax year, and
          its own cover line reads "Effective January 2017 for the 2017 or
          earlier filing requirement", so RE-CHECK the linked version each season
          rather than assuming the copy on disk is current.
        cadence: on FinCEN release only (currently v1.4, January 2017)
      - url: https://www.ecfr.gov/current/title-31/section-1010.350
        answers: >-
          31 CFR 1010.350, "Reports of foreign financial accounts" — the FBAR
          regulation itself: who is a "United States person" for FBAR purposes
          (paragraph (b), which pulls the 26 U.S.C. 7701(b) resident-alien test
          but with 31 CFR 1010.100(hhh)'s definition of "United States"), what
          counts as a bank / securities / other financial account (paragraph
          (c)), the account EXCEPTIONS, what a "financial interest" is including
          the greater-than-50-percent entity attribution (paragraph (e)), and
          signature-or-other-authority. Read together with 31 CFR 1010.306(c)-(e)
          for the $10,000 amount and the file-with-FinCEN rule. WARNING, and the
          reason this row names two sections: 1010.306(c) still reads "on or
          before June 30 of each calendar year" — the regulation was never
          conformed to P.L. 114-41's April 15 date, so citing it alone yields a
          deadline 2.5 months WRONG. Take the due date from the statute and
          FinCEN's instructions, never from 1010.306(c).
        cadence: amended rarely (check the eCFR "as of" date shown on the page)
      - url: https://www.ecfr.gov/current/title-26/section-1.6038D-2
        answers: >-
          Treas. Reg. 1.6038D-2, "Requirement to report specified foreign
          financial assets" — the FORM 8938 THRESHOLDS in their authoritative
          form: paragraph (a)(1) $50,000 last day / $75,000 any time (the general
          rule, which is where single, married-filing-separately, head of
          household and qualifying surviving spouse all land), (a)(2)
          $100,000/$150,000 for married specified individuals filing a JOINT
          annual return, (a)(3) $200,000/$300,000 for a specified individual who
          is "a qualified individual under section 911(d)(1)", (a)(4)
          $400,000/$600,000 for such an individual and spouse filing jointly.
          Also (a)(5) assets with no positive value are still reportable, (a)(6)
          how assets excepted under 1.6038D-7(a) still COUNT toward the
          threshold, (a)(8) reporting is required regardless of tax result, and
          (b) what having an "interest" in an asset means. Sections 1.6038D-1
          through -8 in the same part carry the definitions, valuation rules and
          exceptions.
        cadence: amended rarely (check the eCFR "as of" date shown on the page)
      - url: https://www.irs.gov/pub/irs-prior/i8938--2021.pdf
        answers: >-
          Instructions for Form 8938 (Rev. November 2021) — the practitioner-side
          restatement of the same thresholds ("Types of Reporting Thresholds",
          which spells out the married-filing-separately and
          specified-domestic-entity buckets the regulation leaves implicit), the
          presence-abroad test, who is a specified individual or specified
          domestic entity, what IS and IS NOT a specified foreign financial asset,
          valuation and joint-interest rules, the Part IV excepted-asset forms
          (3520, 3520-A, 5471, 8621, 8865), line-by-line guidance for lines 1-36,
          and the "Penalties" section with the $10,000 / $10,000-per-30-days /
          $50,000-cap ladder, the 40% IRC 6662(j) understatement rate for an
          undisclosed foreign financial asset, the 75% fraud rate, the
          reasonable-cause exception and the extended statute of limitations. Revision-dated, not annual — read the printed
          "(Rev. <month-year>)" marker on page 1.
        cadence: on revision only (currently Rev. 11-2021; irs-prior/i8938--2021.pdf is the archive copy)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title31-section5321&num=0&edition=prelim
        answers: >-
          31 U.S.C. 5321(a)(5) — the FBAR civil penalty: (B)(i) the non-willful
          maximum "shall not exceed $10,000", (B)(ii) the reasonable-cause
          exception (which ALSO requires the balance to have been "properly
          reported"), (C) the willful maximum, raised to the greater of $100,000
          or 50 percent of the amount under (D), and (D)(ii) that the 50 percent
          is measured against "the balance in the account at the time of the
          violation". Two things a reader must pair with it: 31 CFR 1010.821
          Table 1 inflation-adjusts both maxima by ASSESSMENT DATE (for penalties
          assessed on or after January 17, 2025: $16,536 non-willful, $165,353
          willful), and Bittner v. United States, 598 U.S. 85 (2023) held the
          NON-WILLFUL penalty accrues per REPORT, not per account — IRS
          Publication 5569 (3-2022) predates Bittner and does not resolve the
          unit.
        cadence: on amendment (statute); the 1010.821 penalty table is re-adjusted every January

    # Phase J item JF2.1 (2026-09-27): eight topics that close wrong-law pointers
    # and clean misses reproduced 2026-09-23 ("net income attributable" ->
    # self_employment, "Treas. Reg. 1.408A-5" and "Publication 15-T" -> FBAR,
    # "supplemental wage withholding bonus" -> deadlines, "paystub W-2 box 1 box 3
    # box 5" -> ira_basis_and_roth_conversions, "claim of right" ->
    # foreign_tax_credit; "recharacterization", "Form 5329" and the non-itemizer
    # charitable deduction were clean misses). Every URL was fetched 2026-09-27
    # (the eCFR sections through its renderer API — the human pages refuse
    # scripted clients); quoted text is verbatim. Each answers text keeps to its
    # own vocabulary: no "conversion", "basis" or "8606" here (those win
    # ira_basis_and_roth_conversions its queries), and no "estimated tax"
    # payment-schedule words in underpayment_penalty (estimated_tax keeps those).
    ira_recharacterization_and_excess_contributions:
      - url: https://www.ecfr.gov/current/title-26/section-1.408A-5
        answers: >-
          Treas. Reg. 1.408A-5, Recharacterized contributions, Q-1: "Can an IRA
          owner recharacterize certain contributions (i.e., treat a contribution
          made to one type of IRA as made to a different type of IRA) for a
          taxable year?" — yes, by a trustee-to-trustee transfer of the
          contribution with its net income.
        cadence: standing regulation (check for amendment)
      - url: https://www.ecfr.gov/current/title-26/section-1.408-11
        answers: >-
          Treas. Reg. 1.408-11, Net income calculation for returned or
          recharacterized IRA contributions: the net income attributable to a
          contribution is found "by allocating to the contribution a pro rata
          portion of the earnings on the assets in the IRA during the period the
          IRA held the contribution" — the contribution times (adjusted closing
          balance minus adjusted opening balance) over the adjusted opening
          balance, which is negative after a loss.
        cadence: standing regulation (check for amendment)
      - url: https://www.ecfr.gov/current/title-26/section-301.9100-2
        answers: >-
          Treas. Reg. 301.9100-2(b), the automatic 6-month extension: "An
          automatic extension of 6 months from the due date of a return
          excluding extensions is granted to make regulatory or statutory
          elections ... provided the taxpayer timely filed its return" — the
          window to remove or recharacterize a contribution to an IRA after a
          timely return.
        cadence: standing regulation (check for amendment)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section408A&num=0&edition=prelim
        answers: >-
          IRC 408A(d)(6)-(7), Taxpayer may make adjustments before due date: a
          contribution moved "in a trustee-to-trustee transfer" in time "shall
          be treated as having been made to the transferee plan
          (and not the transferor plan)", but only if "accompanied by any net
          income allocable to such contribution"; (d)(6)(B)(iii) excludes a
          qualified rollover contribution.
        cadence: standing statute (check for amendment)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section408&num=0&edition=prelim
        answers: >-
          IRC 408(d)(4), Contributions returned before due date of return: an
          excess contribution to an IRA withdrawn "on or before the day prescribed by
          law (including extensions of time) for filing such individual's
          return", with no deduction allowed for it and "accompanied by the
          amount of net income attributable to such contribution", is not a
          distribution; that net income "shall be deemed to have been earned
          and receivable in the taxable year in which such contribution is
          made".
        cadence: standing statute (check for amendment)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section4973&num=0&edition=prelim
        answers: >-
          IRC 4973, the excess-contribution excise: "a tax in an amount equal
          to 6 percent of the amount of the excess contributions to such
          individual's accounts or annuities (determined as of the close of the
          taxable year)", which "shall not exceed 6 percent of the value of the
          account or annuity"; 4973(f) defines excess contributions to a Roth
          IRA. Reported on Form 5329.
        cadence: standing statute (check for amendment)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section72&num=0&edition=prelim
        answers: >-
          IRC 72(t)(2)(A)(ix) (SECURE 2.0 section 333): no 10% additional tax on
          a distribution "attributable to withdrawal of net income attributable
          to a contribution which is distributed pursuant to section 408(d)(4)".
        cadence: standing statute (check for amendment)
      - url: https://www.irs.gov/publications/p590a
        answers: >-
          Pub 590-A, Recharacterizations: "If the transfer is made by the due
          date (including extensions) for your tax return for the tax year for
          which the contribution was made, you can elect to treat the
          contribution as having been originally made to the second IRA
          instead of to the first IRA." An excess contribution can still be
          returned within 6 months after a timely return — the section
          301.9100-2 relief.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/instructions/i5329
        answers: >-
          Instructions for Form 5329: Part III, Additional Tax on Excess
          Contributions to Traditional IRAs, and Part IV, Additional Tax on
          Excess Contributions to Roth IRAs — "If you contributed more for 2025
          than is allowable ... you may owe this tax", and how a timely
          withdrawal avoids it.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/instructions/i1099r
        answers: >-
          Instructions for Forms 1099-R and 5498, Form 5498 box 4,
          Recharacterized Contributions: "Enter any amounts recharacterized plus
          earnings from one type of IRA to another."
        cadence: annual (per tax year)

    form_1099r_distribution_codes:
      - url: https://www.irs.gov/instructions/i1099r
        answers: >-
          Instructions for Form 1099-R, Box 7a, Distribution Code(s) and Table 1,
          Guide to Distribution Codes: "Read the codes carefully and enter them
          accurately because the IRS uses the codes to help determine whether
          the recipient has properly reported the distribution." Form 1099-R box
          7 code N, a contribution recharacterized in the year it was made for;
          code 8,
          excess contributions plus earnings taxable in the year; codes 1 and 2,
          early distribution with or without a known exception.
        cadence: annual (per tax year)
      - url: https://www.irs.gov/pub/irs-pdf/f1099r.pdf
        answers: >-
          Form 1099-R recipient instructions: "Box 7a. The following codes
          identify the distribution you received"; box 2b: "If the first box is
          checked, the payer was unable to determine the taxable amount and box
          2a should be blank, except for a traditional IRA or traditional SIMPLE
          IRA. It's your responsibility to determine the taxable amount."
        cadence: annual (per tax year)

    payroll_withholding:
      - url: https://www.irs.gov/publications/p15
        answers: >-
          Pub 15 (Circular E), Employer's Tax Guide, section 7, Supplemental
          Wages — supplemental wage withholding on a bonus: "Supplemental wages
          are wage payments to an employee that aren't regular wages. They
          include, but aren't limited to, bonuses, commissions, overtime pay";
          "The withholding rate on supplemental wages remains 22% (37% if
          supplemental wages paid to an employee during the calendar year
          exceed $1 million)".
        cadence: annual (per calendar year)
      - url: https://www.irs.gov/publications/p15t
        answers: >-
          Publication 15-T, Federal Income Tax Withholding Methods: paycheck
          withholding from a Form W-4 — the W-4 percentage method tables for
          automated payroll systems and the wage bracket method.
        cadence: annual (per calendar year)
      - url: https://www.irs.gov/pub/irs-pdf/fw4.pdf
        answers: >-
          Form W-4, Employee's Withholding Certificate: Step 4(a) other
          income, Step 4(b) deductions ("Use the Deductions Worksheet on page 4
          to determine the amount of deductions you may claim, which will
          reduce your withholding"), Step 4(c) extra withholding.
        cadence: annual (per calendar year)
      - url: https://www.ecfr.gov/current/title-26/section-31.3402(g)-1
        answers: >-
          Treas. Reg. 31.3402(g)-1, Supplemental wage payments: the optional
          flat rate and the mandatory flat rate withholding on supplemental
          wages over $1,000,000, "without regard to any entries on Form W-4".
        cadence: standing regulation (check for amendment)

    wage_reporting_w2:
      - url: https://www.irs.gov/instructions/iw2w3
        answers: >-
          General Instructions for Forms W-2 and W-3 — reconciling a paystub to
          W-2 box 1, box 3, box 5. Box 1 (taxable wages): "do not include
          elective deferrals (such as employee contributions to a section 401(k)
          or 403(b) plan)"; "Box 3—Social security wages. Show the total wages
          paid (before payroll deductions) subject to employee social security
          tax"; box 5 (Medicare wages): "the same as those subject to social
          security tax (boxes 3 and 7) except that there is no wage base limit
          for Medicare tax."
        cadence: annual (per calendar year)

    excess_deferrals_402g:
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section402&num=0&edition=prelim
        answers: >-
          IRC 402(g), Limitation on exclusion for elective deferrals: "the
          elective deferrals of any individual for any taxable year shall be
          included in such individual's gross income to the extent the amount
          of such deferrals for the taxable year exceeds the applicable dollar
          amount" — one limit across every 401(k)/403(b) plan and employer;
          402(g)(2), Distribution of excess deferrals.
        cadence: standing statute (the dollar amount is indexed; check the COLA notice)
      - url: https://www.ecfr.gov/current/title-26/section-1.402(g)-1
        answers: >-
          Treas. Reg. 1.402(g)-1(e), correcting excess deferrals: "Not later
          than the first April 15 (or such earlier date specified in the plan)
          following the close of the individual's taxable year, the individual
          may notify each plan under which elective deferrals were made of the
          amount of the excess deferrals".
        cadence: standing regulation (check for amendment)
      - url: https://www.irs.gov/publications/p525
        answers: >-
          Pub 525, Excess deferrals: "The plan must then pay you the amount of
          the excess, along with any income earned on that amount, by April 15
          of the following year. You must include the excess deferral in your
          income for the year of the deferral." Excess not distributed: "you're
          taxed twice on the excess deferral left in the plan".
        cadence: annual (per tax year)

    charitable_nonitemizer:
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section170&num=0&edition=prelim
        answers: >-
          IRC 170(p), the non-itemizer charitable deduction, "Special rule for
          taxpayers who do not elect to itemize deductions": cash gifts to a
          170(b)(1)(A) organization, capped at $1,000 ($2,000 on a joint
          return), and not to a 509(a)(3) supporting organization or a donor
          advised fund; 170(b)(1)(I), the 0.5-percent floor: a gift is "allowed
          only to the extent that the aggregate of such contributions exceeds
          0.5 percent of the taxpayer's contribution base" (Pub. L. 119-21).
        cadence: standing statute (check for amendment)
      - url: https://www.irs.gov/pub/irs-pdf/fw4.pdf
        answers: >-
          Form W-4 (2026), Step 4(b) Deductions Worksheet: "Cash gifts to
          charities. If you take the standard deduction, enter cash
          contributions up to $1,000 ($2,000 if married filing jointly)"; gifts
          to charities for an itemizer: "Enter contributions in excess of 0.5%
          (0.005) of your total income".
        cadence: annual (per calendar year)
      - url: https://www.irs.gov/charities-non-profits/tax-exempt-organization-search-deductibility-status-codes
        answers: >-
          Tax Exempt Organization Search (TEOS) deductibility status codes: PC,
          a public charity; POF, a private operating foundation; PF, a private
          foundation — whether an organization can receive a deductible gift,
          and which AGI percentage that gift falls under.
        cadence: standing page (re-check each filing season)

    wage_repayment_claim_of_right:
      - url: https://www.irs.gov/publications/p525
        answers: >-
          Pub 525, Repayments: "If you had to repay an amount that you included
          in your income in an earlier year, you may be able to deduct the
          amount repaid from your income for the year in which you repaid it.
          Or, if the amount you repaid is more than $3,000, you may be able to
          take a credit against your tax"; over $3,000 under a claim of right,
          "Figure your tax under both methods and compare the results."
        cadence: annual (per tax year)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section1341&num=0&edition=prelim
        answers: >-
          IRC 1341, Computation of tax where taxpayer restores substantial
          amount held under claim of right: an item included in a prior year
          "because it appeared that the taxpayer had an unrestricted right to
          such item", a deduction for the repayment exceeding $3,000.
        cadence: standing statute (check for amendment)
      - url: https://www.irs.gov/publications/p15
        answers: >-
          Pub 15 section 13, Wage Repayments: "If an employee repays you for
          wages received in error, don't offset the repayments against current
          year wages unless the repayments are for amounts received in error in
          the current year"; for a prior-year wage repayment the employer
          recovers social security and Medicare taxes only — "You can't make an
          adjustment for income tax withholding because the wages were income
          to the employee for the prior year."
        cadence: annual (per calendar year)

    underpayment_penalty:
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section6654&num=0&edition=prelim
        answers: >-
          IRC 6654, Failure by individual to pay estimated income tax — the
          underpayment penalty: the preceding-year test's 100 percent becomes
          110 percent when that year's adjusted gross income "exceeds
          $150,000"; 6654(e)(1): "No addition to tax shall be imposed
          under subsection (a) for any taxable year if the tax shown on the
          return for such taxable year ... reduced by the credit allowable
          under section 31, is less than $1,000."
        cadence: standing statute (check for amendment)
      - url: https://www.irs.gov/instructions/i2210
        answers: >-
          Instructions for Form 2210, Who Must Pay the Underpayment Penalty:
          "In general, you may owe the penalty for 2025 if the total of your
          withholding and timely estimated tax payments didn't equal at least
          the smaller of: 90% of your 2025 tax, or 100% of your 2024 tax." Form
          2210's purpose: "The IRS will generally figure your penalty for you
          and you should not file Form 2210."
        cadence: annual (per tax year)
      - url: https://www.irs.gov/pub/irs-pdf/f2210.pdf
        answers: >-
          Form 2210, Underpayment of Estimated Tax by Individuals, Estates, and
          Trusts: the penalty computation, the short and regular methods, and
          the annualized income installment method (Schedule AI).
        cadence: annual (per tax year)
      - url: https://www.irs.gov/payments/quarterly-interest-rates
        answers: >-
          IRS Quarterly interest rates: the IRC 6621 underpayment rate for each
          calendar quarter ("Underpayment (corporate and non-corporate)") with
          the Internal Revenue Bulletin that announced it — the rates the
          Form 2210 penalty worksheet applies. For estimated tax, IRC
          6621(b)(2)(B) keeps the 3rd month's rate "during the first 15 days of
          the 4th month following such taxable year".
        cadence: quarterly

    # Phase J item JF6a: the registry behind the top-level `form_lines` pack
    # block. Before it existed, get_sources("form line numbers"), ("which line")
    # and ("line number") all routed to ira_basis_and_roth_conversions, whose
    # answers text walks Form 8606 line by line — one form's lines offered for a
    # question about every form's. The durable rule (a line number is read off
    # the year's own printed face and rendered through form_line, never typed)
    # lives in knowledge/pitfalls.yaml (P-015). The answers text avoids the tokens
    # "pdf" and "revision" on purpose: said twice here they out-scored the
    # one-mention ties that "f8833.pdf", "p519.pdf" and "protocol revision"
    # resolve to (nonresident_and_treaties among them), so those moved here.
    form_line_numbers:
      - url: https://www.irs.gov/prior-year-forms-and-instructions
        answers: >-
          IRS forms and instructions archive: the final version of each form
          for each tax year, which is the only authority for which form line
          number an amount goes on. Line numbers are renumbered and re-lettered
          from one year's form to the next (one line splits into lettered
          sub-lines, a Part moves, a whole form is redesigned), so a line number
          is a fact of one tax year, read off that year's printed face (archived
          finals sit under irs.gov/pub/irs-prior/, one file per form per year).
          Each knowledge pack's form_lines block records every line it uses
          with the face it was read from.
        cadence: as form revisions are published (each year's finals land December to February)
      - url: https://www.irs.gov/draft-tax-forms
        answers: >-
          IRS draft tax forms (under irs.gov/pub/irs-dft/): early-release
          DRAFTS of the coming year's forms, each stamped "Created <date>" in its
          footer and prefaced by a coversheet reading "Caution: DRAFT—NOT FOR
          FILING". A line number read off a draft is projection-grade until the
          final form posts, and is re-read on the final face before it backs a
          return.
        cadence: drafts post from spring through autumn; a later draft replaces an earlier one

    # ── TY2026 law and forms (Phase J JT0c, read 2026-09-27) ──
    # Registry backing for the 2026 changes the JT1/JT2 blocks build on. A DRAFT
    # (irs.gov/pub/irs-dft/) is projection-grade until its final posts; each draft
    # is named with its footer "Created" stamp.
    federal_public_benefit:
      - url: https://www.irs.gov/pub/irs-dft/f1040s3a--dft.pdf
        answers: >-
          DRAFT Schedule 3-A (Form 1040) 2026, Federal Public Benefit
          (Created 6/24/26), filed with four refundable credits (the EIC, the
          ACTC and two others the schedule names). Line 6, the refunded portion
          of those credits: "This is your federal public benefit". Line 8: "Are you or your spouse a U.S. citizen, U.S.
          national, or qualified alien? See instructions." On No: "Enter the
          amount from line 6 here and on Form 1040, 1040-SR, or 1040-NR, line
          32b." The Schedule 3-A instructions are not posted (404 on
          2026-09-27).
        cadence: draft; the final schedule and its instructions post with the 2026 return forms
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1641&num=0&edition=prelim
        answers: >-
          8 U.S.C. 1641(b), the qualified alien list: "an alien who, at the
          time the alien applies for, receives, or attempts to receive a Federal
          public benefit, is-" (1) "lawfully admitted for permanent residence",
          (2) "granted asylum", (3) "a refugee who is admitted to the United
          States", (4) "paroled into the United States" for "a period of at
          least 1 year", (5) a deportation withheld, (6) "conditional entry",
          (7) "a Cuban and Haitian entrant", (8) a Compact of Free Association
          resident. 1641(c) adds certain battered aliens and, in (c)(4), "an
          alien who has been granted nonimmigrant status under section
          101(a)(15)(T)" — the only nonimmigrant status the section names.
        cadence: statute (changes only by act of Congress)
      - url: https://www.federalregister.gov/documents/2026/08/20/2026-16985/application-of-the-personal-responsibility-and-work-opportunity-reconciliation-act-of-1996-to-the
        answers: >-
          REG-119882-25, the PROPOSED rule behind Schedule 3-A that applies
          PRWORA to refundable credits (91 FR 53812, Aug. 20, 2026): the refunded portion of the adoption credit, the
          CTC, the AOTC and the EIC "is a Federal public benefit"; it is the
          sum of those credits over "the tax imposed on the taxpayer by
          subtitle A of the Code (reduced by credits allowable under subparts
          A, B, D, and G"; status is judged "on the date the taxpayer files the
          taxpayer's return"; on a joint return one spouse who qualifies is
          enough. It is proposed "to apply for taxable years ending on or after
          the date these regulations are published as final regulations".
        cadence: proposed rule; watch the Federal Register for the final rule (TY2026 is reached only if it publishes by 2026-12-31)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1611&num=0&edition=prelim
        answers: >-
          8 U.S.C. 1611(a): an alien who is not a qualified alien under 1641
          "is not eligible for any Federal public benefit".
        cadence: statute (changes only by act of Congress)
    itemized_limitation_2026:
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section68&num=0&edition=prelim
        answers: >-
          IRC 68 as rewritten by P.L. 119-21 section 70111, which applies "to
          taxable years beginning after December 31, 2025": the deductions
          otherwise allowable "shall be reduced by 2/37 of the lesser of" those
          deductions or so much of the taxable income (figured without the
          reduction and increased by those deductions) "as exceeds the dollar
          amount at which the 37 percent rate bracket under section 1 begins".
          It "shall be applied after the application of any other limitation".
        cadence: statute (changes only by act of Congress)
      - url: https://www.irs.gov/pub/irs-dft/f1040sa--dft.pdf
        answers: >-
          DRAFT Schedule A (Form 1040) 2026 (Created 5/12/26), line 18: "Is the
          amount on Form 1040 or 1040-SR, line 11b, minus the amounts on lines
          13a and 13b of that form, more than $384,350?" Yes: "Your deductions
          may be limited." $384,350 is where the 37% rate starts in 2026 for
          married filing separately, the lowest of the statuses.
        cadence: draft; the final schedule posts with the 2026 return forms
    # Planned as vehicle_loan_interest_statement: those key tokens (loan, interest) took
    # "car loan interest", "student loan interest" and "interest income" from their topics.
    form_1098vli:
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section6050AA&num=0&edition=prelim
        answers: >-
          IRC 6050AA: a lender who "receives from any individual interest
          aggregating $600 or more for any calendar year on a specified
          passenger vehicle loan, shall make the return", showing the "year,
          make, model, and vehicle identification number" (VIN), and furnishes
          the borrower a written statement.
        cadence: statute (changes only by act of Congress)
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section163&num=0&edition=prelim
        answers: >-
          IRC 163(h)(4)(B)(iii): the interest counts only if the taxpayer
          includes the VIN "on the return of tax for the taxable year".
        cadence: statute (changes only by act of Congress)
      - url: https://www.irs.gov/pub/irs-dft/i1098vli--dft.pdf
        answers: >-
          DRAFT Form 1098-VLI (December 2026), Vehicle Loan Interest Statement
          (Created 8/20/26), and its instructions: the lender reports interest
          of $600 or more received on each specified passenger loan (SPVL):
          "The $600 threshold applies separately to each SPVL." The draft
          Schedule 1-A 2026 Part IV takes the interest from box 1 of that
          statement.
        cadence: draft; the final statement posts for calendar year 2026 reporting
      - url: https://www.irs.gov/pub/irs-pdf/f1098vli.pdf
        answers: >-
          The FINAL statement (Rev. December 2026), Copy B: box 1 vehicle loan
          interest received by lender, 2a-2d year / make / model / VIN, 3a/3b
          origination and acquisition dates, 4 outstanding principal, 5
          overpaid interest paid back ("Do not deduct this amount"), 6 original
          use began with the payer of record, 7 final assembly within the United
          States; extract_document reads each box.
        cadence: final revision (reissued when the IRS revises the form)
    # Planned as w2_2026_tips_overtime: those key tokens took "tips", "overtime" and
    # "tips deduction" from obbba_schedule_1a_deductions, where the deduction law is.
    w2_2026_codes_tp_tt:
      - url: https://www.irs.gov/pub/irs-prior/iw2w3--2026.pdf
        answers: >-
          General Instructions for Forms W-2 and W-3 (2026), FINAL: "New box
          12, code TP, will be used to report the total amount of cash tips
          reported to the employer." "New box 12, code TT, will be used to
          report the total amount of qualified overtime compensation." "Box 14b
          was created to report the Treasury Tipped Occupation Code(s)."
        cadence: annual (the next year's W-2 and instructions post each winter)
      - url: https://www.irs.gov/pub/irs-prior/fw2--2026.pdf
        answers: >-
          The final 2026 wage statement (Created 1/7/26) prints "14b Treasury
          Tipped Occupation Code(s)".
        cadence: annual (the next year's W-2 and instructions post each winter)
    trump_accounts:
      - url: https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title26-section530A&num=0&edition=prelim
        answers: >-
          IRC 530A (P.L. 119-21): "a Trump account shall be treated for
          purposes of this title in the same manner as an individual retirement
          account under section 408(a)"; "No deduction shall be allowed under
          section 219 for any contribution which is made before the first day
          of the calendar year in which the account beneficiary attains age
          18"; the aggregate contributions for a year "shall not exceed
          $5,000", not counting the exempt contributions (among them "any
          contribution provided under section 6434", the pilot program).
        cadence: statute (changes only by act of Congress)
      - url: https://www.irs.gov/pub/irs-pdf/i4547.pdf
        answers: >-
          Instructions for Form 4547 (Rev. December 2025), Trump Account
          Election(s): "Use Form 4547 to make the election to establish an
          initial Trump account for the exclusive benefit of a child who is
          eligible for a Trump account", and for "a $1,000 pilot program
          contribution" for a child who "Is born after December 31, 2024, and
          before January 1, 2029" and "Is a U.S. citizen". "Form 4547 can be
          filed at any time, including at the same time as the income tax
          return is filed."
        cadence: as revised (the form carries a Rev. date, not a tax year)
    tax_tables:
      - url: https://www.irs.gov/pub/irs-dft/p1040--dft.pdf
        answers: >-
          DRAFT Publication 1040 (2026)
          (posted 09/16/2026), the Tax Table and EIC Table booklet drawn from
          the Instructions for Form 1040 (and 1040-SR). Its worked example: "Their taxable income on Form 1040, line 15, is
          $25,300. First, they find the $25,300–25,350 taxable income line." The
          married-filing-jointly amount there is $2,543. The final 2025 edition
          is irs.gov/pub/irs-prior/p1040--2025.pdf.
        cadence: annual (the draft posts in autumn, the final in January)

  change_channels:
    - url: https://www.irs.gov/newsroom
      answers: >-
        IRS Newsroom: new guidance, inflation-adjustment announcements,
        deadline changes, disaster relief postponements — the first official
        signal that a shipped knowledge pack may be stale.
      cadence: multiple updates per week (check for any year newer than the
        newest shipped pack)
    - url: https://www.irs.gov/pub/irs-prior/
      answers: >-
        IRS prior-year revision archive: the exact blank PDF for any form
        and year (e.g. f1040nr--2022.pdf) — the canonical source_url base
        for prior-year form packs and checksum verification.
      cadence: as form revisions are published
    - url: https://www.irs.gov/irb
      answers: >-
        Internal Revenue Bulletin: the official home of Revenue Procedures and
        Revenue Rulings, including the annual inflation-adjustment Rev. Proc.
        that sets each year's tax tables, brackets, and standard deduction.
      cadence: weekly (the inflation Rev. Proc. lands each autumn)
    - url: https://www.congress.gov/public-laws/119th-congress
      answers: >-
        Congress.gov public laws: the enacted text of new tax legislation
        (e.g. the One Big Beautiful Bill Act) — the authority a pack records in
        effective_law_changes BEFORE final IRS guidance/forms exist.
      cadence: as bills are enacted (NARA assigns the public-law number)
    - url: https://www.federalregister.gov/agencies/internal-revenue-service
      answers: >-
        Federal Register, IRS agency page: Treasury/IRS proposed and final
        regulations implementing enacted law — the signal that figures for a
        new provision are moving from irs_guidance_pending toward final form.
      cadence: as rules are published (multiple per week during active rulemaking)
    # draft_forms (Phase J JT0c): the early-release drafts, the first sign a
    # provisional pack's forms moved. scripts/check_finals.py watches for the finals.
    - url: https://www.irs.gov/draft-tax-forms
      answers: >-
        IRS draft tax forms: the early-release drafts of the coming year's
        forms, instructions and publications. The coversheet: "Early release
        drafts are posted at IRS.gov/DraftForms and remain there after the
        final release is posted at IRS.gov/LatestForms", and "there are never
        any changes to the last posted draft of the form and the final
        revision of the form". A new draft of a form a provisional pack uses
        is a signal to re-read it; its final is what a filed return rests on.
      cadence: drafts post from spring through autumn; finals December to February

